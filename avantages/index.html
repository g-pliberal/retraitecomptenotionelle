<style>
  /* Écran d'attente. Il ne s'affiche qu'au-delà d'un tiers de seconde : sur une
     connexion rapide le simulateur est prêt avant, et un écran qui n'aurait
     clignoté que le temps d'être aperçu vaut moins que rien. Le retard est en
     CSS et non en JavaScript, parce que l'attente qu'il couvre se produit
     justement avant que le moindre script ne soit chargé. */
  #amorce { max-width: 34rem; margin: 0 auto; padding: 5rem 1.5rem; text-align: center;
            animation: paraitre 0.25s ease-out 0.35s both; }
  #amorce h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 0.75rem; }
  #amorce p { color: var(--texte-doux); font-size: 0.98rem; }
  #amorce .jauge { height: 6px; width: min(24rem, 80%); margin: 2rem auto 0;
                   background: var(--fond-appui); border-radius: 3px; overflow: hidden; }
  #amorce .jauge > span { display: block; height: 100%; width: 30%;
                          background: var(--accent);
                          animation: glisse 1.4s ease-in-out infinite; }
  @keyframes paraitre { from { opacity: 0; } to { opacity: 1; } }
  /* Lue par les synthèses vocales, jamais affichée : le contenu de <main> est
     remplacé en bloc à chaque calcul, ce qu'un lecteur d'écran ne signale pas
     de lui-même. */
  .hors-ecran { position: absolute; width: 1px; height: 1px; overflow: hidden;
                clip-path: inset(50%); white-space: nowrap; }
  .replique { text-align: left; border-left: 3px solid var(--accent);
              background: var(--fond-appui); padding: 0.9rem 1.1rem; margin-top: 1.5rem;
              font-size: 0.92rem; }
  /* La feuille de style principale coupe déjà les animations quand le système
     demande d'en réduire le mouvement ; la jauge, elle, doit encore dire que
     quelque chose travaille. Immobile et pleine, elle le dit. */
  @media (prefers-reduced-motion: reduce) {
    #amorce .jauge > span { width: 100%; }
  }
</style>
</head>
<body>

<p id="annonce" class="hors-ecran" role="status" aria-live="polite"></p>

<div id="amorce">
  <h1>Retraite à comptes notionnels</h1>
  <p>Le site se prépare. Le modèle et les données de référence s'exécutent dans
  votre navigateur : rien n'est envoyé à un serveur, et il n'y a rien à
  installer.</p>
  <div class="jauge"><span></span></div>
  <noscript>
    <div class="replique">Ce simulateur a besoin de JavaScript : le calcul se fait
    dans votre navigateur, il n'y a pas de serveur pour le faire à sa place.</div>
  </noscript>
</div>

<!-- Le routeur du site, sorti de cette page dans son module pour que les
