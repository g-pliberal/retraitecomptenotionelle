# La table des références : à quoi chaque élément du calcul se confronte
# ======================================================================
# Pour chaque élément du calcul et chaque famille de régimes de l'inventaire,
# la source qui confirme ou contredit le dépôt, ou l'absence, déclarée avec sa
# raison. Née le 22 novembre 2026, à la demande du propriétaire : « avoir le
# meilleur de chaque simulateur », par une confrontation permanente (action
# 137). C'est la première étape : la table ; les suivantes comparent les
# barèmes datés, rejouent les simulateurs des caisses, et trient les écarts.
#
# LE TEXTE TRANCHE. Aucune référence ne fait autorité sur la loi : le texte
# tel que la caisse l'applique l'emporte sur l'exemple officiel, l'exemple sur
# les autres modèles, et tous sur le nôtre (docs/architecture.md, § 3.3). Le
# texte d'une case est celui des fiches qu'elle range ; la table ne le répète
# pas.
#
# CHAMPS D'UN ÉLÉMENT
#   id, intitule .. l'élément
#   domaines ...... les domaines de fiche qu'il range (le champ `domaine`)
#   fiches ........ les fiches qu'il range en plus, ou à la place de leur
#                   domaine : toute fiche de la carte est dans un seul élément
#   attendus ...... les grandeurs que les exemples officiels et les grilles
#                   comparent, rangées ici ; une valeur force la famille de la
#                   case (une grandeur de points va aux complémentaires), sinon
#                   la famille est celle de la pension de base de
#                   l'affiliation du cas
#   cellules ...... une case par famille : `references`, ou `absence`, ou
#                   `sans_objet` (aucune fiche ne la touche), et `a_chercher`,
#                   la référence à trouver, quand on la connaît
#
# SORTES DE RÉFÉRENCE
#   exemple_officiel .... un exemple chiffré d'une caisse ou de
#                         service-public, rejoué par tests/test_oracle.py ;
#                         compté au dépôt, sans `id`
#   grille_independante . une grille posée par une session sans le code
#                         (data/reference/preuves/) ; comptée au dépôt
#   simulateur_caisse ... un simulateur anonyme d'une caisse : sa ligne au
#                         vivier, data/sources_a_explorer.yaml
#   page_officielle ..... une page de règle ou de barème d'une caisse, au vivier
#   modele .............. un autre modèle, au registre data/reference/referents.yaml,
#                         qui confronte le droit réel
#
# Une case qui n'a que des modèles ne tient que par d'autres lectures du
# texte : c'est mieux que rien, ce n'est pas une source officielle.
#
# TENUE. tests/test_table_des_references.py exige que chaque fiche ait son
# élément, chaque élément ses huit cases, chaque référence sa ligne, et que la
# table cite les exemples, les grilles et les modèles que le dépôt a déjà pour
# la case, ni plus ni moins. Un exemple officiel qui entre dans une case vide
# la fait donc échouer : on remplace son `absence` par la référence. Lire la
# table : `python scripts/table_des_references.py` ; ses trous : `--trous`.

