# Contrat C.6 — la liquidation et ses composantes (docs/architecture.md,
# annexe C, et § 7.3). `liquider(demande, état, contexte)` est une fonction
# pure : ce contrat dit ce qu'elle rend. La phase 5 l'écrit.
#
# La phase 5 y ajoute, par la règle additive, ce que la liquidation du
# scénario 1 rendait déjà : les mesures qu'elle fait par des liquidations
# d'essai — ce qu'apportent les trimestres des enfants, l'AVPF et les points
# gratuits, chacun sous une neutralisation de plus (`neutralisations`) —, et,
# pour chaque composante, le régime qui la sert, la formule que la page en
# écrit, et si elle est servie hors de la répartition.
# src/retraite_notionnelle/droit/liquidation.py, et son jumeau
# moteur/js/droit/liquidation.js.

contrat: liquidation
schema_version: 1
annexe: C.6

objets:

  liquidation:
    champs:
      schema_version: {porte: "la version du contrat", type: entier, obligatoire: true}
      demande: {porte: "personne, régimes, date d'effet, événement qui l'appelle et sa date, motif, nature ; pour une révision, la liquidation reprise ; pour une réversion, le défunt", type: objet, objet: demande, obligatoire: true}
      contexte: {porte: "univers, date d'observation, hypothèse", type: libre, defaut: {univers: droit_reel}}
      composantes: {porte: "base, majorations, minima, composantes temporaires, capital", type: liste, de: {objet: composante}, obligatoire: true}
      payeurs: {porte: "par composante et par échéance", type: libre, defaut: regime}
      contributive: {porte: "par composante et par échéance", type: libre, defaut: true}
      lignes_consommees: {porte: "les lignes du relevé qu'elle a utilisées", type: liste, de: identifiant, obligatoire: true}
      decisions: {porte: "ce qu'elle fige pour d'autres liquidations", type: liste, de: libre, defaut: []}
      origine: {porte: "calculée, ou observée", type: valeur, valeurs: origines_de_ligne, defaut: calculee}
      mesures: {porte: "ce que la liquidation mesure par des liquidations d'essai, chacune sous une neutralisation de plus", type: liste, de: {objet: mesure}, defaut: [], additif: "la phase 5 : la cascade des avantages que le scénario 1 mesurait déjà, dite comme des liquidations d'essai (§ 6.4)"}

  mesure:
    champs:
      code: {porte: "l'avantage mesuré, sous le code que la cascade lui donne", type: identifiant, obligatoire: true}
      neutralisation: {porte: "ce que la liquidation d'essai neutralise de plus que la précédente", type: valeur, valeurs: neutralisations, obligatoire: true}
      montant: {porte: "ce qu'il apporte, en euros annuels de la date d'effet", type: nombre, obligatoire: true}

  demande:
    ouvert: true
    champs:
      personne: {porte: "la personne", type: identifiant, obligatoire: true}
      regimes: {porte: "les régimes", type: liste, de: identifiant, obligatoire: true}
      date_effet: {porte: "la date d'effet", type: date, obligatoire: true}
      evenement: {porte: "l'événement qui l'appelle, et sa date", type: libre, obligatoire: true}
      motif: {porte: "vieillesse, invalidité, inaptitude, carrière longue, réversion…", type: valeur, valeurs: motifs, defaut: vieillesse}
      nature: {porte: "provisoire, définitive, seconde, fictive", type: valeur, valeurs: natures, defaut: definitive}
      reprend: {porte: "pour une révision, la liquidation reprise et la date d'où elle vaut", type: libre, defaut: null}
      defunt: {porte: "pour une réversion, le défunt", type: identifiant, defaut: null}

  composante:
    ouvert: true
    champs:
      id: {porte: "identifiant stable", type: identifiant, obligatoire: true}
      fiche: {porte: "sa fiche", type: identifiant, obligatoire: true}
      version: {porte: "sa version", type: identifiant, obligatoire: true}
      beneficiaire: {porte: "son bénéficiaire", type: identifiant, obligatoire: true}
      montant: {porte: "son montant et sa monnaie", type: libre, obligatoire: true}
      debut: {porte: "son début", type: date, obligatoire: true}
      fin: {porte: "sa fin", type: date, defaut: null}
      servie: {porte: "servie, ou seulement calculée", type: booleen, defaut: true}
      nature: {porte: "ferme, ou en attente, et de quoi", type: valeur, valeurs: natures_de_ligne, defaut: ferme}
      regime: {porte: "le régime qui la sert, quand elle en a un", type: identifiant, defaut: null, additif: "la phase 5 : les composantes du scénario 1 sont d'abord ses pensions de régime"}
      detail: {porte: "la formule, telle que la page l'écrit", type: texte, defaut: null, additif: "la phase 5 : la page refait chaque montant devant le lecteur"}
      hors_repartition: {porte: "servie à part, hors de la répartition : un régime provisionné comme le RAFP", type: booleen, defaut: false, additif: "la phase 5 : le scénario 1 sert à part ce qui n'est pas de la répartition"}
