    porte: aucun plancher ni plafond d'assiette sur ce que le compte inscrit
    etat: contredite
    action: 61
    controle: plafond_d_assiette_apres_la_bascule

  - id: accueil.on_revalorise
    page: /
    extrait: "On revalorise le compte chaque année, au rythme des salaires du pays."
    porte: la règle d'indexation par défaut est la masse salariale
    etat: verifiee
    controle: indexation_masse_salariale_par_defaut

  - id: accueil.on_divise
