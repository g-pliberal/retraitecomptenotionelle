    extrait: "Quatre calculs pour votre carrière."
    porte: quatre systèmes calculés sur la même carrière, le premier servant de référence
    etat: verifiee
    controle: quatre_systemes_meme_carriere

  # Le troisième chiffre des résultats : ce que les recettes du système paient
  # de la pension que la règle promet. Son dépliant nomme QUI paie la
  # différence, et les trois façons de la payer se déduisent l'une de l'autre :
  # un seul contrôle les tient toutes les trois.
  - id: simuler.levier_retraites
    page: /simuler
    extrait: "Les retraités paient"
    porte: rogner toutes les pensions du coefficient d'équilibre comble le manque de l'année
    etat: verifiee
    controle: trois_leviers_du_meme_manque

  - id: simuler.levier_actifs
