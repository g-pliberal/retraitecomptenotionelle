    extrait: "qui vous appartiennent et se transmettent"
    porte: le capital du pilier se transmet avant la liquidation
    etat: verifiee
    controle: capital_capitalise_transmissible

  - id: accueil.effort_inchange
    page: /
    extrait: "à effort inchangé"
    porte: 18 % + 5 % + 5 % rendus font l'effort d'aujourd'hui, 28 %
    etat: verifiee
    controle: effort_inchange

  - id: accueil.solde_releve
    page: /
    extrait: "votre solde comme sur un relevé bancaire"
    porte: le capital notionnel est un montant en euros, lisible à tout moment
    etat: verifiee
    controle: compte_notionnel_en_euros

  - id: accueil.vous_revient
    page: /
    extrait: "de ce que vous avez cotisé vous revient"
    porte: le capital entier est converti en pension, sans rien retenir
    etat: verifiee
    controle: pension_egale_capital_sur_diviseur

  - id: accueil.rapport_exact
    page: /
    extrait: "dans le rapport exact de ce que ça coûte"
    porte: le diviseur est l'espérance de vie résiduelle, sans autre barème
    etat: verifiee
    controle: diviseur_est_l_esperance_de_vie

  - id: accueil.on_inscrit
