    page: /
    extrait: "Chaque carrière est recalculée depuis sa première cotisation, y compris celles dont la pension est déjà liquidée"
    porte: la proposition est rétroactive — les pensions déjà liquidées sont recalculées
    etat: verifiee
    controle: proposition_retroactive

  - id: accueil.transition_taux_unique
    page: /
    extrait: "Toute cotisation postérieure à la bascule est prélevée à"
