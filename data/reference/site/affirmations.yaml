    page: /
    extrait: "La CSG sur les revenus d'activité baisse de"
    porte: le solde de la moitié rendue passe par une baisse de CSG d'activité
    etat: verifiee
    controle: points_de_csg_rendus

  - id: accueil.csg_ne_finance_pas
    page: /
    extrait: "la CSG sur les revenus d'activité ne finance aujourd'hui aucune retraite."
    porte: la baisse de CSG n'est pas la restitution d'un prélèvement retraite
    etat: hors_modele
