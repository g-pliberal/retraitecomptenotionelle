    porte: la recette abandonnée est partagée en deux, salaires et dette
    etat: verifiee
    controle: impots_abandonnes_partages_en_deux

  - id: accueil.rendus_aux_salaires
    page: [/, /cout]
    extrait: "rendus aux salaires"
    porte: la moitié rendue est chiffrée sur le poste abandonné
    etat: verifiee
    controle: impots_abandonnes_partages_en_deux

  - id: accueil.eteindre_de_la_dette
    page: /
    extrait: "éteindre de la dette"
    porte: l'autre moitié éteint de la dette, et vaut la première
    etat: verifiee
    controle: impots_abandonnes_partages_en_deux

  - id: accueil.taxe_sur_les_salaires
    page: /
    extrait: "La taxe sur les salaires est supprimée"
    porte: la taxe sur les salaires est l'un des deux impôts supprimés
    etat: verifiee
    controle: deux_impots_sur_la_remuneration_supprimes

