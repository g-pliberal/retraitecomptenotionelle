# Ce que le site AFFIRME sur le modèle, phrase par phrase, et ce qu'un test en
# exige. Lu par `tests/test_affirmations.py` ; l'action 34 de
# `docs/feuille_de_route.md` dit pourquoi ce fichier existe.
#
# `tests/temoins/pages.json` fige le texte des pages : il rend visible une
# modification, il ne valide aucune affirmation. Ce catalogue fait l'autre
# moitié du travail, sur le modèle d'`inventaire.yaml` : chaque phrase forte
# des pages y prend sa ligne, et le test l'exploite dans les deux sens.
#
#   1. L'extrait est encore dans la page rendue (les témoins, donc le site que
#      le portage JavaScript rend caractère pour caractère). Une phrase
#      réécrite sans repasser par ici fait échouer le test.
#   2. Le contrôle passe. Une entrée `verifiee` nomme une fonction de
#      `tests/test_affirmations.py` qui interroge le MODÈLE, jamais le texte.
#      Une entrée `contredite` nomme l'action de la feuille de route qui la
#      refermera, et un contrôle qui vérifie qu'elle est ENCORE contredite :
#      il tombe le jour où l'action est faite, pour qu'on ne referme pas
#      l'action en oubliant la phrase.
#   3. Rien n'échappe au catalogue : toute phrase forte des pages — le contenu
#      des `<strong>` d'au moins trois mots, ou qui fait une phrase — est ici,
#      ou déclarée `sans_portee`.
#
# Un quatrième état est venu avec la page Risque, qui est une revue de
# littérature : `hors_modele`. La phrase affirme quelque chose sur le MONDE —
# ce que la Grèce a coupé, ce que les juges en ont fait — et aucun contrôle du
# modèle ne peut la trancher. Elle n'est pas pour autant `sans_portee` : elle
# peut être fausse. Ce que le test exige alors est ce que le dépôt exige
# partout ailleurs d'une affirmation sur le monde — sa source, citée dans la
# page même, et le champ `source` porte de quoi la retrouver.
#
# Champs :
#   id        libre, unique
#   page      le chemin de la page (`/`, `/cout`…), ou une liste de chemins ;
#             `*` pour le pied de page, commun à toutes
#   extrait   verbatim, balises retirées et blancs repliés, assez long pour
#             ne pas se retrouver par hasard (huit caractères au moins) et
#             assez court pour survivre à une retouche de mise en page
#   porte     ce que la phrase affirme sur ce que le système FAIT, en une ligne
#   etat      verifiee | contredite | hors_modele | sans_portee
#   controle  (verifiee, contredite) le nom du contrôle
#   action    (contredite) le numéro de l'action de la feuille de route
#   source    (hors_modele) un fragment de la citation, cherché dans la page
#
# Le piège, nommé d'avance : est `sans_portee` ce qui ne peut pas être faux —
# un titre, une invitation, une transition, une opinion. Dès qu'une phrase dit
# quelque chose sur ce que le système fait, elle a un contrôle ou une action.

