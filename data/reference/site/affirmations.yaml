    controle: garantie_est_une_avance_reprise

  - id: accueil.cinq_points_volontaires
    page: /
    extrait: "que personne ne vous impose."
    porte: cinq points volontaires distincts des cinq obligatoires, et retranchables
    etat: verifiee
    controle: cinq_points_volontaires_separes

  - id: accueil.a_prix_egal
    page: /
    extrait: "se comparent enfin à prix égal"
    porte: la comparaison se fait au même effort de cotisation qu'aujourd'hui
    etat: verifiee
    controle: effort_inchange

  - id: accueil.il_vous_appartient
    page: /
    extrait: "Il vous appartient."
    porte: le capital du pilier revient aux héritiers avant la liquidation
    etat: verifiee
    controle: capital_capitalise_transmissible

  - id: accueil.il_ne_sort_qu_a_la_retraite
    page: /
    extrait: "Il ne sort qu'à la retraite."
    porte: le pilier se convertit en rente viagère à la liquidation
    etat: verifiee
    controle: pilier_sort_en_rente

  - id: accueil.place_sans_risque
    page: /
    extrait: "Il est placé sans risque."
    porte: le pilier est placé sur la courbe des taux sans risque de la BCE
    etat: verifiee
    controle: pilier_place_sur_la_courbe_sans_risque

  - id: accueil.il_ne_remplace_rien
    page: /
    extrait: "Il ne remplace rien."
    porte: la répartition reste entière, la rente s'y ajoute
    etat: verifiee
    controle: pilier_capitalise_en_plus

  - id: accueil.impots_non_affectes
    page: /
    extrait: "Nous cessons donc de les affecter à la retraite."
    porte: la proposition ne reconduit pas les impôts et taxes affectés
    etat: verifiee
    controle: trois_postes_disparaissent

  - id: accueil.impots_rendus
    page: /
