- 'date d''effet : depuis le 1er septembre 2026'
- 'naissance : 1er septembre 1961, 1er janvier 1962, 1er janvier 1963, 1er avril 1965, 1er
  janvier 1966, 1967, 1968, 1969, et les nés avant le 1er septembre 1961 renvoyés à la rédaction
  antérieure'
