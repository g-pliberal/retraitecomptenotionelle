schema_version: 1
id: grille_age_legal_loi_de_2023
sorte: grille_independante
etage: regle
parties:
- fiche: age_legal_par_generation
  version: loi_de_2023
source:
  auteur: session Claude indépendante, lancée le 20 novembre 2026 sans accès au dépôt
  reference: 'L. 161-17-2 de la loi du 14 avril 2023 et D. 161-2-1-9 du 3 juin 2023 : trois
    mois par génération ; rédactions tirées de l''index LEGI à jour au 16 novembre 2026'
  etabli_le: '2026-11-20'
independance: Les valeurs ont été posées par une session qui n'a reçu que dix rédactions de
  R. 351-2, L. 161-17-2 et D. 161-2-1-9 tirées de LEGI et la liste des cas, naissance et date
  d'effet ; elle déclare n'avoir ouvert ni le dépôt ni le web. Les cas ont été choisis par
  la session qui connaît le code, la session indépendante en a proposé onze de plus.
seuils:
- 'date d''effet : du 1er septembre 2023 au 1er août 2026, la rédaction du 30 décembre 2025
  ne valant pas avant le 1er septembre 2026'
- 'naissance : 1er septembre 1961, 1er janvier 1962, 1963, 1964, 1965, 1966, 1967, 1968, et
  les générations d''avant 1955 que le décret reprend'
