schema_version: 1
id: grille_taux_et_proratisation_cent_cinquante
sorte: grille_independante
etage: regle
parties:
- fiche: taux_plein_et_proratisation
  version: cent_cinquante
source:
  auteur: session Claude indépendante, lancée le 21 novembre 2026 sans le code
  reference: R. 351-6 (LEGIARTI000006749347), article 70-5 du décret n° 45-179 (LEGIARTI000006760666),
    L. 351-1 (LEGIARTI000006742620, LEGIARTI000006742621), R. 351-1 (LEGIARTI000006749339), article
    71 du décret n° 45-179, R. 351-27, R. 351-45, lus par la session indépendante dans les index LEGI
    et JORF à jour au 16 novembre 2026
  etabli_le: '2026-11-21'
independance: 'Les valeurs ont été posées par une session lancée sans le code (Opus 5.5) : elle n''a
  reçu que la consigne, 40 cas (date de naissance, date d''effet, salaires annuels au plafond) sans
  valeur, le plafond et le SMIC du dépôt, et des copies des index LEGI et JORF de la DILA à jour au
  16 novembre 2026, où elle a cherché elle-même ses textes (R. 351-6, L. 351-1, R. 351-1, R. 351-27,
  R. 351-7, l''article 70-5 du décret n° 45-179, les décrets n° 2004-144, 2007-614 et 2025-1409) ;
  elle a écrit son propre calcul et proposé 20 cas. Un guetteur (fanotify, avec le processus) a journalisé
  les ouvertures sous les deux copies du dépôt et sous le dossier partagé : aucune de sa part. Pour
  l''année de l''effet, la lecture retenue est celle de la caisse, qu''elle donne comme seconde lecture
  ; pour la majoration de R. 351-7 sans activité après l''âge du taux plein (quatre cas), celle de
  la caisse aussi (circulaire 2004/20) : chaque énoncé chiffre sa lecture avec la retenue. Deux cas,
  qui portent une surcote, sont hors grille.'
seuils:
- 'date d''effet : 1er avril 1983, 1993, 1er janvier 1994, décembre 2003'
- durée du régime au-dessus et au-dessous de 150 trimestres, durée requise de l'escalier de 1993 au-dessus
  de 150
- 'l''arrêt du compte : effet au 1er janvier, au 1er février, au 1er avril, au 1er juillet, au 1er
  septembre, au 1er décembre'
