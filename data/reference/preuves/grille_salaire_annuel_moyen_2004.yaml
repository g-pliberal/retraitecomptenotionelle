id: grille_salaire_annuel_moyen_2004
sorte: grille_independante
etage: regle
parties:
- fiche: salaire_annuel_moyen
  version: annees_validantes_2004
source:
  auteur: session Claude indépendante, lancée le 20 novembre 2026 sans le code
  reference: R. 351-29 (LEGIARTI000006750042 à LEGIARTI000053335651), R. 351-29-1, R. 173-3-2, R.
    351-9 (LEGIARTI000006749353, LEGIARTI000028751530), R. 351-39 (LEGIARTI000053327980), L. 351-11,
    décret n° 2004-144 (article 8), lus par la session indépendante dans l'index LEGI à jour au 16
    novembre 2026
  etabli_le: '2026-11-20'
independance: 'Les valeurs ont été posées par une session lancée sans le code : elle a cherché elle-même
  dans une copie de l''index LEGI les articles, leurs rédactions et leurs dispositions d''application,
  écrit son propre calcul, et proposé 33 des 78 cas ; les 45 autres, naissance, date d''effet et salaires
  sans aucune valeur attendue, viennent de la session qui connaît le code. Elle n''a reçu, hors LEGI,
  que trois barèmes du dépôt : les tableaux de coefficients de la Cnav, le plafond annuel et le SMIC
  horaire. Un guetteur (inotify) a journalisé les ouvertures de fichiers sous le dépôt pendant ses
  deux passages : aucune. Un article lui avait échappé, R. 351-39, que la session qui connaît le code
  lui a signalé sans lui en dire l''effet : elle a refait le cas qu''il change.'
seuils:
- 'date d''effet : 1er janvier 2004, puis chaque date d''un tableau de coefficients, la veille et
  le jour, jusqu''au 1er janvier 2026 — septembre 2008, avril 2009 à 2013, octobre 2015 et 2017, janvier
  2019 à 2026, juillet 2022'
- 'naissance : 1944 (vingt et une années) à 1947 (vingt-quatre), décembre 1947 et janvier 1948, vingt-cinq
  ensuite'
- 'le seuil d''un trimestre : 200 heures de SMIC jusqu''en 2013, 150 depuis 2014, au centime de part
  et d''autre'
- vingt-cinq années exactement, vingt-six, une seule, aucune année validante
- un salaire l'année de la date d'effet, avant et depuis 2026
- le plafond, des salaires au-dessus toute la carrière
- les années d'avant 1948 depuis 2026 (R. 351-39)
