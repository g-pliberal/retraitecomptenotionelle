id: grille_salaire_annuel_moyen_1995
sorte: grille_independante
etage: regle
parties:
- fiche: salaire_annuel_moyen
  version: moyenne_des_salaires_annuels_1995
source:
  auteur: session Claude indépendante, lancée le 20 novembre 2026 sans le code
  reference: R. 351-29 (LEGIARTI000006750041), R. 351-29-1 (LEGIARTI000006749369), L. 351-11 et R.
    351-1, lus par la session indépendante dans l'index LEGI à jour au 16 novembre 2026
  etabli_le: '2026-11-20'
independance: 'Les valeurs ont été posées par une session lancée sans le code : elle a cherché elle-même
  dans une copie de l''index LEGI les articles, leurs rédactions et leurs dispositions d''application,
  écrit son propre calcul, et proposé 33 des 78 cas ; les 45 autres, naissance, date d''effet et salaires
  sans aucune valeur attendue, viennent de la session qui connaît le code. Elle n''a reçu, hors LEGI,
  que trois barèmes du dépôt : les tableaux de coefficients de la Cnav, le plafond annuel et le SMIC
  horaire. Un guetteur (inotify) a journalisé les ouvertures de fichiers sous le dépôt pendant ses
  deux passages : aucune. Un article lui avait échappé, R. 351-39, que la session qui connaît le code
  lui a signalé sans lui en dire l''effet : elle a refait le cas qu''il change.'
seuils:
- 'date d''effet : 1er juillet 1995, puis chaque date d''un tableau de coefficients jusqu''au 1er
  janvier 2003'
- 'naissance : avant 1934 (dix années), puis une année de plus par génération jusqu''à 1943 (vingt)'
- une année qui ne valide aucun trimestre compte encore (même carrière que la grille de 2004, un mois
  plus tôt)
- 'les années d''avant 1948 : écartées dès qu''il y a assez d''années postérieures, prises à défaut
  en remontant depuis 1947'
- le plafond de l'année, y compris avant février 1991
