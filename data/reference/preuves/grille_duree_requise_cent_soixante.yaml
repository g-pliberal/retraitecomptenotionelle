- id: grille_duree_requise_cent_soixante_c036
  enonce: 'Né le 1949-01-01, pension du régime général prenant effet le 2008-12-01 : la session indépendante
    lit 161 trimestres. Fondement qu''elle relève : LEGIARTI000006758543 ; LEGIARTI000006749436 ;
    LEGIARTI000006749450 (I). Sa remarque : Conflit : R351-27 et R351-45 I en vigueur fixent 160 «
    quelle que soit la date de naissance » ; la loi 2003-775 art. 5 (V et III) rattache la durée à
    l''année des 60 ans. Retenu : la loi (161) ; à la lettre du décret : 160. Lecture retenue : 160,
    celle de la caisse et du décret en vigueur à la date d''effet. R. 351-45, I (LEGIARTI000006749450)
    : 160 trimestres « aux pensions prenant effet postérieurement au 31 décembre 2002, quelle que
    soit la date de naissance » ; la circulaire Cnav 2008/41 (§ 211 et 213) ne fait évoluer la durée
    qu''« à compter du 1er janvier 2009 », pour les « dates d''effet postérieures au 1er décembre
    2008 ». La lecture de la session indépendante, le V de l''article 5 de la loi n° 2003-775 (la
    durée en vigueur aux soixante ans), donnerait la valeur qu''elle rend ; une session Fable 5.2
    consultée le 21 novembre 2026 retient 160 (la durée des soixante ans n''était pas encore en vigueur).
    Sans effet sur le taux d''une carrière longue, qui exigeait déjà 168 trimestres.'
