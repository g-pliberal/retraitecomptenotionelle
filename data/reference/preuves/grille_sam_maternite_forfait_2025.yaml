schema_version: 1
id: grille_sam_maternite_forfait_2025
sorte: grille_independante
etage: regle
parties:
- fiche: sam_indemnites_de_maternite
  version: forfait_a_l_annee_civile_2025
source:
  auteur: session Claude indépendante, lancée le 20 novembre 2026 sans le code
  reference: R. 351-29 (LEGIARTI000048031614, LEGIARTI000051226243, LEGIARTI000053335651), loi n°
    2010-1330, article 118, VI (LEGIARTI000047453380), arrêté du 29 avril 2024 (JORFARTI000049496475),
    décret n° 2005-1351, article 3 (JORFARTI000001522288), L. 331-3 et L. 331-4, R. 173-3-2, R. 351-29-1,
    lus par la session indépendante dans les index LEGI et JORF à jour au 16 novembre 2026 ; circulaire
    Cnav 2025/11 du 28 mars 2025, lue après les textes
  etabli_le: '2026-11-20'
independance: 'Les valeurs ont été posées par une session lancée sans le code : elle a cherché elle-même,
  dans une copie des index LEGI et JORF, les articles, la loi, l''arrêté du salaire médian et leurs
  dispositions d''application, écrit sa lecture avant d''ouvrir la circulaire Cnav 2025/11, écrit
  son propre calcul, et proposé 17 des 54 cas ; les 37 autres, naissance, sexe, date d''effet, naissances
  des enfants et salaires sans aucune valeur attendue, viennent de la session qui connaît le code.
  Elle n''a reçu, hors des index et de la circulaire, que trois barèmes du dépôt : les tableaux de
  coefficients de la Cnav, le plafond annuel et le SMIC horaire. Un guetteur (inotify) a journalisé
  les ouvertures de fichiers sous les trois copies du dépôt pendant ses deux passages : aucune. Un
  texte lui avait échappé, le décret n° 2005-1351, que la session qui connaît le code lui a signalé
  sans lui en dire l''effet : elle a refait les dix-huit cas qu''il change.'
seuils:
- 'date d''effet : 1er septembre 2023, 1er février et 1er mars 2025, 1er janvier, 1er septembre, 1er
  octobre et 1er novembre 2026'
- 'le rang : une, deux, trois, quatre naissances ; des jumeaux, des triplés ; un enfant après des
  jumeaux ou des triplés, des jumeaux après un enfant ; deux naissances la même année'
- 'le début du congé autour du 1er janvier 2012 : naissances du 31 décembre 2011 au 1er juin 2012,
  six, huit et douze semaines avant l''accouchement'
- 'le plafond : un total qui le passe en 2004 et en 2005, un salaire déjà au plafond en 2003 et en
  2007 (décret n° 2005-1351, article 3 : les salaires perçus depuis le 1er janvier 2005)'
- 'l''affiliation : aucun salaire l''année de la naissance, aucun l''année d''avant, une année sous
  le seuil d''un trimestre, une carrière commencée l''année suivante'
- 'le salaire médian : la naissance de 1950, sans salaire médian de 1949, celle de 1951'
- le père ; les vingt-quatre et vingt-trois années des parents depuis septembre 2026, et l'assurée
  née avant 1948
- 'hors de la grille : les 125 % des congés débutés depuis 2012, dont aucun cas ne donne le montant,
  comptés pour zéro des deux côtés'
