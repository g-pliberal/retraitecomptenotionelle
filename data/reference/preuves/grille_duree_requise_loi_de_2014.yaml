schema_version: 1
id: grille_duree_requise_loi_de_2014
sorte: grille_independante
etage: regle
parties:
- fiche: duree_requise_par_generation
  version: loi_de_2014
source:
  auteur: session Claude indépendante, lancée le 21 novembre 2026 sans le code
  reference: L. 161-17-3 (LEGIARTI000028494794), loi n° 2014-40, article 2, lus par la session indépendante
    dans les index LEGI et JORF à jour au 16 novembre 2026
  etabli_le: '2026-11-21'
independance: 'Les valeurs ont été posées par une session lancée sans le code (Opus 5.5) : elle n''a
  reçu que la consigne, la liste des cas (date de naissance, date d''effet) et des copies des index
  LEGI et JORF de la DILA à jour au 16 novembre 2026, où elle a cherché elle-même ses textes, leurs
  rédactions et leurs dispositions d''application ; elle a écrit son propre calcul et proposé 30 des
  144 cas. Les 114 autres, sans valeur attendue, viennent de la session qui connaît le code. Un guetteur
  (inotify) a journalisé les ouvertures sous les deux copies du dépôt pendant son passage : aucune
  lecture de sa part, seulement le chargement des skills de Claude Code à son démarrage. Sur huit
  cas, la lecture retenue est celle de la caisse, que l''énoncé chiffre avec la sienne ; trois cas
  que ni le texte ni une pratique connue ne tranchent sont hors grille.'
seuils:
- 'date d''effet : 1er février 2014, 1er août 2023'
- 'naissance : 1958, 31 décembre 1960 et 1er janvier 1961, 31 août et 1er septembre 1961, 1963 et
  1964, 1966 et 1967, 1969 et 1970, 1972 et 1973'
- les générations d'avant 1958, que la loi laisse aux textes antérieurs
