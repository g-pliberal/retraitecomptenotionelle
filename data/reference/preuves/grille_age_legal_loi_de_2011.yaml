etage: regle
parties:
- fiche: age_legal_par_generation
  version: loi_de_2011
source:
  auteur: session Claude indépendante, lancée le 20 novembre 2026 sans accès au dépôt
  reference: 'L. 161-17-2 du 23 décembre 2011 et D. 161-2-1-9 du 31 décembre 2011 : quatre
    puis cinq mois par génération ; rédactions tirées de l''index LEGI à jour au 16 novembre
    2026'
  etabli_le: '2026-11-20'
independance: Les valeurs ont été posées par une session qui n'a reçu que dix rédactions de
  R. 351-2, L. 161-17-2 et D. 161-2-1-9 tirées de LEGI et la liste des cas, naissance et date
  d'effet ; elle déclare n'avoir ouvert ni le dépôt ni le web. Les cas ont été choisis par
  la session qui connaît le code, la session indépendante en a proposé onze de plus.
seuils:
- 'date d''effet : du 1er janvier 2012 au 1er août 2023'
- 'naissance : 1er juillet 1951, 1er janvier 1952, 1953, 1954, 1955, chaque bord des deux
  côtés ; les nés depuis le 1er septembre 1961 y lisent encore soixante-deux ans'
