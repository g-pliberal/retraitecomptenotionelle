- id: grille_taux_et_proratisation_decret_de_2025_c24
  enonce: 'Né le 1947-06-15, salarié du seul régime général de 1970 à 2000 (salaire au plafond chaque
    année entière, au prorata des mois l''année de l''effet), pension prenant effet le 2026-07-01,
    sans enfant ni exception au taux plein : la session indépendante lit 124 trimestres, une durée
    maximum de 158, un taux de 0.5 et un rapport de la pension au salaire annuel moyen de 0.3924050633.
    Fondement qu''elle relève : LEGIARTI000006749339(R351-1) ; LEGIARTI000053335645(R351-27) ; LEGIARTI000053335582+R351-39(D2025-1409
    art.2)(R351-6) ; LEGIARTI000053335598(R351-9) ; LEGIARTI000053335592(R351-7) ; LEGIARTI000051289852(L351-8)
    ; LEGIARTI000053280889(L161-17-2) ; LEGIARTI000023035688(L351-1). Lecture retenue pour la majoration
    de R. 351-7 : celle de la caisse, qui compte chaque trimestre écoulé depuis le 1er du mois qui
    suit l''âge du taux plein jusqu''à la date d''effet, avec ou sans activité (circulaire Cnav n°
    2004/20, point 11 : la majoration « est indépendante du fait d''avoir exercé ou non une activité
    professionnelle entre le 65ème anniversaire et le point de départ de la pension » ; point 12 ;
    exposé « Majoration de durée d''assurance pour âge » de la Cnav, avril 2026 : « 2,50 % par trimestre
    écoulé »). Ici 56 trimestres d''ajournement : 124 × (1 + 2,5 % × 56) dépasse la durée maximum,
    le coefficient vaut 1 et le rapport 0,5. La session indépendante, qui ne compte depuis 2004 que
    les trimestres accomplis après l''âge, rend 0.3924050633. Ses autres remarques : version LEGI
    consolidée de R351-6 au 01/01/2026 (II sans la ligne 1947, I ouvert à tous) : durée maximum 160,
    coefficient=0.775, taux_fois_coefficient=0.3875'
