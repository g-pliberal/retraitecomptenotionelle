schema_version: 1
id: grille_decote_loi_de_2003
sorte: grille_independante
etage: regle
parties:
- fiche: decote_regime_general
  version: loi_de_2003
source:
  auteur: session Claude indépendante, lancée le 21 novembre 2026 sans le code
  reference: R. 351-27, II (LEGIARTI000006749436, LEGIARTI000020082993, LEGIARTI000024113020, LEGIARTI000047633296),
    décret n° 2004-144, article 8, L. 351-8, loi n° 2003-775, article 5, loi n° 2010-1330 et ses décrets,
    L. 161-17-3, lus par la session indépendante dans les index LEGI et JORF à jour au 16 novembre
    2026
  etabli_le: '2026-11-21'
independance: 'Les valeurs ont été posées par une session lancée sans le code (Opus 5.5, agent de
  la session qui connaît le code, sans son contexte) : elle n''a reçu que la consigne, la liste des
  cas (date de naissance, date d''effet, trimestres tous régimes) et des copies des index LEGI et
  JORF de la DILA à jour au 16 novembre 2026, où elle a cherché elle-même ses textes, leurs rédactions
  et leurs dispositions d''application, y compris les durées requises et les âges d''annulation ;
  elle a écrit son propre calcul et proposé 34 des 93 cas. Les 59 autres, sans valeur attendue, viennent
  de la session qui connaît le code, qui travaillait pendant ce temps dans une autre copie du dépôt.
  Un guetteur (inotify) a journalisé les ouvertures sous la copie du dépôt de /home/user pendant son
  passage : aucune. Accord sur les 93 cas du premier coup ; pour les pensions de janvier à juillet
  2026, où le texte est muet, la lecture retenue est la sienne et celle de la caisse.'
seuils:
- 'date d''effet : 1er janvier 2004 (le II vaut pour les pensions prenant effet postérieurement au
  31 décembre 2003, avant la rédaction du 15 février) ; 1er janvier 2009 ; juillet 2011 (âge d''annulation
  de la loi de 2010) ; août et septembre 2023 ; décembre 2025'
- 'naissance : 31 décembre 1943 et 1er janvier 1944, chaque génération de 1944 à 1953 (coefficient
  de 2,375 % à 1,25 %), 30 juin et 1er juillet 1951, 31 décembre 1952 et 1er janvier 1953, 31 décembre
  1954 et 1er janvier 1955, 31 décembre 1957 et 1er janvier 1958'
- 'décompte par l''âge : soixante-cinq ans, puis 65 ans et 4 mois, 65 ans et 9 mois, 66 ans et 2 mois,
  66 ans et 7 mois, 67 ans ; écarts de trois et quatre mois ; anniversaire au 31 d''un mois de trente
  jours'
- décompte par la durée et par l'âge égaux ; vingt trimestres par l'âge
