    avantages_non_contributifs: [minimum_vieillesse, reversion]
    notes: >-
      Article 3 du décret n° 73-937 : liquidables dès soixante ans, sans
      abattement pour qui justifie de 150 trimestres dans les régimes de base
      (rédaction de 1990, LEGIARTI000006765816), sinon minorés de 2,5 % par
      trimestre manquant, au plus petit des trimestres manquant à la durée et
      de ceux qui séparent de soixante-cinq ans. Avant 1990, l'article
      renvoyait aux règles du régime général (rédaction du 5 mars 1976,
      LEGIARTI000006765815) : la fiche leur applique celles de 1990, et la
      durée qui annule la décote avant 1983 comme la CANCAVA.
