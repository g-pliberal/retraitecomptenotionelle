    points_maximum: 33.333333
    decote_par_trimestre: null
    surcote_par_trimestre: null
    avantages_non_contributifs: [minimum_vieillesse, reversion]
    notes: >-
      LES POINTS. Le décret n° 64-994 (article 4, rédaction du 10 novembre
      1968) range l'artisan dans l'une de quinze classes, de 4 à 60 points
      par an, selon ses revenus professionnels de l'année précédente
      (article 5), les seuils étant « fixées par décret » ; les classes de
      1949 à 1968 s'y assimilent par deux tableaux annexés (article 26, III).
      Ni les seuils ni les tableaux ne sont dans l'index LEGI, et le Journal
      officiel d'avant 1990 n'y est qu'en notices. Le dépôt lit donc la seule
      conversion d'un revenu en points que le droit en vigueur écrive :
      D. 634-8, qui calcule la pension des périodes assimilées après 1972 sur
      un revenu égal « à autant de fois un pourcentage dudit plafond que la
      dernière cotisation annuelle […] antérieurement au 1er janvier 1973
      comporte de points », 3 % du plafond pour les artisans (de même le IV
      de l'article 1er du décret n° 73-937 pour les cotisations d'après
      1972). Un point par 3 % du plafond, au plafond au plus : 33,33 points
      pour un revenu au plafond, soit la classe XII (36 points) à un dixième
      près. `points_maximum` les ouvre au prorata de l'assiette plafonnée.
      Ce que la règle ne sait pas : les classes au-dessus du plafond (jusqu'à
      60 points), les points gratuits des années d'avant 1949 et les
      rachats. TAUX DE COTISATION : 8,5 %, la valeur de synthèse que la fiche
      `cancava` portait, qui ne sert qu'au compte notionnel.
