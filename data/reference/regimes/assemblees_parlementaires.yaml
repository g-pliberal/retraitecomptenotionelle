code: assemblees_parlementaires
rang: 730
nom: >-
  Caisse de pensions des députés et des anciens députés (et, par assimilation, des sénateurs)
famille: special
# Intégré, lu le 28 septembre 2026, pour les députés : le règlement de leur
# caisse (consolidé au 1er janvier 2018, article 5, 2) les engage à « ne pas
# cotiser simultanément à un autre régime de retraite s'ils n'exercent pas
# d'activité professionnelle relevant de ce régime ». Les sénateurs y sont
# assimilés : voir `manque`.
etage: integre
source_id: sites_institutionnels
fiabilite: estimee
creation: 1904
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Députés et, faute d'un règlement publié, sénateurs : pension en annuités
  sur l'indemnité parlementaire, servie par la caisse de chaque assemblée,
  réformée en 2010, 2014, 2018 et 2023 sur le modèle de la fonction
  publique. Les fonctionnaires des assemblées, dont le règlement n'est pas
  publié, restent hors fiche.
hors_repartition: false
inventaire:
  section: fonction_publique
  rang: 70
  nom: Caisses de retraite des anciens députés, des anciens sénateurs et des personnels des assemblées
  population: Députés, sénateurs, fonctionnaires de l'Assemblée nationale et du Sénat
  couverture: partiel
  statuts: [parlementaire]
  textes:
    - {reference: "règlement de la Caisse de pensions des députés et des anciens députés, consolidé au 1er janvier 2018, publié par l'Assemblée nationale (hors JORF)", id: null}
    - {reference: "arrêté des Questeurs n° 15-043 du 14 avril 2015 relatif au taux de cotisation à la Caisse de pensions (9,34 % en 2015, 10,85 % en 2020)", id: null}
    - {reference: "Bureau du Sénat du 12 juillet 2023, transposition de la loi du 14 avril 2023 à la caisse des retraites des anciens sénateurs (62 à 64 ans, 43 annuités)", id: null}
  manque: >-
    La fiche est celle des députés, lue dans le règlement de 2018 ; les
    sénateurs y sont assimilés faute d'un règlement publié, et les
    fonctionnaires des assemblées restent hors fiche. La part versée par
    l'Assemblée n'est pas écrite : seule la retenue du député est portée.
    La retenue d'avant 2015 est estimée. Les âges des générations nées
    avant 1969 sont fixés par un arrêté des Questeurs non publié : la fiche
    prend ceux de L. 161-17-2, que le règlement décrit. Deux compléments
    internes ne sont pas portés. Les députés avaient, jusqu'au 1er janvier 2018, un « système
    de retraite complémentaire facultatif », que l'alignement sur la
    fonction publique a supprimé (Assemblée nationale, « Alignement sur le
    droit commun du régime de retraite des députés », page archivée le 31
    décembre 2019). Et une page de la-retraite-en-clair.fr (« La retraite
    des parlementaires », publiée le 1er janvier 2010) écrit que les
    sénateurs ont « un régime de retraite complémentaire par points »,
    dont « la cotisation est égale à celle du régime de base » : le
    règlement du Sénat n'étant pas publié, rien ne le vérifie.
periodes:
