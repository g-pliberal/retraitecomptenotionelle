    taux_plein: 0.8440
    salaire_reference: carriere_entiere
    assiette: deplafonnee
    taux_cotisation_retraite: 0.0785
    part_salariale: 1.00
    decote_par_trimestre: null
    surcote_par_trimestre: null
    avantages_non_contributifs: [majoration_enfants, reversion]
    notes: >-
      SOURCE : règlement de la Caisse de pensions des députés et des
      anciens députés, consolidé au 1er janvier 2018 et publié par
      l'Assemblée nationale (www2.assemblee-nationale.fr/static/CRD-
      janvier-2018.pdf, lu par scripts/fetch/sites_institutionnels.py),
      hors JORF. BASE : « une retenue obligatoire sur l'indemnité
      parlementaire augmentée de l'indemnité de résidence et de
      l'indemnité de fonction » (art. 5). PENSION : « pour chaque annuité,
      à un pourcentage des sommes soumises à retenue » (art. 21), la
      valeur de l'annuité et le nombre maximal d'annuités étant ceux « en
      vigueur au soixante-quatrième anniversaire » (art. 21 ter). La fiche
      écrit le taux plein comme valeur de l'annuité × nombre maximal
      d'annuités, et la durée requise comme ce nombre en trimestres. LA
      PART DE L'ASSEMBLÉE n'est pas écrite dans le règlement : la fiche ne
      porte que la retenue du député (part salariale 1), ce qui sous-
      estime l'effort contributif total ; le Sénat, dont le site ne publie
      que « 62 à 64 ans » et « 43 annuités » (12 juillet 2023), est traité
      comme l'Assemblée. Avant 2009 : « jusqu'en 2008 : 2,1100 % — 40
      annuités » (tableau de l'art. 21), soit un taux plein de 84,4 % de
      l'indemnité, à 60 ans (« anciens députés ayant atteint leur
      soixantième anniversaire avant le 1er janvier 2008 », art. 21 ter).
      La retenue d'avant l'arrêté de 2015 n'est pas dans le document :
      7,85 %, le taux de la fonction publique de la même époque, tient
      lieu, niveau `estimee` ; la double cotisation possible jusqu'en 2017
      n'est pas portée.
