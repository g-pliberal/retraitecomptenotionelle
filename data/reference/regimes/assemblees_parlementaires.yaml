      adresse, relu le 13 octobre 2026, porte la loi du 14 avril 2023 et
      la suspension de 2026), hors JORF. BASE : « une retenue
      obligatoire sur l'indemnité parlementaire augmentée de l'indemnité
      de résidence et de l'indemnité de fonction » (art. 5). PENSION : «
      pour chaque annuité, à un pourcentage des sommes soumises à
      retenue » (art. 21). La fiche écrit le taux plein comme valeur de
      l'annuité × nombre maximal d'annuités, et la durée requise comme
      ce nombre en trimestres. LA PART DE L'ASSEMBLÉE n'est pas écrite
      dans le règlement : la fiche ne porte que la retenue du député
      (part salariale 1), ce qui sous-estime l'effort contributif total
      ; le Sénat, dont le site ne publie que « 62 à 64 ans » et « 43
      annuités » (12 juillet 2023), est traité comme l'Assemblée. L'ÂGE
      SE LIT À LA GÉNÉRATION, ET LA DURÉE À L'ÂGE D'OUVERTURE, et non à
      l'année de la liquidation. L'âge : « tout ancien député né à
      compter du 1er janvier 1969 et âgé de soixante-quatre ans révolus
      » (art. 8, 1) ; avant, un arrêté des Questeurs, non publié, le
      fixe « de manière croissante à raison de trois mois par génération
      sauf pour les anciens députés nés entre le 1er janvier 1964 et le
      31 mars 1965 » pour les nés de septembre 1961 à 1968 (art. 8, 2),
      et, sur le modèle de la fonction publique, de soixante ans avant
      juillet 1951 à soixante-deux ans pour 1955 : `age_table:
      assemblee_nationale`. La valeur de l'annuité et le nombre maximal
      d'annuités : ceux « en vigueur au soixante-quatrième anniversaire
      » (art. 21 ter, 1), et, pour les nés de 1949 à 1968, « les
      modalités de liquidation de la pension en vigueur à l'âge
      d'ouverture de leur droit à pension » (art. 21 ter, 2), celles de
      2008 pour qui avait soixante ans plus tôt :
      `duree_requise_calendrier: assemblee_nationale`, lu au mois où
      l'âge d'ouverture est atteint. La fiche lisait l'un et l'autre à
      l'année de la liquidation, une période par an : à un député né en
      janvier 1953, dont le droit s'ouvre à soixante et un ans et deux
      mois en mars 2014 et qui part en 2018, elle opposait 167
      trimestres au lieu de 165, une annuité de 2,0216 % au lieu de
      2,0461 %. Retenue « à compter du 1er janvier 2019 : 10,58 % ».
