code: parlement_europeen
nom: >-
  Affiliation des représentants français au Parlement européen au régime général et à l'Ircantec
famille: complementaire_prive
population: >-
  Représentants de la France à l'Assemblée des Communautés européennes,
  puis au Parlement européen, qui ne sont ni députés ni sénateurs : pour
  leur pension, la loi n° 79-563 du 6 juillet 1979 (article 6) les affilie
  à l'assurance vieillesse du régime général et à l'Ircantec, sur
  l'indemnité que leur verse l'État (articles 1er à 4, que l'index ne
  porte que par leur sommaire) ; les membres du Conseil économique et
  social élus restent à la caisse du Conseil. Depuis le 14 juillet 2009, le statut des députés au Parlement
  européen leur sert une indemnité et une pension sur le budget de
  l'Union : la loi française demeure pour l'indemnité nationale qu'elle
  vise, la pension européenne n'est pas un régime français.
creation: 1979
fermeture: null
extinction: null
