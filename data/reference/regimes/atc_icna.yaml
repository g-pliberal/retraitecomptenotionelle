code: atc_icna
nom: >-
  Allocation temporaire complémentaire et complément individuel temporaire des ingénieurs du contrôle de la navigation aérienne (ATC-ICNA)
famille: fonction_publique
population: >-
  Ingénieurs du contrôle de la navigation aérienne (ICNA), fonctionnaires
  de l'État pensionnés au code des pensions civiles et militaires, radiés
  des cadres par limite d'âge, sur leur demande dès cinquante ans
  (cinquante-deux depuis 2017) ou pour invalidité : l'allocation, servie
  huit ans puis treize ans depuis 2004 en sus de la pension, vaut une
  fraction de l'indemnité spéciale de qualification d'un premier
  contrôleur (loi n° 89-1007, article 6-1, créé par la loi n° 97-1239) ;
  depuis 2012, un complément individuel temporaire compense la pension
  incomplète des radiés par limite d'âge. Le fonds de gestion est confié à
  la Caisse des dépôts (décret n° 98-1096 du 4 décembre 1998).
