    avantages_non_contributifs: [reversion]
    notes: >-
      RÉGIME PAR CAPITALISATION PROVISIONNÉE — EXCLU DU PÉRIMÈTRE NOTIONNEL.
      5 % agent + 5 % employeur sur les primes, dans la limite de 20 % du
      traitement indiciaire. Conformément à la demande, les droits RAFP sont
      isolés dans un compartiment de capitalisation distinct et ne sont pas
      convertis en capital notionnel (cf. moteur/compte.py).
      LE PLAFOND DE 20 % EST APPLIQUÉ (`plafond_primes_traitement`) : les
      primes cotisent « dans la limite de 20 % du traitement indiciaire
      brut total perçu au cours de l'année considérée », écrit l'article 2
      du décret n° 2004-569 dans ses six versions, de la première
      (LEGIARTI000006453300) à celle en vigueur depuis le 17 avril 2024
      (LEGIARTI000049424057, « ou de la solde brute totale » pour les
      militaires depuis 2019), et l'ERAFP le redit en tête de sa page sur
      les cotisations. La fiche l'écrivait sans que le moteur le lise : un
      agent dont les primes font 25 % de la rémunération cotisait sur 25 %
      au lieu de 15 %. Les deux exceptions de l'ERAFP ne sont pas portées :
      la GIPA, cotisée sans plafond, et les jours de compte épargne-temps
      convertis en points (fiches `rafp_gipa_hors_plafond` et
      `rafp_compte_epargne_temps`) ; ni, depuis avril 2024, la cotisation
      volontaire des agents de l'État dans le Pacifique et à
      Saint-Pierre-et-Miquelon, et sa garantie de 4 000 € (fiches
      `rafp_cotisation_volontaire_outre_mer` et `rafp_garantie_outre_mer`).
      L'ÂGE EST DATÉ PAR L'ARTICLE 9 DU DÉCRET N° 2004-569 : jusqu'au 2 juin
      2011 (LEGIARTI000006453304), « l'ouverture des droits est subordonnée
      à la condition qu'ils aient atteint l'âge de soixante ans » ; la
      fiche opposait 62 ans dès 2005. Aucune décote : l'âge d'ouverture est
      aussi celui du taux plein.
