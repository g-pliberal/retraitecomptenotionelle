    surcote_points: rafp_majoration_capital
    capital_seuil_points: 5125
    avantages_non_contributifs: [reversion]
    notes: >-
      RÉGIME PAR CAPITALISATION PROVISIONNÉE — EXCLU DU PÉRIMÈTRE NOTIONNEL.
      5 % agent + 5 % employeur sur les primes, dans la limite de 20 % du
      traitement indiciaire, plafond appliqué — voir la première période.
      Conformément à la demande, les droits RAFP sont isolés dans un
      compartiment de capitalisation distinct et ne sont pas convertis en
      capital notionnel (cf. moteur/compte.py).
      Depuis le 3 juin 2011 (LEGIARTI000024113145, puis LEGIARTI000036070843),
      l'article 9 subordonne l'ouverture des droits à « l'âge mentionné à
      l'article L. 161-17-2 » : 62 ans pour la génération 1955, 64 pour
      1968 et les suivantes, lu à la génération. Le régime n'a pas de
      décote ni d'âge d'annulation propre : `age_taux_plein` reste la
      valeur de repli de l'ouverture et n'est pas lu.
      LA VALEUR DE SERVICE EST MODULÉE PAR L'ÂGE : « en fonction de l'âge
      de liquidation de la retraite additionnelle » (art. 8,
      LEGIARTI000037483754), selon le barème actuariel que le conseil
      d'administration de l'ERAFP établit — depuis le 1er mars 2015 (sa
      délibération du 5 février 2015), 1,00 jusqu'à 62 ans, 1,08 à 64,
      1,22 à 67, 1,40 à 70, 1,81 dès 75 ; avant, celui de 2005, au pivot de
      soixante ans —, au prorata des mois entre deux âges entiers.
      SOUS 5 125 POINTS, UN CAPITAL : la prestation est « servie sous forme
      de capital lorsque le nombre de points acquis est inférieur à 5 125 »
      (art. 9, LEGIARTI000037483756), au coefficient de conversion de
      l'âge — 25,57 à 64 ans depuis 2022, interpolé au mois —, versé en
      deux fois de 4 900 à 5 124 points depuis le 1er avril 2024 (de 4 600
      depuis mai 2019). La calculette de l'ERAFP donne, pour 3 000 points à
      65 ans en 2026, 4 723,63 € : 3 000 × 1,12 × 0,05671 × 24,79. Le
      montant annuel de la fiche reste celui de la rente équivalente, le
      capital est écrit dans le détail (fiche `rafp_majoration_capital`).
