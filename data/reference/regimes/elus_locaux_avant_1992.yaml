code: elus_locaux_avant_1992
nom: >-
  Régimes de retraite par rente des élus départementaux, régionaux et communaux constitués avant la loi du 3 février 1992
famille: special
population: >-
  Anciens conseillers généraux, régionaux et municipaux affiliés aux
  régimes de retraite que des collectivités avaient institués pour leurs
  élus avant la loi n° 92-108 : la loi rend les cotisations des
  collectivités exclusives de toute autre contribution, mais fait honorer
  les pensions liquidées et les droits acquis par les organismes auprès
  desquels ils ont été constitués, les collectivités couvrant le
  déficit (article 32). La Caisse des dépôts gère les régimes des anciens
  conseillers généraux de cinq départements — Bouches-du-Rhône, Creuse,
  Gard, Haute-Savoie, Lot-et-Garonne —, « régimes de retraite
  supplémentaire par rente fermés depuis 1992 », aux droits figés au
  30 mars 1992 et financés surtout par une subvention départementale.
creation: null
fermeture: 1992
extinction: null
