  raison_hors_champ: >-
    Des régimes supplémentaires par rente, propres à chaque collectivité,
    fermés en 1992 et dont les droits sont figés au 30 mars 1992 : ils
    s'ajoutent à l'Ircantec, que le statut `elu_local` route depuis 1973,
    et à la retraite par rente que la loi de 1992 a ouverte (FONPEL,
    CAREL), facultative. Aucun règlement n'est publié.
