    - {reference: "loi n° 2008-776 du 4 août 2008 de modernisation de l'économie, article 1er (L. 133-6-8)", id: LEGIARTI000019284945}
    - {reference: "décret n° 2018-1120 du 10 décembre 2018 relatif aux modalités d'application du régime micro-social aux professionnels libéraux", id: LEGITEXT000037798308}
    - {reference: "code de la sécurité sociale, L. 133-6-8 (prestations calculées sur le chiffre d'affaires après abattement de 71 %, 50 % ou 34 %)", id: LEGIARTI000033712872}
