  manque: >-
    Le statut `micro_entrepreneur` route les régimes du commerçant sur le
    revenu reconstitué (chiffre d'affaires après abattement) : la
    cotisation micro-sociale ventilée entre les branches reproduit, par
    construction, celle du commerçant — 12,3 % du chiffre d'affaires dont
    58,3 % pour la retraite, sur 29 % de revenu, font 24,7 % contre 24,75
    % —. Depuis 2023, les trimestres se valident sur le revenu que la
    cotisation achète, taux global, part de base et taux de base
    (`legislation/micro_social.yaml`, circulaire Cnav n° 2024-23). La
    saisie prend le chiffre d'affaires et l'activité (champ « micro »),
    l'abat de 71, 50 ou 34 % (L. 613-7, II) et route la Cipav vers les
    régimes du libéral. Non portés : la règle de validation d'avant 2023,
    où le revenu abattu valide, la cotisation des services et du
    libéral, que le barème de l'artisan ou du libéral approche sur le
    revenu abattu.
