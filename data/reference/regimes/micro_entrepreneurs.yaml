  textes:
    - {reference: "loi n° 2008-776 du 4 août 2008 de modernisation de l'économie, article 1er (L. 133-6-8)", id: LEGIARTI000019284945}
    - {reference: "décret n° 2018-1120 du 10 décembre 2018 relatif aux modalités d'application du régime micro-social aux professionnels libéraux", id: LEGITEXT000037798308}
    - {reference: "code de la sécurité sociale, L. 133-6-8 (prestations calculées sur le chiffre d'affaires après abattement de 71 %, 50 % ou 34 %)", id: LEGIARTI000033712872}
    - {reference: "code de la sécurité sociale, D. 131-6-3 (fraction du taux pendant l'exonération de début d'activité)", id: LEGIARTI000034163578}
  manque: >-
    Le statut `micro_entrepreneur` route les régimes du commerçant sur le
    revenu reconstitué (chiffre d'affaires après abattement). Depuis 2023,
    les trimestres se valident sur le revenu que la cotisation achète,
    taux global, part de base et taux de base, et le compte notionnel
    porte la part de base et la part complémentaire du forfait
    (`legislation/micro_social.yaml`, D. 613-4, D. 613-6, circulaire Cnav
    n° 2024-23) ; le barème sur le revenu abattu s'en écartait de +39 %
    pour le libéral de 2023, de +13 à +15 % pour la Cipav de 2023 à 2025.
    La saisie prend le chiffre d'affaires et l'activité (champ « micro »),
    l'abat de 71, 50 ou 34 % (L. 613-7, II) et route la Cipav vers les
    régimes du libéral. Non portés : avant 2023, la règle de validation,
    où le revenu abattu valide, et la répartition du forfait, que le
    barème approche sur le revenu abattu ; les points du RCI sur la part
    du forfait.
