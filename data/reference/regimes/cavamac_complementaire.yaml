  manque: >-
    L'assiette est reconstituée par un facteur moyen de commissions, qui ne
    décrit aucun assuré en particulier. La règle d'âge d'avant 2011, publiée
    au seul Bulletin officiel, est supposée celle des statuts de 2011 ; la
    liquidation des carrières longues à 15 % de minoration et le capital
    unique versé sous 1 500 points ne sont pas portés.
