    notes: >-
      LA BAISSE DU TAUX D'APPEL, que la caisse annonce dans son tableau de
      paramètres 2026 : « le taux de cotisation statutaire est de 6,30 %
      au taux d'appel de 121,6 %, soit un taux de cotisation effectif de
      7,66 % des commissions et rémunérations brutes limitées au plafond,
      dont 2,50 % (concours des compagnies mandantes) et 5,16 % (part à la
      charge de l'assuré) ». Le barème de l'IPP porte encore 8,16 % ; la
      caisse fait foi, comme toujours dans ce dépôt. UN TIERS EST PAYÉ PAR
      QUELQU'UN D'AUTRE, ET CE N'EST PAS UN EMPLOYEUR. La fiche des taux
      de la caisse l'énumère à part : « taux de cotisation créateur de
      droits RCO : 6,30 % ; CONCOURS CONVENTIONNEL DES COMPAGNIES
      MANDANTES : 2,50 % des commissions brutes plafonnées ; taux d'appel
      : 121,6 % ; taux de cotisation effectif : 7,66 % », et son tableau
      de paramètres détaille les 7,66 % « dont 2,50 % (concours des
      compagnies mandantes) et 5,16 % (part à la charge de l'assuré) ».
      D'où `part_salariale` = 5,16 / 7,66 = 67,36 %. CE CONCOURS EST AUSSI
      VIEUX QUE LA PROFESSION L'EST SOUS SA FORME ACTUELLE. Le
      gouvernement l'a rappelé au Sénat en 2021 : « depuis 1952, des
      accords conventionnels successifs » font financer le régime en
      partie par les compagnies, et ce concours représentait alors «
      environ 90 millions d'euros, soit plus du tiers des ressources du
      régime » — la même proportion qu'aujourd'hui. C'est pourquoi la part
      de 2026 est reportée sur toutes les périodes : seul son niveau exact
      est daté, son existence ne l'est pas. Le statut
      `agent_general_assurance` n'est DONC PAS marqué `sans_employeur` —
      c'est le seul libéral du catalogue dans ce cas, et il l'est parce
      qu'un tiers paie réellement pour lui. LE RENDEMENT EST PUBLIÉ, ET IL
      EST STABLE : « le coefficient de référence, correspondant au prix
      d'achat d'un point de retraite : fixé à 8,1806 €, maintenant ainsi
      le taux de rendement du régime à 5,04 % ». Valeur de service 0,4123
      € en 2026 : 0,4123 / 8,1806 = 5,0399 %. Le même calcul tombe sur
      5,04 % en 2023 (0,3829 / 7,597) et en 2024 (0,3994 / 7,9246) — la
      caisse pilote ce rendement, et le dit. C'est le rendement HORS TAUX
      D'APPEL ; celui de ce qui est versé se lit dans
      `rendements_points.csv`. LE DÉCRET NE BOUGE PAS : l'article 2 du
      décret n° 67-1169, dans ses onze versions (LEGIARTI000006776899 →
      LEGIARTI000046813836), fixe « la cotisation à 6,30 % du montant des
      commissions et rémunérations » de 1967 à aujourd'hui ; ce qui change
      est l'assiette — commissions brutes (2010), plafond de 413 028 €
      pour 2011 (LEGIARTI000024744283) puis revalorisé chaque année — et
      le taux d'appel, que les délibérations fixent. Les taux de la fiche
      sont les taux appelés reconstitués ; 6,30 % est le contractuel.
      Règles d'âge de l'arrêté du 4 août 2023 : voir la période 2024-2025.
