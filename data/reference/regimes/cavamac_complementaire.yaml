      l'âge prévu à l'article L. 161-17-2 du code de la sécurité sociale
      augmenté de cinq années » (article 15) — 65 ans avant la génération
      de juillet 1951, 67 ans depuis celle de 1955, soit la table du 1° de
      L. 351-8 que la fiche lit à la génération. Avant cet âge, « 5 %
      lorsque la liquidation […] intervient dans les douze mois précédant
      l'âge requis », 10 % du 13e au 24e mois, jusqu'à 25 % du 49e au 60e
      (article 16) : l'année entamée compte entière, et la durée
      d'assurance n'ouvre rien. Au-delà, « une majoration de 5 % du nombre
      de points de retraite acquis […] pour chaque année pleine différée
      […] dans la limite maximum de 25 % » : 1,25 % par trimestre compté
      par années pleines, vingt trimestres au plus. Et « le nombre des
      points de retraite acquis dans le présent régime est majoré de 10 %
      au profit de l'adhérent ayant eu au moins trois enfants »
      (article 18). NON PORTÉS : la majoration de 5 % par enfant ouvrant
      droit à l'allocation d'éducation de l'enfant handicapé (article 19),
      que le modèle ne sait pas dire, et le capital unique de dix-huit
      fois la pension annuelle versé sous 1 500 points (article 21) — la
      pension reste servie en rente, comme celle du RAFP sous son seuil.
