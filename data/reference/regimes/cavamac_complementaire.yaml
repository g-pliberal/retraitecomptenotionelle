      LA MINORATION DEVIENT TRIMESTRIELLE AU 1ER JANVIER 2024. L'arrêté
      du 4 août 2023 (annexe JORFARTI000047977908, dates d'effet à son
      article 2, JORFARTI000047977903) réécrit les articles 15 et 16 des
      statuts : taux plein « de 67 ans » au 1er septembre 2023, puis, au
      1er janvier 2024, une minoration « de 1,25 % par trimestre manquant
      pour atteindre l'âge mentionné au premier alinéa de l'article 15 »
      — l'âge seul, toujours, dès l'âge légal, 25 % au plus à soixante-deux
      ans —, et une majoration de 5 % « pour chaque année pleine COTISÉE
      dans le présent régime » au-delà de 67 ans, hors années de cumul
      emploi-retraite. `surcote_trimestres_cotises` ne compte donc que les
      trimestres cotisés depuis 67 ans, là où les statuts de 2011
      comptaient le temps écoulé. La caisse l'écrit de même et en publie
      un exemple chiffré — né le 8 août 1960, départ le 1er juillet 2026,
      cinq trimestres jusqu'à la date d'effet du taux plein, 6,25 % —, que
      `tests/temoins/exemples_officiels.yaml` rejoue. NON PORTÉE : la
      liquidation dès 62 ou 63 ans des assurés qui ont commencé avant 20
      ou 21 ans, « avec l'application d'un coefficient de minoration de
      15 % » ; le modèle leur oppose la minoration ordinaire, 25 % à 62 ans
      et 20 % à 63. La majoration pour trois enfants et ce qui n'est pas
      porté sont ceux des statuts de 2011, voir la période 2012-2018.
