code: cavp_complementaire
rang: 400
nom: >-
  Régime complémentaire par répartition des pharmaciens (CAVP)
famille: liberal
etage: complementaire
source_id: cavp_mementos
fiabilite: moyenne
creation: 1949
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Pharmaciens et biologistes libéraux. Le complémentaire de la CAVP a DEUX
  VOLETS : celui-ci, en répartition, et un volet en CAPITALISATION par
  classes, qui n'est pas au catalogue — un compte notionnel ne porte que la
  répartition. Sa grille, longtemps réputée illisible, se lit pourtant : la
  part capitalisée vaut (classe − 1) fois une cotisation de référence de
  1 453 € en 2026, sur un revenu de référence qui commence à 85 369 € et
  monte par paliers de 17 662 €. Ce qui manque est la CONVERSION du capital
  en rente, « actuariellement neutre », dont ni les coefficients ni le
  rendement du plan ne sont publiés.
