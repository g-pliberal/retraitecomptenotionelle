    notes: >-
      DÉCRET N° 49-580 DU 22 AVRIL 1949, ARTICLE 2, LU VERSION PAR VERSION
      (dix versions, de 1978 à 2026 ; rien de 1949 à 1977 dans LEGI). La
      cotisation de référence est fixée chaque année par le conseil
      d'administration puis, depuis 2009, par décret : le forfait de la
      fiche, indexé sur les prix, en tient lieu. 1949-1977 : aucune
      version consolidée ; le forfait est reconduit en arrière, niveau
      estimé. COTISATION FORFAITAIRE, ET ELLE L'EST VRAIMENT. Le volet
      capitalisé de ce régime est réparti en classes, mais le volet en
      RÉPARTITION ne l'est pas : le mémento de la caisse aligne les
      classes 3 à 13 en colonnes et la ligne « Part gérée par répartition
      » y porte le même montant partout. 6 880 € en 2024, quel que soit le
      revenu. LA PENSION SE COMPTE EN ANNUITÉS, pas en points : « RÉGIME
      COMPLÉMENTAIRE PAR RÉPARTITION : nombre d'années validées × 320,75
      », écrit le mémento 2024. Le moteur, lui, convertit une cotisation
      par un rendement — et les deux écritures coïncident exactement, la
      cotisation étant constante : 6 880 × 4,66 % = 320,75 €. Une carrière
      de N années rend N × 320,75 € des deux façons. Le régime est
      institué par le décret n° 49-580 du 22 avril 1949, que les arrêtés
      d'approbation de ses statuts visent encore aujourd'hui. UN SEUL
      MILLÉSIME EST PUBLIÉ ICI AUSSI : le forfait de 2024, reconduit en
      euros constants vers l'amont — soixante-quinze ans depuis un seul
      chiffre, et la fiche ne vaut pas mieux que cela.
