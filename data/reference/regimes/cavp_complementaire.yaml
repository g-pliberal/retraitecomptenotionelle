    notes: >-
      DÉCRET N° 49-580 DU 22 AVRIL 1949, ARTICLE 2, LU VERSION PAR VERSION
      (dix versions, de 1978 à 2026 ; rien de 1949 à 1977 dans LEGI). La
      cotisation de référence est fixée chaque année par le conseil
      d'administration puis, depuis 2009, par décret : le forfait de la
      fiche, indexé sur les prix, en tient lieu. 2009-2014
      (LEGIARTI000020081467, 1er juillet 2009) : classe 1 supprimée,
      classe 3 d'office (sept fois la référence), option de 3 à 13 ; la
      cotisation de référence est fixée par décret depuis le 1er janvier
      2009.
      LA MAJORATION DE REPORT DATE DE 2011 : l'arrêté du 23 juin 2011
      (JORFARTI000024270214) écrit à l'article 12 que « la pension de
      retraite est majorée lorsqu'elle est liquidée au-delà de l'âge
      permettant d'obtenir une retraite à taux plein et jusqu'à cet âge
      augmenté de 3 ans pour les affiliés nés à compter du 1er janvier
      1956. Cette majoration est égale à 0,5 % par trimestre », et le
      règlement du 10 juillet 2026 (LEGIARTI000054437738) le reprend.
      Douze trimestres au plus, depuis l'âge du taux plein lu à la
      génération ; les générations 1951 à 1955, bornées à un ou deux
      ans, reçoivent ici trois ans, et celles d'avant juillet 1951, qui
      n'en ont aucune, atteignaient l'âge du taux plein avant 2012.
      Servie à partir de 2012.
      DEUX PENTES DEPUIS L'ARRÊTÉ DU 23 JUIN 2011 (JORFTEXT000024270202),
      repris par l'article 12 du règlement du 10 juillet 2026. Taux plein
      à l'âge du 1° de L. 351-8 pour les nés depuis 1956, à 65 ans
      jusqu'en 1952 et à 66 ans de 1953 à 1955 (table `cavp`) ; minoration
      « 1,25 % par trimestre manquant pour un âge de départ à la retraite
      compris entre l'âge d'ouverture du droit à pension de retraite et 65
      ans ; 0,5 % par trimestre manquant pour un âge de départ à la
      retraite compris entre 65 ans et l'âge permettant d'obtenir une
      pension de retraite à taux plein » : `decote_palier_age: 65`. Un
      pharmacien né en 1975 parti à soixante-quatre ans perd 9 % de cette
      retraite, qu'il ait ou non sa durée, là où la fiche ne lui retirait
      rien. Pour les nés jusqu'en 1955, « les coefficients d'anticipation
      figurent dans un tableau en annexe des présents statuts », que
      l'index ne porte pas : les deux pentes leur sont appliquées depuis
      leur propre âge du taux plein. Le montant des nés depuis 1956 est
      majoré de 4 % et celui des nés de 1953 à 1955 de 2 %, ce que le
      règlement de 2026 écrit en affectant la valeur de service des autres
      générations de 0,96 et de 0,96/0,98 : non porté, le rendement de la
      fiche étant calé sur les générations d'aujourd'hui.
