  manque: >-
    Les dix versions de l'article 2 du décret n° 49-580 datent les grilles
    de classes (option de 1978 à 2015, classes d'office en plafonds depuis
    2015, onze classes depuis 2020), mais la cotisation de référence de
    chaque année n'est pas dans le texte : le forfait indexé sur les prix
    en tient lieu, et rien n'est consolidé avant 1978 ; le volet en
    capitalisation par classes n'est pas chiffré. Les coefficients
    d'anticipation des nés jusqu'en 1955, « en annexe » des statuts de 2011,
    ne sont pas dans l'index : les deux pentes de la minoration leur sont
    appliquées depuis leur propre âge du taux plein, et leur valeur de
    service n'est pas affectée du coefficient de 0,96.
