      AUCUNE MAJORATION DE REPORT AVANT L'ARRÊTÉ DU 23 JUIN 2011 : « pas
      de majoration de pension pour un départ après 65 ans », dit son
      annexe pour les assurés nés avant le 30 juin 1951 ; la fiche
      portait 0,5 % sans texte, que le moteur ne lisait pas.
      LES STATUTS DU 11 MAI 2009 (JORFTEXT000020694598), PREMIERS LUS :
      ceux d'avant sont au Bulletin officiel, et la fiche ne les sert qu'à
      partir de 2009. Article 12 : la retraite entière est acquise « à
      l'âge de 65 ans » ; article 15 : dès 60 ans, « un coefficient
      d'anticipation qui est fonction du nombre de trimestres manquants, à
      la date d'effet des droits, pour atteindre l'âge de 65 ans. Ce
      coefficient est égal à 1,25 % par trimestre manquant dans la limite
      de 20 trimestres » — l'âge seul, la durée n'y peut rien :
      `decote_annulee_par_la_duree: false`, et l'âge du taux plein lu dans
      la table `cavp`. La fiche lisait l'âge d'annulation et la décote du
      régime de base, que la durée annule. Article 17 : « une bonification
      d'un dixième pour tout allocataire ayant eu au moins trois enfants »
      : `majoration_enfants`. Lu le 23 septembre 2026 (action 89).
