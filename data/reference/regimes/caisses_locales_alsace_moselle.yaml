code: caisses_locales_alsace_moselle
nom: >-
  Régimes locaux de retraite des collectivités, des établissements publics et des chambres consulaires d'Alsace-Moselle
famille: fonction_publique
population: >-
  Agents titulaires des départements, des communes et des établissements
  publics du Bas-Rhin, du Haut-Rhin et de la Moselle — et personnel des
  chambres de commerce de Strasbourg, de Colmar et de la Moselle — restés,
  en vertu du droit local, à un « régime obligatoire de retraites institué
  par la collectivité locale » plutôt qu'à la CNRACL, que ces collectivités
  peuvent choisir sans y être tenues. De 1984 à 1993, les listes des
  contributeurs au fonds spécial d'allocation vieillesse nomment les trois
  caisses départementales, les caisses de retraites d'une soixantaine de
  communes (Metz, Strasbourg, Mulhouse, Colmar…), celles des hospices et
  centres hospitaliers de Strasbourg, Colmar, Mulhouse, Metz, Haguenau,
  et la caisse de secours et de pensions du personnel de la chambre de la
  Moselle. La caisse du personnel départemental du Haut-Rhin, dont le
  règlement a été approuvé le 11 juillet 1924 et dont la Caisse des dépôts
  paie les pensions, comptait deux pensionnés fin 2022.
