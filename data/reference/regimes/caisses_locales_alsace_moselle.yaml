    - {reference: "décret n° 2003-1306 du 26 décembre 2003 relatif au régime de retraite des fonctionnaires affiliés à la CNRACL, article 66 (affiliation facultative des collectivités du Haut-Rhin, du Bas-Rhin et de la Moselle ; renonciation des titulaires qui relevaient d'un régime local)", id: LEGIARTI000023414174}
    - {reference: "décret n° 84-104 du 9 février 1984, article 2 (caisses départementales des retraites de la Moselle, du Bas-Rhin et du Haut-Rhin, caisses de retraites des communes et des établissements publics des trois départements)", id: LEGIARTI000006766410}
