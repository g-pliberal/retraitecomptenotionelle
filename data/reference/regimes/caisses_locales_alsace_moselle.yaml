    - {reference: "Caisse des dépôts, page « Régime de la caisse de retraite du personnel départemental du Haut-Rhin » (règlement approuvé par le commissaire général de la République le 11 juillet 1924 ; deux pensionnés au 31 décembre 2022), hors JORF", id: null}
  raison_hors_champ: >-
    Des dizaines de régimes, un par collectivité, chacun sur son
    règlement local, que ni le Journal officiel ni l'index ne publient ;
    les collectivités qui ont rejoint la CNRACL y ont affilié tous leurs
    titulaires, hors ceux qui ont renoncé dans les six mois, et la seule
    caisse dont l'effectif est publié n'a plus que deux pensionnés. Le
    statut territorial route vers la CNRACL, ce qui est juste pour les
    collectivités affiliées.
