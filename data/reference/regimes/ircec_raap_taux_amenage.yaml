    notes: >-
      LA MOITIÉ DU TAUX, PAR LA PERSONNE ET NON PAR LE REVENU. Le II de
      l'article 2 du décret n° 62-420, dans sa rédaction en vigueur depuis
      le 1er janvier 2016 (LEGIARTI000031832007, puis
      LEGIARTI000041766050) : « Pour les personnes tenues de cotiser aux
      régimes […] institués par les décrets n° 61-1304 [le RACL] et
      n° 64-226 [le RACD], le taux de la cotisation au régime institué par
      le présent décret est égal à la moitié de celui prévu au I ». Le
      guide 2026 de l'IRCEC l'applique — « cette cotisation RAAP, au taux
      aménagé de 4 %, vient s'ajouter à celle du RACD » —, son mémo et sa
      page de calcul aussi, « sur les revenus déjà soumis à cotisation
      RACD et/ou RACL ». Les statuts `auteur_dramatique` et
      `auteur_lyrique` portent tout leur revenu au RACD ou au RACL : les
      deux lectures y coïncident.
      UNE FICHE À PART, COMME LA TRANCHE 2 DE L'ARRCO : un barème que tous
      les affiliés du régime ne cotisent pas, que l'affiliation donne aux
      uns et pas aux autres, et dont les points restent des points du RAAP
      (`points_de: ircec_raap`) — même prix d'achat, même valeur de
      service, même rendement. Liquidation : celle du RAAP.
      2,5 % EN 2016 : la moitié des 5 % de la montée en charge du décret
      n° 2015-1877 (article 3 II), qui déroge au taux du I ; la moitié des
      6 %, 7 % et 8 % ensuite. Ce cumul des deux textes est une lecture,
      non une citation : aucun des deux ne l'écrit en chiffres.
