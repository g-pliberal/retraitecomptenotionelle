population: >-
  Auteurs et compositeurs dramatiques (SACD) et auteurs et compositeurs de
  musique (SACEM) : ils cotisent au RAAP comme tout artiste-auteur, mais à
  la MOITIÉ du taux, parce qu'ils cotisent déjà au RACD ou au RACL.
