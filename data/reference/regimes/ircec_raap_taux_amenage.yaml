  manque: >-
    Un barème du RAAP, non un régime : la moitié du taux pour qui cotise au
    RACD ou au RACL, dont les points sont ceux du RAAP. Il en partage les
    manques — seuil d'affiliation de 900 SMIC horaires et minimum de trente
    points non appliqués.
