  manque: >-
    Les bonifications de SERVICE — dépaysement, campagne, services aériens —
    ne sont pas servies, faute de connaître le corps et le détail des
    services ; celle du cinquième l'est aux militaires (L. 12, i), aux
    policiers et aux surveillants pénitentiaires depuis octobre 2026 ; la
    radiation par limite d'âge de grade, qui ouvre la pension militaire quelle
    que soit la durée accomplie, ne l'est pas non plus, le grade n'étant pas
    saisi. Les fonctionnaires de La Poste et d'Orange ont la même pension
    mais une contribution employeur propre depuis 2006, non distinguée. Le
    temps partiel ne compte qu'à sa quotité dans les services, et le modèle,
    qui ne la saisit pas, le compte à temps plein ; ni le rachat d'études ni
    la surcotisation ne sont servis ; le plafond du dernier traitement de la
    majoration pour enfants (L. 18, V) et l'écrêtement du minimum garanti
    par le total des pensions ne sont pas appliqués.
