      d'extension du 15 avril 2024, JORFTEXT000049424935) : « suppression
      des coefficients de solidarité et des coefficients majorants
      appliqués dans le régime depuis 2019 », pour les retraites prenant
      effet à compter du 1er décembre 2023 et, à compter du 1er avril
      2024, pour celles déjà minorées. Le barème ne change pas ; seule la
      liste des avantages perd le coefficient de solidarité. La fiche
      coupe au 1er janvier 2024, sa granularité étant l'année.

