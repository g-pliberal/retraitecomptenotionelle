    notes: >-
      ACCORD NATIONAL INTERPROFESSIONNEL DU 17 NOVEMBRE 2017, étendu et
      élargi par l'arrêté du 24 avril 2018 (JORFTEXT000036847920, articles
      JORFARTI000036847923 et JORFARTI000036847926, au visa de L. 921-4) :
      régime unique au 1er janvier 2019, deux tranches, taux de calcul des
      points 6,20 % sur la tranche 1 (0 → 1 PASS) et 17 % sur la tranche 2
      (1 → 8 PASS), taux d'appel 127 % (loi n° 2018-32,
      JORFARTI000036526047) — 7,87 % et 21,59 % prélevés, répartis 40/60
      (article 38). L'abattement n'est pas la décote du régime de base :
      le régime publie ses propres COEFFICIENTS D'ANTICIPATION, en deux
      tables — l'une indexée sur les trimestres manquants (0,99 à 0,78 de
      un à vingt), l'autre sur l'âge (1 à 0,43 pour dix ans
      d'anticipation) — et retient la plus avantageuse ; l'âge du taux
      plein et la durée sont lus à la génération, ce qui porte la loi du
      14 avril 2023. La majoration pour enfants est PLAFONNÉE en euros : 2
      367,48 € par an pour les pensions servies depuis le 1er novembre 2024,
      inchangés au 1er novembre 2025 (circulaires 2024-12-DT et 2025-16),
      revalorisés comme la valeur de service du point, opposables aux
      seuls assurés nés à compter du 2 août 1951. COEFFICIENTS DE
      SOLIDARITÉ (ANI du 30 octobre 2015, JORFARTI000031602387) : malus de
      10 % pendant trois ans, au plus jusqu'à 67 ans, pour les assurés nés
      à compter de 1957 liquidant au taux plein sans différer d'un an, et
      coefficients majorants pour qui diffère de deux ans ou plus. Ce sont
      des dispositifs d'incitation d'âge : le coefficient de conversion
      actuariel les remplace dans les scénarios notionnels.

