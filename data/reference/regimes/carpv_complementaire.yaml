      DURÉE. « Il fonctionne selon un système à points et prend en compte
      uniquement l'âge de départ (et non la durée de cotisation) », écrit
      la caisse : départ possible à 60 ans, taux plein automatique à 65
      ans, décote de 1,25 % par trimestre manquant avant 65 ans, et « il
      n'existe pas de surcote dans le régime complémentaire au-delà du
      taux plein ». D'où une durée requise nulle et une surcote absente,
      là où les autres sections libérales suivent la génération. UNE
      MAJORATION N'EST PAS PORTÉE : la bonification de 10 % pour trois
      enfants et plus, que la caisse accorde dans les deux régimes. Les
      fiches voisines ne la portent pas davantage. La borne de début est
      celle du décret n° 50-1318 du 21 octobre 1950, qui institue le
      régime au sein de la caisse créée deux ans plus tôt.
