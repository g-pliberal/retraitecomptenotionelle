  section: non_salaries
  rang: 140
  nom: Complémentaire des vétérinaires (CARPV)
  population: Vétérinaires libéraux
  couverture: partiel
  statuts: [veterinaire]
  textes:
    - {reference: "décrets annuels fixant les cotisations du régime complémentaire des vétérinaires (depuis 2016)", id: null}
  manque: >-
    Dix périodes suivent les onze versions de l'article 2 du décret n°
    50-1318 (actes médicaux par âge de 1950 à 1997, classes de revenu en
    AMV de 1998 à 2014, points depuis 2015), mais aucun montant d'époque
    n'est dans le texte — la valeur de l'acte et le prix du point sont
    fixés hors index — : la grille de 2016 indexée sur les prix tient lieu
    de montant avant 2016. La règle d'âge — taux plein à 65 ans, 1,25 % par
    trimestre avant, que la durée n'annule pas — et la bonification pour
    trois enfants ne sont lues que dans les statuts de 2021 : la première
    est supposée la même avant, la seconde n'est servie que depuis 2022.
