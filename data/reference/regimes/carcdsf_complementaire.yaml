    notes: >-
      LES STATUTS DU 13 AVRIL 2011 (JORFTEXT000023909782). Ouverture à
      l'âge de L. 161-17-2, taux plein à ce même âge « majoré de cinq ans
      » — l'âge d'annulation des tables communes pour toutes les
      générations concernées —, et une minoration « fonction de l'âge
      atteint », que la durée n'annule pas : 5 % par année d'anticipation
      pour les nés avant le 1er juillet 1951, 1,50 % par trimestre
      manquant pour les nés à compter du 1er janvier 1955 depuis l'arrêté
      du 9 juillet 2012 (JORFTEXT000026208359), et entre les deux un
      tableau que le Journal officiel ne publie qu'en image, où 1,25 %
      tient lieu. Les taux sont lus à la génération dans la table
      `carcdsf_2011` de `legislation/ages_regimes.csv`. « A taux majoré »
      : 1 % par trimestre civil entier d'exercice libéral au-delà de l'âge
      du taux plein, dans la limite de 20 %. L'anticipation des mères
      devient d'« une année d'anticipation par enfant mis au monde, dans
      la limite de cinq années ».
