  manque: >-
    La CARSAF des sages-femmes, fusionnée dans la CARCDSF en 2009, avait son
    propre barème avant : les sages-femmes d'avant 2009 reçoivent celui des
    dentistes. Les statuts d'avant 2007, publiés au Bulletin officiel, ne
    sont pas lus : avant 2008 la fiche garde la règle d'âge du régime de
    base. Le tableau de minoration des nés de juillet 1951 à 1954 (arrêté du
    9 juillet 2012) n'est publié qu'en image, et 1,25 % par trimestre en
    tient lieu.
