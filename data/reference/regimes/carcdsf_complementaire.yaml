      PREMIER EXERCICE LU DANS UN MÉMENTO. « Cotisation forfaitaire :
      2 690,40 €. Cotisation proportionnelle : 10,65 % des revenus
      professionnels non-salariés 2019 compris entre 0,85 % et 5 fois la
      valeur du PASS 2020, soit entre 34 966 € et 205 680 €. »
      Le même mémento donne les six points du forfait et la valeur de
      service en regard — 26,53 € —, d'où un prix du point de 448,40 € et
      un rendement de 5,92 %. Sa note 5 tranche enfin la question que
      cette fiche posait en hypothèse : « 18 181 € / 448,40 € = 40,54
      points », c'est-à-dire que la part PROPORTIONNELLE achète au prix du
      forfait. Ce n'est plus une supposition, c'est l'arithmétique de la
      caisse.
