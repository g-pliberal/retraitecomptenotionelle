    notes: >-
      LA COTISATION PROPORTIONNELLE EST INSTITUÉE EN 1997, sur la tranche
      0,85 – 5 plafonds. Son taux vient du barème IPP « Cotisation de
      sécurité sociale pour la retraite complémentaire des professions
      libérales », colonne des chirurgiens-dentistes, qui le tient des
      décrets annuels : 8 % en 1997 (décret 97-830 du 4 septembre 1997),
      puis un relèvement presque chaque année jusqu'à 10,65 % en 2018.
      Là où le barème IPP et les mémentos de la caisse se recouvrent —
      2020, 2021 et 2022 —, ils donnent le même taux ; à partir de 2023
      le barème IPP n'est plus tenu à jour et c'est la caisse qui fait
      foi. Le forfait, lui, reste extrapolé depuis 2020.
