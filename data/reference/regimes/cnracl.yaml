      Ordonnance du 17 mai 1945. Règles calquées sur le code des pensions.
      Catégorie active : ouverture à 55 ans (agents hospitaliers, police
      municipale, sapeurs-pompiers…). SIX POUR CENT JUSQU'EN 1983, comme à
      l'État : la fiche portait 7 % dès 1945. La transcription
      d'OpenFisca-France du barème de la caisse
      (`cotisations_secteur_public/cnracl/salarie/cnracl_s_ti`) suit, marche
      pour marche, la retenue de l'article L. 61 — 6 % en 1947, 7 % en 1984,
      7,7 % au 1er août 1986, 7,9 % au 1er juillet 1987, 8,9 % au 1er
      janvier 1989, 7,85 % au 1er février 1991 — ; le décret du 7 février
      2007 ne fait que constater cet alignement. Les périodes qui suivent
      la reprennent, une par taux, DATÉES AU 1er JANVIER comme à l'État :
      une marche de milieu d'année ne commande que l'année suivante.
      `verifier_donnees.py` le confronte aux fiches à chaque exécution.
