      Réforme de 2010 : âge d'ouverture porté à 62 ans, âge d'annulation de
      la décote à 67. La période s'arrêtait à tort en 2011 avec les
      paramètres de 2023, ce qui opposait l'âge légal de 64 ans à des
      liquidations de 2011. Paramètres alignés sur ceux de l'État, dont ce
      régime partage le code des pensions.
      La retenue monte ensuite d'une marche par an jusqu'en 2020, et chaque
      marche a sa période depuis que la série d'OpenFisca-France de
      l'article L. 61 est confrontée aux fiches : 8,12 % en 2011, là où la
      fiche portait 10,29 % — le taux de 2017 — sur toute la période
      2011-2022.
