    surcote_par_trimestre: null
    avantages_non_contributifs: [bonifications, categorie_active, majoration_enfants, reversion, minimum_garanti]
    notes: >-
      Ordonnance du 17 mai 1945. Règles calquées sur le code des pensions.
      Catégorie active : ouverture à 55 ans (agents hospitaliers, police
      municipale, sapeurs-pompiers…).
      SEPT POUR CENT JUSQU'EN 1989 SEULEMENT, et la fiche les servait
      jusqu'en 2003. L'article L. 61 du code des pensions, lu dans la base
      LEGI, porte « une retenue de 8,9 % » du 30 décembre 1989 au 1er
      février 1991, puis « une retenue de 7,85 % » jusqu'au 1er janvier
      2006 — date à laquelle l'article cesse d'écrire un taux et renvoie
      au décret. La baisse du 1er février 1991 ne commande donc que 1992 :
      1991 porte encore 8,9 %, comme le régime général porte encore ses
      15,8 % cette année-là. Compter 7 % de 1992 à 2003, c'est oublier un
      huitième de la cotisation pendant douze ans : le scénario 1 n'en
      dépend pas, le compte notionnel en dépend entièrement. La CNRACL ne fixe pas son
      taux : le décret du 7 février 2007 le cale sur celui de l'État, et
      la fiche le suit depuis toujours.
