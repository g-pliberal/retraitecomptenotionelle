  rang: 50
  nom: Régime général de la Sécurité sociale (Cnav)
  population: Salariés du secteur privé, et depuis 2018 les artisans et commerçants
  couverture: modelise
  statuts: [salarie_prive_non_cadre, salarie_prive_cadre, contractuel_public, artisan, commercant,
            artiste_auteur, personnel_navigant, agent_sncf, agent_ratp, agent_ieg, mineur,
