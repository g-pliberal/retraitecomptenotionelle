nom: >-
  Prestations complémentaires de vieillesse des directeurs de laboratoire
  non médecins conventionnés (PCV, ex-ASV)
famille: liberal
etage: additionnel
source_id: legifrance_textes
fiabilite: estimee
creation: 1981
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Pharmaciens biologistes libéraux, directeurs de laboratoire privé
  d'analyses médicales conventionnés, affiliés à la CAVP ; le biologiste
  médecin relève de la CARMF. Obligatoire depuis le 1er juillet 1981
  (décret n° 81-1046), réformé par le décret n° 2007-597 du 24 avril 2007 :
  un forfait qui ouvre 262 points par an, et depuis 2008 une cotisation
  d'ajustement sur le revenu, dans la limite de cinq plafonds, qui en ouvre
  cinquante au plafond, au prorata en deçà. L'assurance maladie paie les
  deux tiers du forfait et la moitié de l'ajustement ; la fiche porte la
  part du biologiste, et les fractions `part_assurance_maladie_*` celle
  des caisses, que le compte notionnel reçoit comme une part patronale.
  ÂGES : « être âgé de 67 ans », et « La retraite peut être prise à partir
  de 60 ans avec coefficient d'anticipation » (guide de l'assurance
  vieillesse des professions libérales, CNAVPL, 2025, p. 93), que le guide
  ne chiffre pas : la fiche présume 1,25 % par trimestre, celui des
  auxiliaires médicaux. Le règlement de la section approuvé par l'arrêté
  du 10 juillet 2026 n'est pas lu.
hors_repartition: false
