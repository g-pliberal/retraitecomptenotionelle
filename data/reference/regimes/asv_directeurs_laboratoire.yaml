  nom: Prestations complémentaires de vieillesse des directeurs de laboratoire non médecins conventionnés (PCV, ex-ASV)
  population: Pharmaciens biologistes directeurs de laboratoire conventionnés
  couverture: partiel
  statuts: [biologiste_liberal]
  textes:
    - {reference: "décret n° 81-1046 du 24 novembre 1981 relatif au régime des prestations supplémentaires de vieillesse des directeurs de laboratoires privés d'analyses médicales", id: LEGITEXT000006063390}
    - {reference: "décret n° 2007-597 du 24 avril 2007, articles 1er à 3 (forfait, ajustement, valeur de service)", id: LEGIARTI000046813870}
  manque: >-
    Les points d'avant 2008, que l'index ne chiffre pas : la fiche présume
    la règle de 2008, 262 points par an sans ajustement, et le forfait de
    2008. Les valeurs de service propres aux points acquis avant 2006, par
    tranche d'années, de 0,35 à 1,40 € en 2008, plus hautes que celle des
    points d'après, qui sert à tous. La revalorisation du forfait sur le
    coefficient de L. 161-25 majoré de deux points depuis 2023, et celle
    de la valeur de service minorée d'un demi-point depuis 2022 : les prix
    en tiennent lieu. Le coefficient d'anticipation, présumé. L'arrondi au
    dixième supérieur des points d'ajustement, et l'assiette de
    l'avant-dernière année. Le partage avec l'assurance maladie, lu pour
    2025, est présumé à toutes les années.
