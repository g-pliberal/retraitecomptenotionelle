      PRÉSOMPTION, AVANT LE DÉCRET DE 2007. Le régime est rendu obligatoire
      au 1er juillet 1981 (décret n° 81-1046), ses cotisations et ses
      prestations exprimées en lettres clés, que l'index ne chiffre pas.
      La fiche présume la règle de 2008 sans ajustement — « Le nombre de
      points attribués en contrepartie de cette cotisation forfaitaire est
      fixé à […] 262 à compter de l'exercice 2008 » (décret n° 2007-597,
      article 1er, LEGIARTI000006263088), 65,5 par trimestre — et le
      forfait de 2008, 1 080 € dont le tiers au biologiste, projeté en
      arrière sur les prix. Les points d'avant 2006 ont leur propre valeur
      de service, de 0,35 à 1,40 € selon l'année d'acquisition en 2008
      (article 3, II), que le modèle ne sert pas : il les vaut au point
      d'après 2006, 0,30 € en 2008. Niveau `estimee`.
