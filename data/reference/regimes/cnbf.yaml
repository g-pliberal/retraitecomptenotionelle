      au taux plein  cotisation forfaitaire de 1 845 € à partir de la
      sixième année, 3,1 % du revenu net.
      Même régime que la période précédente, dont la note dit tout ; une
      seule différence, pour les pensions prenant effet depuis le 1er
      septembre 2023 : L. 653-3, créé par l'article 21 de la loi
      n° 2023-270, étend aux avocats L. 351-12, la majoration de 10 % pour
      trois enfants (`majoration_enfants`). La fiche la date de 2024, à
      l'année près, comme la surcote de la CNAVPL de la même loi ; la caisse
      écrit « au 1er octobre 2023 ou postérieure pour le régime de base ».
      La majoration de durée d'assurance que le même article ouvre
      (L. 351-4 à L. 351-4-2) n'est pas portée.
