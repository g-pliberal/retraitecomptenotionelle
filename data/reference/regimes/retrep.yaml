    - {reference: "arrêté du 24 mars 1987 désignant l'Association pour la prévoyance collective pour liquider et payer les avantages du décret n° 80-7, à compter du 1er juin 1987", id: LEGIARTI000006462912}
  manque: >-
    Aucun statut ne porte le maître du privé jusqu'au départ anticipé : le
    statut `maitre_enseignement_prive` route le régime général,
    l'Agirc-Arrco et le régime additionnel, et liquide au droit commun.
    Manquent l'âge du maître titulaire public (cinquante-cinq ans pour
    quinze ans d'échelle d'instituteur, soixante sinon, puis les âges de
    la fonction publique), la condition de quinze ans de services, et
    l'avantage lui-même : une pension du régime général et de la
    complémentaire liquidées comme à l'âge du taux plein, sur les seuls
    services d'enseignement, servies jusqu'à la pension réelle du régime
    général à taux plein, puis éteintes. La fiche
    `retrep_avantages_temporaires` le décrit version par version.
