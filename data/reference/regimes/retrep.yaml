code: retrep
nom: >-
  Régime temporaire de retraite des maîtres de l'enseignement privé sous contrat (RETREP)
famille: fonction_publique
population: >-
  Maîtres contractuels ou agréés, et documentalistes, des établissements
  d'enseignement privés liés à l'État par contrat (L. 914-1 du code de
  l'éducation) : salariés affiliés au régime général et à l'Agirc-Arrco,
  ils peuvent cesser leur activité aux âges des maîtres titulaires de
  l'enseignement public et toucher, jusqu'à leur pension du régime général
  à taux plein, des « avantages temporaires de retraite » que l'État paie
  seul (décret n° 80-7 du 2 janvier 1980, puis R. 914-120 à R. 914-140 du
  code de l'éducation depuis le 29 décembre 2008, L. 914-1-1 depuis le
  30 décembre 2011).
creation: 1980
