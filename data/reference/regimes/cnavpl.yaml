  - debut: 1949
    fin: 2003
    type_calcul: points
    age_ouverture: 65
    age_taux_plein: 65
    duree_requise_trimestres: null
    taux_plein: 1.0
    salaire_reference: carriere_entiere
    assiette: plafonnee_5_pass
    taux_cotisation_retraite: 0.085
    points_par_trimestre_valide: 100
    decote_par_trimestre: null
    surcote_par_trimestre: null
    avantages_non_contributifs: [minimum_vieillesse, reversion]
    notes: >-
      LE DROIT D'AVANT 2004 N'EST PAS PROPORTIONNEL AU REVENU, et la fiche
      le faisait croire. Le régime servait une ALLOCATION VIEILLESSE, la
      même pour le notaire et pour le kinésithérapeute : la moitié de
      l'AVTS à l'origine, son montant entier depuis le décret n° 62-439 du
      14 avril 1962, puis, le 1er janvier 1983, « 1/15e d'AVTS par année
      cotisée », la condition de quinze années d'activité ayant été
      supprimée (les périodes au-delà de quinze ans comptent depuis le
      1er juillet 1978). La réforme du 21 août 2003 a converti ce droit en
      points, et la règle de conversion est publiée : « les trimestres
      validés avant le 1er janvier 2004 sont convertis en points à raison
      de cent points par trimestre » (D. 643-1, cité par le recueil
      statistique de la CNAVPL). C'est `points_par_trimestre_valide`, et le
      revenu n'y entre que par les trimestres qu'il valide.
      Le moteur portait auparavant 8,5 % du revenu ENTIER, sans plafond, au
      rendement de 8 % : trente ans de carrière à 200 000 € y ouvraient
      40 000 € de pension de base, quand le régime en servait 3 809 € en
      moyenne en 2003 — quarante ans de cotisations ne pouvant dépasser
      16 000 points, soit 10 500 € au point de 2025.
      CE QUI RESTE CONVENTIONNEL EST LA COTISATION, non la pension. La
      cotisation de base était forfaitaire jusqu'en 1992 ; le 1er janvier
      1993 (loi n° 91-73 du 18 janvier 1991), « une fraction de la
      cotisation du régime de base est devenue proportionnelle aux revenus,
      dans la limite de 5 fois le plafond de la sécurité sociale ». Faute de
      la série des forfaits, le compte notionnel prélève ici 8,5 % du revenu
      BORNÉ À CINQ PLAFONDS — le plafond que le régime s'est lui-même donné
      en 1993. C'est une convention, et elle est nommée : elle ne touche que
      le scénario notionnel, la pension du système actuel ne dépendant plus,
      pour ces années, que des trimestres.
  - debut: 2004
    fin: 2009
    type_calcul: points
    age_ouverture: 62
    age_ouverture_par_generation: age_legal_par_generation
    age_taux_plein: 67
    age_taux_plein_par_generation: age_annulation_decote
    duree_requise_trimestres: 172
    duree_requise_par_generation: duree_requise_par_generation
    taux_plein: 1.0
    decote_par_generation: bareme_minoration_regimes_en_points
    points_maximum: 450
    salaire_reference: carriere_entiere
    assiette: plafonnee_085_pass
    taux_cotisation_retraite: 0.086
    decote_par_trimestre: 0.0125
    surcote_par_trimestre: 0.0075
    surcote_points: surcote_regime_general
    avantages_non_contributifs: [minimum_vieillesse, reversion]
    notes: >-
      Réforme du 21 août 2003 : régime de base unique en points,
      proportionnel au revenu, sur DEUX TRANCHES — d'où deux fiches par
      période, qui se cumulent comme le fait la cotisation elle-même.
      PREMIÈRE TRANCHE avant 2015 : 0 à 0,85 plafond, 450 points au maximum
      (D. 643-1 dans sa rédaction de 2004). Le régime n'attribue pas un nombre
      de points proportionnel à la cotisation mais un nombre PLAFONNÉ de points
      par tranche : c'est un barème en points, et c'est lui — et non un prix
      d'achat, que la caisse ne publie pas — qui convertit ici le revenu en
      droits.
      L'ASSIETTE MINIMALE est portée hors de la fiche, par
      `legislation/assiette_minimale_independants.csv`, que le moteur lit
      pour tous les libéraux : D. 642-4 la chiffre sans discontinuer — 200
      fois le SMIC horaire de 2004 à 2011, 5,25 % du plafond de 2012 à
      2014, 7,70 % en 2015, 11,5 % de 2016 à 2022, 450 fois le SMIC horaire
      depuis 2023 —, et elle valide trois trimestres. La note qui la disait
      absente datait d'avant ce fichier.
      LE TAUX EST CELUI DE LA LOI, et il bouge quatre fois en onze ans :
      8,6 % de 2004 à 2011, 8,63 % en 2012, 9,75 % en 2013, 10,1 % en 2014
      (D. 642-3, versions successives lues dans la base LEGI). La fiche portait
      8,23 % sur toute la période — le taux de 2015, reporté en arrière faute
      de série. Cela ne déplace pas les points acquis, qui ne dépendent pas du
      taux, mais le flux versé au compte notionnel, sous-estimé de près d'un
      cinquième en 2014.
      LA SURCOTE EST SERVIE, ET C'EST CELLE DU RÉGIME GÉNÉRAL : R. 643-8
      (LEGIARTI000006751834) la donne « au titre des périodes d'activité
      ayant donné lieu à cotisations à la charge de l'assuré accomplies
      à compter du 1er janvier 2004 après l'âge prévu au premier alinéa
      de l'article L. 351-1 et au-delà de la limite mentionnée au
      deuxième alinéa du même article », à 0,75 % par trimestre. La
      branche en points du moteur ne lisait pas ce champ, et la fiche
      l'écrivait pour rien ; `surcote_points: regime_general` la fait
      compter comme la branche en annuités, trimestres cotisés au-delà
      de l'âge légal et de la durée requise.
