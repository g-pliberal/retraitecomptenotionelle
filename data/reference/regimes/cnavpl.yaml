fiabilite: moyenne
creation: 1949
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Professions libérales réparties en dix sections professionnelles
  (CARMF, CARPIMKO, CARCDSF, CAVP, CAVEC, CAVAMAC, CAVOM, CIPAV, CRN, CAVA).
hors_repartition: false
inventaire:
  section: non_salaries
  rang: 90
  nom: Caisse nationale d'assurance vieillesse des professions libérales, régime de base
  population: Professions libérales réglementées et, jusqu'en 2018, non réglementées
  couverture: partiel
  statuts: [profession_liberale, liberal_non_reglemente, auxiliaire_medical, pharmacien,
            expert_comptable, agent_general_assurance, notaire, veterinaire,
            officier_ministeriel, chirurgien_dentiste_ou_sage_femme, medecin_liberal]
  textes:
    - {reference: "loi n° 48-101 du 17 janvier 1948", id: null}
    - {reference: "code de la sécurité sociale, L. 640-1 (professions affiliées, rédaction de la LFSS 2018)", id: LEGIARTI000036391511}
    - {reference: "loi n° 2017-1836 du 30 décembre 2017, article 15 (les libéraux hors L. 640-1 affiliés avant le 1er janvier 2019 restent à la CNAVPL et à la Cipav)", id: JORFARTI000036339157}
    - {reference: "code de la sécurité sociale, D. 643-1", id: LEGIARTI000029825121}
    - {reference: "code de la sécurité sociale, L. 643-1-1 (majoration de durée d'assurance pour enfants, pensions prenant effet depuis le 1er avril 2010)", id: LEGIARTI000021537910}
  manque: >-
    Le libéral non réglementé installé depuis 2019 relève du régime général
    et du RCI, celui installé avant reste à la CNAVPL et à la Cipav : le
    statut `liberal_non_reglemente` le route ainsi, à la date d'installation.
    Le droit d'option de 2019 à 2023, par lequel un affilié d'avant pouvait
    rejoindre la sécurité sociale des indépendants, n'est pas porté ; ni la
    cotisation de la CNAVPL sur les revenus d'avant 1949, qui n'existait pas.
    Les cent points que D. 643-1 attribue au trimestre d'un accouchement ne
    le sont pas non plus : le modèle ne connaît pas la date de naissance des
    enfants.
