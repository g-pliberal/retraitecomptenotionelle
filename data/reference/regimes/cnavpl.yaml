    notes: >-
      LE TAUX DE T1 PASSE À 8,73 % EN 2025, et le barème en points suit :
      557 points au plafond au lieu de 525, soit exactement le rapport des
      deux taux — le prix d'achat d'un point ne bouge pas. La hausse
      accompagne la réforme de l'assiette des indépendants (article 18 de
      la loi n° 2023-1250 du 26 décembre 2023), qui asseoit la cotisation,
      à partir de 2026 et sur le revenu 2025, sur le chiffre d'affaires
      diminué des charges puis d'un abattement de 26 %. Les recueils
      statistiques 2024 et 2025 de la CNAVPL portent l'un et l'autre ce
      tableau, et ils concordent. La fiche le lisait encore à 8,23 % et
      525 points : le taux venait d'une phrase de l'historique — « le taux
      de la première tranche est de 8,23 % » — qui décrit la réforme de
      2015, non l'année du recueil. La réforme de l'assiette, elle, n'est
      pas modélisée : la carrière saisie porte un revenu, pas un chiffre
      d'affaires. D. 642-3 lu version par version (quinze versions,
      LEGIARTI000006738112 → LEGIARTI000049904651) : 8,6 % sous 85 % du
      plafond et 1,6 % au-delà dès 2004 (LEGIARTI000006738115), 9,75 % et
      1,81 % en 2013, 10,1 % et 1,87 % en 2014 (LEGIARTI000026704782),
      8,23 % sous le plafond et 1,87 % jusqu'à cinq plafonds dès le 19
      juillet 2015 (LEGIARTI000030910750), 8,73 % pour les périodes
      courant à compter du 1er janvier 2025 (LEGIARTI000049904651) : la
      fiche coïncide. L. 643-3 dans sa rédaction de la loi n° 2025-1403 du
      30 décembre 2025 (LEGIARTI000053280388), aux pensions prenant effet
      à compter du 1er septembre 2026, ouvre une majoration de pension
      pour les trimestres cotisés l'année précédant l'âge légal aux
      assurés qui ont des trimestres d'enfants : non portée.
      LA SURCOTE PASSE À 1,25 % : R. 643-8 dans sa rédaction du décret
      n° 2023-799 du 21 août 2023 (LEGIARTI000047985850), « 0,75 % par
      trimestre accompli avant le 1er septembre 2023 et à 1,25 % par
      trimestre accompli à compter de la même date ». La fiche
      l'applique aux liquidations à partir de 2024, première année
      pleine ; les trimestres d'avant septembre 2023 y sont donc servis
      à 1,25 % au lieu de 0,75 %, même approximation que la fiche du
      régime général en 2009.
