inventaire:
  section: prive_complementaires
  rang: 110
  nom: Institution de retraite complémentaire des agents non titulaires de l'État et des collectivités publiques
  population: >-
    Agents non titulaires des trois fonctions publiques, élus locaux,
    membres du CESE entrés en fonction depuis le 1er septembre 2023,
    praticiens hospitaliers (le « régime des médecins » de l'échantillon
    interrégimes : une assiette aux deux tiers des émoluments, non un
    régime distinct)
  couverture: modelise
  statuts: [contractuel_public,
            elu_local, membre_cese]
  textes:
    - {reference: "décret n° 70-1277 du 23 décembre 1970", id: null}
    - {reference: "arrêté du 30 décembre 1970 relatif aux modalités de fonctionnement du régime", id: LEGITEXT000024251295}
    - {reference: "arrêté du 18 juillet 1983 et arrêté du 7 mars 1986 relatifs à l'assiette de cotisations à l'Ircantec de certains membres du corps médical des établissements hospitaliers publics (deux tiers des émoluments hospitaliers, hors gardes et astreintes)", id: LEGITEXT000006073794}
periodes:
  - debut: 1971
    fin: 1982
    type_calcul: points
    age_ouverture: 60
    age_taux_plein: 65
    duree_requise_trimestres: null
    taux_plein: 1.0
    salaire_reference: carriere_entiere
    abattement_points: coefficient_anticipation_ircantec
    assiette: tranche_1
    taux_cotisation_retraite: 0.0210
    part_salariale: 0.40
    decote_par_trimestre: 0.01
    surcote_par_trimestre: null
    avantages_non_contributifs: [majoration_enfants, reversion]
    notes: >-
      L'ANTICIPATION SUIT L'ARRÊTÉ, ET C'EST UN ESCALIER. L'article 16 de
      l'arrêté du 30 décembre 1970 (LEGIARTI000006381606, état courant
      LEGIARTI000048065521) donne le coefficient 0,43 dix ans avant l'âge
      normal, « majoré de 0,017 5 par trimestre » jusqu'à cinq ans avant,
      de 0,012 5 par trimestre sur les deux années suivantes et de 0,01 sur
      les trois dernières ; son paragraphe 2 applique le même barème à la
      DURÉE manquante sans pouvoir descendre sous le coefficient de l'âge,
      et son 6° c) exonère, « à compter du 1er avril 1983 », qui a le taux
      plein au régime de base. C'est mot pour mot le barème de
      l'Agirc-Arrco, d'où `abattement_points: ircantec`, qui le partage.
      La fiche portait 1,1 % par trimestre, taux moyen juste aux deux
      extrémités du barème et faux entre les deux ; `decote_par_trimestre`
      garde la première marche, comme à l'Agirc, et n'est plus lue.
      LES TAUX SONT CEUX DU PRODUCTEUR, année par année. La fiche portait
      5,75 % sur toute la période 1971-2008 : le taux appelé sur la
      tranche A valait 2,10 % jusqu'en 1982 et n'a atteint 5,63 % qu'en
      1992. Le régime achetant ses points avec la cotisation — points =
      cotisation / (taux d'appel × salaire de référence) —, un agent des
      années 1970 recevait DEUX FOIS ET DEMIE les points que le barème lui
      donnait. Les taux appelés des deux tranches sont dans le fichier
      `IRC_BAR_01_txcotis.csv` que publie la Caisse des dépôts, qui GÈRE le
      régime : c'est le producteur, et ce fichier porte déjà, dans ce dépôt,
      le taux d'appel et le salaire de référence.
      LA RÉPARTITION N'EST PLUS UNE CONVENTION : ELLE EST PUBLIÉE, ET LA
      TRANCHE B A BOUGÉ. La fiche reportait sur toute la série les parts
      des barèmes 2025 et 2026 — 40 % / 60 % sur la tranche A, 35,64 % /
      64,36 % sur la tranche B — faute d'une série publiée. Elle existe :
      l'annexe 4-4 de la base documentaire du régime
      (`baseircantec.retraites.fr`, « Évolution des taux de cotisations »,
      lue le 22 septembre 2026) donne les taux appelés PART PAR PART à
      chaque date d'effet depuis 1925, et l'annexe 8-1 fait de même pour
      les taux théoriques depuis 1935. La tranche A y vaut 40 % de l'agent
      d'un bout à l'autre, à quatre centièmes de point près : la convention
      était juste, et elle est maintenant lue. La tranche B, non — l'agent
      en portait 34 % de 1971 à 2010 (2,55 sur 7,50 en 1971, 5,95 sur 17,50
      en 1992, 6,00 sur 17,60 en 2011), et la part n'est montée à 35,64 %
      que par paliers annuels, de 2011 à 2017. La reporter en arrière
      faisait payer à un contractuel des années 1990 un point et demi de
      cotisation de plus que ce que le régime lui retenait, et d'autant
      moins à son employeur.
      L'ÂGE EST CELUI DE L'ARTICLE 16 DE L'ARRÊTÉ DU 30 DÉCEMBRE 1970, lu
      version par version dans la base LEGI. De 1971 au 30 juin 2011
      (LEGIARTI000006381606 à LEGIARTI000019511923) : « l'allocation de
      retraite est normalement liquidée à l'âge de soixante-cinq ans.
      Cependant elle peut faire l'objet d'une anticipation, au plus tôt à
      cinquante-cinq ans » ; le coefficient vaut 0,43 à cinquante-cinq
      ans, 0,78 à soixante, 0,88 à soixante-deux, 1 à soixante-cinq. La
      fiche en tirait 1,1 % par trimestre, taux MOYEN sur les cinq
      dernières années, qui tombe juste à ses deux extrémités et nulle part
      entre les deux : l'article écrit trois marches, 0,01 par trimestre de
      soixante-deux à soixante-cinq ans, 0,012 5 de soixante à
      soixante-deux, 0,017 5 en dessous. Ce sont celles de l'Agirc-Arrco,
      et c'est `abattement_points: ircantec` qui les porte désormais ;
      `decote_par_trimestre` garde la première marche et n'est plus lue.
      Depuis l'ordonnance de 1982 et la version du 31 août 1983
      (LEGIARTI000006381610), le coefficient n'est pas appliqué à qui
      liquide sa pension du régime général au taux plein — le 6° c) de
      l'article, « à compter du 1er avril 1983 » : c'est ce que dit
      `duree_requise_par_generation` aux périodes postérieures, la lecture
      par la durée s'ajoutant alors à celle par l'âge, comme le veut le
      paragraphe 2. Le décret n° 2008-996
      du 23 septembre 2008 n'a pas touché aux âges (LEGIARTI000019511923
      les répète) : la fiche faisait passer l'Ircantec à 62 et 67 ans dès
      2009, deux ans avant la loi Woerth. Depuis le 1er juillet 2011
      (LEGIARTI000024266924), l'allocation est « normalement liquidée à
      l'âge prévu au 1° de l'article L. 351-8 », avec anticipation « au
      plus tôt dix ans avant », et le coefficient 0,78 s'applique à l'âge
      de l'article L. 161-17-2 : les âges se lisent donc à la génération.
