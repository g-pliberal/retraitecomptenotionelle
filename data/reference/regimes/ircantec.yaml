    notes: >-
      L'ASSIETTE EST LUE DANS LE TEXTE : « l'assiette de cotisation ainsi
      déterminée est toutefois limitée à 4,75 fois le plafond fixé pour
      les cotisations de retraite du régime général », article 7 du décret
      n° 70-1277 (LEGIARTI000006368121), borne que le décret n° 2008-996
      du 23 septembre 2008 porte à huit (LEGIARTI000019515135) — d'où deux
      assiettes, `tranche_2_ircantec` jusqu'en 2008 et `tranche_2` ensuite.
      La fiche portait huit plafonds sur toute la période, et donnait donc
      des points sur une assiette que le régime n'appelait pas ; c'est la
      confrontation à OpenFisca qui l'a fait relire. LA TRANCHE B
      N'EXISTAIT PAS DANS LE CATALOGUE avant la tranche B3, et c'est la
      plus grosse omission qu'il ait portée pour le secteur public
      contractuel : l'Ircantec cotise au-dessus du plafond à un taux appelé
      près de trois fois celui de la tranche A. Un contractuel payé trois fois le salaire
      moyen versait 14 600 € par an au régime sans qu'aucun point ne lui
      soit porté — sa pension Ircantec ne dépassait celle d'un agent payé au
      plafond que de quinze pour cent, quand le droit la lui triple.
