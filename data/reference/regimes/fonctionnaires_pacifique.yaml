code: fonctionnaires_pacifique
rang: 280
nom: >-
  Caisse locale de retraites de Nouvelle-Calédonie (fonctionnaires territoriaux et communaux)
famille: fonction_publique
source_id: sites_institutionnels
fiabilite: estimee
creation: 1959
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Fonctionnaires de la Nouvelle-Calédonie, des provinces et des communes,
  affiliés à la Caisse locale de retraites : pension en annuités, 2 % par
  année de services jusqu'à 80 % du traitement indiciaire, à 60 ans puis
  62 ans à partir de 2025.
hors_repartition: false
periodes:
  - debut: 1959
    fin: 2023
    type_calcul: annuites
    age_ouverture: 60
    age_taux_plein: 60
    duree_requise_trimestres: 160
    taux_plein: 0.80
    salaire_reference: dernier_salaire
    assiette: hors_primes
    taux_cotisation_retraite: 0.3590
    part_salariale: 0.3008
    decote_par_trimestre: 0.025
    surcote_par_trimestre: null
    avantages_non_contributifs: [bonifications, reversion]
    notes: >-
      SOURCE : Direction des ressources humaines et de la fonction
      publique de Nouvelle-Calédonie (drhfpnc.gouv.nc, « Mesures d'urgence
      en faveur de la CLR », 3 octobre 2023, et « Mesures favorisant la
      pérennité du régime », 16 septembre 2024), lues par
      scripts/fetch/sites_institutionnels.py ; lois du pays et
      délibérations du congrès, hors JORF. PENSION : « une annuité ou
      année de service ouvre droit à 2 %, et 40 annuités ouvrent ainsi
      droit à 80 % du traitement de base » — la fiche écrit 80 % pour 160
      trimestres, proratisé, sur le dernier traitement indiciaire (hors
      primes). ÂGE : 60 ans, que la loi du pays de 2024 relève «
      progressivement […] à 62 ans sur 6 ans, passant à 60 ans et 4 mois
      au premier janvier 2025, puis à 60 ans et 8 mois l'année d'après » ;
      coefficients de minoration « pour les pensions concédées après le
      1er janvier 2024 : 35 % avant 57 ans, 24 % entre 57-58 ans, 16 %
      entre 58-59 ans, 10 % entre 59-60 ans », écrits comme 2,5 % par
      trimestre. La CPS polynésienne, qui couvre les fonctionnaires de
      Polynésie dans son régime général, est portée par le statut
      `salarie_polynesie`. COTISATION : « jusqu'au 30/09/2023 : 10,8 % »
      pour l'agent et 25,1 % pour l'employeur, soit 35,9 % dont trois
      dixièmes à l'agent ; projetés en arrière faute de série, niveau
      `estimee`.
