code: fonctionnaires_pacifique
rang: 280
nom: >-
  Caisse locale de retraites de Nouvelle-Calédonie (fonctionnaires territoriaux et communaux)
famille: fonction_publique
# Intégré, lu le 28 septembre 2026 : « Les fonctionnaires locaux percoivent
# [sic] une pension de la Caisse locale de retraites. Les agents non
# titulaires […] perçoivent une pension versée par la CAFAT […] et les
# caisses de retraite complémentaires » (DRHFPNC, « Retraite »,
# drhfpnc.gouv.nc/carriere-des-agents-publics/retraite) : une complémentaire
# pour les seconds, aucune pour les premiers.
etage: integre
source_id: sites_institutionnels
fiabilite: estimee
creation: 1959
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Fonctionnaires de la Nouvelle-Calédonie, des provinces et des communes,
  affiliés à la Caisse locale de retraites : pension en annuités, 2 % par
  année de services jusqu'à 80 % du traitement indiciaire, à 60 ans puis
  62 ans à partir de 2025.
hors_repartition: false
inventaire:
  section: fonction_publique
  rang: 130
  nom: Caisses de retraite des fonctionnaires de Nouvelle-Calédonie et de Polynésie française
  population: Fonctionnaires territoriaux et communaux du Pacifique
  couverture: partiel
  statuts: [fonctionnaire_pacifique]
  textes:
    - {reference: "Direction des ressources humaines et de la fonction publique de Nouvelle-Calédonie, « Mesures d'urgence en faveur de la CLR » (3 octobre 2023) et « Mesures favorisant la pérennité du régime de retraite des fonctionnaires » (16 septembre 2024) — lois du pays et délibérations du congrès, hors JORF", id: null}
    - {reference: "code des pensions de retraites des fonctionnaires relevant des fonctions publiques de Nouvelle-Calédonie, article Lp. 221-1 dans la rédaction de la loi du pays n° 2024-10 du 12 septembre 2024 (Juridoc, version du 1er janvier 2025)", id: null}

  manque: >-
    La fiche est celle de la Caisse locale de retraites de Nouvelle-
    Calédonie ; les fonctionnaires de Polynésie relèvent de la CPS, portée
    par le statut salarié. Les cotisations d'avant 2023 sont projetées ;
    la durée de services qui ouvre la pension d'ancienneté (31 ans en 2024,
    six mois de plus par an jusqu'à 35 ans, article Lp. 221-1) n'est pas
    portée, ni les réductions d'âge pour services calédoniens (Lp. 222-1).
    L'abattement est écrit 2,5 % par trimestre, quand le code l'écrit par
    tranches d'âge, 10, 16, 24, 35 et 40 % (R. 232-6) ; la minoration de
    toutes les pensions, 8 % en 2026 et 2027 (R. 232-7), n'est pas portée,
    ni l'assiette des cotisations, le traitement majoré de 73 % (R. 212-1).
periodes:
