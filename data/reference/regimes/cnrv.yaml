  raison_hors_champ: >-
    Une caisse de capitalisation à adhésion facultative, antérieure à
    1930 pour l'essentiel de son activité : ses rentes s'achetaient par
    versements et ne relèvent pas des comptes notionnels, et les régimes
    obligatoires qui y constituaient des rentes — les régimes d'agents
    publics que la loi du 30 mars 1944 et les textes de 1942 et 1944
    nomment — relèvent des successeurs que l'inventaire décrit
    (Ircantec, après l'IPACTE et l'IGRANTE, et fonction publique).
