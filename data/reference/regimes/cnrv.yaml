    - {reference: "loi du 18 juin 1850 créant une caisse de retraites ou de rentes viagères pour la vieillesse, gérée par la Caisse des dépôts (page historique « 1850 » de la Caisse des dépôts, lue le 4 octobre 2026 par l'extrait d'un moteur de recherche, la page répondant 404 ; hors index)", id: null}
