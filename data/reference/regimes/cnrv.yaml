code: cnrv
nom: >-
  Caisse nationale des retraites pour la vieillesse (CNRV)
famille: base_prive
population: >-
  Tout déposant volontaire, puis les assurés que des régimes obligatoires
  y affiliaient pour constituer leurs rentes : caisse de retraites ou de
  rentes viagères pour la vieillesse créée par la loi du 18 juin 1850 et
  gérée par la Caisse des dépôts, en capitalisation et à adhésion
  facultative, organisée par la loi du 20 juillet 1886 sous son nom de
  Caisse nationale des retraites pour la vieillesse. Elle a servi de
  support aux régimes d'agents publics qui constituaient des rentes
  viagères — auxiliaires de
  l'État (arrêté du 16 juillet 1942), personnel temporaire du commissariat
  à la reconstruction (décret du 7 avril 1944), « agents de l'État
  tributaires du régime général de la caisse » (loi du 30 mars 1944) —,
  jusqu'à sa réunion à la Caisse nationale d'assurance en cas de décès
  sous le nom de Caisse nationale d'assurances sur la vie (décret
  n° 49-669 du 16 mai 1949).
creation: 1850
fermeture: 1949
extinction: 1949
