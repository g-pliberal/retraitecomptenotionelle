  raison_hors_champ: >-
    Caisse locale créée en mars 1977 par délibération hors Journal
    officiel, fermée par l'intégration de ses affiliés dans les fonctions
    publiques d'État, territoriale et hospitalière au plus tard fin 2010,
    en liquidation depuis : ses pensions sont versées par la CNRACL ou par
    l'État, la caisse ne préliquidant plus que la part antérieure. Les
    statuts de fonctionnaire portent la carrière ; le règlement de la
    caisse n'est pas dans l'index.
