          Loi de finances pour 1984 (loi n° 83-1179 du 29 décembre 1983, article
          33) : retenue portée de 6 % à 7 %. Taux lu chez OpenFisca-France ;
          même barème par ailleurs. La période court jusqu'en 1986 comprise :
          la hausse du 1er août 1986 ne commande que l'année suivante, le taux
          retenu pour une année étant celui du 1er JANVIER.
