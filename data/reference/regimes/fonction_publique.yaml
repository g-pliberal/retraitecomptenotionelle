          7,7 % à compter du 1er août 1986 (loi n° 86-966 du 18 août 1986,
          article 9), lu chez OpenFisca-France, donc en vigueur au 1er janvier
          1987 et non 1986. Cette fiche portait 7,7 % dès 1986, au motif que
          « le millésime porte le taux en vigueur en fin d'année, comme les
          autres séries de taux du dépôt » : c'était faux du dépôt, dont la
          règle est le 1er janvier, et vrai seulement de la série annuelle que
          le récupérateur d'OpenFisca tirait de ces mêmes barèmes — il comparait
          les années et non les dates. Les deux sont corrigés ensemble ; même
          barème par ailleurs.
