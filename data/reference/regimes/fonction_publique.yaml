          isolés dans un compartiment de capitalisation distinct et ne sont pas
          convertis en capital notionnel (cf. moteur/compartiments.py).
          Depuis le 3 juin 2011 (LEGIARTI000024113145, puis LEGIARTI000036070843),
          l'article 9 subordonne l'ouverture des droits à « l'âge mentionné à
          l'article L. 161-17-2 » : 62 ans pour la génération 1955, 64 pour
          1968 et les suivantes, lu à la génération. Le régime n'a pas de
          décote ni d'âge d'annulation propre : `age_taux_plein` reste la
          valeur de repli de l'ouverture et n'est pas lu.

