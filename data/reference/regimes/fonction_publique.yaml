        notes: >-
          Code des pensions civiles et militaires de retraite (loi du 26
          décembre 1964). Aucune décote : la seule sanction d'une carrière
          courte est la proratisation. SIX POUR CENT JUSQU'EN 1983, et la fiche
          portait 7 % dès 1964 — après avoir porté 7 % jusqu'en 2003, ce que la
          lecture de L. 61 avait déjà ramené à 1989. La transcription
          d'OpenFisca-France de l'article L. 61
          (`cotisations_secteur_public/retraite/pension/salarie`) date le
          passage à 7 % de la loi de finances pour 1984 (loi n° 83-1179 du 29
          décembre 1983, article 33), puis 7,7 % au 1er août 1986, 7,9 % au 1er
          juillet 1987, 8,9 % au 1er janvier 1989 (loi n° 89-18 du 13 janvier
          1989, article 23) et 7,85 % au 1er février 1991. Les périodes qui
          suivent la reprennent, une par taux, DATÉES AU 1er JANVIER comme le
          reste du dépôt : trois de ces cinq marches tombent en cours d'année
          et ne commandent donc que l'année suivante. `verifier_donnees.py` le
          confronte aux fiches à chaque exécution.
