# Schéma commun des fiches de régime
# ===================================
# Chaque fichier regimes/*.yaml (hors celui-ci) contient une clé `regimes`
# qui est une liste de fiches conformes à ce schéma. Le chargeur
# src/retraite_notionnelle/donnees/regimes.py valide contre ce schéma.

schema_version: 1

champs_regime:
  code:        "identifiant court, stable, en minuscules (clé primaire)"
  nom:         "libellé complet"
  famille:     "base_prive | complementaire_prive | fonction_publique | special | non_salarie | agricole | liberal | additionnel_capitalise"
  source_id:   "identifiant du jeu de données dans data/sources.yaml"
  fiabilite:   "haute | moyenne | estimee — niveau de certification des paramètres"
  creation:    "année de création du régime"
  fermeture:   "année de fermeture aux nouveaux entrants (null si ouvert)"
  extinction:  "année de disparition totale du régime (null si vivant)"
  succede_a:   "liste de codes de régimes auxquels celui-ci succède"
  integre_dans: "code du régime absorbant, le cas échéant"
  population:  "description de la population couverte"
  hors_repartition: "true si le régime est en capitalisation (exclu des comptes notionnels)"
  periodes:    "liste de fiches de paramètres, cf. champs_periode"

champs_periode:
  debut: "première année d'application (incluse)"
  fin:   "dernière année d'application (incluse), null si toujours en vigueur"

  type_calcul:
    description: "mode de liquidation en vigueur"
    valeurs:
      annuites:     "taux × salaire de référence × (durée validée / durée requise)"
      points:       "nombre de points × valeur de service du point"
      forfaitaire:  "montant forfaitaire, éventuellement proratisé"
      mixte:        "part forfaitaire + part proportionnelle (ex. agricoles)"

  age_ouverture:  "âge minimal de liquidation (années, décimales admises)"
  age_taux_plein: "âge d'annulation de la décote / du taux plein d'office"
  duree_requise_trimestres: "durée d'assurance requise pour le taux plein (null si sans objet)"
  duree_requise_par_generation:
    description: >-
      Si vrai, la durée requise est lue dans
      `legislation/duree_assurance_requise.csv` à l'ANNÉE DE NAISSANCE, et la
      valeur ci-dessus ne sert que de repli pour les générations hors table.
      C'est la règle depuis la loi du 22 juillet 1993 : deux assurés qui
      liquident le même jour n'ont pas la même exigence s'ils ne sont pas de la
      même génération. Absent ou faux, la durée est celle de la période, lue à
      l'année de liquidation — ce qui reste correct avant 1993.
    defaut: false

  age_ouverture_par_generation:
    description: >-
      Si vrai, l'âge d'ouverture est lu dans
      `legislation/age_ouverture_requis.csv` à l'ANNÉE DE NAISSANCE, et la
      valeur ci-dessus ne sert que de repli. Réservé aux régimes alignés sur
      l'âge légal général : les régimes spéciaux gardent le leur.
    defaut: false
  age_taux_plein_par_generation:
    description: >-
      Si vrai, l'âge d'annulation de la décote est lu dans
      `legislation/age_annulation_decote.csv` à l'ANNÉE DE NAISSANCE, et la
      valeur ci-dessus ne sert que de repli. La loi du 9 novembre 2010 fait
      passer cet âge de 65 à 67 ans pour les seules générations 1951-1955 :
      opposer 67 ans dès 2011, comme le faisait la fiche, l'appliquait à des
      générations que la loi n'a jamais visées.
    defaut: false

  age_table:
    description: >-
      Table d'âges PROPRE au régime, lue à l'ANNÉE DE NAISSANCE dans
      `legislation/ages_regimes.csv` : l'âge d'ouverture et l'âge du taux
      plein qu'écrit le règlement d'une section, quand ce ne sont pas ceux du
      régime général. Elle passe avant `age_ouverture_par_generation` et
      `age_taux_plein_par_generation`, qui reprennent la main pour une
      génération que la table ne couvre pas. `cavom` : 60 et 65 ans avant la
      génération 1956, 62 et 67 de 1959 à 1964, 64 et 67 dès 1968. La table
      peut aussi porter, génération par génération, le coefficient de
      minoration (`decote_par_trimestre`), qui passe alors avant celui de la
      période : `carcdsf_2011` minore de 1,25 % les générations d'avant 1955
      et de 1,50 % les suivantes.
    defaut: null

  decote_par_generation:
    description: >-
      Si vrai, le coefficient de minoration est lu dans
      `legislation/coefficient_minoration.csv` à l'ANNÉE DE NAISSANCE. La table
      de l'article R. 351-27 vaut aussi bien pour l'ancien droit (2,5 % par
      trimestre) que pour la montée en charge de la loi Fillon (jusqu'à 1,25 %
      à partir de la génération 1953) : elle se branche donc sur toutes les
      périodes des régimes alignés depuis 1983.
    defaut: false

  duree_proratisation_par_generation:
    description: >-
      Si vrai, le DÉNOMINATEUR de la proratisation est lu dans
      `legislation/duree_proratisation.csv` à l'ANNÉE DE NAISSANCE, et non dans
      la durée requise pour le taux plein. Ce sont deux paramètres distincts :
      la loi du 22 juillet 1993 a fait monter la durée requise de 150 à 160
      trimestres pour les générations 1934-1943, et n'a touché à la durée
      maximale prise en compte par la proratisation (article R. 351-6) que pour
      les générations 1944-1948. Un assuré né en 1945 se voit donc opposer
      160 trimestres pour le taux et 154 pour la proratisation.

      Le drapeau est réservé aux régimes qui suivent la règle du CODE DE LA
      SÉCURITÉ SOCIALE — le régime général et les régimes alignés. La fonction
      publique et les régimes spéciaux ont leur propre durée de proratisation,
      calendaire et non générationnelle (article L. 13 du code des pensions) ;
      elle n'est pas modélisée, et leur durée requise continue d'y faire office.

      Quoi qu'il arrive, la durée de proratisation retenue ne dépasse jamais la
      durée requise : les périodes anciennes, dont la durée maximale est plus
      courte que 150 trimestres, gardent la leur.
    defaut: false

  salaire_reference_par_generation:
    description: >-
      Si vrai, le nombre d'années retenues au salaire annuel moyen est lu dans
      `legislation/annees_salaire_reference.csv` à l'ANNÉE DE NAISSANCE : dix à
      vingt-cinq années, une par génération, de 1934 à 1948 (loi du 22 juillet
      1993). Ne vaut que pour un `salaire_reference` en meilleures années.
    defaut: false

  taux_plein: "taux de liquidation maximal (0.50 = 50 %)"

  taux_maximum_bonifie:
    description: >-
      Taux de liquidation que les BONIFICATIONS peuvent atteindre au-delà de
      `taux_plein`, les services seuls ne le dépassant jamais. La fonction
      publique le fixe à 80 % pour un maximum de 75 % : « Le pourcentage
      maximum fixé à l'article L 13 peut-être augmenté de cinq points du chef
      des bonifications » (L. 12 CPCMR) ; « peut être porté à 80 % par l'effet
      des bonifications » (décret n° 2003-1306, art. 15 III, pour la CNRACL ;
      décret n° 2004-1056, art. 12 II, pour les ouvriers de l'État). Les
      trimestres liquidables valent alors au plus la durée requise, plus les
      bonifications dans la limite de ces cinq points.
    unite: "fraction, supérieure à `taux_plein`"
    defaut: null

  salaire_reference:
    description: "assiette de calcul du salaire de référence"
    valeurs: ["dernier_salaire", "derniers_6_mois", "10_meilleures_annees",
              "25_meilleures_annees", "carriere_entiere", "sans_objet"]

  assiette:
    description: "borne d'assiette des cotisations"
    valeurs: ["plafonnee", "deplafonnee", "tranche_1", "tranche_2", "tranche_a",
              "tranche_2_arrco", "tranche_2_ircantec",
              "tranche_b", "tranche_c", "hors_primes", "primes_uniquement", "forfaitaire",
              "plafonnee_085_pass", "tranche_085_5_pass", "plafonnee_5_pass",
              "plafonnee_3_pass", "plafonnee_4_pass", "tranche_1_4_pass",
              "tranche_1_3_pass", "tranche_1_3_5_pass", "tranche_05_3_pass",
              "plafonnee_6_pass", "plafonnee_7_pass", "plafonnee_8_pass",
              "plafonnee_13_pass",
              "tranche_1_2_pass", "plafonnee_033_pass", "tranche_033_1_pass",
              "plafonnee_3_5_pass", "tranche_065_5_pass", "sans_objet"]

  taux_cotisation_retraite:
    description: >-
      Taux TOTAL de cotisation retraite (part salarié + part employeur, ou part
      personnelle pour les non-salariés) affecté à ce régime sur cette assiette.
      C'est la grandeur utilisée pour alimenter le compte notionnel lorsque le
      paramètre `source_cotisations = taux_historiques`.
      POUR LES RÉGIMES QUE `taux_cotisation_annuels.csv` COUVRE — le régime
      général, les salariés agricoles, la CANCAVA, l'ORGANIC et le RSI —, ce
      champ n'est qu'un repli : le chargeur (`CatalogueRegimes`) découpe
      chaque période `plafonnee` année par année et y écrit le taux, la part
      salariale, la cotisation déplafonnée et sa part que la table donne pour
      l'année ; la valeur de la fiche ne sert qu'aux années que la table ne
      couvre pas, et au contrôle de vraisemblance. Une fiche porte un taux par
      période législative ; le droit l'a changé presque chaque année, et c'est
      celui de l'année qui alimente le compte.
      ATTENTION : pour les périodes marquées `perimetre_taux: agent_seul`, ce
      champ ne porte QUE la retenue de l'agent — voir ce champ.
    unite: "fraction de l'assiette"

  part_salariale:
    description: >-
      Fraction du taux ci-dessus supportée par l'assuré lui-même. Le complément
      est la part de l'employeur.

      1.0 (défaut) couvre deux cas très différents et qui n'ont pas besoin d'être
      distingués ici : les régimes de NON-SALARIÉS, où il n'y a pas d'employeur
      et où la cotisation est intégralement personnelle ; et les périodes
      `perimetre_taux: agent_seul`, dont le taux est déjà la seule retenue de
      l'agent, la part de l'employeur public étant portée à part dans
      `legislation/contribution_employeur_public.csv`.

      Une valeur explicite est donc EXIGÉE de toute période de salariés dont le
      taux est un total employeur compris — régime général, complémentaires,
      MSA salariés, RAFP. `scripts/verifier_donnees.py` échoue si l'une manque.

      La valeur est une part MOYENNE sur la période, comme le taux lui-même :
      les fiches sont découpées par période législative, les taux salarié et
      employeur bougent chacun à son rythme. Le contrôle de vraisemblance la
      confronte à la transcription OpenFisca, année par année.
    unite: "fraction, entre 0 et 1"
    defaut: 1.0

  taux_cotisation_deplafonnee:
    description: >-
      Taux TOTAL prélevé, sur la même période, sur la TOTALITÉ de la
      rémunération — sans s'arrêter au plafond de l'assiette ci-dessus. Le
      régime général en prélève un depuis 1983 : 0,44 % à l'origine, 2,41 %
      depuis 2023.

      Ce prélèvement N'OUVRE AUCUN DROIT dans le droit positif : il finance la
      solidarité. Le scénario 1, qui doit coller à la loi, l'ignore donc, et
      c'est voulu — aucun calcul de pension actuelle ne le lit.

      Les comptes notionnels, eux, portent au compte ce qui a été VERSÉ : chaque
      euro cotisé doit s'y retrouver. Ce champ était auparavant confondu avec
      `taux_cotisation_retraite` — un seul taux, appliqué à l'assiette plafonnée
      —, si bien que la déplafonnée s'arrêtait au plafond alors que la loi la
      lève sur tout le salaire. En dessous du plafond les deux écritures sont
      équivalentes ; au-dessus, une part de ce qui avait été payé manquait au
      compte.

      Un champ plutôt qu'une seconde période d'assiette `deplafonnee` : une
      période supplémentaire serait entrée dans le calcul du scénario 1, qui
      parcourt toutes les périodes actives d'un régime.
    unite: "fraction de la rémunération entière"
    defaut: 0.0

  part_salariale_deplafonnee:
    description: >-
      Fraction de `taux_cotisation_deplafonnee` supportée par l'assuré. Elle
      diffère largement de `part_salariale` — la déplafonnée est très
      majoritairement patronale : 0 % jusqu'en 2003, 16,6 % depuis 2023 — d'où
      un champ distinct plutôt qu'un partage commun.
    unite: "fraction, entre 0 et 1"
    defaut: 0.0

  duree_maximum_avant_age:
    description: >-
      Âge en deçà duquel la durée liquidable est plafonnée, et
      `duree_maximum_avant_age_trimestres` ce plafond. Les marins sont seuls à
      porter cette règle : l'article R. 13 de leur code fixe « le maximum des
      annuités liquidables dans les pensions d'ancienneté dont la liquidation
      est demandée avant cinquante-cinq ans […] à vingt-cinq annuités », là où
      la pension liquidée à cinquante-cinq ans en compte trente-sept et demie.
      C'est la seule règle du catalogue où l'ÂGE borne la DURÉE, et non
      l'inverse.
    defaut: null

  duree_maximum_avant_age_trimestres:
    description: "plafond de durée liquidable en deçà de `duree_maximum_avant_age`"
    defaut: null

  duree_maximum_levee_age:
    description: >-
      Âge à partir duquel le plafond précédent est LEVÉ pour qui réunit
      `duree_maximum_levee_trimestres` dans le régime. Le même R. 13 l'écarte
      « au profit d'un marin âgé d'au moins cinquante-deux ans et demi,
      réunissant trente-sept annuités et demie de services » — l'embarqué de
      quinze ans, que la page de l'ENIM range sous « 52 ans et demi ».
    defaut: null

  duree_maximum_levee_trimestres:
    description: "durée dans le régime qui lève le plafond à `duree_maximum_levee_age`"
    defaut: null

  age_ouverture_services:
    description: >-
      Âge d'ouverture ABAISSÉ pour qui réunit `services_ouverture_annees` de
      services dans le régime, à la date de la liquidation. L'âge retenu est le
      plus tardif des deux : celui-ci, et celui où la durée est atteinte. Les
      marins seuls le portent — « la double condition de cinquante ans d'âge
      et de vingt-cinq années de services » (R. 2 de leur code) —, l'âge de
      cinquante-cinq ans que R. 2 fixe ensuite n'étant que la borne de
      l'entrée en jouissance de qui continue à naviguer (L. 5552-5 du code des
      transports).
    defaut: null

  services_ouverture_annees:
    description: "durée de services, en années, qui ouvre `age_ouverture_services`"
    defaut: null

  pension_speciale_services_annees:
    description: >-
      Durée de services dans le régime en deçà de laquelle la pension est
      SPÉCIALE : elle entre en jouissance avec l'autre pension de base de
      l'assuré, jamais avant `age_ouverture`, et à défaut d'autre pension à
      `pension_speciale_age_sans_autre_pension`. Les marins : moins de quinze
      ans de services, cinquante-cinq ans, soixante sans autre pension
      (L. 5552-11 et L. 5552-12 du code des transports, R. 5 du code des
      pensions de retraite des marins).
    defaut: null

  pension_speciale_age_sans_autre_pension:
    description: "âge de la pension spéciale de qui n'a pas d'autre pension de base"
    defaut: null

  decote_par_trimestre: "abattement par trimestre manquant (fraction, null si aucun)"

  bareme_decote:
    description: >-
      Barème de décote applicable. `regime_aligne` applique le coefficient
      `decote_par_trimestre` ci-dessus, éventuellement lu à la génération, et
      annule la décote à `age_taux_plein`. `fonction_publique` applique celui
      de l'article L. 14 du code des pensions : le coefficient ET l'âge
      d'annulation y montent en charge de 2006 à 2020, ce dernier étant la
      LIMITE D'ÂGE du grade diminuée d'un nombre décroissant de trimestres
      (`legislation/decote_fonction_publique.csv`). `regimes_speciaux`
      applique le même barème avec QUATRE ANS DE RETARD, celui que la réforme
      de 2008 a donné aux régimes spéciaux : rien avant le 1er juillet 2010,
      un dixième du taux plein ensuite, 1,25 % seulement en 2019, et un âge
      d'annulation qui est l'âge de référence du régime — l'âge d'ouverture
      majoré de cinq ans — diminué de seize trimestres en 2010 puis de rien à
      partir de 2024 (`legislation/decote_regimes_speciaux.csv`).
      `regimes_speciaux_age_fixe` en prend le coefficient mais garde l'âge
      d'annulation écrit dans la fiche : c'est ce que le V de l'article 14 fait
      pour les catégories d'âge atypique, artistes du ballet et musiciens de
      l'orchestre, dont l'âge d'annulation est leur âge d'ouverture majoré de
      huit trimestres et ne recule pas avec la montée en charge.
    valeurs: ["regime_aligne", "fonction_publique", "regimes_speciaux",
              "regimes_speciaux_age_fixe"]
    defaut: regime_aligne

  decote_annulee_par_la_duree:
    description: >-
      La durée d'assurance annule-t-elle la décote ? Vrai depuis l'ordonnance
      du 26 mars 1982, qui ouvre le taux plein à 60 ans à qui a la durée
      requise ; le nombre de trimestres de décote est alors le plus faible des
      deux décomptes, durée manquante ou âge manquant. `false` pour les
      périodes antérieures, où le taux ne dépendait QUE de l'âge.
    defaut: true

  decote_trimestres_maximum:
    description: >-
      Nombre maximal de trimestres de décote opposables. Vingt dans tous les
      régimes qui en appliquent une : au-delà, le taux ne descend plus.
      `null` lève le plafond. La CARCDSF minore « dans la limite de 15 % »
      depuis 2024 : douze trimestres à 1,25 %.
    defaut: 20

  decote_palier_age:
    description: >-
      Régimes en points : âge au-delà duquel les trimestres de décote se
      comptent au taux `decote_par_trimestre_apres_palier`, ceux d'avant
      gardant `decote_par_trimestre`. La CAVP minore de 1,25 % par trimestre
      d'anticipation jusqu'à 65 ans et de 0,5 % de 65 ans à l'âge du 1° de
      L. 351-8 (statuts dans la rédaction de l'arrêté du 23 juin 2011,
      article 15 ; règlement du 10 juillet 2026, article 12). `null` : un seul
      taux.
    defaut: null

  decote_par_trimestre_apres_palier:
    description: "taux par trimestre de décote au-delà de `decote_palier_age` (fraction, null sans palier)"
    defaut: null

  taux_plein_anticipe_par_enfant_annees:
    description: >-
      Régimes en points : années d'anticipation du taux plein qu'une AFFILIÉE
      reçoit par enfant, sans minoration — « à raison d'une année
      d'anticipation par enfant mis au monde, dans la limite de 5 années
      maximum » (CARCDSF, statuts approuvés le 13 avril 2011, article 19 II ;
      de 64 ans pour un enfant à 60 ans pour cinq dans ceux de 2007). Le taux
      plein s'ouvre à l'âge ainsi avancé ; avant, la minoration se compte
      depuis l'âge du taux plein, les deux voies étant « exclusives les unes
      des autres ». `null` : aucune anticipation.
    defaut: null

  taux_plein_anticipe_maximum_annees:
    description: "plafond, en années, de l'anticipation par enfant (null : sans plafond)"
    defaut: null

  surcote_par_trimestre: "majoration par trimestre supplémentaire (fraction, null si aucune)"

  surcote_bareme:
    description: >-
      Barème DATÉ de la surcote, quand le taux dépend de la date à laquelle
      chaque trimestre a été accompli et non de l'année du départ.
      `regime_general` : 0,75 % de 2004 à 2006 ; en 2007 et 2008, 0,75 % les
      quatre premiers trimestres puis 1 %, et 1,25 % après soixante-cinq ans ;
      1,25 % depuis 2009 (D. 351-1-4). `fonction_publique` : 0,75 % dans la
      limite de vingt trimestres jusqu'en 2008, 1,25 % depuis (L. 14 III).
      `cnbf` : 0,75 % pour les trimestres accomplis du 1er janvier 2004 au 30
      juin 2010, 1,25 % depuis le 1er juillet 2010 (R. 653-3).
      Les trimestres se comptent par trimestres civils depuis celui qui suit
      l'âge légal, ou le mois qui suit la durée requise ;
      `legislation/surcote_baremes.csv` porte les taux. `null` : le taux plat
      `surcote_par_trimestre` de la période, appliqué à tous les trimestres.
    defaut: null

  abattement_points:
    description: >-
      Barème d'abattement d'un régime EN POINTS liquidé avant le taux plein.
      `decote_du_regime_de_base` applique le coefficient de minoration ci-dessus ;
      `agirc_arrco` applique les coefficients d'anticipation propres à ce
      régime — deux tables, l'une indexée sur les trimestres manquants, l'autre
      sur l'âge, dont la plus avantageuse est retenue. `ircantec` applique le
      barème de l'article 16 de l'arrêté du 30 décembre 1970, qui est le MÊME
      escalier, aux mêmes marches, et se lit de la même façon. `ircec` est
      celui des trois régimes de l'IRCEC depuis 2014 (RAAP, RACD ; RACL depuis
      2025) : des ANNÉES manquantes jusqu'à l'âge du taux plein, une année
      entamée comptant entière, 2,5 % pour chacune des deux premières et 5 %
      au-delà, ou la décote du régime de base si elle est plus favorable ; pas
      de minoration si la durée requise est réunie. `ircec_age_seul` est le
      RACL de 2014 à 2024 : 5 % par année manquante, et seul l'âge ouvre le
      taux plein. `cavom` est la même règle, que le règlement de la CAVOM
      écrit « non susceptible de fractionnement » ; c'est aussi celle de la
      CARMF de 2000 à 2016 (« 0,75 à 60 ans […] 0,95 à 64 ans ») et de la
      CARCDSF de 2008 à 2010 (« 25 % pour un départ en retraite au cours de la
      61e année […] 5 % […] au cours de la 65e année »).
    valeurs: ["decote_du_regime_de_base", "agirc_arrco", "ircantec", "ircec", "ircec_age_seul", "cavom"]
    defaut: decote_du_regime_de_base

  surcote_points:
    description: >-
      Barème de MAJORATION d'un régime en points liquidé après le taux plein,
      pendant du champ précédent. `aucune` : le régime n'en sert pas — et c'est
      ce que doit porter toute période en points dont `surcote_par_trimestre`
      est nul, un test l'exige dans les deux sens. `regime_general` : la règle
      de l'article L. 351-1-2, telle que la branche en annuités la sert —
      trimestres COTISÉS après l'âge légal et au-delà de la durée requise, au
      taux `surcote_par_trimestre` ; c'est celle de la CNAVPL (R. 643-8) et de
      la MSA des non-salariés (D. 732-42). `par_age_seul` : trimestres civils
      ENTIERS écoulés entre `surcote_age_debut` — l'âge du taux plein de la
      fiche, lu à la génération, si le champ est nul — et la liquidation, sans
      condition de durée ni de cotisation, au taux `surcote_par_trimestre` ;
      c'est la forme qu'écrivent les statuts des sections libérales, bornée
      par les champs qui suivent. `ircantec` applique le IV de l'article 16 de
      l'arrêté du 30 décembre 1970, entré en vigueur le 1er janvier 2010 :
      deux taux et deux bornes d'âge — 0,75 % par trimestre ENTIER écoulé
      entre l'âge du taux plein et la liquidation (son 1°), 0,625 % par
      trimestre COTISÉ au-delà de la durée requise entre l'âge légal et l'âge
      du taux plein (son 2°), sans qu'une même période puisse être comptée
      deux fois. `rafp` : le barème actuariel de l'ERAFP, un coefficient par
      âge entier à la date d'effet, de 1,00 à 62 ans à 1,80 à 75 (décret
      n° 2004-569, art. 8), sans taux par trimestre.
    valeurs: ["aucune", "regime_general", "par_age_seul", "ircantec", "rafp"]
    defaut: aucune

  surcote_age_debut:
    description: >-
      `par_age_seul` seulement : âge à partir duquel les trimestres écoulés
      comptent. `null` prend l'âge du taux plein de la fiche, lu à la
      génération quand `age_taux_plein_par_generation` l'est. La CARMF et l'ASV
      comptent dès 62 ans (statuts du 30 novembre et du 1er décembre 2016), la
      CAVEC dès 65 ans, la CARPIMKO, la CAVP et la CPRN dès l'âge du taux
      plein.
    defaut: null

  surcote_age_maximum:
    description: >-
      `par_age_seul` seulement : âge au-delà duquel plus aucun trimestre ne
      compte — « sans pouvoir s'appliquer au-delà du premier jour du trimestre
      civil suivant le soixante-dixième anniversaire » (CARMF), « jusqu'à
      l'âge de 70 ans » (CPRN jusqu'en 2023). `null` : pas de borne d'âge.
    defaut: null

  surcote_trimestres_maximum:
    description: >-
      `par_age_seul` seulement : nombre maximal de trimestres majorés — « dans
      la limite de vingt trimestres » (CARPIMKO), « dans la limite maximale de
      25 % » à 1,25 % (CAVEC), « jusqu'à cet âge augmenté de trois ans »
      (CAVP). `null` : pas de plafond.
    defaut: null

  surcote_pas_trimestres:
    description: >-
      `par_age_seul` seulement : granularité du décompte. 1 compte chaque
      trimestre civil entier ; 4 ne compte que les ANNÉES PLEINES — « 5 % par
      année pleine de différé », CARMF avant 2017 et CIPAV.
    defaut: 1

  surcote_palier_age:
    description: >-
      `par_age_seul` seulement : âge à partir duquel le taux devient
      `surcote_par_trimestre_apres_palier`. La CARMF et l'ASV majorent de
      1,25 % par trimestre de 62 à 65 ans, puis de 0,75 % de 65 à 70 ans.
      `null` : un seul taux.
    defaut: null

  surcote_par_trimestre_apres_palier:
    description: "taux par trimestre au-delà de `surcote_palier_age` (fraction, null sans palier)"
    defaut: null

  surcote_affiliation_minimale_trimestres:
    description: >-
      `par_age_seul` seulement : durée d'affiliation À CE RÉGIME, en
      trimestres, sans laquelle la majoration n'est pas due — « si, à 67 ans,
      vous réunissez 30 années d'affiliation à la Cipav ». `null` : aucune
      condition.
    defaut: null

  taux_majoration_enfants:
    description: >-
      Barème PROPRE de la majoration pour enfants, par nombre d'enfants à
      partir de zéro ; le dernier taux vaut au-delà. Absent, le barème commun
      s'applique — 10 % dès trois enfants, 5 % de plus par enfant au-delà dans
      la fonction publique. Les marins bonifient dès DEUX enfants : « 5 % de
      son montant pour deux enfants, 10 % pour trois enfants et 15 % au-delà »
      (R. 14 de leur code), ce que la page de l'ENIM écrit à l'identique.
    defaut: null

  plafond_majoration_enfants:
    description: >-
      Plafond en euros par an de la majoration pour enfants, et année à
      laquelle il est publié (`plafond_majoration_annee`). Le plafond suit
      ensuite la valeur de service du point. `null` : majoration non plafonnée,
      ce qui est le cas de tous les régimes de base.

  borne_basse_euros:
  borne_haute_euros:
    description: >-
      Bornes de l'assiette exprimées EN EUROS plutôt qu'en plafonds de la
      Sécurité sociale. La plupart des régimes découpent leur assiette en
      multiples du plafond, qui suit les salaires ; d'autres la fixent en euros
      et ne l'indexent pas — les tranches de la complémentaire des avocats
      valent 42 507 € en 2023, en 2025 et en 2026, quand le plafond passait de
      43 992 à 48 060 €. Les exprimer en plafonds les ferait dériver.
      `null` : les bornes de `assiette` s'appliquent.

  pension_forfaitaire_annuelle:
  pension_forfaitaire_annee:
    description: >-
      Pension annuelle servie à taux plein par un régime FORFAITAIRE, dans les
      euros de `pension_forfaitaire_annee`, proratisée par la durée. Elle ne
      dépend pas du revenu : c'est tout l'objet d'un régime forfaitaire, et
      c'est ce qu'un compte notionnel supprime le plus radicalement. Sans ce
      montant, un `type_calcul: forfaitaire` retomberait sur la moyenne des
      revenus, c'est-à-dire sur un taux de remplacement de 100 %.

  points_minimum_annuels:
    description: >-
      Points garantis chaque année à qui cotise au régime, quelle que soit son
      assiette — la garantie minimale de points de l'Agirc, 120 points par an
      de 1989 à 2018. Droit gratuit, sans contrepartie de cotisation
      proportionnelle : un cadre payé sous le plafond de la Sécurité sociale,
      dont la tranche B est nulle, en acquérait autant qu'un autre.
      `null` : aucune garantie.

  capital_seuil_points:
    description: >-
      En deçà de ce nombre de points, la prestation est un CAPITAL versé une
      fois : le RAFP sous 5 125 points (décret n° 2004-569, art. 9), converti
      par le barème d'âge de l'ERAFP. Le montant annuel reste celui de la rente
      équivalente ; le capital est écrit dans le détail de la pension.
    defaut: null

  points_ajustement_par_forfait:
  points_ajustement_maximum:
    description: >-
      Points d'AJUSTEMENT, ajoutés aux points par trimestre validé : le premier
      champ multiplie la cotisation proportionnelle divisée par la cotisation
      forfaitaire, le second plafonne le résultat, par an. C'est l'ASV des
      médecins depuis 2012 — 18 fois l'ajustement sur le forfait, neuf points
      au plus (décret n° 2011-1644, art. 3).
    defaut: null

  points_par_trimestre_valide:
    description: >-
      Points attribués par TRIMESTRE VALIDÉ, sans égard au montant cotisé.
      C'est la règle du régime de base des professions libérales pour tout ce
      qui précède 2004 : « les trimestres validés avant le 1er janvier 2004
      sont convertis en points à raison de cent points par trimestre »
      (D. 643-1). Le droit d'avant la réforme n'était pas contributif —
      l'allocation vieillesse valait un quinzième de l'AVTS par année cotisée,
      la même pour tous —, et sa conversion ignore donc l'assiette. Les
      trimestres, eux, restent ceux que le revenu a validés.
      `null` : le régime convertit des cotisations, pas des trimestres.

  bareme_points:
    description: >-
      Barème de points NOMMÉ, dont la formule vit dans le moteur parce qu'elle
      ne s'écrit pas en colonnes. Seule valeur connue : `msa_proportionnelle`,
      la retraite proportionnelle des non-salariés agricoles — quinze points
      jusqu'à 400 SMIC horaires, une pente jusqu'à trente à 800 SMIC, un
      plateau à trente jusqu'à deux fois le minimum contributif, puis une pente
      jusqu'au maximum de l'année (R. 732-70 et R. 732-71 du code rural). La
      pension multiplie ensuite les points par 37,5 / la durée requise en
      années. `null` : le régime n'a pas de barème nommé.
    valeurs: ["msa_proportionnelle"]

  points_de:
    description: >-
      Code du régime dont cette période emprunte le BARÈME DU POINT — prix
      d'achat, valeur de service, échelle de conversion. Sert à une TRANCHE que
      tous les affiliés d'un régime ne cotisent pas : la tranche 2 de l'Arrco
      n'est due que par les non-cadres, forme une fiche à part que l'affiliation
      donne aux uns et pas aux autres, et ses points restent des points Arrco.
      `null` : le barème est celui du régime lui-même.

  valeur_point_euros:
    description: >-
      Valeur de service du point écrite dans la fiche, en euros de
      `valeur_point_annee`, pour un régime dont la caisse est seule à la
      publier et dont `valeurs_point.csv` ne porte donc rien. Revalorisée sur
      les prix d'une année à l'autre, comme la loi le prescrit (L. 161-23-1).
      `valeurs_point.csv` prime quand il porte le régime.

  points_maximum:
    description: >-
      Nombre de points attribués quand l'assiette atteint le repère décrit par
      les deux champs suivants. Sert aux régimes dont le BARÈME est écrit en
      points et non en prix d'achat : 525 points au plafond pour le régime de
      base des libéraux, 100 points pour 1 820 SMIC à la complémentaire
      agricole. `null` : les points s'achètent, cf. `valeurs_point.csv`.

  assiette_repere_smic:
    description: >-
      Repère d'assiette, exprimé en heures de SMIC. `null` : le repère est la
      borne haute de l'assiette, en plafonds de la Sécurité sociale.

  assiette_facteur_revenu:
    description: >-
      L'assiette n'est pas le revenu mais une grandeur qui lui est
      proportionnelle et que la carrière ne porte pas : les COMMISSIONS BRUTES
      versées par les compagnies pour la CAVAMAC, les PRODUITS DE L'OFFICE pour
      la CPRN. L'assiette vaut alors revenu × facteur, avant application des
      bornes. C'est une moyenne de section, prise dans les statistiques de la
      caisse ; le taux, lui, reste celui du texte.
    defaut: null

  assiette_plancher:
    description: >-
      L'assiette est-elle relevée au repère quand elle lui est inférieure ?
      C'est l'assiette minimale de la complémentaire agricole, qui ouvre ses
      cent points même à un revenu plus faible.
    defaut: false

  assiette_minimale_pass:
    description: >-
      Assiette MINIMALE, en plafonds annuels de la Sécurité sociale : la
      cotisation proportionnelle est due sur au moins cette assiette, quel que
      soit le revenu, et ouvre les points correspondants. C'est la CARPIMKO
      depuis 2026 — assiette « comprise entre un minimum et un maximum »,
      50 % et 300 % du plafond. Proratisée comme l'assiette sur une année
      incomplète.
    defaut: null

  cotisation_forfaitaire_euros:
  cotisation_forfaitaire_annee:
    description: >-
      Cotisation FORFAITAIRE, exprimée dans les euros de
      `cotisation_forfaitaire_annee`, qui s'AJOUTE à la cotisation
      proportionnelle. C'est la forme du complémentaire des chirurgiens-
      dentistes : 3 210,60 € en 2026, qui ouvrent six points, PLUS 11,35 % du
      revenu. Ni un taux, ni un forfait pur — les deux à la fois, et le modèle
      ne savait exprimer que le premier. Le forfait est dû quel que soit le
      revenu : il ne s'annule pas avec une assiette nulle. Il est ramené à
      l'année courante par l'indice des PRIX, faute d'une série publiée sur
      toute la durée — même convention que `pension_forfaitaire_annuelle`.
      `null` : le régime n'a pas de part forfaitaire.

  assiette_forfaitaire:
    description: >-
      L'assiette EST le repère, quel que soit le revenu — et non un plancher.
      C'est la base forfaitaire du régime des cultes : les articles R. 382-89
      et R. 382-90 l'égalent au SMIC mensuel, que l'assuré perçoive davantage,
      moins, ou rien du tout. Un ministre du culte n'a pas de salaire dont on
      prélèverait une fraction ; la congrégation et lui cotisent sur un
      forfait. Suppose un repère : `assiette_repere_smic`, ou une borne haute
      d'assiette à défaut.
    defaut: false

  cotisation_par_classes:
    description: >-
      Le régime ne prélève ni un taux ni un forfait mais un MONTANT PAR PALIER
      de revenu, lu dans `classes_cotisation.csv`. C'est la forme de la Cipav
      d'avant 2023 : 1 527 € jusqu'à 26 580 € de revenus, 3 055 € jusqu'à
      49 280 €, et ainsi de huit paliers. Quand ce drapeau est levé, le taux et
      le forfait de la période sont ignorés — c'est la grille qui décide —, et
      la période doit donc porter un taux nul.
      La grille est celle du millésime publié, bornes ET montants ramenés par
      le rapport des plafonds pour les autres exercices — elle est écrite en
      plafonds, pas en euros.
    defaut: false

  avantages_non_contributifs:
    description: >-
      Liste des droits gratuits en vigueur sur la période. Tous sont NEUTRALISÉS
      dans les scénarios notionnels ; ils ne sont conservés que pour la
      reconstitution du scénario « système actuel ».
    valeurs_usuelles: ["minimum_contributif", "minimum_garanti", "aspa",
                       "majoration_enfants", "mda", "avpf", "bonifications",
                       "periodes_assimilees", "categorie_active", "reversion"]

  notes: "texte libre — précisions, ruptures, renvois aux textes"
