    notes: >-
      SOIXANTE-QUATORZE FRANCS VINGT-SIX PAR TRIMESTRE. L'article 147, dans
      sa rédaction du 1er avril 1974 : « le montant de la pension dont
      bénéficient les affiliés est fixé à 8 911,20 F pour ceux qui
      justifient soit de cinquante-cinq ans d'âge et de trente années de
      travail à la mine, soit de cinquante ans d'âge et de trente années de
      travail à la mine, dont vingt années au moins au fond. Ce chiffre est
      majoré de 74,26 F pour chaque trimestre de service en sus de 120 » —
      et 8 911,20 / 120 = 74,26 exactement. L'article 148 le confirme par
      l'autre bout : « 4 455,60 F pour 60 trimestres de service », soit la
      moitié pour la moitié des trimestres. La fiche porte la valeur en
      euros au taux officiel de 6,55957 F.
      CE QUE CETTE PÉRIODE NE SAIT PAS. Le forfait était revalorisé sur les
      SALAIRES jusqu'en 1987, et la fiche ne sait le porter que par les
      prix : une liquidation de 1985 est sous-estimée d'environ un quart.
      Nommer l'écart est tout ce qu'on peut faire ici — les revalorisations
      intermédiaires sont des arrêtés annuels, que la version consolidée du
      décret ne conserve pas.
      LA VALEUR DE CE MILLÉSIME EST RECONSTITUÉE. Entre 74,26 F au 1er
      avril 1974 et 382,08 F au 1er juillet 1992, la base LEGI ne porte
      aucune version intermédiaire : les revalorisations étaient des
      arrêtés annuels, que la version consolidée du décret ne garde pas et
      que le dépouillement du Journal officiel n'a pas retrouvés. La fiche
      interpole donc GÉOMÉTRIQUEMENT entre les deux valeurs sourcées — 9,9
      % l'an, une période par millésime. Porter la valeur de 1974 par
      l'indice des prix, comme le faisait cette fiche, la laissait 32 %
      sous celle de 1992 : la pension d'un mineur liquidant en 1991
      bondissait de 47 % l'année suivante, ce qui n'était certainement pas
      le droit. L'interpolation ne l'est pas non plus, et le décret n°
      2002-800 dit pourquoi : il est pris après un protocole « relatif aux
      mesures de revalorisation et de rattrapage des avantages miniers du
      fait de leur décrochage par rapport aux pensions de vieillesse du
      régime général ». Le forfait minier n'a donc suivi ni les prix, ni
      les salaires, ni les pensions du régime général — il a décroché puis
      rattrapé. Entre deux points connus, la ligne droite est ce qu'on
      peut dire de moins faux.
