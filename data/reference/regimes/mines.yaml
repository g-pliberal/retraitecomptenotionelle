      sa rédaction du 1er avril 1974 : « le montant de la pension dont
      bénéficient les affiliés est fixé à 8 911,20 F pour ceux qui
      justifient soit de cinquante-cinq ans d'âge et de trente années de
      travail à la mine, soit de cinquante ans d'âge et de trente années de
      travail à la mine, dont vingt années au moins au fond. Ce chiffre est
      majoré de 74,26 F pour chaque trimestre de service en sus de 120 » —
      et 8 911,20 / 120 = 74,26 exactement. L'article 148 le confirme par
      l'autre bout : « 4 455,60 F pour 60 trimestres de service », soit la
      moitié pour la moitié des trimestres. La fiche porte la valeur en
      euros au taux officiel de 6,55957 F.
      CE QUE CETTE PÉRIODE NE SAIT PAS. Le forfait était revalorisé sur les
      SALAIRES jusqu'en 1987, et la fiche ne sait le porter que par les
      prix : une liquidation de 1985 est sous-estimée d'environ un quart.
