    valeur_point_euros: 82.83
    valeur_point_annee: 2013
    bareme_trimestre: mines
    notes: >-
      « La valeur du trimestre de services […] s'élève à 82,83 euros au
      1er avril 2013 » (article 131, rédaction du 6 septembre 2015), et
      c'est la dernière que le décret porte : trente ans de mine valent
      9 940 € par an avant le coefficient de majoration de l'article 131-1,
      qui la porte à 13 110 € (1,319 au 1er avril 2013). La valeur est
      ensuite revalorisée comme les pensions (article 181) : 97,15 € en 2026,
      avec un coefficient de 1,473, soit 17 172 € pour trente ans — la
      fiche en servait 12 299, 28 % de moins, faute du coefficient, et
      alors même qu'elle portait la valeur par les prix, à 102,49 €. Voir
      `legislation/bareme_trimestre_mines.csv`. Et QUARANTE ANS NE VALENT
      PAS PLUS QUE TRENTE, sauf ce qui précède cinquante-cinq ans : « le
      nombre maximum de trimestres susceptibles d'être pris en compte pour
      le calcul de la pension est de cent-vingt ; toutefois, pour les
      affiliés qui ont réalisé cette durée avant l'âge de cinquante-cinq
      ans, les trimestres accomplis postérieurement sont pris en compte
      jusqu'à ce que cet âge soit atteint » (article 136 ; article 147 dès
      1974). `trimestres_maximum` le porte, sur toutes les périodes.
      FERMÉ AUX NOUVEAUX ENTRANTS depuis le 1er septembre 2010 (décret
      n° 2010-975 du 27 août 2010), et à eux seuls : le mineur qui était
      déjà là garde son régime jusqu'à sa retraite, et ses règles ne
      changent pas. C'est un régime en EXTINCTION, que les réformes de 2010,
      2014 et 2023 ont laissé où il était — l'article 125 garantit toujours
      la pension « aux affiliés âgés de cinquante-cinq ans au moins » —, et
      non un régime réformé.
      L'ÂGE EST CINQUANTE-CINQ ANS, ET CINQUANTE AVEC TRENTE ANS DE MINE.
      L'article 125 garantit la pension « aux affiliés âgés de cinquante-cinq
      ans au moins » ; l'article 127 abaisse cet âge « à raison d'un an par
      tranche de quatre années de service au fond et sans pouvoir être
      inférieur à cinquante ans, pour les travailleurs comptant au moins
      trente années d'affiliation » (article 146 de 1985 à 1992 ; avant 1985,
      cinquante ans pour trente années dont vingt au fond). La page de la
      Caisse des dépôts l'écrit en trimestres : 120 de services dont 16 au
      fond pour 54 ans, 80 au fond pour 50. La fiche servait cinquante ans à
      TOUS, même au mineur de dix ans ; elle sert désormais cinquante-cinq
      ans, et cinquante à qui réunit trente ans de services
      (`age_ouverture_services`). Le moteur ne sait toujours pas où un
      mineur a travaillé : à trente ans de mine, il lui donne l'âge du fond,
      et non la majoration de 0,15 % par trimestre au fond de l'article 138
      — ce que `docs/limites.md` dit.
