      LA MAJORATION POUR ENFANTS EST ATTESTÉE DEPUIS 2000. Le décret
      n° 99-913 du 21 octobre 1999, qui intègre les géomètres experts à la
      Cipav au 1er janvier 2000, leur ouvre pour les périodes postérieures
      « une bonification pour enfants dans les conditions prévues » par les
      statuts du complémentaire (article 6) : elle existait donc. Sa forme
      n'est lue que dans les textes d'aujourd'hui — « il est majoré de
      10 % au profit du demandeur ayant eu au moins trois enfants »,
      article 5-2 du décret n° 79-262 dans la rédaction du décret
      n° 2026-418 ; la fiche pratique de 2026 écrit de même — et la fiche
      la suppose identique depuis 2000. Avant, rien n'est lu, rien n'est
      servi.
