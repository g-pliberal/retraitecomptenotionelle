    notes: >-
      DÉCRET N° 79-262 DU 21 MARS 1979, ARTICLE 2 (LEGIARTI000006767473,
      puis LEGIARTI000006767474 en 1985 pour les conditions d'option,
      classes inchangées) : six classes de cotisation portant attribution
      de quatre (classe 1), huit (2), douze (3), vingt (5), vingt-huit (7)
      et quarante (10) points, aux montants de un à dix fois la cotisation
      de la classe 1, la classe étant fixée par le revenu professionnel
      net selon les statuts ; les classes 5, 7 et 10 ne deviennent
      obligatoires qu'en 1980, 1981 et 1982. Les bornes de revenu sont
      dans les statuts, hors index : la grille de `classes_cotisation.csv`
      la plus ancienne, indexée sur les prix, tient lieu de montant.
      COTISATION PAR CLASSES, et c'est la première fiche du dépôt de cette
      forme. La caisse ne prélevait ni un taux ni un forfait : elle
      rangeait l'assuré dans l'un de huit paliers selon son revenu, et
      appelait le montant du palier. Sa fiche pratique 2022 en donne la
      grille entière — 1 527 € jusqu'à 26 580 € de revenus, puis 3 055, 4
      582, 7 637, 10 692, 16 802, 18 329 et 19 857 € au-delà de 123 300 €
      —, et elle est portée dans `classes_cotisation.csv`. LA CLASSE EST
      SUBIE, PAS CHOISIE. Le même document écrit du complémentaire que «
      son montant est DÉTERMINÉ selon ce tableau », et de l'invalidité-
      décès, présenté juste à côté, que l'assuré « a la possibilité de
      CHOISIR sa classe de cotisation, quels que soient ses revenus ».
      Seule la première forme est modélisable, et le dépôt ne prête jamais
      à personne un choix qu'il ne peut pas connaître. UN SEUL MILLÉSIME
      EST PUBLIÉ, celui de 2022, et il vaut pour toute la période — ramené
      aux autres exercices par le rapport des plafonds, parce que la
      grille est écrite en plafonds : ses sept bornes valent 0,65, 1,2,
      1,4, 1,6, 2, 2,5 et 3 plafonds de 2022, et ses huit montants 1, 2,
      3, 5, 7, 11, 12 et 13 fois une unité qui vaut 3,71 % du plafond.
      C'est ce qui autorise à la reporter ; ce n'est pas ce qui prouve
      qu'elle avait déjà cette forme en 1979, et plus on remonte, moins la
      fiche vaut. La borne de début est celle du décret n° 79-262 du 21
      mars 1979, qui institue le complémentaire des architectes — le noyau
      de la caisse.
      AUCUNE SURCOTE LUE AVANT 2013 : la fiche portait 1,25 % sans
      texte, et le moteur ne le lisait pas.
