    notes: >-
      LA RÉFORME DE 2023 REND LE RÉGIME PROPORTIONNEL : « les cotisations de
      retraite complémentaire ne sont plus forfaitaires mais
      proportionnelles au revenu », écrit le guide pratique de la caisse.
      9 % de zéro à un plafond, et 22 % d'un à trois — la seconde tranche
      est la période jumelle de celle-ci.
      Les points s'achètent, et la caisse déroule l'arithmétique : « 40 000 €
      x 9 % = 3 600 € de cotisations. 3 600 € / 47,40 € (valeur d'achat du
      point en 2026) = 75,9 points ». Valeur de service 2,89 € en 2026, d'où
      un rendement de 6,10 % que la caisse publie elle-même — c'est lui que
      porte `rendements_points.csv`.
