      : la fiche pratique « À quel âge prendre ma retraite » (2022)
      écrit, pour le complémentaire, « avec surcote (appliquée sur les
      points acquis au titre des 30 premières années de cotisations) à
      partir de 67 ans : 5 % par année pleine de différé si, à 67 ans,
      vous réunissez 30 années d'affiliation à la Cipav », et entre 62
      et 67 ans « le même abattement que celui appliqué à votre retraite
      de base ». Le moteur retient 1,25 % par trimestre, par années
      pleines, depuis soixante-cinq ans : jusqu'au 31 décembre 2021,
      l'article 3.15 des statuts vise l'adhérent « âgé de 65 ans », et il
      borne le report « de 1 à 5 ans », cinq années au plus ; sous
      condition de cent vingt trimestres dans le régime ; il majore TOUS
      les points et non ceux des trente premières années, ce que rien
      dans le modèle ne distingue. Aucun statut de la caisse ne date la
      règle dans l'index : elle est servie depuis 2013, borne de
      période, et rien avant.
