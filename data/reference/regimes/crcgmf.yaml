code: crcgmf
nom: >-
  Caisse de retraites du personnel sédentaire des sociétés du groupe de la Compagnie générale maritime et financière (CRCGMF)
famille: special
population: >-
  Personnel sédentaire — à terre — des sociétés du groupe de la Compagnie
  générale maritime et financière qui relevait des statuts du personnel de
  la Compagnie générale transatlantique et de la Compagnie des messageries
  maritimes, les navigants relevant de l'ENIM : caisse autorisée comme
  institution du titre III du livre VII du code de la sécurité sociale
  (arrêté du 30 novembre 1990), puis comme institution de retraite
  supplémentaire du titre IV du livre IX (arrêté du 10 avril 1995), gérée
  par la Caisse des dépôts.
