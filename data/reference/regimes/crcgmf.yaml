    - {reference: "arrêté du 30 novembre 1990 approuvant la modification des statuts de la caisse de retraites du personnel sédentaire des sociétés du groupe de la CGMF (institution du titre III du livre VII du code de la sécurité sociale)", id: JORFTEXT000000526848}
