  raison_hors_champ: >-
    Une retraite d'entreprise, devenue supplémentaire : la caisse est une
    institution de retraite supplémentaire depuis 1995, au-dessus des
    régimes obligatoires du personnel à terre, et le modèle ne décrit que
    les régimes légalement obligatoires. Son règlement n'est pas publié,
    et l'index ne dit pas quel régime de base couvrait ce personnel avant
    1990.
