    part_salariale: 0.3343
    decote_par_trimestre: 0.0125
    surcote_par_trimestre: null
    avantages_non_contributifs:
      [minimum_vieillesse, reversion]
    notes: >-
      Taux repris du régime général, comme l'exigent R. 382-89 pour la part
      de l'assuré et R. 382-90 pour celle de la congrégation : « le taux de
      la cotisation d'assurance vieillesse des assurés est celui de la
      cotisation mise à la charge des salariés affiliés au régime
      général ». Assiette forfaitaire égale au SMIC mensuel, soit
      2028 heures de SMIC par an (169 heures par mois).
      LA SURCOTE N'EXISTAIT PAS, et la fiche en servait une. Le régime des
      cultes reprend les règles du régime général — c'est ce que dit déjà
      la note sur les taux —, et le régime général n'a de surcote que
      depuis la loi du 21 août 2003, appliquée aux liquidations de 2004 :
      0,75 % par trimestre jusqu'en 2008, 1,25 % ensuite. La fiche servait
      1,25 % dès 1979 : un ministre du culte parti en 1996 avec plus que
      la durée requise voyait sa pension majorée de dix pour cent que
      personne ne lui devait.
      NI ÂGE LÉGAL NI MINIMUM CONTRIBUTIF AVANT 1998. La pension se calcule
      « sur des bases forfaitaires, en fonction de la durée d'assurance »
      (L. 721-6, rédaction de 1985) : le maximum de D. 721-8 au prorata de
      cent cinquante trimestres (D. 721-7), à soixante-cinq ans (D. 721-6).
      La fiche servait dès 1979 les règles du régime général, à l'âge légal
      et avec le minimum contributif, jusqu'au 3 octobre 2026 (fiche
      `cultes_fractions_de_pension`).
