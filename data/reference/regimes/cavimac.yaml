code: cavimac
rang: 620
nom: >-
  Régime d'assurance vieillesse des ministres des cultes et des membres des
  congrégations et collectivités religieuses (CAVIMAC)
famille: special
source_id: dila_legi_cultes
fiabilite: haute
creation: 1979
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Ministres des cultes et membres des congrégations et collectivités
  religieuses. Régime créé par la loi du 2 janvier 1978, géré par la
  CAMAVIC puis, depuis 1998, par la CAVIMAC. Un assuré n'y a pas de
  salaire : la cotisation porte sur un forfait égal au SMIC mensuel,
  supporté pour partie par lui et pour partie par sa congrégation —
  c'est pourquoi le régime est rangé en `special` et non en
  `non_salarie` : il a bel et bien un payeur employeur.
hors_repartition: false
