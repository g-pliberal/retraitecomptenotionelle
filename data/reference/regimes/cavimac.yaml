    notes: >-
      Taux repris du régime général, comme l'exigent R. 382-89 pour la part
      de l'assuré et R. 382-90 pour celle de la congrégation : « le taux de
      la cotisation d'assurance vieillesse des assurés est celui de la
      cotisation mise à la charge des salariés affiliés au régime
      général ». Assiette forfaitaire égale au SMIC mensuel, soit
      1820 heures de SMIC par an (151,67 heures par mois).
      LE SALAIRE ANNUEL MOYEN EST FAIT DU FORFAIT, et non du revenu saisi :
      la caisse le calcule « sur la base du SMIC [...] pour tous les assurés
      cultuels » (page « Demander ma retraite de base », lue le 23 septembre
      2026), ce que le moteur fait depuis dans `assiette_de_reference`
      (`droit/liquider.py`). Il
      appliquait en revanche les règles d'après 1998 à toute la carrière, et
      ne comptait pas les années d'avant 1979, que la caisse valide
      gratuitement. Il sert depuis le 3 octobre 2026 la fraction des périodes
      d'avant 1998 à ses règles — le maximum de la pension au prorata de la
      durée, porté au minimum contributif au taux plein —, et ne fait que de
      celles d'après 1998 le salaire annuel moyen et la durée de la fraction
      du régime général (fiche `cultes_fractions_de_pension`, `droit/cultes.py`).
