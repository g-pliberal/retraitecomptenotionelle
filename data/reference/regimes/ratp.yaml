    age_surcote_regimes_speciaux: true
    avantages_non_contributifs: [bonifications, categorie_active, majoration_enfants, reversion]
    notes: >-
      LE RELÈVEMENT DE 2017 EST ÉTALÉ PAR GÉNÉRATION, quatre mois par
      année de naissance : l'article 51-1 II du décret n° 2008-637
      (LEGIARTI000023732424, décret n° 2011-292 du 18 mars 2011, effet au
      1er janvier 2017) fixe l'âge d'ouverture de la catégorie tableau B
      (cinquante-deux ans) à cinquante ans pour les agents nés avant 1967,
      puis quatre mois de plus par année de naissance jusqu'à
      cinquante-deux ans pour les agents nés à compter de 1972 ; même
      calendrier de cinquante-cinq à cinquante-sept ans pour le tableau A.
      La fiche le lit PAR GÉNÉRATION (`age_table`) : chaque agent a l'âge
      de sa génération, quelle que soit l'année où il part, et non celui
      de la seule génération qui l'atteint l'année de la liquidation,
      comme le faisaient ses périodes annuelles. L'âge de référence de la
      décote (`bareme_decote: regimes_speciaux`) suit, cinq ans au-dessus.
      LA DURÉE REQUISE SE LIT À LA DATE OÙ L'AGENT RÉUNIT LES CONDITIONS,
      pour les retraités comme pour les actifs. La réforme de 2008 la fait
      monter de 151 à 166 trimestres selon cette date, de juillet 2008 à
      juillet 2018 (`duree_requise_calendrier: regimes_speciaux_2008`) ;
      la table par génération de 2014 ne vaut qu'à compter du 1er juillet
      2019, et celle de 2023 qu'à compter du 1er janvier 2025, les décrets
      gardant « les règles applicables avant » à qui a réuni les
      conditions plus tôt (`duree_requise_table`, essayées dans l'ordre).
      La fiche opposait à tous la table commune par génération : 167
      trimestres à un agent né en 1960 parti en 2010, dont le droit en
      demande 154.

