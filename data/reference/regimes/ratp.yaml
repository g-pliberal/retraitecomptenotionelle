    surcote_par_trimestre: 0.0125
    taux_majoration_enfants: [0.0, 0.0, 0.0, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55]
    age_surcote_regimes_speciaux: true
    avantages_non_contributifs: [bonifications, categorie_active, majoration_enfants, reversion]
    notes: >-
      RÉFORME DES RÉGIMES SPÉCIAUX DE 2008, et elle ne touche pas tout en
      même temps. Le décret n° 2008-637 du 30 juin 2008 crée la décote et
      aligne la durée, mais les BORNES D'ÂGE ne bougent qu'à partir de
      2017, et par génération. La fiche portait 52 et 57 ans dès 2009 :
      elle opposait à un machiniste parti en 2012 un âge que le régime ne
      lui demandait que cinq ans plus tard. LA DÉCOTE ARRIVE AVEC QUATRE
      ANS DE RETARD, et la fiche la servait pleine dès 2009. Le calendrier
      est écrit mot pour mot, et à l'identique, dans chacun des décrets de
      la réforme : « le coefficient de minoration […] n'est applicable
      qu'aux personnes remplissant les conditions […] à compter du 1er
      juillet 2010 […] il est fixé par trimestre manquant à un dixième du
      taux prévu […] ce taux augmente du même montant au 1er juillet de
      chaque année ». Un départ de 2011 décotait donc de 0,125 % par
      trimestre manquant, non de 1,25 % : dix fois moins, et le plafond de
      vingt trimestres retirait 2,5 % de la pension au lieu de 25 %. L'âge
      d'annulation monte de même, de l'âge de référence diminué de seize
      trimestres en 2010 jusqu'à l'âge de référence lui-même en 2024. La
      période branche donc `bareme_decote: regimes_speciaux`, qui lit ce
      calendrier dans `legislation/decote_regimes_speciaux.csv`. LA DURÉE
      REQUISE SE LIT À LA DATE OÙ L'AGENT RÉUNIT LES CONDITIONS, pour les
      retraités comme pour les actifs. La réforme de 2008 la fait monter
      de 151 à 166 trimestres selon cette date, de juillet 2008 à juillet
      2018 (`duree_requise_calendrier: regimes_speciaux_2008`) ; la table
      par génération de 2014 ne vaut qu'à compter du 1er juillet 2019, et
      celle de 2023 qu'à compter du 1er janvier 2025, les décrets gardant
      « les règles applicables avant » à qui a réuni les conditions plus
      tôt (`duree_requise_table`, essayées dans l'ordre). La fiche
      opposait à tous la table commune par génération : 167 trimestres à
      un agent né en 1960 parti en 2010, dont le droit en demande 154.

