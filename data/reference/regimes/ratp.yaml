    notes: >-
      LE RELÈVEMENT DE LA LOI DU 14 AVRIL 2023 EST ÉTALÉ PAR GÉNÉRATION,
      trois mois par année de naissance, aux pensions prenant effet à
      compter du 1er janvier 2025 : le 1° du II de l'article 51-1 du
      décret n° 2008-637, dans sa rédaction du décret n° 2023-690 du 28
      juillet 2023 (LEGIARTI000047914257, en vigueur, relu le 22 septembre
      2026), porte l'âge d'ouverture des emplois du tableau B — le
      personnel roulant, cinquante-quatre ans au 2° du II de l'article 6
      (LEGIARTI000047913991) — de cinquante-deux ans (nés en 1972) à
      cinquante-deux ans et trois mois (1973), six mois (1974), neuf mois
      (1975), cinquante-trois ans (1976), et trois mois (1977), six mois
      (1978), neuf mois (1979), cinquante-quatre ans à compter de 1980 ;
      son 2° celui du tableau A de cinquante-sept à cinquante-neuf ans,
      générations 1968 à 1975 ; son 3° celui des autres agents de soixante
      à soixante-quatre ans. La fiche lit le tableau B PAR GÉNÉRATION (`age_table:
      ratp_roulant_2023`), pour tous les agents.
      L'ÂGE DE RÉFÉRENCE DE LA DÉCOTE EST L'ÂGE D'OUVERTURE FINAL MAJORÉ
      DE TROIS ANS, ET NON L'ÂGE DE L'ASSURÉ MAJORÉ DE CINQ. Le 1° du I de
      l'article 24 (LEGIARTI000047914227) le fixe à « l'âge minimum
      d'ouverture du droit à pension applicable à l'assuré majoré de trois
      ans à l'issue des dispositions prévues aux 1°, 2° et 3° du II de
      l'article 51-1 » — cinquante-quatre plus trois, cinquante-sept ans
      au tableau B —, et le 2° du VII de l'article 51-1 garde de 2025 à
      2033 l'âge de référence d'avant 2023, l'âge d'ouverture majoré de
      cinq ans, qui vaut aussi cinquante-sept ans pour les nés à compter
      de 1972. La fiche le faisait monter jusqu'à cinquante-neuf : un
      machiniste né en 1980 parti à cinquante-quatre ans se voyait opposer
      huit trimestres de décote de trop, soit 10 % de pension. La CRP RATP
      ne publie pas cette règle hors de l'espace de ses affiliés. LA DURÉE
      REQUISE EST CELLE DU RÉGIME, et non la table commune : le I de
      l'article 51 (LEGIARTI000052292971) porte 167 trimestres des nés du
      1er juillet 1959 à 1960, puis un de plus par marche jusqu'à 172 à
      compter de 1968 (`duree_requise_table: ratp`). La suspension de 2026
      n'a pas été reprise par le décret de la RATP. Un ou deux trimestres
      sont retranchés aux durées des carrières longues des générations
      1963-1972 (VIII de l'article 51-1, non porté). LA DURÉE REQUISE SE
      LIT À LA DATE OÙ L'AGENT RÉUNIT LES CONDITIONS, pour les retraités
      comme pour les actifs. La réforme de 2008 la fait monter de 151 à
      166 trimestres selon cette date, de juillet 2008 à juillet 2018
      (`duree_requise_calendrier: regimes_speciaux_2008`) ; la table par
      génération de 2014 ne vaut qu'à compter du 1er juillet 2019, et
      celle de 2023 qu'à compter du 1er janvier 2025, les décrets gardant
