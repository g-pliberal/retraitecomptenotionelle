    notes: >-
      « À compter du 1er janvier 1990 » (R. 732-70), la cotisation ouvre un
      nombre de points qui dépend du revenu par un escalier à quatre marches
      écrit à l'article R. 732-71 — voir `points_msa` dans le moteur (droit/acquerir.py), et
      la section de docs/limites.md qui refait l'arithmétique.
      Le minimum d'assiette de la cotisation qui ouvre ces points est de 400
      SMIC horaires jusqu'au décret n° 2004-783 (décret n° 90-498, article 9,
      II ; décret n° 94-690, article 14, II ; décret n° 2001-584, article 11,
      II), soit quinze points : le moteur y servait les 600 SMIC d'après, et
      22,5 points, jusqu'au 27 septembre 2026.
      Âge de soixante ans depuis la loi du 6 janvier 1986, taux plein à
      soixante-cinq ans ou avec cent cinquante trimestres tous régimes
      (L. 732-25, LEGIARTI000006585545) ; la loi du 22 juillet 1993 n'a
      pas touché ce régime, qui n'est pas un régime aligné.
  - debut: 2003
    fin: 2003
    type_calcul: mixte
    age_ouverture: 60
    age_taux_plein: 65
