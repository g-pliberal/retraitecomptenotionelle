      multipliée par le quart des trimestres d'avant 2016, par la valeur du
      point et par cent cinquante sur la durée de la génération (R. 732-66).
      Chaque moyenne porte sur la part des vingt-cinq années que R. 173-3-2
      donne à sa période, au prorata des durées. La minoration de R. 351-27
      et la surcote du régime général s'appliquent, et la pension ne dépasse
      pas la moitié du plafond (L. 732-24, III). Pour qui n'a été affilié
      qu'à partir de 2016, le 1° seul, sur toutes ses années.
      LES POINTS NE S'ACQUIÈRENT PLUS : R. 732-69 à D. 732-77 sont abrogés
      pour les pensions prenant effet depuis 2026 (décret n° 2025-1409,
      article 1er), et leur barème ne vaut plus que pour les points d'avant
      2016 et, à titre provisoire, pour ceux de 2016 à 2027. La période ne le
      porte donc pas : ses années comptent par leur revenu.
