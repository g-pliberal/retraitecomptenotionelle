  manque: >-
    Le barème en points d'avant 1990 n'est pas lu, et ses années entrent dans
    la moyenne de la réforme de 2026 par les points que vaut leur rendement ;
    conjoints et aides familiaux sont sous-estimés.
# LA MAJORATION POUR TROIS ENFANTS, lue le 5 octobre 2026 dans l'index LEGI
# (action 89) : « à compter du 1er juillet 1974 », les avantages de
# vieillesse « sont augmentés d'une bonification d'un dixième pour tout
# bénéficiaire de l'un ou de l'autre sexe ayant eu au moins trois enfants »,
# ou en ayant élevé trois neuf ans avant leurs seize ans (décret n° 55-753,
# article 37, LEGIARTI000006763657) ; codifiée à D. 732-38 du code rural le
# 22 avril 2005 (LEGIARTI000006597504) ; abrogée au 1er janvier 2026 par le
# décret n° 2025-1409, qui renvoie à L. 351-12 pour les pensions prenant
# effet depuis. Le guide de la MSA le dit aussi : « au moins 3 enfants, le
# montant de votre retraite est majoré de 10 % ». Aucune période ne la
# déclarait ; la période de 1952 est coupée en 1974.
