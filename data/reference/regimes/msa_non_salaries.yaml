      La retraite forfaitaire, elle, vaut 3 628,98 € au 1er janvier 2023
      (communiqué de la MSA du 14 février 2023) pour une carrière complète.
      LA RÉFORME DE 2026 NE TOUCHE PAS CETTE PÉRIODE, qui liquide des
      pensions d'avant 2026 : celles qui prennent effet depuis le 1er janvier
      2026 relèvent des périodes de 2026 et de 2028 (fiche
      pension_non_salaries_agricoles_2026), où les points qu'elle attribue ne
      comptent plus que selon L. 732-24 dans sa rédaction de 2026.
      LA SURCOTE EST DATÉE, et la période en servait une dès 2003. Elle
      naît de la loi du 21 août 2003, pour les liquidations de 2004, à
      0,75 % par trimestre ; elle passe à 1,25 % en 2009. La période est
      scindée pour cela seul : rien d'autre n'y change.
      LA LOI WOERTH S'APPLIQUE AUX PENSIONS PRENANT EFFET À COMPTER DU
      1ER JUILLET 2011 : L. 732-18 (LEGIARTI000023030985) renvoie l'âge
      d'ouverture à l'article L. 161-17-2, et L. 732-25 (versions
      LEGIARTI000023030980 puis LEGIARTI000028498264) l'âge d'annulation à
      ce même âge « augmenté de cinq années » et la durée à
      l'article L. 161-17-3 : âges, durée et coefficient se lisent à la
      génération, ce qui porte aussi les lois de 2014 et de 2023 (à
      compter du 1er septembre 2023, LEGIARTI000047452862). Les valeurs
      écrites ne sont que le repli hors table.
      LA SURCOTE EST SERVIE PAR LA BRANCHE EN POINTS, à la règle du
      régime général : D. 732-42 (LEGIARTI000006597431, puis
      LEGIARTI000023397787 pour les pensions prenant effet à compter du
      1er juillet 2011) compte la durée « accomplie à compter du 1er
      janvier 2004, au-delà de l'âge fixé à l'article L. 732-18 et au-
      delà de la durée minimale prévue à l'article L. 732-25 », quatre
      trimestres par an au plus. L'escalier de 3 %, 4 % et 5 % par année
      qu'il écrit pour les trimestres d'avant 2009 est ramené à 0,75 %
      par trimestre, comme la fiche du régime général le fait pour la
      même période.
