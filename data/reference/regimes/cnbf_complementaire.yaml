code: cnbf_complementaire
rang: 490
nom: Régime complémentaire obligatoire des avocats (CNBF)
famille: liberal
source_id: cnbf_baremes
fiabilite: haute
creation: 1979
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Avocats. Régime en points, obligatoire, à trois classes de cotisation —
  C1, C2 et C2+ — dont seule la première s'impose sans option.
hors_repartition: false
periodes:
  - debut: 1979
    fin: 2015
    type_calcul: points
    age_ouverture: 62
    age_ouverture_par_generation: true
    age_taux_plein: 67
    age_taux_plein_par_generation: true
    duree_requise_trimestres: 172
    duree_requise_par_generation: true
    taux_plein: 1.0
    salaire_reference: carriere_entiere
    assiette: deplafonnee
    taux_cotisation_retraite: 0.0800
    decote_par_trimestre: 0.0125
    surcote_par_trimestre: null
    avantages_non_contributifs: [reversion]
    notes: >-
      Avant 2016, la CNBF ne met en ligne aucun barème : ces années
      restent au rendement instantané, sur un taux moyen de 8 %. La grille
      de 2016 donne 3,20 % à 8,80 % en classe C1 : ce taux moyen est donc
      celui d'un revenu élevé, et SURESTIME les cotisations d'un revenu
      modeste. La progressivité par tranches n'est pas reproduite ici.

  - debut: 2016
    fin: 2016
    type_calcul: points
    age_ouverture: 62
    age_ouverture_par_generation: true
    age_taux_plein: 67
    age_taux_plein_par_generation: true
    duree_requise_trimestres: 172
    duree_requise_par_generation: true
    taux_plein: 1.0
    salaire_reference: carriere_entiere
    assiette: deplafonnee
    borne_basse_euros: 0
    borne_haute_euros: 41674
    taux_cotisation_retraite: 0.0320
    decote_par_trimestre: 0.0125
    surcote_par_trimestre: null
    avantages_non_contributifs: [reversion]
    notes: >-
      Première tranche de la grille, classe C1 (barème 2016).
      GRILLES LUES ANNÉE PAR ANNÉE dans les barèmes de la caisse, de 2016
      à 2026 (celui de 2016 est une image, celui de 2024 n'est plus en
      ligne et a été lu dans Internet Archive, capture du 15 juillet
      2024). La fiche portait depuis 2019 la grille de 2026, alors que le
      taux de la première tranche a doublé en dix ans : 3,20 % en 2016,
      3,80 % en 2019, 5,00 % en 2024, 7,00 % en 2026. Elle surestimait
      donc, sur les années 2019 à 2024, les cotisations et les points
      d'un avocat au revenu modeste de près de moitié.
      CLASSE C1 RETENUE. Plusieurs classes coexistent, et rien ne permet
      de deviner celle d'un avocat donné. C1 est celle qui s'applique
      SANS option, et le modèle ne prête jamais à personne un avantage
      facultatif.
      LES TRANCHES SONT FIXÉES EN EUROS, ET LA CAISSE NE LES INDEXE PAS :
      41 674 € de 2016 à 2020, 42 507 € depuis 2021, quand le plafond de
      la Sécurité sociale passait de 38 616 à 48 060 €. D'où le champ
      `borne_haute_euros`.
      2025 : deux barèmes coexistent, l'ancien sur l'assiette nette
      (5,20 % en première tranche) et le nouveau sur l'assiette de la
      réforme des indépendants (7,00 %). La fiche suit, comme tout le
      catalogue, l'année du revenu : le revenu de 2025 relève du nouveau.
      Au-delà de la dernière borne, la cotisation ne progresse plus : le
      revenu excédentaire n'ouvre aucun droit complémentaire.

