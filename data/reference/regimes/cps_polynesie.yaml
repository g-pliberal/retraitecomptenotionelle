    notes: >-
      SOURCE, TRANCHE A ET COTISATION comme en 2023. LA MONTÉE EN CHARGE
      DE LA LOI DU PAYS N° 2019-6 DU 1er FÉVRIER 2019 SUIT L'ANNÉE DU
      DÉPART, ET NON LA GÉNÉRATION : le rapport annuel 2020 du Conseil
      d'orientation et de suivi des retraites de la Polynésie française,
      « source CPS 2020 », donne l'âge légal et la durée d'assurance
      suffisante par date — 60 ans et 420 mois jusqu'au 31 décembre
      2019, 60 ans et 6 mois et 429 mois au 1er janvier 2020, 61 ans et
      438 mois au 1er janvier 2021, 61 ans et 6 mois et 447 mois au 1er
      janvier 2022, 62 ans et 456 mois au 1er janvier 2023 —, la durée «
      à raison de 9 mois par an à compter de 2020 », et son tableau des
      abattements les lit à l'« année du départ en retraite ». Il ne dit
      rien d'un droit acquis par qui avait l'âge avant 2020. Départs de
      2020 : 60 ans et 6 mois, 429 mois, soit 143 trimestres. Les
      abattements de la réforme, que la fiche ne porte pas : 1,5 % par
      trimestre d'anticipation avant l'âge légal, dès 57 ans, et 0,5 %
      par trimestre manquant à la durée suffisante, supprimés à l'« âge
      suffisant » de 65 ans depuis le 1er juillet 2019 (tableaux 3 et 4
      du même rapport). Salaire de référence : quinze ans, écrit ici
      comme les dix meilleures années, la valeur la plus proche du
      catalogue.
