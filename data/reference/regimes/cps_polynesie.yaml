code: cps_polynesie
rang: 60
nom: >-
  Régime de retraite des travailleurs salariés de Polynésie française, tranche A (CPS)
famille: base_prive
etage: base
source_id: sites_institutionnels
fiabilite: estimee
creation: 1968
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Salariés de Polynésie française, affiliés à la Caisse de prévoyance
  sociale depuis 1968 (régime général des salariés, RGS) : pension de la
  tranche A en annuités, sept dixièmes du salaire moyen des quinze
  meilleures années pour trente-huit ans cotisés ; la tranche B, en
  points, est une fiche à part. Les taux et plafonds de 2026 sont projetés
  sur toute la période.
hors_repartition: false
inventaire:
  section: prive_base
  rang: 90
  nom: Régime de retraite des travailleurs salariés de Polynésie française (CPS)
  population: Salariés de Polynésie française
  couverture: partiel
  statuts: [salarie_polynesie]
  textes:
    - {reference: "fiche du CLEISS « La sécurité sociale des salariés en Polynésie française » et fiche de cotisations 2026 (délibérations de l'assemblée de la Polynésie française, compétence locale, hors JORF)", id: null}
    - {reference: "arrêté n° 1336 IT du 28 septembre 1956 portant organisation et fonctionnement de la caisse de prévoyance sociale ; délibération n° 67-110 AT du 24 août 1967 créant le régime de retraite polynésien ; délibération n° 87-11 AT du 29 janvier 1987 portant institution d'un régime de retraite des travailleurs salariés (tranche A) ; loi du pays n° 2019-6 du 1er février 2019 — cités par le rapport de l'assemblée de la Polynésie française du 14 août 2025 sur l'harmonisation des allocations familiales (hors JORF)", id: null}
    - {reference: "rapport annuel 2020 du Conseil d'orientation et de suivi des retraites de la Polynésie française (service-public.pf, ARASS), tableaux « source CPS 2020 » des conditions d'âge et de durée par date, et tableaux 3 et 4 des paramètres et abattements de la réforme de 2019", id: null}
  manque: >-
    Seuls les taux et plafonds de 2026 sont lus, projetés sur toute la
    période ; le plafond de 269 000 FCFP par mois n'est pas une série du
    dépôt et le plafond national, plus haut, tient lieu. La montée en
    charge de 2020 à 2023 n'est lue que dans le rapport du Conseil
    d'orientation et de suivi des retraites, et les abattements de la
    réforme de 2019 — 1,5 % par trimestre avant l'âge légal, 0,5 % par
    trimestre manquant à la durée, jusqu'à 65 ans — ne sont pas portés.
