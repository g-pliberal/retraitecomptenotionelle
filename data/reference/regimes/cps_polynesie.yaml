      SOURCE : fiche « La sécurité sociale des salariés en Polynésie
      française » et fiche de cotisations 2026 du CLEISS (cleiss.fr, lues
      par scripts/fetch/sites_institutionnels.py), qui résument les
      délibérations de l'assemblée de la Polynésie française, hors JORF.
      TRANCHE A : « 70 % × salaire mensuel moyen × (nombre de mois cotisés
      / 456 mois) », salaire moyen « des 180 meilleures rémunérations
      mensuelles […] au cours des 240 derniers mois », droits « ouverts à
      partir de 62 ans depuis le 1er janvier 2023 », taux plein avec « 38
      ans soit 456 mois ou 152 trimestres depuis 2023 ». COTISATION 2026 :
      « vieillesse tranche A : 15,69 % [employeur], 7,84 % [salarié], 269
      000 FCFP » par mois, soit 23,53 % dont un tiers salarial ; le
      plafond de 269 000 FCFP (2 254 €) est lu comme 0,69 plafond national
      — la fiche prend le plafond national, plus haut. AVANT 2023 : 60 ans
      et 35 ans cotisés (420 mois), les paramètres d'avant la réforme de
      2023 tels que la fiche du CLEISS les oppose à ceux « depuis 2023 » ;
      la montée en charge n'est pas lue, la fiche coupe au 1er janvier
      2023. Salaire de référence : quinze ans, écrit ici comme les dix
      meilleures années, la valeur la plus proche du catalogue.
