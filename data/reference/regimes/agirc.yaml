    notes: >-
      Taux contractuel 8 % appelé à 100 % : 8 % prélevés sur l'assiette,
      dont un quart à la charge du salarié (OpenFisca-France, valeurs au
      1er janvier 1947, inchangées jusqu'en 1951). Convention collective
      nationale du 14 mars 1947 (arrêté d'agrément du 31 mars 1947,
      JORFTEXT000000653842) : taux contractuel de 8 % sur la tranche B,
      appelé à 100 %. OpenFisca-France date sa série de 1948 ; 1947 porte
      la même valeur. MÉTHODE DE LA TRANCHE B3. Ni le JORF ni LEGI ne
      chiffrent le barème de l'Agirc avant 1980 : la convention de 1947 et
      ses avenants ne sont ni au Journal officiel ni dans KALI, et les
      notices d'avant 1990 n'ont pas de corps. La série est celle
      d'OpenFisca-France (transcription du Barème social périodique,
      niveau `haute`), barème des ENTREPRISES ADHÉRENTES AVANT 1981 — la
      population la plus nombreuse ; les entreprises créées après 1981
      cotisaient 12 % dès 1983, un barème que le modèle ne prête à
      personne. Le taux porté ici est le taux EFFECTIF, contractuel ×
      appel : le moteur retire le taux d'appel (regimes/valeurs_point.csv,
      série identique à celle d'OpenFisca) pour ne convertir en points que
      la part contractuelle. Une période par changement de l'un ou de
      l'autre.

