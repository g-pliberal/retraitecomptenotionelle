    notes: >-
      LE RELÈVEMENT DE 2017 EST ÉTALÉ PAR GÉNÉRATION, quatre mois par
      année de naissance : l'article 37-1 du décret n° 2008-639
      (LEGIARTI000023732614, en vigueur au 1er janvier 2017) fixe l'âge
      d'ouverture de la catégorie agent de conduite à cinquante ans pour
      les agents nés avant 1967, cinquante ans et quatre mois pour 1967,
      et huit mois pour 1968, cinquante et un ans pour 1969, et quatre
      mois pour 1970, et huit mois pour 1971, cinquante-deux ans à compter
      de 1972 ; cinquante-cinq à cinquante-sept ans, générations 1962 à
      1967, pour les autres agents. La fiche le lit PAR GÉNÉRATION
      (`age_table`) : chaque agent a l'âge de sa génération, quelle que
      soit l'année où il part, et non celui de la seule génération qui
      l'atteint l'année de la liquidation, comme le faisaient ses périodes
      annuelles. L'âge de référence de la décote (`bareme_decote:
      regimes_speciaux`) suit, cinq ans au-dessus. LA DURÉE REQUISE SE LIT
      À LA DATE OÙ L'AGENT RÉUNIT LES CONDITIONS, pour les retraités comme
      pour les actifs. La réforme de 2008 la fait monter de 151 à 166
      trimestres selon cette date, de juillet 2008 à juillet 2018
      (`duree_requise_calendrier: regimes_speciaux_2008`) ; la table par
      génération de 2014 ne vaut qu'à compter du 1er juillet 2019, et
      celle de 2023 qu'à compter du 1er janvier 2025, les décrets gardant
