    notes: >-
      LE RELÈVEMENT DE LA LOI DU 14 AVRIL 2023 EST ÉTALÉ PAR GÉNÉRATION,
      trois mois par année de naissance, aux pensions prenant effet à
      compter du 1er janvier 2025 : l'article 37-1 du décret n° 2008-639,
      dans sa rédaction du décret n° 2023-967 du 20 octobre 2023
      (LEGIARTI000048896987, en vigueur, relu le 22 septembre 2026) porte
      l'âge d'ouverture de la catégorie agent de conduite de
      cinquante-deux ans (nés en 1972) à cinquante-deux ans et trois mois
      (1973), six mois (1974), neuf mois (1975), cinquante-trois ans
      (1976), et trois mois (1977), six mois (1978), neuf mois (1979),
      cinquante-quatre ans à compter de 1980 ; l'âge des autres agents de
      cinquante-sept à cinquante-neuf ans, générations 1968 à 1975. La
      fiche le lit PAR GÉNÉRATION (`age_table`), pour tous les agents.
      L'ÂGE DE RÉFÉRENCE DE LA DÉCOTE NE MONTE PAS AVEC L'ÂGE D'OUVERTURE
      : le 1° du I de l'article 13, dans sa rédaction issue du même décret
      (LEGIARTI000048897107, puis LEGIARTI000054622824 depuis le décret n°
      2026-738 du 4 août 2026, qui n'y touche pas), le FIXE « à
      cinquante-sept ans pour les agents mentionnés au 1° du I de
      l'article 1 et à soixante-deux ans pour les agents mentionnés au 2°
      ». La fiche le faisait monter cinq ans au-dessus de l'âge
      d'ouverture, jusqu'à cinquante-neuf ans : un agent de conduite né en
      1980 parti à cinquante-quatre ans se voyait opposer vingt trimestres
      de décote au lieu de douze, soit 10 % de pension. La CPRPSNCF
      l'écrit de son côté (« Réforme des retraites 2023 », lue le 22
      septembre 2026) : « L'âge d'annulation de la décote est inchangé »,
      cinquante-sept ans pour les agents de conduite nés à compter de
      1975. Les soixante-deux à soixante-quatre ans des générations 1963 à
      1970 que la fiche prenait pour l'âge d'annulation sont ceux de la
      SURCOTE (IV de l'article 37-1, qui renvoie au II de l'article 13).
      LA DURÉE REQUISE EST CELLE DU RÉGIME, et non la table commune : le I
      de l'article 35 (LEGIARTI000048897024) donne aux agents de conduite
      167 trimestres des nés de novembre 1968 à 1969, puis un de plus par
      marche jusqu'à 172 à compter de 1978, et son II en retranche deux à
      dix pour compter la décote par la durée (`duree_requise_table:
      sncf_conduite`). La suspension de 2026 n'a pas été reprise par le
      décret de la SNCF. Un ou deux trimestres sont retranchés aux durées
      des carrières longues des générations 1968-1977 (VI de l'article
      37-1, non porté). LA DURÉE REQUISE SE LIT À LA DATE OÙ L'AGENT
      RÉUNIT LES CONDITIONS, pour les retraités comme pour les actifs. La
      réforme de 2008 la fait monter de 151 à 166 trimestres selon cette
      date, de juillet 2008 à juillet 2018 (`duree_requise_calendrier:
      regimes_speciaux_2008`) ; la table par génération de 2014 ne vaut
      qu'à compter du 1er juillet 2019, et celle de 2023 qu'à compter du
      1er janvier 2025, les décrets gardant « les règles applicables avant
      » à qui a réuni les conditions plus tôt (`duree_requise_table`,
      essayées dans l'ordre). La fiche opposait à tous la table commune
      par génération : 167 trimestres à un agent né en 1960 parti en 2010,
      dont le droit en demande 154.
