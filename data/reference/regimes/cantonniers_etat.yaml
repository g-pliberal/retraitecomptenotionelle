code: cantonniers_etat
nom: >-
  Régime de retraites des cantonniers de l'État et pensions sur fonds spéciaux (chemin de fer de l'Hérault, cantonniers de l'Isère)
famille: fonction_publique
population: >-
  Cantonniers et agents des Ponts et Chaussées affiliés au régime de
  retraites du décret du 22 février 1896, qui constituait des rentes
  viagères dont un décret fixait chaque année le montant maximum (décret
  n° 50-430 du 4 avril 1950 pour 1949), et, parmi les « pensions sur
  fonds spéciaux » que la Caisse des dépôts gère, les pensions des agents
  du chemin de fer de l'Hérault et des cantonniers de l'Isère. En 1993,
  « chemin de fer de l'Hérault, cantonniers de l'Isère » et la direction
  départementale de l'équipement de Maine-et-Loire figurent encore parmi
  les débiteurs de pensions qui contribuent au fonds spécial d'allocation
  vieillesse.
creation: 1896
