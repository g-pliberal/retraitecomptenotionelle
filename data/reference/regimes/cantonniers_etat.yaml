  raison_hors_champ: >-
    Des rentes viagères constituées avant la sécurité sociale pour des
    agents des Ponts et Chaussées et de services départementaux, dont il
    ne reste que des pensions résiduelles, gérées en fonds spéciaux par
    la Caisse des dépôts : plus de carrière à simuler. L'index n'a des
    textes de 1896 et 1950 que les titres.
