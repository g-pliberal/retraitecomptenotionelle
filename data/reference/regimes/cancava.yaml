    decote_annulee_par_la_duree: false
    surcote_par_trimestre: null
    avantages_non_contributifs:
      [minimum_vieillesse, majoration_enfants, mda,
       reversion, periodes_assimilees]
    notes: >-
      ALIGNEMENT DE 1973, ET IL SE SUIT DANS LE TEMPS. La loi du 3 juillet
      1972 aligne le régime de base sur le régime général à compter du
      1er janvier 1973 : les points acquis avant sont conservés et convertis
      (« droits en points »). L'alignement emporte les règles du régime
      général — durée requise, salaire de référence, décote, surcote,
      majorations familiales de l'article L. 634-2 —, ET IL LES EMPORTE
      TOUTES, y compris leurs changements. La fiche portait une seule
      période de 1973 à 2006, avec la durée requise de 160 trimestres et les
      vingt-cinq meilleures années : un artisan parti en 1980 se voyait donc
      opposer une durée que le droit ne lui demandait pas — 150 trimestres —
      et une décote de 1,25 % par trimestre quand elle était de 2,5 %.
      Les quatre périodes qui suivent sont celles du régime général, bornées
      à l'alignement de 1973 et à l'absorption dans le RSI en 2006.
      TAUX DE COTISATION : 11.43 % est la moyenne 1973-1982 des taux datés
      que transcrit OpenFisca-France
      (`cotisations_taxes_independants_artisans_commercants/ret_ac/artisans/sous_pss`,
      décrets d'application de la loi du 3 juillet 1972) — 8,75 % en 1973,
      10,25 % en 1974, 11,15 % en octobre 1976, 12,9 % en 1979. La fiche
      portait 16,55 % de 1973 à 2006, un chiffre de synthèse qui surcomptait
      de cinq points la cotisation des années 1970 ; `verifier_donnees.py`
      confronte désormais chaque période à la série. ET DEPUIS 1973, C'EST
      LE TAUX DE CHAQUE ANNÉE QUI EST APPLIQUÉ, lu dans
      `taux_cotisation_annuels.csv` : le chargeur découpe la période année
      par année, et la moyenne ne sert plus qu'au contrôle.
