    # Les points gratuits des chefs d'exploitation pour leurs années
    # d'avant 2003 : D. 732-154 (100 points par année, dans la limite de
    # 37,5 ans moins les années de RCO), D. 732-151 (17,5 ans comme chef),
    # L. 732-56, II, 2° et III (taux plein ; liquidé au taux plein depuis
    # le 1er septembre 2023, loi n° 2023-270, art. 18, VI).
    points_gratuits:
      regime: msa_non_salaries
      avant: 2003
      points_par_annee: 100
      annees_minimum: 17.5
      annees_maximum: 37.5
      taux_plein_depuis: "2023-09"
    notes: >-
      Loi du 4 mars 2002, articles L. 732-56 et suivants du code rural.
      Étage scindé de la fiche `msa_non_salaries`, qui agrégeait les deux :
      tout verser dans le complémentaire aurait fait disparaître la base,
      et c'est ce qui bloquait l'emploi de la série de valeurs de service
      déjà présente au dépôt, certifiée de 2005 à 2024 depuis l'article
      D. 732-166 (base LEGI de la DILA).
      Ce qui débloque le calcul n'est pas un prix d'achat — l'arrêté qui le
      fixe ne modifie pas le code, et il reste introuvable — mais le BARÈME
      EN POINTS, qui, lui, est public : cotiser sur l'assiette minimale
      ouvre le nombre de points que fixe D. 732-155 — 100 jusqu'en 2016,
      117 en 2017, 133 à compter de 2018 —, et les points sont
      proportionnels au-delà, sans plafond (P = N × RP / 1 820 SMIC). Le
      nombre de points ne dépend donc pas du taux de cotisation.
      Le taux de 4 % est celui en vigueur depuis 2018 (D. 732-165 ;
      assiette minimale 1 820 SMIC pour les chefs d'exploitation, 1 200 pour
      les aides familiaux). Les périodes précédentes portent 2,97 % de 2003
      à 2009, 3 % de 2010 à 2016 et 3,5 % en 2017, et un minimum de 2 028,
      1 957 puis 1 888 SMIC de 2003 à 2005, lus le 27 septembre 2026 : une
      seule période portait jusque-là 1 820 SMIC, 100 points et 4 % depuis
      2003. Le taux ne déplace pas la pension calculée ici, qui ne dépend
      que du barème en points, mais le flux versé au compte notionnel.
      LES POINTS GRATUITS DES CHEFS D'EXPLOITATION SONT SERVIS
      (`points_gratuits`, lus sur Légifrance et sur la page de la MSA le 23
      septembre 2026) : cent par année de chef d'avant 2003, dans la limite
      de 37,5 ans moins les années de RCO, à qui réunit dix-sept ans et
      demi comme chef et liquide au taux plein. Une année se compte en
      trimestres validés au régime de base, divisés par quatre ; le modèle
      ne sait pas si l'activité était exercée à titre principal. Restent
      hors du modèle les points gratuits du V et du VI de L. 732-56 — 66
      par an (D. 732-154-1), dix-sept annuités au plus (D. 732-154-3) —
      pour les années de conjoint, d'aide familial ou de collaborateur
      d'avant 2011, et pour celles du chef qui n'a pas ses dix-sept ans et
      demi comme chef. Il faut alors dix-sept ans et demi d'activité non
      salariée agricole à quelque titre que ce soit (D. 732-151-1) : le
      modèle, qui ne connaît que le statut de chef, ne peut pas les réunir
      sans que la règle des cent points s'applique d'abord. Lus le 4 octobre
      2026 avec leurs versions de 2014, 2023 et 2026 : fiche
      `rco_points_gratuits_66` ; la MSA en comptait 448 000 bénéficiaires en
      2017.
