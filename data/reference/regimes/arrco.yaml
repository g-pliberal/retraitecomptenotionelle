    surcote_par_trimestre: null
    avantages_non_contributifs: [majoration_enfants, reversion]
    notes: >-
      Taux contractuel 2,5 % appelé à 100 % : 2,5 % prélevés sur
      l'assiette, dont 40 % à la charge du salarié (OpenFisca-France,
      valeurs au 1er janvier 1961, inchangées jusqu'en 1966). ACCORD
      NATIONAL INTERPROFESSIONNEL DU 8 DÉCEMBRE 1961 (arrêté d'agrément du
      27 mars 1962) : taux contractuel minimal de 2,5 % sur la totalité du
      salaire jusqu'à trois plafonds, appelé à 100 %. OpenFisca-France
      date sa série du 1er janvier 1962 ; 1961 porte la même valeur. Sur
      la tranche 1, le taux est celui de tous les salariés ; sur la
      tranche 2 il n'est dû que par les non-cadres (fiche
      `arrco_tranche_2`). MÉTHODE DE LA TRANCHE B3. L'accord de 1961 et
      ses avenants sont hors JORF ; seuls L. 921-1 et L. 921-4 encadrent
      le régime. La série est celle d'OpenFisca-France (niveau `haute`),
      barème des ENTREPRISES ADHÉRENTES AVANT 1997 ; le taux porté est le
      taux effectif, contractuel × appel, et le moteur retire l'appel pour
      convertir en points. Une période par changement de l'un ou de
      l'autre.

