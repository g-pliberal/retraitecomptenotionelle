code: wallis_et_futuna
rang: 90
nom: >-
  Régime de retraite des salariés de Wallis-et-Futuna (CPSWF)
famille: base_prive
source_id: sites_institutionnels
fiabilite: estimee
creation: 1975
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Salariés de Wallis-et-Futuna, affiliés à la Caisse des prestations
  sociales, héritière de la caisse locale de retraites : pension en
  annuités sur les quinze meilleures années, 2,6 % par an pour quinze ans
  puis 1,3 %, à 60 ans.
hors_repartition: false
periodes:
  - debut: 1975
    fin: 2008
    type_calcul: annuites
    age_ouverture: 60
    age_taux_plein: 60
    duree_requise_trimestres: 120
    taux_plein: 0.585
    salaire_reference: 10_meilleures_annees
    assiette: deplafonnee
    taux_cotisation_retraite: 0.1710
    part_salariale: 0.2164
    decote_par_trimestre: null
    surcote_par_trimestre: null
    avantages_non_contributifs: [reversion]
    notes: >-
      SOURCE : site de la Caisse des prestations sociales des îles Wallis
      et Futuna (cpswf.wf, pages « Retraites » et « Les taux de cotisation
      », lues par scripts/fetch/sites_institutionnels.py) ; délibérations
      de l'assemblée territoriale, hors JORF. PENSION : « salaire moyen
      des 15 meilleures années multiplié par le taux qui correspond au
      nombre d'années de cotisations », « le taux est de 2,60 % pour les
      15 premières années avec 1,30 % par année supplémentaire » — 39 % à
      quinze ans, 58,5 % à trente ans, 71,5 % à quarante ; la fiche écrit
      58,5 % pour 120 trimestres, proratisé, ce qui reproduit le barème
      jusqu'à trente ans et le sous-estime au-delà. ÂGE : « être âgée de
      60 ans », « avoir cotisé à la caisse pendant au moins 15 ans » ;
      aucune décote lue. Les quinze meilleures années sont écrites comme
      les dix du catalogue. Pas de plafond publié : assiette déplafonnée.
      AVANT 2009 : la caisse locale de retraites, absorbée par la CPSWF en
      2012, n'a rien de publié ; le taux de 2009 est projeté en arrière,
      niveau `estimee`, et la création prise à 1975 faute de date.
