code: wallis_et_futuna
rang: 90
nom: >-
  Régime de retraite des salariés de Wallis-et-Futuna (CPSWF)
famille: base_prive
etage: base
source_id: sites_institutionnels
fiabilite: estimee
creation: 1975
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Salariés de Wallis-et-Futuna, affiliés à la Caisse des prestations
  sociales, héritière de la caisse locale de retraites : pension en
  annuités sur les quinze meilleures années, 2,6 % par an pour quinze ans
  puis 1,3 %, à 60 ans.
hors_repartition: false
inventaire:
  section: prive_base
  rang: 120
  nom: Retraite des salariés de Wallis-et-Futuna
  population: Salariés de Wallis-et-Futuna
  couverture: partiel
  statuts: [salarie_wallis_et_futuna]
  textes:
    - {reference: "Caisse des prestations sociales des îles Wallis et Futuna, pages « Retraites » et « Les taux de cotisation » (délibérations de l'assemblée territoriale, hors JORF)", id: null}
    - {reference: "Cour des comptes, observations définitives S2022-2223, « Le territoire des îles Wallis et Futuna, exercices 2016-2021 », délibéré le 14 décembre 2022, p. 33 : la retraite à 21 % des salaires, deux tiers à l'employeur, et les prestations familiales à 6 % de l'employeur ; IEOM, rapports annuels économiques de Wallis-et-Futuna, 2004 à 2022 : le taux de chaque année, et la caisse locale de retraites d'avant 2009", id: null}

  manque: >-
    Le régime existe bel et bien, contrairement à ce que l'inventaire
    disait : 60 ans, quinze ans de cotisation, 2,6 % puis 1,3 % par an sur
    les quinze meilleures années ; dès 55 ans avec 7 % d'abattement par
    année, sans abattement à 57 ans avec 35 années (délibération
    n° 25/AT/2015, non portée). Le taux de cotisation est celui de la
    retraite seule, 11,1 % en 2009 montant à 21 % en 2020, un tiers au
    salarié, et 9 % avant 2009 ; la caisse publie le total de ses
    cotisations, prestations familiales comprises, 17,10 % puis 27 %
    (Cour des comptes, 2022 ; IEOM). Lus, non portés : le barème de la
    caisse locale d'avant 2009, à 55 ans sur les quatre dernières
    années, et sa création en 1977 (IEOM, rapport 2004). Non lus : le
    plafond, la date d'effet de la réforme de 2015, la réforme en
    préparation (65 ans).
