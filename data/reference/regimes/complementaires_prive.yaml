  - code: ipacte
    nom: Institution de prévoyance des agents contractuels et temporaires de l'État
    famille: complementaire_prive
    source_id: ircantec_points
    fiabilite: moyenne
    creation: 1951
    fermeture: 1970
    extinction: 1971
    succede_a: []
    integre_dans: ircantec
    population: >-
      Agents contractuels et temporaires de l'État, sur la part de rémunération
      au-dessus du plafond des assurances sociales.
    hors_repartition: false
    periodes:
      - debut: 1951
        fin: 1970
        type_calcul: points
        age_ouverture: 60
        age_taux_plein: 65
        duree_requise_trimestres: null
        taux_plein: 1.0
        salaire_reference: carriere_entiere
        assiette: tranche_b
        taux_cotisation_retraite: 0.075   # 12,5 % contractuels × appel 60 %
        part_salariale: 0.34   # 4,25 % agent / 8,25 % employeur, décret 51-1445 art. 7
        decote_par_trimestre: 0.011
        surcote_par_trimestre: null
        avantages_non_contributifs: [reversion]
        notes: >-
          TAUX LUS DANS LE TEXTE : « les taux de cotisation à la charge des
          bénéficiaires et des services employeurs sont respectivement fixés à
          4,25 p. 100 et à 8,25 p. 100 » — 12,5 % en tout, dont 34 % à la
          charge de l'agent —, article 7 du décret n° 51-1445
          (LEGIARTI000006368159), le même article qui donne l'assiette. Ce
          sont des taux CONTRACTUELS : le même article prévoit une réduction
          des cotisations qui « n'affecte pas le calcul des points ni celui de
          la valeur du point », c'est-à-dire un taux d'appel, que l'index ne
          chiffre pas (arrêté du 31 décembre 1953 « suspensions et réduction
          du montant des cotisations », JORFTEXT000000283470, titre seul).
          L'Ircantec, qui reprend ces taux mot pour mot au 1er janvier 1971
          (décret n° 70-1277, article 7, LEGIARTI000006368121 : « 4,25 % et
          8,25 % » au-dessus du plafond), les appelle à 60 % (Caisse des
          dépôts, série certifiée) : ce taux d'appel est prolongé sur
          1951-1970 dans regimes/valeurs_point.csv au niveau `estimee`, et la
          fiche porte l'effectif, 12,5 % × 0,6 = 7,5 %, comme partout. RÉSERVE
          : LEGI ne conserve qu'une version de l'article, consolidée dans son
          dernier état (vers 1970) ; les décrets n° 53-1305
          (JORFTEXT000000302906) et n° 68-1028 (JORFTEXT000000887488) ont
          modifié ce taux et n'ont que leur titre au Journal officiel — d'où
          le niveau `moyenne`. ÂGES ESTIMÉS : les articles qui les portaient
          (décret, art. 5 ; arrêté du 12 décembre 1951, art. 5 et 10 ; décret
          n° 67-64, JORFTEXT000000515354) sont absents de LEGI ; la fiche
          prend le barème du successeur, seul écrit — 65 ans, anticipation
          abattue de 1,1 % par trimestre, 0,78 à 60 ans (arrêté du 30 décembre
          1970, art. 16, LEGIARTI000006381606). DÉCRET N° 51-1445 DU 12
          DÉCEMBRE 1951 (LEGITEXT000006060604), régime de retraites
          complémentaire des agents contractuels et temporaires de l'État,
          abrogé et remplacé par l'Ircantec au 1er janvier 1971 (décret n°
          70-1277, JORFTEXT000000306984). La fiche le faisait naître en 1959,
          année de l'IGRANTE : il a huit ans de plus, et LEGI porte ses
          salaires de référence de 1951 à 1970 (arrêté du 12 décembre 1951,
          article 8, LEGIARTI000006381673 : 63 F pour 1951, 2,59 F pour 1970),
          qui sont, à une valeur près, ceux que regimes/valeurs_point.csv
          porte — 1955 y vaut 0,130 € quand l'arrêté dit 74 F, soit 0,113 €.
          L'ASSIETTE est lue dans l'article 7 (LEGIARTI000006368159) : « la
          fraction de la rémunération excédant le plafond des assurances
          sociales […] dans la limite du quadruple dudit plafond ; toutefois
          et à compter du 1er janvier 1961, cette limite est portée à 4,75
          fois le plafond ». C'est la tranche B du moteur, de un à quatre
          plafonds ; le trois-quarts de plafond ajouté en 1961 n'a pas
          d'assiette et ne touche que les rémunérations entre quatre et 4,75
          plafonds. Sous le plafond, l'agent relève de l'IGRANTE à partir de
          1960 (décret n° 59-1569, article 2). LEGI ne conserve du décret que
          les articles 1, 2, 6 à 10 : aucun n'écrit le taux ni l'âge, et
          l'index du JORF n'a que des titres (accord Agirc-IPACTE de 1952,
          JORFTEXT000000797895). La conversion en points Ircantec est de un
          pour un (regimes/conversions_points.csv).

  - code: igrante
    nom: Institution générale de retraite des agents non titulaires de l'État
    famille: complementaire_prive
    source_id: ircantec_points
    fiabilite: moyenne
    creation: 1960
    fermeture: 1970
    extinction: 1971
    succede_a: []
    integre_dans: ircantec
    population: >-
      Agents non titulaires de l'État, sur la rémunération jusqu'au plafond des
      assurances sociales — et jusqu'à trois plafonds pour ceux qui ne relèvent
      pas de l'IPACTE.
    hors_repartition: false
    periodes:
      - debut: 1960
        fin: 1970
        type_calcul: points
        age_ouverture: 60
        age_taux_plein: 65
        duree_requise_trimestres: null
        taux_plein: 1.0
        salaire_reference: carriere_entiere
        assiette: tranche_1
        taux_cotisation_retraite: 0.021   # 3,5 % contractuels × appel 60 %
        part_salariale: 0.40   # 1,40 % agent / 2,10 % employeur, décret 59-1569 art. 2
        decote_par_trimestre: 0.011
        surcote_par_trimestre: null
        avantages_non_contributifs: [reversion]
        notes: >-
          TAUX LUS DANS LE TEXTE : « les taux de cotisation à la charge des
          bénéficiaires et des services employeurs sont respectivement fixés à
          1,40 p. 100 et 2,10 p. 100 » — 3,5 % en tout, 40 % à la charge de
          l'agent, ce que l'article 15 de l'arrêté du 17 février 1960 confirme
          par un second chemin —, article 2 du décret n° 59-1569
          (LEGIARTI000006368165), celui de l'assiette. L'Ircantec reprend ces
          taux mot pour mot au 1er janvier 1971 (décret n° 70-1277, art. 7,
          LEGIARTI000006368121 : « 1,40 % et 2,10 % » sous le plafond) et les
          appelle à 60 % : appel prolongé sur 1960-1970
          (regimes/valeurs_point.csv, `estimee`), effectif 3,5 % × 0,6 = 2,1
          %. Réserve : version consolidée unique ; le décret n° 68-1029
          (JORFTEXT000000869583) a modifié ce taux et n'a que son titre. Âges
          estimés, barème du successeur (65 ans, 1,1 % par trimestre, art. 16
          de l'arrêté du 30 décembre 1970) : l'article 5 bis ajouté par le
          décret n° 60-1019 (JORFTEXT000000305990, « limite d'âge ») est
          absent de LEGI. DÉCRET N° 59-1569 DU 31 DÉCEMBRE 1959
          (LEGITEXT000006060876, JORFTEXT000000486546), en vigueur en 1960,
          abrogé et remplacé par l'Ircantec au 1er janvier 1971. L'ASSIETTE
          est lue dans l'article 2 (LEGIARTI000006368165) : « l'ensemble de la
          rémunération […] dans la limite du triple du plafond des cotisations
          du régime général. Toutefois, en ce qui concerne le personnel
          affilié au régime […] créé par le décret du 12 décembre 1951, les
          cotisations ne sont assises que sur la fraction de la rémunération
          inférieure audit plafond ». La fiche porte cette dernière assiette —
          la tranche 1 —, celle de l'agent qui relève aussi de l'IPACTE :
          c'est ainsi que le statut `contractuel_public` route les deux
          institutions sans qu'elles se recouvrent. Les agents hors IPACTE
          cotisaient jusqu'à trois plafonds, part que le modèle ne leur prête
          pas faute d'un statut qui les distingue. La RÉPARTITION vient de
          l'article 15 de l'arrêté du 17 février 1960 (LEGIARTI000006381706) :
          « le service employeur effectue un versement égal à une fois et
          demie le précédent », soit 40/60 — ce que le rapport 1,40 / 3,50 dit
          aussi.

