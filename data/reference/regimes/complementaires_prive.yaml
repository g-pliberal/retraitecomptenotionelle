    integre_dans: null
    population: Agents non titulaires des trois fonctions publiques, élus locaux.
    hors_repartition: false
    periodes:
      - debut: 1971
        fin: 1982
        type_calcul: points
        age_ouverture: 60
        age_taux_plein: 65
        duree_requise_trimestres: null
        taux_plein: 1.0
        salaire_reference: carriere_entiere
        assiette: tranche_1
        taux_cotisation_retraite: 0.0210
        part_salariale: 0.40
        decote_par_trimestre: 0.011
        surcote_par_trimestre: null
        avantages_non_contributifs: [majoration_enfants, reversion]
        notes: >-
          LES TAUX SONT CEUX DU PRODUCTEUR, année par année. La fiche portait
          5,75 % sur toute la période 1971-2008 : le taux appelé sur la
          tranche A valait 2,10 % jusqu'en 1982 et n'a atteint 5,63 % qu'en
          1992. Le régime achetant ses points avec la cotisation — points =
          cotisation / (taux d'appel × salaire de référence) —, un agent des
          années 1970 recevait DEUX FOIS ET DEMIE les points que le barème lui
          donnait. Les taux appelés des deux tranches sont dans le fichier
          `IRC_BAR_01_txcotis.csv` que publie la Caisse des dépôts, qui GÈRE le
          régime : c'est le producteur, et ce fichier porte déjà, dans ce dépôt,
          le taux d'appel et le salaire de référence.
          La répartition 40 % / 60 % de la tranche A et 35,64 % / 64,36 % de la
          tranche B est celle des barèmes 2025 et 2026 (2,80 % et 4,20 % sur la
          tranche A, 6,95 % et 12,55 % sur la tranche B en 2025 ; 2,84 % et
          4,27 %, 7,06 % et 12,75 % en 2026) ; elle est reportée sur les années
          antérieures, faute d'une série publiée, et c'est une convention.
          L'ÂGE EST CELUI DE L'ARTICLE 16 DE L'ARRÊTÉ DU 30 DÉCEMBRE 1970, lu
          version par version dans la base LEGI. De 1971 au 30 juin 2011
          (LEGIARTI000006381606 à LEGIARTI000019511923) : « l'allocation de
          retraite est normalement liquidée à l'âge de soixante-cinq ans.
          Cependant elle peut faire l'objet d'une anticipation, au plus tôt à
          cinquante-cinq ans » ; le coefficient vaut 0,43 à cinquante-cinq
          ans, 0,78 à soixante, 0,88 à soixante-deux, 1 à soixante-cinq — soit
          1,1 % par trimestre manquant entre soixante et soixante-cinq ans, et
          c'est ce coefficient que porte `decote_par_trimestre` (la fiche
          portait 0,55 %, sans source). Depuis l'ordonnance de 1982 et la
          version du 31 août 1983 (LEGIARTI000006381610), le coefficient n'est
          pas appliqué à qui liquide sa pension du régime général au taux
          plein : c'est `decote_annulee_par_la_duree`. Le décret n° 2008-996
          du 23 septembre 2008 n'a pas touché aux âges (LEGIARTI000019511923
          les répète) : la fiche faisait passer l'Ircantec à 62 et 67 ans dès
          2009, deux ans avant la loi Woerth. Depuis le 1er juillet 2011
          (LEGIARTI000024266924), l'allocation est « normalement liquidée à
          l'âge prévu au 1° de l'article L. 351-8 », avec anticipation « au
          plus tôt dix ans avant », et le coefficient 0,78 s'applique à l'âge
          de l'article L. 161-17-2 : les âges se lisent donc à la génération.
