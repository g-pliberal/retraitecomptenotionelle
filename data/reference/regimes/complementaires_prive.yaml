          valeurs au 1er janvier 1981, inchangées jusqu'en 1982). BARÈME DES
          ENTREPRISES CRÉÉES À COMPTER DU 1ER JANVIER 1981. L'accord Agirc
          leur a imposé un taux contractuel de 8 % dès l'adhésion puis de 12 %
          à compter de 1983 (délai de deux ans pour celles créées entre le 1er
          janvier 1981 et le 1er janvier 1983, Barème social périodique),
          quand les entreprises déjà adhérentes gardaient 8 % jusqu'en 1993 ;
          les deux barèmes se rejoignent en 1996. Cette fiche porte cette
          variante d'OpenFisca-France
          (`taux_contractuels/entreprises_apres_01_01_1981`) ; la fiche
          `agirc` porte l'autre. Les points sont des POINTS AGIRC (`points_de:
          agirc`) : même salaire de référence, même valeur de service, même
          conversion de 2019. Le statut « salarié cadre d'une entreprise créée
          après 1981 » y route la tranche B et la tranche C de 1981 à 2018, et
          l'Arrco sur la tranche 1 comme tout cadre.

