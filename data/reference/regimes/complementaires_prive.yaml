          l'État » (art. 2, LEGIARTI000006436188), sans plafond. Les droits
          sont liquidés avec la pension de base, sans décote propre : la
          fraction porte sur des pensions déjà minorées. TAUX : « à compter du
          1er septembre 2005 à 0,75 % de la rémunération brute versée par
          l'État » pour la cotisation patronale, autant pour la salariale
