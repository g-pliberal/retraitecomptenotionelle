        avantages_non_contributifs: [reversion]
        notes: >-
          Accord du 15 mai 1957 créant l'UNIRS, hors JORF ; l'index n'en porte
          que le nom, avant 1975, dans un arrêté d'approbation (protocole
          UNIRS-Charbonnages de France, JORFTEXT000000849607) et un décret de
          subvention (n° 74-127, JORFTEXT000000875512), et rien dans LEGI.
          AUCUNE SOURCE NE DATE SON BARÈME : la fiche portait 4 %, le taux
          minimal de l'Arrco de 1967. Elle porte désormais 2,5 %, la première
          valeur datée de l'Arrco (1er janvier 1962, OpenFisca-France), par
          continuité — l'UNIRS est la caisse dont le point a servi de
          référence au régime unifié, et l'accord de 1961 a généralisé son
          barème sans le relever. Le niveau reste `estimee`. Les valeurs du
          point sont celles de la fédération (regimes/valeurs_point.csv, série
          `unirs` depuis 1949), et la conversion de 1999 est portée par
          regimes/conversions_points.csv.

