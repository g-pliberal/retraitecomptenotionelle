    population: Ensemble des salariés du secteur privé.
    hors_repartition: false
    periodes:
      - debut: 2019
        fin: null
        type_calcul: points
        age_ouverture: 62
        age_ouverture_par_generation: true
        age_taux_plein: 67
        duree_requise_trimestres: 172
        taux_plein: 1.0
        abattement_points: agirc_arrco
        plafond_majoration_enfants: 2367
        plafond_majoration_annee: 2025
        salaire_reference: carriere_entiere
        assiette: tranche_1
        taux_cotisation_retraite: 0.0787
        part_salariale: 0.40   # ANI du 17 novembre 2017, article 38
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [majoration_enfants, reversion, coefficient_solidarite]
        notes: >-
          Accord national interprofessionnel du 17 novembre 2017.
          L'abattement n'est pas la décote du régime de base : le régime
          publie ses propres COEFFICIENTS D'ANTICIPATION, en deux tables — l'une
          indexée sur les trimestres manquants (0,99 à 0,78 de un à vingt),
          l'autre sur l'âge (1 à 0,43 pour dix ans d'anticipation) — et retient
          la plus avantageuse pour l'assuré. La majoration pour enfants est
          quant à elle PLAFONNÉE en euros : 2 367 € par an pour les pensions
          servies depuis le 1er novembre 2025, revalorisés comme la valeur de
          service du point, et opposables aux seuls assurés nés à compter du
          2 août 1951.
          Tranche 1 (0 -> 1 PASS) : taux d'appel 7,87 %, taux de calcul des
          points 6,20 %. Tranche 2 (1 -> 8 PASS) : taux d'appel 21,59 %,
          taux de calcul 17,00 % (voir `tranche_2` ci-dessous).
          Le coefficient de solidarité (malus 10 % pendant 3 ans) et le
          coefficient majorant sont des dispositifs d'incitation d'âge :
          ils sont remplacés par le coefficient de conversion actuariel dans
          les scénarios notionnels.
