  - code: arrco_tranche_2
    nom: Arrco, tranche 2 (non-cadres)
    famille: complementaire_prive
    source_id: agirc_arrco_points
    fiabilite: haute
    creation: 1961
    fermeture: 2018
    extinction: 2018
    succede_a: []
    integre_dans: agirc_arrco
    population: >-
      Salariés NON CADRES du privé, sur la part de salaire comprise entre un et
      trois plafonds de la Sécurité sociale. Les cadres cotisent l'Agirc sur
      cette même part, et n'ont donc pas de tranche 2 Arrco : c'est pourquoi
      cette tranche forme une fiche à part, que l'affiliation donne aux uns et
      pas aux autres.
    hors_repartition: false
    periodes:
      - debut: 1961
        fin: 1966
        type_calcul: points
        age_ouverture: 60
        age_taux_plein: 65
        duree_requise_trimestres: null
        taux_plein: 1.0
        abattement_points: agirc_arrco
        plafond_majoration_enfants: 2367
        plafond_majoration_annee: 2025
        salaire_reference: carriere_entiere
        assiette: tranche_2_arrco
        taux_cotisation_retraite: 0.025
        part_salariale: 0.4   # OpenFisca, barème salarié / employeur
        points_de: arrco
        decote_par_trimestre: 0.01
        surcote_par_trimestre: null
        avantages_non_contributifs: [majoration_enfants, reversion]
        notes: >-
          Taux contractuel 2,5 % appelé à 100 % : 2,5 % prélevés sur
          l'assiette, dont 40 % à la charge du salarié (OpenFisca-France,
          valeurs au 1er janvier 1961, inchangées jusqu'en 1966). ACCORD
          NATIONAL INTERPROFESSIONNEL DU 8 DÉCEMBRE 1961 (arrêté d'agrément du
          27 mars 1962) : taux contractuel minimal de 2,5 % sur la totalité du
          salaire jusqu'à trois plafonds, appelé à 100 %. OpenFisca-France
          date sa série du 1er janvier 1962 ; 1961 porte la même valeur. Sur
          la tranche 1, le taux est celui de tous les salariés ; sur la
          tranche 2 il n'est dû que par les non-cadres (fiche
          `arrco_tranche_2`). TRANCHE 2 DE L'ARRCO, ET ELLE N'EST PAS DUE PAR
          TOUT LE MONDE : seuls les non-cadres cotisent sur la part de salaire
          comprise entre un et TROIS plafonds ; un cadre cotise l'Agirc sur
          cette part. Elle figurait auparavant dans la fiche `arrco`, que
          l'affiliation donne aussi aux cadres, qui acquéraient donc deux fois
          des droits sur la même part. Les points restent des POINTS ARRCO
          (`points_de: arrco`), achetés au salaire de référence de l'Arrco et
          servis à la valeur de son point ; seule l'assiette, et donc
          l'affiliation, diffère. LA TRANCHE EXISTE DEPUIS L'ORIGINE :
          l'accord de 1961 assied la cotisation sur la totalité du salaire
          jusqu'à trois plafonds, au même taux que la tranche 1, et c'est ce
          que porte le barème des entreprises adhérentes avant 1997
          d'OpenFisca-France. La fiche affirmait qu'« avant 1997, l'Arrco ne
          cotisait pas au-dessus du plafond » : ce n'est vrai que des
          entreprises créées à compter de cette date, dont le barème commence
          à 14 %. MÉTHODE DE LA TRANCHE B3. L'accord de 1961 et ses avenants
          sont hors JORF ; seuls L. 921-1 et L. 921-4 encadrent le régime. La
          série est celle d'OpenFisca-France (niveau `haute`), barème des
          ENTREPRISES ADHÉRENTES AVANT 1997 ; le taux porté est le taux
          effectif, contractuel × appel, et le moteur retire l'appel pour
          convertir en points. Une période par changement de l'un ou de
          l'autre.

