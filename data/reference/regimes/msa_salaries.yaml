    notes: >-
      Mêmes règles que le régime général sur 1972-1982 : la MSA les applique à l'identique.
      La durée retenue y monte par les mêmes paliers : « Pour les pensions
      dont l'entrée en jouissance se situe en 1972, la durée maximum
      d'assurance prise en compte est fixée à trente-deux années (soit 128
      trimestres) et la pension est égale à autant de cent cinquantièmes
      de la pension calculée selon les taux prévus à l'article 55 », puis
      136 en 1973 et 144 en 1974 (décret n° 50-1225, article 59-1,
      LEGIARTI000006774035 ; la loi n° 71-1132 « est applicable aux
      pensions des travailleurs salariés agricoles », article 10). D'où les
      périodes de 1972, 1973 et 1974, qui ne diffèrent que par ce plafond.
