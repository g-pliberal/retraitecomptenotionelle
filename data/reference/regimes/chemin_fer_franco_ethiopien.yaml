code: chemin_fer_franco_ethiopien
nom: >-
  Caisse de retraite du chemin de fer franco-éthiopien (CRCFE)
famille: special
population: >-
  Anciens agents de nationalité française de la Compagnie du chemin de fer
  franco-éthiopien (Djibouti - Addis-Abeba) et leurs ayants droit : l'État
  paie leurs pensions depuis la loi n° 77-770 du 12 juillet 1977 ; un
  accord avec l'État éthiopien du 5 mars 1993 en met la charge au budget
  français, et une convention du 30 mars 1993 en confie la gestion à la
  Caisse des dépôts, qui ne liquide plus que des réversions selon la
  réglementation de la compagnie en vigueur au 12 juillet 1977. Huit
  pensionnés au 31 décembre 2019, deux de droit direct, de 82 à 101 ans.
