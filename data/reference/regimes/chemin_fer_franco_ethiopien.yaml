  raison_hors_champ: >-
    Caisse d'une compagnie concessionnaire en Éthiopie, dont l'État paie
    les pensions des retraités français depuis la loi du 12 juillet 1977 :
    huit pensionnés en 2019, âgés de 82 à 101 ans, et seules des
    réversions se liquident encore, sur le règlement de la compagnie figé
    au 12 juillet 1977. Il n'y a plus de carrière à simuler.
