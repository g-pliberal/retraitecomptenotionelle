    fin: 1982
    type_calcul: points
    age_ouverture: 62
    age_ouverture_par_generation: true
    age_taux_plein: 67
    age_taux_plein_par_generation: true
    duree_requise_trimestres: null
    taux_plein: 1.0
    salaire_reference: carriere_entiere
    assiette: deplafonnee
    assiette_facteur_revenu: 2.553
    taux_cotisation_retraite: 0.045
    decote_par_trimestre: 0.0125
    surcote_par_trimestre: null
    avantages_non_contributifs: [reversion]
    notes: >-
      1962-1982 : aucune version consolidée du décret n° 49-578 avant 1983
      ; le taux de 4,5 % des produits de l'office est reconduit en
      arrière, niveau estimé. 4,50 % PENDANT CINQUANTE-CINQ ANS, et la
      continuité est frappante : 2,50 % (section A) plus 2 % (section U)
      de 1962 à 2003, puis 4,50 % pour la section C qui les remplace en
      2004. La fusion n'a pas changé le taux — elle a changé la façon de
      servir. LA SECTION B N'EST PAS PORTÉE, ET LA RAISON N'EST PAS CELLE
      QU'ON CROIRAIT. Ce n'est pas une grille introuvable : de 1962 à
      2013, IL N'Y EN A PAS EU. Le rapport de l'IGAS (n° 2012-110P) décrit
      le régime tel qu'il fonctionnait encore en 2012 : sept classes
      numérotées 0, 1, 2, 3, 4, 6 et 8, « l'inscription dans une des
      classes de cette section est obligatoire pour les notaires en
      exercice ; LE CHOIX DE LA CLASSE ELLE-MÊME ÉTANT LAISSÉ À
      L'APPRÉCIATION DU NOTAIRE », et « en l'absence d'indication, le
      cotisant est affilié en classe 1 ». Créée en 1962 pour « répondre
      aux vœux du notariat qui souhaitait une cotisation INDÉPENDANTE DES
      PRODUITS réalisés par l'office », elle était un supplément
      facultatif — et le dépôt ne prête jamais à personne un choix qu'il
      ne peut pas connaître. Même règle que pour les classes du RAAP
      d'avant 2017 et l'option de classe supérieure de la CAVEC. CE QUE LE
      CHOIX DONNAIT, l'IGAS le montre aussi : en 2011, sur 8 356
      cotisants, 1 587 étaient en classe 0 et 2 593 en classe 1 — la
      moitié de la profession au plancher ou presque —, pour une moyenne
      de 23,8 points par an, soit la classe 2,4. DEPUIS 2014 LA CLASSE SE
      DÉTERMINE PAR LES PRODUITS, et le décret n° 2013-1157 du 13 décembre
      2013 qui l'institue DÉLÈGUE SES BORNES dans la même phrase : « les
      bornes de chaque classe de cotisation de la section B sont
      déterminées PAR LE CONSEIL D'ADMINISTRATION de la Caisse de retraite
      des notaires pour une période de trois ans par référence à la
      moyenne des produits de base du notariat au titre des trois années
      précédentes ». Elles ne sont donc pas introuvables par accident :
      aucun texte réglementaire ne les porte, par construction —
      exactement comme le prix du point de la CAVAMAC, à ceci près que la
      CAVAMAC publie la délibération de son conseil et que la CPRN ne
      publie pas la sienne. Une passe entière du Journal officiel n'en a
      rien tiré. ET LA BASCULE N'EST PAS ACHEVÉE : « à partir du 1er
      janvier 2029, le notaire sera systématiquement inscrit pour
      l'exercice n dans la classe de cotisation correspondant aux produits
      de son étude ». Jusque-là, les règles de maintien de classe — un
      notaire assermenté avant 2014 ne monte que d'une classe par an et ne
      descend jamais d'office — et la dérogation de six ans des nouveaux
      notaires laissent subsister l'ancien mécanisme. CE QUI MANQUE EST
      CHIFFRABLE : environ 11 100 € pour le notaire moyen en 2025, contre
      15 900 € de section C — soit quatre dixièmes du complémentaire. Un
      notaire simulé ici est sous-estimé d'autant, et le jour où la caisse
      publiera ses bornes, la fiche sera complète en une demi-heure : la
      cotisation vaut « le nombre de points de la classe multiplié par 115
      % du coût d'acquisition du point B » pour tout notaire assermenté
      depuis 2014, les classes ouvrent 10 à 80 points, et le rendement de
      la section se calcule comme celui de la C — 9,50 % en 2004, 7,79 %
      en 2012, 5,54 % en 2026.
