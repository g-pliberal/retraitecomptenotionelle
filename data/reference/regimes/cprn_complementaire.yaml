      année d'exercice en 2012 et à 64 % de la moyenne distribuée depuis.
      Il relève la pension des petits offices, et la fiche l'ignore.
      LA SURCOTE PASSE À 1 %, SANS BORNE D'ÂGE : l'arrêté du 29 novembre
      2023 (JORFARTI000048679350), en vigueur le 1er janvier 2024,
      remplace à l'article 23 « 0,5 % » par « 1 % » et « 70 ans » par «
      fin d'activité » ; le règlement du 10 juillet 2026
      (LEGIARTI000054437637) écrit « la surcote est fixée à 1 % par
      trimestre au-delà de l'âge du taux plein, jusqu'à l'âge de fin
      d'activité ». Le « jusqu'au soixante-dixième anniversaire » du
      guide 2022 était donc déjà périmé.
      DEPUIS 2024, LES ÂGES SONT CEUX DU RÉGIME GÉNÉRAL — l'âge de
      L. 161-17-2 et celui du 1° de L. 351-8, écrit l'article 18 dans la
      rédaction de l'arrêté du 29 novembre 2023 —, mais la décote reste
      celle de l'âge seul (`decote_annulee_par_la_duree: false`), et le même
      arrêté ajoute à l'article 23 « une majoration de 10 % pour tout affilié
      ayant eu un nombre minimum de 3 enfants dans les conditions définies à
      l'article L. 351-12 », que le règlement de 2026 reprend (article 9,
      3°) : `majoration_enfants`. La majoration de 30 % par enfant à charge
      de moins de vingt et un ans, temporaire, n'est pas portée.
      CE QUE LA SECTION B EST DEVENUE, LU LE 23 SEPTEMBRE 2026. Les bornes
      restent hors de tout texte, mais leur RÈGLE est désormais écrite : le
      décret n° 2026-418 (article 2, JORFARTI000054153399) fait fixer par
      le conseil d'administration, chaque année, des bornes en pourcentage
      de la moyenne des produits du notariat « afin que chaque tranche
      regroupe environ 1/8e de la population en activité » — des octiles.
      Et la grille des montants est publiée : la plaquette du congrès 2025
      de la caisse donne huit classes à 2 758 €, 5 516 €, … 22 065 €, pour
      10 à 80 points — la classe k vaut k fois la classe 1 que fixe le
      décret annuel (2 758,10 € en 2025, décret n° 2025-1076, article 12),
      et ouvre 10 k points. Le coût de chaque notaire est ce montant
      multiplié par un coefficient d'âge à la date de changement de classe,
      de 1,000 jusqu'à 33 ans à 1,681 à 65 ans (annexe 1 du décret
      n° 49-578 depuis le décret n° 2026-418). Avec la loi des revenus que
      la section C calibre, les huit classes se laissent donc estimer ;
      c'est une action à part, que la feuille de route nomme.
