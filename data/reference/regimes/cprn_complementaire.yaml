      cotisation vaut « le nombre de points de la classe multiplié par 115
      % du coût d'acquisition du point B » pour tout notaire assermenté
      depuis 2014, les classes ouvrent 10 à 80 points, et le rendement de
      la section se calcule comme celui de la C — 9,50 % en 2004, 7,79 %
      en 2012, 5,54 % en 2026.
      LA SURCOTE DATE DE 2014, ET ELLE VAUT 0,5 % : l'arrêté du 16
      décembre 2013 (JORFARTI000028387445) rédige l'article 16 — « si la
      demande de retraite intervient après l'âge du taux plein, un
      coefficient de majoration est appliqué à la pension des notaires
      ayant continué à exercer et à cotiser […]. Le coefficient de
      majoration est fixé à 0,5 % par trimestre au-delà de l'âge du taux
      plein, jusqu'à l'âge de 70 ans » —, et l'arrêté du 31 mai 2017
      (JORFARTI000034975971, article 23) le répète. La fiche portait 1
      %, le taux d'aujourd'hui reporté en arrière, que le moteur ne
      lisait pas.
      LES ÂGES DE 2014 À 2023 NE SONT PAS CEUX DU RÉGIME GÉNÉRAL. L'article
      18 des statuts, dans la rédaction de l'arrêté du 16 décembre 2013
      (JORFTEXT000028387437, en vigueur au 1er janvier 2014) reprise par
      celui du 31 mai 2017, ouvre la retraite à 60 ans et la sert à taux
      plein à 65 aux nés avant 1954 ; aux suivants, à l'âge de L. 161-17-2
      « différé de vingt-quatre mois », et à taux plein à ce même âge
      « augmenté de cinq ans » : 64 et 69 ans pour les générations 1955 et
      suivantes (`age_table: cprn_2014`). LA DÉCOTE NE CONNAÎT QUE L'ÂGE :
      « 1,25 % par trimestre séparant l'âge de l'affilié à la date de
      liquidation de l'âge du taux plein » ; la durée d'assurance ne
      l'annule pas (`decote_annulee_par_la_duree: false`). La fiche lisait
      les tables du régime général et laissait la durée effacer la décote.
