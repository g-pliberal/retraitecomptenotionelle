    notes: >-
      RÉFORME DES RÉGIMES SPÉCIAUX. L'article 14 du décret, réécrit en
      2008, fixe « le nombre de trimestres nécessaire pour obtenir le
      pourcentage maximum de la pension à cent soixante », le fait évoluer
      « comme la durée des services et bonifications exigée des
      fonctionnaires de l'État » et maintient le pourcentage maximum à
      75 %.
      QUARANTE-DEUX ANS, ET NON QUARANTE-CINQ. Le II du même article donne
      à chaque catégorie un âge de référence — l'âge d'ouverture majoré de
      cinq ans — mais y déroge pour la danse : « toutefois, pour les
      artistes du ballet, l'âge de référence est fixé à 42 ans et, pour les
      musiciens de l'orchestre, les chefs de chant et les pianistes, il est
      fixé à 62 ans ». Un danseur partant à quarante ans se voit donc
      opposer huit trimestres de décote, non vingt.
      LA DÉCOTE NE MONTE PAS À LA MÊME VITESSE POUR LUI. Le V ramène les
      autres catégories à l'âge de référence diminué de seize trimestres en
      2010, diminution qui s'efface jusqu'en 2024 ; pour le ballet et les
      musiciens il écrit au contraire un âge fixe — ouverture « majoré de
      quatre trimestres » de juillet 2010 à juin 2011, « six trimestres »
      l'année suivante, « huit trimestres » ensuite. La période porte l'âge
      d'arrivée, quarante-deux ans, et le moteur l'abaisse aux dates du V
      (fiche `decote_opera_de_paris`) : une danseuse qui a quarante ans en
      janvier 2011 et part aussitôt se voit opposer quatre trimestres de
      décote, au taux de 0,125 % — un demi-point de pension.
      LA DURÉE SE LIT À LA DATE OÙ L'ASSURÉ RÉUNIT LES CONDITIONS, et non à
      sa génération. Le V du même article 14 (rédaction du décret
      n° 2008-1497, LEGIARTI000020056984, lue le 14 octobre 2026) : « cent
      cinquante et un trimestres pour les personnes remplissant les
      conditions définies à l'article 6 entre le 1er juillet et le
      31 décembre 2008 inclus », un de plus au 1er janvier et au 1er juillet
      jusqu'en juillet 2012, au 1er décembre 2012, puis chaque 1er juillet —
      le calendrier de 2008 des régimes spéciaux, mot pour mot celui de la
      Comédie-Française (`duree_requise_calendrier: regimes_speciaux_2008`).
      La fiche lisait la table commune, par génération : 160 trimestres à un
      danseur né en mars 1970, qui réunit les conditions à quarante ans, en
      mars 2010, et en doit 154 ; 150 à qui les réunissait avant juillet
      2008.
