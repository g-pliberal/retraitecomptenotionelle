      CENT SOIXANTE-DOUZE TRIMESTRES, ÉCRITS EN TOUTES LETTRES. L'article
      14, depuis le 26 juin 2014, ne renvoie plus à la fonction publique :
      « le nombre de trimestres nécessaire pour obtenir le pourcentage
      maximum de la pension est fixé à cent soixante-douze. Le pourcentage
      maximum de la pension est fixé à 75 % ». Le V le module encore par
      génération jusqu'aux assurés nés en 1973 — mais seulement « à compter
      du 1er juillet 2019 » : jusque-là, le calendrier de 2008, jusqu'à 166
      trimestres en juillet 2018 (LEGIARTI000029135161, lue le 14 octobre
      2026). La table (`duree_requise_table: [opera_de_paris_2014]`) est
      celle de la Comédie-Française, 167 trimestres des nés du 1er juillet
      1959 à 172 à compter de 1973, lue à soixante ans par le VI : à qui
      peut liquider plus tôt, la durée des assurés qui atteignent soixante
      ans l'année où la liquidation peut intervenir. Un danseur né en 1985,
      qui réunit les conditions en 2025, se voit opposer celle de la
      génération 1965, 169 trimestres, et non 172. PRÉSOMPTION DÉCLARÉE : le
      A ne nomme que les 4° et 5° de l'article 6, musiciens et autres
      catégories ; la fiche, qui suit le ballet, lui lit la même table, la
      seule que le décret écrive. Le B (4° du I de l'article 52, première
      marche un an plus tard) n'est pas transcrit.
      L'ÂGE DU BALLET N'A PAS BOUGÉ. Le décret n° 2011-953 du 10 août 2011
      a relevé les autres : « 1° A quarante ans pour les artistes du
      ballet ; 2° A cinquante-sept ans pour les artistes des chœurs ; 3° A
      cinquante-sept ans pour les personnels qui occupent des emplois
      reconnus […] comme comportant des fatigues exceptionnelles ; 4° A
      soixante ans pour les musiciens, chefs de chant et pianistes
      accompagnateurs ; 5° A soixante-deux ans pour les autres catégories
      de personnel ». C'est la rédaction encore en vigueur : la réforme de
      2023 n'a pas touché à ces âges, et elle N'A PAS FERMÉ LE RÉGIME —
      l'article 1er de la loi n° 2023-270 (JORFARTI000047445082) ne
      ferme, aux recrutés à compter du 1er septembre 2023, que la RATP,
      les IEG, la CRPCEN, la Banque de France et le CESE ; le décret
      n° 2023-840 ne fait qu'y transposer carrières longues, retraite
      progressive et cumul. L'Opéra recrute toujours dans son régime.
      CAS EXTRÊME de l'écart à l'âge de référence : vingt-quatre ans
      d'anticipation par rapport à l'âge de référence 2026, et le seul
      régime français où l'on liquide à quarante ans.
