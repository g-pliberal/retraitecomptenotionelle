    notes: >-
      L'ÂGE DE LA DANSE CESSE DE DÉPENDRE DU SEXE. L'article 6, dans sa
      rédaction du décret n° 2002-347 du 12 mars 2002, en vigueur le 14 mars
      2002 (LEGIARTI000006765539, lue le 14 octobre 2026), ouvre le droit « à quarante ans
      d'âge pour les artistes du ballet » — sans distinction — puis à
      cinquante ans pour le chant et les chœurs, cinquante-cinq pour les
      emplois à fatigues exceptionnelles, soixante pour les autres. C'est
      la période où l'âge de quarante ans, celui pour lequel ce régime est
      connu, vaut pour tout le ballet.
      L'ÂGE SE LIT À L'ANNÉE D'EFFET DE LA PENSION. Le décret ne porte
      aucune disposition transitoire sur l'âge d'ouverture — son V ne règle
      que la mise à la retraite d'office des danseurs de trente-six ans et
      plus — : la pension qui prend effet après le 14 mars 2002 se voit
      opposer quarante ans, celle d'avant quarante-cinq, quelle que soit la
      génération (`tests/test_regle_de_chacun.py`, `A_L_ANNEE_D_EFFET`).
