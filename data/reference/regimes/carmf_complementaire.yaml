    surcote_par_trimestre_apres_palier: 0.0075
    avantages_non_contributifs: [reversion, majoration_enfants]
    notes: >-
      Taux de la table « Cotisations proportionnelles » de la chronologie de la CARMF.
      LA RETRAITE EN TEMPS CHOISI, depuis le 1er janvier 2017 (arrêté du
      30 novembre 2016, JORFARTI000033521562) : le régime s'ouvre à taux
      plein à l'âge légal, sans décote ni durée, et « si le médecin
      demande à bénéficier de la retraite complémentaire après cet âge,
      il est fait application d'un coefficient de majoration de 1,25 %
      par trimestre séparant le premier jour du trimestre civil suivant
      celui où le médecin atteint cet âge de la date d'effet de la
      retraite », « réduit à 0,75 % par trimestre à partir du premier
      jour du trimestre civil suivant celui où le médecin atteint l'âge
      de 65 ans, sans pouvoir s'appliquer au-delà du premier jour du
      trimestre civil suivant le soixante-dixième anniversaire ». Le
      règlement approuvé le 10 juillet 2026 (LEGIARTI000054437501) écrit
      « après l'âge de 62 ans » en toutes lettres ; la fiche retient 62
      ans sur toute la période et ne porte pas les 64 ans que la loi du
      14 avril 2023 y a mis entre septembre 2023 et 2025.
