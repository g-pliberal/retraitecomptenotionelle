    notes: >-
      Taux de la table « Cotisations proportionnelles » de la chronologie de la CARMF.
      LA RETRAITE EN TEMPS CHOISI, depuis le 1er janvier 2017 (arrêté du
      30 novembre 2016, JORFARTI000033521562) : le régime s'ouvre à taux
      plein à l'âge légal, sans décote ni durée, et « si le médecin
      demande à bénéficier de la retraite complémentaire après cet âge,
      il est fait application d'un coefficient de majoration de 1,25 %
      par trimestre séparant le premier jour du trimestre civil suivant
      celui où le médecin atteint cet âge de la date d'effet de la
      retraite », « réduit à 0,75 % par trimestre à partir du premier
      jour du trimestre civil suivant celui où le médecin atteint l'âge
      de 65 ans, sans pouvoir s'appliquer au-delà du premier jour du
      trimestre civil suivant le soixante-dixième anniversaire ». « CET
      ÂGE » EST L'ÂGE LÉGAL DE LA GÉNÉRATION, celui du premier alinéa de
      L. 351-1 (D. 161-2-1-9 : 60 ans à 61 ans et 7 mois pour les nés
      avant 1955), pour les pensions qui prennent effet du 1er janvier au
      29 mars 2017 (`surcote_depuis_l_age_legal`, `date_effet`) : l'arrêté
      du 22 mars 2017 (JORFARTI000034298521), publié le 29 et sans date
      d'effet, ne remplace « après cet âge » par « après l'âge de 62
      ans » que le 30 mars 2017, et la période de 2018 liquide depuis ce
      jour. La fiche comptait de 62 ans dès le 1er janvier 2017 ; corrigé
      le 14 novembre 2026 (action 130, ligne 13 de la file).
      LE RÉGIME, LUI, S'OUVRE À L'ÂGE LÉGAL DE LA GÉNÉRATION
      (`age_ouverture_par_generation`, relu le 14 octobre 2026) : la fiche
      ouvrait à soixante-deux ans tous ceux qui partaient depuis 2017, et
      faisait passer de soixante à soixante-deux ans, d'une année de départ
      à l'autre, l'âge d'ouverture des nés de 1947 à 1954 ; elle l'ouvrait
      aussi à soixante-deux ans aux nés de 1962 et après, dont l'âge légal
      est plus haut.
