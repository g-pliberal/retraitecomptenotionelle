    notes: >-
      TROIS ENFANTS, DEPUIS 1964. L'arrêté du 16 janvier 1964 (JORF du 2
      février 1964, JORFTEXT000000482076) ajoute un article 22 au
      règlement du régime pour les « allocataires ayant élevé au moins
      trois enfants jusqu'à l'âge de seize ans » ; l'index n'en porte que
      le titre, et le taux est celui de l'article 23 du règlement approuvé
      le 10 juillet 2026 : « le montant total de la pension est majoré de
      10 % au profit des allocataires ayant eu au moins trois enfants ».
      `majoration_enfants` sur toutes les périodes depuis 1964 ; la fiche
      n'en portait aucune.
