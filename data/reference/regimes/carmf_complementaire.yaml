    notes: >-
      Taux de la table « Cotisations proportionnelles » de la chronologie
      de la CARMF. L'article 2 du décret n° 49-579 n'est consolidé dans
      LEGI qu'à partir du 29 mai 2004 (LEGIARTI000006781640) et porte « 14
      % » dans toutes ses versions (LEGIARTI000024194100 en 2011,
      LEGIARTI000026885080, LEGIARTI000050865167, LEGIARTI000054168125) :
      c'est le taux contractuel, appelé aux taux annuels de la chronologie
      de la caisse que la fiche porte.
      LA DISPENSE DES DEUX PREMIÈRES ANNÉES (`dispense_de_debut`), depuis le
      1er juillet 2026 (décret n° 49-579, article 4, I, dans la rédaction
      du décret n° 2026-418, LEGIARTI000054168136) : « Tout médecin
      obligatoirement affilié à la caisse est dispensé du paiement de la
      cotisation afférente au présent régime pendant les deux premières
      années d'exercice de la profession libérale si cet exercice débute
      alors qu'il n'a pas atteint l'âge de 40 ans », sans points (article
      4-1, II, LEGIARTI000054168116). La fiche la sert aux cotisations de
      2027 et d'après : celles de 2026 et d'avant tiennent aux statuts
      d'avant le 1er juillet 2026, non lus (`decret_2026_418_liberaux`).
      L'EXEMPTION PASSÉ 75 ANS (`exemption_passe_l_age`), depuis le
      1er juillet 2026 (même article 4, II) : « Tout médecin qui continue
      d'exercer en qualité de non salarié est exempté du versement de la
      cotisation à partir du premier jour du semestre civil qui suit son
      soixante-quinzième anniversaire », sans points (article 4-1, II). La
      fiche exempte les années civiles d'après celle de l'anniversaire,
      pour les cotisations de 2027 et d'après ; le second semestre de
      l'année d'un anniversaire tombé au premier reste cotisé, le texte ne
      disant pas si la cotisation annuelle se partage au semestre
      (`decret_2026_418_liberaux`).
      LA RETRAITE EN TEMPS CHOISI, depuis le 1er janvier 2017 (arrêté du
      30 novembre 2016, JORFARTI000033521562) : le régime s'ouvre à taux
