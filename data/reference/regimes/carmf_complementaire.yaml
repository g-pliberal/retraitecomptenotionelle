    notes: >-
      LA PART FORFAITAIRE, ENFIN CHIFFRÉE. Cette fiche portait jusqu'ici l'aveu
      qu'elle ne la modélisait pas — « dont le nombre de points n'est pas publié
      […] ce qui SOUS-ESTIME les droits acquis avant cette date » —, et prêtait
      au régime, avant 1983, un taux proportionnel de 2 % qui n'existait pas.
      Les deux erreurs tombent ensemble.
      La colonne « Complémentaire » de la table « Cotisations forfaitaires » de
      la chronologie de la CARMF donne le montant, année par année, de 1949 à
      1995 : 16,01 € en 1949 — la table le vérifie elle-même, base 10,67 +
      complémentaire 16,01 = total 26,68 —, 402,47 € en 1970, 2 405,65 € en
      1990. Le barème IPP « Cotisation de sécurité sociale pour la retraite
      complémentaire des professions libérales », colonne « Part forfaitaire
      retraite complémentaire CARMF », publie la même série, du même endroit,
      et les deux concordent chiffre pour chiffre.
      Les montants sont en EUROS COURANTS de chaque exercice : la fiche porte
      donc une période par année, chacune avec sa propre année de référence.
      AVANT 1983 LE RÉGIME EST PUREMENT FORFAITAIRE : le barème IPP ne donne
      aucun taux proportionnel avant cette date, et la chronologie de la CARMF
      n'en publie pas davantage. Le taux est donc nul, et le forfait est toute
      la cotisation.
