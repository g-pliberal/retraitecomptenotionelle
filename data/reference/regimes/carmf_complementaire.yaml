    borne_haute_par_annee:
      1991: 70126.55
    notes: >-
      Le taux passe de 2 à 5 % avec la réforme du 1er janvier 1991, et le
      forfait RECULE du même coup — 2 405,65 € en 1990, 1 871,46 € en 1991 :
      le régime déplace son poids du montant vers le revenu.
      Cette réforme crée un point NOUVEAU : les points acquis auparavant sont
      servis affectés d'un coefficient de 1,33, « ce qui porte le nombre de
      points acquis avant 1991 à 5,32 par an au lieu de 4 » (chronologie de
      la CARMF, page 20). Le moteur l'applique par une ligne d'ÉCHELLE dans
      `conversions_points.csv` (carmf_complementaire, 1991, 1,33).
      LES POINTS D'AVANT 1996. Le forfait « rapporte 4 points » (page 20) :
      le point s'achète au quart du forfait de l'année (`valeurs_point.csv`,
      de 1949 à 1995), et la proportionnelle achète au même prix, ce que les
      « points attribués » de la page 26 vérifient (2 210,51 € pour 4,72
      points en 1991). Elle est assise sur le revenu « compris entre un
      minimum et un maximum » (`borne_basse_par_annee`,
      `borne_haute_par_annee`), et due, de 1983 à 1990, « à partir de la 4e
      année d'affiliation » (`dispense_de_debut`, trois années, la part
      proportionnelle). La chronologie ne dit pas si ce délai vaut encore de
      1991 à 1995 : la fiche ne l'y porte pas. Les statuts d'avant 2017 ne
      sont pas au Journal officiel, qui n'en publie que les modifications.
