  nom: Prestations complémentaires de vieillesse des auxiliaires médicaux conventionnés (PCV, ex-ASV)
  population: Infirmiers, masseurs-kinésithérapeutes, pédicures-podologues, orthophonistes et orthoptistes conventionnés
  couverture: partiel
