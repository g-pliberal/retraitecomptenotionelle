code: asv_auxiliaires_medicaux
rang: 531
nom: >-
  Prestations complémentaires de vieillesse des auxiliaires médicaux
  conventionnés (PCV, ex-ASV)
famille: liberal
etage: additionnel
source_id: legifrance_textes
fiabilite: estimee
creation: 1975
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Infirmiers, masseurs-kinésithérapeutes, pédicures-podologues,
  orthophonistes et orthoptistes libéraux conventionnés, affiliés à la
  CARPIMKO. Facultatif depuis le décret n° 71-544 du 2 juillet 1971,
  obligatoire depuis le 1er juillet 1975 (décret n° 75-891), refondu par
  le décret n° 2008-1044 du 10 octobre 2008 : un forfait qui ouvre un
  nombre fixe de points, et depuis 2010 une cotisation d'ajustement de
  0,40 % du revenu qui en ouvre au prorata. L'assurance maladie paie les
  deux tiers du forfait et 60 % de l'ajustement ; la fiche porte la part
  de l'auxiliaire, que le statut, sans employeur, paie, et les fractions
  `part_assurance_maladie_*` celle des caisses, que le compte notionnel
  reçoit comme une part patronale. ÂGES : la retraite « à 65 ans », et
  « par anticipation dès l'âge de 60 ans », avec « un coefficient
  réducteur allant de 0,75 à 60 ans à 0,95 à 64 ans » (guide de
  l'assurance vieillesse des professions libérales, CNAVPL, 2025, p.
  95-96), soit 1,25 % par trimestre manquant ; présumés à toutes les
  années. Le règlement de la section approuvé par l'arrêté du 10 juillet
  2026 n'est pas lu.
hors_repartition: false
