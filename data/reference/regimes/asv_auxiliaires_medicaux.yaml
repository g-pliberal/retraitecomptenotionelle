    notes: >-
      PRÉSOMPTION, AVANT LE DÉCRET DE 2008. Le régime, facultatif depuis
      le décret n° 71-544, est rendu obligatoire au 1er juillet 1975 (décret
      n° 75-891) ; ses articles 2 à 4, qui fixaient la cotisation en
      lettres clés, sont abrogés en 2008 et l'index ne les porte pas, ni
      le nombre de points qu'une année ouvrait. La fiche présume la règle
      permanente du décret n° 2008-1044 — 24,5 points par an, 6,125 par
      trimestre validé, sans ajustement — et le forfait de 2008, 400 €
      dont le tiers à l'auxiliaire, projeté en arrière sur les prix
      (convention du dépôt pour un montant sans série). Les points acquis
      avant 2006 ont une valeur de service propre à leur tranche d'années
      — 2,30 € de 1960 à 1975, 2,20 € de 1976 à 1987, 1,90 € de 1988 à
      1997, 1,60 € de 1998 à 2005, à compter de 2011 (décret n° 2008-1044,
      art. 5, II, 2°, LEGIARTI000019600614) — que le modèle, qui ne
      connaît qu'une valeur par régime, ne sert pas : il les vaut au point
      d'après 2006. Niveau `estimee`.
