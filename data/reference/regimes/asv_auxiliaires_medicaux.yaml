      cotisation d'ajustement acquittée et du nombre de points acquis au
      titre de la cotisation forfaitaire », divisé par le forfait,
      « arrondi au dixième supérieur » (art. 4, LEGIARTI000019600612) :
      le moteur prend le rapport des cotisations totales, sans
      l'arrondi. La cotisation est assise sur le revenu de l'avant-dernière
      année, de la dernière depuis 2026 ; le modèle prend celui de
      l'année.
