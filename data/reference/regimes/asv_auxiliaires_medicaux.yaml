  textes:
    - {reference: "décret n° 75-891 du 23 septembre 1975 rendant obligatoire le régime de prestations supplémentaires de vieillesse des auxiliaires médicaux conventionnés", id: LEGITEXT000006062390}
    - {reference: "décret n° 2008-1044 du 10 octobre 2008, articles 1er à 5 (forfait, ajustement, points, valeur de service)", id: LEGIARTI000019600602}
  manque: >-
    Les points d'avant 2008, que l'index ne porte pas : la fiche présume
    la règle de 2010, 24,5 points par an, et le forfait de 2008. Les
    valeurs de service propres aux points acquis avant 2006, par tranche
    d'années. L'arrondi au dixième supérieur des points d'ajustement, et
    l'assiette de l'avant-dernière année. Le partage du forfait et de
    l'ajustement avec l'assurance maladie, lu pour 2025, est présumé à
    toutes les années.
