code: cci_paris
nom: >-
  Régime spécial d'assurance vieillesse et d'assurance maladie du personnel de la chambre de commerce et d'industrie de Paris (RSAV)
famille: special
population: >-
  Agents titulaires de la chambre de commerce et d'industrie de Paris :
  pension de leur régime spécial jusqu'au 31 décembre 2005, financée par
  une cotisation de 24,68 % en 1991 portée à 29,43 % en 1999, dont 7,35 %
  à la charge de l'agent en 1991 et 6,95 % depuis 1999 (décret n° 91-613,
  article 16) ;
  règlement approuvé par le décret n° 97-1325 du 30 décembre 1997, adopté
  par la commission paritaire locale et non publié au Journal officiel. Le
  régime est fermé au 1er janvier 2006 par l'article 70 de la loi
  n° 2005-882 : vieillesse et invalidité passent au régime général, les
  droits acquis lui sont transférés « dans la limite des règles qui lui
  sont propres », tout le personnel est affilié à l'Agirc-Arrco, et la
  chambre couvre le reste par une institution du livre IX.
creation: null
fermeture: 2005
extinction: null
