    - {reference: "arrêté du 23 décembre 2006 fixant le montant de la contribution de la CCI de Paris au régime général", id: JORFTEXT000000275406}
  manque: >-
    Aucun statut ne porte l'agent de la chambre : un agent entré avant
    2006 est simulé en salarié du privé, ce que le régime général lui
    rend depuis 2006 par le rétablissement de ses droits, mais pas la
    pension du régime spécial des agents partis avant 2006, ni les droits
    que la chambre couvre au-delà du régime général et de l'Agirc-Arrco.
    Le règlement de 1997 n'est pas publié ; les rentes de transfert de
    2006 sont lues, et la fiche `cci_paris_transfert_2006` les décrit.
