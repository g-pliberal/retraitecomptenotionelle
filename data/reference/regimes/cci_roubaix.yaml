code: cci_roubaix
nom: >-
  Régime spécial de retraite du personnel de l'ancienne chambre de commerce et d'industrie de Roubaix
famille: special
population: >-
  Salariés de l'ancienne chambre de commerce et d'industrie de Roubaix,
  fondue dans la chambre de Lille-Roubaix-Tourcoing : régime spécial pour
  l'invalidité et la vieillesse, servi par la « caisse de retraites des
  employés de la chambre de commerce et d'industrie de Roubaix », à une
  cotisation vieillesse de 25,75 % en 1992, dont 7,35 % à la charge de
  l'agent (décret n° 91-613, article 16-1). Le régime prend fin au
  1er janvier 1998 (loi n° 97-1164, article 20) : pensions en cours et
  droits non liquidés deviennent des rentes du régime général, la chambre
  verse 28,6 millions de francs et couvre le reste par une institution du
  livre IX.
creation: null
fermeture: 1997
extinction: null
succede_a: []
integre_dans: regime_general
inventaire:
  section: speciaux
  rang: 220
  nom: Régime spécial de retraite de l'ancienne chambre de commerce et d'industrie de Roubaix
  population: Salariés de l'ancienne CCI de Roubaix avant 1998
