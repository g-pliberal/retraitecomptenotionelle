      sociale de Mayotte a ses taux (9,90 % employeur et 5,32 % salarié
      en 2024, en convergence jusqu'en 2036) et son plafond (3 022 € par
      mois en 2026), qui ne sont pas des séries du dépôt ; niveau
      `estimee`. VALIDATION DES TRIMESTRES : autant de trimestres que le
