      qui est plus élevé : la fiche valide moins vite que le droit.
      ORDONNANCE N° 2002-411 ET DÉCRET N° 2003-589 : « pour les pensions
      prenant effet en 2003, la durée d'assurance requise pour l'obtention
      du taux plein est de 64 trimestres, puis, chaque année, cette durée
      est augmentée de quatre trimestres » (art. 9, LEGIARTI000006781028)
      ; âge d'ouverture « cinquante-cinq ans pour les pensions prenant
      effet en 2003, 2004 et 2005 ; cinquante-six ans […] en 2006 », un an
      de plus chaque année jusqu'à soixante en 2010 (art. 2,
      LEGIARTI000006781021) ; taux plein à 65 ans (art. 10) ; coefficient
      de minoration de 2,5 % par trimestre (art. 11,
      LEGIARTI000006781030). Pensions prenant effet en 2003 : 55 ans, 64
      trimestres.
