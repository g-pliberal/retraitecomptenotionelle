      (ordonnance n° 2002-411 et décret n° 2003-589) : âge d'ouverture
      de cinquante-cinq ans « pour les pensions prenant effet en 2003,
      2004 et 2005 », puis un an de plus chaque année jusqu'à soixante
      en 2010 (art. 2, LEGIARTI000006781021) ; « pour les pensions
      prenant effet en 2003, la durée d'assurance requise pour
      l'obtention du taux plein est de 64 trimestres, puis, chaque
      année, cette durée est augmentée de quatre trimestres » (art. 9,
      LEGIARTI000006781028) ; taux plein à soixante ans pour les
      pensions prenant effet en 2003, 2004 et 2005, puis un an de plus
      chaque année jusqu'à soixante-cinq ans en 2010 (art. 10, II,
      LEGIARTI000006781029), que la fiche portait à soixante-cinq ans
      dès 2003 ; coefficient de minoration de 2,5 % par trimestre (art.
      11, LEGIARTI000006781030). Pensions prenant effet en 2003 : 55
      ans, 64 trimestres, taux plein à 60 ans.
