    taux_cotisation_retraite: 0.1461
    part_salariale: 0.4390
    taux_cotisation_deplafonnee: 0.0044
    part_salariale_deplafonnee: 0.0000
    decote_par_trimestre: 0.0250
    surcote_par_trimestre: null
    avantages_non_contributifs: [minimum_vieillesse, majoration_enfants, reversion]
    notes: >-
      TAUX ET PLAFOND PRÊTÉS DU RÉGIME GÉNÉRAL : la caisse de sécurité
      sociale de Mayotte a ses taux (9,90 % employeur et 5,32 % salarié en
      2024, en convergence jusqu'en 2036) et son plafond (3 022 € par mois
      en 2026), qui ne sont pas des séries du dépôt ; niveau `estimee`.
      VALIDATION DES TRIMESTRES : autant de trimestres que le salaire
      représente de fois 200 heures — 150 depuis 2017 — du SMIG mahorais
      (décret n° 87-175, art. 3, LEGIARTI000006770151 ; décret n°
      2003-589, art. 8, LEGIARTI000033155442), lue ici au SMIC national,
      qui est plus élevé : la fiche valide moins vite que le droit. DÉCRET
      N° 87-175 : « une pension d'ancienneté aux assurés réunissant 150
      trimestres d'assurance à compter de l'âge de soixante ans », pension
      proportionnelle à 65 ans avec 40 trimestres (art. 2,
      LEGIARTI000006770150) ; « à titre transitoire, l'âge […] est abaissé
      de cinq ans » et « la durée d'assurance […] est de 120 trimestres »
      (art. 27, reproduit en tête de l'article 2). La formule de la
      pension n'est pas dans l'index : celle du régime général tient lieu.
