  manque: >-
    Le règlement de retraite est un acte de l'établissement, absent de LEGI
    et du JORF, qui ne portent que le décret constitutif de 1925
    (LEGIARTI000021290664), l'affiliation au régime local d'Alsace-Moselle
    (L. 325-1, LEGIARTI000006742525), la liste des régimes spéciaux de 2014
    (JORFARTI000029964983) et des décrets de compensation : un seul jeu de
    règles pour 1930-2026, au niveau `estimee`.
