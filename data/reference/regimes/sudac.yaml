code: sudac
nom: >-
  Pension statutaire et complément de pension des anciens agents de la Société urbaine de distribution d'air comprimé (SUDAC)
famille: special
population: >-
  Anciens agents de la Société urbaine de distribution d'air comprimé,
  concessionnaire de la Ville de Paris pour le réseau d'air comprimé :
  leur pension statutaire est devenue une allocation différentielle, que
  la Caisse des dépôts verse pour le compte de la société et qui diminue
  à mesure que l'agent perçoit ses pensions du régime général et des
  complémentaires (« CNP-ARRCO-CRICA », selon la page du fonds).
