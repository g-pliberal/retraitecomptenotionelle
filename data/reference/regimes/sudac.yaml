  raison_hors_champ: >-
    Un avantage d'entreprise, non un régime légal : la pension statutaire
    d'un concessionnaire de la Ville de Paris, réduite à un complément
    différentiel au-dessus du régime général et des complémentaires, que
    la Caisse des dépôts verse aux anciens agents ; la page du fonds ne
    publie ni le nombre de bénéficiaires ni le financement. Les droits de
    base sont ceux du régime général.
