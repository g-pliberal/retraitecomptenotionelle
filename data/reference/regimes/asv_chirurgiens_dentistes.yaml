population: >-
  Chirurgiens-dentistes libéraux conventionnés, affiliés à la CARCDSF.
  Facultatif depuis le décret du 13 juillet 1962, obligatoire depuis le
  1er janvier 1978 (décret n° 78-283), refondu par le décret n° 2007-458
  du 25 mars 2007 : un forfait qui ouvre dix points, et depuis 2008 une
  cotisation d'ajustement sur le revenu, qui en ouvre au plus un, puis
  1,47 et 1,93. L'assurance maladie paie les deux tiers du forfait et la
  moitié de l'ajustement ; la fiche porte la part de l'adhérent, et les
  fractions `part_assurance_maladie_*` celle des caisses, que le compte
  notionnel reçoit comme une part patronale. ÂGES : le taux plein à
  67 ans, le départ dès l'âge légal avec une minoration de 1,25 % par
  trimestre « dans la limite de 15 % » (guide CNAVPL 2025, p. 88) ; la
  fiche fait suivre les deux âges aux générations, comme la complémentaire
  des médecins avant 2017, et les présume à toutes les années. LE STATUT
  `chirurgien_dentiste_ou_sage_femme` NE DIT PAS LA PROFESSION : la fiche
  présume le chirurgien-dentiste, comme celle de la complémentaire de la
  CARCDSF. La sage-femme a son régime, 18 points par an, à 6,10 € le point
  en 2025 (décret n° 84-254 ; fiche asv_autres_professions_de_sante) : la
  présomption surestime sa prestation de près de trois fois. Le règlement de
  la section approuvé par l'arrêté du 10 juillet 2026 n'est pas lu.
