  textes:
    - {reference: "décret n° 78-283 du 28 février 1978 rendant obligatoire le régime de prestations supplémentaires de vieillesse des chirurgiens-dentistes conventionnés", id: LEGITEXT000006062837}
    - {reference: "décret n° 2007-458 du 25 mars 2007, articles 1er à 3 (forfait, ajustement, valeur de service)", id: LEGIARTI000006261863}
  manque: >-
    Les points d'avant 2007, exprimés en lettre clé C, que l'index ne
    chiffre pas : la fiche présume la règle de 2007, dix points par an, et
    le forfait de 2007. Les valeurs de service des points d'avant 2006, le
    rachat des années de 1946 à 1977, la borne de 420 points jusqu'en
    2021, l'arrondi au centième supérieur. Le partage avec l'assurance
    maladie, lu pour 2025, est présumé à toutes les années. La sage-femme,
    que le statut confond avec le chirurgien-dentiste, a son propre régime.
