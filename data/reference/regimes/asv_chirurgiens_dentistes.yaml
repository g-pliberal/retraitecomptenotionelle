    notes: >-
      PRÉSOMPTION, AVANT LE DÉCRET DE 2007. Le régime, facultatif depuis
      le décret du 13 juillet 1962, est rendu obligatoire au 1er janvier
      1978 (décret n° 78-283), ses cotisations et ses prestations
      « exprimées en fonction de la lettre clé C » (article 2), que
      l'index ne chiffre pas, ni le nombre de points qu'une année
      ouvrait. La fiche présume la règle du décret n° 2007-458 — dix
      points par an, 2,5 par trimestre validé, sans ajustement — et le
      forfait de 2007, 3 150 € dont le tiers au chirurgien-dentiste,
      projeté en arrière sur les prix. Les points acquis avant 2006 ont
      leur propre valeur de service, plus basse, par année d'acquisition
      (décret n° 2007-458, art. 3, II, LEGIARTI000006261865), que le
      modèle ne sert pas : il les vaut au point d'après 2006. Le rachat
      des années de 1946 à 1977, huit points l'année, n'est pas porté.
      Niveau `estimee`.
