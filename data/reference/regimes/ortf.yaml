  raison_hors_champ: >-
    Régime en extinction dont l'État verse les derniers engagements ; aucun
    cotisant depuis 1975. Ses agents relevaient du régime général et de
    l'IGRANTE, puis de l'Ircantec ; le seul droit propre de l'Office est la
    position spéciale des agents nés en 1919 ou avant, puis leurs
    « allocations supplémentaires de retraite » (loi n° 74-696, article
    30 ; fiche `ortf_position_speciale_1974`) : 58 000 euros du budget
    général en 2026.
