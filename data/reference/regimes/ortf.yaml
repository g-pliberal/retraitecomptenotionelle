  textes:
    - {reference: "loi n° 74-696 du 7 août 1974, article 30 (position spéciale des agents de cinquante-cinq ans et plus au 31 décembre 1974)", id: LEGIARTI000006420141}
    - {reference: "code de la sécurité sociale, L. 134-3, k (solde du régime, au titre des allocations supplémentaires de retraite, porté par la Cnav)", id: LEGIARTI000051288904}
