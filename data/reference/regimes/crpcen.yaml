      soixante ans sinon, et soixante ans et quatre mois à soixante et un
      ans et huit mois pour les générations 1957 à 1961. La fiche suit ce
      calendrier par année de liquidation — l'âge de la génération qui
      l'atteint cette année-là, dans la voie des vingt-cinq années — ;
      la table du régime général, que le drapeau `age_ouverture_par_generation`
      lisait ici, donnait soixante-deux ans à la génération 1955 quand le
      décret lui donne cinquante-sept ans et trois mois. L'âge de
