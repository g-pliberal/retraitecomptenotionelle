  section: speciaux
  rang: 60
  population: Clercs et employés de notaires recrutés avant le 1er septembre 2023
  couverture: partiel
  statuts: [clerc_de_notaire]
  textes:
    - {reference: "loi du 12 juillet 1937 instituant une caisse de retraite et de prévoyance des clercs et employés de notaires", id: null}
    - {reference: "ordonnance n° 45-2574 du 31 octobre 1945 modifiant la loi du 12 juillet 1937", id: LEGITEXT000045170442}
    - {reference: "décret n° 90-1215 du 20 décembre 1990, article 84 (âge d'ouverture, neuf versions)", id: LEGIARTI000006775247}
    - {reference: "loi n° 2023-270 du 14 avril 2023, article 1er III (fermeture aux clercs et employés recrutés à compter du 1er septembre 2023)", id: JORFARTI000047445082}
  manque: >-
    Deux âges avant 2008 — soixante ans, ou cinquante-cinq pour l'assurée
    justifiant de vingt-cinq années de cotisations — et le moteur n'en porte
    qu'un : la fiche garde le second. Les décrets de taux (1977, 1979, 1986)
    donnent la cotisation de tous les risques, pas la part vieillesse.
# MAJORATION POUR ENFANTS, lue le 23 septembre 2026 dans l'index LEGI
# — décret n° 90-1215, article 94 (LEGIARTI000047909826, et la version
# de 1990) : 10 % pour les trois premiers enfants et 5 % par enfant
# au-delà. Avant 1990, le même barème est prêté. Barème
# `taux_majoration_enfants` de chaque période.
periodes:
  - debut: 1937
    fin: 2007
    type_calcul: annuites
    age_ouverture: 55
    age_taux_plein: 60
    duree_requise_trimestres: 150
    taux_plein: 0.75
    salaire_reference: derniers_6_mois
    assiette: deplafonnee
    taux_cotisation_retraite: 0.11
    perimetre_taux: agent_seul
    decote_par_trimestre: null
    surcote_par_trimestre: null
    taux_majoration_enfants: [0.0, 0.0, 0.0, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55]
    avantages_non_contributifs: [majoration_enfants, reversion]
    notes: >-
      Loi du 12 juillet 1937, appliquée par le décret n° 90-1215 du
      20 décembre 1990. L'âge de 55 ans est celui de la DÉROGATION qui fait
      la réputation du régime : l'article 84 ouvre le droit à pension à
      soixante ans, mais ne l'oppose pas aux clercs justifiant de vingt-cinq
      années de cotisation — c'est la voie que la réforme de 2008 referme
      progressivement, jusqu'au 1er janvier 2018. La fiche retient cette
      voie pour toute la période, parce qu'elle était la règle commune d'un
      métier où l'on entrait jeune ; c'est une approximation nommée.
      DEUX ÂGES, ET LA FICHE N'EN PORTE QU'UN. Le décret n° 51-721 du
      8 juin 1951, article 27 (LEGIARTI000006773239, version de 1977),
      puis l'article 84 du décret n° 90-1215 (LEGIARTI000006775247, de
      1990 à février 2008) ouvrent le droit à pension « à partir de
      soixante ans », condition d'âge « non opposable à l'assurée âgée de
      cinquante-cinq ans et qui compte vingt-cinq années de versement ».
      Cinquante-cinq ans est donc l'âge des femmes ayant fait carrière
      dans le notariat — l'essentiel des affiliés —, soixante ans celui
      des hommes et des carrières courtes ; la fiche garde le premier, et
      l'inventaire porte le second comme manque.
  - debut: 2008
    fin: 2008
    type_calcul: annuites
    age_ouverture: 55
    age_taux_plein: 60
    duree_requise_trimestres: 160
    duree_requise_par_generation: true
