    notes: >-
      D. 635-7, état du 1er janvier 2013 : première tranche, 7 % jusqu'à un plafond PROPRE AU RÉGIME, et non au plafond de la Sécurité sociale de l'année — celui du 1er janvier 2013, 37 032 €, puis « indexé sur la dernière valeur du revenu de référence, dans la limite du coefficient annuel de revalorisation des pensions » (LEGIARTI000025263581, 000034624601), puis revalorisé « du plus petit » des deux coefficients (LEGIARTI000041966498, depuis le 25 mai 2020). 42 946 € en 2024, quand le plafond de la Sécurité sociale valait 46 368 €. Les montants de `borne_haute_par_annee` sont ceux que la caisse a publiés, non recalculés ; jusqu'au 13 octobre 2026, la fiche coupait au plafond de la Sécurité sociale. La fiche ne portait d'abord que ce taux-là et s'arrêtait au plafond : la seconde tranche, annoncée en note, n'était portée par aucune période et ne prélevait donc rien.
      LES ÂGES ET LA DURÉE SE LISENT À LA GÉNÉRATION : le règlement du régime
      (arrêté du 9 février 2012, LEGIARTI000025397326) liquide les points
      à l'âge légal de l'article L. 161-17-2, sans abattement pour qui
      justifie du taux plein du régime de base, et l'âge d'annulation est
      celui de l'article L. 351-8. La fiche opposait 62 et 67 ans et
      172 trimestres à toutes les générations, y compris à celles que la
      loi de 2023 porte à 64 ans.
