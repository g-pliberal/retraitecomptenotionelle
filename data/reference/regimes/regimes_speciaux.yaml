  - code: marins
    nom: Établissement national des invalides de la marine (ENIM)
    famille: special
    source_id: rs_enim
    fiabilite: estimee
    creation: 1673
    fermeture: null
    extinction: null
    succede_a: []
    integre_dans: null
    population: Marins du commerce, de la pêche et de la plaisance professionnelle.
    hors_repartition: false
    periodes:
      - debut: 1930
        fin: null
        type_calcul: annuites
        age_ouverture: 55
        age_taux_plein: 55
        duree_requise_trimestres: 150
        taux_plein: 0.75
        salaire_reference: sans_objet
        assiette: forfaitaire
        taux_cotisation_retraite: 0.1085
        perimetre_taux: agent_seul
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [bonifications, categorie_active, reversion]
        notes: >-
          LA FORMULE, ELLE, EST STABLE ET VÉRIFIÉE : « les pensions servies en
          application des dispositions du présent code sont calculées à raison
          de 2 % du salaire annuel défini à l'article R. 11 par annuité de
          service. Le maximum des annuités liquidables dans les pensions
          d'ancienneté est fixé à trente-sept annuités et demie. Il peut être
          porté à quarante annuités du chef des bonifications » — article R. 13
          du code des pensions de retraite des marins, dans sa rédaction en
          vigueur depuis le 7 novembre 1985, lue dans la base LEGI. Les 150
          trimestres et les 75 % de cette fiche sont donc ceux du droit, et la
          période unique est justifiée pour ce qui est de la formule.
          CE QUE LA FICHE NE PORTE PAS : le plafond de VINGT-CINQ annuités
          qu'oppose le même article à la pension liquidée avant cinquante-cinq
          ans — un marin parti à cinquante ans ne peut donc pas dépasser 50 % du
          salaire forfaitaire, quand le modèle lui en accorde 75 %. Et les
          bornes d'âge d'après la recodification de 2010 dans le code des
          transports, que l'article L. 5552-9 renvoie à un décret en Conseil
          d'État non dépouillé ici.
          Le plus ancien régime de retraite français (Colbert, 1673).
          Cotisations et pensions assises sur des SALAIRES FORFAITAIRES par
          catégorie, non sur la rémunération réelle.
          CE QUI MANQUE N'EST PAS SEULEMENT LA GRILLE, et c'est ce qui rend
          l'obstacle plus sérieux qu'il n'y paraît. Le décret n° 2020-649 du
          28 mai 2020, qui réécrit le décret n° 48-1709 du 5 novembre 1948,
          définit bien « les vingt catégories de classement des fonctions des
          marins » — mais il les définit par le MÉTIER, non par le revenu :
          « 1re : apprenti ; 2e : matelot de moins de 18 ans ; 3e : élève
          officier, matelot léger… ». Et il renvoie les montants ailleurs : « le
          montant des salaires forfaitaires est fixé par arrêté des ministres
          chargés de la mer, de la sécurité sociale et du budget ».
          Une carrière saisie dans ce simulateur porte un revenu, pas une
          fonction à bord. Même publiée, la grille ne serait donc pas
          applicable sans une convention supplémentaire — ranger le marin dans
          la catégorie dont le forfait approche le plus son revenu déclaré —,
          et cette convention n'aurait aucune source. C'est la raison pour
          laquelle la fiche s'en tient au revenu déclaré.
          Ouverture dès 50 ans sous conditions de services embarqués.

