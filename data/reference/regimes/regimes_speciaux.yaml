# Régimes spéciaux, vivants et éteints
#
# Ces régimes concentrent les âges d'ouverture les plus précoces du système
# (50 à 55 ans, 40 ans pour les danseurs de l'Opéra). Ce sont eux qui
# produisent les écarts à l'âge de référence les plus élevés, et donc les
# révisions à la baisse les plus fortes dans les scénarios notionnels.
regimes:

  - code: sncf
    nom: Régime spécial de retraite du personnel de la SNCF (CPRPSNCF)
    famille: special
    source_id: rs_cprpsncf
    fiabilite: moyenne
    creation: 1909
    fermeture: 2020
    extinction: null
    succede_a: []
    integre_dans: null
    population: >-
      Agents du cadre permanent de la SNCF. Régime fermé aux agents recrutés
      à compter du 1er janvier 2020 (loi du 27 juin 2018) : les nouveaux
      entrants relèvent du régime général et de l'Agirc-Arrco.
    hors_repartition: false
    periodes:
      - debut: 1930
        fin: 2008
        type_calcul: annuites
        age_ouverture: 50
        age_taux_plein: 50
        duree_requise_trimestres: 150
        taux_plein: 0.75
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.079
        perimetre_taux: agent_seul
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [bonifications, categorie_active, majoration_enfants, reversion]
        notes: >-
          Ouverture à 50 ans pour les agents de conduite, 55 ans pour les autres
          agents du cadre permanent. Aucune décote avant 2008 : un départ à
          50 ans avec 150 trimestres donnait 75 % du dernier traitement.
          C'est le cas où l'écart à l'âge de référence atteint 15 ans.
      - debut: 2009
        fin: 2017
        type_calcul: annuites
        age_ouverture: 50
        age_taux_plein: 55
        duree_requise_trimestres: 160
        duree_requise_par_generation: true
        taux_plein: 0.75
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.0892
        perimetre_taux: agent_seul
        decote_par_trimestre: 0.0125
        bareme_decote: regimes_speciaux
        surcote_par_trimestre: 0.0075
        avantages_non_contributifs: [bonifications, categorie_active, majoration_enfants, reversion]
        notes: >-
          RÉFORME DES RÉGIMES SPÉCIAUX DE 2008, portée ici par le décret n°
          2008-639 du 30 juin 2008 : décote, durée alignée progressivement. LA
          DÉCOTE ARRIVE AVEC QUATRE ANS DE RETARD, et la fiche la servait pleine
          dès 2009. Le calendrier est écrit mot pour mot, et à l'identique, dans
          chacun des décrets de la réforme : « le coefficient de minoration […]
          n'est applicable qu'aux personnes remplissant les conditions […] à
          compter du 1er juillet 2010 […] il est fixé par trimestre manquant à un
          dixième du taux prévu […] ce taux augmente du même montant au 1er
          juillet de chaque année ». Un départ de 2011 décotait donc de 0,125 %
          par trimestre manquant, non de 1,25 % : dix fois moins, et le plafond de
          vingt trimestres retirait 2,5 % de la pension au lieu de 25 %. L'âge
          d'annulation monte de même, de l'âge de référence diminué de seize
          trimestres en 2010 jusqu'à l'âge de référence lui-même en 2024. La
          période branche donc `bareme_decote: regimes_speciaux`, qui lit ce
          calendrier dans `legislation/decote_regimes_speciaux.csv`.
      - debut: 2018
        fin: null
        type_calcul: annuites
        age_ouverture: 52
        age_taux_plein: 57
        duree_requise_trimestres: 172
        duree_requise_par_generation: true
        taux_plein: 0.75
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.1085
        perimetre_taux: agent_seul
        decote_par_trimestre: 0.0125
        bareme_decote: regimes_speciaux
        surcote_par_trimestre: 0.0125
        avantages_non_contributifs: [bonifications, categorie_active, majoration_enfants, reversion]
        notes: Report d'âge de 2 ans puis extinction progressive du régime (clause du grand-père).

