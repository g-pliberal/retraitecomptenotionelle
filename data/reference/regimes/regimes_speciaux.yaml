          par annuité s'applique tel quel, le taux plein est de 75 %, atteint
          en autant d'annuités que la division l'exige, et la retenue de 3,42
          fois L. 61, assise sur la seule rémunération de base, est divisée
          par 2,06. ÂGE : « l'âge mentionné à l'article L. 161-17-2 » (art.
          7), avec « un minimum de cinq années de mandat ». FERMETURE : les
