          estime l'effort contributif total ; le Sénat, dont le site ne publie
          que « 62 à 64 ans » et « 43 annuités » (12 juillet 2023), est traité
          comme l'Assemblée. Avant 2009 : « jusqu'en 2008 : 2,1100 % — 40
          annuités » (tableau de l'art. 21), soit un taux plein de 84,4 % de
