        age_surcote_regimes_speciaux: true
        avantages_non_contributifs: [bonifications, categorie_active, majoration_enfants, reversion]
        notes: >-
          LE RELÈVEMENT DE 2017 EST ÉTALÉ PAR GÉNÉRATION, quatre mois par année de
          naissance : l'article 37-1 du décret n° 2008-639 (LEGIARTI000023732614, en vigueur au 1er janvier 2017) fixe l'âge d'ouverture de la catégorie
          agent de conduite à cinquante ans pour les agents nés avant 1967, cinquante ans et quatre mois pour 1967, et huit mois pour 1968, cinquante et un ans pour 1969, et quatre mois pour 1970, et huit mois pour 1971, cinquante-deux ans à compter de 1972 ; cinquante-cinq à cinquante-sept ans, générations 1962 à 1967, pour les autres agents. La fiche ne portant qu'un âge par période, elle suit ce
          calendrier par année de liquidation — l'âge de la génération qui
          l'atteint cette année-là —, au lieu de la marche d'un coup que
          portait la période précédente. L'âge de référence de la décote
          (`bareme_decote: regimes_speciaux`) suit, cinq ans au-dessus.
