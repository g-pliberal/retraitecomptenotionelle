        salaire_reference_par_generation: true
        decote_par_generation: true
        taux_plein: 0.50
        salaire_reference: 25_meilleures_annees
        assiette: plafonnee
        assiette_repere_smic: 2028
        assiette_forfaitaire: true
        taux_cotisation_retraite: 0.1119
