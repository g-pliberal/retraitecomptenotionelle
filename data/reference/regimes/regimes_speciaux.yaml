          le 1° du I de l'article 13, dans sa rédaction issue du même décret
          (LEGIARTI000048897107, puis LEGIARTI000054622824 depuis le décret n°
          2026-738 du 4 août 2026, qui n'y touche pas), le FIXE « à
          cinquante-sept ans pour les agents mentionnés au 1° du I de l'article
          1 et à soixante-deux ans pour les agents mentionnés au 2° ». La
          fiche le faisait monter cinq ans au-dessus de l'âge d'ouverture,
          jusqu'à cinquante-neuf ans : un agent de conduite né en 1980 parti à
          cinquante-quatre ans se voyait opposer vingt trimestres de décote au
          lieu de douze, soit 10 % de pension. La CPRPSNCF l'écrit de son côté
          (« Réforme des retraites 2023 », lue le 22 septembre 2026) : « L'âge
          d'annulation de la décote est inchangé », cinquante-sept ans pour les
          agents de conduite nés à compter de 1975. Les soixante-deux à
          soixante-quatre ans des générations 1963 à 1970 que la fiche prenait
          pour l'âge d'annulation sont ceux de la SURCOTE (IV de l'article 37-1,
          qui renvoie au II de l'article 13).
          LA DURÉE REQUISE EST CELLE DU RÉGIME, et non la table commune : le I
          de l'article 35 (LEGIARTI000048897024) donne aux agents de conduite
          167 trimestres des nés de novembre 1968 à 1969, puis un de plus par
          marche jusqu'à 172 à compter de 1978, et son II en retranche deux à
          dix pour compter la décote par la durée
          (`duree_requise_table: sncf_conduite`). La suspension de 2026 n'a pas
          été reprise par le décret de la SNCF. Un ou deux trimestres sont
          retranchés aux durées des carrières longues des générations 1968-1977
          (VI de l'article 37-1, non porté).
