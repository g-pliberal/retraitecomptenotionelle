  - code: opera_de_paris
    nom: Caisse de retraites des personnels de l'Opéra national de Paris
    famille: special
    source_id: cor_panorama_regimes
    fiabilite: estimee
    creation: 1698
    fermeture: 2023
    extinction: null
    succede_a: []
    integre_dans: null
    population: Personnels de l'Opéra national de Paris.
    hors_repartition: false
    periodes:
      - debut: 1930
        fin: 2001
        type_calcul: annuites
        age_ouverture: 45
        age_taux_plein: 45
        duree_requise_trimestres: 150
        taux_plein: 0.75
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.1085
        perimetre_taux: agent_seul
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [bonifications, categorie_active, reversion]
        notes: >-
          TRENTE-SEPT ANNUITÉS ET DEMIE, et non vingt-cinq. L'article 14 du
          décret n° 68-382 du 5 avril 1968 le dit depuis l'origine : « chaque
          annuité liquidable est rémunérée à raison de 2 % des émoluments de
          base […] le maximum des annuités liquidables, dans la pension, est
          fixé à trente-sept annuités et demie ». La fiche portait 100
          trimestres : elle servait 75 % du traitement après vingt-cinq ans de
          maison, là où le régime en demande trente-sept et demi.
          CINQ ÂGES, ET DEUX POUR LA SEULE DANSE. L'article 6, dans sa
          rédaction en vigueur jusqu'en 2002, ouvre le droit « à quarante ans
          d'âge, pour le personnel féminin de la danse ; à quarante-cinq ans
          d'âge, pour le personnel masculin de la danse ; à cinquante ans
          d'âge, pour les artistes du chant et les artistes des chœurs ; à
          cinquante-cinq ans d'âge, pour les machinistes, les électriciens, les
          régisseurs ayant la responsabilité du spectacle et les pompiers
          civils […] ; à soixante ans d'âge, pour les autres catégories du
          personnel ». Le moteur ne portant qu'un âge par période, c'est celui
          des hommes de la danse qui est retenu, comme à la Comédie-Française :
          une danseuse partie en 1970 se voit donc opposer cinq ans de plus que
          son droit. Aucune décote : la durée manquante ne joue que par la
          proratisation.
      - debut: 2002
        fin: 2008
        type_calcul: annuites
        age_ouverture: 40
        age_taux_plein: 40
        duree_requise_trimestres: 150
        taux_plein: 0.75
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.1085
        perimetre_taux: agent_seul
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [bonifications, categorie_active, reversion]
        notes: >-
          L'ÂGE DE LA DANSE CESSE DE DÉPENDRE DU SEXE. L'article 6, dans sa
          rédaction en vigueur le 14 mars 2002, ouvre le droit « à quarante ans
          d'âge pour les artistes du ballet » — sans distinction — puis à
          cinquante ans pour le chant et les chœurs, cinquante-cinq pour les
          emplois à fatigues exceptionnelles, soixante pour les autres. C'est
          la période où l'âge de quarante ans, celui pour lequel ce régime est
          connu, vaut pour tout le ballet.
      - debut: 2009
        fin: 2013
        type_calcul: annuites
        age_ouverture: 40
        age_taux_plein: 42
        duree_requise_trimestres: 160
        duree_requise_par_generation: true
        taux_plein: 0.75
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.1085
        perimetre_taux: agent_seul
        bareme_decote: regimes_speciaux_age_fixe
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: 0.0125
        avantages_non_contributifs: [bonifications, categorie_active, reversion]
        notes: >-
          RÉFORME DES RÉGIMES SPÉCIAUX. L'article 14 du décret, réécrit en
          2008, fixe « le nombre de trimestres nécessaire pour obtenir le
          pourcentage maximum de la pension à cent soixante », le fait évoluer
          « comme la durée des services et bonifications exigée des
          fonctionnaires de l'État » et maintient le pourcentage maximum à
          75 %.
          QUARANTE-DEUX ANS, ET NON QUARANTE-CINQ. Le II du même article donne
          à chaque catégorie un âge de référence — l'âge d'ouverture majoré de
          cinq ans — mais y déroge pour la danse : « toutefois, pour les
          artistes du ballet, l'âge de référence est fixé à 42 ans et, pour les
          musiciens de l'orchestre, les chefs de chant et les pianistes, il est
          fixé à 62 ans ». Un danseur partant à quarante ans se voit donc
          opposer huit trimestres de décote, non vingt.
          LA DÉCOTE NE MONTE PAS À LA MÊME VITESSE POUR LUI. Le V ramène les
          autres catégories à l'âge de référence diminué de seize trimestres en
          2010, diminution qui s'efface jusqu'en 2024 ; pour le ballet et les
          musiciens il écrit au contraire un âge fixe — ouverture « majoré de
          quatre trimestres » de juillet 2010 à juin 2011, « six trimestres »
          l'année suivante, « huit trimestres » ensuite. La fiche porte l'âge
          d'arrivée, quarante-deux ans : un danseur liquidant en 2011 se voit
          donc opposer jusqu'à quatre trimestres de décote de trop, au taux de
          0,125 % — un quart de point de pension.
      - debut: 2014
        fin: null
        type_calcul: annuites
        age_ouverture: 40
        age_taux_plein: 42
        duree_requise_trimestres: 172
        duree_requise_par_generation: true
        taux_plein: 0.75
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.1085
        perimetre_taux: agent_seul
        bareme_decote: regimes_speciaux_age_fixe
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: 0.0125
        avantages_non_contributifs: [bonifications, categorie_active, reversion]
        notes: >-
          CENT SOIXANTE-DOUZE TRIMESTRES, ÉCRITS EN TOUTES LETTRES. L'article
          14, depuis le 26 juin 2014, ne renvoie plus à la fonction publique :
          « le nombre de trimestres nécessaire pour obtenir le pourcentage
          maximum de la pension est fixé à cent soixante-douze. Le pourcentage
          maximum de la pension est fixé à 75 % ». Le V le module encore par
          génération jusqu'aux assurés nés en 1973, d'où la lecture à la
          génération que la fiche conserve.
          L'ÂGE DU BALLET N'A PAS BOUGÉ. Le décret n° 2011-953 du 10 août 2011
          a relevé les autres : « 1° A quarante ans pour les artistes du
          ballet ; 2° A cinquante-sept ans pour les artistes des chœurs ; 3° A
          cinquante-sept ans pour les personnels qui occupent des emplois
          reconnus […] comme comportant des fatigues exceptionnelles ; 4° A
          soixante ans pour les musiciens, chefs de chant et pianistes
          accompagnateurs ; 5° A soixante-deux ans pour les autres catégories
          de personnel ». C'est la rédaction encore en vigueur : la réforme de
          2023 a fermé le régime aux recrutements du 1er septembre 2023 sans
          toucher à ces âges.
          CAS EXTRÊME de l'écart à l'âge de référence : vingt-quatre ans
          d'anticipation par rapport à l'âge de référence 2026, et le seul
          régime français où l'on liquide à quarante ans.

