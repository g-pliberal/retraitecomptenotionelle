          part employeur écrite. PENSION : « l'assiette de référence servant
          au calcul des pensions est égale à 2,06 fois la rémunération » et la
          pension vaut, par annuité, un pourcentage de cette assiette (art.
          17), sans excéder « les trois-quarts » de l'assiette. LE REVENU
          SAISI EST PRIS POUR L'ASSIETTE DE RÉFÉRENCE — l'indemnité entière,
