    population: >-
      Mineurs et assimilés. Fermé aux nouveaux entrants au 1er septembre 2010 ;
      régime en extinction, gestion transférée à la CDC puis à la CNAV.
    hors_repartition: false
    # MAJORATION POUR ENFANTS, lue le 23 septembre 2026 dans l'index LEGI
    # — décret n° 46-2769, article 139 (LEGIARTI000006765039) : pensions «
    # majorées d'un dixième » pour qui a eu au moins trois enfants, sans
    # supplément au-delà. La fiche ne la déclarait pas, et le mineur père
    # ou mère de trois enfants n'en recevait rien.
    periodes:
      - debut: 1930
        fin: 1973
        type_calcul: points
        age_ouverture: 50
        age_taux_plein: 55
        duree_requise_trimestres: 120
        taux_plein: 1.0
        points_par_trimestre_valide: 1
        salaire_reference: sans_objet
        assiette: plafonnee
        taux_cotisation_retraite: 0.0805
        perimetre_taux: agent_seul
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [bonifications, categorie_active, majoration_enfants, reversion]
        valeur_point_euros: 11.32
        valeur_point_annee: 1974
        notes: >-
          LA PENSION DU MINEUR N'A JAMAIS DÉPENDU DE SON SALAIRE. C'est un
          FORFAIT PAR TRIMESTRE DE SERVICE, et il est le même pour l'abatteur
          et pour l'ingénieur : « le montant annuel de la pension de vieillesse
          est proportionnel à la durée de service ; il est égal au produit du
          montant de pension pour un trimestre de services et du nombre de
          trimestres de services effectués » (article 131 du décret n° 46-2769
          du 27 novembre 1946). La fiche servait 75 % du dernier salaire : pour
          un mineur payé au salaire moyen, elle inventait deux fois la pension
          que le décret lui donne.
          LA PÉRIODE LA PLUS ANCIENNE EST UNE EXTENSION. La base LEGI ne porte
          aucune version du montant avant 1974 : la valeur de 1974 est reportée
          en arrière par l'indice des prix, ce qui suppose que le forfait a
          suivi les prix depuis 1930. Il ne les a pas suivis — il a longtemps
          suivi les salaires —, et une liquidation des années 1950 est donc
          incertaine dans les deux sens.
      - debut: 1974
        fin: 1974
        type_calcul: points
        age_ouverture: 50
        age_taux_plein: 55
        duree_requise_trimestres: 120
        taux_plein: 1.0
