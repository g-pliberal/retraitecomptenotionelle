        notes: >-
          « La valeur du trimestre de services […] s'élève à 82,83 euros au
          1er avril 2013 » (article 131, rédaction du 6 septembre 2015), et
          c'est la dernière que le décret porte : trente ans de mine valent
          9 940 € par an, quarante ans 13 253 €. Les pensions liquidées sont
          ensuite revalorisées comme les autres (article 181), d'où
          l'indexation sur les prix au-delà de 2013.
          FERMÉ AUX NOUVEAUX ENTRANTS depuis le 1er septembre 2010 (décret
          n° 2010-975 du 27 août 2010), et à eux seuls : le mineur qui était
          déjà là garde son régime jusqu'à sa retraite, et ses règles ne
          changent pas. C'est un régime en EXTINCTION, que les réformes de 2010,
          2014 et 2023 ont laissé où il était — l'article 125 garantit toujours
          la pension « aux affiliés âgés de cinquante-cinq ans au moins » —, et
          non un régime réformé.
          L'ÂGE DE CINQUANTE ANS EST L'ÂGE ANTICIPÉ, et la fiche le sert à tous.
          L'article 146, jusqu'en 1985, l'ouvrait « aux travailleurs qui
          justifient, à cet âge, de trente années de service à la mine dont
          vingt années au moins au fond » ; depuis 1985, l'âge « est abaissé à
          raison d'un an par tranche de quatre années de service au fond pour
          les travailleurs comptant au moins trente années d'affiliation ». Le
          moteur ne sait pas où un mineur a travaillé : il lui donne l'âge du
          fond, cinquante ans, quand celui du jour est cinquante-cinq.

