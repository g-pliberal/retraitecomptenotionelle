        notes: >-
          SOURCE : règlement de la Caisse de retraites des membres du Conseil
          économique, social et environnemental au 1er janvier 2025
          (lecese.fr, lu par scripts/fetch/sites_institutionnels.py), hors
          JORF. RETENUE : « égal à 3,42 fois celui prévu au 2° de l'article
          L61 du code des pensions civiles et militaires » (art. 4), sur la
          rémunération des membres « à l'exclusion de l'indemnité de résidence
          et du supplément familial » — la fiche multiplie le taux de la
          fonction publique de l'année par 3,42 ; le Conseil ne verse pas de
          part employeur écrite. PENSION : « l'assiette de référence servant
          au calcul des pensions est égale à 2,06 fois la rémunération » et la
          pension vaut, par annuité, un pourcentage de cette assiette (art.
          17), sans excéder « les trois-quarts » de l'assiette. LE REVENU
          SAISI EST PRIS POUR L'ASSIETTE DE RÉFÉRENCE — l'indemnité entière,
          dont la rémunération de base de l'article 4 est le 2,06e — : le taux
          par annuité s'applique tel quel, le taux plein est de 75 %, atteint
          en autant d'annuités que la division l'exige, et la retenue de 3,42
          fois L. 61, assise sur la seule rémunération de base, est divisée
          par 2,06. ÂGE : « l'âge mentionné à l'article L. 161-17-2 » (art.
          7), avec « un minimum de cinq années de mandat ». FERMETURE : les
          membres désignés dès le 1er septembre 2023 relèvent du régime
          général et de l'Ircantec. « 2,11 % pour les mandats jusqu'au
          31/8/2004 » (art. 17), soit 4,35 % de la rémunération par annuité,
          35,5 annuités pour le maximum ; retenue 3,42 × 7,85 % / 2,06 = 26,85
          %.
