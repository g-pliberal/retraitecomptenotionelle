          l'article 24 (LEGIARTI000047914227) le fixe à « l'âge minimum
          d'ouverture du droit à pension applicable à l'assuré majoré de trois
          ans à l'issue des dispositions prévues aux 1°, 2° et 3° du II de
          l'article 51-1 » — cinquante-quatre plus trois, cinquante-sept ans au
          tableau B —, et le 2° du VII de l'article 51-1 garde de 2025 à 2033
          l'âge de référence d'avant 2023, l'âge d'ouverture majoré de cinq
          ans, qui vaut aussi cinquante-sept ans pour les nés à compter de 1972.
          La fiche le faisait monter jusqu'à cinquante-neuf : un machiniste né
          en 1980 parti à cinquante-quatre ans se voyait opposer huit
          trimestres de décote de trop, soit 10 % de pension. La CRP RATP ne
          publie pas cette règle hors de l'espace de ses affiliés.
          LA DURÉE REQUISE EST CELLE DU RÉGIME, et non la table commune : le I
          de l'article 51 (LEGIARTI000052292971) porte 167 trimestres des nés
          du 1er juillet 1959 à 1960, puis un de plus par marche jusqu'à 172 à
          compter de 1968 (`duree_requise_table: ratp`). La suspension de 2026
          n'a pas été reprise par le décret de la RATP. Un ou deux trimestres
          sont retranchés aux durées des carrières longues des générations
          1963-1972 (VIII de l'article 51-1, non porté).
