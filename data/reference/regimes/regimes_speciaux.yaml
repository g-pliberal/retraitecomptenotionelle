        avantages_non_contributifs: [bonifications, categorie_active, majoration_enfants, reversion]
        notes: >-
          LE RELÈVEMENT DE LA LOI DU 14 AVRIL 2023 : le décret n° 2023-692 du
          28 juillet 2023 (JORFTEXT000047903232, article 2
          JORFARTI000047903271) réécrit l'article 16 de l'annexe 3 du statut
          national — l'âge de soixante-deux ans devient « l'âge mentionné à
          l'article L. 161-17-2 du code de la sécurité sociale », celui de
          cinquante-sept ans « cet âge abaissé de cinq ans » — aux pensions
          prenant effet à compter du 1er janvier 2025 (article 3,
          JORFARTI000047903346). LEGI ne consolide pas cette rédaction
          (articles 1er et 2 datés 2999) : elle est lue au Journal officiel.
          Par génération, l'âge des services actifs va de cinquante-sept ans
          (nés avant 1961) à cinquante-neuf ans (nés à compter de 1968), trois
          mois par année de naissance ; en 2025, la génération 1967 l'atteint
          à cinquante-huit ans et neuf mois, la génération 1968 à cinquante-
          neuf ans en 2027 — la fiche suit ce calendrier par année de
          liquidation, l'âge de référence de la décote cinq ans au-dessus. La
          durée requise du I bis de l'article 45 (170 trimestres pour les nés
          de 1964 à 1966, 171 pour 1967-1968, 172 à compter de 1969, pour cinq
          ans de services actifs) est plus exigeante d'un à trois trimestres
          que la table nationale lue à la génération : écart non porté. Le
          régime est fermé aux agents recrutés à compter du 1er septembre 2023
          (annexe 3, art. 1er), ce que le routage porte.
          L'ÂGE DE RÉFÉRENCE EST L'ÂGE MINIMUM MAJORÉ DE TROIS ANS, ET NON DE
          CINQ, DEPUIS LE 1er JANVIER 2025. Le I de l'article 10 de l'annexe 3,
          dans sa version en vigueur (LEGIARTI000052046924, lue le 22 septembre
          2026), compte les trimestres de minoration jusqu'à « un âge de
          référence correspondant à l'âge minimum d'ouverture du droit à pension
          applicable à l'assuré majoré de trois ans ou, lorsque celui-ci relève
          du 7° de l'article 16, de cinq ans » ; et son article 45 fixe, « pour
          les pensions prenant effet à compter du 1er janvier 2025 », l'âge
          d'annulation à soixante-deux ans pour les agents du 2° du I de
          l'article 16 nés avant le 1er janvier 1975. La fiche portait l'âge
          d'ouverture majoré de CINQ ans — 63,75 puis 64 ans —, règle d'avant la
          réforme de 2023 : elle décotait un agent liquidant à soixante-deux ans
          de sept trimestres de trop, soit 8,75 % de pension. La CNIEG l'écrit
          de son côté en toutes lettres : « à compter du 1er janvier 2025 […]
          âge minimum + 3 ans (sauf exceptions) », « de façon à maintenir un âge
          d'annulation de la décote au plus tard à 67 ans ».

