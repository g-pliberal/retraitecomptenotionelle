  textes:
    - {reference: "accord du 15 mai 1957 créant l'UNIRS (hors JORF)", id: null}
  manque: >-
    L'UNIRS tient lieu de toutes les institutions fédérées avant 1961 — CRI,
    CIRCC, CGRCR, IRPSIMMEC, CAPIMMEC et les autres —, dont aucune n'a de
    fiche propre : chacune avait son barème, et le dépôt n'en connaît qu'un ;
    et ce barème n'est chiffré nulle part dans l'index (deux occurrences du
    nom avant 1975, sans taux) : 2,5 % par continuité avec l'Arrco de 1962.
