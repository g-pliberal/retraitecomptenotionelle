# Intégré jusqu'à sa fermeture, lu le 27 septembre 2026 : le régime
# complémentaire de ce personnel est institué en 1954 avec elle, par le décret
# n° 54-953 du 14 septembre 1954, et le décret n° 55-1297 (article 5, dans sa
# rédaction de 1962, LEGIARTI000006767289) l'affilie à la caisse autonome de
# retraites complémentaires et de prévoyance du transport. Aucun texte lu ne
# lui en donne un avant 1954.
