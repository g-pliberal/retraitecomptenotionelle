  rang: 120
  nom: Caisse autonome mutuelle de retraites des chemins de fer secondaires et tramways (CAMR)
  population: Agents des chemins de fer d'intérêt local et des tramways, recrutés avant 1954
  couverture: partiel
  statuts: [agent_chemins_fer_secondaires]
  textes:
    - {reference: "loi du 22 juillet 1922 relative aux retraites des agents des chemins de fer secondaires et des tramways", id: null}
    - {reference: "code de la sécurité sociale, R. 711-1 7°", id: LEGIARTI000048031379}
  manque: >-
    Une seule période, au niveau `estimee`, depuis le texte fondateur sans
    recontrôle. Le décret n° 54-953 du 14 septembre 1954 n'affilie au régime
    général que les agents embauchés après le 1er octobre 1954 (article 4) ;
    ceux d'avant restent à la caisse autonome mutuelle, dont il relève les
    cotisations (article 2 : 7 % pour l'agent) — JO du 23 septembre 1954, lu
    le 28 septembre 2026. Le routage les passe pourtant tous au régime
    général en 1955, la fiche n'ayant aucune période après 1954. Les
    embauchés d'après ont la complémentaire que crée, à compter du 1er
    janvier 1955, le décret n° 54-1061 du 30 octobre 1954
    (JORFTEXT000000691311), celle de la caisse autonome de retraites
    complémentaires et de prévoyance du transport (décret n° 55-1297,
    article 5) : 6 % de toute la rémunération, sans plafond, à parts égales
    (article 10), rien sur le premier semestre 1955 (article 40), des points
    au quotient de la rémunération par un salaire horaire de référence
    (article 17), l'âge normal à soixante ou soixante-cinq ans selon le
    service (article 22) — JO du 4 octobre 1955. La valeur du point, fixée
    par arrêté pour 1955 et 1956 (article 39), et le salaire horaire de
    référence, fixé par arrêté lui aussi, ne sont pas lus : le routage lui
    substitue le droit commun du non-cadre, rien en 1955 et 1956, l'UNIRS de
    1957 à 1960, l'Arrco ensuite.
