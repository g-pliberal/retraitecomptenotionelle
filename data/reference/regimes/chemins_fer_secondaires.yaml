  manque: >-
    Une seule période, au niveau `estimee`, depuis le texte fondateur sans
    recontrôle. Et, après la fermeture, le routage ne porte aucune
    complémentaire en 1955 et 1956, puis celle de l'UNIRS : le régime
    complémentaire du personnel, institué par le décret n° 54-953 du
    14 septembre 1954, est celui de la caisse autonome de retraites
    complémentaires et de prévoyance du transport (décret n° 55-1297,
    article 5), dont les taux ne sont pas lus.
