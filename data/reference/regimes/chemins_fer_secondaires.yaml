# Intégré, lu les 27 et 28 septembre 2026 : aucun texte lu ne donne de
# complémentaire à ses affiliés. Celle que crée, à compter du 1er janvier
# 1955, le décret n° 54-1061 du 30 octobre 1954, en complétant l'article 4 du
# décret n° 54-953 du 14 septembre 1954, vise les agents que cet article
# affilie au régime général — les embauchés d'après le 1er octobre 1954 — ;
# le décret n° 55-1297 (article 5, dans sa rédaction de 1962,
# LEGIARTI000006767289) les affilie à la caisse autonome de retraites
# complémentaires et de prévoyance du transport.
