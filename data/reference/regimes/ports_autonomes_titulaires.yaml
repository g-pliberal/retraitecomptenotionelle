  manque: >-
    Aucun des trois règlements n'est dans l'index, qui ne porte que les
    titres et notices : on ne sait ni s'ils servent une pension de base ou
    un complément au-dessus du régime général — le décret n° 58-437 range
    les titulaires du Havre au régime de sécurité sociale, et la
    convention collective des ports donne son propre règlement de retraite
    —, ni s'ils sont fermés ; le décret n° 96-1151 range encore le port de
    Bordeaux parmi les régimes spéciaux dont il modifie la cotisation
    maladie des actifs et des retraités. Il faudrait les règlements, aux
    archives des ports ou au Bulletin officiel des ministères.
