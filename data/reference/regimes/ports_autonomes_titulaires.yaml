code: ports_autonomes_titulaires
nom: >-
  Régimes de retraite du personnel titulaire des ports autonomes de Bordeaux, du Havre et de Marseille et de leurs chambres de commerce concessionnaires
famille: special
population: >-
  Personnel titulaire de trois établissements portuaires, dont la
  retraite relevait d'un règlement propre antérieur à la sécurité
  sociale : le port autonome de Bordeaux (règlement de retraite approuvé
  par arrêté du 4 juin 1946, avenants de 1948 et 1950 ; caisse de
  prévoyance du personnel titulaire, régime spécial pour la maladie
  jusqu'au 1er janvier 2018), la chambre de commerce et le port autonome
  du Havre (caisse de retraites dont les statuts sont modifiés en 1943,
  régime de sécurité sociale des agents titulaires en 1958, règlement de
  retraites de 1962, caisse de retraites complémentaires qui contribue au
  fonds spécial jusqu'en 1990), la chambre de commerce de Marseille
  (règlement annexé au décret n° 59-809). Le code des transports maintient
  les décrets de Marseille et du Havre pour le personnel intégré dans le
  port autonome (R. 5313-28).
