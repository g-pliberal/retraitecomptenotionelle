    notes: >-
      LOI N° 2005-1579 DU 19 DÉCEMBRE 2005, ARTICLE 75, VII : « Ces
      dispositions sont applicables aux personnes mentionnées à l'article
      L. 382-15 qui bénéficient d'un revenu d'activité perçu
      individuellement » — la phrase que porte L. 921-1 depuis sa version du
      20 décembre 2005 (LEGIARTI000006745503) jusqu'à celle en vigueur
      (LEGIARTI000047452643). L'ASSIETTE EST UN FORFAIT : la circulaire de la
      CAVIMAC n° 2026/03 du 27 mai 2026 porte au SMIC mensuel, 1 867 € depuis
      le 1er juin 2026, « les assiettes forfaitaires respectives des
      cotisations mensuelles d'assurance maladie – maternité – invalidité,
      vieillesse et retraite complémentaire obligatoire des cultes ». C'est
      le principe de l'Agirc-Arrco — « lorsque l'assiette de cotisation est
      définie forfaitairement pour le calcul des cotisations de sécurité
      sociale, cette même assiette est retenue » (circulaire 2019-1-DRJ,
      fiche 3) —, et le revenu saisi n'y entre donc pas, pas plus qu'à la
      base. LE TAUX est le « taux de base » de la circulaire, 10,02 %, dont
      6,01 % à la charge de la collectivité et 4,01 % de l'assuré : 7,87 % de
      cotisation qui ouvre des points, et les 2,15 % de la contribution
      d'équilibre générale, qui n'en ouvrent pas. Les huit « taux
      spécifiques » qu'elle énumère, de 11,13 à 21,31 %, ne sont pas portés.
      Les points sont ceux de l'Arrco puis de l'Agirc-Arrco (`points_de`),
      achetés et servis à leur barème : seule l'assiette diffère, comme pour
      la tranche 2 de l'Arrco.
