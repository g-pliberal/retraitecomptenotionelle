population: >-
  Les personnes du régime des cultes (L. 382-15) « qui bénéficient d'un
  revenu d'activité perçu individuellement » : ministres des cultes
  rémunérés par leur diocèse, leur association ou leur communauté, et
  membres de congrégations dans le même cas. L. 921-1 les affilie à une
  institution de retraite complémentaire depuis le 1er janvier 2006 ; la
  CAVIMAC recouvre les cotisations, une institution de l'Arrco calcule et
  sert les points. Fiche à part de l'Arrco parce que son ASSIETTE n'est
  pas un salaire mais un forfait.
