    - {reference: "mémo des valeurs 2026 de l'IRCEC (prix d'achat 4,78 €, valeur de service 0,421 €)", id: null}
  manque: >-
    Le barème du point est celui du seul mémo 2026 de l'IRCEC, appliqué en
    rendement à toute la carrière ; le plafond de 597 500 € est arrondi à
    treize plafonds de la Sécurité sociale.
    La minoration de l'IRCEC est lue depuis 2014 ; avant, et pour les
    générations nées avant 1955 jusqu'en 2024, elle est approchée (voir
    `docs/limites.md`).
