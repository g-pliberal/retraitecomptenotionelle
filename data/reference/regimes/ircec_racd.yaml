    abattement_points: ircec
    avantages_non_contributifs: [reversion, majoration_enfants]
    notes: >-
      MAJORATION POUR ENFANTS DEPUIS L'ARRÊTÉ DU 17 AVRIL 2024
      (JORFARTI000049490796), qui l'a insérée à l'article 23 du règlement :
      la pension « est majorée de 10 % au profit de l'adhérent ayant eu au
      moins trois enfants », ou les ayant élevés neuf ans avant leurs seize
      ans. Le RACD n'en servait aucune avant — le guide 2026 de la caisse
      et sa foire aux questions l'écrivent désormais, au RACD comme au
      RAAP. Minoration, taux, assiette et points : ceux de la période
      précédente.
