    avantages_non_contributifs: [reversion]
    notes: >-
      LIQUIDATIONS ANTÉRIEURES À 2014 : le règlement servait alors le
      taux plein à soixante-cinq ans, et ses coefficients d'anticipation,
      que l'arrêté du 21 novembre 2013 a remplacés, ne sont pas reproduits
      au Journal officiel. La période garde la décote du régime de base,
      faute d'eux.
      TAUX : « la cotisation complémentaire […] est fixée à 8 % de la
      totalité du montant des droits perçus pendant l'année dans la limite
      d'un maximum fixé par le règlement » (décret n° 64-226, art. 2,
      LEGIARTI000006761271, puis LEGIARTI000006761272 dès 2004) ; 8 %
      encore au mémo 2026 de l'IRCEC, sous un plafond de 597 500 € —
      treize plafonds de la Sécurité sociale, la borne la plus proche du
      catalogue. POINTS : le règlement, hors index, fixe le prix d'achat
      (4,78 € en 2026) et la valeur de service (0,421 €) :
      `rendements_points.csv` porte leur rapport, 8,8 centimes de rente
      par euro, appliqué à toute la carrière faute de série ancienne ;
      niveau `estimee`. Âges de la fiche `ircec_raap`.
  - debut: 2014
    fin: 2023
    type_calcul: points
    age_ouverture: 62
