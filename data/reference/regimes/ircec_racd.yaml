    decote_par_trimestre: 0.0125
    surcote_par_trimestre: null
    abattement_points: ircec
    avantages_non_contributifs: [reversion]
    notes: >-
      MINORATION DE L'IRCEC, et non celle du régime de base : règlement
      du RACD, art. 21, dans la rédaction de l'arrêté du 21 novembre
      2013 puis de celui du 17 avril 2024 (JORFARTI000049490796) : 2,5 %
      pour chacune des deux premières années manquantes, 5 % au-delà, ou
      les coefficients du régime de base s'ils sont plus favorables ;
      taux plein dès l'âge légal si la pension du régime de base l'est.
      L'annexe de 2013 portait 5 % dès la première année pour les
      générations 1955 et suivantes, contre son propre article : c'est
      l'article que la fiche suit, et celui qu'a gardé l'arrêté de 2024.
      Une année entamée compte entière : l'annexe de l'arrêté du 21
      novembre 2013 (JORFARTI000028254004) la chiffre trimestre par
      trimestre. Les générations nées avant 1955 avaient jusqu'en 2024
      leurs propres coefficients, que la période ne porte pas (voir
      `docs/limites.md`).
      Taux, assiette et points : ceux de la première période. AUCUNE
      MAJORATION POUR ENFANTS avant 2024 : voir la période suivante.
  - debut: 2024
    fin: null
