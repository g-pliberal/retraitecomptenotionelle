    avantages_non_contributifs: [reversion]
    notes: >-
      MINORATION DE L'IRCEC, et non celle du régime de base : l'arrêté
      du 13 mai 2025 (JORFARTI000051592840) aligne le RACL sur le RAAP
      et le RACD : 2,5 % pour chacune des deux premières années
      manquantes, 5 % au-delà, les coefficients du régime de base s'ils
      sont plus favorables, et le taux plein dès l'âge légal si la
      pension du régime de base l'est.
      Une année entamée compte entière : l'annexe de l'arrêté du 21
      novembre 2013 (JORFARTI000028254004) la chiffre trimestre par
      trimestre. Les générations nées avant 1955 avaient jusqu'en 2024
      leurs propres coefficients, que la période ne porte pas (voir
      `docs/limites.md`).
      Taux, assiette et points : ceux de la première période.
