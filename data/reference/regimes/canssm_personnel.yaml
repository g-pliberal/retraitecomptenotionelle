code: canssm_personnel
nom: >-
  Régime de retraite du personnel statutaire de la Caisse autonome nationale de la sécurité sociale dans les mines
famille: special
population: >-
  Agents de la Caisse autonome nationale de la sécurité sociale dans les
  mines recrutés sous le statut de l'article 79 du décret n° 46-2769 :
  régime spécial de sécurité sociale propre, dont le décret n° 91-613
  (article 14) fixait les taux maladie jusqu'en 1996 et fixe la
  cotisation vieillesse de l'agent, 7,85 % depuis 1991. La caisse cesse de recruter
  sous ce statut au 1er mai 2005 (ordonnance n° 2005-389, article 4) ;
  les agents transférés alors à la Caisse des dépôts gardent leur régime,
  ou n'y gardent que leurs droits acquis s'ils optent pour la convention
  collective de la Caisse des dépôts, qui gère le régime depuis janvier
  2009 sous le nom de « retraite des statutaires ».
