    notes: >-
      UN RÉGIME CHAPEAU LU À TRAVERS SA RÉFORME. Source : « La réforme des
      retraites des banques », Fondation IFRAP (www.ifrap.org/retraite/la-
      reforme-des-retraites-des-banques, lue par
      scripts/fetch/sites_institutionnels.py) ; l'accord du 13 septembre
      1993 et les règlements des caisses ne sont pas publiés. PENSION : «
      72 à 75 % du dernier salaire pour une carrière complète de 42 ans,
      c'est-à-dire 1,667 % par année de carrière bancaire », SÉCURITÉ
      SOCIALE COMPRISE — la caisse bancaire servait la différence. Le
      régime général sert 50 % du salaire moyen, soit 38 à 40 % du dernier
      salaire quand « l'écart entre le salaire moyen et le dernier salaire
      était en moyenne de 30 % » : la fiche ne porte que le COMPLÉMENT, 35
      % du dernier salaire pour 168 trimestres, 0,83 % par annuité, sur
      toute la rémunération. COTISATION : « 12 à 20 % de la masse
      salariale suivant la caisse » — 16 %, dont trois dixièmes au
      salarié, part estimée. Âges 60 et 65 ans, sans décote lue. AU 1ER
      JANVIER 1994 les droits sont figés « comme si chaque salarié
      liquidait sa pension à cette date » et servis en complément
      différentiel, raboté ensuite (revalorisation « moins 1,9 point ») :
      le rabot n'est pas modélisé, la fiche sert le complément acquis à
      1993. Les autres régimes intégrés (CPPOSS, CGRCE, CCI, IRREP,
      CAMARCA) ont chacun leur barème, non publié : le barème bancaire
      leur tient lieu, niveau `estimee`.
