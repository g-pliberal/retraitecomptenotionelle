code: regimes_professionnels_integres
rang: 220
nom: >-
  Régimes professionnels de salariés intégrés à l'Agirc-Arrco (banques AFB, organismes de sécurité sociale, caisses d'épargne)
famille: complementaire_prive
source_id: sites_institutionnels
fiabilite: estimee
creation: 1947
fermeture: 1993
extinction: null
succede_a: []
integre_dans: agirc_arrco
population: >-
  Personnels des banques AFB (régime professionnel intégré en 1994), des
  organismes de sécurité sociale (CPPOSS, 1994), des caisses d'épargne
  (CGRCE, 2000), du Crédit agricole, des CCI, VRP (IRREP) et cadres
  agricoles (CAMARCA, 1973) : des régimes CHAPEAU à prestations définies,
  servis à la place de l'Arrco et de l'Agirc jusqu'à leur intégration. La
  fiche porte le barème bancaire, le seul lisible, pour tous.
