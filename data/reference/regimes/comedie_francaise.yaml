      Décret n° 2011-1134 du 21 septembre 2011 : « le droit à pension est
      acquis 1° à l'âge de soixante-deux ans, pour les artistes aux
      appointements et pour les employés à traitement fixe […] 2° à l'âge de
      cinquante-sept ans » pour les machinistes, électriciens, régisseurs et
      pompiers. C'est la rédaction ENCORE EN VIGUEUR : la réforme de 2023 n'a
      pas touché cet article — le décret n° 2023-840 a réécrit l'article
      6 ter sur les carrières longues, sans relever l'âge de soixante-deux
      ans — et elle N'A PAS FERMÉ LE RÉGIME : l'article 1er de la loi
      n° 2023-270 (JORFARTI000047445082) ne nomme que la RATP, les IEG,
      la CRPCEN, la Banque de France et le CESE.
