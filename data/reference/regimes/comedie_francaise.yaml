      RÉFORME DES RÉGIMES SPÉCIAUX, portée ici par le décret n° 2008-658 du
      2 juillet 2008 : coefficient de minoration et durée d'assurance alignée
      sur celle de la fonction publique, qui monte par génération. Les bornes
      d'âge, elles, ne bougent qu'en 2011.
      La décote, elle, monte en charge sur le calendrier des régimes
      spéciaux — rien avant le 1er juillet 2010, un dixième du taux plein
      ensuite, 1,25 % seulement en 2019 —, et non sur celui de la fonction
      publique, qui a quatre ans d'avance.
