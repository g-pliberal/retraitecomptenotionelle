# MAJORATION POUR ENFANTS, lue le 23 septembre 2026 dans l'index LEGI
# — décret n° 68-960, article 16 VI (LEGIARTI000006765450) : 10 % pour
# les trois premiers enfants et 5 % par enfant au-delà. La fiche ne la
# déclarait pas. Barème `taux_majoration_enfants` de chaque période.
