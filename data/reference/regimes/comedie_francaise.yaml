    avantages_non_contributifs: [bonifications, majoration_enfants, reversion]
    notes: >-
      DEUX POUR CENT PAR ANNUITÉ, TRENTE-SEPT ANNUITÉS ET DEMIE, et la fiche
      portait vingt-cinq : l'article 12 du décret n° 68-960 du 11 octobre 1968
      rémunère « chaque annuité liquidable à raison de 2 % des émoluments de
      base » et fixe « le maximum des annuités liquidables dans la pension à
      trente-sept annuités et demie ».
      L'ÂGE A CHANGÉ TROIS FOIS, et la fiche n'en portait qu'un — soixante ans,
      celui de 1993, appliqué depuis 1930. Avant le décret du 25 mars 1993, le
      droit à pension s'ouvrait « à cinquante ans d'âge, pour le personnel
      féminin ; à cinquante-cinq ans d'âge, pour le personnel masculin » chez
      les artistes aux appointements. Le moteur ne portant qu'un âge par
      période, c'est celui des hommes qui est retenu : une comédienne partie en
      1970 se voit donc opposer cinq ans de plus que son droit.
