      février 1994 et du 25 avril 1996 : 5 %. BARÈME DES ENTREPRISES
      CRÉÉES À COMPTER DU 1ER JANVIER 1997 : la tranche 2 y est cotisée
      d'emblée à 14 % (1997), 15 % (1999), 16 % (2000), sans les marches
      de 1961-2005 des entreprises déjà adhérentes, et RIEN avant 1997 —
      l'entreprise n'existait pas. Variante
      `taux_contractuels/entreprises_apres_01_01_1997` d'OpenFisca-France
      ; la fiche `arrco_tranche_2` porte l'autre. Points Arrco
      (`points_de: arrco`). Le statut « salarié non cadre d'une entreprise
      créée après 1997 » y route la tranche 2 de 1997 à 2018, et l'Arrco
      de droit commun sur la tranche 1.

