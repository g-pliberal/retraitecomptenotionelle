      89-110 sert encore les pensions de janvier à juin. Les âges et la
      durée écrits ici ne sont que les cibles des tables, qui répondent
      pour toute génération. Coefficient de minoration à la génération
      (R. 351-27, rendu applicable par le décret n° 2017-1000, art. 3,
      XIV).
