      2016 (`date_effet`). COEFFICIENT DE MINORATION À LA GÉNÉRATION,
      par le renvoi de l'article 9 à R. 351-27 : 1,5 % pour les nés en
      1951, 1,375 % en 1952, 1,25 % à compter de 1953. La fiche prenait
      1,87 %, « à mi-chemin » d'une montée en charge qu'elle croyait
      décalée ici ; aucun texte de l'archipel ne la décale (le décret n°
      2017-1000 n'adapte de R. 351-27 que la durée limite, art. 3, XIV,
      1°).
