population: >-
  Salariés de l'archipel, depuis la loi n° 87-563 du 17 juillet 1987 qui
  substitue un régime de base calqué sur le régime général au régime de
  l'ordonnance n° 77-1102. Mêmes formules que le régime général, mais
  durée requise et âges propres, en retard de sept générations sur la
  table nationale.
