    decote_par_trimestre: 0.0250
    surcote_par_trimestre: null
    avantages_non_contributifs: [minimum_vieillesse, majoration_enfants, reversion]
    notes: >-
      TAUX ET ASSIETTE PRÊTÉS DU RÉGIME GÉNÉRAL. La caisse de prévoyance
      sociale fixe ses propres taux (60 % employeur, 40 % salarié) et son
      propre plafond, « revalorisé à la même date et du même taux que le
      plafond des cotisations du régime général » (loi n° 87-563, art. 13)
      ; aucun des deux n'est une série du dépôt : la fiche porte le taux
      et le plafond nationaux de l'année, niveau `estimee`. DURÉE
      TRANSITOIRE : « cette durée est abaissée à 108 trimestres pour les
      pensions dont l'entrée en jouissance intervient entre le 1er août
      1987 et le 31 décembre 1987. Elle est égale à 110 trimestres au 1er
      janvier 1988 ; elle augmente ultérieurement de 4 trimestres par
      année civile » (décret n° 89-110, art. 9, LEGIARTI000006774247) ;
      taux de 50 % et coefficient de minoration de R. 351-27 par renvoi du
      même article, pension « égale à autant de 150es » ; âges de 60 et 65
      ans par renvoi aux articles R. 351-1 et suivants (art. 7,
      LEGIARTI000006774242).
