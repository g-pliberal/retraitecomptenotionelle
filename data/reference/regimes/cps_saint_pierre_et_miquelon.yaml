    notes: >-
      TAUX ET ASSIETTE PRÊTÉS DU RÉGIME GÉNÉRAL. La caisse de prévoyance
      sociale fixe ses propres taux (60 % employeur, 40 % salarié) et son
      propre plafond, « revalorisé à la même date et du même taux que le
      plafond des cotisations du régime général » (loi n° 87-563, art. 13)
      ; aucun des deux n'est une série du dépôt : la fiche porte le taux
      et le plafond nationaux de l'année, niveau `estimee`. DURÉE DE 150
      TRIMESTRES, celle du 1° de R. 351-27 par renvoi de l'article 9 du
      décret n° 89-110 — la loi du 22 juillet 1993 n'a pas été étendue à
      l'archipel, et l'ordonnance n° 2015-896 le confirme en écrivant «
      150 trimestres pour les assurés nés avant le 1er janvier 1956 » (loi
      n° 87-563, art. 5, c, LEGIARTI000030930361) ; âges de 60 et 65 ans
      pour toute génération (art. 7, LEGIARTI000006774242). COEFFICIENT DE
      MINORATION À LA GÉNÉRATION : le même article 9 fixe le taux « selon
      les modalités définies à l'article R. 351-27 », qui l'abaisse depuis
      2004 de 2,5 % pour les nés avant 1944 à 1,25 % pour ceux de 1953 ; la
      fiche portait 2,5 % pour tous. Salaire de référence : dix meilleures
      années, faute d'extension lue de R. 351-29 avant le décret n°
      2017-1000 ; le rapport au Président de la République sur
      l'ordonnance n° 2015-896 dit pourtant que le calcul portait jusque-là
      « sur la totalité de la carrière », ce que la fiche ne porte pas.
