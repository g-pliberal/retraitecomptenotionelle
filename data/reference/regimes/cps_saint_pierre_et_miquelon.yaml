  textes:
    - {reference: "loi n° 87-563 du 17 juillet 1987 portant réforme du régime d'assurance vieillesse applicable à Saint-Pierre-et-Miquelon, article 5 (table de durée et âges par génération)", id: LEGIARTI000054477924}
    - {reference: "décret n° 89-110 du 20 février 1989, article 9 (durée transitoire de 108 trimestres en 1987, plus 4 par an)", id: LEGIARTI000006774247}
    - {reference: "décret n° 2017-1000 du 10 mai 2017 relatif à l'assurance vieillesse-veuvage applicable à Saint-Pierre-et-Miquelon, article 3", id: LEGIARTI000034740766}
  manque: >-
    Taux de cotisation et plafond de la caisse de prévoyance sociale,
    fixés localement et absents de l'index : ceux du régime général
    tiennent lieu. Le régime d'avant août 1987 (ordonnance n° 77-1102)
    n'est pas porté. Le revenu annuel moyen n'est pas celui du droit :
    toute la carrière avant le 1er juillet 2016, puis quarante à vingt-huit
    années pour les nés avant 1962 (loi n° 87-563, art. 5, 3°, d), quand
    la fiche en retient dix, puis vingt-cinq ; la surcote de 1,25 % par
    trimestre accompli depuis le 1er juillet 2016 (décret n° 2017-1000)
    n'est pas portée.
