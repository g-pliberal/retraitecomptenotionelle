      `legislation/ages_regimes.csv`). La fiche portait, année par
      année, la durée et l'âge de la génération qui atteint l'ouverture
      cette année-là, faux pour toutes les autres : 158 trimestres à une
      Saint-Pierraise née en 1956 partie en 2020, dont le droit en
      demande 152. Ces règles valent pour les pensions prenant effet à
      compter du 1er juillet 2016 (ordonnance, art. 4, 3°) : la période
