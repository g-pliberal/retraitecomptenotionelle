code: cavom_complementaire
rang: 450
nom: >-
  Régime complémentaire de la Caisse d'assurance vieillesse des officiers
  ministériels, des officiers publics et des compagnies judiciaires (CAVOM)
famille: liberal
source_id: cavom_guide
fiabilite: moyenne
creation: 1979
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Commissaires de justice — huissiers et commissaires-priseurs judiciaires
  réunis depuis 2022 —, greffiers des tribunaux de commerce, administrateurs
  et mandataires judiciaires, avocats au Conseil d'État et à la Cour de
  cassation. Une des plus petites sections de la CNAVPL, et la seule dont
  les affiliés salariés cotisent au même régime que les libéraux, à un taux
  moindre et pour 60 % à la charge de l'employeur.
hors_repartition: false
