    decote_annulee_par_la_duree: false
    abattement_points: cavom
    surcote_par_trimestre: null
    avantages_non_contributifs: [reversion]
    notes: >-
      LA RÉFORME DE 2016 REND LE RÉGIME PROPORTIONNEL : 12,50 % du revenu
      non salarié (décret n° 79-265, article 2 dans la rédaction du décret
      n° 2015-1875, LEGIARTI000031875318). LE PLAFOND MONTE PAR MARCHES :
      « par dérogation », la cotisation est appelée « dans la limite d'un
      plafond égal à » quatre plafonds de la Sécurité sociale en 2016,
      cinq en 2017, six en 2018, sept en 2019 (article 1er, II, du même
      décret), huit ensuite. L'ASSIETTE A UN MINIMUM, « le quart de ce
      plafond » jusqu'en 2018, 19 % depuis le 1er janvier 2019 (décret
      n° 2019-373, LEGIARTI000038427708) : la cotisation y est due, et les
      points qu'elle achète sont acquis. La fiche portait huit plafonds dès
      2016 et aucun minimum.
      L'ARITHMÉTIQUE SE REFERME SUR ELLE-MÊME. Le guide 2026 imprime, en
      regard du plafond, « 871,62 points » : huit plafonds à 12,5 % font
      48 060 €, que 55,1390 € achètent 871,62 fois. Et « 20,70 points »
      pour le minimum, soit 9 131 € à 12,5 %, divisés par le même prix.
      LE RENDEMENT EST PUBLIÉ ET IL SE VÉRIFIE : la valeur de service de
      2026, 3,3745 €, divisée par la valeur d'achat, 55,1390 €, donne les
      6,12 % que le guide écrit et que `rendements_points.csv` porte pour
      toute la période. La valeur d'achat de 2025, 54,4317 €, est au
      Journal officiel (décret n° 2025-1076, article 12) ; celle de 2026
      n'y figure pas — le même décret ne fixe pour 2026 que les paramètres
      de trois sections — et se lit dans le tableau des paramètres de la
      caisse.
      « LA LIQUIDATION DU RÉGIME COMPLÉMENTAIRE EST OPÉRÉE UNIQUEMENT EN
      FONCTION DE L'ÂGE » : ni durée requise, ni carrière longue. Les âges
      sont ceux du règlement (article 1er, I, 1° et 2°, approuvé par
      l'arrêté du 10 juillet 2026, et déjà dans les statuts depuis l'arrêté
      du 12 décembre 2024) : 60 et 65 ans avant la génération 1956, six
      mois de plus par génération jusqu'à 62 et 67 ans en 1959, puis
      l'ouverture portée à 64 ans de la génération 1965 à celle de 1968 ;
      `legislation/ages_regimes.csv` les porte, et la suspension de 2026
      n'y touche pas. La fiche lisait les tables du régime général, qui
      retardaient de deux ans l'ouverture des générations anciennes et leur
      opposaient 67 ans au lieu de 65.
      LA MINORATION EST DE 5 % PAR ANNÉE MANQUANTE, et elle ne se
      fractionne pas (3° du même I) : `abattement_points: cavom`. La fiche
      lui opposait la décote du régime de base, que la durée annule — un
      officier ministériel parti à 64 ans avec sa durée ne perdait rien, là
      où le règlement lui retire 15 %. « En cas de prolongation de
      l'activité au-delà de l'âge du taux plein, aucune surcote n'est
      applicable », et aucune majoration pour enfants n'est écrite.
      LES SALARIÉS DU RÉGIME NE SONT PAS PORTÉS : ils cotisent à 7,50 %,
      dont 60 % à la charge de l'employeur, et le statut qui route vers
      cette fiche est celui d'un libéral. LA COTISATION FACULTATIVE de 20 %,
      qui porte la réversion à 100 %, ne l'est pas non plus : le modèle ne
      prête à personne une option.
