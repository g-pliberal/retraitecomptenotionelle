    decote_par_trimestre: 0.0125
    decote_annulee_par_la_duree: false
    abattement_points: cavom
    surcote_par_trimestre: null
    avantages_non_contributifs: [reversion]
    notes: >-
      QUARANTE ANS QUE LA FICHE NE PORTAIT PAS. Le régime naît du décret
      n° 79-265 du 27 mars 1979 et fonctionne par CLASSES jusqu'en 2015 :
      article 2, version de 1980 (LEGIARTI000006770098) — classe spéciale
      2 points, classes A à E de 4 à 28 points, aux montants de 2 à 14
      fois la classe spéciale ; version de 1987 (LEGIARTI000006770099) —
      classe spéciale, B à F de 8 à 40 points, 4 à 20 fois ; version de
      2013 (LEGIARTI000026892955) — 18, 72, 126, 180, 252 et 360 points,
      mêmes multiples. La classe dépend du revenu selon des bornes fixées
      par les statuts, HORS INDEX, et le montant de la classe spéciale par
      décret annuel : ni l'un ni l'autre ne permet de reconstituer la
      cotisation. La réforme du 1er janvier 2016 (décret n° 2015-1875 du
      30 décembre 2015, article 1er) a converti le régime en cotisation
      proportionnelle de 12,5 % dans la limite de huit plafonds, que le
      même décret fait monter de 4 à 7 PASS de 2016 à 2019 ; ce taux est
      projeté en arrière sur 1979-2015 comme équivalent moyen des classes,
      au niveau `estimee`, plutôt que de laisser l'officier ministériel
      sans complémentaire pendant trente-sept ans.
      LES ÂGES ET LA MINORATION SONT CEUX QUE LE RÈGLEMENT ÉCRIT, et ils
      valent ici comme après 2016 (`age_table: cavom`, `abattement_points:
      cavom`) : la table des statuts de 2024 porte en toutes lettres les
      générations nées avant 1956 — soixante ans, taux plein à soixante-
      cinq —, qui ont toutes liquidé avant elle. Les versions antérieures
      des statuts ne sont pas dans l'index ; la minoration de 5 % par année
      d'anticipation y est supposée la même.
