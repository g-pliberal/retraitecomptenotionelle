    avantages_non_contributifs: [reversion]
    notes: >-
      SOURCE : fiche « La sécurité sociale des salariés en Nouvelle-
      Calédonie » et fiche de cotisations 2026 du CLEISS, page « Le
      montant de ma retraite » de la CAFAT (cafat.nc), lues par
      scripts/fetch/sites_institutionnels.py ; délibérations du congrès,
      hors JORF. COTISATION 2026 : « retraite : 9,80 % [employeur], 4,20 %
      [salarié], 14,00 % » jusqu'à 548 600 FCFP par mois (4 597 €, 1,17
      plafond national — la fiche prend le plafond national). POINTS : «
      les cotisations que vous avez versées ont été divisées chaque année
      par une valeur de référence dont le montant est fixé par le conseil
      d'administration », « la valeur du point retraite est de 256,09
      F.cfp du 01/04/2026 au 31/03/2027 » ; la valeur de référence n'est
      publiée nulle part de lisible : le rendement de
      `rendements_points.csv` (10 centimes par euro) est celui
      qu'impliquent 14 % de cotisation et une pension de moitié du salaire
      pour trente-sept ans, niveau `estimee`. AVANT 2023 : 60 ans et 35
      années d'activité, « 1,5 % de réduction par trimestre d'anticipation
      manquant », dans la limite de dix trimestres.
