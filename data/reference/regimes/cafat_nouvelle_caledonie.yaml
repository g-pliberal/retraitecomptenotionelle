  manque: >-
    Le rendement est celui que la caisse fixe chaque année, de 12,45 % en
    2001 à 10,35 % de 2008 à 2015, puis 9 % en 2026 (2 845,44 FCFP de
    valeur de référence pour un point de 256,09) ; avant 2001 rien n'est
    publié, et la valeur de 2001 est prolongée ; le moteur le sert, à
    l'année de la liquidation, aux cotisations revalorisées sur les prix,
    quand la caisse achète les points à la valeur de référence de chaque
    année. Le taux d'avant avril 2009, non lu, que deux avis du conseil
    économique et social font de 13 % (calcul du dépôt), n'est pas
    porté ; l'anticipation de dix trimestres, avec
    1,5 % d'abattement par trimestre ou sans abattement à 37 années, n'est
    pas portée (délibération n° 458, articles 2 à 4) ; taux de 2026
    projeté sur toute la période ; plafond de 548 600 FCFP remplacé
    par le plafond national. Le statut `salarie_nouvelle_caledonie` route
    aussi l'Agirc-Arrco du non-cadre, obligatoire depuis le 1er janvier
    1995 ; les années d'avant, depuis 1958, en sont des services passés,
    validés sans cotisation à une pension prise depuis 1995 et absents du
    compte notionnel, sur les barèmes de métropole faute de ceux de la
    généralisation (fiche `services_passes_outre_mer`). Le chômage, que la
    CAFAT indemnise, ne vaut aucun point complémentaire ; il cotise à la
    CAFAT et y vaut des points (loi du pays n° 2001-016, Lp. 100-7), que le
    modèle ne porte pas.
