      hors JORF. COTISATION 2026 : « retraite : 9,80 % [employeur], 4,20 %
      [salarié], 14,00 % » jusqu'à 548 600 FCFP par mois (4 597 €, 1,17
      plafond national — la fiche prend le plafond national). POINTS : «
      les cotisations que vous avez versées ont été divisées chaque année
      par une valeur de référence dont le montant est fixé par le conseil
      d'administration », « la valeur du point retraite est de 256,09
      F.cfp du 01/04/2026 au 31/03/2027 » ; le rendement de
      `rendements_points.csv` est celui que le conseil d'administration
      fixe chaque année, « le rapport entre la valeur de service et la
      valeur de référence » (Chambre territoriale des comptes de
      Nouvelle-Calédonie, 2022, p. 62), de 10,35 % en 2015 à 9,00 % en
      2026, et 12,45 % en 2001 (conseil économique et social, avis
      n° 12/2008) ; le moteur sert celui de l'année de la liquidation
      aux cotisations revalorisées sur les prix. AVANT 2023 : 60 ans et 35
      années d'activité, « 1,5 % de réduction par trimestre d'anticipation
      manquant », dans la limite de dix trimestres.
