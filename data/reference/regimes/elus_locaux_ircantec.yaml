  manque: >-
    Le statut `elu_local` route l'Ircantec depuis 1973 et, depuis 2013, le
    régime général au-dessus de la moitié du plafond, le seuil de L.
    382-31 étant lu année par année sur l'indemnité. Non portés : l'élu
    qui a cessé toute activité professionnelle, assujetti même sous le
    seuil ; les régimes de retraite par rente (FONPEL, CAREL),
    facultatifs.
