  manque: >-
    Le statut `elu_local` route l'Ircantec depuis 1973 et, depuis 2013, le
    régime général au-dessus de la moitié du plafond, le seuil de L.
    382-31 étant lu année par année sur l'indemnité. La fiche
    `elus_locaux_affiliation` dit le droit, version par version, et
    chiffre ce que le statut n'en porte pas : le mandat, que la loi
    n'affilie avant le 30 mars 1992 que pour les maires, adjoints, maires
    délégués et présidents et vice-présidents de communauté urbaine ;
    l'élu qui a cessé son activité professionnelle pour son mandat,
    affilié au régime général de 1992 à 2012 dans les mandats que
    nomment les lois de 1992, 1999, 2000 et 2002, et assujetti sous le
    seuil depuis 2013 ; l'année d'avant 1973, sans régime, et l'année
    d'Ircantec seule, que le modèle compte dans la durée d'assurance quand
    le droit n'y compte que les trimestres d'un régime de base ;
    l'assujettissement sur demande, depuis le 1er septembre 2023, pour une
    pension qui prend effet depuis. Hors du champ : les retraites par
    rente (FONPEL, CAREL), facultatives (CGCT, L. 2123-27), et le
    versement pour la retraite des périodes de mandat (CSS, L.
    351-14-1), qui relève des rachats.
