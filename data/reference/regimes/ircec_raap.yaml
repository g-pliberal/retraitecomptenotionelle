    notes: >-
      LA CLASSE SPÉCIALE, SIX POINTS PAR AN. De 1981 à 2015, « le régime
      comporte cinq classes de cotisation ainsi définies : Classe
      spéciale : portant attribution annuelle de 6 points de retraite ;
      Classe A : […] 12 points ; Classe B : […] 24 points ; Classe C : […]
      36 points ; Classe D : […] 48 points » (décret n° 62-420, article 2,
      LEGIARTI000006781619). La classe se CHOISISSAIT — « un système
      optionnel », écrit l'IRCEC dans son communiqué du 27 janvier 2016,
      « déconnecté des revenus artistiques perçus » —, et c'est ce qui
      avait tenu la fiche au taux proportionnel de 8 %, qu'aucun texte ne
      porte. Mais le même article dit ce que devient qui ne choisit pas :
      « A défaut d'option, les personnes mentionnées à l'article 1er […]
      sont inscrites d'office en classe spéciale » (rédaction de 2004,
      LEGIARTI000018123994 ; en 1981, pour les artistes graphiques et
      plastiques). Le modèle ne prête jamais un choix qu'il ne connaît
      pas — c'est la règle des classes de la CNBF et des minima sous
      condition de demande —, et la caisse écrit que « 80 % des adhérents
      cotisent sur la base » la plus basse : la période sert la classe
      d'office. Six points par an (`points_maximum`, l'assiette n'étant
      qu'un repère), valorisés à la valeur de service de la fiche ; au
      compte notionnel, le montant de la classe que fixe le décret de
      l'exercice (`cotisation_par_classes`, `classes_cotisation.csv`) —
      876 F en 1984, 1 500 F en 2000, 409 € en 2012, 448 € en 2015.
      CE QUI RESTE APPROCHÉ. De 1981 à mai 2004, « les assujettis
      mentionnés au b » de l'article 1er — que l'index ne reproduit pas ;
      sans doute les professeurs de musique, musiciens, auteurs et
      compositeurs — étaient inscrits d'office en classe A, douze points
      pour le double : la fiche leur sert la classe spéciale. Les montants
      de 1981 à 1983, antérieurs au premier décret lu, et celui de 1989,
      dont l'index n'a que le sommaire, sont reportés de la grille voisine
      au rapport des plafonds. Et la période AVANT 2004 couvre des statuts
      que le décret ne couvrait pas encore : il ne vise « les personnes
      relevant de l'article L. 382-12 », tous les artistes-auteurs, que
      depuis le 29 mai 2004 (LEGIARTI000006781618).
      LIQUIDATION : celle de la période précédente.
