    notes: >-
      LIQUIDATIONS ANTÉRIEURES À 2014 : le règlement servait alors le
      taux plein à soixante-cinq ans, et ses coefficients d'anticipation,
      que l'arrêté du 21 novembre 2013 a remplacés, ne sont pas reproduits
      au Journal officiel. La période garde la décote du régime de base,
      faute d'eux.
      COTISATION AVANT 1981 : le décret n° 62-420 dans sa rédaction
      d'origine n'est pas dans l'index LEGI, et rien n'y dit comment le
      régime appelait ses cotisations avant les cinq classes de 1981. La
      période garde le taux proportionnel de 8 %, qui SURESTIME : la
      caisse écrit que « jusqu'à présent, 80 % des adhérents cotisent sur
      la base » la plus basse. Voir la période suivante.
      VALEUR DE SERVICE : 9,75 € en 2026, publiée par la caisse (guide et
      mémo 2026), revalorisée sur les prix vers l'année de liquidation.
      Elle sert les points des classes de 1981 à 2015 ; les cotisations
      proportionnelles passent, elles, par le rendement de
      `rendements_points.csv`.
