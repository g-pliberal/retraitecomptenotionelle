    notes: >-
      MINORATION DE L'IRCEC, et non celle du régime de base : « 2,5 %
      par année pour chacune des deux premières années manquantes ; 5 %
      par année manquante supplémentaire », ou la décote du régime de
      base si elle est plus favorable (règlement, art. 27 b, dans la
      rédaction de l'arrêté du 21 novembre 2013, en vigueur au 1er
      janvier 2014) ; taux plein dès l'âge légal si la pension du régime
      de base l'est.
      Une année entamée compte entière : l'annexe de l'arrêté du 21
      novembre 2013 (JORFARTI000028254004) la chiffre trimestre par
      trimestre. Les générations nées avant 1955 avaient jusqu'en 2024
      leurs propres coefficients, que la période ne porte pas (voir
      `docs/limites.md`).
      MAJORATION POUR ENFANTS, du même arrêté : la pension « est majorée
      de 10 % au profit de l'adhérent ayant eu au moins trois enfants », ou
      les ayant élevés neuf ans avant leurs seize ans (article 28). La
      fiche ne la déclarait pas ; elle la porte sur toutes les périodes
      depuis 2014. Le règlement d'avant n'est pas au Journal officiel, et
      la première période n'en porte aucune.
      Cotisation, points et valeur de service : ceux de la période
      précédente, la classe spéciale et ses six points.
