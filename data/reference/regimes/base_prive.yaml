          sociale fixe ses propres taux (60 % employeur, 40 % salarié) et son
          propre plafond, « revalorisé à la même date et du même taux que le
          plafond des cotisations du régime général » (loi n° 87-563, art. 13)
          ; aucun des deux n'est une série du dépôt : la fiche porte le taux
          et le plafond nationaux de l'année, niveau `estimee`. TABLE PROPRE
          PAR GÉNÉRATION (loi n° 87-563, art. 5, c, LEGIARTI000030930361 dès
          le 25 juillet 2015, LEGIARTI000054477924 depuis l'ordonnance n°
          2026-648) : 152 trimestres pour 1956, puis deux par génération
          jusqu'à 166 pour 1963, 167 à 172 de 1965 à 1974 ; ÂGES décalés de
          sept générations sur la table nationale (art. 5, b : « l'année 1969
          est remplacée par l'année 1971 », et D. 161-2-1-9 où « nés en 1952 »
          devient « nés en 1959 », décret n° 2017-1000, art. 3,
          LEGIARTI000034740766). La fiche porte, année par année, la durée et
          l'âge de la génération qui atteint l'ouverture cette année-là.
          Génération 1974 et suivantes : 64 ans, 172 trimestres.

