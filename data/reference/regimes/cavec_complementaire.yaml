code: cavec_complementaire
rang: 440
nom: >-
  Régime complémentaire des experts-comptables et des commissaires aux
  comptes (CAVEC)
famille: liberal
source_id: cavec_guide_annuel
fiabilite: moyenne
creation: 1953
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Experts-comptables et commissaires aux comptes, libéraux comme salariés.
  La caisse gère pour le compte de la CNAVPL le régime de base des
  professions libérales, et pilote en propre ce complémentaire — qui pèse
  l'essentiel de la pension.
