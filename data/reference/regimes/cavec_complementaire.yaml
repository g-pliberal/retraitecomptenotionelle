      grande.
      L'ÂGE SEUL COMMANDE, ET LES STATUTS LE DATENT. Arrêté du 22
      février 2008 (JORFARTI000018197778), article 3.13 : la retraite
      est liquidée « à 65 ans à taux plein ; entre 60 et 65 ans, avec
      application d'un abattement définitif de 1,25 % par trimestre
      manquant » — aucune durée d'assurance n'y entre, et la fiche
      portait 67 ans et 172 trimestres. Article 3.14 : « le compte de
      points de l'assuré qui diffère la liquidation de la retraite au-
      delà du 65e anniversaire est majoré de 1,25 % par trimestre plein
      de prorogation dans la limite de 25 % », soit vingt trimestres.
      Rien n'est lu avant 2008, et la fiche ne sert rien avant.
      LA DURÉE N'Y ANNULE RIEN, ET LE MOTEUR L'IGNORAIT. La note le disait
      depuis la passe des professions juridiques, mais la période laissait
      `decote_annulee_par_la_duree` à sa valeur par défaut : le moteur
      prenait la durée requise de la carrière et un expert-comptable parti
      à 62 ans avec sa durée ne perdait rien, là où l'article 3.13 lui
      retire 15 %. Le drapeau est posé, sur toutes les périodes. Et
      l'ouverture est à 60 ans pour toutes les générations, comme le
      texte l'écrit : elle ne joue que pour qui liquide avant l'âge légal
      — carrière longue, handicap —, et le règlement ne prévoit alors
      aucune dispense, l'abattement court jusqu'à 65 ans.
