      LA MAJORATION REVIENT À 1,25 % par l'arrêté du 4 juillet 2025
      (JORFARTI000051849616, Journal officiel du 6 juillet 2025), qui
      remplace à l'article 13 des statuts « 0,75 » par « 1,25 » et « 15 »
      par « 25 » ; le règlement approuvé par l'arrêté du 10 juillet 2026
      (LEGIARTI000054437585) le reprend, « une majoration de 1,25 % par
      trimestre plein de prorogation au-delà de cet âge, dans la limite
      maximale de 25 % », et le guide 2026 de la caisse l'écrit, « après
      65 ans avec 1,25 % de majoration ». L'arrêté n'a pas de date d'effet
      propre : il vaut le lendemain de sa publication, et les pensions qui
      prennent effet depuis le 7 juillet 2025 reçoivent 1,25 % (`date_effet`
      de la période de 2026 ; fiche `surcote_par_age_seul`).
      TROIS ENFANTS, DEPUIS L'ARRÊTÉ DU 4 JUILLET 2025 (JORFARTI000051849616,
      article 20 des statuts, puis article 1.3.1 du règlement de 2026) :
      « le montant de la première pension personnelle et de la pension de
      réversion […] des assurés ayant eu au moins trois enfants est majoré
      de 10 % ». La caisse l'écrit sur sa page de calcul ; le guide 2026
      de la CNAVPL, édité en mars, dit encore « le régime ne prévoit pas
      de majoration ». L'arrêté n'a pas de date d'effet propre : la
      majoration vaut pour les pensions qui prennent effet depuis le 7
      juillet 2025, lendemain de sa publication (`date_effet` de la période
      de 2026).
