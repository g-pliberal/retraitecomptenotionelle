    decote_annulee_par_la_duree: cavec_minoration_age_seul
    surcote_par_trimestre: null
    notes: >-
      COTISATION PAR CLASSES depuis l'origine : « institué en 1953, ce
      régime fonctionnait selon un système de points avec cotisations
      INDÉPENDANTES DU REVENU », écrit la caisse dans son histoire. Il l'est
      resté, à ceci près que la classe est aujourd'hui déterminée par le
      revenu. Le guide annuel 2026 en donne la grille : neuf classes, de
      898 € jusqu'à 14 919 € de revenus à 30 616 € au-delà de 181 208 €.
      UNE OPTION EXISTE, ET LE MODÈLE NE LA PREND PAS. « Vous pouvez opter
      pour la classe immédiatement supérieure à celle qui correspond à vos
      revenus », écrit le guide. C'est un avantage facultatif, et le dépôt
      ne prête jamais à personne un choix qu'il ne peut pas connaître —
      même règle que pour la classe C1 des avocats.
      LE RENDEMENT SE VÉRIFIE SUR CHAQUE LIGNE. Le guide donne, en regard de
      chaque classe, le nombre de points qu'elle ouvre, et la valeur de
      service 2026 est de 1,3850 €. La classe D cotise 8 282 € pour 498
      points, soit 498 × 1,3850 / 8 282 = 8,33 % — et les neuf classes
      donnent le même à un dix-millième près. C'est ce qui autorise à
      convertir la cotisation par le rendement plutôt que par une table de
      points, et 8,33 % est aussi le chiffre que la caisse annonce.
      LA GRILLE DE CHAQUE EXERCICE EST CELLE DE SON TEXTE depuis le 14
      octobre 2026 (action 131, `classes_cotisation_epoques.yaml`) : les
      classes de l'article 2 dans sa rédaction de l'exercice (six de 48 à
      180 points en 1980, sept jusqu'à 216 en 1987, huit de 48 à 1 500 de
      2008 à 2025), le montant que le décret annuel donne à la classe 4,
      puis A, et les bornes que la caisse publie de 2022 à 2025, les mêmes,
      ramenées aux autres exercices par le rapport des plafonds. Ici le
      plafond est un CHOIX : rien n'y est rond. Les sept classes d'avant
      2008 en prennent les six premières, rang pour rang, et la grille de
      1980, ramenée, tient lieu de celle d'avant, que le décret de 1953
      faisait choisir.
      AUCUNE MAJORATION DE REPORT N'EST LUE AVANT 2008 : la fiche
      portait 1,25 % sur toute la période sans texte, et le moteur ne le
      lisait pas ; le premier état des statuts dans l'index est l'arrêté
      du 22 février 2008.
      L'ÂGE SEUL, ET SOIXANTE-CINQ ANS, AVANT 2008 AUSSI. La règle de 2008
      — taux plein à 65 ans, abattement de 1,25 % par trimestre manquant
      entre 60 et 65 ans, sans condition de durée — est portée en arrière,
      et ce n'est pas qu'une supposition commode : la caisse raconte dans
      son livre des soixante-dix ans qu'en 1983 ses administrateurs
      « choisissent de ne pas abaisser l'âge de départ en retraite à 60 ans
      (comme annoncé pour le régime général […]). Il reste et restera fixé
      à 65 ans. » La fiche lisait jusqu'au 23 septembre 2026 les âges et la
      durée du régime général : 67 ans lus à la génération, et un taux
      plein que la durée ouvrait dès l'âge légal. Le taux de l'abattement
      d'avant 2008, lui, n'est pas connu.
