      maximale de 15 % » — toujours vingt trimestres. L'arrêté, publié au
      Journal officiel du 4 septembre 2018, n'a pas de date d'effet propre :
      il vaut le lendemain, et la période liquide les pensions qui prennent
      effet depuis le 5 septembre 2018 (`date_effet`).
