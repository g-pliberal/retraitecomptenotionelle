    notes: >-
      D. 635-10, état du 24 août 2004 : 3,5 % au premier semestre et 4,5 % au second, soit 4 % sur l'année — la convention du dépôt étant un taux annuel, c'est la moyenne des deux semestres qui est portée.
      LE RÉGIME ACCUMULE DE VRAIS POINTS, lui aussi, depuis que les barèmes
      IPP versent son salaire de référence et sa valeur de service de 2004 à
      2012. Son rendement y est stable à 7,20 %, là où le repli de
      `rendements_points.csv` lui prêtait 6,74 %.
      À LA FUSION DE 2013 ses points sont repris UN POUR UN : le point du
      RCI est celui du commerçant — c'est lui qui sert de dénominateur au
      coefficient appliqué aux artisans.
