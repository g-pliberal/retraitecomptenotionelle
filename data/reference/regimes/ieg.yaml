    avantages_non_contributifs: [bonifications, categorie_active, majoration_enfants, reversion]
    notes: >-
      L'ÂGE DES SERVICES ACTIFS SUIT LE CALENDRIER DE L'ARTICLE 45, ET NON
      LE SEUL ARTICLE 16. Le décret n° 2023-692 du 28 juillet 2023 réécrit
      l'article 16 de l'annexe 3 — l'âge des actifs devient « l'âge
      mentionné à l'article L. 161-17-2 du code de la sécurité sociale […]
      abaissé de cinq ans » —, mais le 2° du V de l'article 45, dans sa
      version en vigueur (LEGIARTI000052046924, lue le 23 septembre 2026),
      ne l'applique qu'« aux agents nés à compter du 1er janvier 1975 » et
      l'abaisse pour les autres : cinquante-cinq ans avant 1962, quatre
      mois de plus par génération jusqu'à cinquante-sept ans pour 1967,
      trois mois de plus ensuite jusqu'à cinquante-huit ans et neuf mois
      pour 1974. La fiche portait cinquante-huit ans et neuf mois dès 2025
      et cinquante-neuf ans dès 2027, lus dans l'article 16 seul : jusqu'à
      six trimestres trop tard pour les générations 1968 à 1974. Elle le
      lit désormais PAR GÉNÉRATION (`age_table: ieg_actif_2023`), pour
      tous les agents, et non pour la seule génération qui l'atteint
      l'année de la liquidation. LA SUSPENSION DE 2026 N'Y CHANGE RIEN :
      pour les nés à compter de 1975, L. 161-17-2 donne soixante-quatre
      ans dans sa rédaction suspendue comme dans la précédente, et le
      calendrier des générations antérieures est écrit dans l'annexe, que
      l'article 105 de la loi du 30 décembre 2025 ne touche pas. LA
      SURCOTE ne se compte qu'au-delà de l'âge du 1° du I de l'article 16
      (II de l'article 10), dont le 1° du V de l'article 45 écrit le même
      calendrier que la SNCF et la RATP, soixante ans avant 1957,
      soixante-quatre ans à compter de 1970
      (`age_surcote_regimes_speciaux`). La durée requise est celle du I
      bis de l'article 45, une table par durée de services actifs ; l'âge
      d'ouverture de la fiche, l'âge légal abaissé de cinq ans, est celui
      des dix-sept ans, et la fiche lit leur table (`duree_requise_table:
      ieg_actif_17`) : 170 trimestres pour les nés de 1968 à 1970, 171
      pour 1971-1972, 172 à compter de 1973, et en deçà la table d'avant
      le décret n° 2023-692 — 169 pour 1964-1966, 170 pour 1967. Elle
      portait la table commune, suspension de 2026 comprise, que l'annexe
      n'a pas reprise. Le régime est fermé aux agents recrutés à compter
      du 1er septembre 2023 (annexe 3, art. 1er), ce que le routage porte.
      L'ÂGE DE RÉFÉRENCE EST L'ÂGE MINIMUM MAJORÉ DE TROIS ANS, ET NON DE
      CINQ, DEPUIS LE 1er JANVIER 2025. Le I de l'article 10 de l'annexe
      3, dans sa version en vigueur (LEGIARTI000052046924, lue le 22
      septembre 2026), compte les trimestres de minoration jusqu'à « un
      âge de référence correspondant à l'âge minimum d'ouverture du droit
      à pension applicable à l'assuré majoré de trois ans ou, lorsque
      celui-ci relève du 7° de l'article 16, de cinq ans » ; et son
      article 45 fixe, « pour les pensions prenant effet à compter du 1er
      janvier 2025 », l'âge d'annulation à soixante-deux ans pour les
      agents du 2° du I de l'article 16 nés avant le 1er janvier 1975. La
      fiche portait l'âge d'ouverture majoré de CINQ ans — 63,75 puis 64
      ans —, règle d'avant la réforme de 2023 : elle décotait un agent
      liquidant à soixante-deux ans de sept trimestres de trop, soit 8,75
      % de pension. La CNIEG l'écrit de son côté en toutes lettres : « à
      compter du 1er janvier 2025 […] âge minimum + 3 ans (sauf
      exceptions) », « de façon à maintenir un âge d'annulation de la
      décote au plus tard à 67 ans ».
      QUI A OUVERT SON DROIT AVANT LE 1er JANVIER 2025 GARDE L'ÂGE D'AVANT :
      la CNIEG maintient « les paramètres en vigueur avant la réforme,
      quelle que soit la date d'effet de la retraite IEG (cf art. 45 - I ter
      de l'annexe III) » (circulaire n° 2024/15, § 3), c'est-à-dire l'âge
      minimum majoré de cinq ans, dont se retranche la diminution de l'année
      ; la période le lit dans celle de 2017 à 2024
      (`age_taux_plein_a_l_ouverture`). Un agent né en janvier 1965, dont le
      droit s'ouvre en mai 2021, parti à soixante ans en janvier 2025,
      perdait quatre trimestres de décote au lieu de deux.
      LA DURÉE REQUISE SE LIT À LA DATE OÙ
      L'AGENT RÉUNIT LES CONDITIONS, pour les retraités comme pour les
      actifs. La réforme de 2008 la fait monter de 151 à 166 trimestres
      selon cette date, de juillet 2008 à juillet 2018
      (`duree_requise_calendrier: regimes_speciaux_2008`) ; la table par
      génération de 2014 ne vaut qu'à compter du 1er juillet 2019, et
      celle de 2023 qu'à compter du 1er janvier 2025, les décrets gardant
      « les règles applicables avant » à qui a réuni les conditions plus
      tôt (`duree_requise_table`, essayées dans l'ordre). La fiche
      opposait à tous la table commune par génération : 167 trimestres à
      un agent né en 1960 parti en 2010, dont le droit en demande 154.
      L'AGENT QUI RÉUNIT LES CONDITIONS AVANT SOIXANTE ANS DOIT, S'IL LES A
      RÉUNIES DE 2017 À 2024, LA DURÉE DE LA GÉNÉRATION QUI ATTEINT CET ÂGE
      CE MOIS-LÀ : l'article 9-1 de l'annexe 3 lui oppose « celle exigée des
      agents atteignant l'âge de soixante ans l'année à compter de laquelle
      la liquidation peut intervenir », et la CNIEG la lit à la date
      d'ouverture au plus tôt du droit (circulaire n° 2024/15, § 3.1). La
      table de 2014 se lit donc pour lui à cette génération
      (`age_de_lecture`) : 167 trimestres, et non 169, à l'agent actif né en
      décembre 1964 dont le droit s'ouvre en décembre 2020.
