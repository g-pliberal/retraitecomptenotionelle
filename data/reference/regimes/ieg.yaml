    notes: >-
      LE RELÈVEMENT DE 2017 EST ÉTALÉ PAR GÉNÉRATION, quatre mois par
      année de naissance : l'annexe 3 du statut national, dans sa version
      du 21 mars 2011 (LEGIARTI000023733902, décret n° 2011-290) fixe
      l'âge d'ouverture de la catégorie services actifs (cinquante-sept
      ans) à cinquante-cinq ans pour les agents nés avant 1962, puis
      quatre mois de plus par année de naissance jusqu'à cinquante-sept
      ans pour les agents nés à compter de 1967 ; soixante à soixante-deux
      ans, générations 1957 à 1962, pour les services sédentaires. La
      fiche le lit PAR GÉNÉRATION (`age_table`) : chaque agent a l'âge de
      sa génération, quelle que soit l'année où il part, et non celui de
      la seule génération qui l'atteint l'année de la liquidation, comme
      le faisaient ses périodes annuelles. L'âge de référence de la décote
      (`bareme_decote: regimes_speciaux`) suit, cinq ans au-dessus. LA
      DURÉE REQUISE SE LIT À LA DATE OÙ L'AGENT RÉUNIT LES CONDITIONS,
      pour les retraités comme pour les actifs. La réforme de 2008 la fait
      monter de 151 à 166 trimestres selon cette date, de juillet 2008 à
      juillet 2018 (`duree_requise_calendrier: regimes_speciaux_2008`) ;
      la table par génération de 2014 ne vaut qu'à compter du 1er juillet
      2019, et celle de 2023 qu'à compter du 1er janvier 2025, les décrets
      gardant « les règles applicables avant » à qui a réuni les
      conditions plus tôt (`duree_requise_table`, essayées dans l'ordre).
      La fiche opposait à tous la table commune par génération : 167
      trimestres à un agent né en 1960 parti en 2010, dont le droit en
      demande 154.
      L'AGENT QUI RÉUNIT LES CONDITIONS AVANT SOIXANTE ANS DOIT, DE 2017 À
      2024, LA DURÉE DE LA GÉNÉRATION QUI ATTEINT CET ÂGE CE MOIS-LÀ :
      l'article 9-1 de l'annexe 3 lui oppose « celle exigée des agents
      atteignant l'âge de soixante ans l'année à compter de laquelle la
      liquidation peut intervenir », et la CNIEG la lit à la date
      d'ouverture au plus tôt du droit (circulaire n° 2024/15, § 3.1). La
      table de 2014 se lit donc pour lui à cette génération
      (`age_de_lecture`) : 167 trimestres, et non 169, à l'agent actif né en
      décembre 1964 dont le droit s'ouvre en décembre 2020.

