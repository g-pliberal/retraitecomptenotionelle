code: organic_conjoints_batiment
rang: 560
nom: >-
  Régime complémentaire obligatoire des conjoints des industriels et commerçants (Organic)
famille: non_salarie
etage: complementaire
source_id: legifrance_textes
fiabilite: moyenne
creation: 1973
fermeture: 2003
extinction: 2004
succede_a: []
integre_dans: nric
population: >-
  Industriels et commerçants affiliés à l'Organic, de 1973 à 2003 : une
  cotisation additionnelle, sur deux tranches jusqu'au plafond, qui
  finance une pension servie à leur conjoint coexistant ou survivant.
  Reprise par le NRIC en 2004, puis par le RCI.
hors_repartition: false
inventaire:
  section: non_salaries
  rang: 60
  nom: Régimes complémentaires des conjoints de commerçants et des entrepreneurs du bâtiment (Organic)
  population: Conjoints des industriels et commerçants ; entrepreneurs du bâtiment et des travaux publics
  couverture: partiel
  statuts: [commercant, gerant_debit_tabac, micro_entrepreneur]
  textes:
    - {reference: "code de la sécurité sociale, D. 635-32 (institution du régime en faveur des conjoints) et D. 635-34 (objet : maintenir au conjoint les avantages d'avant 1973)", id: LEGIARTI000006738054}
    - {reference: "code de la sécurité sociale, D. 635-35 (cotisation additionnelle à la charge de tous les assujettis du régime de base)", id: LEGIARTI000006738057}
    - {reference: "code de la sécurité sociale, D. 635-36 : 0,50 % et 1,82 % (1985-1997), 1,5 % et 3,5 % (1998), 2,5 % et 3,95 % (1999-2003)", id: LEGIARTI000006738097}
    - {reference: "décret n° 50-60 du 11 janvier 1950 (régime complémentaire des entrepreneurs du bâtiment), fermé et sans cotisation depuis le 25 mars 1998", id: LEGIARTI000006781229}
    - {reference: "arrêté du 9 février 2012 portant approbation du règlement du RCI, reprise des points de l'ancien régime des conjoints", id: LEGIARTI000025397326}
  manque: >-
    La fiche porte la cotisation du commerçant, qui entre au compte
    notionnel, et rien dans le scénario actuel : la pension va au
    conjoint, droit dérivé que la carrière individuelle ne porte pas. Le
    volet bâtiment n'a aucun chiffre dans LEGI (articles 2 à 5 du décret
    n° 50-60 abrogés, point fixé par la caisse) et n'est pas porté ; les
    taux d'avant 1985 sont projetés.
periodes:
  - debut: 1973
    fin: 1984
    type_calcul: points
    age_ouverture: 62
    age_ouverture_par_generation: age_legal_par_generation
    age_taux_plein: 67
    age_taux_plein_par_generation: age_annulation_decote
    duree_requise_trimestres: 172
    duree_requise_par_generation: duree_requise_par_generation
    taux_plein: 1.0
    salaire_reference: carriere_entiere
    assiette: plafonnee_033_pass
    taux_cotisation_retraite: 0.0050
    decote_par_trimestre: null
    surcote_par_trimestre: null
    avantages_non_contributifs: [reversion]
    notes: >-
      UNE COTISATION SANS DROIT PROPRE. Le régime complémentaire
      obligatoire « en faveur des conjoints coexistants et survivants des
      travailleurs non salariés des professions industrielles et
      commerciales » (D. 635-32, LEGIARTI000006738054) est « financé par
      une cotisation additionnelle à la cotisation du régime de base, à la
      charge des assujettis dudit régime de base » (D. 635-35,
      LEGIARTI000006738057) — tous les commerçants, les célibataires,
      veufs et divorcés pouvant en être exonérés sur demande —, et ses
      prestations ont « pour objet de maintenir en faveur du conjoint […]
      les avantages qui résultaient des dispositions […] en vigueur »
      avant 1973 (D. 635-34, LEGIARTI000006738056) : un droit DU CONJOINT,
      que la carrière individuelle du modèle ne porte pas. Comme la
      cotisation déplafonnée du régime général, elle entre au compte
      notionnel — l'assuré l'a versée — et n'ouvre rien dans le scénario 1
      : `rendements_points.csv` porte un rendement nul, le moteur sert
      zéro. Le régime des entrepreneurs du bâtiment (décret n° 50-60),
      fermé le 25 mars 1998 (LEGIARTI000006781229), n'a que des articles
      vides dans LEGI : non porté. TRANCHE JUSQU'AU TIERS DU PLAFOND.
      AVANT 1985 : la codification de 1985 reprend un régime né avec la
      loi du 3 janvier 1970 pour les « périodes d'assurance […]
      postérieures au 31 décembre 1972 » (D. 635-34) ; le taux de 1985 est
      projeté en arrière, niveau `estimee`.
