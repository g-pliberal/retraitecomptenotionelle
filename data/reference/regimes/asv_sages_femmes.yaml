code: asv_sages_femmes
rang: 533
nom: >-
  Prestations complémentaires de vieillesse des sages-femmes conventionnées
  (PCV, ex-ASV)
famille: liberal
etage: additionnel
source_id: legifrance_textes
fiabilite: estimee
creation: 1984
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Sages-femmes libérales conventionnées, affiliées à la CARCDSF depuis 2009
  (à la CARSAF avant). Facultatif depuis le décret n° 62-793 du 13 juillet
  1962, obligatoire depuis le 1er janvier 1984 (décret n° 84-254), réformé
  par le décret n° 2011-2002 du 28 décembre 2011 : un forfait, sans
  ajustement sur le revenu, qui ouvre dix-huit points par an, dont
  l'assurance maladie paie les deux tiers ; la fiche porte la part de la
  sage-femme, et `part_assurance_maladie_forfait` celle des caisses, que
  le compte notionnel reçoit comme une part patronale. ÂGES : le taux plein
  à 67 ans, ou à l'âge légal avec la durée ; avant, une minoration de 1,25 %
  par trimestre « dans la limite de douze trimestres » ; 10 % de plus pour
  trois enfants (guide de l'assurance vieillesse des professions libérales,
  CNAVPL, 2025, p. 90-91). La fiche suit, pour les âges, celle des
  chirurgiens-dentistes, et les présume à toutes les années. Le règlement
  de la section approuvé par l'arrêté du 10 juillet 2026 n'est pas lu.
