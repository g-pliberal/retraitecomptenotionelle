  section: non_salaries
  rang: 215
  nom: Prestations complémentaires de vieillesse des sages-femmes conventionnées (PCV, ex-ASV)
  population: Sages-femmes conventionnées
  couverture: partiel
  statuts: [sage_femme]
  textes:
    - {reference: "décret n° 84-254 du 5 avril 1984 rendant obligatoire le régime de prestations supplémentaires de vieillesse des sages-femmes conventionnées, article 3 (dix-huit points par année de cotisations)", id: LEGIARTI000025077318}
    - {reference: "décret n° 2011-2002 du 28 décembre 2011, articles 1er et 2 (forfait, valeur de service)", id: LEGIARTI000052567982}
  manque: >-
    Le forfait d'avant 2008, une fois et demie le forfait d'accouchement
    simple (D. 645-2), que le dépôt ne chiffre pas : la fiche présume les
    229 € de 2008 projetés en arrière sur les prix. Les forfaits fixes en
    euros, projetés sur les prix entre deux textes. La valeur de service,
    6,10 € en 2025, ramenée aux autres années par les prix, quand le décret
    la fige en euros pour les points liquidés depuis 2012. Le rachat des
    années de 1946 à 1983, six points l'année. Le partage avec l'assurance
    maladie, lu pour 2025, est présumé à toutes les années.
