      d'accouchement simple » (D. 645-2, 3°, LEGIARTI000006738372, 1,08
      fois en 1985), que le dépôt ne chiffre pas : la fiche présume les
      229 € de 2008, projetés en arrière sur les prix. Les caisses en
      paient le double (D. 645-3 de 1985 à 2004). Niveau `estimee`.
