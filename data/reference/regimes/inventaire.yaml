      - {reference: "décret n° 2004-461 du 27 mai 2004, article 13 VIII (les affiliés de la CREA soumis, au 1er janvier 2004, à la Cipav)", id: LEGIARTI000006781338}
    raison_hors_champ: >-
      Section de la CNAVPL dès l'organisation de 1949 (professeurs de
      musique et musiciens, artistes hors L. 631-1), nommée CREA en 1977 et
      fondue dans la Cipav au 1er janvier 2004, qui a repris ses affiliés et
      leurs points ; le statut `profession_liberale` route vers la Cipav sur
      toute la période, et le barème propre de la CREA n'est pas au Journal
      officiel, qui n'a que l'arrêté de 1952 sur ses taux et les arrêtés
      d'approbation de ses statuts.

