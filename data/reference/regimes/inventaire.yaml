# Inventaire des régimes de retraite obligatoires français
# ==========================================================
# Le catalogue (`*.yaml` de ce dossier) ne contient que les régimes que le
# modèle CALCULE. Ce fichier-ci les énumère TOUS — ceux qui existent, ceux qui
# ont existé, ceux qu'on ne calculera pas — et dit pour chacun où en est le
# dépôt. `docs/limites.md` écrivait que la liste des régimes manquants n'était
# « dérivée d'aucun fichier, et c'est une limite en soi » : ce fichier est ce
# fichier, et `tests/test_donnees.py` le tient aligné sur le catalogue.
#
# Champs :
#   code          code du catalogue si le régime est calculé, sinon un code libre
#   nom, famille  famille : même énumération que `_schema.yaml`
#   population    qui cotise
#   creation, fermeture (aux nouveaux entrants), extinction, succede_a,
#                 integre_dans : mêmes valeurs que la fiche quand elle existe
#   couverture    modelise    : fiche complète sur toute son histoire connue
#                 partiel     : fiche calculée, mais un étage, un barème ou une
#                               période manque — `manque` dit lequel
#                 a_modeliser : aucune fiche — `manque` dit ce qui bloque
#                 routage     : pas un régime, une affiliation portée par un
#                               statut de `legislation/affiliations.yaml` —
#                               `manque` dit ce que le statut ne lit pas
#                 hors_champ  : ne sera pas modélisé — `raison_hors_champ`
#   statuts       statuts de `legislation/affiliations.yaml` qui y routent
#   textes        textes fondateurs ou de référence ; `id` est l'identifiant
#                 DILA (LEGITEXT/LEGIARTI/JORFTEXT) lu dans l'index du dépôt,
#                 `null` si le texte n'y est pas (antérieur à 1947, hors JORF)
#
# Ancrages de la liste : R. 711-1 du code de la sécurité sociale (les régimes
# spéciaux), D. 643-1 (les sections des professions libérales), L. 921-1 et
# L. 921-4 (les complémentaires obligatoires), le programme 195 des lois de
# finances (les régimes fermés que l'État finance). Tout ce qui est marqué
# « à modéliser » l'est par décision, y compris l'outre-mer et les assemblées.

