    manque: >-
      La fiche ne porte que les médecins, et la seule part qu'ils paient :
      les deux tiers versés par les caisses d'assurance maladie sont
      décrits, non comptés. Les points d'ajustement sont pris au plafond de
      neuf par an, atteint dès 68 000 € de revenu. Les chirurgiens-dentistes
      (décret n° 2007-458 : dix points par forfait, ajustement 1,45 %), les
      sages-femmes (2017-1812), les auxiliaires médicaux et les directeurs
      de laboratoire (2007-597) ont chacun leur barème, lu mais non porté ;
      leurs statuts restent sans ASV. Le tarif de la consultation, base du
      forfait de 1985 à 2011, n'est pas une série du dépôt.

