      depuis. La caisse des retraites de l'Algérie, créée par la loi de
      finances du 30 décembre 1903 et organisée par le décret du 16 juillet
      1907, a ses décrets de 1907 à 1937 dans l'index ; ses règles d'après
      1947, décisions de l'assemblée algérienne homologuées par décret, et
      les dahirs marocains et tunisiens n'y sont que par leurs homologations
      et les règles de coordination (services du 1er avril 1938 au 1er
      juillet 1962). Aucun cotisant depuis 1962.

