      - {reference: "code des pensions de retraite des marins, R. 13", id: null}
      - {reference: "code de la sécurité sociale, R. 711-1 4°", id: LEGIARTI000048031379}
      - {reference: "arrêtés annuels portant majoration des salaires forfaitaires des marins, 2008-2026 (grille des vingt catégories)", id: JORFARTI000017964781}
    manque: >-
      La grille des vingt catégories est lue au Journal officiel depuis 2008
      (`salaires_forfaitaires.csv`, arrêtés annuels) et appliquée : le marin
      est rangé chaque année dans la catégorie dont le forfait approche le
      plus son revenu annualisé, convention nommée dans la fiche. Avant 2008,
      les textes de l'index ne portent pas les montants : la grille de 2008
      est ramenée par le salaire moyen, au niveau estimé. Les trois âges
      sont appliqués depuis le 22 septembre 2026 (ancienneté à cinquante ans
      pour vingt-cinq ans de services, proportionnelle à cinquante-cinq,
      spéciale avec l'autre pension ou à soixante ans), comme la levée du
      plafond de vingt-cinq annuités à cinquante-deux ans et demi et la
      bonification dès deux enfants. Manquent : la catégorie MOYENNE des
      trente-six derniers mois (R. 11) et le décompte au semestre (R. 12),
      le taux de 1 % de la petite pêche outre-mer, la pension d'invalidité,
      la cessation anticipée amiante.

