    famille: non_salarie
    source_id: cor_panorama_regimes
    fiabilite: moyenne
    creation: 2006
    fermeture: 2018
    extinction: 2020
    succede_a: [cancava, organic]
    integre_dans: regime_general
    population: Artisans, commerçants et industriels.
    hors_repartition: false
    periodes:
      - debut: 2006
        fin: 2008
        type_calcul: annuites
        age_ouverture: 62
        age_ouverture_par_generation: true
        age_taux_plein: 67
        duree_requise_trimestres: 172
        duree_requise_par_generation: true
        taux_plein: 0.50
        age_taux_plein_par_generation: true
        decote_par_generation: true
        salaire_reference_par_generation: true
        duree_proratisation_par_generation: true
        salaire_reference: 25_meilleures_annees
        assiette: plafonnee
        taux_cotisation_retraite: 0.1665
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: 0.0075
        surcote_bareme: regime_general
        avantages_non_contributifs:
          [minimum_contributif, minimum_vieillesse, majoration_enfants, mda,
           reversion, periodes_assimilees]
        notes: >-
          Fusion CANCAVA + ORGANIC + AMPI. Supprimé au 1er janvier 2018
          (« suppression du RSI »), adossement au régime général achevé en 2020
          sous le nom de Sécurité sociale des indépendants puis intégration
          complète à la CNAV.
          TAUX DE COTISATION : 16,65 %, taux plafonné que transcrit OpenFisca-France
          pour 2006-2008 (`ret_ac/artisans/sous_pss`, identique pour les
          commerçants). La fiche portait 17,75 % — le total plafonnée plus
          déplafonnée de 2017 — sur toute la vie du régime.
      - debut: 2009
        fin: 2013
        type_calcul: annuites
        age_ouverture: 62
        age_ouverture_par_generation: true
        age_taux_plein: 67
        duree_requise_trimestres: 172
        duree_requise_par_generation: true
        taux_plein: 0.50
        age_taux_plein_par_generation: true
        decote_par_generation: true
