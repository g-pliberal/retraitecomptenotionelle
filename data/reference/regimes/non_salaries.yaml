        avantages_non_contributifs: [reversion]
        assiette: plafonnee_5_pass
        taux_cotisation_retraite: 0.03
        borne_basse_euros: 25246
        borne_haute_euros: 153579
        cotisation_forfaitaire_euros: 1400.00
        cotisation_forfaitaire_annee: 2016
        notes: >-
          LA MAJORATION DE REPORT DATE DE 2015 : l'arrêté du 31 juillet 2015
          (JORFARTI000031255547) insère l'article 12 ter — « lorsque la
          liquidation de la retraite est ajournée au-delà de l'âge auquel
          elle aurait pu être liquidée sans abattement, les assurés peuvent
          bénéficier d'une majoration de leur pension. Cette majoration est
          égale à 1,25 % par trimestre civil entier d'ajournement postérieur
          à l'âge du taux plein dans la limite de vingt trimestres » —, que
          le règlement du 10 juillet 2026 (LEGIARTI000054437557, article 5)
          reprend mot pour mot. La fiche portait 0,75 %, le taux du régime
          de BASE, que le moteur ne lisait pas ; elle sert 1,25 % depuis
          l'âge du taux plein lu à la génération, à partir de 2016, première
          année pleine.
          SES ÂGES, DEPUIS L'ARRÊTÉ DU 31 JUILLET 2015 (JORFTEXT000031255542).
          Article 12 quater, repris par l'arrêté du 27 décembre 2023 et par
          l'article 6 du règlement du 10 juillet 2026 : taux plein à 65 ans
          pour les générations 1955 et antérieures, quatre mois de plus par
          génération jusqu'à 67 ans pour 1961, âge minimal de 60 à 62 ans du
          même pas ; au-delà, l'âge de L. 161-17-2 et celui du 1° de L. 351-8
          (table `carpimko_2016`). La fiche lisait 67 ans dès la génération
          1955, l'âge d'annulation du régime général. La durée d'assurance y
          annule bien la minoration — « au profit des assurés remplissant les
          conditions leur permettant de liquider leur pension du régime de
          base sans abattement » —, et celle-ci est de 1,25 % par trimestre
          manquant au régime de base, dans la limite des trimestres qui
          séparent de l'âge du taux plein. SAUF POUR LES GÉNÉRATIONS 1955 ET
          ANTÉRIEURES jusqu'en 2023 : « 4 % par année d'anticipation, plus
          0,25 % par trimestre manquant pour pouvoir liquider la retraite de
          base à taux plein, dans la limite du nombre de trimestres séparant
          l'assuré de ses 65 ans » — non porté ; la fiche leur applique 1,25 %
          par trimestre depuis 65 ans, ce qui les minore moins que la caisse
          quand leur durée est presque complète. Les statuts d'avant 2015 sont
          au Bulletin officiel (arrêté du 20 novembre 1996) et ne sont pas
          lus. Lu le 23 septembre 2026 (action 89).
