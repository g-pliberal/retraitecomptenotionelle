        decote_annulee_par_la_duree: false
        surcote_par_trimestre: null
        avantages_non_contributifs: [minimum_vieillesse, majoration_enfants, reversion]
        notes: >-
          RÉGIME ALIGNÉ, ET LA FICHE NE L'ÉTAIT PAS. Les salariés agricoles
          relèvent depuis l'origine d'un régime dont les règles de calcul sont
          celles du régime général — même durée requise, même salaire de
          référence, mêmes décote et surcote, mêmes minima —, avec une gestion
          distincte confiée à la Mutualité sociale agricole. La fiche le disait
          en note et ne le faisait pas : elle portait UNE SEULE période, de 1930
          à aujourd'hui, avec les paramètres de 2023. Un salarié agricole parti
          en 1980 se voyait donc opposer la durée requise de 2023, et calculer
          sur ses vingt-cinq meilleures années quand le droit n'en retenait que
          dix.
          Les périodes qui suivent sont celles du régime général, reprises une à
          une : 1945, 1972 (loi Boulin), 1983, 1994 (réforme Balladur), 2004,
          2009, 2011, 2023. Le taux de cotisation et sa répartition sont ceux du
          régime général, que la MSA appelle aux mêmes taux.
          LA COTISATION DÉPLAFONNÉE SÉPARÉE, aussi : la fiche additionnait la
          part plafonnée et la part déplafonnée en un seul taux de 17,87 %
          prélevé sous le plafond, ce qui sous-estimait la cotisation d'un
          salarié payé au-dessus et surestimait celle des autres.
          Avant 1945, le salarié agricole relevait des ASSURANCES SOCIALES,
          comme son homologue de l'industrie : c'est l'affiliation qui l'y
          route désormais, et non plus cette fiche.
