        notes: >-
          Loi du 3 juillet 1972 : ALIGNEMENT du régime de base des artisans sur
          le régime général à compter du 1er janvier 1973. Les points acquis
          avant 1973 sont conservés et convertis (« droits en points »).
          L'alignement de l'article L. 634-2 emporte les règles familiales du
          régime général : majoration de durée d'assurance et majoration pour
          trois enfants. La fiche ne les portait pas, et le moteur ne les
          servait donc pas à une artisane.

