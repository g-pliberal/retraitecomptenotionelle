        cotisation_forfaitaire_annee: 2020
        notes: >-
          LES STATUTS DE 2007, PREMIERS LUS. L'arrêté du 1er octobre 2007
          (JORFTEXT000000252172) approuve les statuts du régime complémentaire
          de la caisse des chirurgiens-dentistes et abroge ceux de 1955, que
          l'index ne porte pas, non plus que les modifications publiées au
          Bulletin officiel (1985 à 1997) : la fiche les sert à partir de
          2008, première année pleine, et rien avant. Article 20 : taux plein
          « à partir de 65 ans », et avant « un coefficient de minoration,
          fonction de l'âge » — 25 % au cours de la 61e année, 20 % de la 62e,
          15 %, 10 % puis 5 % de la 65e, c'est-à-dire 5 % par année manquante,
          l'année entamée comptant entière, et la durée d'assurance n'y peut
          rien : `abattement_points: cavom`. La fiche portait 62, 67 et la
          décote du régime de base, que la durée annule. Les adhérentes ayant
          élevé des enfants partent sans minoration « à partir de 64 ans pour
          un enfant » jusqu'à « 60 ans pour cinq enfants ou plus » :
          `taux_plein_anticipe_par_enfant_annees`. Article 23 : « majoré de 10
          % au profit des allocataires ayant eu au moins trois enfants ».
          Aucune majoration pour report. Lu le 23 septembre 2026 (action 89).
