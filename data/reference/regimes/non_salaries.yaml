          Réforme du 21 août 2003 : régime de base unique en points,
          proportionnel au revenu, sur DEUX TRANCHES — d'où deux fiches par
          période, qui se cumulent comme le fait la cotisation elle-même.
          PREMIÈRE TRANCHE avant 2015 : 0 à 0,85 plafond, 450 points au maximum.
          Le régime n'attribue pas un nombre de points proportionnel à la
          cotisation mais un nombre PLAFONNÉ de points par tranche : c'est un
          barème en points, et c'est lui — et non un prix d'achat, que la caisse
          ne publie pas — qui convertit ici le revenu en droits.
          Les taux de 8,23 % et 1,87 % sont ceux que la CNAVPL publie dans ses
          recueils statistiques, versés certifiés dans valeurs_point.csv avec la
          valeur de service du point (0,5731 € en 2021, 0,6540 € en 2025). Ils
          ne sont publiés que depuis 2021 et sont repris ici pour 2004-2014
          faute de série antérieure : cela ne déplace pas les points acquis, qui
          ne dépendent pas du taux, mais seulement le flux versé au compte
          notionnel.
