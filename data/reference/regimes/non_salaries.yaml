          sont portées par les périodes ci-dessous.
          LES TRANCHES SONT FIXÉES EN EUROS, ET LA CAISSE NE LES INDEXE PAS :
          42 507 € en 2023, en 2025 et en 2026, quand le plafond de la Sécurité
          sociale passait de 43 992 à 48 060 € sur la même période. Les exprimer
          en plafonds, comme le fait le reste du catalogue, les ferait donc
          dériver d'année en année — d'où le champ `borne_haute_euros`, écrit
          pour ce régime et utilisable par tout autre qui fixerait son assiette
          de la même façon. Le barème de 2019 portait 41 674 € : la caisse
          révise ces bornes, mais rarement.
          CLASSE C1 RETENUE. Trois classes coexistent, et rien ne permet de
          deviner celle d'un avocat donné. C1 est celle qui s'applique SANS
          option, et le modèle ne prête jamais à personne un avantage
          facultatif — même règle que pour les minima sous condition de demande.

