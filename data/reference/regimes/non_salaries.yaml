# Régimes des travailleurs non salariés : artisans, commerçants, libéraux,
# avocats, exploitants et salariés agricoles.
regimes:

  - code: cancava
    nom: Caisse autonome nationale de compensation de l'assurance vieillesse artisanale
    famille: non_salarie
    source_id: cor_panorama_regimes
    fiabilite: estimee
    creation: 1949
    fermeture: 2006
    extinction: 2006
    succede_a: []
    integre_dans: rsi
    population: Artisans.
    hors_repartition: false
    periodes:
      - debut: 1949
        fin: 1972
        type_calcul: points
        age_ouverture: 65
        age_taux_plein: 65
        duree_requise_trimestres: null
        taux_plein: 1.0
        salaire_reference: carriere_entiere
        assiette: plafonnee
        taux_cotisation_retraite: 0.085
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [minimum_vieillesse, reversion]
        notes: >-
          Loi du 17 janvier 1948 créant les régimes autonomes des non-salariés.
          Régime en points jusqu'à l'alignement de 1973.
      - debut: 1973
        fin: 2006
        type_calcul: annuites
        age_ouverture: 60
        age_taux_plein: 65
        duree_requise_trimestres: 160
        taux_plein: 0.50
        age_taux_plein_par_generation: true
        decote_par_generation: true
        salaire_reference_par_generation: true
        duree_proratisation_par_generation: true
        salaire_reference: 25_meilleures_annees
        assiette: plafonnee
        taux_cotisation_retraite: 0.1655
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: null
        avantages_non_contributifs:
          [minimum_contributif, minimum_vieillesse, majoration_enfants, mda,
           reversion, periodes_assimilees]
        notes: >-
          Loi du 3 juillet 1972 : ALIGNEMENT du régime de base des artisans sur
          le régime général à compter du 1er janvier 1973. Les points acquis
          avant 1973 sont conservés et convertis (« droits en points »).
          L'alignement de l'article L. 634-2 emporte les règles familiales du
          régime général : majoration de durée d'assurance et majoration pour
          trois enfants. La fiche ne les portait pas, et le moteur ne les
          servait donc pas à une artisane.

