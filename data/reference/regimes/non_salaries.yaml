        surcote_par_trimestre: null
        avantages_non_contributifs: [reversion]
        assiette: tranche_085_5_pass
        taux_cotisation_retraite: 0.0
        cotisation_forfaitaire_euros: 2690.4
        cotisation_forfaitaire_annee: 2020
        notes: >-
          RÉGIME PUREMENT FORFAITAIRE. La cotisation proportionnelle n'est
          instituée qu'en 1997 — « en plus de la cotisation forfaitaire qui
          existait déjà pour les chirurgiens dentistes », écrit le barème IPP en
          note de l'exercice 1997 —, et le taux est donc nul ici : seul le
          forfait alimente le compte.
          LE MONTANT DU FORFAIT EST EXTRAPOLÉ. La caisse ne publie ses mémentos
