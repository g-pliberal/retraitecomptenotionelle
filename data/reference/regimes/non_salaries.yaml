          versent une cotisation égale au DOUBLE de celle du médecin (D.
          645-3, LEGIARTI000006738166 dès 1985, LEGIARTI000006738169 dès 1995)
          : le forfait et le taux de la fiche valent donc un tiers du total,
          et la part des caisses est décrite ici, non comptée. FORFAIT : «
          soixante fois la valeur au 1er janvier de l'année en cause du tarif
          de la consultation du médecin omnipraticien » (D. 645-2,
          LEGIARTI000006738376 pour 1999 et 2000, LEGIARTI000006738377,
          LEGIARTI000006738378 pour 2003). 60 × 110 F = 6 600 F, un tiers pour
          le médecin : 335,39 € de 1999. POINTS : « 27 points pour les
          périodes de cotisation postérieures au 31 décembre 1993 » (décret n°
          72-968, art. 2, LEGIARTI000024871109), au prorata des trimestres —
          6,75 par trimestre validé, sans égard au revenu. VALEUR DE SERVICE :
          15,55 € au premier semestre 2012 pour tous les points (décret n°
          2011-1644, art. 4, LEGIARTI000024853556), prise pour valeur de 2011
          et ramenée aux prix de l'année de liquidation ; aucune valeur
          antérieure n'est dans l'index, niveau `estimee`.
