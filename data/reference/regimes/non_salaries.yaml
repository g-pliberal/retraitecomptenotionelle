  - code: carcdsf_complementaire
    nom: >-
      Régime complémentaire des chirurgiens-dentistes et des sages-femmes
      (CARCDSF)
    famille: liberal
    source_id: carcdsf_notices
    fiabilite: moyenne
    creation: 1949
    fermeture: null
    extinction: null
    succede_a: []
    integre_dans: null
    population: >-
      Chirurgiens-dentistes et sages-femmes libéraux. Étage complémentaire
      au-dessus du régime de base des professions libérales, et l'essentiel de
      la pension d'un dentiste — la caisse écrit qu'il en représente environ la
      moitié, et le quart de celle d'une sage-femme. Les sages-femmes n'y
      entrent qu'en 2009, quand la CARSAF rejoint la CARCDSF ; avant cette
      date, la fiche ne vaut que pour les chirurgiens-dentistes.
    hors_repartition: false
    periodes:
