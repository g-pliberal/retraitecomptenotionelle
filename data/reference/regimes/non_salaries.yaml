        pension_forfaitaire_annee: 2016
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: 0.0075
        surcote_bareme: cnbf
        avantages_non_contributifs: [reversion]
        notes: >-
          AVANT 2016, AUCUN BARÈME PUBLIÉ : la période porte les valeurs
          du barème de 2016 — pension de 16 581 €, forfait de 1 510 €,
          3,0 % proportionnels — ramenées par l'indice des prix. Les
          périodes suivantes portent chacune son barème.
          RÉGIME DE BASE SEUL, depuis que la fiche a été scindée. Sa pension est
          FORFAITAIRE : 19 154 € par an au taux plein en 2026, proratisés par la
          durée, quel que soit le revenu. C'est la particularité du régime, et
          c'est ce qu'un compte notionnel supprime le plus radicalement — la
          pension y redevient proportionnelle aux cotisations.
          La fiche agrégeait auparavant la base et le complémentaire en un seul
          taux de 11,40 %, calculé au rendement instantané. Elle portait en
          outre `salaire_reference: sans_objet` sans qu'aucun montant forfaitaire
          ne prenne le relais : si la période avait été lue en annuités, elle
          aurait servi la moyenne des revenus, c'est-à-dire un taux de
          remplacement de 100 %.
          DEUX COTISATIONS, ET LA FICHE PORTE ENFIN LES DEUX. La
          PROPORTIONNELLE d'abord : 3,20 % du revenu net, plafonnée à
          297 549 € (barème CNBF 2026). La FORFAITAIRE ensuite, qui monte par
          tranche d'ancienneté — « 1ère année 363 €, 2ème 730 €, 3ème 1 145 €,
          4ème 1 558 €, 5ème 1 558 €, 6ème année et avocats âgés de 65 ans et
          plus 1 988 € » en 2026 — et que la fiche porte à sa valeur de
          croisière, celle de l'année dans chaque période depuis 2016.
          CE QUE CETTE SIMPLIFICATION COÛTE, ET CE QU'ELLE RAPPORTE. Les cinq
          premières années sont surestimées, de 1 625 € la première à 430 € la
          cinquième, soit 4 586 € sur une carrière ; les trente-cinq suivantes
          sont justes, à 1 988 € l'an. Ne rien porter du tout — ce que faisait
          cette fiche — revenait à oublier près de 70 000 € de cotisations sur
          une carrière entière. Le forfait ne change rien au scénario 1, dont
          la pension est forfaitaire par construction ; il change le compte
          notionnel, qui porte ce qui a été versé.
          LA JUSTIFICATION DE CE MANQUE ÉTAIT PÉRIMÉE : « le compte notionnel
          ne sait porter qu'une fraction d'assiette », disait cette note. Il
          sait porter un forfait depuis que la CARCDSF l'a exigé —
          `cotisation_forfaitaire_euros`, indexé sur les prix comme la pension
          forfaitaire.
          RESTE DEHORS la contribution équivalente aux droits de plaidoirie,
          que l'avocat dont la plaidoirie n'est pas l'activité principale doit
          sur son revenu, dans la limite de 297 549 € en 2026 ; le barème donne
          la valeur d'un droit, 13 €, et sa « valeur en revenu », 574 €. Les 68 € et
          163 € que cette note lui attribuait sont la cotisation
          d'INVALIDITÉ-DÉCÈS, appelée auprès de l'avocat et du barreau : le
          barème de 2026, relu le 23 septembre 2026, les range sous ce régime.
          LA SURCOTE A DEUX TAUX. « 0,75 % par trimestre accompli à compter du
          1er janvier 2004 et avant le 1er juillet 2010 et [...] 1,25 % par
          trimestre accompli à compter du 1er juillet 2010 » (R. 653-3, qui
          reprend en 2019 l'ancien R. 723-39 ; le barème de la caisse
          l'imprime chaque année) : `surcote_bareme: cnbf` compte chaque
          trimestre au taux de sa date. La fiche servait 0,75 % à tous.
          LE FORFAIT N'A PAS SUIVI LES PRIX. Les barèmes publiés de 2017 à
          2026 donnent la retraite de base à taux plein année par année :
          16 664 € en 2017, 17 169 € en 2020, 18 299 € en 2023, 18 964 € en
          2025, 19 154 € en 2026 ; la cotisation forfaitaire de croisière de
          1 525 € à 1 988 €. Ramenés de 2026 par les prix, comme la fiche le
          fait, ils sont sous-estimés d'environ 5 % pour une liquidation de
          2017 à 2020, et la cotisation surestimée d'environ 8 %. La série
          est portée depuis le 23 septembre 2026 : une période par barème de
          2016 à 2026, avec celui de 2024 lu dans Internet Archive.
