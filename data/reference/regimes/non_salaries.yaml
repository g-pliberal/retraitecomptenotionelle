           reversion, periodes_assimilees]
        notes: >-
          Loi de financement de la sécurité sociale pour 2009 : la surcote passe
          de 0,75 % à 1,25 % par trimestre au 1er janvier 2009. Même période,
          même barème par ailleurs — seul le taux de surcote change.
          TAUX DE COTISATION : 16,73 % est la moyenne 2009-2013 de la cotisation
          plafonnée que transcrit OpenFisca-France (`ret_ac/artisans/sous_pss`) —
          16,65 % jusqu'en 2011, 16,85 % à compter de novembre 2012. La fiche
          portait 17,75 %, le total plafonnée plus déplafonnée de 2017, sur toute
          la période 2009-2018.
      - debut: 2014
        fin: 2018
        type_calcul: annuites
        age_ouverture: 62
        age_ouverture_par_generation: true
        age_taux_plein: 67
        duree_requise_trimestres: 172
        duree_requise_par_generation: true
        taux_plein: 0.50
        age_taux_plein_par_generation: true
        decote_par_generation: true
        salaire_reference_par_generation: true
        duree_proratisation_par_generation: true
        salaire_reference: 25_meilleures_annees
