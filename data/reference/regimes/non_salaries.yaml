        notes: >-
          LE DROIT D'AVANT 2004 N'EST PAS PROPORTIONNEL AU REVENU, et la fiche
          le faisait croire. Le régime servait une ALLOCATION VIEILLESSE, la
          même pour le notaire et pour le kinésithérapeute : la moitié de
          l'AVTS à l'origine, son montant entier depuis le décret n° 62-439 du
          14 avril 1962, puis, le 1er janvier 1983, « 1/15e d'AVTS par année
          cotisée », la condition de quinze années d'activité ayant été
          supprimée (les périodes au-delà de quinze ans comptent depuis le
          1er juillet 1978). La réforme du 21 août 2003 a converti ce droit en
          points, et la règle de conversion est publiée : « les trimestres
          validés avant le 1er janvier 2004 sont convertis en points à raison
          de cent points par trimestre » (D. 643-1, cité par le recueil
          statistique de la CNAVPL). C'est `points_par_trimestre_valide`, et le
          revenu n'y entre que par les trimestres qu'il valide.
          Le moteur portait auparavant 8,5 % du revenu ENTIER, sans plafond, au
          rendement de 8 % : trente ans de carrière à 200 000 € y ouvraient
          40 000 € de pension de base, quand le régime en servait 3 809 € en
          moyenne en 2003 — quarante ans de cotisations ne pouvant dépasser
          16 000 points, soit 10 500 € au point de 2025.
          CE QUI RESTE CONVENTIONNEL EST LA COTISATION, non la pension. La
          cotisation de base était forfaitaire jusqu'en 1992 ; le 1er janvier
          1993 (loi n° 91-73 du 18 janvier 1991), « une fraction de la
          cotisation du régime de base est devenue proportionnelle aux revenus,
          dans la limite de 5 fois le plafond de la sécurité sociale ». Faute de
          la série des forfaits, le compte notionnel prélève ici 8,5 % du revenu
          BORNÉ À CINQ PLAFONDS — le plafond que le régime s'est lui-même donné
          en 1993. C'est une convention, et elle est nommée : elle ne touche que
          le scénario notionnel, la pension du système actuel ne dépendant plus,
          pour ces années, que des trimestres.
