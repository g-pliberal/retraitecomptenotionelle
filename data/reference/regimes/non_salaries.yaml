          par le RENDEMENT, que la caisse publie elle-même dans ses mémos
          annuels — 10,9 % en 2023 et 2024, 10,8 % en 2026 — plutôt que par
          `valeurs_point.csv`, dont les contrôles de `verifier_donnees.py`
          possèdent le contenu. Les valeurs sont pourtant connues : 83,03 €
          d'achat et 9,05 € de service en 2023, 87,60 et 9,55 en 2024, 90,30 et
          9,75 en 2026. Un taux réduit de 4 % est
          ouvert sur demande aux revenus inférieurs à 2 700 SMIC horaires, et
          divise les droits par deux ; il n'est pas modélisé, le modèle ne
          sachant pas si un assuré l'a demandé. En dessous du seuil
          d'affiliation — 900 SMIC horaires, 10 692 € en 2026 — la cotisation
          n'est pas due du tout : le modèle la prélève quand même, faute d'un
          mécanisme de SEUIL D'EXONÉRATION (le drapeau `assiette_plancher`
          relève une assiette trop basse, il ne l'annule pas). Surestime donc
          les droits des toutes petites carrières artistiques.

