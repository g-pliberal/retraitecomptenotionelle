        avantages_non_contributifs:
          [minimum_vieillesse, pension_majoree_reference, reversion]
        notes: >-
          Loi du 4 mars 2002 créant la retraite complémentaire obligatoire (RCO)
          des non-salariés agricoles, en points. Cette fiche ne porte plus que
          l'étage de BASE : la RCO a désormais la sienne (`msa_rco`), et le taux
          de 17,37 % qui figure ici n'a jamais compris les 4 % de la RCO, qui
          s'y ajoutent. Garantie « 85 % du SMIC » : droit non contributif,
          neutralisé dans les scénarios notionnels.
          LE BARÈME DE POINTS EST DANS LE CODE, et le modèle le sert
          désormais : R. 732-71 attribue quinze points jusqu'à 400 SMIC
          horaires, puis une pente jusqu'à trente à 800 SMIC, puis trente
          jusqu'à deux fois le minimum contributif, puis une pente jusqu'au
          maximum M que R. 732-70 définit par (PM − AVTS) / (37,5 × valeur du
          point). Les « 23 à 113 points » que la caisse annonce sans publier la
          formule en sortent : 22,5 au minimum d'assiette du chef d'exploitation
          (600 SMIC horaires), 113,4 au plafond en 2025.
          La valeur du point est celle du code rural (R. 732-66, 4,589 € au
          1er janvier 2025), recoupée par le communiqué de la MSA et par le COR
          pour 2023 (4,264 €) ; les années antérieures sont ramenées sur les
          prix, comme la loi le prescrit (L. 161-23-1).
          La retraite forfaitaire, elle, vaut 3 628,98 € au 1er janvier 2023
          (communiqué de la MSA du 14 février 2023) pour une carrière complète.
          LA RÉFORME DE 2026 EST EN VIGUEUR, ET ELLE N'EST PAS CALCULABLE.
          L'article L. 732-24 a été entièrement réécrit au 1er janvier 2026 par
          la loi n° 2025-199 du 28 février 2025 : la pension « cumule 1° un
          montant calculé dans les conditions prévues à l'article L. 732-18
          […] sur les bases des seuls revenus des années à compter du
          1er janvier 2016 » et « 2° la somme : a) d'une part dont le montant
          maximal attribué pour une durée minimale d'assurance EST PRÉVU PAR
          DÉCRET […] b) d'une part calculée en fonction des montants […] des
          cotisations acquittées […] au titre des périodes d'assurance
          antérieures au 1er janvier 2016, EN RETENANT UN NOMBRE D'ANNÉES
          SÉLECTIONNÉES DANS DES CONDITIONS FIXÉES PAR VOIE RÉGLEMENTAIRE ».
          Son IV ajoute : « les modalités d'application du présent article sont
          définies par décret en Conseil d'État ».
          CE DÉCRET N'EST PAS DANS LA BASE. Un dépouillement de la législation
          consolidée ne rend, pour le 1er janvier 2026, que des articles
          LÉGISLATIFS — L. 732-21, L. 732-24, L. 732-35, L. 732-60 — et aucun
          article réglementaire nouveau. Les articles R. 732-60, R. 732-63 et
          R. 732-66, qui décrivent le calcul en points, courent toujours
          jusqu'à 2999. Deux des trois inconnues de la formule nouvelle — le
          maximum de la part forfaitaire d'avant 2016, le nombre d'années
          retenues pour la part proportionnelle — ne sont donc écrites nulle
          part, et la formule ne peut pas être calculée. La fiche sert celle
          d'avant, la seule dont les paramètres existent, et le dit.
          Voir docs/limites.md.
          LA SURCOTE EST DATÉE, et la période en servait une dès 2003. Elle
          naît de la loi du 21 août 2003, pour les liquidations de 2004, à
          0,75 % par trimestre ; elle passe à 1,25 % en 2009. La période est
          scindée pour cela seul : rien d'autre n'y change.
          LA LOI WOERTH S'APPLIQUE AUX PENSIONS PRENANT EFFET À COMPTER DU
          1ER JUILLET 2011 : L. 732-18 (LEGIARTI000023030985) renvoie l'âge
          d'ouverture à l'article L. 161-17-2, et L. 732-25 (versions
          LEGIARTI000023030980 puis LEGIARTI000028498264) l'âge d'annulation à
          ce même âge « augmenté de cinq années » et la durée à
          l'article L. 161-17-3 : âges, durée et coefficient se lisent à la
          génération, ce qui porte aussi les lois de 2014 et de 2023 (à
          compter du 1er septembre 2023, LEGIARTI000047452862). Les valeurs
          écrites ne sont que le repli hors table.
          LA SURCOTE EST SERVIE PAR LA BRANCHE EN POINTS, à la règle du
          régime général : D. 732-42 (LEGIARTI000006597431, puis
          LEGIARTI000023397787 pour les pensions prenant effet à compter du
          1er juillet 2011) compte la durée « accomplie à compter du 1er
          janvier 2004, au-delà de l'âge fixé à l'article L. 732-18 et au-
          delà de la durée minimale prévue à l'article L. 732-25 », quatre
          trimestres par an au plus. L'escalier de 3 %, 4 % et 5 % par année
          qu'il écrit pour les trimestres d'avant 2009 est ramené à 0,75 %
          par trimestre, comme la fiche du régime général le fait pour la
          même période.
