        notes: >-
          Le taux passe de 2 à 5 % avec la réforme du 1er janvier 1991, et le
          forfait RECULE du même coup — 2 405,65 € en 1990, 1 871,46 € en 1991 :
          le régime déplace son poids du montant vers le revenu.
          Cette réforme crée un point NOUVEAU : les points acquis auparavant sont
          servis affectés d'un coefficient de 1,33 (statuts du régime), ce que le
          rapport des deux séries publiées confirme à 1,3333 près. Le moteur
          l'applique par une ligne d'ÉCHELLE dans `conversions_points.csv`
          (carmf_complementaire, 1991, 1,333333) : les points acquis avant
          1991 et liquidés depuis valent un tiers de plus, comme le régime les
          sert. La fiche disait sous-estimer d'un tiers les droits d'avant
          1991 ; ce n'est plus le cas.
