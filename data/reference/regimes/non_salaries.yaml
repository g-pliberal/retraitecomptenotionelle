        pension_forfaitaire_annuelle: 19154
        pension_forfaitaire_annee: 2026
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: 0.0075
        avantages_non_contributifs: [reversion]
        notes: >-
          RÉGIME DE BASE SEUL, depuis que la fiche a été scindée. Sa pension est
          FORFAITAIRE : 19 154 € par an au taux plein en 2026, proratisés par la
          durée, quel que soit le revenu. C'est la particularité du régime, et
          c'est ce qu'un compte notionnel supprime le plus radicalement — la
          pension y redevient proportionnelle aux cotisations.
          La fiche agrégeait auparavant la base et le complémentaire en un seul
          taux de 11,40 %, calculé au rendement instantané. Elle portait en
          outre `salaire_reference: sans_objet` sans qu'aucun montant forfaitaire
          ne prenne le relais : si la période avait été lue en annuités, elle
          aurait servi la moyenne des revenus, c'est-à-dire un taux de
          remplacement de 100 %.
          Le taux porté ici est celui de la seule cotisation PROPORTIONNELLE au
          revenu net, 3,20 % (barème CNBF 2026), plafonnée à 297 549 €. La
          cotisation forfaitaire par tranche d'ancienneté — 363 € la première
          année, 1 988 € à partir de la sixième — n'est pas modélisée : elle ne
          dépend pas du revenu, et le compte notionnel ne sait porter qu'une
          fraction d'assiette. C'est un écart documenté dans docs/limites.md.

