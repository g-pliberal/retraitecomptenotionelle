          (D. 643-1 dans sa rédaction de 2004). Le régime n'attribue pas un nombre
          de points proportionnel à la cotisation mais un nombre PLAFONNÉ de points
          par tranche : c'est un barème en points, et c'est lui — et non un prix
          d'achat, que la caisse ne publie pas — qui convertit ici le revenu en
          droits.
          L'ASSIETTE MINIMALE est portée hors de la fiche, par
          `legislation/assiette_minimale_independants.csv`, que le moteur lit
          pour tous les libéraux : D. 642-4 la chiffre sans discontinuer — 200
          fois le SMIC horaire de 2004 à 2011, 5,25 % du plafond de 2012 à
          2014, 7,70 % en 2015, 11,5 % de 2016 à 2022, 450 fois le SMIC horaire
          depuis 2023 —, et elle valide trois trimestres. La note qui la disait
          absente datait d'avant ce fichier.
          LE TAUX EST CELUI DE LA LOI, et il bouge quatre fois en onze ans :
          8,6 % de 2004 à 2011, 8,63 % en 2012, 9,75 % en 2013, 10,1 % en 2014
          (D. 642-3, versions successives lues dans la base LEGI). La fiche portait
          8,23 % sur toute la période — le taux de 2015, reporté en arrière faute
          de série. Cela ne déplace pas les points acquis, qui ne dépendent pas du
          taux, mais le flux versé au compte notionnel, sous-estimé de près d'un
          cinquième en 2014.
          LA SURCOTE EST SERVIE, ET C'EST CELLE DU RÉGIME GÉNÉRAL : R. 643-8
          (LEGIARTI000006751834) la donne « au titre des périodes d'activité
          ayant donné lieu à cotisations à la charge de l'assuré accomplies
          à compter du 1er janvier 2004 après l'âge prévu au premier alinéa
          de l'article L. 351-1 et au-delà de la limite mentionnée au
          deuxième alinéa du même article », à 0,75 % par trimestre. La
          branche en points du moteur ne lisait pas ce champ, et la fiche
          l'écrivait pour rien ; `surcote_points: regime_general` la fait
          compter comme la branche en annuités, trimestres cotisés au-delà
          de l'âge légal et de la durée requise.
          LES TRIMESTRES POUR ENFANTS, DEPUIS 2010. L. 643-1-1, créé par la loi
          de financement pour 2010 « pour les pensions de retraite prenant effet
          à compter du 1er avril 2010 » (LEGIARTI000021537910), rend aux
          assurés de ce régime la majoration de durée d'assurance de L. 351-4,
          puis de L. 351-4-1 et L. 351-4-2 : quatre trimestres de maternité et
          quatre d'éducation par enfant, comme au régime général. La fiche
          n'en portait rien, et le moteur ne l'aurait pas servie : il ne
          cherchait la majoration que dans les régimes en annuités. Une
          majoration de durée ne joue pourtant que sur la durée — la décote et
          la surcote, qu'un régime en points comme celui-ci compte aussi —, et
          `mda` est désormais lu dans toute fiche qui le porte. Une libérale
          qui n'a cotisé qu'ici perdait jusqu'à 1,25 % de sa pension par
          trimestre que la loi lui donnait. Servie à partir de 2010, dont neuf
          mois sur douze sont couverts.
