        surcote_points: par_age_seul
        surcote_age_debut: 65
        surcote_pas_trimestres: 4
        avantages_non_contributifs: [reversion, majoration_enfants]
        notes: >-
          Taux de la table « Cotisations proportionnelles » de la chronologie de la CARMF.
          LA RETRAITE EN TEMPS CHOISI N'EXISTE PAS ENCORE : jusqu'au 31
          décembre 2016, l'article 15 des statuts ouvre le régime « à 65 ans
          », ou dès l'âge de l'article L. 161-17-2 « avec application d'un
          coefficient d'anticipation égal à 0,75 à 60 ans, 0,80 à 61 ans,
          0,85 à 62 ans, 0,90 à 63 ans, 0,95 à 64 ans » — l'âge seul, 1,25 %
          par trimestre, sans durée d'assurance ; la fiche portait 62, 67 et
          172 trimestres, la décote du régime de base. Le report au-delà de
          65 ans est majoré par l'article 32, « de 5 % par année pleine de
          différé » : `surcote_pas_trimestres: 4` ne compte que les années
          pleines. Cet article n'est lu que dans l'état consolidé des
          statuts, sans date d'origine : la fiche le sert à partir de 2000,
          borne de période, et rien avant.
          LA MINORATION COMPTE DES ANNÉES D'ÂGE. « 0,75 à 60 ans, 0,80 à 61
          ans, 0,85 à 62 ans, 0,90 à 63 ans, 0,95 à 64 ans » : l'âge atteint,
          en années, et non les trimestres. La fiche l'écrivait en 1,25 % par
          trimestre avec `duree_requise_trimestres: null` pour dire que la
          durée n'y jouait aucun rôle ; or le moteur oppose à un régime en
          points la durée de la carrière, qui annulait la minoration : un
          médecin parti à soixante-quatre ans en 2009 avec sa durée ne perdait
          rien. `abattement_points: cavom` — 5 % par année manquante jusqu'au
          taux plein, l'année entamée comptant entière, et seul l'âge l'annule
          — est cette règle-là. Corrigé le 23 septembre 2026 (action 89, lot
          des professions de santé).
