        notes: >-
          Loi du 10 juillet 1952 créant l'assurance vieillesse agricole (AVA).
          Retraite en deux parts : FORFAITAIRE, indépendante du revenu, et
          PROPORTIONNELLE en points. La part forfaitaire vaut, pour une carrière
          complète, l'allocation aux vieux travailleurs salariés (L. 732-24),
          et se proratise sur la durée ; le moteur ne la servait pas du tout,
          traitant `mixte` comme un synonyme de `points`.
          LE BARÈME DE POINTS N'EXISTE QU'À PARTIR DE 1990 : l'article R. 732-70
          ne l'ouvre qu'« à compter du 1er janvier 1990 ». Les années
          antérieures restent donc au rendement instantané, faute d'un barème
          publié pour la période des classes.
          L'ASSIETTE EST BORNÉE AU PLAFOND, et c'est une convention nommée : la
          cotisation d'alors était assise sur un forfait tiré de la surface de
          l'exploitation, dont la série n'est nulle part. La fiche portait
          `forfaitaire`, que le moteur lit « le revenu entier, sans plafond » :
          une carrière à quatre fois le salaire moyen sortait par ces dix années
          une pension de base supérieure au maximum que le régime peut servir.
          Le plafond retenu est celui que le régime s'est donné en 1990.
