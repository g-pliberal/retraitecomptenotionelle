# Régimes des travailleurs non salariés : artisans, commerçants, libéraux,
# avocats, exploitants et salariés agricoles.
regimes:

  - code: cancava
    nom: Caisse autonome nationale de compensation de l'assurance vieillesse artisanale
    famille: non_salarie
    source_id: cor_panorama_regimes
    fiabilite: estimee
    creation: 1949
    fermeture: 2006
    extinction: 2006
    succede_a: []
    integre_dans: rsi
    population: Artisans.
    hors_repartition: false
    periodes:
      - debut: 1949
        fin: 1972
        type_calcul: points
        age_ouverture: 65
        age_taux_plein: 65
        duree_requise_trimestres: null
        taux_plein: 1.0
        salaire_reference: carriere_entiere
        assiette: plafonnee
        taux_cotisation_retraite: 0.085
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [minimum_vieillesse, reversion]
        notes: >-
          Loi du 17 janvier 1948 créant les régimes autonomes des non-salariés.
          Régime en points jusqu'à l'alignement de 1973.
      - debut: 1973
        fin: 1982
        type_calcul: annuites
        age_ouverture: 60
        age_taux_plein: 65
        duree_requise_trimestres: 150
        taux_plein: 0.5
        decote_par_generation: true
        salaire_reference: 10_meilleures_annees
        assiette: plafonnee
        taux_cotisation_retraite: 0.1143
        decote_par_trimestre: 0.025
        decote_annulee_par_la_duree: false
        surcote_par_trimestre: null
        avantages_non_contributifs:
          [minimum_vieillesse, majoration_enfants, mda,
           reversion, periodes_assimilees]
        notes: >-
          ALIGNEMENT DE 1973, ET IL SE SUIT DANS LE TEMPS. La loi du 3 juillet
          1972 aligne le régime de base sur le régime général à compter du
          1er janvier 1973 : les points acquis avant sont conservés et convertis
          (« droits en points »). L'alignement emporte les règles du régime
          général — durée requise, salaire de référence, décote, surcote,
          majorations familiales de l'article L. 634-2 —, ET IL LES EMPORTE
          TOUTES, y compris leurs changements. La fiche portait une seule
          période de 1973 à 2006, avec la durée requise de 160 trimestres et les
          vingt-cinq meilleures années : un artisan parti en 1980 se voyait donc
          opposer une durée que le droit ne lui demandait pas — 150 trimestres —
          et une décote de 1,25 % par trimestre quand elle était de 2,5 %.
          Les quatre périodes qui suivent sont celles du régime général, bornées
          à l'alignement de 1973 et à l'absorption dans le RSI en 2006.
          TAUX DE COTISATION : 11.43 % est la moyenne 1973-1982 des taux datés
          que transcrit OpenFisca-France
          (`cotisations_taxes_independants_artisans_commercants/ret_ac/artisans/sous_pss`,
          décrets d'application de la loi du 3 juillet 1972) — 8,75 % en 1973,
          10,25 % en 1974, 11,15 % en octobre 1976, 12,9 % en 1979. La fiche
          portait 16,55 % de 1973 à 2006, un chiffre de synthèse qui surcomptait
          de cinq points la cotisation des années 1970 ; `verifier_donnees.py`
          confronte désormais chaque période à la série. ET DEPUIS 1973, C'EST
          LE TAUX DE CHAQUE ANNÉE QUI EST APPLIQUÉ, lu dans
          `taux_cotisation_annuels.csv` : le chargeur découpe la période année
          par année, et la moyenne ne sert plus qu'au contrôle.
      - debut: 1983
        fin: 1993
        type_calcul: annuites
        age_ouverture: 60
        age_taux_plein: 65
        age_taux_plein_par_generation: true
        duree_requise_trimestres: 150
        taux_plein: 0.5
        decote_par_generation: true
        salaire_reference: 10_meilleures_annees
        assiette: plafonnee
        taux_cotisation_retraite: 0.1505
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: null
        avantages_non_contributifs:
          [minimum_contributif, minimum_vieillesse, majoration_enfants, mda,
           reversion, periodes_assimilees]
        notes: >-
          1983 : le minimum contributif est créé, et la décote tombe à 1,25 % par
          trimestre. La durée requise reste de 150 trimestres.
          TAUX DE COTISATION : 15.05 % est la moyenne 1983-1993 des taux datés
          que transcrit OpenFisca-France
          (`cotisations_taxes_independants_artisans_commercants/ret_ac/artisans/sous_pss`,
          décrets d'application de la loi du 3 juillet 1972) — 12,9 % en 1983,
          13,9 % en 1984, 14,6 % en août 1986, 14,8 % en juillet 1987, 15,8 % en
          1989, 16,35 % en février 1991. La fiche portait 16,55 % de 1973 à
          2006, un chiffre de synthèse qui surcomptait de cinq points la
          cotisation des années 1970 ; `verifier_donnees.py` confronte désormais
          chaque période à la série.
      - debut: 1994
        fin: 2003
        type_calcul: annuites
        age_ouverture: 60
        age_ouverture_par_generation: true
        age_taux_plein: 65
        age_taux_plein_par_generation: true
        duree_requise_trimestres: 160
        duree_requise_par_generation: true
        taux_plein: 0.5
        decote_par_generation: true
        salaire_reference_par_generation: true
        duree_proratisation_par_generation: true
        salaire_reference: 25_meilleures_annees
        assiette: plafonnee
        taux_cotisation_retraite: 0.1635
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: null
        avantages_non_contributifs:
          [minimum_contributif, minimum_vieillesse, majoration_enfants, mda,
           reversion, periodes_assimilees]
        notes: >-
          Réforme Balladur, applicable aux pensions prenant effet à compter du
          1er janvier 1994 : la durée requise monte de 150 à 160 trimestres par
          génération, et le salaire de référence passe des dix aux vingt-cinq
          meilleures années, là aussi par génération. Les deux montées en charge
          sont lues dans les tables du dépôt.
          TAUX DE COTISATION : 16.35 % est la moyenne 1994-2003 des taux datés
          que transcrit OpenFisca-France
          (`cotisations_taxes_independants_artisans_commercants/ret_ac/artisans/sous_pss`,
          décrets d'application de la loi du 3 juillet 1972) — 16,35 % sur toute
          la période. La fiche portait 16,55 % de 1973 à 2006, un chiffre de
          synthèse qui surcomptait de cinq points la cotisation des années 1970
          ; `verifier_donnees.py` confronte désormais chaque période à la série.
      - debut: 2004
        fin: 2006
        type_calcul: annuites
        age_ouverture: 60
        age_ouverture_par_generation: true
        age_taux_plein: 65
        age_taux_plein_par_generation: true
        duree_requise_trimestres: 164
        duree_requise_par_generation: true
        taux_plein: 0.5
        decote_par_generation: true
        salaire_reference_par_generation: true
        duree_proratisation_par_generation: true
        salaire_reference: 25_meilleures_annees
        assiette: plafonnee
        taux_cotisation_retraite: 0.1652
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: 0.0075
        surcote_bareme: regime_general
        avantages_non_contributifs:
          [minimum_contributif, minimum_vieillesse, majoration_enfants, mda,
           reversion, periodes_assimilees, carriere_longue]
        notes: >-
          Loi Fillon de 2003 : durée requise au-delà de 160 trimestres, création
          de la surcote et de la retraite anticipée pour carrière longue. Le
          régime est absorbé par le RSI le 1er janvier 2006.
          TAUX DE COTISATION : 16.52 % est la moyenne 2004-2006 des taux datés
          que transcrit OpenFisca-France
          (`cotisations_taxes_independants_artisans_commercants/ret_ac/artisans/sous_pss`,
          décrets d'application de la loi du 3 juillet 1972) — 16,35 % puis
          16,45 % en juillet 2004 et 16,65 % en 2006. La fiche portait 16,55 %
          de 1973 à 2006, un chiffre de synthèse qui surcomptait de cinq points
          la cotisation des années 1970 ; `verifier_donnees.py` confronte
          désormais chaque période à la série.
