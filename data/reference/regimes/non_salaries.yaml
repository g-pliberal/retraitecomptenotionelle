          L'ASSIETTE N'EST PAS LE REVENU, ET C'EST CE QUI TENAIT CETTE SECTION
          HORS DU CATALOGUE. « À la différence des cotisations de retraite de
          base assises sur votre revenu professionnel, vos cotisations de
          retraite complémentaire sont calculées sur la base de vos COMMISSIONS
          ET RÉMUNÉRATIONS BRUTES réalisées l'année précédente », écrit la
          caisse — celles que les compagnies versent à l'agent, avant qu'il
          n'ait payé un loyer, un salarié ou une charge.
          LE FACTEUR VIENT DE LA CAISSE ELLE-MÊME, et de deux phrases de la même
          page de statistiques : « la commission moyenne plafonnée augmente de
          5,0 %, passant de 275 525 € à 286 168 € » et « le revenu moyen déclaré
          en 2024 par les agents s'élève à 115 443 euros ». Le rapport des deux
          grandeurs de 2024 — 275 525 / 115 443 — vaut 2,387, et c'est lui que
          porte `assiette_facteur_revenu`. C'est une MOYENNE DE SECTION : deux
          agents à même revenu n'ont pas les mêmes commissions, et la fiche ne
          prétend pas décrire l'un d'eux. Sans ce facteur, elle se tromperait
          d'un facteur deux et demi, ce qui est pire.
          LE PLAFOND EST INDEXÉ SUR LA COMMISSION MOYENNE, pas sur celui de la
          Sécurité sociale : la caisse l'a porté à 625 777 € pour 2026,
          « soit une augmentation de 4 %, conformément à l'évolution de la
          commission moyenne ». Treize plafonds de la Sécurité sociale en sont
          la meilleure approximation indexable — 624 780 € contre 625 777 € en
          2026, à un millième près ; l'écart atteint 6 % en 2024, et joue sur
          les seules commissions supérieures à douze plafonds.
          3,60 % À L'ORIGINE. Le régime est institué par le décret n° 67-1169 du
          22 décembre 1967 ; le taux double en 1971.
          LA RÈGLE D'ÂGE N'EST LUE QU'À PARTIR DE 2011, ET ELLE EST PORTÉE EN
          ARRIÈRE. Les statuts de 1967 et leurs modifications jusqu'en 2007
          n'ont été publiés qu'au Bulletin officiel : le Journal officiel n'en
          porte que les titres, ou des articles sans rapport avec l'âge. Le
          premier texte complet est celui des statuts approuvés par l'arrêté
          du 23 juin 2011 (JORFARTI000024270173) : taux plein à l'âge de
          l'article L. 161-17-2 augmenté de cinq ans, liquidation dès cet âge
