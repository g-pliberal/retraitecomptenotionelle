          restent hors de tout texte, mais leur RÈGLE est désormais écrite : le
          décret n° 2026-418 (article 2, JORFARTI000054153399) fait fixer par
          le conseil d'administration, chaque année, des bornes en pourcentage
          de la moyenne des produits du notariat « afin que chaque tranche
          regroupe environ 1/8e de la population en activité » — des octiles.
          Et la grille des montants est publiée : la plaquette du congrès 2025
          de la caisse donne huit classes à 2 758 €, 5 516 €, … 22 065 €, pour
          10 à 80 points — la classe k vaut k fois la classe 1 que fixe le
          décret annuel (2 758,10 € en 2025, décret n° 2025-1076, article 12),
          et ouvre 10 k points. Le coût de chaque notaire est ce montant
          multiplié par un coefficient d'âge à la date de changement de classe,
          de 1,000 jusqu'à 33 ans à 1,681 à 65 ans (annexe 1 du décret
          n° 49-578 depuis le décret n° 2026-418). Avec la loi des revenus que
          la section C calibre, les huit classes se laissent donc estimer ;
          c'est une action à part, que la feuille de route nomme.
