          [minimum_contributif, minimum_vieillesse, majoration_enfants, mda,
           reversion, periodes_assimilees]
        notes: >-
          UNE COTISATION DÉPLAFONNÉE EST CRÉÉE AU 1er JANVIER 2014, et la période
          se coupe là. 17,09 % est la moyenne 2014-2018 de la cotisation
          plafonnée que transcrit OpenFisca-France — 16,95 % en 2014, 17,05 % en
          2015, 17,15 % depuis 2016 — et 0,45 % celle de la cotisation
          déplafonnée (`ret_ac/tous_independants/tout_salaire` : 0,20 %, 0,35 %,
