          SOIXANTE ANS DEPUIS LE 1ER JANVIER 1986 : la loi n° 86-19 du
          6 janvier 1986 « relative à l'abaissement à soixante ans de l'âge de
          la retraite des personnes non salariées des professions agricoles »
          (LEGITEXT000006068962) ouvre la pension à soixante ans aux
          pensions « prenant effet postérieurement au 1er janvier 1986 »
          (article 11, LEGIARTI000006757038). La fiche opposait soixante-cinq
          ans jusqu'en 2002. Entre soixante et soixante-cinq ans, la pension
          est minorée à qui n'a pas la durée requise tous régimes confondus
          (L. 732-25 dans sa codification de 2000, LEGIARTI000006585545), au
          coefficient du régime général de l'époque, lu à la génération :
          2,5 % par trimestre pour les assurés nés avant 1944.
          Le reste de la période reprend la précédente : barème d'avant 1990
          au rendement instantané, assiette bornée au plafond.
