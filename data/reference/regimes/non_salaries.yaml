          L'arrêté du 14 novembre 2025 qui approuve les statuts le dit autrement :
          l'article 6 perd le mot « forfaitaire », et l'article 7 devient « une
          cotisation proportionnelle […] Le versement de la cotisation porte
          attribution, annuellement, d'un nombre de points obtenu en divisant le
          montant de cette cotisation par le coût d'acquisition d'un point ».
          CE COÛT N'EST PAS ENCORE PUBLIÉ. Le rendement de 2025 est donc reconduit,
          et c'est la seule valeur estimée de cette fiche depuis 2010.

  - code: carpv_complementaire
    nom: >-
      Régime complémentaire de la Caisse autonome de retraite et de prévoyance
      des vétérinaires (CARPV)
    famille: liberal
    source_id: carpv_bareme
    fiabilite: moyenne
    creation: 1950
    fermeture: null
    extinction: null
    succede_a: []
    integre_dans: null
    population: >-
      Vétérinaires non salariés inscrits à l'Ordre national des vétérinaires,
      « exerçant à titre principal, exclusif ou accessoire » : la caisse écrit
      que le régime complémentaire leur est obligatoire à tous. C'est la plus
      petite des dix sections professionnelles de la CNAVPL, et le
      complémentaire y pèse plus lourd que la base : un vétérinaire à 76 000 €
      de revenus verse 10 234 € au premier en 2026 et 5 377 € au second.
