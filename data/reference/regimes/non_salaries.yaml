          selon le revenu de l'année N-2, plus une classe spéciale. La grille
          n'est publiée nulle part : le décret annuel ne chiffre que la classe
          spéciale (284 € en 2002, 694 € en 2015), et le seul autre point connu
          est la sixième classe, 13 886 € en 2015 dès deux plafonds de revenus.
          Entre les deux, rien — et une grille de six classes ne se devine pas
          à partir de ses deux extrémités. La fiche ne commence donc qu'en 2016,
          et une carrière d'officier ministériel antérieure à cette date est
          sous-estimée de tout son complémentaire. C'est la plus grosse lacune
          du catalogue libéral, et elle est nommée dans docs/limites.md.
          L'ASSIETTE MINIMALE N'EST PAS PORTÉE. En dessous de 19 % du plafond —
          9 131 € en 2026 —, comme pendant les deux premières années
          d'activité, le revenu est « fixé forfaitairement » à ce seuil et la
          cotisation ne descend pas sous 1 141 €. Le dépôt ne modélise aucune
          assiette minimale libérale, pas plus celle-ci que celle du régime de
          base ; l'écart ne joue que sur des revenus inférieurs à un cinquième
          du plafond.
          « LA LIQUIDATION DU RÉGIME COMPLÉMENTAIRE EST OPÉRÉE UNIQUEMENT EN
          FONCTION DE L'ÂGE » — d'où une durée requise nulle, et aucune carrière
          longue : la caisse écrit qu'à la différence de son régime de base, le
          complémentaire n'en prévoit pas. Les bornes d'âge sont les siennes :
          60-65 ans jusqu'à la génération 1955, relevées à 62-67 au rythme de
          deux trimestres par génération depuis 1956, puis l'ouverture portée de
          62 à 64 ans à partir de la génération 1965 depuis le 1er janvier 2025.
          La fiche les lit dans les tables générales, qui donnent exactement
          cela à partir de la génération 1968 et retardent l'ouverture de deux
          ans au plus pour les générations les plus anciennes.
          LA DÉCOTE NE SE FRACTIONNE PAS : « une décote définitive de 5 % par
          année manquante peut être appliquée au montant de la pension, sans que
          celle-ci puisse être fractionnée ». Le dépôt la compte par trimestre,
          à 1,25 % — même pente, mais il minore là où la caisse attend l'année
          entière. « En cas de prolongation de l'activité au-delà de l'âge du
          taux plein, aucune surcote n'est applicable » : la fiche n'en porte
          donc aucune.
          LES SALARIÉS DU RÉGIME NE SONT PAS PORTÉS NON PLUS : ils cotisent à
          7,50 %, dont 60 % à la charge de l'employeur, et le statut qui route
          vers cette fiche est celui d'un libéral.
