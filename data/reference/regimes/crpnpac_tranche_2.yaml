population: >-
  Même caisse et mêmes affiliés que `crpnpac` : c'est la SECONDE TRANCHE de
  salaire du même régime, de quatre à huit plafonds de la Sécurité sociale,
  dont le taux de pension par annuité est plus faible. Pourquoi deux fiches
  et non deux périodes d'une seule : le calcul de pension ne retient qu'UNE
  période active par régime, si bien que deux tranches simultanées dans la
  même fiche verraient la seconde ignorée en silence. Le dépôt sépare déjà
  de la même façon la CNBF de sa complémentaire et le régime agricole de sa
  RCO.
