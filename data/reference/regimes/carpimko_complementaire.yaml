    notes: >-
      LE RÉGIME EST CRÉÉ PAR LE DÉCRET N° 84-143 DU 22 FÉVRIER 1984, et il est
      alors PUREMENT FORFAITAIRE : la cotisation proportionnelle n'est instituée
      qu'en 1996, « en plus de la cotisation forfaitaire qui existait depuis la
      création du régime complémentaire en 1984 », note le barème IPP. Le taux
      est donc nul ici, et le forfait est toute la cotisation.
      SON MONTANT EST EXTRAPOLÉ : les décrets annuels ne sont dépouillés qu'à
      partir de 2001, et le forfait de 2002 est reconduit vers l'amont en euros
      constants. C'est la convention du dépôt pour un montant sans série.
