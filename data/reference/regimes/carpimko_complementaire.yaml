    notes: >-
      LA RÉFORME DU 1er JANVIER 2026 SUPPRIME LE FORFAIT. Le décret n° 2025-1076
      du 10 novembre 2025 écrit, pour 2026 : « taux de la cotisation
      proportionnelle : 8,7 % ; limites de l'assiette : seuil : 50 % du plafond
      annuel de la sécurité sociale ; plafond : 3 fois le plafond annuel ». Les
      bornes quittent l'euro pour le plafond, et la fiche les suit.
      LE SEUIL EST UN MINIMUM, PAS UN ABATTEMENT. L'article 7 du même décret
      réécrit l'article 2 du décret du 22 février 1984 : « une cotisation
      proportionnelle assise sur les revenus d'activité retenus pour le calcul
      de la cotisation du régime de base. L'assiette de cette cotisation est
      comprise entre un minimum et un maximum. » La cotisation porte donc sur
      le revenu ENTIER, relevé à un demi-plafond et coupé à trois : 2 091 € au
      moins, 12 544 € au plus en 2026, ce que la caisse écrit et que sa
      calculette applique. La fiche lisait l'ancien seuil de 25 246 € comme
      une tranche, et retranchait un demi-plafond de tout revenu.
      L'arrêté du 14 novembre 2025 qui approuve les statuts le dit autrement :
      l'article 6 perd le mot « forfaitaire », et l'article 7 devient « une
      cotisation proportionnelle […] Le versement de la cotisation porte
      attribution, annuellement, d'un nombre de points obtenu en divisant le
      montant de cette cotisation par le coût d'acquisition d'un point ».
      CE COÛT N'EST PUBLIÉ NI AU JOURNAL OFFICIEL NI SUR LE SITE DE LA CAISSE ;
      sa calculette le laisse lire, 391 € le point pour une valeur de service
      de 21,48 €, soit un rendement de 5,49 % (`rendements_points.csv`).
