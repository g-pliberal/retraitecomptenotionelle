# LES DROITS D'AVANT 1973 NE SONT PAS LA PENSION ALIGNÉE (action 138, étape 18 ;
# fiche de règle `points_avant_1973_independants`). Les prestations afférentes
# aux périodes antérieures au 1er janvier 1973 « demeurent calculées, liquidées
# et servies dans les conditions définies par les dispositions législatives et
# réglementaires en vigueur au 31 décembre 1972 » (L. 634-3) : des points,
# multipliés par la valeur du point de retraite (décret n° 66-248, art. 19), et
# non des annuités. Le dépôt les portait sous `organic`, période en points de
# 1949 à 1972, que la liquidation, lue à la date d'effet, servait en annuités du
# régime aligné, années d'avant 1973 comprises dans la proratisation. Ils ont
# désormais leur régime : l'ORGANIC commence en 1973, et ces années n'entrent
# plus que dans la durée tous régimes, que l'article 3 du décret n° 73-937 lit
# aussi pour la minoration.
#
# La première période ACQUIERT, les suivantes ne font que LIQUIDER : le routage
# (`legislation/affiliations.yaml`) n'envoie ici que les années de commerçant de
# 1949 à 1972, et la liquidation lit la période de la date d'effet. Leur taux de
# cotisation est nul, faute de rien acquérir.
