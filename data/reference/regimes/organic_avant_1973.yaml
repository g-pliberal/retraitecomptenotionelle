    points_maximum: 20
    decote_par_trimestre: null
    surcote_par_trimestre: null
    avantages_non_contributifs: [minimum_vieillesse, reversion]
    notes: >-
      LES POINTS. Le décret n° 66-248 (article 3, rédaction du 31 mars
      1971) fait OPTER le commerçant pour l'une de trois classes, VI bis
      (20 points), VII (24) ou VIII (36) ; sans option, il cotise en classe
      minimale VI bis, et il ne descend dans les classes I à VI (4 à 16
      points) que sur sa demande, sous des seuils de revenus « fixés par
      décret ». Les classes de 1949 à 1970 et les seuils ne sont pas dans
      l'index LEGI, et le Journal officiel d'avant 1990 n'y est qu'en
      notices. Le dépôt lit donc la seule conversion d'un revenu en points
      que le droit en vigueur écrive : D. 634-8, qui calcule la pension des
      périodes assimilées après 1972 sur un revenu égal « à autant de fois un
      pourcentage dudit plafond que la dernière cotisation annuelle […]
      antérieurement au 1er janvier 1973 comporte de points », 5 % du plafond
      pour les industriels et commerçants (de même le II de l'article 1er du
      décret n° 73-937). Un point par 5 % du plafond, au plafond au plus :
      20 points pour un revenu au plafond, la classe minimale VI bis. Le
      modèle ne prête à personne une option qu'il ne connaît pas : ni les
      classes VII et VIII, ni les classes basses qu'il fallait demander ; il
      ouvre moins de vingt points sous le plafond, là où la classe VI bis en
      donnait vingt à qui ne demandait rien. Ni les points gratuits des
      années d'avant 1949 (classe I, cent vingt points au plus, article
      17), ni les rachats, ni la bonification sur les points acquis au
      1er décembre 1962 (article 20). TAUX DE COTISATION : 8,5 %, la valeur
      de synthèse que la fiche `organic` portait, qui ne sert qu'au compte
      notionnel.
