# Articles pivots : les textes dont les versions datent chaque fiche
# =================================================================
# Pour chaque régime du catalogue, la liste des articles de code ou de décret
# qui portent ses paramètres. `scripts/calendrier_regimes.py` lit dans l'index
# LEGI du dépôt (data/brut/dila/legi.sqlite) le calendrier des versions de
# chacun — identifiant, date de début et de fin de validité —, vérifie que la
# chaîne est jointive, et confronte ces dates aux périodes de la fiche : une
# version qui commence une année où aucune période ne commence est une
# coupure de texte que la fiche ne porte pas.
#
# Champs d'un pivot :
#   texte       début du titre tel que l'index le porte : « Code de la
#               sécurité sociale », « Décret n° 2008-639 » (l'espace après le
#               « n° » est indifférent, le script essaie les deux)
#   num         numéro d'article, normalisé comme dila_cherche.py (majuscules,
#               sans espaces ni points) ; vide pour le texte entier
#   parametres  ce que l'article commande, dans le vocabulaire de _schema.yaml
#
# `hors_legi` : la raison, quand aucun texte de LEGI ne porte le régime — un
# accord, un règlement de caisse, un texte d'avant 1947. Tout régime calculé a
# au moins un pivot ou cette raison, un test l'exige.

pivots:

  # --- Salariés du privé, base -------------------------------------------
  assurances_sociales:
    hors_legi: >-
      Lois de 1928 et 1930, antérieures au dump de la DILA ; aucune version
      consolidée dans LEGI.
  avts:
    hors_legi: >-
      Loi du 14 mars 1941, antérieure au dump ; l'AVTS ne subsiste que comme
      référence de montant (L. 732-24 du code rural).
  regime_general:
    - {texte: "Code de la sécurité sociale", num: L351-1, parametres: [taux_plein, salaire_reference]}
    - {texte: "Code de la sécurité sociale", num: L351-8, parametres: [age_taux_plein]}
    - {texte: "Code de la sécurité sociale", num: L161-17-2, parametres: [age_ouverture]}
    - {texte: "Code de la sécurité sociale", num: L161-17-3, parametres: [duree_requise_trimestres]}
    - {texte: "Code de la sécurité sociale", num: R351-27, parametres: [decote_par_trimestre]}
    - {texte: "Code de la sécurité sociale", num: R351-29, parametres: [salaire_reference]}
    - {texte: "Code de la sécurité sociale", num: R351-6, parametres: [duree_proratisation]}
    - {texte: "Code de la sécurité sociale", num: D351-1-4, parametres: [surcote_par_trimestre]}
  msa_salaries:
    - {texte: "Code rural", num: L742-3, parametres: [alignement]}
    - {texte: "Code de la sécurité sociale", num: L351-1, parametres: [taux_plein, salaire_reference]}
    - {texte: "Code de la sécurité sociale", num: R351-27, parametres: [decote_par_trimestre]}

