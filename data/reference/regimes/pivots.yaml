      Même convention de 1947 que l'Agirc, hors JORF et hors KALI ; le barème des
      entreprises créées après 1981 est lu dans OpenFisca-France.
  arrco_tranche_2_entreprises_nouvelles:
    hors_legi: >-
      Même accord de 1996 que la tranche 2 de l'Arrco, hors JORF ; le barème des
      entreprises créées après 1997 est lu dans OpenFisca-France.
