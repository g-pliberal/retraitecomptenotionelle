      Accords du 8 décembre 1961 et du 25 avril 1996 entre partenaires
      sociaux, hors JORF ; le taux de la tranche 2 est lu dans OpenFisca-France
      (barème des entreprises adhérentes avant 1997).
  agirc_arrco:
    hors_legi: >-
      Accord national interprofessionnel du 17 novembre 2017, étendu par
      l'arrêté du 24 avril 2018 (JORFTEXT000036847920) qui n'en reprend pas
      le texte ; barème et coefficients lus chez la fédération.
