code: enseignants_prive_additionnel
rang: 210
nom: >-
  Régime additionnel de retraite des maîtres de l'enseignement privé sous contrat (RAFEP)
famille: special
source_id: legifrance_textes
fiabilite: estimee
creation: 2005
fermeture: null
extinction: null
succede_a: []
integre_dans: null
population: >-
  Maîtres et documentalistes des établissements d'enseignement privés sous
  contrat, rémunérés par l'État (L. 914-1 du code de l'éducation, L. 813-8
  du code rural) : salariés de droit privé affiliés au régime général et à
  l'Agirc-Arrco, la loi n° 2005-5 du 5 janvier 2005 leur ajoute cet étage
  pour rapprocher leur pension de celle des enseignants publics.
hors_repartition: false
periodes:
  - debut: 2005
    fin: 2012
    type_calcul: points
    age_ouverture: 62
    age_ouverture_par_generation: true
    age_taux_plein: 67
    age_taux_plein_par_generation: true
    duree_requise_trimestres: 172
    duree_requise_par_generation: true
    taux_plein: 1.0
    salaire_reference: carriere_entiere
    assiette: deplafonnee
    taux_cotisation_retraite: 0.0150
    part_salariale: 0.50
    decote_par_trimestre: null
    surcote_par_trimestre: null
    avantages_non_contributifs: [reversion]
    notes: >-
      UN ÉTAGE EN RÉPARTITION, CALCULÉ EN FRACTION DES AUTRES PENSIONS. La
      pension additionnelle vaut une fraction « des sommes perçues au
      titre des pensions de vieillesse des régimes de base et
      complémentaire obligatoires » (décret n° 2005-1233, art. 7) : 5 %
      pour les départs de 2005, 7 % de 2006 à août 2010, 8 % ensuite, et
      depuis le décret n° 2013-145 « 8 % pondéré […] du rapport entre la
      durée des services effectués après le 31 août 2005 et la durée
      totale des services » plus « 2 % pondéré » de la part antérieure
      (LEGIARTI000027090124). Le moteur ne sait pas asseoir un régime sur
      les pensions des autres : la fiche convertit les cotisations par le
      rendement de `rendements_points.csv` — 8 % de 70 % de remplacement
      font 5,6 % du salaire pour 3 % cotisés sur toute une carrière, 4,5
      centimes de rente par euro ; pour les départs d'ici 2035, où la
      fraction porte sur une carrière entière quand les cotisations n'ont
      couru que depuis 2005, le rendement est près du double. Niveau
      `estimee`. ASSIETTE : « les éléments de rémunération perçus de
      l'État » (art. 2, LEGIARTI000006436188), sans plafond. Les droits
      sont liquidés avec la pension de base, sans décote propre : la
      fraction porte sur des pensions déjà minorées. TAUX : « à compter du
      1er septembre 2005 à 0,75 % de la rémunération brute versée par
      l'État » pour la cotisation patronale, autant pour la salariale
      (arrêté du 28 juillet 2006, art. 1, LEGIARTI000006253469, jusqu'au
      21 février 2013).
