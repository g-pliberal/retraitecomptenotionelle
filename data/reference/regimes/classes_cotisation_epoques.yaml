# Cotisations par classes : la grille de chaque époque, lue dans les textes
# -----------------------------------------------------------------------
# source_id: cipav_fiches_pratiques
#
# Action 131, 14 octobre 2026. `classes_cotisation.csv` porte les grilles que
# les caisses publient entières, bornes et montants ; ce fichier-ci porte ce
# que les TEXTES fixent pour les autres exercices, et le chargeur
# (`ClassesCotisation`) en déplie une grille par exercice, que le paquet
# transmet au portage tel quel. Une grille entière publiée pour un exercice
# l'emporte toujours sur celle que ce fichier reconstitue.
#
# TROIS PIÈCES PAR GRILLE.
#
# 1. LES CLASSES, par époque : l'article 2 du décret de la section, rédaction
#    par rédaction, donne les points de chaque classe. Le montant de chaque
#    classe est un multiple de celui de la classe de référence, que le décret
#    annuel fixe : `multiples` à la Cipav, dont l'article l'écrit (« deux,
#    trois, cinq, sept et dix fois le montant de la cotisation de la
#    classe 1 ») ; `points`, rapportés à `points_reference`, à la CAVEC, dont
#    l'article ne donne que les points et dont chaque classe coûte le même
#    prix du point (2022 : 670 € pour 48 points, 20 925 € pour 1 500, à
#    0,1 % près).
#
# 2. LE MONTANT DE LA CLASSE DE RÉFÉRENCE, exercice par exercice : le décret
#    annuel des cotisations des complémentaires libérales, lu dans les index
#    LEGI et JORF du dépôt (`montants`, francs convertis à 6,55957). Un
#    exercice dont le décret n'est pas lu prend le montant lu le plus proche
#    qui le précède dans la même époque, ramené au rapport des plafonds de la
#    Sécurité sociale, ou, avant le premier, le premier ainsi ramené : sa
#    fiabilité est alors `estimee`. Les `montants` d'une époque ne servent
#    qu'à elle ; ceux du régime, à toutes ses époques qui n'en ont pas. La
#    CAVEC a changé d'échelle entre 2007 (2 184 € les 48 points de la
#    classe 4) et 2009 (480 € les 48 points de la classe A) : ses montants
#    sont par époque.
#
# 3. LES BORNES DE REVENU : aucun texte publié au Journal officiel ne les
#    porte, les statuts les renvoient au conseil d'administration. Celles que
#    la caisse publie sont dans `bornes` ; pour un autre exercice, ce sont les
#    bornes publiées les plus proches qui le précèdent, ou les premières pour
#    un exercice antérieur, ramenées au rapport des plafonds, et `estimee`.
#    Une époque qui a moins de classes que la grille publiée en prend les
#    premières bornes, RANG POUR RANG, sa dernière classe allant au-delà :
#    c'est une convention, que rien ne publie, et la fiche
#    `cotisation_par_classes_liberales` la déclare.
#
# La CARPV de 1998 à 2015, dont les classes sont écrites en actes médicaux
# vétérinaires, que rien ne publie en euros, a sa propre convention : le taux
# d'appel de chaque décret annuel, sur un acte tiré de la valeur d'achat du
# point de 2016 (action 131, 16 octobre 2026 ; voir son bloc).
#
# Ce que ce fichier ne porte pas : la CARPV d'avant 1998, en actes selon
# l'âge, sans égard au revenu ; la CAVEC d'avant 1980, dont le décret de 1953
# fait opter l'assujetti sans nommer le revenu. L'une et l'autre gardent la
# grille la plus ancienne ramenée.

