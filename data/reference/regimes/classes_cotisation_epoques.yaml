    2024: [75104, 100140]

# L'ANNÉE DE REVENU ET LA CLASSE DE DÉBUT D'ACTIVITÉ
# ---------------------------------------------------
# `annee_de_revenu` : l'exercice range l'assuré sur le revenu de l'année
# qu'il précède de `decalage` ans (1, l'année précédente ; 2,
# l'avant-dernière), le revenu que la carrière porte dans ce régime cette
# année-là, nul s'il n'y était pas. Hors de ces bornes, l'année même : c'est
# le cas d'un texte qui n'est pas lu (Cipav avant 2016, CAVEC avant 2008).
# `classe_de_debut` : les `annees` premières années civiles d'activité dans le
# régime, la première comprise, l'assuré cotise dans la classe de rang
# `rang` (0, la première de la grille), quel que soit son revenu.
regles:
  cipav_complementaire:
    # Statuts approuvés par l'arrêté du 18 décembre 2015, en vigueur le 1er
    # janvier 2016, article 3.4 (JORFARTI000031680320) : classe provisoire
    # sur l'avant-dernière année, « ajustée » dès que le revenu de la dernière
    # est connu ; « inscrit d'office en classe A jusqu'au premier jour de la
    # deuxième année civile qui suit le début de l'activité ». Depuis 2021,
    # la régularisation se fait sur le revenu de l'année même (fiche pratique
    # de 2021), et la classe A de début n'est plus que provisionnelle (arrêté
