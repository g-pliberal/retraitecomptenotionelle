      retraite complémentaire est servie sans abattement dès soixante ans
      à qui a le taux plein au régime de base. Jusque-là, le taux plein
      était à soixante-cinq ans et toute anticipation abattue à l'âge seul
      — c'est ce que portent les périodes antérieures, sans durée requise.
      La durée est désormais lue à la génération, comme au régime de base,
      ce qui porte aussi Balladur, Fillon et Touraine ; l'âge d'ouverture
      l'est aussi.

