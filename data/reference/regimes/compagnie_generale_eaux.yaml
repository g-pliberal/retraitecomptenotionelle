code: compagnie_generale_eaux
nom: >-
  Régime spécial de sécurité sociale du personnel de la Compagnie générale des eaux
famille: special
population: >-
  Salariés de la Compagnie générale des eaux qui relevaient, avant 1991,
  de son régime spécial d'assurance maladie, maternité, invalidité,
  vieillesse et décès — un régime antérieur à la sécurité sociale, maintenu
  par l'article 61 du décret n° 46-1378 puis par le 9° de R. 711-1 du code
  de la sécurité sociale, et servi par la caisse de retraites de la
  compagnie. Le régime prend fin au 1er janvier 1991 (loi n° 91-73,
  article 17) : les pensions en cours et les droits non liquidés
  deviennent des rentes du régime général, forfaitaires et proportionnelles
  à la durée validée depuis le 1er juillet 1930, et la compagnie verse au
  régime général une contribution de 40 millions de francs.
creation: null
fermeture: 1990
extinction: null
