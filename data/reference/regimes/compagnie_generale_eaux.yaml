  manque: >-
    Aucun statut ne porte le salarié de la compagnie : ses années d'avant
    1991 sont simulées au régime général comme celles d'un salarié du
    privé, quand la loi les lui rend en rente forfaitaire — 64 650 F par an
    pour cent cinquante trimestres validés, en cent-cinquantièmes
    au-dessous, revalorisée comme les pensions du régime général. Ne sont
    pas lus : les avantages que la compagnie sert au-delà, par une
    institution de prévoyance et un accord d'entreprise substitué à la
    convention collective du 22 mai 1969 qui réglait le régime spécial
    (IV de l'article 17) ; l'extension de la convention de 1947 à la
    compagnie (arrêté du 2 novembre 1992) ; la pension du régime spécial
    des salariés partis avant 1991. La fiche
    `compagnie_generale_eaux_transfert_1991` décrit les rentes.
