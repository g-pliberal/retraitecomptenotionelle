    notes: >-
      TROIS ENFANTS, POUR LES PRESTATIONS LIQUIDÉES DEPUIS 1981. « Le
      montant des prestations complémentaires liquidées avec une date
      d'effet postérieure au 31 décembre 1980 est majoré de 10 % au profit
      des allocataires ayant eu au moins trois enfants » (règlement du
      régime des prestations complémentaires de vieillesse des médecins,
      article 8, approuvé par l'arrêté du 10 juillet 2026,
      JORFTEXT000054435848). La fiche n'en portait aucune ; la période de
      1972 à 1984 est coupée en 1981 pour la servir à sa date. Lu le 23
      septembre 2026 (action 89).
      FORFAIT : « A COMPTER DU 01-07-1981, LA COTISATION DES MEDECINS
      CONVENTIONNES A CE REGIME EST APPELEE A CONCURRENCE DE 75% AU LIEU DE
      60% » (décret n° 81-274, résumé du Journal officiel,
      JORFTEXT000000685106 ; décret n° 72-968, article 6,
      LEGIARTI000006765951), sur « TRENTE FOIS » le tarif de la consultation
      : 22,5 consultations, 1 687,50 F à 75 F, 257,26 € de 1985 ramenés aux
      prix ; les caisses versent le double, « dans des conditions identiques
      ». L'année 1981, appelée à 60 % jusqu'au 30 juin, est prise à 75 %.
      Jusqu'au 14 novembre 2026 la fiche n'en portait que dix consultations
      (action 130).
