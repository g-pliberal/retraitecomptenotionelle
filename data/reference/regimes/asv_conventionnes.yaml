succede_a: []
integre_dans: null
population: >-
  Médecins libéraux conventionnés (secteur 1 et, à leurs frais, secteur
  2). Troisième étage obligatoire depuis le décret n° 72-968 du 27 octobre
  1972, financé aux deux tiers par les caisses d'assurance maladie ; il
  pèse près du tiers de la pension d'un médecin de secteur 1. Les
  chirurgiens-dentistes, sages-femmes, auxiliaires médicaux et directeurs
  de laboratoire ont chacun leur décret et leur barème (2007-458,
  2017-1812, 2007-597) : la fiche ne porte que les médecins, voir
  l'inventaire.
