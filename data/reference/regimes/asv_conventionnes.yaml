      part patronale depuis le 14 octobre 2026 (action 138, étape 18). FORFAIT : «
      trente fois la valeur au 1er janvier de l'année en cause du tarif de
      la consultation du médecin omnipraticien » (D. 645-2,
      LEGIARTI000006738371 au 21 décembre 1985, LEGIARTI000006738372
      jusqu'au 30 mars 1993). C'est la cotisation du médecin, et non
      le total, et elle est « appelée à concurrence de 75 p. 100 » (décret
      n° 72-968, article 6, LEGIARTI000006765951) : 22,5 consultations. Le
      tarif C n'est pas une série du dépôt : 75 F en 1985, d'où 1 687,50 F,
      257,26 € de 1985 ramenés aux prix ; le tarif a monté plus vite que
      les prix sur la période, la fiche sous-estime donc un peu le forfait.
      Jusqu'au 14 novembre 2026 la fiche prenait les trente consultations
      pour le total et n'en donnait que le tiers au médecin, 114,34 €
      (action 130). POINTS : «
      30,16 points de retraite pour les périodes de cotisation comprises
      entre le 1er juillet 1972 et le 31 décembre 1993 », « au prorata du
      nombre de trimestres cotisés » (décret n° 72-968, art. 2,
      LEGIARTI000024871109) — soit 7,54 points par trimestre validé, sans
      égard au revenu. VALEUR DE SERVICE : 15,55 € au premier semestre
      2012 pour tous les points (décret n° 2011-1644, art. 4,
      LEGIARTI000024853556), prise pour valeur de 2011 et ramenée aux prix
      de l'année de liquidation ; aucune valeur antérieure n'est dans
      l'index, niveau `estimee`. DURÉE
      D'EXERCICE (`exercice_minimum_annees`, sur chaque période depuis
      celle-ci) : la prestation « est attribuée aux médecins ayant exercé,
      pendant au moins un an, leur activité professionnelle non-salariée
      dans le cadre des conventions » (décret n° 72-968, art. 7,
      LEGIARTI000006765959 depuis le 15 février 1985, LEGIARTI000054168425
      depuis le 1er juillet 2026) ; avant, dix ans (décret n° 71-542, art.
      7, LEGIARTI000006766682), que la fiche ne porte pas. Le modèle ne
      posait aucune durée jusqu'au 14 novembre 2026 (action 130).
