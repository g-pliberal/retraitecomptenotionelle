    notes: >-
      LA PART DU MÉDECIN PASSE À LA MOITIÉ. Du 30 mars 1993 au 8 juillet
      1994 la cotisation des caisses « est égale à la cotisation exigible
      des bénéficiaires pratiquant les tarifs conventionnels pour les
      médecins » (D. 645-3, LEGIARTI000006738167). D. 645-2 portait la
      cotisation du médecin, et non le total, à « quarante-cinq fois la
      valeur […] du tarif de la consultation » (LEGIARTI000006738373), que
      le décret n° 94-564 a remplacée après coup : « Pour l'exercice 1993 et
      par dérogation au 1° de l'article D. 645-2 du code de la sécurité
      sociale, la cotisation est fixée à 43,333 2 fois la valeur au 1er
      janvier 1993 du tarif de la consultation », « appelée à concurrence de
      100 p. 100 » (décret n° 72-968, article 6, LEGIARTI000006765957 ; la
      loi n° 96-452, article 33, valide ces appels) : 43,3332 × 100 F =
      4 333,32 F = 660,61 € pour le médecin, et autant pour les caisses :
      le décret de 1994 ne dit pas ce qu'elles doivent pour 1993, et la
      fiche garde l'égalité du texte en vigueur cette année-là.
      Jusqu'au 14 novembre 2026 la fiche prenait quarante-cinq consultations
      pour le total et en donnait la moitié au médecin, 343,01 € (action
      130). POINTS : «
      30,16 points de retraite pour les périodes de cotisation comprises
      entre le 1er juillet 1972 et le 31 décembre 1993 », « au prorata du
      nombre de trimestres cotisés » (décret n° 72-968, art. 2,
      LEGIARTI000024871109) — soit 7,54 points par trimestre validé, sans
      égard au revenu. VALEUR DE SERVICE : 15,55 € au premier semestre
      2012 pour tous les points (décret n° 2011-1644, art. 4,
      LEGIARTI000024853556), prise pour valeur de 2011 et ramenée aux prix
