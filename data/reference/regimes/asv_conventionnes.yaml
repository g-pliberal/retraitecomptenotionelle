    notes: >-
      LA FICHE PORTE LA PART DU MÉDECIN SEULE. Le statut `medecin_liberal`
      est `sans_employeur` : le moteur porte au compte tout ce que la
      fiche écrit, sans part patronale. Or les caisses d'assurance maladie
      versent une cotisation égale au DOUBLE de celle du médecin (D.
      645-3, LEGIARTI000006738166 dès 1985, LEGIARTI000006738169 dès 1995)
      : le forfait et le taux de la fiche valent donc un tiers du total,
      et la part des caisses est décrite ici, non comptée. FORFAIT : le
      décret n° 72-968 renvoie la cotisation à un arrêté que l'index ne
      porte pas ; la première version codifiée est celle de 1985, « trente
      fois la valeur au 1er janvier de l'année en cause du tarif de la
      consultation du médecin omnipraticien » (D. 645-2,
      LEGIARTI000006738371), soit, à 75 F la consultation, 2 250 F par an
      dont un tiers pour le médecin — 114,34 € de 1985, projetés en
      arrière sur les prix. POINTS : « 30,16 points de retraite pour les
      périodes de cotisation comprises entre le 1er juillet 1972 et le 31
      décembre 1993 », « au prorata du nombre de trimestres cotisés »
      (décret n° 72-968, art. 2, LEGIARTI000024871109) — soit 7,54 points
      par trimestre validé, sans égard au revenu. VALEUR DE SERVICE :
      15,55 € au premier semestre 2012 pour tous les points (décret n°
      2011-1644, art. 4, LEGIARTI000024853556), prise pour valeur de 2011
      et ramenée aux prix de l'année de liquidation ; aucune valeur
      antérieure n'est dans l'index, niveau `estimee`.
