      : le forfait et le taux de la fiche valent donc un tiers du total,
      et la part des caisses est décrite ici, non comptée. LA RÉFORME DE
      2012 (décret n° 2011-1644 du 25 novembre 2011). Le forfait quitte le
      tarif de la consultation : « 2 070 euros pour le premier semestre de
      l'exercice 2012 ; 2 230 euros pour le second semestre » (art. 1,
      LEGIARTI000024853551), soit 4 300 € dont un tiers pour le médecin.
      Une COTISATION D'AJUSTEMENT proportionnelle s'y ajoute, « dans la
      limite de cinq fois le plafond » (art. 2, LEGIARTI000033090911) —
      0,25 % en 2012, un tiers pour le médecin — qui ouvre « un nombre de
      points supplémentaires […] dans la limite de neuf points par an »
      égal à ajustement × 18 / forfait (art. 3, LEGIARTI000024853554). Les 27 points du forfait sont portés par `points_par_trimestre_valide` (6,75
      par trimestre), ceux de l'ajustement par
      `points_ajustement_par_forfait` et `points_ajustement_maximum` : 18
      fois la cotisation d'ajustement divisée par le forfait, neuf au
      plus. Le rapport est le même sur la part du médecin et sur le total,
      puisque les caisses paient deux fois chacune des deux. La calculette
      de la CARMF le vérifie en 2026 : 28,25 points à 10 000 € de revenu,
      33,02 à 48 060 €, 35,76 à 70 000 €, 36 au-delà. En 2012 l'ajustement
      à 0,25 % n'ouvre qu'un point environ. VALEUR DE SERVICE : « s'agissant des points liquidés à
      compter du 1er janvier 2011 : […] 13 euros à compter du second
      semestre de l'exercice 2012 » (art. 4, LEGIARTI000024853556).
