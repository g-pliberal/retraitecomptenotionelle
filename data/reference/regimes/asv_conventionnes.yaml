    - {reference: "décret n° 72-968 du 27 octobre 1972, article 2 (points par année cotisée)", id: LEGIARTI000024871109}
    - {reference: "code de la sécurité sociale, D. 645-2 (cotisation en multiples du tarif de la consultation) et D. 645-3 (part des caisses d'assurance maladie)", id: LEGIARTI000006738166}
    - {reference: "décret n° 2011-1644 du 25 novembre 2011 (forfait en euros, cotisation d'ajustement, valeur de service)", id: LEGIARTI000033090911}
    - {reference: "décret n° 2007-458 du 25 mars 2007 (chirurgiens-dentistes : forfait de 3 150 à 3 900 €, dix points, ajustement 1,45 %)", id: LEGIARTI000034762381}
    - {reference: "décret n° 2017-1812 du 28 décembre 2017 (sages-femmes) et décret n° 2007-597 du 24 avril 2007 (directeurs de laboratoire : 0,30 %, cinquante points, point à 0,96 €)", id: LEGIARTI000026885155}
  manque: >-
    La fiche porte les médecins ; les auxiliaires médicaux et les
    chirurgiens-dentistes ont la leur depuis le 14 octobre 2026
    (asv_auxiliaires_medicaux, asv_chirurgiens_dentistes, action 138,
    étape 18), et les sages-femmes et les directeurs de laboratoire depuis
    le même jour (asv_sages_femmes, asv_directeurs_laboratoire). En secteur
    1, les caisses paient les deux tiers, que le compte notionnel reçoit
    comme une part patronale ; en secteur 2, statut à part depuis le même
    jour, le médecin paie tout, et le compte le porte comme sa cotisation. Les points d'ajustement sont pris au
    plafond de neuf par an, atteint dès 68 000 € de revenu. Le forfait de
    2017 à 2024, revalorisé sur le revenu moyen des médecins, est projeté
    sur les prix depuis 2016. Le tarif de la consultation, base du forfait
    jusqu'en 2011, n'est pas une série du dépôt : la fiche le prend à 75 F
    en 1985, 100 F en 1993, 1994 et 1995, 110 F en 1999 et 20 € en 2004, et
    le porte par les prix entre ces années.
