    notes: >-
      LA FICHE PORTE LA PART DU MÉDECIN SEULE. Le statut `medecin_liberal`
      est `sans_employeur` : le moteur porte au compte tout ce que la
      fiche écrit, sans part patronale. Or les caisses d'assurance maladie
      versent une cotisation égale au DOUBLE de celle du médecin (D.
      645-3, LEGIARTI000006738166 dès 1985, LEGIARTI000006738169 dès 1995)
      : le forfait et le taux de la fiche valent donc un tiers du total,
      et la part des caisses, que disent `part_assurance_maladie_forfait`
      et `part_assurance_maladie_taux`, est portée au compte comme une
      part patronale depuis le 14 octobre 2026 (action 138, étape 18). FORFAIT :
      la cotisation du médecin est à l'article 1er, a, du décret n° 71-544,
      dont l'index ne porte pas les rédactions d'avant 1981 ; le résumé du
      décret n° 81-274 (JORFTEXT000000685106) la dit de « TRENTE FOIS LA
      VALEUR AU 1 JANVIER DE L'ANNEE EN COURS DU TARIF DE LA CONSULTATION »
      et appelée à 60 % jusqu'au 30 juin 1981. Faute du multiple d'avant
      1981, la fiche prend trente fois à 60 %, dix-huit consultations : à
      75 F la consultation de 1985, 1 350 F, 205,81 € de 1985, projetés en
      arrière sur les prix ; les caisses versent le double. Jusqu'au 14
      novembre 2026 la fiche prenait trente consultations pour le total et
      n'en donnait que le tiers au médecin (action 130). POINTS : « 30,16 points de retraite pour les
      périodes de cotisation comprises entre le 1er juillet 1972 et le 31
      décembre 1993 », « au prorata du nombre de trimestres cotisés »
      (décret n° 72-968, art. 2, LEGIARTI000024871109) — soit 7,54 points
      par trimestre validé, sans égard au revenu. VALEUR DE SERVICE :
      15,55 € au premier semestre 2012 pour tous les points (décret n°
      2011-1644, art. 4, LEGIARTI000024853556), prise pour valeur de 2011
      et ramenée aux prix de l'année de liquidation ; aucune valeur
      antérieure n'est dans l'index, niveau `estimee`.
