      chaque année en fonction de l'évolution constatée du revenu moyen »
      des médecins (art. 1, LEGIARTI000024853551) — la fiche le ramène sur
      les prix, faute de cette série. Ajustement « 2,60 % au titre de
      l'exercice 2016 » ; neuf points d'ajustement au plus, selon le revenu. VALEUR DE SERVICE : « s'agissant des points
