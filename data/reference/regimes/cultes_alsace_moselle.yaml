code: cultes_alsace_moselle
nom: >-
  Pensions des ministres des cultes rétribués par l'État en Alsace-Moselle (loi locale du 15 novembre 1909)
famille: fonction_publique
population: >-
  Ministres des cultes reconnus du Bas-Rhin, du Haut-Rhin et de la Moselle
  (curés, desservants, vicaires, pasteurs, rabbins) et employés des
  secrétariats des autorités religieuses, rémunérés par le ministère de
  l'intérieur : 2 400 ministres en 1970, 1 397 personnes rémunérées par
  l'État fin 2014 (Observatoire de la laïcité, avis de mai 2015). Ils ne
  sont pas fonctionnaires (Conseil d'État, avis du 27 août 1948), mais
  leur pension, servie par l'État sans cotisation, suit la loi locale du
  15 novembre 1909, que la réforme de 2023 n'a pas touchée.
creation: 1909
fermeture: null
extinction: null
