      du 13 janvier 1989, lu sur Légifrance (JORFTEXT000000321867) : « le
      taux de la retenue prévu à l'article L. 61 […] est majoré d'un
      point », applicable « aux traitements et soldes perçus au titre de la
      période postérieure au 31 décembre 1988 » — 8,9 % dès le 1er janvier
      1989, comme OpenFisca le date. La fiche s'arrêtait à la version de
      L. 61 que LEGI date du 30 décembre 1989, et servait 7,9 % un an de
      trop ; le contrôle de vraisemblance ne signale plus d'écart.
