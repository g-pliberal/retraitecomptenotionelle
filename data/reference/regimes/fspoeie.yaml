      au décret. La baisse du 1er février 1991 ne commande donc que 1992 :
      1991 porte encore 8,9 %, comme le régime général porte encore ses
      15,8 % cette année-là. Compter 7 % de 1992 à 2003, c'est oublier un
      huitième de la cotisation pendant douze ans : le scénario 1 n'en
      dépend pas, le compte notionnel en dépend entièrement.
