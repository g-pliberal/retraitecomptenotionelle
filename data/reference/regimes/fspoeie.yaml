    surcote_par_trimestre: null
    avantages_non_contributifs:
      [bonifications, categorie_active, majoration_enfants, reversion]
    notes: >-
      RÉGIME ALIGNÉ SUR LE CODE DES PENSIONS, et la fiche ne l'était pas. Les
      pensions des ouvriers des établissements industriels de l'État sont
      calculées selon les mêmes règles que celles des fonctionnaires — deux
      pour cent par annuité, trente-sept annuités et demie, traitement des six
      derniers mois —, avec un fonds distinct géré par la Caisse des dépôts.
      La fiche portait deux périodes, 1930-2003 et 2004 à aujourd'hui : la
      seconde appliquait à un ouvrier parti en 2005 la retenue pour pension de
      2023, 11,10 %, quand elle valait alors 7,85 %.
      Les périodes qui suivent sont celles de la fonction publique d'État,
      reprises une à une : 1948 (code des pensions), 1964, 2004 (loi Fillon),
      2009, 2011, 2023. La majoration pour trois enfants y entre au passage :
      elle est au code des pensions, elle s'applique aux ouvriers d'État, et la
      fiche ne la portait pas.
