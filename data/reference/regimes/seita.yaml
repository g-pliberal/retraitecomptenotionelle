      fiche servait à tous l'âge des ouvrières ; elle sert désormais celui
      de droit commun, et l'anticipation féminine reste hors du modèle.
      C'est la rédaction ENCORE EN VIGUEUR : ni 2010, ni 2014, ni 2023 n'ont
      touché cet article — un agent de la SEITA garde soixante ans.
      DEUX POUR CENT PAR ANNUITÉ, SOIXANTE-QUINZE POUR CENT AU PLUS
      (article 118), et une majoration pour enfants que la fiche ignorait :
      « pour les titulaires ayant élevé au moins trois enfants jusqu'à l'âge
      de seize ans, la pension est majorée de 10 % pour les trois premiers
      enfants et de 5 % par enfant au-delà du troisième ».
      LES ÉMOLUMENTS DE BASE NE SONT PAS LES SIX DERNIERS MOIS mais « une
      fraction du traitement statutaire LE PLUS ÉLEVÉ acquis par l'agent au
      cours d'une durée consécutive de trois ans » (article 117). Le moteur
      ne sait pas exprimer cette règle ; il lui oppose celle de la fonction
      publique, qui en est proche et légèrement plus favorable.
      LE TAUX DE RETENUE EST DATÉ, et la fiche en portait un seul.
      L'article 108 du décret n° 62-766 le fixe à 7,7 % au 1er janvier
      1984, à 7,9 % au 1er juillet 1987, à 8,9 % au 30 décembre 1988, puis
      — depuis le 2 février 1995 — « à un taux égal au taux de la retenue
      pour pension définie à l'article L. 61 du code des pensions civiles
      et militaires de retraite », d'où l'alignement sur la fonction
      publique à partir de cette date. Avant 1984, la base LEGI ne porte
      aucune version : les 7 % de la fonction publique de l'époque
      tiennent lieu d'estimation.
