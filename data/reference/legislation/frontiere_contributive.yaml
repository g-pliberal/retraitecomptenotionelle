# La liste légale, poste par poste, confrontée à l'inventaire du dépôt
# ====================================================================
# L'article L. 222-2-1 du code de la sécurité sociale, en vigueur au 1er
# janvier 2026, est la liste que le LÉGISLATEUR tient de ce qu'il reconnaît
# comme non contributif — il emploie l'expression en propres termes à son 8°.
# L'inventaire du dépôt, lui, est né des trois listes internes et a été
# complété de ce qu'elles ne portaient pas. Les deux ne se recouvrent pas, et
# l'écart se lit dans les deux sens.
#
# CE QUE LA LISTE LÉGALE IGNORE, et ce n'est pas un oubli : la réversion, les
# bonifications de service, les départs anticipés, les minima de pension. Elle
# ne porte que ce qui donne lieu à un TRANSFERT entre organismes. Un avantage
# qu'un régime sert sur ses propres deniers n'y a pas sa place, si lourd
# soit-il. C'est la raison pour laquelle l'inventaire du dépôt existe.
#
# CE QUE L'INVENTAIRE IGNORAIT, et cela, c'en était un : chaque poste ci-dessous
# porte `avantages`, les codes de l'inventaire qui le servent, ou `manque` avec
# la raison. Un test exige l'un ou l'autre — un blanc sans raison est une dette.
liste_legale:
  article: L. 222-2-1 CSS
  version: LEGIARTI000051288889
  lu_le: 2026-09-21
  # Les articles lus POUR combler les deux dettes de la confrontation. Ils ne
  # datent aucune bascule — ils fondent deux lignes de l'inventaire —, mais ce
  # fichier ne cite rien qu'il ne puisse opposer : la sonde vérifie ces
  # versions comme les autres.
  lectures:
    - article: L. 6243-3 code du travail
      version: LEGIARTI000051289076
      date: 2026-01-01
      quoi: >-
        « La branche mentionnée au 3° de l'article L. 200-2 du code de la
        sécurité sociale prend à sa charge, dans des conditions fixées par
        décret, le versement d'un complément de cotisations d'assurance
        vieillesse afin de valider auprès des régimes de base un nombre de
        trimestres correspondant à la durée du contrat d'apprentissage. »
        C'est la base légale de la ligne `apprentissage` de l'inventaire.
    - article: L. 351-7-1 CSS
      version: LEGIARTI000053612584
      date: 2017-01-01
      quoi: >-
        « Les services militaires actifs accomplis en Afrique du Nord […]
        ouvrent droit à une réduction de la durée d'assurance, ou de périodes
        reconnues équivalentes, requise pour bénéficier du taux plein. » C'est
        la base légale de la ligne `reduction_duree_afrique_du_nord`, et la
        version est TOUJOURS EN VIGUEUR alors que le poste qui la finançait est
        abrogé.
  postes:
    - numero: "1°"
      quoi: >-
        Le financement des allocations du minimum vieillesse — dernier alinéa
        de L. 643-1, chapitre V du titre Ier du livre VIII, article 2 de
        l'ordonnance n° 2004-605 du 24 juin 2004.
      avantages: [minimum_vieillesse]
      manque: null

    - numero: "2°"
      quoi: >-
        La prise en compte dans la durée d'assurance des périodes des 1°, 3° et
        8° de L. 351-3 — maladie, maternité, invalidité, accident du travail,
        chômage non indemnisé, stages de formation professionnelle —, des
        périodes d'allocations de chômage et d'activité partielle, et du revenu
        de remplacement versé par l'entreprise.
      avantages: [periodes_assimilees]
      manque: null
      note: >-
        LA LISTE DES PÉRIODES FINANCÉES N'EST PAS CELLE DES PÉRIODES VALIDÉES.
        L. 351-3 en compte neuf ; le 2° n'en vise que trois, plus les
        allocations. Restent à la charge des régimes, sans transfert : les
        périodes de guerre (5°), la détention provisoire (6°), les sportifs de
        haut niveau (7°) et les travaux d'utilité collective (9°). Un droit
        gratuit sans payeur nommé est un droit qu'aucune série ne chiffrera.

    - numero: "3°"
      quoi: >-
        Abrogé. Portait, jusqu'à la suppression du fonds, « les sommes
        correspondant à la prise en compte par le régime général et le régime
        des salariés agricoles des réductions de la durée d'assurance ou de
        périodes reconnues équivalentes, définies à l'article L. 351-7-1 ».
      avantages: [reduction_duree_afrique_du_nord]
      manque: null
      note: >-
        LA DETTE EST COMBLÉE, et la lecture a corrigé ce qu'on en croyait.
        L. 351-7-1 ne porte pas des « périodes équivalentes » génériques : il
        vise les services militaires actifs accomplis en AFRIQUE DU NORD, et
        leur ouvre une réduction de la durée requise pour le taux plein.
        L'article est toujours en vigueur alors que le poste qui le finançait
        est abrogé.

    - numero: "4°"
      quoi: >-
        Les dépenses du I de l'article 49 de la loi n° 2002-73 du 17 janvier
        2002 : la branche verse aux organismes de l'article L. 921-4 —
        c'est-à-dire à l'Agirc-Arrco — les cotisations dues au titre des
        périodes de préretraite du Fonds national pour l'emploi, de préretraite
        progressive, d'allocation de solidarité spécifique et d'allocation
        équivalent retraite.
      avantages: [points_gratuits_complementaires]
      manque: null
      note: >-
        C'est le seul poste de la liste qui finance une COMPLÉMENTAIRE, et il
        est passé inaperçu jusqu'ici : l'inventaire rattache les points gratuits
        aux accords Agirc-Arrco, sans voir qu'une partie d'entre eux est payée
        par la branche vieillesse sous un article de loi.

    - numero: "5°"
      quoi: >-
        La prise en compte des périodes de volontariat du service national.
      avantages: [service_national]
      manque: null

    - numero: "6°"
      quoi: >-
        L'allocation spéciale pour les personnes âgées de Mayotte et la prise
        en compte des périodes de l'article 8 de l'ordonnance n° 2002-411.
      avantages: []
      manque: >-
        extension territoriale du minimum vieillesse et des périodes
        assimilées, et non un dispositif distinct. Le catalogue des régimes
        porte Mayotte ; l'inventaire des avantages n'a pas à le dédoubler

    - numero: "7°"
      quoi: >-
        La prise en charge du second alinéa de l'article L. 6243-3 du code du
        travail : ce qui manque à l'assiette forfaitaire de l'apprenti pour
        valider ses trimestres.
      avantages: [apprentissage]
      manque: null
      note: >-
        LA DETTE EST COMBLÉE. Le second alinéa de L. 6243-3 fait verser « un
        complément de cotisations d'assurance vieillesse afin de valider auprès
        des régimes de base un nombre de trimestres correspondant à la durée du
        contrat d'apprentissage ». Le droit n'est pas dans le code de la
        sécurité sociale mais dans celui du travail : c'est pourquoi les trois
        listes internes du dépôt, qui décrivent ce que le modèle sait faire, ne
        pouvaient pas le trouver.

    - numero: "8°"
      quoi: >-
        Le remboursement à la caisse de Saint-Pierre-et-Miquelon des « avantages
        non contributifs mentionnés aux 1° à 5° et 7° du présent article ».
        C'est ici, et nulle part ailleurs, que le législateur emploie
        l'expression en propres termes après la suppression de L. 135-1.
      avantages: []
      manque: >-
        extension territoriale, comme le 6°. Sa valeur est ailleurs : c'est le
        dernier endroit du code où l'expression « avantages non contributifs »
        survit, et il la définit par renvoi aux sept postes précédents

# Les taux de l'Agirc-Arrco qui n'achètent aucun point
# =====================================================
# Lus le 21 septembre 2026 sur la fiche réglementaire « Taux de cotisations »
# de la fédération, qui est le producteur de la règle. Elle écrit, mot pour
# mot, « Seule cette cotisation est génératrice de droits à retraite
# complémentaire auprès du régime Agirc-Arrco » en parlant de la cotisation au
# taux de calcul des points, et qualifie les deux contributions d'équilibre de
# « non génératrices de droits ». Le critère n'est donc pas une interprétation
# du dépôt : c'est celui du régime.
#
# CES VALEURS NE SONT PAS CERTIFIÉES, et elles ne peuvent pas l'être : elles
# viennent d'un accord national interprofessionnel, qui n'est pas publié au
# Journal officiel et n'entre donc pas dans l'index LEGI. Aucun script ne peut
# les revérifier. Elles sont au niveau d'une SAISIE, avec leur date de lecture
# et l'article de l'ANI que la fiche cite.
taux_agirc_arrco:
  source: https://reglementation.agirc-arrco.fr/home/liste-fiche-reglementaires/listes-area/liste-de-fiches-reglementaires/taux-de-cotisations.html
  lu_le: 2026-09-21
  depuis: 2019-01-01
  pourcentage_appel: 1.27
  article_ani_appel: article 36 de l'ANI
  article_ani_equilibre: article 37 de l'ANI
  tranches:
    - nom: Tranche 1
      taux_calcul_des_points: 0.0620
      taux_appele: 0.0787
      contribution_equilibre_general: 0.0215
    - nom: Tranche 2
      taux_calcul_des_points: 0.1700
      taux_appele: 0.2159
      contribution_equilibre_general: 0.0270
  #: 0,35 % « calculée sur les rémunérations dès le premier euro pour les
  #: salariés dont les revenus excèdent le plafond de la sécurité sociale ».
  #: Elle ne pèse donc que sur les salaires au-dessus du plafond, mais sur la
  #: TOTALITÉ de leur rémunération — la même dissymétrie que la cotisation
  #: déplafonnée du régime général.
  contribution_equilibre_technique: 0.0035

# Ce que le dépôt ne saura jamais certifier, et qui bouge quand même
# ==================================================================
# Les régimes complémentaires vivent d'accords nationaux interprofessionnels,
# que le Journal officiel ne publie pas. L'index LEGI ne les porte pas, et la
# sonde de `scripts/frontiere_contributive.py --verifier` n'a donc rien à quoi
# les confronter. Les exclure serait pourtant absurde : le taux d'appel est,
# de tout le système français, le prélèvement sans contrepartie le plus lourd
# en proportion. Ils vivent donc ici, sous une preuve d'une autre nature —
# une adresse et une date de lecture —, et un test exige les deux.
bascules_hors_legi:

  - code: taux_appel_rabais
    date: 1952-01-01
    face: cotisation
    sens: fertilise
    libelle: Le taux d'appel naît comme un RABAIS, et non comme un supplément
    quoi: >-
      Instauré dès 1952 à l'Agirc, le pourcentage d'appel était à l'origine
      INFÉRIEUR à 100 % — 78 % en 1952, 95 % en 1965 — pour éviter de
      constituer des réserves inutiles. Le cotisant versait alors MOINS que le
      taux contractuel et acquérait les points de ce taux entier : le
      mécanisme jouait en sa faveur. Il reste à 100 % jusqu'en 1978 à l'Agirc.
      C'est le même instrument qui, quarante ans plus tard, prélève sans rien
      donner.
    dispositifs: []
    source: https://www.cor-retraites.fr/sites/default/files/2019-06/doc-1073.pdf
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Le moteur porte la valeur d'achat du point et la valeur de service, non
      le taux d'appel : il calcule les points à partir de la cotisation
      appelée divisée par la valeur d'achat, et la fédération publie cette
      valeur d'achat DÉJÀ nette du taux d'appel. Le résultat est juste ; ce
      qui manque est la lecture — rien ne dit, dans le dépôt, quelle part du
      versement n'achète rien.

  - code: taux_appel_supplement
    date: 1995-01-01
    face: cotisation
    sens: sterilise
    libelle: À 125 %, il devient un prélèvement sans contrepartie
    quoi: >-
      Monté par paliers, le pourcentage d'appel atteint 125 % en 1992 à
      l'Arrco et en 1995 à l'Agirc, et y demeure jusqu'à la fusion. Un
      cinquième du versement cesse alors d'acheter quoi que ce soit. Le
      secrétariat général du COR note que « ce mécanisme est peu connu des
      cotisants ».
    dispositifs: []
    source: https://www.cor-retraites.fr/sites/default/files/2019-06/doc-1073.pdf
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Même remarque : le taux d'appel n'est nulle part dans les données du
      dépôt. `reformes.yaml` le mentionne dans la note d'une réforme de 1994,
      sans table ni valeur.

  - code: contributions_equilibre_2019
    date: 2019-01-01
    face: cotisation
    sens: sterilise
    libelle: La fusion porte le taux d'appel à 127 % et généralise deux contributions sans droits
    quoi: >-
      Au 1er janvier 2019, le pourcentage d'appel passe à 127 % (article 36 de
      l'ANI) et deux contributions d'équilibre « non génératrices de droits »
      (article 37) s'y ajoutent : la CEG, 2,15 % sur la tranche 1 et 2,70 %
      sur la tranche 2, et la CET, 0,35 % dès le premier euro pour les seuls
      salariés dont les revenus excèdent le plafond. Elles étendent à tous les
      salariés du privé ce qui se partageait auparavant entre l'AGFF et la CET
      de l'Agirc, disparues au 31 décembre 2018. La fiche de la fédération
      écrit les trois fois que ces versements n'ouvrent aucun droit.
    dispositifs: []
    source: https://reglementation.agirc-arrco.fr/home/liste-fiche-reglementaires/listes-area/liste-de-fiches-reglementaires/taux-de-cotisations.html
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Sur la tranche 1, un salarié sous le plafond verse 10,02 % et n'en
      acquiert que 6,20 : 38 % du versement complémentaire n'achète aucun
      point. C'est trois fois plus, en proportion, que la part sans
      contrepartie du régime de base.
