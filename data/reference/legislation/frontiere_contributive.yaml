# Ce qui a changé de côté — la frontière contributive, datée
# ==========================================================
# source_id: legifrance_textes
#
# CE QUE CE FICHIER AJOUTE À L'INVENTAIRE
# ---------------------------------------
# `avantages_non_contributifs.yaml` dit CE QUI est non contributif aujourd'hui,
# et porte pour chaque ligne une `creation` et une `fin`. Il décrit donc une
# liste, avec ses bornes. Ce qu'il ne dit pas, c'est que la frontière
# elle-même BOUGE entre ces bornes : un dispositif peut rester en place et
# changer de côté, et il l'a fait des deux sens.
#
# Ce fichier est cette histoire-là. Une entrée par déplacement daté, avec la
# version d'article qui en fait foi.
#
# TROIS FACES, ET ELLES BOUGENT SÉPARÉMENT — c'est tout le sujet
# --------------------------------------------------------------
# « Contributif » désigne trois choses qu'on confond, et dont l'histoire
# montre qu'elles se déplacent l'une sans l'autre :
#
#   droit        Ce que l'assuré ACQUIERT sans avoir cotisé. C'est la face que
#                l'inventaire décrit, et la seule que le modèle calcule.
#   cotisation   Ce que l'assuré ou son employeur VERSE sans rien acquérir.
#                C'est la face symétrique, et le dépôt ne la portait nulle
#                part. Elle est non contributive au même titre, en sens
#                inverse : le lien entre le versement et le droit est rompu
#                du côté du versement.
#   financement  QUI PAIE la charge non contributive, et si elle reste
#                identifiable. Un droit gratuit pour l'assuré peut être payé
#                par une cotisation d'un tiers (la CNAF, l'Unédic), par
#                l'impôt, ou par le régime lui-même — et cela change à droit
#                constant.
#
# La preuve que les trois sont distinctes tient en une ligne de ce fichier :
# les indemnités journalières de maternité entrent au salaire de base en 2010
# (face `droit`), le FSV en prend la charge la même année (face `financement`),
# et cette prise en charge est abrogée en 2020 SANS QUE LE DROIT BOUGE — la
# version de L. 351-1 qui les porte est toujours en vigueur. Un lecteur qui
# ne suivrait que les comptes du FSV conclurait que l'avantage a disparu.
#
# SENS — fermé, deux valeurs par face
# ------------------------------------
#   face `droit`        ouvre      un droit gratuit apparaît ou s'élargit
#                       ferme      il disparaît, se restreint, ou devient
#                                  conditionné à une cotisation effective
#   face `cotisation`   sterilise  un prélèvement cesse d'ouvrir des droits
#                       fertilise  un prélèvement en rouvre
#   face `financement`  identifie  la charge est isolée chez un payeur nommé,
#                                  donc MESURABLE
#                       fond       elle retourne dans les comptes du régime,
#                                  donc INVISIBLE
#
# `identifie` et `fond` ne sont pas des jugements : ce sont les deux états qui
# décident si une ligne de l'inventaire peut porter un chiffre. Les 87 % du
# total chiffré qui viennent de séries publiées (docs/avantages_non_contributifs.md
# § 4 quinquies) sont exactement des charges `identifie`.
#
# CE QUI FAIT FOI
# ---------------
# Chaque bascule porte `article`, `version` (l'identifiant LEGI de la version
# LUE) et `version_precedente` quand la bascule est un changement et non une
# création. `scripts/frontiere_contributive.py` rouvre l'index LEGI du dépôt et
# vérifie que chaque version citée existe, à la date citée, sous l'article
# cité. Une date écrite ici sans version opposable serait une mémoire, et le
# test la refuse.
#
# CE QUE CE FICHIER N'EST PAS
# ---------------------------
# Il ne chiffre rien. Il dit quand la frontière a bougé, dans quel sens, et ce
# que le modèle en fait. Ce que chaque dispositif coûte reste dans
# `avantages_non_contributifs.yaml`.

source_id: legifrance_textes

# Les articles dont les versions font foi. Le script les relit tous.
pivots:
  - article: L. 135-1 CSS
    num: L135-1
    quoi: >-
      Crée le Fonds de solidarité vieillesse et lui donne pour mission de
      prendre en charge « les avantages d'assurance vieillesse à caractère non
      contributif relevant de la solidarité nationale, tels qu'ils sont définis
      par l'article L. 135-2 ». C'est la seule DÉFINITION LÉGALE de
      l'expression, et elle a vécu de 1994 à 2025.
  - article: L. 135-2 CSS
    num: L135-2
    quoi: >-
      La liste que le législateur tient lui-même. Trente-sept versions de 1994
      à 2025 : ce qui y entre est reconnu non contributif, ce qui en sort cesse
      de l'être aux yeux du financement. C'est l'ossature de ce fichier.
  - article: article 24 de la loi n° 2025-199 du 28 février 2025
    num: "24"
    titre_contient: "2025-199"
    quoi: >-
      La LFSS 2025. Son article 24 abroge le chapitre du FSV, dévolue ses
      droits et obligations à la CNAV, et crée L. 222-2-1. Un numéro d'article
      de loi ne vaut que dans son texte : le pivot dit donc ce que le titre
      doit contenir, et le contrôle le vérifie.
  - article: L. 222-2-1 CSS
    num: L222-2-1
    quoi: >-
      Le successeur, en vigueur au 1er janvier 2026. Il reprend la liste dans
      la branche vieillesse et garde l'expression « les avantages non
      contributifs mentionnés aux 1° à 5° et 7° du présent article ».
  - article: L. 223-1 CSS
    num: L223-1
    quoi: >-
      Ce que la branche famille rembourse aux régimes de retraite. C'est par
      lui que les droits familiaux ont quitté le FSV pour la CNAF.
  - article: L. 241-3 CSS
    num: L241-3
    quoi: >-
      Ce qui couvre les charges de l'assurance vieillesse : les cotisations
      plafonnées, les cotisations DÉPLAFONNÉES — celles qui n'ouvrent aucun
      droit — et les contributions des autres branches.
  - article: D. 242-5 CSS
    num: D242-5
    quoi: >-
      Le taux de la cotisation d'assurance veuvage, 0,10 % à la charge du seul
      salarié. Sa disparition est la fin du seul droit dérivé qui ait jamais eu
      sa propre cotisation.
  - article: L. 351-1 CSS
    num: L351-1
    quoi: >-
      Le salaire de base. C'est lui qui dit si les indemnités journalières y
      entrent — et sa version de 2010 est toujours en vigueur, alors que le
      financement correspondant a été abrogé en 2020.
  - article: L. 351-3 CSS
    num: L351-3
    quoi: >-
      Les périodes assimilées. Sa liste s'allonge par la fin, et chaque ajout
      est un droit gratuit de plus.
  - article: L. 12 CPCMR
    num: L12
    titre_contient: Code des pensions civiles et militaires
    quoi: >-
      Les bonifications de la fonction publique — ce qui s'ajoute aux services
      EFFECTIFS. Huit versions de 1982 à 2025. Le numéro d'article est partagé
      par quatre codes dans l'index, d'où le filtre sur le titre.
  - article: L. 12 bis CPCMR
    num: L12 bis
    titre_contient: Code des pensions civiles et militaires
    quoi: >-
      La majoration de durée d'assurance qui, en 2004, remplace la bonification
      pour les enfants nés depuis. Deux versions, et la seconde renverse la
      première.
  - article: L. 24 CPCMR
    num: L24
    titre_contient: Code des pensions civiles et militaires
    quoi: >-
      Quand la pension se liquide : la catégorie active, les services
      super-actifs, et le départ anticipé des parents de trois enfants qui n'y
      est plus.
  - article: article 9 du décret n° 2008-639 du 30 juin 2008
    num: "9"
    titre_contient: "2008-639"
    quoi: >-
      La bonification de conduite du régime spécial de la SNCF : un trimestre
      par année d'affiliation au-delà de la troisième, vingt au plus. Six
      versions, dont une du 7 août 2026.
  - article: article 20 du décret n° 2008-637 du 30 juin 2008
    num: "20"
    titre_contient: "2008-637"
    quoi: >-
      Les bonifications de services de la RATP : un cinquième du temps passé
      dans les emplois du tableau B, cinq ans au plus, et la moitié des
      services accomplis après cinquante-quatre ans. Sept versions.
  - article: L. 351-7-1 CSS
    num: L351-7-1
    quoi: >-
      La réduction de la durée requise pour les services militaires accomplis
      en Afrique du Nord. Deux versions, toujours en vigueur — alors que le
      poste qui la finançait est abrogé.
  - article: L. 6243-3 code du travail
    num: L6243-3
    titre_contient: Code du travail
    quoi: >-
      Le complément de cotisations qui valide les trimestres de l'apprenti
      au-delà de ce que son assiette porte. Le droit de l'apprenti n'est pas
      dans le code de la sécurité sociale, et c'est pour cela qu'il manquait.
  - article: L. 161-22-1-1 CSS
    num: L161-22-1-1
    quoi: >-
      La seconde pension du cumul emploi-retraite : la seule pension du droit
      français dont un article dise qu'elle ne porte AUCUN avantage non
      contributif.

bascules:

  # --- La face `financement` : le FSV, de sa création à sa disparition -----

  - code: definition_legale_du_non_contributif
    date: 1994-01-01
    face: financement
    sens: identifie
    libelle: Le droit français définit pour la première fois l'avantage non contributif
    quoi: >-
      La loi n° 93-936 du 22 juillet 1993 crée un fonds « dont la mission est
      de prendre en charge les avantages d'assurance vieillesse à caractère non
      contributif relevant de la solidarité nationale, tels qu'ils sont définis
      par l'article L. 135-2 ». C'est la seule DÉFINITION LÉGALE de
      l'expression que porte le code, et elle est donnée par renvoi : n'est non
      contributif que ce qu'une liste énumère. Cette phrase vivra trente-deux
      ans, jusqu'au 1er janvier 2026.
    dispositifs: []
    article: L. 135-1 CSS
    version: LEGIARTI000006740165
    version_precedente: null
    texte: loi n° 93-936 du 22 juillet 1993
    lu_le: 2026-09-21
    portee_modele: sans_objet
    effet_modele: >-
      Le dépôt emploie « non contributif » depuis toujours et n'en donnait
      jusqu'ici aucune source. Elle existe, elle est datée, et elle est
      énumérative : c'est l'écart entre cette liste-là et celle de
      l'inventaire qui dit ce que le dépôt ajoute au législateur.

  - code: fsv_premiere_liste
    date: 1994-01-01
    face: financement
    sens: identifie
    libelle: "La première liste : quatre postes sortent des comptes des régimes"
    quoi: >-
      L. 135-2 énumère ce que le fonds prend en charge : le minimum vieillesse,
      l'allocation spéciale, les majorations de pension pour enfants et pour
      conjoint à charge, et la prise en compte dans la durée d'assurance du
      service national et du chômage indemnisé. Une charge qui entre dans cette
      liste cesse d'être payée par le régime et devient un transfert — donc une
      ligne comptable qu'on peut lire.
    dispositifs: [minimum_vieillesse, majoration_enfants, majoration_conjoint_a_charge, periodes_assimilees, service_national]
    article: L. 135-2 CSS
    version: LEGIARTI000006740177
    version_precedente: null
    texte: loi n° 93-936 du 22 juillet 1993, article 2
    lu_le: 2026-09-21
    portee_modele: sans_objet
    effet_modele: >-
      Le modèle calcule des droits, pas des flux de financement. Cette bascule
      ne change aucune pension : elle change qui la paie, et surtout elle rend
      la dépense MESURABLE — c'est d'elle que descendent les séries publiées
      dont l'inventaire tire 87 % de son total chiffré.

  - code: majorations_agricoles_au_fsv
    date: 1995-12-31
    face: financement
    sens: identifie
    libelle: Les majorations pour enfants des non-salariés agricoles entrent au FSV
    quoi: >-
      Un 6° est ajouté : le paiement par les caisses de la mutualité sociale
      agricole des majorations de pension pour enfants servies aux non-salariés
      agricoles. Le même avantage était déjà pris en charge pour les autres
      régimes ; l'agriculture rejoint la liste deux ans plus tard.
    dispositifs: [majoration_enfants]
    article: L. 135-2 CSS
    version: LEGIARTI000006740180
    version_precedente: LEGIARTI000006740179
    texte: null
    lu_le: 2026-09-21
    portee_modele: sans_objet
    effet_modele: >-
      Aucun. La ligne est ici parce qu'une liste qui saute ses petits pas ne
      permet plus de dater les grands.

  - code: majorations_enfants_a_la_cnaf
    date: 2000-12-24
    face: financement
    sens: identifie
    libelle: La branche famille commence à payer la majoration de pension pour enfants
    quoi: >-
      La CNAF se voit chargée de « verser au Fonds de solidarité vieillesse un
      montant égal aux dépenses prises en charge par ce fonds au titre des
      majorations de pensions ». Le droit ne bouge pas d'un trimestre : c'est
      le payeur qui change, et il change deux fois — d'abord la famille
      rembourse le fonds, puis, dans la rédaction en vigueur, elle rembourse
      directement les régimes.
    dispositifs: [majoration_enfants]
    article: L. 223-1 CSS
    version: LEGIARTI000006741768
    version_precedente: LEGIARTI000006741767
    texte: null
    lu_le: 2026-09-21
    portee_modele: sans_objet
    effet_modele: >-
      C'est cette bascule qui rend la majoration pour enfants LISIBLE : les
      7,78 Md€ que l'inventaire lui prête en 2024 sont un poste publié parce
      qu'une caisse le rembourse et le compte. Le modèle, lui, la chiffrait à
      zéro, faute de cas type ayant trois enfants.

  - code: service_national_volontariat_au_fsv
    date: 2000-03-15
    face: financement
    sens: identifie
    libelle: Les périodes de volontariat du service national entrent au FSV
    quoi: >-
      Un 7° est ajouté pour les sommes représentatives de la prise en compte,
      par les régimes de base, des périodes de volontariat du service national.
      Le service national LÉGAL y était depuis 1994 ; le volontariat, qui lui
      succède après la suspension de la conscription, obtient son financement
      six ans plus tard.
    dispositifs: [service_national]
    article: L. 135-2 CSS
    version: LEGIARTI000006740183
    version_precedente: LEGIARTI000006740182
    texte: null
    lu_le: 2026-09-21
    portee_modele: applique
    effet_modele: >-
      Le modèle valide les périodes de service national comme périodes
      assimilées, sans distinguer l'appelé du volontaire. L'écart est celui
      d'une génération de volontaires, dont aucun cas type ne porte la période.

  - code: minimum_contributif_au_fsv
    date: 2010-12-22
    face: financement
    sens: identifie
    libelle: Le minimum contributif devient, pour partie, une charge de solidarité
    quoi: >-
      Un 2° est rétabli : « une partie, fixée par la loi de financement de la
      sécurité sociale, des sommes correspondant au service […] de la
      majoration mentionnée à l'article L. 351-10 ». Cette « majoration » EST
      le minimum contributif : L. 351-10 dispose que « la pension de vieillesse
      au taux plein est assortie, le cas échéant, d'une majoration permettant
      de porter cette prestation […] à un montant minimum ». Le minimum
      contributif — dont le nom dit le contraire — est donc reconnu non
      contributif par le financement, et la fraction sera portée à « au moins
      50 % » en 2016.
    dispositifs: [minimum_contributif]
    article: L. 135-2 CSS
    version: LEGIARTI000023271661
    version_precedente: LEGIARTI000023035693
    texte: null
    lu_le: 2026-09-21
    portee_modele: applique
    effet_modele: >-
      Le modèle sert le minimum contributif et la cascade en isole le montant.
      Cette bascule ne change pas la pension ; elle dit que le législateur
      lui-même a rangé dans la solidarité un dispositif que son intitulé range
      dans la cotisation.

  - code: indemnites_journalieres_au_salaire_de_base
    date: 2010-11-11
    face: droit
    sens: ouvre
    libelle: Les indemnités journalières de maternité entrent au salaire de base
    quoi: >-
      L'article 98 de la loi n° 2010-1330 du 9 novembre 2010 fait entrer les
      indemnités journalières dans le salaire de base de l'article L. 351-1,
      pour les congés de maternité débutant à compter du 1er janvier 2012.
      Jusque-là, le congé de maternité validait des trimestres sans porter
      aucun salaire au compte : il relevait la durée et abaissait la moyenne.
    dispositifs: [periodes_assimilees]
    article: L. 351-1 CSS
    version: LEGIARTI000023035688
    version_precedente: null
    texte: loi n° 2010-1330 du 9 novembre 2010, article 98
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Le modèle valide les périodes assimilées en DURÉE et ne leur porte aucun
      salaire. L'effet de cette bascule sur le salaire annuel moyen d'une mère
      lui échappe donc, et c'est un manque au droit positif — du bon côté pour
      une fois : le modèle sous-estime l'avantage.

  - code: indemnites_journalieres_au_fsv
    date: 2010-11-11
    face: financement
    sens: identifie
    libelle: Le FSV prend en charge les indemnités journalières portées au compte
    quoi: >-
      Le même texte crée, au 10° de L. 135-2, la prise en charge par le fonds
      des sommes représentatives de cette entrée au salaire de base. Le droit
      et son financement naissent le même jour, ce qui est l'exception.
    dispositifs: [periodes_assimilees]
    article: L. 135-2 CSS
    version: LEGIARTI000023035693
    version_precedente: LEGIARTI000021537978
    texte: loi n° 2010-1330 du 9 novembre 2010
    lu_le: 2026-09-21
    portee_modele: sans_objet
    effet_modele: >-
      Sans objet côté pension. Cette ligne existe pour sa jumelle dix ans plus
      tard, qui la défait sans défaire le droit.

  - code: penibilite_a_la_branche_atmp
    date: 2010-11-11
    face: financement
    sens: identifie
    libelle: La branche accidents du travail paie les départs anticipés pour pénibilité
    quoi: >-
      L. 241-3 se voit ajouter une contribution de la branche accidents du
      travail et maladies professionnelles « couvrant les dépenses
      supplémentaires engendrées par les départs en retraite à l'âge fixé en
      application de l'article L. 351-1-4 ». Un départ anticipé non cotisé
      trouve un payeur nommé, et ce payeur n'est ni l'assuré ni l'impôt.
    dispositifs: [incapacite_permanente_penibilite]
    article: L. 241-3 CSS
    version: LEGIARTI000023034915
    version_precedente: LEGIARTI000019959598
    texte: loi n° 2010-1330 du 9 novembre 2010
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      L'inventaire range `incapacite_permanente_penibilite` en `absent` et lui
      donne pour raison qu'aucun poste ne l'isole. Cette lecture corrige la
      raison : un payeur existe et il est nommé dans la loi. Ce qui manque
      n'est pas la charge, c'est sa publication.

  - code: minimum_contributif_hors_fsv
    date: 2016-12-25
    face: financement
    sens: fond
    libelle: Le minimum contributif retourne à la charge des régimes
    quoi: >-
      Six ans après y être entré, le minimum contributif quitte la liste du
      FSV : la version en vigueur au 25 décembre 2016 ne porte plus aucune
      mention de l'article L. 351-10. La charge n'a pas disparu — elle est
      redevenue invisible, réglée par les régimes sur leurs propres comptes.
    dispositifs: [minimum_contributif]
    article: L. 135-2 CSS
    version: LEGIARTI000033728251
    version_precedente: LEGIARTI000031685302
    texte: null
    lu_le: 2026-09-21
    portee_modele: applique
    effet_modele: >-
      Le modèle chiffre le minimum contributif par la cascade, et continue donc
      de le voir. C'est le seul cas de ce fichier où le modèle sait MIEUX que
      les comptes : la série publiée s'arrête en 2016, le calcul non.

  - code: apprentis_au_fsv
    date: 2014-01-01
    face: financement
    sens: identifie
    libelle: La validation des trimestres d'apprentissage trouve un payeur
    quoi: >-
      Un 11° entre à L. 135-2 pour « les sommes correspondant à la prise en
      charge mentionnée au dernier alinéa de l'article L. 6243-3 du code du
      travail ». L'assiette forfaitaire de l'apprenti ne permettait pas de
      valider quatre trimestres ; la différence est désormais prise en charge.
      LA FACE EST `financement` ET NON `droit`, et la nuance est la règle de ce
      fichier : la version citée prouve qui paie, pas ce qui est acquis. Le
      droit lui-même est à l'article L. 6243-3 du code du travail, que ce
      document n'a pas lu — et une déduction n'est pas une lecture.
    dispositifs: [periodes_assimilees]
    article: L. 135-2 CSS
    version: LEGIARTI000029961245
    version_precedente: LEGIARTI000025023016
    texte: null
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Aucun cas type de la grille n'est apprenti. Le dispositif est hors de
      portée pour la même raison que la majoration pour trois enfants : la
      grille est un instrument de rapport, pas une population.

  - code: indemnites_journalieres_hors_fsv
    date: 2020-12-16
    face: financement
    sens: fond
    libelle: Le financement des indemnités journalières est abrogé, le droit reste
    quoi: >-
      Le 7° de L. 135-2 — la prise en charge des indemnités journalières
      portées au salaire de base — devient « (Abrogé) ». La version de
      L. 351-1 qui les y fait entrer, elle, est toujours en vigueur. C'est la
      démonstration la plus nette que les deux faces se déplacent séparément :
      l'avantage est intact, sa trace comptable a disparu.
    dispositifs: [periodes_assimilees]
    article: L. 135-2 CSS
    version: LEGIARTI000042683484
    version_precedente: LEGIARTI000037388252
    texte: null
    lu_le: 2026-09-21
    portee_modele: sans_objet
    effet_modele: >-
      Un lecteur qui mesurerait les avantages non contributifs par les comptes
      du FSV verrait ici une baisse qui n'existe pas. C'est le risque propre
      aux lignes `serie_publiee` de l'inventaire, et la raison pour laquelle
      une ligne ne doit jamais mélanger deux périmètres.

  - code: fsv_supprime
    date: 2026-01-01
    face: financement
    sens: fond
    libelle: Le Fonds de solidarité vieillesse est supprimé et fondu dans la CNAV
    quoi: >-
      L'article 24 de la loi n° 2025-199 du 28 février 2025 abroge le chapitre
      « Fonds de solidarité vieillesse » et les articles L. 135-1 à L. 135-5 ;
      son XXII dispose que « les droits et obligations du Fonds de solidarité
      vieillesse sont dévolus à la Caisse nationale d'assurance vieillesse à
      compter du 1er janvier 2026 ». La définition légale de l'avantage
      d'assurance vieillesse à caractère non contributif, portée par L. 135-1
      depuis 1994, disparaît du code.
    dispositifs: []
    article: article 24 de la loi n° 2025-199 du 28 février 2025
    version: LEGIARTI000051273754
    date_preuve: 2025-03-01
    article_precedent: L. 135-2 CSS
    version_precedente: LEGIARTI000042683484
    texte: loi n° 2025-199 du 28 février 2025, article 24, XXII
    pourquoi_deux_dates: >-
      La loi est en vigueur au 1er mars 2025 et supprime le fonds au 1er
      janvier 2026. `date` est l'effet, `date_preuve` la version lue.
    lu_le: 2026-09-21
    portee_modele: sans_objet
    effet_modele: >-
      C'est la bascule la plus lourde de ce fichier pour le dépôt, et elle ne
      touche aucune pension. Elle retire au chantier des avantages non
      contributifs la source qui l'a rendu possible.

  - code: liste_reprise_par_la_branche_vieillesse
    date: 2026-01-01
    face: financement
    sens: identifie
    libelle: La liste survit au fonds, sous L. 222-2-1
    quoi: >-
      La même loi crée L. 222-2-1 : « La branche mentionnée au 3° de l'article
      L. 200-2 prend en charge : … », et reprend les postes un à un. Elle garde
      l'expression du législateur — « des avantages non contributifs mentionnés
      aux 1° à 5° et 7° du présent article ». La liste n'est donc pas perdue ;
      elle change de porteur.
    dispositifs: [minimum_vieillesse, periodes_assimilees, service_national]
    article: L. 222-2-1 CSS
    version: LEGIARTI000051288889
    version_precedente: null
    texte: loi n° 2025-199 du 28 février 2025, article 24
    lu_le: 2026-09-21
    portee_modele: sans_objet
    effet_modele: >-
      La liste reste opposable, et ce fichier peut donc continuer de la suivre
      après 2026 : c'est L. 222-2-1 qu'il faudra relire, et non L. 135-2.

  - code: regime_general_hors_de_la_liste
    date: 2026-01-01
    face: financement
    sens: fond
    libelle: Le régime général sort de la liste, parce qu'il en est devenu le payeur
    quoi: >-
      Le 2° de L. 135-2 visait « la prise en compte par LE RÉGIME GÉNÉRAL, le
      régime des salariés agricoles, … » des périodes assimilées. Le 2° de
      L. 222-2-1 vise « la prise en compte par le régime des salariés
      agricoles, le régime des non-salariés agricoles, … » : le régime général
      n'y est plus. Il n'a rien perdu — il a absorbé le fonds, et ne se
      rembourse pas à lui-même.
    dispositifs: [periodes_assimilees]
    article: L. 222-2-1 CSS
    version: LEGIARTI000051288889
    article_precedent: L. 135-2 CSS
    version_precedente: LEGIARTI000042683484
    texte: null
    lu_le: 2026-09-21
    portee_modele: sans_objet
    effet_modele: >-
      Conséquence directe pour la mesure : à compter de 2026, le coût des
      périodes assimilées du RÉGIME GÉNÉRAL — le plus gros contingent — cesse
      d'être un transfert publié pour devenir une charge interne. Il reste
      publié pour les régimes agricoles, libéraux et les avocats. La série
      `periodes_assimilees` de l'inventaire a donc une date de péremption, et
      c'est 2026.

  # --- La face `droit` : ce qui s'est ouvert, et ce qui s'est fermé --------

  - code: sportifs_de_haut_niveau
    date: 2011-12-23
    face: droit
    sens: ouvre
    libelle: L'inscription sur la liste des sportifs de haut niveau valide des trimestres
    quoi: >-
      Un 7° est ajouté à L. 351-3 : les périodes d'inscription comme sportif de
      haut niveau, « sans condition d'affiliation préalable », valident des
      trimestres qu'aucune cotisation n'a portés. C'est la première période
      assimilée qui ne compense ni un risque social ni une contrainte publique,
      mais une activité choisie.
    dispositifs: [periodes_assimilees]
    article: L. 351-3 CSS
    version: LEGIARTI000025014498
    version_precedente: null
    texte: null
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Le modèle ne construit pas de carrière sportive. Population étroite, mais
      la ligne compte pour ce qu'elle montre : la liste des périodes assimilées
      s'allonge par la fin, et chaque ajout est irréversible.

  - code: stages_de_formation_professionnelle
    date: 2014-01-22
    face: droit
    sens: ouvre
    libelle: Les périodes de stage de formation professionnelle deviennent assimilées
    quoi: >-
      Un 8° est ajouté à L. 351-3, visant les périodes de stage de l'article
      L. 6342-3 du code du travail.
    dispositifs: [periodes_assimilees]
    article: L. 351-3 CSS
    version: LEGIARTI000028498769
    version_precedente: LEGIARTI000025014498
    texte: null
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Hors de portée de la grille, comme l'apprentissage : aucun cas type ne
      porte de période de formation.

  - code: tuc_et_stages_d_insertion
    date: 2023-09-01
    face: droit
    sens: ouvre
    libelle: Les travaux d'utilité collective des années 1980 valident, quarante ans après
    quoi: >-
      Un 9° entre à L. 351-3 : « les périodes de stage dont les cotisations
      sociales ont été prises en charge par l'État et ayant pour finalité
      l'insertion dans l'emploi […] ainsi que celles mentionnées à l'article 3
      de la loi n° 79-575 du 10 juillet 1979 et à l'article L. 980-9 du code du
      travail, dans sa rédaction antérieure ». Ce sont les TUC et les stages
      assimilés. Des périodes qui ne validaient rien en sont devenues
      validantes RÉTROACTIVEMENT, pour des carrières commencées quarante ans
      plus tôt.
    dispositifs: [periodes_assimilees]
    article: L. 351-3 CSS
    version: LEGIARTI000047453382
    version_precedente: LEGIARTI000042683463
    texte: null
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      C'est le contre-exemple le plus net à l'idée qu'un droit acquis se fige à
      sa date : le droit applicable à une année de carrière a changé quarante
      ans après cette année-là. Le modèle date ses règles par l'année de la
      période, et ne sait donc pas rejouer une validation rétroactive.

  - code: conge_supplementaire_de_naissance
    date: 2025-12-31
    face: droit
    sens: ouvre
    libelle: Le congé supplémentaire de naissance rejoint les périodes assimilées
    quoi: >-
      Le 1° de L. 351-3 est complété pour viser, à côté des prestations
      maladie, maternité, invalidité et accident du travail, « le congé
      supplémentaire de naissance ». La liste s'allonge encore, et c'est
      l'ajout le plus récent que l'index du dépôt porte.
    dispositifs: [periodes_assimilees]
    article: L. 351-3 CSS
    version: LEGIARTI000053279221
    version_precedente: LEGIARTI000047453382
    texte: loi n° 2025-1403 du 30 décembre 2025
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Trop récent pour peser sur une pension liquidée : le modèle n'a rien à en
      faire aujourd'hui, et la ligne est ici pour que la prochaine session sache
      où reprendre la lecture.

  # --- La face `cotisation` : ce qui est versé sans rien ouvrir ------------

  - code: cotisation_deplafonnee_employeur
    date: 1991-01-20
    face: cotisation
    sens: sterilise
    libelle: L'employeur cotise sur la totalité du salaire, et n'achète rien au-delà du plafond
    quoi: >-
      L. 241-3 se voit ajouter que « la couverture des charges de l'assurance
      vieillesse est également assurée par des cotisations à la charge des
      employeurs et assises sur la totalité des rémunérations ou gains ». Le
      salaire au-delà du plafond ne peut pourtant entrer ni au salaire annuel
      moyen ni dans aucun droit. C'est le premier prélèvement vieillesse
      explicitement sans contrepartie, et il est toujours en vigueur.
    dispositifs: []
    article: L. 241-3 CSS
    version: LEGIARTI000006741899
    version_precedente: LEGIARTI000006741898
    texte: null
    lu_le: 2026-09-21
    portee_modele: applique
    effet_modele: >-
      Le compte notionnel porte ce qui a été PRÉLEVÉ, part déplafonnée
      comprise : `config.py` le dit en toutes lettres, et
      `taux_cotisation_annuels.csv` sépare `taux_plafonne` et
      `taux_deplafonne`. Les scénarios notionnels rendent donc contributif ce
      que le droit actuel stérilise — c'est une partie de l'écart qu'ils
      mesurent, et elle n'était nommée nulle part.

  - code: cotisation_deplafonnee_salarie
    date: 2003-08-22
    face: cotisation
    sens: sterilise
    libelle: Le salarié y est ajouté
    quoi: >-
      La même phrase devient « à la charge des employeurs ET DES SALARIÉS ».
      Depuis la loi du 21 août 2003, le salarié supporte lui aussi un
      prélèvement vieillesse qui ne lui ouvre aucun droit, sur la totalité de
      son salaire.
      LA LOI OUVRE, LE DÉCRET EXÉCUTE, ET LES DEUX DATES DIFFÈRENT. L'article
      autorise le prélèvement au 22 août 2003 ; le taux salarié reste nul dans
      `taux_cotisation_annuels.csv`, série certifiée, jusqu'en 2004, et ne
      devient positif qu'en 2005. La `date` de cette bascule est celle de
      l'autorisation — c'est elle que la version d'article prouve —, et non
      celle du premier euro prélevé.
    dispositifs: []
    article: L. 241-3 CSS
    version: LEGIARTI000006741901
    version_precedente: LEGIARTI000006741900
    texte: loi n° 2003-775 du 21 août 2003
    lu_le: 2026-09-21
    portee_modele: applique
    effet_modele: >-
      La part salariale déplafonnée entre au compte notionnel des scénarios 2
      et 3, qui ne portent que la part de l'assuré. C'est donc une
      non-contributivité que les scénarios notionnels EFFACENT, là où
      l'inventaire n'en recense que des ajouts.

  - code: cotisation_veuvage_supprimee
    date: 2004-08-25
    face: financement
    sens: fond
    libelle: Le seul droit dérivé qui avait sa propre cotisation la perd
    quoi: >-
      D. 242-5 fixait le taux de la cotisation d'assurance veuvage à 0,10 %, à
      la charge du seul salarié, sur la totalité des rémunérations. Sa version
      unique court de 1985 au 25 août 2004. L. 241-3 avait absorbé, dès le
      22 août 2003, « les charges de l'assurance vieillesse ET DE L'ASSURANCE
      VEUVAGE » dans les cotisations vieillesse. L'allocation veuvage perd
      ainsi sa contrepartie nommée.
    dispositifs: [allocation_veuvage]
    article: D. 242-5 CSS
    version: LEGIARTI000006735875
    preuve: fin
    version_precedente: null
    texte: loi n° 2003-775 du 21 août 2003
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      L'inventaire range l'allocation veuvage en `absent` et dit qu'un poste
      fourre-tout l'absorbe. La lecture explique POURQUOI : elle a eu sa
      cotisation, donc sa ligne, et les a perdues ensemble. Un droit cesse
      d'être mesurable le jour où il cesse d'avoir un payeur nommé.

  - code: cumul_emploi_retraite_fertilise
    date: 2023-09-01
    face: cotisation
    sens: fertilise
    libelle: Les cotisations du retraité qui retravaille rouvrent des droits
    quoi: >-
      L. 161-22-1-1 est créé : les assurés en cumul emploi-retraite intégral
      « se constituent de nouveaux droits à pension ». Jusque-là, leurs
      cotisations étaient à fonds perdus. C'est le seul renversement de ce
      fichier dans ce sens-là — un prélèvement stérile redevient acquisitif.
    dispositifs: []
    article: L. 161-22-1-1 CSS
    version: LEGIARTI000047450790
    version_precedente: null
    texte: loi n° 2023-270 du 14 avril 2023
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Le modèle liquide une fois et ne connaît pas de reprise d'activité après
      liquidation. La seconde pension lui échappe entièrement.

  - code: seconde_pension_purement_contributive
    date: 2023-09-01
    face: droit
    sens: ferme
    libelle: Le droit français crée une pension dont la loi dit qu'elle ne porte aucun avantage
    quoi: >-
      Le même article ajoute deux phrases qui n'ont pas d'équivalent ailleurs :
      « Seules sont retenues les périodes d'assurance ayant donné lieu à
      cotisations à la charge de l'assuré, à l'exclusion des périodes
      correspondant à des versements [rachats] » et « Aucune majoration, aucun
      supplément ni aucun accessoire ne peut être octroyé au titre de cette
      nouvelle pension ». C'est, en droit positif, la définition d'une pension
      purement contributive — celle que les scénarios notionnels construisent.
    dispositifs: []
    article: L. 161-22-1-1 CSS
    version: LEGIARTI000047450790
    version_precedente: null
    texte: loi n° 2023-270 du 14 avril 2023
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Le dépôt construit depuis le début un contrefactuel « et si la pension ne
      servait que ce qui a été cotisé ». Le législateur l'a écrit, pour une
      pension et une seule. Ce n'est pas une confirmation du modèle — le champ
      n'est pas le même — mais c'est le seul point du droit où la question
      posée par ce dépôt reçoit une réponse rédigée.

  # --- La fonction publique : le code des pensions ------------------------

  - code: bonification_enfants_fp_conditionnee
    date: 2004-01-01
    face: droit
    sens: ferme
    libelle: L'année par enfant cesse d'être gratuite, et se ferme aux enfants à naître
    quoi: >-
      Le b de L. 12 disait « Bonification accordée AUX FEMMES FONCTIONNAIRES
      pour chacun de leurs enfants ». Il dit désormais « les fonctionnaires et
      militaires bénéficient d'une bonification fixée à un an […] à condition
      qu'ils aient INTERROMPU leur activité », et seulement « pour chacun de
      leurs enfants […] nés antérieurement au 1er janvier 2004 ». Deux
      mouvements en une version : le droit s'ouvre aux pères et se referme sur
      une condition d'interruption, puis s'éteint pour les naissances à venir.
      Un an de services gratuits devient un an mérité par une interruption de
      carrière — c'est-à-dire par un coût réel supporté par le bénéficiaire.
    dispositifs: [bonification_enfants_fonction_publique]
    article: L. 12 CPCMR
    version: LEGIARTI000006362696
    version_precedente: LEGIARTI000006362695
    texte: loi n° 2003-775 du 21 août 2003
    lu_le: 2026-09-21
    portee_modele: applique
    effet_modele: >-
      Le moteur sert la bonification pour enfants de la fonction publique et la
      cascade en isole le montant. La condition d'interruption, elle, lui
      échappe : la grille de cas types ne porte pas d'interruption pour enfant,
      si bien que le modèle accorde la bonification là où le droit la
      refuserait. C'est un écart au droit positif, du côté généreux.

  - code: majoration_duree_assurance_fp_creee
    date: 2004-01-01
    face: droit
    sens: ouvre
    libelle: Deux trimestres remplacent l'année, et pour les mères seulement
    quoi: >-
      L. 12 bis est créé le même jour : « Pour chacun de leurs enfants nés à
      compter du 1er janvier 2004, les femmes, fonctionnaires ou militaires,
      ayant accouché postérieurement à leur recrutement, bénéficient d'une
      majoration de durée d'assurance fixée à deux trimestres. » C'est un droit
      NOUVEAU, donc une ouverture ; c'est aussi, pour la même naissance, quatre
      trimestres de moins qu'avant, et un droit rendu à son caractère féminin
      après que le b l'eut ouvert aux deux parents.
      La différence n'est pas que de taille. Une bonification s'ajoute aux
      SERVICES et entre donc dans la liquidation ; une majoration de durée
      d'assurance ne compte que pour la durée. Le même trimestre ne vaut pas la
      même chose selon la case où il tombe.
    dispositifs: [bonification_enfants_fonction_publique]
    article: L. 12 bis CPCMR
    version: LEGIARTI000006362697
    version_precedente: null
    texte: loi n° 2003-775 du 21 août 2003
    lu_le: 2026-09-21
    portee_modele: applique
    effet_modele: >-
      Le dépôt porte les deux régimes dans `majoration_duree_assurance.csv` et
      les applique par date de naissance. C'est l'une des rares bascules de ce
      fichier que le modèle rejoue vraiment.

  - code: interruption_ou_reduction_fp
    date: 2011-07-01
    face: droit
    sens: ouvre
    libelle: Une activité RÉDUITE suffit désormais
    quoi: >-
      La condition du b passe de « à condition qu'ils aient interrompu leur
      activité » à « interrompu OU RÉDUIT leur activité ». Un mot, et la
      population éligible s'élargit à qui est passé à temps partiel sans jamais
      s'arrêter.
    dispositifs: [bonification_enfants_fonction_publique]
    article: L. 12 CPCMR
    version: LEGIARTI000023096747
    version_precedente: LEGIARTI000006362696
    texte: loi n° 2010-1330 du 9 novembre 2010
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Sans objet pour le modèle, qui n'oppose aucune condition d'interruption.

  - code: cinquieme_militaire_dix_sept_ans
    date: 2011-07-01
    face: droit
    sens: ferme
    libelle: La bonification du cinquième exige deux années de service de plus
    quoi: >-
      Le i de L. 12 accorde un cinquième du temps de service, dans la limite de
      cinq annuités, « à la condition qu'ils aient accompli au moins QUINZE ans
      de services militaires effectifs ». La même version porte cette condition
      à DIX-SEPT ans. La bonification la plus massive du système — 99,3 % des
      pensions militaires liquidées en 2010 la portaient — se resserre sur les
      carrières longues.
    dispositifs: [bonification_cinquieme_militaires]
    article: L. 12 CPCMR
    version: LEGIARTI000023096747
    version_precedente: LEGIARTI000006362696
    texte: loi n° 2010-1330 du 9 novembre 2010
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      L'inventaire range `bonification_cinquieme_militaires` en `absent` : le
      moteur ne la sert pas. La condition de durée lui échappe donc aussi.

  - code: depart_trois_enfants_ferme
    date: 2011-07-01
    face: droit
    sens: ferme
    libelle: Le départ anticipé des parents de trois enfants disparaît du code
    quoi: >-
      De 1982 à 2011, L. 24 ouvrait la liquidation immédiate au fonctionnaire
      parent de trois enfants — « pour les femmes fonctionnaires » jusqu'en
      2004, puis, sous condition d'interruption pour chaque enfant, à l'un et
      l'autre parent. L'expression « trois enfants » quitte l'article à cette
      date et n'y est jamais revenue. C'est la seule EXTINCTION franche de tout
      ce fichier : non une restriction, une disparition.
      L'inventaire des avantages non contributifs ne porte aucune ligne pour ce
      dispositif. Il a vécu trente ans et compté parmi les plus connus de la
      fonction publique ; il n'est ni dans les quarante-deux, ni dans les
      raisons écrites. C'est un manque, et il est signalé ici faute de pouvoir
      le combler sans le chiffrer.
    dispositifs: []
    article: L. 24 CPCMR
    version: LEGIARTI000023033603
    version_precedente: LEGIARTI000006362730
    texte: loi n° 2010-1330 du 9 novembre 2010
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Le modèle ne connaît pas ce départ anticipé, et n'a donc rien perdu à son
      extinction. Mais il ne le servait pas non plus quand il existait : les
      générations qui en ont bénéficié partent, dans le modèle, à l'âge de
      droit commun. C'est un écart au droit positif sur les liquidations
      d'avant 2011.

  - code: categorie_active_dix_sept_ans
    date: 2011-07-01
    face: droit
    sens: ferme
    libelle: La catégorie active exige dix-sept ans de services au lieu de quinze
    quoi: >-
      Le 1° de L. 24 ouvrait le départ anticipé au fonctionnaire ayant accompli
      « au moins QUINZE ans de services actifs ». La même version porte la
      condition à DIX-SEPT ans — et la rédaction en vigueur la reprend telle
      quelle, « dix-sept ans de services accomplis indifféremment dans de tels
      emplois, dits services actifs ».
    dispositifs: [categorie_active]
    article: L. 24 CPCMR
    version: LEGIARTI000023033603
    version_precedente: LEGIARTI000006362730
    texte: loi n° 2010-1330 du 9 novembre 2010
    lu_le: 2026-09-21
    portee_modele: applique
    effet_modele: >-
      Le moteur sert la catégorie active par la fiche du régime et une table
      d'âges, non par une durée de services actifs : la condition de dix-sept
      ans n'est pas opposée. `veille.yaml` porte déjà cette lacune sous
      `categorie_active_duree_requise`, à l'état `manque`.

  - code: cumul_bonifications_plafonne
    date: 2023-09-01
    face: droit
    sens: ferme
    libelle: Catégorie active et cinquième militaire ne se cumulent plus sans limite
    quoi: >-
      La réforme de 2023 ajoute à L. 12 une phrase qui n'existait pas : « Les
      bonifications acquises […] pour services accomplis dans différents
      emplois classés dans la catégorie active et la bonification prévue au i
      peuvent se cumuler, DANS LA LIMITE DE VINGT TRIMESTRES. » Cinq annuités,
      et pas une de plus, là où les deux dispositifs s'empilaient.
    dispositifs: [categorie_active, bonification_cinquieme_militaires]
    article: L. 12 CPCMR
    version: LEGIARTI000047452833
    version_precedente: LEGIARTI000047926152
    texte: loi n° 2023-270 du 14 avril 2023, article 10
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Le moteur ne sert ni la bonification du cinquième ni les bonifications de
      services de la catégorie active : il n'a donc rien à plafonner.

  - code: cinquieme_militaire_non_degressif
    date: 2023-09-01
    face: droit
    sens: ouvre
    libelle: Le cinquième cesse de fondre avec les années servies en plus
    quoi: >-
      La même version SUPPRIME la phrase qui rabotait la bonification : « le
      maximum de bonifications est donné aux militaires qui quittent le service
      à cinquante-neuf ans ; la bonification est diminuée d'une annuité pour
      chaque année supplémentaire de service ». Un militaire qui reste au-delà
      conserve désormais ses cinq annuités entières. Dans la même version que
      le plafond ci-dessus, et en sens inverse : une réforme n'a pas de sens
      unique, et un fichier qui ne noterait que les fermetures mentirait.
    dispositifs: [bonification_cinquieme_militaires]
    article: L. 12 CPCMR
    version: LEGIARTI000047452833
    version_precedente: LEGIARTI000047926152
    texte: loi n° 2023-270 du 14 avril 2023, article 10
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Sans objet : la bonification n'est pas servie.

  - code: trimestre_d_accouchement_devient_bonification
    date: 2025-12-31
    face: droit
    sens: ouvre
    libelle: Un des deux trimestres change de case, et gagne de la valeur
    quoi: >-
      Un b ter est ajouté à L. 12 : « Bonification d'un trimestre pour chacun
      de leurs enfants nés depuis le 1er janvier 2004, pour les femmes
      fonctionnaires ou militaires, ayant accouché postérieurement à leur
      recrutement. » Et L. 12 bis, réécrit le même jour, précise que des deux
      trimestres de majoration, « L'UN EST PRIS EN COMPTE AU TITRE DE LA
      BONIFICATION PRÉVUE AU b ter ».
      CE N'EST DONC PAS UN AJOUT, et c'est la question que le registre de
      veille posait. Le total reste de deux trimestres ; l'un d'eux passe de la
      durée d'assurance aux SERVICES, où il entre dans la liquidation au lieu
      de ne compter que pour la durée. Le même événement — un accouchement en
      cours de carrière — vaut désormais davantage sans qu'aucune cotisation
      l'ait payé.
    dispositifs: [bonification_enfants_fonction_publique]
    article: L. 12 CPCMR
    version: LEGIARTI000053280361
    version_precedente: LEGIARTI000047452833
    texte: loi n° 2025-1403 du 30 décembre 2025, article 104
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Applicable aux pensions prenant effet à compter du 1er septembre 2026, et
      étendu à la même date à la CNRACL et au FSPOEIE par décret en Conseil
      d'État — c'est le décret n° 2026-699 que `veille.yaml` signalait. Le
      modèle ne distingue pas bonification et majoration de durée pour les
      enfants de la fonction publique : la bascule lui échappe.

  - code: majoration_fp_partiellement_absorbee
    date: 2025-12-31
    face: droit
    sens: ferme
    libelle: La majoration de durée d'assurance perd la moitié de son contenu
    quoi: >-
      Le revers exact de la ligne précédente, et il se lit dans l'autre
      article. L. 12 bis accordait deux trimestres de majoration de durée
      d'assurance ; il en accorde toujours deux, « dont l'un est pris en compte
      au titre de la bonification prévue au b ter de l'article L. 12 ». La
      majoration proprement dite tombe donc à un trimestre. Les deux lignes
      décrivent le même geste vu des deux côtés, et c'est pourquoi elles ne
      s'additionnent pas.
    dispositifs: [bonification_enfants_fonction_publique]
    article: L. 12 bis CPCMR
    version: LEGIARTI000053280367
    version_precedente: LEGIARTI000006362697
    texte: loi n° 2025-1403 du 30 décembre 2025, article 104
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Même remarque : la distinction entre bonification et majoration n'est pas
      dans le moteur.

  - code: afrique_du_nord_hors_financement
    date: 2026-01-01
    face: financement
    sens: fond
    libelle: La réduction pour l'Afrique du Nord perd son financement, et garde son droit
    quoi: >-
      Le 3° de L. 135-2 finançait « les réductions de la durée d'assurance ou
      de périodes reconnues équivalentes, définies à l'article L. 351-7-1 ».
      Le 3° de L. 222-2-1, qui lui succède, porte « (Abrogé) ». Or la version
      de L. 351-7-1 en vigueur depuis le 1er janvier 2017 n'a pas bougé : les
      services militaires en Afrique du Nord ouvrent toujours droit à cette
      réduction.
      C'est le TROISIÈME cas de ce fichier où le droit survit à son
      financement, après les indemnités journalières de maternité en 2020 et le
      minimum contributif en 2016. Trois fois, la même illusion serait
      possible : lire la fin d'un transfert comme la fin d'un droit.
    dispositifs: [reduction_duree_afrique_du_nord]
    article: L. 222-2-1 CSS
    version: LEGIARTI000051288889
    article_precedent: L. 135-2 CSS
    version_precedente: LEGIARTI000042683484
    texte: loi n° 2025-199 du 28 février 2025, article 24
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Le modèle oppose une durée requise par génération, sans dérogation
      individuelle : il ne servait pas cette réduction avant, et ne la sert pas
      davantage maintenant. Ce que la bascule change est la MESURE — la charge
      cesse d'être un transfert identifiable.

  # --- Les régimes spéciaux : SNCF et RATP --------------------------------

  - code: bonifications_sncf_fermees_aux_nouveaux
    date: 2008-07-01
    face: droit
    sens: ferme
    libelle: La bonification de conduite se ferme à qui entre après 2008
    quoi: >-
      Le décret du 30 juin 2008 réécrit le régime spécial de la SNCF, et sa
      rédaction initiale de l'article 9 réserve la bonification de conduite
      « pour les personnels dont l'admission au cadre permanent de la SNCF a
      été prononcée AVANT LE 1er JANVIER 2009 ». Un trimestre par année de
      conduite au-delà de la troisième, vingt au plus : le droit demeure entier
      pour qui l'avait, et n'existe plus pour personne d'autre.
      Il n'y a pas de version précédente à citer : le décret remplace un
      règlement de caisse que l'index LEGI ne porte pas sous ce numéro
      d'article. La fermeture se lit donc dans le texte qui l'institue, non
      dans un écart entre deux versions.
    dispositifs: [bonifications_regimes_speciaux]
    article: article 9 du décret n° 2008-639 du 30 juin 2008
    version: LEGIARTI000019108305
    version_precedente: null
    texte: décret n° 2008-639 du 30 juin 2008
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      L'inventaire range `bonifications_regimes_speciaux` en `absent` : le
      moteur lit le code `bonifications` de la fiche SNCF comme la bonification
      pour enfants de la fonction publique, et ne sert aucune bonification de
      SERVICES à ce régime. La fermeture ne lui change donc rien.

  - code: bonifications_ratp_fermees_aux_nouveaux
    date: 2008-07-01
    face: droit
    sens: ferme
    libelle: Les bonifications du tableau B se ferment à qui entre après 2008
    quoi: >-
      Le décret jumeau du même jour fait de même à la RATP : « les assurés dont
      l'admission à la régie a été prononcée antérieurement au 1er janvier 2009
      bénéficient d'une bonification de services égale au cinquième de la durée
      des services effectivement accomplis dans un des emplois de la deuxième
      catégorie figurant au tableau B », cinq ans au plus. Une seconde
      bonification, la moitié des services accomplis après cinquante-quatre
      ans, porte la même condition.
    dispositifs: [bonifications_regimes_speciaux]
    article: article 20 du décret n° 2008-637 du 30 juin 2008
    version: LEGIARTI000019104831
    version_precedente: null
    texte: décret n° 2008-637 du 30 juin 2008
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Même remarque : le moteur ne sert pas ces bonifications.

  - code: bonifications_speciaux_quinze_ans
    date: 2017-01-01
    face: droit
    sens: ferme
    libelle: Les deux régimes exigent quinze années de services effectifs
    quoi: >-
      La même phrase entre le même jour dans les deux décrets : « Les
      bonifications prévues au présent [article] sont prises en compte dès lors
      que la pension rémunère au moins QUINZE ANNÉES de services effectifs. »
      C'est la condition que le code des pensions avait reçue en 2011 pour ses
      propres bonifications, étendue six ans plus tard aux régimes spéciaux.
      Les réformes de la fonction publique et celles des régimes spéciaux ne
      sont pas simultanées, mais elles se suivent.
    dispositifs: [bonifications_regimes_speciaux]
    article: article 9 du décret n° 2008-639 du 30 juin 2008
    version: LEGIARTI000023733183
    version_precedente: LEGIARTI000023733112
    texte: null
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Sans objet : le moteur ne sert pas ces bonifications.

  - code: activite_partielle_bonifiante
    date: 2020-12-03
    face: droit
    sens: ouvre
    libelle: Le chômage partiel de 2020 compte comme du service pour la bonification
    quoi: >-
      Le décret du 1er décembre 2020 ajoute aux deux articles que « les périodes
      durant lesquelles les agents ont bénéficié de l'indemnité mentionnée au II
      de l'article L. 5122-1 du code du travail sont prises en compte pour le
      calcul de ces bonifications », applicables aux périodes courant à compter
      du 1er mars 2020. Un mois d'activité partielle vaut donc un mois de
      conduite, ou de tableau B, pour un droit qui n'a jamais été cotisé.
      C'est une ouverture minuscule et instructive : la crise sanitaire a élargi
      un avantage non contributif sans que personne ne l'ait décidé comme tel.
    dispositifs: [bonifications_regimes_speciaux]
    article: article 9 du décret n° 2008-639 du 30 juin 2008
    version: LEGIARTI000042597049
    version_precedente: LEGIARTI000023733183
    texte: décret n° 2020-1489 du 1er décembre 2020
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Sans objet, et doublement : le moteur ne sert pas ces bonifications, et
      il ne construit pas de périodes d'activité partielle.

  - code: emploi_equivalent_ratp
    date: 2025-01-01
    face: droit
    sens: ouvre
    libelle: La RATP étend ses bonifications aux emplois équivalents
    quoi: >-
      Le décret du 28 juillet 2023 ajoute, après chacun des emplois du tableau
      B, « ou dans un emploi équivalent au sens du dernier alinéa de l'article
      2 », pour les pensions prenant effet à compter du 1er janvier 2025. Le
      tableau cesse d'être une liste fermée : un emploi qui lui ressemble ouvre
      désormais le même droit.
    dispositifs: [bonifications_regimes_speciaux]
    article: article 20 du décret n° 2008-637 du 30 juin 2008
    version: LEGIARTI000047914213
    version_precedente: LEGIARTI000050710711
    texte: décret n° 2023-690 du 28 juillet 2023
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Sans objet : le moteur ne sert pas ces bonifications.

  - code: conge_de_mobilite_bonifiant
    date: 2026-08-07
    face: droit
    sens: ouvre
    libelle: Le congé de mobilité compte lui aussi comme du service, à la SNCF
    quoi: >-
      Le décret du 4 août 2026 ajoute à l'article 9 que les périodes de congé
      de mobilité de l'article L. 1237-18 du code du travail sont prises en
      compte au même titre que l'activité partielle. C'est le déplacement de
      frontière le plus RÉCENT que l'index du dépôt porte, toutes faces
      confondues — et il va, comme presque tous les autres du côté des droits,
      dans le sens de l'élargissement.
    dispositifs: [bonifications_regimes_speciaux]
    article: article 9 du décret n° 2008-639 du 30 juin 2008
    version: LEGIARTI000054622839
    version_precedente: LEGIARTI000048897013
    texte: décret n° 2026-738 du 4 août 2026
    lu_le: 2026-09-21
    portee_modele: non_applique
    effet_modele: >-
      Sans objet : le moteur ne sert pas ces bonifications, et ne connaît pas
