date: "2026-11-22"
session: "action 191 : les salaires des assurances sociales de 1930 à 1944 au salaire annuel moyen"
consulte: >-
  La circulaire ministérielle n° 151 du 5 août 1946, dans la base de législation
  de la Cnav ; l'index JORF de la DILA, pour l'arrêté du 14 mai 1946 (absent) ;
  la page des coefficients de la Cnav d'avant 2013 et les éditions du barème
  depuis avril 2013, leur tableau des cotisations d'avant 1947.
trouve: >-
  Les cotisations de 1930 à 1944 entrent au salaire annuel moyen, revalorisées
  par 3, 2 ou 1 (circulaire n° 151), puis par chaque colonne de la Cnav ; le
  modèle ne les comptait pas. Corrigé, avec ses tests. Détail :
  docs/feuille_de_route/191/2026-11-22-salaires-des-assurances-sociales.md.
reste: >-
  L'arrêté du 14 mai 1946 au JO ; les coefficients de cotisations de 1945 et
  1946 ; le salaire fictif des périodes assimilées d'avant août 1947.
