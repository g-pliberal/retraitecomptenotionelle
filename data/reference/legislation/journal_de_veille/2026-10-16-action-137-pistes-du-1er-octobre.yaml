date: "2026-10-16"
session: "action 137 : les pistes du 1er octobre (Aphrodite, Osiris, sections libérales, IRCEC, CAVIMAC, Pension Adequacy Report, quatre pays), vérifiées et classées"
consulte: >-
  Aucune règle du scénario 1 n'est touchée : la session classe des modèles. L'étude
  d'impact du projet de loi de financement rectificative pour 2023 (n° 760) ;
  l'annexe 9 de la lettre rectificative au PLFSS pour 2026 (fiche de l'article 45 bis) ;
  la page de la DG Trésor des articles sur Aphrodite ; les documents du COR sur
  l'organisation de ses projections (20 avril 2023) et leur présentation par régime
  (juillet 2024), et sa fiche CNAVPL ; les deux volumes du Pension Adequacy Report 2024
  (Conseil, 10251/24 ADD 1 et ADD 2) ; le rapport de la Banque mondiale n° 70430 sur la
  Mongolie (2008) ; pour la Russie, l'art. 32 de la loi 173-FZ ; pour l'Égypte et
  l'Azerbaïdjan, des sources secondaires (AISS, SSA, catalogues), la loi azerbaïdjanaise
  sur NATLEX répondant 403.
trouve: >-
  Aucun texte nouveau. Ni Aphrodite ni Osiris ne sont nommés depuis 2020 : la réforme de
  2023 et la suspension de 2025 sont chiffrées par PRISME. Les caisses des professions
  libérales, l'IRCEC et la CAVIMAC n'ont pas de modèle publié. Les taux du Pension
  Adequacy Report viennent des modèles de l'OCDE et des États. La Russie, l'Égypte,
  l'Azerbaïdjan et la Mongolie ne publient pas de modèle.
reste: >-
  La loi azerbaïdjanaise sur les pensions de travail, à relire à la source si NATLEX
  répond ; la campagne 2025 de l'EACR, au printemps 2027.
