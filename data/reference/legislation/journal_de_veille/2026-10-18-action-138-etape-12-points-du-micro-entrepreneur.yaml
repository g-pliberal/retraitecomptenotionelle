date: "2026-10-18"
session: "action 138, étape 12 : les points du micro-entrepreneur, achetés par son forfait, et sa nouvelle pension en cumul"
consulte: >-
  L'index LEGI du dépôt, mis à jour au 17 octobre 2026 (sept incréments, aucune
  rédaction nouvelle à inscrire) : le règlement du RCI (arrêté du 9 février
  2012), articles 3, 9, 47 et 48, et, en vigueur le 1er janvier 2027, 9-7, 9-8
  et l'annexe 4 ; D. 635-7 et D. 635-9 ; D. 643-1 (LEGIARTI000029825121,
  LEGIARTI000049904642) ; D. 613-6 de 2026 et D. 131-5-3 ; D. 634-1, D. 634-3,
  R. 634-1 et R. 351-29. Au site de la Cnav : la circulaire n° 2025-20,
  annexe 1, et sa recherche (« L161-22-1-1 », « nouvelle pension », « R634-1 »,
  « cumul emploi-retraite », « nouveaux droits ») ; les circulaires n° 2023-21,
  2023-25, 2024-30, 2025-03, 2025-19, 2026-22 et 2026-31, sans rapport.
  Service-public, F23369, vérifié le 14 octobre 2026. La Cipav : fiche pratique
  « Cotiser pour acquérir des droits à retraite », auto-entrepreneurs, 2026 ;
  guide pratique du micro-entrepreneur de 2018 ; celle de 2025 ne se sert plus
  (404). Previssima, 8 juin 2018, sur l'arrêt de la cour d'appel de Versailles.
trouve: >-
  Les points du micro-entrepreneur s'achètent avec ce qu'il a versé : au RCI, la
  part complémentaire du forfait, un point par revenu de référence (règlement,
  articles 3 et 47 ; « 211 € / 17,691 € = 11,92 = 12 points », circulaire
  n° 2025-20 ; « 13,53 arrondi à l'entier inférieur 13 », F23369) ; à la
  CNAVPL, les parts des deux tranches de D. 642-3, « au prorata des cotisations
  acquittées » (D. 643-1 ; la Cipav, « 2 706,05 / 7,53 = 359,37 points ») ; à la
  complémentaire de la Cipav, la sienne (« 3 418,75 € », « 72,13 points »).
  Portés dans les deux moteurs : le libéral de l'Assurance retraite perd 6,55 %
  au scénario 1, la Cipav de petites recettes 12,48 %, la vente gagne 0,38 %.
  L'arrêté du 21 septembre 2026 ouvre au libéral de l'Assurance retraite, de
  2027 à 2033, un versement facultatif de RCI pour 2018 à 2025, ses points
  arrondis à l'entier le plus proche (articles 9-7, 9-8, annexe 4), que le
  scénario 1 ne présume pas. La nouvelle pension du micro-entrepreneur en cumul
  porte son revenu cotisé ; celle de l'indépendant n'a pas le salaire mensuel
  moyen du salarié : D. 634-1 écarte R. 351-29 de 2023 à 2025, R. 634-1 fait le
  revenu annuel moyen des cotisations versées, l'année d'effet comprise, et
  D. 634-3, depuis 2026, écarte les III et IV de R. 351-29.
reste: >-
  La nouvelle pension de l'indépendant au revenu annuel, avec la circulaire Cnav
  qui applique R. 634-1 et D. 634-3 ; l'arrondi des points du RCI à l'entier,
  que la circulaire et service-public ne font pas dans le même sens ; la Cipav de
  2009 à 2015, la « cotisation réduite » que la cour d'appel de Versailles a
  refusée ; les restes des notes précédentes.
