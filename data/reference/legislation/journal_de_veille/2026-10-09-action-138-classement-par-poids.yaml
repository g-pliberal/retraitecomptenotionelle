date: "2026-10-09"
session: >-
  action 138 : le classement de ses restes par leur poids sur ce que le site
  compare, demandé par le propriétaire
consulte: >-
  Le registre des autres modèles (283 points, dont 163 dits à reprendre et 43 à
  trancher), les notes et les blocs « Reprise » de l'action 138, la feuille de
  route ; les effectifs, les masses et les postes non contributifs de 2024 du
  dépôt ; la couche des comptes notionnels et cout.py, pour ce que la
  proposition reprend. Hors du dépôt, une recherche de Destinie 3 : seule
  répond la présentation de Destinie 2 par l'INSEE au COR, en 2020. Aucun texte
  de droit.
trouve: >-
  Cinq restes lourds — l'effet retour, la CNRACL pondérée sur un seul départ à
  57 ans, les années sans montant comptées zéro au compte notionnel, la
  population, la revalorisation différenciée du projet de loi de financement
  pour 2027 s'il est voté — et dix moyens ; une centaine de restes légers ou
  nuls, à déclarer dans la carte. Les choix de l'étape 13 pèsent plus que tout.
  Le registre retarde sur les étapes 2, 4, 6, 8 et 17.
reste: >-
  Au propriétaire : la coupe, et les choix de l'étape 13. La relecture des
  points du registre que les étapes ont repris.
