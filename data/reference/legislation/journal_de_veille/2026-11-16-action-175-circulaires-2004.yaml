date: "2026-11-16"
session: "action 175, étape 6 : les 73 circulaires, lettres et instructions de 2004 que la base de la Cnav cite sans thème"
consulte: >-
  Les 73 références sans thème et à lire de 2004 dont le titre commence par
  « Circulaire », « Lettre », « Instruction », « Note d'information » ou « Diffusion
  d'instructions », relues par l'API de la base le 16 novembre 2026 à 11 h 20 UTC
  (/reference/referencesByFileLeafRef/), toutes servies, 57 en page et 16 en PDF lus par
  leur texte au site (/Pdf/) ; toutes lues en entier, par quatre agents de la session, un
  lot chacun, dont chaque citation a été retrouvée mot pour mot dans le texte servi. Pour
  les confronter : les fiches reversion, retraite_anticipee_handicap, inaptitude_au_travail,
  priorite_majorations_enfants, minimum_contributif, surcote_regime_general,
  decote_regime_general, csg_des_pensions_selon_le_revenu, credit_foncier_transfert_1989 ;
  le tableau legislation/accords_internationaux.yaml ; le moteur des périodes étrangères
  (src/retraite_notionnelle/droit/etranger.py) ; la fiche regimes/regime_general.yaml ; les
  séries macro/smic_horaire_releves.csv, macro/plafond_securite_sociale.csv,
  legislation/validation_trimestres.csv, legislation/csg_pensions_seuils.csv,
  legislation/minimum_contributif.csv, legislation/duree_assurance_requise.csv,
  legislation/duree_proratisation.csv, legislation/minimum_vieillesse_avant_2007.csv ; la
  limite docs/limites/3-systeme-actuel.md. Ni Légifrance, ni le Journal officiel, ni
  l'index de la DILA.
trouve: >-
  Le registre range les 73 (36 limite, 37 hors_modele), sans raison neuve. Conformes : le
  SMIC du 1er juillet 2004, le trimestre de 2005, le seuil de la CSG de 2005, le plafond de
  2004, le minimum contributif de 2004, les durées des générations 1944 à 1948, la décote
  des artisans par génération, les plafonds des veuves de guerre. Un écart neuf, à
  trancher : la lettre ministérielle du 5 octobre 2004 fait servir la réversion aux règles
  d'avant la loi du 21 août 2003, quand la fiche reversion applique la réforme depuis le
  1er juillet 2004 sans nommer cette suspension. Déjà déclarés : le plafond de l'inapte,
  le plafond de la réversion au SMIC de juillet, le congé de reclassement, l'exception de
  la CRPCEN. Note docs/feuille_de_route/175/2026-11-16-etape-6-circulaires-2004.md.
reste: >-
  Les 745 circulaires de 2005 à 2026, par période ; les autres natures de l'étape 6 ; les
  décrets de la réversion de 2004 (24 août et décembre), à relire au Journal officiel pour
  dire si la suspension fut provisoire ; la durée opposée en 2004 aux handicapés nés en
  1949.
