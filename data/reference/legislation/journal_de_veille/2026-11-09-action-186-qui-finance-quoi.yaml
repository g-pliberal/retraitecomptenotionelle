date: "2026-11-09"
session: "action 186, chantier 4 : qui finance quoi, la table des recettes de la retraite en 2026"
consulte: >-
  Aucune règle du scénario 1 n'est touchée, et l'index LEGI n'est pas
  interrogé. Lus ce jour : le rapport à la Commission des comptes de la
  sécurité sociale d'octobre 2026 (tableau 13, fiches 1.4, 1.6, 4.5, 4.8 à
  4.15 et 5.3) ; le rapport annuel du COR de juin 2026, partie 2,
  chapitre 2 ; le communiqué de l'Agirc-Arrco du 31 mars 2026.
trouve: >-
  Aucun écart avec les fiches. Trois faits que le dépôt ne porte pas : la
  Cnav a repris le 1er janvier 2026 les missions et la CSG du fonds de
  solidarité vieillesse (loi de financement pour 2025, article 24), 22,1 Md€ ;
  elle ne reçoit aucune fraction de TVA, toute celle de la sécurité sociale
  allant à l'assurance maladie ; la CTA rapporte 1,67 Md€ en 2026 après
  2,16 en 2025. La structure des ressources du dépôt applique à un total
  hors produits financiers des parts qui les comptent. Détail :
  docs/feuille_de_route/186/2026-11-09-qui-finance-quoi.md.
reste: >-
  Les six questions au propriétaire, en fin de note ; puis une session du
  modèle. Les comptes de 2025 des complémentaires, ligne à ligne, ne sont
  lus à aucune source.
