date: 2026-09-22
session: la liquidation unique, vérifiée par construction
consulte: >-
  Circulaire Cnav 2017/27 du 21 juillet 2017, lue dans son PDF avec le
  lecteur du dépôt : la règle du revenu annuel moyen unique (R. 173-4-4-1,
  4° CSS, décret n° 2017-735 du 3 mai 2017), le régime compétent, les
  bornes de la LURA (générations à compter de 1953, pensions prenant effet
  au 1er juillet 2017). Ses exemples portent tous sur la COMPÉTENCE ; aucun
  ne chiffre une pension, et la recherche n'a trouvé aucun exemple chiffré
  publié ailleurs. À défaut d'oracle — OpenFisca n'a pas de module pour les
  indépendants ni pour la MSA —, la vérification s'est faite par
  construction, sur deux carrières du modèle.
trouve: >-
  LE MODÈLE EN FAIT LA MOITIÉ, ET PAR UN AUTRE CHEMIN. Une carrière moitié
  privée moitié artisanale, née en 1960 et liquidée à 64 ans, reçoit « SR
  40 748,99 € × 50,625 % × 167/167, 3 caisses liquidées ensemble » : c'est
  le résultat de la LURA, obtenu parce que le modèle réunit un régime et
  celui qui l'a ABSORBÉ — CANCAVA, RSI puis régime général. La même
  carrière avec la MSA des salariés donne deux pensions, « SR 41 499,37 €
  × 88/167 » et « SR 29 069,36 € × 80/167 », là où la caisse en calcule
  une : le régime agricole existe toujours, aucune absorption ne le
  rattache, et la LURA le couvre pourtant. Les bornes manquent aussi dans
  l'autre sens : le regroupement du régime général et des indépendants est
  daté par l'absorption de 2018-2020, non par le 1er juillet 2017, si bien
  qu'une carrière liquidée entre les deux dates est coupée en deux. La
  ligne passe de `a_verifier` à `approximation`, avec ce que la correction
  demande.
reste: >-
  La correction elle-même, qui est une modification du moteur et de son
  portage : ajouter `msa_salaries` au groupe, sous les deux conditions de
  la LURA, et dater le regroupement sur la loi. Le sens de l'écart n'a pas
  été chiffré : il demande de refaire le calcul selon la règle, et les deux
  salaires de référence que le modèle calcule encadrent celui que la caisse
  retiendrait. `limites.md` porte la mesure, sous « Ce qui reste hors du
  modèle ».
