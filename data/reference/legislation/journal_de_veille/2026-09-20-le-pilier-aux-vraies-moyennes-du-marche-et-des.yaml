date: "2026-09-20"
session: "le pilier aux vraies moyennes du marché, et des frais qui baissent par paliers"
consulte: >-
  Pour la baisse des frais sous la concurrence ou la règle : ICI, Trends
  in the Expenses and Fees of Funds 2025 (per32-01.pdf) ; DWP, Pension
  charges survey 2020 ; Superintendencia de Pensiones du Chili,
  communiqués des adjudications 2023-2025 et 2025-2027, et l'étude de la
  Bibliothèque du Congrès chilien sur les commissions des AFP 1990-2018 ;
  Pensionsmyndigheten, communiqué du 3 septembre 2014 sur la remise et
  page des frais 2026 ; APRA et Rainmaker pour MySuper ; les rapports
  OPEF 2025 et 2026 relus pour la vitesse comparée du frais sur versement
  (mesuré sur les primes) et du frais de gestion (mesuré sur l'encours).
trouve: >-
  Partout la baisse va par à-coups : plafond britannique (0,75 % en 2015,
  0,48 % constatés en 2020, 0,29 % en fiduciaire), adjudications
  chiliennes (1,14, 0,77, 0,47, 0,41 %, remontée à 0,69 % en 2018, 0,46 %
  en 2025, 1,36 % avant 2010), remise suédoise (0,31 % net en 2013,
  0,21 % en 2020, 0,11 % en 2026). Sous la seule concurrence, 3,3 % de
  baisse par an sur trente ans aux États-Unis (1,04 % à 0,40 %). En
  France, le frais sur versement du PER baisse de 1,20 à 1,09 % en deux
  ans quand le frais de gestion sur l'encours ne bouge pas : la baisse
  porte sur les nouveaux dépôts. Le modèle retient désormais les moyennes
  du marché (arrérages 0,99 % et non 2,20 %), le frais sur la réserve de
  rente (0,52 % estimé, 8 % de rente), des paliers décennaux au rythme
  américain jusqu'au plancher de l'ERAFP, et un stock qui referme 10 % de
  son écart par an. Effet sur une carrière entière après la bascule :
  + 8 % de rente par rapport à l'ancien réglage ; − 7 % pour qui liquide
  en 2034, le frais sur la réserve pesant avant que les paliers jouent.
  Aucune règle du scénario 1 n'est touchée.
reste: >-
  Les paliers sont une hypothèse datée, pas une mesure : ni la Suède ni le
  Chili n'ont de série publique avant 2013 et 2010, et la remontée
  chilienne de 2018 montre qu'une baisse n'est pas acquise ; le modèle ne
  fait jamais remonter un frais. Le frais sur la réserve de rente est
  estimé au milieu d'une fourchette du CCSF de 2021, sans mesure de
  l'OPEF. Aucune médiane n'existe pour le versement et la gestion.
