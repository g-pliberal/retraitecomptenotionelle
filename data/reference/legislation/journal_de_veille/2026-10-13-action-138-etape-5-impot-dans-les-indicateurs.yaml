date: "2026-10-13"
session: "action 138, étape 5, troisième partie : l'impôt sur le revenu dans les indicateurs de cycle de vie"
consulte: >-
  L'index LEGI (à jour au 11 octobre 2026) : les versions de l'article 81 du code général des
  impôts, de sa rédaction de 1950 (LEGIARTI000048121406), qui exonère « les majorations de
  retraite ou de pension pour charges de famille », à celle du 1er janvier 2014
  (LEGIARTI000028416932), où le 2° ter qui les exonérait est abrogé ; les versions de
  l'article 158, de 1950 à 2026, dont le 7, 1° multiplie par 1,25 le bénéfice des
  non-adhérents d'un organisme de gestion agréé de sa rédaction du 31 décembre 2006
  (LEGIARTI000006307988) à son abrogation au 1er janvier 2024 (LEGIARTI000042978882). L'index
  JORF : la loi de financement de la sécurité sociale pour 2014 (JORFARTI000028372842) et les
  articles de la loi de finances pour 2014 qu'il garde, la saisine du Conseil constitutionnel
  et les observations du Gouvernement sur elle. Les taux net et le patrimoine net de l'OCDE
  (Pensions at a Glance 2025, témoin du dépôt).
trouve: >-
  Le bénéfice d'un indépendant s'impose sans l'abattement de 10 % des salaires, et majoré,
  jusqu'à l'abrogation de 2024, pour qui n'adhère pas à un organisme de gestion agréé : le
  module de l'impôt ne le calcule pas, et les indicateurs après impôt laissent sans revenus
  après impôt les carrières d'indépendant. La majoration pour enfants était exonérée jusqu'à
  l'abrogation du 2° ter ; l'annexe de la LFSS pour 2014 en annonce l'imposition, mais
  l'article de la loi de finances qui la fait n'est dans aucun des deux index : le dépôt
  l'impose à toute époque. Le scénario 1 ne change pas : l'impôt n'entre que dans les
  indicateurs de cycle de vie, après impôt, qui retrouvent le taux net de l'OCDE à 0,4 point
  près de sa pension brute.
reste: >-
  L'article de la loi de finances pour 2014 qui impose la majoration pour enfants, et l'année
  de revenus qu'il vise. Les règles du bénéfice des indépendants d'avant 2006, l'abattement
  des adhérents d'un centre de gestion agréé, non lues.
