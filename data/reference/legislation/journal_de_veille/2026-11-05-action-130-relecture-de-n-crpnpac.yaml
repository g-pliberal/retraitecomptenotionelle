trouve: >-
  Les citations de N sont exactes, sauf « l'âge [...] d'ouverture du droit à pension »
  (R. 426-16-1, docstring du test et fiche), où le « d' » n'est pas dans le texte ;
  R. 6527-21 n'a pas la « même phrase », mais les mêmes conditions. Les dates se refont à la
  main : CRPNPAC au 1er mars 2019 (R. 426-15-4 : « le premier jour du mois suivant la
  réception de la demande »), régime général au 1er décembre 2026 (62 ans et 9 mois,
  R. 351-37). Les deux moteurs les rendent, sous PRESOMPTIONS_DECALEES=1 aussi ; le test était
  rouge au commit parent ; la carrière longue du navigant reste servie. Le décret
  n° 2011-1500, article 26, I, abaisse les vingt annuités à 17 en 2014 et à 19,5 en 2019.
  Avant 2012, la CRPNPAC s'ouvrait par anticipation dès 45 ans (R. 426-15-1 de 1995, sous
  les coefficients de R. 426-18 ; R. 426-15-1 de 1984, avec vingt-cinq annuités) : le
  modèle refuse ces départs. Aucun témoin n'a de navigant.
reste: >-
  Un défaut candidat, antérieur à N : la CRPNPAC avant 2012, ouverte dès 45 ans. Le
  barème transitoire des annuités (décret n° 2011-1500, article 26) est à porter au défaut
  candidat des vingt annuités. Dans la fiche liquidation_regime_par_regime, à reprendre :
  la citation de R. 426-16-1, la phrase sur 1995 à 2011, les rédactions de D. 351-1-1
  depuis 2023, R. 426-15-4, et le renvoi de l'Agirc-Arrco à l'écart déjà déclaré. Note :
  docs/feuille_de_route/130/2026-11-05-relecture-de-n-crpnpac.md.
