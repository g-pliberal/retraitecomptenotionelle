date: "2026-09-28"
session: >-
  l'action 131, la durée majorée des artisans et commerçants, portée
consulte: >-
  L'index LEGI : D. 634-5 dans ses rédactions de 1990, 2009, 2011, 2017,
  2020 et 2023 ; la table des taux annuels de la CANCAVA et de l'ORGANIC,
  pour les taux moyens de contrôle des périodes coupées.
trouve: >-
  D. 634-5 applique R. 351-7 aux artisans et commerçants depuis le 1er
  janvier 1990, sur leurs seuls trimestres d'après 1972 et sans porter la
  durée d'avant et d'après 1973 au-delà de la limite ; ses rédactions
  suivent celles de R. 351-7 (la limite de L. 351-1 en 2009, l'âge du 1°
  de L. 351-8 en 2011, le RSI en 2017, les travailleurs indépendants en
  2020).
reste: >-
  Les années d'avant 1973 dans la base de la majoration ; le texte de
  1984 à 1989, que l'index ne porte pas.
