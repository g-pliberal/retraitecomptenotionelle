date: "2026-11-19"
session: "action 191 : la date de 2023 du cumul emploi-retraite, relue par une session indépendante"
consulte: >-
  Par l'index JORF et LEGI de la DILA : la loi n° 2023-270 du 14 avril 2023,
  article 26 en entier (JORFARTI000047445113) ; la loi n° 2014-40 du
  20 janvier 2014, article 19 (JORFARTI000028493657, LEGIARTI000031686283) ;
  L. 161-22-1 A (LEGIARTI000028496884) ; L. 161-22-1 dans ses trois
  rédactions (LEGIARTI000006741254, LEGIARTI000047453688,
  LEGIARTI000053279754) ; le décret n° 2023-751 du 10 août 2023, articles 7
  et 9 (JORFARTI000047956310, JORFARTI000047956318). Dans la base de
  législation de la Cnav : les circulaires de 2023 et de 2024, et les exposés
  « Fin d'acquisition de droits à retraite » (modifié le 24 novembre 2025) et
  « Retraite personnelle issue d'un cumul emploi retraite » (modifié le
  28 septembre 2026).
trouve: >-
  L. 161-22-1 récrit entre en vigueur le 1er septembre 2023, sans borne sur
  la date de la première pension ; le 3° du XII ne remonte au 1er janvier
  2023 que pour les droits du cumul intégral. Pour une première pension
  d'avant 2015, les mois de janvier à août 2023 relèvent donc des règles
  d'avant, et la fiche droits_apres_la_premiere_pension les éteint à tort.
  Rien n'est corrigé. Détail :
  docs/feuille_de_route/191/2026-11-19-relecture-de-la-date-de-2023-du-cumul.md.
reste: >-
  L'accord du propriétaire pour corriger la borne. L'exposé de la Cnav garde
  la borne du 1er janvier 2015 sans date de fin, et sa base ne porte aucune
  circulaire de 2023 ou 2024 sur le cumul : ce que la caisse fait de
  l'assuré d'avant 2015 après août 2023 reste à lire, dans une instruction
  ou une circulaire à venir.
