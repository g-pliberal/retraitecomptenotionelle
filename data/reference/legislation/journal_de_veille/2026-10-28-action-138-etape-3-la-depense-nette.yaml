date: "2026-10-28"
session: "action 138, étape 3 : la dépense nette sur la page Coût, à côté de la brute"
consulte: >-
  Aucun texte : la session ne touche pas au droit. La page Coût, son bilan de la
  bascule et le paragraphe « Et en BRUT, des deux côtés », dans Chromium, à la
  largeur d'un téléphone et à celle d'un bureau ; le bilan figé, qui porte le
  taux effectif et la dépense nette depuis le 24 octobre.
trouve: >-
  Le bilan de la bascule montre, sous le solde, la dépense nette des
  prélèvements sociaux des deux systèmes : 13,16 % du PIB en 2026 pour le
  système actuel, 14,13 en brut. Le paragraphe disait la masse nette « au
  plus » au taux plein, quand ce taux en donnait la plus petite valeur ; il la
  chiffre au taux que la DREES mesure, 6,8 % en 2022. TAXIPP et l'Ageing Report
  passent à « repris » au registre. Aucune simulation ne bouge.
reste: >-
  Rien pour la veille.
