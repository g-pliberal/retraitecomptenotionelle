date: "2026-09-28"
session: >-
  l'action 131, la réforme agricole de 2026 (L. 732-24), portée
consulte: >-
  L'index LEGI : L. 732-24 et L. 732-18 (rédactions du 1er janvier 2026),
  D. 732-62, R. 732-48, R. 732-60, R. 732-61, R. 732-63, R. 732-66, R.
  732-67 et R. 732-68 du code rural ; R. 173-3-2 dans ses rédactions du
  1er janvier, du 9 mai et du 1er août 2026, R. 351-27, R. 351-29, R. 351-6
  et L. 351-1 du code de la sécurité sociale. L'index JORF : l'article 87,
  VIII, de la loi n° 2025-199, l'article 6 du décret n° 2025-1409 et
  l'article 13 du décret n° 2025-1410. La page de la MSA « Réforme de la
  retraite des exploitants : 25 meilleures années », relevée le 27.
trouve: >-
  De quoi calculer la réforme : la retraite forfaitaire d'avant 2016,
  3 905,37 € au 1er janvier 2025 (D. 732-62) ; la moyenne des points des
  meilleures années d'avant 2016, arrondie à l'entier, multipliée par le
  quart des trimestres d'avant 2016 (R. 732-66) ; la répartition des
  vingt-cinq années, arrondie à l'entier non nul le plus proche, les années
  surnuméraires retranchées à la plus longue durée (R. 173-3-2) ; le
  calcul provisoire de 2026 et 2027, révisé au plus tard le 31 mars 2028
  s'il est plus faible ; la moitié du plafond (L. 732-24, III).
reste: >-
  La part des vingt-cinq années que R. 173-3-2 laisse au régime général
  d'un ancien exploitant ; le barème de points d'avant 1990 ; le revenu
  des années cotisées au minimum ; un exemple publié d'une pension entière
  calculée par la réforme.
