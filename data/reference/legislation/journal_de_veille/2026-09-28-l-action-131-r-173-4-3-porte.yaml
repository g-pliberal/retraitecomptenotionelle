date: "2026-09-28"
session: >-
  l'action 131, R. 173-4-3 porté
consulte: >-
  L'index LEGI : R. 173-4-3 dans ses rédactions de 2004 et de 2006, en plus
  de celles de 2010 et de 2019. La base législative de la Cnav : la
  circulaire n° 2004/29 du 30 juin 2004, qui l'applique.
trouve: >-
  Les quatre rédactions disent la même règle, les régimes nommés
  changeant avec le RSI ; la circulaire compte les durées superposées, ne
  retient chez les artisans et commerçants que les années depuis 1973, et
  donne deux exemples : 21 x 126 / 174, arrondi à 15 ; 20 x 28 / 135,
  arrondi à 4, ramené à trois années civiles au compte.
reste: >-
  Les durées au dernier jour du trimestre civil précédant l'effet.
