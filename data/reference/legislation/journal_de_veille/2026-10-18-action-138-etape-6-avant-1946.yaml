date: "2026-10-18"
session: "action 138, étape 6 : avant 1946, la retenue"
consulte: >-
  veille_droit.py (dernière veille consignée : 2026-10-18) ; les index LEGI et JORF de
  la release `index-dila`, LEGI mis à jour des sept incréments jusqu'au 17 octobre 2026,
  puis textes.py --inscrire, qui inscrit l'ordonnance n° 45-2250 du 4 octobre 1945 et
  ses 155 rédactions « à examiner ». Dans l'index LEGI : R. 351-9, rédactions de 1985 et
  de 2014 (LEGIARTI000006749353, 028751530) ; le décret n° 45-0179, article 71
  (LEGIARTI000006760608) ; l'ordonnance n° 45-2250, article 32 (LEGIARTI000038154243) ;
  le décret n° 46-1378, article 216 (LEGIARTI000006761396) ; R. 351-12, dont le plafond de
  quatre trimestres par année ne vise que « l'application des dispositions du présent
  article ». Les textes
  de 1928 à 1944 ne sont ni dans l'index LEGI ni dans l'index JORF. Hors de l'index : la
  loi du 5 avril 1928 modifiée par celle du 30 avril 1930, en fac-similé de Gallica que
  reproduit le document n° 7 de la séance du COR du 15 décembre 2022 ; le document n° 10
  de la même séance (B. Valat, Revue d'histoire de la protection sociale, n° 13, 2020) ;
  la conclusion de « La protection sociale sous le régime de Vichy » (P.-J. Hesse et
  J.-P. Le Crom, dir., Presses universitaires de Rennes, 2001), lue sur OpenEdition. L'API
  de la législation de la Cnav : les barèmes « Salaire validant un trimestre »,
  « Plafond d'assujettissement avant 1947 », « Salaire plafond soumis à cotisations »,
  « Coefficients de revalorisation des salaires et cotisations », « Rachat de
  cotisations » et « Cotisations arriérées - Salarié ». Les rapports du ministère sur
  l'application de la loi des assurances sociales (1930-1962) opposent une page de
  contrôle, l'article de Cairn un refus ; le fac-similé du Journal officiel, que
  Légifrance ne sert qu'au navigateur du propriétaire (étape 17), n'a pas été tenté.
trouve: >-
  Avant 1946, le trimestre se lit sur la retenue : les périodes comptent du 1er juillet
  1930 ; jusqu'en 1935, soixante cotisations journalières par trimestre, vingt-deux au
  plus ; de 1936 à 1941, les trimestres d'une retenue d'au moins 15 anciens francs ; de
  1942 à 1945, autant que la retenue annuelle en paie, quatre au plus. La retenue est la
  moitié de la double contribution (loi de 1930, article 2) : 4 % des salaires jusqu'en
  1944, 8 % au total, puis 9, 11 et 12 % au total aux quatre trimestres de 1945, et 12 %
  par moitié selon l'ordonnance n° 45-2250, article 32. Au-delà du plafond
  d'assujettissement — 15 000 anciens francs en 1930, 120 000 du 1er avril 1945 au
  31 décembre 1946, selon la Cnav —, le salarié n'était pas assuré : aucune retenue,
  aucun trimestre, et le décret n° 46-1378, article 216, ne liquide la pension que sur le
  temps de l'assujettissement. Le barème « Salaire validant un trimestre » écrit la
  double cotisation : 30 anciens francs de 1936 à 1945, 216 en 1946, 12 % de 1 800. Le
  scénario 1 lit désormais la retenue et le plafond dans les deux moteurs, pour les
  statuts que le routage porte aux assurances sociales, et le salaire annuel moyen
  écarte l'année non assujettie ; six témoins perdent des trimestres, aucune pension de
  droit direct ne bouge ; les cas types nés de 1885 à 1920 partent plus tard.
reste: >-
  Au fac-similé, les textes de 1930 à 1945 (le décret-loi du 28 octobre 1935, la loi du
  6 janvier 1942, les ordonnances de la fin de 1944) : le taux de la retenue, au niveau
  `moyenne`, le partage des deux premiers trimestres de 1945, les majorations du plafond
  d'assujettissement. Le compte de 1930 à 1935 sur toute la période. Les années des
  indépendants d'avant leurs régimes, et les règles des salariés agricoles d'avant 1946.
