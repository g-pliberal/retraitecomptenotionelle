date: "2026-09-27"
session: >-
  l'action 130, le premier domaine ouvert : les dates des enfants, chaque
  enfant comptant à sa date
consulte: >-
  veille_droit.py au début de la session ; les index LEGI et JORF
  récupérés de la release et mis à jour, jusqu'à l'incrément du 27
  septembre à 20 h 49 ; L. 161-17-2 et L. 161-17-3 dans l'index LEGI.
  Pour le domaine : L. 351-4 dans ses rédactions de 1985, 2001, 2003 et
  2009 ; D. 351-1-7 (LEGIARTI000006736529) ; le décret n° 2003-1280,
  articles 1er et 3 ; la loi n° 2003-775, article 32, au Journal
  officiel ; la loi n° 2009-1646, article 65, au Journal officiel ;
  R. 173-15 dans sa rédaction de 2017 ; la loi n° 75-3, ses articles
  datés dans l'index, et le décret n° 75-109, articles 16 et 20 ; la
  circulaire Cnav 2017-01, fiches n° 6.2a et 6.2b ; pour l'ordre des
  domaines, le rapport du COR « Droits familiaux et conjugaux » et son
  rapport annuel de juin 2026.
trouve: >-
  L. 161-17-2 et L. 161-17-3 n'ont pas de rédaction postérieure au 31
  décembre 2025 : la suspension court toujours ; rien de neuf au Journal
  officiel depuis la dernière veille. Le décret n° 2003-1280, article 3,
  applique le trimestre par anniversaire de D. 351-1-7 aux pensions
  prenant effet à compter du 1er janvier 2004 : la version de 2003 de la
  majoration commence là, et non au 30 décembre 2003. La loi n° 75-3
  s'applique au 1er juillet 1974 : l'index ne date du 4 janvier 1975 que
  ses articles 7 et 8, soit son titre II. La circulaire Cnav 2017-01 lit
  la priorité entre régimes enfant par enfant : le régime général est
  compétent « si un ou plusieurs enfants n'ouvrent pas droit à
  majoration » dans le régime spécial. Le moteur lit désormais les
  versions des deux fiches des trimestres d'enfants, enfant par enfant,
  sans qu'un témoin bouge ; la carte en compte deux découpées.
reste: >-
  Du domaine : le bloc du formulaire ; trois corrections, chacune avec le
  diff de ses témoins — le b ter au 1er septembre 2026, la loi n° 75-3 au
  1er juillet 1974 avec la condition d'éducation de neuf ans, le
  trimestre par anniversaire de 2004 à mars 2010 — ; les exemples publiés
  aux enfants datés ; les rédactions de L. 351-4 depuis 2013, à couper en
  versions ; l'adoption, que la chronologie ne connaît pas encore. De
  l'action 131, ce que l'entrée précédente laissait.
