trouve: >-
  R. 732-69 (2005) donne un barème en revenu cadastral « pour les années 1981 et suivantes »
  et renvoie, pour les années antérieures, aux décrets n° 65-346, 67-570, 74-443 et 75-97, que
  l'index n'a pas en texte : deux phrases de msa_non_salaries.yaml, et une de la période de
  1974 à 1985, récrites ; le décret n° 68-571, que R. 732-69 ne nomme pas, ôté de la liste du
  barème. Le rapport de 150 trimestres à la durée requise change les points d'une même année
  avec la date du départ : dit. LEGITEXT000006065220 est le décret n° 86-1084 ; le n° 81-790
  n'a pas de texte dans LEGI. Le régime naît le 1er juillet 1952 (décret n° 99-875, article 2)
  et la cotisation de l'exercice 1952 est la moitié de l'annuelle (décret n° 52-1166,
  article 45) ; aucun texte lu ne dit les points de cette demi-année ni si P la compte pour
  une année : le modèle la compte entière, déclaré, 0,63 € par an au plus pour le témoin de
  1925. L'arrondi de T et des points majorés, que ni D. 732-77 ni l'article 2 ne disent :
  convention déclarée, avec son effet au plus. Aucun calcul ne change.
reste: >-
  La cotisation de 1952, que le modèle prélève entière dans toute la pension proportionnelle
  quand le décret n° 52-1166 n'en demande que la moitié : une étape à elle, avec les années au
  prorata de l'exploitant. La ligne manque de msa_non_salaries.yaml (« n'est pas lu »), à
  corriger avec l'inventaire. La question de D. 732-76 au propriétaire demeure.
