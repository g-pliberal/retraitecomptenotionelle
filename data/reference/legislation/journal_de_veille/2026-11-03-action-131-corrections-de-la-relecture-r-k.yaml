  son texte (LEGITEXT000006065220, JORFTEXT000000870113) ; le décret n° 81-790, cherché dans
  LEGI et au JORF (JORFTEXT000000335107) ; les notices des décrets n° 67-570
  (JORFTEXT000000514415), 68-571 (JORFTEXT000000330850) et 74-443 (JORFTEXT000000328985) ; les
