date: "2026-09-28"
session: >-
  l'action 131, la durée majorée après l'âge du taux plein, portée
consulte: >-
  veille_droit.py ; les incréments LEGI et JORF (aucun depuis le 27) ;
  L. 161-17-2 et L. 161-17-3, sans rédaction postérieure au 31 décembre
  2025 ; l'index LEGI : R. 351-7 dans ses rédactions de 2011, 2023 et
  2026, L. 351-6 (1985, 2003), R. 173-4-2 (2004, 2017) et R. 173-3-3
  (2026), l'article 36 du décret n° 50-1225 et R. 742-19 du code rural,
  D. 634-1 et D. 634-5, les articles 2, 12, 12-2 et 13-8 du décret
  n° 73-937, les articles 70 à 70-8 du décret n° 45-0179 ; l'index JORF :
  la loi n° 49-244, dont il ne porte que le titre ; Légifrance, qui
  refuse la requête (403) ; la base de législation de la Cnav : l'exposé
  « Majoration de durée d'assurance pour âge » et son barème, l'exposé
  « Montant de la retraite personnelle », les circulaires n° 8/89 et
  n° 2004/20.
trouve: >-
  La majoration se compte en trimestres écoulés, du mois qui suit l'âge du
  taux plein à la date d'effet, et non en trimestres d'activité ; depuis
  2004, sur la durée de tous les régimes, trimestres superposés compris,
  et partagée entre régimes alignés (circulaire n° 2004/20, cinq
  exemples). La circulaire n° 8/89 compare deux pensions, et non deux
  taux, pour qui avait passé soixante-cinq ans en 1983, et fait entrer la
  durée corrigée dans le minimum contributif. D. 634-5 majore les
  artisans et commerçants depuis 1990. Le maximum des pensions est de 50 %
  du plafond à la date d'effet, surcote non comprise, selon la Cnav.
reste: >-
  Les artisans et commerçants liquidés à part (D. 634-5, à porter ; 1984
  à 1989 non lu) ; le maximum des pensions, dont la loi reste à lire ;
  l'ajournement des artisans avant 1984 ; les « soixante et un ans » des
  salariés agricoles ; le reste de l'action 131, que la feuille de route
  dit.
