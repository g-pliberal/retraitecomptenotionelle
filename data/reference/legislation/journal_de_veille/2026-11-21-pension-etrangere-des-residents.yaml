date: "2026-11-21"
session: "action 138 : la pension étrangère de qui réside en France, sa CSG et son impôt"
consulte: >-
  L'index LEGI du dépôt : article 1417 du code général des impôts
  (LEGIARTI000053544248, en vigueur au 1er janvier 2026). BOFiP :
  BOI-RES-RSA-000219-20250811. Notice 2041 GG, revenus 2025 (impots.gouv.fr).
  Rapport n° 231 (2015-2016) du Sénat sur l'avenant franco-allemand du
  31 mars 2015.
trouve: >-
  Le revenu fiscal de référence compte les revenus qu'une convention exonère
  (art. 1417, IV, 1°, c). La CSG, la CRDS et la CASA frappent la pension de
  source étrangère de qui est domicilié en France et à la charge d'un régime
  français d'assurance maladie, sauf convention qui exclut l'imposition par la
  France ; les pensions légales allemandes sont imposées par la France depuis
  2016. Détail : docs/feuille_de_route/138/2026-11-21-pension-etrangere-des-residents.md.
reste: >-
  Les conventions État par État, et la pension publique étrangère qu'elles
  réservent à l'État qui la paie ; la convention franco-suisse de 1966 (articles
  20 et 21), non relue.
