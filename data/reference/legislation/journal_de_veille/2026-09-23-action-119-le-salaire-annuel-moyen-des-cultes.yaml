date: "2026-09-23"
session: "action 119, le salaire annuel moyen des cultes"
consulte: >-
  L. 382-27, R. 382-89 et R. 382-90 dans l'index LEGI ; la page de la
  CAVIMAC sur la retraite de base, réservée puis lue.
trouve: >-
  Le salaire annuel moyen des cultes est fait du forfait du SMIC : le
  modèle le calculait sur le revenu saisi, et c'est corrigé. La pension
  de la caisse se calcule par fractions, dont celle d'avant 1979,
  validée gratuitement.
reste: >-
  Les fractions d'avant 1979 et de 1979 à 1997.
