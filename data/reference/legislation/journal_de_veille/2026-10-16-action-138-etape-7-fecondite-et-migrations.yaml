trouve: >-
  Aucun texte de droit. Sous la fécondité, la pyramide des 50 ans et plus est
  celle du central jusqu'en 2070 ; seuls les 20-64 ans bougent, dès 2046. En
  2070, le système actuel passe de 15,30 % du PIB à 16,38 et 14,31 % sous la
  fécondité basse et haute, à 16,54 et 14,27 % sous les migrations (le COR :
  16,34, 14,34, 16,40 et 14,16 %).
reste: >-
