date: "2026-10-16"
session: "action 138, étape 7 : les variantes de fécondité et de migrations de l'INSEE dans la page Coût, au modèle"
consulte: >-
  Aucune source de droit : la session ne touche à aucune règle du scénario 1.
  Les classeurs 11_fec_haute.xlsx, 12_fec_basse.xlsx, 15_smi_haut.xlsx et
  16_smi_bas.xlsx des projections de population 2026 de l'INSEE
