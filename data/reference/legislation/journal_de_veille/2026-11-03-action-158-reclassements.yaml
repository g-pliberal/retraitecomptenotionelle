date: "2026-11-03"
session: "action 158, étape 2, les reclassements : les tableaux de correspondance d'une grille à la suivante, lus au LEGI dans les statuts et les décrets de carrière"
consulte: >-
  Aucune règle du scénario 1 n'est écrite. L'index LEGI du dépôt, à jour au 2 novembre 2026
  (incrément 20261102-213929) : les versions d'articles qui disent « reclassés » ou
  « intégrés », environ 1 800 dans un millier de textes, statuts particuliers et décrets
  d'organisation des carrières des trois versants et des militaires. Relus en particulier :
  les articles 11 à 17 du décret n° 2016-596 (catégorie C de la territoriale, 1er janvier
  2017), l'article du décret n° 2005-1228 qui reclasse l'ancienne échelle 4 de l'État au
  1er octobre 2005, l'article 5 du décret n° 2016-634 (cadres supérieurs socio-éducatifs de
  l'hospitalière), les décrets n° 2016-219 (contremaîtres de France Télécom), 95-230
  (ingénieurs des travaux ruraux), 2002-121 (assimilations pour la pension). Le JORF n'a pas
  été lu.
trouve: >-
  450 tableaux de reclassement lus, de 291 textes, 7 365 lignes, du 15 août 1969 à 2025,
  dont 328 tableaux de l'État, 74 de la territoriale, 48 de l'hospitalière ; 456 refusés, la
  plupart sans colonne d'ancienneté (tableaux d'assimilation pour la pension, échelons
  comptés en indices), aucun des militaires lu. Le même tableau sert aux promotions et aux
  recrutements, qui ne sont pas des reclassements. 324 tableaux bornent l'ancienneté
  conservée « dans la limite de la durée de l'échelon » ; 1 466 lignes partagent un échelon
  selon l'ancienneté qu'on y a ; 2 893 calculent l'ancienneté conservée. 49 tableaux
  écrivent leur date d'effet, parfois postérieure à l'article (le décret n° 2016-634, de mai
  2016, reclasse au 1er janvier 2017).
reste: >-
  Le chaînage : rattacher chaque tableau à sa grille d'origine et à sa grille d'accueil. Les
  durées d'échelon, sans lesquelles ni l'échelon d'origine à la date du reclassement, ni la
  condition qui le partage, ni l'ancienneté conservée ne s'appliquent (au propriétaire :
  d'abord ?). Les tableaux refusés, ceux des militaires compris.
