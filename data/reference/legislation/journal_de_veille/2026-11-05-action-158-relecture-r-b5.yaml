date: "2026-11-05"
session: "action 158, vague 11, R-B5 : relecture indépendante de B5 (e6e5163 : la date d'effet écrite après « reclassés »)"
consulte: >-
  L'index LEGI du dépôt (incrément 20261102-213929) : les 36 articles des tableaux datés par
  B5, à leur version (n° 95-691 art. 6 ; 95-720 art. 15 ; 96-980 art. 9, 10, 13 ; 97-571
  art. 3 ; 98-280 art. 4 ; 98-416 art. 4 ; 88-1077 art. 50-1 ; 2010-1139 art. 30 et 31 ;
  2016-1798 art. 27 ; 2016-1880 art. 11 ; 2016-1881 art. 25 ; 2017-182 art. 3 ; 2017-194
  art. 23, 46, 68, 117, 144 ; 2017-297 art. 13 ; 2017-310 art. 16 ; 2017-418 art. 18 ;
  2017-593 art. 6 et 7 ; 2017-1350 art. 15 ; 2017-1351 art. 14 ; 2017-1352 art. 15 ; 2017-1376
  art. 20 ; 2017-1404 art. 20 ; 2017-1405 art. 16 ; 2018-188 art. 13 ; 2018-282 art. 4 ;
  2018-619 art. 19 ; 2020-1362 art. 9 ; 2020-1435 art. 9) ; les cas écartés (n° 97-1029 art.
  4 ; 98-268 art. 17, 20 et 28 ; 2001-325 art. 13 à 17 ; arrêté du 18 avril 1989 art. 4) ;
  les articles d'entrée en vigueur n° 98-896 art. 8 et 10, 2000-798 art. 15 et 20, 2017-1367
  art. 23 et 28, 2017-1494 art. 13 et 15. Le JORF et les fac-similés ne sont pas ouverts.
trouve: >-
  Les 36 dates d'effet de B5 sont exactes (citation mot pour mot, version, date). Deux
  reclassements qu'il tient pour non datés le sont par un autre article de leur décret :
  n° 98-268 art. 17 par l'art. 28 (« prennent effet au 1er août 1995 ») et n° 2001-325 art. 14
  par l'art. 17 (« prennent effet au 1er janvier 1997 ») ; l'arrêté du 18 avril 1989 dit
  « reclassés à cette même date ». Le lecteur relancé écrit bien 540 tableaux, mais rien ne
  sort : les 450 du dépôt y sont identiques, 90 s'y ajoutent.
reste: >-
  Candidats : dater par l'article « prend effet » de leur décret les n° 2001-325 art. 14
  (1997-01-01), 98-268 art. 17 (1995-08-01), 98-896 art. 8 (1996-08-01), 2017-1367 art. 23 et
  2017-1494 art. 13, I (2017-01-01), et chercher les autres ; « A la même date » (deux
  tableaux territoriaux) ; étendre le lecteur aux 90 tableaux de l'index publié.
