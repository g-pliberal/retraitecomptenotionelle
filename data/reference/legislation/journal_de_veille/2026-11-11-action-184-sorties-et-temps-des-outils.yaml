date: "2026-11-11"
session: "action 184 : les outils de lecture allégés et accélérés, et ce qui attend le propriétaire"
consulte: >-
  Aucune règle du scénario 1 n'est touchée : la session retouche
  scripts/veille_droit.py, scripts/textes.py et scripts/fetch/dila_index.py.
  Lus ce jour : l'index LEGI du dépôt, récupéré puis mis à jour jusqu'à
  l'incrément du 11 novembre 2026 ; la liste de contrôle des textes, rejouée
  à blanc sans rien y inscrire ; la liste des bases ouvertes de la DILA et le
  dump global de KALI du 8 novembre 2026, en flux, par ses titres.
trouve: >-
  Aucune règle n'a changé. L'inscription des rédactions n'a pas tourné depuis
  le 3 novembre : 1 942 rédactions attendent, dont 394 en vigueur ou à venir
  et 856 de quatre textes généraux de la fonction publique (lois n° 84-16,
  n° 84-53 et n° 86-33, décret n° 85-1148). 56 fiches ont 92 rédactions en
  vigueur ou à venir qu'elles n'ont pas lues, contre 57 et 94 le 3 novembre.
  KALI porte des textes titrés « Régime AGIRC-ARRCO de retraite
  complémentaire » et ses avenants n° 1 et n° 2.
reste: >-
  Le propriétaire a tranché le jour même, et trois étapes de l'action 184 en
  naissent, chacune avec sa note : la liste tenue à jour (les quatre textes
  généraux par leurs seuls articles cités, l'inscription, que GitHub lancera
  chaque lundi), KALI dans l'index, et la passe de lecture des rédactions en
  vigueur, zone par zone. L'inscription reste à lancer, par l'étape 4.
