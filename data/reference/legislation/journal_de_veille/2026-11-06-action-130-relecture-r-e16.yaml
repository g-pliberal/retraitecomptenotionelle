date: "2026-11-06"
session: "action 130, file R-E16 : relecture de E15 (0909a3a), cotisation_par_classes_liberales et les écarts de R-E15"
consulte: >-
  Les index de la DILA récupérés : JORF au 3 novembre 2026, LEGI au 2 novembre. Dans LEGI,
  toutes les rédactions des articles 1, 2, 2 bis, 2-1 et 3 des décrets n° 50-1318,
  53-506 et 79-262 ; les décrets n° 98-599 (article 4), 2015-1802 (article 1er),
  2024-1214 (article 6) et 2025-1076 (article 12). Au JORF, en SQL sans borne : les
  arrêtés de statuts et de règlements des trois sections depuis 2005, au titre ; ceux de
  la CAVEC de 1948 au 1er mars 2008, au titre puis au texte ; les décrets dont le titre
  nomme les décrets n° 79-262, 50-1318 ou 53-506, ou un « décret du 21 mai 1953 » ; les
  statuts que la fiche cite, avec leurs articles de date ; le décret n° 2026-418,
  articles 2 et 4 ; l'arrêté du 11 mai 2009 (CAVP), article 2.
trouve: >-
  Les citations, les versions de LEGI, les dates et les deux moteurs (21 cas, sous les
  deux jeux) : conformes ; le cas du cumul à la CAVEC refait au centime (621,59 € servis,
  3 056,14 € sous la lecture A, 311,26 € pour 2024 seule). Neuf écarts mineurs, aucun sur
  une valeur servie : la mention de l'arrêté du 13 mai 1994 (« art. 49 et 59 », Bulletin
  officiel n° 94-17) et l'arrêté du 14 septembre 1957 ; des arrêtés qui touchent aux
  classes, non cités (CAVEC 19 juin 2019 et 2 juillet 2024, CARPV 27 février 2006 et
  11 janvier 2011, Cipav 3 octobre 2006 et 16 décembre 2021) ; l'article 2-1 du décret
  n° 79-262 (33 % des géomètres de 2000 à 2006), ni cité ni déclaré ; le décret n° 77-313,
  quinzième décret qui modifie l'article 2 du décret n° 53-506 ; vingt-neuf textes à
  rattacher, et non trente et un ; le renvoi de decret_2026_418_liberaux aux classes des
  notaires. Au point non tranché, deux précisions : 2 507,32 € sans les années de classe A
  d'office ; 1 151,68 € si les statuts valent depuis 2019 et le décret avant.
reste: >-
  À E16 : les neuf écarts et les deux précisions. Au fac-similé ou au seul Bulletin
  officiel, en plus de ce que E15 nomme : les statuts de la CARPV d'avant 2014 (arrêté du
  27 février 2006), les arrêtés de la CAVEC de 1957 et du 13 mai 1994.
