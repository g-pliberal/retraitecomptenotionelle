date: "2026-09-17"
session: "action 27 bis, tout ce que le dump de juillet 2025 laissait dans l'ombre"
consulte: >-
  Index LEGI et JORF du dépôt à jour au 16 et au 17 septembre 2026,
  passés au filtre de chacun des seize récupérateurs ; D. 351-1-1 dans
  ses versions de 2003, 2011 et 2012 ; décret n° 2003-1036 (article 7) ;
  décret n° 2025-1076 du 10 novembre 2025 (JORFARTI000052565558, CARPIMKO
  2026).
trouve: >-
  Valeurs identiques partout, sauf ce que le dump ignorait : point
  agricole 2025 (0,3919 €), cotisations libérales 2026 (refonte de la
  CARPIMKO en un taux unique de 8,7 %), contribution CNRACL jusqu'en
  2028 ; et les portes de carrière longue de 2004, 2011 et 2012, lues par
  génération — la table opposait à toutes les générations sous 2012 deux
  portes que le texte n'écrit que génération par génération, et le
  moteur retenait une porte par borne d'entrée quand une borne en ouvre
  deux. Une version qui ne nommait que les premiers mois d'une
  génération en réécrivait l'année : corrigé, sans effet sur les tables.
reste: >-
  Catégories actives (décret n° 2026-344, article non codifié, lu à la
  main) ; fin de la suspension en 2028 ; les lignes « manque » et
  « a_verifier » du registre.
