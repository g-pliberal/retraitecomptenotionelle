date: "2026-10-16"
session: "action 145, étape 2 : la CRFM de Mayotte, les élus du Pacifique et les régies ferroviaires"
consulte: >-
  veille_droit.py (aucune fiche de ces régimes à relire) ; l'index LEGI et l'index JORF
  du dépôt, à jour au 11 octobre 2026. Puis : la loi n° 2001-616, article 64-1, dans
  ses rédactions de 2007, 2012 et 2017 ; le décret n° 2012-1256, articles 1er à 16 ; le
  décret n° 2013-255, articles 1er à 4 ; le rapport sur l'ordonnance n° 2012-790. La loi
  organique n° 99-209, articles 78 et 163 ; l'arrêt de la CAA de Paris du 1er février
  2006 (n° 02PA01530) et le jugement du TA de Nouméa du 6 mars 2002 (n° 01-270), sur
  Juridoc. L. 134-3 du code de la sécurité sociale (rédactions du 1er janvier et du 28
  février 2025) ; l'ordonnance n° 58-1036, articles 1er et 7 ; la loi n° 64-1330,
  articles 1er à 3 ; le décret n° 93-426, article 2 ; la loi n° 2003-1312, article 80 ;
  les analyses des décrets n° 58-1090, n° 93-1150 et n° 60-25, des arrêtés du 13 mai
  1996 et du 28 mars 1997, et des décrets du 4 novembre 1958 et du 17 mars 1959. LexPol
  et le site de l'administration supérieure de Wallis-et-Futuna, de nouveau tentés.
trouve: >-
  Trois fiches de règles, pas encore modélisées ; aucun chiffre du scénario 1 n'en est
  changé. Mayotte : l'agent intégré dans une fonction publique reçoit une pension unique
  dont la part d'avant l'intégration suit le règlement de la CRFM au 1er janvier 2006 et
  garde l'âge de 55 ans, sauf option ; le modèle simule toute la carrière au régime
  d'accueil. Nouvelle-Calédonie : les élus indemnisés sont affiliés à la CAFAT depuis la
  délibération n° 431 du 22 juillet 1977, connue par l'arrêt qui la cite. Régies
  ferroviaires : règlement non publié ; la Cnav en assure l'équilibre depuis 2025
  (L. 134-3, 3°, j). LexPol et Wallis-et-Futuna, toujours injoignables.
reste: >-
  Le règlement de la CRFM (à demander à la CNRACL ou au service liquidateur) ; les
  délibérations calédoniennes n° 431 de 1977 et n° 124 de 1981 et celles du congrès
  depuis 1999 ; sur LexPol, les actes polynésiens sur la retraite des élus et les textes
  de la CPS nommés par la note du 16 octobre ; le Journal officiel de Wallis-et-Futuna ;
  le règlement de la caisse des régies ferroviaires, tenu à la Caisse des dépôts.
