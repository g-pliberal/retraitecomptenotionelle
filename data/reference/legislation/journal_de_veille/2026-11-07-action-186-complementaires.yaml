date: "2026-11-07"
session: "action 186, chantier 6 : les complémentaires étudiées aux sources pour le programme, l'argent qui n'est pas cotisation, leurs réserves, et la manière de les sauver"
consulte: >-
  Aucune règle du scénario 1 n'est touchée. Le communiqué de l'Agirc-Arrco du
  31 mars 2026 sur ses résultats de 2025, et son recueil Chiffr'Agirc-Arrco
  2026 (paramètres, CEG et CET, assiettes, rapport démographique, points des
  chômeurs) ; le rapport annuel du COR de juin 2026 (structure des
  ressources, situation patrimoniale fin 2025) ; le rapport de la Commission
  des comptes de la sécurité sociale de mai 2026 (compensation des
  allègements à l'Agirc-Arrco, RGDU, adossement des IEG) ; la synthèse
  budgétaire de la MSA sur la RCO (mai 2024) et la fiche du COR sur les
  régimes des non-salariés agricoles (juin 2024) ; l'avis du Conseil d'État
  sur les projets de loi instituant un système universel de retraite
  (janvier 2020), qui cite la décision 2013-682 DC du Conseil
  constitutionnel ; la réponse à la question écrite n° 2271 de la XIVe
  législature sur la soulte des IEG et l'article L. 222-7 du code de la
  sécurité sociale.
trouve: >-
  Les impôts et taxes de l'Agirc-Arrco sont la compensation, par une fraction
  de TVA que verse l'Urssaf, de la réduction générale étendue aux
  cotisations complémentaires depuis 2019, « à l'euro près », le reliquat
  pesant sur le régime général (0,8 Md€ à la Cnav en 2025). Ceux de la RCO
  sont une fraction des droits sur les alcools, portée de 13,81 % à 26,73 %
  au 1er janvier 2022 pour la garantie à 85 % du SMIC. La CEG remplace depuis
  2019 l'AGFF et la GMP. Les réserves des régimes en répartition font
  223,9 Md€ fin 2025, à 91 % aux complémentaires. Aucune erreur des fiches
  n'est déclarée. Le détail est dans la note
  docs/feuille_de_route/186/2026-11-07-complementaires-etude.md.
reste: >-
  Non trouvé : le montant de la compensation versée à l'Agirc-Arrco seule,
  estimé à côté ; le rapport démographique officiel de l'Ircantec, des
  sections de la CNAVPL et du RCI ; le nombre de bénéficiaires du complément
  différentiel de la RCO. Non lus dans leur texte : les articles 49 à 64 du
  projet de loi de 2020, le rapport Delevoye, l'accord du 30 octobre 2015 sur
  la fusion de l'Agirc et de l'Arrco. Non examinés : les complémentaires de
  la CNBF et de la CRPNPAC, et le RAFP.
