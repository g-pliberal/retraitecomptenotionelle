date: "2026-10-14"
session: "action 138, étape 8 : le statut du non-salarié agricole dans les deux minima des exploitants et les points gratuits de la RCO"
consulte: >-
  Dans l'index LEGI du dépôt, à jour au 11 octobre 2026 : D. 732-110 dans ses huit
  rédactions (2005 à 2026), D. 732-111 de 2009 à 2026, D. 732-109 de 2009 à 2026 ;
  L. 732-56 de 2003 à 2026, dont la rédaction du 11 novembre 2010
  (LEGIARTI000023034502) ; L. 732-63 de 2014 à 2026 ; D. 732-166-1 et D. 732-166-3
  de 2015 à 2026.
trouve: >-
  De 2009 à 2021, PMR = PMR1 × DM1 / DR + PMR2 × DM2 / DR (D. 732-111) : DM1, les
  périodes de chef, retenues en priorité ; DM2, celles du collaborateur, du conjoint
  participant aux travaux et de l'aide familial (D. 732-110, II, 4°). La condition de
  dix-sept ans et demi de chef, qui renvoyait le chef plus bref à PMR2, n'est que dans
  la rédaction de 2009 (en vigueur jusqu'au 1er janvier 2011) : le décret
  n° 2010-1759 l'a ôtée, et le dépôt l'appliquait jusqu'en 2021. Seules comptent les
  périodes « à titre exclusif ou principal », et, depuis le 1er janvier 2026, celles
  à titre secondaire, dans la PMR (D. 732-110) comme dans le complément différentiel
  (L. 732-63, I et III ; D. 732-166-1). Le complément, ses dix-sept ans et demi et
  son prorata ne comptent que la durée de chef (D. 732-166-1, II) ; les points
  gratuits de la RCO, les années de chef à titre exclusif ou principal d'avant 2003
  (L. 732-56). Collaborateurs et aides familiaux sont affiliés à la RCO depuis le
  1er janvier 2011 (L. 732-56, IV). Les deux moteurs servent désormais ces
  distinctions, et la saisie propose le statut de conjoint collaborateur ou d'aide
  familial.
reste: >-
  L'assiette forfaitaire du collaborateur et de l'aide familial (leurs points de
  retraite proportionnelle et de RCO), que le modèle prend du revenu saisi ; les
  périodes régularisées de 1999 à 2008 et celles de qui peut prétendre à une
  réversion, que D. 732-110, II, 2° et 3° rangent dans DM1 ; les seuls points de RCO
  de chef dans la formule différentielle (D. 732-166-3). Aucun exemple chiffré publié
  par la MSA d'une PMR réduite.
