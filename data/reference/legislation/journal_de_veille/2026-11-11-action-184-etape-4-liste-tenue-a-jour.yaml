reste: >-
  Les 100 rédactions non lues se lisent à l'étape 6 de l'action 184, zone par
  zone. GitHub lance désormais l'inscription chaque lundi, après la mise à
  jour de l'index ; une session n'inscrit plus elle-même que le texte qu'elle
  vient de citer ou qui est paru dans la semaine (docs/veille_droit.md).
