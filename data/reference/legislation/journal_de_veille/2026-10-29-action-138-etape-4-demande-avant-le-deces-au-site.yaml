date: "2026-10-29"
session: >-
  action 138, étape 4, au site : la carte de la réversion qui dit la demande examinée
  avant le décès (`moments_examines`), et la présomption qui la date
consulte: >-
  Aucun texte neuf : l'étape ne touche à aucune règle et dit ce que le modèle rend
  depuis le 28 octobre (R. 353-1, rédactions de 1985 et de 1990 ; circulaire Cnav
  n° 31/75, § 233 ; exposé de la Cnav, « Condition de ressources » ; notes
  `2026-10-25-etape-4-date-de-la-demande-et-du-deces.md` et
  `2026-10-28-etape-4-moments-et-menage-au-modele.md`).
trouve: >-
  Rien de neuf au droit. La saisie refuse une variation des revenus d'activité du
  conjoint avant le décès : les douze mois du décès n'y servent qu'à refuser.
reste: >-
  Rien pour la veille (note `2026-10-29-etape-4-demande-avant-le-deces-au-site.md`).
