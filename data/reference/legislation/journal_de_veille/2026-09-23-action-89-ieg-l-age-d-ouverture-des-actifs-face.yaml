date: "2026-09-23"
session: "action 89, IEG : l'âge d'ouverture des actifs face à la suspension"
consulte: >-
  Dans l'index LEGI : les articles 10, 16 et 45 de l'annexe 3 du statut
  des IEG, version du 6 août 2025, la dernière ; l'article 105 de la loi
  du 30 décembre 2025.
trouve: >-
  La suspension ne touche pas les actifs des IEG : jusqu'à la génération
  1974, leur âge est écrit dans l'annexe, et à compter de 1975 il vaut
  soixante-quatre moins cinq, avant comme après la suspension. Mais la
  fiche avait lu l'âge dans le seul article 16 et l'opposait jusqu'à six
  trimestres trop tard aux générations 1968 à 1974 ; et la surcote
  partait de l'âge d'ouverture. Les deux corrigés.
reste: >-
  L'âge des sédentaires des IEG (1° du V de l'article 45), qu'aucune
  fiche ne modélise ; le compte des années actives.
