date: "2026-11-20"
session: "action 191 : le personnel de direction de la Banque de France, servi à la limite de son degré"
consulte: >-
  Sur le site de la Banque de France, l'arrêté n° A-2012-02 du conseil
  général du 1er juin 2012, article 1er, 24° (article 241 du statut du
  personnel), et l'arrêté n° 2018-02 du 12 mars 2018, articles 240 à 242-1 ;
  par l'index LEGI, le règlement annexé au décret n° 2007-262, article 70,
  rédaction du 9 mai 2012 (LEGIARTI000025882187).
trouve: >-
  Le personnel de direction du quatrième au septième degré a sa colonne au
  tableau de l'article 241, jusqu'à 65 ans pour les nés avant 1956, et son
  tableau à l'article 70, qui rend à chaque ligne l'âge d'annulation de
  l'agent de droit commun : sa décote ne change pas, sa limite d'âge si.
  Fiches limite_age_banque_de_france et decote_banque_de_france, complétées ;
  trois choix de plus au champ « banque » de la saisie.
  Détail : docs/feuille_de_route/191/2026-11-20-direction-de-la-banque-de-france.md.
reste: >-
  La correspondance des degrés de 2012 aux niveaux de 2019, que les articles
  lus ne disent pas ; les limites d'âge d'avant le 26 juillet 2012 ;
  l'exemption de l'agent de 65 ans qui a élevé ou aidé un enfant handicapé.
