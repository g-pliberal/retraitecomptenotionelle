date: "2026-11-15"
session: "audit des portes de la carrière longue, à la demande du propriétaire"
consulte: >-
  L'index LEGI et l'index JORF du dépôt, à jour au 11 novembre 2026. D. 351-1-1
  du code de la sécurité sociale, ses six rédactions (31 octobre 2003, 1er juillet
  2011, 1er novembre 2012, 1er septembre 2023, 1er janvier 2026, 1er septembre
  2026), relues en entier ou mot à mot (`--le`, `--diff`), et L. 161-17-2 (31
  décembre 2025) pour la date d'application de la suspension. Code des pensions :
  L. 25 bis, ses cinq rédactions, et D. 16-1 (1er janvier 2011). Au JORF : loi
  n° 2010-1330, articles 43 et 118 ; décret n° 2010-1748 ; loi n° 2004-1484,
  article 119. Le portage : CarriereLongue (moteur/js/regimes.js) et la table
  legislation/carriere_longue.csv, ligne par ligne.
trouve: >-
  Les quatre-vingts portes de la table concordent avec les textes, génération par
  génération, durée cotisée, durée d'assurance d'avant novembre 2012 et dates
  d'effet comprises ; la suspension de la loi n° 2025-1403 ne vaut qu'à compter
  du 1er septembre 2026, comme la table. Les portes des fonctionnaires de l'État
  et de la CNRACL, chacune à sa date, sur la durée fixe d'avant 2009, sont
  celles de L. 25 bis. Un écart : la loi de finances pour 2005, article 119, II,
  rend L. 25 bis applicable aux ouvriers de l'État, que le modèle laissait aux
  portes du régime général dès 2004. Corrigé dans les deux moteurs, avec ses
  tests ; aucun témoin ne bouge.
reste: >-
  Les questions ouvertes de la fiche carriere_longue restent : la voie des quatre
  trimestres agricoles du non-salarié agricole (D. 732-40), lue et non portée,
  et l'option des quatre trimestres des artisans et commerçants nés au dernier
  trimestre, de 2011 à 2012.
