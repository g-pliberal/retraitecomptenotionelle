date: "2026-10-13"
session: "action 138, étape 9, huitième partie : la maladie des pensions des exploitants et des régimes spéciaux, lue aux textes"
consulte: >-
  `python scripts/veille_droit.py` : aucune fiche de la carte touchée, la
  session n'écrivant aucune règle du scénario 1. L'index LEGI de la DILA,
  version par version : R. 711-8, D. 711-1 à D. 711-5, L. 711-2, R. 711-1,
  R. 711-24, l'article 1106-6-1 de l'ancien code rural, l'article 3 du décret
  du 6 août 1938 (SNCF), les articles 5 et 7 du décret n° 2007-1056, les
  articles 46, 53 et 91 du décret n° 46-2769 (mines), l'article 6 du décret
  n° 50-1448 (chemins de fer secondaires), l'article 3 du décret n° 67-850, les
  décrets abrogés n° 80-598, 80-599, 80-600, 80-916, 85-1093, 87-466, 87-467,
  88-789 et 88-791, les arrêtés des mines du 30 juin 1987 et du 22 juin 1988.
  L'index JORF : les décrets annuels du financement de la protection sociale
  des exploitants de 1979 à 1998 (n° 90-765, 91-912, 92-793, 94-715, 95-1038,
  96-679, 97-771, 98-768 en texte ; ceux de 1979 à 1989 et le n° 93-1153 en
  notice), les décrets n° 97-140 et 97-1252, n° 91-613 et ses modificatifs de
  1992 à 1995, n° 96-155, 96-471, 96-680, 96-1151, 97-1249, 97-344 et
  2010-1362, les arrêtés des mines de 1962, 1972, 1987 et 1988. Le Web : les
  réponses aux questions écrites de 1997 et 1998 sur la cotisation des
  retraités agricoles (Assemblée nationale), et un avis du Sénat sur le budget
  annexe des prestations sociales agricoles pour 1996, qui ne la chiffre pas.
trouve: >-
  Les exploitants retraités paient 2,8 % de part technique et 1 % de part
  complémentaire de leur pension de base de 1990 à 1996, 1,8 % et 1 % en
  1997, rien depuis 1998 hors des non-résidents. Les pensionnés des régimes
  spéciaux placés sous le régime général pour la maladie — l'Opéra, la
  Comédie-Française, les chemins de fer secondaires passé 60 ans — paient
  1,5 % depuis le 31 juillet 1980 (n° 80-598), 1,9 % au 1er juillet 1987, 2,85 %
  au 1er août 1996, 1,85 % puis 2,80 % en 1997, rien en 1998 ; les IEG les
  mêmes taux, depuis le 22 novembre 1980 (n° 80-916), leur relèvement de 1996
  au 1er octobre ; les clercs de notaires 1,5 % en 1980, 2,25 % en 1986, 2,65 %
  en 1987, 3,05 % en 1996, 2,80 % en 1997, rien en 1998. Le décret n° 91-613 chiffre au
  1er juillet 1991 les taux que les conseils fixaient : la SNCF 4,50 % sous un
  premier plafond, la RATP 1,65 %, la Banque de France 2,65 %, les mines 3,4 %
  (depuis le 1er juillet 1988). Deux cotisations maladie de pensions courent
  encore : 0,70 % de la pension de la SNCF sous 5 128 € par trimestre (décret
  n° 2007-1056, art. 7, IV, plafond du décret n° 2010-1362), 0,50 % de celle
  des mines (décret n° 46-2769, art. 91) ; la fiche de paie du site ne les a
  pas. Pour le relèvement des mines de 1987, l'article de LEGI dit 3 %, la
  notice du JORF 3,4 %.
reste: >-
  La maladie des pensions de la SNCF et des mines sur la fiche de paie du
  site ; les décrets des exploitants de 1980 à 1989 et de 1993, l'arrêté des
  mines de 1972 et celui de 1987, au fac-similé du Journal officiel ; les taux
  des conseils de la SNCF, de la RATP et de la Banque de France avant 1991 ; les
  plafonds de la SNCF de 1991 à 2010 ; la maladie des pensions de la SEITA, du
  port autonome de Strasbourg, des marins, des cultes, des assemblées et du
  Conseil économique, social et environnemental.
