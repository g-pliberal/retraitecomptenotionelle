date: "2026-11-04"
session: "action 130, file L : l'âge où s'ouvrent la base des libéraux et leurs sections"
consulte: >-
  Les index LEGI et JORF du dépôt, récupérés puis mis à jour de l'incrément
  20261103-214151. LEGI : L. 643-3 (2004, 2023), L. 644-1, L. 161-17-2 (2011,
  2023, 2026), D. 161-2-1-9 (2023), L. 643-2, L. 643-5, R. 643-6, R. 643-7 et
  R. 643-9 dans leur rédaction de 1985 à 2003, les articles du décret
  n° 81-1046. JORF : statuts de la CARPV de 2021 et règlement de 2026 ; statuts
  de la CAVEC de 2008 et 2018, arrêté du 19 juin 2019, règlement de 2026 ;
  statuts de la CAVP de 2011 (arrêté du 23 juin 2011) et règlement des
  prestations des biologistes de 2026 (arrêté du 10 juillet 2026, III) ;
  décret n° 2022-1633.
trouve: >-
  La base des libéraux s'ouvre à l'âge de L. 161-17-2 (L. 643-3, I), que le
  modèle ouvrait à 60 ans par la CARPV, la CAVEC et les prestations des
  biologistes ; la CARPV et la CAVEC se demandent dès 60 ans sans la base ; les
  prestations des biologistes s'ouvrent à l'âge de L. 161-17-2 depuis le
  30 juin 2011, non à 60 ans ; avant 2004, l'allocation s'ouvrait dès 60 ans
  aux coefficients de R. 643-7, que la fiche de la CNAVPL ignorait. Corrigé
  dans les deux moteurs ; fiche neuve cnavpl_allocation_avant_2004. En passant :
  la CRPNPAC, ouverte à 50 ans, ouvre le régime général du personnel navigant.
reste: >-
  La CRPNPAC (code de l'aviation civile) ; les statuts de la CAVOM, de la
  CARPIMKO, de la CAVP, de la CARCDSF et de la CPRN sur la liquidation avant la
  base ; l'âge de L. 351-8, 1°, du coefficient des biologistes ; les décrets
  d'avant 1985 de l'allocation des libéraux.
