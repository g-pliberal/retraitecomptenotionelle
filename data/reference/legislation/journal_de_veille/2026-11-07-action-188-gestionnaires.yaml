date: "2026-11-07"
session: "action 188, étape 2 : les gestionnaires de l'AVTS, du régime additionnel des enseignants du privé et de la SEITA, lus dans les textes"
consulte: >-
  Aucune règle du scénario 1 n'est touchée : le champ `gestionnaire` des
  fiches de régime. L'index JORF de la DILA (à jour au 3 novembre 2026) :
  l'arrêté du 9 mai 1995 relatif à la gestion du régime spécial de retraite
  du personnel de la SEITA, l'arrêté du 5 mai 1982 (abrogé), le décret
  n° 2005-1233 (articles 10 et 21), la délibération de la CNIL n° 2011-350,
  le décret n° 2013-900, l'arrêté du 9 octobre 2013 portant désignation de
  l'organisme gestionnaire du régime additionnel de retraite des personnels
  enseignants, le décret n° 2025-246, les deux arrêtés du 24 mars 1987 sur
  la liquidation et le paiement des avantages des maîtres du privé, la loi
  du 14 mars 1941 et l'ordonnance n° 45-170 (résumés seuls). L'index LEGI
  (à jour au 2 novembre 2026) : R. 914-99 à R. 914-99-6 du code de
  l'éducation, l'arrêté du 9 mai 1995 (en vigueur). Le texte de la loi du
  14 mars 1941 sur une reproduction (geopolintel.fr) ; Gallica et le site
  de législation de la Cnav n'ont pas répondu.
trouve: >-
  L'Association pour la prévoyance collective liquide et paie les pensions
  de la SEITA depuis 1995, les avantages temporaires des maîtres du privé
  (RETREP) depuis le 1er juin 1987, et gère le régime additionnel des
  enseignants du privé, désignée par l'arrêté du 9 octobre 2013. La loi du
  14 mars 1941 charge le secrétaire d'État au travail de la liquidation de
  l'allocation aux vieux travailleurs salariés (article 8). Une erreur du
  dépôt, corrigée : le RETREP était donné à l'État, qui le finance, et non
  à l'APC, qui le gère.
reste: >-
  Qui versait les arrérages de l'AVTS de 1941 à 1945 : les arrêtés
  d'application de la loi (article 21) et l'arrêté du 1er juin 1945, à lire
  au Journal officiel sur Gallica quand il répondra.
