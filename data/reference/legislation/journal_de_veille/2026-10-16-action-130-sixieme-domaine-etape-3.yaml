date: "2026-10-16"
session: "action 130, sixième domaine, étape 3 : les fonctions de compter_les_durees, dans les deux moteurs"
consulte: >-
  Aucun texte neuf : les quatre fiches de l'étape 1 (apprentissage,
  stages_formation_professionnelle, sportifs_haut_niveau,
  conge_supplementaire_naissance), lues le jour même, pour les règles de décompte
  qu'elles citent — D. 373-3 et D. 373-4 pour le contrat d'apprentissage ;
  R. 351-12, 4°, i et k, pour les cinquante jours de stage ; R. 351-12, 9°, pour
  les sportifs ; R. 351-12, 2°, c, pour le congé de naissance. L'index LEGI n'est
  pas remis à jour, l'inscription des textes ayant été faite ce jour.
trouve: >-
  Rien qui change le droit lu. Les paramètres des versions s'en tirent tels que
  les fiches les citent ; les fiches passent à approchee, leurs écarts déclarés :
  le complément de l'apprentissage retire tous les trimestres de l'année dans le
  régime ; les ressources du sportif sont ses revenus d'activité ; le congé se
  compte dans l'année civile.
reste: >-
  Ce que l'étape 1 a laissé à relire, inchangé ; les exemples des circulaires
  Cnav 2016-41 et 2024-18, à rejouer à l'étape 4.
