date: "2026-10-16"
session: "action 138, étape 8 : DM1 au-delà du chef, et les seuls points de RCO de chef dans le complément différentiel"
consulte: >-
  L'index LEGI du dépôt, récupéré à jour au 11 octobre 2026 : D. 732-110 (rédactions
  de 2009, LEGIARTI000020254712 ; de 2011, LEGIARTI000023395298 ; de 2016,
  LEGIARTI000032716796), D. 732-111 (LEGIARTI000020254705, LEGIARTI000035918254),
  L. 732-54-2 dans sa rédaction de 2007 (LEGIARTI000006585628), D. 732-166-4
  (LEGIARTI000043671216, novembre 2021 ; LEGIARTI000053365809, 2026).
trouve: >-
  DM1 compte les périodes des 1° et 2°, ou du 3°, de D. 732-110, II, retenues en
  priorité avec celles du chef : le 3°, les périodes de collaborateur cotisées de
  1999 à 2008 par qui a régularisé sa situation (avoir été conjoint en 1998 oblige à
  avoir opté avant 2001 et gardé le statut durablement, L. 732-54-2, II, deuxième
  alinéa, d'avant 2009), et, depuis 2011, les périodes de conjoint d'avant 1999
  rachetées avant 2009 ; le 2°, toutes les périodes de qui peut prétendre à une
  réversion du régime. Le N de la formule différentielle de D. 732-166-4, depuis
  novembre 2021, ne compte que les points de RCO acquis au titre des périodes de chef.
  Les deux moteurs les servent ainsi ; le 2° ne trouve personne, le modèle ne
  connaissant pas le décès du conjoint de l'assuré. Fiches pension_majoree_reference
  et complement_differentiel_rco mises à jour.
reste: >-
  Un exemple chiffré de la MSA ; le décret qui fixe le « caractère durable » du statut
  de collaborateur (non relu) ; le décès du conjoint, à saisir, pour servir le 2°.
