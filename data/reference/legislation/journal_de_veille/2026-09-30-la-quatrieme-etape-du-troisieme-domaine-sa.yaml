date: "2026-09-30"
session: >-
  la quatrième étape du troisième domaine, sa deuxième partie : la pension
  servie pendant l'activité après le départ, calculée
consulte: >-
  Dans l'index LEGI : D. 161-2-15 et D. 161-2-16 dans leurs rédactions de 2004,
  2010, 2015 et 2017 ; D. 161-2-7 (2004), D. 161-2-8, D. 161-2-9 (2004 et 2010),
  D. 161-2-11 ; L. 161-22 de 2015, et sa note d'application ; L. 634-6 dans ses
  rédactions de 1985, 2003, 2008 et 2014 ; D. 634-11-2 (2004, 2015 et 2017) ;
  L. 643-6 (2004 et 2008) et D. 643-10 (2004). Dans l'index JORF : l'article 20 de
  la loi n° 2014-40.
trouve: >-
  L. 161-22 de 2015, réduction du dépassement comprise, ne vaut que pour les
  premières pensions de 2015 (article 19, VIII, de la loi n° 2014-40), et la
  réduction n'a eu son décret qu'en 2017 : jusqu'au 31 mars 2017, la pension
  « n'est pas due pour le mois civil » où le revenu dépasse le plafond, diminué
  des pensions (D. 161-2-16 de 2015) ; ensuite, chaque pension est réduite du
  dépassement ; les non-salariés, pour les activités de 2017. Le délai de six mois
  ne vaut pas pour qui remplit, à la reprise, les conditions du cumul intégral
  (D. 161-2-15). En 2004, le dernier salaire ne descend pas sous le SMIC
  mensuel ; 160 % depuis 2010 par le décret, 2009 par la loi. La pension de
  l'artisan prise depuis juillet 1984 était suspendue à la reprise de
  l'entreprise exploitée ; depuis 2004, sous la moitié du plafond de la sécurité
  sociale, rapportée à la durée de l'activité. Les pensions comparées au plafond
  sont les pensions de droit direct, accessoires compris, pour leur montant brut
  (D. 161-2-11).
reste: >-
  Les règles des avocats (L. 723-11-1) et des exploitants agricoles (L. 732-39) ;
  celles de l'Ircantec, de la RCI et des sections libérales ; les accords de
  l'Agirc-Arrco d'avant 2019 ; le décret de l'imputation de 2027 entre les
  régimes.
