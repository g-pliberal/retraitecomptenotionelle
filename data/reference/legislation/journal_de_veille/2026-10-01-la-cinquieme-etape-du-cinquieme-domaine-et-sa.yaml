date: "2026-10-01"
session: >-
  la cinquième étape du cinquième domaine, et sa clôture : le formulaire, la page Coût,
  la proposition
consulte: >-
  Le texte de la proposition (README) et docs/limites.md, pour la garantie vieillesse
  du scénario 6 ; aucun texte de droit nouveau.
trouve: >-
  Le README écrivait déjà que la garantie ne sert que les retraités qui résident en
  France, « comme l'ASPA qu'elle remplace », et la page Coût les en retirait depuis le
  23 septembre 2026 : la simulation individuelle l'applique désormais à qui déclare
  résider ailleurs.
reste: >-
  Ce que les fiches du domaine déclarent : la pension que sert l'autre État, le salaire
  annuel moyen réduit de 2004 à juin 2022, la comparaison des pensions des
  fonctionnaires, la révision de l'écrêtement (R. 173-8), la subsidiarité du minimum,
  les mois de séjour et la condition de L. 816-1, les listes d'États tiers d'avant 2026.
