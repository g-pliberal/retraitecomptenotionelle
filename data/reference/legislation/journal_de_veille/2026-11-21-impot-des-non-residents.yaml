date: "2026-11-21"
session: "action 138 : l'impôt du retraité qui réside hors de France"
consulte: >-
  Les conventions fiscales de la France avec l'Algérie, la Belgique, l'Espagne,
  l'Italie, le Maroc, le Portugal et la Tunisie, sur impots.gouv.fr
  (« Conventions internationales », versions consolidées par la convention
  multilatérale). L'index LEGI du dépôt : article 197 A du code général des
  impôts (LEGIARTI000037985917) et article 182 A (LEGIARTI000054373628).
trouve: >-
  La pension privée n'est imposable que dans l'État de résidence en Algérie, en
  Belgique, en Espagne, au Maroc, au Portugal et en Tunisie ; la pension publique
  reste à la France, sauf au Maroc et sauf nationalité de l'autre État ; l'Italie
  laisse à la France la pension de sécurité sociale. Depuis les revenus de 2018,
  le non-résident n'a ni la réduction sous condition de revenus ni la décote ; la
  retenue de l'article 182 A s'impute sur l'impôt. Détail :
  docs/feuille_de_route/138/2026-11-21-impot-des-non-residents.md.
reste: >-
  L'Agirc-Arrco sous la convention italienne (BOFiP, BOI-INT-CVB-ITA) ; les
  conventions antérieures et les autres États ; l'article 197 A d'avant 2018.
