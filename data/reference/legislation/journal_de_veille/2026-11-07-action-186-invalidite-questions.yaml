date: "2026-11-07"
session: "action 186, chantier 6 : les cinq questions de la garantie d'invalidité (décision 78), instruites aux sources pour le propriétaire, sans rien trancher"
consulte: >-
  Aucune règle du scénario 1 n'est touchée. L'index LEGI de la DILA (à jour
  au 2 novembre 2026), interrogé à la date du 7 novembre 2026 : L. 341-1,
  R. 341-2, L. 341-4, L. 341-15, L. 351-1-5, L. 815-13, L. 815-24, l'ancien
  L. 815-28 (sa dernière version), L. 821-1, L. 821-2, L. 821-3, L. 821-5 et
  D. 821-1 du code de la sécurité sociale ; L. 27, L. 28, L. 29 et L. 31 du
  code des pensions civiles et militaires ; l'article 5 du décret n° 91-613 ;
  une recherche plein texte de la reprise de l'AAH sur la succession, sans
  résultat. La circulaire de la Cnav n° 2026-14 du 17 avril 2026, qui annule
  et remplace la n° 2026-10, sur l'ASI au 1er avril 2026. Les fichiers du
  dépôt pensions_invalidite.csv, pensions_invalidite_age.csv,
  minimum_vieillesse_regimes.csv (panorama de la DREES, édition 2026),
  caracteristiques_fonction_publique.csv (jaune des pensions du PLF 2027) et
  masse_salariale_privee.csv. Relevés par le moteur de recherche, le site de
  la DREES ayant refusé la lecture automatique (503) : le communiqué de la
  DREES du 4 décembre 2025 sur les minima sociaux, le montant de l'AAH au
  1er avril 2026, les crédits de l'AAH au PLF 2026 (rapports du Sénat et de
  l'Assemblée), le coût de la déconjugalisation, la répartition des
  pensionnés d'invalidité par catégorie, les bornes de la pension
  d'invalidité de 2026.
  Lus aux textes officiels par un agent de la session, pour comparer : le
  code de la sécurité sociale suédois (chapitres 33, 35 et 108), SGB VI
  (§ 43, 59, 115, 240) et SGB XII (§ 41, 43, 45, 46a, 94, 102)
  allemands, les lois néerlandaises WIA, Toeslagenwet, Wfsv et
  Participatiewet, les pages de l'INAMI et du SPF Sécurité sociale.
trouve: >-
  La reprise de l'ASI sur la succession a été abrogée au 1er janvier 2020 par
  l'article 270 de la loi de finances pour 2020, « également au titre des
  prestations versées antérieurement » ; l'AAH n'a jamais été reprise.
  L'ASI porte les ressources à 922,16 euros pour une personne seule et à
  1 613,80 euros pour un couple depuis le 1er avril 2026 (revalorisation de
  0,8 %), au plus 583,85 euros, la pension d'invalidité minimale étant de
  338,31 euros au 1er janvier 2026. L'AAH n'est due qu'après tout avantage
  d'invalidité ou de vieillesse d'un montant au moins égal (L. 821-1) : sans
  texte, la garantie de la décision 78 passerait avant elle. L'âge où la
  pension d'invalidité cède la place à la retraite reste celui de
  L. 351-1-5 (L. 341-15, rédaction du 1er septembre 2023). Le seuil de
  reprise de l'ASPA est de 100 000 euros d'actif net (L. 815-13). Le taux de
  la contribution des employeurs de la CNRACL est de 37,65 % en 2026
  (décret n° 91-613, article 5). Aucune erreur des fiches du dépôt n'est
  déclarée. Ni l'Allemagne (SGB XII, § 102, alinéa 5), ni la Suède, ni
  les Pays-Bas ne reprennent leur minimum d'invalidité sur la succession.
reste: >-
  Les fiches de l'AAH et de l'ASI de la DREES (Minima sociaux et prestations
  de solidarité, édition 2025), à relire quand son site répond : la part
  des allocataires de l'AAH à 80 % et à 50 %, en couple, cumulant une
  pension d'invalidité, et la dépense de l'ASI. La répartition des pensions
  d'invalidité par montant (DREES, CNAM). La part des départs pour
  invalidité des fonctionnaires qui satisferaient le critère des deux tiers.
  Le montant de l'AAH et ses crédits, relevés, à lire au décret et à la loi
  de finances. Les cinq questions attendent le propriétaire (note
  186/2026-11-07-invalidite-questions.md) ; la vérification caisse par
  caisse est menée dans sa propre note.
