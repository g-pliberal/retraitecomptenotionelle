date: "2026-09-30"
session: >-
  la quatrième étape du troisième domaine, la vie après le départ : les textes
  du cumul emploi-retraite
consulte: >-
  `scripts/veille_droit.py` ; les index JORF et LEGI mis à jour au 30 septembre
  2026 : aucun texte de retraite paru depuis le 28, L. 161-17-2 sans rédaction
  postérieure au 31 décembre 2025. Lus : L. 161-22 dans ses rédactions de 1985,
  1987, 1995, 2002, 2003, 2008, 2010, 2015, 2017, 2022 et 2023 ; les articles 19
  et 20 de la loi n° 2014-40 ; D. 161-2-5 à D. 161-2-18 ; L. 634-6 et
  D. 634-11-2 ; L. 643-6 et D. 643-10 ; L. 84, L. 85, L. 86 et L. 86-1 du code
  des pensions, et R. 91 et R. 92 ; R. 351-29 (III). Les fiches F13243 et F12402
  de service-public et la page du cumul de l'Agirc-Arrco.
trouve: >-
  Depuis 1983, la pension ne se sert qu'après la rupture avec l'employeur ; en
  2004, sous le plafond du dernier salaire, le dernier employeur n'étant permis
  qu'après six mois ; en 2009, sous le plus haut du dernier salaire revalorisé et
  de 160 % du SMIC, et entière au taux plein ; au-delà, suspendue, puis, pour les
  premières pensions de 2015, réduite du dépassement, chaque pension de base du
  montant entier du dépassement, mois par mois (D. 161-2-16). Les indépendants
  cumulent jusqu'à la moitié du plafond de la sécurité sociale, les libéraux
  jusqu'au plafond ; le fonctionnaire, jusqu'au tiers de sa pension majoré de la
  moitié du minimum garanti — 8 198,10 € en 2026 — d'un employeur public, de tout
  employeur pour le civil parti depuis 2015. L'Agirc-Arrco suspend sa pension
  au-delà de son propre plafond, et ouvre depuis 2023 des points en cumul intégral.
reste: >-
  Le seuil de 2027, que le décret n'a pas encore fixé ; les rédactions de
  L. 161-22 de 1988 à 1993 ; les règles des non-salariés d'avant 2015 et des
  exploitants agricoles ; le décret en Conseil d'État de L. 85 ; les points de
  l'Agirc-Arrco acquis en cumul avant 2015.
