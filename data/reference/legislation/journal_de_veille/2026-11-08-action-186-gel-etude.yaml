date: "2026-11-08"
session: "action 186, chantier 10 : le gel, la cible, la date, étudiés avant d'être écrits"
consulte: >-
  Aucune règle du scénario 1 n'est touchée. Pour la date : le compte rendu du
  Conseil des ministres du 1er juillet 2026 sur elysee.fr (communication du
  ministre de l'Intérieur sur le calendrier électoral de 2027) ; la loi
  n° 62-1292 du 6 novembre 1962, article 1er bis (créé par la loi organique
  n° 2021-335) et article 3, et le décret n° 2001-213 du 8 mars 2001,
  article 10, par les extraits de Légifrance et du site du Conseil
  constitutionnel pour 2022 que la recherche a rendus, non lus en entier.
  Dans le dépôt : les blocs « Reprise » et les « D'où elle vient » des
  47 actions ouvertes, les écarts des actions 130, 134, 154, 165 à 172, 177,
  179 à 183 et 185, les cas types (castypes.py), docs/etat.md.
trouve: >-
  Le premier tour de l'élection présidentielle le 18 avril 2027, le second le
  2 mai ; la computation des dépenses de campagne depuis le 1er avril 2026 ;
  le décret de convocation au plus tard le 7 février 2027, les parrainages
  ouverts le lendemain et clos le vendredi 12 mars 2027 à 18 heures ; la
  campagne officielle ouverte le lundi 5 avril 2027. Rien qui touche les
  fiches. Le détail est dans la note
  docs/feuille_de_route/186/2026-11-08-gel-etude.md.
reste: >-
  Non lus : les pages d'info.gouv.fr et du ministère de l'Intérieur sur la
  présidentielle de 2027, qui refusent le robot (403) ; la recommandation de
  l'Arcom sur le temps de parole pour 2027 ; le guide de la CNCCFP pour 2027,
  dont le PDF ne se lit pas. Le décret de convocation n'est pas encore paru.
