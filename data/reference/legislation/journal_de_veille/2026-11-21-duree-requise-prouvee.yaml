date: "2026-11-21"
session: "action 194 : la durée requise prouvée par une grille indépendante"
consulte: >-
  Par la session indépendante, dans les index LEGI et JORF du dépôt à jour au 16
  novembre 2026 : R. 351-27 CSS de 1985 à 2026 (LEGIARTI000006749434 à
  LEGIARTI000047633296) ; R. 351-45 (LEGIARTI000006749449, LEGIARTI000006749450) ;
  L. 161-17-3 (LEGIARTI000028494794, LEGIARTI000047452764, LEGIARTI000053280903) ;
  loi n° 2003-775, article 5 (LEGIARTI000006758542) ; décrets n° 2010-1734,
  2011-916, 2012-1487, 2013-1155 ; décret n° 93-1022 et loi n° 93-936, article 2
  (JORFARTI000001580637) ; article 70 du décret n° 45-179.
trouve: >-
  L'escalier de R. 351-45, II vaut dès le 28 août 1993, sans application
  différée : corrigé, sans effet sur une pension. Le V de l'article 5 de la loi
  de 2003 rattache la durée aux soixante ans ; la caisse (circulaire 2008/41) et
  R. 351-45, I gardent 160 jusqu'en 2008 : retenu. Une session sans le code
  retrouve 133 des 144 durées que le simulateur rend. Détail :
  docs/feuille_de_route/194/2026-11-21-duree-requise-prouvee.md.
reste: >-
  La durée des nés à compter de 1958 pour une pension d'avant le 22 janvier 2014,
  qu'aucun texte ne fixe (166 ou 167) ; la date de la demande en 2011, que le
  modèle n'a pas.
