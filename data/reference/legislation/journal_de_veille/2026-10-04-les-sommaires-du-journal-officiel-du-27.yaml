date: "2026-10-04"
session: >-
  les sommaires du Journal officiel du 27 septembre au 4 octobre, que l'index de la
  DILA ne porte pas, parcourus à la demande du propriétaire
consulte: >-
  sur Légifrance, dans le navigateur intégré, les sommaires des JORF n° 0226 du
  27 septembre à n° 0232 du 4 octobre — aucun numéro le lundi 28 —, chaque titre filtré
  sur les mots des retraites ; l'avis n° HCFP-2026-5 du 25 septembre 2026
  (JORFTEXT000054939509).
trouve: >-
  Aucun texte ne touche les règles des retraites : des admissions individuelles à la
  retraite, la nomination d'un membre du Conseil d'orientation des retraites et d'un
  administrateur de l'ERAFP, l'extension d'un avenant à la convention collective du
  personnel des institutions de retraite complémentaire, des textes de santé et
  d'accidents du travail. L'avis du Haut Conseil des finances publiques dit sur quoi
  repose la prévision du Gouvernement pour 2027 : « un gel différencié par seuils de
  pension de retraite de base », une sous-indexation partielle des pensions des
  fonctionnaires, une sous-indexation des retraites complémentaires laissée à la
  négociation des partenaires sociaux ; et, en 2026, un prélèvement sur l'excédent de
  la caisse de retraite des industries électriques et gazières.
reste: >-
  Le projet de loi de financement de la sécurité sociale pour 2027, à suivre jusqu'à sa
  promulgation : sa revalorisation du 1er janvier 2027, si elle se fait par seuils,
  entrera dans `revalorisation_pensions.csv` comme les tranches de 2020 ; celle des
  complémentaires, à l'accord des partenaires sociaux. Les textes parus depuis le
  4 octobre.
