date: "2026-10-05"
session: "action 89 : les quatre lignes du RAFP au vivier"
consulte: >-
  veille_droit.py (dernière veille consignée le 5 octobre 2026) ; l'index LEGI du
  27 septembre 2026, le serveur de la DILA refusant encore les incréments : L.
  161-17-2 et L. 161-17-3 sans version postérieure au 31 décembre 2025 ; le décret n°
  2004-569, articles 5 (LEGIARTI000006453303) et 10 (LEGIARTI000006453308,
  LEGIARTI000036070850), l'arrêté du 26 novembre 2004, articles 5 à 10. Sur rafp.fr :
  les pages « Retraité », « Calcul et paiement de votre prestation RAFP », « La
  réversion », « Calculette de points » et « Calculer vos cotisations et vos points »,
  les barèmes de conversion du conjoint et de l'orphelin « à compter du 1er janvier
  2022 », le rapport annuel 2012.
trouve: >-
  Rien qui change le droit appliqué. Quatre exemples de plus pour la prestation du
  RAFP, tous concordants sauf une coquille du rapport 2012 (4 030,38 € imprimés pour un
  produit de 4 030,88 €) ; les barèmes de conversion de la réversion, non portés ;
  deux lectures divergentes de la page de l'ERAFP sur la réversion (un exemple
  converti par 29 quand son barème dit 30,94 ; les orphelins plafonnés à 50 %, quand
  l'article 10 plafonne le total du conjoint et des orphelins).
reste: >-
  Porter la conversion en capital de la réversion au barème de 2022 ; l'allocation
  d'orphelin ; l'arrondi des points de l'année au point supérieur, que l'ERAFP
  annonce et que le décret ne dit pas.
