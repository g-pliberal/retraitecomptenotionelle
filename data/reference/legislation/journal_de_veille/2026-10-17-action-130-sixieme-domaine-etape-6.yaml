date: "2026-10-17"
session: "action 130, sixième domaine, étape 6 : le coût du complément de l'apprentissage"
consulte: >-
  L'index LEGI et l'index JORF du dépôt, mis à jour au 17 octobre 2026 : D. 373-4
  CSS dans sa rédaction du décret n° 2022-652 (LEGIARTI000045658237) ; l'arrêté du 25
  avril 2022 relatif au financement par le fonds de solidarité vieillesse des
  trimestres complémentaires accordés au titre de l'apprentissage
  (JORFTEXT000045653607, article 1, JORFARTI000045653611) ; L. 222-2-1 CSS, ses
  rédactions du 1er janvier 2026 (LEGIARTI000051288889) et du 1er janvier 2028
  (LEGIARTI000054466881). L'annexe 2 du PLFSS pour 2024, les comptes du FSV,
  téléchargée de securite-sociale.fr et lue en texte ; la fiche F2918 de
  service-public.gouv.fr, « Contrat d'apprentissage », vérifiée le 8 septembre 2026.
  Le site du FSV répond 503 : son rapport d'activité 2024 n'est pas lu.
trouve: >-
  Depuis les périodes de 2022, le versement du complément est forfaitaire : 35 % du
  nombre d'apprentis payés moins de 33 % du SMIC dans l'année, fois les taux
  vieillesse et veuvage, fois la moitié du plafond trimestriel ; le nombre est
  transmis au fonds par les services statistiques du ministère du travail, et n'est
  pas publié. Le 7° de L. 222-2-1, qui met le complément à la charge de la branche
  depuis 2026, est inchangé dans la rédaction de 2028. Les comptes du FSV fondent
  l'apprentissage avec la formation professionnelle et le service national, 305 M€ en
  2022 ; seul montant propre, une régularisation de près de 0,2 Md€ en 2021 au titre
  de 2015 à 2020. Aucune règle du scénario 1 ne change : la fiche apprentissage
  reste telle que l'étape 1 l'a écrite.
reste: >-
  Les rédactions parues dans l'index depuis le 15 octobre ne sont pas inscrites à la
  liste de contrôle des textes (`textes.py --inscrire`), cette étape n'ayant changé
  aucune règle ; la rédaction de L. 222-2-1 au 1er janvier 2028 change autre chose
  que le 7°, à lire par la session qui tiendra la frontière contributive. Le rapport
  d'activité du FSV, quand son site répondra. Ce que l'étape 1 a laissé à relire,
  inchangé.
