date: "2026-11-03"
session: "action 158, étape 2 : les grilles de l'État d'avant le Noyau RH, lues au LEGI par l'index du dépôt, certifiées et recoupées au noyau et à la territoriale"
consulte: >-
  Aucune règle du scénario 1 n'est écrite. L'index LEGI du dépôt, reconstruit le 2 novembre
  2026 (dump du 13 juillet 2025, incréments jusqu'au 2 novembre 2026 à 21 h 39) : les décrets
  et arrêtés d'échelonnement indiciaire de l'État, dont les arrêtés du 30 mai 1990
  (certifiés, agrégés), du 22 août 1990 (professeurs des écoles), du 23 août 1995 (attachés
  d'administration centrale), du 1er avril 1998 (échelles 1 à 5 des catégories C et D), du
  27 novembre 2006, du 11 mai 2007 et du 3 décembre 2008 (catégorie C), le décret n° 70-78 et
  le décret n° 2008-836 ; leurs visas, pour le versant des titres qui le taisent. L'index JORF
  du dépôt (même date), pour les textes de grilles de l'État d'avant 1990 et de 1990 à 2006.
  Les grilles du Noyau RH de l'État (CISIRH, juillet 2026) et celles de la territoriale (décret
  n° 87-1108), déjà au dépôt.
trouve: >-
  Le LEGI garde avec leurs tableaux 398 textes de grilles de l'État : 1 795 grilles, 21 078
  périodes d'échelons, depuis 1970 pour quelques-unes, depuis les années 1990 pour la plupart ;
  elles redonnent le Noyau RH là où les deux couvrent le même corps, et les échelles 2 à 5 de
  la catégorie C au 1er avril 1998 valent celles de la territoriale au même jour. Avant 1990,
  le JORF de la DILA n'a des 2 246 textes de grilles de l'État que leur titre et un résumé ; de
  1990 à 2006, 719 de leurs articles renvoient au Journal officiel imprimé. Des titres muets sur
  le versant se lisent à leurs visas : les arrêtés du 11 mai 2007 et du 3 décembre 2008 « de la
  catégorie C » sont de l'hospitalière. L'arrêté du 1er avril 1998 paraît encore en vigueur au
  LEGI, quand le décret n° 2005-1229 a remplacé ses échelles au 1er octobre 2005.
reste: >-
  L'étape 2 de l'action 158 : le chaînage et les reclassements, du LEGI au noyau compris ; les
  durées d'échelon, dans les statuts ; les tableaux que l'index aplatit, et les 26 que le JORF
  porte pour des textes absents du LEGI ; le minimum de traitement ; les grilles de l'État
  d'avant 1990 (instituteurs, certifiés), dans le Journal officiel imprimé, d'un poste qui
  accède à Légifrance.
