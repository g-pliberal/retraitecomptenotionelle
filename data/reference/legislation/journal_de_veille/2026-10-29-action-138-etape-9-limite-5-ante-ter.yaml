date: "2026-10-29"
session: "action 138, étape 9 : la limite 5 ante ter (2), à jour de l'étape"
consulte: >-
  Aucun texte neuf : les notes de la huitième partie et de ses suites, du 13 au 29 octobre ;
  les fiches maintien_affiliation_crpcen_ieg, cotisation_maladie_des_non_residents,
  cotisation_maladie_pensions_complementaires, reversion_sncf et minimum_pension_sncf ; les
  commentaires de prelevements_remuneration.yaml, de maladie_des_pensions.py et
  d'affiliations.yaml.
trouve: >-
  La réserve 2 de la limite disait non lus les régimes spéciaux, la fonction publique et les
  indépendants : elle dit désormais les trois cotisations maladie qui courent sur une pension
  (complémentaires, SNCF sous son plafond revalorisé, mines), l'histoire et ses conventions,
  ce qui reste hors du calcul, le régime d'une pension selon l'entrée dans le statut avec les
  approximations de la fiche du maintien, et les quatre points au propriétaire. La majoration
  pour trois enfants de la réversion du régime général paie toujours, au non-résident, la
  cotisation de la base (note du 18 octobre) ; la fiche des complémentaires dit encore non
  lus les régimes spéciaux et les non-résidents.
reste: >-
  Rien pour la veille. Le plafond de 2027 ; au site, les dates de pension d'un retour et la
  majoration de la réversion au non-résident ; les fiches de l'étape, à sa fin ; au
  propriétaire, la CAMIEG, l'écrêtement du minimum de la SNCF, l'ASPA de l'article 23, les
  textes au fac-similé.
