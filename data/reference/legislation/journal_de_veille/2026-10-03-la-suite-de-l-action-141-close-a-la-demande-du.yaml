date: "2026-10-03"
session: >-
  la suite de l'action 141, close, à la demande du propriétaire : « Fait des
  recherches pour ce qui reste à relire »
consulte: >-
  le guide réglementaire Agirc-Arrco de 2018, titre VII, par les données de Common
  Crawl (cluster.idx, CDX, WARC), l'annexe 2 cherchée dans neuf collections ; la
  convention Unédic-Agirc-Arrco du 14 décembre 2021 et l'actualité de l'Unédic qui
  l'annonce ; l'index JORF (arrêtés du 17 août 1992 et du 5 février 2003, arrêtés
  annuels du FSV et de la CNAV de 2002 à 2026, avis sur l'avenant n° 13) ; les
  circulaires Agirc-Arrco 2022-07-DRJ et Agirc SJ 2003-4978 ; le stockage de l'Unédic.
trouve: >-
  Le protocole de 1967 « a pris effet au 1er octobre 1967, sans effet rétroactif » ;
  le calcul sur le salaire journalier de référence date de 1997 ; les taux de
  validation de l'assurance de 1996 à 2015 sont ceux du modèle ; l'ASS n'a pas la
  garantie minimale de points que l'ASFNE a depuis 1989 — le modèle la lui retire.
  La convention de 2021 ne dit pas où se coupent les tranches des 60 % ; les montants
  versés en 2018 et 2019 appuient la lecture du modèle. L'avenant n° 5 de 2002 porte
  le taux des contributions à 6,40 % au 1er janvier 2003. Les conventions de l'État de
  2000 et 2021 se succèdent au 1er janvier 2021 ; le FSV versait une somme indexée,
  puis des sommes qui suivent les allocataires.
reste: >-
  Les textes des conventions de l'État (2000, 2021), des conventions d'application de
  l'Unédic (2004, 2017) et de l'avenant n° 2 de 1992 à la convention ; les règles
  antérieures à 1997 ; les incréments de la DILA, l'index étant à jour au 27 septembre
  2026.
