date: "2026-10-14"
session: "action 145, étape 2 : le personnel navigant, les députés et Mayotte"
consulte: >-
  veille_droit.py (aucune fiche de ces régimes à relire) ; l'index LEGI mis à jour au
  13 octobre 2026, l'index JORF au 11 octobre. Puis : le code de l'aviation civile,
  R. 426-5, R. 426-8, R. 426-9, R. 426-10, R. 426-11 à R. 426-12, R. 426-15-1,
  R. 426-16-1, R. 426-16-1-1, R. 426-16-3, R. 426-18 et R. 426-18-1, toutes leurs
  rédactions de 1984 à 2023 ; le code des transports, R. 6527-1 à R. 6527-73 et
  D. 6527-10 à D. 6527-73, toutes leurs rédactions ; le décret n° 2011-1500, article 26.
  Le règlement de la Caisse de pensions des députés, sur le site de l'Assemblée (copie
  datée) et au Journal officiel du 4 janvier 2018 ; les arrêtés du Bureau n° 34/XVI,
  35/XVI, 49/XVII et 50/XVII (JO des 25 juillet 2023 et 20 mai 2026) ; la loi du 9
  février 1905 ; les ordres du jour du Bureau du Sénat (4 juillet 2023, 15 octobre
  2024). Le décret n° 87-175, articles 1er à 19 ; l'ordonnance n° 2002-411, articles 5
  à 14 et 23-4 ; le décret n° 2003-589, articles 2, 3, 7 à 11, 15 à 17 ; L. 759-1 à
  L. 759-27 du code de la sécurité sociale (rédaction du 1er janvier 2028) ;
  l'ordonnance n° 2026-647 et son rapport.
trouve: >-
  Trois fiches de règles, approchées, pour trois régimes calculés qui n'avaient que la
  fiche générique de liquidation ; aucun chiffre du scénario 1 n'en est changé. La
  caisse des navigants : le taux d'appel de 111 % est écrit pour 2024 et 2025
  (R. 426-8 dans la rédaction du décret n° 2021-570, D. 6527-15), que la fiche de
  régime tient à 105 % ; ni les vingt-cinq meilleures annuités, ni la majoration
  temporaire de 0,8 % du plafond mensuel par annuité de cinquante-cinq ans à l'âge
  légal, ni celle des enfants, ni le minimum de 795 € par annuité ne sont portés. Les
  députés : le règlement est publié au Journal officiel et écrit la subvention de
  l'Assemblée, « égale au double des retenues », que la fiche de régime disait non
  écrite. Mayotte : le décret n° 87-175 écrit la formule de 1987 à 2002 (1,5 % par
  année, cinq meilleures années), que la fiche disait absente de l'index ; le salaire
  moyen se calcule sur seize à vingt-quatre années pour les générations 1956 à 1964 ;
  l'ordonnance n° 2026-647 fond le régime dans le code de la sécurité sociale au 1er
  janvier 2028. Le cliquet des textes ne bouge pas (9 773).
reste: >-
  À lire : le tableau de la valeur « a » de R. 6527-40 au fac-similé du décret n°
  2023-1008, et les taux d'appel de 2017 à 2023 dans les notices de la caisse des
  navigants ; les règlements des députés d'avant 2010, ceux du Sénat et des personnels
  des assemblées ; les décrets d'application de l'ordonnance n° 2026-647. À l'étape 2 :
  Saint-Pierre-et-Miquelon, la CAFAT, les deux tranches de la CPS de Polynésie,
  Wallis-et-Futuna, les fonctionnaires du Pacifique, puis les hors champ (CRFM de
  Mayotte, élus du Pacifique, régies ferroviaires d'outre-mer).
