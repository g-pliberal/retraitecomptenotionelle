date: "2026-10-12"
session: "action 136, étape 6 : le deuxième quintile, et le temps partiel jusqu'au départ, la treizième version de la population"
consulte: >-
  Aucune source de droit nouvelle : la session lit, sans les modifier, le minimum
  contributif et le salaire annuel moyen des vingt-cinq meilleures années que la
  simulation applique. Le classeur « Caractéristiques de tous les retraités résidant en
  France » de l'EIR 2020, diffusé par la DREES, feuilles « QuintilesEQCC » et « Minima »,
  lu hors du dépôt, qui ne le certifie pas encore ; la part du temps partiel par âge que
  l'INSEE publie, certifiée au dépôt.
trouve: >-
  Aucun texte de droit. Le classeur des résidents ne publie pas les bornes de ses
  quintiles ; les déciles de pension de chacun les mettent vers 880 et 1 240 € en
  équivalent carrière complète. À ces seuils, la population met au minimum autant de
  femmes que l'EIR entre les deux ; elle en manque en dessous, au minimum ou non — 8,8 %
  des résidentes sont parties avec une décote. Les femmes de 50 ans et plus sont plus
  souvent à temps partiel que celles de 25 à 49 ans, 32,3 % pour 25,4 en moyenne de 1975
  à 2025 : la treizième version garde le temps partiel jusqu'au départ.
reste: >-
  À l'étape 6 de l'action 136 : certifier le classeur des résidents de l'EIR et y
  confronter la population ; les départs avec décote ; le minimum selon la génération ; la
  bascule de la page, au propriétaire.
