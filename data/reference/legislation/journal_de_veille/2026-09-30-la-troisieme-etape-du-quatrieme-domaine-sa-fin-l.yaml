date: "2026-09-30"
session: >-
  la troisième étape du quatrième domaine, sa fin : l'ASPA de l'inapte et la
  retraite pour invalidité des fonctionnaires, dans les deux moteurs
consulte: >-
  R. 815-1 CSS dans ses onze rédactions de l'index LEGI du dépôt, de 1985 à 2023 ;
  L. 28 (2022), L. 30 (2014), L. 30 bis et L. 30 ter (2014) du code des pensions ;
  les articles 22, 30, 34, 36, 37 et 39 du décret n° 2003-1306 (CNRACL) dans leurs
  rédactions en vigueur ; l'article 6 du décret n° 2004-569 (RAFP) dans ses trois
  rédactions ; la fiche F16871 de service-public, sur l'âge de l'ASPA.
trouve: >-
  L'âge de l'ASPA est « abaissé à l'âge prévu à l'article L. 351-1-5 pour les
  personnes mentionnées aux 2° à 5° de l'article L. 351-8 » depuis 2023, à l'âge de
  L. 161-17-2 de 2011 à 2023, à soixante ans de 2007 à 2011 ; avant 2007, l'article
  administrait les fonds. La rente viagère d'invalidité est la fraction du
  traitement égale au taux d'invalidité, la part au-delà de l'indice majoré 681 au
  1er janvier 2004, revalorisé, ne comptant que pour le tiers ; pension et rente
  ensemble ne dépassent pas le traitement, chaque prestation réduite à due
  proportion (L. 30 ter ; article 34 du décret de la CNRACL). Le RAFP ne s'ouvre qu'à
  l'âge légal, pour l'invalide comme pour les autres.
reste: >-
  L'âge de l'allocation supplémentaire du fonds national de solidarité avant 2007
  (L. 815-2) ; la rédaction de L. 28 d'avant 2004 et son seuil ; la revalorisation
  des pensions d'invalidité de L. 341-6 ; la majoration pour tierce personne ; les
  exemples chiffrés du Service des retraites de l'État, de la CNRACL et de la Cnav,
  à chercher à la quatrième étape.
