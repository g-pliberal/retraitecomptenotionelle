date: "2026-11-06"
session: "action 130, file E5-bis de la vague 11 : les écarts faibles de R-E6 sur la CPRN (E5) et la CARPIMKO (E4-bis)"
consulte: >-
  L'index JORF (à jour au 3 novembre 2026), récupéré. Les arrêtés du 2 août 1963
  (JORFTEXT000000437564), du 20 novembre 1964 (JORFTEXT000000620399) et du 21 février 2001
  (JORFTEXT000000753863, JORFARTI000002396641, JORFARTI000001924450) ; les arrêtés du 9 juin
  1980, du 19 avril 1983, du 12 septembre 1990 et du 16 décembre 1996 (JORFARTI000002135074) ;
  l'arrêté du 16 décembre 2013, annexe, articles 15 et 16 (JORFARTI000028387445), celui du 27
  février 2008 (JORFARTI000018229446), le décret n° 2013-1157 ; les arrêtés approuvant les
  statuts de la section professionnelle des notaires de 2004 à 2014 ; l'article 19 des statuts de
  2017 (JORFARTI000034975971). Aucune règle du scénario 1 lue ni écrite.
trouve: >-
  Les trois arrêtés existent tels que R-E6 les nomme ; cinq textes sont au seul Bulletin officiel
  (1980, 1983, 1990, 1996 no 97-03, 2001) ; l'arrêté de 2013 récrit l'ancien premier alinéa de
  l'article 15 et l'article 16 ; de 2004 à 2013 l'index ne porte que l'arrêté de 2008, qui ne
  récrit que l'article 20. 13 599,74 × 15 / 12 = 16 999,675 et 13 815,60 × 15 / 12 = 17 269,50 ;
  5 681,23 / 1,0375 = 5 475,8843 et × 1,0125 = 5 544,3329.
reste: >-
  Aucune valeur servie ne change. Les statuts de la CPRN d'avant 2014 et les arrêtés de 1980,
  1983, 1990, 1996 et 2001 restent au seul Bulletin officiel (note
  `130/2026-11-06-e5-bis-corrections-de-r-e6.md`).
