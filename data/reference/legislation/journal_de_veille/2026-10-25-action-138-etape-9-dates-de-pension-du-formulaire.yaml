date: "2026-10-25"
session: "action 138, étape 9 : les dates de pension du formulaire"
consulte: >-
  Aucun texte neuf : le routage du micro-entrepreneur des professions que la Cipav garde vers la
  CNAVPL et la Cipav (D. 613-4, b ; fiche micro_social_abattement) ; la clause du grand-père du
  libéral non réglementé affilié avant 2019 à la CNAVPL et à la Cipav (loi n° 2017-1836, art. 15),
  portée par affiliations.yaml.
trouve: >-
  Le formulaire proposait la date de chaque pension sous le statut de chaque métier et à son
  propre début : le RSI au micro-entrepreneur de la Cipav de 2009 à 2014, le régime général au
  libéral installé en 2010 dont le revenu change en 2020. Il les lit désormais comme la carrière,
  sous l'affiliation et à l'entrée dans celle-ci. Sur un relevé, la carrière date l'entrée de la
  première année qui nomme le statut, interruption comprise, quand l'installation suit.
reste: >-
  Rien pour la veille. Le plafond de 2027 ; au modèle, l'entrée d'un relevé qu'ouvre une
  interruption ; la limite 5 ante ter (2) (note « dates de pension du formulaire »).
