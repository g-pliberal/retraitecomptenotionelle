date: "2026-11-08"
session: "action 186, chantier 8 : le plafond de l'apport pour un premier logement, étudié aux sources et chiffré"
consulte: >-
  Aucune règle du scénario 1 n'est touchée. Lus à l'index LEGI du dépôt :
  les articles L. 224-4 (version du 14 juin 2026) et L. 224-2 du code
  monétaire et financier ; R. 815-22 et R. 815-25 du code de la sécurité
  sociale. Lus sur Fedlex : la LPP (RS 831.40, art. 30a à 30e, état au
  1er janvier 2025) et l'OEPL (RS 831.411, état au 1er octobre 2017). Lus :
  la statistique des caisses de pensions de l'OFS (tableau D.06.1.Z,
  2013-2022, et chiffres clés 2023) ; le communiqué de MoneyPark du
  23 octobre 2025 ; les pages du Home Buyers' Plan de l'Agence du revenu du
  Canada ; les pages du CPF de Singapour (taux de cotisation 2026,
  remboursement à la vente, somme de retraite de base) ; la page de
  l'Inland Revenue sur le retrait KiwiSaver pour un premier logement ;
  l'ACPR, « Le financement de l'habitat en 2025 » (n° 183) ; le Bloc-notes
  Éco n° 441 de la Banque de France (23 mars 2026). Non ouverts : les sites
  de l'ATO et de l'ASIC (refus des robots), le KiwiSaver Act 2006 et la
  Division 138 du Taxation Administration Act 1953, la décision
  D-HCSF-2021-7.
trouve: >-
  Aucun écart avec les fiches. Le 6° de L. 224-4 ouvre le PER à
  l'acquisition de la résidence principale, sans plafond ni condition de
  premier achat, et en exclut les versements obligatoires du 3° de
  L. 224-2. La Suisse rembourse à la revente (LPP, art. 30d) ; 21 850
  retraits en 2022 pour 1,88 milliard de francs. Le détail est dans la note
  docs/feuille_de_route/186/2026-11-08-apport-logement-etude.md.
reste: >-
  À lire avant toute publication (chantier 7) : la règle australienne du
  First Home Super Saver Scheme à son texte ; la clause 8 de l'annexe 1 du
  KiwiSaver Act 2006 ; les limites d'usage du CPF (limite de valorisation,
  limite de retrait) ; l'apport des seuls primo-accédants en France, à une
  source primaire.
