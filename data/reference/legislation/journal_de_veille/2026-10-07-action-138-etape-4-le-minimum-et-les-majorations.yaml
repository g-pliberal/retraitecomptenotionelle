date: "2026-10-07"
session: "action 138, étape 4 : le minimum et les majorations de la réversion du régime général"
consulte: >-
  veille_droit.py (dernière veille consignée : 2026-10-07) ; l'index LEGI, mis à jour
  des incréments du 6 octobre 2026 (2 incréments, 248 documents), puis textes.py
  --inscrire ; dans l'index : D. 353-1 (LEGIARTI000006736586, 041968528, 053356066),
  L. 353-1 (LEGIARTI000025018616, 047453693), L. 351-9 (LEGIARTI000006742677),
  R. 351-26 (LEGIARTI000025749165), R. 353-1 (LEGIARTI000038790257), R. 353-2
  (LEGIARTI000006749405), R. 351-30 (LEGIARTI000006750045), L. 353-6
  (LEGIARTI000019959401), D. 353-4 (LEGIARTI000020791861), R. 353-12
  (LEGIARTI000020791843), R. 353-13 (LEGIARTI000024113062) ; l'API de la législation
  de la Cnav : barèmes « Montant minimum de la retraite de réversion », « Plafond de
  ressources pour la majoration de la retraite de réversion », « Montant maximum »,
  « Limite forfaitaire de cumul », « Montant minimum de la pension vieillesse de veuve
  ou de veuf » ; exposés « Montant - retraite de réversion », « Retraite de l'assuré
  décédé », « Majoration de la retraite de réversion », « Calcul de la majoration »,
