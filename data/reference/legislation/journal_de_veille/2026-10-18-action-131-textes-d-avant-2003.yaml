date: "2026-10-18"
session: "action 131 : les textes d'avant 2003 des coefficients de l'Agirc et de l'Arrco"
consulte: >-
  `python scripts/veille_droit.py` en commençant ; les index JORF et LEGI mis à jour
  (incréments jusqu'au 18 octobre 2026) : ni L. 161-17-2 ni L. 161-17-3 n'ont de
  version postérieure au 31 décembre 2025. Le recueil « Accords nationaux des
  partenaires sociaux » de la caisse (accord Arrco du 25 avril 1996, article 10 ;
  accord du 10 février 2001, III ; accords du 3 septembre 2002, du 20 juin 2003 et du
  13 novembre 2003) ; la convention de 1947 et l'accord de 1961 mis à jour au 1er
  janvier 2018 ; les accords que le Medef publie en PDF (accords.medef.com, numéros 1 à
  700) : l'accord du 23 décembre 1996 relatif à la structure financière, le protocole
  du 14 juin 1976, la convention de 1947 mise à jour au 20 mars 2007, l'accord du 24
  mars 1988 ; dans l'index JORF, les notices de l'arrêté du 21 mars 1983 et de
  l'accord du 30 décembre 1993, les avis d'extension des avenants A-197, A-208, A-211,
  A-212, A-218 et A-220 à la convention de 1947, n° 65, 69, 70, 74 et 76 à l'accord de
  1961 ; le document n° 13 du COR (28 janvier 2009), page 15 lue à l'image.
trouve: >-
  La structure financière ne lève l'abattement qu'aux pensions qui prennent effet
  depuis le 1er avril 1983 (« application à compter du 01-04-1983 ») : le moteur le
  levait dès le 1er janvier 1983, et à toute date sur les points de l'UNIRS. Le
  protocole du 14 juin 1976 sert sans coefficient, « auprès des régimes adhérents à
  l'Arrco », les travailleurs manuels et les mères de famille ouvrières de l'article
  70-2, depuis le 1er juillet 1976 : le moteur les abattait. Corrigé dans les deux
  moteurs, par trois versions de la fiche coefficients_anticipation_agirc_arrco ;
  quatre témoins bougent. Jusqu'à l'accord du 13 novembre 2003, l'ASF ne levait
  l'abattement qu'aux salariés en activité, aux chômeurs et aux artisans de la
  CANCAVA (accord de 1996, article 2 ; avenants n° 65 de 2002 et n° 76 de 2003) : le
  moteur le lève pour tous, écart écrit dans la fiche, au propriétaire.
reste: >-
  Les accords de l'ASF du 4 février 1983, du 1er septembre 1990 et du 30 décembre
  1993, que ni l'index, ni le recueil de la caisse, ni le Medef ne donnent ; ce qui
  exonérait l'inapte avant 1983 à l'Agirc et à l'Arrco ; l'anticipation de l'Arrco
  avant soixante ans, et son pas, de 1965 à 1998 ; l'avenant de l'Agirc de 1955.
