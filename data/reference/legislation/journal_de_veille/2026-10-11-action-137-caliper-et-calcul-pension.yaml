trouve: >-
  Aucun texte de droit. La branche principale de calcul_pension est toujours au
  commit ec5a871 du 20 janvier 2023, celui que le registre des modèles a lu ; dev,
  racl et 3-cas-types-du-cor portent des commits qu'elle n'a pas, tous de 2022. Le
  site de la DREES ne sert plus aucune session du cloud : réponse vide à curl, 502
  du proxy de sortie à Chromium, 503 à WebFetch ; le GitLab répond, et le site
  s'ouvre chez le propriétaire, tel que les copies d'Internet Archive le donnent.
  Le communiqué du 23 décembre 2021 ne nomme pas CALIPER : il ouvre calculPension
  comme « le moteur de calcul des droits » de TRAJECTOiRE. La page TRAJECTOiRE cite
  deux Études et résultats que le dépôt n'avait pas : le n° 1297 (2024), sur le
  minimum contributif, et le n° 1283 (2023), sur les majorations pour enfants.
reste: >-
  Les branches de 2022 de calcul_pension, non lues ; la liste des simplifications de
  CALIPER, à confronter à docs/limites/ ; les Études et résultats n° 1297 et 1283,
