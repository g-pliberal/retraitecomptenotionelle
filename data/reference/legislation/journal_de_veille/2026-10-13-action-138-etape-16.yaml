date: "2026-10-13"
session: "action 138, étape 16 : les coefficients de l'Agirc d'avant 1955 et de l'Arrco d'avant 1965"
consulte: >-
  La convention collective nationale du 14 mars 1947, texte d'origine et annexes, dans la
  copie numérisée que publie dcalin.fr, lue à l'image (annexe I, article 6) ; l'index JORF
  du dépôt pour ses agréments et extensions de 1947 à 1970, et pour l'accord du 8 décembre
  1961 (arrêté d'agrément du 27 mars 1962, JORFTEXT000000435809, « ACCORD PUBLIE EN
  ANNEXE » au Journal officiel du 31 mars 1962), des notices sans corps ; Légifrance,
  NATLEX et Gallica, qui refusent la session ; le document n° 13 du COR du 28 janvier
  2009 ; les barèmes IPP au commit fe2cdff ; les fiches GERESO RET-B080 et RET-C150. Puis
  l'index LEGI, à jour de l'incrément du 12 octobre, que le serveur de la DILA sert de
  nouveau : L. 161-17-2 et L. 161-17-3.
trouve: >-
  La table de 1947 : liquidation au plus tôt à 55 ans, retraite normale à 65 ans,
  coefficients d'anticipation de 0,40 à 0,93 par année d'âge, d'ajournement de 1,05 à 66
  ans à 1,25 à 70 ans et au-delà ; les nombres du COR, non ceux de l'IPP. Le modèle les
  sert aux pensions de l'Agirc prenant effet avant 1955 (fiche
  coefficients_anticipation_agirc_1947), la fin supposée au 1er janvier 1955. L'accord de
  1961 se lit au Journal officiel du 31 mars 1962, que la session ne peut pas ouvrir. Ni
  L. 161-17-2 ni L. 161-17-3 n'ont de version postérieure au 31 décembre 2025.
reste: >-
  L'Arrco d'avant 1965 : le fac-similé du Journal officiel du 31 mars 1962, depuis le
  poste du propriétaire, et le règlement de l'UNIRS de 1957, hors du Journal officiel.
  L'avenant de 1954 ou de 1955 qui supprime l'ajournement de l'Agirc, au fac-similé des
  arrêtés d'extension du 13 janvier 1955 et du 28 mars 1956.
