date: "2026-10-16"
session: "action 138, étape 8 : les points des conjoints et des aides familiaux dans les plans de revalorisation de 1998 à 2008"
consulte: >-
  L'index LEGI du dépôt, à jour au 11 octobre 2026 : D. 732-110 (2007,
  LEGIARTI000006597533), D. 732-118 (2005, LEGIARTI000006597545 ; 2007,
  LEGIARTI000006597546), D. 732-119 à D. 732-131 (LEGIARTI000006597547 à
  LEGIARTI000006597561), D. 732-141, D. 732-142, D. 732-143, D. 732-145, D. 732-146,
  D. 732-147 (LEGIARTI000006597575 à LEGIARTI000006597582), L. 732-54-2 (2007,
  LEGIARTI000006585628), L. 732-54-8 (2005, LEGIARTI000006585645). L'index JORF : le
  décret n° 2002-297, articles 6, 8, 9 et 10, le décret n° 99-875 du 13 octobre 1999
  (sa notice), le décret n° 98-489. L'index n'a pas été remis à jour, ni les
  rédactions inscrites (fait le 16 octobre par une autre session).
trouve: >-
  Depuis 2002, au taux plein et à dix-sept ans et demi d'activité agricole, chaque
  année de conjoint collaborateur reçoit B - 16 points, B = (MV2 - AVTS) / (37,5 x VP),
  chaque année de conjoint participant d'avant 1999 B, minorées d'une année par année
  d'écart avec 1999 (D. 732-145, D. 732-146). Les pensions prises de 1998 à 2001 la
  reçoivent depuis 2002, à trente-deux ans et demi (vingt-sept et demi à quinze ans de
  conjoint sans autre pension), minorée sous trente-sept et demie ; depuis 2007,
  vingt-deux ans et demi et 5,5 % par année manquante, 4 % en 2008 (D. 732-118,
  D. 732-131). Les deux moteurs les servent ; fiche majoration_retraite_proportionnelle
  mise à jour, sa version de 2002 coupée en 2007 et en 2008.
reste: >-
  Les montants des pensions dues de 1998 à 2001 (décrets n° 99-875, 2000-261,
  2001-170) ; les années de chef de D. 732-119, 4° ; l'aide familial, le rachat,
  l'option tardive et la réversion, à saisir ; un exemple chiffré de la MSA.
