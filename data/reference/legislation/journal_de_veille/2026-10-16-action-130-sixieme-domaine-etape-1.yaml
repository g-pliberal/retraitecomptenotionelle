date: "2026-10-16"
session: "action 130, sixième domaine, étape 1 : les périodes assimilées manquantes, lues à la source"
consulte: >-
  L'index LEGI, mis à jour jusqu'au 15 octobre 2026 (cinq incréments acceptés), puis
  textes.py --inscrire (266 rédactions et 8 textes à examiner, commités à part). Code du
  travail : L. 118-6 (1979), L. 6243-3 (quatre rédactions), L. 6342-3. Code de la sécurité
  sociale : D. 373-1, D. 373-3, D. 373-4 (rédactions de 2014, 2018, 2022) ; L. 351-3 (ses
  rédactions de 2011 à novembre 2026) ; R. 351-12 (2°, 4° i et k, 9°, rédactions de 2012 à
  novembre 2026) ; D. 351-1-2 (janvier 2026). JORF : loi n° 2014-40, article 30 ; décrets
  n° 2014-1514, 2022-652 et 2023-799 (article 4). Cnav : circulaires 2016-41
  (apprentis) et 2024-18 (formation professionnelle continue, TUC).
trouve: >-
  Apprentissage : depuis 2014, les salaires réels valident par la règle commune, et un
  complément valide pour la durée d'assurance seulement ce qui manque à la durée du
  contrat (D. 373-3, mois civils entiers et reliquats de trente jours, tiers arrondi en
  dessous) ; ces trimestres ne sont pas cotisés (circulaire 2016-41, 2.2.4). Le payeur
  passe du FSV à la branche vieillesse le 1er janvier 2026 (loi n° 2025-199). Depuis 2022,
  D. 373-4 forfaitise le versement et n'a plus le II qui disait la portée des trimestres.
  Avant 2014, assiette forfaitaire, 200 heures du SMIC par trimestre. Stages : 50 jours =
  1 trimestre assimilé dans l'année, depuis 2015 pour tous les stages de la formation
  professionnelle, et pour les pensions prenant effet depuis le 1er septembre 2023, les TUC
  de 1984 à 1990 et quatre autres stages d'insertion de 1977 à 1992. Sportifs de haut
  niveau : depuis 2012, 90 jours = 1 trimestre, plafond relevé de 16 à 32 au 1er septembre
  2023. Congé supplémentaire de naissance : 58 jours = 1 trimestre depuis le 1er juillet
  2026 (décret n° 2026-425). Quatre fiches, pas encore modélisées ; le cliquet des textes
  passe de 9 768 à 9 762.
reste: >-
  Une circulaire Cnav sur l'apprentissage d'après 2022 ; l'arrêté du 5 juin 1979
  (l'assiette d'avant 2014) ; les décrets n° 2015-1240 et celui du financement des stages
  d'avant 2015 ; l'instruction DSS/SD3A/2023/167 ; une circulaire Cnav sur les sportifs ;
  le décret n° 2026-425 pour les congés du premier semestre 2026. La circulaire de la MSA
  pour les apprentis agricoles. Les exemples des circulaires 2016-41 et 2024-18, à faire
  entrer à l'étape 4 du domaine.
