date: "2026-11-03"
session: "action 158, file B2-bis : les durées d'échelon corrigées d'après la relecture R-B2 (commit b121b49), chaque point rouvert au LEGI"
consulte: >-
  Aucune règle du scénario 1 n'est écrite : les durées d'échelon ne servent pas encore au
  calcul. L'index LEGI publié du dépôt, à jour au 2 novembre 2026 (incrément
  20261102-213929), récupéré sans reconstruction, interrogé article par article (texte,
  versions, mot à mot) ; l'index JORF publié, à jour au 3 novembre 2026, pour deux dates
  d'effet ; le Noyau RH de l'État au dépôt (data/reference/grilles/etat/). Les versions
  jamais en vigueur : n° 99-669 (art. 17), 83-1260 (art. 34), 91-868 (art. 7), 91-290
  (art. 14-4), 2014-923 (art. 25), 2014-1455 (art. 22), 92-851 (art. 14), et les versions
  en vigueur aux mêmes dates. Le paragraphe qui suit le tableau : n° 72-583 (art. 6),
  72-580 (art. 13), 90-680 (art. 24), 93-752 (art. 17), 65-383 (art. 10-7), 96-1113
  (art. 14), 90-90 (art. 18), 92-778 (art. 31-6 et 32). Le Noyau RH : n° 2021-1550
  (art. 9), grades 02979 et 05041. Les fiches : n° 98-343 (art. 39), 67-715 (art. 13),
  89-750 (art. 13), 97-401 (art. 26), 79-1071 (art. 5). Les chevauchements : n° 91-868
  (art. 7) et le décret n° 2017-1374 au JORF ; n° 96-366 (art. 5) ; n° 92-847 (art. 14) et
  le décret n° 96-101 au JORF et au LEGI. L'emploi avant l'en-tête : n° 2016-2003
  (art. 13). La règle du quart : n° 2014-99 (art. 10), les 28 articles de l'index qui
  l'écrivent, les 36 tableaux de moyenne seule. En contre-lisant : n° 90-680, 87-1099,
  2011-1317 (la case « Spécial ») ; n° 2014-923, 2016-336 (« Avant le 1er échelon »).
trouve: >-
  Sept versions jamais en vigueur, et non six : la septième (n° 92-851, art. 14) ouvrait
  une période réunie à la suivante ; toutes ôtées des lignes et consignées ; les versions en
  vigueur aux mêmes dates sont lues, sauf pour le n° 83-1260 (aucune au LEGI du 8 janvier
  1984 au 4 août 1990) et le n° 91-290 (seule version). 21 des 22 refus « un échelon
  manque » étaient un paragraphe « II.- » pris pour un grade : 14 tableaux, 268 lignes,
  rentrent, contre-lus au texte ; le 22e est juste (la consolidation du LEGI saute le 5e
  échelon, que le décret publié au JORF écrit : n° 2020-1435, art. 8). Le
  septième écart au Noyau RH n'en est pas un : au grade 05041, 48 mois comme le texte. Un
  tableau en fiches se compte une fois (409 lignes non lues en moins), et 25 versions en
  fiches que rien ne consignait le sont. Trois chevauchements marqués ; le texte lu n'en
  tranche aucun (la notice du n° 2017-1374 date du 1er janvier 2017 le nouvel article 7 du
  n° 91-868, mais l'article qui le fixe n'est pas dans l'index ; les deux versions du
  n° 96-366 ont les mêmes durées). La règle du quart, citée mot pour mot, dans 10 des 36
  tableaux de moyenne seule, tous de l'hospitalière ; les 26 autres textes ne l'écrivent
  pas. En plus : la case « Spécial », échelon spécial avalé dans le libellé du grade
  (28 tableaux), et « Avant le 1er échelon », fausse ligne (4 tableaux), corrigées.
reste: >-
  Le n° 83-1260, art. 34 : la fin du 4 août 1980 que le LEGI donne à LEGIARTI000027940471
  est peut-être une coquille pour 1990 ; à lire au JORF avant de rendre ses 15 lignes
  (question au propriétaire). « Echelon fonctionnel » dans le libellé (n° 2000-747,
  2003-770). Les 97 tableaux en fiches, les 115 en caractères, les 10 articles qui écrivent
  la règle du quart sans tableau trouvé. Le rattachement aux grilles, qui choisira entre
  les périodes qui se chevauchent.
