date: "2026-10-05"
session: "action 142 : la délibération de l'ERAFP, et la majoration du RAFP"
consulte: >-
  veille_droit.py (dernière veille consignée le 4 octobre 2026, aucune question du
  RAFP) ; l'index LEGI et JORF du dossier principal, aux incréments du 27 et du 22
  septembre 2026, le serveur de la DILA refusant encore les suivants : le décret
  n° 2004-569, articles 8 (LEGIARTI000006453306, LEGIARTI000037483754), 9
  (LEGIARTI000006453307, LEGIARTI000037483756), 9-1 (LEGIARTI000049421944) et 27
  (LEGIARTI000029728288), le décret n° 2018-873 (LEGITEXT000037482967), l'arrêté du 26
  novembre 2004, articles 11 et 12 ; au JORF, aucune délibération sur les barèmes,
  seulement les budgets de l'établissement. Sur Légifrance, le 5 octobre, les articles
  8 et 9 en vigueur depuis le 11 octobre 2018. Hors de Légifrance, sur rafp.fr : les
  délibérations du conseil d'administration du 5 février 2015, n° 5 du 30 avril 2020,
  n° 2 du 16 décembre 2021, n° 7 du 8 février 2024 et celles des valeurs du point de
  2016 à 2025 ; les rapports annuels 2005, 2012, 2014, 2015 et 2022 ; les tableaux des
  coefficients de majoration et de conversion. Ailleurs : la fiche du COR sur le RAFP
  (2024), les questions écrites n° 92389 (Assemblée) et 23414 (Sénat), le document du
  SNES de 2014.
trouve: >-
  Le barème de majoration est celui de la délibération du 5 février 2015, de 1,00 à
  62 ans à 1,81 dès 75, pour les prestations qui prennent effet depuis le 1er mars
  2015 ; avant, celui de la délibération du 10 novembre 2005, au pivot de 60 ans (1,08
  à 62, 1,18 à 64, 2,08 à 75), lu au rapport annuel 2012. L'ERAFP le calcule « en
  tenant compte du nombre d'années et du nombre de mois » ; son simulateur arrondit en
  plus au centième, ce qu'aucun texte ne dit, et son tableau publié à part écrit 1,80
  à 75 ans. La conversion en capital suit le barème de 2005 jusqu'en 2021, celui du 16
  décembre 2021 depuis 2022 ; le capital se verse en deux fois de 4 600 à 5 124 points
  depuis mai 2019, de 4 900 depuis avril 2024. Le modèle date ses barèmes, calcule au
  mois sans arrondir et dit le capital fractionné ; les dix saisies du simulateur sont
  des exemples, deux en écart connu, et neuf calculs que l'ERAFP publie, tous
  concordants.
reste: >-
  Demander à l'ERAFP si ses liquidations arrondissent le coefficient au centième, si le
  1,80 de son tableau est une coquille, et ses délibérations du 10 novembre 2005 et du
  28 mars 2019, que son site ne publie pas ; l'article 9-1, qui suit la cotisation
  exceptionnelle unique que le modèle ne porte pas.
