date: "2026-10-13"
session: "action 159, étape 7 : la population, le jaune pensions 2027 confronté à ce que le modèle suppose des pensionnés publics"
consulte: >-
  Aucun texte de loi : la session confronte des séries, et n'écrit aucune règle du
  scénario 1. Le jaune pensions annexé au PLF 2027 (data/brut/34465.pdf, tiré de la
  branche jaune-2027, empreinte vérifiée), en texte et, pour les graphiques 15 et 16 et
  le tableau C-7, en image : graphiques 15, 16 et 87 à 91, tableaux A-1 à A-3, B-5,
  B-12, B-13 et C-1 à C-9. Côté modèle, la table de mortalité de 2024 à 2026 et ses
  facteurs de population, les retraités que le COR projette (retraites_projetes.csv),
  les têtes des cas types publics comme masses_anticipees les pèse, et
  caracteristiques_retraites.csv.
trouve: >-
  Recoupés, et tenus par trois tests : le facteur des pensionnés civils de l'État, calé
  sur leur espérance de 2024, retrouve leurs décès de 2025 à 3 % près (45 591 décès,
  12 % de moins que sous la table générale) ; la croissance de 2024 à 2025 que le COR
  projette aux trois caisses publiques, à six dixièmes de point de celle que le jaune
  constate ; le militaire de la grille, 31,6 % de ses retraités sous soixante ans pour
  31,5. Déclarés dans les limites : l'agent de la CNRACL, parti à l'âge d'ouverture,
  en met 12,1 % sous soixante ans pour 1,3 (4,4 des 8,3 Md€ du classement), et son
  vingtile lui prête 13 % de décès de moins que la population générale quand ses
  retraités n'en ont que 4 ; le civil de l'État ne part jamais tôt quand 11 139
  départs de 2025 ont devancé l'âge légal ; près de deux millions de pensionnés
  publics comptés à la Cnav, et aucun second métier au militaire quand plus de la
  moitié touchent une pension du régime général ; la table de mortalité de 2025, une
  loi de Makeham, que les décès des droits dérivés démentent aux grands âges (33 000
  attendus, 39 905 morts, 38 400 sous une table interpolée). Le document se contredit
  sept fois, dont 279 départs de parents imprimés pour 989 au tableau C-7.
reste: >-
  À l'étape 5 : l'agent de la CNRACL, à scinder ou à faire partir à 61 ans, son niveau
  de fin de carrière, le civil de l'État sans catégorie active ni carrière longue, le
  second métier du militaire. À une session du modèle : la table de 2025 interpolée
  entre 2024 et 2026, en Python et en JavaScript.
