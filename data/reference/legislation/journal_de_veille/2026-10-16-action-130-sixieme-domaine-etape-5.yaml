date: "2026-10-16"
session: "action 130, sixième domaine, étape 5 : le bloc du formulaire, dans les deux saisies"
consulte: >-
  Aucun texte neuf : la saisie ne fait que déclarer les périodes, et ne touche
  à aucune règle du scénario 1. Les quatre fiches de l'étape 1 et la fiche
  apprentissage relues pour les seules dates que l'aide du formulaire cite
  (les stages depuis 2015, les TUC et stages d'insertion de 1977 à 1992 pour
  une pension prise depuis le 1er septembre 2023, les sportifs depuis 2012, le
  congé de naissance depuis le 1er juillet 2026, le complément de
  l'apprentissage depuis 2014).
trouve: >-
  Rien qui change le droit lu ; l'aide du formulaire dit ce que les fiches
  portent.
reste: >-
  Ce que les étapes 1 à 4 ont laissé à relire, inchangé.
