date: "2026-10-12"
session: "action 136, étape 6 : les durées des résidents, la quatorzième version de la population"
consulte: >-
  Aucune source de droit nouvelle : la session lit, sans les modifier, les quintiles des
  résidents de l'EIR 2020, certifiés au dépôt (quintiles_eqcc_residents.csv), et le
  verdict de la suite complète, rouge sur l'envoi de cette série.
trouve: >-
  Aucun texte de droit. La suite rougissait parce que la page Données compte les séries
  certifiées — 150, et 73 251 valeurs — et que le parcours de présentation en écrivait
  encore 149. La population, qui prend désormais les durées des résidents, n'a plus que
  7,9 % d'hommes aux carrières de moins de trente années, au lieu de 11,5 ; leur pension
  moyenne passe de 1 781 à 1 803 € (1 957 dans l'EIR) ; 16,7 % d'entre eux restent au
  minimum, pour 9,8 chez les résidents.
reste: >-
  À l'étape 6 de l'action 136 : les carrières statutaires déclinées aux classes de salaire
  du privé, que le minimum garanti relève ; les départs avec décote ; le minimum selon la
  génération ; la bascule de la page, au propriétaire.
