date: "2026-11-21"
session: "action 194 : la surcote des régimes spéciaux, comptée pour la durée des services"
consulte: >-
  L'index LEGI du dépôt, à jour du 16 novembre 2026 : décret n° 2008-639,
  article 13 (LEGIARTI000054622824) ; décret n° 2008-637, article 24
  (LEGIARTI000047914227) ; annexe 3 du statut des IEG, article 10
  (LEGIARTI000052046924) ; décret n° 90-1215, article 85-1
  (LEGIARTI000047909834) ; décret n° 68-960, article 12
  (LEGIARTI000029134341) ; décret n° 68-382, article 14
  (LEGIARTI000029135161). Fiche surcote_regimes_speciaux.
  scripts/veille_droit.py : rien à relire sur cette fiche.
trouve: >-
  Les six articles comptent les trimestres de surcote sur la durée des
  services d'après l'âge, puis en retiennent les trimestres entiers. Défaut
  de code, non de texte : le moteur perdait un trimestre selon le mois de
  naissance ; corrigé (IEG né en février 1954, parti à 63 ans et 9 mois :
  37 225,82 à 37 621,84 euros par an). Détail :
  docs/feuille_de_route/194/2026-11-21-surcote-des-regimes-speciaux-au-mois.md.
reste: >-
  La décote des mêmes régimes et leur durée d'assurance totale comptent
  encore par trimestres civils, cette dernière bornant toujours la surcote
  de l'Opéra ; la réduction des trimestres de surcote au temps partiel
  n'est pas faite. Le détail, dans la note.
