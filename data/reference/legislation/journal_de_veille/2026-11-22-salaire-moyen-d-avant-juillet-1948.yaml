date: "2026-11-22"
session: "action 191 : le salaire moyen d'avant juillet 1948, au décret n° 45-0179 d'origine"
consulte: >-
  Le décret n° 45-0179 du 29 décembre 1945, article 74, rédaction d'origine (JO
  du 30 décembre 1945, transcrit au lot 1 des fac-similés) ; l'index JORF de la
  DILA, pour les textes qui le modifient (décret n° 49-328 du 7 mars 1949,
  notice seule) ; dans la base de législation de la Cnav, les circulaires
  n° 151 du 5 août 1946, n° 246 du 25 août 1947 et n° 143 SS du 29 juin
  1949 ; l'accord Arrco du
  8 décembre 1961 (JO du 31 mars 1962, lot 1).
trouve: >-
  Avant juillet 1948, les périodes assimilées entrent dans le salaire annuel
  moyen (§ 3), neutralisées depuis la circulaire de 1947, et les trimestres
  d'après soixante ans complètent les quarante (§ 4), ceux des assurances
  sociales comptés ; l'exclusion des années de deux trimestres assimilés vient de la
  rédaction du décret n° 49-328. Corrigé, avec ses tests. L'accord Arrco de
  1961 est au JO : note récrite. Détail :
  docs/feuille_de_route/191/2026-11-22-salaire-moyen-d-avant-juillet-1948.md.
reste: >-
  L'arrêté du 14 mai 1946 (salaire fictif, coefficients d'avant 1949) ;
  l'arrêté du 9 septembre 1946 et la circulaire n° 171 du 30 mai 1947 ; le
  décret n° 49-328 au JO ; le salaire de 1930 à 1944 hors du salaire moyen du
  régime général.
