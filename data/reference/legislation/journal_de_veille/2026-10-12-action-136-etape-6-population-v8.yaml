date: "2026-10-12"
session: "action 136, étape 6 : les retraités au minimum rangés au premier quintile, la huitième version de la population"
consulte: >-
  Aucune source de droit : la session ne touche à aucune règle du scénario 1. Les séries
  certifiées au dépôt — les quintiles de la pension en équivalent carrière complète de
  l'EIR 2020 et la part au minimum de pension de chacun, la part des liquidants au
  minimum contributif et son montant moyen dans l'EACR ; aucun téléchargement.
trouve: >-
  Aucun texte de droit. Rangés au premier quintile, les retraités au minimum font
  descendre dans la classe du bas les longues carrières de femmes et en remonter les
  courtes : au premier quintile, celles de moins de dix ans passent de 94,1 à 87,1 %
  (80,5 dans l'EIR). Le minimum contributif de 2023 reste à 13,6 % (EACR 18,8), son
  montant moyen à la moitié de celui de l'EACR ; le volume de travail selon le rang,
  essayé dessus, le porte à 17,2 %, celui des hommes de 5,5 à 10,1 %.
reste: >-
  À l'étape 6 de l'action 136 : le volume selon le rang, remesuré sur la huitième
  version, avec les pensions ; les pensions des femmes, au-dessus de l'EIR, et des
  hommes, en dessous ; la bascule de la page, au propriétaire.
