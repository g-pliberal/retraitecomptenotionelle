date: "2026-11-03"
session: "action 158, étape 2, le barème : l'indice majoré de chaque indice brut, version par version du décret n° 82-1105 depuis 1983, transcrit par Épicycle et recoupé au LEGI et aux textes"
consulte: >-
  Aucune règle du scénario 1 n'est écrite. Les index LEGI et JORF du dépôt (dumps du 13 juillet
  2025, incréments jusqu'au 2 novembre 2026 à 21 h 39) : les versions des articles 1er à 3 du
  décret n° 82-1105 et de ses tableaux « Barème A » (1982 à 2024) ; les versions des articles 7 à
  10 bis du décret n° 85-1148, de 1985 à 2011 ; au JORF, les décrets qui annexent un barème —
  n° 86-166, 88-1067, 89-64, 90-321, 91-1191, 98-462, 99-208, 99-491, 99-943, 2001-370,
  2001-559, 2004-679 et son rectificatif, 2005-726, 2006-759, 2006-1283, 2007-1054, 2008-400,
  2008-622, 2009-824, 2011-51, 2012-37, 2012-853, 2013-33, 2017-85, 2021-406, 2023-519 — et
  leurs articles. Le jeu d'Épicycle sur data.gouv.fr, « Correspondances entre indices bruts et
  indices majorés de la fonction publique en fonction du temps » (61c26e0a8b4b58472b8d0907,
  fichier du 14 novembre 2023, CC BY-SA). Le barème du Noyau RH de l'État, déjà au dépôt.
  Légifrance refuse le mandataire de la session ; Internet Archive et Gallica aussi.
trouve: >-
  Le LEGI date chaque version du barème A mais n'en reproduit les tableaux que depuis le
  1er juillet 2007 ; avant, l'article 1er dit « tableau non reproduit » et les décrets renvoient
  au Journal officiel imprimé. Vingt-neuf versions, du 1er janvier 1983 au 1er janvier 2024 :
  sept décrets attribuent des points uniformes à tous (1988, 1989, 1990, 1991, avril et décembre
  1999, novembre 2006), et 1985 et 2024 ajoutent deux et cinq points à tous sans le dire ; les
  autres ne touchent que le bas de l'échelle. Le jeu d'Épicycle redonne les treize tableaux du
  LEGI (11 484 couples) et les 86 couples que les articles 7 à 10 bis du décret n° 85-1148 et le
  n° 91-1191 écrivent pour les barèmes de 1983 à 2008 ; il omet la version du 1er juillet 1999
  (n° 99-491), déduite de celle du 1er décembre moins son point uniforme, et recopie huit
  valeurs de la ligne voisine (1983, 1989, 1990, 2004), corrigées. La rédaction d'origine du
  décret n° 85-1148 écrit les indices du barème de 1983, que le n° 86-166 n'a remplacé qu'en
  février 1986, au 1er janvier 1985. Le LEGI intervertit les dates de ses versions d'avril et de
  juillet 1999, et laisse quatre mentions des articles 7 et 10 à leur ancienne valeur. Le Noyau
  RH redonne le barème de juillet 2009 à 2023 ; avant, il prolonge jusqu'en 1900 les valeurs de
  mai 2008 des indices bruts 100 à 302 et donne 466 à l'indice brut 500 au lieu de 430.
reste: >-
  L'étape 2 de l'action 158, dans l'ordre de la file : les grilles de l'État d'avant le Noyau RH,
  puis le chaînage et les reclassements ; les durées d'échelon, que le propriétaire peut faire
  passer d'abord ; les tableaux que l'index aplatit ; le minimum de traitement de l'article 8 du
  décret n° 85-1148, à mettre en table ; les tableaux imprimés du barème de 1982 à 2006, qui
  prouveraient les huit corrections et la version de juillet 1999, d'un poste qui ouvre
  Légifrance.
