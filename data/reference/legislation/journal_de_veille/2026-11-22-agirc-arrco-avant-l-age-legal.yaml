date: "2026-11-22"
session: "action 194 : l'Agirc-Arrco avant l'âge légal, d'avril 1983 à mars 2023"
consulte: >-
  La fiche coefficients_anticipation_agirc_arrco et les textes qu'elle
  transcrit : arrêté du 21 mars 1983, son résumé ; accord du 23 décembre 1996,
  article 2 ; accord du 13 novembre 2003, article 1er ; annexes E et V de
  l'accord du 18 mars 2011, articles 2 à 4 ; avenant n° 15 du 16 mars 2023.
  L'index KALI, à jour du 13 novembre 2026 : accord du 17 novembre 2017,
  articles 84 (KALIARTI000036731926), 85 (KALIARTI000036731928) et 88
  (KALIARTI000036731935), en vigueur en mai 2020. L'index LEGI, à jour du
  16 novembre 2026 : arrêté du 30 décembre 1970, article 16, III, rédactions
  de 2011, 2018 et 2023 (LEGIARTI000024266924, LEGIARTI000037845437,
  LEGIARTI000048065521). scripts/veille_droit.py : rien à relire sur ces
  fiches.
trouve: >-
  Du 1er avril 1983 au 15 mars 2023, la table des trimestres manquants et
  l'exonération par la durée ne s'ouvrent qu'à l'âge légal, soixante ans
  jusqu'en juin 2011 ; avant lui, l'âge seul fixe le coefficient, hors
  carrière longue. Le modèle les prenait à tout âge ; corrigé (né en janvier
  1950, parti à cinquante-huit ans en 2008 : son Arrco à 0,64, et non plus
  sans coefficient). La pension provisoire de la retraite progressive a sa
  règle (articles 85, 2, et 88) et garde la table ; celle de l'Ircantec n'est
  qu'une liquidation provisoire sous le I et le II de l'article 16. Détail :
  docs/feuille_de_route/194/2026-11-22-agirc-arrco-avant-l-age-legal.md.
reste: >-
  L'Agirc-Arrco, que l'article 84, 2 laisse demander dix ans avant l'âge du
  taux plein, se sert toujours avec la pension de base : le propriétaire
  décide si elle se présume demandée au départ déclaré. Le barème temporaire
  de la pension provisoire n'est pas porté ; la pratique de l'Ircantec en
  retraite progressive n'est pas lue.
