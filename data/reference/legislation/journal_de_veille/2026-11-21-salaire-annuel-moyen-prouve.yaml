date: "2026-11-21"
session: "action 194 : le salaire annuel moyen prouvé par une grille indépendante"
consulte: >-
  L'index LEGI du dépôt, à jour au 16 novembre 2026 : R. 351-29 CSS, toutes ses
  rédactions de 1985 (LEGIARTI000006750038) à 2026 (LEGIARTI000053335651) ;
  R. 351-29-1, R. 173-3-2, R. 351-9, R. 351-39 (LEGIARTI000053327980), L. 351-11
  (LEGIARTI000006742641, LEGIARTI000031688444), L. 161-23-1, L. 161-25.
  L'index du JORF : décret n° 2025-1409, article 2 (JORFARTI000053227542) ; loi
  n° 2010-1330, article 118, VI (JORFARTI000023022348).
trouve: >-
  Les années d'avant 1948 ne sont prises qu'à défaut d'assez d'années
  postérieures (R. 351-29 jusqu'en 2025, que R. 351-39 garde depuis 2026 à qui a
  des périodes de plus de soixante ans) : le moteur les classait avec les autres,
  corrigé. Les tableaux de coefficients de la Cnav suivent le coefficient légal
  des pensions (L. 351-11) ; la série de TRAJECTOiRE ne le suit pas. Une session
  qui n'a pas lu le code retrouve les 78 salaires que le simulateur rend. Détail :
  docs/feuille_de_route/194/2026-11-20-salaire-annuel-moyen.md.
reste: >-
  Les indemnités journalières de maternité (R. 351-29, 125 % depuis 2012, forfait
  depuis septembre 2023), que le moteur ne compte pas, et l'arrêté du salaire
  médian. Les versions d'avant juillet 1995.
