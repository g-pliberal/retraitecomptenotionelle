date: "2026-10-28"
session: >-
  action 138, étape 4, au site : les quatre champs qui révisent la réversion
  (`activite_conjoint_fin`, `activite_conjoint_variations`, `nouvelle_union_fin`,
  `ressources_nouveau_conjoint_variations`), et la phrase de la carte qui dit chaque
  révision et les ressources qu'elle retient
consulte: >-
  Aucun texte neuf : l'étape ne touche à aucune règle et montre ce que le modèle
  calcule depuis le 24 octobre (R. 353-1-1, R. 353-1 ; circulaire Cnav n° 2007-35,
  § 222 ; notes `2026-10-24-etape-4-revision-avant-sa-retraite.md` à
  `2026-10-24-etape-4-trois-mois-de-chaque-revision.md`).
trouve: >-
  Rien de neuf au droit. L'aide du champ « Depuis » disait que le régime général ne
  compte le ménage que formé quand la réversion commence ; le modèle le compte, depuis
  le 24 octobre, à la révision qui suit sa formation : l'aide le dit.
reste: >-
  Rien pour la veille. Au site, la catégorie, la période et son moment, le plancher
  non majoré, et le motif du ménage formé après la date d'effet (note
  `2026-10-28-etape-4-revisions-au-site.md`).
