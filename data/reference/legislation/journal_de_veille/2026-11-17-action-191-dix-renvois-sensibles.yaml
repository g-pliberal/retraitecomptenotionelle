date: "2026-11-17"
session: "action 191 : les dix renvois de régimes qui peuvent changer un résultat, relus au texte"
consulte: >-
  Index JORF et LEGI de la DILA, à jour au 16 novembre 2026 : décret
  n° 2007-262 et son règlement (articles 1er, 26, 32, 68, 70) ; L. 723-10-1,
  R. 723-30 et décret n° 2004-1449 (article 4) ; L. 721-5, L. 721-6,
  D. 721-6, loi n° 2005-1579 (article 75) et décret n° 2006-1325 (article 2) ;
  loi n° 2003-775 (articles 66 et 80), décrets n° 2003-1306 (articles 65 et
  67) et n° 2004-1056 (articles 50 et 52) ; décret n° 90-1215, article 84
  (LEGIARTI000047910068) ; décret n° 73-937, articles 1er et 3, décrets
  n° 2010-1734 (articles 8 et 11) et n° 2012-1129. Aucune règle touchée.
trouve: >-
  Cinq renvois justes (CNBF, fonction publique d'État, CNRACL, FSPOEIE,
  CRPCEN). Cinq faux : Banque de France au 1er avril 2007, Cavimac au
  20 décembre 2005 et au 2 novembre 2006, artisans et commerçants d'avant
  1973 (deux régimes) au 7 octobre 2012. La décote de la Banque de France n'est pas celle de
  la fonction publique : son règlement (article 70) n'en oppose aucune avant
  2009, puis suit sa propre table. Détail dans
  docs/feuille_de_route/191/2026-11-17-dix-renvois-sensibles.md.
reste: >-
  Les corrections attendent l'accord du propriétaire. Relever les
  rédactions de l'article 70 du règlement de la Banque de France ; ce que la
  caisse des artisans et commerçants a appliqué entre juillet 2011 et
  octobre 2012 ; l'âge de 55 ans du règlement d'avant 2007, que l'index ne
  porte pas.
