date: "2026-10-12"
session: "action 136, étape 6 : le bas de l'échelle décliné, la septième version de la population"
consulte: >-
  Aucune source de droit : la session ne touche à aucune règle du scénario 1. Les séries
  que la population lit déjà — les centiles du salaire par sexe et la persistance au
  voisinage du Smic de la DG Trésor (document de travail n° 2018/3), certifiées au dépôt ;
  aucun téléchargement.
trouve: >-
  Aucun texte de droit. Décliné en quatre sous-classes de rang, le reste de la classe du
  bas ne fait plus basculer d'un bloc la part des hommes au minimum contributif (5,5 à
  5,9 % de 2019 à 2024, pour 4,5 à 5,9) ; la part de tous les liquidants de 2023 ne passe
  que de 13,4 à 13,6 %, pour 18,8 % dans l'EACR. Abaissé d'un dixième, le reste des hommes
  la faisait passer à 15,7 % : c'est le niveau du bas qui manque.
reste: >-
  À l'étape 6 de l'action 136 : le niveau du bas, que le resserrement en carrière porte au
  moins à 1,10 Smic chez les hommes, contre la persistance de la DG Trésor ; les pensions
  des femmes, au-dessus de l'EIR, et des hommes, en dessous ; la bascule de la page, au
  propriétaire.
