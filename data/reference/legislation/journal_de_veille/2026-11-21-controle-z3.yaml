date: "2026-11-21"
session: "action 194 : le contrôle Z3 des propriétés du droit, branché à GitHub"
consulte: >-
  Aucune lecture nouvelle du JORF ni de LEGI : les textes des cas attendus sont
  ceux que les fiches citent déjà (R. 351-45, LEGIARTI000006749450 ; L. 161-17-2 et
  L. 161-17-3 dans la rédaction de la loi n° 2025-1403, LEGIARTI000053280889 et
  LEGIARTI000053280903 ; D. 351-1-1, LEGIARTI000023397567, et l'article 11 du décret
  n° 2010-1734). La circulaire Cnav n° 2011-16 du 7 février 2011, §§ 13 et 24, lue
  le même jour par l'API de la base de législation de la Cnav par la session qui a
  vérifié la carrière longue de juillet 2011.
trouve: >-
  La circulaire 2011-16 partage l'ancienne et la nouvelle carrière longue à la seule
  date d'effet (1er juin 2011 inclus, 1er juillet 2011), sans droit acquis à l'ancien
  âge : citée dans la fiche carriere_longue. Aucun résultat ne bouge. Détail :
  docs/feuille_de_route/194/2026-11-21-controle-z3.md.
reste: >-
  Le 160 que le moteur oppose aux nés avant 1900 du 28 août 1993 au 1er janvier
  2003, où R. 351-45 dit 150 : écart connu, sans effet réel, non corrigé.
