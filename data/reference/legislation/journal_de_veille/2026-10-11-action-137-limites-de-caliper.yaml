date: "2026-10-11"
session: "action 137 : les limites de CALIPER, lues sur le site de la DREES depuis le poste du propriétaire et confrontées à docs/limites/"
consulte: >-
  Aucune source de droit : la session ne touche à aucune règle du scénario 1. Sur le
  site de la DREES, que le cloud ne joint plus et que le poste du propriétaire joint :
  la page de l'outil CALIPER, le document de travail n° 111 (novembre 2011) et le
  Dossier solidarité et santé n° 37 (mars 2013), à sa nouvelle adresse ; les limites
  du dépôt (docs/limites/) et ses fiches de règles, pour la confrontation.
trouve: >-
  Aucun texte de droit. Les deux documents n'ont pas de liste de simplifications, mais
  une section sur les limites de l'outil et un encadré sur la qualité des données. Le
  dépôt lève presque toutes les limites de l'outil : réversion et minimum vieillesse,
  champ des régimes, écrêtement du minimum contributif, tranche C de l'Agirc, artisans
  et commerçants d'avant 1973, versement forfaitaire unique. Il en partageait deux sans
  les dire, désormais déclarées : un relevé n'est souvent complet qu'à la liquidation,
  et une règle s'y sert à sa date légale quand une caisse l'a mise en œuvre plus tard
  (le minimum contributif majoré de 2004).
reste: >-
  Une phrase du site pour qui dépose son relevé, à la session du site ; la validation de
  CALIPER sur les pensions réelles de l'EIR 2004, au CASD (chantier 138.14).
