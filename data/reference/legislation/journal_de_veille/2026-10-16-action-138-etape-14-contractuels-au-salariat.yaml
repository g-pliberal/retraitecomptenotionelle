session: "action 138, étape 14, cinquième partie : les retraités de l'Ircantec, rendus au salariat privé"
consulte: >-
  Aucun texte : la session n'écrit aucune règle du scénario 1, et ne touche
  qu'à la population de la mesure (`scripts/grille_large.py`), que la page ne
  lit pas. Données lues, déjà certifiées : la dépense de l'Ircantec
  (`macro/depenses_retraite_regimes.csv`) et ses retraités
  (`regimes/effectifs_retraites.csv`), la part des liquidants au minimum
  contributif de l'EACR (`regimes/minimum_contributif_liquidants.csv`), les
