date: "2026-09-26"
session: >-
  architecture, phase 5 : la liquidation en fonction pure, le journal,
  l'échéancier et le pilote
consulte: >-
  veille_droit.py, au début de la session et à la fin : les quatre mêmes
  fiches à relire, et la dernière veille du jour même. Les index LEGI et
  JORF, mis à jour au début et à la fin : aucun incrément paru depuis le
  26 septembre 2026 à 21 h 07 ; textes.py --inscrire : aucune rédaction
  nouvelle. Pour la fiche fin_de_la_suspension_2028, les rédactions de
  L. 161-17-2 et de L. 161-17-3 dans l'index LEGI.
trouve: >-
  Rien de nouveau au Journal officiel. L. 161-17-2 et L. 161-17-3 n'ont
  pas de rédaction postérieure à celles du 31 décembre 2025
  (LEGIARTI000053280889, LEGIARTI000053280903) : la suspension court
  toujours. La phase 5 ne touche aucune règle : le code de la liquidation
  change de module sans qu'un résultat bouge, et treize fiches disent
  désormais l'étape de la liquidation ou de l'échéancier qui les
  applique.
reste: >-
  Les quatre fiches à relire que veille_droit.py liste, et ce que les
  entrées précédentes laissaient : l'article 16 du règlement de la CAVP,
  les articles 9-7 et suivants du règlement des indépendants, les
  rédactions sans statut de la liste des textes.
