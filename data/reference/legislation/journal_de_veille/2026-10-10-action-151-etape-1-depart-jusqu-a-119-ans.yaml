date: "2026-10-10"
session: "action 151, étape 1 : le départ jusqu'à 119 ans"
consulte: >-
  Aucune source de droit : la session ne touche ni au scénario 1 ni à une règle.
  L'histoire du dépôt, où la borne de 75 ans figure dès le premier commit, le
  8 septembre 2026 ; les deux moteurs, à des départs de 74 à 119 ans ; et, pour
  répondre au propriétaire, la fiche 15 du panorama 2025 de la DREES sur l'âge de
  départ, qui ne publie aucun âge maximal observé.
trouve: >-
  Aucun texte de droit. La borne ne protégeait rien que le moteur n'assure : il
  calcule jusqu'à l'âge terminal des tables, 120 ans exclu. À ces âges, deux règles
  du scénario 1 donnent des pensions qui baissent quand on part plus tard — la CARMF
  complémentaire avant 2017, le régime général en 2003 et 2004 —, et la limite
  d'âge des fonctionnaires n'est pas appliquée.
reste: >-
  L'étape 2 de l'action 151 : la limite d'âge des fonctionnaires et ses
  exceptions, texte en main ; les deux règles ci-dessus, à relire au texte.
