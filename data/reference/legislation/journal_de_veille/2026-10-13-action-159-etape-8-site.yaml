date: "2026-10-13"
session: "action 159, étape 8 : le site, contre la fiche de paie, l'éditorial et les budgets ministériels du jaune pensions 2027"
consulte: >-
  Aucune source de droit : la session ne touche à aucune règle du scénario 1. Le jaune
  pensions annexé au PLF 2027 (34465.pdf, tiré de la branche jaune-2027 dans le
  répertoire de travail de la session, empreinte vérifiée) : l'éditorial (pages 7 à
  15), en texte et en image, ses figures A, A bis, B et B bis ; la figure 3B (page 24),
  en image et en tracés vectoriels. Le site de la DREES, pour relire le Dossier n° 103
  et le panorama de 2025 que l'éditorial cite : réponse vide depuis le cloud.
trouve: >-
  La fiche de paie du modèle refait au point près les figures A et A bis : 40 % de la
  rémunération totale d'un civil pour la retraite, 35 de l'État, 5 de l'agent, 53 de
  net ; 50 % d'un militaire, 46, 4, 44. Deux écarts du document : la figure du civil
  est au taux de 2025, 78,28 %, quand le texte d'à côté cite celui de 2026, 82,28 %,
  qui donnerait 41 % ; et sa « rémunération nette totale » garde la CSG et la CRDS,
  5,5 points de la rémunération totale. La fiche du site nommait « traitement indiciaire
  brut » la rémunération entière et disait le traitement « tenu fixe » sous un tableau
  qui le montrait monter : corrigé. La figure 3B se lit sur ses tracés, dix-sept
  ministères au dixième de point, et retrouve les chiffres que le texte imprime
  (Éducation nationale 28 et 4 %, Intérieur 27 et 3 %, Justice 18 %).
reste: >-
  La figure 3B en entier sur la page Coût, par un fichier de données certifié, à la
  session des données d'abord ; l'expérience de la DREES refaite par le modèle sur ses
  cas types, si le propriétaire la veut ; les deux publications de la DREES, à relire
  à la source quand son site répondra. Les étapes 3 à 7 et 9 de l'action 159, en
  parallèle.
