date: "2026-11-03"
session: "action 178, étape 6 : les séries des classeurs du panorama de la DREES, édition 2026, portées à data/reference/"
consulte: >-
  Aucune règle du scénario 1 n'est touchée : l'étape lit des statistiques. Les
  classeurs des fiches 1, 3, 16, 17, 22, 23, 25 et 27 de l'archive de la
  release documents-apportes (drees_panorama_retraites_2026_classeurs), chacun
  à son empreinte, et le PDF du panorama (miroir de l'UNSA) par pdftotext
  -layout, pour les valeurs qu'il imprime ; en regard, le cadrage de l'EACR
  (effectifs_retraites.csv) et ce que l'étape 2 avait certifié.
trouve: >-
  Les séries des graphiques et des tableaux que le suivi destinait à l'étape 6
  sont certifiées dans sept fichiers neufs et dans cumul_emploi_retraite.csv :
  l'invalidité par âge, le minimum vieillesse par régime et depuis 1960, le
  profil des cumulants, le rapport entre emploi et retraités, la polypension,
  l'âge et le taux de liquidation par génération, la réversion. Les classeurs
  se contredisent par endroits : un en-tête en milliers sur des personnes
  (fiche 25), 21,4 % et 22,7 % pour la même part (fiche 23), des générations
  impaires interpolées (fiche 17) ; chaque écart est déclaré dans l'en-tête du
  fichier qui le porte.
reste: >-
  La clôture (étape 7) : les feuilles que le suivi ne destinait à rien, les
  départs après 67 ans et les nouveaux allocataires du minimum vieillesse, que
  seul le PDF chiffre ; puis l'étape 3, l'EIC de 2021, dans une session neuve.
  Les confrontations que ces séries permettent reviennent au modèle.
