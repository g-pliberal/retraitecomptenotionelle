date: "2026-09-24"
session: "action 89, le lot de la fonction publique de l'État (SRE, ENSAP, service-public)"
consulte: >-
  Treize pages du Service des retraites de l'État (formule, décote,
  surcote, durée d'assurance, majoration pour enfants, minimum garanti,
  bonifications, services valables, militaires, retraite anticipée, cumul,
  cotisations, retraite progressive), les fiches F21142 (vérifiée le
  1er septembre 2026) et F13736 de service-public.gouv.fr, la FAQ de la
  DGAFP de 2025, les calculettes du rachat d'études et PECARI de l'ENSAP et
  celle de surcotisation de l'académie d'Aix-Marseille, lues dans leur
  script. Dans les index LEGI et JORF : L. 14, L. 14 bis, L. 17 (trois
  versions), L. 18 et L. 25 bis du code des pensions, D. 16-2 dans la
  version du décret n° 2026-700, les articles 45 et 53 de la loi
  n° 2010-1330, le décret n° 2010-1744, le XXIV de l'article 10 de la loi
  n° 2023-270, l'article 13 du décret n° 2023-435 dans la version du décret
  n° 2026-344, le décret n° 2004-678 et le décret n° 2025-1340.
trouve: >-
  Trois règles que le scénario 1 n'appliquait pas, corrigées dans les deux
  moteurs : le minimum garanti d'une pension de moins de quinze ans est la
  référence rapportée à la durée requise depuis 2011 (L. 17, d), le
  quinzième de 57,5 % ne valant plus que pour l'invalidité ; l'âge qui
  ouvre le minimum sans la durée est minoré de neuf à un trimestre pour un
  âge d'ouverture atteint de 2011 à 2015 ; l'emploi classé surcote à l'âge
  anticipé majoré de cinq ans ou minoré majoré de dix, soixante-deux ans
  avant les marches de 2023. Deux exemples du SRE entrent aux témoins
  officiels. Trois exemples du SRE sont faux, la page de la retraite
  anticipée omet la limite de deux trimestres de D. 16-2, et la
  calculette du rachat de l'ENSAP applique un barème abrogé au 1er janvier
  2026.
reste: >-
  Le temps partiel, que la saisie ne porte pas ; le plafond de L. 18, V ;
  l'écrêtement du minimum garanti, dont le décret n'a pas été trouvé ; la
  décote « carrière longue » des militaires ; la confrontation du barème du
  rachat d'études à la neutralité du compte notionnel.
