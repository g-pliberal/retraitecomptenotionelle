trouve: >-
  La lecture de E est conforme à la source : citations mot pour mot, dates, bornes, calculs, carte
  (86 fiches et 505 manques avant, 85 et 498 après). Les cinq erreurs du modèle sont réelles dans
  les deux moteurs. L'âge du IV de L. 643-3, que la fiche dit non lu, est à l'index : D. 643-14
