date: "2026-11-03"
session: "action 145 : close, aux archives avec le dossier de ses notes ; l'action 185 ouverte pour ses écarts"
consulte: >-
  Aucun texte : la session ne touche pas au droit. La section de l'action 145 dans la feuille de
  route et ses neuf notes ; l'historique des fiches de règles, des fichiers de régime et des
  commits depuis le 13 octobre 2026, pour savoir quels écarts restent ouverts.
trouve: >-
  Le propriétaire a décidé, le 3 novembre 2026, de clore l'action 145 et d'ouvrir une action pour
  les écarts de ses notes d'octobre. La section passe telle quelle à la fin de l'archive de la
  feuille de route, à l'état « fait », avec un paragraphe de clôture ; ses notes, sous
  docs/archives/feuille_de_route/145/. L'action 185 inscrit vingt-quatre écarts, chacun avec son
  renvoi à sa note et à sa ligne. Depuis les notes, trois ont été corrigés en partie, et seule
  leur part restante est inscrite : les annuités du CESE (action 121, le 14 octobre), le
  rendement de la CAFAT et le taux de Wallis-et-Futuna (action 145, le 2 novembre). Aucune
  simulation ne bouge, aucun témoin non plus.
reste: >-
  Les vingt-quatre écarts de l'action 185, dont la part CRFM des agents mahorais intégrés, qui
  attend l'arrêté préfectoral 77-50/RG du 16 mars 1977 ; et les sources injoignables du
  conteneur : LexPol, le Journal officiel de Wallis-et-Futuna, l'archive du web, Gallica.
