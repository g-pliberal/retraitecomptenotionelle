date: "2026-10-01"
session: >-
  la comparaison du dépôt à tous les modèles du registre, à la demande du propriétaire :
  « Je souhaite que mon modèle soit meilleur en tous points aux modèles existants »
  (action 138, étape 1)
consulte: >-
  Dans l'index LEGI du dépôt, mis à jour jusqu'à l'incrément du 1er octobre 2026 :
  R. 351-9 en vigueur depuis le 1er janvier 2026 (LEGIARTI000053335598) ; L. 161-17-2
  et L. 161-17-3, dont aucune version ne suit celles du 31 décembre 2025
  (LEGIARTI000053280889, LEGIARTI000053280903). La loi italienne n° 335 du 8 août
  1995, art. 1er, al. 9 ; la loi polonaise sur les pensions du FUS, texte unifié de
  2025, art. 25 ; la note technique du décret italien du 20 novembre 2024 ; le rapport
  annuel du système suédois pour 2025 (Pensionssystemets årsredovisning). Par les
  sept recherches de l'action 138 : le code de Destinie 2, de TRAJECTOiRE,
  d'OpenFisca-France, d'Ines, des modèles de l'Urssaf et de Catala, les documents du
  COR, de la Cnav, de la DREES, de l'ETK, de NAV, de l'OCDE et de la Commission
  européenne, chacun au registre des autres modèles avec sa lecture.
trouve: >-
  R. 351-9 compte les trimestres de 1949 à 1971 au montant trimestriel de
  l'allocation aux vieux travailleurs salariés au 1er janvier de l'année, celui des
  villes de plus de 5 000 habitants jusqu'en 1962 : le dépôt, qui valide quatre
  trimestres à toute année travaillée avant 1972, a tort (action 138, étape 6).
  L. 161-17-2 et L. 161-17-3 n'ont pas changé. Le dépôt de réformes de LexImpact suit
  deux projets pour 2027, que la session n'a pas lus au texte : le projet de loi de
  finances plafonnerait l'abattement des pensions à 3 000 € (art. 3), celui de
  financement de la sécurité sociale différencierait leur revalorisation (art. 35).
reste: >-
  Les montants de l'AVTS de 1949 à 1971, à lire au Journal officiel ; les étapes 2 à 12
  de l'action 138 ; les deux projets de loi pour 2027, à lire au texte et à suivre
  jusqu'au vote, le second touchant la revalorisation du scénario 1.
