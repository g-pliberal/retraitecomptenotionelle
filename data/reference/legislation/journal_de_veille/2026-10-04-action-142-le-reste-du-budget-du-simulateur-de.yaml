date: "2026-10-04"
session: "action 142 : le reste du budget du simulateur de handicap"
consulte: >-
  Quatorze saisies de plus au simulateur du départ anticipé des assurés handicapés
  (vingt-quatre en tout) ; sur LEGI, l'article 25 du décret n° 2003-1306, dans sa
  rédaction du 2 janvier 2025 (LEGIARTI000050941689).
trouve: >-
  Pour les fonctionnaires de la CNRACL, l'article 25, II, n'exige que la durée cotisée,
  le barème de D. 351-1-5. Vingt-trois saisies le suivent ; pour un fonctionnaire né en
  1961 parti à 59 ans, le simulateur demande encore 88 trimestres validés, l'ancienne
  double condition.
reste: >-
  Le départ anticipé des assurés handicapés au modèle, au barème que régime général
  et CNRACL partagent ; les générations de 1962 à 1965 des fonctionnaires, que le
  simulateur n'a pas dites.
