date: "2026-09-23"
session: "action 89, lot de la CRPN : les navigants de l'aviation civile"
consulte: >-
  CRPN : pages « comprendre ma retraite », « acquérir des droits »,
  « calculer les cotisations », publications et notices, dont les
  conditions de liquidation de 2012 à 2021 et depuis le 1er novembre
  2023, le calcul des cotisations 2026, les nouvelles prestations de mars
  2026. Index LEGI : R. 6527-17 à R. 6527-28 du code des transports.
  Légifrance, au navigateur : L. 6521-4.
trouve: >-
  L'âge qui annule la décote est de soixante ans, et non soixante-cinq :
  la fiche prenait la limite des prolongations pour la limite d'âge. La
  décote se compte sur la seule durée depuis 2022. Le taux d'appel est de
  111 % en 2026, contre 105 % dans la fiche.
reste: >-
  Le dispositif transitoire des navigants nés avant 1971, les conditions
  montantes de 2012 à 2021, les taux d'appel de 2016 à 2025.
