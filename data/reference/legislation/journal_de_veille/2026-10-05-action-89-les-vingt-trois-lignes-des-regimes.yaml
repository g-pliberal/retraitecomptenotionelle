date: "2026-10-05"
session: "action 89 : les vingt-trois lignes des régimes spéciaux au vivier"
consulte: >-
  L'index LEGI du 27 septembre 2026 (incréments refusés) : décret n° 90-1215
  (CRPCEN), articles 84, 89, 92, 96 et 113, toutes rédactions ; décret n° 91-613,
  article 4 ; décret n° 2008-639 (SNCF), articles 7, 9 et 13 ; décret n° 2008-637
  (RATP), articles 6, 20, 23 et 24 ; annexe 3 au statut national des IEG, rédactions
  de 1946, 2008, 2009, 2011, 2023 et 2025, articles 12 à 14, 16, 19, 21-1 et 22 à
  25 ; décret n° 55-753, article 37 ; L. 732-38 et D. 732-38 du code rural. L'index
  JORF : décrets n° 2008-47 et 2025-1409. Hors JORF : les pages de la CNIEG, de la
  CRPCEN, de la CPRPF et de la MSA ; le COR (séances du 25 mai 2016 et du 19 octobre
  2023, droits familiaux) ; le rapport du Sénat n° 732 (2009-2010) ; le CLEISS.
trouve: >-
  La CRPCEN liquide les dix meilleures années écrêtées de trois à sept plafonds, non
  les six derniers mois ; elle a une réversion et des trimestres pour enfants, que
  le modèle ne servait pas. La SNCF, la RATP, les IEG et la CRPCEN ont chacune leurs
  trimestres pour enfants, que le modèle prenait à la fonction publique ; les
  trimestres de durée seule proratisaient la pension d'un régime spécial. Les IEG
  ont une réversion et ouvrent la retraite progressive depuis 2023. Les exploitants
  agricoles ont la majoration d'un dixième pour trois enfants depuis 1974. Tous
  portés, avec huit témoins.
reste: >-
  Le minimum de pension des IEG (fiche manquante) et la CAMIEG ; la surcote et les
  âges des sédentaires des IEG ; la surcote parentale de la CRPCEN et de la SNCF ; la
  part employeur de la CRPCEN ; les trimestres pour enfants de la Banque de France,
  des mines et des marins.
