date: "2026-10-01"
session: >-
  les simulateurs d'info-retraite saisis à la main par le propriétaire, un cas par
  tour, selon le § 3.5 de l'architecture : « Tu vas me donner un cas intéressant pour
  faire avancer notre projet avec le simulateur converne et je te dirais la réponse »
consulte: >-
  Les simulateurs « Départ anticipé pour carrière longue » et « Droit à la réversion »
  de l'Union Retraite (les-simulateurs.info-retraite.fr), neuf saisies, chaque
  prédiction du modèle écrite avant la réponse. Le plafond de ressources de la
  réversion en 2026, 2 080 fois le SMIC horaire du 1er janvier (12,02 €, série
  certifiée), soit 25 001,60 € par an ; une recherche l'attribue à la circulaire Cnav
  2025-29, que la session n'a pas relue. Le journal datant du jour, aucun texte paru
  depuis n'était à consulter.
trouve: >-
  Les quatre portes de la carrière longue, les durées de 1965 à 1969 et la coupure de
  1965 en trois concordent ; « 60 ans et 8 mois » pour les nés en décembre 1965 a
  levé deux arrondis du moteur, corrigés (la date d'effet de la table à trois
  décimales, l'âge comparé au mois). La réversion concorde : 54 % au régime général,
  60 % à l'Agirc-Arrco sans condition de ressources, 55 ans, quatre ans de mariage et
  50 % dans la fonction publique. Deux enfants à charge lèvent l'âge de l'Agirc-Arrco,
  ce que le modèle ne porte pas (écart connu). Le simulateur de réversion n'écrête
  pas et garde le seuil de 2024 (6 058 € par trimestre) ; celui de la carrière longue
  omet les quatre trimestres des nés d'octobre et de novembre 1965.
reste: >-
  Le texte de l'accord Agirc-Arrco sur les enfants à charge, et la durée de cette
  réversion avant 55 ans ; une fiche de réversion pour la RAFP (50 % au simulateur) ;
  le remariage et l'Ircantec, à saisir une autre fois.
