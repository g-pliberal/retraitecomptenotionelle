date: "2026-11-07"
session: "action 186, chantier 3 : la réversion étudiée aux sources pour le programme, et le coût de chaque système face au droit actuel"
consulte: >-
  Aucune règle du scénario 1 n'est touchée. L'index LEGI de la DILA que publie
  le dépôt (à jour au 2 novembre 2026), interrogé à la date du 7 novembre 2026,
  pour la réversion quand l'assuré meurt avant sa retraite : L. 353-1, R. 353-6,
  D. 353-1 et D. 353-3 du code de la sécurité sociale ; L. 14, L. 38, L. 39 et
  L. 50 du code des pensions civiles et militaires ; le décret n° 2003-1306
  (CNRACL) ; les décrets n° 2008-637 (RATP) et n° 2008-639 (SNCF) ; L. 732-41
  et L. 732-62 du code rural. L'exposé de la Cnav « Retraite de l'assuré
  décédé » (modifié le 6 mars 2026), par son API. Pour les survivants déjà
  servis : les décisions du Conseil constitutionnel 2003-483 DC, 2010-108 QPC,
  2011-155 QPC, 2013-682 DC, 2014-698 DC, 2018-776 DC, 2019-795 DC et
  2023-849 DC ; sur HUDOC, Koufaki et Adedy, Da Conceição Mateus, Valkov,
  Béláné Nagy, Stefanetti, Beeler, Runkee et White, Valverde Digon et Manenc.
  Le COR (2019, simulations de mars 2025, rapport de novembre 2025), l'étude
  d'impact du projet de loi de 2020, le panorama 2026 de la DREES (miroir de
  l'UNSA), et les textes et caisses de Suède, d'Italie, d'Allemagne, de
  Suisse, de Pologne et des États-Unis.
trouve: >-
  Le droit en vigueur sert une réversion quand l'assuré meurt avant sa
  retraite, dans tous les régimes examinés, sur la pension qu'il « eût
  obtenue » au jour du décès : ses seuls droits acquis, sans décote, sans
  projection de carrière, sauf les points gratuits de la complémentaire des
  exploitants (L. 732-62), les « victimes du devoir » (L. 50) et la pension du
  veuf invalide (R. 342-1). C'est la règle que le scénario 1 sert depuis
  l'étape 4 de l'action 138 ; aucun écart nouveau avec les fiches n'est
  relevé, et les changements de 2026 qu'elles portent déjà (L. 38, loi de
  finances pour 2026, article 205 ; D. 353-1, décret n° 2025-1410) sont
  retrouvés. Hors du modèle, faute de fiche : la réversion de base des
  exploitants agricoles suit, depuis le 1er janvier 2026, celle du code de la
  sécurité sociale. Aucune erreur des fiches n'est déclarée. Le détail est
  dans la note docs/feuille_de_route/186/2026-11-07-reversion-etude-et-couts.md.
reste: >-
  Non trouvé : si la réversion de base de la CNAVPL écarte la réduction de
  L. 643-3 ; si le minimum garanti (L. 17 du code des pensions) s'applique à
  la pension « qu'il aurait pu obtenir » ; le texte et la date du passage de
  60 à 62 ans de l'âge de réversion à la CARMF ; le montant 2026 du minimum de
  réversion ; la loi suédoise de 1990 et le rapport Delevoye, non lus dans
  leur texte ; les régimes sans fiche (exploitants, CNAVPL et ses sections,
  RATP).
