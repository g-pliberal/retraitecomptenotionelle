date: "2026-11-06"
session: "action 130, relecture R-E13 : E12 (45453aa), la réserve de 2006 et la Cipav de surcote_par_age_seul en versions"
consulte: >-
  Les index de la DILA récupérés et mis à jour : JORF au 6 novembre 2026, LEGI au
  5 novembre. Au JORF : l'arrêté du 3 octobre 2006 (JORFARTI000002050100), relu en
  entier ; « 21 mars 1979 », et « architectes » avec « statuts » en 1979 ; « transitoires »
  avec « architectes » ou « cipav », de 2006 à 2009 ; tous les arrêtés de statuts de la
  section des architectes et de la Cipav de 1979 à 2026, sans borne de réponses, dont ceux
  du 7 février 1980, 5 mai 1981, 4 mai 1982, 17 juin 1985, 29 juillet 2003, 28 décembre
  2004, 18 mars 2005 et 26 mai 2005 ; « 3.15 » avec « statuts », de 2006 à 2026 ;
  l'arrêté du 16 décembre 2021 (JORFARTI000044554134, 17° à 19° ; article 2) et celui du
  20 mars 2023 (JORFARTI000047334800, 17° ; article 2) ; le décret n° 2026-418, article 20
  (JORFARTI000054153655) ; le décret n° 79-262 (JORFTEXT000000702512). Dans LEGI : décret
  n° 79-262, article 5 (LEGIARTI000006767479, LEGIARTI000006767480), articles 5-1
  (LEGIARTI000054168518) et 5-2 (LEGIARTI000054168515).
trouve: >-
  Le travail de E12 est conforme pour l'essentiel : citations, dates, bornes et montants
  refaits au centime, dans les deux moteurs et sous les deux jeux de présomptions. Quatre
  écarts mineurs : l'article 17 des statuts de 1979, que l'arrêté de 2006 garde en 2007,
  a été modifié par les arrêtés du 5 mai 1981, du 17 juin 1985 et du 29 juillet 2003
  (celui du 4 mai 1982, article non dit), qu'aucun fichier ne nomme ; compter les trente
  années d'affiliation depuis 1979 rend 0 € en 2007 sous la lecture A, et rien de dû pour
  une pension de 2008 ; la version de 2022 ne cite pas le 18° de l'arrêté de 2021 (article
  3.13) ; l'ASV manque à la piste de 2017 du bloc « Reprise ». Un candidat : le régime de
  1979 « se substitue » à ceux des décrets n° 56-572 et 56-1341, que le dépôt ignore.
reste: >-
  Les quatre écarts, à E13. Au Bulletin officiel ou au fac-similé : les arrêtés de 1981,
  1982, 1985 et 2003, avec les statuts de 1979 et de 2006 et leurs dispositions
  transitoires (question 22). Le candidat des régimes de 1956, à instruire.
