  rédactions du 21 décembre 1985 (LEGIARTI000006749434) au 1er août 2026
  (LEGIARTI000054589995). L'index JORF : le décret n° 2025-1409, article 2
  (JORFARTI000053227542), le décret n° 2026-699, articles 1er et 6
  (JORFARTI000054569111, JORFARTI000054569121).
trouve: >-
  2,5 % de 1983 à 2003 ; le II par génération pour les pensions prenant effet
  après 2003 ; de janvier à juillet 2026, aucun coefficient écrit pour ces
  pensions (II abrogé), 1,25 % pour la caisse (circulaire 2026-07) ; 1,25 % dès
  le 1er août 2026. Aucun résultat ne bouge ; une session indépendante d'accord
  sur 93 cas. Détail : docs/feuille_de_route/194/2026-11-21-decote-prouvee.md.
reste: >-
  Un cas de plusieurs régimes pour la durée tous régimes ; les textes d'avant
  1985 (ordonnance n° 82-270 et son décret), que l'index ne porte qu'en titre.
