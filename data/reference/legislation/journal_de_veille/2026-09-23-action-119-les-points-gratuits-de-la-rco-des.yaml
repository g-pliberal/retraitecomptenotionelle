date: "2026-09-23"
session: "action 119, les points gratuits de la RCO des chefs d'exploitation"
consulte: >-
  Dans l'index LEGI : L. 732-56 du code rural dans ses sept versions,
  D. 732-151, D. 732-154, D. 732-151-1 et D. 732-154-1 à -3. La page de
  la MSA sur la retraite des non-salariés agricoles, ses deux onglets sur
  la RCO (mise à jour du 17 août 2026).
trouve: >-
  Cent points par année de chef d'avant 2003, dans la limite de 37,5 ans
  moins les années de RCO, à dix-sept ans et demi comme chef et au taux
  plein : le modèle n'en servait aucun. Depuis le 1er septembre 2023, le
  taux plein est celui de la pension liquidée, par l'âge aussi ; la page
  de la MSA décrit encore la condition de durée d'avant.
reste: >-
  Les 66 points des conjoints, aides familiaux et collaborateurs ; les
  majorations de durée comptées dans les dix-sept ans et demi depuis
  2026 ; la révision, en 2023, des pensions prises avant.
