date: "2026-11-14"
session: "action 130, file des corrections décidées, ligne 8 : la valeur de service de l'ASV des médecins"
consulte: >-
  `python scripts/veille_droit.py` ; les index LEGI et JORF récupérés par `dila_index.py
  --recuperer`, LEGI mis à jour au 13 novembre 2026. Dans LEGI : décret n° 2011-1644,
  article 4, ses six rédactions, dont celle en vigueur (LEGIARTI000052567955) et celle de
  2012 (LEGIARTI000024853556) ; décret n° 72-968, article 2, de 1981 à 2026
  (LEGIARTI000006765943 à 947, LEGIARTI000054168410) ; D. 645-2 de 1993 à 1999 et
  D. 645-3 jusqu'au 2 décembre 2004. Au JORF : le décret n° 81-274
  (JORFTEXT000000685106), les articles 1er et 3 du décret n° 94-564
  (JORFARTI000001585515, JORFARTI000002368446).
trouve: >-
  Le texte tranche : la valeur de service du point est fixée en francs puis en euros
  courants, sans indexation — « La valeur du point de retraite est fixée à 102 F » de mars
  1999 à 2011, puis, à l'article 4 du décret n° 2011-1644, 13 € du second semestre 2012 à
  2020, 11,31 € jusqu'en 2020 pour les points liquidés depuis 2017, 11,36 €, 11,48 €,
  11,71 € « pour les exercices 2023 et 2024 et 11,82 euros à compter de l'exercice 2025 »,
  sans rédaction plus récente. Le modèle portait aux prix une valeur ancrée à une autre
  année : corrigé dans les données (`asv_conventionnes.yaml`, `valeur_point_annee`), pour
  les pensions de 1999 à 2026, dans les deux moteurs. Aux cas posés : 13 676,54 € au lieu
  de 11 709,34 € en 2002, 13 661,11 € au lieu de 13 934,47 € en 2024, 13 863,87 € au lieu
  de 14 106,48 € en 2026. La fiche `asv_medecins_points` relue ce jour, l'erreur passée à
  son histoire, les écarts (c) à (g) de la relecture du 13 novembre repris.
reste: >-
  Le premier semestre de 2012 (15,55 € au texte, 13 € au modèle). Les pensions d'avant
  1999 : le tarif de la consultation, puis 100 F revalorisés comme le régime général,
  non portés. La valeur après la date d'effet, exercice par exercice. La valeur de 2027
  et d'après, projetée sur les prix : relire l'article 4 à chaque décret. Les quatre
  autres ASV, dont la valeur de service est menée de même aux prix, non relues. Les
  lignes 9 à 30 de la file (`docs/feuille_de_route/130/2026-11-13-corrections-decidees.md`).
