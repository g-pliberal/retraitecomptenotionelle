date: "2026-11-24"
session: "action 191, note de décision 0009 : les fiches des ministres des cultes d'Alsace-Moselle, remplies au texte"
consulte: >-
  Le recueil des actes administratifs de la préfecture du Bas-Rhin, numéro spécial
  « droit local » du 15 mai 2013 (décret n° 2013-395, article 1er,
  JORFARTI000027408505), lu sur le PDF de la préfecture : loi locale du 15 novembre
  1909 sur les ministres des cultes (articles 7 à 11 et 14) et celle du même jour sur
  les veuves et orphelins des fonctionnaires (articles 1er à 12), ordonnance du
  16 mars 1910 (articles 3 à 8), règlement du 19 mars 1910 (articles 7 et 8),
  ordonnance du 1er septembre 1911 (articles 5 et 6),
  loi du 20 mai 1911 (article 12), loi du 31 mars 1873 (articles 36, 39, 41, 43, 57,
  69). La version consolidée de Legirel, sur l'Internet Archive. L'index JORF et LEGI
  du dépôt, arrêté au 23 novembre 2026 : décret n° 2007-1341 (articles 2, 3, 4, 6, 7),
  décret n° 2007-1445 (article 1er),
  arrêté du 29 mai 2001 (JORFARTI000001451965), arrêté du 8 octobre 2007 et sa grille
  (JORFARTI000001859885), décret n° 66-807 (LEGIARTI000006457148 et
  LEGIARTI000006457149), code des pensions civiles, L. 39 (LEGIARTI000006362767 et
  LEGIARTI000006362768), décret n° 2023-519 ; les analyses seules des décrets de 1923
  à 1934, de 1955 (JORFTEXT000000676287) et de l'arrêté de 1978. Le code des pensions
  de 1951 (articles 56 et 60), la question écrite 06644 du Sénat.
trouve: >-
  La fiche de la pension corrigée au texte : la pension est un droit (« reçoivent »),
  ouverte après dix années de services à l'incapacité, présumée au-delà d'un âge
  (70 ans en 1909, 65 ans en 1978, 60 ans en 2001) ; le barème de la loi de 1873
  (20/60 à dix ans, 1/60 par année jusqu'à trente, 1/120 au-delà, 45/60 au plus) ; la
  suppression de « l'âge ou » à l'article 7 touche le traitement, non l'incapacité ;
  le décret de 2007 et l'arrêté de 2001 prennent effet le 14 septembre 2007 et le
  25 juin 2001, non le 13 et le 23. Deux fiches nées : le décompte des services
  (ordonnance de 1910) et la pension des veuves et orphelins des seuls ministres
  protestants et israélites. Exemple : un curé de quarante années parti en 2026
  reçoit 25 032,35 euros par an de l'État, que le modèle ne calcule pas. Détail :
  docs/feuille_de_route/191/2026-11-24-cultes-d-alsace-moselle-au-texte.md.
reste: >-
  Les décrets de 1923 à 1934 et de 1955, l'arrêté du 6 mars 1978 et le code des
  pensions de 1964 (L. 40 à L. 46), connus par leur analyse seule ; la pratique du
  bureau des cultes : le taux de la veuve (40 % ou 50 %), l'arrondi en euros, la
  revalorisation, le ministre parti avant dix années.
