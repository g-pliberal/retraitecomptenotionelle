date: "2026-10-19"
session: "action 138, étape 10, deuxième partie : les droits contrefactuels de la carrière saisie, au 31 août 2023 et sous la loi de 2023 sans la suspension"
consulte: >-
  `python scripts/veille_droit.py` (trois fiches à relire, dont fin_de_la_suspension_2028,
  rien de neuf) ; l'index LEGI du dépôt récupéré (à jour au 18 octobre 2026), puis
  `--mettre-a-jour` : aucun incrément. L. 161-17-2 : versions du 23 décembre 2011
  (LEGIARTI000025014605), du 1er septembre 2023 (LEGIARTI000047452768), du 28 février 2025
  (LEGIARTI000051289659) et du 31 décembre 2025 (LEGIARTI000053280889), aucune postérieure.
  D. 161-2-1-9 : versions du 31 décembre 2011 (LEGIARTI000025089933) et du 1er septembre 2023
  (LEGIARTI000047634502). L. 161-17-3 : versions du 22 janvier 2014 (LEGIARTI000028494794),
  du 1er septembre 2023 (LEGIARTI000047452764) et du 31 décembre 2025 (LEGIARTI000053280903),
  aucune postérieure.
trouve: >-
  Au 31 août 2023, l'âge légal est de 62 ans dès la génération 1955 (D. 161-2-1-9, 6°, version
  de 2011), la durée celle de la loi de 2014 (169 trimestres de 1964 à 1966, 172 dès 1973) ; la
  loi de 2023 sans la suspension fixe 63 ans pour 1964, 63 ans et 3 mois pour 1965, 64 ans dès
  1968 (D. 161-2-1-9, 10° à 14°, version de 2023), 171 trimestres pour 1964 et 172 dès 1965.
  Deux tables neuves, `age_ouverture_avant_reforme_2023.csv` et
  `age_ouverture_avant_suspension.csv`, niveau haute ; les durées des deux états existaient
  (`duree_requise_avant_reforme_2023.csv`, `duree_requise_avant_suspension.csv`). Le scénario 1
  en vigueur ne bouge pas : aucun des 888 témoins de simulation. Les fiches
  age_legal_par_generation et duree_requise_par_generation disent l'usage contrefactuel.
reste: >-
  Les deux tables d'âges à certifier par le recoupement de l'IPP (`RECOUPEMENTS_IPP`,
  `verifier_donnees.py`), comme les durées le sont. Ce que les droits contrefactuels ne
  changent pas, déclaré sur la page : les âges des catégories actives, des militaires et des
  régimes spéciaux, le minimum contributif relevé en septembre 2023, les coefficients de
  solidarité de l'Agirc-Arrco d'août 2023, la durée du XXIV de la loi de 2023 pour les
  fonctionnaires partis avant soixante ans, et les articles 103 et 104 de la loi du
  30 décembre 2025, que le droit au 31 août 2023 garde.
