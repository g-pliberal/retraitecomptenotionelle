date: "2026-10-12"
session: "action 136, étape 6 : les carrières pleines entrent selon leur génération, la onzième version de la population"
consulte: >-
  Aucune source de droit nouvelle : la session lit l'âge légal d'ouverture par génération
  du scénario 1 (age_ouverture_requis.csv), sans le modifier. Les séries certifiées au
  dépôt — les caractéristiques des retraités de l'EIR 2020, la durée d'assurance par
  génération que le COR en publie, ses quintiles de la pension en équivalent carrière
  complète, la distribution des pensions, l'EACR ; aucun téléchargement.
trouve: >-
  Aucun texte de droit. Les carrières de quarante ans et plus des retraités de 2020
  durent 44 années, les deux sexes, à un an près. Commencées 44 ans avant l'âge légal, à
  16 ans pour les générations parties à 60 ans, celles du salariat privé portent les
  hommes nés de 1938 à 1953 à 37,5 à 37,9 années validées (40,4 à 40,6 dans l'EIR), sans
  relever leur pension : elles partaient déjà au taux plein. Le passé refait gagne, 10,9 %
  au pire depuis 2000 au lieu de 12,7. L'écart des hommes tient aux deux quintiles du
  haut, où la population range 40 % de carrières de moins de quarante ans.
reste: >-
  À l'étape 6 de l'action 136 : le haut de l'échelle des hommes, la durée de la tranche de
  trente à quarante ans et la proratisation des carrières statutaires ; la pension des
  femmes, trop haute par année validée ; le minimum selon la génération ; la bascule de la
  page, au propriétaire.
