date: "2026-10-01"
session: >-
  les limites du cinquième domaine, les carrières hors de France, reprises à la demande
  du propriétaire : « Fait de ton mieux pour gérer ces limites »
consulte: >-
  Dans l'index LEGI du dépôt : L. 815-9 (LEGIARTI000006744880), R. 815-22 dans ses
  versions de 2007 à 2023 (LEGIARTI000047770487), R. 111-2 en vigueur depuis 2025
  (LEGIARTI000049451865), R. 173-6, R. 173-7 (LEGIARTI000023719554) et R. 173-8
  (LEGIARTI000023719547). Dans la base législative de la Cnav : la circulaire
  ministérielle DSS/3A/DACI/2008/219 du 3 juillet 2008, les circulaires Cnav n°
  2008/58, 2012/26, 2013/56, 2021/33, 2011/78 (Maroc), 2011/80 (Inde), 2007/79
  (Tunisie), 2017/21 (Uruguay), 2019/24 (Brésil), 2020/30 (Canada, son annexe 1),
  2014/2 et son annexe 2, et les exposés « Evaluation des ressources - Aspa » et «
  Condition de résidence - Aspa ». Le règlement 883/2004, son annexe VIII ; les
  bulletins officiels du Service des pensions n° 472, 473 et 482.
trouve: >-
  Le tableau de la circulaire n° 2012/26, qui « se substitue » à ceux de 2008 et 2010,
  tient pour équivalents au régime général, pour la réduction des années du salaire
  annuel moyen de la pension proratisée, les régimes de dix-huit États — la Hongrie pour
  ses seuls salariés, l'Italie pour son « nouveau système » et les pensions depuis le
  1er janvier 2011 — et la Croatie depuis le 1er juillet 2013 (n° 2013/56) ; la
  réduction cesse au 1er juillet 2022 sous la liquidation unique seulement (n°
  2021/33, point 4). R. 815-22 compte « tous les avantages d'invalidité et de
  vieillesse » ; R. 111-2 exige plus de neuf mois de séjour pour l'ASPA, et la caisse
  totalise les séjours de l'année, avec une tolérance de cent soixante jours ; R. 173-8
  révise la majoration du minimum quand les avantages varient, le plafond revalorisé
  comme les pensions. Les listes d'États tiers changent : celle du Maroc en 2011
  comptait la Roumanie et non l'Algérie, le Luxembourg ni le Québec ; celle de
  l'Uruguay en 2017 n'avait ni la Corée ni la Roumanie ; celle du Brésil en 2019 ni
  l'Autriche, la Bulgarie, l'Inde, la Tchéquie ni la Suisse ; l'annexe 1 de la
  circulaire n° 2020/30 date chaque lien du Canada, tous antérieurs à son accord. La
  France n'est pas à l'annexe VIII, partie 1, du règlement.
reste: >-
  La règle du minimum garanti d'une pension au prorata, chez le Service des retraites
  de l'État et à la CNRACL ; la circulaire n° 2010/30, qui modifiait le tableau de
  2008 ; l'annexe 5 de l'arrangement administratif franco-tunisien du 26 novembre 2004,
  qui listait les États tiers de la Tunisie ; la date où la liste indienne a été
  connue.
