date: "2026-11-06"
session: "action 175, étape 4 (H8) : les quatre autres thèmes de « Carrière » de la base de la Cnav — allocations avant retraite, périodes validées par présomption, rachat de retraite, validation gratuite d'activité en Algérie"
consulte: >-
  python scripts/veille_droit.py. La base de législation de la Cnav, par son API, le
  6 novembre 2026 de 11 h 36 à 11 h 53 UTC, par les fonctions de
  scripts/fetch/cnav_legislation.py, sans écrire le registre : les 17 exposés des quatre
  thèmes, à la version que le registre date ; les 3 fenêtres, la liste et les 102 références
  qu'ils lient (titres et jours du texte, par _reference) ; l'avis de mise à jour 312 ; la
  circulaire Cnav 2020/25 du 9 juillet 2020, § 1, au PDF de la base. L'index LEGI de la DILA,
  à jour au 5 novembre 2026, et JORF, au 6 : les 27 cibles des 35 liens Légifrance des
  exposés ; R. 351-12 (rédaction du 1er novembre 2026), 4°, b ; D. 173-14 ; L. 262-10 du code
  de l'action sociale et des familles ; l'article 41 de la loi n° 98-1194 (rédaction du
  25 décembre 2016) ; l'article 4 de la loi n° 2025-989 ; la loi n° 64-1330, la loi
  n° 85-1274 et le décret n° 65-742, leurs articles ; L. 815-8 et son histoire. Le code des
  deux moteurs, pour le chômage non indemnisé (carriere.py, carriere.js).
trouve: >-
  Le registre range les quatre thèmes : 15 exposés limite et 2 hors_modele (la demande et
  les justificatifs de la validation des périodes d'Algérie), 3 fenêtres hors_modele, 1
  liste limite, 52 références limite et 12 hors_modele, 33 dont les renvois s'étendent,
  l'avis 312 hors_modele. Deux limites neuves dans docs/limites/3-systeme-actuel.md,
  « allocations avant retraite » et « validation sur présomption », deux étendues, « Algérie »
  (loi n° 85-1274, article 4) et « régimes spéciaux et régime général » (le rachat de
  D. 173-14). Un candidat, non corrigé : R. 351-12, 4°, b, assimile le chômage involontaire
  constaté d'avant 1980, indemnisé ou non (circulaire Cnav 2020/25, § 1), quand les deux
  moteurs n'en valident rien s'il n'est pas indemnisé — 8 trimestres au lieu de 0 pour deux
  années de chômage non indemnisé en 1976 et 1977. Dans la base : l'ancre « Css art.
  L262-10 » mène au code de l'action sociale et des familles ; « art. L815-8 » à sa rédaction
  close le 1er janvier 2026 ; « Loi 2025/589 », ancre fautive de la loi n° 2025-989 ; la
  circulaire Unédic 97/18 du 7 novembre 1997 datée du 16 février 1966.
reste: >-
  L'étape 4 au thème « Avantages liés au décès de l'assuré » (27 exposés). Au modèle : le
  candidat du chômage non indemnisé d'avant 1980 ; la neutralisation de la loi n° 2023-270
  pour le Retrep (circulaire Cnav 2025/9, lettre ministérielle du 24 juin 2024), quand sa
  fiche sera modélisée. Les listes de l'Union, de l'Espace économique européen et des
  personnes relevant des règlements européens, avec leur thème. Absents de l'index :
  l'arrêté du 4 février 1955 (coefficients du rachat), les décrets n° 74-533 et n° 62-1049 ;
  le décret n° 2010-1729, dont l'index n'a que la notice.
