date: "2026-11-03"
session: "action 178, étape 4, la fiche 21 du panorama de la DREES : les fins de carrière confrontées à la grille, la suite complète réparée"
consulte: >-
  Aucune règle du scénario 1 n'est touchée : la session confronte, sans rien
  corriger. Le tableau 1 de la fiche 21 du panorama, la situation des
  liquidants l'année qui précède leur liquidation (EIC de 2021), tel que
  `fins_de_carriere.csv` le certifie ; côté dépôt, les interruptions des cas
  types de la grille de la page Coût et ses nouveaux retraités de 2024, à
  leurs poids (`controle_eacr.controle`).
trouve: >-
  L'année qui précède leur liquidation, 88,7 % des nouveaux retraités de la
  grille sont en emploi, quand 70,9 % des liquidants de la génération 1954 le
  sont ; aucun cas type ne finit au chômage, quand 10,4 % d'entre eux y
  sont. L'écart tient aux cas types de la grille, non au droit.
reste: >-
  Les carrières inactives de la population de l'étape 14 de l'action 138,
  à confronter quand elle remplacera la grille ; la situation à 59 ans par
  génération et les trajectoires de la génération 1954 ; l'encadré 2 de la
  fiche, pour la clôture de l'action.
