date: "2026-11-06"
session: "action 130, file R-E9 : relecture de E8 (la majoration pour enfants des sections, et les écarts de R-E8 repris, 40d3fbc)"
consulte: >-
  Les index JORF (au 6 novembre 2026, incrément 20261106-002608) et LEGI (au 5 novembre,
  20261105-214938) récupérés et mis à jour. Dans LEGI : les sept rédactions de l'article 2 du
  décret n° 79-262, son article 5-2 (LEGIARTI000054168515), l'article 6 du décret n° 99-913,
  L. 643-1-1. Au JORF, sans borne : les 138 documents au titre « agents généraux
  d'assurance » (l'arrêté du 23 juin 2011 et son annexe, les modifications de 1972 à 2026,
  dont celles de 2001, 2003 et 2007 du régime complémentaire, le règlement du 10 juillet
  2026) ; les textes au titre de la CAVEC (arrêtés de 2008, 2012, 2018, du 4 juillet 2025,
  règlement du 10 juillet 2026) ; le décret n° 2026-418 (articles 20 et 30) ; le décret n°
  2026-239 et les textes qui le citent ; l'arrêté du plafond pour 2026 ; l'article 2 de
  l'arrêté du 7 janvier 2025 (CARMF).
trouve: >-
  E8 conforme pour l'essentiel : citations exactes, montants justes au centime, les deux
  moteurs le rendent sous les deux jeux, la carte à 74 fiches et 425 manques. L'erreur de la
  CAVAMAC confirmée : ses statuts de 2011, en vigueur le 1er juillet 2011, abrogent ceux de
  1967 et majorent de 10 % ; le modèle ne majore qu'en 2012 (1 332,33 € au 1er juillet 2011,
  1 344,23 € au 1er octobre). Quatre écarts faibles : trois arrêtés de 2001, 2003 et 2007 du
  régime complémentaire de la CAVAMAC absents de l'inventaire (sans effet) ; l'article 8 du
  règlement de la CAVAMAC de 2026 étend les 5 % à l'enfant qui ouvre droit à l'AAH ; la
  réversion de la CAVEC, déjà non portée, n'est pas un candidat à part ; un test annoncé « au
  texte » tient deux valeurs du modèle.
reste: >-
  À une file E-bis : les quatre écarts faibles (note `130/2026-11-06-relecture-r-e9.md`). À
  la correction de la CAVAMAC : l'erreur de 2011, et le cas du 1er octobre 2011.
