date: "2026-11-05"
session: "Retouches 6, vague 9, action 158 : les deux écarts mineurs de la relecture R-B3 (le n° 96-101 « paraît récrire » le n° 87-1104 ; le directeur de recherche de 2e classe en 2018)"
consulte: >-
  python scripts/veille_droit.py ; docs/veille_droit.md. L'index JORF du dépôt (incrément
  20261103-002311) : le décret n° 96-101 du 6 février 1996 (JORFTEXT000000191345 et ses sept
  articles, relus un à un pour le numéro « 87-1104 ») ; n° 2017-171, art. 36
  (JORFARTI000034026745) ; n° 2018-917, art. 1er, II (JORFARTI000037532992).
trouve: >-
  Le n° 87-1104 n'est cité que par le visa du texte du n° 96-101 (« Vu le décret no 87-1104 du
  30 décembre 1987 portant échelonnement indiciaire du cadre d'emplois des secrétaires de
  mairie », sans « modifié ») ; aucun des sept articles ne le nomme : que le n° 96-101 récrive
  l'art. 1er du n° 87-1104 est une déduction, écrite désormais « paraît récrire » (fiche,
  bloc « Reprise »). Les trois entrées du 5 novembre qui disent « qui récrit » (relecture R-B2,
  relecture R-B3, B-ter) sont des récits : elles se lisent avec celle-ci. Directeur de
  recherche de 2e classe : en 2018, le n° 2017-171 donnait (colonne « A compter du 1er janvier
  2018 ») 813, 862, 912, 969 et 1027 aux cinq premiers échelons, que le II du n° 2018-917
  remplace, du 1er septembre 2017 au 31 décembre 2018, par 807, 857, 906, 963 et 1021, de 5 à
  6 points plus bas ; de même le 1er échelon de la 1re classe, 1027 puis 1021. Déclaré à la
  fiche. Aucune règle du scénario 1 ne change, aucune donnée non plus.
reste: >-
  Lire au JO n° 33 du 8 février 1996 (p. 2070 à 2077) l'article du n° 96-101 qui paraît récrire
  l'art. 1er du n° 87-1104, son art. 37 et son entrée en vigueur (question au propriétaire).
