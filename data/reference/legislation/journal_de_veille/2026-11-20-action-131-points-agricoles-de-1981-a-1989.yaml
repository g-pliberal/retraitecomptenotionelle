date: "2026-11-20"
session: "action 131 : les points agricoles de 1981 à 1989, au barème du revenu cadastral"
consulte: >-
  Par l'index LEGI : décret n° 80-808, article 8 (LEGIARTI000006769209) et
  annexe (LEGIARTI000006769235) ; R. 732-69 du code rural
  (LEGIARTI000006597478, LEGIARTI000035918355, LEGIARTI000053337682) ;
  R. 732-70 (LEGIARTI000006597479) ; décret n° 92-793, article 20
  (LEGIARTI000006776481).
trouve: >-
  Le barème de 1981 à 1989, 15, 30, 45 ou 60 points selon le revenu
  cadastral, n'était pas appliqué : ces années étaient au rendement de leurs
  cotisations. Branché pour le chef d'exploitation, le revenu cadastral
  déduit du revenu à 5,54 F pour 1 F, par convention du propriétaire. Fiche
  neuve points_agricoles_au_revenu_cadastral, que le moteur lit.
  Détail : docs/feuille_de_route/131/2026-11-20-points-agricoles-de-1981-a-1989.md.
reste: >-
  Les décrets d'avant 1981 (n° 65-346, 67-570, 68-571, 74-443, 75-97), au
  fac-similé du Journal officiel. La pratique de la caisse sur des seuils
  qu'aucun texte lu ne relève de 1981 à 1989, et un exemple chiffré. Le
  champ de saisie des points du relevé.
