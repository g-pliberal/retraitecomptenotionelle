date: "2026-10-12"
session: "action 136, étape 6 : le niveau du bas de la population, contre la DG Trésor et les minima de l'EIR"
consulte: >-
  Aucune source de droit : la session ne touche à aucune règle du scénario 1. Les séries
  certifiées au dépôt — la persistance au voisinage du Smic de la DG Trésor (document de
  travail n° 2018/3), les centiles du salaire, tous et par sexe, le profil par âge, les
  quintiles de la pension en équivalent carrière complète de l'EIR 2020 et la part au
  minimum de pension de chacun ; aucun téléchargement.
trouve: >-
  Aucun texte de droit. Six ans plus tard, les salariés payés au voisinage du Smic gagnent,
  au milieu, 1,20 Smic, 1,15 à 35-49 ans : ce que le resserrement en carrière prédit
  (1,20 et 1,14) ; le niveau du bas reste. La population met ses minima de pension au
  premier quintile de la pension en équivalent carrière complète ; l'EIR, au premier et
  au deuxième, où 59,9 % des femmes sont au minimum, 12,5 % dans la population.
reste: >-
  À l'étape 6 de l'action 136 : le rang selon la durée, corrigé du minimum — les retraités
  au minimum de chaque quintile rangés au bas de l'échelle ; les pensions des femmes,
  au-dessus de l'EIR, et des hommes, en dessous ; la bascule de la page, au propriétaire.
