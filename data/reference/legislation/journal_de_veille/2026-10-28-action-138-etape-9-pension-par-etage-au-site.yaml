date: "2026-10-28"
session: >-
  action 138, étape 9, au site : la pension du départ par étage, en part du dernier
  revenu, et le revenu de dix ans avant le départ à dix ans après, dans le dépliant
  « Votre revenu, avant et après le départ » de la page des résultats
  (`pensionParEtage`, `revenusAutourDuDepart`)
consulte: >-
  Aucun texte neuf : l'étape ne touche à aucune règle et montre ce que le portage
  calcule depuis le 18 octobre (note `2026-10-18-etape-9-pension-par-etage.md`).
trouve: >-
  Rien de neuf au droit. Les étages ne comptent ni le minimum vieillesse ni la
  garantie vieillesse, que l'impôt finance, quand la carte du système 4 compte la
  garantie : la page dit l'écart sous le tableau.
reste: >-
  Au propriétaire, inchangés : la question au secrétariat général du COR sur la
  révision de 2026, l'impôt dans les cartes de résultats (note
  `2026-10-28-etape-9-pension-par-etage-au-site.md`).
