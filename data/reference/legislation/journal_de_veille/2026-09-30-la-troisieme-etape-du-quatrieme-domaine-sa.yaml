date: "2026-09-30"
session: >-
  la troisième étape du quatrième domaine, sa première partie : le taux plein de
  l'inapte et de l'ex-invalide, et la pension de vieillesse qui remplace d'office la
  pension d'invalidité, dans les deux moteurs
consulte: >-
  L'article 16 de l'arrêté du 30 décembre 1970 (Ircantec), dans ses douze rédactions de
  l'index LEGI du dépôt, de 1971 à 2023 ; l'article 84, 3, de l'accord Agirc-Arrco du
  17 novembre 2017, déjà lu le 27 septembre ; les fiches du domaine, lues à la première
  étape.
trouve: >-
  L'Ircantec ne coefficiente pas l'inapte dès 1971 : « ce coefficient de réduction
  n'est pas applicable : 1° Dans le cas d'une inaptitude au travail reconnue entre
  soixante et soixante-cinq ans par la sécurité sociale », puis, depuis 2011, à qui
  liquide au taux plein du régime général en application du 2° de L. 351-8.
  L'Agirc-Arrco sert sans coefficient qui a la pension du régime général « à taux
  plein », l'inapte compris.
reste: >-
  Les règlements de l'Agirc et de l'Arrco d'avant 1983, et ceux des complémentaires
  des indépendants (RCI), pour l'inapte ; l'âge de l'ASPA de l'inapte et le plancher
  de l'allocation aux vieux travailleurs salariés, et la retraite pour invalidité des
  fonctionnaires, à porter dans la suite de l'étape.
