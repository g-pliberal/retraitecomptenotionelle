date: "2026-10-04"
session: >-
  le musée des horreurs de la retraite, demandé par le propriétaire et seulement
  documenté : l'action 146 qui en naît, à faire, et son catalogue
consulte: >-
  Aucun texte de droit hors du dépôt : les fiches des régimes et des règles,
  l'inventaire des avantages non contributifs, la frontière contributive, le calendrier
  des réformes, les exemples officiels, les limites et la feuille de route, lus au
  commit 714ad0c.
trouve: >-
  Cinquante-six pièces en sept salles, chacune relue dans son fichier, au catalogue
  `docs/musee_des_horreurs.md`. Deux s'appuient sur une source faible : les règlements
  des assemblées, hors Journal officiel, et les âges de réversion de l'Agirc avant
  1990, lus sur le site de la fédération.
reste: >-
