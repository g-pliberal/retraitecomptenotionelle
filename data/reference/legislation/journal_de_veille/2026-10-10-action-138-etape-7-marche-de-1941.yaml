date: "2026-10-10"
session: "action 138, étape 7, deuxième partie : la marche de la génération 1941, les quotients observés calculés par génération"
consulte: >-
  Aucune source de droit : la session ne touche ni au scénario 1 ni à une règle.
  Eurostat, lu le jour même : la table du moment (demo_mlifetable), les décès par
  âge révolu (demo_magec) et par année de naissance (demo_mager), la population
  au 1er janvier (demo_pjan), en métropole et en France entière. L'INSEE,
  « Mortalité en 2019 », tableaux de séries longues, tableau 69 : les quotients
  par âge atteint de 1962 (métropole) ou 1994 (France entière) à 2019. L'INED,
  les tables de Vallin et Meslé, pour leur recouvrement de 1986 à 1997.
trouve: >-
  Aucun texte de droit. La marche de la génération 1941 est dans la table
  d'Eurostat, qui rapporte les décès d'un carré de Lexis à la moyenne de deux
  populations au 1er janvier, en supposant que chaque génération y passe une
  demi-année : les générations 1940 et 1941, nées l'une plutôt en début d'année,
  l'autre plutôt en fin, le démentent, comme celles de 1915, 1916, 1919 et 1920.
  Calculés par génération, comme l'INSEE, dont ils retrouvent les quotients
  publiés, les quotients de 1986 à 2024 n'en font plus : l'espérance de vie à
  60 ans de la génération 1941 rejoint celle de l'INSEE à 0,06 an près. Aucune
  pension du scénario 1 ne bouge.
reste: >-
  Le reste de l'étape 7 : les variantes d'espérance de vie, la fécondité et les
  migrations, la mortalité différentielle des cas types de la page Coût, les
  départs qui suivent l'espérance de vie, la queue observée de 85 à 98 ans que
  les décès d'Eurostat permettent, 2025.
