date: "2026-10-03"
session: >-
  l'action 141, les deux moteurs et la clôture, à la demande du propriétaire :
  « Corrige tout ça dans les moteurs »
consulte: >-
  l'avenant n° 10 du 24 juillet 1992 au règlement de la convention du 1er janvier 1990
  (copie du Medef n° 452, lue sur ses images, articles 51 et 52) ; l'index JORF
  (arrêté du 5 février 2003 agréant la convention du 1er janvier 2004, règlement,
  art. 27) ; l'article 8 bis de l'Agirc dans sa rédaction de 2001, § 5 ; l'index
  LEGI (R. 351-12, 4°, c, pour l'allocation de solidarité ; D. 351-1-2, qu'il ne
  trouve pas sous ce numéro) ; Common Crawl, à nouveau refusé.
trouve: >-
  La participation de 1,2 % est à l'article 51 du règlement que l'avenant de 1992
  remplace, sans date d'effet écrite ; celle de 3 %, à l'article 27 du règlement de
  la convention de 2004. L'article 52 de 1992 borne déjà à quatre plafonds le salaire
  de référence revalorisé. R. 351-12, 4°, c, vise tous les revenus de remplacement de
  L. 5421-2 du code du travail, l'ASS comprise. Le modèle porte désormais au scénario 1
  la borne de quatre plafonds, les premiers jours validés (1967, 1977 à l'Ircantec) et
  la solidarité à 4 %, 8 % ou 12 %, et au compte notionnel le versement de l'Unédic ou
  de l'État (fiches chomage_retraite_complementaire et
  financement_chomage_complementaire).
reste: >-
  Les dates d'effet des avenants de 1992 et de 2002, prises au mois qui suit leur
  signature ; les conventions de l'État du 23 mars 2000 et du 5 juillet 2021 ; le guide
  réglementaire de 2018 ; les incréments de la DILA, refusés, l'index étant à jour au
  27 septembre 2026.
