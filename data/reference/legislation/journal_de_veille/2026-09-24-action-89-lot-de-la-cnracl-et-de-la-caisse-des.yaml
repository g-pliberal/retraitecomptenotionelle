date: "2026-09-24"
session: "action 89, lot de la CNRACL et de la Caisse des dépôts (juris-cnracl, FSPOEIE, mines)"
consulte: >-
  veille_droit.py au début. Les pages de la CNRACL, sa base juridique —
  369 pages déroulées —, ses trois calculettes, le convertisseur de
  validation de la Caisse des dépôts, les pages du FSPOEIE et des mines,
  les tableaux « Barèmes et revalorisations » des mines de 2024 à 2026 et
  la fiche du COR. Dans l'index LEGI : le décret n° 46-2769 (articles 125,
  127, 131, 131-1, 131-2, 136, 138, 139 et 181, dans leurs versions), le
  décret n° 2002-800, L. 13, L. 14 et D. 16-1 du code des pensions, les
  articles 17, 19 et 26 du décret n° 2003-1306, R. 173-15 du code de la
  sécurité sociale, les versions de 2014 et de 2023 de L. 161-17-3, les
  A, B et C du XXIV et le B du XXX de l'article 10 de la loi n° 2023-270.
  Dans l'index JORF, les arrêtés du coefficient de majoration minier de
  décembre 2021 et de février 2026, les autres sur Légifrance. Les
  circulaires Cnav 2023-14 et 2023-19, trouvées par la recherche du site
  des circulaires.
trouve: >-
  Quatre règles du scénario 1, corrigées dans les deux moteurs. La pension
  minière — coefficient de l'article 131-1, valeur du trimestre indexée
  sur les pensions, plafond de cent vingt trimestres de l'article 136, âge
  de cinquante-cinq ans : 17 172 € dus pour trente ans liquidés en 2026,
  12 299 servis. La durée d'une carrière longue de fonctionnaire ouverte
  avant soixante ans, lue à la date d'ouverture (C du XXIV). La surcote de
  la fonction publique, comptée en trimestres de durée. La durée des
  générations nées de septembre 1961 à 1965 parties avant septembre 2023,
  celle de la version de 2014 de L. 161-17-3 (B du XXX). Six exemples
  entrent aux témoins officiels : un du COR, trois de la CNRACL, deux de
  la Cnav. Et deux questions que ce registre laissait ouvertes sont
  tranchées : la CNRACL n'applique pas l'écrêtement du minimum garanti,
  faute de décret ; la fiche des mines est confrontée au décret en vigueur.
reste: >-
  Le traitement d'une pension différée, que l'article 26 du décret
  n° 2003-1306 revalorise comme les pensions de la radiation à la mise en
  paiement, et que le modèle porte au point d'indice. La priorité du
  régime spécial pour les majorations pour enfants (R. 173-15), que le
  modèle remplace par la plus favorable. L'interpénétration ; le
  rétablissement ; la clause de sauvegarde de l'article 8 du décret
  n° 2023-436 ; la bonification des mineurs au fond ; les seuils de
  validation d'avant 1972 ; le SP-CTI, la NBI et le supplément des
  aides-soignants.
