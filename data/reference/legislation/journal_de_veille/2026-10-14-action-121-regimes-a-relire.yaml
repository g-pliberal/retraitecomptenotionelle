date: "2026-10-14"
session: "action 121 : les régimes à relire, quinze sur dix-sept, texte en main"
consulte: >-
  Index LEGI, publié à jour du 11 octobre 2026 (dila_index.py legi --recuperer).
  Opéra national de Paris : décret n° 68-382, article 6, ses rédactions de 2002 à 2014
  (LEGIARTI000006765539, LEGIARTI000018253874, LEGIARTI000019138623,
  LEGIARTI000020056988, LEGIARTI000024468762, LEGIARTI000029135150) ; article 14, ses
  sept rédactions de 2008 à 2017 (LEGIARTI000018253858 à LEGIARTI000029135161).
  Banque de France : règlement annexé au décret n° 2007-262, articles 26, 31, 69 et 72,
  dans les rédactions de 2007 (LEGIARTI000006778516), 2009 (LEGIARTI000020085558), 2012
  (LEGIARTI000025882187), 2014 (LEGIARTI000029138467), 2020 (LEGIARTI000042384599) et
  2025 (LEGIARTI000047909725).
  MSA des non-salariés : code rural, L. 732-25 dans ses cinq rédactions de 2000 à 2026
  (LEGIARTI000006585545 à LEGIARTI000047452862), R. 732-39 dans ses deux rédactions
  (LEGIARTI000006597424, LEGIARTI000024113166) ; loi n° 86-19, article 11.
  CNAVPL et CNBF : loi n° 2003-775, articles 96 (LEGI) et 97 (JORF, index récupéré le
  14 octobre 2026) ; L. 643-3 et L. 723-10-1 dans leurs premières rédactions ; R. 643-7.
  CAVIMAC : décret n° 2006-1325, article 2. CARPIMKO : arrêté du 31 juillet 2015 et son
  annexe (JORFTEXT000031255542, JORFARTI000031255547). CPRN, CARMF, ASV et CESE : les
  textes que leurs fiches citent, relus dans les fiches. Comédie-Française : décret
  n° 93-430, ses huit articles au JORF ; article 6 du décret n° 68-960
  (LEGIARTI000006765429, LEGIARTI000006765430). Complémentaires : l'article 16 de
  l'arrêté du 30 décembre 1970 (Ircantec), cité par sa fiche ; l'accord ASF, cité par
  celle de l'Agirc. CARMF : l'index JORF avant 2001, qui ne porte que des résumés.
trouve: >-
  L'Opéra : la durée de 2009 et après se lit à la date où les conditions de l'article 6
  sont réunies, sur le calendrier de 2008 des régimes spéciaux, puis, depuis le
  1er juillet 2019, sur une table par génération lue à soixante ans (celle de la
  Comédie-Française) ; la fiche lisait la table commune. L'âge de quarante ans pour
  tout le ballet vaut à compter du 14 mars 2002, sans disposition transitoire : année
  d'effet. La Banque de France : l'âge de la table de l'article 72 (2012, puis 2023),
  et non la table commune ; la durée de l'article 69, à la date où l'agent est
  susceptible de liquider (calendrier de 2007 jusqu'à 166 trimestres en juillet 2014),
  puis par génération depuis 2018 et 2025 ; la fiche lisait la fonction publique et la
  table commune. La MSA des non-salariés : l'âge de soixante ans vaut pour les pensions
  prenant effet après le 1er janvier 1986 (année d'effet) ; la durée est celle de
  R. 732-39, 150 trimestres avant la génération 1944 puis deux de plus par génération
  jusqu'à 160 en 1948, et non la durée du taux plein du régime général que la fiche
  lisait depuis 2004. La CNAVPL, la CNBF, la CAVIMAC, la CARPIMKO et la CPRN basculent
  à l'entrée en vigueur de leurs textes (année d'effet), sans valeur à corriger. La
  CARMF et l'ASV s'ouvrent à l'âge légal de la génération depuis 2017, et non à
  soixante-deux ans, l'âge d'où court la majoration. Le CESE compte un taux par
  annuité selon la date du mandat, que le moteur ne sait pas porter. La
  Comédie-Française (1993) et les cinq complémentaires (1er avril 1983) basculent à
  l'année d'effet ; les 160 trimestres d'avant 1983 n'étaient que le repli du moteur.
reste: >-
  Opéra : la table de juillet 2019 ne nomme que les musiciens et les autres catégories ;
  la fiche la prête au ballet. Banque de France : les nés de 1966 à 1972, que le IV de
  l'article 69 ne nomme pas (172 présumés, 169 à 171 à la lettre du III) ; l'ancien
  régime d'avant 2007, hors LEGI ; l'âge d'annulation de la décote et les catégories à
  nomenclature. La durée de la CARMF avant 2000 (statuts non lus) ; le taux par annuité
  du CESE ; l'âge de la CARPIMKO avant 2016 (statuts de 1968 modifiés, non lus).
