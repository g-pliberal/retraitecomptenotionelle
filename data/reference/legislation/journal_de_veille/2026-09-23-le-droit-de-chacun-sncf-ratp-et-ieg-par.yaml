date: "2026-09-23"
session: "le droit de chacun : SNCF, RATP et IEG par génération, et leurs retraités"
consulte: >-
  Dans l'index LEGI : les articles de durée des trois régimes dans leurs
  versions de 2014 et en vigueur, les articles d'âge (37-1, 51-1, 45 V),
  et les clauses qui gardent l'ancien droit à qui a réuni les conditions
  avant 2025.
trouve: >-
  La durée des régimes spéciaux se lit à la date des conditions réunies
  jusqu'en juillet 2019, puis par génération ; l'âge, par génération. Les
  fiches lisaient l'âge à l'année et la durée dans la table commune, et se
  trompaient pour tous ceux qui ne partent pas à l'âge, retraités d'abord.
reste: >-
  Dix fiches portent encore un âge par année (action 121).
