date: "2026-11-20"
session: "action 191 : la complémentaire des médecins compte ses points d'avant 1996"
consulte: >-
  L'index du Journal officiel du dépôt, à jour au 16 novembre 2026 : les
  arrêtés d'approbation des statuts du régime complémentaire de la CARMF du
  28 août 2006 (JORFTEXT000000459576), du 7 septembre 2007
  (JORFTEXT000000647858), du 1er avril 2008 (JORFTEXT000018605099), du 9 août
  2010 (JORFARTI000022758875) et du 7 octobre 2014 (JORFARTI000029623661) ;
  les décrets de cotisation de 1992, 1995 et 1996 (JORFARTI000001185669,
  JORFARTI000001589943, JORFARTI000002114978). « La chronologie des chiffres
  de la CARMF 2025 », PDF de la caisse relu le 20 novembre 2026, pages 20, 26,
  95 et 96.
trouve: >-
  Les statuts d'avant 2017 ne sont pas au Journal officiel, qui n'en publie
  que les modifications. La chronologie de la caisse suffit : le forfait
  rapporte quatre points, la proportionnelle de 1983 à 1995 achète au même
  prix entre un plancher et un plafond, à partir de la quatrième année
  d'affiliation de 1983 à 1990, et les points d'avant 1991 sont portés par
  1,33. Corrigé par les données. Détail :
  docs/feuille_de_route/191/2026-11-20-carmf-les-points-d-avant-1996.md.
reste: >-
  Le texte de l'article 19 des anciens statuts, hors de portée. Le délai de
  trois ans de 1991 à 1995, le partage du forfait l'année du départ, les
  points gratuits de l'exonéré. Un exemple chiffré de la caisse.
