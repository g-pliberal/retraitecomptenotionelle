date: "2026-11-05"
session: "action 130, file E (E5, vague 11) : la CPRN lue au droit, la fiche cprn_ages_decote_enfants"
consulte: >-
  `veille_droit.py` (la base de la Cnav, rien de neuf) et `docs/veille_droit.md`. Dans
  l'index JORF du dépôt, à jour du 5 novembre 2026 : tous les textes du régime
  complémentaire des notaires, par « notaires » dans leur titre avec « statuts », «
  vieillesse », « retraite » ou « complémentaire », et par « CPRN », « section
  professionnelle des notaires » et « retraite des notaires » dans leur corps, sans
  borne ; l'arrêté du 28 décembre 2004 (JORFARTI000001075201) ; l'arrêté du 27 février
  2008 (JORFARTI000018229446) ; l'arrêté du 16 décembre 2013, articles 1er et 2 et annexe
  (JORFARTI000028387440, JORFARTI000028387441, JORFARTI000028387445) ; l'arrêté du 31 mai
  2017, article 1er et annexe (JORFARTI000034975968, JORFARTI000034975971) ; l'arrêté du
  29 novembre 2023, articles 1er et 2 et annexe (JORFARTI000048679345,
  JORFARTI000048679346, JORFARTI000048679350) ; l'arrêté du 10 juillet 2026, articles 1er
  et 2 et annexe (JORFARTI000054435992, JORFARTI000054435993, JORFARTI000054435995) ; le
  décret n° 2026-418, article 2 et notice ; les décrets n° 2004-1142 et 2013-1157 ; les
  titres des arrêtés de 1954 à 1996. Dans l'index LEGI, à jour du 5 novembre 2026 : L.
  161-17-2, D. 161-2-1-9 et L. 351-8 du code de la sécurité sociale.
trouve: >-
  Avant 2014, les statuts ne se lisent pas : le règlement de 1962 et ses modifications
  n'ont à l'index que leur titre, trois au seul Bulletin officiel, et les statuts de 2005
  sont au Bulletin officiel no 2005/01. L'arrêté de 2013 cite pourtant l'article 14 qu'il
  remplace, « La demande ne peut être antérieure ni au soixante-cinquième anniversaire du
  notaire » : le modèle sert la CPRN d'avant 2014 à l'âge de la base (non tranché, deux
  lectures chiffrées). De 2014 à 2023 puis depuis 2024, le modèle rend les âges, la
  décote, la surcote et les 10 % de trois enfants des statuts ; il compte le trimestre
  entamé, que le texte ne tranche pas. Le passage de 2024 est une erreur du modèle,
  prouvée et chiffrée : le notaire parti en 2023 avant 64 ans a la CPRN dès le 1er
  janvier 2024, le modèle la lui sert à 64 ans. La date d'effet est au mois civil depuis
  2017, comme le modèle : la CPRN ne partage pas l'erreur du trimestre civil. Les 30 % par
  enfant à charge de moins de vingt et un ans, depuis 2008 au moins, ne sont pas
  modélisés.
reste: >-
  Les statuts d'avant 2014, au Bulletin officiel (no 2005/01, no 90-42) : à demander à la
  CPRN. Un exemple de la caisse : une pension liquidée en 2024 par un notaire qui a cessé
  d'exercer en 2023 avant 64 ans. L'erreur du passage de 2024, au propriétaire, non
  corrigée.
