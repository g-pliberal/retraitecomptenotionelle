date: "2026-09-29"
session: >-
  la deuxième étape du troisième domaine, un départ par régime, et le
  minimum garanti d'avant 2004
consulte: >-
  Index LEGI du dépôt : L. 17 du code des pensions dans sa rédaction du 28
  décembre 1975 au 1er janvier 2004 (LEGIARTI000006362711) ; l'article 17 du
  décret n° 65-773 du 9 septembre 1965 (CNRACL), rédactions de 1965 et de
  1985 (LEGIARTI000006368220, LEGIARTI000006368221) ; l'article 10 du décret
  n° 65-836 du 24 septembre 1965 (ouvriers de l'État), rédaction de 1976
  (LEGIARTI000006766756).
trouve: >-
  Avant 2004, le minimum garanti des trois régimes était de 4 % du
  traitement de l'indice 100 par année de services effectifs et de
  bonifications, et de ce traitement entier à vingt-cinq ans : le barème que
  le dépôt date de 1976, et que leurs périodes ne déclaraient qu'à partir de
  2004. Elles le déclarent désormais depuis le code de 1964 et les décrets
  de 1965. Chaque régime liquide à sa date dans les deux moteurs, sous la
  présomption depart_de_chaque_regime, qui ne fait demander avant le départ
  que la pension militaire.
reste: >-
  La correspondance de l'indice brut 100 et de l'indice majoré avant 2003 ;
  la rédaction de L. 17 d'avant le 28 décembre 1975 ; un exemple publié d'un
  polypensionné liquidant à deux dates ; la révision du minimum contributif
  de R. 173-8.
