date: "2026-11-03"
session: "action 158, étape des militaires : leurs indices de solde, lus au LEGI par l'index du dépôt, certifiés et recoupés au Noyau RH de l'État"
consulte: >-
  Aucune règle du scénario 1 n'est écrite. L'index LEGI du dépôt, reconstruit le 2 novembre
  2026 (dump du 13 juillet 2025, incréments jusqu'au 2 novembre 2026 à 21 h 39) : les décrets
  fixant les indices de solde des militaires (n° 2008-532, 2009-17 à 2009-23 du 7 janvier
  2009, 2011-388 pour la gendarmerie, 2011-1235 pour l'armement, 2017-491) et leurs décrets
  modificatifs ; les arrêtés des indices de solde de 1975, 1992, 2000 et 2007, de
  l'échelonnement indiciaire du contrôle général des armées (1994), des militaires infirmiers
  (2002) et des praticiens des armées (2004), et l'arrêté du 18 juin 2020 qui les abroge ;
  l'article 3 des décrets n° 2014-1257, 2015-1041 et 2015-1304, pour l'entrée en vigueur du
  premier ; l'article 2 du décret n° 2009-1111, qui « prend effet au 1er janvier 2009 ». Les
  grilles militaires du Noyau RH de l'État (CISIRH, juillet 2026), déjà au dépôt. Les sites du
  ministère des armées (bo.sga.defense.gouv.fr, archives.defense.gouv.fr) refusent le
  mandataire de la session ; emploi-collectivites.fr répond 403.
trouve: >-
  Le LEGI garde avec leurs tableaux 18 textes des militaires : 192 grilles, 2 959 périodes
  d'échelons lues, depuis 1993 pour le contrôle général des armées, 2000 pour les officiers,
  2009 pour tous. Avant 2009, les échelons des sous-officiers et des militaires du rang se
  comptent en années de services, et le texte aplati ne se relit pas. Le décret n° 2014-1257
  entre en vigueur le 1er novembre 2014 : la rétroactivité au 1er janvier 2014 que lui donnait
  le décret n° 2015-1041 a été retirée par le n° 2015-1304, mais le LEGI la garde à l'article 2
  du décret n° 2009-21, et le Noyau RH aux militaires du rang. Le noyau de juillet 2026 n'a
  ni le décret n° 2024-1121 (majors, adjudants-chefs, adjudants, 15 décembre 2024), ni le
  n° 2025-1000 (officiers, 15 décembre 2025). Ailleurs, les grilles du LEGI redonnent celles du
  noyau indice pour indice, de 2009 à 2026.
reste: >-
  L'étape 2 de l'action 158 : les durées d'échelon, dans les statuts des trois versants et des
  militaires (décrets n° 2008-930 à 2008-961 du 12 septembre 2008) ; les tableaux que l'index
  aplatit, en caractères avant 1995, en années de services chez les militaires avant 2009 ; le
  chaînage et les reclassements ; le barème avant 2006, au décret n° 82-1105 ; le traitement
  mensuel d'une grille de solde publiée, d'un poste qui accède aux sites du ministère des
  armées.
