date: "2026-09-29"
session: >-
  la troisième étape du troisième domaine, la retraite progressive
consulte: >-
  Index LEGI du dépôt : L. 351-15 dans ses six rédactions, de 1988 à 2022 ;
  R. 351-39 (1988, 1993, 2006, 2014, 2022), R. 351-40 à R. 351-44 (1988),
  R. 351-41 (2014, 2017, 2022), D. 351-15 (2006), R. 351-27 (2023, 2026) ;
  L. 643-8-1 (1988) ; D. 634-16 (1991, 2014) ; D. 732-167 (2007, 2014) ;
  L. 161-22-1-5, L. 161-22-1-7, D. 161-2-24-1 à D. 161-2-24-5-1,
  D. 161-2-24-7, R. 161-19-5 ; L. 89 bis et L. 89 ter, D. 37-1 à D. 37-3 du
  code des pensions ; les articles 49 ter à 49 sexies du décret
  n° 2003-1306 et 34 ter à 34 sexies du décret n° 2004-1056. Index JORF :
  l'article 18 de la loi n° 2014-40, le décret n° 2014-1513 (articles 1 à 4),
  les notices des décrets n° 2023-751 et 2023-753.
trouve: >-
  La loi de 1988 fait liquider avec le salarié ses pensions de tous les
  régimes qu'elle nomme, professions libérales comprises ; le libéral
  lui-même n'a la retraite progressive qu'en 2023, le décret de L. 643-8-1
  n'ayant jamais paru, et les avocats, les clercs de notaire, l'Opéra et les
  mines y entrent avec les fonctionnaires le 1er septembre 2023 (décrets
  n° 2023-751 et 2023-753) — le moteur, qui ouvrait les libéraux et les
  avocats en 2014, est corrigé. La durée est de 150 trimestres, 160 du
  28 août 1993 au 8 juin 2006 ; la quotité s'arrondit à l'unité, la moitié
  comptée pour un (R. 351-41 depuis 2017, R. 161-19-6) ; la décote de la
  pension provisoire est bornée à 25 % du 18 décembre 2014 au 1er septembre
  2023, borne que les vingt trimestres de chaque régime tiennent déjà. La
  pension complète ne descend pas sous la provisoire revalorisée depuis le
  8 juin 2006 (D. 351-15, D. 161-2-24-7), sauf au fonctionnaire, dont le
  code et les décrets de 2023 la liquident aux règles de sa date.
reste: >-
  Aucun exemple chiffré publié ; la pratique de la CNAVPL avant 2023 ; les
  règles propres de l'Agirc-Arrco (accord de 2017, article 88) et de
  l'Ircantec ; les décrets des régimes spéciaux ; les assurés en retraite
  progressive au 1er septembre 2023, qui gardent les anciennes règles.
