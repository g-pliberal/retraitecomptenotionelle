date: "2026-11-19"
session: "action 191 : l'étape 2 du domaine du cumul, les droits après la première pension et la seconde pension lus dans leurs fiches"
consulte: >-
  Dans l'index LEGI, à jour au 16 novembre 2026 : L. 161-22-1 A
  (LEGIARTI000028496884), L. 161-22-1 dans sa rédaction de 2023
  (LEGIARTI000047453688), L. 161-22-1-1 dans ses trois rédactions, dont celle
  de 2026 (LEGIARTI000053279747), D. 161-2-22-1 (LEGIARTI000047958952),
  l'article 27 du règlement du RCI (LEGIARTI000054906651). Dans l'index KALI,
  à jour au 13 novembre 2026 : l'article 91 de l'accord du 17 novembre 2017
  (KALIARTI000049290254), dans la rédaction de l'avenant n° 16. Dans l'index
  JORF : le VIII de l'article 19 de la loi n° 2014-40 (JORFARTI000028493657)
  et le XII de l'article 26 de la loi n° 2023-270 (JORFARTI000047445113).
  Dans la base de législation de la Cnav : la circulaire 2015/8 du 6 février
  2015, point 3, les exposés « Fin d'acquisition de droits à retraite » et
  « Retraite personnelle issue d'un cumul emploi retraite », la fenêtre
  « Réforme du cumul emploi retraite ». La fiche F13243 de
  service-public.gouv.fr, vérifiée le 12 novembre 2026.
trouve: >-
  Chaque texte dit ce que les fiches droits_apres_la_premiere_pension et
  seconde_pension en citent : le plafond de 5 % pour les nouvelles pensions
  prenant effet à compter du 1er septembre 2023, sa disparition pour les
  premières pensions prises à compter du 1er janvier 2027, la deuxième
  pension de l'Agirc-Arrco au plus tôt le 1er janvier 2024, les droits du RCI
  depuis le 1er janvier 2025. Aucune règle ne change : le moteur lit ces
  dates et ce plafond dans les versions des deux fiches, et ne les écrit
  plus. Un écart de nom, gardé et déclaré : la règle des mois du titulaire
  d'une pension militaire. Les exemples 6 et 7 de la circulaire Cnav 2015/8
  entrent aux exemples officiels, et le moteur les reproduit. Détail :
  docs/feuille_de_route/191/2026-11-19-etape-2-du-cumul.md.
reste: >-
  Une question de lecture : la loi de 2023 entre en vigueur le 1er septembre
  2023, et la fiche éteint dès le 1er janvier 2023 les droits de qui a pris sa
  première pension avant 2015 ; à trancher par une lecture à part. Les
  circulaires Cnav 2017/19, 2018/4, 2018/19, 2018/24 et 2019/26, que le
  registre lie à la fiche, n'ont pas été relues.
  Les deux fiches n'ont pas été relues en entier : sources.lu_le ne bouge
  pas. La fiche cumul_emploi_retraite_et_retraite_progressive, que la veille
  dit à relire pour une rédaction non lue, n'a pas été ouverte : elle est
  d'une étape suivante du domaine. L'article 91 de l'accord de l'Agirc-Arrco
  n'est cité par la fiche seconde_pension qu'en prose, non parmi ses textes.
