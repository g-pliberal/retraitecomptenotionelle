date: "2026-11-23"
session: "action 191, séparation des axes, étape 6 : les droits d'avant 1973 des artisans et des commerçants au 1er juillet 1984"
consulte: >-
  L'index LEGI du dépôt, à jour au 23 novembre 2026 : décret n° 73-937,
  articles 12-2 (LEGIARTI000006765853), 13-8 (LEGIARTI000006765863), 12
  (LEGIARTI000006765850), 12-1 (LEGIARTI000006765852), 13
  (LEGIARTI000006765854) et 3 dans ses rédactions de 1976
  (LEGIARTI000006765815) et de 1990 (LEGIARTI000006765816) ; décret
  n° 64-994, articles 19 (LEGIARTI000006764521), 22 (LEGIARTI000006764524) et 46
  (LEGIARTI000006764553) ; décret n° 66-248, articles 7 (LEGIARTI000006763969), 15
  (LEGIARTI000006763977) et 16 (LEGIARTI000006763978) ; décret n° 64-993,
  article 2-1 (LEGIARTI000006764564).
trouve: >-
  Les droits d'avant 1973 ne s'ouvraient qu'à soixante-cinq ans, ou à soixante
  ans pour l'inapte, jusqu'au 30 juin 1984 ; l'article 12-2 les ouvre à
  soixante ans le 1er juillet 1984, sans abattement pour 150 trimestres. Les
  fichiers cancava_avant_1973 et organic_avant_1973 prennent les deux lignes.
  Quatre cas témoins montent de 3,4 % à 5,4 %. Détail :
  docs/feuille_de_route/191/2026-11-23-etape-6-droits-d-avant-1973-en-1984.md.
reste: >-
  L'inaptitude, la grande invalidité et les anciens prisonniers de guerre
  avant le 1er juillet 1984, et le barème des majorations pour
  ajournement d'avant cette date, au règlement intérieur de la caisse des
  artisans et dans un arrêté pour les commerçants, que l'index ne porte pas.
