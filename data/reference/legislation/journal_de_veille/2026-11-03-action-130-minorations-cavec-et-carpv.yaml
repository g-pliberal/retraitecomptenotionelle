date: "2026-11-03"
session: "action 130, file E, vague 6 : les minorations à l'âge seul de la CAVEC et de la CARPV, lues au droit"
consulte: >-
  python scripts/veille_droit.py ; docs/veille_droit.md ; les index LEGI et JORF du dépôt,
  récupérés, à jour du 2 novembre (20261102-213929) et du 3 novembre 2026
  (20261103-002311), sans incrément à appliquer ; python scripts/textes.py --inscrire,
  aucune rédaction nouvelle. Dans JORF, la CAVEC : l'arrêté du 22 février 2008, son article
  1er et son annexe (articles 3.12 à 3.15 et 3.17) ; les annexes des arrêtés du 26 novembre 2010,
  des 9 février et 27 mars 2012, des 7 octobre 2013 et 2014, du 20 août 2018 (partie 2,
  articles 11 à 14 et 16), du 19 juin 2019, du 2 juillet 2024, du 4 juillet 2025 et du
  16 décembre 2025 ; les titres et analyses des textes d'avant 2008. La CARPV : les textes
  depuis le décret n° 50-1318, cherchés à l'âge, à la minoration, à l'anticipation et à
  l'inaptitude ; les annexes des arrêtés du 11 janvier 2011, du 16 avril 2014, des
  18 février et 2 novembre 2015, des 23 janvier et 3 août 2017, du 18 octobre 2021
  (articles 33 à 37 et 41, et l'article 2 de l'arrêté) et du 16 décembre 2025. Le décret
  n° 2026-418, articles 6, 8 et 30 ; les arrêtés du 10 juillet 2026 qui approuvent les
  règlements des deux caisses, dans JORF, et pour la CAVEC aussi dans LEGI
  (LEGIARTI000054437585).
trouve: >-
  La CAVEC liquide à 65 ans à taux plein, dès 60 ans avec un abattement de 1,25 % par
  trimestre manquant, sans durée : article 3.13 des statuts de 2008 (en vigueur le 2 mars
  2008), article 12 de ceux de 2018 (le 5 septembre 2018), article 1.1.3 du règlement de
  2026 (le 18 juillet 2026) ; l'inapte, à 60 ans sans abattement, depuis 2008 quand la
  CNAVPL liquide sa base à ce titre, depuis le 28 juin 2019 « au titre de l'inaptitude au
  travail ». La CARPV de même, « soit 1,25 % par trimestre manquant avant l'âge de
  soixante-cinq ans » : article 34 des statuts de 2021, en vigueur le 1er janvier 2022,
  article 2 du règlement de 2026 ; l'inapte à 60 ans sans minoration, et dès 2011 l'invalide
  inapte titulaire de la rente à 100 % (article 21, sixième alinéa). Le modèle porte ces
  âges et ce taux à chaque date d'effet ; il ne sert pas l'inapte sans minoration, ni la
  réversion de la CAVEC sans le coefficient, ni celle de la CARPV sans lui quand l'assuré
  meurt avant 65 ans : trois écarts déclarés dans les fiches, sans correction. Les deux
  fiches ont leurs versions, cinq et trois, et entrent dans LUES_AU_DROIT.
reste: >-
  Les statuts d'avant 2008 de la CAVEC et d'avant 2021 de la CARPV, au seul Bulletin
  officiel ; la manière dont chaque caisse compte un trimestre entamé, que les textes ne
  disent pas ; les écarts de l'inapte et de la réversion, à une file du modèle ; la
  CAVAMAC et la CARCDSF, lots suivants.
