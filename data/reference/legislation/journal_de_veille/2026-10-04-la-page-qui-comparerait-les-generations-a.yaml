date: "2026-10-04"
session: >-
  la page qui comparerait les générations à carrière égale, demandée par le
  propriétaire et seulement documentée : l'action 143, à faire
consulte: >-
  Aucun texte de droit. Le dépôt : les pages Carrières types et Pourquoi changer, le
  cumul des résultats du simulateur, les cas types et le pilote, les tables par
  génération de la législation, la mortalité, le compte notionnel, la fiche de paie,
  le registre des sources.
trouve: >-
  Les âges, la durée requise, l'espérance de vie par génération, la pension brute et
  les cotisations aux taux réels sont calculés ; manquent une série d'heures
  travaillées, les prélèvements sur les pensions année par année, et toute
  statistique par génération, le dépôt ne lisant ses séries de la DREES que par année.
reste: >-
  Tout : l'action attend que le propriétaire la lance et tranche ce qu'elle lui
  soumet — une page ou une partie de Carrières types, les indicateurs de tête, le sens
  du « net », les heures légales ou effectives.
