date: "2026-11-19"
session: "action 191 : les rédactions de 2026 et après dont les fiches ne disaient rien, lues"
consulte: >-
  Dans l'index LEGI, à jour au 16 novembre 2026, les dix-huit rédactions de
  2026 et après que le sixième cliquet de la note 0009 comptait sans un mot
  d'une fiche, chacune comparée à celle d'avant : code rural, L. 732-56,
  L. 732-63, D. 731-121, D. 732-111, D. 732-114 (1er janvier 2026) et
  R. 732-61 (14 octobre 2026) ; code de la sécurité sociale, D. 351-2-2 et
  R. 351-27 (1er août 2026), R. 351-12 (1er novembre 2026) ; décret
  n° 2003-1306, articles 15 et 20 ; décret n° 2004-1056, article 12 ; décret
  n° 2017-1000, article 3 ; code des pensions des marins, R. 8-1 ; décret
  n° 79-262, article 2 ; règlement du RCI, articles 27, 39 et 41 (1er janvier
  2027).
trouve: >-
  Aucune ne change la règle que portent les vingt-deux fiches qui citent ces
  articles : la majoration des élus locaux (décret n° 2026-948), les périodes
  de chef d'exploitation à titre secondaire, le cumul de 2027 et le versement
  unique du RCI ont chacun leur fiche, qui rattachait déjà la rédaction.
  R. 351-27 retrouve au 1er août 2026 un coefficient de 1,25 %, celui des
  assurés nés après 1952. Trente-deux déclarations sans effet, le cliquet
  sans_un_mot de 83 à 51. Détail :
  docs/feuille_de_route/191/2026-11-19-redactions-dont-les-fiches-ne-disent-rien.md.
reste: >-
  Les 51 couples de rédactions d'avant 2026 dont les fiches ne disent rien.
  Le I de l'article 41 du règlement du RCI, la réversion de moins de quarante
  points versée en une fois, que le modèle ne porte pas. Aucune circulaire
  n'a été relue : les fiches n'ont pas été relues en entier, et sources.lu_le
  ne bouge pas.
