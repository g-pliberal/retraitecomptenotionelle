date: "2026-11-19"
session: "action 191 : les rédactions dont les fiches ne disaient rien, lues"
consulte: >-
  Dans l'index LEGI, à jour au 16 novembre 2026, les quarante-huit rédactions
  en vigueur ou à venir que le sixième cliquet de la note 0009 comptait sans
  un mot d'une fiche, chacune comparée à celle d'avant. Dix-huit de 2026 et
  après : code rural, L. 732-56, L. 732-63, D. 731-121, D. 732-111, D. 732-114
  et R. 732-61 ; code de la sécurité sociale, D. 351-2-2, R. 351-27 et
  R. 351-12 ; décret n° 2003-1306, articles 15 et 20 ; décret n° 2004-1056,
  article 12 ; décret n° 2017-1000, article 3 ; code des pensions des marins,
  R. 8-1 ; décret n° 79-262, article 2 ; règlement du RCI, articles 27, 39 et
  41. Trente d'avant 2026, dont L. 161-17-2 (31 décembre 2025), D. 161-2-1-9
  (1er septembre 2023), L. 351-8 (28 février 2025), L. 351-10 (28 décembre
  2023), L. 643-3 (31 décembre 2025), L. 173-2 (1er janvier 2018), L. 131-6 et
  L. 131-6-2 (28 décembre 2023) ; code des pensions, L. 10, L. 14, L. 17 et
  L. 24 ; l'arrêté du 30 décembre 1970 de l'Ircantec, article 16.
trouve: >-
  Aucune ne change la règle que portent les fiches qui citent ces articles :
  quatre-vingt-deux déclarations sans effet, dans cinquante fiches, le
  cliquet sans_un_mot de 83 à 1. La majoration des élus locaux (décret
  n° 2026-948), les périodes de chef d'exploitation à titre secondaire, le
  cumul de 2027 et le versement unique du RCI ont chacun leur fiche, qui
  rattachait déjà la rédaction. R. 351-27 retrouve au 1er août 2026 un
  coefficient de 1,25 %, celui des assurés nés après 1952. Détail :
  docs/feuille_de_route/191/2026-11-19-redactions-dont-les-fiches-ne-disent-rien.md.
reste: >-
  L. 173-2 dans sa rédaction de 2018, qui ne nomme plus le régime des cultes
  parmi ceux dont le minimum contributif s'écrête, quand la fiche
  minimum_contributif compte la Cavimac : au propriétaire. La fiche
  carpimko_ages_2015, qui lit le III de L. 643-3 comme le départ pour
  carrière longue, quand c'est celui des assurés handicapés : à instruire.
  Le I de l'article 41 du règlement du RCI, la réversion de moins de quarante
  points versée en une fois, que le modèle ne porte pas. Aucune circulaire
  n'a été relue : les fiches n'ont pas été relues en entier, et sources.lu_le
  ne bouge pas.
