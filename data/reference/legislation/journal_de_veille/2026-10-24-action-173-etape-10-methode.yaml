date: "2026-10-24"
session: "action 173, étape 10 : Méthode et sources, la même chose en moins de mots"
consulte: >-
  Aucun texte : la session ne touche pas au droit. La page seule, comptée comme les tests la
  comptent, ouverte et toute dépliée, et vue dans Chromium de 320 à 1 440 points de large ; le
  manifeste des sources, pour compter les institutions qu'il cite, et la garantie vieillesse du
  portage, pour savoir si elle compte la rente du pilier.
trouve: >-
  Méthode et sources montre 469 mots ouverts au lieu de 557, et 5 618 dépliés hors ses deux
  bases au lieu de 5 944. Trois phrases ne disaient plus ce que fait le modèle : une cotisation
  « de 1950 » pour un cumul qui part de 1940, « trente institutions » quand le manifeste en cite
  42, une garantie qui ignorerait la rente du pilier, quand elle la reprend ; et la proposition
  différait du système 3 de trois choses, non de deux. Aucune simulation ne bouge.
reste: >-
  Rien pour la veille. Les deux schémas de la carte des flux de Coût, qui s'empilent au large.
