date: "2026-11-07"
session: "action 186, chantier 4 : la TVA sociale et la taxe sur la valeur du terrain étudiées aux sources pour le programme"
consulte: >-
  Aucune règle du scénario 1 n'est touchée, et l'index LEGI n'a pas été
  interrogé. Lus à leur source : le patrimoine national de l'Insee (Insee
  Première n° 2081 pour 2024, tableau provisoire de juillet 2026 pour 2025) ;
  la note de Fipeco du 29 septembre 2025 sur les taxes foncières ; le
  bulletin n° 210 de la DGCL ; l'Insee Analyses n° 43 de 2019 et le document
  de travail G2015/12 de l'Insee sur la TVA ; le document du COR d'octobre
  2009 qui reprend le CPO de 2008 ; l'administration fiscale estonienne et
  lex.dk pour le Danemark. Lus par un résumé ou un commentaire, non au
  texte : la décision 2012-654 DC du Conseil constitutionnel, le rapport
  mensuel de la Bundesbank d'avril 2008, la loi de finances pour 2025 sur la
  TVA de l'énergie, l'amendement AS955 au PLFSS 2025.
trouve: >-
  Le taux normal de TVA porte l'électricité et le gaz en entier depuis le
  1er août 2025, abonnement compris (loi de finances pour 2025, article 20,
  d'après la CCI Paris Île-de-France) : relever le seul taux normal touche
  l'énergie. Le Conseil constitutionnel exige le plafonnement d'un impôt
  annuel sur un patrimoine du type de l'ISF (2012-654 DC), ce qui borne une
  taxe sur la valeur du terrain. La révision des valeurs locatives
  d'habitation est annoncée pour 2028. Rien ne touche les fiches du dépôt.
  Le détail est dans la note
  docs/feuille_de_route/186/2026-11-07-recettes-tva-lvt.md.
reste: >-
  À relire au texte : la décision 2012-654 DC ; les articles 1390, 1391,
  1391 B et 1391 B ter du code général des impôts (exonérations, dégrèvement
  et plafonnement de la taxe foncière), cités de mémoire ; l'article 72-2 de
  la Constitution ; la fraction de TVA affectée à la sécurité sociale en
  2025, prévue et exécutée ; le taux plafond et la limite de hausse de la
  grundskyld danoise sur une source officielle.
