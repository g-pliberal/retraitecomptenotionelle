date: "2026-10-16"
session: "action 138, étape 8 : l'assiette forfaitaire du collaborateur et de l'aide familial, et la retraite forfaitaire du chef à titre secondaire"
consulte: >-
  Dans l'index LEGI du dépôt, mis à jour au 15 octobre 2026 : L. 731-42 dans ses sept
  rédactions (2000 à 2025) ; D. 731-120, D. 731-121, D. 731-122 et D. 731-123 de 2005 à
  2026 ; R. 732-69, R. 732-70, R. 732-71, R. 732-72 et R. 732-73 ; D. 732-155 de 2005 à
  2026 ; L. 732-28 et l'article 1121-1 de l'ancien code rural depuis 1980 ; R. 732-65,
  le décret n° 80-808, article 12 ; L. 732-34 et L. 732-35 de 2008 à 2026 ; R. 732-60,
  R. 732-61 et D. 732-62 dans leurs rédactions de 2026 ; L. 732-24 de 2026. Dans l'index
  JORF : le décret n° 2025-1409 du 30 décembre 2025, article 1. La page de la MSA « La
  retraite des non-salariés agricoles ».
trouve: >-
  Le collaborateur et l'aide familial cotisent, au b du 2° de L. 731-42, sur une assiette
  « déterminée forfaitairement » depuis 2004 : l'assiette minimale de D. 731-120, 400
  SMIC horaires (D. 731-123), 600 depuis 2026 ; quinze points de R. 732-71, que R. 732-73
  porte à seize pour les pensions prenant effet de 1994 à 2025. À la RCO, depuis 2011,
  1 200 SMIC, 66 points par an jusqu'en 2016, 77 en 2017, 88 depuis (D. 732-155, II). En
  2000, la cotisation du conjoint collaborateur se prenait des revenus du chef. Le chef à
  titre accessoire d'un salarié n'a droit qu'à la retraite proportionnelle (L. 732-28,
  depuis l'article 1121-1 de 1980), sans devoir la cotisation de la forfaitaire (L.
  731-42, 1°), sauf à avoir été non-salarié agricole avant 1981 (R. 732-65) ; la MSA ne
  sert le forfait qu'à « l'activité non-salariée agricole exercée à titre exclusif ou
  principal ». La loi n° 2025-199 abroge L. 732-28 au 1er janvier 2026, et le décret
  n° 2025-1409 R. 732-65 et R. 732-69 à D. 732-77, R. 732-73 compris, pour les pensions
  prenant effet depuis. Les deux moteurs servent désormais l'assiette forfaitaire, le
  plancher de seize points et le forfait sans les années de chef à titre secondaire,
  pour les pensions d'avant 2026.
reste: >-
  Ce que la MSA fait, pour une pension prenant effet depuis 2026, des années de chef à
  titre secondaire d'avant 2016 dans la part forfaitaire du 2° a de L. 732-24, et du
  revenu des années de collaborateur de 2016 à 2025 au 1° (le modèle prend le forfait de
  400 SMIC). L'assiette du collaborateur d'avant 2004 et les qualités d'avant 1999
  (conjoint participant aux travaux, aide familial), que le statut unique ne distingue
  pas. Le décret qui définit le titre secondaire face à une autre activité non salariée.
  Aucun exemple chiffré publié.
