date: "2026-10-23"
session: "action 138, étape 12 : au RCI, le cumul plafonné et le versement forfaitaire unique"
consulte: >-
  L'index LEGI du dépôt, mis à jour au 22 octobre 2026 (sept incréments) : le règlement
  du RCI (arrêté du 9 février 2012), article 27 dans ses quatre rédactions
  (LEGIARTI000054892085, LEGIARTI000054906642, LEGIARTI000054906651,
  LEGIARTI000054908896), articles 39 (LEGIARTI000054892235, LEGIARTI000054907326,
  LEGIARTI000054908885), 40 (LEGIARTI000054892270, LEGIARTI000054907340), 41
  (LEGIARTI000054892280, LEGIARTI000054907403, LEGIARTI000054908882) et 12 ; L. 634-6
  de 2008, 2014, 2018, 2023 et 2026 ; D. 634-11-2, D. 634-11-5 (2017, 2020) ; D. 635-9
  (2013, 2020) ; L. 161-22 de 2027 (LEGIARTI000053279730). L'index JORF : les arrêtés du
  7 juillet 2009 qui modifient les règlements du RCO des artisans (JORFARTI000021059798,
  article 23, II) et du NRCO des commerçants (JORFARTI000021059824, article 10), au
  Journal officiel du 22 septembre 2009 ; ceux du 19 juin 2024 (publié le 25 juin) et du
  21 septembre 2026 (publié le 24 septembre). À la base de législation de l'Assurance
  retraite, par son API de recherche (« RCI cumul emploi retraite », « versement
  forfaitaire unique RCI », « cumul emploi retraite indépendants », « 2017-416 ») : les
  exposés « Conditions de cumul emploi-retraite », « Retraite personnelle
  complémentaire » et « Modalités de paiement » ; les circulaires RSI n° 2009-044 du
  15 octobre 2009, n° 2013-004 du 17 janvier 2013, n° 2016-006 du 11 mai 2016 et
  n° 2017-007 du 29 août 2017, la circulaire Cnav n° 2026-07 du 5 mars 2026.
  La Sécurité sociale des indépendants refuse toujours le réseau de la session.
trouve: >-
  La complémentaire des indépendants suit leur base en cumul : depuis 2009 (règlements du
  RCO et du NRCO, que la caisse applique depuis le 1er janvier ; RCI, article 27, de
  2013), elle « est suspendu[e] pour la même durée » que la base, et servie entière en
  cumul intégral — la base que le dépassement réduit sans la suspendre, depuis 2017, ne
  la touche pas ; depuis le 26 juin 2024, « la section 3 » du code s'applique à son
  service, et elle perd le dépassement comme la base ; pour la première pension de
  2027, L. 161-22 impute la réduction « par priorité » sur les pensions de base. Porté
  dans les deux moteurs : l'artisane partie en 2022 qui déclare 60 % du salaire moyen perd
  depuis juillet 2024 112,85 € par mois de sa complémentaire de 428,12 €, en plus de ce que
  perd sa base. Le versement forfaitaire unique : sous quarante points, ou quand la base
  l'a été, les points par le revenu de référence de la date d'effet (articles 39 et 40),
  sans réversion ensuite (article 41, II) ; la seconde pension de 2025 le suit (article
  27). Porté dans les deux moteurs : l'artisane de 2020 à 4 000 €, 15,83 points, reçoit
  284,19 € en une fois en 2022. Aucune instruction ni aucun exemple de la caisse sur le
  cumul plafonné du RCI depuis 2024.
reste: >-
  Une instruction ou un exemple de la caisse qui dise si la complémentaire perd le
  dépassement entier ou une part ; avant 2009, les règlements du RCO (1978) et du NRCO
  (2003) et la circulaire RSI n° 2007-109 ; la réversion du RCI de moins de quarante
  points (article 41, I) et les points du 6 du IV de l'article 7 ; les sections libérales,
  dont des statuts de 2010 et 2011 suspendent aussi la complémentaire avec la base, et
  l'Ircantec et la RCO agricole, toujours servies entières en cumul plafonné ; aux pages,
  la phrase de la complémentaire réduite et du versement de la seconde pension.
