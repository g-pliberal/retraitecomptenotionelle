date: "2026-11-03"
session: "action 177, étape 8 : les non-salariés de Mayotte, leur statut, leurs trimestres, leur assiette minimale"
consulte: >-
  `python scripts/veille_droit.py` : trois fiches à relire, aucune de l'étape. Les index
  LEGI et JORF récupérés et mis à jour (à jour au 2 novembre 2026, un incrément JORF du
  3 novembre) ; `python scripts/textes.py --inscrire` au début : quatorze rédactions
  nouvelles, d'autres textes ; à la fin, les décrets n° 2011-2085 et n° 2019-632, que les
  fiches citent désormais, entiers, « à examiner ». Dans l'index LEGI : l'ordonnance
  n° 2002-411, articles 23-1 (LEGIARTI000025021004, LEGIARTI000025036406,
  LEGIARTI000054468933), 23-3 (LEGIARTI000025021008) et 23-4 (LEGIARTI000025021012,
  LEGIARTI000047453493, LEGIARTI000053279805) ; le décret n° 2003-589, articles 8, 8-0,
  8-1, 31 à 37 dans leurs rédactions du 21 octobre 2012 (dont l'article 32,
  LEGIARTI000026513336), et 4-1, 34 et 36-2 dans celles du 1er janvier 2026 ;
  l'ordonnance n° 96-1122, articles 28-1 et 28-2, toutes leurs rédactions ; le décret
  n° 2011-2085, articles 2-1, 3, 4, 4-1 et 4-2, toutes leurs rédactions (article 4-2 :
  LEGIARTI000038680068, LEGIARTI000053297541) ; le décret n° 2019-632. Dans l'index
  JORF : la notice du décret n° 2019-632, le rapport au Président de la République sur
  l'ordonnance n° 2011-1923. L. 161-17-2 et L. 161-17-3, sans rédaction postérieure à
  celles du 31 décembre 2025 (LEGIARTI000053280889, LEGIARTI000053280903 ; fiche
  `fin_de_la_suspension_2028`). Dans la base de la Cnav : les barèmes « Revenu validant
  un trimestre - Travailleurs indépendants » de Mayotte (version du 23 décembre 2025) et
  de la métropole (15 mai 2026), « Plafonds cumul emploi retraite plafonné -
  Travailleurs indépendants » de Mayotte, et les circulaires n° 2025-04 du 20 janvier
  2025 et n° 2025-34 du 23 décembre 2025.
trouve: >-
  Les non-salariés artisans, commerçants et industriels de Mayotte sont affiliés au
  régime de base de la caisse de Mayotte depuis le 1er juillet 2012, les agricoles
  jusqu'en 2014, les libéraux de L. 631-1 depuis le 23 juillet 2026 (article 23-1), et
  leur pension suit les règles du salarié (article 23-4) : leurs trimestres se valident
  au revenu cotisé, 150 heures du Smic de Mayotte, ce que la circulaire n° 2025-04 écrit
  et que le barème redonne en 2025 (135 €, 10,05 % de 1 347 €). Depuis 2019, leur
  cotisation « ne peut être calculée sur une assiette inférieure à 450 fois » le Smic
  horaire de Mayotte, quatre-vingt-dix jours d'affiliation exigés depuis 2026, au taux
  de 5,85 % en 2019, 0,70 point de plus chaque année jusqu'à 17,75 % en 2036 (décret
  n° 2011-2085, article 4-2). Le barème de 2026 porte 250 € par trimestre, 17,87 % de
  1 399,50 € : le taux de la métropole, quand celui de Mayotte est de 10,75 %. Le statut
  `independant_mayotte`, ses trimestres et son assiette minimale, dans les deux
  moteurs.
reste: >-
  Le taux des non-salariés de 2012 à 2018, qu'aucun texte lu ne dit (l'article 4 du
  décret n° 2011-2085 ne fixe qu'une part salariale et une part patronale), et le
  portage de ceux de l'article 4-2 dans la série des taux, par un récupérateur, comme
  ceux de D. 633-3. Le barème de 2026, à relire à sa prochaine version, et la question
  au propriétaire. La neutralisation des années d'assimilées (décret n° 2003-589,
  article 32), le cumul emploi-retraite au plafond de la caisse (article 34), 2012 comptée
  entière. Les rédactions des textes cités, « à examiner ». L'étape 9 de l'action 177.
