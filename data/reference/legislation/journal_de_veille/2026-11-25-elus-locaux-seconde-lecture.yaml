date: "2026-11-25"
session: "régime des élus locaux : la fiche de leur affiliation, en seconde lecture"
consulte: >-
  L'index LEGI du dépôt, arrêté au 23 novembre 2026 : code de la sécurité sociale,
  L. 351-1, L. 351-14-1 et L. 381-32 dans toutes leurs rédactions ; loi n° 92-108,
  article 32, ses trois rédactions. L'index JORF : loi n° 92-108, sa notice et son
  article 1er ; loi n° 99-586, article 37 ; loi n° 2000-295, article 32, seul porté ;
  décret n° 2002-684, notice ; loi n° 2015-366, article 19 ; loi n° 2016-1088,
  article 9 ; ordonnance n° 2020-1256, article 6 ; décret n° 2023-838, notice ; loi
  n° 2025-1249, article 28 ; loi n° 2026-103, article 198 ; ordonnance n° 2026-648,
  article 2. Les quatre réponses ministérielles et les pages de l'Ircantec, relues.
trouve: >-
  La seconde lecture relève dix constats, recoupés aux sources. La fiche passe à dix
  versions : la loi n° 99-586, publiée le 13 juillet 1999, qui ouvre aux membres des
  établissements de coopération intercommunale le régime général de l'élu qui a cessé
  son activité (L. 5211-14, que L. 381-32 nomme depuis) ; l'article 12 de la loi
  n° 2000-295, publiée le 6 avril 2000, qui l'ouvre au maire de toute commune et à
  l'adjoint d'une commune de 20 000 habitants au moins (notice du décret n° 2002-684).
  La borne de 2002 passe au 1er mars, que l'Ircantec nomme. Un septième écart du statut
  `elu_local`, chiffré : avant 1973, le modèle valide les trimestres de l'indemnité, que
  le droit ne valide pas, faute de régime (maire de 1965 à 1972 : 160 trimestres au
  lieu de 128, 13 369 € de pension au lieu de 7 598 €).
reste: >-
  L. 2123-9 dans ses rédactions, L. 5211-14 avant et après 1999, l'article 41 de la loi
  n° 92-108 et les articles 11 et 11-1 de la loi n° 72-619, que l'index ne porte pas ; la
  règle d'entrée en vigueur des lois d'avant 2004, dont dépendent les bornes de 1999,
  2000 et 2002 ; les affiliations particulières que l'Ircantec date ; deux pratiques
  d'Urssaf et le sort de l'élu salarié qui remplace le maire ; l'intégration au modèle,
  qui attend son tour.
