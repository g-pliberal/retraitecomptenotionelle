date: "2026-10-16"
session: "action 138, étape 10, première partie : plusieurs âges de départ côte à côte, sur le site"
consulte: >-
  Aucun texte : la session n'a touché qu'à l'affichage du site (pages.js, contexte.js), sur
  les indicateurs de cycle de vie que le portage calculait déjà (cycle-de-vie.js, étape 9).
trouve: >-
  Rien de nouveau au droit. Le dépliant « Partir plus tôt ou plus tard » montre, de l'âge
  d'ouverture au taux plein automatique, la pension nette, le remplacement net et après
  impôt, le patrimoine retraite, le rendement réel et l'âge d'équilibre de la génération.
reste: >-
  Les autres points de l'étape 10 : les droits contrefactuels au 31 août 2023, qui
  demanderont de relire la loi n° 2023-270 et la suspension ; le contrôle d'un relevé ;
  l'indice majoré ; le solveur inverse.
