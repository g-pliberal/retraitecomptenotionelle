date: "2026-11-05"
session: "action 158, vague 10, B-bis : les preuves que demande la relecture R-B4 — le compte des échelons, les versions du n° 2009-209, le corps 00653"
consulte: >-
  L'index LEGI du dépôt (incrément 20261102-213929), table doc, toutes les versions des
  articles qui comptent les échelons : n° 94-1016 art. 2 ; n° 2003-676 art. 1er ;
  n° 2003-770 art. 2 ; n° 68-270 art. 6 ; n° 89-750 art. 2 ; n° 90-973 et 90-975 art. 3 ;
  n° 91-13 art. 2 ; n° 91-105 art. 2 ; n° 91-783 art. 3 ; n° 92-413 art. 27 ; n° 2009-208
  art. 5 ; n° 2011-1672, 2011-1673 et 2011-1678 art. 2 ; n° 58-778 art. 2 ; n° 56-448
  art. 9 ; et, sans compte, n° 2013-1146 art. 2, n° 72-420 art. 2, les articles indexés des
  n° 83-1033 et 2011-1676. Le n° 2009-209, art. 1er, ses trois versions. Le Noyau RH :
  corps 00653, grades 01476 à 01478.
trouve: >-
  36 des 45 grades rattachés par le sommet non écrit ont, au statut, un article qui compte
  leurs échelons, et chacun dit n + 1 à chaque version de la période rattachée ; 9 n'en ont
  aucun à l'index. Les trois versions de la grille du n° 2009-209 gardent le sommet (HEB,
  HED, HEE). Le corps 00653 ne cite pas le texte 166 (n° 60-403) : ses grades 01477 et
  01478 le citent, 01476 non.
reste: >-
  Les candidats de R-B4 : les jours sans grille de l'annexe I du n° 94-1016 (1994-2006) ; la
  1re catégorie du n° 92-413, non rattachée à cause de son libellé.
