date: "2026-09-28"
session: >-
  l'action 132, la naissance au jour : la pension prend effet le premier du
  mois qui suit l'anniversaire, sauf pour qui est né un 1er
consulte: >-
  `scripts/veille_droit.py`, et l'index LEGI mis à jour : R. 351-37 du code
  de la sécurité sociale dans ses rédactions de 1985 (LEGIARTI000006749382),
  du 1er septembre 2023 (LEGIARTI000047633235) et du 1er novembre 2026
  (LEGIARTI000054060160) ; L. 90 du code des pensions civiles et militaires
  (LEGIARTI000023034140) ; R. 351-9 ; pour la fenêtre de la surcote
  parentale, L. 351-1-2-1, R. 351-2-1 (LEGIARTI000054589948) et D. 351-1-4
  (LEGIARTI000053356001) ; L. 161-17-2 et L. 161-17-3, qui n'ont pas de
  rédaction postérieure au 31 décembre 2025. La circulaire Cnav n° 2026-07,
  point 1.1 ; la circulaire n° 8/89, point 12 ; la page « Calcul de la
  surcote » de juris-cnracl, relue.
trouve: >-
  La date d'effet est le premier jour d'un mois, et ne précède pas l'âge :
  jusqu'en 2004, R. 351-37 le disait en toutes lettres, « ni au soixantième
  anniversaire » ; la circulaire 2026-07 en tire le premier du mois qui
  suit l'anniversaire — né le 16/05/1964, effet au 01/03/2027 au plus tôt —,
  et L. 90 fait due la pension du fonctionnaire au premier du mois qui suit
  la cessation d'activité. Né un 1er, on a l'âge le jour même : l'exemple 3
  de la surcote de la CNRACL, né le 01/01/1962, a six trimestres, et la
  circulaire 8/89 décompte l'ajournement de la même façon. R. 351-9 ne
  plafonne pas aux trimestres civils écoulés ceux de l'année d'entrée.
  D. 351-1-4 découpe en trimestres civils l'année où l'âge de la surcote
  est atteint ; rien ne découpe ainsi l'année de la surcote parentale.
reste: >-
  La fenêtre de la surcote parentale : aucun texte lu ne la découpe, la
  circulaire qui l'applique n'est pas trouvée, et le modèle, qui la date au
  mois, y perd un trimestre deux mois de naissance sur trois. La pension
  due du jour même de la cessation, pour la limite d'âge et l'invalidité
  (L. 90), que le modèle ne distingue pas. Le plafond que le modèle oppose
  à l'année d'entrée, que R. 351-9 n'écrit pas.
