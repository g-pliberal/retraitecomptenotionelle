date: "2026-10-04"
session: "action 138, étape 2 : la cotisation maladie de 1 % des complémentaires"
consulte: >-
  Index LEGI du dépôt : D. 242-8 du code de la sécurité sociale, ses rédactions de
  1985 à aujourd'hui (en vigueur : LEGIARTI000037456300, 30 septembre 2018), et
  L. 131-2 (LEGIARTI000047453476, 1er septembre 2023). urssaf.fr, « Les revenus de
  remplacement » ; service-public.fr, fiches F2971 et F15396 ; agirc-arrco.fr,
  « En 2026, hausse ou baisse des prélèvements sociaux sur votre retraite ? ».
trouve: >-
  1 % sur les avantages de retraite de L. 131-2 autres que ceux du régime général,
  depuis la rédaction du 30 décembre 1997 (3,80 % avant) ; L. 131-2, 1° vise les
  pensions servies aux assurés du régime général que l'employeur a financées, hors
  majorations pour enfants et pensions d'indépendants. L'Urssaf la dit due aux taux
  médian et plein de CSG, et ajoute 1,30 % en Alsace-Moselle. Ni F2971, ni F15396,
  ni la page de l'Agirc-Arrco ne la mentionnent ; aucun exemple chiffré.
reste: >-
  Ce que l'Ircec, l'Arrco des cultes, les régimes spéciaux et la fonction publique
  prélèvent sur leurs pensions ; un exemple publié du net d'une pension
  Agirc-Arrco ; l'exonération selon le revenu fiscal (D. 242-9), avec le reste de
  l'étape 2.
