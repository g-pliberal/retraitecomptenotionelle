date: "2026-11-22"
session: "action 191 : la réversion d'avant 1982 relue au texte"
consulte: >-
  La base de législation de la Cnav : ordonnance n° 45-2454, article 76
  (ORD_452454_19101945) ; décret n° 71-123, articles 2 et 5
  (DEC_71123_11021971) ; décret n° 71-280 (DEC_71280_07041971) ; circulaires
  Cnav n° 23/71, 4/73, 31/75 et 88/80.
trouve: >-
  Les ressources d'un décès d'avant le 1er mars 1971 s'apprécient à la demande ;
  la condition de mariage est celle de l'ordonnance de 1945 jusqu'au 30 avril
  1971, puis celle du décret n° 71-280 ; l'enfant issu du mariage ne lève la
  durée qu'aux réversions parties après le 18 juillet 1980. Corrigé, avec trois
  tests. Détail :
  docs/feuille_de_route/191/2026-11-22-reversion-d-avant-1982-au-texte.md.
reste: >-
  Le décès de l'assuré avant soixante ans avant 1963 (ancien L. 351-1), non lu.
