date: "2026-10-08"
session: "action 138, étape 17 : les versements uniques des petites pensions"
consulte: >-
  veille_droit.py (dernière veille consignée : 2026-10-08) ; l'index LEGI, mis à jour des
  incréments jusqu'au 7 octobre 2026 (3 incréments, 218 documents), puis textes.py
  --inscrire (aucune rédaction nouvelle) ; dans l'index LEGI : L. 351-9
  (LEGIARTI000006742677), R. 351-26 (LEGIARTI000006749367, LEGIARTI000025749165), le
  décret n° 45-0179, article 72 (LEGIARTI000006760609), L. 161-22-2
  (LEGIARTI000028498063, LEGIARTI000047456834), R. 161-19-1 (LEGIARTI000031986254,
  LEGIARTI000047960988), l'arrêté du 30 décembre 1970, article 25, ses cinq rédactions
  (LEGIARTI000006381638 à LEGIARTI000006381641, LEGIARTI000019511940), et les versements
  forfaitaires des autres régimes que l'index nomme (salariés agricoles, mines, marins,
  Banque de France, Comédie-Française, Mayotte, Saint-Pierre-et-Miquelon) ; dans l'index
  JORF : la loi n° 2014-40, article 44 (JORFARTI000028493878), le décret n° 75-109, sans
  texte d'article ; l'API de la législation de la Cnav : le barème « Montant minimum
  permettant le paiement mensuel de la retraite personnelle », les exposés « Montant de
  la retraite personnelle » et « Modalités de paiement » ; l'accord national
  interprofessionnel du 17 novembre 2017 (article 107), la circulaire Agirc-Arrco n°
  2020-02-DRJ (fiche 5, III.2), les circulaires des coefficients de versement unique n°
  2020-05-DRJ, 2022-15-DRJ, 2023-15-DRJ, 2024-15-DRJ et 2025-21-SG-DRJ, en PDF ; la fiche
  RET-B100 des éditions GERESO ; la brève du Cleiss de décembre 2021 ; les archives de
  l'Internet Archive pour les circulaires de 2019 à 2022.
trouve: >-
  Le seuil du versement forfaitaire unique du régime général est au barème de la Cnav,
  de 175 F au 1er juillet 1974 à 183,01 € au 1er janvier 2026, chaque date avec son
  arrêté ou sa circulaire : quinze fois la pension annuelle, avantages complémentaires
  compris, quand elle passe dessous (R. 351-26). La loi n° 2014-40 abroge L. 351-9 pour «
  les assurés dont l'ensemble des pensions prend effet à compter du 1er janvier 2016 »
  ; la Cnav le garde à « l'assuré dont la 1re retraite prend effet avant 2016 », et
  revalorise encore le seuil : TRAJECTOiRE, qui le garde à tous, a tort. Le versement «
  était payé seulement sur accord de l'assuré » (circulaire Cnav n° 62/93). L'accord du
  17 novembre 2017 (article 107) verse en capital l'allocation de l'Agirc-Arrco «
  inférieure ou égale » à l'équivalent de cent points, sa valeur viagère, et supprime
  la réversion ; ses circulaires des coefficients écrivent « inférieur à ». Avant 2019,
  la fiche RET-B100 donne l'Arrco jusqu'à cent points, l'Agirc sous cinq cents, la même
  table que Destinie 2, et date le dispositif du 1er janvier 2004. L'Ircantec verse les
  points au salaire de référence de l'année d'avant, sous 500 points jusqu'en 1975, sous
  100 jusqu'en septembre 2008, sous 300 depuis ; versé à l'agent, le capital supprime le
  droit du conjoint depuis 1971. Les trois fiches sont écrites, lues par les deux
  moteurs ; les réversions de l'Agirc-Arrco (depuis 2019) et de l'Ircantec (toujours)
  ne suivent plus un capital ; le cliquet des textes descend à 9 890.
reste: >-
  La loi n° 75-3 et le décret n° 75-109 au Journal officiel en images, pour la rente
  d'avant juillet 1974 ; les tables de coefficients de l'Agirc-Arrco de 2019 et de 2022
  (circulaire n° 2021-9-DRJ), que le site ne sert plus ; les accords de l'Arrco et de
  l'Agirc d'avant 2004 ; la réversion versée en capital, et le remboursement des
  cotisations de L. 161-22-2 ; les versements forfaitaires des régimes alignés et
  spéciaux ; une décision du conseil d'administration de l'Ircantec sur son seuil.
