date: "2026-11-20"
session: "action 191 : étape 2 de la note 0009, les droits contrefactuels en couches, les deux copies de l'âge légal retirées"
consulte: >-
  python scripts/veille_droit.py, le 20 novembre 2026 : rien de neuf sur
  L. 161-17-2 ni sur D. 161-2-1-9. Dans l'index LEGI (à jour au 16 novembre
  2026), seconde lecture des versions de 1985 à 2011 de la fiche
  age_legal_par_generation : R. 351-2 (LEGIARTI000006749340,
  LEGIARTI000024113000), L. 161-17-2 (LEGIARTI000023030935,
  LEGIARTI000025014605), D. 161-2-1-9 (LEGIARTI000023388636,
  LEGIARTI000025089933).
trouve: >-
  Les versions soixante_ans, loi_de_2010 et loi_de_2011 disent les âges et
  les dates de ces textes. Les deux droits contrefactuels deviennent des
  piles de couches, qui gardent dans la fiche de l'âge légal la version
  d'avant la réforme écartée ; les deux copies d'avant réforme de l'âge
  légal sont retirées. Témoins identiques. Un résultat bouge sous la loi de
  2023 sans la suspension : l'âge légal lu à une date d'avant le 1er
  septembre 2023 est celui de la loi de 2011, et non plus celui de la loi de
  2023. Détail dans
  docs/feuille_de_route/191/2026-11-20-etape-2-age-legal-les-droits-contrefactuels-en-couches.md.
reste: >-
  Le point d'arrêt de la note 0009 : le propriétaire décide de l'étape 3. La
  fiabilité de l'âge légal sous un droit contrefactuel, passée de haute à
  certifiee. Les fiches qui déclarent une réforme écartée et que les couches
  déclarent hors d'elles. Aucun exemple officiel pour les versions d'avant
  le 1er juillet 2011.
