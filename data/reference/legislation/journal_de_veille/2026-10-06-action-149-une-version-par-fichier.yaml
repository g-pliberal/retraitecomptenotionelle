session: "action 149 : une version de l'architecture par fichier"
consulte: >-
  Aucune source de droit : la session ne touche ni au scénario 1 ni à une règle.
  L'historique de main, les 62 commits de docs/architecture.md, pour mesurer ce que
  l'ajout d'une version y met en conflit.
trouve: >-
  Aucun texte de droit. Les 34 commits qui touchent la liste des versions ou son
  en-tête y ajoutent chacun une version ; rejoués deux à deux comme menés en
