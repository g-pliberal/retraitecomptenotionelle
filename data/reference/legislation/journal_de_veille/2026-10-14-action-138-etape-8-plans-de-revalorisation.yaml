date: "2026-10-14"
session: "action 138, étape 8 : les montants de la MSA de 2015 à 2017 et de 2019, l'Info presse du 14 février 2023, les plans de revalorisation de 1994 à 2002"
consulte: >-
  Dans l'index JORF, récupéré le même jour : le décret n° 97-163 du 24 février 1997,
  articles 1er à 4, et son rectificatif ; le décret n° 99-141 du 3 mars 1999, articles
  1er et 3 ; le décret n° 2000-261 du 22 mars 2000, articles 1er, 3 et 6 ; le décret
  n° 2001-170 du 21 février 2001, articles 3 et 5 ; les décrets n° 2002-297 (articles 4,
  8 à 11 et 15) et n° 2002-298 (articles 3 et 4) du 1er mars 2002. Dans l'index LEGI :
  L. 732-54-1 à L. 732-54-4 dans leur rédaction du 29 décembre 2001, D. 732-110 à
  D. 732-120 et D. 732-141 à D. 732-147 dans leurs rédactions de 2005 à 2009. Hors des
  index : l'Info presse de la MSA du 14 février 2023 (msa.fr), la page de la MSA
  d'Auvergne sur la revalorisation, les réponses ministérielles n° 19099, 26987, 31497,
  103528 et 102490, l'article de Cerfrance de 2019, le tableau de bord des retraites des
  non-salariés agricoles du quatrième trimestre 2021 (statistiques.msa.fr).
trouve: >-
  L'Info presse du 14 février 2023 est à
  msa.fr/lfp/documents/11566/282945655/ : « soit un montant de 1 138,63€ net par mois »,
  que le récupérateur du SMIC net agricole relit désormais, 2023 passant à certifiée.
  Aucun montant de la MSA pour 2015 à 2017 ni pour 2019 : ni ses pages, ni les réponses
  ministérielles, qui ne donnent que les pourcentages, ni son tableau de bord ; la page
  d'Auvergne ne porte plus que 2026 ; l'archive du web refuse la connexion. Les plans :
  le décret n° 97-163 porte la retraite proportionnelle du chef parti depuis 1997 au
  taux plein, dix-sept ans et demi de chef, à 26,933 points par année de chef,
  trente-sept et demie au plus, servis au tiers en 1997 et aux deux tiers en 1998,
  minorés sous vingt-deux ans et demi (15, 15, 20, 20, 20 %, puis 15, 15, 10, 10, 10 %
  en 2000) ; 29,23 en 2001 sans minoration ; depuis 2002, A = (MV1 - AVTS) / (37,5 x
  VP), qui porte une carrière complète au minimum vieillesse, et C = (MV2 - AVTS) /
  (37,5 x VP) pour le chef de moins de dix-sept ans et demi. La codification de 2005
  écrivait « 35,5 » dans D. 732-144, corrigé le 12 octobre 2006. Servi dans les deux
  moteurs (fiche majoration_retraite_proportionnelle).
reste: >-
  Un montant de la MSA pour 2015 à 2017 et 2019 (Chiffres utiles, archive du web). Des
  plans : les pensions d'avant 1997 révisées (article 2 du décret, D. 732-114 à
  D. 732-117), le service au tiers puis aux deux tiers et les relèvements suivants des
  pensions déjà liquidées ; les points des conjoints et des aides familiaux (plan de
  1994, D. 732-118 à D. 732-131, D. 732-145) ; la majoration de la retraite forfaitaire
  de L. 732-54-3. Un exemple chiffré publié d'une pension portée au minimum de points.
