date: "2026-10-31"
session: "action 175, étape 2 : la fin, les micro-entrepreneurs d'avant 2017, l'Acre, l'activité de faible importance"
consulte: >-
  La base de législation de la Cnav : la grille « Micro-entrepreneurs - Validation de
  trimestres retraite » (Info-doc RSI du 16 avril 2019) et la table des taux globaux de
  2009 à 2019, jointes aux barèmes des micro-entrepreneurs ; la table « Plafonds
  d'exonération ZFU / ZRU / ACCRE » et celle de l'Accre des micro-entrepreneurs de 2013 à
  2019 ; le barème et la table du plafond de ressources de l'activité de faible
  importance des commerçants et des artisans retraités avant 2004 ; les exposés « Aide aux
  chômeurs créateurs d'entreprise », « Activités non soumises à cessation » et « Limites
  du cumul ».
trouve: >-
  La grille de 2009 à 2015 est celle du modèle, à l'arrondi près, sauf le plancher de 2009
  et, en 2015, un trimestre que la grille valide sous les 300 heures de la compensation
  quand la circulaire RSI n° 2015/007, que le modèle suit, n'en valide rien : un écart
  entre deux sources de la caisse, passé à la session du modèle. Deux limites déclarées :
  l'Accre et l'Acre, que le modèle n'applique pas ; l'activité de faible importance,
  qu'il ne distingue pas de la reprise d'activité. L'étape 2 est faite.
reste: >-
  Les écarts de l'étape, à la session du modèle (note de l'étape, « À la session du
  modèle ») ; le revenu validant des indépendants de Mayotte, à l'étape 4.
