date: "2026-10-08"
session: "action 138, étape 17, dixième partie : la majoration de l'Agirc-Arrco pour enfants à charge"
consulte: >-
  Hors des index, que ne portent ni les accords de l'Agirc et de l'Arrco ni leurs
  circulaires : l'accord national interprofessionnel du 17 novembre 2017, articles 93 à
  96 ; l'accord du 8 décembre 1961, annexe A, article 17, et la convention collective
  nationale du 14 mars 1947, annexe I, article 6 bis, dans leur rédaction de 2012 ; le
  recueil des accords paritaires (accord du 25 avril 1996, articles 11 à 13 ; accord du 18
  mars 2011, articles 7 et 8) ; la circulaire Agirc-Arrco n° 2020-02-DRJ, fiche 4, sur le
  site de l'Agirc-Arrco.
trouve: >-
  L'Arrco majore de 5 % l'allocation du participant pour chaque enfant à charge à la date
  de liquidation « et aussi longtemps que l'enfant reste à charge », à compter du 1er
  janvier 1999, sans cumul avec la majoration pour enfants élevés (accord du 25 avril
  1996, articles 12 et 13) ; l'Agirc à compter du 1er janvier 2012 (accord du 18 mars
  2011, article 8) ; depuis, l'une et l'autre servent « 5 % des droits bruts de l'ensemble
  de la carrière par enfant à charge », la plus élevée des deux majorations (annexe A,
  article 17 ; annexe I, article 6 bis), puis l'Agirc-Arrco (accord du 17 novembre 2017,
  articles 95 et 96). L'enfant à charge a moins de dix-huit ans, de dix-huit à vingt-cinq
  ans s'il étudie, est apprenti ou demandeur d'emploi non indemnisé, ou il est invalide
  avant vingt et un ans (article 93) ; la majoration se calcule « sans tenir compte des
  coefficients d'anticipation », n'est « pas plafonnée », cesse « au fur et à mesure » que
  les enfants cessent d'être à charge, et, à montant égal, la majoration pour enfants nés
  ou élevés est servie (circulaire n° 2020-02-DRJ). Une fiche la sert, dans les deux
  moteurs, et la revalorisation la retire à chaque échéance. La même circulaire calcule la
  majoration pour enfants nés ou élevés sans les coefficients d'anticipation, que le
  modèle compte.
reste: >-
  La majoration pour enfants nés ou élevés sur les droits sans le coefficient
  d'anticipation ; l'enfant de dix-huit à vingt-cinq ans qui étudie, et l'enfant invalide,
  que la saisie ne porte pas ; la définition de l'enfant à charge d'avant 2019 et les
  règlements des caisses de l'Arrco d'avant 1999. De l'étape 17, ensuite : la majoration
  pour conjoint à charge.
