date: "2026-10-11"
session: "action 138, étape 17, suite : quatre textes que l'index ne garde qu'en notice, lus au fac-similé du Journal officiel depuis le poste du propriétaire"
consulte: >-
  Le script de veille, puis Légifrance depuis le poste du propriétaire, dans le
  navigateur de l'application : les notices et les fac-similés — version papier numérisée,
  en accès protégé par une question que le propriétaire a résolue lui-même — des Journaux
  officiels du 3 mars 1948, du 25 février 1949, du 24 avril 1965 et du 19 avril 1970 ;
  les articles L. 161-17-2 et L. 161-17-3 du code de la sécurité sociale, la fin de la
  suspension, le serveur de la DILA refusant ses incréments.
trouve: >-
  Le décret n° 48-361 porte la rémunération maximum soumise à cotisation à 228 000 F par
  an ; la loi n° 49-244 (article 2) borne pour 1949 toute pension ou rente de vieillesse
  revalorisée à 40 % de ce chiffre limite, 91 200 F, le premier maximum du barème de la
  Cnav, sans majoration pour l'ajournement, que le modèle applique : l'écart est déclaré
  dans la fiche pension_maximale_regime_general. Le décret n° 65-315 insère dans L. 332
  les anciens déportés et internés, comme la fiche le tenait de la circulaire n° 47 SS ;
  le décret n° 70-342 ouvre aux salariés agricoles la révision de leur pension à compter
  du 1er mai 1965, la date du régime général, sur demande. L. 161-17-2 et L. 161-17-3
  restent en vigueur depuis le 31 décembre 2025, sans version à venir.
reste: >-
  Les décrets du maximum de 1950 à 1971 et la loi n° 48-1306 du 23 août 1948, puis, s'ils
  disent comme la loi de 1949, ne plus majorer le maximum par l'ajournement avant 1972 ;
  la date où les artisans et les commerçants ont reçu le taux plein des anciens déportés ;
  les dix fiches que le script de veille dit à relire, dont plusieurs attendent aussi un
  fac-similé.
