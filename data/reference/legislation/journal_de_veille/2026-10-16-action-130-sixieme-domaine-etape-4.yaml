date: "2026-10-16"
session: "action 130, sixième domaine, étape 4 : les exemples des circulaires Cnav 2016-41 et 2024-18, rejoués dans les deux moteurs"
consulte: >-
  La circulaire Cnav n° 2016-41 du 17 octobre 2016 (annexe, exemples 1 à 4) et la
  circulaire Cnav n° 2024-18 du 11 avril 2024 (point 3.2.2, exemples 1 à 4),
  téléchargées le jour même de la base documentaire de la Cnav
  (legislation.lassuranceretraite.fr) et lues en texte ; les fiches apprentissage et
  stages_formation_professionnelle. L'index LEGI n'est pas remis à jour,
  l'inscription des textes ayant été faite ce jour.
trouve: >-
  Les huit exemples sont reproduits par les deux moteurs : les trimestres garantis
  des contrats d'apprentissage (D. 373-3), le complément et les trimestres cotisés de
  l'exemple 4 (D. 373-4) ; les cinquante jours de stage, sans report, le stage
  commencé en 2014 compté de 2015, et le plafond de quatre trimestres. Deux fautes
  de plume des circulaires : la fin du contrat de l'exemple 3 de la 2016-41 (« 14
  février 2015 » pour 2016), et les « 88 jours » de l'exemple 1 de la 2024-18, que
  le calendrier compte 87. Aucune ne change le résultat publié.
reste: >-
  Ce que l'étape 1 a laissé à relire, inchangé : une circulaire de la Cnav sur
  l'apprentissage postérieure à 2022, l'arrêté du 5 juin 1979, les décrets du
  financement des stages, une circulaire sur les sportifs, le décret n° 2026-425, la
  MSA pour les apprentis agricoles.
