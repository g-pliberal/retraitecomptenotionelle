date: "2026-10-18"
session: "action 138, étape 9, suite de la huitième partie : les taux du non-résident de la SNCF et des mines, dans le paquet du site"
consulte: >-
  Aucune source de droit relue : la session ne touche à aucune règle du
  scénario 1, seulement au paquet que le site lit, qui ne portait pas les
  taux du non-résident déjà écrits (L. 131-9 ; décret n° 2007-1056, art. 7,
  IV, second alinéa ; décret n° 46-2769, art. 91, tels que la note du
  16 octobre les cite).
trouve: >-
  Aucune règle n'a changé. Le paquet du site porte les taux du non-résident
  de la SNCF et des mines : l'agent de la SNCF résidant en Espagne, que la
  France soigne, paie sur le site ce que le Python lui prend, 3,90 % de sa
  pension sous le plafond et 3,20 % au-delà.
reste: >-
  Le plafond de moitié avec la réversion de la SNCF ; le plafond de la SNCF
  de 2027.
