date: "2026-09-23"
session: "action 89, IEG : la durée requise par ancienneté active"
consulte: >-
  Dans l'index LEGI : l'article 45 de l'annexe 3 du statut des IEG dans sa
  version en vigueur (6 août 2025) et dans celle du 3 décembre 2020, et son
  article 16.
trouve: >-
  Cinq tables et non quatre au I bis — cinq, huit, onze, quatorze et
  dix-sept ans de services actifs —, et un renvoi, pour les générations
  antérieures, à la table d'avant le décret n° 2023-692, qui est celle de
  2014 et non l'actuelle du I. Le cas type, parti à l'âge légal abaissé de
  cinq ans, relève des dix-sept ans : un agent né en 1968 doit 170
  trimestres, le modèle lui en demandait 172.
reste: >-
  Le compte des années actives, sans lequel les quatre autres tables ne
  servent pas ; la table des sédentaires ; l'âge d'ouverture de la fiche
  face à la suspension de 2026.
