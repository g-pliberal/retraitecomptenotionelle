date: "2026-09-29"
session: >-
  l'action 130, la première étape du troisième domaine, les départs
  multiples et la vie après le départ, ouvert à la demande du propriétaire
consulte: >-
  `scripts/veille_droit.py` ; les index LEGI et JORF récupérés puis mis à
  jour au 29 septembre 2026 : aucun texte de retraite paru depuis le 28, hors
  un arrêté individuel d'admission à la retraite ; L. 161-17-2 et
  L. 161-17-3 sans rédaction postérieure au 31 décembre 2025. Lus pour le
  domaine : l'article 19 de la loi n° 2014-40 et l'article 26 de la loi
  n° 2023-270, en entier ; L. 161-22 (rédactions de 2025 et de 2027),
  L. 161-22-1 A, L. 161-22-1, L. 161-22-1-1 et L. 161-22-1-2 dans leurs
  rédactions ; L. 161-22-1-5, D. 161-2-24, R. 161-19-6, D. 161-2-24-3,
  R. 161-19-7 ; L. 351-15 (1988 et 2022) ; D. 161-2-22-1, R. 161-19-2 et
  R. 161-19-4 ; L. 24 et L. 25 du code des pensions (2023) ; l'article 6 du
  décret n° 2004-569 (RAFP) dans ses trois rédactions, et son article 8 ;
  l'article 16 de l'arrêté du 30 décembre 1970 (Ircantec) ; L. 351-10,
  L. 351-10-1, L. 173-2, R. 173-7, R. 173-8, D. 173-21-4 ; L. 17 du code
  des pensions (2023).
trouve: >-
  Chaque régime sert sa pension à sa date : le RAFP n'ouvre qu'à l'âge
  légal, soixante ans avant le 3 juin 2011 ; l'Agirc-Arrco et l'Ircantec
  peuvent devancer le régime de base de dix ans, sous coefficient. Depuis
  les premières pensions de 2015, l'activité qui suit n'ouvre plus de droits
  (L. 161-22-1 A), la pension militaire exceptée par L. 84 du code des
  pensions ; depuis le 1er septembre 2023, pour tous sur les périodes
  accomplies depuis le 1er janvier 2023, sauf le cumul intégral, qui ouvre
  une seconde pension au taux plein, plafonnée à 5 % du plafond de la
  sécurité sociale (D. 161-2-22-1) ; pour les premières pensions de 2027, le
  cumul change selon l'âge, et la rédaction de L. 161-22-1-1 ne porte plus
  le plafond. La retraite progressive s'ouvre à soixante ans pour les
  pensions prenant effet depuis le 1er septembre 2025 (décret n° 2025-681).
  Le minimum contributif exige d'avoir fait valoir ses pensions depuis
  2012 (L. 351-10-1), s'écrête sur les pensions servies au mois de son
  effet et se révise quand elles changent (R. 173-7, R. 173-8).
reste: >-
  Aucun exemple chiffré publié d'un polypensionné liquidant à deux dates ;
  la durée d'assurance de la retraite progressive au régime général, que
  l'index ne donne pas ; les rédactions de L. 351-15 de 2003 à 2018, de
  L. 84 à L. 86 du code des pensions et de L. 634-6 et L. 643-6 ; la
  circulaire Cnav qui a appliqué L. 161-22-1 A ; R. 351-29 (le salaire de la
  seconde pension).
