date: "2026-10-28"
session: >-
  action 138, étape 4, au site : ce que les notes du site du 28 octobre ont vu en chemin
  sur les cartes — le motif de la ligne écrêtée, la réversion révisable sans révision,
  « à partir d'août », le minimum que la réversion ne compte pas, la composition sous le
  montant du système 1
consulte: >-
  Aucun texte neuf : l'étape ne touche à aucune règle et dit ce que le modèle rend
  (R. 353-1, R. 353-1-1 ; circulaire Cnav n° 2007-35, § 222 ; L. 345 ancien et L. 341-15 ;
  notes `2026-10-24-etape-4-revision-avant-sa-retraite.md`,
  `2026-10-24-etape-4-plancher-de-la-pension-substituee.md`,
  `2026-10-25-etape-4-majorations-comparees-au-plancher.md`).
trouve: >-
  Rien de neuf au droit. Le plafond du ménage, que la ligne dit depuis le champ que le
  modèle a écrit dans la même vague (`plafond_du_menage`), règle le motif ; la dernière
  révision (`derniere_revision`) dit jusqu'à quand la réversion reste révisable, même sans
  révision ; le libellé de l'avantage nomme le minimum que la réversion ne compte pas ; la
  pension que chaque régime sert aujourd'hui (`aujourd_hui`) compose le montant du
  système 1.
reste: >-
  Rien pour la veille. Au site, les moments examinés ; au modèle, la majoration pour
  enfants servie aujourd'hui, régime par régime (note
  `2026-10-28-etape-4-vu-en-chemin-au-site.md`).
