date: "2026-10-07"
session: "action 138, étape 3, première partie : la part des reportés en emploi, lue dans les évaluations de 2010"
consulte: >-
  Aucune source de droit : la session ne touche ni au scénario 1 ni à une règle,
  mais à une hypothèse de la page Coût. Les trois évaluations du recul de l'âge
  légal de 60 à 62 ans : IPP, rapport n° 61, novembre 2025 (ipp.eu, Rapport-61.pdf
  et sa synthèse) ; Rabaté et Rochut, COR, séance du 19 octobre 2016, document
  n° 11 (cor-retraites.fr, doc-3747.pdf) ; Insee Analyses n° 30, janvier 2017
  (insee.fr/fr/statistiques/2546882).
trouve: >-
  Aucun texte de droit. Des assurés que le recul de 2010 a fait attendre, la moitié
  est restée en emploi et un quart a touché le chômage (IPP, échantillon
  interrégimes de cotisants) ; 37 % en emploi sur les données de la Cnav, 63 % des
  hommes et 73 % des femmes sur l'enquête Emploi, dont le champ écarte invalides et
  allocataires de l'AAH. La part par défaut passe de 1 à 0,5.
reste: >-
  Le reste de l'étape 3 : la décomposition de l'Ageing Report, le levier de l'âge,
  la CSG effective, les contrôles d'Ancetre, les retraités par régime ; la décision
  du conseil d'administration de l'Agirc-Arrco du 14 octobre 2026.
