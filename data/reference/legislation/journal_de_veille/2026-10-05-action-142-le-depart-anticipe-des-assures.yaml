date: "2026-10-05"
session: "action 142 : le départ anticipé des assurés handicapés, au scénario 1 et sur le site"
consulte: >-
  scripts/veille_droit.py. L'index LEGI du dépôt, incréments jusqu'au 27 septembre
  2026, la DILA refusant toujours les suivants : L. 351-1-3 du code de la sécurité
  sociale dans ses cinq rédactions (2003 à 2023), D. 351-1-5 dans ses sept (2004 à
  septembre 2026, décret n° 2026-345), D. 351-1-6 dans ses quatre, D. 351-1-7 et
  D. 351-1-8, L. 351-8, R. 351-24-3, R. 815-1, L. 161-21-1, L. 634-2 et L. 742-3
  du code rural ; au code des pensions civiles et militaires L. 14, L. 24, D. 14,
  R. 33 bis et R. 37 bis ; le décret n° 2003-1306 (articles 20, 24 bis et 25), le
  décret n° 2004-1056 (16, 20 bis et 22 bis), le décret n° 2023-435 (article 13,
  dans ses rédactions de 2023 et de 2026) ; l'arrêté du 30 décembre 1970 (article
  16) ; le règlement de la RCI (article 12). La base législative de la Cnav : la
  circulaire n° 2026-18 du 15 juin 2026, et les circulaires parues depuis le
  4 octobre, aucune — la dernière est la n° 2026-31 du 30 septembre. La fiche
  F16337 de service-public.gouv.fr.
trouve: >-
  Le barème du départ : la durée cotisée en situation de handicap, la durée requise
  diminuée de 60 à 100 trimestres de 55 à 59 ans ; la durée validée aussi, diminuée
  de 40 à 80, jusqu'au 31 août 2023 ; un trimestre ou trois de plus retranchés aux
  nés avant 1973 de septembre 2023 à août 2026 (I bis), puis la durée d'avant la loi
  du 14 avril 2023 de ces générations ; 80 % d'incapacité jusqu'en 2014, 50 %
  depuis ; le taux plein (L. 351-8, 4° bis) ; la majoration du tiers du rapport,
  arrondie au centième, sous la pension entière, que la Cnav ajoute au minimum
  contributif sans l'y comparer. Au fonctionnaire, le même barème (R. 37 bis, le
  décret n° 2023-435 retranchant de même), la majoration sur ses services (R. 33
  bis) et aucun coefficient de minoration à tout âge (L. 14, I ; D. 14). L'Ircantec
  (article 16, 1°, b) et la RCI (article 12, b) sans coefficient. Depuis 2015,
  l'incapacité de 50 % donne aussi le taux plein à l'âge légal (1° ter), puis à
  soixante-deux ans (2°, depuis septembre 2023), et l'ASPA au même âge (R. 815-1).
  D. 351-1-7 et D. 351-1-8 portent sur l'enfant handicapé et sur L. 351-1-4.
reste: >-
  Les départs des régimes que la fiche ne nomme pas (L. 732-18-2 du code rural,
  L. 643-3 et L. 653-2, les décrets des régimes spéciaux) ; la qualité de
  travailleur handicapé d'avant 2016 et la commission de L. 161-21-1 ; la retraite
  anticipée fictive de la circulaire, § 4 ; la réversion sur la pension non majorée ;
  la durée de L. 13, III, du fonctionnaire qui part avant soixante ans ; la
  circulaire de la Cnav qui appliquait la version de 2015.
