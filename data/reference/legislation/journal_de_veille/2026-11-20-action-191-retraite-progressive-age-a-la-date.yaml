date: "2026-11-20"
session: "action 191 : la retraite progressive lit l'âge légal à la date de la demande"
consulte: >-
  Par l'index LEGI : D. 161-2-24 (LEGIARTI000047961574), L. 161-22-1-5
  (LEGIARTI000048697292), L. 351-15 (LEGIARTI000044629917), D. 161-2-1-9
  (LEGIARTI000025089933, LEGIARTI000047634502).
trouve: >-
  L'âge de la retraite progressive est l'âge légal que la loi oppose à
  l'assuré à la date d'effet de la demande, abaissé de deux ans ; le moteur
  lisait celui sous lequel le droit à la retraite s'ouvrira. Corrigé dans
  progressive.js ; la fiche retraite_progressive le dit.
  Détail : docs/feuille_de_route/191/2026-11-20-retraite-progressive-age-a-la-date.md.
reste: >-
  Les autres lecteurs de l'âge légal de la personne : la substitution de la
  pension d'invalidité, la surcote depuis l'âge légal, la bonification du
  cinquième. Un exemple publié de l'âge de la retraite progressive par
  génération.
