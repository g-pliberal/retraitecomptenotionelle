date: "2026-10-09"
session: "action 138, étape 17, onzième partie : la majoration pour conjoint à charge"
consulte: >-
  Dans l'index LEGI : L. 351-13, ses deux rédactions (1985, 2010) ; le décret n° 45-0179,
  articles 72-2 à 72-4 (1975 à 1985) ; R. 351-31, R. 351-32 et R. 351-33, de 1985 à 2011.
  Dans l'index JORF : la notice du décret n° 64-307 du 4 avril 1964. Hors des index : les
  circulaires Cnav n° 31/75, n° 2007-31 et n° 2011-9, et les barèmes « Majoration pour
  conjoint à charge » (montant et plafond de ressources), par la base de législation de
  la Cnav.
trouve: >-
  La pension du régime général est majorée quand le conjoint à charge a soixante-cinq
  ans, ou soixante s'il est inapte, ne bénéficie d'aucun avantage de vieillesse ou
  d'invalidité — un complément différentiel sinon — et n'a pas de ressources qui, avec
  la majoration, passent le plafond de l'allocation aux vieux travailleurs salariés
  (article 72-2, puis R. 351-31) ; due dès l'entrée en jouissance de la pension si les
  conditions sont remplies, sinon du mois qui suit (R. 351-33). Le barème va de 14 500
  anciens francs au 1er juillet 1948 à 4 000 F au 1er juillet 1976, 609,80 € depuis
  2002, sans revalorisation. Entière avant le 1er mars 1975, elle se proratise ensuite
  en 150es de la durée du régime général (circulaire n° 31/75 ; article 72-3, puis R.
  351-32), puis, depuis le décret n° 2007-56, sur la durée qui proratise la pension
  (circulaire n° 2007-31). La loi n° 2010-1330 la supprime à compter du 1er janvier 2011
  et la maintient à qui l'avait au 31 décembre 2010 : elle n'est pas attribuée à la
  pension d'avant 2011 dont le droit s'ouvre depuis (circulaire n° 2011-9). Une fiche la
  sert, dans les deux moteurs, au conjoint que la saisie déclare avec ses ressources, et
  la revalorisation la sert nominale à chaque échéance.
reste: >-
  Le texte d'avant 1975, dont l'index ne garde que des notices, et la majoration de 50 F
  du conjoint de moins de soixante-cinq ans ; le conjoint inapte, son décès et le divorce,
  que la saisie ne porte pas ; les ressources d'une autre nature qu'une pension, sous le
  plafond ; les salariés agricoles, les artisans et les commerçants, dont les textes l'ont
  reprise.
