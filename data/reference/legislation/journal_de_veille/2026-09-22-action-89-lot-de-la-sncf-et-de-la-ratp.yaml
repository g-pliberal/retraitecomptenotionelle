date: "2026-09-22"
session: "action 89, lot de la SNCF et de la RATP"
consulte: >-
  Dans l'index LEGI du dépôt, à jour de l'incrément du 21 septembre 2026 :
  les versions successives des articles 13, 15, 35 et 37-1 du décret
  n° 2008-639 (SNCF) et des articles 6, 24, 51 et 51-1 du décret
  n° 2008-637 (RATP), et l'article 45 de l'annexe 3 du statut des IEG. Au
  JORF de 2025 et 2026, tout texte qui cite ces trois décrets, et
  l'article 105 de la loi du 30 décembre 2025. Chez les caisses : les
  pages « Comprendre ses droits », « Simuler sa retraite » et « Réforme
  des retraites 2023 » de la CPRPSNCF ; les pages publiques de la CRP RATP,
  qui ne publient pas la règle de la décote.
trouve: >-
  TROIS ÉCARTS, LES MÊMES DANS LES DEUX RÉGIMES. L'âge de référence de la
  décote est fixé à cinquante-sept ans pour la conduite et le personnel
  roulant depuis 2025, et les fiches le faisaient monter jusqu'à
  cinquante-neuf : huit trimestres de décote de trop pour un agent né en
  1980. Chacun a sa table de durée requise, que la suspension de 2026 n'a
  pas touchée ; la SNCF compte en outre la décote par la durée sur une
  cible abaissée de deux à dix trimestres. Et la surcote ne se compte
  qu'au-delà d'un âge propre, soixante-quatre ans à compter de la
  génération 1970, là où le modèle partait de l'âge d'ouverture. Les trois
  sont corrigés dans les deux moteurs. Aux IEG, la table de durée requise
  qu'on croyait devoir brancher est celle des sédentaires : l'agent actif
  du cas type relève du I bis, quatre tables selon ses années de services
  actifs.
reste: >-
  La table des agents sédentaires de la SNCF, qu'aucune fiche ne
  modélise ; les carrières longues des deux régimes (VI de l'article 37-1,
  VIII de l'article 51-1) ; les tables par ancienneté active des IEG ; la
  fiche des mines. Aucun exemple chiffré publié par les deux caisses n'a
  été trouvé à transcrire en témoin.
