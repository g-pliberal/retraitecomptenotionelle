date: "2026-10-18"
session: >-
  action 151, étape 11, au site : la page dit la fin de l'emploi à la limite d'âge
  dans les mots du statut de l'agent des IEG, du personnel de l'Opéra, de l'agent de
  la SEITA et de celui de la Banque de France, lus dans `radiation(moteur, carriere)`
consulte: >-
  Aucun texte neuf : l'étape ne touche à aucune règle et reprend les mots que les
  fiches des étapes 6, 8 et 9 citent (`limite_age_ieg`, versions `decret_de_1954` et
  `decret_de_2008`, `limite_age_opera`, `limite_age_seita`,
  `limite_age_banque_de_france`).
trouve: >-
  Rien de neuf au droit. Le maintien présumé du mineur (`limite_age_mines`) ne
  force jamais la radiation, et la page n'a pas de place où le dire.
reste: >-
  Au propriétaire, où la page dit le maintien du mineur (note de l'étape 11) ; au
  modèle, ce que la note de l'étape 10 garde à lire pour la SNCF, la RATP et la
  Banque avant 2010 et 2012.
