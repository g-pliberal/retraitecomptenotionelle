date: "2026-11-03"
session: "action 158, file B2-ter : ce que la relecture R-B2-bis des durées d'échelon laisse (n° 83-1260, art. 34 ; le 22e refus ; la règle du quart dans un autre article ; deux coquilles ; le trou du motif), rouvert au LEGI et au JORF (commits ddde684 à d75b842, et la note)"
consulte: >-
  Aucune règle du scénario 1 n'est écrite : les durées d'échelon ne servent pas au calcul.
  L'index LEGI publié du dépôt, à jour au 2 novembre 2026 (incrément 20261102-213929), et
  l'index JORF publié, à jour au 3 novembre 2026 (incrément 20261103-002311), récupérés sans
  reconstruction. Au LEGI : n° 83-1260, art. 34 (LEGIARTI000027940471 et 27940483) ;
  n° 96-1113, art. 14 (ses trois versions) ; n° 91-45, art. 6 et 32 ; n° 91-936, art. 6 et
  29 ; les articles des textes des 36 tableaux à moyenne seule ; n° 67-715, art. 13 ; tous
  les articles de l'index que le motif des durées ne retient pas, 102 versions relevées. Au
  JORF : décret n° 90-685 du 27 juillet 1990 (art. 5, notice, visas) ; les 26 textes publiés
  du 8 janvier 1984 au 3 août 1990 qui citent le n° 83-1260 ou les EPST, dont n° 88-1072 et
  n° 89-74 (notices) ; les 57 articles du n° 83-1260 publiés le 7 janvier 1984 (vides) ;
  décret n° 2020-1435 du 23 novembre 2020 (art. 1 à 12, notice) ; les textes qui citent le
  n° 96-1113 depuis le 26 novembre 2020, dont le décret n° 2021-1392 (notice, art. 157) ;
  décret n° 2007-1185 du 3 août 2007 (art. 3, 10, 11) ; décret n° 2008-319 du 4 avril 2008
  (art. 2, 6) ; n° 67-715 (titre).
trouve: >-
  N° 83-1260, art. 34 : la fin « 4 août 1980 » du LEGI est une coquille pour le 4 août 1990
  — l'art. 5 du décret n° 90-685, publié au JO n° 178 du 3 août 1990, remplace le tableau, et
  de 1984 à 1990 les seuls décrets qui modifient le n° 83-1260 (n° 88-1072, n° 89-74) ne
  touchent que ses articles 104 et 185 ; le texte de 1984 est vide dans l'index JORF, le
  contenu vient du LEGI : 15 lignes rendues, la correction et sa preuve écrites avec le
  tableau. Le 22e refus (n° 96-1113, art. 14, depuis 2021) : la consolidation du LEGI saute le
  5e échelon, que l'art. 8 du décret n° 2020-1435 écrit (« 5e échelon 3 ans ») ; le tableau
  complet se lit au JORF (art. 2 et 8), sans que l'index montre à quel chapitre, donc à quelle
  date, appartient l'art. 8 : refus gardé, motif corrigé. La règle « ancienneté moyenne
  réduite du quart » des agents chefs (n° 91-45, art. 32 ; n° 91-936, art. 29), citée avec
  leur tableau ; aucune autre pour les 24 autres tableaux à moyenne seule ; au n° 91-45, la
  règle commence au LEGI le 7 août 2007, le tableau le 25 juin 2007, le texte ne tranche pas.
  N° 67-715 : du 16 août 1967 ; 409 lignes en 39 versions. Hors du motif des durées : 102
  versions, dont 97 de durées (54 articles, 44 textes), en cinq formes ; consignées, non lues.
reste: >-
  Les 97 versions hors du motif, à lire dans une étape à elles. Le tableau des professeurs
  techniques de la PJJ depuis 2021, au JORF, avec les autres refus (question au propriétaire).
  Le tableau de 1990 du n° 83-1260, art. 34, n'est au JORF qu'en image. Puis le chaînage.
