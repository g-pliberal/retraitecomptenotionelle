date: "2026-11-02"
session: "action 145, recherches complémentaires avant décision : la CAFAT, Wallis-et-Futuna, la CRFM de Mayotte et les sources injoignables"
consulte: >-
  veille_droit.py (aucune fiche de ces régimes à relire). Hors de l'index de la DILA :
  la Chambre territoriale des comptes de Nouvelle-Calédonie, rapport sur la CAFAT,
  exercices 2020 et suivants (délibéré le 30 juin 2022) ; les fiches des paramètres de
  la CAFAT, janvier et avril de 2017 à 2026 et octobre 2026 ; les avis du conseil
  économique et social de Nouvelle-Calédonie n° 04/2007, n° 12/2008, n° 01/2009 et
  n° 05/2026. La Cour des comptes, observations définitives S2022-2223 sur Wallis-et-
  Futuna ; le rapport d'information n° 2667 de l'Assemblée nationale (10 février 2020) ;
  treize rapports annuels de l'IEOM sur Wallis-et-Futuna, de 2004 à 2022 ; deux sites
  professionnels du territoire. Les conclusions du rapporteur public sur l'affaire
  n° 428548 du Conseil d'État (24 juillet 2019) ; l'analyse de la décision n° 407297 (6
  octobre 2017) ; la page « Fonctionnaires de Mayotte » de la CNRACL ; le rapport du
  CSFPT de 2014 sur Mayotte ; les questions écrites n° 68624 (2006) et n° 35207 (2009).
  Le rapport public annuel 2021 du comité d'orientation et de suivi des retraites de
  Polynésie. Injoignables le 2 novembre 2026 : LexPol (connexion réinitialisée, erreur
  amont en HTTP), cpswf.wf, web.archive.org (bloqué par la politique réseau de
  l'environnement), Gallica (refus de Cloudflare) ; le Journal officiel de
  Wallis-et-Futuna en ligne ne porte que 2025 et 2026.
trouve: >-
  Aucune donnée ni aucun code changé. CAFAT : le rendement est un paramètre que le
  conseil d'administration fixe chaque année, publié : 10,35 % en 2015, 9,75 % en 2021,
  9,00 % en 2026, 12,45 % en 2001 et 10,98 % fin 2007 ; toute la cotisation de 14 %
  achète des points ; le taux d'avant avril 2009 était de 13 % (déduit). Wallis-et-
  Futuna : la cotisation de retraite est de 21 % depuis 2020, aux deux tiers patronale ;
  les 27 % de la caisse comptent 6 points de prestations familiales (Cour des comptes) ;
  avant 2009, la caisse locale de retraites, créée le 4 août 1977, prélevait 9 % et
  servait 3,2 % par année des quatre derniers salaires, 65 % au plus, à 55 ans. CRFM :
  son règlement est l'arrêté préfectoral n° 77-50/RG du 16 mars 1977, modifié le 25
  février 1994 (âge de 55 ans, prolongeable jusqu'à 60) ; seuls les services affiliés à
  la caisse entrent dans sa part de la pension unique. Polynésie : le rapport du comité
  donne les paramètres de 2011 à 2021 et ceux d'avant et d'après la loi du pays
  n° 2019-6.
reste: >-
  Le barème de la CRFM (arrêté de 1977 et ses modifications jusqu'au 1er janvier 2006),
  à demander aux archives départementales de Mayotte, à la préfecture, à la CRFM ou à la
  CNRACL ; la date d'effet de la délibération n° 25/AT/2015 et un éventuel plafond à
  Wallis-et-Futuna ; le rendement de la CAFAT avant 2001 ; les délibérations
  polynésiennes n° 87-11 AT et n° 95-180 AT, sur LexPol. Au propriétaire : corriger la
  CAFAT par la série publiée et Wallis-et-Futuna à 21 %, et décider du statut de la
  part CRFM.
