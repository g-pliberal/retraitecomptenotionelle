date: "2026-10-12"
session: "action 152, étape 1 : le cas type militaire au militaire moyen du Service des retraites de l'État"
consulte: >-
  Aucune source de droit nouvelle : la session ne touche aucune règle du scénario 1. Le
  rapport sur les pensions de retraite de la fonction publique annexé au PLF 2026 (le
  jaune budgétaire, sre_jaune_pensions), lu dans le PDF que sert le miroir de
  l'Assemblée nationale, d'empreinte conforme au manifeste : tableaux B-3, B-4, B-7 et
  B-18 (départs de 2024), 98 (départs de 2003 à 2024), A-4 et A-5 (pensions en
  paiement), 50 (bonifications des liquidants de 2023).
trouve: >-
  Aucun texte de droit. Les militaires partis pour ancienneté en 2024 sont radiés à 48,7
  ans, après 110,1 trimestres de services et 37,5 de bonifications, à l'indice 585, pour
  1 900 € par mois ; le cas type partait à quarante-quatre ans après vingt-cinq ans de
  services, à une solde de 0,71 salaire moyen, quand l'indice de liquidation en vaut 0,90
  en moyenne de 2003 à 2024. Il part désormais à quarante-huit ans et demi, à 1,15
  salaire moyen. Les bénéfices de campagne et la bonification de service aérien, que le
  simulateur ne saisit pas, lui manquent.
reste: >-
  À l'action 152 : la CNRACL, les exploitants agricoles, les professions libérales et les
  civils de l'État, un groupe par session, dans l'ordre que le propriétaire a confirmé.
