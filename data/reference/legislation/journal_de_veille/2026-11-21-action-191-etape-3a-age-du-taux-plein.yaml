date: "2026-11-21"
session: "action 191, étape 3 de la note 0009 : l'âge du taux plein lu dans les versions de sa fiche"
consulte: >-
  L'index LEGI du dépôt : L. 351-8 du code de la sécurité sociale dans ses
  rédactions successives, dont LEGIARTI000006742632, LEGIARTI000023030950,
  LEGIARTI000028498855, LEGIARTI000047452736 et LEGIARTI000051289852 ;
  R. 351-27 (LEGIARTI000006749434, LEGIARTI000020082993, LEGIARTI000054589995) ;
  l'ordonnance n° 82-270, article 9 (LEGIARTI000006275868) ; L. 161-17-2,
  premier alinéa (LEGIARTI000047452768, LEGIARTI000053280889).
  scripts/veille_droit.py : rien de neuf sur L. 351-8.
trouve: >-
  Soixante-cinq ans de 1983 à 2011 quelle que soit la génération ; l'âge
  légal plus cinq ans de 2011 à 2023 ; soixante-quatre ans plus trois depuis
  le 1er septembre 2023. Les assurés nés avant 1930 recevaient la valeur de
  la période de leur régime ; corrigé (auxiliaire médical né en 1925, parti
  en 1990 : 6 780,38 à 6 786,20 euros par an). La rédaction de R. 351-27 du
  1er août 2026 ne touche que le coefficient de minoration. Détail :
  docs/feuille_de_route/191/2026-11-21-etape-3a-age-du-taux-plein.md.
reste: >-
  Un texte d'application de l'ordonnance de 1982 entre avril 1983 et
  décembre 1985 ; un exemple de la Cnav de 2011 pour la version plus cinq ;
  l'âge opposé, après 2023, à l'assuré né avant 1955 (question au
  propriétaire).
