date: "2026-11-20"
session: "action 191 : la carrière longue n'ouvre plus la complémentaire de la Carpimko"
consulte: >-
  Rien de neuf : les textes lus le 19 novembre 2026, L. 643-3 (rédaction du
  1er septembre 2023), les statuts de la Carpimko dans leur rédaction de
  l'arrêté du 27 décembre 2023 et son règlement de 2026 (arrêté du 10 juillet
  2026), et les deux pages de carpimko.com.
trouve: >-
  Sur l'accord du propriétaire, la correction préparée la veille est publiée :
  un paramètre de période, fermee_a_la_carriere_longue, sur les périodes de la
  Carpimko qui lisent sa table d'âges ; la complémentaire se sert à son âge,
  au taux plein, et non plus avec la base au départ pour carrière longue.
  Aucun témoin ne bouge. Détail :
  docs/feuille_de_route/191/2026-11-19-cultes-et-carpimko.md.
reste: >-
  Ce que la caisse sert en fait à qui part en carrière longue n'est pas
  établi, et le texte laisse une autre lecture possible depuis 2024 pour les
  nés après le 31 août 1961 : la fiche le déclare. L'avantage social
  vieillesse des auxiliaires médicaux, retardé avec la complémentaire, n'est
  pas instruit. sources.lu_le ne bouge pas.
