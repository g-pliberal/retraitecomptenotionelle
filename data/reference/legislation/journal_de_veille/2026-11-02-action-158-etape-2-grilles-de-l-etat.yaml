date: "2026-11-02"
session: "action 158, étape 2, première moitié : le filtre de l'index élargi aux grilles et sa reconstruction lancée, les grilles de l'État certifiées depuis le Noyau RH du CISIRH"
consulte: >-
  Aucun texte de droit lu à la source : aucune règle du scénario 1 n'est écrite. Le Noyau RH
  de l'État du CISIRH, édition de juillet 2026 (version 26.00.00, licence ouverte 2.0), sur
  data.economie.gouv.fr : sa pièce « 6_nomenclatures_noyau_xmlzip », 364 tableaux XML, dont
  CORPS, GRADE, GRILLE_IND, ECHELON, INDICE, TEXTE et CATG_STATUTAIRE. La grille des
  techniciens supérieurs du ministère de l'agriculture, « Données actualisées au 1er juillet
  2024 » (infoma.agriculture.gouv.fr, grille_remu_tsma.pdf). L'index LEGI du dépôt publié le
  2 novembre 2026 à 11 h 55 UTC, avant sa reconstruction. Le site du centre de gestion de la
  Haute-Garonne ne répond toujours pas.
trouve: >-
  Le noyau donne, pour l'État, 2 105 grilles et 33 169 versions d'échelons datées, avec leur
  indice et leurs trois durées, et le barème payé de l'indice brut à l'indice majoré, minimum
  de traitement compris, sans histoire avant novembre 2006. Il ne porte la grille des
  instituteurs que depuis août 1993, celles de la catégorie C que depuis novembre 2006, et
  aucun tableau de reclassement échelon par échelon. Sa grille, son barème et la valeur du
  point recomposent au centime les 36 traitements mensuels que le ministère de l'agriculture
  publie au 1er juillet 2024 : le traitement annuel arrondi à l'euro, divisé par douze. Avant
  sa reconstruction, l'index LEGI n'avait aucun article des décrets n° 2016-604 (échelles C1
  à C3 de la territoriale), 2010-330, 2021-1267 et 82-1105, et 219 des 488 textes de grilles
  que le noyau cite y manquaient.
reste: >-
  L'étape 2 de l'action 158 : les grilles de la territoriale et de l'hospitalière, tirées du
  LEGI par l'index reconstruit ; l'histoire du barème avant 2006, au décret n° 82-1105 ; les
  grilles d'avant le noyau ; les reclassements ; les indices de solde des militaires.
