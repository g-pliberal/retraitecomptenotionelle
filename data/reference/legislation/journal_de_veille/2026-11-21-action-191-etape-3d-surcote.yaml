date: "2026-11-21"
session: "action 191, étape 3 de la note 0009 : la surcote lue dans les versions de sa fiche"
consulte: >-
  L'index LEGI du dépôt (à jour au 16 novembre 2026) : D. 351-1-4 du code de la
  sécurité sociale dans ses cinq rédactions (2004, 2006, 2009, 2011, 2026) et
  L. 351-1-2 ; l'index du Journal officiel : décrets n° 2004-156 (article 1er),
  n° 2006-1611 (articles 1er à 3) et n° 2008-1509 (articles 5, 6 et 8) ; la base de
  législation de la Cnav : circulaire 2004/37 du 15 juillet 2004, points 32 et 41.
trouve: >-
  Quatre versions à la date d'effet : rien avant 2004, 0,75 % de 2004 à 2006, le
  barème par rang et par âge de 2007, 1,25 % pour les trimestres depuis 2009. Le
  taux de 2009 (article 5 du décret n° 2008-1509) vaut dès le 1er janvier 2009 ; LEGI
  date la rédaction du 1er avril à cause de l'article 6, sans effet sur le taux. Les
  rédactions de 2011 et 2026 sont sans effet sur la surcote. Aucune pension ne
  change. Détail : docs/feuille_de_route/191/2026-11-21-etape-3d-surcote.md.
reste: >-
  La règle de prorata de l'année du soixantième anniversaire (rédaction de 2004),
  dont la pratique de la caisse n'est pas connue ; la surcote propre de la CNAVPL et
  de la MSA des non-salariés ; les rédactions de 2010 et 2011 de L. 351-1-2. L'étape 4
  attend la décision du propriétaire.
