date: "2026-09-22"
session: "action 89, lot des artistes-auteurs : les trois régimes de l'IRCEC"
consulte: >-
  Chez l'IRCEC : le guide de la retraite 2026, le mémo 2026, les
  règlements du RAAP et du RACD (arrêté du 17 avril 2024) et du RACL
  (13 mai 2025), la foire aux questions, les pages « quel est mon régime »,
  « âge d'ouverture des droits », « taux de cotisation au RAAP » et les
  liens. Au JORF, par l'index du dépôt mis à jour de ses incréments du 21
  et du 22 septembre : les arrêtés d'approbation des règlements de 2013,
  2017, 2021, 2022, 2024 et 2025. L'index LEGI : aucune version de
  L. 161-17-2 postérieure au 31 décembre 2025.
trouve: >-
  LA MINORATION DE L'IRCEC N'EST PAS CELLE DU RÉGIME DE BASE, et les trois
  fiches la lui empruntaient : 2,5 % pour chacune des deux premières années
  manquantes, 5 % au-delà, ou le régime de base s'il est plus favorable.
  Le RACL avait jusqu'en 2024 un barème à 5 % par année et l'âge seul.
  L'annexe de l'arrêté de 2013 intervertit les colonnes des générations
  1955 et suivantes entre le RACL et le RACD. Le guide 2026 donne aussi le
  rendement du RAAP : 9,75 € de service pour 90,30 € d'achat, 10,8 %.
reste: >-
  Le tableau d'anticipation d'avant 2014, absent du Journal officiel. Les
  plafonds et minimums de points des trois régimes, le taux aménagé de
  4 % au RAAP et la cotisation de solidarité du RACD (1 % à 4 % de 2024 à
  2027), non modélisés. Les simulateurs de la Sécurité sociale des
  artistes-auteurs et de mon-entreprise, du même lot, restent à dépouiller.
