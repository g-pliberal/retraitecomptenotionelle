date: "2026-11-03"
session: "action 130, file R-E : relecture indépendante des minorations à l'âge seul de la CAVEC et de la CARPV lues au droit (commit 9020e7b)"
consulte: >-
  python scripts/veille_droit.py ; docs/veille_droit.md ; la base de la Cnav, rien de neuf.
  Les index JORF (à jour au 3 novembre 2026) et LEGI (au 2 novembre) récupérés. La CAVEC :
  l'arrêté du 22 février 2008, ses articles 1er et 2 et son annexe (articles 3.12 à 3.17) ;
  les annexes des arrêtés du 26 novembre 2010, des 9 février et 27 mars 2012, des 7 octobre
  2013 et 2014, du 20 août 2018 (partie 2, articles 11 à 16) et ses articles 1er et 2, du
  19 juin 2019 (II, 7°) et ses articles, du 2 juillet 2024 (II), du 4 juillet 2025 et du
  16 décembre 2025 ; le règlement de 2026 (articles 1.1.1, 1.1.3, 1.2.2), au JORF et au LEGI ;
  la liste des arrêtés de la section de 1961 à 2026 ; l'arrêté du 23 mai 1953 et le décret
  n° 53-506, en titre et en analyse ; l'arrêté du 13 mai 1994 ; le livre des 70 ans de la
  caisse (PDF, sha256 f37b161d…d030). La CARPV : les arrêtés du 11 janvier 2011, du 16 avril
  2014, des 18 février et 2 novembre 2015, des 23 janvier, 10 février et 3 août 2017, du
  18 octobre 2021 (articles 33 à 41 et l'article 2 de l'arrêté), du 16 décembre 2025, et la
  liste de ses arrêtés depuis 1960 ; le règlement de 2026 (articles 1er à 9), au JORF et au
  LEGI. Le décret n° 2026-418, articles 6, 8 et 30 ; le décret n° 2026-239 (statuts types) ;
  les arrêtés du 21 septembre 2026 qui modifient ceux du 10 juillet. Au LEGI, L. 643-3 et
  L. 643-4. Le code, et les deux moteurs par servi_et_refait, pour l'inapte et la réversion.
trouve: >-
  Citations exactes mot pour mot, dates d'effet justes (le LEGI date du 18 juillet 2026 les
  deux règlements), âges, taux et calculs justes ; tests verts hors des pages toutes faites.
  Trois écarts moyens : l'arrêté de la CARPV du 2 novembre 2015, classé sans effet, récrit
  l'alinéa de l'inapte (« reconnus inaptes au taux fonctionnel ou professionnel de 100 % ») ;
  le moteur ne sert aucune réversion de la CAVEC ni de la CARPV (motif non_portee, aucune
  fiche de réversion ne les nomme), quand les fiches le disent servir la réversion
  coefficient compris, 15 % trop basse ; le bloc « Reprise » ne porte plus la décision de
  la proposition que le README laisse au propriétaire. Sept faibles, dont l'arrêté du
  23 mai 1953, qui fixe des cotisations et non des statuts. Hors du lot : la CNAVPL minore
  aussi l'inapte (L. 643-4, 2°, a), et le modèle l'ouvre à 60 ans à la génération 1964.
reste: >-
  Les statuts d'avant 2008 et d'avant 2021, au Bulletin officiel ; les alinéas de la CARPV
  supprimés en 2014 ; la règle du 1er au 17 juillet 2026 ; les corrections, à la file E et
  à une file du modèle.
