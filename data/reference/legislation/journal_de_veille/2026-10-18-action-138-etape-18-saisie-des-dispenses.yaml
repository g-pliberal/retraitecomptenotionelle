date: "2026-10-18"
session: "action 138, étape 18, huitième partie : la saisie des dispenses de l'assiette minimale"
consulte: >-
  Aucun texte neuf : la session n'a fait que saisir, sur le site, les dispenses que la
  sixième partie avait lues le 16 octobre (L. 131-6-3, L. 613-9 et L. 613-11 ; D. 642-4,
  rédactions de 2004 à 2015), et que porte déjà `legislation/dispenses_assiette_minimale.yaml`.
trouve: >-
  Rien de nouveau au droit. Le champ « Dispenses de l'assiette minimale » dit, par plages
  d'années, le motif de chaque année ; toutes les activités de l'année le portent, d'un relevé
  ou des métiers, et la règle ne le retient que là où le texte dispense le statut.
reste: >-
  Ce que la sixième partie laissait au droit : un exemple chiffré de l'Urssaf, et si la
  dispense des activités accessoires saisonnières vaut dès les cotisations de 2019.
