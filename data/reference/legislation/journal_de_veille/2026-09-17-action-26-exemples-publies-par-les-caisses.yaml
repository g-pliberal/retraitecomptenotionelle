date: "2026-09-17"
session: "action 26, exemples publiés par les caisses"
consulte: >-
  service-public.gouv.fr (F14043, F14044, F19666, F19643, F13845, F21552,
  F36464, F20349, F16494, A15703, A18825) ; circulaires Cnav 2026-07,
  2026-17, 2026-18, 2026-29, 2018-04 ; Légifrance : loi n° 2025-1403,
  décrets n° 2026-344, 2026-345, 2026-699, articles D. 351-1-1, L. 351-1-1,
  R. 173-3-2, L. 14 CPCMR ; L'Assurance retraite, mesures LFSS 2026 et
  carrière longue ; CNRACL, calcul de la surcote.
trouve: >-
  La suspension de la réforme de 2023 (LFSS 2026) manquait ; carrière
  longue lue à la règle générale et à l'année ; surcote au taux du départ
  et comptée à l'année ; SAM des parents à vingt-cinq années. Tout porté.
  Vingt-deux exemples rejoués à l'identique.
reste: >-
  Recertification LEGI (action 27) ; durée requise des emplois classés ;
  réputés cotisés autres que les enfants ; date d'effet au mois suivant ;
  LURA en cas de statuts simultanés ; revalorisation des pensions 2026 ;
  bonification d'un trimestre CNRACL/FSPOEIE du décret n° 2026-699 ;
  Mayotte.
