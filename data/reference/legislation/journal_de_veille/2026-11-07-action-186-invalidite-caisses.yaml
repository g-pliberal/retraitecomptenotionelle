date: "2026-11-07"
session: "action 186, chantier 6 : la garantie d'invalidité (décision 78) face aux caisses et aux complémentaires, vérifiée caisse par caisse"
consulte: >-
  Aucune règle du scénario 1 n'est touchée. L'index LEGI de la DILA (à jour
  au 2 novembre 2026), versions en vigueur le 7 novembre 2026 : L. 341-1,
  L. 341-3 à L. 341-5, L. 341-15, L. 341-16, L. 351-1-5, D. 351-1-14,
  L. 434-1, L. 434-2, L. 632-1, R. 632-1, L. 643-5, L. 644-2, L. 652-9,
  L. 815-24, L. 815-28 (abrogé), L. 815-29, R. 815-22, R. 815-25, L. 821-1,
  L. 821-2 et L. 821-5 du code de la sécurité sociale ; L. 27 à L. 31,
  L. 30 bis, L. 30 ter, L. 34 et L. 35 du code des pensions civiles et
  militaires ; les articles 30, 31, 34, 36, 37 et 61 du décret n° 2003-1306
  (CNRACL), 3 et 19 du décret n° 2004-1056 (ouvriers de l'État), 2 et 15 du
  décret n° 2008-639 (SNCF), 6, 13, 14, 27 et 45 du décret n° 2008-637
  (RATP), 76, 77 et 21 du décret n° 90-1215 (CRPCEN), 48 et 49 du décret
  du 17 juin 1938 (marins), 147 à 152 et 165 du décret n° 46-2769 (mines) ;
  l'annexe 3 au statut national des IEG (articles 31 à 37) ; l'annexe du
  décret n° 2007-262 (Banque de France, articles 40 à 45) ; L. 732-8,
  L. 732-56 à L. 732-63 et R. 732-3 du code rural ; l'article 11 bis de
  l'arrêté du 30 décembre 1970 (Ircantec). La série des pensions
  d'invalidité de la DREES (panorama 2026, fiche 25) que le dépôt certifie,
  et les fiches du dépôt sur l'invalidité. Relevés par le moteur de
  recherche, les sites ayant répondu 503 : les fiches 26 et 27 des minima
  sociaux de la DREES (édition 2025), la fiche réglementaire de
  l'Agirc-Arrco « Incapacité de travail », la fiche 07 des comptes de la
  protection sociale de la DREES ; le montant de l'AAH au 1er avril 2026
  (monparcourshandicap.gouv.fr).
trouve: >-
  La rente d'accident du travail a deux parts depuis le 1er novembre 2026,
  professionnelle et fonctionnelle, pour les victimes consolidées depuis
  cette date (L. 434-2, loi n° 2025-199, article 90, et loi n° 2025-1403,
  article 95). L. 815-24 (ASI) et L. 821-1 (AAH) ont une rédaction du
  23 juillet 2026 (ordonnance n° 2026-648). L'ASI n'est plus reprise sur la
  succession depuis le 1er janvier 2020, même pour les arrérages antérieurs
  (abrogation de L. 815-28 par la loi n° 2019-1479, article 270). La
  pension d'invalidité des exploitants laisse acquise, à l'âge légal, la
  part qui dépasse la retraite (R. 732-3, IX, rédaction du 9 mai 2026). Les
  anciens L. 723-* (CNBF) sont devenus L. 652-* en 2018. Cinq caisses ont
  un plancher d'invalidité de la moitié du traitement (L. 30, L. 35,
  article 34 du décret de la CNRACL, article 45 du règlement de la Banque
  de France, article 15 du décret de la SNCF). L'AAH vaut 1 041,59 € par
  mois depuis le 1er avril 2026 (relevé). Aucune erreur des fiches du dépôt
  n'est déclarée.
reste: >-
  Les effectifs d'invalides de la SNCF, de la RATP, de la Banque de France,
  des ouvriers de l'État, de l'ENIM, de la CRPCEN et des mines, et ceux des
  rentes viagères d'invalidité ; les fiches de la DREES sur l'AAH et l'ASI
  et la fiche de l'Agirc-Arrco, à relire quand leurs sites répondent ; les
  règlements d'invalidité-décès des sections des libéraux et de la CNBF ; le
  réglementaire des indépendants (R. 632-*) et le décret des minima des
  exploitants. Au propriétaire : les cinq questions de la note des planchers
  (note 186/2026-11-07-invalidite-questions.md) et les six de la note
  186/2026-11-07-invalidite-caisses.md.
