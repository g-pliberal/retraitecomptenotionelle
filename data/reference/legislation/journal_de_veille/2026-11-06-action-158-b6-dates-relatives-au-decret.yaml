date: "2026-11-06"
session: "action 158, vague 11, B6 : les trois écarts de R-B6 (n° 98-896 art. 8, la version « jamais en vigueur » du n° 2017-903, la garde des citations) et les dates d'effet relatives au décret"
consulte: >-
  L'index LEGI du dépôt (dump Freemium_legi_global_20250713-140000, à jour au
  20261102-213929) et l'index JORF (Freemium_jorf_global_20250713-140000, à jour au
  20261103-002311), table doc : n° 98-896, art. 8 et 10 (LEGIARTI000006508628, 006508629,
  006508631 ; JORFARTI000002094938, 002486581) ; n° 2002-378, art. 1 et 2 (JORFARTI000002416455,
  002195228 ; LEGIARTI000006209301, 006209302) ; n° 2017-903, art. 12 (LEGIARTI000034702202,
  036440010) ; pour 104 textes dont un tableau dit une date relative au décret, tous leurs
  articles au LEGI, et, pour les 46 retenus, la clause d'entrée en vigueur au JORF (texte
  signé) et le jour de publication (DATE_PUBLI), un par un dans
  docs/feuille_de_route/158/2026-11-06-b6-dates-relatives-au-decret.md ; le rectificatif du
  n° 2015-1275 (JORFARTI000031360111). Légifrance, code civil, art. 1er
  (LEGIARTI000006419280, en vigueur depuis le 1er juin 2004), par l'outil de lecture web ;
  la version d'avant 2004 et l'ordonnance n° 2004-164 n'ont pas pu être lues (403).
trouve: >-
  Le n° 98-896, art. 8 : le n° 2002-378 n'en ôte que « en fonctions à la date du présent
  décret », sans clause d'effet, et le tableau ne change pas : daté du 1er août 1996 par
  l'art. 10. La version LEGIARTI000034702202 du n° 2017-903 (du 2018-02-01 au 2017-12-24)
  n'a jamais été en vigueur. 62 tableaux de 46 décrets sont datés de l'entrée en vigueur que
  le décret fixe (une date écrite, ou « le premier jour du mois suivant sa publication »),
  dont onze s'écartent du début de version au LEGI (n° 2012-379 : 2012-04-01, non
  2012-03-22 ; n° 2025-1327 : 2026-01-01, non 2025-12-28…). Le chaînage rattache six groupes
  de plus (19).
reste: >-
  67 tableaux relatifs au décret (57 textes), à partir du n° 71-917 ; la règle d'entrée en
  vigueur d'avant juin 2004, à lire (question au propriétaire) ; le n° 2011-1140 (« prend
  effet » pour « entrée en vigueur »), non tranché ; les trois rattachements du n° 2023-1336
  à la même grille, candidat pour R-B7 ; le rectificatif du n° 2015-1275 face à lignes.csv ;
  trois tableaux au fac-similé (n° 96-101 art. 37, n° 98-896 art. 8, n° 98-809 art. 10).
