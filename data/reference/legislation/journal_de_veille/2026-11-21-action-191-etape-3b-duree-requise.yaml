date: "2026-11-21"
session: "action 191, étape 3 de la note 0009 : la durée requise lue dans les versions de sa fiche"
consulte: >-
  L'index LEGI du dépôt : L. 161-17-3 du code de la sécurité sociale dans ses
  rédactions du 22 janvier 2014 (LEGIARTI000028494794), du 1er septembre 2023
  (LEGIARTI000047452764) et du 1er septembre 2026 (LEGIARTI000053280903) ;
  R. 351-27 (LEGIARTI000006749434, LEGIARTI000020082993) ; R. 351-45, I à III
  (LEGIARTI000006749449, LEGIARTI000006749450) ; la loi n° 2003-775, article
  5, III ; les décrets n° 2010-1734, 2011-916, 2012-1487 et 2013-1155. Les
  circulaires de la Cnav 2011/24 et 2011/25.
trouve: >-
  150 trimestres jusqu'en 1993 ; l'escalier de R. 351-45, II, jusqu'en 2002 ;
  159 au né en décembre 1942 parti le 1er janvier 2003 ; 160 jusqu'en 2008,
  quelle que soit la génération ; puis la loi de 2003 et ses décrets, et
  L. 161-17-3 de 2014, de 2023 et de la suspension. La circulaire 2011/24 ne
  contredit pas la 2011/25. Aucune pension ne bouge ; six fiabilités changent
  de niveau. Détail :
  docs/feuille_de_route/191/2026-11-21-etape-3b-duree-requise.md.
reste: >-
  Un exemple officiel pour les versions de 1994 à 2008 (exposé de la Cnav,
  circulaire 2008/41) ; R. 351-45, I lu par le récupérateur, pour certifier
  les 160 trimestres de 2003 à 2008 ; la pratique de la Cnav de 2011, restée
  au code.
