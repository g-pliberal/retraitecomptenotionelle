date: "2026-10-02"
session: >-
  la suite de l'action 141, le scénario 1, à la demande du propriétaire : « Pour le
  scénario 1, fait plus de recherches »
consulte: >-
  l'accord Agirc-Arrco du 17 novembre 2017, articles 59 à 67, et son avenant n° 27 du
  19 juin 2025 (circulaire 2025-12-SG-DRJ du 16 juillet 2025) ; la circulaire
  2020-02-DRJ, fiche 2 ; l'article 23 de l'annexe A de l'Arrco (2006) et l'article
  8 bis de l'annexe I de l'Agirc (2001, 2006), que publie l'Unédic ; l'index LEGI
  (règlements d'assurance chômage de 2009 et de 2019, convention du 15 novembre 2024,
  R. 351-12 CSS, arrêté du 30 décembre 1970, art. 11 ter, pour l'Ircantec,
  L. 161-17-2 et L. 161-17-3, sans version postérieure au 31 décembre 2025) ; la
  fiche de l'Unédic « Trimestres et points de retraite » (4 juillet 2025).
trouve: >-
  L'ARE et l'ASP valent des points sur le salaire journalier de référence aux taux de
  calcul des points, comme le modèle les sert sur le salaire d'avant. Trois écarts
  au scénario 1 : le salaire de référence est borné à quatre plafonds, quand le
  modèle compte une année chômée jusqu'à huit depuis 2019 ; l'ASS, l'ASFNE, la
  préretraite progressive et l'AER valent 4 % (8 ou 12 % sur la tranche B de
  l'Agirc avant 2019), que le modèle ne distingue pas de l'ARE, dont il ne borne pas
  la durée ; la validation court du 1er octobre 1967, et du 1er août 1977 à
  l'Ircantec, quand le modèle n'a pas de date. Le régime général est conforme
  (R. 351-12, 4°, c). Aucun exemple chiffré officiel. Le modèle n'en change rien
  encore.
reste: >-
  Le guide réglementaire de 2018, que Common Crawl ne sert plus à ce conteneur, ni le
  site réglementaire de l'Agirc-Arrco, indisponible : ce que l'Agirc faisait du
  chômage avant 1967 et le calcul d'avant 1997. Les incréments de la DILA, refusés :
  l'index LEGI est à jour au 27 septembre 2026. Le propriétaire range les trois
  écarts dans l'action 141 ou dans une autre.
