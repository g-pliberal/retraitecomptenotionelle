date: "2026-10-24"
session: "action 138, étape 3 : la forme des départs projetés, cherchée sans être trouvée ; le militaire, compté dès ses 48 ans"
consulte: >-
  Aucun texte de droit : ni la recherche ni la correction ne touchent une
  règle du scénario 1. Pour la forme des départs des générations projetées :
  le rapport annuel du COR de juin 2026 (chapitre 2 de la partie 4, les
  classeurs des parties 1 à 4) et son annexe méthodologique en ligne (§ 1.2) ;
  le document n° 2 de la séance du COR du 27 janvier 2022 ; les documents de la
  séance du 14 mars 2024 sur les départs anticipés et les carrières longues ;
  l'étude d'impact du projet de loi de financement rectificative pour 2023 ;
  les fiches 15, 16 et 18 du panorama « Les retraités et les retraites » de la
  DREES, édition 2026 ; la page du modèle TRAJECTOiRE. Pour le militaire :
  l'onglet `population` des sept classeurs des projections de population 2026
  de l'INSEE.
trouve: >-
  Le COR calcule son âge conjoncturel de départ sur les taux de retraités à
  chaque âge de 50 à 70 ans que TRAJECTOiRE projette (annexe méthodologique,
  § 1.2), mais ne publie que des moyennes : l'âge de chaque génération (figures
  3.28 et 4.5) et l'âge conjoncturel de chaque année (figure 2.5). La seule
  forme projetée publiée, celle de la séance de janvier 2022 (encadré 2, figure
  b), répartit les départs des générations 1940, 1960, 1980 et 2000 en cinq
  classes autour de l'âge d'ouverture et de celui d'annulation de la décote,
  sous le droit d'avant 2023, en graphique sans valeurs. L'INSEE publie les
  effectifs de 48 et 49 ans que la pyramide du dépôt omettait : 830 132 et
  871 081 au 1er janvier 2024.
reste: >-
  Rien au droit. La part de chaque génération projetée partie à chaque âge,
  que TRAJECTOiRE calcule et que le COR ne publie pas, à demander à son
  secrétariat général, par le propriétaire.
