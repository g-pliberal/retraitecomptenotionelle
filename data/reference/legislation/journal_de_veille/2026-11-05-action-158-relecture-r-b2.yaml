date: "2026-11-05"
session: "action 158, vague 9, R-B2 : relecture indépendante de B (d9bfae9 : le chaînage lit les dates corrigées ; n° 2008-836, art. 14-1-1 ; n° 2012-1058, art. 4 ; n° 87-1104, art. 1er) et de la déclaration de B-bis (b80f490)"
consulte: >-
  python scripts/veille_droit.py ; docs/veille_droit.md. L'index LEGI du dépôt (incrément
  20261102-213929) : n° 2009-1322, art. 2 (LEGIARTI000034034492, 037196211) ; n° 71-917,
  art. 17 (LEGIARTI000037197020) ; n° 2008-836, art. 14-1-1 (LEGIARTI000031948241,
  034034377, 035602721, 036489603) ; n° 2012-1058, art. 4 (LEGIARTI000034034477, 036489841,
  037538214, 037538231) ; n° 87-1104, art. 1er (LEGIARTI000006370685, 006370686) ; n° 87-1103,
  art. 14, 25-1 et 28-1 ; n° 96-101 (LEGITEXT000005620312, LEGIARTI000006377880). L'index JORF
  (incrément 20261103-002311) : n° 2017-171, art. 8, 33 à 42 et 126 ; n° 2018-610, art. 1er et
  2 ; n° 2017-1737, art. 17, 31, 80 et sa notice ; n° 2016-82, art. 1er et 3 ; n° 2017-1381,
  art. 2, 6, 7 ; n° 2018-917, art. 1er, 2 et sa notice ; les textes de 2016 à 2020 qui nomment
  le n° 2012-1058 ou l'art. 14-1-1 du n° 2008-836 ; n° 96-101, son texte et ses sept articles
  (art. 1er, 2, 10, 25, 27, 33, 38) ; « pension » et « rétroactif » dans les n° 2016-82,
  2017-171, 2017-1381, 2018-917 et 2018-610. Le Noyau RH, grille 03500.
trouve: >-
  Toutes les valeurs, dates et citations de B sont exactes, et les deux lecteurs relancés
  aux deux commits refont à l'octet près les fichiers commités : rien d'autre n'a bougé.
  Écart moyen : l'index JORF ne garde pas que « les visas et la signature » du n° 96-101,
  mais sept articles et un résumé ; son art. 2 récrit le statut des secrétaires de mairie
  (catégorie A, douze échelons, échelons provisoires 301, 328, 342, reclassement par son
  art. 37) et fait partir de sa publication la péréquation CNRACL (art. 28-1 du
  n° 87-1103) ; le résumé date le passage en catégorie A du 1er août 1995. L'article qui
  récrit l'art. 1er du n° 87-1104 et celui de l'entrée en vigueur manquent toujours :
  « non tranché » tient. Écarts mineurs : le test du chef de projet SRIC fige sa grille de
  2017 sans l'échelon spécial HEA que le texte porte ; la fiche ne nomme pas le directeur de
  recherche de 2e classe parmi les pensions liquidées avant la publication du n° 2018-917.
  B-bis : conforme.
reste: >-
  Corriger, dans la note de B, la fiche dila_legi_grilles, son journal et le bloc
  « Reprise », ce que l'index garde du n° 96-101 ; resserrer la question au propriétaire :
  au JO n° 33 du 8 février 1996, p. 2070 à 2077, l'article du n° 96-101 qui récrit l'art. 1er
  du n° 87-1104, son art. 37 et son entrée en vigueur. Candidat : les échelons provisoires
  de l'art. 25-1 du n° 87-1103 (301, 328, 342), absents des grilles.
