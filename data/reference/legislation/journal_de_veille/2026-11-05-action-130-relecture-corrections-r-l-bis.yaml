trouve: >-
  Conforme : citations exactes ; les âges hors du mois des neuf tables et des deux fiches,
  reconvertis en ans et en mois, sont ceux des textes ; au_mois passe dans les deux
  moteurs (24 tests verts, sous PRESOMPTIONS_DECALEES=1 aussi) ; les treize témoins qui
  bougent bougent pour lui seul, dont la Comédie-Française de 1958, qui s'ouvre à
  60 ans 8 mois (décret n° 68-960, article 51, I, A, 3°). L'arrêté de 2011 approuve des
  « modifications apportées » aux statuts des biologistes : des statuts existaient avant,
  hors du Journal officiel. Trois écarts faibles : la période 1981-2007 de l'ASV des
  biologistes cite R. 351-27, qui ne naît qu'en décembre 1985 ; le relevé de ce qui bouge
  omet les leviers (2,3e-5), les migrations (1,8e-5) et des départs anticipés des régimes
  spéciaux et des catégories classées (0,1 % au plus) ; ages_reference.csv écrit 61,17,
  66,17, 61,42 et 66,42 au-dessus du mois, sans effet au réglage par défaut, un écart
  d'un ou deux jours sous les variantes à cliquet avec une bascule de 2013 à 2015.
reste: >-
  À la file du modèle : l'âge du taux plein des biologistes de 1981 à 1985, à lire dans
  l'ancien code ou à déclarer ; ages_reference.csv au mois, hors du scénario 1. Les
  statuts des biologistes d'avant 2011, à demander à la CAVP (note
  2026-11-05-relecture-corrections-r-l-bis.md de l'action 130).
