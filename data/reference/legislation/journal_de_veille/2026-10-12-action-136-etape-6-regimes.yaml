date: "2026-10-12"
session: "action 136, étape 6 : la place de chaque régime dans les quintiles des résidents, et le niveau des cas types statutaires"
consulte: >-
  Aucune source de droit nouvelle : la session lit, sans les modifier, le minimum garanti
  de la fonction publique et la pension majorée de référence des non-salariés agricoles
  que la simulation applique. Le classeur « Caractéristiques de tous les retraités
  résidant en France (EIR 2020) » de la DREES, feuille « QuintilesEQCC », ses lignes du
  régime principal, téléchargées et certifiées.
trouve: >-
  Aucun texte de droit. 288 valeurs certifiées de plus : la part de chaque régime
  principal dans chaque quintile des résidents. La population met 60 % de ses militaires
  au troisième quintile, l'EIR 12 ; 88 % de ses exploitants au premier, l'EIR 41 ; 72 % de
  ses professions libérales au cinquième, l'EIR 45. La classe médiane des militaires est
  au minimum garanti à 68 % : c'est le niveau des cas types, non leur déclinaison.
reste: >-
  À l'étape 6 de l'action 136 : au propriétaire, les cas types statutaires et non salariés,
  une action à part ou un calage de la population sur la place de chaque régime ; les
  départs avec décote ; le minimum selon la génération ; la bascule de la page.
