date: "2026-11-21"
session: "action 191, étape 3 de la note 0009 : la carrière longue lue dans les versions de sa fiche"
consulte: >-
  L'index LEGI du dépôt : D. 351-1-1 du code de la sécurité sociale dans ses
  rédactions successives, dont LEGIARTI000026139949 (1er novembre 2012),
  LEGIARTI000047634571 (décret n° 2023-436, 1er septembre 2023) et
  LEGIARTI000054059621 (décret n° 2026-345, 1er septembre 2026) ;
  L. 161-17-2 pour l'âge légal que lit le renvoi.
  scripts/veille_droit.py lancé : rien de changé aux barèmes ni aux avis de mise à jour.
trouve: >-
  Le I du décret de 2023 écrit ses âges en clair ; le renvoi à l'âge légal
  minoré de deux ans et six mois est au II, 2°, pour les nés du
  1er septembre 1963 au 31 décembre 1968, et la rédaction de 2026 le garde
  pour septembre à décembre 1963 et 1966 à 1969. Né en octobre 1963, pension
  d'octobre 2023 : 60 ans et 3 mois. Aucune pension ne change. Détail :
  docs/feuille_de_route/191/2026-11-21-etape-3c-carriere-longue.md.
reste: >-
  La surcote, dernière partie de l'étape 3.
