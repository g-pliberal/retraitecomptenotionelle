date: "2026-11-19"
session: "action 191 : quatre renvois d'âge des régimes coupés au jour du texte"
consulte: >-
  Index JORF et LEGI de la DILA, à jour au 16 novembre 2026 : règlement
  annexé au décret n° 2007-262 (articles 26, 33, 69, 70,
  LEGIARTI000006778516) et son article 1er (JORFARTI000001483411) ; décret
  n° 73-937, article 3 (LEGIARTI000006765819, LEGIARTI000026474703), décret
  n° 2012-1129 (JORFTEXT000026460585) ; D. 161-2-1-9 au 1er novembre 2012 ;
  décret n° 2006-1325, article 2 (JORFARTI000001085913).
trouve: >-
  Trois fiches coupées au jour par `date_effet` : la Banque de France au
  1er avril 2007, les artisans et commerçants d'avant 1973 au 7 octobre
  2012, la Cavimac au 2 novembre 2006. Un écart neuf : la surcote de la
  Banque de France ne compte, au règlement (article 33), que les trimestres
  « effectués après le 1er avril 2007 », et la fiche les compte depuis
  soixante ans. Détail dans
  docs/feuille_de_route/191/2026-11-19-quatre-dates-au-jour.md.
reste: >-
  La surcote datée de la Banque de France ; la fraction d'après 1997 de la
  Cavimac, liquidable seule de janvier à novembre 2006 ; ce que la caisse
  des artisans et commerçants a appliqué de juillet 2011 à octobre 2012 ;
  l'âge de 55 ans du règlement de la Banque de France d'avant 2007.
