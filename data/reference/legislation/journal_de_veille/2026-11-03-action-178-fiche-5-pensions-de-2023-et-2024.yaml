date: "2026-11-03"
session: "action 178, étape 2, la fiche 5 du panorama de la DREES : la pension moyenne brute et nette de 2023 et 2024, et le taux effectif de la page Coût (décision du propriétaire du 3 novembre)"
consulte: >-
  Aucune règle du scénario 1 n'est touchée : la session porte une donnée. Le
  classeur de la fiche 5 du panorama « Les retraités et les retraites »,
  édition 2026, ouvert dans l'archive de la release à l'empreinte du
  manifeste, feuille « F05_Tableau 1 compl_bis » (résidents en France ou à
  l'étranger), cellules I, L, O et R des lignes 12 à 28 ; la feuille
  « F05_Tableau 1 » (résidents en France), pour le champ. Le portail de la
  DREES, pour relire le tableau 2.1-a : connexion coupée.
trouve: >-
  Fin 2023, 1 764 € bruts et 1 643 € nets toutes pensions, fin 2024, 1 855 €
  et 1 727 € ; de droit direct, 1 608 et 1 495 €, 1 693 et 1 573 €. La
  feuille redonne à l'euro près les soixante valeurs de 2008 à 2022 du
  fichier. Le taux effectif passe de 6,81 % en 2022 à 6,86 % en 2023 et
  6,90 % en 2024 : le demi-point que la note du 14 octobre craignait n'y est
  pas.
reste: >-
  Pourquoi la CSG des retraites de la CCSS et la nette de la DREES diffèrent,
  et d'où vient la baisse des exonérés d'Ancetre 2023 ; le tableau 2.1-a,
  quand le portail répondra, qui reprendra 2023 et 2024 s'il les porte ; la
  confrontation de la fiche 5 par régime (tableaux 2 et 4).
