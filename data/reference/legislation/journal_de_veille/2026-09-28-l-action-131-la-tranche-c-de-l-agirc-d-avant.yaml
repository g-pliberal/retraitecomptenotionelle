date: "2026-09-28"
session: >-
  l'action 131, la tranche C de l'Agirc d'avant 2016, portée
consulte: >-
  Aucune lecture nouvelle : les accords et la convention que la fiche
  coefficients_anticipation_agirc_arrco cite, lus le 27 septembre —
  l'accord du 17 novembre 2017 (articles 84, 85 et 102), la convention
  de 1947 (annexes I et V), les accords du 13 novembre 2003, du 18 mars
  2011 et du 30 octobre 2015, le dépliant « Décrypter la retraite
  complémentaire Agirc tranche C ».
trouve: >-
  De quoi porter la règle : les points constitués sur la tranche C
  jusqu'au 31 décembre 2015 prennent le coefficient de la table des âges
  avant l'âge du 1° de L. 351-8, même au taux plein, et la table des
  trimestres manquants ne leur vaut pas.
reste: >-
  Le report sans abattement de l'article 102 ; l'accord de l'ASF du 4
  février 1983 et ceux de l'AGFF d'avant 2003, pour dater l'exonération
  « sur les tranches A et B » que le moteur applique dès 1991.
