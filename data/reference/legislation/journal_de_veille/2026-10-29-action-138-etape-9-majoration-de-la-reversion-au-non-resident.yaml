date: "2026-10-29"
session: "action 138, étape 9 : les majorations pour enfants de la réversion du régime général, hors de la cotisation du non-résident"
consulte: >-
  Aucun texte neuf. Relus dans l'index LEGI du dépôt, à jour au 25 octobre : L. 131-2 du code
  de la sécurité sociale (LEGIARTI000047453476), son 1° ; L. 353-1 (LEGIARTI000047453693), la
  majoration de la réversion ; R. 353-2 (LEGIARTI000006749405), ses 10 %. Les fiches
  majoration_forfaitaire_reversion (L. 353-5) et cotisation_maladie_des_non_residents.
trouve: >-
  L. 131-2, 1° exclut de la cotisation maladie « les bonifications ou majorations pour enfants
  autres que les annuités supplémentaires » : la majoration de la réversion du régime général
  au survivant de trois enfants (L. 353-1 ; R. 353-2) et sa majoration forfaitaire pour enfant
  à charge (L. 353-5) en sont. La carte de la réversion les prélevait des 3,20 % du
  non-résident sur la base ; elle ne le fait plus.
reste: >-
  Rien pour la veille. Ce qu'une révision ou la limite de cumul retire à cette réversion se
  nette encore avec la part de la majoration pour trois enfants, que la ligne ne sépare pas ;
  le plafond de 2027 ; les fiches de l'étape, à sa fin ; au propriétaire, la CAMIEG,
  l'écrêtement du minimum de la SNCF, l'ASPA de l'article 23, les textes au fac-similé.
