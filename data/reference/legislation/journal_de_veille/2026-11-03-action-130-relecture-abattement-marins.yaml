date: "2026-11-03"
session: "action 130, file R-M1 : relecture indépendante de l'abattement du salaire de référence des marins au-delà de huit fois le traitement de l'indice 100 (R. 11, 3°, commit e5dd612)"
consulte: >-
  python scripts/veille_droit.py ; docs/veille_droit.md ; les index LEGI et JORF de la DILA,
  récupérés (à jour de l'incrément du 2 novembre 2026, 20261102-213929). Dans LEGI : R. 11 du
  code des pensions de retraite des marins (LEGIARTI000006791987) ; L. 5552-19 du code des
  transports (LEGIARTI000023079221) ; l'article 1er du décret n° 48-1108
  (LEGIARTI000006561748, LEGIARTI000018696261) ; les vingt-sept rédactions de l'article 7 du
  décret n° 85-1148 (LEGIARTI000006454537 à LEGIARTI000006454557, LEGIARTI000018728042,
  LEGIARTI000019111495, LEGIARTI000020817875, LEGIARTI000023427631, LEGIARTI000025140235,
  LEGIARTI000047751780), les quarante-six de son article 3 (LEGIARTI000006454423 à
  LEGIARTI000047751772), sept de son article 8 (LEGIARTI000006454558 à LEGIARTI000047751766) ;
  le décret n° 86-166 (LEGITEXT000006065400, LEGIARTI000006455048) et l'article 1er du décret
  n° 82-1105 (LEGIARTI000006455029). Dans JORF : les décrets n° 88-1067, n° 89-64, n° 90-321,
  n° 91-1191, n° 98-462, n° 99-208, n° 99-491, n° 99-943, n° 2000-1154, n° 2001-370,
  n° 2001-559, n° 2003-1170, n° 2004-679, n° 2005-726, n° 2006-759, n° 2006-1283,
  n° 2007-1054, n° 2008-400, n° 2008-622 (JORFARTI000019108393), n° 2009-824 et n° 2023-519
  (JORFARTI000047749229, barème B JORFARTI000047749261) ; les arrêtés des salaires forfaitaires
  du 31 décembre 1985 et du 31 décembre 1986 (analyses), de 1991 à 2007 (tableaux non
  reproduits), les rectificatifs de 1995 (JORFARTI000002373607) et de 2006
  (JORFARTI000001490715), les arrêtés du 31 décembre 2007, du 26 août 2008, du 2 avril 2013,
  du 9 avril 2024 et du 19 mars 2026. Hors des index : le rapport S2023-0865 de la Cour des
  comptes (PDF, 138 pages) ; la question écrite n° 8440 de l'Assemblée nationale ; le document
  SalaireForfaitaireENIM.docx de formations.mer.gouv.fr ; les pages printpdf/364 et 388 de
  l'ENIM (vides) ; la page Légifrance de l'arrêté du 31 décembre 1985 (sans son tableau ; 403
  à curl). Les essais : tests/test_marins.py, l'essai JavaScript de la session, -m rapide, la
  garde des présomptions et la confrontation complète du jumeau Python, sur le paquet refait
  hors commit.
trouve: >-
  Conforme sur le point décisif : le traitement de l'indice 100 de R. 11, 3° est celui de
  l'indice brut 100, que l'article 7 du décret n° 85-1148 constitue de l'indice majoré de sa
  date (« se référant au traitement de l'indice 100 ou de l'indice brut 100 » depuis le
  1er juillet 2008), et non celui de l'indice majoré 100 ; aucune lecture contraire trouvée.
  Citations exactes ; série de vingt lignes et dates d'effet conformes aux décrets, sauf le
  7 février 1986, non vérifiable ; plafonds de 2008 à 2026 refaits au centime, la vingtième
  catégorie au plus à 78,2 % (2026) ; les deux moteurs rendent ces valeurs, les dix témoins des
  marins refaits par le jumeau. Écart moyen : « aucune catégorie de 1985 à 2026, sous 79 % »
  n'est prouvé que de 2008 à 2026 ; avant, la grille est estimée, et les montants réels de
  1995 et 2006 la disent trop basse (13e catégorie de 1995 : +14,5 %), la vingtième réelle de
  1995 vers 80,5 % du plafond. Écarts faibles : le paquet n'est pas dans le commit (version
  38 sur main, l'essai JavaScript y est rouge, vert sur le paquet refait) ; docs/limites ne
  dit pas ce qui n'est pas lu avant 1985 ; le barème A donne 152 dès 1985 et 169 en mai et
  juin 2001, quand la série suit la lettre de l'article 7 (150, 164), sans effet. Négligeables :
  98 298,16 € au barème B, non 98 298,14 € ; l'article 1er du décret n° 48-1108 cité ne vaut
  que jusqu'au 25 avril 2008 ; LEGI manque la rédaction du 1er décembre 2000 (décret
  n° 2000-1154, second alinéa).
reste: >-
  Restreindre l'affirmation de 1985 à 2007 dans la fiche marins_salaire_de_reference, la note
  et le journal de M1, ou la prouver par la vingtième catégorie réelle de quelques années au
  Journal officiel imprimé ; déclarer le choix de lecture contre le barème A et, dans
  docs/limites, ce qui n'est pas lu avant le 5 novembre 1985 ; le paquet attend la prochaine
  fabrique verte de GitHub, la course qui contient e5dd612 étant rouge sur test_cout
  (complémentaires), étrangère aux marins (note
  2026-11-03-relecture-abattement-des-marins.md de l'action 130).
