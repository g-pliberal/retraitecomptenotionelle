date: "2026-09-27"
session: >-
  l'action 130, le domaine des enfants clos : le bloc du formulaire, trois
  bornes corrigées au jour, les exemples publiés, la relation de priorité
consulte: >-
  Dans la base législative de la Cnav : les circulaires n° 2/72 (§ II B),
  n° 31/75 (§ 1, 35, 7 et 8) et, par une copie publiée par un
  particulier, n° 2004/22 (§ 3, 4.2 et 5). La fiche F37311 de
  service-public.gouv.fr, vérifiée le 1er septembre 2026. Dans l'index
  LEGI : l'article 16 du décret n° 75-109 dans ses deux rédactions,
  R. 173-15 dans ses six, L. 161-17-2 et L. 161-17-3. L'index JORF, pour
  la loi n° 71-1132, dont il ne porte que le titre. Les index LEGI et JORF
  mis à jour avant de publier, sans incrément paru depuis le 27 septembre
  à 20 h 49 ; veille_droit.py.
trouve: >-
  L. 161-17-2 et L. 161-17-3 n'ont pas de rédaction postérieure au 31
  décembre 2025 : la suspension court toujours. La loi Boulin sert un an
  par enfant élevé neuf ans avant ses seize ans, à la mère d'au moins deux
  tels enfants, « Un enfant n'ouvre aucun droit » (n° 2/72). La loi
  n° 75-3 porte la majoration à deux ans dès le premier enfant pour les
  avantages prenant effet après le 30 juin 1974, la majoration n'étant pas
  parmi les réserves de la circulaire n° 31/75. De 2004 à mars 2010, un
  trimestre à la naissance puis un au terme de chaque année d'éducation,
  sans condition de durée (n° 2004/22). F37311 dit le b ter comme la loi.
  La priorité du régime spécial naît en 1982 ; R. 173-15 la reprend en
  1985, y ajoute l'exception de la CRPCEN en 2001, la restreint en 2008,
  et l'étend aux majorations de 2010 en 2011. Publiées, chacune avec le
  diff de ses témoins : le b ter au 1er septembre 2026 (un témoin), la loi
  n° 75-3 au 1er juillet 1974 avec la condition des neuf ans (deux), le
  trimestre par année d'éducation de 2004 à mars 2010 (un).
reste: >-
  Du domaine, clos : les rédactions de L. 351-4 depuis 2013, à couper en
  versions ; l'adoption, que la chronologie ne connaît pas encore ;
  l'enfant handicapé ; la majoration d'éducation d'un enfant de moins de
  quatre ans depuis 2010 ; l'exception de la CRPCEN ; la priorité d'avant
  1982, que le moteur remplace par celle de 1982. Les cinq fiches que
  veille_droit.py donne à relire, et ce que l'entrée précédente laissait
  de l'action 131.
