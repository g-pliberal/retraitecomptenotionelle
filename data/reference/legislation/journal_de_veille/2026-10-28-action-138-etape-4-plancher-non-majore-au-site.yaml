date: "2026-10-28"
session: >-
  action 138, étape 4, au site : la phrase de la carte « Votre pension, de votre départ à
  aujourd'hui » qui dit le plancher que les majorations forfaitaires de 1972 à 1982 ne
  relèvent pas (`plancher_non_majore`), et ce qu'il retire à la revalorisation de la ligne
consulte: >-
  Aucun texte neuf : l'étape ne touche à aucune règle et dit ce que le modèle rend depuis
  le 25 octobre (circulaires Cnav n° 2/72, n° 15/76, n° 64/77 et n° 79/82 ; exposé
  « Montant de la retraite personnelle » ; note
  `2026-10-25-etape-4-majorations-comparees-au-plancher.md`).
trouve: >-
  Rien de neuf au droit. La réversion ne lit pas le plancher : la phrase va à la carte de
  la pension d'aujourd'hui, seule à montrer la revalorisation de chaque régime. La carte
  de la réversion dit « de minimum contributif » la pension minimum d'avant 1983 et le
  plancher de la pension substituée, que l'étape « compléter » écrit sous ce code ; la
  composition sous le montant du système 1 se tait quand un plancher retire quelque chose.
reste: >-
  Rien pour la veille. Au site, ce que les notes des révisions, de la période et du
  plancher ont vu en chemin (note `2026-10-28-etape-4-plancher-non-majore-au-site.md`).
