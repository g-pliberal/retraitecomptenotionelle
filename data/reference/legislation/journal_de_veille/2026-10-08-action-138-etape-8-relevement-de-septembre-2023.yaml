date: "2026-10-08"
session: "action 138, étape 8 : le relèvement des pensions des exploitants déjà liquidées, au 1er septembre 2023"
consulte: >-
  Dans l'index LEGI, mis à jour le même jour : la loi n° 2023-270, article 18, II et
  VI ; L. 732-56 et L. 732-63 du code rural dans leur rédaction du 1er septembre 2023
  (LEGIARTI000047453314, LEGIARTI000047453258) ; D. 732-111 du 12 août 2023
  (LEGIARTI000047961256) ; D. 732-166-2 et D. 732-166-5-1 de novembre 2021, D. 732-166-4
  de 2022. Dans l'index JORF : l'arrêté du 26 avril 2023 relatif au relèvement du SMIC,
  articles 1 et 2. Hors de l'index : la réponse ministérielle à la question écrite
  n° 16179 (JO du 30 avril 2024) ; l'Info presse de la MSA du 14 février 2023 sur les
  barèmes revalorisés.
trouve: >-
  Le VI de l'article 18 applique dès le 1er septembre 2023 aux pensions prises avant
  le taux plein que le II substitue à la durée requise tous régimes, pour les points
  gratuits de la RCO (L. 732-56) et pour son complément différentiel (L. 732-63), « les
  montants du salaire minimum de croissance et des éléments de calcul du complément
  différentiel » étant « ceux en vigueur au 1er septembre 2023 » ; la réponse
  ministérielle le dit des pensions prises depuis 1997. Le SMIC brut est alors de
  11,52 € de l'heure ; la PMR des pensions prises avant, de 8 970,86 € (D. 732-111). Les
  textes réglementaires lisent le SMIC net à deux dates : celle de l'année « au titre
  de laquelle le complément est dû » (D. 732-166-4), celle de l'effet de la pension
  (D. 732-166-5-1) ; la loi tranche pour ces pensions. La note de presse de la MSA,
  1 138,63 € par mois au 1er janvier 2023, confirme au dix-millième le SMIC net agricole
  que le dépôt estimait pour 2023. Servi par « faire vivre » dans les deux moteurs.
reste: >-
  Comment la MSA a appliqué le VI : le SMIC net du 1er septembre 2023 qu'elle a
  retenu, la PMR des pensions prises avant, les rappels, un exemple chiffré. Les
  pensions prises de 1997 à 2002, et le complément de celles prises avant 2015, que le
  modèle ne sert pas à la liquidation. De l'étape 8 ensuite : un exemple chiffré de la
  MSA, le SMIC net agricole de 2015 à 2020 et de 2022, les statuts autres que le chef,
  la PMR de 2009 et le complément de 2015 des pensions d'avant, les plans de 1994 à
  2002, l'AVTS dans R. 732-70.
