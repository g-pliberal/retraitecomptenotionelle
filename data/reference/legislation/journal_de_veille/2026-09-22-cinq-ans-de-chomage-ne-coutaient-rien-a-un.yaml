date: "2026-09-22"
session: "cinq ans de chômage ne coûtaient rien à un fonctionnaire"
consulte: >-
  Index LEGI du dépôt : articles L. 5 (LEGIARTI000047453644) et L. 9
  (LEGIARTI000053279095) du code des pensions civiles et militaires de
  retraite, lus en entier — le premier pour la liste des services retenus,
  le second pour celle des positions statutaires qui n'en comportent pas et
  les exceptions qu'il énumère. Relu à côté d'eux l'article L. 13, qui
  proratise la pension sur les services et bonifications.
trouve: >-
  LA CONFUSION ENTRE DURÉE ET SERVICES NE S'ARRÊTAIT PAS À LA MAJORATION
  POUR ENFANTS. Le moteur créditait le prorata de la fonction publique de
  TOUTE période validant un trimestre, chômage compris : une carrière de
  fonctionnaire d'État coupée de cinq ans de chômage servait exactement la
  même pension qu'une carrière pleine, au centime près. L'article L. 9 dit
  l'inverse, et sa liste d'exceptions est fermée. Le chômage n'y est pas —
  un fonctionnaire au chômage n'est plus fonctionnaire, le chômage n'étant
  pas une position statutaire. Les congés de maladie, de maternité,
  d'accident de service et de maladie professionnelle du fonctionnaire en
  activité y sont ; le congé parental y est dans la limite de trois ans par
  enfant. Sur une fonctionnaire née en 1975 partie à soixante-quatre ans,
  cinq ans de chômage retirent désormais vingt trimestres de services et
  11,9 % de pension ; le même congé pris pour deux enfants ne retire rien,
  et huit trimestres pour un seul.
reste: >-
  Le scénario 1 EST MODIFIÉ : `periodes_non_travaillees.csv` porte deux
  colonnes de plus, et le moteur tient deux comptes parallèles par régime —
  durée d'assurance et services —, le numérateur étant choisi sur la
  famille du régime. Deux approximations sont assumées et écrites. La
  condition « né ou adopté à partir du 1er janvier 2004 » du 1° de L. 9
  n'est pas appliquée, faute de collecter l'année de naissance des enfants.
  Et les dix-huit régimes spéciaux, qui se proratisent eux aussi sur des
  services, gardent l'ancienne règle : leurs règlements n'ont pas été lus,
  et `docs/limites.md` le porte. Reste aussi que le modèle connaît le MOTIF
  de l'interruption et non la POSITION statutaire, et présume donc l'agent
  en activité — ce que L. 9 exige pour ses 2° et 3°.
prochaine_veille: "2027-06-30"
