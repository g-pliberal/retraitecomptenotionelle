date: "2026-11-20"
session: "action 191, avant l'étape 3 : la carrière longue aux bascules de 2023 et de 2026"
consulte: >-
  L'index du Journal officiel du dépôt, à jour au 16 novembre 2026 : le décret
  n° 2023-436 du 3 juin 2023 (JORFTEXT000047625782), ses articles 8
  (JORFARTI000047625907) et 9 (JORFARTI000047625914), lus en entier ; le
  décret n° 2026-345 du 7 mai 2026 (JORFTEXT000054047736), sa notice. La
  circulaire Cnav 2023-14 du 10 juillet 2023, points 9.1 et 9.2 et annexe 3,
  PDF de la base de législation de la Cnav. L'index
  LEGI, à la même date : L. 161-17-3 du code de la sécurité sociale au
  1er septembre 2026 (LEGIARTI000053280903). La table
  data/reference/legislation/carriere_longue.csv, rédactions de 2012, de 2023
  et de 2026 de D. 351-1-1, non relue à la source.
trouve: >-
  L'article 9 applique le décret de 2023 aux pensions prenant effet à compter
  du 1er septembre 2023 ; celui de 2026 et L. 161-17-3 (171 trimestres pour
  les nés d'avril à décembre 1965) s'appliquent à celles qui prennent effet à
  compter du 1er septembre 2026. Le moteur datait l'ouverture d'un régime qui attend
  après le départ déclaré par la carrière longue et la durée requise du texte
  du départ déclaré : dix-neuf mois trop tard pour une assurée née en mars
  1965 partie en août 2023, vingt-deux mois trop tard pour une assurée née en
  juin 1965 partie en août 2026. Corrigé : la recherche lit le texte de chaque
  date d'effet. Détail :
  docs/feuille_de_route/191/2026-11-20-etape-3-carriere-longue-aux-bascules.md.
reste: >-
  La clause de sauvegarde de l'article 8 du décret n° 2023-436 : la recherche
  garde sa date, sans lire ses bornes de naissance ; la liquidation ne la lit
  pas, ni pour l'ouverture ni pour le taux plein du 4° ter de L. 351-8. Ce
  qu'en font la fonction publique et les complémentaires, non lu.
