date: "2026-10-12"
session: "action 47 : le fichier individuel de l'enquête Histoire de vie et Patrimoine, hors de portée"
consulte: >-
  Aucune source de droit : la session ne touche à aucune règle du scénario 1. Le
  propriétaire, qui ne peut pas s'inscrire à Progedo-ADISP ; le manifeste et les notes de
  l'action 47 ; une recherche, puis une requête, qui trouvent en ligne le document de
  travail de la DG Trésor n° 2021/5, sans le lire.
trouve: >-
  Aucun texte de droit. Le fichier individuel de l'enquête est hors de portée du dépôt ;
  la log-normale sur les moments du COR reste l'hypothèse de la couverture d'une avance,
  que le patrimoine des défunts de 2018 recoupe. Le document de la DG Trésor, d'où la Cour
  tire son graphique du patrimoine des défunts, répond sans compte.
reste: >-
  Lire le document de travail de la DG Trésor n° 2021/5 (au vivier,
  dgtresor_dt_2021_5) pour le patrimoine des défunts par âge ou par niveau de vie ; la
  phrase du programme ; au propriétaire, le choix de reprendre sur le patrimoine des
  défunts.
