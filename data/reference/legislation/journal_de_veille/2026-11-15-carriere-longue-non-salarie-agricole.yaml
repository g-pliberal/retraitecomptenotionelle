date: "2026-11-15"
session: "les deux questions ouvertes de la carrière longue, à la demande du propriétaire"
consulte: >-
  L'index LEGI du dépôt, à jour au 11 novembre 2026 : l'article 3 bis du décret
  n° 73-937, rédaction du 1er juillet 2011 (LEGIARTI000023397572) ; D. 351-1-3 du
  code de la sécurité sociale, rédaction du 1er janvier 2011 (LEGIARTI000023397562) ;
  D. 16-3 du code des pensions, même période (LEGIARTI000023383594) ; L. 634-2 du code
  de la sécurité sociale (LEGIARTI000025014511). D. 732-40 du code rural, lu le 12
  novembre 2026 (action 192, étape 2), non relu.
trouve: >-
  La voie des quatre trimestres agricoles du non-salarié agricole (D. 732-40), lue le
  12 novembre et gardée hors de `main`, est portée dans les deux moteurs, avec la
  lecture recommandée de la rédaction de 2026 : elle s'ajoute à la voie générale. Le
  pilote qui date les cas types faisait partir l'exploitant né en 1953 avant d'avoir
  sa durée ; corrigé. Pour les artisans et commerçants nés au dernier trimestre, de
  juillet 2011 à octobre 2012 : le même article du décret n° 2010-1734 écrit
  « dix-huitième » au régime général et aux fonctionnaires, et l'omet au 3 bis ; cela
  ne touche que les nés d'octobre à décembre 1951.
reste: >-
  Le propriétaire tranche la lecture du 3 bis : alignée sur le régime général, ce que
  fait le modèle, ou à la lettre. La lettre à toutes les caisses MSA n° 2026-298 reste
  à lire pour la rédaction de 2026 de D. 732-40 ; la coordination des régimes pour
  l'ancien aide familial devenu salarié reste ouverte.
