date: "2026-10-16"
session: "action 138, étape 5, cinquième partie : l'ASPA d'un scénario sans minimum, sur une distribution déformée"
consulte: >-
  Aucun texte : le point ne touche pas au scénario 1. Les données déjà certifiées du
  dépôt : le classeur « Caractéristiques de tous les retraités » de l'EIR de 2020 (les
  bénéficiaires d'un minimum à leur régime principal, 4 326 000, dont 3 360 000 femmes) et
  la colonne m1 de la feuille E-Minima de l'EACR (le complément moyen du minimum des
  nouveaux retraités des régimes alignés, 122,2 € par mois en 2020).
trouve: >-
  La distribution d'un scénario sans minimum, déformée par ces deux chiffres, coûte 0,7 à
  1,3 % de ses pensions propres en ASPA de plus qu'à pension moyenne égale : l'effet retour
  passe de 27 à 28 % à 27 à 32 % de l'économie des scénarios 2 à 5, de 2026 à 2070. Rien du
  scénario 1 ni d'une page ne change.
reste: >-
  Le complément du minimum garanti du public, et celui du stock des retraités, que l'EACR
  ne publie que pour les nouveaux retraités du privé.
