date: "2026-10-12"
session: "action 47 : le document de travail de la DG Trésor n° 2021/5, lu"
consulte: >-
  Aucune source de droit : la session ne touche à aucune règle du scénario 1. Le document
  de travail de la DG Trésor n° 2021/5, « Modèles de microsimulation des impôts liés au
  patrimoine des ménages » (décembre 2021), téléchargé depuis le site du Trésor dans le
  répertoire de la session, hors du dépôt, et lu par son texte : la méthode, la
  caractérisation des successions, la bibliographie.
trouve: >-
  Aucun texte de droit. Le document ne ventile le patrimoine des défunts ni par âge, ni par
  niveau de vie, ni par pension ; son graphique 12 est celui de la Cour, déjà au dépôt. Son
  champ exclut l'habitat collectif, dont les résidents d'Ehpad, et sous-déclare le
  patrimoine : le recoupement par le patrimoine des défunts n'est qu'un ordre de grandeur,
  que la note du jeu cdc_successions_2024_donnees dit désormais.
reste: >-
  À l'action 47, la phrase du programme et, au propriétaire, le choix de reprendre sur le
  patrimoine des défunts ; la couverture d'une avance par tranche de pension reste sans
  source publique.
