trouve: >-
  Conforme. Les 26 fragments cités par ddb8824 et la note de K-bis, exacts mot pour mot (par
  un script). Le décret n° 99-875 (1999, points gratuits de retraite proportionnelle), article
  2, rédaction de 2001 à 2002 seulement, dit bien « la date de création du régime [...] à
  savoir le 1er juillet 1952 pour la métropole » ; le décret n° 55-753 (article 18) et la loi
  n° 60-768 (article 5) le confirment. Le décret n° 68-571 accorde des points supplémentaires
  pour des années validées (décret n° 86-1084, article 2), et R. 732-69 ne le nomme pas : son
  retrait du barème est juste. Les effets de 0,63 € (46,7545 − 46,1286 € pour le témoin né en
  1925) et de l'arrondi (0,0085 € pour celui de 1945), refaits à la main sur les cotisations
  captées au moteur Python : exacts. Aucun code, test ni témoin touché ; le paquet refait sur
  le dernier main ne change rien. Deux écarts faibles, de rédaction : « l'exercice 1952 n'a
  qu'une demi-année » est une inférence que l'article 45 du décret n° 52-1166 ne dit pas (il
  divise par deux les cotisations des articles 20 et 21, et l'article 15 fait commencer
  l'exercice au 1er janvier) ; la ligne manque « n'est pas lu » reste inexacte, déclarée par
  K-bis.
reste: >-
  La phrase « l'exercice 1952 n'a qu'une demi-année », dans retraite_proportionnelle_msa et
  la note de K-bis, à récrire d'après le 1er juillet 1952, avec l'étape de la cotisation de
  1952 ; la fiche peut citer le décret n° 55-753 (article 18) et la loi n° 60-768 (article
  5), plus proches que le décret n° 99-875. La ligne manque, avec l'inventaire.
