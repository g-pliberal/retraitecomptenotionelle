date: "2026-10-02"
session: >-
  la suite de l'étape 1 de l'action 141, à la demande du propriétaire : « Fait des
  recherches complémentaires pour ce qui reste ouvert »
consulte: >-
  les pages anciennes de l'Unédic et son stockage des textes réglementaires
  (conventions d'application des 21 avril 2006, 16 décembre 2009 et 26 octobre
  2012, protocole du 2 janvier 2001, annexe A de l'Arrco, article 23, convention du
  contrat de transition professionnelle) ; le guide réglementaire Agirc-Arrco,
  titre VII, par Common Crawl (capture du 21 octobre 2018), ses annexes n'ayant été
  capturées dans aucune des collections interrogées ; l'index JORF (observations du
  Gouvernement sur la loi de modernisation sociale, décision n° 2001-455 DC, arrêtés
  annuels du Fonds de solidarité vieillesse et de la Caisse nationale d'assurance
  vieillesse) ; le rapport du Sénat n° 382 (2000-2001) et son rapport sur le projet
  de loi de modernisation sociale ; des questions écrites ; la circulaire Agirc-Arrco
  2020-02-DRJ ; la banque d'accords du Medef, reconnue en entier (362 scans et 89
  documents à la couche texte illisible, 2 615 pages).
trouve: >-
  Les conventions d'application confirment les 60 % et les 0,8 % ; elles chiffrent le
  versement pour le chômage d'avant 1996 (76 224 508,62 € de 1996 par an, indexés sur
  les prix, de 1997 à 2016) et font payer à part la garantie minimale de points, à un
  taux que l'Agirc fixe chaque année. Le protocole du 2 janvier 2001 reverse les
  0,8 % aux deux régimes. La participation de l'allocataire naît le 1er mars 1988
  (convention du 30 décembre 1987) : 1 % de la partie proportionnelle de
  l'allocation, soit 0,40 % du salaire de référence ; 0,8 % en 1990, 1,2 % à
  l'avenant n° 10 du 24 juillet 1992. Le texte de 1984 est
  l'engagement de l'État pour le régime de solidarité ; l'État paie l'ASS et l'ASFNE
  à 4 % (Arrco) et 8 ou 12 % (Agirc), 70 % des cotisations depuis 1999 selon le
  Sénat. Le modèle n'en change rien encore.
reste: >-
  Introuvables : le relevé de décisions du 9 février 1984, les protocoles du 10 mai
  1967, du 1er septembre 1988 et du 2 janvier 1997, la convention Unédic-Agirc du
  3 décembre 1987, les conventions d'application du 25 juin 2004 et du 12 décembre
  2017, le texte des conventions de l'État du 23 mars 2000 et du 5 juillet 2021. Le
  point 2 de l'action attend le propriétaire, en cinq questions.
