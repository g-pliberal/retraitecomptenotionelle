date: "2026-11-03"
session: "action 158, relecture R-B2-bis des corrections de B2-bis aux durées d'échelon (commits fa24baa à 260182e) : les sept versions ôtées, le « II.- », trente-deux lignes, la règle du quart, les comptes, les tests, rouverts au LEGI et au JORF"
consulte: >-
  Aucune règle du scénario 1 n'est écrite ; rien n'est modifié. L'index LEGI publié du
  dépôt, à jour au 2 novembre 2026 (incrément 20261102-213929), et l'index JORF publié, à
  jour au 3 novembre 2026, récupérés sans reconstruction. Au LEGI : l'histoire et le texte
  des sept versions jamais en vigueur et de celles qui les suivent (n° 99-669, art. 17 ;
  83-1260, art. 34 ; 91-868, art. 7 ; 91-290, art. 14-4 ; 2014-923, art. 25 ; 2014-1455,
  art. 22 ; 92-851, art. 14) ; les 28 versions des 14 tableaux rentrés (n° 96-1113, art. 14 ;
  72-580, art. 13 ; 72-583, art. 6 ; 90-90, art. 18 ; 90-680, art. 24 ; 92-778, art. 31-6 et
  32 ; 93-752, art. 17 ; 65-383, art. 10-7) ; les articles des trente-deux lignes tirées
  (graine 202611031), dont n° 70-738, art. 10-6 ; 72-581, art. 32 ; 2001-1207, art. 11 ;
  87-1099, art. 17 ; 2016-336, art. 18 et 25 ; 92-1189, art. 23 ; 2016-2003, art. 13 ; 56-448,
  art. 9 ; 92-1432, art. 13 ; 97-511, art. 14 ; 2013-262, art. 21 ; 2012-1420, art. 18 ;
  2014-101, art. 11 ; 2010-1239, art. 24 ; 2008-931, art. 17 ; les 36 tableaux à moyenne
  seule et les articles de leur décret qui parlent du quart (n° 91-45, art. 32 ; 91-936,
  art. 29) ; les neuf articles recopiés dans les tests. Au JORF : décret n° 90-685 du
  27 juillet 1990 (art. 5, 41, 42, visas), n° 88-1072 et n° 89-74 (résumés), n° 83-1260 (JO
  du 7 janvier 1984) ; décret n° 2012-999 du 27 août 2012 (art. 2) ; décret n° 2020-1435 du
  23 novembre 2020 (art. 6, 8, 11) ; décret n° 2017-1374 (art. 16 à 18) ; n° 67-715 (titre).
  Le Noyau RH au dépôt (grades 05041 et 02979, grille 03742).
trouve: >-
  Trente-deux lignes sur trente-deux justes (grade, échelon, durée, dates, article). Les sept
  versions ôtées sont jamais en vigueur au LEGI, la version qui les suit est la bonne, et
  aucune autre ne reste dans les tableaux lus. N° 83-1260, art. 34 : remplacé par l'article 5
  du décret n° 90-685, publié au JO du 3 août 1990, sans autre modification depuis 1984 ; la
  rédaction d'origine vaut du 8 janvier 1984 au 4 août 1990, la fin « 1980 » du LEGI est une
  coquille. Les 28 versions des 14 tableaux rentrés sont égales au texte. Le 22e refus est
  juste au LEGI, mais le décret publié (n° 2020-1435, art. 8) écrit le 5e échelon, « 3 ans »,
  que la consolidation perd. Deux tableaux à moyenne seule (n° 91-45, art. 6 ; 91-936, art. 6)
  ont la règle sous une autre forme dans un autre article de leur décret (« l'ancienneté
  moyenne réduite du quart »). Les comptes se recomptent (409 en 39 versions, non 38). Les
  tests tirent leurs valeurs des textes et mordent ; une coquille de date dans un
  commentaire (n° 67-715 est du 16 août 1967). Certification sans écart, paquet inchangé.
  Hérité de B2 : des articles à tableau que le motif du lecteur ne retient pas, ni lus ni
  consignés (n° 2010-1239, art. 24, de 2020 à 2025 ; n° 90-680, art. 24, de 1990 à 2017).
reste: >-
  La question de B2-bis sur le n° 83-1260, art. 34, au propriétaire. Lire au JORF le tableau
  des professeurs techniques de la PJJ depuis le 1er janvier 2021 (décret n° 2020-1435,
  art. 8). Consigner la règle des agents chefs (n° 91-45, art. 32 ; n° 91-936, art. 29) avec
  leur moyenne. Mesurer, avant le chaînage, les articles à tableau que le motif du lecteur ne
  retient pas.
