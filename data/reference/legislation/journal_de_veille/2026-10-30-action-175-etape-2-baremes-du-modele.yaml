date: "2026-10-30"
session: "action 175, étape 2 : les barèmes du modèle, confrontés à leurs séries"
consulte: >-
  La base de législation de la Cnav, par son API : le taux de droit commun et ses pages
  d'avant 2014, les taux, les assiettes minimale et maximale, le revenu validant, les
  points, le cumul et la réversion des indépendants et leurs tables de l'ex-RSI, les
  micro-entrepreneurs, la minoration, le plafond, le Smic, la base des points RVB des
  commerçants, les dix éditions des coefficients de revalorisation des salaires, la
  majoration pour conjoint à charge, le Smig, le plafond et le salaire validant de
  Mayotte, les salaires forfaitaires et l'assurance volontaire, la récupération de l'ASPA
  sur succession, les dernières valeurs, les DOM et le début d'activité des indépendants,
  les taux réduits des micro-entrepreneurs ; ses exposés « Travailleurs indépendants » et
  « Aide aux chômeurs créateurs d'entreprise ». L'index LEGI à jour du 29 octobre 2026
  (D. 635-7, ses rédactions de 1985 à 2024 ; D. 635-4, sa rédaction du 26 février 1997 ;
  D. 633-2 ; D. 633-5 et D. 633-6, de 1985 à 2008 ; L. 131-6, de 1995 à 2011 ; L. 756-4
  et L. 756-5, en vigueur) ;
  l'index JORF (décret n° 2007-1900 du 26 décembre 2007, article 1er ; décret
  n° 2022-1438 du 16 novembre 2022, article 1er).
trouve: >-
  Des écarts qui changent le calcul, déclarés et passés à la session du modèle : le RCO
  des artisans de 2008 et 2009, que le décret n° 2007-1900 fixe « par dérogation » à 7 %
  et 7 %, puis 7,1 % et 7,5 %, quand la fiche applique 7,2 % et 7,6 % ; le même RCO,
  assis sur quatre plafonds dès 1997 (D. 635-4), quand la fiche en garde trois jusqu'en
  2004 ; huit valeurs de point du RCO et du NRCO, tirées de l'IPP, qui ne sont pas celles
  de la caisse ; l'assiette minimale des indépendants, appliquée par la caisse depuis
  1973 quand la série commence en 1985, et fixée pour 2022 à 4 758 € par le décret
  n° 2022-1438, quand la série garde 4 731 € ; Mayotte, que la fiche cssm_mayotte valide
  au Smic et plafonne au plafond nationaux, quand la caisse y applique le Smig mahorais
  et son plafond, désormais en série. Une question ouverte, mise à relire dans la fiche
  cotisation_vieillesse_independants : avant 2007, la cotisation de l'année se calculait
  « à titre provisionnel » sur un revenu antérieur, et sur un forfait les deux premières
  années (D. 633-5, D. 633-6), L. 131-6 prévoyant une régularisation depuis 1995 ; le
  modèle prend le revenu de l'année. Une limite pour les indépendants des DOM, abattement
  et exonérations (L. 756-4, L. 756-5). Le reste concorde, aux conventions de la série
  près, déclarées. Des coquilles de la caisse : deux cellules du tableau de la
  minoration, la ligne de 2014 des taux des indépendants, 1955 dans l'édition de janvier
  2024 des coefficients, l'assiette maximale de 2024. Le registre de l'étape 1 ne suivait
  pas les pages que déclarent les scripts de valeurs : 471 documents de plus.
reste: >-
  Des indépendants : l'Acre et l'Accre (le plafond d'exonération, les micro-entrepreneurs
  avant 2020), l'activité de faible importance des commerçants retraités avant 2004, les
  tables des DOM de 2007 à 2019, celles des micro-entrepreneurs d'avant 2020, le prix du
  point du NRCO avant 2013 ; et, pour la session du modèle, l'assiette d'avant 2007.
