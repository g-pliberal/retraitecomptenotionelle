date: "2026-11-19"
session: "action 191 : l'emploi de l'agent de la Banque de France, déclaré au formulaire"
consulte: >-
  Le règlement annexé au décret n° 2007-262 du 27 février 2007, articles 26,
  32, 70 et 72, dans ses quatorze rédactions de l'index LEGI (de
  LEGIARTI000006778516 à LEGIARTI000047909725) ; par l'index JORF, le décret
  n° 2012-701 du 7 mai 2012, articles 18, 25, 36, 38 et 41, le décret
  n° 2014-669 du 23 juin 2014, notice et article 16 (JORFTEXT000029130717),
  le décret n° 2023-693 du 28 juillet 2023, article 3 ; une recherche sur le
  web d'un exemple chiffré.
trouve: >-
  L'agent des catégories que le conseil général nomme ouvre son droit à 55
  ans depuis 2007, à un âge relevé jusqu'à 57 ans par le décret de 2012, puis
  pour d'autres générations par celui de 2014, et jusqu'à 59 ans pour les
  pensions de 2025 et après ; sa décote s'annule vingt trimestres plus tôt.
  Fiche age_ouverture_banque_de_france_actifs, née ; fiche
  decote_banque_de_france, complétée ; champ « banque » de la saisie.
  L'exemption du c de l'article 32 ne vaut que pour les pensions de 2016 et
  après (décret n° 2012-701, articles 25 et 41, I), non du 9 mai 2012.
  Détail : docs/feuille_de_route/191/2026-11-19-emploi-de-l-agent-de-la-banque-de-france.md.
reste: >-
  La délibération du conseil général qui nomme ces catégories ; un exemple
  chiffré ; les personnels de direction du quatrième au septième degré, dont
  la limite d'âge est à relire dans l'arrêté A-2012-02 ; l'exemption de
  l'agent de 65 ans qui a élevé ou aidé un enfant handicapé ; l'âge de droit
  commun de la Banque (article 72, I, 1°), que le modèle prend au droit
  commun des salariés.
