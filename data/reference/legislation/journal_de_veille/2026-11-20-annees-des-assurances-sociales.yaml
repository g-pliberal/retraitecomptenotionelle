date: "2026-11-20"
session: "action 191 : les années 1930 à 1944 comptent à la durée du régime général"
consulte: >-
  L'index LEGI du dépôt, à jour au 16 novembre 2026 : R. 351-9 CSS, rédaction
  du 21 décembre 1985 (LEGIARTI000006749353) ; décret n° 45-0179 du 29
  décembre 1945, article 71, rédaction de 1983 (LEGIARTI000006760608), et
  article 74, rédaction de 1977 (LEGIARTI000006760676) ; décret n° 50-1225 du
  21 septembre 1950, article 58, rédaction de 1983 (LEGIARTI000006774032).
trouve: >-
  Les trimestres des assurances sociales, du 1er juillet 1930 à 1944, sont des
  trimestres d'assurance du régime général et du régime des salariés
  agricoles ; le moteur ne les comptait qu'à la durée tous régimes, et
  proratisait la pension sur les seules années d'après 1944 : 128/150 au lieu
  de 150/150 à qui avait cotisé de 1932 à 1976. Corrigé : la fiche des
  assurances sociales nomme les régimes qui reprennent sa durée. Détail :
  docs/feuille_de_route/191/2026-11-20-annees-des-assurances-sociales.md.
reste: >-
  L'article 71 du décret de 1945 avant 1983, que l'index ne porte pas : la
  même règle est présumée. Le salaire de référence d'une pension liquidée
  avant 1955, dont les dix dernières années remontent avant 1945. Le partage
  des trimestres d'avant 1945 entre régime général et salariés agricoles,
  donné au régime où l'assuré est entré le premier. La rente des assurances
  sociales, toujours servie pour zéro.
