date: "2026-10-16"
session: "action 138, étape 8 : la pension majorée de référence unique de 2022 aux pensions des exploitants prises depuis 2009"
consulte: >-
  L'index LEGI du dépôt, récupéré à jour au 11 octobre 2026 : L. 732-54-2 dans sa
  rédaction du 1er janvier 2022 (LEGIARTI000044522709), D. 732-111 dans celle du
  1er janvier 2022 (LEGIARTI000044944271) ; l'index JORF : le décret n° 2021-1919 du
  30 décembre 2021 (JORFTEXT000044792131), sa notice.
trouve: >-
  La loi n° 2021-1679 (article 1er, II) rend la PMR unique « applicable[] aux pensions
  dues à compter de [1er janvier 2022], y compris aux pensions de retraite ayant pris
  effet avant cette date » ; le décret n° 2021-1919 (article 2) en dit autant de
  D. 732-111 et de D. 732-113. La majoration d'une pension prise de 2009 à 2021 se
  refait donc depuis 2022 à la règle des pensions dues : un seul montant, quel que
  soit le statut, et le plafond relevé ; le montant et le plafond de septembre 2023
  et de 2026 ne nomment que les pensions prises depuis. Les deux moteurs la servent à
  chaque échéance depuis 2022. Fiche pension_majoree_reference : la rédaction de
  L. 732-54-2 citée, l'écart déclaré récrit ; le cliquet des textes descend à 9 721.
reste: >-
  Aucun texte ne dit si la durée minimale de D. 732-109 (2009 à janvier 2014), qui a
  refusé une PMR au départ, la refuse encore en 2022 : le modèle la garde (présomption
  déclarée dans la fiche). Un exemple chiffré de la MSA d'une conjointe partie à PMR2
  et relevée en 2022. La révision de la majoration quand les ressources changent, de
  2009 à 2021 et pour les pensions prises depuis 2022.
