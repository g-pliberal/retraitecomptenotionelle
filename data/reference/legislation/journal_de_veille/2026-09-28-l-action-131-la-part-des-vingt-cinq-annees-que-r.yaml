date: "2026-09-28"
session: >-
  l'action 131, la part des vingt-cinq années que R. 173-3-2 laisse aux
  régimes alignés d'un ancien exploitant, portée
consulte: >-
  L'index LEGI : R. 173-3-2 (lu pour la réforme agricole), R. 173-4-3
  dans ses rédactions de 2010 et de 2019 (celles de 2004 et de 2006 non
  lues), R. 351-29-1 dans sa rédaction de 2007.
trouve: >-
  Depuis 2026, la première répartition de R. 173-3-2 partage les
  vingt-cinq années entre les régimes alignés et celui des exploitants.
  De 2004 à 2025, R. 173-4-3 partageait déjà le nombre d'années entre le
  régime général, les salariés agricoles et le RSI, au prorata des
  durées, arrondi au plus proche sans descendre sous un, pour les
  pensions que la liquidation unique ne réunit pas : le moteur ne le
  porte pas.
reste: >-
  R. 173-4-3, de 2004 à 2025 ; le partage entre régimes alignés de la
  part de R. 173-3-2 pour qui est né avant 1953.
