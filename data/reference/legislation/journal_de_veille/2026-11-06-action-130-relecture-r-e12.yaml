date: "2026-11-06"
session: "action 130, file R-E12 : relecture de E11 (la Cipav de surcote_par_age_seul relue au Journal officiel, les écarts de R-E11 repris, 50154a0)"
consulte: >-
  Les index de la DILA récupérés et mis à jour : JORF au 6 novembre 2026 (incrément
  20261106-002608), LEGI au 5 novembre. Au JORF, sans borne de réponses, au titre de 1975
  à 2026 et au texte de 2006 à 2026 : tous les arrêtés des statuts de la Cipav, lus en
  entier, du 3 octobre 2006 (JORFARTI000002050100) au 17 septembre 2025 ; les décrets
  n° 2022-1746 et n° 2026-239 ; le décret n° 2026-418, ses 32 documents d'articles et ses
  visas. Dans LEGI : décret n° 49-579, articles 4 (1996, 2024, 2026), 4-2 et 4-3 ; décret
  n° 50-28, article 2 (ses douze versions depuis 1981). Hors du Journal officiel : les
  « Statuts Cipav au 01/01/2023 », retéléchargés (SHA-256
  e5034d618178585fdae444ec690247ef83c7e94d7e9ca741682fb98562093790), articles 3.4 à 3.16.
trouve: >-
  Aucun arrêté ne manque à la liste de E11 ; seuls ceux de décembre 2021 et de mars 2023
  nomment l'article 3.15. Les citations, les relevés et les montants de E11 tiennent au
  centime dans les deux moteurs, sous les deux jeux de présomptions (565,79, 542,83,
  537,96 € depuis 2023 ; 152,05 € de 2013 à 2022 ; 419,43 € de 2007 à 2012). Écart moyen :
  l'arrêté du 3 octobre 2006 approuve aussi des « dispositions transitoires » et ne
  supprime les articles 16 et 17, alinéa 2, des statuts de 1979 que le 1er janvier 2008,
  au seul Bulletin officiel, ce que E11 tronque : l'application de l'article 3.15 dès 2007
  n'est pas prouvée. Écarts mineurs : le test du décret reste vert sur une table réduite ;
  le bloc « Reprise » dit six régimes à lire quand il en reste sept. Pour mémoire :
  l'article 3.12 ajouté en 2010 est devenu 3.12 bis sans arrêté publié.
reste: >-
  À E12 : la réserve de 2006 dans `surcote_par_age_seul` et `decret_2026_418_liberaux` ;
  la garde de la table du test du décret ; le bloc « Reprise » (sept régimes, « au
  moins 419,43 € », le décompte de l'article 3.6). Au Bulletin officiel (question 22) :
  les statuts de 1979 et l'annexe de 2006, dispositions transitoires comprises.
