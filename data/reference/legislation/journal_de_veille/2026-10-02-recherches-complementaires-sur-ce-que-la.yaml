date: "2026-10-02"
session: >-
  recherches complémentaires sur ce que la garantie minimale de points laissait
  ouvert, à la demande du propriétaire : « Fait des recherches complémentaires pour ce
  qui est encore ouvert. Par contre, je ne veux pas prendre les contributions
  d'équilibre ; ce ne sont pas des cotisations » (action 139, deuxième suite ; action
  140 abandonnée)
consulte: >-
  L'index JORF du dépôt, mis à jour au 2 octobre 2026 : l'arrêté du 2 novembre 1992
  (JORFTEXT000000162226) et l'avis d'extension de l'accord du 13 mars 2013 ; l'accord
  Agirc du 25 avril 1996, articles 1er à 7, dans la copie du Medef ; le barème IPP de la
  garantie que reprend OpenFisca-France (gmp_cot_f_a) ; la fiche Agirc 9 de
  l'UGICT-CGT (2015) ; les fiches C190 à C195 de GERESO (2010). `veille_droit.py`, et
  l'index LEGI : aucun incrément depuis le 1er octobre 2026 au soir, L. 161-17-2 et L.
  161-17-3 sans version nouvelle. Le journal datant du jour, aucun autre texte paru
  depuis n'était à consulter.
trouve: >-
  La garantie visait 144 points par an de 1989 à 1996 (accord du 8 décembre 1988,
  étendu par l'arrêté du 24 février 1989), ramenés à 120 au 1er janvier 1997 par
  l'accord du 25 avril 1996 (art. 7) ; le dépôt en supposait 120 dès 1989, et citait un
  « accord du 9 février 1988 ». Le forfait annuel publié, de 2 843 F en 1989 à 872,52 €
  en 2018, est désormais ce que le modèle prélève et ce qui fixe les points : 144 en
  1989 et en 1990, 136,31 en 1996, quand le même accord majora le salaire de référence
  d'un forfait déjà fixé. Plusieurs employeurs se partagent un forfait au prorata des
  salaires (GERESO). La contribution que l'accord de 1996 crée à la place des autres
  cotisations forfaitaires est « non génératrice de droits ».
reste: >-
  L'accord du 8 décembre 1988 et son avenant du 13 juin 1991, ni au JORF ni dans KALI ;
  ce qui fait acheter au forfait de 1991 à 1995 de 142,45 à 146,62 points ; une
  publication de la fédération pour les forfaits d'avant 2008 ; les circulaires
  Agirc-Arrco 2017-07-DT et 2017-12-DRJ ; un texte de l'Agirc qui fonde le prorata du
  temps partiel.
