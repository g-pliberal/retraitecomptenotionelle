date: "2026-11-19"
session: "action 191 : la pension de la Cavimac du 1er novembre 2006, rendue à la formule d'avant le décret"
consulte: >-
  Rien de neuf : les textes lus le 17 novembre 2026 dans l'index JORF et
  LEGI de la DILA, décret n° 2006-1325 (article 2, JORFARTI000001085913,
  publié le 1er novembre 2006 sans date propre), loi n° 2005-1579
  (article 75), D. 721-6 et D. 721-7 du code de 1985.
trouve: >-
  Le calcul appliquait la formule du décret, majoration du V comprise, à la
  pension prenant effet le 1er novembre 2006, la veille de son entrée en
  vigueur. Corrigé : la première pension que le décret régit prend effet le
  1er décembre 2006. Bornes de la fiche cultes_fractions_de_pension au
  2 novembre.
reste: >-
  La pension des périodes d'après 1997, liquidable seule dès soixante ans de
  janvier à novembre 2006 (loi n° 2005-1579), que le moteur ne sait pas
  servir à part : écart déclaré, à la décision du propriétaire.
