date: "2026-09-22"
session: "un emploi classé n'a pas la durée de sa génération"
consulte: >-
  Index LEGI du dépôt : article 10 de la loi n° 2023-270 du 14 avril 2023,
  version LEGIARTI000053280920, XXIV lu en entier ; article 13 du décret
  n° 2023-435 du 3 juin 2023, version LEGIARTI000054059137 issue du décret
  n° 2026-344, lu en entier ; article L. 161-17-3 du code de la sécurité
  sociale, version LEGIARTI000028494794 du 22 janvier 2014, celle à
  laquelle les deux textes renvoient pour les générations d'avant la
  réforme.
trouve: >-
  LA DERNIÈRE LIGNE `manque` DU REGISTRE EST FERMÉE, et sa lecture a élargi
  le chantier. Le registre visait la dérogation du B — 169 trimestres des
  nés de septembre 1966 à 1967, 172 dès 1971 — ; mais le « a) » du même B
  renvoie, pour ceux qui naissent avant, à la durée applicable avant la
  réforme de 2023, si bien que la dérogation commence en réalité dès 1961.
  Quatre générations de plus. La correction rend +1,78 % de pension à un
  fonctionnaire d'État de catégorie active né en 1967 parti à soixante ans,
  +1,18 % à un né en 1969, +0,60 % à un né en 1962 — la durée requise
  commandant aussi la proratisation dans la fonction publique.
  UNE NON-MONOTONIE EST DANS LE TEXTE et la table la reproduit : un
  super-actif né en juin 1971 se voit opposer 171 trimestres par l'ancienne
  table, celui qui naît en octobre 1971 seulement 169, la dérogation
  nouvelle commençant au 1er septembre 1971 et recommençant à 169.
reste: >-
  LE C DU MÊME XXIV n'est pas porté : la durée des fonctionnaires civils et
  des militaires qui liquident avant soixante ans sans être classés — 169
  trimestres, puis un de plus au 1er janvier 2025 et au 1er janvier 2027, la
  table commune à compter de 2028. `docs/limites.md` le dit.
  PLUS AUCUNE LIGNE DU REGISTRE N'EST `manque` : les trois qui l'étaient —
  la majoration pour enfants, les trimestres réputés cotisés, la durée des
  emplois classés — ont été fermées les 21 et 22 septembre 2026.
prochaine_veille: "2027-03-31"
