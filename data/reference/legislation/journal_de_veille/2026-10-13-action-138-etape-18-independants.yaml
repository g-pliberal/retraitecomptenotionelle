date: "2026-10-13"
session: "action 138, étape 18, première partie : le plafond propre du RCI, le barème propre des artisans et l'assiette abattue"
consulte: >-
  veille_droit.py (dernière veille consignée : 13 octobre). L'index LEGI du dépôt,
  récupéré puis mis à jour de l'incrément du 12 octobre 2026 ; textes.py --inscrire,
  aucune rédaction nouvelle. Dans l'index : D. 635-7 (rédactions de 2013, 2017, 2020
  et 2024), D. 635-9 (2013, 2020), D. 633-3 (rédactions de 2014, 2015, 2016, 2020 et
  2024, et celles de 1985 à 2008, d'un autre objet), L. 136-3 (2023, 2025), D. 136-5
  (2024), L. 131-6 (2023). À la Cnav, par sa base de législation : les circulaires
  2020-16, 2020-42, 2021-36, 2022-37, 2023-33, 2024-36, 2025-31 et 2026-23, et le
  barème rci_valeur_achat_point_bar. Ailleurs : le barème IPP de la cotisation de
  retraite complémentaire des artisans-commerçants, les tableaux de Harvest, de
  Weblex et de Legisocial (2015, 2017, 2018), la brochure vieillesse du RSI de
  Saint-Pierre-et-Miquelon (2016), le barème 2020 de la CPS de Saint-Barthélemy, la
  page de la réforme de l'assiette sociale d'impots.gouv.fr.
trouve: >-
  De 2013 à 2024, la première tranche du RCI s'arrête à un plafond propre au régime
  (D. 635-7) : 37 032 € en 2013, 37 513 € en 2014 et 2015, 37 546 € en 2016 et 2017,
  37 846 € en 2018, 37 960 € en 2019, 38 340 € en 2020, puis 38 493, 38 916, 40 784 et
  42 946 € selon les circulaires Cnav 2020-42 à 2023-33 ; la seconde part de lui. La
  rédaction du 7 juillet 2024, pour les périodes courant depuis 2025, coupe au plafond
  de la sécurité sociale, quand les circulaires 2024-36 et 2025-31 publient encore un
  plafond propre (43 891 et 44 286 €) en citant la rédaction remplacée. Depuis 2018,
  l'artisan et le commerçant cotisent au régime général à leur barème de D. 633-3 :
  17,15 % sous le plafond et 0,60 % sur la totalité, 0,72 % pour les périodes depuis
  2025 ; la rédaction de 2016 porte en note la dérogation de 0,5 % pour 2016. Pour les
  périodes courant depuis 2025, l'assiette sociale de l'indépendant non agricole est
  son revenu avant cotisations abattu de 26 % (L. 136-3, III), l'abattement borné
  entre 1,76 % et 130 % du plafond (D. 136-5) ; elle inclut ses revenus de
  remplacement et exclut son épargne salariale (L. 131-6). Aucun exemple chiffré
  publié n'a été trouvé pour aucune des trois règles.
reste: >-
  Les publications du RSI de 2014, 2015, 2018 et 2019, dont les plafonds ne sont lus
  que chez des tiers ; l'usage du plafond propre que la Cnav publie encore pour 2025 et
  2026 ; un exemple chiffré de l'assiette abattue, à rejouer. Le reste de l'étape
  138.18 : les cotisations PCV, les points d'incapacité, le conjoint collaborateur,
  les dispenses de l'assiette minimale, les points d'avant 1973 des artisans et des
  commerçants, la Lodeom ; les grilles de la CAVEC et de la CNBF (action 131) et
  Mayotte (action 121) restent à leurs sessions.
