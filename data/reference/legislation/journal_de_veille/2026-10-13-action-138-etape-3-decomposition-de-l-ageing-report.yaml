date: "2026-10-13"
session: "action 138, étape 3, deuxième partie : la décomposition dépendance × couverture × prestation, confrontée à l'Ageing Report de 2024"
consulte: >-
  Aucune source de droit : la session ne touche ni au scénario 1 ni à une règle, mais
  décompose la trajectoire que la page Coût projette. Le 2024 Ageing Report de la
  Commission européenne et du Comité de politique économique : la fiche France
  (2024-ageing-report-country-fiche-France.pdf, tableaux 6 à 20, A3 et figure 4), le
  volume 1 (Institutional Paper 279, encadré I.1.1 et tableau I.1.10) et l'annexe
  statistique des fiches pays (feuilles FRa et FRb), sur economy-finance.ec.europa.eu.
trouve: >-
  Aucun texte de droit. La formule par laquelle l'AWG chiffre l'effet d'un facteur,
  qu'aucun des trois documents n'écrit : pas à pas de cinq ans, la dépense au début du
  pas fois la variation relative du facteur ; l'annexe la redonne au dix-millième de
  point. Le système actuel du modèle monte de 1,3 point de PIB de 2022 à 2070, quand
  l'AWG le fait baisser de 0,9 : la démographie de l'INSEE de 2026, plus vieille que
  celle d'Eurostat de 2023, la couverture, qui recule moins de 2022 à 2030, et l'emploi
  du COR ; sous une productivité proche de celle de l'AWG, la prestation recule autant.
  La fiche France projette la loi de 2023 entière, sans la suspension de la LFSS pour
  2026 (écart déjà consigné au registre, `ageing_report`).
reste: >-
  Le reste de l'étape 3 : le levier de l'âge, la CSG effective, les contrôles d'Ancetre
  et de l'EACR, les retraités par régime ; et, de la décomposition, le flux des pensions
  nouvelles, la dépense nette, les têtes de la proposition, l'Ageing Report sous la
  démographie et l'emploi de l'AWG.
