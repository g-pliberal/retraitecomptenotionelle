date: "2026-10-01"
session: >-
  la fin de la troisième étape du cinquième domaine — l'ASPA hors de France, la page —,
  et sa quatrième : les exemples publiés, et la règle d'un seul accord à la fois
consulte: >-
  Les pages du CLEISS lues à l'ouverture du domaine, relues pour leurs exemples : les
  cinq pages de la retraite après une carrière à l'étranger (règlements européens,
  un seul accord, plusieurs accords, les règlements et un accord, un État sans
  accord) et les pages des conventions avec le Brésil, le Canada, l'Inde, le
  Maroc, la Serbie, la Tunisie et l'Uruguay, pour leurs États tiers ; les exposés «
  Retraite personnelle » de la Cnav pour le Canada, la Serbie, la Tunisie et
  l'Uruguay ; la circulaire Cnav n° 2021/33, points 3 et 4. Aucun texte nouveau.
trouve: >-
  Huit calculs de Léna et de Jahan, et l'exemple 1 de la circulaire n° 2021/33, que
  le modèle rend. La caisse ne totalise que les périodes d'un seul accord — « elle
  retiendra uniquement les périodes algériennes ou uniquement les périodes
  monégasques » —, sauf celles d'un État tiers que sept conventions font compter, à
  condition qu'il soit lié aux deux États : le CLEISS en donne la liste en 2026. Le
  CLEISS rapporte, dans son exemple franco-japonais, la part française à la durée des
  trois États, quand l'accord n'en totalise que deux.
reste: >-
  Les listes d'États tiers à leurs dates d'avant 2026 ; le champ matériel commun aux
  accords qu'elles supposent ; la règle de la caisse des fonctionnaires ; un exemple
  chiffré de la Cnav pour le minimum de la pension proratisée et pour l'écrêtement
  sur une pension étrangère, que ni ses exposés ni ses circulaires lues n'ont donné.
