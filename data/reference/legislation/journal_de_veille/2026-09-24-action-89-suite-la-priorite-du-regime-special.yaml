date: "2026-09-24"
session: "action 89, suite : la priorité du régime spécial pour les trimestres des enfants"
consulte: >-
  Dans l'index LEGI : R. 173-15 du code de la sécurité sociale dans ses
  six versions depuis 1985 ; R. 13, L. 4, L. 6, L. 12 bis et R. 4-1 du
  code des pensions dans leurs versions ; les articles qui fixent la
  durée de services de chaque régime spécial — décrets n° 65-773,
  2003-1306, 65-836, 2004-1056, 2008-639, 2008-637, 46-1541 (annexe 3),
  2007-262, 68-382, 68-960, 62-766, et L. 5552-11 du code des transports ;
  les majorations « aux femmes ayant accouché postérieurement à leur
  recrutement » de chaque régime. Dans l'index JORF, le décret
  n° 2008-47 de la SNCF. Les pages de juris-cnracl sur la coordination,
  la bonification pour enfants et la majoration des enfants nés depuis
  2004 ; les fiches CPRPF et CRP RATP du COR de juillet 2024.
trouve: >-
  Le modèle donnait les trimestres des enfants au régime qui en accordait
  le plus ; R. 173-15 les donne au régime spécial qui peut pensionner et
  où le droit est ouvert, puis au régime général, puis au dernier régime.
  Une fonctionnaire de l'État passée au privé perd ainsi huit trimestres
  pour deux enfants nés avant 2004, que l'État ne lui a jamais dus. La
  durée qui ouvre une pension est partout de quinze ans avant les
  réformes, de deux ans pour les fonctionnaires radiés depuis 2011, d'un
  an pour les agents partis de la SNCF, de la RATP, des IEG et de l'Opéra
  depuis le 1er juillet 2008 ; la Banque de France, la Comédie-Française
  et la pension spéciale des marins n'en exigent aucune. Corrigé dans les
  deux moteurs, avec une table de ces durées.
reste: >-
  Aucun exemple publié pour en faire un témoin officiel. Les règlements de
  la SNCF et de la RATP d'avant 2008 ne sont pas dans l'index : leurs
  quinze ans viennent des fiches du COR. Le port de Strasbourg, la caisse
  de Nouvelle-Calédonie, les chemins de fer secondaires et les pensions
  d'avant 1948 restent sans durée lue. Hors du modèle : le rétablissement,
  l'interpénétration, l'exception de la CRPCEN, l'enfant handicapé.
