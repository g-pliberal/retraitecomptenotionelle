date: "2026-10-28"
session: >-
  action 138, étape 4, au site : la phrase de la carte de la réversion qui dit les mois
  des ressources que la date d'effet retient (`periode_de_reference`) et le moment
  qu'ils précèdent (`ressources_examinees_au`), et la présomption qui date la demande
consulte: >-
  Aucun texte neuf : l'étape ne touche à aucune règle et dit ce que le modèle rend
  depuis le 25 octobre (R. 353-1, rédactions de 1985, de 1990 et du 25 août 2004 ;
  circulaire Cnav n° 31/75, § 233 ; notes
  `2026-10-25-etape-4-trois-ou-douze-mois-de-la-date-d-effet.md` et
  `2026-10-25-etape-4-date-de-la-demande-et-du-deces.md`).
trouve: >-
  Rien de neuf au droit. La ligne du modèle ne dit pas les moments que sa version
  examine : au décès, la carte ne peut dire que la demande l'a été d'abord.
reste: >-
  Rien pour la veille. Au site, le plancher non majoré, et ce que la note des
  révisions a vu en chemin (note `2026-10-28-etape-4-periode-et-moment-au-site.md`).
