date: "2026-11-05"
session: "action 177, file D : le minimum de la cotisation complémentaire des artisans et des commerçants, jusqu'en 2015"
consulte: >-
  `python scripts/veille_droit.py` : la base de la Cnav sans barème changé ; deux exposés
  à date changée et la circulaire ministérielle n° 2026/140, hors du sujet. L'index LEGI
  récupéré et mis à jour (à jour au 4 novembre 2026). Dans l'index LEGI, version par
  version : le décret n° 78-351, article 3 (LEGIARTI000006766103) ; D. 635-4, de 1985 à
  2004 (LEGIARTI000006738335 à LEGIARTI000006738338) ; D. 635-2, ses rédactions de 1985 à
  2020, mot à mot ; D. 633-2, ses rédactions de 2006 à 2016 ; D. 612-6, celle de 2012
  (LEGIARTI000025629812) ; D. 635-7 et D. 635-10, de 1985 à 2013 ; le décret n° 2012-443,
  articles 4 à 10 ; L. 133-6-8, de 2009 à 2015.
trouve: >-
  La complémentaire des artisans, puis celle des commerçants, puis le RCI avaient un
  minimum : « le montant de cette cotisation ne peut être inférieur à celui qui serait dû
  au titre d'un revenu égal au revenu minimum » de la base, 200 heures du Smic du
  1er janvier (décret n° 78-351, article 3, I ; D. 635-4 ; D. 635-2 jusqu'au 5 avril 2012),
  hors du forfait de début jusqu'en 2004 ; puis, dès quatre-vingt-dix jours d'affiliation,
  l'assiette de la base, 5,25 % du plafond, de 2012 à 2014 ; 5,25 % du plafond annuel du
  1er janvier en 2015, quand la base prend 7,70 % (D. 635-2, LEGIARTI000030034575 ;
  D. 612-6, premier alinéa) ; plus rien depuis 2016. Le garde-fou de 200 heures du décret
  n° 2012-443 (article 4, V) n'a jamais joué. Le micro-entrepreneur n'y est pas soumis
  (L. 133-6-8). Écrit dans les deux moteurs (quatre lignes de la série de l'assiette
  minimale), un témoin de plus ; aucun des 930 témoins ne bouge.
reste: >-
  Le forfait de début de l'artisan, de 2004 à 2011 : D. 635-2 pose le minimum « sous
  réserve » de D. 635-7 sans dire s'il s'y oppose ; le modèle ne l'y oppose pas. La
  cessation de 2012, qui garde l'ancien droit (décret n° 2012-443, article 10, II), à la
  complémentaire comme à la base : le modèle ne le sert à aucune des deux (candidat). Un
  exemple de la caisse du minimum de la complémentaire : aucun lu. Le salarié de
  Mayotte, que le propriétaire n'a pas autorisé ; le forfait du commerçant qui commence
  et celui de l'artisan de 2009 à 2011, pour une autre file.
