date: "2026-11-07"
session: "action 186, chantier 6 : les planchers propres à certaines caisses (décision 42, rouverte), étudiés aux sources pour le programme : qui perd, combien, et ce que le droit permet"
consulte: >-
  Aucune règle du scénario 1 n'est touchée. La note de la CNRACL au COR sur
  les bénéficiaires du minimum garanti (séance du 16 février 2023, document
  n° 8) et celle du secrétariat du COR sur les minima de pension et l'ASPA
  (même séance, document n° 4) ; les fiches du COR de juillet 2024 sur la
  CNRACL, la CPRPF (SNCF) et la CNIEG ; les pages de la CNIEG sur son
  minimum de pension. Relevés par le moteur de recherche, les sites ayant
  refusé la lecture automatique : la fiche 08 de la DREES (édition 2025),
  l'indicateur 1.12 du REPSS retraites, le rapport du Sénat n° 249
  (2021-2022) et une réponse ministérielle de 2016 sur le complément
  différentiel de la RCO, la fiche thématique de la CEDH sur les mesures
  d'austérité (arrêt Valkov et autres c. Bulgarie). L'index LEGI de la DILA
  (à jour au 2 novembre 2026), interrogé à la date du 7 novembre 2026 :
  L. 17, L. 24 et L. 55 du code des pensions civiles et militaires, l'article 22 du
  décret n° 2003-1306, l'article 18 du décret n° 2004-1056, l'annexe du
  décret n° 2007-262, L. 732-63 du code rural, L. 815-13 du code de la
  sécurité sociale. Les fiches du dépôt minimum_pension_sncf et
  minimum_pension_ieg, et la note de la réversion pour la jurisprudence.
trouve: >-
  Le minimum garanti de la CNRACL est servi à 479 156 retraités fin 2021
  (36,8 % des droits directs), pour un gain moyen de 224,30 € par mois, et à
  17 685 nouveaux retraités en 2021 ; celui de l'État à 154 000 retraités
  fin 2024 (relevé). Le complément différentiel de la RCO, depuis le
  1er janvier 2026, compte aussi les périodes de chef d'exploitation à titre
  secondaire, pour les pensions qui prennent effet à cette date (L. 732-63,
  rédaction des lois de financement pour 2025 et 2026). Le décret
  d'écrêtement que L. 17 et l'article 22 attendent n'a toujours pas paru.
  Le minimum de la SNCF n'a pas de montant de 2026 publié : 1 425,77 € à
  1 435,72 € selon la revalorisation appliquée en 2020 (à côté). Aucune
  erreur des fiches du dépôt n'est déclarée.
reste: >-
  Les bénéficiaires des minima de la SNCF, des IEG, des ouvriers de l'État
  et de la Banque de France, le gain moyen du minimum garanti de l'État, la
  dépense totale du complément agricole : à demander à la CPRPF, à la
  CNIEG, au SRE et à la MSA. La fiche 08 de la DREES et l'indicateur 1.12
  du REPSS, à relire quand leurs sites répondent. La revalorisation de 2020
  du minimum de la SNCF, à demander à la CPRPF. Le propriétaire a tranché
  (décisions 62 à 66, 69 et 78 : la garantie dès l'invalidité, pour tous
  les invalides). Restent : les conflits de cette garantie avec chaque
  caisse et chaque complémentaire, à vérifier dans une session neuve à
  partir des cinq déjà visibles (L. 29 du code des pensions, L. 341-1,
  L. 821-1 et L. 821-3 du code de la sécurité sociale, lus à l'index LEGI ;
  fin de la note 186/2026-11-07-planchers-etude.md) ; les réserves des IEG.
