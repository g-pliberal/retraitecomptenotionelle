date: "2026-10-19"
session: "action 138, étape 12 : la nouvelle pension de l'indépendant en cumul, sur son revenu annuel moyen"
consulte: >-
  L'index LEGI du dépôt, mis à jour au 18 octobre 2026 (huit incréments, aucune
  rédaction nouvelle à inscrire) : R. 634-1 (LEGIARTI000047961079, sans rédaction
  après le 31 décembre 2025) ; D. 634-1 (LEGIARTI000047961824, LEGIARTI000049917702,
  LEGIARTI000053356087) ; D. 634-3 (LEGIARTI000053356107) ; R. 351-29
  (LEGIARTI000053335651) ; R. 351-9 (LEGIARTI000028751530) ; R. 173-3-2
  (LEGIARTI000054589934) ; les articles qui citent R. 351-29 depuis 2023, dont
  R. 732-60 du code rural (LEGIARTI000053336726). À la base de législation de
  l'Assurance retraite, par sa
  recherche (« nouvelle pension travailleurs indépendants », « revenu annuel moyen »,
  « D634-3 », « cumul emploi retraite indépendants nouveaux droits », « salaire
  mensuel moyen ») : les exposés « Retraite personnelle issue d'un cumul emploi
  retraite » (modifié le 28 septembre 2026) et « Revenu annuel moyen » (modifié le
  20 juillet 2026) ; les circulaires n° 2026-4, 2026-7 et 2026-13, sans rapport à
  leur objet.
trouve: >-
  La nouvelle pension de l'indépendant se calcule sur son revenu annuel moyen, et non
  sur le salaire mensuel moyen du salarié : de 2023 à 2025, D. 634-1 écarte R. 351-29
  et R. 634-1 fait la moyenne des revenus cotisés des années qui valident un
  trimestre, l'année de l'effet comprise ; depuis 2026, D. 634-3 applique R. 351-29
  sans ses III et IV, l'année d'entrée en jouissance restant (5°, qui vise
  L. 161-22-1). La Cnav l'écrit : « le salaire mensuel moyen (travailleurs salariés)
  ou le revenu annuel moyen (travailleurs indépendants) de la période de référence »,
  « Les salaires de la dernière année sont retenus même si cette année est
  incomplète », sans exemple ni instruction publiée. Porté dans les deux moteurs :
  au même revenu, de la moitié à la totalité de la nouvelle pension d'une salariée,
  631 € au lieu de 757 € pour trente mois sur trois années civiles ; aucun témoin
  existant ne bouge. La même classe : R. 732-60 du code rural écarte aussi le III
  de R. 351-29 pour l'exploitant agricole depuis 2026, dont le modèle ne calcule
  pas la nouvelle pension ; aucun texte ne l'écarte des salariés agricoles.
reste: >-
  La « Circulaire Cnav RAM », dont l'exposé cite le § 5 sans lien, et son exemple ;
  le RCI de l'indépendant en cumul intégral, que le modèle ne calcule ni ne nomme ;
  la cotisation minimale de l'artisan et du commerçant en cumul (D. 633-2), que la
  nouvelle pension ne porte pas ; la veille du projet de loi de financement pour
  2027.
