date: "2026-11-21"
session: "action 130 : la réversion de l'Agirc-Arrco au terme de la période du défunt"
consulte: >-
  L'index KALI du dépôt, à jour du 13 novembre 2026 : accord national
  interprofessionnel du 17 novembre 2017 (KALITEXT000036731682), article 106
  (KALIARTI000036731860, KALIARTI000047205218), article 107
  (KALIARTI000036731861), article 116 (KALIARTI000036731971), articles 111
  et 116 cherchés par « mensuellement », « trimestriellement »,
  « périodicité » et « échoir ». La circulaire Agirc-Arrco 2020-02-DRJ, même
  empreinte que la fiche (sha256 5247798…), fiche 5, III. Fiche
  reversion_agirc_arrco. scripts/veille_droit.py : rien à relire sur cette
  fiche.
trouve: >-
  L'allocation est payée au mois en France et dans trente-deux États,
  trente-cinq depuis 2021, au trimestre ailleurs, à l'année de 100 à 200
  points ; la réversion d'un allocataire part au premier jour du mois ou du
  trimestre civil qui suit le décès (article 116), à l'année suivante pour
  l'allocation annuelle (exemple de Simone de la fédération). Le modèle
  servait tout au mois ; corrigé pour un décès depuis 2019 : les exemples
  de François, David et Simone concordent. Détail :
  docs/feuille_de_route/130/2026-11-21-periodicite-de-la-reversion-agirc-arrco.md.
reste: >-
  Les règlements de l'Arrco et de l'Agirc d'avant 2019, et la date de leur
  mensualisation ; la réversion de 100 points au plus, que l'article 107
  verse en capital au survivant. Le détail, dans la note.
