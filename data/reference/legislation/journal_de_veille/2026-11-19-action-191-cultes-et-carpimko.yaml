date: "2026-11-19"
session: "action 191 : le minimum des cultes et la carrière longue de la Carpimko, relus au texte"
consulte: >-
  Dans les index LEGI et JORF, à jour au 16 novembre 2026 : L. 173-2 du code
  de la sécurité sociale, ses cinq rédactions ; la loi n° 2017-1836, article
  15, 20° ; L. 382-15 et L. 382-27 ; D. 173-21-4 et D. 173-21-5 ; L. 643-3,
  rédactions de 2023 et de 2025 ; l'arrêté du 27 décembre 2023 et l'arrêté du
  10 juillet 2026 de la Carpimko. Sur la base de législation de la Cnav, les
  exposés « Minimum contributif » (depuis 2012) et « Calcul du minimum
  contributif ». Sur cavimac.fr, « Demander ma retraite de base » ; sur
  carpimko.com, « À quel âge prendre ma retraite » et la notice « Départ
  anticipé 2024 ».
trouve: >-
  La rédaction de 2018 de L. 173-2 ne sort pas le régime des cultes du plafond
  du minimum contributif : ses assurés relèvent du régime général (L. 382-15),
  et la Cnav compte « le régime des cultes » parmi ceux entre lesquels le
  dépassement se répartit. La fiche minimum_contributif le déclare, le cliquet
  sans_un_mot passe de 1 à 0. Le III de L. 643-3 est le départ des assurés
  handicapés, non la carrière longue, qui est au II : ni les statuts ni le
  règlement de la Carpimko n'ouvrent la complémentaire à la carrière longue,
  et l'écart que les fiches déclaraient avant 2024 vaut aussi depuis. Aucun
  résultat ne change. Détail :
  docs/feuille_de_route/191/2026-11-19-cultes-et-carpimko.md.
reste: >-
  La correction du moteur pour la Carpimko, prête et mesurée, attend l'accord
  du propriétaire. Ce que la Cavimac et la Carpimko appliquent en fait n'est
  pas établi : aucune de leurs pages ne le dit. L'avantage social vieillesse
  des auxiliaires médicaux, servi sans coefficient au départ pour carrière
  longue, n'est pas instruit. Les fiches n'ont pas été relues en entier, et
  sources.lu_le ne bouge pas.
