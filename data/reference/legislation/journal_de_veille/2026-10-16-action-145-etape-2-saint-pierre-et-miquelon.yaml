date: "2026-10-16"
session: "action 145, étape 2 : Saint-Pierre-et-Miquelon"
consulte: >-
  veille_droit.py (aucune fiche de ce régime à relire) ; l'index LEGI mis à jour au
  15 octobre 2026, l'index JORF au 11 octobre. Puis : la loi n° 87-563, articles 1er à
  16, 20 et 21 dans leur rédaction de 1987, et articles 1er à 10 dans toutes leurs
  rédactions depuis 2015 ; le décret n° 89-110, articles 1er, 7 à 18 et 38-3 ; le décret
  n° 96-72, articles 1er à 6 ; le décret n° 2017-1000, articles 1er à 10, et l'article 3
  aux fenêtres de R. 351-9, R. 351-27, R. 351-29 et D. 351-1-4 ; l'ordonnance
  n° 2015-896, articles 1er à 5 ; les arrêtés du 12 septembre 1983, du 11 juillet
  1989, du 29 janvier 1996, du 24 septembre 1998 et du 31 août 2006 ; les décrets
  n° 2025-157 et n° 2025-159.
trouve: >-
  Une fiche de règles, approchée, pour le régime de la caisse de prévoyance sociale,
  qui n'avait que la fiche générique de liquidation ; aucun chiffre du scénario 1 n'en
  est changé. Avant juillet 2016, le revenu de base est la moyenne de toutes les années
  d'assurance (décret n° 89-110, art. 8), quand la fiche de régime prend les dix
  meilleures, et les années 1960 à 1987 entrent au forfait de 97 000 F revalorisé. Les
  taux de cotisation, que la ligne d'inventaire disait absents de l'index, sont écrits :
  10,5 % en 1989, 11 % en 1996, 11,5 % en 1998, puis, au plafond national depuis 2016,
  11,86 % montant à 15,09 % en 2025 (décret n° 89-110, art. 38-3 ; décret n° 2017-1000,
  art. 6-2), plus 0,20 % depuis 2025, et aucune part déplafonnée avant 2027 ; la fiche
  de régime prête ceux du régime général, de 42 à 52 % plus hauts jusqu'en 2016. La
  ligne d'inventaire est corrigée ; le cliquet des textes n'est pas touché.
reste: >-
  À lire : le décret qui fixe le forfait des années 1960 à 1987 depuis 2016 (loi
  n° 87-563, art. 5, 3°, f) ; le plafond de l'archipel de 1987 à 2015 et le taux
  d'avant septembre 1989 ; la réversion et les allocations minimales (loi, art. 21 à
  38) ; le régime de l'ordonnance n° 77-1102. À l'étape 2 : la CAFAT, les deux
  tranches de la CPS de Polynésie, Wallis-et-Futuna, les fonctionnaires du Pacifique,
  puis les hors champ (CRFM de Mayotte, élus du Pacifique, régies ferroviaires
  d'outre-mer).
