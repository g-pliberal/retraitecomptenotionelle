date: "2026-10-04"
session: "action 142 : le salaire de référence de l'Ircantec, lu"
consulte: >-
  veille_droit.py (la dernière veille consignée est du jour) ; dans l'index LEGI du
  dépôt, l'arrêté du 30 décembre 1970 (articles 9 bis, rédactions de 2018 et de 2026,
  et 10) et le décret n° 70-1277 (article 2, rédaction de 2020) ; dans l'index JORF,
  l'arrêté du 19 décembre 2025 ; sur le site de l'Ircantec, la valeur du point, les
  paramètres du régime, l'actualité du 28 décembre 2023, le rapport d'activité 2025 et
  l'annexe des salaires de référence de février 2026 ; la partie publique de deux
  dépêches AEF ; le rapport annuel du COR de juin 2026 et son annexe méthodologique,
  muets sur l'Ircantec.
trouve: >-
  Depuis 2018, le plan quadriennal du conseil d'administration fixe la règle : les deux
  premiers ont gardé le rendement réel de 7,75 %, la valeur de service et le salaire de
  référence indexés sur l'inflation ; en 2026, l'un et l'autre montent de 0,9 % et le
  taux d'appel passe à 127 %. À défaut de plan, l'arrêté les fait croître des deux
  tiers et des cinq tiers de la revalorisation des pensions. Les prix, jamais les
  salaires : le modèle, qui prolongeait le rendement du dernier barème, ne change pas
  (fiche ircantec_valeurs_point).
reste: >-
  Le plan de 2026 à 2029 (délibération n° 2025-12-15 du 11 décembre 2025), non publié,
  auquel une dépêche AEF prête un salaire de référence surindexé de 2,6 points à partir
  de 2028, une fois ou chaque année : le barème de janvier 2028, ou la délibération si
  elle se publie, le tranchera ; la clause de revoyure de 2027.
