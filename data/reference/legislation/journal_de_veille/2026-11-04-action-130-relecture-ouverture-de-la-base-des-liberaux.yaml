date: "2026-11-04"
session: "action 130, file R-L : relecture indépendante de l'ouverture de la base des libéraux (commits 5f19af8, 9772e14 et fc27dec, file L)"
consulte: >-
  python scripts/veille_droit.py ; docs/veille_droit.md. L'index de la DILA récupéré dans
  la session (LEGI à jour au 2 novembre 2026, JORF au 3 novembre) : L. 643-3
  (LEGIARTI000006743789, LEGIARTI000047453031, LEGIARTI000053280388) ; L. 351-1
  (LEGIARTI000023035688) ; L. 161-17-2 (LEGIARTI000025014605, LEGIARTI000053280889) ;
  D. 161-2-1-9 (LEGIARTI000025089933, LEGIARTI000047634502) ; L. 644-1, sept rédactions
  (LEGIARTI000006743962 à LEGIARTI000037063798) ; R. 643-6 (LEGIARTI000006751828),
  R. 643-7 (LEGIARTI000006751830), R. 643-8 à R. 643-10, L. 643-2
  (LEGIARTI000006743786), L. 643-5 (LEGIARTI000006743793) du code de 1985 ; L. 351-8
  (LEGIARTI000028498855, LEGIARTI000047452736) ; décret n° 50-1318, article 4 (quatre
  rédactions). Au JORF : statuts de la CARPV de 2021 (JORFARTI000044220745,
  JORFARTI000044220741) et leurs modifications de 2011, 2014 et 2015 ; règlement de la
  CARPV de 2026 (JORFARTI000054436031) ; statuts de la CAVEC de 2008, 2018, 2019 et 2024
  (JORFARTI000018197778, JORFARTI000037363871, JORFARTI000038689131,
  JORFARTI000049880543) et règlement de 2026 (JORFARTI000054435943) ; statuts de la CAVP
  de 2011 (JORFARTI000024270214 et les articles de l'arrêté) et règlement de 2026
  (JORFARTI000054436087) ; décret n° 2026-418, articles 6 et 8.
trouve: >-
  Conforme sur le fond : les citations sont exactes ; ni le code, ni les statuts lus, ni
  le décret n° 2026-418 ne lient la complémentaire de la CARPV (depuis 2022) ou de la
  CAVEC (depuis 2008) à la liquidation de la base, que L. 643-3 n'ouvre qu'à l'âge de
  L. 161-17-2 ; R. 643-7 ouvre l'allocation d'avant 2004 dès soixante ans, de 0,75 à
  0,95. Dix cas du test et deux témoins de 1925 et 1935 refaits à la main (−4,34 % et
  −2,89 %) ; les deux moteurs les rendent, sous PRESOMPTIONS_DECALEES=1 aussi ; le paquet
  est à jour. Écart moyen : les statuts de la CARPV de 2021 n'entrent en vigueur que le
  1er janvier 2022 ; avant, rien n'est lu, et la séparation d'avec la base est présumée
  sans être déclarée (trois cas du test). Écarts faibles : le cliquet (9 334, non 9 344) ;
  la déclaration du coefficient des biologistes omet les nés de juillet 1951 à 1954 ; la
  CRPNPAC n'est inscrite qu'au a_relire d'une fiche générale.
reste: >-
  À la file du modèle : déclarer la présomption de la CARPV d'avant 2022 dans
  liquidation_regime_par_regime et carpv_minoration_age_seul, et chercher ses statuts
  d'avant 2022 ; compléter la déclaration du coefficient des biologistes. À la file E :
  la CRPNPAC au bloc « Reprise » de l'action 130 (note
  2026-11-04-relecture-ouverture-de-la-base-des-liberaux.md de l'action 130).
