date: "2026-10-02"
session: >-
  les questions restées ouvertes sur la garantie minimale de points de l'Agirc, à la
  demande du propriétaire : « Occupe toi des problèmes qui sont encore restants »
  (action 139, suite)
consulte: >-
  La convention du 14 mars 1947, annexe I, articles 8 et 8 bis, dans la compilation de
  l'Agirc-Arrco, et l'article 8 bis dans la rédaction de 2006 que publie l'Unédic ;
  l'accord du 17 novembre 2017, articles 2 et 155, dans la copie de la Revue
  fiduciaire ; la circulaire Agirc-Arrco 2016-11-DRJ (paramètres 2017) ; les lettres
  circulaires 004-10 et 003-11 de l'UCANSS ; l'ASH du 16 janvier 2009 ; LégiSocial sur
  le prorata. Le journal datant du jour, aucun texte paru depuis n'était à consulter.
trouve: >-
  Les points Agirc d'une année de chômage indemnisé ne portent que sur la tranche B du
  salaire journalier de référence : pas de garantie, que le scénario 1 servait — corrigé.
  Un arrêt de travail reprend les points de l'année précédente, garantie comprise.
  L'accord du 17 novembre 2017 annule la convention de 1947 au 1er janvier 2019. Six
  montants publiés de la garantie, de 2008 à 2018, retombent au centime de chaque
  mensualité sur le prix que le modèle reconstitue ; ceux de janvier 2009 à 2012
  étaient provisoires.
reste: >-
  La circulaire Agirc-Arrco du 13 décembre 2017, introuvable en ligne ; un texte de
  l'Agirc qui fonde le prorata du temps partiel ; les montants de la garantie de 1989 à
  2007.
