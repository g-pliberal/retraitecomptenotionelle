date: "2026-11-07"
session: "action 186, chantier 5 : le facteur démographique et le plancher, chiffrés au modèle pour le scénario 6, et les trois voies du stock ; la suite rouge de 6d3ab61 réparée"
consulte: >-
  Aucune règle du scénario 1 n'est touchée, et aucun texte n'est relu : le
  plancher du droit actuel (L. 161-25 du code de la sécurité sociale, version
