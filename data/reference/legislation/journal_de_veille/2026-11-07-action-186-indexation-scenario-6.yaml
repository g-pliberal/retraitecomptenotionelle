  hypothèses de projection du COR (hypotheses_projection.yaml).
trouve: >-
  Rien qui touche les fiches. Le nombre de retraités par cotisant du COR monte
  de 0,50 % par an de 2027 à 2040 et de 0,77 % ensuite, moins vite au début
