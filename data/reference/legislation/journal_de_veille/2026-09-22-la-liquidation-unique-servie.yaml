date: 2026-09-22
session: la liquidation unique, servie
consulte: >-
  La suite de l'entrée précédente. Circulaire Cnav 2017/27 du 21 juillet
  2017, relue au § 4.2 : le revenu annuel moyen est formé de la somme des
  salaires et revenus d'une même année civile au titre des trois régimes,
  écrêtée au plafond de l'année — y compris pour les années antérieures à
  2005 —, sur les vingt-cinq années les plus avantageuses validant au moins
  un trimestre, sans proratisation du nombre d'années (R. 173-4-4-1, 4°) ;
  la durée de proratisation tient compte de tous les trimestres des trois
  régimes (1°) ; le montant est déterminé selon les règles du régime
  LIQUIDATEUR. Et les bornes : assurés nés à compter de 1953 (article 51 de
  la LFSS pour 2016), pensions prenant effet à compter du 1er juillet 2017
  (article 4 du décret n° 2017-737), et exclusion de qui avait déjà obtenu
  une retraite de même nature avant cette date.
trouve: >-
  LA RÈGLE EST SERVIE, DES DEUX CÔTÉS DU PORTAGE. Les régimes alignés
  qu'une carrière a traversés — régime général, salariés agricoles,
  CANCAVA, ORGANIC, RSI — se liquident maintenant ensemble dès que les deux
  conditions opposables sont réunies, la seconde au mois près : une pension
  prenant effet en janvier 2017 n'y a pas droit, celle de septembre oui.
  Une carrière moitié privée moitié agricole née en 1960 et partie à 64 ans
  reçoit « SR 40 749 € × 167/167 » au lieu de « SR 41 499 € × 88/167 » et
  « SR 29 069 € × 80/167 », soit 20 629 € de base au lieu de 18 121 €. Le
  groupe est liquidé par la caisse de la dernière période active, ce que la
  circulaire prescrit aussi (« les règles applicables au régime
  liquidateur »). AUCUN TÉMOIN N'A BOUGÉ : la grille de cas types n'exerce
  qu'un statut à la fois, et la Lura ne se voit que sur un polypensionné —
  d'où un essai dédié en Python et un dans le moteur JavaScript, le tirage
  au hasard du portage ne tirant lui aussi qu'un statut.
reste: >-
  Deux choses qu'une carrière du dépôt ne peut pas produire, et
  `limites.md` les porte : la troisième condition de la loi — l'exclusion
  de qui avait déjà liquidé avant le 1er juillet 2017 —, une carrière du
  modèle liquidant tout à la fois ; et la somme des revenus d'une MÊME
  année civile avant écrêtement, un parcours n'exerçant qu'un métier à la
  fois. Reste aussi le cas que le modèle ne sait pas distinguer : après
  l'absorption du RSI, les années d'artisan et les années de salarié
  portent le même code de régime, si bien qu'un assuré né avant 1953 et
  liquidant après 2020 est réuni par la chaîne d'absorption alors que la
  loi ne le réunit pas.
