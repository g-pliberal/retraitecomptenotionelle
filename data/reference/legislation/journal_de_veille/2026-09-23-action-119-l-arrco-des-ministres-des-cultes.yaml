date: "2026-09-23"
session: "action 119, l'Arrco des ministres des cultes"
consulte: >-
  Dans les index LEGI et JORF : L. 921-1 dans toutes ses versions,
  l'article 75 de la loi du 19 décembre 2005, R. 382-89 et R. 382-90,
  l'avis d'extension de l'avenant n° 25 à l'accord Agirc-Arrco. La
  réponse ministérielle au Sénat du 16 janvier 2008 ; l'espace partenaires
  de la CAVIMAC, sa page sur la retraite de base et ses circulaires de
  cotisations de novembre 2021 à juin 2026 ; les circulaires Agirc-Arrco
  2019-1-DRJ et 2020-02-DRJ.
trouve: >-
  L'Arrco depuis 2006 pour qui perçoit une rémunération individuelle, sur
  le forfait du SMIC et au taux de base de l'Agirc-Arrco : le statut ne la
  routait à personne. La page de la retraite de base dit aussi que le
  salaire annuel moyen des cultes se calcule sur le SMIC, quand le modèle
  prend le revenu saisi, et que les années d'avant 1979 sont validées
  gratuitement.
reste: >-
  Les taux spécifiques de la CAVIMAC ; le texte de l'avenant n° 25 ; les
  fractions de pension d'avant 1998 et les trimestres gratuits d'avant
  1979.
