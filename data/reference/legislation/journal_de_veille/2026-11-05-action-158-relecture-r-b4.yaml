date: "2026-11-05"
session: "action 158, vague 10, R-B4 : relecture indépendante de B (7114ee4 : le sommet non écrit, le n° 91-783, le n° 60-403, l'annexe II du n° 94-1016)"
consulte: >-
  L'index LEGI du dépôt (incrément 20261102-213929) : les tableaux, les articles qui comptent
  les échelons et les grilles des 43 grades rattachés par le sommet, dont, pour les 13 relus
  en entier, n° 90-973 (art. 3 et 12), n° 2003-770 (art. 2 et 13), n° 94-1016 (art. 2, 9 et
  10), arrêté du 24 novembre 2006 (art. 1er et 2), n° 68-270 (art. 6 et 21), n° 2014-1165
  (art. 1er), n° 2011-1672 (art. 2 et 8), n° 2011-1673 (art. 2 et 8), n° 91-105 (art. 2 et 18),
  n° 2011-1683 (art. 8 et 13), n° 2013-1070 (art. 1er, 3, 8 et 13), n° 2013-1146 (art. 2 et 9),
  n° 2012-1058 (art. 10), n° 58-778 (art. 2 et 16) ; n° 91-783 (art. 1er, 3 et 15) ;
  n° 2009-208 (art. 5 et 16) et n° 2009-209 (art. 1er, trois versions) ; n° 92-413 (art. 4 et
  27) ; n° 2017-786 (art. 12 et visa). Le Noyau RH (grilles/etat/) : grilles 00568, 03088,
  00091, 00092 ; corps 00671, 00873, 00448, 00653 ; texte 166.
trouve: >-
  Aucune erreur de donnée. Les 43 grades rattachés par le sommet non écrit ont une grille de
  n + 1 échelons, le nombre que donne le texte sur toute la période ; 34 ont un article qui
  compte n + 1 échelons, que la preuve ne cite pas ; 9 n'en ont pas dans l'index (n° 2013-1146,
  83-1033, 2011-1676, 72-420). Le n° 91-783, le n° 60-403 et le retrait de l'annexe II du
  n° 94-1016 sont conformes. Écarts faibles : la preuve ne cite pas l'article qui compte les
  échelons ; le sommet des grilles du n° 2009-209 cite la seule première version ; le corps
  00653 ne cite pas le texte 166.
reste: >-
  Candidats : citer dans la preuve du sommet l'article du statut qui compte les échelons ;
  déclarer les jours d'un tableau qu'aucune grille ne couvre (l'annexe I du n° 94-1016 du
  1994-11-26 au 2006-11-26) ; la 1re catégorie du n° 92-413, que le lecteur des grilles nomme
  d'un long libellé, n'est pas rattachée.
