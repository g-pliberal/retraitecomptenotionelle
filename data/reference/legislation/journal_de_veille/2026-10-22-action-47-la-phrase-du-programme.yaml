date: "2026-10-22"
session: "action 47 : la phrase du programme, et le vote de l'Assemblée nationale sur l'ASPA"
consulte: >-
  Aucune règle du scénario 1 touchée. Lus à leur source : le compte rendu de la première
  séance de l'Assemblée nationale du jeudi 11 juin 2026 ; le texte adopté n° 308,
  proposition de loi visant à renforcer la solidarité envers les retraités pauvres ; sa
  page au Sénat, texte n° 734 (2025-2026). La page de son dossier législatif au Sénat
  répondait 503.
trouve: >-
  Adopté par 165 voix sans opposition, le texte met fin à la récupération de l'ASPA sur
  succession et réduit d'un forfait, fixé par décret, l'allocation de qui occupe un
  logement dont il est propriétaire, ou à titre gratuit (L. 815-4 nouveau) ; l'ancien
  L. 815-13 ne reste applicable qu'aux allocataires d'avant la loi qui optent pour lui
  dans les six mois. Transmis au Sénat le 11 juin 2026, envoyé à la commission des
  affaires sociales, il n'y porte au 22 octobre 2026 ni rapporteur, ni date d'examen, ni
  vote : L. 815-13 reste en vigueur dans sa rédaction du 1er janvier 2024.
reste: >-
  Suivre le texte au Sénat. Promulgué, il réduirait l'ASPA que le scénario 1 sert aux
  propriétaires de leur logement, et ferait récrire la phrase du programme « là où l'ASPA
  n'est récupérée qu'au-delà d'un seuil d'actif net ». À l'action 47, au propriétaire, le
  choix de reprendre sur le patrimoine des défunts.
