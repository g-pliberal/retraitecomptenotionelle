date: "2026-10-25"
session: "action 138, étape 9 : la date d'entrée dans la saisie en net"
consulte: >-
  Aucun texte neuf : les clauses du grand-père d'affiliations.yaml et leurs textes, lus le
  18 octobre — la SNCF fermée en 2020, la RATP, les IEG, la CRPCEN et la Banque de France en
  septembre 2023, les mines en septembre 2010 ; le libéral non réglementé installé avant 2019,
  qui reste à la CNAVPL et à la Cipav (loi n° 2017-1836, art. 15). Le net de l'agent de la
  SNCF posé à la main : 10,85 % de retenue, la CSG et la CRDS sur 98,25 %.
trouve: >-
  La saisie en net remontait au brut par la fiche d'un nouvel entrant : les 2 653,99 € nets
  de l'agent de la SNCF entré en 1996 faisaient 3 352,62 € bruts au lieu de 3 333,33 €, les
  2 500 € nets du libéral non réglementé installé en 2005, 4 349,23 € au lieu de 4 099,52 €.
  La saisie date l'entrée comme la carrière, et toutes ses conversions la reçoivent.
reste: >-
  Rien pour la veille. Le plafond de 2027 ; la limite 5 ante ter (2) ; aux pages, les dates
  de pension que le formulaire propose au micro-entrepreneur de la Cipav (note du 25 octobre).
