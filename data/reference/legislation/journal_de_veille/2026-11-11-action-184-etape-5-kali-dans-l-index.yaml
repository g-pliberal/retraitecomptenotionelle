date: "2026-11-11"
session: "action 184, étape 5 : KALI, la base des conventions collectives, dans l'index"
consulte: >-
  Aucune règle du scénario 1 n'est touchée : la session retouche
  scripts/fetch/dila_index.py, scripts/fetch/dila_cherche.py et le workflow
  index-dila.yml. Lus ce jour : la présentation de KALI par la DILA
  (DILA_KALI_Presentation_20170824.pdf), le dump global de KALI du 8 novembre
  2026 et ses deux incréments des 9 et 10 novembre, en entier ; les listes
  des répertoires JORF, LEGI et KALI du serveur de la DILA ; la release
  index-dila du dépôt. Du régime Agirc-Arrco, lus pour essayer l'outil et non
  pour une règle : l'article 92 de l'accord national interprofessionnel du
  17 novembre 2017 (KALIARTI000036731850) et les trois rédactions de
  l'article 1er de l'accord du 10 mai 2019 sur la valeur de service du point.
trouve: >-
  Aucune règle n'a changé. KALI compte 352 617 textes et articles ; l'accord
  du 17 novembre 2017 y est KALITEXT000036731682, en vigueur étendu, avec ses
  avenants. La DILA a renouvelé le 8 novembre 2026 les dumps globaux des
  trois bases et retiré les incréments d'avant : les index JORF et LEGI
  publiés, à jour au 8 novembre au soir, ont enjambé ce renouvellement sans
  trou.
reste: >-
  Faire entrer les accords Agirc-Arrco dans la liste de contrôle des textes
  et relire sur KALI les fiches de la retraite complémentaire : une autre
  étape, que le propriétaire décidera. Dire ce que la mise à jour des index
  JORF et LEGI fait le jour où la DILA renouvelle un dump avant qu'ils
  l'aient rattrapé : aujourd'hui elle laisserait un trou sans le dire.
