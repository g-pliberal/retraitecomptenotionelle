date: "2026-10-29"
session: "action 138, étape 9, au site : les dates de pension d'un retour à la CRPCEN et aux IEG"
consulte: >-
  Aucun texte neuf : la règle du retour, écrite au modèle le 25 octobre avec ses sources
  (loi n° 2023-1250, art. 15, V et VI ; décrets n° 2025-761 et 2025-799 ; fiche
  maintien_affiliation_crpcen_ieg), que le formulaire lit sans l'écrire.
trouve: >-
  Le formulaire lisait les régimes de chaque métier sous le premier recrutement : au clerc de
  2010 à 2014, sans emploi de 2015 à 2024, revenu en 2025 sans que rien ne le maintienne, il ne
  proposait aucune date, quand la carrière le sert par la CRPCEN, puis par le régime général.
  Chaque statut se lit désormais sous la date d'entrée de l'année lue, et aussi à la dernière
  année d'avant chaque retour qui la change.
reste: >-
  Rien pour la veille. Le plafond de 2027 ; au site, la majoration de la réversion au
  non-résident (note du 29 octobre, « les dates de pension d'un retour »).
