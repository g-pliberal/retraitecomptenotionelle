date: "2026-11-19"
session: "action 191 : la surcote de la Banque de France, lue dans son règlement"
consulte: >-
  Le règlement annexé au décret n° 2007-262 du 27 février 2007, articles 26,
  33 et 72, dans ses quatorze rédactions de l'index LEGI (de
  LEGIARTI000006778516 à LEGIARTI000047909725) ; le décret n° 2008-1514 du
  30 décembre 2008, article 1er (JORFARTI000020018201) ; le décret
  n° 2012-701 du 7 mai 2012, notice, articles 26 et 41 (JORFARTI000025824221,
  JORFARTI000025824269), par l'index JORF.
trouve: >-
  L'article 33 ne majore que les trimestres effectués après le 1er avril
  2007, au-delà de l'âge et en sus de la durée : 0,75 % pour ceux d'avril
  2007 à décembre 2008, 1,25 % pour ceux cotisés et effectués à compter du
  1er janvier 2009, vingt au plus pour les pensions prenant effet avant le
  1er janvier 2016. Le dépôt servait le taux de l'année du départ à tous les
  trimestres accomplis depuis l'âge, et rien d'avril à décembre 2007.
  Corrigé : fiche surcote_banque_de_france, à laquelle le régime renvoie
  depuis avril 2007. Détail :
  docs/feuille_de_route/191/2026-11-19-surcote-de-la-banque-de-france.md.
reste: >-
  Un exemple chiffré publié par la Banque, qui trancherait le taux du
  trimestre à cheval sur le 1er janvier 2009 et l'ordre de la limite de vingt
  trimestres ; la surcote des parents de la rédaction de 2025 et les
  bonifications écartées de la durée depuis 2016, non servies ; le règlement
  d'avant le 1er avril 2007, absent de LEGI.
