date: "2026-11-05"
session: "action 130, file E (E4, vague 10) : la CAVP lue au droit, la fiche cavp_minoration_deux_pentes"
consulte: >-
  `veille_droit.py` (la base de la Cnav, rien de neuf) et `docs/veille_droit.md`. Dans
  l'index JORF du dépôt, à jour du 5 novembre 2026 : tous les textes de la section des
  pharmaciens, par leur titre et par « CAVP » ou « assurance vieillesse des pharmaciens »
  dans leur corps, de 1949 à 2026 ; l'arrêté du 11 mai 2009, articles 1er à 3 et annexe
  (JORFARTI000020694601, JORFARTI000020694602, JORFARTI000020694605) ; l'arrêté du 23 juin
  2011, articles 1er à 6 et annexe (JORFARTI000024270209, JORFARTI000024270214) ; les
  annexes des arrêtés de 2007, 2012, 2015, 2016, 2017, 2019, du 19 juin et du 19 décembre
  2023 (JORFARTI000048880592), de 2025 (JORFARTI000051568256) ; l'arrêté du 10 juillet 2026,
  article 1er et annexe I (JORFARTI000054436084, JORFARTI000054436087) ; les deux arrêtés
  du 21 septembre 2026 (JORFTEXT000054888270, JORFTEXT000054888282) ; le décret n° 2026-418,
  articles 4 et 30 (JORFARTI000054153444, JORFARTI000054153813). Dans l'index LEGI, à jour
  du 4 novembre 2026 : le décret n° 49-580, article 4 (LEGIARTI000020081472).
trouve: >-
  De 1949 à 1990, l'index n'a des arrêtés de la section que les titres ; celui du 31 août
  1990 est au seul Bulletin officiel (no 90-40) : les statuts d'avant le 7 juin 2009 ne se
  lisent pas. Le tableau des coefficients des nés jusqu'en 1955, annexé à l'article 15 en
  2011, est dans l'index, et le modèle le rend ligne pour ligne. Depuis le 10 janvier 2024,
  la carrière longue est minorée de 1,25 % par trimestre jusqu'à 65 ans seulement ; le
  modèle lui sert aussi la seconde pente, dans une limite de vingt trimestres que le texte
  n'a plus depuis 2011 (erreur déclarée). L'entrée en jouissance est au premier jour du
  trimestre civil qui suit la demande, de 2009 à 2026 (erreur déclarée, la classe de la
  CAVOM et de la CARPIMKO). Les valeurs de service diffèrent par génération (4 % et 2 % en
  2011, 0,96 et 0,96/0,98 en 2026) ; le modèle en sert une (non tranché). L'article 2 de
  l'arrêté du 21 septembre 2026 touche l'article 16 du règlement, la réversion, sans effet
  sur la minoration.
reste: >-
  Les statuts de 1950 et leurs modifications, dont celles de 1976, 1979 et 1981 qui
  touchent les articles 10 et 11, et celle de 1990 (Bulletin officiel no 90-40) : à
  demander à la CAVP. Un exemple de la caisse : la valeur de service d'un pharmacien né
  avant 1953, une pension de carrière longue liquidée depuis 2024. Les deux erreurs, au
  propriétaire, non corrigées.
