date: "2026-10-12"
session: "action 136, étape 6 : le volume de travail selon le rang, la neuvième version de la population"
consulte: >-
  Aucune source de droit : la session ne touche à aucune règle du scénario 1. Les séries
  certifiées au dépôt — le volume de travail par catégorie de l'INSEE, la distribution
  des pensions et les quintiles de la pension en équivalent carrière complète de l'EIR
  2020, la part des liquidants au minimum contributif dans l'EACR ; aucun téléchargement.
trouve: >-
  Aucun texte de droit. Chaque classe de salaire au volume de travail de sa catégorie, le
  minimum contributif des liquidants de 2023 passe de 13,6 à 17,2 % (EACR 18,8), celui
  des hommes de 5,5 à 10,1 % (12,2) ; la distribution des pensions de 2020 s'approche de
  l'EIR, sauf celle des hommes, qui s'en éloigne au bas. Avant 2017, la population
  dépasse l'EACR (29,9 % des liquidants de 2012, pour 27,1 à la Cnav), et depuis 2019
  reste en dessous.
reste: >-
  À l'étape 6 de l'action 136 : la pension des hommes, sous l'EIR du premier au neuvième
  décile ; celle des femmes, au-dessus au bas ; le minimum selon la génération ; la
  bascule de la page, au propriétaire.
