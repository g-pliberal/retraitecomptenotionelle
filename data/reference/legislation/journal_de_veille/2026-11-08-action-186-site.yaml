date: "2026-11-08"
session: "action 186, chantier 9 : le site étudié face aux décisions du programme, et la façon de montrer le rendement"
consulte: >-
  Aucune règle du scénario 1 n'est touchée, et l'index LEGI n'est pas
  interrogé. Lus ce jour : le texte des neuf pages fabriquées du site
