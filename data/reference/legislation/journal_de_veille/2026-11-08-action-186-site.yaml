  celles du COR (--cor). Aucune source extérieure n'est ouverte.
trouve: >-
  Aucun écart avec les fiches. Le site dément le programme sur onze sujets
  (vingt-six décisions), dont cinq phrases seulement sont déclarées
  contredites au catalogue. Pour le salarié moyen né en 2000, la
