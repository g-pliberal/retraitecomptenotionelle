date: "2026-11-05"
session: "action 130, file E (E4-bis, vague 10) : les corrections de la relecture R-E5 sur la CAVP et la CARPIMKO"
consulte: >-
  La note de la relecture R-E5 ; dans l'index JORF du dépôt, à jour du 5 novembre 2026 :
  l'annexe de l'arrêté du 23 juin 2011, article 12 et tableau annexé à l'article 15
  (JORFARTI000024270214) ; le règlement de la CAVP de 2026, article 12
  (JORFARTI000054436087) ; les arrêtés du 17 septembre 1956 (JORFTEXT000000281088), du 6
  juillet 1977 (JORFTEXT000000664820), du 30 décembre 1988 (JORFTEXT000000498997) et du 6
  avril 1989 (JORFTEXT000000318409), à leur titre et résumé ; l'annexe de l'arrêté du 27
  décembre 2023 sur la CARPIMKO (JORFARTI000048880643), son règlement de 2026, articles 4 à
  6 (JORFARTI000054435915), ses statuts de 2015 (JORFARTI000031255547).
trouve: >-
  En 2011, l'article 12 des statuts de la CAVP majore les nés jusqu'en 1952 jusqu'à 66 ans,
  le tableau annexé refuse toute majoration après 65 ans aux nés jusqu'au 30 juin 1951 ; le
  règlement de 2026 suit le tableau : non tranché du 30 juin 2011 au 17 juillet 2026,
  246,61 € par an dans le cas posé. L'arrêté du 6 avril 1989 n'est publié qu'au Bulletin
  officiel (n° 8920). Les statuts de la CARPIMKO récrits au 10 janvier 2024 et son
  règlement nomment « Âge du taux plein » la ligne de leur table ; l'âge d'où se compte la
  majoration reste non tranché, l'article 4 du règlement disant « l'âge du taux plein sans
  condition » pour l'âge de la table. L'erreur (2) de la CARPIMKO vaut au moins 136,90 €
  par an dans le cas posé, 205,35 € dans la lecture de la table.
reste: >-
  Un exemple de la CAVP : la majoration d'un pharmacien né avant juillet 1951 parti après
  65 ans de 2011 à 2026. L'arrêté du 6 avril 1989 et l'article 10 de 1977, au Bulletin
  officiel ou à la caisse.
