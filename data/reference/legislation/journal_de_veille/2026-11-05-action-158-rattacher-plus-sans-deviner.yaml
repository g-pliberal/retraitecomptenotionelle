date: "2026-11-05"
session: "action 158, vague 10, B : rattacher plus sans deviner — le sommet non écrit, le n° 91-783, le n° 60-403, la date qui ouvre la phrase"
consulte: >-
  L'index LEGI du dépôt (incrément 20261102-213929) : décret n° 90-973, art. 3
  (LEGIARTI000006459927) et 12 (LEGIARTI000006459943) ; arrêté du 28 septembre 2000,
  art. 1er (LEGIARTI000019669918) ; décret n° 2003-770, art. 2 (LEGIARTI000023593810) et 13 (LEGIARTI000023593821) ; décret n° 94-1016, art. 2
  (LEGIARTI000006476418), 9 (LEGIARTI000006476438) et 10 (LEGIARTI000006476440) ; arrêté
  du 24 novembre 2006, art. 1er et 2 ; décret n° 91-783, art. 1er (LEGIARTI000006461848,
  LEGIARTI000006461849), 3 (LEGIARTI000006461851, LEGIARTI000006461852) et 15
  (LEGIARTI000006461873) ; décret n° 2017-786, art. 12 (LEGIARTI000034750817) et ses
  visas ; n° 2017-194, n° 98-416, n° 95-720 (trois phrases de reclassement). L'index JORF
  (incrément 20261103-002311) : JORFTEXT000000501563 (n° 60-403), absent. Le Noyau RH :
  textes 112, 142, 166 ; corps 00234, 00448, 00653, 00671, 00873 ; grilles 00091, 00092,
  00568.
trouve: >-
  Un tableau de durées n'écrit pas le sommet du grade quand son dernier rang porte une
  durée : le statut compte alors n + 1 échelons (n° 90-973, art. 3 : « dix échelons » pour
  un tableau qui s'arrête au 9e ; n° 2003-770, art. 2 : « six échelons », au 5e ; n° 94-1016,
  art. 2 : « sept échelons » pour l'annexe I, au 6e ; n° 91-783, art. 3 : « dix » et
  « sept », aux 9e et 6e). Le n° 94-1016 donne huit échelons à la classe exceptionnelle de
  l'annexe II : le chaînage la rattachait à tort à la grille de l'annexe I (sept). Le
  n° 91-783 soumet « les corps d'assistants de service social des administrations de
  l'Etat » à « ses dispositions communes » (art. 1er), dont le LEGI n'a aucune version avant
  le 1992-02-08. Le n° 60-403 n'a ni notice au LEGI ni NOR au noyau, qui le porte seul sous
  son numéro et sa date (texte 166).
reste: >-
  L'annexe que nomment le tableau du n° 94-1016 et l'article de sa grille, pour départager
  les deux grilles de chaque classe. Les dates de reclassement écrites après « reclassés »
  (26 tableaux), au lecteur des reclassements. L'équivalence des libellés du n° 60-403
  (« de l'éducation physique et sportive classe normale », au noyau), que le texte ne
  donne pas.
