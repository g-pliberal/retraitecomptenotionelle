date: "2026-10-01"
session: >-
  la quatrième étape du quatrième domaine : les exemples publiés, et l'invalidité du
  survivant à l'Agirc-Arrco, dans les deux moteurs
consulte: >-
  Les circulaires Cnav n° 2024/25 (point 6.4), 2012/27 (point 4), 2012/63 (§ 8282)
  et 2023/21 (point 3.2), et une cinquantaine d'autres, de 2003 à 2026, sans exemple
  chiffré du domaine ; la circulaire RSI n° 2011/017 ; les pages du Service des
  retraites de l'État sur le minimum garanti et sur le calcul de la pension des
  invalides, et ses guides de 2016 ; les fiches F550, F672, F16871, F21142 et F12390
  de service-public ; la page « La pension de réversion » de la fédération
  Agirc-Arrco ; L. 28 du code des pensions, relu dans l'index LEGI du dépôt. La
  documentation juridique de la CNRACL, le site de l'Ircantec et la réglementation
  Agirc-Arrco n'ont pas répondu.
trouve: >-
  Sept exemples se rejouent et concordent : l'ex-invalide de la circulaire n° 2024/25,
  substitué d'office à 62 ans le 1er décembre 2024, et son cumul intégral à l'âge
  légal de sa génération ; l'inapte de la n° 2012/27, au taux plein avec 158
  trimestres, et son cumul intégral à 65 ans et 4 mois ; le minimum garanti de
  l'invalidité en quinzièmes (7 542,25 € par an pour douze ans), le plancher de L. 30
  et le total de L. 30 ter du Service des retraites de l'État. Sa page compte le seuil
  de la rente sur la rente, et le taux deux fois, quand L. 28 le compte sur le
  traitement ; elle l'écrit à 4 109,91 € « pour 2026 », la fiche F550 à 4 242,61 €.
  L'invalidité du survivant lève l'âge de la réversion Agirc-Arrco « quel que soit la
  date du décès » : l'exemple de Claude, en écart connu depuis le 28 septembre,
  concorde.
reste: >-
  Le seuil de la rente de L. 28 et la revalorisation des pensions d'invalidité
  (L. 341-6) ; les exemples de la CNRACL et de l'Ircantec ; l'ASPA de l'ex-invalide
  (circulaire n° 2012/63), qui suppose l'allocation supplémentaire d'invalidité ; la
  pension de veuf ou de veuve invalide de l'assurance invalidité, dont l'index porte
  les textes, à lire.
