date: "2026-10-24"
session: "action 173, étape 9 : Droits non cotisés, la même chose en moins de mots"
consulte: >-
  Aucun texte : la session ne touche pas au droit. La page seule, comptée comme les tests la
  comptent, ouverte et toute dépliée, et vue dans Chromium de 320 à 1 440 points de large ; le
  catalogue des régimes, pour compter les périodes qui déclarent la réversion, et l'inventaire
  des avantages, pour compter ceux qui se sont éteints.
trouve: >-
  Droits non cotisés montre 1 066 mots ouverts au lieu de 1 163, et 7 430 tout dépliés au lieu
  de 7 617. Deux nombres écrits à la main avaient vieilli : 756 périodes du catalogue annonçant
  la réversion, quand il en porte 945, et une courbe qui « ne redescend que trois fois », quand
  elle baisse deux fois ; ils se comptent. Aucune simulation ne bouge.
reste: >-
  Rien pour la veille. L'étape 10 de l'action 173, et les deux schémas de Coût côte à côte.
