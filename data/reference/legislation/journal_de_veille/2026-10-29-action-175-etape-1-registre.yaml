date: "2026-10-29"
session: "action 175, étape 1 : le registre de la base de législation de la Cnav"
consulte: >-
  La base de législation de la Cnav entière, par les 25 routes que le script du site appelle :
  ses collections (386 barèmes, 633 exposés, 323 listes, 392 fenêtres d'information, 192
  avis de mise à jour), ses deux menus, les 134 documents que ses barèmes joignent, et 7 007
  références — celles que ses objets lient, celles qu'elles citent de proche en proche, et
  celles que sa recherche sert sans que rien ne les lie, par 1 792 requêtes —, lues une à une
  avec leur titre et la date de leur texte. Aucune règle n'a été lue ni écrite : l'étape
  dresse le registre.
trouve: >-
  Les PDF de /Pdf/ sont des références à part entière, servies sous leur nom : ce sont
  surtout les circulaires d'après 2015. La recherche sert 2 509 références que rien ne lie,
  des accords, des arrangements et des circulaires anciennes ; plafonnée à 250 résultats par
  requête, elle est près d'être épuisée sans preuve de l'être. Les avis de mise à jour datent
  chaque changement des barèmes et des exposés, et la circulaire qui le fonde. Dix-neuf
  références ont une date que leur titre contredit (la circulaire Unedic 97/18 du 7 novembre
  1997, datée de 1966) ; la base nomme 78 objets qu'elle ne sert pas, et 21 liens ne mènent
  à rien.
reste: >-
  Les sorts, aux étapes 2 à 5 : 9 032 objets à lire, dont toutes les références et les 37
  exemples des fenêtres. La veille de l'étape 5 lira les avis de mise à jour et relancera la
  recherche.
