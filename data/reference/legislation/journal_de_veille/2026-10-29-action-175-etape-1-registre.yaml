date: "2026-10-29"
session: "action 175, étape 1 : le registre de la base de législation de la Cnav"
consulte: >-
  La base de législation de la Cnav entière, par son API : ses trois collections (386
  barèmes, 633 exposés, 323 listes), ses deux menus, ses 178 fenêtres d'information (91
  entrées du lexique, 57 compléments, 28 exemples), et les 4 331 références qu'elles lient
  ou que ces références citent, de proche en proche sur cinq rangs, lues une à une avec
  leur titre et la date de leur texte. Aucune règle n'a été lue ni écrite : l'étape dresse
  le registre.
trouve: >-
  Les PDF de /Pdf/ sont des références à part entière, servies sous leur nom : ce sont
  surtout les circulaires d'après 2015. Les références citent 2 019 textes que rien d'autre
  ne lie, dont 264 circulaires et 148 lettres au second rang. Dix-neuf références ont une
  date que leur titre contredit (la circulaire Unedic 97/18 du 7 novembre 1997, datée de
  1966) ; l'API ne sert qu'en minuscules des références que la base lie sous une majuscule
  fautive, et ne sert pas 66 objets liés. Vingt liens ne mènent à aucun objet.
reste: >-
  Les sorts, aux étapes 2 à 5 : 5 817 objets à lire, dont toutes les références et les 28
  exemples des fenêtres. La circulaire 2026-17 du 12 juin 2026, que rien ne lie encore,
  attend l'étape 5.
