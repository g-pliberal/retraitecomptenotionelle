date: "2026-10-16"
session: "action 130, sixième domaine, étape 2 : les faits de la chronologie, un motif par sorte de période assimilée"
consulte: >-
  Aucun texte neuf : les quatre fiches de l'étape 1 (apprentissage,
  stages_formation_professionnelle, sportifs_haut_niveau,
  conge_supplementaire_naissance), lues le jour même, pour ce qu'elles lisent ; le
  k du 4° de R. 351-12 (décret n° 2023-799, article 4) pour les cinq dispositifs
  d'insertion ; L. 351-3, 7°, pour les sportifs. Aucune règle du scénario 1 n'est
  écrite ni modifiée.
trouve: >-
  Rien qui change le droit lu à l'étape 1. Les faits s'en déduisent : quatre motifs
  de période assimilée, le dispositif d'un stage d'insertion, les jours comptés
  dans les dates ; l'apprentissage, emploi salarié, est un attribut de l'emploi.
reste: >-
  Ce que l'étape 1 a laissé à relire, inchangé. Pour l'étape 3 : la date d'effet,
  qui borne le 9° (1er septembre 2023), est celle de la liquidation, non un fait de
  la période.
