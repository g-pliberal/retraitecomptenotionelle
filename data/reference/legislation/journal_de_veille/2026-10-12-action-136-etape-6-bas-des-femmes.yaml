date: "2026-10-12"
session: "action 136, étape 6 : la pension des femmes au bas de l'échelle, une affaire de générations"
consulte: >-
  Aucune source de droit nouvelle : la session lit, sans les modifier, le minimum
  contributif et les majorations de durée que la simulation applique. Les séries
  certifiées au dépôt — les quintiles de la pension en équivalent carrière complète de
  l'EIR 2020, sa distribution des pensions, la durée d'assurance par génération que le COR
  en publie ; aucun téléchargement.
trouve: >-
  Aucun texte de droit. Au premier quintile, les femmes de la population valent 780 à
  840 € par année validée, le minimum contributif et la complémentaire ; l'EIR y descend à
  650 € par des retraitées que le minimum ne relève pas, parties avec décote ou servies à
  l'étranger. La durée des femmes de la population est de 34,7 années à toutes les
  générations, quand l'EIR la voit monter de 33,8 autour de 1940 à 38,2 autour de 1950 :
  la grille ne donne pas aux carrières un poids selon leur génération.
reste: >-
  À l'étape 6 de l'action 136 : les carrières des femmes selon la génération, leurs durées
  calées sur celles de l'EIR ; le minimum selon la génération ; la bascule de la page, au
  propriétaire. Aucune série du dépôt ne dit la part des départs avec décote.
