date: "2026-10-29"
session: "action 138, étape 9, au site : le retour à la CRPCEN et aux IEG dans la saisie en net"
consulte: >-
  Aucun texte neuf : la règle du retour, écrite au modèle le 25 octobre avec ses sources
  (loi n° 2023-1250, art. 15, V et VI ; décrets n° 2025-761 et 2025-799 ; fiche
  maintien_affiliation_crpcen_ieg), que le site lit sans l'écrire.
trouve: >-
  La saisie en net remontait chaque ligne par la fiche du premier recrutement : les 2 500 €
  nets du clerc recruté en 2010, salarié du privé en 2024, revenu en 2025 sans que rien ne le
  maintienne, faisaient 3 228,32 € bruts, la retenue de la CRPCEN, au lieu de 3 158,09 €. La
  saisie compte ses retours comme la carrière, et chaque ligne
  remonte sous la date d'entrée de sa dernière année. Les dates de pension du formulaire lisent
  encore les régimes d'un retour sous le premier recrutement.
reste: >-
  Rien pour la veille. Le plafond de 2027 ; la limite 5 ante ter (2) ; aux pages, les dates de
  pension d'un retour (note du 29 octobre).
