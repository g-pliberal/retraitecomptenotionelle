date: "2026-11-05"
session: "action 175, vague 7, file M4/cultes : la fraction d'avant 1998 de la CAVIMAC — l'âge de son taux plein, le minimum majoré du V, « gratuitement »"
consulte: >-
  python scripts/veille_droit.py ; docs/veille_droit.md. L'index LEGI récupéré dans la
  session, à jour au 4 novembre 2026 (incréments jusqu'à LEGI_20261104-214059) : le décret
  n° 2006-1325, article 2 (LEGIARTI000023397816, depuis le 1er juillet 2011 ;
  LEGIARTI000006256155, du 1er novembre 2006 au 30 janvier 2010) ; D. 721-6
  (LEGIARTI000006738898, en vigueur au 31 décembre 1997) ; R. 351-27 (LEGIARTI000024113020) ;
  L. 351-10 (LEGIARTI000006742926, LEGIARTI000019959492) ; D. 351-2-1
  (LEGIARTI000017870194, LEGIARTI000020090091) ; D. 351-2-2 (LEGIARTI000020090096) ; R. 351-6
  (LEGIARTI000006749349) ; le décret n° 79-607, article 42 (LEGIARTI000006766268). En ligne,
  le 5 novembre 2026 : la page de la CAVIMAC « Demander ma retraite de base », son triptyque
  « Votre assurance retraite » de 2024, la question orale n° 122 du Sénat et sa réponse (JO
  Sénat du 16 janvier 2008, p. 207) ; une recherche sur le web d'une circulaire ou d'un
  exemple de la caisse sur l'âge de la fraction d'avant 1998, sans résultat.
trouve: >-
  La caisse publie un seul âge du taux plein, celui de la génération (« varie de 65 à 67
  ans »), et la décote des fractions d'avant 1998 à taux minoré, « entre la date d'effet de
  la pension et l'âge du taux plein » : c'est ce que le modèle sert ; la lettre du décret
  n° 2006-1325 (I, II et V, avec D. 721-6 de 1997, « fixé à soixante-cinq ans ») allouerait
  cette fraction à soixante-cinq ans sans décote, et la majorerait. Le modèle suit la
  caisse, la fiche le déclare (289,73 € contre 507,73 € au cas de la fiche). Le V nomme le
  minimum majoré de L. 351-10, qui ne demande 120 trimestres cotisés qu'aux pensions prenant
  effet depuis le 1er avril 2009 : le modèle les exigeait à toute date, corrigé dans les deux
  moteurs (commit fbf109d). « Validés à titre gratuit » est à la caisse, « validées
  gratuitement » à la réponse au Sénat ; D. 721-11 et l'article 42 ne disent que « prises en
  compte » : les commentaires les citent (commit 4052d87).
reste: >-
  Au propriétaire : suivre la caisse ou la lettre du décret pour la fraction d'avant 1998
  de qui part entre soixante-cinq ans et l'âge de sa génération, faute de circulaire de la
  caisse ; et si le « minimum majoré » du V vaut sous 120 trimestres cotisés (554,81 € au
  lieu de 507,73 € au même cas). Candidat : l'AVPF et l'AVA, que le régime général compte
  dans les 120 trimestres depuis le 1er septembre 2023, ne le sont pas au V (textes non
  relus).
