date: "2026-11-09"
session: "action 186, chantier 8 : le relevé de compte annuel"
consulte: >-
  Aucune règle du scénario 1 n'est touchée. Dans l'index LEGI du dépôt, à
  jour au 8 novembre 2026, le droit à l'information sur la retraite :
  l'article L. 161-17 du code de la sécurité sociale (LEGIARTI000053279717,
  en vigueur depuis le 31 décembre 2025, loi n° 2025-1403, article 102),
  L. 161-17-1 (le groupement Union Retraite), R. 161-11 (les données
  échangées) et D. 161-2-1-2 à D. 161-2-1-8 (le relevé, l'estimation, leurs
  âges), dans leur rédaction du décret n° 2025-1410 du 30 décembre 2025. Hors
  du droit français, lus ce jour par trois agents de la session, en courts
  extraits : les pages et le rapport annuel 2025 de Pensionsmyndigheten, le
  document de travail CESifo n° 12287, les pages du ZUS, la loi italienne
  n° 335 de 1995, le volume 2 de la Banque mondiale sur les comptes
  notionnels (2020), le rapport d'activité 2025 de l'Union Retraite, le
  rapport d'évaluation des politiques de sécurité sociale (édition 2026),
  le document n° 4 du COR du 28 janvier 2021, le rapport du Sénat n° 667
  (2017) et l'étude d'impact du projet de système universel (2020).
trouve: >-
  Le relevé de situation individuelle est établi à 35, 40, 45 et 50 ans
  (D. 161-2-1-6) ; l'estimation indicative globale à 55 ans, puis tous les
  quatre ans depuis le 1er janvier 2026, cinq ans jusque-là (D. 161-2-1-8).
  Ni l'un ni l'autre ne peut porter d'autre mention que son objet
  (D. 161-2-1-3) : aucun solde en euros. Rien qui touche les fiches ni le
  modèle. Le détail est dans la note
  docs/feuille_de_route/186/2026-11-09-releve-annuel.md.
reste: >-
  Les sources étrangères n'ont été lues que par les agents : à relire au
  chantier 7 avant toute publication. Non ouverts : la comparaison du Social
  Security Bulletin de 2016, le rapport annuel 2016 de l'INPS, les études de
  l'INAPP, l'article 50 de la loi polonaise, une source lettone sur l'arrêt
  de 2009. L'état du répertoire de gestion des carrières unique en 2026
  n'est pas établi.
