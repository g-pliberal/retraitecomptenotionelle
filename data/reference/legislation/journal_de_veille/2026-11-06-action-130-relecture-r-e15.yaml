date: "2026-11-06"
session: "action 130, file E, R-E15 : relecture de E14 (les écarts de R-E14, la CAVEC, la CAVP et la CPRN de surcote_par_age_seul, 5202765)"
consulte: >-
  python scripts/veille_droit.py. Les index LEGI (à jour du 2 novembre 2026,
  20261102-213929) et JORF (du 3 novembre, 20261103-002311) récupérés, puis effacés. Au
  JORF, au titre puis au texte, sans borne : les arrêtés et décrets de la CAVEC de 1946 à
  2026 (dont ceux du 17 juin 1980, 22 août 1986, 9 mars 1987, 23 juillet 1992, 13 mai
  1994, 27 février 2003, 22 février 2008, 9 février 2012, 20 août 2018, 4 juillet 2025, 16
  décembre 2025, 10 juillet 2026, et le décret n° 2008-85), de la CAVP de 1995 à 2026 (dont
  ceux du 11 mai 2009, 23 juin 2011, 19 décembre 2023, 5 mai 2025, et les décrets n°
  2008-1499, 2014-1446, 2019-288), de la CPRN de 2003 à 2026 (dont ceux du 16 décembre
  2013, 31 mai 2017, 29 novembre 2023, et les décrets n° 2004-1142, 2013-1157), de la
  Cipav de 1979 à 2008, de la CARMF de 2018 ; les arrêtés à plusieurs sections ; les deux
  arrêtés du 21 septembre 2026 ; le décret n° 2026-1017. Dans LEGI : les règlements de 2026
  de la CAVEC (LEGIARTI000054437585), de la CPRN (LEGIARTI000054437637) et de la CAVP
  (LEGIARTI000054437738 et LEGIARTI000054890978, comparés mot à mot) ; L. 351-8 et
  L. 161-17-2 au 1er janvier 2024.
trouve: >-
  Aucune erreur dans le travail de E14 : citations, dates, bornes et montants (2 741,17 €,
  2 398,21 €, 1 125,86 €, 1 059,64 €) refaits ; les deux moteurs servent chaque cas posé,
  sous les deux jeux ; listes d'arrêtés complètes depuis 2008 pour la CAVEC, en entier pour
  la CAVP, la CPRN et la Cipav. Trois écarts faibles, de preuve : les six arrêtés de la
  CAVEC d'avant 2008 (Bulletin officiel) non nommés ; « un article 3.14 qui existait donc »
  que l'arrêté du 27 février 2003 (« art. 58 ») contredit en partie ; les statuts de la
  CAVP d'avant 2009 omis de « Pour la suite ». Un candidat neuf, moyen : à la CPRN depuis
  2024, les trimestres d'exercice de l'année où un âge non entier est atteint sont perdus
  (né le 10 mars 1953, au 1er janvier 2024 : 16 trimestres au lieu de 18, au moins
  397,92 € par an).
reste: >-
  À E15 : les trois écarts faibles (note `130/2026-11-06-relecture-r-e15.md`, « Pour
  E15 »). Au propriétaire : le candidat de la CPRN (§ 4), et l'âge du 1° de L. 351-8 des
  nés avant 1968 depuis le 1er septembre 2023, au décret, non lu ici. Au Bulletin
  officiel : les statuts de la CAVEC d'avant 2008 et le texte qui y a introduit la
  numérotation en 3.x.
