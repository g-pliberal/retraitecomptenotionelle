date: "2026-11-06"
session: "action 130, file E, relecture R-E14 : E13 (1a6013d), les écarts de R-E13 et la CARMF, l'ASV et la CARPIMKO de surcote_par_age_seul en versions"
consulte: >-
  Les index de la DILA récupérés : JORF au 3 novembre 2026, LEGI au 2 novembre. Au JORF,
  en SQL sur les titres, sans borne : les arrêtés de 1979 à 2007 qui nomment les
  architectes, la Cipav ou l'interprofessionnelle de prévoyance ; ceux de la CARMF et de
  l'ASV de 2016 à 2026 ; ceux de la CARPIMKO de 2013 à 2026 ; leurs annexes lues aux
  articles 15 et 12 (CARMF, ASV) et 12 ter (CARPIMKO), dont JORFARTI000033521562,
  JORFARTI000033538061, JORFARTI000034298521, JORFARTI000031255547, JORFARTI000048880643,
  JORFARTI000049205175, JORFARTI000050962838, les règlements du 10 juillet 2026
  (JORFARTI000054435859, JORFARTI000054435915), le rectificatif du 8 août 2026 et l'arrêté
  du 21 septembre 2026 (JORFARTI000054888279) ; l'arrêté du 16 décembre 2021, 18°
  (JORFARTI000044554134). Dans LEGI : L. 351-1, L. 161-17-2 et D. 161-2-1-9 au
  1er janvier 2017 ; l'arrêté du 9 mars 1987 (LEGIARTI000006784842).
trouve: >-
  Les trois erreurs neuves de E13 et son point non tranché se retrouvent au texte, au
  centime et dans les deux moteurs, sous les deux jeux. Les listes d'arrêtés de la CARMF,
  de l'ASV et de la CARPIMKO sont complètes. Celle des arrêtés qui modifient les statuts
  de 1979 de la Cipav ne l'est pas : manquent le 9 mars 1987 (articles 8, 13, 17 et
  17 bis du complémentaire, JORFTEXT000000321565), le 13 août 1987 (article non dit,
  JORFTEXT000000475761) et le 12 mai 2000 (articles 1er, 4, 4 bis, 11, 12 et 18,
  JORFARTI000002418428). L'arrêté du 21 septembre 2026 modifie les articles 5, 25 et 28
  du complémentaire de la CARMF, 4 de l'invalidité-décès et 3 de l'ASV, non le seul
  article 5. Aucune valeur servie ne bouge.
reste: >-
  À E14 : les trois arrêtés ajoutés à la fiche et au bloc « Reprise » ; la phrase sur
  l'arrêté du 21 septembre 2026 ; la valeur du cas posé de l'erreur (3) de la CARPIMKO
  (1 059,64 ou 1 125,86 € par an, sous la réserve). Au fac-similé : l'arrêté du 13 août
  1987. Au seul Bulletin officiel : ceux du 9 mars 1987 et du 12 mai 2000.
