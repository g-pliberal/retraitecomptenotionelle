date: "2026-11-03"
session: "action 175, étape 4 : le thème « Retraite personnelle de base » de la base de la Cnav"
consulte: >-
  python scripts/veille_droit.py (rien de neuf à la base depuis le registre). La base de
  législation de la Cnav, par son API : les 45 exposés du thème « Retraite personnelle de
  base », les listes, les fenêtres d'information et les 400 références qu'ils lient, les
  65 avis de mise à jour du thème. L'index LEGI de la DILA, à jour au 2 novembre 2026 :
  R. 351-45 CSS (rédactions de 1993 et de 1995), R. 351-27 (de 2009 à 2026), L. 351-8
  (2011, 2014, 2023, 2025), L. 351-1-3 et D. 351-1-5, D. 173-1 et D. 173-2 ; la diffusion
  d'instructions ministérielles Cnav n° 9/95 (anciens combattants d'Afrique du Nord).
trouve: >-
  Les tableaux des exposés — l'âge légal, l'âge du taux plein, la durée requise, la durée
  de proratisation, le nombre d'années du revenu annuel moyen, les âges de la carrière
  longue — sont ceux des séries, confrontés désormais par tests/test_cnav_exposes.py. Un
  écart corrigé dans les deux moteurs : depuis 2003, la durée requise des nés avant 1943
  est de 160 trimestres (R. 351-45, I à III, puis R. 351-27), et non l'escalier de 151 à
  159 que le modèle leur opposait à toute date. Trois écarts déclarés : le taux plein à
  65 ans de L. 351-8 hors du 1° (aidant familial, parent d'un enfant handicapé ou aidant,
  parent de trois enfants né de juillet 1951 à 1955), dans une fiche neuve pas encore
  modélisée ; la réduction de durée des appelés d'Afrique du Nord de 1994 à 2002
  (R. 351-45, IV) ; la garantie de D. 173-2 aux assurés des régimes spéciaux. Le registre
  range tout le thème.
reste: >-
  L'étape 4 aux autres thèmes, d'abord « Carrière : cotisations-salaires » ; les listes
  d'accords, de règlements européens et de périodes de guerre marquées du thème, avec le
  leur. À la session du modèle : le taux plein à 65 ans du parent de trois enfants, la
  garantie de D. 173-2, la revalorisation des pensions d'invalidité (étape 3). Pour la
  file D : les huit barèmes de Mayotte, avec le thème Mayotte (note de l'étape 4).
