date: "2026-09-30"
session: >-
  la quatrième étape du troisième domaine, sa troisième partie : les droits de
  l'activité après le départ, et la nouvelle pension
consulte: >-
  Dans l'index LEGI : L. 161-22-1-1 dans ses rédactions de 2023, 2025 et 2026 ;
  D. 161-2-22-1 et sa note d'application ; R. 351-29 (III), sa rédaction du
  1er janvier 2026.
trouve: >-
  La rédaction de 2026 de L. 161-22-1-1, pour les premières pensions de 2027, ne
  porte plus la phrase du plafond annuel, et D. 161-2-22-1 ne s'applique qu'aux
  nouvelles pensions de la rédaction issue de la loi n° 2023-270 : la nouvelle
  pension de 2027 n'est pas plafonnée. Son salaire de base est « le salaire
  mensuel moyen » des années qui valident au moins un trimestre, sur les mois
  d'assurance entre le cumul intégral et l'entrée en jouissance.
reste: >-
  La circulaire Cnav de la nouvelle pension ; ses équivalents dans les autres
  régimes de base ; le décret de 2027 qui dira la nouvelle pension des premières
  pensions de cette année.
