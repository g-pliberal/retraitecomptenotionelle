date: "2026-11-05"
session: "action 130, file E (E3-bis, vague 10) : les corrections de la relecture R-E4 sur la CARPIMKO, et la borne de l'arrondi des points de la CAVOM"
consulte: >-
  La note de la relecture R-E4 ; dans l'index JORF du dépôt, à jour du 5 novembre 2026 : les
  arrêtés du 20 mai 1987 (JORFTEXT000000844323, JORFTEXT000000662545) et du 16 décembre
  1991 (JORFTEXT000000685179), à leur titre ; l'annexe de l'arrêté du 31 juillet 2015
  (JORFARTI000031255547) ; le décret n° 2026-418, article 22 (JORFARTI000054153714) ; le
  décret n° 2015-1875, article 3 (JORFARTI000031740735). Dans l'index LEGI, à jour du 4
  novembre 2026 : D. 161-2-1-9 (LEGIARTI000025089933), L. 643-3 (LEGIARTI000028498667), le
  décret n° 79-265, article 2 (LEGIARTI000038427708).
trouve: >-
  L'arrêté du 20 mai 1987 modifie le régime complémentaire de la CARPIMKO ; l'index n'en a
  que le titre : les statuts de 1984 ne sont lus que jusqu'au 4 juin 1987. Celui du 16
  décembre 1991 ne touche que l'article 22. Les statuts de 2015 se lisent de deux façons
  pour les générations 1955 et antérieures qui ont leur durée avant 65 ans ; le texte ne
  tranche pas. La majoration du modèle court avant l'âge légal de la base (61 ans et 7 mois
  pour la génération 1954, D. 161-2-1-9, 5°), ce que les deux lectures excluent. La borne de
  l'arrondi des points de la CAVOM est 0,034 € par cotisation annuelle, au détriment du
  modèle.
reste: >-
  Le texte de l'arrêté du 20 mai 1987 ; un exemple de la caisse pour un assuré né avant 1956
  parti de 2016 à 2023 avec sa durée.
