date: "2026-11-21"
session: "action 194 : la durée des régimes spéciaux et des fonctionnaires, comptée au jour (sept corrections relues et publiées)"
consulte: >-
  Les textes que citent les sept corrections, lus par la session qui les a
  écrites : décret n° 2008-639 (SNCF), articles 7, 12 et 13, dont
  LEGIARTI000019108313 et LEGIARTI000020085562 ; décret n° 2008-637 (RATP),
  articles 18 et 23 ; annexe 3 du statut des IEG, articles 9 et 11 ;
  décret n° 90-1215 (CRPCEN), article 85 ; décrets n° 68-382 (Opéra) et
  n° 68-960 (Comédie-Française) ; règlement de la Banque de France, annexe,
  articles 10, 11 et 31 ; code des pensions civiles et militaires, L. 14, I
  et III ; la page « La durée d'assurance » du Service des retraites de
  l'État. À la relecture : les fiches decompte_des_services_fonction_publique
  et surcote_fonction_publique, et ce qu'elles citent (R. 26, Conseil d'État,
  2 février 2010, n° 311495).
trouve: >-
  Sept écarts de code, aucun de texte : les services arrondis année par
  année au lieu d'une fois, la réforme de 2008 prise au 1er janvier 2009, la
  borne de la décote comptée par années civiles, le temps partiel liquidé à
  temps plein, la durée annoncée, la surcote des fonctionnaires et la date
  de sa durée requise comptées par années civiles au lieu du jour. Détail :
  docs/feuille_de_route/194/2026-11-21-durees-des-regimes-speciaux-au-jour.md.
reste: >-
  La présomption que l'agent à temps partiel n'a pas payé la retenue du
  temps plein ; la version d'avant le 1er avril 2007 de la fiche des
  services, supposée ; la date de la durée requise, qui ne lit que
  l'activité principale d'une année coupée en son milieu.
