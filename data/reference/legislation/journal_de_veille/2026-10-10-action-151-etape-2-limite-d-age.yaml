date: "2026-10-10"
session: "action 151, étape 2 : la limite d'âge des fonctionnaires et ses exceptions"
consulte: >-
  L'index LEGI du dépôt, mis à jour jusqu'au 9 octobre 2026 : L. 556-1 à L. 556-15 du
  code général de la fonction publique, ceux qu'il porte ; la loi du 18 août 1936
  (articles 1er et 4) ; les lois n° 75-1280 (article 4), n° 84-834 (articles 1er à 7-1,
  de 2004 à 2022) et n° 86-1304 (article 4) ; la loi n° 2010-1330 (articles 28, 31 et
  33) ; les décrets n° 53-711 et n° 65-773 ; L. 10 CPCMR ; L. 952-10 et L. 921-4 du code
  de l'éducation ; l'article 76-1-1 de l'ordonnance n° 58-1270 ; L. 4139-16, L. 4139-17
  et L. 4141-5 du code de la défense. L'index JORF : l'article 10 de la loi n° 2023-270
  et le décret n° 2011-2103. Les pages de Légifrance, que l'outil en ligne de commande
  ne lit pas : L. 556-2, L. 556-6, L. 556-8 à L. 556-11, les lois n° 75-1280 et n° 84-834
  dans leur version initiale. La fiche F12395 de service-public, vérifiée le 1er janvier
  2026.
trouve: >-
  La limite d'âge du sédentaire : soixante-cinq ans de 1986 aux générations nées avant
  juillet 1951, soixante-sept ans à compter de 1955, après une marche par génération ;
  avant, des limites par corps de soixante-cinq à soixante-dix ans, abaissées en 1975 et
  en 1984. L'actif : de cinquante-sept à soixante-deux ans selon le corps, deux de plus
  depuis 2011. Les exceptions : un an par enfant à charge, trois au plus ; un an pour le
  parent de trois enfants à cinquante ans ; un an par enfant mort pour la France ; dix
  trimestres pour la carrière incomplète, depuis 2004 ; l'actif jusqu'à la limite des
  sédentaires, depuis 2010 ; le sédentaire jusqu'à soixante-dix ans sur autorisation,
  depuis le 14 juin 2023, âge qui borne désormais le tout. Des corps ont les leurs
  (hauts magistrats, Conseil d'État, Cour des comptes, magistrats judiciaires,
  professeurs, Collège de France, enseignants), et les militaires une limite par grade,
  avec des maintiens sans borne pour l'officier général qui a commandé en chef en temps
  de guerre et pour les orchestres de la Garde républicaine. Huit fiches, que le modèle
  n'applique pas : sept manquantes, une pas encore modélisée. Le cliquet des textes
  passe de 9 828 à 9 825.
reste: >-
  L'étape 3 de l'action 151 : ce que le simulateur fait au-delà de la limite, à décider
  par le propriétaire, puis chaque exception modélisée. À lire encore : les textes de
  1946 à 1953 et le décret n° 48-1907, la limite des territoriaux avant 1985, les
  limites des corps actifs avant 2010, les tableaux de L. 4139-16 de 2007 à 2023. Et les
  deux règles que l'étape 1 a signalées, la majoration de différé de la CARMF avant 2017
  et le taux acquis au 31 mars 1983 du régime général, laissées à une étape à elles.
