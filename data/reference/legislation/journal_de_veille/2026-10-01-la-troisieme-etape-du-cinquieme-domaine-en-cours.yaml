date: "2026-10-01"
session: >-
  la troisième étape du cinquième domaine, en cours : la pension proratisée contre la
  pension nationale, leur minimum, et l'écrêtement sur les pensions étrangères, dans
  les deux moteurs
consulte: >-
  Les exposés de la Cnav lus le matin même, relus pour le calcul : « Minimum de la
  retraite communautaire », « Minimum de la retraite personnelle dans le cadre des
  accords internationaux », « Calcul de la retraite personnelle dans le cadre des
  accords internationaux », « Les accords internationaux », « Montant de la retraite
  communautaire », « Minimum contributif » (subsidiarité, retraites retenues pour
  l'écrêtement), et l'exposé « Retraite personnelle » de la convention
  franco-sénégalaise. Aucun texte nouveau.
trouve: >-
  Le minimum de la « retraite conventionnelle » calculée en totalisation-proratisation
  suit les règles du minimum communautaire — théorique, puis proratisé sur la durée
  totale non limitée — ; la « retraite séparée », ses périodes étrangères comptées pour
  le taux, garde le minimum de toute pension. L'exposé ne lève la limite à la durée
  maximum que pour la durée totale : la durée du régime y reste limitée, comme dans le
  prorata de la pension, une lecture que la fiche déclare. Les deux pensions se
  comparent chacune portée à son minimum, la surcote ajoutée après lui.
reste: >-
  La révision de l'écrêtement quand une pension étrangère commence après le départ
  (R. 173-8) ; la pension de l'accord avec le Royaume-Uni à l'écrêtement, que la Cnav
  n'écrit pas ; la subsidiarité, présumée remplie ; la comparaison des pensions des
  fonctionnaires, que le minimum garanti peut relever.
