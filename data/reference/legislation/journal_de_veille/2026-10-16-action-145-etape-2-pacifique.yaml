date: "2026-10-16"
session: "action 145, étape 2 : la CAFAT, la CPS de Polynésie, Wallis-et-Futuna et les fonctionnaires de Nouvelle-Calédonie"
consulte: >-
  veille_droit.py (aucune fiche de ces régimes à relire). Les textes sont locaux, hors
  de l'index de la DILA. Sur Juridoc : la loi du pays n° 2001-016, articles Lp. 100-1
  à Lp. 100-23 (version du 5 mai 2026) ; la délibération n° 458 du 8 janvier 2009,
  articles 1er à 48 (version du 13 décembre 2022) ; le code des pensions de retraites
  des fonctionnaires de Nouvelle-Calédonie, partie législative (1er janvier 2025) et
  réglementaire (23 décembre 2025). Les fiches des paramètres de la CAFAT, janvier 2017
  à janvier 2026 et octobre 2026. Le CLEISS, régime et cotisations des salariés de
  Polynésie. Le site de la CPSWF et le rapport annuel 2021 de l'IEOM pour
  Wallis-et-Futuna. Injoignables le 16 octobre 2026 : LexPol (lexpol.cloud.pf,
  lexpol.pf : connexion réinitialisée, 503 en HTTP), le site de la CPS de Polynésie
  (application sans texte), wallis-et-futuna.gouv.fr (flux coupé, 503), cps.wf (page
  d'hébergeur).
trouve: >-
  Quatre fiches de règles, approchées ; aucun chiffre du scénario 1 n'en est changé.
  CAFAT : la valeur de référence est publiée (2 845,44 F CFP en 2026), le rendement
  descend de 10,3 % en 2016 à 9,0 % en 2026 quand le dépôt l'estime à 10 % ;
  l'anticipation de dix trimestres, avec 1,5 % d'abattement ou sans à 37 années, n'est
  pas portée ; le chômage cotise et vaut des points. CPS de Polynésie : salaire de
  référence des 180 meilleurs mois des 240 derniers, abattements et majorations non
  portés ; le rendement de la tranche B, 11,5 %, confirme celui du dépôt.
  Wallis-et-Futuna : la cotisation de retraite est de 21 % depuis 2020 (11,1 % en
  2009), quand la fiche de régime prend le taux total de la caisse, six points plus
  haut ; la réforme de 2015 ouvre l'anticipation dès 55 ans. Fonctionnaires de
  Nouvelle-Calédonie : l'abattement est par tranches d'âge (10 à 40 %), non 2,5 % par
  trimestre ; toutes les pensions sont minorées de 8 % en 2026 et 2027 ; l'assiette
  des cotisations est le traitement majoré de 73 %. Les lignes d'inventaire de la
  CAFAT, de Wallis-et-Futuna et des fonctionnaires du Pacifique sont corrigées.
reste: >-
  À lire : la délibération n° 300 de 1961 et le taux de la CAFAT d'avant avril 2009 ;
  le projet calédonien de 2026 qui déplafonne la cotisation ; sur LexPol, quand il
  répondra, les délibérations n° 87-11 AT et n° 95-180 AT et la loi du pays
  n° 2019-6 ; au Journal officiel de Wallis-et-Futuna, les délibérations
  n° 20 bis/AT/2009 et n° 25/AT/2015 et le statut de la CPSWF ; les rédactions du code
  calédonien d'avant 2025. À l'étape 2 : les trois hors champ (CRFM de Mayotte, élus du
  Pacifique, régies ferroviaires d'outre-mer), puis les limites de l'étape.
