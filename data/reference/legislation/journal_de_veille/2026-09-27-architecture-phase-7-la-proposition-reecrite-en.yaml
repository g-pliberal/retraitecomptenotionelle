date: "2026-09-27"
session: >-
  architecture, phase 7 : la proposition réécrite en univers de droit
consulte: >-
  veille_droit.py, au début de la session et à la fin : quatorze fiches à
  relire, les mêmes qu'à la fin de la phase 6, et la dernière veille du
  jour même. Les index LEGI et JORF, mis à jour au début : aucun
  incrément paru depuis celui du 27 septembre 2026 à 0 h 22 pour le JORF
  et celui du 26 septembre à 21 h 07 pour LEGI. Pour la fiche
  fin_de_la_suspension_2028, les versions de L. 161-17-2 et de
  L. 161-17-3 dans l'index LEGI. Et le texte de la proposition,
  README.md : les neuf fiches de la proposition et les motifs des couches
  en citent vingt-neuf passages, retrouvés mot pour mot par le contrôle
  des univers.
trouve: >-
  Rien de nouveau au Journal officiel. L. 161-17-2 et L. 161-17-3 n'ont
  pas de rédaction postérieure à celles du 31 décembre 2025
  (LEGIARTI000053280889, LEGIARTI000053280903) : la suspension court
  toujours. La phase 7 ne touche aucune règle du scénario 1 : la
  proposition s'écrit en univers de droit, posés sur la carte, sans qu'un
  résultat bouge. La liste des fiches du droit réel sans décision montre
  que le compte notionnel ne porte pas la cotisation que prélève
  l'assiette minimale des indépendants, que le scénario 1 applique.
reste: >-
  L'assiette minimale des indépendants dans le compte, à trancher par une
  note de décision ; les quatorze fiches à relire, chacune avec ce que
  dit son a_relire ; la rédaction nouvelle de R. 382-24, qui entrera « à
  examiner » à la prochaine mise à jour de l'index LEGI ; et ce que les
  entrées précédentes laissaient : l'article 16 du règlement de la CAVP,
  les articles 9-7 et suivants du règlement des indépendants, les
  rédactions sans statut de la liste des textes.
