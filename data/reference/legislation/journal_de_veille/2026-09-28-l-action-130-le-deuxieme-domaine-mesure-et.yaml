date: "2026-09-28"
session: >-
  l'action 130, le deuxième domaine mesuré et ouvert : la réversion, ses
  trois premières fiches lues
consulte: >-
  veille_droit.py au début de la session ; les index LEGI et JORF mis à
  jour, sans incrément paru depuis le 27 septembre à 20 h 49 ; L. 161-17-2
  et L. 161-17-3. Pour mesurer l'ordre : l'enquête annuelle de la DREES
  auprès des caisses (classeur du 26 mai 2026) et l'échantillon
  interrégimes de retraités 2016, sur son portail de données ouvertes. Pour
  le domaine, dans l'index LEGI : L. 353-1 à L. 353-6, D. 353-1 à D. 353-4,
  R. 353-1, R. 353-1-1, R. 353-2, R. 353-6, R. 353-7, dans toutes leurs
  rédactions ; le décret n° 2004-858, article 24, et le décret
  n° 2008-1509, article 2 ; L. 38 à L. 50 du code des pensions civiles et
  militaires ; le décret n° 2003-1306, articles 40 à 48. Dans la base
  législative de la Cnav : les circulaires n° 120/82, 3/95, 2005/17,
  2009/11 et 2010/15. La page « La pension de réversion » de la
  fédération Agirc-Arrco.
trouve: >-
  L. 161-17-2 et L. 161-17-3 n'ont pas de rédaction postérieure au 31
  décembre 2025 : la suspension court toujours. La réversion concerne 4,41
  millions de personnes fin 2024, l'invalidité et l'inaptitude 2,26
  millions de retraités fin 2016 : la réversion passe deuxième. Au régime
  général, le taux passe de 50 à 52 % au 1er décembre 1982 et à 54 % au
  1er janvier 1995 ; la réforme de juillet 2004 remplace la condition de
  ressources par un écrêtement et supprime la condition de durée de
  mariage ; l'âge, abaissé de 55 à 51 ans de 2005 à 2007, revient à 55
  ans en 2009, 51 pour le survivant d'un décès d'avant 2009 ; la
  majoration de 11,1 % naît en 2010 ; D. 353-1 écrit en 2026 le minimum de
  base, 3 983,29 euros au 1er janvier 2025. Dans la fonction publique, 50 %
  sans âge ni ressources, et, depuis la loi de finances pour 2026, un
  plancher au montant de l'ASPA pour les réversions liquidées depuis 2025.
  À l'Agirc-Arrco, 60 % des points à 55 ans depuis 2019.
reste: >-
  L'accord Agirc-Arrco de 2017, à lire sur Légifrance, qui répond depuis
  cette session par une vérification du navigateur ; l'article 24 du décret
  n° 2004-858 dans sa rédaction du 24 août 2005, à confronter au Journal
  officiel ; les montants annuels du minimum de réversion d'avant 2025 ;
  les régimes spéciaux, les indépendants et les libéraux ; le partage entre
  ex-conjoints, les orphelins, la majoration forfaitaire pour enfant à
  charge. Du domaine : le calcul de la réversion du survivant, le
  formulaire, les exemples, la page Coût et la décision de la proposition.
