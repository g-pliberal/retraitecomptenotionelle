date: "2026-11-06"
session: "action 130, file E (E6-bis) : les écarts que la relecture R-E7 a trouvés dans la CARMF lue au droit, fiches carmf_asv_minoration_enfants et asv_medecins_ajustement"
consulte: >-
  `veille_droit.py` (la base de la Cnav, rien de neuf) et `docs/veille_droit.md`. Dans
  l'index JORF du dépôt, à jour du 3 novembre 2026 : l'arrêté du 1er décembre 2016 en
  entier (JORFARTI000033538056 à 061), l'arrêté du 30 novembre 2016 aux 2° à 4° de
  l'annexe (JORFARTI000033521562), l'arrêté du 28 septembre 2011 aux statuts de l'ASV
  (JORFARTI000024612007), le rectificatif du 8 août 2026 (JORFARTI000054642802), l'arrêté
  du 7 janvier 2025 (JORFARTI000050962835 à 838, annexe IV en entier), et, pour chercher
  le texte de l'article 12 ter, les occurrences de « article 12 ter » et des
  prestations supplémentaires de vieillesse des médecins conventionnés de 1990 à 2016.
  Dans l'index LEGI, à jour du 2 novembre 2026 : L. 161-17-2 (cinq rédactions, la
  dernière LEGIARTI000053280889), D. 161-2-1-9 (trois rédactions, celles du 31 décembre
  2011 et du 1er septembre 2023 relues à 1952 et à 1964), le décret n° 2011-1644,
  article 4 (LEGIARTI000052567955, la valeur de service de 11,82 €).
trouve: >-
  L'ASV avait, avant 2017, un article 12 ter. L'arrêté du 28 septembre 2011 en récrit le
  premier alinéa (« dès l'âge de 60 ans » devient « dès l'âge prévu à l'article L.
  161-17-2 »), comme il récrit le cinquième alinéa du 1 de l'article 15 de la
  complémentaire ; l'arrêté du 1er décembre 2016 l'abroge (4°) et remplace, au dernier
  alinéa de l'article 15 de l'ASV, « au titre de l'article 12 ter » par « avant le 1er
  janvier 2017 », comme celui du 30 novembre 2016 remplace, à l'article 41 de la
  complémentaire, « demandé la liquidation de ses droits par anticipation au titre de
  l'article 15 » par « liquidé ses droits par anticipation avant le 1er janvier 2017 au
  titre de l'article 15 ». Le texte de l'article 12 ter n'est nulle part dans l'index.
  Le rectificatif du 8 août 2026 ne déplace qu'un intitulé de chapitre. L'âge légal des
  nés en 1964 est, pour les pensions depuis le 1er septembre 2026, de 62 ans et 9 mois
  (L. 161-17-2, 3°), non 63 ans ; le modèle l'ouvre déjà à 62,75 ans. L'arrêté du 7
  janvier 2025 (IV, 3°) dit « l'avant dernière année » à l'article 8 des statuts de
  l'ASV ; le contenu de l'article n'est pas publié.
reste: >-
  Le texte des articles 12 et 12 ter de l'ASV d'avant 2017 et du dernier alinéa de son
  article 15, au Bulletin officiel ou à la CARMF (question 22 du propriétaire, à compléter
  de l'article 12 ter). Candidat, hors de la tâche : l'article 27 des statuts de la
  complémentaire (arrêté du 30 novembre 2016, 2° : « Pour les retraites liquidées avant le
  1er janvier 2017, le nombre de points est affecté d'un coefficient compensant l'évolution
  de la valeur du point entre 2016 et 2017 ») et son article 31, celui du médecin qui
  bénéficie de l'allocation d'invalidité (3° : coefficients de 1,13, 1,11 et 1,09 selon
  la naissance) : aucune fiche ni aucun code du dépôt ne les porte.
