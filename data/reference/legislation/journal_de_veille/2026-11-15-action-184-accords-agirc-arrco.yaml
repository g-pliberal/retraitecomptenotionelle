date: "2026-11-15"
session: "action 184 : les accords Agirc-Arrco dans la liste de contrôle des textes"
consulte: >-
  Aucune règle du scénario 1 n'est touchée : la session étend la liste de
  contrôle des textes. Lu l'index de KALI publié par le dépôt, à jour au 10
  novembre 2026 à 21 h 31 (dump du 8 novembre), sans télécharger de dump.
trouve: >-
  Les trois accords nationaux interprofessionnels du régime Agirc-Arrco (17
  novembre 2017, 10 mai 2019, 5 octobre 2023) et leurs avenants sont dans
  KALI : 319 rédactions de 42 textes, inscrites « à examiner ». Le dernier
  avenant est le n° 31 du 11 décembre 2025, non étendu. Les accords de 1947
  et de 1961 n'y sont pas.
reste: >-
  Faire relire KALI par GitHub chaque lundi, sur accord du propriétaire (le
  workflow est une garde) ; rattacher ces rédactions aux fiches de la
  retraite complémentaire.
