date: "2026-11-06"
session: "action 130, file E8 : les écarts de R-E8 repris aux sources, et la majoration pour enfants des sections libérales lue au droit"
consulte: >-
  Les index JORF (au 6 novembre 2026, incrément 20261106-002608) et LEGI (au 5 novembre)
  récupérés et mis à jour. Dans LEGI : l'article 2 du décret n° 79-262 dans ses rédactions de
  1979, 1985 et 2012 ; son article 5-2 de 2026 ; l'article 6 du décret n° 99-913. Au JORF :
  le décret n° 2026-239 ; l'arrêté du 7 janvier 2025 de la CARMF, article 2 ; pour la
  CAVAMAC, l'arrêté du 23 juin 2011 (articles 1 à 4 et annexe), ses modifications des 28
  septembre 2012, 28 mars 2014, 4 mai 2016, 20 novembre 2017, 4 août 2023 et 8 juillet 2025,
  les titres de 1967, 1972, 1975 et 1983, le règlement du 10 juillet 2026 ; pour la CAVEC,
  les statuts de 2008, 2012 et 2018, l'arrêté du 4 juillet 2025, le règlement du 10 juillet
  2026 ; les neuf arrêtés des règlements du 10 juillet 2026, publiés le 17.
trouve: >-
  Les cinq écarts de R-E8, confirmés au texte : `cipav_seconde_tranche` cite désormais les six
  classes de 1979 à 2012, nomme le décret n° 2026-239 sans effet, et dit l'enjeu des taux de
  2026 de −29,32 € à +58,63 € par an, nul à trois plafonds. `sections_liberales_majoration_enfants`
  en cinq versions : la CAVEC conforme (10 % depuis le 7 juillet 2025) ; la Cipav conforme au
  décret depuis le 1er juillet 2026 ; une erreur prouvée, non corrigée, la CAVAMAC, dont les
  statuts majorent depuis le 1er juillet 2011 et le modèle depuis 2012 (1 332,33 € par an au
  cas posé) ; un point non tranché, la Cipav avant 2000 (403,40 €).
reste: >-
  À la file E : `surcote_par_age_seul`, `cotisation_par_classes_liberales`,
  `decret_2026_418_liberaux`. Au propriétaire : l'erreur de la CAVAMAC en 2011, la Cipav
  avant 2000, les statuts de la CAVAMAC de 1967 (fac-similé) et de la Cipav d'avant 2026
  (Bulletin officiel). Candidat : la réversion de la CAVEC, majorée de 10 % par ses textes.
