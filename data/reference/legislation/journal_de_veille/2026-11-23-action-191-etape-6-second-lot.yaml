trouve: >-
  Vingt et une lignes de liquidation prennent la date de leur texte, dans
  quatorze régimes ; aucun cas témoin ne bouge. Deux d'entre elles corrigent un
  résultat : la caisse des avocats majore pour trois enfants dès le
  1er septembre 2023, et la base des libéraux ne majore la durée pour enfant
  qu'à compter du 1er avril 2010. Détail :
  docs/feuille_de_route/191/2026-11-23-etape-6-les-dates-sans-effet.md.
reste: >-
  La surcote datée de la base des libéraux (R. 643-8) ; les droits d'avant
  1973 des artisans et des commerçants au 1er juillet 1984 ; la CAVP avant le
  7 juin 2009, dont les statuts ne sont qu'au Bulletin officiel ; l'ASV des
  médecins avant le 15 février 1985, à poser avec ses dix ans d'exercice ; les accords
  Agirc et Arrco du 4 février 1983 et du 18 mars 2011, absents de KALI ; la
  Banque de France en 2011, la Comédie-Française en 2012, l'Opéra en 2014,
  les ouvriers de l'État en 1964, la CRPCEN en 2008 ; les taux de cotisation
  qui changent en cours d'année.
