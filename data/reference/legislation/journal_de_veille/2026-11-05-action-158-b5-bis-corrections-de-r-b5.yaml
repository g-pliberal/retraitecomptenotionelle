date: "2026-11-05"
session: "action 158, vague 11, B5-bis : les corrections de la relecture R-B5 (les tableaux de reclassement qu'un autre article du décret date ; « A la même date »)"
consulte: >-
  L'index LEGI du dépôt (dump Freemium_legi_global_20250713-140000, incréments jusqu'au
  20261102-213929), table doc, chaque article dans toutes ses versions : n° 98-268, art. 17,
  20 et 28 (LEGIARTI000006506605, 006506606, 006506612, 006506627, 006506628) ; n° 2001-325,
  art. 14 et 17 (LEGIARTI000006567682, 006567685) ; n° 2017-1367, art. 23 et 28
  (LEGIARTI000035601659, 035601611) ; n° 2017-1494, art. 13 et 15 (LEGIARTI000035900888,
  035900898) ; n° 98-896, art. 8 et 10 (LEGIARTI000006508628, 006508629, 006508631) et le
  n° 2002-378 qui le modifie (LEGITEXT000005632469, LEGIARTI000006209301, 006209302) ;
  n° 2017-903, art. 12 (LEGIARTI000034702202, 036440010) ; l'arrêté du 18 avril 1989, art. 4
  (LEGIARTI000006718191).
trouve: >-
  Quatre tableaux que leur phrase ne date pas sont datés par l'article d'effet de leur
  décret : n° 98-268, art. 17, au 1er août 1995 (art. 28) ; n° 2001-325, art. 14, au
  1er janvier 1997 (art. 17) ; n° 2017-1367, art. 23, et n° 2017-1494, art. 13, I, au
  1er janvier 2017 (art. 28 et 15). Entrés au lecteur avec leur preuve. « A la même date »
  (n° 2017-903, art. 12, tableau 2) prend la date du tableau 1 (2018-02-01, 2019-02-01), au
  chaînage. L'arrêté de 1989 reclasse « à cette même date », le 1er janvier 1989 : la donnée
  était juste. Aucun rattachement de plus.
reste: >-
  Le n° 98-268, art. 20 : l'art. 28 le fait prendre effet au 1er août 1994, mais il
  échelonne l'accès au grade jusqu'au 1er janvier 1997 (une date ne suffit pas). Le
  n° 98-896, art. 8, récrit par le n° 2002-378, qui ne dit pas quand sa rédaction prend
  effet : à lire au JORF. Les plus de cent dates relatives au décret ; les décrets qui
  datent un chapitre ; les 90 tableaux de l'index publié.
