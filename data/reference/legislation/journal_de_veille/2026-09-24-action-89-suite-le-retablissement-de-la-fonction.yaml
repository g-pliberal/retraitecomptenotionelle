date: "2026-09-24"
session: "action 89, suite : le rétablissement de la fonction publique"
consulte: >-
  veille_droit.py, et la mise à jour de l'index LEGI : aucun incrément
  nouveau, L. 161-17-2 sans version postérieure au 31 décembre 2025. Dans
  l'index LEGI : L. 65 du code des pensions dans ses quatre versions
  depuis 1964, L. 6 dans ses trois versions depuis 1972 ; D. 173-15 à
  D. 173-17 du code de la sécurité sociale ; l'article 64 du décret
  n° 2003-1306 ; l'article 9 du décret n° 70-1277. Dans l'index JORF,
  l'article 42 de la loi n° 2014-40. La circulaire Cnav 2011/38, parmi les
  références que la base de la Cnav rattache à D. 173-16. Les pages
  « Rétablissement » de juris-cnracl : les radiés et leurs conséquences,
  le versement au régime général, la validation à l'Ircantec, la
  renonciation, les stagiaires, l'annulation, la NBI, le CTI, les
  services outre-mer.
trouve: >-
  L'agent parti de l'État, de la CNRACL, du FSPOEIE ou de la SEITA sans la
  durée qui ouvre une pension n'a pas de pension de son régime : ses
  années passent au régime général, sur le dernier traitement écrêté au
  plafond de chaque année, et à l'Ircantec. Le modèle lui servait une
  pension au prorata : un agent hospitalier parti au privé après treize
  ans touchait 26 312 € au lieu de 28 718 €. Corrigé dans les deux
  moteurs, les années rétablies gardant leur statut et changeant de
  régimes. Et la durée des militaires : quinze ans pour qui s'est engagé
  avant 2014, la loi n° 2014-40 ne donnant les deux ans qu'aux engagés
  depuis ; la table la lit désormais au premier engagement.
reste: >-
  Aucun exemple publié pour en faire un témoin officiel. Les salaires
  forfaitaires des militaires (D. 173-17, arrêté du 17 décembre 1970), la
  NBI à l'Ircantec, les services d'avant juillet 1930, les départs d'avant
  le 29 janvier 1950 ; les coordinations propres de la SNCF, de la RATP,
  des IEG et de la Banque de France.
