date: "2026-10-04"
session: "action 138, étape 2 : la CSG d'une pension selon le revenu fiscal du foyer"
consulte: >-
  Index LEGI du dépôt : L. 136-8 du code de la sécurité sociale, rédaction en vigueur
  (LEGIARTI000054336623, 27 juin 2026) et celle du 1er janvier 2019
  (LEGIARTI000037947799) ; L. 136-1-2 (LEGIARTI000051289679) ; D. 242-9
  (LEGIARTI000043870910). Le registre des autres modèles pour L. 137-41, l'article 158,
  5 a du CGI (LEGIARTI000054373673) et les seuils de 2026 de la fiche F2971.
trouve: >-
  Quatre cas depuis 2019 : exonéré sous 13 048 €, 3,8 % jusqu'à 17 057 € (avec le
  lissage par l'antépénultième année), 6,6 % sous 26 472 €, 8,3 % au-delà, pour une
  part, majorés de 3 484, 4 555 et 7 066 € par demi-part ; exonération des titulaires
  d'un minimum vieillesse ; l'abattement de 10 % des pensions, au moins 454 €, au plus
  4 439 € par foyer.
reste: >-
  Les seuils de l'outre-mer, les demi-parts autres que celle du conjoint, le lissage
  par l'antépénultième année ; l'ASPA du couple et les non-résidents, le reste de
  l'étape 2.
