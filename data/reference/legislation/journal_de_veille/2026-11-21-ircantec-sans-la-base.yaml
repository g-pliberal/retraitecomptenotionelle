date: "2026-11-21"
session: "action 194 : l'Ircantec servie avant le régime général"
consulte: >-
  L'index LEGI du dépôt : arrêté du 30 décembre 1970, article 16, rédactions
  du 31 août 1983, du 1er janvier 2004, du 1er juillet 2011 et du 14 septembre
  2023 (LEGIARTI000006381610, LEGIARTI000006381612, LEGIARTI000024266924,
  LEGIARTI000048065521), leurs I et II. La page de l'Ircantec « Les
  conditions de départ à la retraite », déjà lue le 13 octobre 2026.
trouve: >-
  Aucune rédaction nouvelle. L'anticipation, au plus tôt cinquante-cinq ans
  puis dix ans avant l'âge du 1° de L. 351-8, n'est liée à aucune liquidation
  du régime de base ; avant l'âge légal, la seconde table et le taux plein ne
  valent pas. Le modèle sert désormais l'Ircantec au départ déclaré quand la
  base n'ouvre pas encore. Détail :
  docs/feuille_de_route/194/2026-11-21-ircantec-sans-la-base.md.
reste: >-
  L'Agirc-Arrco, que l'article 84 de l'accord de 2017 laisse aussi demander
  dix ans avant l'âge du taux plein, suit toujours sa base.
