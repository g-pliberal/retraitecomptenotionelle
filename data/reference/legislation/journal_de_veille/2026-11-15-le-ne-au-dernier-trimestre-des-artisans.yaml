date: "2026-11-15"
session: "le né au dernier trimestre des artisans et commerçants, recherches complémentaires à la demande du propriétaire"
consulte: >-
  L'index JORF du dépôt, à jour au 11 novembre 2026 : le décret n° 2010-1734 du 30
  décembre 2010, article 2 (JORFARTI000023334266). L'index LEGI : l'article 3 bis du
  décret n° 73-937 (LEGIARTI000006765840, LEGIARTI000023397572) et D. 351-1-3 du code
  de la sécurité sociale (LEGIARTI000006736523, LEGIARTI000023397562). Les circulaires
  RSI n° 2011/014 du 31 mai 2011, n° 2011/017 du 14 juin 2011 et n° 2012/011 du 12
  juillet 2012, lues par le web : le conteneur de la session ne joignait pas
  legislation.lassuranceretraite.fr.
trouve: >-
  Le décret modifie D. 351-1-3 et le III du 3 bis par une seule phrase, qui ajoute le
  dix-huitième anniversaire aux deux ; la version consolidée du 3 bis ne l'a reporté qu'à
  son 1°. L'omission du 2°, de juillet 2011 à octobre 2012, est de la consolidation, non
  du décret, et le RSI accordait les quatre trimestres « au cours de l'année des 16,17 ou
  18 ans ». Le modèle, qui donne l'option à l'artisan et au commerçant comme au salarié,
  est conforme ; un test le tient. L'entrée du même jour sur la voie agricole disait à
  tort « le même article » du décret pour D. 16-3 du code des pensions : il vient du
  décret n° 2010-1748.
reste: >-
  Rien sur ce point. Remarqué en passant, non vérifié : un artisan né en septembre 1951
  et entré avant 1973 se voit ouvrir l'âge légal à 60 ans en octobre 2011, quand ses
  périodes d'après 1973 seules ne l'ouvrent pas ; à lire, l'âge du régime en points des
  artisans et des commerçants pour les générations que la réforme de 2010 décale.
