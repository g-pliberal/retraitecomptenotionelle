date: "2026-10-02"
session: >-
  l'étape 1 de l'action 141, que le propriétaire lance : « Lance l'action 141 » —
  les textes qui financent les points de retraite complémentaire du chômage
  indemnisé, période par période
consulte: >-
  `veille_droit.py` ; l'index JORF du dépôt (accords de financement agréés de 2000 à
  2016, règlements d'assurance chômage de 1993 à 2004, convention du 23 mars 2000 et
  arrêtés du Fonds de solidarité vieillesse) et l'index LEGI (règlements de 2019 et
  de 2025, articles 19 et 70 ; L. 161-17-2 sans version postérieure au 31 décembre
  2025 — l'incrément suivant, injoignable, echanges.dila.gouv.fr fermant la
  connexion) ; la banque d'accords du Medef, ses 674 documents par leur adresse
  directe, couche texte ou reconnaissance de caractères ; les textes que publie
  l'Unédic (accord du 14 avril 2017, convention Agirc-Arrco-Unédic du 14 décembre
  2021, article 8 bis de l'Agirc en 2001, actualité du 3 janvier 2022) ; l'accord du
  17 novembre 2017 et la circulaire 2023-03-DRJ, que publie l'Agirc-Arrco.
  Injoignables : Légifrance (403), les archives du web.
trouve: >-
  L'Unédic cotise à l'Arrco depuis 1990, à l'Agirc depuis 1996, sur 60 % du salaire
  journalier de référence, au taux d'appel (protocole du 2 janvier 1990, accords du
  30 novembre 1989 et du 19 septembre 1996, accords agréés jusqu'en 2017, convention
  de 2021), et leur reverse 0,8 % de ce salaire, pris sur la participation de
  l'allocataire — 1,2 % de 1993 à 2002, 3 % depuis ; avant, elle remboursait les
  pensions des droits qu'aurait acquis une cotisation de 4 % (Arrco) ou au système
  minimum (Agirc). Depuis 2019, une fraction de CEG compense la garantie minimale de
  points. L'État paie l'ASS et l'ASFNE (convention du 23 mars 2000, Fonds de
  solidarité vieillesse), dont les points se calculent à 4 % (accord du 17 novembre
  2017, art. 61 et 62). Le modèle n'en change rien encore.
reste: >-
  Introuvables : le relevé de conclusions du 9 février 1984, le protocole du 1er
  septembre 1988, la convention Unédic-Agirc du 3 décembre 1987, les protocoles du 2
  janvier 1997 et du 2 janvier 2001, les conventions d'application de l'Unédic d'avant
  2021, celles de l'État du 23 mars 2000 et du 5 juillet 2021. Le point 2 de l'action
  attend le propriétaire.
