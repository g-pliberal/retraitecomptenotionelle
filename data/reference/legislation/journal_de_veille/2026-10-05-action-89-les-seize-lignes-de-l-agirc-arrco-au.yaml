date: "2026-10-05"
session: "action 89 : les seize lignes de l'Agirc-Arrco au vivier"
consulte: >-
  veille_droit.py ; l'index LEGI du 27 septembre 2026 (incréments refusés), L.
  136-8 (LEGIARTI000053278668, III bis 2°). Hors JORF, sur agirc-arrco.fr : l'accord
  national interprofessionnel du 17 novembre 2017, version applicable au 1er janvier
  2019 (circulaire 2018-09-DC), articles 89 à 99 et 109 à 115 ; l'accord du 5
  octobre 2023 ; les circulaires 2020-02-DRJ, 2023-10-DT, 2024-04-DRJ (avenant n°
  16), 2024-05-DRJ (avenant n° 19), 2024-12-DT, 2025-15-DT, 2025-16-SG-DRJ et 2026-1 ;
  la compilation des valeurs de point de novembre 2025 ; les livrets n° 3, 4, 6, 7
  et 8 ; dix pages de la fédération et sa calculette fiscale de 2026.
trouve: >-
  Deux enfants à charge du survivant au décès lèvent l'âge de la réversion, pour
  toujours, et la majoration pour enfants du défunt est reversée en entier : le
  modèle ne la reversait pas. Les points se comptent au taux de calcul, 6,20 % et 17
  % ; la seconde retraite du cumul part au 1er janvier 2024 au plus tôt ; le plafond
  de la majoration vaut 2 367,48 € depuis novembre 2024 ; le bonus d'un an survit
  pour qui avait le taux plein avant décembre 2023. Le salaire de référence de
  l'UNIRS de 1949 à 1957 était en francs chez OpenFisca. Tous portés.
reste: >-
  Le coefficient temporaire de la retraite progressive (article 88, circulaire
  2026-1) ; les points de maladie (articles 57 et 58) ; l'orphelin ; le partage entre
  ex-conjoints et son plafond de 169 à 172 trimestres, que la version consolidée de
  l'accord tranchera ; les limites du cumul plafonné après 2026.
