date: "2026-10-08"
session: "action 138, étape 17, neuvième partie : les taux pleins de L. 351-8"
consulte: >-
  Dans l'index LEGI : L. 351-8, ses six rédactions de 1985 à 2025 ; R. 351-23 et R.
  351-24, les mères de famille ouvrières ; D. 351-1, la carte de déporté ; D. 351-2, ses
  trois rédactions (1985, 2023, 2024) ; le décret n° 45-0179, articles 70-1 et 70-2 avant
  1983 ; le décret n° 74-54, article 1er (1975) ; le décret n° 74-191, article 1er, en
  Alsace-Moselle ; l'arrêté du 30 décembre 1970 (Ircantec), article 16, de 1971 à 2023.
  Dans l'index JORF : les notices du décret n° 65-315, de la loi n° 73-1051, du décret n°
  74-54, des décrets du 15 mai 1974, de la loi n° 75-1279 et du décret n° 76-404. Hors
  des index : les circulaires ministérielles n° 47 SS du 15 juin 1965 et n° 21 SS du 21
  mai 1976, les circulaires Cnav n° 20/74 et n° 2024-29, par la base de législation de la
  Cnav.
trouve: >-
  L'ancien déporté ou interné a le taux de soixante-cinq ans dès soixante ans pour les
  pensions prenant effet depuis le 1er mai 1965, « comme elle l'est pour les assurés
  reconnus inaptes » (circulaire n° 47 SS), le taux plein dès l'âge légal depuis 1983
  (L. 351-8, 3° ; circulaire Cnav n° 2024-29). La loi n° 75-1279, « dont la date d'effet est
  fixée au 1er juillet 1976 », donne le taux de soixante-cinq ans dès soixante ans à la mère
  de trois enfants de trente ans d'assurance, majoration de durée comprise, ouvrière cinq
  des quinze dernières années, et au travailleur manuel de quarante-trois ans d'assurance
  jusqu'en juin 1977, quarante-deux ensuite, quarante et un depuis mars 1978, cinq ans en
  continu, à la chaîne, au four ou aux intempéries (circulaire n° 21 SS ; article 70-2) ;
  depuis 1983, la mère a le taux plein (R. 351-23), le travailleur manuel n'a plus de
  catégorie. L'ancien combattant ou prisonnier de guerre a le taux plein de soixante-quatre
  à soixante ans selon ses mois de captivité et de services de guerre depuis 1974 (63 ans
  au moins cette année-là ; décret n° 74-54, puis D. 351-2) ; la caisse y ajoutait deux ans
  depuis la loi de 2010, D. 351-2 n'ayant pas changé ; depuis le 8 juillet 2024, de
  soixante-six ans à l'âge légal (circulaire Cnav n° 2024-29, qui confirme aussi le
  maximum des pensions sur la loi n° 49-244, article 2). L'Ircantec exempte de coefficient
  les trois catégories (article 16, 2° à 4°), l'Agirc-Arrco quiconque a le taux plein au
  régime général. Quatre fiches les servent, dans les deux moteurs, sur trois faits que la
  saisie déclare.
reste: >-
  L'allocation de solidarité aux personnes âgées dès l'âge de la catégorie (R. 815-1, «
  aux 2° à 5° de l'article L. 351-8 ») ; les évadés et rapatriés pour maladie ; les dates
  où les salariés agricoles et les régimes alignés ont reçu chaque règle ; le texte des
  lois n° 73-1051 et n° 75-1279 et des décrets n° 65-315 et n° 76-404, dont l'index ne
  garde que les notices. De l'étape 17, ensuite : les majorations pour enfants à charge et
  pour conjoint à charge.
