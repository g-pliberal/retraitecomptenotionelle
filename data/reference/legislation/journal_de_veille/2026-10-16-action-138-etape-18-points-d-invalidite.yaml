date: "2026-10-16"
session: "action 138, étape 18 : les points d'invalidité des artisans et des commerçants (RCI)"
consulte: >-
  L'index LEGI du dépôt, récupéré et mis à jour des incréments jusqu'au 15 octobre
  2026 : R. 635-10 (LEGIARTI000026885804) et L. 635-1. L'index JORF du dépôt :
  l'arrêté du 9 février 2012 portant approbation du règlement du régime
  complémentaire des indépendants (JORFARTI000025395326 : articles 7, 8, 9, 56 et
  annexe 1, 3) ; ses modifications approuvées le 19 juin 2024 (JORFARTI000049776028,
  9° ; article 2, JORFARTI000049776025), le 6 octobre 2025 et le 21 septembre 2026 ;
  les règlements d'invalidité-décès des travailleurs indépendants du 21 décembre
  2018, du 1er août 2023 et du 1er avril 2026, article 47 (JORFARTI000053762045).
trouve: >-
  Le RCI attribue, depuis 2013, pour chaque mensualité de pension d'invalidité ou
  d'incapacité au métier, versée ou non, le quotient au centième des points cotisés
  avant l'arrêt du compte de la pension par les mois civils entiers d'activité ;
  depuis l'arrêté du 19 juin 2024, deux points par mois à qui n'a cotisé aucun point,
  et la pension visée est celle, totale et définitive ou d'incapacité partielle, du
  régime de L. 632-1. Avant 2013, l'artisan avait seize points par trimestre de
  pension s'il n'avait rien cotisé à sa RCO, le quotient au centième de ses points
  depuis 1979 par ses trimestres cotisés sinon ; le commerçant, deux points par mois.
  Le régime d'invalidité-décès finance ces points, au revenu de référence. Les
  arrêtés de 2025 et de 2026 ne touchent pas l'article 9. Fiche neuve
  points_invalidite_independants, transcrite ; les deux moteurs servent ces points.
reste: >-
  Les règlements d'origine (arrêtés du 15 décembre 1978 et du 17 décembre 2004),
  que l'index ne porte pas ; un exemple chiffré de la caisse ; ce que « points
  cotisés » compte des points repris en 2013 ; le régime facultatif des commerçants
  d'avant 2004.
