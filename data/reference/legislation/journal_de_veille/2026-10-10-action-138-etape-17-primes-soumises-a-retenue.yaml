date: "2026-10-10"
session: "action 138, étape 17, douzième partie : les primes que la loi assujettit à la retenue pour pension"
consulte: >-
  Dans l'index LEGI : la loi n° 57-444 du 8 avril 1957, articles 3, 6 et 6 bis ; les
  décrets n° 97-1022, 2002-78, 2009-441, 2009-1633 et 2013-617, qui fixent les taux de
  l'indemnité de sujétions spéciales de police de 1997 à 2023 ; la loi n° 90-1067 du 28
  novembre 1990, article 17, ses rédactions de 1990 à 2023 ; le décret n° 65-773, article
  15 bis ; le décret n° 47-1846, article 2 ; le décret n° 2003-1306, articles 18 et 18-1,
  toutes leurs rédactions ; le décret n° 2007-173, article 3 ; le décret n° 91-613,
  article 5 ; le décret n° 90-850, article 6-3, et l'arrêté du 2 juillet 1990 ; la loi
  n° 2003-1199, article 37, ses deux rédactions ; le décret n° 2004-240, article 2 ; le
  décret n° 2004-569, article 2 (le plafond des primes du RAFP). Hors des index : la
  réponse ministérielle à la question n° 13318 (JO Sénat du 17 janvier 1991), le décret
  du 15 mai 1983 n'étant pas publié ; l'annexe au projet de loi de finances qui donne la
  retenue des policiers, 12,76 % en 2018 ; la documentation juridique de la CNRACL
  (« Majoration de pension Prime de feu », « Les Sapeurs pompiers professionnels »,
  « Cotisations applicables aux sapeurs-pompiers professionnels », « Les
  Aides-soignants », « Supplément de pension des aides-soignants… ») et sa page
  « Suppléments et accessoires de pension » (10 décembre 2025).
trouve: >-
  Trois primes entrent dans l'assiette de la retenue et dans la pension. L'indemnité de
  sujétions spéciales des policiers des services actifs, depuis le 1er janvier 1983, un
  dixième par an jusqu'en 1992, au taux du corps d'encadrement et d'application (20 % en
  1983, 28,5 % depuis 2020), majore le traitement que la pension liquide ; la retenue
  compte 1 % de plus (article 3) et 0,5, 1 puis 1,2 % (article 6 bis) : 12,76 % en 2018.
  L'indemnité de feu des sapeurs-pompiers professionnels, depuis le 1er janvier 1991,
  deux quinzièmes puis un quinzième par an jusqu'en 2003, au taux de 19 % puis de 25 %
  depuis le 26 juillet 2020, majore le traitement à proportion des années de
  sapeur-pompier, pour quinze puis dix-sept ans de services et l'âge de la catégorie
  active, sans prorata depuis le 2 janvier 2025 quand ces services et leur bonification
  atteignent seuls le pourcentage maximum ; ses cotisations supplémentaires (0,6 à 1,8 %
  de l'agent, 1,2 à 3,6 % de l'employeur) ont cessé en 2021 et 2022, la retenue de 2 %
  de la bonification demeure. La prime spéciale de sujétion des aides-soignants de la
  fonction publique hospitalière, depuis le 1er janvier 2004, dans la limite de 10 % du
  traitement, prend une retenue de 1,5 % et une contribution de 3,5 %, et ouvre un
  supplément de pension, la prime des six derniers mois, de 20 % en 2004 à 100 % en
  2008, au prorata des services d'aide-soignant de qui est entré dans le corps depuis
  2004, ajouté après la décote. Le RAFP plafonne les autres primes à 20 % du seul
  traitement indiciaire. Les deux moteurs le portent, aux statuts policier et
  aide_soignant qui naissent, et au sapeur-pompier professionnel, la jouissance que la
  loi diffère jusqu'à l'âge courant dès la date d'effet ; deux des exemples de la CNRACL
  sur l'indemnité de feu se rejouent au centime, un troisième au prorata près.
reste: >-
  L'ancien sapeur-pompier, que la majoration suit depuis 2021, et le sapeur-pompier
  reclassé ; la jouissance différée jusqu'à l'âge, servie ici dès la date d'effet ; la montée de
  quinze à dix-sept ans de 2011 à 2015 ; l'âge du supplément des aides-soignants depuis
  la loi du 14 avril 2023 ; un titre de pension de la CNRACL qui dise si le supplément
  passe sous le pourcentage ; les taux de l'indemnité de police avant 1997 et le décret
  du 15 mai 1983 ; la prime de sujétions spéciales des surveillants pénitentiaires (loi
  de finances pour 1986, article 76), l'indemnité des gendarmes et celle des personnels
  administratifs et techniques de la police depuis 2023, qui n'ont pas de statut.
