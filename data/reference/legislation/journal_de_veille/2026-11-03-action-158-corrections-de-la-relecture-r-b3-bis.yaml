date: "2026-11-03"
session: "action 158, file B3-ter : les corrections de la relecture R-B3-bis du chaînage des durées et des reclassements aux grilles (scripts/fetch/dila_legi_chainage.py, data/reference/grilles/chainage/)"
consulte: >-
  Aucune règle du scénario 1 n'est écrite : ni les durées ni les reclassements ne servent au
  calcul. L'index LEGI publié du dépôt, à jour de l'incrément 20261102-213929, récupéré sans
  reconstruction : n° 2004-1439, art. 23-1 ; n° 2010-564, art. 5 (versions LEGIARTI000023402803
  et 023750120) ; n° 2015-1275, art. 18 ; n° 2015-1277, art. 3 (la liste de ses versions ; LEGIARTI000035603091 et 048278636 ouvertes) ;
  n° 2016-2008, art. 12 et 24 (leurs versions) ; n° 2016-2007, art. 3 (LEGIARTI000033792732,
  036490570) ; n° 2009-1322, art. 2 (LEGIARTI000037196211) ; n° 2014-925, art. 1 (la liste de ses versions) ;
  n° 83-1260, art. 34 (LEGIARTI000034794301) ; n° 2012-1162, art. 2 (LEGIARTI000034774290,
  036489856, 045731731) ; n° 2012-1420, art. 18 ; n° 2012-1421, art. 1 (LEGIARTI000026797761,
  032546841) ; n° 90-90, art. 18 (LEGIARTI000034798803) ; n° 2017-786, art. 12, et les visas de
  LEGITEXT000034750633 ; n° 86-492, art. 19-2 ; n° 2012-762, art. 1 et 14 (ses quatre versions) ;
  les notices LEGITEXT000006061489 et LEGITEXT000024751171 (n° 67-91). Le Noyau RH du CISIRH
  (juillet 2026), au dépôt : les grilles 00420, 00421, 00422, 02777, 00226, 00227, 03351, 02947
  à 02949, 03214 à 03216, 03751, 03752, 03922, 03923 ; les corps 00409, 00671, 00873, 01102,
  01144, 01153 et leurs grades ; le texte 166 (n° 60-403) et le texte 1142 (n° 2012-762). Le
  JORF n'a pas été ouvert.
trouve: >-
  Un tableau de reclassement n'écrit pas toujours tous les échelons de la grille : la colonne
  d'accueil des majors de police s'arrête au 3e échelon, et l'exceptionnel y est le 5e de la
  grille (n° 2010-564, art. 5), non le 4e ; il se place par sa nature. Réunis sur toute la
  période, les échelons d'une grille cachent les jours où elle n'en a aucun (greffiers,
  2016-2023, version non lue) ou n'en a pas assez (sapeurs-pompiers : « A compter du 1er janvier
  2021 », art. 12 du n° 2016-2008 modifié) ; comparés date par date, ils coupent 8 lignes et en
  rattachent 5. Le n° 2012-762 régit les trois corps que son art. 1 énumère, et son tableau de
  durées vaut pour « les corps d'infirmiers régis par le présent décret » : un grade commun se
  rattache à chacun. Le Noyau RH porte le n° 60-403 (texte 166) sans NOR.
reste: >-
  Une relecture indépendante de ces corrections. Les dates d'effet que les lecteurs ne lisent pas
  (« Jusqu'au 31 décembre 2020 », art. 24 du n° 2016-2008) ; la version des grilles des greffiers
  non lue. Rattacher davantage sans deviner : le sommet d'échelon non écrit ; les autres décrets
  communs (n° 91-783), chacun par son article lu ; le n° 60-403 par son numéro et sa date.
