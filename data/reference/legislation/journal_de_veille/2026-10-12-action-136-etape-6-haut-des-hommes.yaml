date: "2026-10-12"
session: "action 136, étape 6 : le haut de l'échelle des hommes, la tranche de trente à quarante ans et les carrières statutaires"
consulte: >-
  Aucune source de droit nouvelle : la session lit, sans les modifier, les règles du
  scénario 1 que la simulation applique aux carrières statutaires (le régime de la SNCF,
  sncf.yaml ; la bonification du cinquième des militaires). Les séries certifiées au
  dépôt — les quintiles de la pension en équivalent carrière complète de l'EIR 2020, leurs
  durées, tranches et proratisations, les parts de régime principal ; aucun
  téléchargement.
trouve: >-
  Aucun texte de droit nouveau. Lues par moindres carrés dans les quintiles de l'EIR, les
  carrières de trente à quarante ans durent 33 ans pour les hommes, 34 pour les femmes :
  les 35 de la population tiennent. La proratisation des hommes aux deux quintiles du
  haut, 94 et 95 % pour 100 et 98,5 dans l'EIR, manque pour près des deux tiers par les
  carrières statutaires, chaque régime représenté par sa catégorie la plus précoce. Le
  régime de la SNCF du modèle ne connaît que les âges des agents de conduite, et aucune
  bonification de traction.
reste: >-
  À l'étape 6 de l'action 136 : la pension des femmes, trop haute par année validée ; le
  minimum selon la génération ; la bascule de la page, au propriétaire. Au propriétaire
  aussi, peut-être une action à part : les catégories des régimes statutaires, les
  sédentaires de la SNCF, les officiers et le second métier des militaires, qui tiennent
  au droit du scénario 1 et aux cas types de la page.
