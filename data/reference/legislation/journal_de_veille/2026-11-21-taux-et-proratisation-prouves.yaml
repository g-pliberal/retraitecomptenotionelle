date: "2026-11-21"
session: "action 194 : le taux et la proratisation découpés en versions et prouvés"
consulte: >-
  L'index LEGI du dépôt : R. 351-6 du code de la sécurité sociale dans ses quatre
  rédactions (LEGIARTI000006749347 à LEGIARTI000053335582), l'article 70-5 du
  décret n° 45-179 (LEGIARTI000006760666), L. 351-1 (LEGIARTI000006742620 à
  LEGIARTI000023035688), R. 351-1 (LEGIARTI000006749339), R. 351-7, L. 351-6,
  R. 351-39 (LEGIARTI000053327980). L'index JORF : décret n° 2004-144, article 2
  (JORFARTI000002055399), décret n° 2007-614, article 1er (JORFARTI000002078759),
  décret n° 2025-1409, article 2 (JORFARTI000053227542).
trouve: >-
  150 trimestres de 1983 à 2003 pour toute génération ; depuis 2004, la table du
  II de R. 351-6 pour les nés avant 1948, la durée requise ensuite ; depuis 2026,
  le II supprimé mais maintenu par R. 351-39 pour les plus de 75 ans. La
  consolidation LEGI de R. 351-6 au 1er janvier 2026 perd la ligne des nés en
  1947, que le décret publié ne retire pas. Aucun résultat ne bouge ; une session
  indépendante d'accord sur 58 cas, à la lecture de la caisse pour l'année de
  l'effet et pour la majoration de R. 351-7. Détail :
  docs/feuille_de_route/194/2026-11-21-taux-et-proratisation-prouves.md.
reste: >-
  Un exemple officiel d'une pension proratisée de 2004 à 2025 (circulaire Cnav
  n° 2004/29, non relue pour en chercher un) ; les textes d'avant le 21 décembre
  1985 hors de l'article 70-5 du décret n° 45-179.
