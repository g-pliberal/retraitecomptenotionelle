date: "2026-11-03"
session: "action 158, étape 2, seconde moitié : les grilles de la territoriale et de l'hospitalière, lues au LEGI par l'index reconstruit, certifiées et recoupées"
consulte: >-
  Aucune règle du scénario 1 n'est écrite. L'index LEGI du dépôt, reconstruit le 2 novembre
  2026 (dump du 13 juillet 2025, incréments jusqu'au 2 novembre 2026 à 21 h 39) : les décrets
  et arrêtés d'échelonnement indiciaire, de classement indiciaire et d'échelles de
  rémunération de la territoriale et de l'hospitalière, version par version ; l'article 8 du
  décret n° 85-1148, pour le minimum de traitement de 2021 et 2022 ; les articles du décret
  n° 2017-1737, pour le report d'un an du protocole PPCR. Deux grilles publiées : les
  « Échelles de rémunération de catégorie C, à compter du 1er janvier 2024 » du centre de
  gestion de la fonction publique territoriale du Nord (cdg59.fr), et les grilles de la
  fonction publique hospitalière de la fédération UNSA Santé et Sociaux, mise à jour du
  25 janvier 2022 (unsa-fp.org). Le site du centre de gestion de la Haute-Garonne ne répond
  toujours pas ; la note de la FHF sur le Ségur ne donne pas de grille.
trouve: >-
  Le LEGI garde avec leurs tableaux 75 textes de la territoriale et 155 de l'hospitalière :
  280 et 217 grilles, 4 521 et 3 024 périodes d'échelons lues, depuis 1986 et 1990. Les
  tableaux d'avant 1995, dessinés en caractères, ne sont pas lus (270 versions), ni les
  indices extrêmes d'un grade sans ses échelons, que donnent seuls les décrets de classement
  indiciaire de l'hospitalière. Le décret n° 2006-228 ne fixe que les bornes des échelles 3 à
  6 de l'hospitalière, et l'arrêté de leurs échelons de 2006 à 2014 n'est pas dans l'index ;
  l'arrêté du 23 juillet 1998 y reste en vigueur, abrogé implicitement. Depuis la réforme de
  la haute fonction publique, l'indice brut des administrateurs monte à 2 074. Le minimum de
  traitement est l'indice majoré 340 du 1er octobre 2021, 343 du 1er janvier 2022 (décret
  n° 2021-1749). Les échelles C1 à C3 et les agents de maîtrise de la territoriale, C1 à C3
  et les aides-soignants de l'hospitalière, redonnent indice pour indice les deux grilles
  publiées, par le barème du Noyau RH.
reste: >-
  L'étape 2 de l'action 158 : les durées d'échelon de la territoriale et de l'hospitalière,
  dans les statuts et les décrets de carrière ; les tableaux en caractères ; le chaînage et
  les reclassements ; le barème avant 2006, au décret n° 82-1105. Puis l'étape des militaires,
  décidée le 2 novembre 2026 : leurs indices de solde (décrets n° 2009-21, 2009-22, 2011-388,
  2017-1362).
