date: "2026-11-21"
session: "action 177, étape 10 : l'assurance volontaire vieillesse des salariés expatriés"
consulte: >-
  L'index LEGI du dépôt : L. 742-1 du code de la sécurité sociale
  (LEGIARTI000047453412), R. 742-4 (LEGIARTI000006752525), R. 742-6
  (LEGIARTI000037941993), R. 742-8 (LEGIARTI000031483809), R. 742-30
  (LEGIARTI000023416503), R. 742-34 (LEGIARTI000023416488). La base de
  législation de la Cnav, par son API : l'exposé « Assurance volontaire » et le
  barème « Assurance volontaire - Montants des cotisations par trimestre »
  (circulaires 2014/24 à 2026/23). Le barème 2026 de la Caisse des Français de
  l'étranger.
trouve: >-
  Quatre catégories en part du plafond (100, 75, 50 et 25 %, la dernière
  jusqu'au trimestre des vingt-deux ans) ; l'assuré est censé avoir perçu le
  salaire de sa catégorie, et ses trimestres se décomptent comme ceux de
  l'assurance obligatoire. Le modèle ne portait rien de ces années ; il les
  porte au régime général. Détail :
  docs/feuille_de_route/177/2026-11-21-etape-10-assurance-volontaire-des-expatries.md.
reste: >-
  L'écart de 10 € entre les cotisations de 1re catégorie publiées par la CFE
  et par la Cnav en 2026 ; les catégories d'avant 1969 ; l'assurance volontaire
  des non-salariés (L. 742-6) et le rachat de L. 742-2.
