date: "2026-11-22"
session: "action 191 : les versions supposées d'avant 1985, lues au Journal officiel"
consulte: >-
  Le Journal officiel « Lois et décrets » sur Gallica : loi du 18 août 1936 (JO
  du 20 août 1936) ; loi du 12 avril 1941 (JO du 6 mai 1941) ; ordonnances
  n° 45-170 (JO du 3 février 1945) et n° 45-2454 (JO du 20 octobre 1945) ; lois
  n° 48-1306 (JO du 24 août 1948) et n° 48-1469 (JO du 23 septembre 1948) ;
  décrets n° 54-23 et n° 54-24 (JO du 10 janvier 1954).
trouve: >-
  La limite d'âge d'office de la SNCF et de la RATP dès 1954 ; la majoration
  pour conjoint de moins de 65 ans de 1948 à 1975 ; aucune pension minimum sous
  quinze ans d'assurance avant 1976, le seuil abaissé de 1945 à 1954. Corrigé,
  avec trois tests ; les marins d'avant 1968, déclarés. Détail :
  docs/feuille_de_route/191/2026-11-22-textes-anciens-du-journal-officiel.md.
reste: >-
  Les marins d'avant 1968 (minimum vital, catégorie au mois) ; la loi du 18 août
  1936 dans sa rédaction d'origine ; le code des pensions de 1948, absent de
  Gallica.
