date: "2026-11-03"
session: "action 158, étape 2, les durées d'échelon : le temps à passer dans chaque échelon, lu au LEGI dans les statuts des trois versants et des militaires"
consulte: >-
  Aucune règle du scénario 1 n'est écrite. L'index LEGI publié du dépôt, à jour au
  2 novembre 2026 (incrément 20261102-213929), récupéré sans reconstruction : les
  7 880 versions d'articles de 1 633 textes qui fixent la durée des échelons, que son
  filtre garde depuis le 3 novembre. Relus à la main : l'article 24 du décret
  n° 2010-329 dans trois versions (LEGIARTI000022021243, LEGIARTI000028542716,
  LEGIARTI000032542276), les décrets n° 92-1436, 83-1260 (article 91), 56-448, 98-1262,
  95-83, 95-952, 91-857, 92-867, 93-145, 2008-952 (article 6-1), 76-1001 (article 14),
  2003-770 (article 13), 89-750. Le Noyau RH de l'État du CISIRH (juillet 2026), déjà au
  dépôt, pour le recoupement. Les pages des CDG 59, 69 et 31, du CIG petite couronne, de
  la FNCDG et d'emploi-territorial.fr ; le site de la gendarmerie et
  emploi-collectivites.fr répondent 403. Le JORF n'a pas été lu.
trouve: >-
  762 tableaux de durées lus, de 336 textes, 14 345 lignes, du 12 septembre 1964 à 2025 :
  495 de l'État, 172 de la territoriale, 78 de l'hospitalière, 17 des militaires ; la
  durée unique dans 443, moyenne et minimale dans 209, maximale et minimale dans 72 ;
  certifiés. 1 655 tableaux ou articles non lus, chacun avec sa raison, dont 411 en
  phrases et 89 qui renvoient à un autre texte. Au Noyau RH, 62 tableaux de l'État se
  lient à un grade : 2 563 durées égales, 7 différentes, toutes des zéros du noyau. Les
  catégories B de la territoriale (n° 2010-329) et de l'hospitalière (n° 2011-661)
  écrivent les mêmes durées depuis le 1er septembre 2022.
reste: >-
  Rattacher les tableaux de durées et de reclassement aux grilles du dépôt. Relire les
  tableaux refusés, les fiches (« Durée moyenne : 2 ans ») et les tableaux dessinés en
  caractères d'abord. L'avancement accéléré et les réductions d'ancienneté, écrits en
  phrases. Une grille de la territoriale, de l'hospitalière ou des militaires publiée
  hors du LEGI, pour un recoupement tiers que la session n'a pas pu lire.
