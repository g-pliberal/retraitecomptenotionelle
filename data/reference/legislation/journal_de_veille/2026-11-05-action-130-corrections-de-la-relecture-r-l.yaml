date: "2026-11-05"
session: "action 130, file L-bis : les corrections de la relecture R-L (CARPV d'avant 2022, coefficient des biologistes)"
consulte: >-
  Les index LEGI (à jour au 2 novembre 2026) et JORF (au 3 novembre) du dépôt,
  récupérés. JORF : les arrêtés qui modifient les statuts de la CARPV, du
  11 janvier 2011 (JORFARTI000023448554), du 16 avril 2014
  (JORFARTI000028939421), du 18 février 2015 (JORFARTI000030285511) et du
  2 novembre 2015 (JORFARTI000031549970), lus en entier ou à leurs mots
  « base », « liquid », « soixant », « 60 ans », « retraite », « article 13 » ;
  les avis des arrêtés du 5 juillet 1999 (JORFARTI000001562289,
  JORFARTI000001368893) et du 28 août 2006 (JORFARTI000001494755), qui renvoient
  au Bulletin officiel ; la liste des textes de l'index sur les statuts des
  vétérinaires ; l'article 34 des statuts de 2021 (JORFARTI000044220745) et
  l'article 2 du règlement de 2026 (JORFARTI000054436031) ; les statuts de la
  CAVP de 2011, articles 12 et 14 des prestations des biologistes
  (JORFARTI000024270214) ; le règlement de 2026, III, article 1er
  (JORFARTI000054436087). LEGI : L. 351-8 (ses six rédactions, et le 1° en
  2011, 2014, 2023 et 2025), L. 161-17-2 au 1er mars 2012, D. 161-2-1-9 au
  1er mars 2015. Le web : une recherche des statuts de la CARPV de 2006, sans
  résultat ; le site de la CARPV, qui n'en sert pas d'avant 2022.
trouve: >-
  La CARPV d'avant 2022 : aucun texte lu ne dit si la complémentaire se
  liquide sans la base ; les statuts d'alors ne sont publiés en entier qu'au
  Bulletin officiel (n° 99/33 pour 1999 ; 2006). La présomption est déclarée
  (fiches liquidation_regime_par_regime et carpv_minoration_age_seul, limite
  des écarts au droit positif). Le coefficient des biologistes court jusqu'à
  l'âge de L. 351-8, 1°, à la génération — 65 ans avant juillet 1951 à 67 ans
  depuis 1955 — : corrigé dans les deux moteurs, aux périodes de 2009 et
  d'après. En passant : le modèle efface la minoration des biologistes par la
  durée d'assurance, que les textes ne prévoient pas.
reste: >-
  Les statuts de la CARPV de 1999 à 2021, au Bulletin officiel ou auprès de la
  caisse ; ceux de la CAVP d'avant 2011 (âges des biologistes d'avant
  2009) ; la minoration des biologistes effacée par la durée, à une file du
  modèle ; les 65 ans du parent de trois enfants (loi n° 2010-1330, article 20,
  IV) aux biologistes, que le texte ne tranche pas ; la CRPNPAC, à la file E.
