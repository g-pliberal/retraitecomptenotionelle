date: "2026-10-13"
session: "action 119 : les huit taux spécifiques de l'Arrco des cultes"
consulte: >-
  Les circulaires de cotisations de la CAVIMAC, toutes celles que sa page des
  publications sert : les n° 2020/01 et 2021/01, deux images, lues page à page, et
  les onze lisibles, de la n° 2021/04 à la n° 2026/03 ; ses rapports d'activité de
  2016 à 2025, son triptyque retraite de 2024, les pages de l'espace partenaires, de
  la retraite complémentaire et de la déclaration sociale nominative. L'accord
  Agirc-Arrco du 17 novembre 2017 (article 35, annexe B), les circulaires
  Agirc-Arrco 2019-1-DRJ (fiches 3 et 4) et 2025-2-DRJ, qui porte l'avenant n° 25 ;
  dans l'index JORF, l'avis d'extension de cet avenant (JORFARTI000051439935) et
  tout texte qui nomme ensemble la CAVIMAC et l'Arrco. Un guide pour les
  associations cultuelles de juin 2008 (Actes 6). Les index LEGI et JORF mis à
  jour des incréments du 12 et du 13 octobre : L. 921-1 n'a pas de rédaction
  postérieure à celle du 1er septembre 2023, et aucune rédaction nouvelle n'entre
  à la liste des textes. Légifrance, pour l'avenant dans KALI, et l'archive du
  web refusés au réseau de la session.
trouve: >-
  Les huit taux spécifiques, de 11,13 à 21,31 %, sont les mêmes de la circulaire
  d'octobre 2021, la première qui les énumère en disant les taux « inchangés », à
  celle de mai 2026. Aucune ne dit quelles collectivités les appliquent ni quelle
  part de chacun ouvre des points, et aucun texte publié ne les définit : l'accord
  Agirc-Arrco ne garde de taux supérieurs qu'aux obligations nées avant 1993, et
  ne nomme pas les cultes. Celles de 2020 et de janvier 2021 n'ont qu'un « taux
  contractuel de référence », 10,02 %, partagé à 60 et 40 %. L'avenant n° 25 confie
  les cultes à Malakoff Humanis Agirc-Arrco depuis 2025, sans toucher au taux. Le
  guide de 2008 confirme le taux du modèle, 7,50 % du forfait, et y ajoute l'AGFF,
  2,00 %, que le dépôt ne fait pas verser aux cultes. Rien n'est modélisé : fiche
  `cultes_retraite_complementaire_taux_specifiques`, à vérifier.
reste: >-
  Ce que chaque taux spécifique achète, et à quelles collectivités il s'applique :
  à demander à la CAVIMAC ou à Malakoff Humanis Agirc-Arrco. Les taux de 2006 à
  2019 dans une source de la caisse ; l'AGFF des cultes, à l'action 138. À
  l'action 119 : les cotisations forfaitaires de la CAVIMAC de 1979 à 1997.
