date: "2026-11-06"
session: "action 130, file R-E7 : relecture de E6 (la CARMF lue au droit, c19d9ca)"
consulte: >-
  Les index JORF (au 6 novembre 2026) et LEGI (au 5 novembre) récupérés et mis à jour. Au JORF,
  sans borne : les 213 titres qui nomment les médecins avec leurs statuts, règlement, retraite,
  vieillesse ou prestations, ceux qui nomment la CARMF ou une section professionnelle, et la
  section professionnelle des médecins au corps ; les arrêtés du 9 août 2010, du 28 septembre
  2011, du 7 octobre 2014, des 30 novembre, 1er et 21 décembre 2016, du 22 mars 2017, des 18
  septembre et 20 novembre 2017, des 20 août et 20 décembre 2018, du 5 octobre 2020, du 5 mars
  2021, des 6 et 21 février 2024, du 7 janvier 2025, du 10 juillet 2026 (annexes I et III), son
  rectificatif du 8 août 2026 (JORFARTI000054642802) et l'arrêté du 21 septembre 2026 ; les
  décrets n° 2026-239 et 2026-418 (articles 16 et 30). Dans LEGI : L. 161-17-2 et D.
  161-2-1-9 aux dates des cas ; les versions des articles des décrets n° 72-968 et 2011-1644.
trouve: >-
  E6 conforme pour l'essentiel : citations, dates, versions et montants exacts dans les deux
  moteurs ; aucun arrêté manqué ; l'erreur de 2026 prouvée (article 24 au titre V, commun au
  médecin et au conjoint ; ses deux branches au trimestre civil). Le rectificatif du 8 août
  2026 est dans l'index et ne déplace qu'un intitulé de chapitre. Pour les pensions depuis le
  1er septembre 2026, l'âge légal des nés de 1963 à mars 1965 est de 62 ans et 9 mois (L.
  161-17-2, 3°), non 63 ans (D. 161-2-1-9, 10°) : sans effet sur les montants. L'arrêté du
  1er décembre 2016 abroge l'article 12 ter des statuts de l'ASV, que sa réversion citait :
  une liquidation par anticipation avant 2017, vraisemblablement. 0,2482 point mêle assiette
  et arrondi (l'assiette seule : 0,2504 point, 2,96 €). L'arrêté du 7 janvier 2025 (IV, 3°)
  récrit l'article 8 des statuts de l'ASV (« l'avant dernière année »).
reste: >-
  À la file E : le rectificatif en texte sans effet, la référence de l'âge légal de 1964,
  l'article 12 ter et l'article 41 cités, l'ajustement précisé, l'arrêté de 2025 cité (note
  `130/2026-11-06-relecture-r-e7.md`). Au propriétaire : l'article 12 ter des statuts de l'ASV,
  avec les statuts d'avant 2017, au seul Bulletin officiel.
