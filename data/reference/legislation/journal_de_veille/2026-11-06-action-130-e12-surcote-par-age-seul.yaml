date: "2026-11-06"
session: "action 130, file E12 : les écarts de R-E12 repris, et la Cipav de surcote_par_age_seul écrite en versions"
consulte: >-
  Les index de la DILA récupérés et mis à jour : JORF au 6 novembre 2026, LEGI au
  5 novembre. Au JORF : l'arrêté du 3 octobre 2006 (JORFARTI000002050100), lu en entier ;
  « 21 mars 1979 » (106 documents, aucun arrêté de statuts de la Cipav) ; « transitoires »
  avec « architectes » ou « cipav », de 2006 à 2009 ; l'arrêté du 16 décembre 2021
  (JORFARTI000044554134, 19° ; article 2, JORFARTI000044554130) et celui du 20 mars 2023
  (JORFARTI000047334800, 17° ; article 2, JORFARTI000047334796), et leurs dates de
  publication ; les 32 documents d'articles du décret n° 2026-418 (JORFTEXT000054153355).
  Dans LEGI : décret n° 79-262, article 5 (LEGIARTI000006767479, LEGIARTI000006767480,
  LEGIARTI000054168541), articles 5-1 (LEGIARTI000054168518) et 5-2, II
  (LEGIARTI000054168515).
trouve: >-
  L'arrêté du 3 octobre 2006 approuve aussi des « dispositions transitoires » et laisse en
  vigueur jusqu'au 1er janvier 2008 les articles 16 et 17, alinéa 2, des statuts de 1979,
  tous au seul Bulletin officiel : la majoration de la Cipav pour report est sûre depuis
  2008, non tranchée en 2007 (pension au 1er janvier 2007, un an de report : 0 € si les
  textes de 1979 ne majorent rien, de 136,19 à 347,40 € par an servis en moins sinon).
  De 2008 à 2012, l'erreur tient sous la réserve des dispositions transitoires : au moins
  215,43 € par an au cas de 2012 si les trente années se comptent depuis l'affiliation,
  419,43 € sous les trois décomptes de la première année. `surcote_par_age_seul` reçoit
  les six versions de la Cipav, de 1979 au 1er juillet 2026.
reste: >-
  Les six autres régimes de `surcote_par_age_seul` en versions (CARMF, ASV, CARPIMKO,
  CAVEC, CAVP, CPRN), chaque rédaction lue à la source ; trois pistes de coupure à
  vérifier (CARPIMKO en 2015, CAVP en 2011, CARMF et ASV au premier trimestre 2017). Au
  seul Bulletin officiel : les statuts de la Cipav de 1979 et de 2006, leurs dispositions
  transitoires, l'article 3.6 d'avant 2023 (question 22).
