date: "2026-09-27"
session: >-
  l'action 131, les corrections que ses fiches gardaient « après la phase
  8 », faites à la demande du propriétaire
consulte: >-
  L'index LEGI : l'article 72-1 du décret n° 45-0179
  (LEGIARTI000006760613) et l'article 59-1 du décret n° 50-1225
  (LEGIARTI000006774035), l'article 10 de la loi n° 71-1132
  (LEGIARTI000006756029), l'article 70-6 du décret n° 45-0179, R. 351-7
  dans ses rédactions de 1985 et de 2004, l'article 55-6 du décret
  n° 50-1225, R. 173-3-2 dans sa rédaction du 1er août 2026 ; l'index
  JORF : l'annexe de l'arrêté du 21 novembre 2013 (RAAP, RACL, RACD), le
  décret n° 72-78, dont il ne porte que le titre ; la base de législation
  de la Cnav : les circulaires n° 2/72 et n° 22/83.
trouve: >-
  Les paliers de 128, 136 et 144 trimestres de 1972 à 1974 sont écrits
  dans l'article 72-1 du décret de 1945 et, mot pour mot, dans l'article
  59-1 du décret agricole, que l'index portait sans que la fiche le sache ;
  la loi n° 71-1132 « est applicable aux pensions des travailleurs
  salariés agricoles ». La circulaire n° 22/83 chiffre la garantie du taux
  acquis au 31 mars 1983 sur trois cas, et la durée « corrigée » de 2,5 %
  par trimestre après 65 ans, que le moteur ne porte pas : la règle vit
  dans l'article 70-6, puis dans R. 351-7 de 1985 à 2004, et s'étend aux
  autres régimes en 2004. L'annexe du RACL de 2013 porte ses colonnes
  1953 et 1954. R. 173-3-2 répartit les vingt-cinq années de la réforme
  agricole entre les périodes d'avant et d'après 2016.
reste: >-
  Ce que l'action 131 laisse, et que la feuille de route dit : les
  coupures au mois, la durée corrigée après 65 ans, l'allocation aux vieux
  travailleurs salariés et la réforme agricole de 2026, les grilles des
  classes libérales, la tranche C de l'Agirc. À lire : R. 351-7 depuis
  2011, et L. 351-6.
