date: "2026-09-22"
session: "action 89, lot des avocats : les barèmes annuels de la CNBF"
consulte: >-
  Les onze barèmes annuels de la CNBF, 2016 à 2026, dont celui de 2024
  retiré du site et retrouvé dans Internet Archive ; l'index des fiches
  pratiques.
trouve: >-
  Les taux de cotisation du complémentaire des avocats n'avaient jamais
  été transcrits : la fiche portait la grille de 2026 depuis 2019, alors
  que le taux de première tranche a doublé en dix ans. La pension de
  base de chaque année est publiée depuis 2016 ; la fiche la
  reconstituait par les prix depuis 2026, et sous-estimait de 6 % celle
  de 2016.
reste: >-
  Aucun barème d'avant 2016. Les fiches pratiques, les deux simulateurs
  de la caisse (cotisations, prélèvements sociaux) restent à dépouiller.
  Rien de la réglementation d'âge ou de décote n'a changé.
