date: "2026-10-07"
session: "action 138, étape 6 : l'AVTS, le trimestre d'avant 1972 et le minimum vieillesse d'avant 2007"
consulte: >-
  veille_droit.py (dernière veille consignée : 2026-10-07) ; les index LEGI et JORF,
  mis à jour des incréments jusqu'au 7 octobre 2026 (3 incréments LEGI, 218 documents
  gardés ; 5 incréments JORF, 157), puis textes.py --inscrire, qui n'apporte aucune
  rédaction nouvelle ; L. 161-17-2 et L. 161-17-3 n'ont aucune version postérieure au
  31 décembre 2025. Dans l'index LEGI : R. 351-9 (LEGIARTI000006749353, 028751530,
  053335598) ; le décret n° 45-0179, article 71 (LEGIARTI000006760608) ; repérés, et
  pas encore lus, les articles 1er des décrets n° 81-1166 à 85-784 fixant le montant de
  divers avantages de vieillesse, que l'index porte en texte. Dans l'index JORF : les décrets n° 90-265 et
  90-266 (JORFARTI000002138946, 001947321), les notices des décrets de 1962 à 1989 et
  des lois de 1941 à 1956 qui fixent l'allocation aux vieux travailleurs salariés.
  L'API de la législation de la Cnav : barèmes « Allocation aux vieux travailleurs
  salariés […] - Montant », « Allocation supplémentaire - Montant », « Allocation
  supplémentaire - Plafond de ressources », « Salaire validant un trimestre », « AVTS -
  Validation des années de salariat » et « Montant minimum de la retraite de
  réversion ».
trouve: >-
  R. 351-9 valide de 1949 à 1971 autant de trimestres que le salaire annuel représente
  de fois l'AVTS trimestrielle au 1er janvier, celle des villes de plus de 5 000
  habitants jusqu'en 1962 ; de 1946 à 1948, autant de fois 18 F (rédactions de 1985 à
  2025 ; celle de 2026 commence en 1949). Le barème des seuils de la Cnav redonne ce
  quart au centime de 1949 à 1971, et les 200 puis 150 SMIC horaires du dépôt de 1972 à
  2026 ; il porte 216 anciens francs pour 1946, où le texte en écrit 1 800 : le texte
  est retenu. Le scénario 1 valide désormais les trimestres de 1946 à 1971 à ce seuil,
  dans les deux moteurs ; aucun témoin ne bouge. Le minimum vieillesse d'avant 2007
  tenait en deux étages, l'AVTS (14 800 F au 1er janvier 1990, décret n° 90-265) et
  l'allocation supplémentaire (19 920 F, décret n° 90-266), celle-ci réduite au-delà
  d'un plafond de ressources qui dépassait de loin leur somme dans les années 1960 et
  1970 ; la somme des deux au 1er janvier 2006 redonne au centime l'ancre de D. 815-1
  (7 323,48 €). Des notices du JORF se trompent (n° 82-1142 : 10 300 F au lieu de
  11 300 F ; n° 74-1126, 79-567 : des dates fausses) ; les deux barèmes de la Cnav qui
  portent le seuil de l'outre-mer intervertissent les Antilles et La Réunion de 1975 à
  1991.
reste: >-
  Le minimum vieillesse de 1956 à 2006 à deux étages, dans les deux moteurs, au lieu du
  montant de 2006 ramené sur les prix ; la certification des montants au Journal
  officiel, décret par décret ; la pension minimum d'avant le 1er avril 1983 ; l'AVTS
  dans R. 732-70 ; le seuil de l'outre-mer, avec un champ de saisie ; avant 1946, la
  règle de la retenue.
