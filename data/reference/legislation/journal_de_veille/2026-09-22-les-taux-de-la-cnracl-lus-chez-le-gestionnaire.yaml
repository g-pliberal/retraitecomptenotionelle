date: "2026-09-22"
session: "le plafond qui ne mord pas, et le médecin libéral du COR"
consulte: >-
  Index LEGI du dépôt : R. 643-7 CSS, R. 723-38 CSS, le I de L. 14 du code
  des pensions, R. 351-27 2° dans sa version du 1er août 2026 et
  R. 351-27-1, R. 732-61 du code rural. Hors LEGI, le rapport annuel du COR
  de juin 2026 (`RA_2026_def_0.pdf`, 8 650 lignes), lu par
  `lecture_pdf.py` : ses notes de bas de page 156 et 157 décrivent les âges
  de chacun de ses treize cas types.
trouve: >-
  LE PLAFOND DE VINGT TRIMESTRES N'EST PAS UNE RÈGLE DE PLUS. Il est écrit
  chez les libéraux, les avocats et la fonction publique, absent de
  R. 351-27 2° et de R. 732-61 — et il ne mord sur aucune des 2 483
  liquidations ouvertes d'un balayage complet de la grille, parce que
  l'écart entre l'âge d'ouverture et l'âge d'annulation vaut au plus vingt
  trimestres : exactement vingt de 1930 à 1961, douze après 1968. Rien à
  changer dans le calcul ; la docstring, qui en faisait une règle de « tous
  les régimes », est réécrite, et deux tests tiennent l'identité.
  LE COR PUBLIE UN CAS TYPE DE LIBÉRAL, et le dépôt le retrouve. Son cas
  type n° 13, un médecin généraliste de secteur 1 né en 1960, « peut
  prétendre à un départ à 62 ans » et « atteint le taux plein à 66 ans et
  9 mois » ; la fiche du dépôt donne 62,00 et 67,00 pour la même
  génération. La règle d'exception que cette fiche portait — « ouverture
  plus deux ans » — n'était qu'un contournement du défaut corrigé la
  veille, et sa constante ne s'appuyait sur aucune source : elle est rendue
  à la règle ordinaire. `ecart_liquidation` n'a plus qu'un usager, le
  militaire.
reste: >-
  Le cas type libéral n'a toujours aucune carrière antérieure, quand la
  CNAVPL immatricule ses affiliés à 32,58 ans en moyenne. Contre l'âge
  observé de sa caisse, la fiche passe de 1,24 an trop tôt à 1,42 an trop
  tard : les deux conventions manquent la moyenne réelle d'à peu près
  autant, en sens contraire, et seule une carrière en deux temps les
  départagerait — ce que `CasType`, qui ne porte qu'une affiliation, ne
  sait pas exprimer.
session: les taux de la CNRACL, lus chez le gestionnaire du régime
consulte: >-
  Documentation juridique de la CNRACL (`juris-cnracl.retraites.fr`),
  page « Cotisations — historique des taux applicables » : quarante-neuf
  périodes, du 19 septembre 1947 à 2026, retenue de l'agent et contribution
  de l'employeur. Page mère « Taux de cotisations ». Relancés, pour
  recouper : `dila_index.py legi` et `jorf --recuperer`,
  `dila_legi_cnracl.py`, `contribution_employeur_public.py`,
  `sncf_contribution_employeur.py`.
trouve: >-
  AUCUN ÉCART, ET C'EST LE RÉSULTAT. Les soixante-dix-neuf années de
  contribution employeur et toute la série de retenue du dépôt s'accordent
  avec le tableau du gestionnaire, au centième de point près, y compris la
  convention de date — le taux en vigueur au 1er janvier vaut pour l'année.
  Ce qui change n'est donc pas un chiffre mais son RANG : la Caisse des
  dépôts gère la CNRACL, c'est le producteur, et les quarante années que le
  dépôt tenait d'OpenFisca au niveau `haute` passent à `certifiee`. La
  série employeur de la CNRACL n'a plus une seule année de second rang.
  La page mère signale par ailleurs deux cotisations SUPPLÉMENTAIRES que
  le dépôt ne porte pas — sapeurs-pompiers professionnels (indemnité de
  feu) et aides-soignants (prime spéciale de sujétion) — et rappelle que
  la NBI est cotisée au taux du traitement depuis 2012.
reste: >-
  Dix années ont vu leur taux changer en cours de route, et la convention
  annuelle du dépôt ne peut pas les rendre : la plus lourde est 1980, où la
  contribution tombe de 18 % à 6 % au 1er juillet — l'employeur a versé
  cette année-là la moitié de ce que le dépôt lui compte.
  `tests/test_juris_cnracl_taux.py` les nomme toutes les dix et vérifie
  qu'il n'y en a pas d'autres. Et un piège de manipulation, rencontré en
  chemin : `verifier_donnees.py --appliquer` lancé avec un `data/brut/`
  incomplet REDESCEND les lignes dont la meilleure source est absente —
  cinq années de la SNCF sont ainsi passées de `certifiee` à `haute` avant
  d'être rendues à leur rang. Lancer les récupérateurs avant d'appliquer.
