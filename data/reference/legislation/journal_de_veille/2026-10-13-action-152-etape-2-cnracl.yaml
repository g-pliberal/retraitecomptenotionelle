date: "2026-10-13"
session: "action 152, étape 2 : le cas type de la CNRACL lu contre le jaune budgétaire"
consulte: >-
  Aucune source de droit nouvelle : la session ne touche aucune règle du scénario 1. Le
  rapport sur les pensions de retraite de la fonction publique annexé au PLF 2026 (le
  jaune budgétaire, sre_jaune_pensions), lu dans le PDF que sert le miroir de
  l'Assemblée nationale, d'empreinte conforme au manifeste : tableaux B-1, B-2, B-3 bis
  et B-5 (départs de 2024), B-14 (indices de liquidation de 2010 à 2024), 102 (âges de
  départ de 2004 à 2024), A-1, A-4, A-6 et A-8 (pensions en paiement).
trouve: >-
  Aucun texte de droit. La pension du cas type de la CNRACL est celle du jaune : 1 446 €
  en moyenne aux retraités de 2020, pesés comme la page les pèse, pour 1 372 €
  accessoires compris. Il y tient par deux erreurs qui se compensent : un traitement de
  fin de carrière à 0,87 salaire moyen, quand l'indice de liquidation en vaut 0,75 de
  2010 à 2024, et un départ à l'âge d'ouverture avec une décote, jusqu'à 25 %, quand
  les actifs partent d'un à quatre ans plus tard, et 8,3 % d'entre eux avec une décote.
  Le propriétaire garde le cas type.
reste: >-
  À l'action 152 : les exploitants agricoles, les professions libérales et les civils
  de l'État, un groupe par session. À part : la dispersion des carrières statutaires
  dans la population, dont les déciles des pensions de la CNRACL (tableau A-8) et sa
  part au minimum garanti (tableau A-6) donnent la preuve.
