date: "2026-10-24"
session: "action 138, étape 12 : la classe du cumul — l'Ircantec, la RCO agricole, les sections libérales — et le versement forfaitaire de la base des indépendants"
consulte: >-
  python scripts/veille_droit.py (trois fiches à relire, aucune de ce sujet). L'index
  LEGI du dépôt, mis à jour au 23 octobre 2026 (huit incréments), et la liste des textes
  (vingt rédactions nouvelles, du décret n° 2003-1277, inscrites « à examiner ») :
  L. 634-2 dans ses rédactions de 1985 à 2023 ; D. 634-9 (1990-2020) et son abrogation
  par le décret n° 2020-621 ; le décret n° 73-937, article 8 ; D. 634-11-5 (2004, 2010,
  2015) ; L. 643-6 (2008) ; D. 643-10 (2011, 2015) ; D. 643-10-2 (2011, 2015, 2017) ;
  l'arrêté du 30 décembre 1970, article 14, dans ses six rédactions, et article 25 ;
  L. 161-22 (2017, 2027) ; D. 732-157 du code rural (2005, 2011, 2014, 2026), le décret
  n° 2003-146, article 7, le décret n° 2003-1277, article 8. L'index JORF, à jour au 18
  octobre 2026 : la notice du décret n° 73-937 ; les arrêtés approuvant les statuts et
  règlements des sections — CARCDSF (2007, 2010, 2011, 2026), CAVAMAC (2011, 2026), CARMF
  (2011, 2016, 2026), CARPV (2011, 2021), CAVOM (2020, 2026), CPRN (2017, 2026), CAVEC
  (2008), CAVP, CARPIMKO et CIPAV (2009 à 2026), relevés par l'agent éclaireur et relus
  aux fenêtres citées. La page « Le dispositif du cumul emploi-retraite » de l'Ircantec et
  la page « Continuer à travailler » de la CARMF ; le guide du cumul de la CARMF n'a pas
  été lu.
trouve: >-
  Le versement forfaitaire unique de L. 351-9 vaut pour les artisans et les commerçants
  depuis le code de 1985 (L. 634-2, « L. 351-7 à L. 351-10 »), la pension des périodes
  d'après 1972 et l'avantage de celles d'avant totalisés pour le seuil (D. 634-9, de 1990
  à 2020) : porté dans les deux moteurs, la commerçante d'une année en 1980, partie en
  2010, reçoit 2 070,00 € en une fois au lieu de 138,00 € par an. L'Ircantec suit L.
  161-22 pour l'activité qui y cotise depuis 2004 (article 14), sans son troisième alinéa,
  la réduction, depuis le 19 décembre 2020 — « l'Ircantec continue de vous verser la
  totalité » ; la RCO agricole suit L. 732-39 et L. 732-40 (D. 732-157) ; les sections
  libérales ont chacune leur règle : la CARCDSF (dès la reprise en 2007, « pour la même
  durée » que la base depuis 2011), la CAVAMAC (« pour la même durée », puis comme la base
  en 2026), la CARMF (« à concurrence du montant du dépassement », avec ses autres
  pensions), la CARPV (le dépassement, de 2011 à 2021), la CAVOM (ce que la base n'absorbe
  pas, puis le dépassement entier en 2026), la CPRN (« incompatible avec l'exercice de la
  profession de notaire libéral ») ; L. 161-22, III, A, de 2027 vise toute pension « de base
  ou complémentaire ». Porté dans les deux moteurs, aucun témoin d'avant ne bouge. En
  chemin : D. 634-11-5 et D. 643-10-2 ne suspendent la base des non-salariés que « pour un
  nombre de mois égal au rapport entre le montant du dépassement constaté et le montant
  mensuel net de la pension », quand le modèle la suspend chaque mois ; la durée requise
  d'une carrière seulement libérale vaut zéro dans le modèle.
reste: >-
  La base des non-salariés, suspendue le nombre de mois que le dépassement épuise, et la
  durée requise des carrières libérales ; les statuts des sections que l'index ne garde
  pas (CARPIMKO, CAVEC après 2012, CAVP, CIPAV), la date d'effet des règlements du 10
  juillet 2026, la répartition de la suspension conjointe de la CARMF ; une instruction
  de l'Ircantec de 2004 à 2020 ; L. 732-39 et L. 732-40 pour la base de l'exploitant ; le
  décret n° 73-937 au Journal officiel en images, pour les artisans d'avant 1985 ; le
  décret d'imputation de la réduction de 2027 ; aux pages, la phrase de la complémentaire
  du notaire libéral, non due.
