date: "2026-11-07"
session: "action 186, chantier 6, étape 1 : les complémentaires projetées caisse par caisse"
consulte: >-
  Aucune règle du scénario 1 n'est touchée. L'index LEGI de la DILA (à jour au
  2 novembre 2026) pour l'article L. 723-3 du code de la sécurité sociale
  (les droits de plaidoirie, affectés au régime de base de la CNBF), dont la
  dernière version indexée court jusqu'au 14 juin 2018. Le classeur des
  compléments du rapport du COR de juin 2024 (projections détaillées par
  régime) ; le rapport annuel du COR de juin 2026, tableau 2.3, p. 100, et
  § 3.4 ; la fiche CNBF du COR de juin 2024 ; le Chiffr'Agirc-Arrco 2026,
  p. 24, 32 et 46 ; le communiqué de l'Agirc-Arrco du 31 mars 2026.
trouve: >-
  Rien qui touche les fiches. Les droits de plaidoirie financent la base de la
  CNBF, non sa complémentaire : la projection les laisse à la base. Le tableau
  2.3 du COR est à la p. 100 de son rapport, et porte les réserves de la CNBF
  complémentaire (2,2 Md€) et de la CRPNPAC (5,1 Md€), que la note d'étude
  n'avait pas. Le détail est dans la note
  docs/feuille_de_route/186/2026-11-07-complementaires-au-modele.md.
reste: >-
  La version de L. 723-3 en vigueur depuis le 14 juin 2018, que l'index
  thématique ne porte pas ; aucun produit publié de la CEG et de la CET, qui
  sont calculés sur les assiettes et les taux.
