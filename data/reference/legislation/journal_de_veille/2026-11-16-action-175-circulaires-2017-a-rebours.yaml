date: "2026-11-16"
session: "action 175, étape 6 : lecture à rebours des circulaires sans thème, l'année 2017"
consulte: >-
  Les 30 références sans thème et à lire de 2017 dont le titre commence par
  « Circulaire », « Lettre », « Instruction », « Note d'information » ou « Diffusion
  d'instructions », dont 19 fiches de la circulaire carrière n° 2017/1, relues par l'API
  de la base le 16 novembre 2026 (/reference/referencesByFileLeafRef/), toutes servies
  en PDF et lues en entier au site (/Pdf/) par la session, la lettre ministérielle du
  28 septembre 2017, un scan, par sa reconnaissance de caractères ; chaque citation
  retrouvée mot pour mot. Pour les confronter : les fiches surcote_regime_general,
  retraite_progressive, retraite_anticipee_handicap, chomage_non_indemnise,
  carriere_longue_reputes_cotises_autres, rachats_et_versements ; la série
  legislation/revalorisation_pensions.csv ; les limites docs/limites/3-systeme-actuel.md.
  Ni Légifrance, ni le Journal officiel, ni l'index de la DILA.
trouve: >-
  Le registre range les 30 (26 limite, 4 hors_modele, les circulaires de taux de
  change), sans raison neuve. Conforme : la revalorisation de 1,008 au 1er octobre 2017.
  Aucun écart neuf : la non-acquisition de droits, l'accord avec le Brésil, la retraite
  progressive de plusieurs employeurs, le barème de la surcote de 2007, la commission
  de validation des périodes de handicap, les rachats et la majoration du compte
  professionnel de prévention sont portés par les fiches ou déclarés dans les limites.
  Note docs/feuille_de_route/175/2026-11-16-etape-6-circulaires-2017-a-rebours.md.
reste: >-
  La lecture à rebours continue en 2016 (15 circulaires), puis 2015 et 2014, jusqu'à
  rejoindre la lecture chronologique.
