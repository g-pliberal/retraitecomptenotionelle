date: "2026-10-02"
session: >-
  les sources des cinq questions que la garantie minimale de points laissait
  ouvertes, à la demande du propriétaire : « Regarde ces points et trouve des sources
  pour les résoudre » (action 139, troisième suite)
consulte: >-
  Le site de l'Agirc-Arrco, par sa médiathèque : les circulaires de l'Agirc de 2003 à
  2008 (2003-3-DT, 2003-9-DRE, 2004-1-DT, 2004-7-DRE, 2005-2-DT, 2005-9-DRE,
  2006-2-DRE, 2007-1-DT, 2008-4-DT), les circulaires Agirc-Arrco 2017-07-DT et
  2017-12-DRJ, la compilation des accords nationaux de 1993 à 2015 (accords du 9 février
  1994, du 25 avril 1996, du 13 novembre 2003 et du 13 mars 2013), la convention du 14
  mars 1947 à jour de 2018 et le cahier DSN de juillet 2016 ; les lettres circulaires de
  l'UCANSS de 2001 à 2012 ; Gallica, par sa recherche plein texte : G. Briens (1990), L.
  Marrache-Jupin (1989), G. Huteau et É. Le Bont (1994) ; le barème IPP de la garantie
  dans OpenFisca-France (forfait, mensualité, partage, salaire charnière) ; l'index
  JORF du dépôt (arrêtés du 2 novembre 1992, avis du 20 juillet 1991 absent) et les
  incréments LEGI et JORF jusqu'au 2 octobre 2026 : L. 161-17-2 et L. 161-17-3 sans
  version postérieure au 31 décembre 2025, rien de paru sur la garantie ni sur l'Agirc.
trouve: >-
  La garantie donnait « un nombre de points proportionnel au taux de cotisations de
  l'entreprise sur tranche B », 72 points à 8 %, 108 à 12 %, 144 à 16 % (Briens, lisant
  l'accord du 8 décembre 1988), sur un plancher d'assiette de 1 290 F par mois en 1989 ;
  l'accord de 1996 la ramène à « 120 points pour un taux de cotisation de 16 % ». Le
  modèle, qui prête à l'entreprise le taux minimal, en sert désormais la part : 72
  points de 1989 à 1993. Les forfaits étaient fixés avant le salaire de référence — en
  décembre pour 2004 et 2005, « sur la base du salaire de référence de l'exercice »
  pour les points — et, en 1989 et 1990, régularisés sur le définitif ; ceux de 1991 à
  1995 sont 144 fois un salaire de référence prévu. Les deux circulaires de 2017 et
  celles de l'Agirc de 2003 à 2008 confirment les forfaits du barème IPP au centime de
  la mensualité.
reste: >-
  Le texte même de l'accord du 8 décembre 1988 et de son avenant du 13 juin 1991 ; les
  circulaires de l'Agirc de 1989 à 2002, que la fédération ne publie pas ; un texte de
  l'Agirc qui fonde le prorata du temps partiel.
