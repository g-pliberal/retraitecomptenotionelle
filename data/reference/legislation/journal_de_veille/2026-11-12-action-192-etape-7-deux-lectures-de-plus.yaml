date: "2026-11-12"
session: "action 192, étape 7, deux lectures de plus à la demande de la session d'orchestration : D. 732-76 du code rural et L. 382-25 du code de la sécurité sociale"
consulte: >-
  L'index LEGI du dépôt, à jour au 11 novembre 2026. Code rural et de la pêche
  maritime, D. 732-76, ses trois rédactions (jusqu'au 1er janvier 2026, du
  1er janvier au 9 mai 2026, depuis le 9 mai 2026), lues mot à mot l'une
  contre l'autre. Code de la sécurité sociale, L. 382-25, rédaction du
  1er janvier 2026, lue en entier contre ce que la fiche
  taux_plein_a_soixante_cinq_ans en transcrit.
trouve: >-
  Rien ne change un calcul. D. 732-76 : la rédaction du 1er janvier au 9 mai
  2026 porte le même article que la suivante, le versement pour la retraite,
  que le modèle ne connaît pas ; seules changent la note d'application et une
  date écrite deux fois : « sans effet » tient pour
  retraite_proportionnelle_msa, dont l'entrée reste. L. 382-25 : le I, 1° et
  2°, et le II sont inchangés, seul le 4°, la contribution qui finance le
  régime des cultes, change ; la rédaction est déclarée sans effet sur
  taux_plein_a_soixante_cinq_ans, qui n'a plus de rédaction en vigueur non
  lue. Le cliquet des textes reste à 9 234.
reste: >-
  Rien de ces deux lectures. La majoration de 17 % des points agricoles de
  1952 à 1972, que D. 732-76 portait jusqu'au 1er janvier 2026, reste la
  question que la fiche retraite_proportionnelle_msa pose au propriétaire.
