date: "2026-11-06"
session: "action 158, vague 11, R-B6 : relecture indépendante de B5-bis (396d8b9 : les dates d'effet qu'un autre article du décret donne, « A la même date »)"
consulte: >-
  L'index LEGI du dépôt (incrément 20261102-213929) et l'index JORF (incrément 20261103-002311) :
  les articles des tableaux et leurs articles d'effet, toutes versions (n° 98-268 art. 17, 18,
  19, 20 et 28 ; 2001-325 art. 14 et 17 ; 2017-1367 art. 23 et 28 ; 2017-1494 art. 13 et 15 ;
  2017-903 art. 12 ; 98-896 art. 8 et 10 ; 2002-378 art. 1er et 2 ; 2003-527 art. 1 à 5 ; 2006-1122
  art. 1 à 11), et, par titre, les textes qui modifient les n° 98-268, 98-896, 2001-325,
  2017-1367, 2017-1494 et 2017-903. Aucun fac-similé n'est ouvert.
trouve: >-
  Les quatre dates de B5-bis sont exactes, citation mot pour mot au LEGI et au JORF : n° 98-268
  art. 17 (art. 28, 1995-08-01), n° 2001-325 art. 14 (art. 17, 1997-01-01), n° 2017-1367 art. 23
  (art. 28, 2017-01-01), n° 2017-1494 art. 13, I (art. 15, 2017-01-01). « A la même date » (n°
  2017-903 art. 12) reprend la bonne date. Le n° 98-268 art. 20 donne bien plusieurs dates (1994-08-01,
  1995-08-01, 1996-08-01, 1997-01-01). Le n° 2002-378, art. 1er, ne fait que supprimer « en
  fonctions à la date du présent décret » à l'art. 8 du n° 98-896 : le tableau ne change pas, et
  l'art. 10 du n° 98-896 l'applique « à compter du 1er août 1996 ». La version 2018 de l'art. 12
  du n° 2017-903 est « jamais en vigueur ».
reste: >-
  Candidats : dater le n° 98-896 art. 8 du 1996-08-01 (si le propriétaire retient la lecture a) ;
  une garde qui confronte la citation de DATES_D_UN_AUTRE_ARTICLE au texte quand l'index est là ;
  ne pas lire comme un reclassement une version dont la fin précède le début ; le fac-similé du
  JO n° 234 du 9 octobre 1998 (pages 15305 à 15307, tableau de l'art. 8 du n° 98-896).
