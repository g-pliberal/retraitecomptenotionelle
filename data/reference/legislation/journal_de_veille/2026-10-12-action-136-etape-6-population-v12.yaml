date: "2026-10-12"
session: "action 136, étape 6 : les carrières des femmes selon leur génération, la douzième version de la population"
consulte: >-
  Aucune source de droit nouvelle : la session lit, sans les modifier, l'âge légal de
  chaque génération, la durée requise et les majorations de durée que la simulation
  applique. Les séries certifiées au dépôt — la durée d'assurance par génération que le
  COR publie de l'EIR, les quintiles de la pension en équivalent carrière complète de
  l'EIR 2020, sa distribution des pensions, la part du minimum contributif de l'EACR ;
  aucun téléchargement.
trouve: >-
  Aucun texte de droit. Calées génération par génération sur la durée de l'EIR, les
  carrières incomplètes des femmes perdent 2,3 années jusqu'à la génération 1940 et en
  gagnent 8,3 pour 1950, 15 à 17 pour 1955 à 1970 ; la population retrouve la durée de
  l'EIR de 1940 à 1950. Leur pension de 2020 s'éloigne de celle de l'EIR, 1 369 € en
  moyenne pour 1 177 : au deuxième quintile, l'EIR compte 60 % de femmes au minimum, la
  population 18 %.
reste: >-
  À l'étape 6 de l'action 136 : la pension par année validée des carrières presque
  entières du deuxième quintile ; le minimum selon la génération ; la bascule de la page,
  au propriétaire. Le passé refait recule, de 10,9 à 17,0 % d'écart au pire depuis 2000,
  sans que la mesure dise encore pourquoi.
