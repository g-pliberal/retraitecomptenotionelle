date: "2026-11-06"
session: "action 130, file E15 : les écarts de R-E15 repris, et cotisation_par_classes_liberales lue au droit"
consulte: >-
  Les index de la DILA récupérés : JORF au 3 novembre 2026, LEGI au 2 novembre. Au JORF,
  en SQL sur toute la table, sans borne de réponses, au titre et au texte de 1948 au 1er
  mars 2008 : les arrêtés qui modifient les statuts de la CAVEC (« expert » et
  « compta », « commissaires aux comptes ») ; les six de 1980 à 2003 qui touchent son
  complémentaire, chacun lu (17 juin 1980, 22 août 1986, 9 mars 1987, 23 juillet 1992,
  13 mai 1994, 27 février 2003) ; l'article 1er de l'arrêté du 22 février 2008. Dans
  LEGI, toutes les rédactions de l'article 2 des décrets n° 50-1318 (CARPV, onze), n°
  53-506 (CAVEC, six) et n° 79-262 (Cipav, six) ; les décrets annuels de 1998 et de 2010
  (la section de la Cipav) et de 2025 (la classe A de la CAVEC). Au JORF, les statuts
  cités, avec les articles qui les datent : CAVEC 2008, 2012 (deux), 2018 ; CARPV 2014,
  2015, 2021 ; Cipav 2015, 2021 ; le décret n° 2026-418, articles 2 (CPRN) et 4 (CAVP) ;
  l'arrêté du 11 mai 2009 (CAVP), article 2.
trouve: >-
  Avant 1979, dix autres arrêtés de la CAVEC, de 1961 à 1977, que l'index ne porte que
  par leur titre. Les trois régimes de la fiche sont écrits en quinze versions ; le
  modèle sert chaque règle que les textes lus écrivent, hors des options, des
  conventions et des approximations déclarées, sauf une : depuis le 1er janvier 2013, le décret n° 53-506 ne
  laisse pas cotiser le cumulant d'une activité libérale et salariée sous la classe C, et
  le modèle le range sur son seul revenu libéral ; les statuts de la CAVEC de 2018 ne
  font de la classe C qu'une option. Point non tranché, deux lectures : au cas posé,
  3 056,14 € par an servis en moins (311,26 € pour la seule année 2024), ou rien. La
  classe 3 d'office de la CAVP et la classe des notaires par âge et serment ne sont pas
  des régimes de la fiche : `decret_2026_418_liberaux` porte la première, aucune fiche de
  règle la seconde (la section B de la CPRN, non calculée).
reste: >-
  Au propriétaire : le point non tranché du cumul à la CAVEC, avec les erreurs déjà
  déclarées. Au fac-similé ou au seul Bulletin officiel : les statuts de la CAVEC
  d'avant 2008 et de la Cipav d'avant 2016, les décrets annuels de 1979 à 1983 et de
  1989, la valeur de l'acte médical vétérinaire de 1950 à 2015.
