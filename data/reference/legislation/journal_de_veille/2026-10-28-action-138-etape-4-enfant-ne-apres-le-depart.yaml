date: "2026-10-28"
session: >-
  action 138, étape 4, au site : la saisie reçoit l'enfant né après le départ, que la
  majoration pour enfant à charge de la réversion compte, et la carte de la réversion
  dit la majoration nulle à sa date d'effet et servie ensuite
consulte: >-
  Code civil, article 311, en vigueur depuis le 1er juillet 2006 : l'enfant présumé
  « conçu pendant la période qui s'étend du trois centième au cent quatre-vingtième
  jour, inclusivement, avant la date de la naissance ». L'index LEGI du dépôt ne garde
  que le champ social : lu dans le texte voté au Sénat en 1972 et dans sa traduction à
  jour. Pour le reste, R. 353-10, déjà lu le 24 octobre.
trouve: >-
  Aucune règle du scénario 1 ne change. La saisie borne désormais les naissances au
  décès déclaré, trois cents jours après lui au plus, au lieu du départ.
reste: >-
  Rien pour la veille. Au site, les autres points du bloc de l'étape ; au modèle, la
  réversion d'essai sans décès déclaré, qui suppose le décès avant l'enfant né après le
  départ (note `2026-10-28-etape-4-enfant-ne-apres-le-depart.md`).
