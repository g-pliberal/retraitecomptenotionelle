date: "2026-09-28"
session: >-
  l'action 130, la quatrième étape du domaine de la réversion : le bloc du
  formulaire et la page, puis la clôture du domaine
consulte: >-
  Aucune lecture nouvelle : l'étape présente ce que les fiches lues
  calculent, sous l'hypothèse de décès que le propriétaire a choisie.
trouve: >-
  Rien de paru.
reste: >-
  Ce que les fiches de la réversion déclarent à relire : l'accord
  Agirc-Arrco de 2017 sur Légifrance, la rédaction du 24 août 2005 de
  l'article 24 du décret n° 2004-858, les montants du minimum d'avant 2025.
