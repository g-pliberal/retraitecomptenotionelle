date: "2026-10-18"
session: "action 159 : L. 14, V, du code des pensions tranché, à la CNRACL et au service des retraites de l'État"
consulte: >-
  Dans l'index LEGI du dépôt, mis à jour au 17 octobre 2026 : les trois rédactions de
  L. 14 du code des pensions de 2023 (LEGIARTI000047452815, sans V ; LEGIARTI000048697778
  et LEGIARTI000048844775, avec lui), les deux de L. 351-1-2-1 CSS (LEGIARTI000047449229,
  LEGIARTI000051289776), L. 351-1-2 (LEGIARTI000025014540) et D. 351-2-1
  (LEGIARTI000047961314). Dans l'index JORF : la loi n° 2023-1250, article 92
  (JORFARTI000048668789), qui ajoute le V. La page « Calcul de la surcote » de
  juris-cnracl (publiée le 17 février 2025), et la page « La surcote » du service des
  retraites de l'État, section « La surcote spécifique famille ».
trouve: >-
  La CNRACL lit le V période par période : « La surcote de droit commun et la surcote au
  titre des enfants ne sont pas cumulables au titre d'une même période », et son exemple
  sert quatre trimestres d'enfants puis deux de droit commun en un seul coefficient,
  « (4 X 1.25%) + (2 X 1.25%) = 7.5 % » ; le service des retraites de l'État prend ces
  trimestres « en compte dans le calcul de la surcote ». Le moteur avait raison de les
  ajouter, tort de les composer : il appliquait la surcote parentale à la pension déjà
  surcotée, et, au régime général, relevée au minimum contributif, que D. 351-2-1 laisse
  hors de la surcote. Corrigé dans les deux moteurs ; deux témoins sur 883 baissent, de
  0,06 % à 0,47 %. L'exemple 2 de la CNRACL, né en 1969, entre aux exemples officiels et
  se rejoue ; ses exemples nés en 1964 et en 1966 datent d'avant la suspension de 2026.
  Le service des retraites de l'État réserve la surcote famille aux sédentaires dont
  l'âge d'ouverture atteint 63 ans, comme le moteur.
reste: >-
  La circulaire Cnav et un exemple du régime général. Le minimum garanti, que le moteur
  surcote de la parentale quand il efface la surcote de L. 14, III. La CNAVPL, dont
  l'étape qui complète compose encore les deux coefficients. Le trimestre d'enfant, que
  la CNRACL date et que le moteur ne date pas (fiche surcote_parentale).
