date: "2026-10-24"
session: "action 138, étape 3 : le taux effectif dans le modèle — les pensions brutes et nettes de la DREES certifiées, la dépense nette du bilan et du paquet"
consulte: >-
  Aucun texte de droit : le taux ne touche à aucune règle du scénario 1. Le
  tableau 2.1-a des « Effectifs de retraités, montants des pensions et âges de
  départ à la retraite » de la DREES (fin 2022), et la première partie de
  l'EACR diffusée le 26 mai 2026, relus sur le portail de la DREES, qui coupait
  ses connexions : le premier au septième essai, la seconde au douzième.
trouve: >-
  Le classeur relu redonne exactement les montants du témoin du 14 octobre,
  et le récupérateur, relancé sur les deux classeurs, le témoin à l'octet. Les
  soixante montants de 2008 à 2022 sont certifiés : le taux que les
  prélèvements sociaux prennent à la masse des pensions vaut 6,8 % en 2022, et
  la dépense nette du système actuel 12,70 % du PIB en 2022, pour 13,63 en
  brut.
reste: >-
  Rien au droit. À une session du site : la dépense nette à côté de la brute
  sur la page Coût, et la masse nette que la page dit « au plus » au taux
  plein. Les montants de 2023 et 2024, que la DREES publie hors du classeur.
