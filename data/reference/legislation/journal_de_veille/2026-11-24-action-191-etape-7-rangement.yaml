date: "2026-11-24"
session: "action 191, étape 7 de la note 0009 : le rangement des renvois sans effet, premier lot (régimes alignés sur le régime général)"
consulte: >-
  L'index LEGI et JORF du dépôt, à jour au 23 novembre 2026 : décret
  n° 2004-144, articles 1er (JORFARTI000002055398), 3 (JORFARTI000002055400)
  et 8 (JORFARTI000001474532) ; décret n° 2004-156, articles 1er à 5 ;
  D. 634-1, rédactions de 1993 et de 2004 (LEGIARTI000006737961,
  LEGIARTI000006737962) ; D. 634-5, rédaction de 1990 (LEGIARTI000006737998) ;
  décret n° 73-937, article 3, rédactions du 28 août 1993
  (LEGIARTI000006765817) et du 7 octobre 2012 (LEGIARTI000026474703), et
  décret n° 2012-1129, article 2 (JORFARTI000026460627) ;
  décrets n° 93-1022 (articles 8 et 9) et n° 93-1024 (article 8) ; R. 634-1,
  rédaction du 28 août 1993 (LEGIARTI000006751723) ; arrêté du 30 décembre
  1970, article 16, rédactions de 1978 et de 1983 (LEGIARTI000006381609,
  LEGIARTI000006381610), arrêtés du 27 janvier 1983 (JORFTEXT000000654120)
  et du 26 juillet 1983 (JORFTEXT000000837384) ; ordonnance n° 2005-1528,
  article 1er, et décret du 30 juin 2006 (JORFARTI000001473139) ; loi
  n° 78-4, article 4 (LEGIARTI000006756279), et décret n° 79-607, article 64 ;
  ordonnance n° 45-2454, article 63 ; décret n° 2008-639, articles 3 et 38.
trouve: >-
  Neuf renvois citent le texte qui les fait, au jour où leur ligne s'ouvre :
  la majoration de durée après soixante-cinq ans comptée dans tous les
  régimes, au 1er janvier 2004, au régime général, chez les salariés
  agricoles, les artisans et les commerçants (décret n° 2004-144, articles 3
  et 8) ; l'âge où cesse la minoration et la durée des droits d'avant 1973
  des artisans et des commerçants, au 7 octobre 2012 ; la durée du taux plein de
  l'Ircantec, au 1er avril 1983. Aucun résultat ne bouge. Détail :
  docs/feuille_de_route/191/2026-11-24-etape-7-rangement-premier-lot.md.
reste: >-
  Neuf renvois dont la ligne ne s'ouvre pas au jour du texte : les tables par
  génération de 1993 des artisans et des commerçants, qui valent dès la fin
  d'août 1993 et ne mordent qu'en 1994 ; les renvois ouverts à la création
  du fichier du régime social des indépendants (2006), du régime général
  (1945) et de la Cavimac (1979), dont la pension était forfaitaire : aucun
  texte ne fait ses deux renvois au salaire annuel moyen. Le régime social
  des indépendants ne remplace les caisses des artisans et des commerçants
  que le 1er juillet 2006, et son fichier part du 1er janvier. La suite du
  rangement, par famille, à commencer par la réforme des régimes spéciaux
  de 2008.
