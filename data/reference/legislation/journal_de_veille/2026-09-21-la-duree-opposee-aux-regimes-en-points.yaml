date: 2026-09-21
session: "la durée opposée aux régimes en points"
consulte: >-
  Index LEGI du dépôt, à jour au 20 septembre 2026 : L. 643-3 du code de la
  sécurité sociale, ses sept versions de 2004 à aujourd'hui, et la version
  en vigueur LEGIARTI000053280388 (31 décembre 2025, loi n° 2025-1403,
  applicable aux pensions prenant effet à compter du 1er septembre 2026) ;
  L. 732-24 du code rural, version LEGIARTI000053280317 du 1er janvier 2026.
  Recoupé avec les fiches `cnavpl` et `msa_non_salaries` de
  `data/reference/regimes/non_salaries.yaml`, qui portaient déjà
  `duree_requise_trimestres` et `decote_par_trimestre`.
trouve: >-
  LES DEUX RÉGIMES DE BASE EN POINTS OPPOSENT BIEN LA DURÉE TOUS RÉGIMES.
  L. 643-3 I : la pension vaut « le produit de la valeur du point par le
  nombre de points acquis » quand l'assuré a « la durée d'assurance fixée en
  application du deuxième alinéa de l'article L. 351-1 dans le présent
  régime et dans un ou plusieurs autres régimes », et un décret en Conseil
  d'État « fixe les coefficients de réduction […] en fonction de l'âge […]
  et de la durée d'assurance lorsque l'intéressé ne justifie pas de la
  durée ». Le II de L. 732-24 dit la même chose pour les non-salariés
  agricoles, avec un coefficient de minoration.
  Le moteur APPLIQUAIT déjà ce coefficient — `_abattement_points` lit la
  décote de la fiche —, mais la règle qui DATE le départ ne le voyait pas :
  `age_taux_plein_droit` rendait l'âge d'ouverture dès que la carrière
  n'avait aucune période en annuités. Le modèle faisait donc liquider « au
  taux plein » des carrières qu'il servait minorées : le libéral né en 1955
  partait à soixante-quatre ans avec 148 trimestres sur 166 requis.
  Corrigé, en Python et dans le portage JavaScript.
reste: >-
  Les coefficients de réduction eux-mêmes ne sont pas lus dans leur décret
  en Conseil d'État : les deux fiches portent 1,25 % par trimestre, aligné
  sur le régime général, et rien ne dit que les barèmes coïncident —
  R. 643-8 pour la CNAVPL, la section D. 732 pour la MSA. La carrière longue
  reste lue sur les seules périodes en annuités : l'étendre aux régimes en
  points ferait rendre au taux plein un âge antérieur à l'ouverture, et ce
  que la carrière longue ouvre à un régime en points n'est pas tranché.
  Aucun exemple chiffré publié par la CNAVPL ou la MSA n'a été trouvé qui
  rejouerait la règle : `exemples_officiels.yaml` n'en porte donc pas.
