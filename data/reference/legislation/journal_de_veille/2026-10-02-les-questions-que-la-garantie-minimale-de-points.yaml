date: "2026-10-02"
session: >-
  les questions que la garantie minimale de points laissait encore ouvertes, à la
  demande du propriétaire : « Continue les actions sur GMF [GMP] » (action 139,
  quatrième suite)
consulte: >-
  L'index JORF du dépôt (couverture de 1989, arrêtés du 2 novembre 1992 et leurs visas,
  avis du JORF du 15 juin 2013 sur l'accord du 13 mars 2013) et les incréments LEGI et JORF
  jusqu'au 2 octobre 2026 : L. 161-17-2 et L. 161-17-3 sans version postérieure au 31
  décembre 2025, rien de paru sur l'Agirc ni sur la garantie ; Gallica, par sa
  recherche plein texte (G. Briens, 1990 ; J.-P. Juès, 1995 ; G. Huteau et É. Le Bont,
  1994 ; un ouvrage de 1997 qui reproduit l'accord du 25 avril 1996) ; les Actualités
  sociales hebdomadaires en ligne, numéro par numéro, de leur n° 1937 (septembre 1995)
  au n° 3080 ; la circulaire Agirc-Arrco 2019-1-DRJ ; la convention du 14 mars 1947 à
  jour de 2018 (délibérations comprises) ; l'article 8 bis de l'annexe I dans la
  rédaction de 2006 publiée par l'Unédic ; LégiSocial (2013) ; les lettres de l'UCANSS
  de 2001 ; des questions écrites de l'Assemblée nationale (XIe législature) ; un
  document du COR de 2009. Injoignables : Légifrance (défi anti-robot), la recherche du
  Monde, les archives du web, le site reglementation.agirc-arrco.eu, éteint.
trouve: >-
  Le prorata du temps partiel est écrit au titre V-2.1.2.2 du guide réglementaire
  Agirc-Arrco, que les services de la fédération citent mot pour mot : au rapport des
  rémunérations à temps partiel et à temps plein, même quand le plafond de la Sécurité
  sociale ne l'est pas. La fin de la garantie est écrite : « Suppression de la GMP
  (maintien des points inscrits jusqu'au 31 décembre 2018) » (circulaire 2019-1-DRJ).
  Le forfait de 1996 se calcule sur le salaire de référence définitif de 1995, 20,03 F,
  que l'Agirc annonce le 22 décembre 1995 ; les mensualités de 1999 à 2003 relayées par
  les ASH retombent au centime sur le barème IPP. Le titulaire de l'allocation chômeurs
  âgés recevait la garantie sans cotisation à partir de 1997 (décision de la commission
  paritaire du 10 mars 1997), ce que le modèle ne distingue pas ; la garantie de 1989
  valait aussi pour l'article 36 (Briens). Rien ne change au calcul.
reste: >-
  Le texte même de l'accord du 8 décembre 1988, de son avenant du 13 juin 1991 et de
  l'avenant A-145 du même jour ; les circulaires de l'Agirc de 1989 à 1998 ; le guide
  réglementaire lui-même ; la décision du 10 mars 1997 et la date à laquelle la
  garantie cessa d'accompagner l'allocation chômeurs âgés.
