date: "2026-10-05"
session: "action 138, étape 2 : l'ASPA du couple"
consulte: >-
  L'index LEGI du 27 septembre 2026 : L. 815-9 ; D. 815-1, rédactions du 13 janvier
  2007, du 30 avril 2009, du 23 octobre 2014 et du 1er avril 2018 ; D. 815-2,
  rédactions de 2007, 2009 et 2014 ; R. 815-28 ; R. 815-29, rédaction de 2015. La
  base législative de la Cnav : ses barèmes du montant et du plafond de ressources
  de l'ASPA, vingt-trois dates de 2006 à 2026 et leurs textes, jusqu'à la circulaire
  n° 2025/29. La fiche F16871 de service-public.fr, vérifiée le 23 juin 2026.
trouve: >-
  Aucun texte sur l'ASPA paru depuis la dernière veille. Le plafond de ressources
  d'un couple égale le montant servi à deux allocataires (D. 815-2), par moitié à
  chacun (D. 815-1, b ; R. 815-28) ; un seul allocataire reçoit au plus le montant
  d'une personne seule (D. 815-1, a). Le plafond d'une personne seule a dépassé son
  montant jusqu'en mars 2010 (7 500,53 € contre 7 323,48 € en 2006). La série du
  couple, que le dépôt n'avait que pour 2026, va de 2006 à 2026 : six ancres
  certifiées, quinze transcrites de la Cnav ; 2026 vaut 19 442,21 € par an, non
  19 442,16 €. Le scénario 1 sert l'ASPA du couple quand un conjoint est déclaré,
  et reproduit au centime les trois cas de F16871.
reste: >-
  La série d'une personne seule : 2008, 2013 et 2015 manquent, 2014 porte le
  montant d'octobre et 2022 celui de janvier, et 2021 à 2026 douze fois le mensuel
  arrondi au lieu de l'annuel (12 523,08 € contre 12 523,14 € en 2026) ; le barème
  de la Cnav, que le récupérateur lit déjà, les donnerait. Son plafond d'avant avril
  2010, plus haut que son montant. Les ressources de l'assuré hors de ses pensions,
  l'abattement des revenus d'activité (R. 815-29), le conjoint inapte ou allocataire
  de l'allocation supplémentaire d'invalidité (D. 815-1, dernier alinéa).
