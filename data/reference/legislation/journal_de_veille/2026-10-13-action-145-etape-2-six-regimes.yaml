date: "2026-10-13"
session: "action 145, étape 2 : l'IPACTE, l'IGRANTE, le CESE, les débits de tabac, l'ASV et les conjoints de commerçants"
consulte: >-
  veille_droit.py (dix fiches à relire, aucune de ces régimes) ; l'index LEGI mis à
  jour au 12 octobre et l'index JORF au 13 octobre 2026, textes.py --inscrire (aucune
  rédaction nouvelle). Puis, régime par régime : le décret n° 51-1445 et l'arrêté du 12
  décembre 1951, leurs annexes et leurs extensions, les analyses du Journal officiel de
  leurs modifications de 1953 à 1969 ; le décret n° 59-1569, l'arrêté du 17 février
  1960 et son annexe, les analyses de 1960 à 1970 ; l'article 12 du décret n°
  70-1277, l'article 26 de l'arrêté du 30 décembre 1970, l'arrêté du 10 mars 1971, le
  décret n° 78-44 ; le règlement de la caisse de retraites du CESE au 1er janvier
  2025 (site du Conseil, copie datée), l'article 8 du décret n° 59-601, L. 381-32 et
  L. 921-2-1 CSS ; le décret n° 63-1104 (dix-sept rédactions de l'article 2) et
  l'arrêté du 13 novembre 1963 (trente-trois rédactions de l'article 14, et les
  articles 5 à 24) ; le décret n° 72-968 dans ses rédactions de 2012 et de 2026, le
  décret n° 2011-1644, D. 645-2, D. 645-3 et L. 645-5 CSS, les décrets n° 75-891, n°
  78-283, n° 81-1046, n° 84-254, n° 2007-458, n° 2007-597, n° 2008-1044 et n°
  2011-2002 ; D. 635-32 à D. 635-40 CSS, le règlement du RCI (articles 7, 14, 15, 33,
  41, annexes 1 et 3), le décret n° 50-60.
trouve: >-
  Huit fiches de règles, six approchées et deux pas encore modélisées, pour six
  régimes qui n'avaient que la fiche générique de liquidation ; aucun chiffre du
  scénario 1 n'en est changé. Cinq écarts au droit que le modèle porte : le rendement
  des gérants de débits de tabac, double du barème si les remises corrigées valent les
  remises brutes (arrêté, article 14, dont le barème est dans l'index depuis 2006) ;
  les annuités du CESE comptées au pourcentage de l'année de liquidation, et
  l'allocation viagère d'après 2015 servie entière ; la majoration de 3,5 % des points
  de l'IGRANTE au transfert de 1971 (arrêté du 10 mars 1971), absente ; les points de
  l'ancien régime des conjoints de commerçants, devenus en 2004 ceux de l'assuré au
  NRCO puis au RCI, non servis ; les conditions d'affiliation de l'IPACTE (ingénieur
  ou catégorie A, indice 225), ignorées. Trente-quatre rédactions de la liste des
  textes y prennent un statut ; le cliquet est à 9 777.
reste: >-
  À l'étape 2 : l'outre-mer, le personnel navigant et les assemblées, après l'action
  121 ; les hors champ dont des assurés vivent encore. À lire : les articles de
  l'IPACTE et de l'IGRANTE absents de LEGI (fac-similés de 1951 et 1960), la
  correction des remises des débitants, l'article 16 du règlement du NRCO, les
  règlements des sections professionnelles approuvés le 10 juillet 2026, les
  règlements de 1958 et de 2015 de la caisse du CESE. Les cinq écarts sont des
  changements du modèle, au propriétaire de dire s'ils ouvrent une action.
