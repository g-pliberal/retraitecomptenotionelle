date: "2026-09-28"
session: >-
  l'action 130, la troisième étape du domaine de la réversion : les
  exemples publiés rejoués
consulte: >-
  La page « La pension de réversion » de la fédération Agirc-Arrco, ses dix
  exemples datés ; service-public.gouv.fr, fiches F13104 (Pension de
  réversion de l'Assurance retraite, vérifiée le 1er janvier 2026) et
  F21819 (Pension de réversion en cas de décès d'un fonctionnaire, vérifiée
  le 21 février 2026) ; la foire aux questions de l'Assurance retraite sur
  le calcul et les ressources de la réversion ; la circulaire Cnav n°
  2005/17 du 11 avril 2005, dans la base législative de la Cnav.
trouve: >-
  Dix dates d'effet à l'Agirc-Arrco, dont quatre que le modèle rejoue telles
  quelles ; trois tiennent au paiement trimestriel ou annuel de la retraite
  du défunt, qui reporte la réversion au terme de la période, une à
  l'invalidité du survivant, qui lève la condition d'âge. La circulaire n°
  2005/17 écrête une réversion de 530 € à 169,06 € sous un plafond de
  1 319,06 € par mois. Service-public publie pour 2026 un plafond de
  25 001,60 € pour une personne seule et de 40 002,56 € pour un couple, un
  minimum de 4 019,13 € par an, une majoration de 11,1 % à 67 ans sous
  3 020,07 € de pensions par trimestre ; dans la fonction publique, un
  plancher au niveau de l'ASPA, 12 523,14 € par an. Aucun autre exemple
  chiffré.
reste: >-
  Un exemple chiffré du régime général pour une réversion d'après 2010, et
  un de la fonction publique ; le minimum et la majoration, à porter avec
  leurs montants. Du domaine : le formulaire et la page de résultat, la
  page Coût et la décision de la proposition.
