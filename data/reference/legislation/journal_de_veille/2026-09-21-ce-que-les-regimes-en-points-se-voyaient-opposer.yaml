date: 2026-09-21
session: "ce que les régimes en points se voyaient opposer, et ce qu'ils ne se voyaient pas"
consulte: >-
  Index LEGI du dépôt, incrément du 21 septembre 2026 appliqué : R. 643-7
  CSS (quatre versions, la dernière du 1er septembre 2023) ; R. 732-39 du
  code rural ; L. 732-18-1 du code rural (quatre versions) ; L. 643-3 II
  CSS. Cherché sans le trouver l'article qui donne le TAUX du coefficient
  de minoration agricole — D. 732-42 est la surcote, D. 732-45 et D. 732-46
  autre chose, et le balayage de « minoration » dans le code rural ne rend
  que des textes abrogés en 2004.
trouve: >-
  LE BARÈME LIBÉRAL EST CELUI DU RÉGIME GÉNÉRAL, mot pour mot : R. 643-7
  donne le plus petit des deux décomptes, l'arrondi au chiffre supérieur,
  1,25 % par trimestre et le plafond de vingt trimestres — ce que
  `_trimestres_de_decote` faisait déjà. LA CARRIÈRE LONGUE EST OUVERTE AUX
  DEUX RÉGIMES EN POINTS : L. 732-18-1 pour les agricoles, L. 643-3 II par
  renvoi à L. 351-1-1 pour les libéraux ; le moteur ne l'offrait qu'aux
  périodes en annuités.
  Et surtout, EN CHERCHANT CELA : `calculer` ne lisait l'âge d'ouverture
  opposable que sur les périodes en annuités, si bien qu'une carrière
  entière en points ne se voyait opposer AUCUN âge — le simulateur servait
  une pension d'exploitant agricole à cinquante ans sans rien refuser,
  quand il la refusait à l'artisan. `requis_reference` retombait pour eux
  sur 160 trimestres, durée que plus aucune génération ne doit, et c'est
  elle que leur abattement opposait. Les trois faces sont corrigées, en
  Python et dans le portage JavaScript.
reste: >-
  Le taux du coefficient agricole n'est pas lu, faute d'article dans le
  champ social de l'index : la fiche garde 1,25 % par transcription. Le cas
  type libéral n'a toujours aucune année salariée avant son installation, ce
  qui le met hors d'atteinte de la durée requise à tout âge — sa fiche date
  donc son départ sur l'ouverture, et la question de savoir si un libéral
  représentatif a une carrière antérieure reste ouverte.
