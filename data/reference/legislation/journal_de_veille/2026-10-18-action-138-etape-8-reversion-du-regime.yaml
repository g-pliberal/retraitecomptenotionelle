date: "2026-10-18"
session: "action 138, étape 8 : le 2° de D. 732-110, II, et la réversion du régime dans la pension majorée de référence"
consulte: >-
  `python scripts/veille_droit.py` (trois fiches à relire, aucune de l'étape). Dans
  l'index LEGI du dépôt, à jour au 11 octobre 2026 : D. 732-110, toutes ses rédactions
  de 2005 à 2026 (LEGIARTI000006597532 à LEGIARTI000053365690) ; D. 732-111 de 2009,
  2017 et 2026 ; D. 732-112 de 2009 et de 2026 ; D. 732-114 de 2009 et de 2026 ;
  L. 732-54-1 de 2007 et de 2008 ; L. 732-54-3 de 2008 ; L. 732-41 de 2008 ;
  L. 732-63 de 2014 et de 2026.
trouve: >-
  Le 2° de D. 732-110, II — « les périodes d'assurance non salariée agricole à titre
  exclusif ou principal validées par les personnes susceptibles de bénéficier d'une
  pension de réversion prévue aux articles L. 732-41 à L. 732-46 » — est dans les
  rédactions de 2009, 2010, 2011 et 2016, que DM1 compte (D. 732-111), et absent de
  celles de 2022 et de 2026, la PMR unique. La majoration est l'écart entre la PMR et
  « la somme des pensions de retraite et de réversion, servies à l'assuré par le
  régime » (D. 732-112, de 2009 à 2026) ; l'écrêtement compte « l'ensemble des pensions
  de retraite et des pensions de réversion » de tous les régimes (D. 732-114), « de
  droit propre et de droit dérivé » (L. 732-54-3). La réversion de L. 732-41 va au
  conjoint survivant du chef, réduite à due concurrence de ce que ses ressources
  dépassent d'un plafond. L. 732-63, le complément différentiel, ne nomme pas la
  réversion. Avant 2009, L. 732-54-1 relevait en 2002 le minimum des « personnes non
  susceptibles de bénéficier de la revalorisation de la majoration des pensions de
  réversion prévue à l'article L. 732-54-4 », que la fiche des plans déclare. Servis,
  dans les deux moteurs, à qui déclare une réversion du régime : le 2°, la réversion
  retranchée, comptée au plafond.
reste: >-
  La saisie de la réversion (session des pages). La révision de la PMR quand les
  ressources changent (D. 732-114), dont la réversion ouverte après le départ d'une
  pension prise de 2009 à 2021. Aux plans de 1997 à 2008, ce que la réversion déclarée
  permet de servir : D. 732-116, D. 732-118 et D. 732-147. Aucun exemple chiffré publié
  par la MSA d'une veuve portée à la PMR.
