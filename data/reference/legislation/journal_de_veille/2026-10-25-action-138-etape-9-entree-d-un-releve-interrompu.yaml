date: "2026-10-25"
session: "action 138, étape 9 : l'entrée d'un relevé qu'ouvre une interruption"
consulte: >-
  Dans l'index du JORF de la DILA : la loi n° 2017-1836, art. 15, 8° (JORFARTI000036339157), qui
  affilie au régime général et au RCI le libéral non réglementé créant son activité depuis le
  1er janvier 2019, et laisse à la CNAVPL et à la Cipav ceux qui y étaient affiliés avant ; la loi
  n° 2023-270, art. 1er (JORFARTI000047445082), qui ferme la RATP, la Banque de France, la CRPCEN
  et les IEG aux recrutés depuis le 1er septembre 2023. L'article 3 de la loi n° 2018-515, qui
  ferme la SNCF, n'est pas dans l'index, qui en garde les articles 2, 16 et 17 : reformes.yaml le
  cite.
trouve: >-
  L'entrée que ces textes opposent est un recrutement ou une installation, qu'un relevé ne dit que
  par une année d'emploi. La carrière la datait de la première année qui nommait le statut,
  interruption comprise : le libéral sans activité en 2018, installé en 2019, gardait la CNAVPL et
  la Cipav. Elle la date désormais de la première année d'emploi, comme le formulaire, et le refus
  d'un statut fermé la lit. La CRPCEN et les IEG ne restent qu'à qui en remplit les conditions
  d'affiliation « sans aucune interruption » depuis le 1er septembre 2023 (III et V) : la
  carrière ne le lit pas, et le clerc revenu après une absence garde la CRPCEN.
reste: >-
  Au modèle, le retour à la CRPCEN et aux IEG après le 1er septembre 2023 ; le plafond de 2027 ;
  la limite 5 ante ter (2) (note « entrée d'un relevé interrompu »).
