date: "2026-11-05"
session: "action 130, file N : la CRPNPAC, ouverte à cinquante ans, et le régime général du navigant"
consulte: >-
  `python scripts/veille_droit.py` : la base de la Cnav sans barème changé ; deux exposés
  à date changée et la circulaire ministérielle n° 2026/140, hors du sujet. L'index LEGI
  récupéré (à jour au 2 novembre 2026). Dans l'index : le code de l'aviation civile,
  R. 426-11 dans ses cinq rédactions (LEGIARTI000006845205, LEGIARTI000006845206,
  LEGIARTI000023049284, LEGIARTI000024795153, LEGIARTI000044496243), R. 426-11-1
  (LEGIARTI000006845207), R. 426-16-1 (LEGIARTI000036880164) ; le code des transports,
  R. 6527-21 (LEGIARTI000048325100) ; le code de la sécurité sociale, L. 351-1
  (LEGIARTI000023035688), L. 161-17-2 (LEGIARTI000025014605, LEGIARTI000053280889),
  D. 351-1-1 (LEGIARTI000026139949), L. 351-1-3 (LEGIARTI000028498841), D. 351-1-5
  (LEGIARTI000030058836), L. 351-1-4 (LEGIARTI000035640851), L. 351-6-1
  (LEGIARTI000037063352) ; le code du travail, L. 4163-7 (LEGIARTI000035631174). La note
  de la file L (`130/2026-11-04-ouverture-de-la-base-des-liberaux.md`) et sa relecture.
trouve: >-
  La CRPNPAC sert sa pension à qui a « atteint l'âge de cinquante ans » et justifie de
  « vingt annuités » (R. 426-11, I, depuis 2012 ; R. 6527-21 depuis le 1er novembre
  2023 ; « Avoir atteint l'âge de cinquante ans », R. 426-11-1, de 1995 à 2011) ; aucune
  rédaction ne nomme le régime général, et R. 426-16-1 majore la pension jusqu'à « l'âge
  mentionné à l'article L. 161-17-2 ». Le régime général s'ouvre à cet âge (L. 351-1),
  soixante-deux ans aux nés à compter de 1955 (rédaction de 2011), 62 ans et 9 mois aux
  nés de 1963 au 31 mars 1965 pour les pensions du 1er septembre 2026 et après ; la
  carrière longue, au plus tôt à 58 ans pour les nés depuis 1960 entrés avant seize ans
  (D. 351-1-1) ; le départ handicapé demande une incapacité d'au moins 50 %
  (L. 351-1-3). Le modèle servait le régime général et l'Agirc-Arrco du navigant né en
  1964 parti à 55 ans ; il ne sert plus que la CRPNPAC au départ, le reste le 1er
  décembre 2026, dans les deux moteurs.
reste: >-
  La condition de vingt annuités de R. 426-11, I, 2°, que le modèle n'oppose pas : un
  navigant de quinze annuités se voit servir la CRPNPAC à 55 ans (candidat). L'article
  qui fixait l'âge de cinquante ans avant 1995, non relu sur le régime général. La
  limite du compte professionnel de prévention (L. 4163-7, 3°), non lue : le cas n'en
  déclare pas. L'Agirc-Arrco suit le régime général, comme le modèle le présume de toute
  complémentaire des salariés : son règlement n'a pas été relu sur ce point.
  `ouvrir.age_ouverture_droit`, qui date un cas type, rend cinquante ans au navigant :
  non instruit.
