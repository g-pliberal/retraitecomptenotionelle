date: "2026-09-23"
session: "l'audit des formules : l'arrêté du SMIC de juin, lu"
consulte: >-
  Dans l'index JORF : l'arrêté du 22 mai 2026 relatif au relèvement du
  salaire minimum de croissance (JORFTEXT000054126589), sa notice et son
  article 1 (JORFARTI000054126607).
trouve: >-
  « A compter du 1er juin 2026 […] son montant est porté à 12,31 €
  l'heure » en métropole et dans les départements d'outre-mer, 9,56 € à
  Mayotte ; l'arrêté est pris en application des articles L. 3231-5,
  L. 3231-12 et L. 3423-1 du code du travail. La valeur saisie dans
  `smic_horaire_releves.csv` est celle du texte.
reste: >-
  Rien de ce relèvement. L'entrée « l'audit des formules : AGS, CSG des
  pensions, SMIC de juin » le laissait à lire à la source : il l'est, dans
  le JORF, que LEGI ne remplace pas pour les textes du SMIC.
