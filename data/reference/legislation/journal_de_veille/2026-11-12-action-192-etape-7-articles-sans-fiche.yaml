date: "2026-11-12"
session: "action 192, étape 7 : les rédactions récentes qu'aucune fiche ne citait, lues et confrontées au modèle"
consulte: >-
  Les index LEGI et JORF du dépôt, à jour au 11 novembre 2026. Décret
  n° 2004-1056 des ouvriers de l'État, articles 7, 12, 16 et 17, dans toutes
  leurs rédactions depuis 2023 ; décret n° 2024-1281 du 31 décembre 2024,
  articles 4, 7 et 8 ; code général de la fonction publique, L. 556-1, L. 556-5
  et L. 556-7 ; code des pensions, L. 10, L. 12 bis et L. 26 bis ; code de la
  sécurité sociale, L. 351-3 et R. 351-12 (1er novembre 2026), R. 351-37 et
  L. 351-1-4, R. 653-2, L. 653-2 et R. 643-7, L. 351-8, 6°, R. 173-3-2 et
  R. 351-2-1 (1er août 2026) ; loi n° 2010-1330, article 20 ; décret
  n° 2026-354 du 7 mai 2026, article 1er. Une recherche sur le web de ce que
  le FSPOEIE fait des services d'après la limite d'âge, sans résultat.
trouve: >-
  Un écart que le modèle porte : R. 173-3-2, I, excepte des vingt-quatre ou
  vingt-trois meilleures années les bénéficiaires des bonifications de l'État,
  des ouvriers de l'État et de la CNRACL, et le modèle retire ces années à
  toute carrière qui détient des trimestres pour enfants ; rejoué, 1,1 % de
  trop au régime général pour une mère de deux enfants nés en service. Un
  écart possible : avant le 2 janvier 2025, l'article 7 du décret n° 2004-1056
  ne comptait pas les services du maintien jusqu'à soixante-dix ans, que le
  modèle compte dès le 1er septembre 2023. Rien d'autre ne change un calcul :
  le trimestre de bonification de l'ouvrière est déjà servi ; les majorations
  des sapeurs-pompiers volontaires et des élus locaux sont déjà déclarées non
  modélisées ; la rente d'accident du travail, R. 351-37 et le renvoi mort de
  R. 653-2, que R. 643-7 partage, ne déplacent aucun résultat. Une fiche
  neuve, accident_du_travail_periodes_assimilees ; sam_parents_24_23 passe à
  approchée ; le cliquet des textes descend à 9 234.
reste: >-
  Au propriétaire : décider de l'étape qui écrira l'exception de R. 173-3-2,
  et faire demander au FSPOEIE ce qu'il a compté des services du maintien pour
  les pensions prenant effet du 1er septembre 2023 au 1er janvier 2025. À
  lire quand elles paraîtront : la circulaire Cnav des meilleures années des
  parents, pour savoir si l'exception écarte la personne ou ses seuls enfants
  portés par la fonction publique, et celle de la réforme de la rente
  d'accident du travail. Le détail :
  docs/feuille_de_route/192/2026-11-12-etape-7-articles-sans-fiche.md.
