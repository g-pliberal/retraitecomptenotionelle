date: "2026-10-16"
session: >-
  action 153, étape 2, sixième famille : les points enfants de l'Arrco et de l'Agirc —
  la majoration pour enfants nés ou élevés, son plafond, la majoration pour enfants à
  charge — et la minoration qui les frappe, confrontés à OpenFisca-France-Pension
consulte: >-
  `python scripts/veille_droit.py`. L'accord du 18 mars 2011, dans le texte que la
  circulaire Agirc-Arrco du 7 juillet 2011 en applique, point 3.3.1, cité par Legisocial
  (« Retraites complémentaires : les nouvelles majorations familiales », août 2011), et
  dans le document n° 7 de la séance du COR de mai 2011 (« Règles ARRCO-AGIRC ») ; ni
  l'un ni l'autre n'est au JORF ni dans LEGI, l'accord étant à KALI, que la session n'a
  pas lu. Les fiches majoration_enfants_agirc_arrco et
  majoration_enfants_a_charge_agirc_arrco, et leurs lectures de l'accord du 17 novembre
  2017, articles 94 et 95, et de l'accord du 8 décembre 1961, annexe A, article 17. Et le
  code d'OpenFisca-France-Pension 0.1.3 (`arrco_points_enfants_nes_et_eleves`,
  `arrco_points_enfants_a_charge`, `arrco_majoration_pension`, `arrco_pension`, leurs
  jumeaux de l'Agirc, `arrco_coefficient_de_minoration`), exécuté à part.
trouve: >-
  Une erreur du scénario 1, corrigée dans les deux moteurs : le plafond de la majoration
  pour enfants nés ou élevés, de 2012 à 2018, est de « 1 000 € par an au titre de
  l'Agirc et [de] 1 000 € par an au titre de l'Arrco », « revalorisé comme le point de
  retraite », pour les allocations prenant effet à compter du 1er janvier 2012. Le
  modèle servait de 1999 à 2018 le plafond unifié de 2025, 2 367,48 €, commun aux deux
  régimes, ce qui le doublait (`plafond_majoration_regime`, les fiches de l'Arrco, de
  l'Agirc, de leurs tranches et de l'UNIRS). Les taux par période d'acquisition, la
  majoration pour enfants à charge et le coefficient d'anticipation concordent. Un écart
  chez OpenFisca : il minore du coefficient d'anticipation la majoration pour enfants à
  charge, que l'annexe A, article 17, assoit de 2012 à 2018 sur les droits bruts.
reste: >-
  À l'action 153, étape 2 : les périodes assimilées et le salaire annuel moyen, une
  famille par session. Le signalement à OpenFisca, que le propriétaire tranche. Le texte
  de l'accord du 18 mars 2011 à lire sur Légifrance (KALI), et la circulaire du 7 juillet
  2011 à la source : la borne du 2 août 1951, que le dépôt et OpenFisca opposent au
  plafond, n'est dans aucune des deux pages lues, et Legisocial n'en donne pour champ que
  les allocations prenant effet depuis 2012 ; la circulaire d'avant 2019 sur l'assiette
  de la majoration pour enfants nés ou élevés sous un coefficient d'anticipation, que les
  deux moteurs minorent.
