date: "2026-10-13"
session: "action 121 : les dix fiches qui restaient, l'âge et la durée de chacun à sa génération"
consulte: >-
  Index LEGI (incrément du 12 octobre 2026) et JORF (du 13 octobre). Saint-Pierre-et-
  Miquelon : article 5 de la loi n° 87-563, ses dix rédactions (LEGIARTI000006757151 à
  LEGIARTI000054477924) ; article 3 du décret n° 2017-1000, ses sept rédactions
  (LEGIARTI000034740766 à LEGIARTI000054590081) ; articles 7 et 9 du décret n° 89-110 ;
  ordonnance n° 2015-896, article 4, et le rapport qui la présente ; loi n° 2023-1250,
  article 90 ; loi n° 2025-1403, article 105, au Journal officiel ; L. 161-17-2 et
  L. 351-8 dans leurs rédactions de 2011 à 2026. La page de la CPS et service-public,
  par une recherche en ligne : rien sur l'âge du taux plein des générations 1958 à 1961.
trouve: >-
  Saint-Pierre-et-Miquelon : l'âge et la durée suivent la génération depuis les pensions
  prenant effet au 1er juillet 2016, en trois rédactions — celle de l'ordonnance de
  2015, celle de la loi de financement pour 2024 au 1er septembre 2023 pour les âges,
  celle de la loi de financement pour 2026 au 1er MARS 2026, et non au 1er septembre,
  pour les âges et la durée. Avant, la durée suit l'année d'entrée en jouissance, et le
  coefficient de minoration la génération, par le renvoi du décret de 1989 à R. 351-27.
  Tables spm_2015, spm_2023 et spm_2026 ; réformes spm_2023 et spm_2026 redatée.
reste: >-
  Saint-Pierre-et-Miquelon : l'âge du taux plein des générations 1958 à 1961 depuis le
  1er septembre 2023 (67 ans à lire L. 351-8 mot à mot, l'âge d'avant dans les tables,
  au niveau moyenne) ; le revenu annuel moyen (toute la carrière avant 2016, quarante à
  vingt-huit années pour les nés avant 1962) ; la surcote depuis le 1er juillet 2016.
  Puis les neuf autres fiches, dans l'ordre du bloc de l'action 121.
