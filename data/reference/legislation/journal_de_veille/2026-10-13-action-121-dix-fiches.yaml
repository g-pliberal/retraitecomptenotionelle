date: "2026-10-13"
session: "action 121 : les dix fiches qui restaient, l'âge et la durée de chacun à sa génération"
consulte: >-
  Index LEGI (incrément du 12 octobre 2026) et JORF (du 13 octobre). Saint-Pierre-et-
  Miquelon : article 5 de la loi n° 87-563, ses dix rédactions (LEGIARTI000006757151 à
  LEGIARTI000054477924) ; article 3 du décret n° 2017-1000, ses sept rédactions
  (LEGIARTI000034740766 à LEGIARTI000054590081) ; articles 7 et 9 du décret n° 89-110 ;
  ordonnance n° 2015-896, article 4, et le rapport qui la présente ; loi n° 2023-1250,
  article 90 ; loi n° 2025-1403, article 105, au Journal officiel ; L. 161-17-2 et
  L. 351-8 dans leurs rédactions de 2011 à 2026. La page de la CPS et service-public,
  par une recherche en ligne : rien sur l'âge du taux plein des générations 1958 à 1961.
  Mayotte : décret n° 2003-589, articles 2, 9, 10 et 11, toutes leurs rédactions
  (LEGIARTI000006781021 à LEGIARTI000054059636) ; ordonnance n° 2002-411, article 6,
  quatre rédactions ; décrets n° 2012-1168 (article 7) et n° 2025-1410 (article 5) au
  Journal officiel ; loi n° 2025-1403, article 105, V.
  Polynésie française : le rapport annuel 2020 du Conseil d'orientation et de suivi des
  retraites (service-public.pf, ARASS), ses tableaux « source CPS 2020 » ; la fiche du
  CLEISS ; Lexpol, d'où la loi du pays n° 2019-6 ne se lit pas.
  Nouvelle-Calédonie, sur Juridoc : la délibération n° 458 du 8 janvier 2009 consolidée
  au 13 décembre 2022 (CAFAT) ; le code des pensions de retraites des fonctionnaires
  consolidé au 1er janvier 2025 (Caisse locale de retraites). L'avis n° 24/2022 du CESE
  de la Nouvelle-Calédonie.
trouve: >-
  Saint-Pierre-et-Miquelon : l'âge et la durée suivent la génération depuis les pensions
  prenant effet au 1er juillet 2016, en trois rédactions — celle de l'ordonnance de
  2015, celle de la loi de financement pour 2024 au 1er septembre 2023 pour les âges,
  celle de la loi de financement pour 2026 au 1er MARS 2026, et non au 1er septembre,
  pour les âges et la durée. Avant, la durée suit l'année d'entrée en jouissance, et le
  coefficient de minoration la génération, par le renvoi du décret de 1989 à R. 351-27.
  Tables spm_2015, spm_2023 et spm_2026 ; réformes spm_2023 et spm_2026 redatée.
  Mayotte : l'âge, la durée et le taux plein suivent l'année d'effet de 2003 à 2011
  (2017 pour la durée) — et le taux plein y était de 60 à 64 ans, non de 65 —, puis la
  génération : l'âge depuis le décret n° 2012-1168 (et non « 2012-1170 »), la durée
  pour les pensions de 2018, le coefficient pour celles de 2026 ; le taux plein à 67 ans
  au 1er janvier 2026 (décret n° 2025-1410), la suspension au 1er septembre 2026.
  Tables mayotte_2012, mayotte_2023, mayotte_2026 et mayotte_2018 ; deux réformes de plus.
  Polynésie : la loi du pays n° 2019-6 relève l'âge et la durée à l'année du départ, de
  60 ans et 420 mois en 2019 à 62 ans et 456 mois en 2023, pour les tranches A et B ;
  trois périodes annuelles et la réforme polynesie_2020.
  Nouvelle-Calédonie : la CAFAT et la Caisse locale relèvent l'âge à la date du départ
  (délibération n° 59/CP du 24 février 2022 ; loi du pays n° 2024-10, article
  Lp. 221-1) ; la durée de 2023 de la CAFAT est de 142 trimestres, et l'âge de la Caisse
  locale atteint 62 ans en 2028, non en 2030 comme dans l'avant-projet.
reste: >-
  Saint-Pierre-et-Miquelon : l'âge du taux plein des générations 1958 à 1961 depuis le
  1er septembre 2023 (67 ans à lire L. 351-8 mot à mot, l'âge d'avant dans les tables,
  au niveau moyenne) ; le revenu annuel moyen (toute la carrière avant 2016, quarante à
  vingt-huit années pour les nés avant 1962) ; la surcote depuis le 1er juillet 2016.
  Mayotte : l'âge de l'inaptitude ; la durée des pensions de 2035 et après, que le
  décret n'écrit plus que pour la génération 1973. Polynésie : les abattements de la
  réforme de 2019 (1,5 % par trimestre avant l'âge légal, 0,5 % par trimestre manquant,
  jusqu'à 65 ans) ; le texte même de la loi du pays, à lire sur Lexpol.
  Nouvelle-Calédonie : le droit acquis de la CAFAT (article 3, 3°) ; la durée de
  services et les minorations de la Caisse locale. Puis les cinq autres fiches, dans
  l'ordre du bloc de l'action 121.
