date: "2026-10-14"
session: "action 138, étape 18, troisième partie : les points d'avant 1973 des artisans et des commerçants"
consulte: >-
  veille_droit.py. L'index LEGI du dépôt, récupéré puis mis à jour des incréments
  du 12 et du 13 octobre 2026 ; l'index JORF. Dans LEGI : L. 634-3 (2018) et
  D. 634-8 (2017, 2020) ; le décret n° 73-937 du 2 octobre 1973, articles 1er
  (1980, 1990), 2, 3 (rédactions de 1976, 1990, 1993, 1995, 2004, 2012 et 2023),
  3 ter et son annexe, 3 quinquies et 5 (2026), 4, 12 et 13 ; le décret n° 64-994
  du 17 septembre 1964, articles 3 à 6 et 26 ; le décret n° 66-248 du 31 mars
  1966, articles 2 à 6 et 17 à 21. Dans le JORF, les notices des décrets de 1949
  à 1973 (n° 49-546, 50-1342, 51-751, 53-1078, 64-994, 66-248, 66-249, 71-239)
  et des arrêtés approuvant les décisions de la caisse nationale. À la Cnav, le
  barème ti_prestation_valeur_point_retraite_commercant_bar (circulaires 2020/5 à
  2025/29) et les deux fiches « Valeur du point de retraite RVB » du RSI (26
  février 2019) qu'il cite. Les barèmes IPP pt_organic et pt_cancava.
trouve: >-
  Les droits d'avant 1973 sont servis à part, dans les conditions du 31 décembre
  1972 (L. 634-3) : des points, multipliés par la valeur du point de retraite
  (décret n° 66-248, art. 19 ; décret n° 64-994, art. 26). Ils se liquident à
  soixante ans, puis à l'âge de L. 161-17-2, minorés de 2,5 % par trimestre
  manquant à la durée tous régimes ou à soixante-cinq ans (puis à l'âge de
  L. 351-8, 1°), au plus petit des deux ; depuis 2004, de 2,5 % à 1,25 % selon la
  génération (décret n° 73-937, art. 3). L'artisan est rangé dans une classe de 4 à
  60 points selon son revenu, aux seuils « fixés par décret » ; le commerçant opte
  pour 20, 24 ou 36 points, 20 sans option. D. 634-8 écrit l'équivalence d'un point
  à 3 % du plafond chez l'artisan et à 5 % chez le commerçant. Valeur du point au
  1er janvier 2026 : 10,7637 € et 14,84302 € ; en 2020, différenciée selon le
  total des pensions ; l'IPP porte pour les commerçants, en 2011, la valeur des
  artisans. L'article 5, dans sa rédaction du 1er janvier 2026, bonifie les points
  de la mère qui n'a aucune période après 1972. Aucun exemple chiffré publié.
reste: >-
  Au fac-similé du Journal officiel, que l'index ne porte qu'en notices : les
  seuils des classes des artisans de 1969 à 1972, les tableaux d'assimilation de
  1949 à 1968 annexés au décret n° 64-994, les classes des commerçants avant 1971
  (décret n° 66-248 d'origine, décret n° 71-239). Les points gratuits d'avant
  1949, la bonification de 1962, la majoration pour ajournement, la bonification
  de l'article 5, l'article 3 bis. Un exemple chiffré de la Cnav. Le reste de
  l'étape 138.18 : les points d'incapacité, le conjoint collaborateur, les
  dispenses de l'assiette minimale, la Lodeom.
