date: "2026-10-19"
session: "action 138, étape 12 : le RCI et la cotisation minimale de l'indépendant en cumul"
consulte: >-
  L'index LEGI du dépôt, à jour au 18 octobre 2026 (aucun incrément depuis) :
  le règlement du RCI (arrêté du 9 février 2012), articles 4
  (LEGIARTI000054891743, LEGIARTI000054895766), 27 (LEGIARTI000054892085,
  LEGIARTI000054906642, LEGIARTI000054906651, LEGIARTI000054908896), 39 et 40
  (LEGIARTI000054907326, LEGIARTI000054907340) ; L. 161-22-1 (LEGIARTI000047453688,
  LEGIARTI000053279754) ; D. 633-2, de 1985 à 2023 (LEGIARTI000048838330 en
  vigueur), et une recherche des articles qui dispenseraient le pensionné de la
  cotisation minimale ; R. 634-1 (LEGIARTI000047961079), D. 634-3
  (LEGIARTI000053356107), R. 351-29 (LEGIARTI000053335651). L'index JORF : l'arrêté
  du 19 juin 2024 (JORFTEXT000049776019), son annexe et son article 2, et celui
  du 21 septembre 2026 (JORFTEXT000054888294). À la base de législation de
  l'Assurance retraite, par sa recherche (« RCI cumul emploi retraite », « seconde
  pension », « article 27 règlement RCI », « cotisations minimales retraité »,
  « complémentaire indépendants nouveaux droits cumul ») : les exposés
  « Retraite personnelle complémentaire » (6 mars 2026), « Travailleurs
  indépendants » (7 avril 2026), « Fin d'acquisition de droits à retraite » et
  « Retraite personnelle issue d'un cumul emploi retraite » (28 septembre 2026).
  Service-public, fiches F36238 et F36611 d'Entreprendre, sans rapport. L'Urssaf
  et la Sécurité sociale des indépendants refusent le réseau de la session.
trouve: >-
  Le RCI n'ouvre de droits au retraité en cumul intégral que sur les périodes
  courant depuis le 1er janvier 2025 : jusque-là, ses cotisations « ne sont pas
  productives de droits » (article 4) ; l'article 27, dans la rédaction de l'arrêté
  du 19 juin 2024, dont les alinéas 2 à 5 « entrent en vigueur le 1er janvier
  2025 », ouvre « de nouveaux droits à pension » et une seconde pension
  « calculée, liquidée et servie dans les conditions applicables à la pension de
  vieillesse du présent régime », demandée avec celle de la base ; en 2027, au
  cumul entier de L. 161-22. La cotisation minimale de D. 633-2 vaut pour le
  pensionné, qu'aucun texte n'en dispense, et ses trois trimestres entrent dans
  la nouvelle pension, dont le revenu annuel moyen « correspond aux cotisations
  versées ». Porté dans les deux moteurs : l'artisane qui déclare 5 % du salaire
  moyen en 2024 et 2025 a six trimestres et 97 € au lieu de deux et 13 € ; le
  commerçant au demi-salaire moyen de février 2023 à juillet 2025, 61 € de RCI
  de plus, sur ses mois de 2025. En chemin : l'article 27 soumet aussi le
  service du RCI aux règles de cumul de la base, que le modèle ne fait pas ; le
  versement forfaitaire unique sous quarante points (articles 39 et 40) non
  plus.
reste: >-
  Le RCI en cumul plafonné (article 27), dans le cumul des deux moteurs ; le
  versement forfaitaire unique du RCI, aux deux pensions ; la phrase des pages,
  qui lit la seconde retraite du RCI comme une pension de base ; les secondes
  retraites de l'Ircantec, de la RCO et des sections libérales, à lire ; une
  instruction ou un exemple de la caisse de la seconde pension du RCI.
