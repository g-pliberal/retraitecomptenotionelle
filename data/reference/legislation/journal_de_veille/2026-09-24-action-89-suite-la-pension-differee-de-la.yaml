date: "2026-09-24"
session: "action 89, suite : la pension différée de la fonction publique"
consulte: >-
  veille_droit.py, et la mise à jour de l'index LEGI : aucun incrément
  nouveau, L. 161-17-2 sans version postérieure au 31 décembre 2025. Dans
  l'index LEGI : L. 15, L. 16 et L. 25 du code des pensions dans leurs
  versions depuis 1972, les articles 17, 19 et 26 du décret n° 2003-1306,
  les articles 18 et 22 du décret n° 2004-1056, l'annexe du décret
  n° 2007-262 de la Banque de France. Dans l'index JORF, l'article 81 de la
  loi n° 2019-1446. Les pages de juris-cnracl sur la liquidation différée,
  l'agent radié sans liquidation immédiate et la revalorisation des
  pensions.
trouve: >-
  Depuis 2004, la même règle pour l'État (L. 25), la CNRACL (article 26)
  et le FSPOEIE (article 22) : le traitement de l'agent radié suit les
  revalorisations des pensions jusqu'à la mise en paiement. Le modèle le
  portait au point d'indice, 14,9 % de moins pour un départ fin 2011
  liquidé en 2026. Corrigé dans les deux moteurs, avec les bornes que la
  CNRACL écrit et, pour 2020, le coefficient de L. 161-25, la dérogation
  de 0,3 % ne visant que les pensions servies.
reste: >-
  Aucun exemple publié pour en faire un témoin officiel. La radiation est
  datée au 1er janvier qui suit la dernière année de service, faute du
  mois. L'annexe de la Banque de France, à lire en entier.
