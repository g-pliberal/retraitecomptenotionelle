date: "2026-10-12"
session: "action 136, étape 6 : la pension des hommes manque de durée ; les carrières statutaires à leur durée, la dixième version de la population"
consulte: >-
  Aucune source de droit : la session ne touche à aucune règle du scénario 1. Les séries
  certifiées au dépôt — les caractéristiques des retraités de l'EIR 2020 (durées,
  proratisation, tranches de durée), ses quintiles de la pension en équivalent carrière
  complète, la durée d'assurance par génération que le COR en publie, la distribution des
  pensions, la part des liquidants au minimum contributif dans l'EACR ; aucun
  téléchargement.
trouve: >-
  Aucun texte de droit. Les hommes de la population validaient 35,5 années pour 40,0 dans
  l'EIR, et leur proratisation des trois quintiles du haut était de 90 à 94 %, quand
  celle de l'EIR est presque entière. Le calage des tranches tenait les carrières
  statutaires pour entières ; comptées à leur durée, la médiane des hommes passe de 1 570
  à 1 622 € (1 745 dans l'EIR), la pension moyenne de tous est celle de l'EIR. Nés de
  1938 à 1953, ils valident encore 36 années, pour 40,5 : leurs carrières pleines
  commencent à 21 ans.
reste: >-
  À l'étape 6 de l'action 136 : l'âge d'entrée des carrières pleines selon la génération,
  sur la durée d'assurance de l'EIR ; la pension des femmes, trop haute par année
  validée ; le minimum selon la génération ; la bascule de la page, au propriétaire.
