date: "2026-10-16"
session: >-
  action 153, étape 2, cinquième famille : les minima — le minimum garanti de la
  pension civile, à l'État et à la CNRACL, et le minimum contributif du régime
  général —, confrontés à OpenFisca-France-Pension
consulte: >-
  `python scripts/veille_droit.py` ; les index JORF et LEGI, récupérés à jour au 11
  octobre 2026. La loi n° 2010-1330, articles 45 (JORFARTI000023022174) et 53
  (JORFARTI000023022209) ; le décret n° 2010-1744, article 3 (JORFARTI000023334941) ; le
  décret n° 2003-1306, article 22, rédaction du 1er janvier 2011 (LEGIARTI000023412553) ;
  D. 351-2-1 du code de la sécurité sociale, rédaction du 1er avril 2009
  (LEGIARTI000020090091). Et le code et les barèmes d'OpenFisca-France-Pension 0.1.3
  (`fonction_publique_minimum_garanti`, `cnracl_minimum_garanti`,
  `regime_general_cnav_pension_minimale`, `parameters/.../minimum_garanti/`), exécutés à
  part.
trouve: >-
  Aucune erreur du scénario 1 : le barème de L. 17, rapporté à sa référence, et le
  minimum contributif concordent au centime sur les profils où les deux appliquent la
  même règle. Quatre écarts chez OpenFisca, que les textes tranchent pour le dépôt : son
  minimum de la CNRACL lit les services de l'État (décret n° 2003-1306, article 22) ;
  il sert le d de L. 17 à qui avait atteint l'âge d'ouverture avant 2011, que
  l'article 45, V, de la loi n° 2010-1330 garde au c ; il ignore la minoration de
  l'âge d'annulation de 2011 à 2015 (article 45, IV ; décret n° 2010-1744, article 3) ;
  il proratise le minimum contributif sur la durée accomplie, quand la Cnav y retient
  la durée corrigée après l'âge du taux plein (circulaire n° 8/89, point 3).
reste: >-
  À l'action 153, étape 2 : les points enfants et la minoration de l'Arrco, les
  périodes assimilées, le salaire annuel moyen, une famille par session. Le
  signalement à OpenFisca, que le propriétaire tranche. D. 351-2-1 parle de
  « trimestres d'assurance effectivement accomplis » : la durée corrigée du minimum
  contributif tient à la lecture de la Cnav de 1989, qu'aucune circulaire postérieure
  lue ne reprend ni ne dément ; à confirmer par une circulaire récente.
