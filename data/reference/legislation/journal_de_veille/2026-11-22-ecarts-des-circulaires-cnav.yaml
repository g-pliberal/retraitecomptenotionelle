date: "2026-11-22"
session: "action 175 : les écarts des circulaires Cnav de 2004, 2005 et 2023 à 2026"
consulte: >-
  Index LEGI de la DILA à jour au 16 novembre 2026 : décret n° 2003-589, articles 2
  (LEGIARTI000026514429, LEGIARTI000049915788) et 10 (LEGIARTI000026514415). Base
  de législation de la Cnav, par son API : circulaires n° 2005/36 du 29 juillet
  2005 ; n° 2004/8, n° 2023/14 et n° 2026/30 lues par le propriétaire le même jour.
trouve: >-
  Mayotte : taux plein à 67 ans pour les nés depuis 1961, pensions de septembre
  2023 à décembre 2025, corrigé ; la bascule de septembre 2026, déjà juste. Le
  minimum d'une pension proratisée sur la durée totale ramenée à la durée de
  proratisation jusqu'à la durée requise (2004/8 et 2005/36), corrigé. La clause de
  sauvegarde de 2023, déjà corrigée. Les 77 circulaires de 2023 à 2026, rangées au
  registre. Détail : docs/feuille_de_route/175/2026-11-22-ecarts-des-circulaires-2023-2026.md.
reste: >-
  L'assiette AVPF de 2026 (Smic de janvier contre celui de juillet 2025), soumise au
  propriétaire ; les écarts moyens du récapitulatif des circulaires.
