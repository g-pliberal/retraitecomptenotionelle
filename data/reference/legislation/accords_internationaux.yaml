# Les accords qui coordonnent les retraites françaises avec celles d'un autre
# État ou d'un territoire (le domaine des carrières hors de France,
# docs/architecture.md, § 11). Lu le 1er octobre 2026.
# ===========================================================================
#
# Ce tableau dit, pour chaque État où une période a pu être accomplie, quel
# accord la fait compter dans une pension française, et depuis quand. Ce que
# l'accord en fait est dans les fiches : `totalisation_des_periodes_etrangeres`
# (ce qui compte pour le taux et l'ouverture des droits), `pension_proratisee`
# (la pension nationale contre la pension proratisée) et
# `minimum_contributif_international` (le minimum et son écrêtement).
#
# Chaque État a pour clé son code ISO 3166-1 à deux lettres ; le Québec, qui a
# son entente, QC, et le Kosovo XK, le code d'usage. `OI` désigne
# l'affiliation au régime de pension d'une institution européenne ou d'une
# organisation internationale à laquelle la France est partie (L. 161-19-1).
# Un État absent du tableau n'est lié à la France par aucun accord qui
# coordonne les retraites : seule son activité d'avant le 1er avril 1983 peut
# compter, pour le taux, comme période reconnue équivalente (R. 351-4, 1°).
# Madagascar en est : sa convention du 8 mai 1967 « ne contient aucune
# disposition de coordination pour les branches [...] vieillesse et
# survivant » (CLEISS).
#
# Les collectivités d'outre-mer qui ont leur régime — la Nouvelle-Calédonie
# (décrets n° 66-846 et 2002-1371), la Polynésie française (décret
# n° 94-1146), Mayotte (décret n° 2005-1050), Saint-Pierre-et-Miquelon
# (depuis le 1er juin 2011) — n'y sont pas : leurs régimes sont des régimes
# du modèle (`cafat_nouvelle_caledonie`, `cps_polynesie`, `cssm_mayotte`,
# `cps_saint_pierre_et_miquelon`, et `wallis_et_futuna`), qu'une ligne de
# carrière déclare, et leurs trimestres comptent déjà dans la durée tous
# régimes, ce que leur coordination produit (fiche
# `totalisation_des_periodes_etrangeres`).
#
# Les accords d'un État se suivent dans l'ordre. Chacun vaut pour une pension
# qui prend effet de `de` à `a`, exclu (`liquidation.date_effet`) : c'est
# l'accord en vigueur à la date d'effet qui s'applique, et il prend en compte
# les périodes accomplies avant lui (règlement 883/2004, article 87 ;
# circulaire Cnav 117/83 ; exposés de la Cnav, « Calcul de la retraite
# personnelle dans le cadre des accords internationaux »).
#
#   instrument   reglements_europeens — les règlements de coordination de
#                l'Union européenne, de l'Espace économique européen et de la
#                Suisse ; accord_de_commerce_et_de_cooperation — le protocole
#                de coordination conclu avec le Royaume-Uni (article SSC.47) ;
#                convention — un accord bilatéral de sécurité sociale ;
#                organisation_internationale — L. 161-19-1.
#   calcul       comparaison — la pension nationale, sur les seules périodes
#                françaises, contre la pension par totalisation-proratisation ;
#                la plus élevée est servie (type 3 du CLEISS, et les
#                règlements) ; calcul_separe — la pension nationale, les
#                périodes de l'autre État comptées pour le taux (type 2) ;
#                option — l'assuré choisit l'un ou l'autre (type 1) ;
#                taux_seul — les périodes ne comptent que pour le taux
#                (organisations internationales) ; non_lu — la convention
#                d'avant l'entrée de l'État dans l'Union, dont le mode de
#                calcul n'a pas été lu.
#   prorata      limite — la durée totale est ramenée à la durée maximum du
#                régime général, comme l'exposé de la Cnav l'écrit ; non_lu —
#                l'exposé ne le dit pas ; absent quand le calcul n'a pas de
#                prorata (calcul séparé, taux seul).
#   personnes    salaries, ou salaries_et_non_salaries : les assurés que
#                l'accord vise. Une convention qui ne vise que les salariés ne
#                coordonne ni la sécurité sociale des indépendants ni les
#                professions libérales.
#   etats_tiers  les États tiers dont la convention totalise aussi les
#                périodes : ceux qu'un accord qui coordonne les retraites lie
#                aux deux parties, tels que la page du CLEISS les énumère en
#                2026, à la date que dit `etats_tiers_le` (sans date pour
#                l'Inde) ; absent quand elle n'en totalise aucun. Hors de ces
#                États, la caisse ne totalise que les périodes d'un accord à
#                la fois, celui qui lui est le plus favorable (fiche
#                `totalisation_des_periodes_etrangeres`).
#   etats_tiers_lus  les listes plus anciennes qu'une source date : `le`, sa
#                date, `etats`, la liste, `source`. Une pension prend la
#                dernière liste lue au plus tard à sa date d'effet, la plus
#                ancienne avant toutes : un État tiers que la liste d'une date
#                ne nomme pas n'y compte pas, et ce qui s'est passé entre
#                deux listes n'est pas connu. Le Maroc, l'Uruguay et le Brésil
#                en ont une. L'annexe 1 de la circulaire Cnav n° 2020/30 du
#                11 septembre 2020 date chaque instrument qui lie au Canada et
#                à la France les États de sa liste — la même qu'en 2026 — :
#                tous en vigueur avant l'accord de 2013. La circulaire
#                n° 2011/80 du 9 novembre 2011 écrit, de l'Inde, « à ce jour,
#                la liste de ces pays n'est pas connue ». Une période dans un
#                État tiers ne compte, de plus, que si son propre accord avec
#                la France est alors en vigueur.
#   date_lue     faux quand la date n'est pas celle de l'entrée en vigueur lue
#                dans une source, mais une borne déduite (la publication).
#   sources      cnav — le nom de l'exposé dans la base législative de la Cnav
#                (https://legislation.lassuranceretraite.fr/#/expose?file_leaf_ref=…) ;
#                cleiss — la page du CLEISS (https://www.cleiss.fr/docs/textes/…).
#
# Hors de ses accords, un État peut dire :
#
#   salaire_moyen  les activités dont le régime calcule sa pension sur les
#                salaires, les revenus ou les cotisations d'au moins quinze
#                ans, que la Cnav tient pour « équivalant au régime général et
#                aux régimes alignés » : sous les règlements européens, leurs
#                périodes réduisent avec celles des régimes alignés les années
#                du salaire annuel moyen de la pension proratisée, quand la
#                fiche `pension_proratisee` les réduit (R. 173-4-3 ;
#                circulaire ministérielle DSS/3A/DACI/2008/219 du 3 juillet
#                2008). Les activités sont celles du tableau de la circulaire
#                Cnav n° 2012/26 du 14 mars 2012, qui « se substitue » à ceux
#                des circulaires n° 2008/58 et 2010/30 — colonnes « Equivalence
#                régime de base général » et « Equivalence régimes de non
#                salariés » — ; la Croatie, celles de la circulaire n° 2013/56
#                du 19 décembre 2013, sa pension « déterminé[e] sur l'ensemble
#                de la carrière ». `periodes_depuis` : le premier jour des
#                périodes qui comptent — l'Italie, son « nouveau système »,
#                les périodes « accomplies après le 1er janvier 1996 »
#                (circulaire de 2008) ; `pensions_depuis` : la première date
#                d'effet des pensions qui les comptent — l'Italie, « à compter
#                du 1er janvier 2011 » (circulaire n° 2012/26). Absent : un
#                régime que le tableau ne tient pas pour équivalent — celui
#                d'un État qui sert sa pension sur la résidence, ou la calcule
#                sur moins de quinze ans —, ou un État hors des règlements.
#
# Les règlements européens coordonnent tous les régimes légaux français, de
# base et complémentaires (annexe XI, France, point 3), et, depuis le
# 25 octobre 1998 seulement, les régimes spéciaux des fonctionnaires
# (règlement 1606/98) ; les conventions bilatérales, le régime général et les
# régimes qui s'en liquident ensemble (sauf les exceptions que la fiche
# déclare).

