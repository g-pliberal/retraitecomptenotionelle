  # --- Écarts structurels au principe contributif --------------------------
  #
  # Ces trois lignes ne s'additionnent ni entre elles ni aux six familles
  # ci-dessus : elles portent sur la même pension, vue sous un autre angle.

  - code: decote_surcote_non_actuarielles
    libelle: Décote et surcote qui ne sont pas actuarielles
    famille: ecarts_structurels
    alias: [decote_surcote]
    quoi: >-
      Un barème actuariel ferait payer au départ anticipé exactement ce qu'il
      coûte : moins d'années de cotisation, et une rente à servir plus
      longtemps. La décote française, 1,25 % par trimestre manquant, est
      inférieure à ce coût ; la surcote, au même taux, est inférieure à ce que
      l'année de plus rapporte. Partir tôt est donc subventionné par ceux qui
      partent tard, et cette subvention n'a aucun nom dans le droit.
    base_legale: [R. 351-27 CSS, L. 14 CPCMR, L. 351-1-2 CSS, D. 351-1-4 CSS]
    veille: [decote_regime_general, decote_fonction_publique, surcote_regime_general, surcote_fonction_publique]
    creation: 1983
    fin: null
    regimes: tous
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Ce n'est pas un droit gratuit qu'on retire, c'est un BARÈME qu'on
      remplace. Dans un compte notionnel il n'y a ni décote ni surcote : le
      coefficient de conversion fait le travail, et il est actuariel par
      construction.
    sans_chiffre: >-
      un barème ne se retire pas, il se remplace : ce n'est pas un montant
      mais un écart de règle, et le §4 ter du document le chiffre
    cout:
      mesurable_par: modele
      note: >-
        CHIFFRÉ, mais pas par un retrait : on ne retire pas un barème, on le
        remplace. La mesure compare donc ce que coûte une année d'anticipation
        sous le droit en vigueur et sous le coefficient de conversion notionnel,
        qui est actuariel par construction.
        LE RÉSULTAT RENVERSE L'INTUITION, et il tient au PLAFOND de vingt
        trimestres de l'article L. 14. Sur un fonctionnaire sédentaire de la
        génération 1965, âge de référence 64,5 ans : partir à 62,5 ans laisse
        81,7 % de la pension sous le droit actuel contre 84,0 % sous le
        notionnel — le droit est PLUS DUR de 2,3 points ; à 59,5 ans, 59,1 %
        contre 65,5 %, plus dur de 6,4 points. Puis la décote bute sur son
        plafond, et le rapport s'inverse : à 56,5 ans le droit est plus doux de
        1,5 point, à 54,5 ans de 5,1 points, à 52,5 ans de 7,6 points.
        AUTREMENT DIT : la décote surpunit l'anticipation ordinaire et
        sous-punit l'anticipation extrême. Or l'anticipation extrême est
        exactement celle de la catégorie active (cinq ans), de la super-active
        (dix), de la conduite SNCF (douze) et des militaires (vingt). Le barème
        est donc le plus clément précisément là où il devrait l'être le moins,
        et c'est ce que `--duree` retrouve par un autre chemin.

  - code: rendement_superieur_au_rendement_d_equilibre
    libelle: Rendement servi supérieur à ce que l'assiette peut porter
    famille: ecarts_structurels
    quoi: >-
      C'est le plus gros des trois, et le moins visible : même sans aucun droit
      gratuit, même avec un barème d'âge actuariel, une pension en annuités
      n'est pas bornée par la cotisation versée. Elle est calculée sur un
      salaire de référence et une durée, non sur un compte. Un compte notionnel,
      lui, ne peut servir que ce que l'assiette porte.
    base_legale: []
    veille: []
    creation: 1945
    fin: null
    regimes: tous
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Ce n'est pas un dispositif : c'est la différence entre deux règles de
      calcul. Il ne se retire pas, il se remplace — et le remplacement EST le
      scénario 2.
    sans_chiffre: >-
      c'est l'écart entre deux règles de calcul, que le scénario 2 mesure tout
      entier : 307,5 milliards en part salariale
    cout:
      mesurable_par: modele
      note: >-
        CHIFFRÉ, et c'est de très loin le plus gros de toute la liste — mais ce
        n'est pas un retrait, c'est un REMPLACEMENT de règle, et le remplacement
        EST le scénario 2. `cout.py` en donne le rapport : la masse du scénario 2
        vaut 27,9 % de celle du scénario 1 en 2024, soit un écart de 72,1 %, ou
        307,5 Md€ sur une dépense de 426,7.
        DEUX LECTURES, et il faut donner les deux. Le scénario 2 ne porte au
        compte que la part SALARIALE : l'écart de 307,5 Md€ mesure donc ce que
        les pensions dépassent la cotisation de l'assuré lui-même. Le scénario 4
        y ajoute la part patronale, et l'écart tombe à 133,7 Md€ — 31,3 % de la
        dépense. La seconde est la comparaison honnête avec « ce qui a été
        cotisé », la première avec « ce que l'assuré a lui-même supporté ».
        NE PAS L'ADDITIONNER aux lignes de dispositifs : celles-ci sont
        comprises dedans, puisqu'un compte notionnel les supprime aussi.

  - code: financement_non_contributif_des_regimes
    libelle: Impôts, subventions d'équilibre et compensation démographique
    famille: ecarts_structurels
    quoi: >-
      Une part des pensions n'est pas payée par des cotisations mais par
      l'impôt : subventions d'équilibre des régimes spéciaux (SNCF, RATP, mines,
      marins), contribution de l'État employeur portée jusqu'à 82,28 % du
      traitement en 2026, impôts et taxes affectés compensant les allègements,
      compensation démographique entre régimes.
    base_legale: []
    veille: []
    creation: 1945
    fin: null
    regimes: régimes spéciaux, fonction publique, tous par les impôts affectés
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Ce n'est pas un droit de l'assuré : c'est une RECETTE. Elle n'apparaît
      donc jamais dans une pension individuelle, seulement au compte du régime.
      Le modèle la porte du côté des cotisations
      (`legislation/contribution_employeur_public.csv`, neuf régimes certifiés),
      pas du côté des droits.
    sans_chiffre: >-
      c'est une RECETTE, elle n'apparaît dans aucune pension : les cotisations
      ne font que 65,6 % des ressources du système en 2025
    cout:
      mesurable_par: serie_publiee
      source_id: cor_comptes_systeme_retraite
      note: >-
        CHIFFRÉ, et lu plutôt que calculé — c'est une RECETTE, elle n'apparaît
        dans aucune pension individuelle. `macro/structure_ressources_retraite.csv`
        le donne poste par poste : en 2025, les cotisations ne font que 65,6 %
        des ressources du système. Le reste se partage entre les impôts et taxes
        affectés (15,3 %), la contribution d'équilibre de l'État employeur
        (11,7 %), les transferts d'autres organismes (3,9 %), les subventions
        d'équilibre des régimes spéciaux (1,8 %) et d'autres produits (1,7 %).
        DEUX RÉSERVES. Les impôts et taxes compensent pour l'essentiel des
        exonérations de cotisations : les compter comme un financement non
        contributif reviendrait à traiter une cotisation remboursée autrement
        que la cotisation elle-même. Et les transferts sont déjà comptés du côté
        des prestations, sous l'AVPF et la majoration pour enfants. Le noyau
        indiscutable est donc la contribution d'équilibre et les subventions,
        13,5 % des ressources.
