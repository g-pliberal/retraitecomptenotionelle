    cout:
      mesurable_par: modele
      note: >-
        C'est l'avantage d'âge le plus extrême du système : le coefficient de
        conversion à trente-huit ans est plus du double de celui de soixante-
        quatre ans.

  - code: bonification_cinquieme_militaires
    libelle: Bonification du cinquième du temps de service des militaires
    famille: age_et_bonifications
    quoi: >-
