  # --- Droits dérivés (survivants) -----------------------------------------

  - code: reversion
    libelle: Pension de réversion
    famille: droits_derives
    quoi: >-
      Une fraction de la pension du défunt — 54 % au régime général sous
      condition de ressources, 60 % à l'Agirc-Arrco sans condition mais sous
      condition d'âge, 50 % dans la fonction publique sans condition de
      ressources — versée au conjoint survivant. C'est, de très loin, la
      première dépense non contributive du système.
    base_legale: [L. 353-1 CSS, L. 38 CPCMR]
    veille: [reversion]
    creation: 1945
    fin: null
    regimes: tous — déclaré dans 756 périodes du catalogue, soit la quasi-totalité
    etat_modele: declare
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Le modèle décrit une CARRIÈRE, pas un ménage : il n'a ni conjoint, ni date
      de décès, ni ressources du survivant. Les 756 déclarations des fiches sont
      donc une intention — aucun code ne les lit. C'est l'écart le plus lourd
      entre les trois listes du dépôt et le droit positif.
    cout:
      mesurable_par: serie_publiee
      source_id: drees_panorama_retraites
      note: >-
        Le seul avantage de la liste dont le coût se lise DIRECTEMENT dans une
        publication annuelle : la DREES publie la masse des droits dérivés, par
        régime et par sexe, dans le panorama « Les retraités et les retraites ».
        Aucun recalcul n'est nécessaire, et aucun n'est possible.

  - code: majoration_reversion
    libelle: Majoration de la pension de réversion
    famille: droits_derives
    quoi: >-
      Un pourcentage de la réversion ajouté au survivant qui a atteint l'âge
      d'annulation de la décote et dont l'ensemble des avantages de retraite ne
      dépasse pas un plafond, réduite à due concurrence du dépassement.
    base_legale: [L. 353-6 CSS]
    veille: [reversion]
    creation: 2010
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: "Même raison que la réversion : le modèle n'a pas de ménage."
    cout:
      mesurable_par: serie_publiee
      source_id: drees_panorama_retraites
      note: Comprise dans la masse des droits dérivés, rarement isolée.

  - code: majoration_forfaitaire_reversion_enfants
    libelle: Majoration forfaitaire de réversion pour enfant à charge
    famille: droits_derives
    quoi: >-
      Un montant forfaitaire par enfant à charge, ajouté à la pension de
      réversion du conjoint survivant qui n'a pas atteint l'âge de la retraite.
    base_legale: [L. 353-1 CSS]
    veille: [reversion]
    creation: 2010
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: Même raison que la réversion.
    cout:
      mesurable_par: serie_publiee
      source_id: drees_panorama_retraites
      note: Comprise dans la masse des droits dérivés.

  - code: allocation_veuvage
    libelle: Allocation veuvage
    famille: droits_derives
    quoi: >-
      Une allocation temporaire au conjoint survivant trop jeune pour la
      réversion, sous condition de ressources, servie deux ans au plus.
    base_legale: [L. 356-1 CSS]
    veille: [reversion]
    creation: 1980
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: absent
    ligne_cascade: null
