# Tous les avantages non contributifs que sert le scénario 1
# ===========================================================
# source_id: legifrance_textes, cor_septieme_rapport, dss_ccss_transferts_retraite
#
# CE QUE CE FICHIER EST
# ---------------------
# Le scénario 1 est le droit en vigueur. Un compte notionnel ne sert que ce
# qui a été cotisé. Tout ce qui sépare les deux est ici, sous un code, avec sa
# base légale, les régimes qui le servent, l'état du modèle à son égard et le
# moyen d'en chiffrer le coût.
#
# C'est la liste qui manquait. Le dépôt en portait trois, partielles et
# discordantes, et aucune ne disait ce que chaque ligne coûte :
#
#   1. `Neutralisations` (src/retraite_notionnelle/config.py) — quinze champs
#      booléens, DÉCLARATIFS, qu'aucun moteur ne lit. Elle mélange des droits
#      (le minimum contributif) et des mécanismes (la décote et la surcote),
#      et son docstring annonçait des lignes que le moteur ne sert pas.
#   2. `avantages_non_contributifs` des fiches de régime
#      (data/reference/regimes/*.yaml) — seize codes, DATÉS et par régime,
#      que le moteur lit vraiment, mais dont six ne commandent aucun calcul.
#   3. La cascade `AvantageApplique`
#      (src/retraite_notionnelle/scenarios/actuel.py) — sept codes, et les
#      seuls CHIFFRÉS en euros : c'est la seule des trois qui réponde à
#      « combien ».
#
# Ce fichier est l'union des trois, complétée de ce qu'aucune des trois ne
# porte — la réversion, les bonifications de service, les départs anticipés
# pour handicap, inaptitude, incapacité et amiante, la majoration pour tierce
# personne —, et il ajoute à chaque ligne ce qu'il faut pour la chiffrer. Un
# test (tests/test_avantages.py) exige que tout code employé par l'une des
# trois listes ait sa ligne ici.
#
# CE QU'IL N'EST PAS
# ------------------
# Il ne chiffre rien lui-même. Il dit, ligne par ligne, PAR QUOI le coût se
# mesure : le modèle quand la cascade l'isole, une série publiée quand elle
# existe, rien du tout quand personne ne publie. Les trois cas sont nommés, et
# le troisième est une limite, pas un oubli.
#
# ÉTAT DU MODÈLE — quatre valeurs, et elles ne se valent pas
# -----------------------------------------------------------
#   chiffre  : le scénario 1 le sert ET la cascade en isole le montant en
#              euros. La somme des lignes chiffrées vaut EXACTEMENT
#              `pension_annuelle - total_contributif` : c'est vérifié.
#   integre  : le scénario 1 le sert, mais son effet passe par un trimestre,
#              un âge ou une assiette, et ne se sépare pas du contributif sans
#              recalculer la pension une seconde fois, avantage retiré.
#   declare  : une fiche de régime le déclare, le moteur ne le sert pas. La
#              déclaration est alors une INTENTION, et ce fichier le dit.
#   absent   : ni déclaré ni servi. C'est un écart au droit positif, et
#              `docs/limites.md` en répond.
#
# COMMENT LE COÛT SE MESURE — trois valeurs
# ------------------------------------------
#   modele        : la cascade donne le montant par cas type et par
#                   génération ; `cout.py` sait déjà en faire une masse
#                   annuelle, ancrée sur la dépense observée.
#   serie_publiee : un organisme publie la dépense, en série. `source_id`
#                   renvoie au manifeste data/sources.yaml.
#   aucune        : personne ne publie, et le modèle ne le sert pas. Le coût
#                   est inconnu, et l'écrire est plus utile que de l'estimer.
#
# L'ORDRE DE GRANDEUR D'ENSEMBLE, mesuré par quelqu'un d'autre
# -------------------------------------------------------------
# Le COR, dans le rapport commandé par l'article 75 de la LFSS 2009 (27 janvier
# 2010, source `cor_septieme_rapport`), chiffre les droits versés au titre de
# la solidarité — droits familiaux, chômage, maladie, invalidité, minimum
# contributif ou garanti — à « de l'ordre d'un cinquième des retraites tous
# régimes ». C'est le seul contrôle externe du total, et il ne couvre ni la
# réversion ni les bonifications de service.

familles:
  droits_familiaux:
    libelle: Droits familiaux
    quoi: >-
      Ce que la naissance ou l'éducation d'un enfant ajoute à la pension, sans
      qu'aucune cotisation supplémentaire ne l'ait payée : des trimestres, un
      pourcentage, une assiette portée au compte, un salaire de référence
      calculé sur moins d'années.
  minima_de_pension:
    libelle: Minima de pension
    quoi: >-
      Un plancher opposé au résultat du calcul contributif. Ce que le plancher
      ajoute n'a jamais été cotisé : c'est la définition même d'un minimum.
  periodes_non_cotisees:
    libelle: Périodes non cotisées mais validées
    quoi: >-
      Chômage, maladie, maternité, invalidité, accident du travail, service
      national : des trimestres, et parfois des points de complémentaire, que
      la période ouvre sans qu'un salaire les ait portés.
  droits_derives:
    libelle: Droits dérivés (survivants)
    quoi: >-
      Ce que le décès de l'assuré ouvre au conjoint survivant et aux orphelins.
      Non contributif au sens strict : la cotisation de l'assuré a déjà été
      rendue par sa propre pension.
  age_et_bonifications:
    libelle: Âge de départ et bonifications de service
    quoi: >-
      Partir plus tôt sans que la pension en soit diminuée à proportion, ou
      compter plus d'années qu'on n'en a servies. C'est l'avantage le plus
      coûteux et le moins visible : il ne s'affiche sur aucun bulletin de
      pension comme une ligne.
  autres_avantages:
    libelle: Majorations diverses
    quoi: >-
      Ce qui ne relève d'aucune des cinq familles précédentes, y compris les
      dispositifs éteints, qu'il faut garder pour lire les séries anciennes.
  ecarts_structurels:
    libelle: Écarts structurels au principe contributif
    quoi: >-
      Ce ne sont pas des DISPOSITIFS, et aucune caisse ne les liquide sous un
      nom. Ce sont les trois façons dont une pension excède la cotisation sans
      qu'aucun droit gratuit ne soit en cause : un barème d'âge qui n'est pas
      actuariel, un rendement supérieur à ce que l'assiette peut porter, un
      régime dont l'équilibre est payé par l'impôt. Ils sont ici parce qu'on ne
      peut pas dire sans eux pourquoi les pensions actuelles dépassent ce qui a
      été cotisé, et ce sont eux que le scénario 2 mesure. Ils ne s'ADDITIONNENT PAS aux six familles ci-dessus : ils
      portent sur la même pension, et les compter ensemble serait un double
      compte.

avantages:

  # --- Droits familiaux ----------------------------------------------------

  - code: majoration_duree_assurance
    libelle: Majoration de durée d'assurance pour enfants (MDA)
    famille: droits_familiaux
    alias: [mda]
    quoi: >-
      Jusqu'à huit trimestres par enfant au régime général et dans les régimes
      alignés — quatre au titre de la maternité, quatre au titre de l'éducation.
      Ils ne sont pas cotisés : ils effacent de la décote et relèvent le
      prorata, sans rien ajouter au salaire de référence.
    base_legale: [L. 351-4 CSS, L. 351-5 CSS]
    veille: [majoration_duree_assurance_enfants]
    creation: 1972
    fin: null
    regimes: régime général, régimes alignés, non-salariés
    etat_modele: chiffre
    ligne_cascade: majoration_duree_assurance
    cout:
      mesurable_par: modele
      note: >-
        Chiffrée par différence : la pension est recalculée sans les trimestres
        d'enfants, et l'écart est la ligne. C'est le bon ordre — la MDA agit
        AVANT la majoration de 10 % et avant le minimum.

  - code: bonification_enfants_fonction_publique
    libelle: Bonification pour enfants de la fonction publique
    famille: droits_familiaux
    alias: [bonifications]
    quoi: >-
      Un an par enfant né avant le 1er janvier 2004, sous condition
      d'interruption d'activité ; deux trimestres pour les enfants nés depuis.
      C'est le pendant de la MDA pour les fonctionnaires, qui ne l'ont pas.
    base_legale: [L. 12 b et b bis CPCMR, L. 12 bis CPCMR]
    veille: [majoration_duree_assurance_enfants]
    creation: 1964
    fin: null
    regimes: fonction publique, régimes spéciaux
    etat_modele: chiffre
    ligne_cascade: majoration_duree_assurance
    cout:
      mesurable_par: modele
      note: >-
        Même ligne de cascade que la MDA — le libellé rendu change avec le
        dispositif. Les séparer suppose de ventiler la masse par régime, ce que
        la pondération par effectifs de caisse permet déjà.

  - code: majoration_enfants
    libelle: Majoration de pension pour trois enfants et plus
    famille: droits_familiaux
    quoi: >-
      Dix pour cent de la pension, à partir du troisième enfant, au père comme
      à la mère, dans presque tous les régimes de base ; l'Agirc-Arrco sert la
      sienne, plafonnée. Non imposable jusqu'en 2013. Elle est proportionnelle
      à la pension, donc croissante avec le revenu : c'est le seul avantage
      familial dont le montant augmente avec le salaire.
    base_legale: [L. 351-12 CSS, L. 18 CPCMR, accord national interprofessionnel Agirc-Arrco]
    veille: [majoration_dix_pour_cent]
    creation: 1945
    fin: null
    regimes: tous les régimes de base, Agirc-Arrco, Ircantec
    etat_modele: chiffre
    ligne_cascade: majoration_enfants
    cout:
      mesurable_par: modele
      source_id: dss_ccss_transferts_retraite
      note: >-
        Doublement mesurable, et c'est un contrôle : le modèle la chiffre par
        cas type, et la CNAF publie ce qu'elle rembourse à la CNAV sous le
        poste `cnaf_majorations` de transferts_retraite.csv (4,4 Md€ en 2011).
        Les deux ne couvrent pas le même champ — le transfert ne porte que le
        régime général — mais ils doivent varier ensemble.

  - code: avpf
    libelle: Assurance vieillesse des parents au foyer
    famille: droits_familiaux
    alias: [assurance_vieillesse_parents_au_foyer]
    quoi: >-
      La CNAF cotise à l'assurance vieillesse, sur une assiette égale au SMIC,
      pour le parent qui interrompt ou réduit son activité. Ce n'est pas un
      trimestre gratuit : c'est une cotisation, versée par un tiers, qui entre
      au salaire de référence. D'où son effet, plus fort que celui de la MDA
      sur les carrières courtes.
    base_legale: [L. 381-1 CSS]
    veille: [avpf]
    creation: 1972
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: chiffre
    ligne_cascade: avpf
    cout:
      mesurable_par: modele
      source_id: dss_ccss_transferts_retraite
      note: >-
        Même double mesure que la majoration pour enfants : poste `cnaf_avpf`
        (4,4 Md€ en 2011). La série publiée donne la COTISATION versée l'année
        courante, le modèle donne la PENSION qu'elle produit des décennies plus
        tard — ne jamais les additionner, ni les comparer à la même date.

  - code: surcote_parentale
    libelle: Surcote parentale
    famille: droits_familiaux
    quoi: >-
      1,25 % par trimestre, quatre au plus, à qui détient au moins un trimestre
      de majoration pour enfants et avait sa durée requise à 63 ans. C'est la
      contrepartie directe du recul de l'âge légal de 2023 : elle paie l'année
      que la surcote ordinaire ne récompensait pas.
    base_legale: [L. 351-1-2-1 CSS]
    veille: [surcote_parentale]
    creation: 2023
    fin: null
    regimes: régime général, régimes alignés, fonction publique
    etat_modele: chiffre
    ligne_cascade: surcote_parentale
    sans_chiffre: >-
      créée en 2023, elle ne paie que des pensions prenant effet à compter de
      2026 : rien à mesurer sur les années publiées
    cout:
      mesurable_par: modele
      note: >-
        Montée en charge par génération : rien avant 1964, un trimestre pour
        1965, quatre à partir de 1968. La série de coût ne commence donc qu'en
        2027 et croît jusqu'en 2032.

  - code: salaire_de_reference_des_parents
    chiffre_par: scripts/cout_avantages.py
    libelle: Salaire annuel moyen calculé sur moins d'années pour les parents
    famille: droits_familiaux
    quoi: >-
      Vingt-quatre meilleures années pour un enfant, vingt-trois pour deux et
      plus, au lieu de vingt-cinq. Retirer une mauvaise année de la moyenne
      relève la pension sans qu'aucune cotisation l'ait payée.
    base_legale: [R. 173-3-2 I CSS (décret n° 2026-699 du 29 juillet 2026, article 1er)]
    veille: [sam_parents_24_23]
    creation: 2026
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      L'avantage porte sur l'ASSIETTE, pas sur le montant : il change le salaire
      de référence avant tout le reste. L'isoler suppose de recalculer la
      pension sur vingt-cinq années et de prendre l'écart — faisable, et c'est
      exactement la mécanique des lignes chiffrées.
    sans_chiffre: >-
      ne s'applique qu'aux pensions prenant effet à compter de septembre 2026,
      quand la dernière dépense publiée est celle de 2024
    cout:
      mesurable_par: modele
      note: >-
        CHIFFRÉ, par recalcul : la date d'entrée en vigueur est repoussée hors
        de portée, et le salaire de référence repasse à vingt-cinq années. Le
        retrait vaut 729 € par an à la carrière interrompue de la génération
        1985, et 451 € à celle de 1965.
        ZÉRO SUR LA FENÊTRE PUBLIÉE, et ce n'est pas un défaut de mesure : la
        règle ne s'applique qu'aux pensions prenant effet à compter du 1er
        septembre 2026, et la dernière dépense publiée est celle de 2024. La
        première génération concernée de la grille, 1965, liquide en 2027.

  - code: majoration_duree_assurance_conge_parental
    libelle: Majoration de durée d'assurance pour congé parental d'éducation
    famille: droits_familiaux
    quoi: >-
      La durée effective du congé parental est ajoutée à la durée d'assurance,
      quand elle est plus favorable que la MDA de l'article L. 351-4. Les deux
      ne se cumulent pas : le droit retient la plus avantageuse.
    base_legale: [L. 351-5 CSS]
    veille: [majoration_duree_assurance_enfants]
    creation: 1977
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Le simulateur ne saisit pas la durée du congé parental, seulement le
      nombre d'enfants. La comparaison « la plus avantageuse des deux » est
      donc hors d'atteinte des carrières que le modèle construit.
    sans_chiffre: >-
      le simulateur saisit un nombre d'enfants, pas la durée d'un congé
      parental : la comparaison « la plus avantageuse des deux » lui échappe
    cout:
      mesurable_par: aucune
      note: >-
        Demanderait un champ de carrière nouveau. L'effet est borné par le
        haut : il ne peut jamais valoir moins que la MDA, qui est déjà servie.

  - code: majoration_duree_assurance_enfant_handicape
    libelle: Majoration de durée d'assurance pour enfant handicapé
    famille: droits_familiaux
    quoi: >-
      Un trimestre par période de trente mois d'éducation d'un enfant ouvrant
      droit à l'allocation d'éducation de l'enfant handicapé, huit au plus, sans
      préjudice de la MDA ordinaire — les deux se cumulent, contrairement au
      congé parental.
    base_legale: [L. 351-4-1 CSS]
    veille: []
    creation: 2003
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Demande une information médicale que le simulateur ne collecte pas, comme
      la retraite anticipée pour handicap.
    sans_chiffre: >-
      demande une information médicale que le modèle ne collecte pas, et aucun
      poste des comptes ne l'isole
    cout:
      mesurable_par: aucune
      note: Population étroite ; le coût est probablement le plus faible de la famille.

  # --- Minima de pension ---------------------------------------------------

  - code: minimum_contributif
    libelle: Minimum contributif, et sa majoration
    famille: minima_de_pension
    quoi: >-
      Un plancher opposé à la pension de base liquidée au taux plein,
      proratisé par la durée d'assurance ; sa majoration, elle, est proratisée
      par la durée COTISÉE. Le tout est écrêté par l'article L. 173-2 quand
      l'ensemble des pensions personnelles dépasse un plafond.
    base_legale: [L. 351-10 CSS, D. 351-2-1 CSS, L. 173-2 CSS]
    veille: [minimum_contributif]
    creation: 1983
    fin: null
    regimes: régime général, régimes alignés, non-salariés
    etat_modele: chiffre
    ligne_cascade: minimum_contributif
    cout:
      mesurable_par: modele
      note: >-
        Le seul avantage dont le coût DÉCROÎT quand les salaires montent : un
        plancher ne coûte que ce qui manque pour l'atteindre. Sa série doit
        donc suivre la distribution des pensions, pas la masse.

  - code: minimum_garanti
    libelle: Minimum garanti de la fonction publique
    famille: minima_de_pension
    quoi: >-
      Le plancher des pensions civiles et militaires, barème en points d'indice
      par durée de services, ouvert au taux plein — ou à qui atteignait l'âge
      d'ouverture de ses droits avant 2011.
    base_legale: [L. 17 CPCMR, loi n° 2003-775 article 66 V]
    veille: [minimum_garanti]
    creation: 1964
    fin: null
    regimes: fonction publique, régimes spéciaux
    etat_modele: chiffre
    ligne_cascade: minimum_garanti
    cout:
      mesurable_par: modele
      source_id: sre_minimum_garanti
      note: >-
        Le montant SERVI prime sur la projection : la revalorisation « comme les
        pensions » a été gelée en 2014 et sous-indexée depuis, et projeter une
        ancre certifiée sur l'IPC surestime de 4,6 % le minimum garanti de 2024.

  - code: minimum_vieillesse
    libelle: Minimum vieillesse (ASPA)
    famille: minima_de_pension
    alias: [minimum_vieillesse_aspa]
    quoi: >-
      Une allocation différentielle portée au plafond, sous condition de
      ressources du ménage, financée par l'impôt via le FSV. Ce n'est pas une
      pension : c'est un minimum social versé aux vieux, et il est ici parce
      qu'il entre dans le revenu des retraités que la comparaison mesure.
    base_legale: [L. 815-1 CSS et suivants, L. 816-2 CSS, L. 161-25 CSS]
    veille: [minimum_vieillesse]
    creation: 1956
    fin: null
    regimes: hors régime — servi par le FSV
    etat_modele: chiffre
    ligne_cascade: minimum_vieillesse
    cout:
      mesurable_par: modele
      source_id: drees_comptes_protection_sociale
      note: >-
        Le scénario 6 le remplace par la garantie vieillesse (800 €, plus 250 €
        d'isolement), chiffrée sur la distribution DREES et non sur les cas
        types : 18,4 Md€ par an aux pensions d'aujourd'hui. La même méthode
        chiffre l'ASPA actuelle, et c'est le seul avantage pour lequel la
        distribution vaut mieux que les cas types.

  - code: garantie_minimale_points
    chiffre_par: scripts/cout_avantages.py
    libelle: Garantie minimale de points de l'Agirc
    famille: minima_de_pension
    quoi: >-
      Cent vingt points par an garantis au cadre dont le salaire au-dessus du
      plafond ne suffisait pas à les acheter. Éteinte avec la fusion
      Agirc-Arrco du 1er janvier 2019.
    base_legale: [accord Agirc du 9 février 1988]
    veille: []
    creation: 1989
    fin: 2018
    regimes: Agirc
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Servie par le champ `points_minimum_annuels: 120` des fiches de régime :
      elle agit sur le NOMBRE DE POINTS acquis dans l'année, donc en amont de
      la pension, comme le salaire de référence.
    sans_chiffre: >-
      éteinte en 2018, elle ne mord que sur des carrières de cadre dont les
      premières années tombent après 1989 et qui liquident après 2024
    cout:
      mesurable_par: modele
      note: >-
        CHIFFRÉE, par recalcul : le plancher de cent vingt points est retiré des
        fiches de l'Agirc, et le cadre n'acquiert plus que ce que son salaire
        au-dessus du plafond achète. 205 € par an pour le cadre de la génération
        1985, 77 € pour celui de 1965.
        ZÉRO SUR LA FENÊTRE PUBLIÉE, pour une raison de calendrier : le plancher
        ne mord que sur les premières années d'une carrière de cadre, quand le
        salaire au-dessus du plafond est encore faible, et il n'a existé que de
        1989 à 2018. Les carrières dont les débuts tombent dans cette fenêtre
        liquident toutes après 2024.

  - code: pension_majoree_reference
    libelle: Pension majorée de référence du régime agricole
    famille: minima_de_pension
    quoi: >-
      Le plancher de la retraite forfaitaire et proportionnelle des non-salariés
      agricoles, complété depuis 2015 par la garantie « 85 % du SMIC » puis par
      le complément différentiel de points de RCO.
    base_legale: [L. 732-54-1 code rural]
    veille: []
    creation: 2002
    fin: null
    regimes: non-salariés agricoles (MSA)
    etat_modele: declare
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Déclarée dans cinq périodes de non_salaries.yaml ; aucun code du moteur ne
      la lit. `Neutralisations` la range d'ailleurs dans « ce que le scénario 1
      ne sert pas ».
    sans_chiffre: >-
      déclarée par cinq fiches du catalogue et servie par aucun code : la
      déclaration est une intention
    cout:
      mesurable_par: aucune
      note: >-
        À porter au moteur avant de pouvoir la chiffrer. Les non-salariés
        agricoles sont le régime où un plancher pèse le plus lourd, leur pension
        contributive étant la plus faible du catalogue.

  # --- Périodes non cotisées mais validées ---------------------------------

  - code: periodes_assimilees
    libelle: Périodes assimilées
    famille: periodes_non_cotisees
    quoi: >-
      Chômage indemnisé ou non, maladie, maternité, invalidité, accident du
      travail, service national : quatre trimestres validés par an, sans
      cotisation et sans salaire porté au compte. Ils comptent pour la durée
      d'assurance — donc contre la décote et pour le prorata — et jamais pour
      le salaire annuel moyen.
    base_legale: [L. 351-3 CSS, R. 351-12 CSS]
    veille: []
    creation: 1945
    fin: null
    regimes: régime général, régimes alignés, non-salariés
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      L'avantage est un TRIMESTRE, et son effet se dilue dans la décote et la
      proratisation. Le modèle le sert par
      `legislation/periodes_non_travaillees.csv`, neuf motifs, chacun disant
      combien de trimestres il assimile.
    chiffre_par: scripts/cout_avantages.py
    cout:
      mesurable_par: modele
      source_id: dss_ccss_transferts_retraite
      note: >-
        CHIFFRÉE, par recalcul : on refait la pension en donnant aux périodes
        non travaillées le motif `sans_activite`, qui ne valide rien, et l'écart
        est la ligne — l'AVPF retranchée, la cascade la portant déjà. Résultat
        sur la grille : 6,8 Md€ en 2024, la plus grosse ligne de toute la
        décomposition. Ce chiffre est un PLANCHER extrême : aucun cas type ne
        connaît le chômage, et la seule interruption de la grille est un congé
        d'éducation. Ce que les périodes assimilées valent à un assuré qui en a
        est autrement plus parlant — cinq années de chômage indemnisé au milieu
        d'une carrière au salaire moyen valent 7 154 € de pension annuelle, soit
        29 % de sa pension (`--par-carriere`). Le FSV publie ce qu'il prend en
        charge (`fsv_cotisations`, 15,9 Md€ en 2025) : c'est le contrôle externe
        de la seule part chômage.
        Un sous-produit du même recalcul sépare les deux étages : cinq années de
        chômage INDEMNISÉ valent 612 € de plus que cinq années de chômage NON
        indemnisé sur la même carrière, et cet écart est exactement la valeur des
        points de complémentaire gratuits — voir la ligne suivante.

  - code: points_gratuits_complementaires
    chiffre_par: scripts/cout_avantages.py
    libelle: Points de complémentaire acquis sans cotisation
    famille: periodes_non_cotisees
    quoi: >-
      Chômage indemnisé, maladie, maternité, invalidité, accident du travail
      ouvrent des points d'Agirc-Arrco et d'Ircantec que le salarié n'a pas
      payés ; l'Unédic verse la contrepartie pour le chômage.
    base_legale: [accords nationaux interprofessionnels Agirc-Arrco, décret Ircantec]
    veille: []
    creation: 1962
    fin: null
    regimes: Agirc-Arrco, Ircantec
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Servis par la colonne `ouvre_droits_complementaires` de
      periodes_non_travaillees.csv, qui vaut « oui » pour cinq motifs sur neuf.
      L'effet passe par le nombre de points, donc en amont de la pension.
    sans_chiffre: >-
      aucun des treize cas types ne connaît le chômage, et les comptes ne
      séparent pas ces points du reste des pensions complémentaires
    cout:
      mesurable_par: modele
      source_id: dss_ccss_transferts_retraite
      note: >-
        CHIFFRÉS, et par un détour élégant : le chômage indemnisé et le chômage
        NON indemnisé valident les mêmes quatre trimestres, et seul le premier
        ouvre des points de complémentaire. Remplacer l'un par l'autre isole
        donc exactement ces points. Sous une dose de cinq années de chômage,
        génération 1985 : 1 427 € par an au salaire moyen, 8 585 € au cadre —
        c'est sur la tranche au-dessus du plafond que la complémentaire pèse le
        plus.
        ZÉRO SUR LA GRILLE, faute de chômeur : aucun des treize cas types n'en
        connaît. Le poste `unedic_agirc_arrco` de `transferts_retraite.csv`
        donne ce que l'assurance chômage verse à ce titre, 3,8 Md€ en 2024 —
        c'est le contrôle externe le plus direct de toute la liste, un seul
        payeur pour un seul objet.

  - code: service_national
    chiffre_par: scripts/cout_avantages.py
    libelle: Validation du service national
    famille: periodes_non_cotisees
    quoi: >-
      Les périodes de service militaire légal valident quatre trimestres par an,
      sans cotisation et sans ouvrir de points de complémentaire. Dispositif en
      extinction, la conscription ayant été suspendue en 1997.
    base_legale: [L. 351-3 CSS]
    veille: []
    creation: 1945
    fin: null
    regimes: tous
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Motif `service_militaire` de periodes_non_travaillees.csv : même mécanique
      que les autres périodes assimilées, dont il n'est qu'un cas.
    sans_chiffre: >-
      aucun cas type ne porte le motif, et les comptes ne l'isolent pas
    cout:
      mesurable_par: modele
      note: >-
        CHIFFRÉ, par recalcul : l'année de service devient une année sans
        activité, qui ne valide rien. Sous une année de service à vingt ans,
        génération 1985 : 2 996 € par an au salaire moyen, 5 693 € au cadre,
        5 033 € au fonctionnaire sédentaire. Un seul trimestre de plus ou de
        moins fait basculer une décote entière, d'où des montants sans commune
        mesure avec la durée validée.
        ZÉRO SUR LA GRILLE, faute d'appelé : aucun cas type ne porte le motif.
        Dispositif en extinction — la conscription a été suspendue en 1997 — et
        la série s'éteindra d'elle-même dans les années 2030.

  # --- Droits dérivés (survivants) -----------------------------------------

  - code: reversion
    chiffre_par: scripts/fetch/drees_eacr.py
    libelle: Pension de réversion
    famille: droits_derives
    quoi: >-
      Une fraction de la pension du défunt — 54 % au régime général sous
      condition de ressources, 60 % à l'Agirc-Arrco sans condition mais sous
      condition d'âge, 50 % dans la fonction publique sans condition de
      ressources — versée au conjoint survivant. C'est, de très loin, la
      première dépense non contributive du système.
    base_legale: [L. 353-1 CSS, L. 38 CPCMR]
    veille: [reversion]
    creation: 1945
    fin: null
    regimes: tous — déclaré dans 756 périodes du catalogue, soit la quasi-totalité
    etat_modele: declare
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Le modèle décrit une CARRIÈRE, pas un ménage : il n'a ni conjoint, ni date
      de décès, ni ressources du survivant. Les 756 déclarations des fiches sont
      donc une intention — aucun code ne les lit. C'est l'écart le plus lourd
      entre les trois listes du dépôt et le droit positif.
    cout:
      mesurable_par: serie_publiee
      serie: macro/droits_derives.csv
      source_id: drees_panorama_retraites
      note: >-
        CHIFFRÉE, et c'est la seule ligne de tout l'inventaire qui se LISE au lieu de se
        calculer — la plus lourde, aussi. 38,3 Md€ en 2024, soit 9,0 % de la dépense de
        retraite, contre 25,4 Md€ en 2004. À elle seule, elle vaut trois fois tout ce
        que le modèle mesure par ailleurs.
        LA MASSE EST UN PRODUIT, lu dans l'enquête annuelle de la DREES auprès des
        caisses : le NOMBRE de bénéficiaires d'un droit dérivé (champ `ddert`) par le
        MONTANT MENSUEL MOYEN de ce droit-là (colonne `m2`), sur douze mois. La colonne
        compte : `mont` porterait la pension totale du bénéficiaire, droit direct
        compris, et doublerait la masse.
        POURQUOI ELLE NE SE CALCULE PAS : le modèle décrit une CARRIÈRE et non un
        ménage. Il n'a ni conjoint, ni date de décès, ni ressources du survivant, et les
        756 périodes du catalogue qui déclarent `reversion` sont une intention que nul
        code ne sert. Ce n'est pas une faiblesse de la mesure mais un changement de
        nature — et la lecture est, de loin, la plus sûre des deux : elle dénombre 4,4
        millions de personnes réelles là où les autres lignes reposent sur treize
        carrières types.
        LE CONTRÔLE INTERNE : la somme des vingt-cinq caisses recoupe la ligne « tous
        régimes » à 2 % près. Les effectifs, eux, ne s'additionnent pas — un
        polypensionné touche une réversion à la Cnav ET à l'Agirc-Arrco, et la somme des
        caisses compte deux fois la même veuve, 8,5 millions contre 4,4.
        Série : `data/reference/macro/droits_derives.csv`, 305 valeurs certifiées de
        2004 à 2024.

  - code: majoration_reversion
    libelle: Majoration de la pension de réversion
    famille: droits_derives
    quoi: >-
      Un pourcentage de la réversion ajouté au survivant qui a atteint l'âge
      d'annulation de la décote et dont l'ensemble des avantages de retraite ne
      dépasse pas un plafond, réduite à due concurrence du dépassement.
    base_legale: [L. 353-6 CSS]
    veille: [reversion]
    creation: 2010
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: "Même raison que la réversion : le modèle n'a pas de ménage."
    cout:
      mesurable_par: serie_publiee
      source_id: drees_panorama_retraites
      note: Comprise dans la masse des droits dérivés, rarement isolée.

  - code: majoration_forfaitaire_reversion_enfants
    libelle: Majoration forfaitaire de réversion pour enfant à charge
    famille: droits_derives
    quoi: >-
      Un montant forfaitaire par enfant à charge, ajouté à la pension de
      réversion du conjoint survivant qui n'a pas atteint l'âge de la retraite.
    base_legale: [L. 353-1 CSS]
    veille: [reversion]
    creation: 2010
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: Même raison que la réversion.
    sans_chiffre: >-
      comprise dans le poste « majorations sur pensions de réversion » des
      comptes, qui ne la sépare pas de la majoration principale
    cout:
      mesurable_par: serie_publiee
      source_id: drees_panorama_retraites
      note: Comprise dans la masse des droits dérivés.

  - code: allocation_veuvage
    libelle: Allocation veuvage
    famille: droits_derives
    quoi: >-
      Une allocation temporaire au conjoint survivant trop jeune pour la
      réversion, sous condition de ressources, servie deux ans au plus.
    base_legale: [L. 356-1 CSS]
    veille: [reversion]
    creation: 1980
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: Même raison que la réversion.
    sans_chiffre: >-
      rangée dans le poste « autres droits dérivés » des comptes, qui ne
      l'isole pas
    cout:
      mesurable_par: serie_publiee
      source_id: drees_comptes_protection_sociale
      note: Masse faible ; publiée avec les prestations survie.

  - code: pension_orphelin
    libelle: Pension d'orphelin
    famille: droits_derives
    quoi: >-
      Une fraction de la pension du fonctionnaire décédé versée à chaque enfant
      de moins de vingt et un ans. Les régimes spéciaux ont la leur ; le régime
      général n'en a pas.
    base_legale: [L. 40 CPCMR]
    veille: [reversion]
    creation: 1964
    fin: null
    regimes: fonction publique, régimes spéciaux
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: Même raison que la réversion.
    cout:
      mesurable_par: serie_publiee
      source_id: sre_rapport_annuel
      note: >-
        Le rapport annuel du Service des retraites de l'État distingue les
        pensions d'orphelin des pensions de réversion.

  # --- Âge de départ et bonifications de service ---------------------------

  - code: categorie_active
    libelle: Départ anticipé des catégories actives et super-actives
    famille: age_et_bonifications
    quoi: >-
      L'emploi classé actif ouvre la pension cinq ans avant l'âge légal, dix ans
      pour les emplois super-actifs, et l'âge d'annulation de la décote suit
      d'autant. Partir plus tôt sans abattement supplémentaire est un avantage
      exactement mesurable : c'est la différence entre le coefficient de
      conversion de l'âge réel et celui de l'âge légal.
    base_legale: [L. 24 I 1° CPCMR, L. 14 bis CPCMR, décret n° 2026-344 du 7 mai 2026 article 3 D]
    veille: [categorie_active_super_active, categorie_active_duree_requise]
    creation: 1853
    fin: null
    regimes: fonction publique, ouvriers de l'État, régimes spéciaux
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      L'avantage est un ÂGE, pas un montant. Sept statuts de
      `legislation/affiliations.yaml` le portent, et le scénario 1 leur oppose
      l'âge anticipé de L. 24 et l'âge d'annulation de L. 14 bis.
    chiffre_par: scripts/cout_avantages.py
    cout:
      mesurable_par: modele
      note: >-
        CHIFFRÉE, par recalcul, et il faut compter DEUX effets que tout invite à
        confondre.
        Sur le MONTANT : on refait la pension avec le statut sédentaire de mêmes
        régimes, à date de départ inchangée. 0,6 Md€ en 2024, et 868 € par an
        pour un agent classé de la génération 1960. C'est PETIT, et ce n'est pas
        une erreur — la décote est plafonnée à vingt trimestres, si bien que
        l'agent classé et l'agent sédentaire partis le même jour butent tous
        deux sur le même plafond.
        Sur la DURÉE : les pensions servies avant l'âge légal de la génération.
        7,5 Md€ en 2024 pour le seul classement, dans un total de 13,7 Md€ de
        pensions anticipées — dont 2,4 pour les régimes spéciaux et 3,8 pour la
        carrière longue. C'est treize fois l'effet de montant, et c'est là qu'est
        l'argent : une annuité servie avant l'âge légal n'est rattrapée par
        aucune décote. `scripts/cout_avantages.py --duree` la ventile par motif.
        Réserve écrite dans le script : ce sont des annuités anticipées, non un
        surcoût net — partir tôt, c'est aussi cotiser moins.

  - code: carriere_longue
    chiffre_par: scripts/cout_avantages.py
    libelle: Retraite anticipée pour carrière longue
    famille: age_et_bonifications
    quoi: >-
      Qui a commencé tôt et réunit une durée cotisée suffisante part avant l'âge
      légal, au taux plein. Certaines périodes non cotisées — maternité,
      chômage, maladie, et depuis 2025 les trimestres d'enfants — sont
      « réputées cotisées » pour ouvrir ce droit.
    base_legale: [L. 351-1-1 CSS, D. 351-1-1 CSS, L. 351-1-1 3° CSS]
    veille: [carriere_longue, carriere_longue_enfants_reputes_cotises, carriere_longue_reputes_cotises_autres]
    creation: 2003
    fin: null
    regimes: régime général, régimes alignés, non-salariés
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Même nature que la catégorie active : un âge, pas un montant. Le modèle
      le sert par `legislation/carriere_longue.csv` et par
      `_age_carriere_longue`.
    sans_chiffre: >-
      ne vaut rien sur le montant : un assuré entré tôt réunit sa durée de
      toute façon. Son prix est en annuités, et le dernier tracé le donne
    cout:
      mesurable_par: modele
      note: >-
        CHIFFRÉE, et le résultat est ZÉRO sur le montant. Le barème est vidé, et
        la pension ne bouge pas d'un euro : un assuré entré tôt réunit sa durée
        de toute façon, si bien que le taux plein lui est acquis avec ou sans le
        dispositif. Ce que la carrière longue change n'est pas le montant, c'est
        la DATE : elle ouvre la porte, elle ne remplit pas la pension.
        Tout son prix est donc dans la durée, et `--duree` le mesure : 3,8 Md€
        en 2024, contre rien avant 2010. La série ne commence qu'alors,
        mécaniquement, à mesure que l'âge légal monte au-dessus de l'âge auquel
        une carrière commencée tôt réunit sa durée.

  - code: age_jouissance_militaire
    chiffre_par: scripts/cout_avantages.py
    libelle: Jouissance immédiate de la pension militaire
    famille: age_et_bonifications
    quoi: >-
      La pension militaire est due dès que la durée de services requise est
      accomplie — quinze ou dix-sept ans selon l'époque et le grade —, sans
      condition d'âge. Un militaire peut ainsi percevoir sa pension à moins de
      quarante ans.
    base_legale: [L. 24 CPCMR, L. 25 CPCMR]
    veille: [categorie_active_super_active]
    creation: 1831
    fin: null
    regimes: militaires
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Servi par `legislation/age_jouissance_militaire.csv` et
      `legislation/duree_services_militaires.csv`. La limite d'âge de grade, qui
      ouvre la pension quelle que soit la durée accomplie, reste hors du modèle.
    sans_chiffre: >-
      le retrait déplace aussi la durée requise, 172 trimestres contre 160 :
      l'écart ne mesure plus l'âge seul, et la mesure est refusée
    cout:
      mesurable_par: modele
      note: >-
        CHIFFRÉE SUR CERTAINES GÉNÉRATIONS, et refusée sur les autres — le refus
        étant contagieux, la ligne ne paraît pas dans l'agrégat. Le retrait se
        fait sur les fiches, qui déclarent `categorie_active` : la pension ne
        s'ouvre plus à la durée de services, et l'âge légal de droit commun est
        opposé au militaire. 4 420 € par an pour la génération 1985, 1 188 €
        pour 1965.
        LE REFUS, lui, est un résultat. Sur d'autres générations le même retrait
        déplace la DURÉE REQUISE — 172 trimestres contre 160 —, parce que la
        pension militaire a la sienne : la proratisation change avec le droit, et
        l'écart ne mesure plus l'âge seul. Le garde-fou compare les deux durées,
        refuse la ligne, et la refuse partout dès qu'elle est faussée quelque
        part : une ligne mesurée pour certaines générations et pas pour d'autres
        donnerait un agrégat dont le biais serait invisible.
        Reste `--duree`, qui n'a pas besoin de contrefactuelle : la pension d'un
        militaire parti à quarante-quatre ans est servie vingt ans avant l'âge
        légal, et ces vingt annuités se comptent directement. C'est l'avantage
        d'âge le plus extrême du système.

  - code: bonification_cinquieme_militaires
    libelle: Bonification du cinquième du temps de service des militaires
    famille: age_et_bonifications
    quoi: >-
      Une annuité gratuite pour cinq servies, cinq au plus, au militaire
      réunissant dix-sept ans de services effectifs. Le maximum va à qui part à
      cinquante-neuf ans, et la bonification décroît d'une annuité par année
      supplémentaire servie.
    base_legale: [L. 12 i CPCMR]
    veille: []
    creation: 1964
    fin: null
    regimes: militaires
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Suppose de connaître le corps d'appartenance et le détail des services,
      que le simulateur ne saisit pas. `Neutralisations` le range explicitement
      dans « ce que le scénario 1 ne sert pas ».
    sans_chiffre: >-
      suppose la durée de services militaires effectifs, que le simulateur ne
      saisit pas, et aucun poste des comptes ne l'isole
    cout:
      mesurable_par: aucune
      note: >-
        Chiffrable dès qu'une carrière porte une durée de services militaires
        effectifs — l'information est déjà dans
        `legislation/duree_services_militaires.csv`, mais pour l'ouverture du
        droit, pas pour la bonification. Dénombrée en attendant, et c'est le
        chiffre le plus lourd du tableau : 12 817 des 12 912 pensions militaires
        entrées en paiement en 2010, soit 99,3 %, pour 16,4 trimestres en
        moyenne — plus de quatre annuités que personne n'a cotisées (même
        source).

  - code: bonification_cinquieme_services_actifs
    libelle: Bonification du cinquième des policiers, pompiers et surveillants
    famille: age_et_bonifications
    quoi: >-
      La même annuité gratuite pour cinq servies, accordée par des statuts
      particuliers aux policiers, aux sapeurs-pompiers professionnels, aux
      surveillants de l'administration pénitentiaire et aux douaniers de la
      branche surveillance.
    base_legale: [Loi n° 57-444 du 8 avril 1957 art. 1, Loi n° 57-444 du
      8 avril 1957 art. 6, R. 411-2 code de la sécurité intérieure,
      autres corps — à certifier]
    veille: []
    creation: 1957
    fin: null
    regimes: fonction publique, catégories actives
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Même raison que pour les militaires. La base légale n'est pas dans le
      CPCMR : elle est éclatée dans les statuts de chaque corps, et elle n'a pas
      été lue — l'écrire ici sans l'avoir lue serait une déduction, pas une
      source.
    sans_chiffre: >-
      suppose le corps d'appartenance, que le simulateur ne saisit pas ; et
      aucune publication n'en donne la masse, le rapport du Service des
      retraites de l'État n'étant pas un document statistique
    cout:
      mesurable_par: aucune
      note: >-
        Les textes de la police sont lus (loi n° 57-444) ; ceux des autres corps
        restent à trouver. Dénombrée sous l'intitulé « bonifications ne relevant
        pas de l'article L. 12 du CPCMR », que la note du tableau dit
        principalement attribuées aux policiers et aux agents de
        l'administration pénitentiaire : 3 477 pensions civiles de l'État
        entrées en paiement en 2010 pour 19,1 trimestres en moyenne, la plus
        longue de toutes (même source).

  - code: bonification_depaysement
    libelle: Bonification de dépaysement
    famille: age_et_bonifications
    quoi: >-
      Des annuités gratuites pour les services civils rendus hors d'Europe,
      prises en compte dès lors que la pension rémunère au moins quinze années
      de services effectifs.
    base_legale: [L. 12 a CPCMR]
    veille: []
    creation: 1964
    fin: null
    regimes: fonction publique
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: Suppose de connaître le lieu d'affectation, que le simulateur ne saisit pas.
    sans_chiffre: >-
      suppose le lieu d'affectation, que le simulateur ne saisit pas
    cout:
      mesurable_par: aucune
      note: >-
        Population étroite. Dénombrée pour la première fois : sur les 70 095
        pensions civiles de l'État entrées en paiement en 2010, 7 442 portaient
        une bonification pour services hors d'Europe, de 17,7 trimestres en
        moyenne (jaune budgétaire du PLF 2012, tableau des bonifications,
        chiffres 2010 provisoires). Des bénéficiaires et des trimestres, non des
        euros, et sur un flux d'entrée.

  - code: benefices_campagne
    libelle: Bénéfices de campagne
    famille: age_et_bonifications
    quoi: >-
      Le temps passé en opérations, à la mer ou outre-mer est compté double ou
      davantage. Avantage ancien, dont le coût se concentre sur les générations
      ayant servi en Afrique du Nord.
    base_legale: [L. 12 c CPCMR]
    veille: []
    creation: 1964
    fin: null
    regimes: militaires, fonction publique
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: Suppose le détail des services, que le simulateur ne saisit pas.
    sans_chiffre: >-
      suppose le détail des services, que le simulateur ne saisit pas
    cout:
      mesurable_par: aucune
      note: >-
        Série décroissante ; les générations concernées sortent des effectifs.
        Dénombrée : 1 290 pensions civiles de l'État entrées en paiement en 2010
        pour 3,1 trimestres en moyenne, et 10 173 pensions militaires sur 12 912
