# Tous les avantages non contributifs que sert le scénario 1
# ===========================================================
# source_id: legifrance_textes, cor_septieme_rapport, dss_ccss_transferts_retraite
#
# CE QUE CE FICHIER EST
# ---------------------
# Le scénario 1 est le droit en vigueur. Un compte notionnel ne sert que ce
# qui a été cotisé. Tout ce qui sépare les deux est ici, sous un code, avec sa
# base légale, les régimes qui le servent, l'état du modèle à son égard et le
# moyen d'en chiffrer le coût.
#
# C'est la liste qui manquait. Le dépôt en portait trois, partielles et
# discordantes, et aucune ne disait ce que chaque ligne coûte :
#
#   1. `Neutralisations` (src/retraite_notionnelle/config.py) — quinze champs
#      booléens, DÉCLARATIFS, qu'aucun moteur ne lit. Elle mélange des droits
#      (le minimum contributif) et des mécanismes (la décote et la surcote),
#      et son docstring annonçait des lignes que le moteur ne sert pas.
#   2. `avantages_non_contributifs` des fiches de régime
#      (data/reference/regimes/*.yaml) — seize codes, DATÉS et par régime,
#      que le moteur lit vraiment, mais dont six ne commandent aucun calcul.
#   3. La cascade `AvantageApplique`
#      (src/retraite_notionnelle/scenarios/actuel.py) — sept codes, et les
#      seuls CHIFFRÉS en euros : c'est la seule des trois qui réponde à
#      « combien ».
#
# Ce fichier est l'union des trois, complétée de ce qu'aucune des trois ne
# porte — la réversion, les bonifications de service, les départs anticipés
# pour handicap, inaptitude, incapacité et amiante, la majoration pour tierce
# personne —, et il ajoute à chaque ligne ce qu'il faut pour la chiffrer. Un
# test (tests/test_avantages.py) exige que tout code employé par l'une des
# trois listes ait sa ligne ici.
#
# CE QU'IL N'EST PAS
# ------------------
# Il ne chiffre rien lui-même. Il dit, ligne par ligne, PAR QUOI le coût se
# mesure : le modèle quand la cascade l'isole, une série publiée quand elle
# existe, rien du tout quand personne ne publie. Les trois cas sont nommés, et
# le troisième est une limite, pas un oubli.
#
# ÉTAT DU MODÈLE — quatre valeurs, et elles ne se valent pas
# -----------------------------------------------------------
#   chiffre  : le scénario 1 le sert ET la cascade en isole le montant en
#              euros. La somme des lignes chiffrées vaut EXACTEMENT
#              `pension_annuelle - total_contributif` : c'est vérifié.
#   integre  : le scénario 1 le sert, mais son effet passe par un trimestre,
#              un âge ou une assiette, et ne se sépare pas du contributif sans
#              recalculer la pension une seconde fois, avantage retiré.
#   declare  : une fiche de régime le déclare, le moteur ne le sert pas. La
#              déclaration est alors une INTENTION, et ce fichier le dit.
#   absent   : ni déclaré ni servi. C'est un écart au droit positif, et
#              `docs/limites.md` en répond.
#
# COMMENT LE COÛT SE MESURE — trois valeurs
# ------------------------------------------
#   modele        : la cascade donne le montant par cas type et par
#                   génération ; `cout.py` sait déjà en faire une masse
#                   annuelle, ancrée sur la dépense observée.
#   serie_publiee : un organisme publie la dépense, en série. `source_id`
#                   renvoie au manifeste data/sources.yaml.
#   aucune        : personne ne publie, et le modèle ne le sert pas. Le coût
#                   est inconnu, et l'écrire est plus utile que de l'estimer.
#
# L'ORDRE DE GRANDEUR D'ENSEMBLE, mesuré par quelqu'un d'autre
# -------------------------------------------------------------
# Le COR, dans le rapport commandé par l'article 75 de la LFSS 2009 (27 janvier
# 2010, source `cor_septieme_rapport`), chiffre les droits versés au titre de
# la solidarité — droits familiaux, chômage, maladie, invalidité, minimum
# contributif ou garanti — à « de l'ordre d'un cinquième des retraites tous
# régimes ». C'est le seul contrôle externe du total, et il ne couvre ni la
# réversion ni les bonifications de service.

familles:
  droits_familiaux:
    libelle: Droits familiaux
    quoi: >-
      Ce que la naissance ou l'éducation d'un enfant ajoute à la pension, sans
      qu'aucune cotisation supplémentaire ne l'ait payée : des trimestres, un
      pourcentage, une assiette portée au compte, un salaire de référence
      calculé sur moins d'années.
  minima_de_pension:
    libelle: Minima de pension
    quoi: >-
      Un plancher opposé au résultat du calcul contributif. Ce que le plancher
      ajoute n'a jamais été cotisé — c'est la définition même d'un minimum.
  periodes_non_cotisees:
    libelle: Périodes non cotisées mais validées
    quoi: >-
      Chômage, maladie, maternité, invalidité, accident du travail, service
      national : des trimestres, et parfois des points de complémentaire, que
      la période ouvre sans qu'un salaire les ait portés.
  droits_derives:
    libelle: Droits dérivés (survivants)
    quoi: >-
      Ce que le décès de l'assuré ouvre au conjoint survivant et aux orphelins.
      Non contributif au sens strict : la cotisation de l'assuré a déjà été
      rendue par sa propre pension.
  age_et_bonifications:
    libelle: Âge de départ et bonifications de service
    quoi: >-
      Partir plus tôt sans que la pension en soit diminuée à proportion, ou
      compter plus d'années qu'on n'en a servies. C'est l'avantage le plus
      coûteux et le moins visible : il ne s'affiche sur aucun bulletin de
      pension comme une ligne.
  autres_avantages:
    libelle: Majorations diverses
    quoi: >-
      Ce qui ne relève d'aucune des cinq familles précédentes, y compris les
      dispositifs éteints, qu'il faut garder pour lire les séries anciennes.
  ecarts_structurels:
    libelle: Écarts structurels au principe contributif
    quoi: >-
      Ce ne sont pas des DISPOSITIFS, et aucune caisse ne les liquide sous un
      nom. Ce sont les trois façons dont une pension excède la cotisation sans
      qu'aucun droit gratuit ne soit en cause : un barème d'âge qui n'est pas
      actuariel, un rendement supérieur à ce que l'assiette peut porter, un
      régime dont l'équilibre est payé par l'impôt. Ils sont ici parce que la
      question posée — pourquoi les pensions actuelles dépassent-elles ce qui a
      été cotisé — ne se répond pas sans eux, et ce sont eux que le scénario 2
      mesure. Ils ne s'ADDITIONNENT PAS aux six familles ci-dessus : ils
      portent sur la même pension, et les compter ensemble serait un double
      compte.

avantages:

  # --- Droits familiaux ----------------------------------------------------

  - code: majoration_duree_assurance
    libelle: Majoration de durée d'assurance pour enfants (MDA)
    famille: droits_familiaux
    alias: [mda]
    quoi: >-
      Jusqu'à huit trimestres par enfant au régime général et dans les régimes
      alignés — quatre au titre de la maternité, quatre au titre de l'éducation.
      Ils ne sont pas cotisés : ils effacent de la décote et relèvent le
      prorata, sans rien ajouter au salaire de référence.
    base_legale: [L. 351-4 CSS, L. 351-5 CSS]
    veille: [majoration_duree_assurance_enfants]
    creation: 1972
    fin: null
    regimes: régime général, régimes alignés, non-salariés
    etat_modele: chiffre
    ligne_cascade: majoration_duree_assurance
    cout:
      mesurable_par: modele
      note: >-
        Chiffrée par différence : la pension est recalculée sans les trimestres
        d'enfants, et l'écart est la ligne. C'est le bon ordre — la MDA agit
        AVANT la majoration de 10 % et avant le minimum.

  - code: bonification_enfants_fonction_publique
    libelle: Bonification pour enfants de la fonction publique
    famille: droits_familiaux
    alias: [bonifications]
    quoi: >-
      Un an par enfant né avant le 1er janvier 2004, sous condition
      d'interruption d'activité ; deux trimestres pour les enfants nés depuis.
      C'est le pendant de la MDA pour les fonctionnaires, qui ne l'ont pas.
    base_legale: [L. 12 b et b bis CPCMR, L. 12 bis CPCMR]
    veille: [majoration_duree_assurance_enfants]
    creation: 1964
    fin: null
    regimes: fonction publique, régimes spéciaux
    etat_modele: chiffre
    ligne_cascade: majoration_duree_assurance
    cout:
      mesurable_par: modele
      note: >-
        Même ligne de cascade que la MDA — le libellé rendu change avec le
        dispositif. Les séparer suppose de ventiler la masse par régime, ce que
        la pondération par effectifs de caisse permet déjà.

  - code: majoration_enfants
    libelle: Majoration de pension pour trois enfants et plus
    famille: droits_familiaux
    quoi: >-
      Dix pour cent de la pension, à partir du troisième enfant, au père comme
      à la mère, dans presque tous les régimes de base ; l'Agirc-Arrco sert la
      sienne, plafonnée. Non imposable jusqu'en 2013. Elle est proportionnelle
      à la pension, donc croissante avec le revenu : c'est le seul avantage
      familial dont le montant augmente avec le salaire.
    base_legale: [L. 351-12 CSS, L. 18 CPCMR, accord national interprofessionnel Agirc-Arrco]
    veille: [majoration_dix_pour_cent]
    creation: 1945
    fin: null
    regimes: tous les régimes de base, Agirc-Arrco, Ircantec
    etat_modele: chiffre
    ligne_cascade: majoration_enfants
    cout:
      mesurable_par: modele
      source_id: dss_ccss_transferts_retraite
      note: >-
        Doublement mesurable, et c'est un contrôle : le modèle la chiffre par
        cas type, et la CNAF publie ce qu'elle rembourse à la CNAV sous le
        poste `cnaf_majorations` de transferts_retraite.csv (4,4 Md€ en 2011).
        Les deux ne couvrent pas le même champ — le transfert ne porte que le
        régime général — mais ils doivent varier ensemble.

  - code: avpf
    libelle: Assurance vieillesse des parents au foyer
    famille: droits_familiaux
    alias: [assurance_vieillesse_parents_au_foyer]
    quoi: >-
      La CNAF cotise à l'assurance vieillesse, sur une assiette égale au SMIC,
      pour le parent qui interrompt ou réduit son activité. Ce n'est pas un
      trimestre gratuit : c'est une cotisation, versée par un tiers, qui entre
      au salaire de référence. D'où son effet, plus fort que celui de la MDA
      sur les carrières courtes.
    base_legale: [L. 381-1 CSS]
    veille: [avpf]
    creation: 1972
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: chiffre
    ligne_cascade: avpf
    cout:
      mesurable_par: modele
      source_id: dss_ccss_transferts_retraite
      note: >-
        Même double mesure que la majoration pour enfants : poste `cnaf_avpf`
        (4,4 Md€ en 2011). La série publiée donne la COTISATION versée l'année
        courante, le modèle donne la PENSION qu'elle produit des décennies plus
        tard — ne jamais les additionner, ni les comparer à la même date.

  - code: surcote_parentale
    libelle: Surcote parentale
    famille: droits_familiaux
    quoi: >-
      1,25 % par trimestre, quatre au plus, à qui détient au moins un trimestre
      de majoration pour enfants et avait sa durée requise à 63 ans. C'est la
      contrepartie directe du recul de l'âge légal de 2023 : elle paie l'année
      que la surcote ordinaire ne récompensait pas.
    base_legale: [L. 351-1-2-1 CSS]
    veille: [surcote_parentale]
    creation: 2023
    fin: null
    regimes: régime général, régimes alignés, fonction publique
    etat_modele: chiffre
    ligne_cascade: surcote_parentale
    cout:
      mesurable_par: modele
      note: >-
        Montée en charge par génération : rien avant 1964, un trimestre pour
        1965, quatre à partir de 1968. La série de coût ne commence donc qu'en
        2027 et croît jusqu'en 2032.

  - code: salaire_de_reference_des_parents
    libelle: Salaire annuel moyen calculé sur moins d'années pour les parents
    famille: droits_familiaux
    quoi: >-
      Vingt-quatre meilleures années pour un enfant, vingt-trois pour deux et
      plus, au lieu de vingt-cinq. Retirer une mauvaise année de la moyenne
      relève la pension sans qu'aucune cotisation l'ait payée.
    base_legale: [R. 173-3-2 I CSS (décret n° 2026-699 du 29 juillet 2026, article 1er)]
    veille: [sam_parents_24_23]
    creation: 2026
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      L'avantage porte sur l'ASSIETTE, pas sur le montant : il change le salaire
      de référence avant tout le reste. L'isoler suppose de recalculer la
      pension sur vingt-cinq années et de prendre l'écart — faisable, et c'est
      exactement la mécanique des lignes chiffrées.
    cout:
      mesurable_par: modele
      note: >-
        À ajouter à la cascade. Le recalcul est du même type que celui de la
        MDA, et le dispositif est trop récent pour qu'une série publiée existe.

  - code: majoration_duree_assurance_conge_parental
    libelle: Majoration de durée d'assurance pour congé parental d'éducation
    famille: droits_familiaux
    quoi: >-
      La durée effective du congé parental est ajoutée à la durée d'assurance,
      quand elle est plus favorable que la MDA de l'article L. 351-4. Les deux
      ne se cumulent pas : le droit retient la plus avantageuse.
    base_legale: [L. 351-5 CSS]
    veille: [majoration_duree_assurance_enfants]
    creation: 1977
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Le simulateur ne saisit pas la durée du congé parental, seulement le
      nombre d'enfants. La comparaison « la plus avantageuse des deux » est
      donc hors d'atteinte des carrières que le modèle construit.
    cout:
      mesurable_par: aucune
      note: >-
        Demanderait un champ de carrière nouveau. L'effet est borné par le
        haut : il ne peut jamais valoir moins que la MDA, qui est déjà servie.

  - code: majoration_duree_assurance_enfant_handicape
    libelle: Majoration de durée d'assurance pour enfant handicapé
    famille: droits_familiaux
    quoi: >-
      Un trimestre par période de trente mois d'éducation d'un enfant ouvrant
      droit à l'allocation d'éducation de l'enfant handicapé, huit au plus, sans
      préjudice de la MDA ordinaire — les deux se cumulent, contrairement au
      congé parental.
    base_legale: [L. 351-4-1 CSS]
    veille: []
    creation: 2003
    fin: null
    regimes: régime général, régimes alignés
    etat_modele: absent
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Demande une information médicale que le simulateur ne collecte pas, comme
      la retraite anticipée pour handicap.
    cout:
      mesurable_par: aucune
      note: Population étroite ; le coût est probablement le plus faible de la famille.

  # --- Minima de pension ---------------------------------------------------

  - code: minimum_contributif
    libelle: Minimum contributif, et sa majoration
    famille: minima_de_pension
    quoi: >-
      Un plancher opposé à la pension de base liquidée au taux plein,
      proratisé par la durée d'assurance ; sa majoration, elle, est proratisée
      par la durée COTISÉE. Le tout est écrêté par l'article L. 173-2 quand
      l'ensemble des pensions personnelles dépasse un plafond.
    base_legale: [L. 351-10 CSS, D. 351-2-1 CSS, L. 173-2 CSS]
    veille: [minimum_contributif]
    creation: 1983
    fin: null
    regimes: régime général, régimes alignés, non-salariés
    etat_modele: chiffre
    ligne_cascade: minimum_contributif
    cout:
      mesurable_par: modele
      note: >-
        Le seul avantage dont le coût DÉCROÎT quand les salaires montent : un
        plancher ne coûte que ce qui manque pour l'atteindre. Sa série doit
        donc suivre la distribution des pensions, pas la masse.

  - code: minimum_garanti
    libelle: Minimum garanti de la fonction publique
    famille: minima_de_pension
    quoi: >-
      Le plancher des pensions civiles et militaires, barème en points d'indice
      par durée de services, ouvert au taux plein — ou à qui atteignait l'âge
      d'ouverture de ses droits avant 2011.
    base_legale: [L. 17 CPCMR, loi n° 2003-775 article 66 V]
    veille: [minimum_garanti]
    creation: 1964
    fin: null
    regimes: fonction publique, régimes spéciaux
    etat_modele: chiffre
    ligne_cascade: minimum_garanti
    cout:
      mesurable_par: modele
      source_id: sre_minimum_garanti
      note: >-
        Le montant SERVI prime sur la projection : la revalorisation « comme les
        pensions » a été gelée en 2014 et sous-indexée depuis, et projeter une
        ancre certifiée sur l'IPC surestime de 4,6 % le minimum garanti de 2024.

  - code: minimum_vieillesse
    libelle: Minimum vieillesse (ASPA)
    famille: minima_de_pension
    alias: [minimum_vieillesse_aspa]
    quoi: >-
      Une allocation différentielle portée au plafond, sous condition de
      ressources du ménage, financée par l'impôt via le FSV. Ce n'est pas une
      pension : c'est un minimum social versé aux vieux, et il est ici parce
      qu'il entre dans le revenu des retraités que la comparaison mesure.
    base_legale: [L. 815-1 CSS et suivants, L. 816-2 CSS, L. 161-25 CSS]
    veille: [minimum_vieillesse]
    creation: 1956
    fin: null
    regimes: hors régime — servi par le FSV
    etat_modele: chiffre
    ligne_cascade: minimum_vieillesse
    cout:
      mesurable_par: modele
      source_id: drees_comptes_protection_sociale
      note: >-
        Le scénario 6 le remplace par la garantie vieillesse (800 €, plus 250 €
        d'isolement), chiffrée sur la distribution DREES et non sur les cas
        types : 18,4 Md€ par an aux pensions d'aujourd'hui. La même méthode
        chiffre l'ASPA actuelle, et c'est le seul avantage pour lequel la
        distribution vaut mieux que les cas types.

  - code: garantie_minimale_points
    libelle: Garantie minimale de points de l'Agirc
    famille: minima_de_pension
    quoi: >-
      Cent vingt points par an garantis au cadre dont le salaire au-dessus du
      plafond ne suffisait pas à les acheter. Éteinte avec la fusion
      Agirc-Arrco du 1er janvier 2019.
    base_legale: [accord Agirc du 9 février 1988]
    veille: []
    creation: 1989
    fin: 2018
    regimes: Agirc
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Servie par le champ `points_minimum_annuels: 120` des fiches de régime :
      elle agit sur le NOMBRE DE POINTS acquis dans l'année, donc en amont de
      la pension, comme le salaire de référence.
    cout:
      mesurable_par: modele
      note: >-
        Recalcul sans plancher de points. Dispositif éteint : la série est
        bornée à 1989-2018, et son coût décroît à mesure que le plafond monte.

  - code: pension_majoree_reference
    libelle: Pension majorée de référence du régime agricole
    famille: minima_de_pension
    quoi: >-
      Le plancher de la retraite forfaitaire et proportionnelle des non-salariés
      agricoles, complété depuis 2015 par la garantie « 85 % du SMIC » puis par
      le complément différentiel de points de RCO.
    base_legale: [L. 732-54-1 code rural]
    veille: []
    creation: 2002
    fin: null
    regimes: non-salariés agricoles (MSA)
    etat_modele: declare
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Déclarée dans cinq périodes de non_salaries.yaml ; aucun code du moteur ne
      la lit. `Neutralisations` la range d'ailleurs dans « ce que le scénario 1
      ne sert pas ».
    cout:
      mesurable_par: aucune
      note: >-
        À porter au moteur avant de pouvoir la chiffrer. Les non-salariés
        agricoles sont le régime où un plancher pèse le plus lourd, leur pension
        contributive étant la plus faible du catalogue.

  # --- Périodes non cotisées mais validées ---------------------------------

  - code: periodes_assimilees
    libelle: Périodes assimilées
    famille: periodes_non_cotisees
    quoi: >-
      Chômage indemnisé ou non, maladie, maternité, invalidité, accident du
      travail, service national : quatre trimestres validés par an, sans
      cotisation et sans salaire porté au compte. Ils comptent pour la durée
      d'assurance — donc contre la décote et pour le prorata — et jamais pour
      le salaire annuel moyen.
    base_legale: [L. 351-3 CSS, R. 351-12 CSS]
    veille: []
    creation: 1945
    fin: null
    regimes: régime général, régimes alignés, non-salariés
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      L'avantage est un TRIMESTRE, et son effet se dilue dans la décote et la
      proratisation. Le modèle le sert par
      `legislation/periodes_non_travaillees.csv`, neuf motifs, chacun disant
      combien de trimestres il assimile.
    cout:
      mesurable_par: modele
      source_id: dss_ccss_transferts_retraite
      note: >-
        Chiffrable par recalcul, motif par motif — c'est la ligne la plus
        instructive à ouvrir, parce que le chômage et la maladie sont la
        première source de trimestres non cotisés. Le FSV publie ce qu'il prend
        en charge (`fsv_cotisations`, 10,3 Md€ en 2011) : c'est le contrôle
        externe de la seule part chômage.

  - code: points_gratuits_complementaires
    libelle: Points de complémentaire acquis sans cotisation
    famille: periodes_non_cotisees
    quoi: >-
      Chômage indemnisé, maladie, maternité, invalidité, accident du travail
      ouvrent des points d'Agirc-Arrco et d'Ircantec que le salarié n'a pas
      payés ; l'Unédic verse la contrepartie pour le chômage.
    base_legale: [accords nationaux interprofessionnels Agirc-Arrco, décret Ircantec]
    veille: []
    creation: 1962
    fin: null
    regimes: Agirc-Arrco, Ircantec
    etat_modele: integre
    ligne_cascade: null
    pourquoi_pas_chiffre: >-
      Servis par la colonne `ouvre_droits_complementaires` de
      periodes_non_travaillees.csv, qui vaut « oui » pour cinq motifs sur neuf.
      L'effet passe par le nombre de points, donc en amont de la pension.
    cout:
      mesurable_par: modele
      source_id: dss_ccss_transferts_retraite
      note: >-
        Le poste `unedic_agirc_arrco` donne la contrepartie versée par
        l'assurance chômage — 2,8 Md€ en 2010 — et c'est le contrôle externe le
        plus direct de toute la liste : un seul payeur, un seul objet.

  - code: service_national
    libelle: Validation du service national
    famille: periodes_non_cotisees
    quoi: >-
      Les périodes de service militaire légal valident quatre trimestres par an,
      sans cotisation et sans ouvrir de points de complémentaire. Dispositif en
      extinction, la conscription ayant été suspendue en 1997.
    base_legale: [L. 351-3 CSS]
    veille: []
    creation: 1945
    fin: null
    regimes: tous
    etat_modele: integre
