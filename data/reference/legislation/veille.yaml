  - id: surcote_fonction_publique
    regle: "1,25 % par trimestre depuis 2009 sans plafond ; 0,75 % dans la limite de vingt trimestres pour ceux d'avant 2009 ; décompte depuis l'âge légal de droit commun, jamais depuis l'âge anticipé."
    textes: ["L. 14 III CPCMR (version du 31 décembre 2023)", "loi n° 2008-1330, article 89"]
    sources:
