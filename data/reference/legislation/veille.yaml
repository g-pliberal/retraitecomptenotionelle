    consulte: >-
      Index LEGI du dépôt : articles L. 5 (LEGIARTI000047453644) et L. 9
      (LEGIARTI000053279095) du code des pensions civiles et militaires de
      retraite, lus en entier — le premier pour la liste des services retenus,
