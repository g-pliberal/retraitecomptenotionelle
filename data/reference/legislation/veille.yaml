  - date: "2026-09-24"
    session: "action 89, suite : la priorité du régime spécial pour les trimestres des enfants"
    consulte: >-
      Dans l'index LEGI : R. 173-15 du code de la sécurité sociale dans ses
      six versions depuis 1985 ; R. 13, L. 4, L. 6, L. 12 bis et R. 4-1 du
      code des pensions dans leurs versions ; les articles qui fixent la
      durée de services de chaque régime spécial — décrets n° 65-773,
      2003-1306, 65-836, 2004-1056, 2008-639, 2008-637, 46-1541 (annexe 3),
      2007-262, 68-382, 68-960, 62-766, et L. 5552-11 du code des transports ;
      les majorations « aux femmes ayant accouché postérieurement à leur
      recrutement » de chaque régime. Dans l'index JORF, le décret
      n° 2008-47 de la SNCF. Les pages de juris-cnracl sur la coordination,
      la bonification pour enfants et la majoration des enfants nés depuis
      2004 ; les fiches CPRPF et CRP RATP du COR de juillet 2024.
    trouve: >-
      Le modèle donnait les trimestres des enfants au régime qui en accordait
      le plus ; R. 173-15 les donne au régime spécial qui peut pensionner et
      où le droit est ouvert, puis au régime général, puis au dernier régime.
      Une fonctionnaire de l'État passée au privé perd ainsi huit trimestres
      pour deux enfants nés avant 2004, que l'État ne lui a jamais dus. La
      durée qui ouvre une pension est partout de quinze ans avant les
      réformes, de deux ans pour les fonctionnaires radiés depuis 2011, d'un
      an pour les agents partis de la SNCF, de la RATP, des IEG et de l'Opéra
      depuis le 1er juillet 2008 ; la Banque de France, la Comédie-Française
      et la pension spéciale des marins n'en exigent aucune. Corrigé dans les
      deux moteurs, avec une table de ces durées.
    reste: >-
      Aucun exemple publié pour en faire un témoin officiel. Les règlements de
      la SNCF et de la RATP d'avant 2008 ne sont pas dans l'index : leurs
      quinze ans viennent des fiches du COR. Le port de Strasbourg, la caisse
      de Nouvelle-Calédonie, les chemins de fer secondaires et les pensions
      d'avant 1948 restent sans durée lue. Hors du modèle : le rétablissement,
      l'interpénétration, l'exception de la CRPCEN, l'enfant handicapé.

  - date: "2026-09-24"
    session: "action 89, suite : l'interpénétration des régimes de la fonction publique"
    consulte: >-
      veille_droit.py, et la mise à jour des index LEGI et JORF : un incrément
      chacun, rien sur les pensions de la fonction publique, L. 161-17-2 sans
      version postérieure au 31 décembre 2025. Dans l'index LEGI : L. 5, L. 11
      et L. 24 du code des pensions dans leurs versions depuis 1964 ; les
      articles 8, 13, 25 et 64 du décret n° 2003-1306 et l'article 8 du
      décret n° 65-773 ; les articles 4 et 10 du décret n° 2004-1056 et
      l'article 5 du décret n° 65-836. Les pages de juris-cnracl sur les
      services effectifs, les périodes liquidables, la coordination, la
      surcote et l'annulation du rétablissement.
    trouve: >-
      Les trois régimes du code des pensions — État, CNRACL, FSPOEIE — comptent
      et liquident chacun les services des deux autres, depuis au moins 1964,
      et le dernier régime sert une pension unique. Le modèle en liquidait une
      par régime, chacune sur son propre traitement : un fonctionnaire de
      l'État devenu territorial à quarante ans perdait 14,1 % de pension, un
      territorial devenu fonctionnaire de l'État 15,8 %. Corrigé dans les deux
      moteurs par les groupes de succession, qui liquidaient déjà ensemble un
      régime et son successeur ; la priorité des trimestres d'enfants lit
      désormais les services des trois régimes ensemble.
    reste: >-
      Aucun exemple publié pour en faire un témoin officiel. Le militaire garde
      sa pension militaire (L. 77), mais la pension de l'État d'un militaire
      devenu fonctionnaire civil n'est pas scindée. Le rétablissement de qui
      n'a pas la durée minimale reste hors du modèle.

  - date: "2026-09-24"
    session: "action 89, suite : le rétablissement de la fonction publique"
    consulte: >-
      veille_droit.py, et la mise à jour de l'index LEGI : aucun incrément
      nouveau, L. 161-17-2 sans version postérieure au 31 décembre 2025. Dans
      l'index LEGI : L. 65 du code des pensions dans ses quatre versions
      depuis 1964, L. 6 dans ses trois versions depuis 1972 ; D. 173-15 à
      D. 173-17 du code de la sécurité sociale ; l'article 64 du décret
      n° 2003-1306 ; l'article 9 du décret n° 70-1277. Dans l'index JORF,
      l'article 42 de la loi n° 2014-40. La circulaire Cnav 2011/38, parmi les
      références que la base de la Cnav rattache à D. 173-16. Les pages
      « Rétablissement » de juris-cnracl : les radiés et leurs conséquences,
      le versement au régime général, la validation à l'Ircantec, la
      renonciation, les stagiaires, l'annulation, la NBI, le CTI, les
      services outre-mer.
    trouve: >-
      L'agent parti de l'État, de la CNRACL, du FSPOEIE ou de la SEITA sans la
      durée qui ouvre une pension n'a pas de pension de son régime : ses
      années passent au régime général, sur le dernier traitement écrêté au
      plafond de chaque année, et à l'Ircantec. Le modèle lui servait une
      pension au prorata : un agent hospitalier parti au privé après treize
      ans touchait 26 312 € au lieu de 28 718 €. Corrigé dans les deux
      moteurs, les années rétablies gardant leur statut et changeant de
      régimes. Et la durée des militaires : quinze ans pour qui s'est engagé
      avant 2014, la loi n° 2014-40 ne donnant les deux ans qu'aux engagés
      depuis ; la table la lit désormais au premier engagement.
    reste: >-
      Aucun exemple publié pour en faire un témoin officiel. Les salaires
      forfaitaires des militaires (D. 173-17, arrêté du 17 décembre 1970), la
      NBI à l'Ircantec, les services d'avant juillet 1930, les départs d'avant
      le 29 janvier 1950 ; les coordinations propres de la SNCF, de la RATP,
      des IEG et de la Banque de France.

  - date: "2026-09-25"
    session: "architecture, après la phase 0 : les constats du scénario 1 que la note 0001 avait laissés"
    consulte: >-
      veille_droit.py, et la mise à jour de l'index LEGI : cinq incréments
      jusqu'au 25 septembre 2026, L. 161-17-2 et L. 161-17-3 sans version
      postérieure au 31 décembre 2025. Dans l'index LEGI : les quatorze
      rédactions de L. 351-4 du code de la sécurité sociale depuis 1985, les
      deux de D. 351-1-7, les huit de L. 12 et les six de R. 13 du code des
      pensions civiles et militaires, la loi n° 75-3 du 3 janvier 1975
      (LEGITEXT000006068508), ses articles 11 et 21, et le décret n° 75-109
      du 24 février 1975. Dans l'index JORF, récupéré le même jour : la loi
      et son décret, dont il n'a que les titres. Les pages de l'INSEE et de la
      DREES qui publient le code de Destinie 2 et de TRAJECTOiRE. Les effets
      des vingt-quatre règles déjà approchées au registre.
    trouve: >-
      Les six constats de docs/decisions/0001/phase_0.md, tous confirmés au
      texte. De fin 2003 à 2010, D. 351-1-7 accorde les trimestres d'enfants
      un par un, à la naissance puis à chaque anniversaire, huit au plus, et
      le modèle en sert huit d'un coup. L'index date la loi n° 75-3 du
      1er juillet 1974, son article 21 l'applique à cette date hors son
      titre II, et l'article 20 de son décret applique aux avantages prenant
      effet après le 30 juin 1974 l'article 16, sur la majoration des mères ;
      le modèle fait partir en 1975 les huit trimestres par enfant. Cinq rédactions de L. 351-4 changent le droit depuis 2013
      sans être découpées en versions. Au premier semestre 2011, R. 13 admet
      la réduction d'activité que L. 12 b ne nomme qu'à partir des pensions
      du 1er juillet. La ligne majoration_duree_assurance_enfants passe de
      conforme à approximation, et le dit. La feuille de route, action 26,
      disait TRAJECTOiRE et Destinie « pas publiés » : leur code l'est,
      Destinie 2 sur GitHub (InseeFr/Destinie-2), TRAJECTOiRE à la DREES sous
      licence EUPL. Et dix-sept des vingt-quatre règles déjà approchées racontent
      l'erreur corrigée sans dire ce qui reste : le tableau de bord le compte.
    reste: >-
      Aucun constat n'est corrigé dans le modèle : la version de 2003 et son
      décret, la borne de 1974, les cinq rédactions de L. 351-4, la question
      de R. 13 au premier semestre 2011. Les effets des règles approchées sont
      à réécrire au présent, un par un, à la lecture de chaque règle. Aucun
      exemple publié pour ces fenêtres. Le Journal officiel du 4 janvier 1975
      est à lire pour la structure de la loi n° 75-3, que l'index JORF ne
      donne pas : c'est lui qui dira si la majoration des mères est hors du
      titre II, et donc due dès le 1er juillet 1974.
  - date: "2026-09-26"
    session: "architecture, phase 2 : la carte des règles, les contrats, la liste de contrôle des textes"
    consulte: >-
      veille_droit.py, puis l'index LEGI, mis à jour deux fois dans la journée
      sans qu'aucun incrément ait paru depuis le 25 septembre 2026 à 21 h 48, et
      l'index JORF, dix incréments jusqu'au 26 septembre. Au Journal officiel
      du 24 septembre 2026, les quatre arrêtés du 21 septembre sur les
      libéraux et les indépendants : CARMF (JORFTEXT000054888270), CAVP et
      CARCDSF (JORFTEXT000054888282), régime complémentaire des indépendants
      (JORFTEXT000054888294), indemnités des administrateurs de la CNAVPL
      (JORFTEXT000054888256). Au Journal officiel du 26 septembre, le décret
      n° 2026-897 du 24 septembre 2026 sur la sécurité sociale des
      artistes-auteurs (JORFTEXT000054902736). Dans l'index LEGI, pour poser
      la liste de contrôle des textes, les rédactions de son périmètre.
    trouve: >-
      Rien qui change une règle que le modèle calcule. L'arrêté CARMF réécrit
      l'option de l'article 5 du règlement complémentaire, pour une retraite
      de vingt points au plus. L'arrêté CAVP et CARCDSF corrige la rédaction
      des prestations complémentaires des chirurgiens-dentistes et des
      sages-femmes, et remplace, à l'article 16 d'un règlement de la CAVP, les
      trois « premier » par « deuxième » ; le règlement visé n'est pas dit.
      Celui des indépendants, au 1er janvier 2027, refuse le complément
      différentiel à qui a reçu un versement forfaitaire unique et insère les
      articles 9-7 et suivants. Le décret des artistes-auteurs vaut pour les
      périodes d'activité postérieures au 1er janvier 2027. Par ailleurs, les
      entrées de ce registre sont devenues les fiches de data/reference/regles/,
      et la liste de contrôle des textes est posée : 10 738 rédactions, dont
      189 qu'une fiche cite et 10 549 sans statut, le compte que son cliquet
      tient.
    reste: >-
      L'article 16 du règlement de la CAVP, rangé dans la fiche
      cavp_minoration_deux_pentes parmi ses textes à relire. Les articles 9-7 et
      suivants du règlement des indépendants, à lire avant 2027. Les
      rédactions sans statut de la liste, à rattacher ou déclarer sans effet
      fiche par fiche, et ce que les fiches tirées du registre ne savent pas
      encore : domaine, régimes, étape, versions.
