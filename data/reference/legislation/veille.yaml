# La veille du droit : les sources à consulter, et le journal de chaque veille
# ============================================================================
# Les règles que le scénario 1 applique, approche, omet ou n'a pas encore lues
# sont les fiches de la carte, data/reference/regles/ : une par dispositif,
# chacune avec les textes qui la fondent, les sources OFFICIELLES où elle a été
# lue, la date de cette lecture et celle de la prochaine, les exemples publiés
# qui la rejouent, et son état. Jusqu'au 26 septembre 2026, elles étaient les
# entrées de ce registre, et elles en ont gardé l'identifiant : une « ligne `x`
# de veille.yaml » citée ailleurs est la fiche data/reference/regles/x.yaml.
# `scripts/veille_droit.py` dit lesquelles relire ; `tests/test_carte.py` en
# tient la forme, et exige que toute réforme du calendrier (reformes.yaml)
# datée de 2023 ou après ait sa fiche. `docs/veille_droit.md` dit la procédure.
#
# Ce fichier garde ce qui n'est pas une règle : les sources à consulter à
# chaque session. Le journal, où chaque session consigne ce qu'elle a
# consulté, trouvé et laissé, en est sorti le 6 octobre 2026 (action 148) :
# une entrée par fichier, dans journal_de_veille/, nommé de sa date et de
# son sujet (2026-10-06-action-148-etape-2.yaml), pour que deux sessions
# n'écrivent jamais au même endroit. `tests/test_donnees.py` impose la forme
# des deux.
#
# Il existe parce qu'une table certifiée l'est à une DATE : le 17 septembre
# 2026, les âges légaux du dépôt, lus dans un dump LEGI de juillet 2025,
# étaient faux pour tout assuré né de 1964 à 1968 depuis la loi du
# 30 décembre 2025 — et rien ne le disait. Le premier exemple publié lu l'a
# fait voir. Ce registre a été la réponse : chaque règle porte la date de sa
# dernière confrontation à une source officielle, et le script dit lesquelles
# ont vieilli.
#
# CE QUE LES ENTRÉES SONT DEVENUES, pour lire les notes qui les citent
#   regle              intitule
#   textes             textes_a_rattacher (chacun par sa référence)
#   sources            sources.lectures
#   verifie_le         sources.lu_le
#   prochaine_veille   sources.prochaine_relecture
#   a_faire            sources.a_relire
#   temoins            exemples
#   reformes, effet    inchangés
#   etat               les états du vocabulaire (data/reference/vocabulaire/
#                      valeurs.yaml, etats_de_fiche) : conforme ; transcrit →
#                      transcrite ; approximation → approchee ; manque →
#                      manquante ; hors_modele → pas_encore_modelisee ;
#                      a_verifier
#
# LA RÈGLE : aucune valeur n'entre dans le scénario 1 sans sa fiche, et aucune
# fiche sans source officielle lue — Légifrance pour le texte, la circulaire
# de la caisse ou la fiche service-public pour l'application, un exemple
# chiffré publié quand il en existe. Une déduction n'est pas une lecture ; une
# mémoire n'est pas une source.

sources_a_consulter:
  - nom: "Légifrance, loi de financement de la sécurité sociale de l'année"
    quoi: >-
      Chaque LFSS (votée en décembre) touche les retraites : âges, durées,
      minima, majorations, revalorisation. Lire les articles retraite du
      titre « assurance vieillesse » et leurs décrets d'application (JORF,
      généralement de mars à juillet).
    url: "https://www.legifrance.gouv.fr/"
  - nom: "Cnav, base documentaire des circulaires"
    quoi: >-
      Une circulaire par mesure, avec exemples chiffrés. Lister les
      circulaires parues depuis la dernière veille et lire celles dont l'objet
      touche une règle du scénario 1.
    url: "https://legislation.lassuranceretraite.fr/"
  - nom: "service-public.gouv.fr, fiches retraite du salarié et de l'agent public"
    quoi: >-
      Les fiches portent une date « Vérifié le » et des encadrés « Exemple ».
      Une date postérieure à la dernière veille signale une règle à relire ;
      un exemple nouveau entre dans exemples_officiels.yaml.
    url: "https://www.service-public.gouv.fr/particuliers/vosdroits/N381"
  - nom: "Journal officiel, par l'index DILA du dépôt"
    quoi: >-
      `python scripts/fetch/dila_index.py jorf --mettre-a-jour`, puis
      `python scripts/fetch/dila_cherche.py jorf 'retraite' --depuis AAAA
      --nature DECRET` : les décrets retraite parus depuis la dernière veille.
    url: "https://echanges.dila.gouv.fr/OPENDATA/"
  - nom: "Service des retraites de l'État et CNRACL (juris-cnracl)"
    quoi: "Règles de la pension civile : décote, surcote, catégories actives, minimum garanti."
    url: "https://www.juris-cnracl.retraites.fr/"
  - nom: "Agirc-Arrco, paramètres annuels"
    quoi: "Valeur du point au 1er novembre, salaire de référence au 1er janvier, taux d'appel."
    url: "https://www.agirc-arrco.fr/"
