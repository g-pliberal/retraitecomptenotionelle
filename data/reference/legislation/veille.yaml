      31 décembre 2025.
    trouve: >-
      LE MÊME TEXTE QUE L'ENTRÉE PRÉCÉDENTE, LU LE MÊME JOUR PAR UNE AUTRE
      SESSION, ET LA MÊME CORRECTION PORTÉE JUSQU'AU BOUT DE CHAQUE CÔTÉ : table
      identique, valeurs identiques, découverte au rebasage. Le doublon a été
      abandonné au profit de `main`. CE QUE LA LECTURE A AJOUTÉ, en revanche :
      la mise à l'essai de l'escalier marche par marche, y compris la marche qui
      DESCEND — un super-actif né en août 1971 doit 171 trimestres, celui de
      septembre 169, le texte remettant leur compteur à 169 au moment même où
      leur âge commence à monter. Et c'est cet essai qui a buté sur UN MOIS DE
      SEPTEMBRE PERDU, qui n'a rien à voir avec le droit : les tables écrivent
      le 1er septembre `1961.667`, huit douzièmes valent 1961,666 666…, et la
      lecture en escalier rendait donc à l'assuré né en SEPTEMBRE 1961 la marche
      d'août — 168 trimestres au lieu de 169 et 62 ans d'âge d'ouverture au lieu
      de 62 ans et trois mois, pour le mois-même que la loi du 14 avril 2023
      désigne. Le trou valait aussi pour `1963.667` de la carrière longue,
      `1966.667` et `1971.667` de la catégorie active, `1971.667` de la
      jouissance militaire. La génération est maintenant lue à la précision où
      les tables sont écrites.
    reste: >-
      DEUX LIGNES À OUVRIR, lues et non portées : le F du même II donne à la
      carrière longue de la fonction publique sa propre durée cotisée — 167
      trimestres de 1958 à 1960, 171 de 1970 à 1972 —, et le C vise les autres
      départs avant soixante ans. ET UNE LEÇON DE MÉTHODE, qui vaut d'être
      consignée là où les sessions la reliront : deux sessions ont passé la même
      journée sur la même ligne du registre parce que rien ne disait qu'elle
      était prise. Le partage par zones du `CLAUDE.md` nomme le modèle, les
      données et le site ; le registre de veille est une zone de plus, et ses
      lignes `manque` se prennent une à la fois.
    session: la réglementation des IEG, lue chez la CNIEG puis dans son texte
    consulte: >-
      CNIEG, pages « réglementation » : mode de calcul, taux de la pension,
      durée d'assurance et son tableau, décote, coefficient, âge d'annulation
      de la décote, surcote. Puis, dans l'index LEGI du dépôt, l'annexe 3 du
      décret n° 46-1541 du 22 juin 1946 — vingt versions datées, dont celle en
      vigueur (LEGIARTI000052046924, 6 août 2025).
    trouve: >-
      DEUX CHOSES CONFIRMÉES, DEUX ÉCARTS. Confirmées : la montée en charge de
      la décote des régimes spéciaux, que le dépôt modélise déjà — rien avant
      le 1er juillet 2010, un dixième par an, 1,25 % en 2019 — et l'âge
      d'annulation reculant de seize trimestres à rien de 2010 à 2024, tables
      que la CNIEG publie à l'identique. Les écarts : depuis le 1er janvier
      2025, l'âge de référence est l'âge minimum majoré de TROIS ans et non de
      cinq, et vaut soixante-deux ans pour les agents en services actifs nés
      avant 1975 — la fiche portait 63,75 puis 64 ans, soit sept trimestres de
      décote de trop ; et le régime a SA PROPRE table de durée requise, dont
      trois générations diffèrent de la table commune que le dépôt lui oppose.
      Le premier écart est corrigé, le second est ouvert : il demande une
      quatrième table dans `_duree_requise` et son portage JavaScript.
    reste: >-
      La SNCF et la RATP portent la même construction — âge d'ouverture majoré
      de cinq ans — et leurs textes n'ont pas été lus : si la réforme de 2023
      les a traités comme les IEG, deux autres fiches décotent de trop. C'est
      la première chose à faire du prochain lot. La CNIEG publie par ailleurs
      deux exemples chiffrés de surcote, transcriptibles en témoins le jour où
      `tests/test_oracle.py` saura construire une carrière de régime spécial.

