# Registre de conformité du scénario 1 au droit applicable
# =========================================================
# Ce fichier est la liste de tout ce que le scénario 1 applique, approche,
# omet ou n'a pas encore lu — règle par règle —, avec pour chaque ligne le
# texte qui la fonde, la source OFFICIELLE où elle a été lue, la date de cette
# lecture, l'exemple publié qui la rejoue quand il en existe un, et l'état.
# `scripts/veille_droit.py` le lit ; `tests/test_donnees.py` en impose la
# forme et exige que toute réforme du calendrier (reformes.yaml) datée de 2023
# ou après y ait sa ligne. `docs/veille_droit.md` dit comment le tenir.
#
# Il existe parce qu'une table certifiée l'est à une DATE : le 17 septembre
# 2026, les âges légaux du dépôt, lus dans un dump LEGI de juillet 2025,
# étaient faux pour tout assuré né de 1964 à 1968 depuis la loi du
# 30 décembre 2025 — et rien ne le disait. Le premier exemple publié lu l'a
# fait voir. Ce registre est la réponse : chaque ligne porte la date de sa
# dernière confrontation à une source officielle, et le script dit lesquelles
# ont vieilli.
#
# ÉTATS
#   conforme       lu dans le texte ET dans une source d'application
#                  (circulaire, fiche service-public), rejoué par un exemple
#                  publié quand il en existe un
#   transcrit      lu dans le texte, appliqué, mais sans exemple publié ni
#                  recontrôle automatique
#   approximation  la règle est appliquée à une maille plus grossière que le
#                  droit (l'année, le mois de l'anniversaire) ; l'effet est
#                  mesuré et dit dans limites.md
#   manque         règle du droit non appliquée, dont l'effet est connu
#   hors_modele    hors périmètre par construction (ménage, information
#                  médicale, dispositif temporaire)
#   a_verifier     texte ou règle signalé, pas encore lu à la source
#
# CHAMPS D'UNE LIGNE
#   id, regle, textes (articles et lois), sources (chacune : type, reference,
#   date — la date de vérification de la fiche ou de la circulaire, ou celle
#   de la version lue sur Légifrance —, url facultative), verifie_le (date de
#   la lecture par le dépôt), temoins (identifiants de
#   tests/temoins/exemples_officiels.yaml), reformes (codes de reformes.yaml),
#   etat, effet, a_faire, prochaine_veille.
#
# LA RÈGLE : aucune valeur n'entre dans le scénario 1 sans sa ligne ici, et
# aucune ligne sans source officielle lue — Légifrance pour le texte, la
# circulaire de la caisse ou la fiche service-public pour l'application, un
# exemple chiffré publié quand il en existe. Une déduction n'est pas une
# lecture ; une mémoire n'est pas une source.

sources_a_consulter:
  - nom: "Légifrance, loi de financement de la sécurité sociale de l'année"
    quoi: >-
      Chaque LFSS (votée en décembre) touche les retraites : âges, durées,
      minima, majorations, revalorisation. Lire les articles retraite du
      titre « assurance vieillesse » et leurs décrets d'application (JORF,
      généralement de mars à juillet).
    url: "https://www.legifrance.gouv.fr/"
  - nom: "Cnav, base documentaire des circulaires"
    quoi: >-
      Une circulaire par mesure, avec exemples chiffrés. Lister les
      circulaires parues depuis la dernière veille et lire celles dont l'objet
      touche une règle du scénario 1.
    url: "https://legislation.lassuranceretraite.fr/"
  - nom: "service-public.gouv.fr, fiches retraite du salarié et de l'agent public"
    quoi: >-
      Les fiches portent une date « Vérifié le » et des encadrés « Exemple ».
      Une date postérieure à la dernière veille signale une règle à relire ;
      un exemple nouveau entre dans exemples_officiels.yaml.
    url: "https://www.service-public.gouv.fr/particuliers/vosdroits/N381"
  - nom: "Journal officiel, par l'index DILA du dépôt"
    quoi: >-
      `python scripts/fetch/dila_index.py jorf --mettre-a-jour`, puis
      `python scripts/fetch/dila_cherche.py jorf 'retraite' --depuis AAAA
      --nature DECRET` : les décrets retraite parus depuis la dernière veille.
    url: "https://echanges.dila.gouv.fr/OPENDATA/"
  - nom: "Service des retraites de l'État et CNRACL (juris-cnracl)"
    quoi: "Règles de la pension civile : décote, surcote, catégories actives, minimum garanti."
    url: "https://www.juris-cnracl.retraites.fr/"
  - nom: "Agirc-Arrco, paramètres annuels"
    quoi: "Valeur du point au 1er novembre, salaire de référence au 1er janvier, taux d'appel."
    url: "https://www.agirc-arrco.fr/"

