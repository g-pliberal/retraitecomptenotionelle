    reformes: [reforme_2023, lfss_2026_suspension]
    etat: conforme
    effet: "Toute liquidation. Les six lignes de 1964 à 1968 sont au niveau « moyenne » : transcrites, non recontrôlées par le récupérateur LEGI."
    a_faire: >-
      Action 27 : le récupérateur lit D. 161-2-1-9, qui ne porte plus les
