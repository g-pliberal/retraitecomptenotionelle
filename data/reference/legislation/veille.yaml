  - id: plafond_des_trimestres_de_decote
    regle: >-
      Le plafond de vingt trimestres de décote est écrit dans trois textes et
      absent des deux autres ; il ne mord sur aucune liquidation que le droit
      ouvre, parce que l'écart entre l'âge d'ouverture et l'âge d'annulation
      vaut au plus vingt trimestres.
    textes:
      - "R. 643-7 CSS (professions libérales), version du 1er septembre 2023"
      - "R. 723-38 CSS (avocats)"
      - "L. 14 I du code des pensions civiles et militaires"
      - "R. 351-27 2° CSS et R. 732-61 du code rural : aucun plafond"
    sources:
      - type: legifrance
        reference: >-
          R. 643-7 CSS, LEGIARTI000047633290 : « Le coefficient de minoration
          est égal à 1,25 % par trimestre manquant dans la limite de vingt
          trimestres. » R. 723-38 CSS et le I de L. 14 du code des pensions
          portent la même limite.
        date: "2026-09-22"
      - type: legifrance
        reference: >-
          R. 351-27 2° CSS, LEGIARTI000054589995, version du 1er août 2026 :
          « Pour chaque trimestre ainsi retenu, le coefficient de minoration à
          appliquer au “ taux plein ” est 1,25 %. » Aucune limite de trimestres
          n'y figure, et R. 732-61 du code rural n'en porte pas davantage.
          R. 351-27-1, qui plafonne, ne vise que les assurés de L. 161-17-4.
        date: "2026-09-22"
    verifie_le: "2026-09-22"
    temoins: []
    reformes: []
    etat: conforme
    effet: >-
      Aucun. Le modèle applique un plafond de vingt trimestres par défaut
      (`decote_trimestres_maximum`), et il ne mord sur AUCUNE des 2 483
      liquidations ouvertes qu'un balayage de la grille produit — treize cas
      types, six générations, tous les trimestres de cinquante à soixante-huit
      ans. La raison est mesurable dans les tables : l'écart entre l'âge
      d'ouverture et l'âge d'annulation vaut exactement vingt trimestres pour
      les générations 1930 à 1961, puis dix-huit, quinze, treize et douze
      ensuite. Le décompte par l'âge est donc borné par construction sur toute
      liquidation ouverte. Deux tests le tiennent.
    a_faire: null
    prochaine_veille: "2027-06-30"

