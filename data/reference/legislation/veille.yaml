    trouve: >-
      Le coefficient d'équilibre du système actuel était CALCULÉ depuis
      l'action 6 et n'était lu nulle part à côté d'une pension : il vaut 0,99
      en 2026 et 0,84 en 2070, c'est-à-dire que le système promet, à l'horizon
