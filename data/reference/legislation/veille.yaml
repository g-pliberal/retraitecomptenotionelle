      PORTÉ LE 22 SEPTEMBRE 2026, par une colonne de plus dans
      `categorie_active.csv`, lue par `_duree_requise` quand la dérogation
      active s'applique — c'est-à-dire aux mêmes quatre conditions que l'âge
