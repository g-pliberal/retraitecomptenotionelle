  - id: majoration_duree_assurance_enfants
    regle: "Huit trimestres par enfant au régime général (quatre avant 1975, un an de 1972 à 1974, à la mère), bonification de la fonction publique (quatre trimestres avant 2004, deux depuis — dont l'un compte en SERVICES et non en durée pour les pensions prenant effet à compter du 1er septembre 2026)."
    textes: ["L. 351-4 CSS", "L. 351-5 CSS", "L. 12 b, L. 12 b ter et L. 12 bis CPCMR"]
    sources:
      - {type: legifrance, reference: "L. 351-4 CSS", date: "2023-09-01"}
      - {type: legifrance, reference: "L. 12 CPCMR, version LEGIARTI000053280361", date: "2026-09-21"}
      - {type: legifrance, reference: "L. 12 bis CPCMR, version LEGIARTI000053280367", date: "2026-09-21"}
      - {type: circulaire_cnav, reference: "circulaire carrière 2017-01 du 13 janvier 2017, fiche n° 6.2b, point 2 : « Quatre trimestres peuvent être attribués au titre de chaque majoration »", date: "2017-01-13"}
      - {type: service_public, reference: "fiche F16336, quatre trimestres de maternité et quatre d'éducation par enfant", date: "2026-08-14"}
      - {type: service_public, reference: "fiche F37311, bonification de la fonction publique : quatre trimestres par enfant né avant 2004, deux depuis", date: "2026-09-01"}
    verifie_le: "2026-09-21"
    temoins: [sp_f16336_mda_deux_enfants, cnav_2017_01_mda_trois_enfants, sp_f37311_bonification_avant_2004, sp_f37311_bonification_depuis_2004]
    reformes: [parents_2026]
    etat: conforme
    effet: "Toute mère ; commande la décote, la proratisation, la surcote parentale et le SAM des parents. Dans la fonction publique, un trimestre change de case sans changer de nombre."
    a_faire: >-
      LU, ET LA RÉPONSE EST NON. La question posée ici était de savoir si la
      bonification d'un trimestre créée pour les enfants nés depuis 2004
      s'AJOUTE aux deux trimestres de L. 12 bis. La loi n° 2025-1403 du
      30 décembre 2025 (article 104) insère un b ter à L. 12 et réécrit L. 12
      bis le même jour : les deux trimestres demeurent, « dont l'un est pris en
      compte au titre de la bonification prévue au b ter de l'article L. 12 ».
      Le total ne bouge pas ; un trimestre passe de la durée d'assurance aux
      services, où il entre dans la liquidation au lieu de ne compter que pour
      la durée. Applicable aux pensions prenant effet à compter du 1er
      septembre 2026, et étendu à la même date à la CNRACL et au FSPOEIE par
      décret en Conseil d'État — le décret n° 2026-699.
      PORTÉ LE 21 SEPTEMBRE 2026. `majoration_duree_assurance.csv` porte deux
      colonnes de plus — `services_par_enfant` et `services_depuis` —, le
      moteur ajoute la durée à la durée et les services aux services, et le
      portage JavaScript suit. Ce que cela a rendu au droit : une mère
      fonctionnaire d'État de trois enfants passe de 142 à 139 trimestres de
      services et de 46 938 à 45 946 € par an. Une approximation est assumée et
      écrite dans l'en-tête de la table : le b ter vaut pour les pensions
      prenant effet à compter du 1er septembre 2026, le modèle date à l'année
      et l'applique dès janvier.
      RESTE AUSSI À TRANCHER : l'attribution au père (partage des trimestres
      d'éducation depuis 2010) demeure une convention du dépôt.
      CE QUE LES QUATRE TÉMOINS DU 21 SEPTEMBRE FIXENT, ET CE QU'ILS NE FIXENT
      PAS : ils tiennent le NOMBRE de trimestres servis dans les quatre cas
      courants — 8 par enfant au régime général, 4 puis 2 dans la fonction
      publique —, en rejouant la même carrière sans enfant. Ils mesurent donc
      la durée d'assurance, et resteront justes quand le partage entre services
      et durée sera porté : c'est exactement la grandeur que ce partage ne
      déplace pas. Ce partage, lui, n'aura de témoin que le jour où une fiche
      de calcul publiée en donnera un prorata chiffré.
    prochaine_veille: "2026-12-31"

