  - date: "2026-09-20"
    session: >-
      Deux des trois écarts de comptabilité relevés par un audit des recettes
      et des dépenses rapportées au PIB : la convention comptable jamais dite
      au lecteur, et le compte tenu en brut sans que rien ne le signale.
    consulte: >-
      `veille_droit.py` lancé en entrée : 35 lignes, dernière veille consignée
      au 20 septembre 2026, six lignes à revoir, inchangées. Aucun texte
      nouveau n'a été cherché sur les règles de calcul, la session ne touchant
      à aucune. Deux lectures, du côté des comptes : le rapport annuel du COR
      de juin 2026, figure des ressources du système de retraite et son bloc
      de données complémentaires sous convention EEC, puis sa figure des
      déterminants de l'évolution des ressources ; et, du côté du droit,
      l'article L. 131-8 du code de la sécurité sociale, déjà lu le même jour
      dans sa version en vigueur depuis le 1er février 2026
      (LEGIARTI000053538201), pour la seule fraction de CSG des revenus de
      remplacement affectée à la branche vieillesse.
    trouve: >-
      LA CONVENTION COMPTABLE EST UNE HYPOTHÈSE, ET ELLE VALAIT JUSQU'À 0,67
      POINT DE PIB SANS QUE LE SITE LA NOMME. Le compte du COR est tenu sous
      convention EPR : ce que l'État verse aux régimes de fonctionnaires et aux
      régimes spéciaux y suit ce qu'il faut pour les équilibrer chaque année,
      si bien que le déficit publié est celui des AUTRES régimes. Le COR publie
      aussi l'effort de l'État figé en part de PIB (EEC), et l'écart change de
      signe : EEC donne 0,67 point de moins en 2028, croise en 2047, rend 0,49
      point de plus en 2069. `ressources_eec_retraite.csv` porte la série, la
      page Coût les deux soldes.
      LE COMPTE EST EN BRUT, ET UNE PART DE SA RECETTE SORT DE SA DÉPENSE.
      L'article L. 131-8, 3° e affecte 2,94 des 8,30 points de CSG d'une
      pension à la branche mentionnée au 3° de L. 200-2, la vieillesse : un
      tiers de ce qu'une pension paie revient au système qui la verse, soit au
      plus 11,8 Md€ en 2024 et le cinquième des impôts et taxes affectés que
      le compte encaisse. Et la masse des pensions vaut 13,68 % du PIB en brut
      contre au plus 12,43 % en net. Les deux chiffres sont des BORNES, le taux
      plein étant appliqué à toute la masse faute d'un croisement publié entre
      distribution des pensions et revenu fiscal des foyers.
    reste: >-
      Aucune règle du scénario 1 n'est touchée : aucune pension calculée ne
      bouge d'un euro, les 469 témoins de simulation sont identiques, et aucune
      ligne du registre n'a changé d'état. La seule donnée de droit ajoutée est
      `csg_affectee_vieillesse` dans `prelevements_remuneration.yaml`, qui ne
      sert à aucun calcul de pension — une pension nette ne dépend pas de qui
      encaisse — mais au seul compte. Restent à revoir, inchangées : les six
      lignes que `veille_droit.py` signale. Reste aussi, et c'est le troisième
      écart de l'audit, l'absence d'engagements de retraite acquis à date.

  - date: "2026-09-21"
    session: "ce qui a changé de côté : la frontière contributive, datée"
    consulte: >-
      Index LEGI du dépôt, dump du 13 juillet 2025 à jour des incréments au
      20 septembre 2026. Toutes les VERSIONS, et non la seule en vigueur, des
      articles L. 135-1 (définition du fonds), L. 135-2 (trente-sept versions,
      1994-2025), L. 222-2-1, L. 223-1, L. 241-3, D. 242-5, L. 351-1, L. 351-3
      et L. 161-22-1-1 du code de la sécurité sociale, comparées deux à deux
      par appariement de contenu ; article 24 de la loi n° 2025-199 du
      28 février 2025 (LEGIARTI000051273754), lu par `--motif`.
    trouve: >-
      L'article L. 135-1 porte la SEULE définition légale de l'avantage
      d'assurance vieillesse « à caractère non contributif », et elle est
      énumérative : n'est non contributif que ce que L. 135-2 énumère. Cette
      liste a été révisée trente-sept fois en trente et un ans, et
      l'article 24 de la LFSS 2025 l'abroge : « les droits et obligations du
      Fonds de solidarité vieillesse sont dévolus à la Caisse nationale
      d'assurance vieillesse à compter du 1er janvier 2026 ». Elle est reprise
      par L. 222-2-1, DONT LE 2° NE VISE PLUS LE RÉGIME GÉNÉRAL — qui a absorbé
      le fonds et ne se rembourse pas à lui-même. Vingt-quatre déplacements de
      frontière ont été datés et consignés dans
      `legislation/frontiere_contributive.yaml`, chacun avec l'identifiant de
      version qui en fait foi ; `scripts/frontiere_contributive.py --verifier`
      en revérifie quarante dans l'index. Les plus notables : les cotisations
      vieillesse déplafonnées, qui n'ouvrent aucun droit, à la charge de
      l'employeur depuis le 20 janvier 1991 et du salarié depuis le 22 août
      2003 (L. 241-3) ; la validation rétroactive des travaux d'utilité
      collective des années 1980, entrée au 9° de L. 351-3 le 1er septembre
      2023 ; l'article L. 161-22-1-1, qui définit depuis la même date la seule
      pension purement contributive du droit français (« aucune majoration,
      aucun supplément ni aucun accessoire ») ; et les indemnités journalières
      de maternité, entrées au salaire de base de L. 351-1 en 2010 — version
      toujours en vigueur — dont le financement a été abrogé en 2020.
    reste: >-
      Le scénario 1 n'est pas modifié : aucune règle de calcul n'a été touchée,
      et aucune ligne du registre ci-dessus n'a changé d'état. Ce qui a été
      ajouté est une LECTURE, et elle corrige trois raisons écrites dans
      l'inventaire des avantages non contributifs — la pénibilité a un payeur
      nommé depuis 2010 (contribution de la branche AT-MP, L. 241-3),
      l'allocation veuvage a eu sa propre cotisation de 1985 à 2004 (D. 242-5,
      0,10 % à la charge du seul salarié), et le minimum contributif a été
