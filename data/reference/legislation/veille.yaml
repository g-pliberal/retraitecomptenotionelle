    textes:
      - "R. 643-7 CSS (professions libérales), version du 1er septembre 2023"
      - "R. 723-38 CSS (avocats)"
      - "L. 14 I du code des pensions civiles et militaires"
      - "R. 351-27 2° CSS et R. 732-61 du code rural : aucun plafond"
    sources:
      - type: legifrance
        reference: >-
          R. 643-7 CSS, LEGIARTI000047633290 : « Le coefficient de minoration
          est égal à 1,25 % par trimestre manquant dans la limite de vingt
          trimestres. » R. 723-38 CSS et le I de L. 14 du code des pensions
          portent la même limite.
        date: "2026-09-22"
      - type: legifrance
        reference: >-
          R. 351-27 2° CSS, LEGIARTI000054589995, version du 1er août 2026 :
          « Pour chaque trimestre ainsi retenu, le coefficient de minoration à
          appliquer au “ taux plein ” est 1,25 %. » Aucune limite de trimestres
          n'y figure, et R. 732-61 du code rural n'en porte pas davantage.
          R. 351-27-1, qui plafonne, ne vise que les assurés de L. 161-17-4.
        date: "2026-09-22"
    verifie_le: "2026-09-22"
    temoins: []
    reformes: []
    etat: conforme
    effet: >-
      Aucun. Le modèle applique un plafond de vingt trimestres par défaut
      (`decote_trimestres_maximum`), et il ne mord sur AUCUNE des 2 483
      liquidations ouvertes qu'un balayage de la grille produit — treize cas
      types, six générations, tous les trimestres de cinquante à soixante-huit
      ans. La raison est mesurable dans les tables : l'écart entre l'âge
      d'ouverture et l'âge d'annulation vaut exactement vingt trimestres pour
      les générations 1930 à 1961, puis dix-huit, quinze, treize et douze
      ensuite. Le décompte par l'âge est donc borné par construction sur toute
      liquidation ouverte. Deux tests le tiennent.
    a_faire: null
    prochaine_veille: "2027-06-30"

  - id: age_reference_decote_ieg
    regle: "Âge d'annulation de la décote du régime spécial des IEG : l'âge minimum d'ouverture majoré de TROIS ans depuis le 1er janvier 2025, et soixante-deux ans pour les agents en services actifs nés avant 1975."
    textes: ["annexe 3 du décret n° 46-1541 du 22 juin 1946, article 10 I et article 45 (LEGIARTI000052046924)", "décret n° 2023-692 du 28 juillet 2023"]
    sources:
      - {type: legifrance, reference: "annexe 3 du statut national des IEG, version en vigueur au 6 août 2025, LEGIARTI000052046924, lue dans l'index LEGI du dépôt", date: "2026-09-22"}
      - {type: autre, reference: "CNIEG, réglementation, « Âge d'annulation de la décote » : « à compter du 1er janvier 2025 […] âge minimum + 3 ans (sauf exceptions) », de façon à maintenir cet âge au plus tard à soixante-sept ans", url: "https://www.cnieg.fr/accueil/reglementation/particulier/droit-retraite/calcul/decote/age-annulation-decote.html", date: "2026-09-22"}
    verifie_le: "2026-09-22"
    temoins: []
    reformes: [reforme_2023]
    etat: conforme
    effet: >-
      La fiche portait l'âge d'ouverture majoré de CINQ ans — 63,75 ans pour
      les liquidations de 2025-2026, 64 ans ensuite —, règle d'avant la réforme
      de 2023. Un agent liquidant à soixante-deux ans se voyait opposer sept
      trimestres de décote de trop, soit 8,75 % de pension. Corrigé à
      soixante-deux ans. Sur le cas type des IEG, l'écart au système actuel
      passe de −23 % à −32 % pour la génération 1970 et de −38 % à −45 % pour
      celle de 2000 : le cas type des IEG devient, en tête de la page Cas
      types, la carrière la moins bien traitée par la proposition, à la place
      du militaire non officier.
    a_faire: >-
      La même question se pose pour la SNCF et la RATP, dont les fiches portent
      aussi l'âge d'ouverture majoré de cinq ans (53,5 et 58,5) : leurs textes
      n'ont pas été lus. Le 7° de l'article 16 des IEG garde d'ailleurs les
      cinq ans, et la fiche ne distingue pas cette population.
    prochaine_veille: "2027-03-31"

  - id: duree_requise_ieg
    regle: "Durée d'assurance requise du régime spécial des IEG : le régime a SA table par génération, qui n'est pas celle du régime général."
    textes: ["annexe 3 du décret n° 46-1541 du 22 juin 1946, article 45 (LEGIARTI000052046924)"]
    sources:
      - {type: legifrance, reference: "annexe 3 du statut national des IEG : « A compter du 1er juillet 2019, elle est fixée à : 167 trimestres, pour les agents nés entre le 1er juillet 1959 et le 31 décembre 1960 ; 168 pour 1961-1962 ; 169 pour 1963 ; 170 pour 1964-1965 ; 171 pour 1966-1967 ; 172 à partir de 1968 »", date: "2026-09-22"}
      - {type: autre, reference: "CNIEG, réglementation, « Tableau des durées d'assurance » applicable à compter du 1er janvier 2025 : mêmes valeurs, par génération et par motif d'anticipation", url: "https://www.cnieg.fr/accueil/reglementation/particulier/droit-retraite/calcul/duree-assurance/tableau-duree-assurance.html", date: "2026-09-22"}
    verifie_le: "2026-09-22"
    temoins: []
    reformes: [reforme_2023]
    etat: manque
    effet: >-
      La fiche des IEG porte `duree_requise_par_generation: true`, qui lit la
      table du régime général. Trois générations y diffèrent : 1963 (169
      trimestres aux IEG, 170 au commun), 1966 et 1967 (171 contre 172). Un
      trimestre de trop vaut 1,25 % de décote ou un cent-soixante-douzième de
      prorata, soit environ 0,6 % de pension. La CNIEG publie en outre une
      table par MOTIF D'ANTICIPATION — hors anticipation, anticipation de cinq
      ans au titre de quinze ans de services actifs, de quatre ans au titre de
      douze ans —, que le dépôt ne porte pour aucun régime spécial.
    a_faire: >-
      `_duree_requise` lit trois tables : celle de la fonction publique
      (2004-2008), la dérogation de catégorie active
      (`legislation/categorie_active.csv`, par classement et par génération) et
      la table commune. Il en faut une quatrième, par RÉGIME, et son portage
      dans `moteur/js/`. À mener avec la même question pour la SNCF, la RATP et
      les mines, dont les textes portent sans doute aussi leur propre table.
    prochaine_veille: "2027-03-31"

  - id: marins_ouverture_cinquante_ans
    regle: >-
      Pension d'ancienneté des marins ouverte à cinquante ans pour vingt-cinq
      années de services, plafonnée à vingt-cinq annuités avant cinquante-cinq
      ans, plafond levé à cinquante-deux ans et demi pour trente-sept annuités
      et demie.
    textes: ["code des pensions de retraite des marins, R. 2 (LEGIARTI000006791972), R. 3, R. 5 et R. 13 (LEGIARTI000006791990)", "code des transports, L. 5552-4, L. 5552-5 et L. 5552-19"]
    sources:
      - {type: legifrance, reference: "code des pensions de retraite des marins, R. 2, R. 3, R. 5, R. 13, versions en vigueur lues dans l'index LEGI", date: "2026-09-22"}
      - {type: autre, reference: "ENIM, page « Les conditions d'attribution », pension d'ancienneté, exemple de Gaspard", url: "https://www.enim.eu/retraite/conditions-dattribution", date: "2026-09-22"}
    verifie_le: "2026-09-22"
    temoins: [enim_anciennete_a_cinquante_ans]
    reformes: []
    etat: conforme
    effet: >-
      La fiche opposait cinquante-cinq ans à tout marin : c'est l'âge qui borne
      l'entrée en jouissance de celui qui CONTINUE à naviguer (L. 5552-5), non
      l'âge d'ouverture. Le départ à cinquante ans que le plafond de R. 13
      suppose était donc refusé. Il est ouvert depuis le 22 septembre 2026
      (`age_ouverture_services`), et l'exception des cinquante-deux ans et
      demi est appliquée (`duree_maximum_levee_age`). Aucun relèvement d'âge
      depuis 1968 : ni LEGI ni le JORF n'en portent, et la loi de 2023 laisse
      le régime où il était (reformes.yaml).
    a_faire: >-
      La pension SPÉCIALE (moins de quinze ans de services) s'ouvre à
      cinquante-cinq ans pour qui touche une autre pension de base, à soixante
      sinon (R. 5) ; le modèle l'ouvre à cinquante-cinq dans tous les cas. La
      page de l'ENIM se contredit sur ce point — « l'âge légal […] du régime
      général » dans le texte, « à 60 ans » dans l'exemple d'Henry — et c'est
      R. 5 qui dit soixante.
    prochaine_veille: "2027-03-31"

