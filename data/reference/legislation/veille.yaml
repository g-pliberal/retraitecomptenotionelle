  - id: duree_opposee_aux_regimes_en_points
    regle: >-
      Les régimes de base EN POINTS opposent la durée d'assurance TOUS RÉGIMES,
      comme les régimes en annuités : la pension est servie entière à qui a la
      durée requise, et minorée par un coefficient de réduction à qui ne l'a
      pas. Vaut pour la CNAVPL (professions libérales) et pour la MSA des
      non-salariés agricoles.
    textes:
      - "L. 643-3 I CSS (professions libérales), version du 31 décembre 2025 issue de la loi n° 2025-1403, applicable aux pensions prenant effet à compter du 1er septembre 2026"
      - "L. 732-24 II du code rural (non-salariés agricoles), version du 1er janvier 2026"
    sources:
      - type: legifrance
        reference: >-
          L. 643-3 CSS, LEGIARTI000053280388, version du 31 décembre 2025, lue
          par le récupérateur dans l'index LEGI du dépôt à jour au 20 septembre
          2026 : « Lorsque l'intéressé a accompli la durée d'assurance fixée en
          application du deuxième alinéa de l'article L. 351-1 dans le présent
          régime et dans un ou plusieurs autres régimes d'assurance vieillesse
          de base, le montant de la pension de retraite est égal au produit de
          la valeur du point par le nombre de points acquis. Un décret en
          Conseil d'Etat fixe les coefficients de réduction de la pension de
          retraite applicables en fonction de l'âge auquel est demandée la
          liquidation et de la durée d'assurance lorsque l'intéressé ne
          justifie pas de la durée prévue au deuxième alinéa. »
        date: "2026-09-21"
      - type: legifrance
        reference: >-
          L. 732-24 du code rural, LEGIARTI000053280317, version du 1er janvier
          2026, II : « Pour les assurés qui ne justifient, ni dans le régime
          institué par le présent chapitre ni dans un ou plusieurs autres
          régimes obligatoires, d'une durée d'assurance et de périodes reconnues
          équivalentes au moins égale à la durée mentionnée au deuxième alinéa
          de l'article L. 351-1 du code de la sécurité sociale, un coefficient
          de minoration est appliqué aux montants prévus au 2° du I. »
        date: "2026-09-21"
    verifie_le: "2026-09-21"
    temoins: []
    reformes: []
    etat: conforme
    effet: >-
      Le coefficient de réduction était DÉJÀ appliqué par le moteur
      (`_abattement_points` lit la décote de la fiche) ; ce qui manquait est que
      la règle qui DATE le départ ne le voyait pas. `age_taux_plein_droit`
      rendait l'âge d'ouverture dès que la carrière n'avait aucune période en
      annuités, si bien que le modèle faisait liquider « au taux plein » des
      carrières qu'il servait minorées — le libéral né en 1955 partait à
      soixante-quatre ans avec cent quarante-huit trimestres sur cent
      soixante-six requis. Les deux articles ci-dessus disent que la durée
      s'oppose, et la règle les suit depuis le 21 septembre 2026.
    a_faire: null
    prochaine_veille: "2027-03-31"

  - id: bareme_minoration_regimes_en_points
    regle: >-
      Le coefficient de minoration des professions libérales est celui du
      régime général : le plus petit des deux décomptes — trimestres jusqu'à
      l'âge d'annulation, trimestres manquants pour la durée requise —, arrondi
      au chiffre supérieur, à 1,25 % par trimestre, dans la limite de vingt
      trimestres.
    textes:
      - "R. 643-7 CSS, version du 1er septembre 2023"
    sources:
      - type: legifrance
        reference: >-
          R. 643-7 CSS, LEGIARTI000047633290, version du 1er septembre 2023,
          lue dans l'index LEGI du dépôt : « La réduction prévue au troisième
          alinéa du I de l'article L. 643-3 est fonction, soit du nombre de
          trimestres correspondant à la durée séparant l'âge auquel la pension
          de retraite prend effet du soixante-cinquième anniversaire […] ou,
          dans le cas contraire, de l'âge prévu au 1° de l'article L. 351-8,
          soit du nombre de trimestres supplémentaires qui serait nécessaire
          […] pour relever du deuxième alinéa du I de l'article L. 643-3. Le
          nombre de trimestres correspondant est éventuellement arrondi au
          chiffre immédiatement supérieur. Le plus petit de ces deux nombres
          est pris en considération. Le coefficient de minoration est égal à
          1,25 % par trimestre manquant dans la limite de vingt trimestres. »
        date: "2026-09-21"
      - type: legifrance
        reference: >-
          R. 732-39 du code rural, LEGIARTI000024113166 : pose la CONDITION du
          coefficient — liquidation avant l'âge de L. 732-25 et sans la durée
          du deuxième alinéa de L. 351-1 — et non son taux.
        date: "2026-09-21"
      - type: legifrance
        reference: >-
          R. 732-61 du code rural, LEGIARTI000035918397, version du 28 octobre
          2017 en vigueur jusqu'au 1er janvier 2026 : « La minoration est égale
          au produit du plus petit de ces deux nombres, arrondis chacun au
          nombre immédiatement supérieur, par le coefficient suivant : −2,5 %
          pour l'assuré né avant le 1er janvier 1944 ; −2,375 % pour l'assuré
          né en 1944 ; −2,25 % en 1945 ; −2,125 % en 1946 ; −2 % en 1947 ;
          −1,875 % en 1948 ; −1,75 % en 1949 ; −1,625 % en 1950 ; −1,5 % en
          1951 ; −1,375 % en 1952 ; −1,25 % pour l'assuré né après 1952. » Ces
          onze valeurs sont, génération par génération, celles du II de
          R. 351-27 que porte déjà `coefficient_minoration.csv`.
        date: "2026-09-22"
      - type: legifrance
        reference: >-
          R. 732-68 du code rural, LEGIARTI000053336735, version du 1er janvier
          2026 (décret n° 2025-1409 du 31 décembre 2025) : « Le coefficient de
          minoration prévu au II de l'article L. 732-24 du présent code est
          déterminé dans les mêmes conditions que celui mentionné au 2° du I de
          l'article R. 351-27 du code de la sécurité sociale, y compris
          s'agissant du plafonnement mentionné à l'article R. 351-27-1 du même
          code. » L'alignement sur le régime général devient explicite.
        date: "2026-09-22"
    verifie_le: "2026-09-21"
    temoins: []
    reformes: []
    etat: conforme
    effet: >-
      Le barème de la fiche `cnavpl` — 1,25 % par trimestre — est confirmé par
      le texte, et `_trimestres_de_decote` appliquait déjà les trois règles de
      l'article : plus petit des deux décomptes, arrondi de R. 351-27, plafond
      de vingt trimestres. Le barème AGRICOLE l'est aussi, et il est
      générationnel : R. 732-61 donne les onze mêmes valeurs que le II de
      R. 351-27, de 2,5 % avant 1944 à 1,25 % après 1952, et la fiche
      `msa_non_salaries` porte déjà `decote_par_generation: true`, qui les lit
      dans `coefficient_minoration.csv`. Son `decote_par_trimestre: 0.0125`
      n'est que le repli. Aucune valeur n'a bougé, des deux côtés.
    a_faire: null
    prochaine_veille: "2027-03-31"

