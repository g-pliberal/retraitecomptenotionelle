    prochaine_veille: "2027-03-31"

  - id: surcote_parentale
    regle: "1,25 % par trimestre cotisé dans l'année qui précède l'âge légal et au-delà de la durée requise, quatre au plus, dès que l'âge légal atteint 63 ans, à qui détient un trimestre de majoration de durée d'assurance pour enfants."
    textes: ["L. 351-1-2-1 CSS (loi n° 2023-270, article 11 ; loi n° 2025-199, article 87)"]
    sources:
      - {type: legifrance, reference: "L. 351-1-2-1 CSS, LEGIARTI000047449229, version du 1er septembre 2023 : la durée cotisée « accomplie l'année précédant l'âge mentionné à l'article L. 161-17-2, lorsque celui-ci est égal ou supérieur à soixante-trois ans, et au delà de la limite mentionnée au deuxième alinéa de l'article L. 351-1 »", date: "2026-09-23"}
      - {type: legifrance, reference: "L. 351-1-2-1 CSS, LEGIARTI000051289776, version du 28 février 2025 : l'âge de la surcote, « sous réserve qu'il soit égal ou supérieur à soixante-trois ans, est abaissé d'un an »", date: "2026-09-23"}
    verifie_le: "2026-09-23"
    temoins: []
    reformes: [reforme_2023]
    etat: transcrit
    effet: >-
      Parents dont l'âge légal atteint 63 ans, générations 1965 nées après mars
      et suivantes. Jusqu'au 23 septembre 2026, le module faisait courir la
      fenêtre de 63 ans à l'âge légal, et demandait la durée requise à
      63 ans : zéro trimestre à la génération 1965 née après mars, un à 1966,
      deux à 1967, trois à 1968, là où le texte en ouvre quatre à chacune ; et
      rien du tout à qui atteignait la durée en cours de fenêtre, là où le
      texte paie les trimestres qui la dépassent. La fenêtre est datée au
      mois, les trimestres de chaque année répartis sur ses mois ;
      `test_la_surcote_parentale_ne_compte_que_les_trimestres_au_dela_de_la_duree`
      tient la règle.
    a_faire: >-
      Chercher la circulaire Cnav d'application du décret n° 2023-799 et son
      exemple chiffré : la fiche F19643 de service-public (vérifiée le
      1er janvier 2026) ne décrit pas la surcote parentale, et la circulaire
      2026-07 non plus.
    prochaine_veille: "2027-03-31"

  - id: services_et_duree_fonction_publique
    regle: >-
      La pension de la fonction publique se proratise sur les SERVICES ET
      BONIFICATIONS, non sur la durée d'assurance (L. 13 CPCMR), et l'article
      L. 9 écarte des services « le temps passé dans une position statutaire ne
      comportant pas l'accomplissement de services effectifs au sens de
      l'article L. 5 », hors la liste fermée qu'il énumère : congé parental,
      temps partiel de droit et disponibilité pour élever un enfant dans la
      limite de trois ans par enfant né ou adopté à partir du 1er janvier 2004 ;
      congés de maladie, de maternité, d'accident de service et de maladie
      professionnelle du fonctionnaire en activité ; congés de formation et
      congé civique ; détachement. Le chômage n'est pas une position
      statutaire : il n'ouvre aucun service.
    textes: ["L. 5 CPCMR", "L. 9 CPCMR", "L. 13 CPCMR"]
    sources:
      - type: legifrance
        reference: >-
          L. 9 CPCMR, LEGIARTI000053279095, lu par le récupérateur dans l'index
          LEGI du dépôt : « Le temps passé dans une position statutaire ne
          comportant pas l'accomplissement de services effectifs au sens de
          l'article L. 5 ne peut entrer en compte dans la constitution du droit
          à pension, sauf : 1° Dans la limite de trois ans par enfant né ou
          adopté à partir du 1er janvier 2004 […] »
        date: "2026-09-22"
      - type: legifrance
        reference: "L. 5 CPCMR, LEGIARTI000047453644, liste des services retenus"
        date: "2026-09-22"
    verifie_le: "2026-09-22"
    temoins: []
    reformes: []
    etat: conforme
    effet: >-
      Toute carrière de fonctionnaire coupée par une interruption. Le moteur
      créditait le prorata de TOUTE période validée : cinq ans de chômage
      servaient exactement la même pension qu'une carrière pleine. Ils en
      retirent désormais vingt trimestres de services, soit 11,9 % de pension
      sur une carrière de fonctionnaire d'État née en 1975 et partie à
      soixante-quatre ans. La durée d'assurance, elle, ne bouge pas : les mêmes
      cinq ans restent vingt trimestres assimilés pour la décote, et le régime
      général continue de les compter dans sa propre proratisation.
    a_faire: >-
      DEUX APPROXIMATIONS ASSUMÉES, toutes deux du côté généreux. La première :
      la condition « né ou adopté à partir du 1er janvier 2004 » du 1° n'est pas
      appliquée, le modèle ne collectant pas l'année de naissance des enfants —
      il la déduit de l'âge de la mère. Un congé parental pris pour un enfant né
      avant 2004 ouvre donc ici trois ans de services que L. 9 lui refuse. La
      seconde : les dix-huit régimes spéciaux se proratisent eux aussi sur des
      services, mais leurs règlements n'ont pas été lus, et la règle ne
      s'applique qu'à la famille `fonction_publique` ; `docs/limites.md` le
      porte. Reste enfin à lire le 2° de L. 9 article par article : la liste des
      congés exceptés est transcrite motif par motif dans
      `periodes_non_travaillees.csv`, mais le modèle ne connaît pas la POSITION
      statutaire, seulement le motif, et présume l'agent en activité.
    prochaine_veille: "2027-06-30"

  - id: taux_maximum_fonction_publique
    regle: "Pourcentage maximum de la pension civile : 75 % du traitement, que les bonifications seules peuvent porter jusqu'à 80 % ; les services restent plafonnés à la durée requise."
    textes: ["L. 12 CPCMR, dernier alinéa", "L. 13 CPCMR", "décret n° 2003-1306, article 15 III (CNRACL)", "décret n° 2004-1056, article 12 II (FSPOEIE)"]
    sources:
      - {type: legifrance, reference: "L. 12 CPCMR, LEGIARTI000053280361 : « Le pourcentage maximum fixé à l'article L 13 peut-être augmenté de cinq points du chef des bonifications »", date: "2026-09-23"}
      - {type: legifrance, reference: "décret n° 2003-1306, article 15, LEGIARTI000054590023, et décret n° 2004-1056, article 12, LEGIARTI000054590048 : la même clause", date: "2026-09-23"}
      - {type: autre, reference: "Service des retraites de l'État, « La formule de calcul » : « le pourcentage maximal de 75 % peut être porté à 80 % »", url: "https://retraitesdeletat.gouv.fr/actif/le-calcul-de-ma-retraite/la-formule-de-calcul", date: "2026-09-23"}
    verifie_le: "2026-09-23"
    temoins: []
    reformes: []
    etat: conforme
    effet: >-
      Fonctionnaires dont les services et les bonifications dépassent la durée
      requise, mères surtout. Le module plafonnait les deux ENSEMBLE à la
      durée requise : une mère de trois enfants nés avant 2004, 168 trimestres
      de services et 12 de bonification pour 169 requis, était liquidée sur
      169/169 et non sur 180/169, soit 6,5 % de pension en moins. Le champ
      `taux_maximum_bonifie` des fiches porte les 80 % ;
      `test_les_bonifications_portent_le_taux_au_dela_de_75_pour_cent` tient
      la règle. Aucun exemple chiffré publié ne l'atteint.
    a_faire: >-
      Les règlements de la SNCF, de la RATP, des IEG, de l'Opéra et de la
      Comédie-Française portent la même clause ; leurs bonifications ne sont
      pas modélisées, et leurs fiches ne portent donc pas le champ.
    prochaine_veille: "2027-06-30"

  - id: taux_plein_et_proratisation
    regle: "Pension = salaire annuel moyen × taux × durée dans le régime / durée requise ; durée de proratisation propre aux générations 1944-1948."
    textes: ["L. 351-1 CSS", "R. 351-6 CSS"]
    sources:
      - {type: service_public, reference: "fiches F21552 et F36464", date: "2026-09-01"}
    verifie_le: "2026-09-17"
    temoins: [sp_f21552_taux_plein_170, sp_f21552_67_ans_158, sp_f21552_65_ans_158]
    reformes: []
    etat: conforme
    effet: "Toute pension du régime général et des régimes alignés."
    a_faire: null
    prochaine_veille: "2027-06-30"

  # ---- Salaire de référence -------------------------------------------
  - id: salaire_annuel_moyen
    regle: "Vingt-cinq meilleures années (dix à vingt-cinq par génération de 1934 à 1948), salaires revalorisés par les coefficients de la circulaire annuelle, année du départ exclue, plafond proratisé."
