    trouve: >-
      LE PLAFOND DE VINGT TRIMESTRES N'EST PAS UNE RÈGLE DE PLUS. Il est écrit
      chez les libéraux, les avocats et la fonction publique, absent de
      R. 351-27 2° et de R. 732-61 — et il ne mord sur aucune des 2 483
      liquidations ouvertes d'un balayage complet de la grille, parce que
      l'écart entre l'âge d'ouverture et l'âge d'annulation vaut au plus vingt
      trimestres : exactement vingt de 1930 à 1961, douze après 1968. Rien à
      changer dans le calcul ; la docstring, qui en faisait une règle de « tous
      les régimes », est réécrite, et deux tests tiennent l'identité.
      LE COR PUBLIE UN CAS TYPE DE LIBÉRAL, et le dépôt le retrouve. Son cas
      type n° 13, un médecin généraliste de secteur 1 né en 1960, « peut
      prétendre à un départ à 62 ans » et « atteint le taux plein à 66 ans et
      9 mois » ; la fiche du dépôt donne 62,00 et 67,00 pour la même
      génération. La règle d'exception que cette fiche portait — « ouverture
      plus deux ans » — n'était qu'un contournement du défaut corrigé la
      veille, et sa constante ne s'appuyait sur aucune source : elle est rendue
      à la règle ordinaire. `ecart_liquidation` n'a plus qu'un usager, le
      militaire.
    reste: >-
      Le cas type libéral n'a toujours aucune carrière antérieure, quand la
      CNAVPL immatricule ses affiliés à 32,58 ans en moyenne. Contre l'âge
      observé de sa caisse, la fiche passe de 1,24 an trop tôt à 1,42 an trop
      tard : les deux conventions manquent la moyenne réelle d'à peu près
      autant, en sens contraire, et seule une carrière en deux temps les
      départagerait — ce que `CasType`, qui ne porte qu'une affiliation, ne
      sait pas exprimer.
    session: les taux de la CNRACL, lus chez le gestionnaire du régime
    consulte: >-
      Documentation juridique de la CNRACL (`juris-cnracl.retraites.fr`),
      page « Cotisations — historique des taux applicables » : quarante-neuf
      périodes, du 19 septembre 1947 à 2026, retenue de l'agent et contribution
      de l'employeur. Page mère « Taux de cotisations ». Relancés, pour
      recouper : `dila_index.py legi` et `jorf --recuperer`,
      `dila_legi_cnracl.py`, `contribution_employeur_public.py`,
      `sncf_contribution_employeur.py`.
    trouve: >-
      AUCUN ÉCART, ET C'EST LE RÉSULTAT. Les soixante-dix-neuf années de
      contribution employeur et toute la série de retenue du dépôt s'accordent
      avec le tableau du gestionnaire, au centième de point près, y compris la
      convention de date — le taux en vigueur au 1er janvier vaut pour l'année.
      Ce qui change n'est donc pas un chiffre mais son RANG : la Caisse des
      dépôts gère la CNRACL, c'est le producteur, et les quarante années que le
      dépôt tenait d'OpenFisca au niveau `haute` passent à `certifiee`. La
      série employeur de la CNRACL n'a plus une seule année de second rang.
      La page mère signale par ailleurs deux cotisations SUPPLÉMENTAIRES que
      le dépôt ne porte pas — sapeurs-pompiers professionnels (indemnité de
      feu) et aides-soignants (prime spéciale de sujétion) — et rappelle que
      la NBI est cotisée au taux du traitement depuis 2012.
    reste: >-
      Dix années ont vu leur taux changer en cours de route, et la convention
      annuelle du dépôt ne peut pas les rendre : la plus lourde est 1980, où la
      contribution tombe de 18 % à 6 % au 1er juillet — l'employeur a versé
      cette année-là la moitié de ce que le dépôt lui compte.
      `tests/test_juris_cnracl_taux.py` les nomme toutes les dix et vérifie
      qu'il n'y en a pas d'autres. Et un piège de manipulation, rencontré en
      chemin : `verifier_donnees.py --appliquer` lancé avec un `data/brut/`
      incomplet REDESCEND les lignes dont la meilleure source est absente —
      cinq années de la SNCF sont ainsi passées de `certifiee` à `haute` avant
      d'être rendues à leur rang. Lancer les récupérateurs avant d'appliquer.
  - date: 2026-09-22
    session: le même texte lu deux fois, et un mois de septembre perdu
    consulte: >-
      `python scripts/veille_droit.py` au démarrage, puis
      `python scripts/fetch/dila_index.py legi --mettre-a-jour` — zéro incrément
      depuis celui du 21. Index LEGI : article 10 de la loi n° 2023-270 dans sa
      version du 31 décembre 2025 (LEGIARTI000053280920), XXIV, A, B et C lus
      alinéa par alinéa ; article 13 du décret n° 2023-435 dans sa rédaction
      issue de l'article 3 du décret n° 2026-344 (LEGIARTI000054059137), II, A à
      G ; L. 161-17-3 du code de la sécurité sociale dans sa version du
      22 janvier 2014 (LEGIARTI000028494794), qui est l'escalier « applicable
      avant l'entrée en vigueur » auquel les deux textes renvoient ; et L. 13 du
      code des pensions dans sa version du 31 décembre 2025
      (LEGIARTI000053280906), qui renvoie la durée du pourcentage maximum à
      L. 161-17-3. Vérifié au passage, pour la ligne `fin_de_la_suspension_2028`,
      que L. 161-17-2 et L. 161-17-3 n'ont pas de version postérieure au
      31 décembre 2025.
    trouve: >-
      LE MÊME TEXTE QUE L'ENTRÉE PRÉCÉDENTE, LU LE MÊME JOUR PAR UNE AUTRE
      SESSION, ET LA MÊME CORRECTION PORTÉE JUSQU'AU BOUT DE CHAQUE CÔTÉ : table
      identique, valeurs identiques, découverte au rebasage. Le doublon a été
      abandonné au profit de `main`. CE QUE LA LECTURE A AJOUTÉ, en revanche :
      la mise à l'essai de l'escalier marche par marche, y compris la marche qui
      DESCEND — un super-actif né en août 1971 doit 171 trimestres, celui de
      septembre 169, le texte remettant leur compteur à 169 au moment même où
      leur âge commence à monter. Et c'est cet essai qui a buté sur UN MOIS DE
      SEPTEMBRE PERDU, qui n'a rien à voir avec le droit : les tables écrivent
      le 1er septembre `1961.667`, huit douzièmes valent 1961,666 666…, et la
      lecture en escalier rendait donc à l'assuré né en SEPTEMBRE 1961 la marche
      d'août — 168 trimestres au lieu de 169 et 62 ans d'âge d'ouverture au lieu
      de 62 ans et trois mois, pour le mois-même que la loi du 14 avril 2023
      désigne. Le trou valait aussi pour `1963.667` de la carrière longue,
      `1966.667` et `1971.667` de la catégorie active, `1971.667` de la
      jouissance militaire. La génération est maintenant lue à la précision où
      les tables sont écrites.
    reste: >-
      DEUX LIGNES À OUVRIR, lues et non portées : le F du même II donne à la
      carrière longue de la fonction publique sa propre durée cotisée — 167
      trimestres de 1958 à 1960, 171 de 1970 à 1972 —, et le C vise les autres
      départs avant soixante ans. ET UNE LEÇON DE MÉTHODE, qui vaut d'être
      consignée là où les sessions la reliront : deux sessions ont passé la même
      journée sur la même ligne du registre parce que rien ne disait qu'elle
      était prise. Le partage par zones du `CLAUDE.md` nomme le modèle, les
      données et le site ; le registre de veille est une zone de plus, et ses
      lignes `manque` se prennent une à la fois.
    session: la réglementation des IEG, lue chez la CNIEG puis dans son texte
    consulte: >-
      CNIEG, pages « réglementation » : mode de calcul, taux de la pension,
      durée d'assurance et son tableau, décote, coefficient, âge d'annulation
      de la décote, surcote. Puis, dans l'index LEGI du dépôt, l'annexe 3 du
      décret n° 46-1541 du 22 juin 1946 — vingt versions datées, dont celle en
      vigueur (LEGIARTI000052046924, 6 août 2025).
    trouve: >-
      DEUX CHOSES CONFIRMÉES, DEUX ÉCARTS. Confirmées : la montée en charge de
      la décote des régimes spéciaux, que le dépôt modélise déjà — rien avant
      le 1er juillet 2010, un dixième par an, 1,25 % en 2019 — et l'âge
      d'annulation reculant de seize trimestres à rien de 2010 à 2024, tables
      que la CNIEG publie à l'identique. Les écarts : depuis le 1er janvier
      2025, l'âge de référence est l'âge minimum majoré de TROIS ans et non de
      cinq, et vaut soixante-deux ans pour les agents en services actifs nés
      avant 1975 — la fiche portait 63,75 puis 64 ans, soit sept trimestres de
      décote de trop ; et le régime a SA PROPRE table de durée requise, dont
      trois générations diffèrent de la table commune que le dépôt lui oppose.
      Le premier écart est corrigé, le second est ouvert : il demande une
      quatrième table dans `_duree_requise` et son portage JavaScript.
    reste: >-
      La SNCF et la RATP portent la même construction — âge d'ouverture majoré
      de cinq ans — et leurs textes n'ont pas été lus : si la réforme de 2023
      les a traités comme les IEG, deux autres fiches décotent de trop. C'est
      la première chose à faire du prochain lot. La CNIEG publie par ailleurs
      deux exemples chiffrés de surcote, transcriptibles en témoins le jour où
      `tests/test_oracle.py` saura construire une carrière de régime spécial.

