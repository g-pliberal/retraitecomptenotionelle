    trouve: >-
      UNE ERREUR DU MODÈLE, ET ELLE VALAIT 1,2 % D'UNE PENSION. L'article
      L. 12 bis accorde aux mères fonctionnaires une MAJORATION DE DURÉE
      D'ASSURANCE de deux trimestres par enfant né depuis 2004 ; l'article
      L. 12 b accordait, lui, une BONIFICATION. Les deux ne tombent pas dans la
      même case : une bonification s'ajoute aux services et relève donc le
      prorata, une majoration de durée ne joue que sur la décote et la durée
      tous régimes. Le moteur les confondait et portait les deux trimestres au
      prorata de la fonction publique. La preuve interne que la distinction est
      la bonne : l'article 104 de la loi n° 2025-1403 crée un b ter pour
      convertir l'un des deux trimestres en bonification, et réécrit L. 12 bis
      pour dire que « l'un est pris en compte au titre de la bonification
      prévue au b ter » — une conversion n'a de sens que si les cases diffèrent.
      Sur un témoin du dépôt, mère fonctionnaire d'État de trois enfants : les
      services passent de 142 à 139 trimestres et la pension de 46 938 à
      45 946 € par an.
      DEUX ARTICLES LUS POUR COMBLER LES DETTES de la confrontation à la liste
      légale : le second alinéa de L. 6243-3 du code du travail, qui fait
      verser un complément de cotisations pour valider les trimestres
      d'apprentissage ; et L. 351-7-1, qui ne porte pas des « périodes
      équivalentes » génériques mais la réduction de durée requise pour les
      SERVICES MILITAIRES EN AFRIQUE DU NORD — article toujours en vigueur
      alors que le poste qui le finançait est abrogé au 1er janvier 2026.
      SIX BASCULES DE RÉGIMES SPÉCIAUX. Les bonifications de conduite de la
      SNCF et du tableau B de la RATP sont réservées, dès la rédaction initiale
      des décrets de 2008, aux agents admis avant le 1er janvier 2009 ; elles
      exigent quinze années de services effectifs depuis 2017 ; et elles se
      sont élargies trois fois depuis — activité partielle en 2020, emplois
      équivalents à la RATP en 2025, congé de mobilité à la SNCF le 7 août 2026.
    reste: >-
      Le scénario 1 EST MODIFIÉ, et c'est la première fois de cette série de
