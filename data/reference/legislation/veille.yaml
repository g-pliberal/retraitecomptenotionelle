    effet: "Toute liquidation avant le taux plein. Le coefficient par génération de la table (2,5 % à 1,375 % pour les nés avant 1953) ne concerne plus personne : ces générations ont passé l'âge du taux plein d'office, et le droit ne l'écrit plus."
