      référence l'a été. Les reprises de veille du 17 septembre 2026 restent
      ouvertes.
  - date: "2026-09-20"
    session: "les frais du pilier capitalisé, questionnés sur le document du producteur"
    consulte: >-
      Le rapport 2026 de l'Observatoire des produits d'épargne financière
      (OPEF2026.pdf, sha256 eca04bb1…), obtenu par l'outil de lecture web de
      Claude Code alors que curl et le runner sont refusés, tableaux T5 à T7
      et le texte du chapitre 2 sur les frais ; le rapport 2025 (tableau T11,
      exercice 2023) ; le rapport annuel 2024 du FRR (coûts du Fonds) ; la
      page « pilotage technique » de l'ERAFP ; la page « avgifter och
      rabatter » de Pensionsmyndigheten ; les reprises de presse
      (Meilleurtaux Placement, Tout sur mes finances) qui avaient servi à la
      saisie.
    trouve: >-
      Les trois frais saisis sont ceux du document, pour 2025 (1,09 / 0,76 /
      2,20) comme pour 2024 (1,16 / 0,77 / 2,19), et 2023 donne 1,20 / 0,73.
      Ce que la presse n'avait pas repris : la moyenne des arrérages est non
      pondérée et ne porte que sur 9 assureurs sur 20, les onze autres ne
      facturant rien ; le frais sur versement du PER est le double de
      l'assurance-vie et six fois le contrat de capitalisation, écart que
      l'OPEF attribue à des frais fixes sur des primes petites. Pour situer la
      borne haute : prime de pension suédoise 0,11 % + 0,024 % des encours, FRR
      0,41 % toutes charges (8,6 points de base de coûts fixes), ERAFP « au
      moins 0,2 % ». Sensibilité mesurée sur le modèle : de + 1 % (sans frais
      sur versement) à + 22 % (sans aucun frais) sur la rente d'une carrière
      entière après la bascule ; le repère « environ 10 % » de limites.md pour
      une gestion à 0,20 % était sous-estimé, c'est 13 %. Un récupérateur
      (scripts/fetch/opef_frais_per.py) lit les trois tableaux et confronte.
      Aucune règle du scénario 1 n'est touchée.
    reste: >-
      Le barème retenu est inchangé : la borne haute reste le choix par
      défaut, et le passage à un barème de pilier obligatoire est une décision
      de proposition, pas de lecture. Le document n'est pas sur le miroir du
      dépôt : à déposer à la main sur la release documents-apportes, avec
      l'empreinte inscrite au manifeste, pour que `--recuperer` le rapporte.
      Le niveau reste `haute` : `certifiee` demanderait que
      verifier_donnees.py lise le fichier de frais, qui n'est pas une série.
      Les frais des PER d'entreprise (PERECO, PERO), exclus des statistiques
      de l'OPEF, n'ont pas de source publique équivalente.
  - date: "2026-09-20"
    session: "les vraies moyennes et les médianes des frais du PER, pas seulement ceux qui font payer"
    consulte: >-
      Le rapport OPEF 2026 relu pour la méthode de ses moyennes (pondération
      par les primes et par l'encours moyen, arrérages non pondérés sur les
      seuls facturants) ; le rapport du CCSF de juillet 2021 sur les nouveaux
      plans d'épargne retraite (rapport_per-2021.pdf, étude Sémaphore Conseil
      sur 34 PER assurance, tableau T4 et chapitre 2), obtenu par le même
      canal que l'OPEF.
    trouve: >-
      Versement et gestion de l'OPEF sont des moyennes pondérées de tout le
      marché, donc les vraies moyennes payées ; aucune médiane n'est publiée
      nulle part. Arrérages : 2,20 % sur les 9 facturants donne 0,99 % sur les
      20 déclarants et une médiane nulle ; le CCSF trouvait 1,18 % zéros
      compris sur 30 contrats, onze à zéro, de 0,60 % (banques) à 2,30 %
      (mutuelles). Et un frais que le modèle ne compte pas : 22 contrats sur
      34 prélèvent 0,60 à 1 % par an sur l'encours de rentes, soit 9 à 15 %
      de rente au diviseur du modèle, quatre à sept fois l'effet des
      arrérages. Le récupérateur déduit désormais la moyenne sur tous les
      déclarants et la médiane. Aucune règle du scénario 1 n'est touchée.
    reste: >-
      Le barème du calcul est inchangé ; les 2,20 % d'arrérages sont le tarif
      de ceux qui facturent, et la décision de passer à 0,99 % ou à zéro, ou
      d'ajouter un frais sur encours de rentes, reste à prendre. Les médianes
      du versement et de la gestion n'existent dans aucune source publique.
  - date: "2026-09-20"
    session: "le pilier aux vraies moyennes du marché, et des frais qui baissent par paliers"
    consulte: >-
      Pour la baisse des frais sous la concurrence ou la règle : ICI, Trends
      in the Expenses and Fees of Funds 2025 (per32-01.pdf) ; DWP, Pension
      charges survey 2020 ; Superintendencia de Pensiones du Chili,
      communiqués des adjudications 2023-2025 et 2025-2027, et l'étude de la
      Bibliothèque du Congrès chilien sur les commissions des AFP 1990-2018 ;
      Pensionsmyndigheten, communiqué du 3 septembre 2014 sur la remise et
      page des frais 2026 ; APRA et Rainmaker pour MySuper ; les rapports
      OPEF 2025 et 2026 relus pour la vitesse comparée du frais sur versement
      (mesuré sur les primes) et du frais de gestion (mesuré sur l'encours).
    trouve: >-
      Partout la baisse va par à-coups : plafond britannique (0,75 % en 2015,
      0,48 % constatés en 2020, 0,29 % en fiduciaire), adjudications
      chiliennes (1,14, 0,77, 0,47, 0,41 %, remontée à 0,69 % en 2018, 0,46 %
      en 2025, 1,36 % avant 2010), remise suédoise (0,31 % net en 2013,
      0,21 % en 2020, 0,11 % en 2026). Sous la seule concurrence, 3,3 % de
      baisse par an sur trente ans aux États-Unis (1,04 % à 0,40 %). En
      France, le frais sur versement du PER baisse de 1,20 à 1,09 % en deux
      ans quand le frais de gestion sur l'encours ne bouge pas : la baisse
      porte sur les nouveaux dépôts. Le modèle retient désormais les moyennes
      du marché (arrérages 0,99 % et non 2,20 %), le frais sur la réserve de
      rente (0,52 % estimé, 8 % de rente), des paliers décennaux au rythme
      américain jusqu'au plancher de l'ERAFP, et un stock qui referme 10 % de
      son écart par an. Effet sur une carrière entière après la bascule :
      + 8 % de rente par rapport à l'ancien réglage ; − 7 % pour qui liquide
      en 2034, le frais sur la réserve pesant avant que les paliers jouent.
      Aucune règle du scénario 1 n'est touchée.
    reste: >-
      Les paliers sont une hypothèse datée, pas une mesure : ni la Suède ni le
      Chili n'ont de série publique avant 2013 et 2010, et la remontée
      chilienne de 2018 montre qu'une baisse n'est pas acquise ; le modèle ne
      fait jamais remonter un frais. Le frais sur la réserve de rente est
      estimé au milieu d'une fourchette du CCSF de 2021, sans mesure de
      l'OPEF. Aucune médiane n'existe pour le versement et la gestion.

