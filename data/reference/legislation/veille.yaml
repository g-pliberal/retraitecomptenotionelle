  - date: '2026-09-20'
    session: "action 37 : l'article de l'amiante, dernière base légale non lue"
    consulte: "L'article 41 de la loi n° 98-1194 du 23 décembre 1998 de\
      \ financement de la sécurité sociale pour 1999, dans l'index LEGI :\
      \ version en vigueur LEGIARTI000033713713, du 25 décembre 2016, et la\
      \ version suivante LEGIARTI000054476596, qui prend effet au 1er janvier\
      \ 2035. C'était la dernière ligne de l'inventaire dont la base légale\
      \ portait la mention « à certifier »."
    trouve: "LA RAISON INSCRITE ÉTAIT À MOITIÉ FAUSSE, et c'est le résultat de\
      \ cette lecture. L'inventaire disait de la cessation anticipée des\
      \ travailleurs de l'amiante qu'elle « relève du risque emploi et non du\
      \ risque vieillesse-survie », donc hors du compte que la page décompose.\
      \ C'est vrai de l'allocation elle-même. Mais le III de l'article crée un\
      \ fonds qui finance aussi, par un versement aux régimes obligatoires de\
      \ retraite de base, les dépenses supplémentaires nées des départs\
      \ anticipés qu'il permet ; et le II répute la durée d'assurance remplie\
      \ au plus tard à soixante-cinq ans. Il y a donc bien une part vieillesse,\
      \ identifiée par la loi et financée de l'extérieur — exactement la forme\
      \ des transferts de la branche famille et de l'assurance chômage.\
      \ \
      \ AUCUNE LIGNE DE L'INVENTAIRE NE PORTE PLUS « À CERTIFIER ». Les\
      \ quarante-deux dispositifs ont leur base légale lue dans LEGI, version\
      \ par version. La page le dit désormais dans une phrase qui lui est\
      \ propre, le compte étant calculé : « 0 lignes portent encore la\
      \ mention » se serait lu comme une négligence de gabarit là où c'est\
      \ l'inventaire qui est allé au bout."
    reste: "La part vieillesse de l'amiante n'est toujours pas chiffrée : le\
      \ compte du fonds, publié à la Commission des comptes de la Sécurité\
      \ sociale, mêle l'allocation et le versement aux régimes de retraite sans\
      \ les séparer. Lire n'est pas appliquer : que les textes soient lus ne\
      \ dit pas que le modèle les applique, et vingt-quatre dispositifs restent\
      \ sans chiffre. La version de l'article qui prend effet au 1er janvier\
      \ 2035 est à surveiller. Les reprises de veille du 17 septembre 2026\
      \ restent ouvertes."
  - date: '2026-09-20'
    session: "les projets annuels de performances du PLF 2026, lus"
    consulte: >-
      Sept annexes au projet de loi de finances pour 2026, apportées par
      l'utilisateur — budget.gouv.fr refuse les adresses de sortie du proxy :
      les projets annuels de performances des programmes 195 (mines, SEITA,
      Opéra, Comédie-Française, gérants de débits de tabac), 197 (marins), 198
      (SNCF, RATP), 741 (pensions civiles et militaires, CAS Pensions), 743
      (pensions militaires d'invalidité), 148 (fonction publique), et le
      document de la mission « Régimes sociaux et de retraite ». Puis, dans
      l'index LEGI du dépôt, l'article 9 du décret n° 2008-639 du 30 juin
      2008 (SNCF), version en vigueur LEGIARTI000054622839 du 7 août 2026 et
      version d'origine LEGIARTI000019108305, et l'article 20 du décret
      n° 2008-637 du 30 juin 2008 (RATP), version en vigueur
      LEGIARTI000047914213 du 1er janvier 2025.
    trouve: >-
      Trois choses. UN : le programme 198 publie, de 2012 à 2023, les années
      validées et cotisées du flux de nouveaux pensionnés de la SNCF et les
      trimestres validés et cotisés de celui de la RATP — 168,5 contre 125,2
      en 2023, 43 trimestres que la pension rémunère sans cotisation. C'est
      la masse des bonifications des régimes spéciaux que l'action 37
      cherchait ; l'inventaire porte désormais une ligne
      `bonifications_regimes_speciaux`, fondée sur les deux articles lus : un
      trimestre par année de conduite au-delà de la troisième, vingt au plus,
      à la SNCF ; un cinquième des services du tableau B, cinq ans au plus, à
      la RATP ; agents admis avant 2009 dans les deux cas. Le moteur ne les
      sert pas — il lit le code `bonifications` des fiches comme la
      bonification pour enfants —, et l'inventaire le dit. DEUX : la
      subvention rapportée aux pensions servies, 2012-2023, pour la SNCF et
      la RATP, et pour les marins la subvention 2026 contre la dépense de
      pensions — le taux d'équilibre que `contribution_employeur_public.csv`
      laisse dehors par convention, écrit dans `docs/limites.md`. TROIS : le
      schéma de financement en vigueur depuis le 1er janvier 2025 — la CNAV
      équilibre les régimes fermés (3° de l'article L. 134-3 CSS), l'État la
      compense (8° de l'article L. 241-3) —, que `structure_financement.csv`
      ne connaissait pas ; son en-tête et `docs/regimes.md` le portent.
      Aussi : l'espérance de vie à 65 ans des fonctionnaires civils (24,68
      ans pour les femmes, 21,16 pour les hommes en 2024), seule mesure par
      population que le dépôt connaisse, pour l'action 14. Les programmes
      743 et 148 ne portent rien pour le modèle.
    reste: >-
      Aucune règle du scénario 1 n'est modifiée et aucune ligne du registre
      ci-dessus n'a changé d'état. Les valeurs sont SAISIES, avec leur page
      imprimée, dans `regimes/pap_regimes_subventionnes.csv` : aucun script
      ne les revérifiera. Les articles L. 134-3 et L. 241-3 du code de la
      sécurité sociale n'ont pas été relus dans LEGI, c'est le PAP qui les
      cite. L'écart validé-cotisé de la RATP mêle toutes les bonifications et
      les périodes validées sans cotisation, sans les séparer, et ne se
      convertit pas en euros sans une valeur du trimestre que le dépôt refuse
      de déduire. Les reprises de veille du 17 septembre 2026 restent
      ouvertes.
  - date: '2026-09-20'
    session: "action 14 : l'espérance de vie des fonctionnaires civils, en variante du diviseur"
    consulte: >-
      Le projet annuel de performances du programme 741 annexé au PLF 2026,
      page 5 (déjà saisi le même jour) : espérance de vie à 65 ans des
      pensionnés civils de l'État en 2024, 24,68 ans pour les femmes, 21,16
      pour les hommes, « structurellement supérieure à celle de la population
      générale » ; et, pour la population générale la même année, les
      espérances certifiées de `mortalite/esperances_vie.csv` (INSEE, OCDE).
    trouve: >-
      Un écart d'un an et plus à 65 ans, dans les deux sexes, qu'un facteur de
      0,85 sur la force de mortalité de la table générale reproduit. Il en est
      fait une VARIANTE du diviseur de conversion, `population_conversion`,
      portée des deux côtés et dans les témoins, et une mesure,
      `scripts/mortalite_population.py` : 1,5 an de rente de plus pour le
      fonctionnaire sédentaire né en 1975, 5,7 % de pension notionnelle à
