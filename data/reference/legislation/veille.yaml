      et rien ne bouge. Depuis le 1er janvier 2026, R. 732-68 rend l'alignement
      explicite. L'article n'était pas introuvable : la recherche plein texte
      ne le rendait pas, la requête SQL sur le titre du code, si.
      ET LE RECUEIL DE LA CNAVPL A DÉMENTI UNE PHRASE ÉCRITE LA VEILLE. Le
      dépôt disait « la DREES observe les professions libérales partir à
      62,6 ans » : c'est le groupe 3 de la nomenclature, dominé par les cadres
      SALARIÉS. La caisse des libéraux publie l'âge de ses propres titulaires —
