  - date: "2026-09-20"
    session: >-
      Deux des trois écarts de comptabilité relevés par un audit des recettes
      et des dépenses rapportées au PIB : la convention comptable jamais dite
      au lecteur, et le compte tenu en brut sans que rien ne le signale.
    consulte: >-
      `veille_droit.py` lancé en entrée : 35 lignes, dernière veille consignée
      au 20 septembre 2026, six lignes à revoir, inchangées. Aucun texte
      nouveau n'a été cherché sur les règles de calcul, la session ne touchant
      à aucune. Deux lectures, du côté des comptes : le rapport annuel du COR
      de juin 2026, figure des ressources du système de retraite et son bloc
      de données complémentaires sous convention EEC, puis sa figure des
      déterminants de l'évolution des ressources ; et, du côté du droit,
      l'article L. 131-8 du code de la sécurité sociale, déjà lu le même jour
      dans sa version en vigueur depuis le 1er février 2026
      (LEGIARTI000053538201), pour la seule fraction de CSG des revenus de
      remplacement affectée à la branche vieillesse.
    trouve: >-
      LA CONVENTION COMPTABLE EST UNE HYPOTHÈSE, ET ELLE VALAIT JUSQU'À 0,67
      POINT DE PIB SANS QUE LE SITE LA NOMME. Le compte du COR est tenu sous
      convention EPR : ce que l'État verse aux régimes de fonctionnaires et aux
      régimes spéciaux y suit ce qu'il faut pour les équilibrer chaque année,
      si bien que le déficit publié est celui des AUTRES régimes. Le COR publie
      aussi l'effort de l'État figé en part de PIB (EEC), et l'écart change de
      signe : EEC donne 0,67 point de moins en 2028, croise en 2047, rend 0,49
      point de plus en 2069. `ressources_eec_retraite.csv` porte la série, la
      page Coût les deux soldes.
      LE COMPTE EST EN BRUT, ET UNE PART DE SA RECETTE SORT DE SA DÉPENSE.
      L'article L. 131-8, 3° e affecte 2,94 des 8,30 points de CSG d'une
      pension à la branche mentionnée au 3° de L. 200-2, la vieillesse : un
      tiers de ce qu'une pension paie revient au système qui la verse, soit au
      plus 11,8 Md€ en 2024 et le cinquième des impôts et taxes affectés que
      le compte encaisse. Et la masse des pensions vaut 13,68 % du PIB en brut
      contre au plus 12,43 % en net. Les deux chiffres sont des BORNES, le taux
      plein étant appliqué à toute la masse faute d'un croisement publié entre
      distribution des pensions et revenu fiscal des foyers.
