      droit-là.
    trouve: >-
      La réversion chiffrée à 38,3 Md€ en 2024, soit 9,0 % de la dépense de
      retraite — la première dépense non contributive du système, et la seule
      ligne de l'inventaire qui se lise au lieu de se calculer. Deux pièges
      évités et écrits dans l'en-tête de la série : la colonne `mont` porte la
      pension totale du bénéficiaire et aurait doublé la masse, et la somme des
      effectifs de caisse compte deux fois le même polypensionné. Par ailleurs,
      un contrôle utile sur le droit lui-même : la décote de l'article L. 14,
      plafonnée à vingt trimestres, est plus DURE qu'un barème actuariel
      jusqu'à sept ans d'anticipation et plus DOUCE au-delà — c'est-à-dire
      précisément là où la catégorie active, les régimes spéciaux et la pension
      militaire opèrent.
