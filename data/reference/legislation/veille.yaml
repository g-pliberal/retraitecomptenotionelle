      LA LECTURE DE L'ANCIENNE TABLE A ÉLARGI LE CHANTIER, et c'est ce qu'elle
      devait faire : le « a) » des deux textes renvoie à la durée applicable
      avant la réforme de 2023, si bien que la dérogation ne commence pas en
      1966 mais dès 1961 — quatre générations que le registre ne visait pas.
      Elles sont portées.
      RESTE une non-monotonie que le texte assume et que la table reproduit :
      un super-actif né en juin 1971 se voit opposer 171 trimestres par
      l'ancienne table, celui qui naît en octobre 1971 seulement 169. Rien
