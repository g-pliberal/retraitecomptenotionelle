    trouve: >-
      LE BARÈME AGRICOLE EST GÉNÉRATIONNEL, et c'est celui du régime général.
      R. 732-61 dans sa version de 2017 donne onze coefficients, de 2,5 % pour
      les nés avant 1944 à 1,25 % après 1952 — les mêmes, génération par
      génération, que le II de R. 351-27 que `coefficient_minoration.csv`
      porte déjà. La fiche `msa_non_salaries` ayant `decote_par_generation`,
