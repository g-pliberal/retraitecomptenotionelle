  - id: ircantec_valeurs_point
    regle: "Valeur de service, salaire de référence et pourcentage d'appel du point Ircantec de 2022 à 2026 ; au-delà du dernier barème publié, les cotisations de l'Ircantec et de l'Agirc-Arrco achètent des points au rendement de ce barème."
