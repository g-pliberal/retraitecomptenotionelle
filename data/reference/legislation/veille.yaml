      vieillesse déplafonnées, qui n'ouvrent aucun droit, à la charge de
      l'employeur depuis le 20 janvier 1991 et du salarié depuis le 22 août
      2003 (L. 241-3) ; la validation rétroactive des travaux d'utilité
      collective des années 1980, entrée au 9° de L. 351-3 le 1er septembre
      2023 ; l'article L. 161-22-1-1, qui définit depuis la même date la seule
      pension purement contributive du droit français (« aucune majoration,
      aucun supplément ni aucun accessoire ») ; et les indemnités journalières
      de maternité, entrées au salaire de base de L. 351-1 en 2010 — version
      toujours en vigueur — dont le financement a été abrogé en 2020.
    reste: >-
