      d'où un essai dédié en Python et un dans le moteur JavaScript, le tirage
      au hasard du portage ne tirant lui aussi qu'un statut.
    reste: >-
      Deux choses qu'une carrière du dépôt ne peut pas produire, et
      `limites.md` les porte : la troisième condition de la loi — l'exclusion
      de qui avait déjà liquidé avant le 1er juillet 2017 —, une carrière du
      modèle liquidant tout à la fois ; et la somme des revenus d'une MÊME
