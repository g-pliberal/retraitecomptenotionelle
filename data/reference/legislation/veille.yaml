    consulte: >-
      Index LEGI du dépôt : R. 643-7 CSS, R. 723-38 CSS, le I de L. 14 du code
      des pensions, R. 351-27 2° dans sa version du 1er août 2026 et
      R. 351-27-1, R. 732-61 du code rural. Hors LEGI, le rapport annuel du COR
