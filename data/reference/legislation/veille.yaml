  - id: surcote_regime_general
    regle: "Trimestres civils entiers cotisés après l'âge légal et au-delà de la durée requise, depuis le trimestre qui suit l'âge légal ou le mois qui suit la durée ; taux à la date de chaque trimestre (0,75 %, 1 %, 1,25 % après 65 ans, 1,25 % depuis 2009)."
