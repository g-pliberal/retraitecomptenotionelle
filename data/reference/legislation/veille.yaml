    trouve: >-
      R. 353-1 exclut des ressources du survivant « les avantages de réversion
      servis par les régimes légalement obligatoires complémentaires » : la
      réversion de l'Agirc-Arrco ne compte pas au plafond du régime général,
      celle d'un autre régime de base, si. Les revenus d'activité du survivant
      y sont abattus de 30 % à cinquante-cinq ans, et les ressources lues sur
      les trois mois qui précèdent la date d'effet, ou les douze : deux
      approximations que la fiche déclare. R. 353-1-1 dit la révision de la
      réversion quand les ressources varient, que le modèle ne fait pas.
      R. 353-7 : la date d'effet est le premier jour d'un mois, jamais avant
      « le premier jour du mois suivant lequel il remplit la condition
      d'âge », ni avant la demande, sauf demande dans l'année du décès, qui
      la ramène au mois qui suit le décès. Pas d'exception pour qui est né
      un 1er, à la différence de R. 351-37 pour la pension de vieillesse
      (action 132) : le modèle suit le texte.
    reste: >-
