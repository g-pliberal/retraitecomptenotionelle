    temoins: []
    reformes: []
    etat: transcrit
    effet: >-
      Toute pension Ircantec. La table s'arrêtait à la valeur de janvier 2022,
      0,49241 €, et le rendement moyen de 2009 à 2021, 8,52 %, prolongeait
      tout le reste. Le rendement au-delà de 2026 est désormais celui du
      barème de 2026, 7,63 %, et celui de l'Agirc-Arrco celui du sien, 5,61 %,
