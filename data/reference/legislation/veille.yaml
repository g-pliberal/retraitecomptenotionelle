      \ bonifications, stock en paiement 2024), 50 (proportion, gain en\
      \ trimestres et GAIN MENSUEL EN EUROS, flux 2023) et B-1 (flux). Puis,\
      \ dans l'index LEGI, les quatre textes que la note du tableau A-7 nomme,\
      \ en version en vigueur : loi n° 57-444 du 8 avril 1957 art. 1er pour les\
      \ policiers, loi n° 89-1007 du 31 décembre 1989 art. 5 pour les\
      \ contrôleurs aériens, loi n° 96-452 du 28 mai 1996 art. 24 II pour les\
      \ surveillants pénitentiaires, loi n° 2003-1312 du 30 décembre 2003\
      \ art. 93 I pour les douaniers."
    trouve: "LE PRODUCTEUR VALORISE LES BONIFICATIONS EN EUROS, et c'est ce qui\
      \ manquait : le gain sur le montant mensuel de la pension vaut 246 € pour\
      \ l'ensemble des civils de l'État et 315 € pour les militaires. Appliqué\
      \ au stock, cela donne environ 4,3 Md€ par an pour la seule fonction\
      \ publique d'État, la CNRACL portant « n.d. » en euros. Le chiffre n'est\
      \ PAS certifié et n'entre pas dans le total de la page : il croise un\
      \ stock de 2024 avec un gain mesuré sur le flux 2023, ce qui est une\
      \ déduction et non une lecture. Le jaune notant lui-même un recul des\
      \ bonifications, c'est un plancher.\
      \ \
      \ Sur le stock, le dénombrement est plus lourd encore qu'en 2010 :\
      \ 404 478 des 406 645 pensions militaires en paiement portent une\
      \ bonification de campagne ou du cinquième, pour 27,4 trimestres en\
      \ moyenne. Un militaire retraité sur deux porte en outre une bonification\
