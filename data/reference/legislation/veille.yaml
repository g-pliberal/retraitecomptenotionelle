      savoir si l'assuré relève d'une de ses exonérations : le net affiché en
      bas de barème est un plafond. Les régimes d'invalidité-décès des sections
      de la CNAVPL, souvent forfaitaires, sont alignés sur le taux des
      artisans-commerçants. Restent à lire à la source les deux décrets de 2025
      de la réduction générale, l'arrêté du taux d'accidents du travail retenu
      dans son périmètre et la convention d'assurance chômage de 2024, comme au
      19 septembre. Les reprises de veille listées au 17 septembre 2026 restent
  - date: '2026-09-19'
    session: 'action 37, volets B à E : chiffrer les avantages non contributifs'
    consulte: >-
      Aucune source de droit nouvelle : ces volets MESURENT ce que le scénario 1
      sert déjà, ils ne transcrivent aucune règle. Une source de DONNÉES en
      revanche, et elle était déjà au manifeste : l'enquête annuelle de la DREES
