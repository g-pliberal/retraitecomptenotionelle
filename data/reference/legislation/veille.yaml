journal:
  - date: "2026-09-19"
    session: "le net et le brut, d'un bout à l'autre du simulateur"
    consulte: >-
      Index LEGI du dépôt : article L. 136-8 du code de la sécurité sociale,
      version en vigueur du 31 décembre 2025 au 27 juin 2026
      (LEGIARTI000053278668), lu en entier par `dila_cherche.py legi --texte ID
      --motif` — I, II, III, III bis et III ter ; article L. 14-10-4 du code de
      l'action sociale et des familles pour la contribution additionnelle de
      solidarité pour l'autonomie.
    trouve: >-
      Le II 2° de L. 136-8 assujettit les pensions de retraite à la CSG au taux
      de 8,30 %. Le III et le III bis y dérogent selon le REVENU FISCAL DE
      RÉFÉRENCE du foyer perçu l'avant-dernière année, au sens du IV de
      l'article 1417 du code général des impôts : exonération jusqu'à 11 128 €
      pour une part de quotient familial, 3,80 % jusqu'à 14 548 €, 6,60 %
      jusqu'à 22 580 €, 8,30 % au-delà ; le III ter revalorise ces seuils
      chaque 1er janvier sur les prix hors tabac. Le 1° bis de L. 14-10-4
      ajoute 0,30 % de CASA, due par les seules personnes dont le revenu
      atteint le seuil du taux plein de CSG. Avec 0,50 % de CRDS, une pension
      au taux plein est amputée de 9,10 %.
    reste: >-
      Le scénario 1 n'est pas modifié : aucune pension calculée ne bouge, et
      aucune ligne du registre ci-dessus n'a changé d'état. Ce qui a été ajouté
      est un AFFICHAGE — le simulateur se lit désormais en net ou en brut, au
      choix, saisie comprise — et la convention qu'il suppose est écrite sur la
      page et dans `docs/limites.md` § 5 ante ter : le dépôt applique le taux
      plein à tous, faute de connaître le revenu fiscal du foyer. Restent à
      lire à la source : la cotisation d'assurance maladie de 1 % sur les
      retraites complémentaires, que le modèle n'applique pas parce que les
      scénarios notionnels ne distinguent pas base et complémentaire ; et le
      régime des rentes viagères à titre onéreux (article 158-6 du code général
      des impôts), que le dépôt écarte au profit du titre gratuit pour la rente
      du pilier capitalisé. À revoir à chaque loi de financement, les seuils
      étant revalorisés annuellement.
    prochaine_veille: "2027-01-31"

  - date: "2026-09-19"
    session: "le salaire net d'un actif, et les prélèvements hors retraite"
    consulte: >-
      Index LEGI du dépôt, à jour au 13 septembre 2026 : article L. 241-13 du
      code de la sécurité sociale, dans ses huit dernières versions, et
      intégralement dans celle en vigueur du 1er janvier 2026 au 1er janvier
      2028 (LEGIARTI000053280526), lue par `dila_cherche.py legi --texte ID
      --motif`. Article D. 242-4 du même code, pour mémoire. Paramètres
      d'OpenFisca-France (dépôt public, branche master du 19 septembre 2026)
      pour les taux hors retraite : maladie, allocations familiales, accidents
      du travail, contribution de solidarité pour l'autonomie, assurance
      chômage, AGS, FNAL, dialogue social, CSG, CRDS, contributions d'équilibre
      général et technique, APEC, et les quatre paramètres de la réduction
      générale dégressive unique.
    trouve: >-
      Le I de l'article L. 241-13 nomme le périmètre de la réduction générale :
      cotisations patronales d'assurances sociales et d'allocations familiales,
      accidents du travail « à hauteur du taux fixé par l'arrêté », contributions
      de l'article L. 813-4 du code de la construction, et cotisations des
      régimes complémentaires légalement obligatoires de l'article L. 921-4. Le
      III fixe le coefficient par décret « dans la limite de la somme des taux
      des cotisations et contributions incluses dans le périmètre », le plafond
      à « le salaire minimum de croissance en vigueur majoré de 200 % », soit
      trois SMIC. La limite est ATTEINTE : les dix taux du périmètre font
      40,21 %, et c'est exactement le coefficient maximal du décret n° 2025-1446
      du 31 décembre 2025. Conséquence pour le modèle : au SMIC, l'employeur ne
      verse plus rien de ce périmètre, et un scénario qui baisse la cotisation
      retraite patronale baisse aussi l'allègement — le dépôt refait donc
      l'addition (0,3821 aujourd'hui, 0,3054 sous la proposition) au lieu de
      figer le chiffre. Les deux « bandeaux » maladie et famille ont disparu le
      31 décembre 2025, absorbés par cette réduction : les taux pleins de 13,00 %
      et 5,25 % s'appliquent désormais à tous.
    reste: >-
      Le scénario 1 n'est pas modifié par cette session, et aucune ligne du
      registre ci-dessus n'a changé d'état : rien de ce qui a été lu ne touche à
      une pension. Ce qui a été ajouté est une grandeur nouvelle — le salaire
      net d'un actif — qui vit dans `remuneration.py` et dans
      `legislation/prelevements_remuneration.yaml`. Restent à lire à la source,
      pour ce fichier : le décret n° 2025-887 du 4 septembre 2025 et le décret
      n° 2025-1446 du 31 décembre 2025, dont le dépôt ne connaît que les valeurs
      par OpenFisca ; l'arrêté qui fixe le taux d'accidents du travail retenu
      dans le périmètre (0,49 point) ; et la convention d'assurance chômage du
      15 novembre 2024 pour le taux de 4,00 % applicable depuis le 1er mai 2025.
      Les trois sont des transcriptions tierces aujourd'hui, d'où la fiabilité
      `haute` du fichier. À revoir aussi à chaque loi de financement : le barème
      est celui d'un millésime, reconduit tel quel vers l'avenir.
    prochaine_veille: "2027-01-31"

  - date: "2026-09-19"
    session: "indexation des pensions servies, et règle de revalorisation de l'ASPA"
    consulte: >-
      Index LEGI du dépôt, champ social : article L. 816-2 du code de la
      sécurité sociale (version en vigueur depuis le 31 décembre 2018,
      LEGIARTI000036393188) et article L. 161-25 (version en vigueur depuis le
      1er janvier 2016, LEGIARTI000031781092), lus en entier par
      `dila_cherche.py legi --texte ID --motif`.
    trouve: >-
      L. 816-2 revalorise les montants de l'ASPA et ses plafonds de ressources
      au 1er janvier de chaque année par application du coefficient de
      L. 161-25 ; ce coefficient est l'évolution de la moyenne annuelle des
      prix à la consommation hors tabac sur les douze derniers indices
      mensuels publiés par l'INSEE l'avant-dernier mois précédant la
      revalorisation, et il est porté à un s'il lui est inférieur — l'ASPA ne
      baisse donc jamais en euros courants. C'est le même coefficient que
      celui des pensions du régime général (L. 161-23-1), ce qui confirme la
      convention du modèle pour le scénario 1 comme pour la garantie
      vieillesse.
    reste: >-
      Le scénario 1 n'est pas modifié par cette session : les deux articles
      lus CONFIRMENT la règle que le modèle appliquait déjà, et la ligne
      `minimum_vieillesse` du registre reste à l'état `approximation` pour les
      motifs qui étaient les siens — condition de ressources du foyer et
      non-recours, non la revalorisation. Ce qui a changé est hors du
      scénario 1 : les pensions SERVIES des cinq scénarios notionnels suivent
      désormais la règle d'indexation du modèle au lieu d'être figées en euros
      constants, ce que `docs/limites.md` documente. Reste à lire le plancher
      à un de L. 161-25 dans une circulaire d'application, pour savoir s'il a
      déjà mordu depuis 2016.
    prochaine_veille: "2027-01-31"

  - date: "2026-09-18"
    session: "pilier de capitalisation obligatoire ajouté au scénario 6"
    consulte: >-
      Portail de données de la BCE, jeu YC (courbe zéro-coupon des souverains
      AAA de la zone euro, modèle de Svensson, trente maturités au
      17 septembre 2026) et jeu IRS (rendement de l'emprunt d'État français à
