        longues, minimum, retraite progressive, cumul) ne relève pas les âges
        des agents en place — l'article 6 reste à sa version de 2014.
      comedie_francaise: >-
        Même décret n° 2023-840 (LEGIARTI000048031556, …549, …544, …539) :
        fermeture portée par le routage, aucun relèvement d'âge, l'article 12
        reste à sa version de 2017.
      port_strasbourg: >-
        Fermé aux recrutés depuis septembre 2023 (loi n° 2023-270, art. 1er),
        ce que le routage porte ; le règlement de retraite est un acte de
        l'établissement, absent de LEGI et du JORF, une seule période.
      marins: >-
        L'ENIM n'est pas touché par la loi de 2023 : l'âge de cinquante-cinq
        ans et la formule du code des pensions de retraite des marins sont
        inchangés.
      mines: >-
        Régime en extinction laissé où il était par la loi de 2023, comme par
        celles de 2010 et 2014 ; financé par le programme 195.
      seita: >-
        Régime fermé en 1981 et jamais réformé ; la loi de 2023 ne le touche
        pas.
      carpv_complementaire: >-
        Le règlement approuvé le 10 juillet 2026 garde le taux plein à
        soixante-cinq ans et l'anticipation dès soixante ans : la loi de 2023
        ne s'y applique pas.
      cavom_complementaire: >-
        L'âge seul commande ce régime, lu à la génération par
        `age_ouverture_par_generation` ; il n'a pas de durée requise à
        relever.
      cavamac_complementaire: >-
        Même situation que la CAVOM : l'âge seul commande, lu à la génération
        ; aucune durée requise dans la fiche.
      cprn_complementaire: >-
        Même situation : âge lu à la génération, pas de durée requise, la
        section C liquide sur l'âge.
      crpnpac: >-
        Le code des transports garde l'âge de cinquante ans et la durée de
        cent vingt trimestres propres au régime des navigants ; la loi de
        2023 ne les a pas modifiés.
      crpnpac_tranche_2: >-
        Même situation que la tranche 1 : paramètres propres du code des
        transports, inchangés par la loi de 2023.

