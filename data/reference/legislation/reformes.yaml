  - code: lfss_2026_suspension
    date: 2026-09-01
    texte: {reference: "loi n° 2025-1403 du 30 décembre 2025 de financement de la sécurité sociale pour 2026, article 105 (suspension : 62 ans et 9 mois et 170 trimestres des nés du 1er janvier 1963 au 31 mars 1965, montée en charge décalée d'un trimestre jusqu'à 64 ans et 172 trimestres à compter de 1969 et 1966), décrets n° 2026-344 et n° 2026-345 du 7 mai 2026 (fonction publique, catégories actives, carrière longue)", id: JORFTEXT000053226384}
    parametres: [age_ouverture, duree_requise_trimestres]
    regimes: [agirc_arrco, banque_de_france, carcdsf_complementaire, carpimko_complementaire,
              cavamac_complementaire, cavec_complementaire, cavimac, cavom_complementaire,
              cavp_complementaire, cese_membres, cipav_complementaire, cnavpl, cnbf,
              cnbf_complementaire, cnracl, comedie_francaise, cprn_complementaire, crpcen,
              enseignants_prive_additionnel, fonction_publique_etat, fspoeie, ieg, ircantec,
              ircec_raap, ircec_raap_taux_amenage, ircec_racd, ircec_racl, msa_non_salaries, msa_rco, msa_salaries,
              opera_de_paris, rafp, ratp, rci, regime_general, sncf]
    absorbee_par: [age_ouverture_par_generation, duree_requise_par_generation]
    non_appliquee:
      cavom_complementaire: >-
        La suspension ne touche que l'âge de L. 161-17-2 et la durée ; le
        règlement de la CAVOM approuvé le 10 juillet 2026, après elle, garde
        ses propres âges — 62 ans et 6 mois pour la génération 1965, 64 ans
        dès 1968 — que la fiche lit dans sa table.
      ieg: >-
        La durée requise des agents actifs est celle du I bis de l'article 45
        de l'annexe 3, et non celle de L. 161-17-3 ; sa dernière
        version est du 6 août 2025 (LEGIARTI000052046924, index LEGI relu le
        23 septembre 2026). La fiche lit donc la table du régime
        (`duree_requise_table: ieg_actif_17`), non la table commune suspendue.
      ratp: >-
        La loi ne réécrit que L. 161-17-2, L. 161-17-3 et le XXIV de la loi de
        2023 ; le décret n° 2008-637 garde ses propres tables — âges du II de
        l'article 51-1 (LEGIARTI000047914257), durée du I de l'article 51
        (LEGIARTI000052292971) — et aucun décret ne les a modifiées depuis
        (index LEGI relu le 22 septembre 2026). La fiche lit donc la table du
        régime (`duree_requise_table: ratp`), non la table commune suspendue.
      sncf: >-
        La loi ne réécrit que L. 161-17-2, L. 161-17-3 et le XXIV de la loi de
        2023 ; le décret n° 2008-639 garde ses propres tables — âges de
        l'article 37-1 (LEGIARTI000048896987), durée du I de l'article 35
        (LEGIARTI000048897024) — et le seul décret qui l'a modifié depuis, le
        n° 2026-738 du 4 août 2026, ne traite que du congé de mobilité. La
        fiche lit donc la table du régime (`duree_requise_table:
        sncf_conduite`), non la table commune suspendue.

