  - code: reforme_2023
    date: 2023-09-01
    texte: {reference: "loi n° 2023-270 du 14 avril 2023 de financement rectificative de la sécurité sociale pour 2023", id: LEGITEXT000047447783}
    parametres: [age_ouverture, duree_requise_trimestres, fermeture]
    regimes: [regime_general, msa_salaries, cavimac, fonction_publique_etat, cnracl, fspoeie,
              cnavpl, cnbf, cnbf_complementaire, msa_non_salaries, msa_rco, rci, rafp, ircantec,
              agirc_arrco, crpcen, banque_de_france, sncf, ratp, ieg, opera_de_paris,
              comedie_francaise, port_strasbourg, marins, mines, seita,
              carmf_complementaire, carcdsf_complementaire, carpimko_complementaire,
              cavp_complementaire, cavec_complementaire, cipav_complementaire,
              cprn_complementaire, cavamac_complementaire, cavom_complementaire,
              carpv_complementaire, ircec_raap, ircec_raap_taux_amenage, crpnpac, crpnpac_tranche_2]
    absorbee_par: [age_ouverture_par_generation, duree_requise_par_generation]
    non_appliquee:
      opera_de_paris: >-
        La loi ne ferme pas ce régime : son article 1er (JORFARTI000047445082)
        ne nomme que la RATP, les IEG, la CRPCEN, la Banque de France et le
        CESE. Son décret d'application (n° 2023-840, JORFTEXT000048011057,
        articles 6 ter, 16, 28 et 33 : carrières longues, minimum, retraite
        progressive, cumul) ne relève pas les âges — l'article 6 reste à sa
        version de 2014.
      comedie_francaise: >-
        Pas fermé non plus par l'article 1er. Même décret n° 2023-840
        (LEGIARTI000048031556, …549, …544, …539) : aucun relèvement d'âge,
        l'article 12 reste à sa version de 2017.
      port_strasbourg: >-
        Pas fermé par l'article 1er, qui ne le nomme pas ; le règlement de
        retraite est un acte de l'établissement, absent de LEGI et du JORF,
        une seule période.
      marins: >-
        L'ENIM n'est pas touché par la loi de 2023 : l'âge de cinquante-cinq
        ans et la formule du code des pensions de retraite des marins sont
        inchangés.
      mines: >-
        Régime en extinction laissé où il était par la loi de 2023, comme par
        celles de 2010 et 2014 ; financé par le programme 195.
      seita: >-
        Régime fermé en 1981 et jamais réformé ; la loi de 2023 ne le touche
        pas.
      carpv_complementaire: >-
        Le règlement approuvé le 10 juillet 2026 garde le taux plein à
        soixante-cinq ans et l'anticipation dès soixante ans : la loi de 2023
        ne s'y applique pas.
      cavom_complementaire: >-
        L'âge seul commande ce régime, et ce sont les siens : son règlement
        les écrit génération par génération (`age_table: cavom`), et la loi
        de 2023 n'y a rien changé ; il n'a pas de durée requise à relever.
      cavamac_complementaire: >-
        Même situation que la CAVOM : l'âge seul commande, lu à la génération
        ; aucune durée requise dans la fiche.
      cprn_complementaire: >-
        Même situation : âge lu à la génération, pas de durée requise, la
        section C liquide sur l'âge.
      crpnpac: >-
        Le code des transports garde l'âge de cinquante ans et la durée de
        cent vingt trimestres propres au régime des navigants ; la loi de
        2023 ne les a pas modifiés.
      crpnpac_tranche_2: >-
        Même situation que la tranche 1 : paramètres propres du code des
        transports, inchangés par la loi de 2023.

