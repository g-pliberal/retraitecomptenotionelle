# Calendrier central des réformes des retraites
# ==============================================
# Ce fichier était déclaré comme cible de `legifrance_textes` dans
# data/sources.yaml sans exister : chaque réforme vivait dans les notes des
# fiches, et rien ne recoupait le découpage d'une fiche avec ce que le droit
# a réellement changé pour elle. Ici, une entrée par réforme, avec les régimes
# qu'elle touche, et `tests/test_donnees.py` impose que pour chaque couple
# (réforme, régime) la fiche ait été COUPÉE à cette date (une période commence
# l'année d'effet, à un an près), ou que la réforme soit ABSORBÉE par un
# drapeau par génération levé sur la période active, ou que le régime soit
# DÉCLARÉ dans `non_appliquee` avec la raison. Le silence n'est pas une option.
#
# Champs :
#   code           identifiant court
#   date           date d'effet du paramètre (pas la date de promulgation)
#   texte          référence et identifiant DILA lu dans l'index du dépôt
#   parametres     ce que la réforme change, dans le vocabulaire de _schema.yaml
#   regimes        codes du catalogue touchés en droit
#   absorbee_par   drapeaux `*_par_generation` qui portent la réforme sans coupure
#   non_appliquee  régimes touchés en droit mais dont la fiche ne coupe pas, et
#                  pourquoi — un régime en extinction laissé où il était, un
#                  règlement qui n'a pas suivi la loi, une lecture à faire
#
# Le script scripts/calendrier_regimes.py confronte ce calendrier et les
# versions des articles pivots (regimes/pivots.yaml) aux périodes des fiches.

