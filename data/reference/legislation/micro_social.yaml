# Le revenu qui VALIDE les trimestres du micro-entrepreneur
# ---------------------------------------------------------
# Action 138, étape 12 ; fiche `micro_social_abattement`. Le micro-entrepreneur
# verse un pourcentage de son chiffre d'affaires, le taux global (D. 613-4) ;
# une part en va à la retraite de base, le taux de répartition (D. 613-6, qui
# couvre l'Assurance retraite depuis le décret n° 2022-1529, au 1er octobre
# 2022) ; cette part, divisée par le taux de cotisation de base des
# indépendants (D. 633-3), donne le « revenu cotisé », que la caisse compare
# à 150 SMIC horaires (circulaire Cnav n° 2024-23 du 16 juillet 2024, point 4 ;
# service-public, F23369, vérifié le 1er avril 2026, dont l'exemple : 12 100 €
# de ventes en 2026 valident deux trimestres, quand le revenu abattu, 3 509 €,
# n'en valide qu'un). Pour la Cipav, la part est celle de la première tranche
# de la CNAVPL (D. 642-3, 1°), divisée par son taux (`valeurs_point.csv`) :
# 2 792 € de recettes en 2026 valident un trimestre (F23369).
#
# Chaque activité porte ses versions, du mois où elles s'appliquent. L'année
# prend la moyenne de ses douze mois ; une année qu'aucune version ne couvre
# entière valide sur le revenu abattu — avant 2018 pour l'Assurance retraite,
# avant 2023 pour la Cipav, dont les versions marquées `valide: false` ne
# répartissent que le forfait versé. Au-delà de la dernière version, la
# dernière vaut.
#
# Textes lus dans l'index LEGI du dépôt, le 14 octobre 2026 :
#   D. 613-4 : LEGIARTI000046714712 (10 décembre 2022, taux du 1er octobre
#     2022), LEGIARTI000049624068 (1er juillet 2024), LEGIARTI000049624097
#     (2025), LEGIARTI000052218738 (2026) ;
#   D. 613-6 : LEGIARTI000046714699 (10 décembre 2022), LEGIARTI000049625264
#     (1er juillet 2024), LEGIARTI000049625405 (2025), LEGIARTI000052218747
#     (2026) ;
#   D. 633-3 : LEGIARTI000041967101 (17,15 % + 0,60 %, jusqu'en 2024),
#     LEGIARTI000049904636 (17,15 % + 0,72 %, périodes courant depuis le
#     1er janvier 2025).
#
# LA COTISATION QUE LE COMPTE NOTIONNEL PORTE (même étape, le 16 octobre
# 2026) : le forfait de retraite que le micro-entrepreneur a versé, le
# chiffre d'affaires fois le taux global, fois la part de base — les deux
# tranches de la CNAVPL pour la Cipav, `part_base_seconde` (D. 642-3, 2°) —
# et la part complémentaire de D. 613-6. Celle du libéral de l'Assurance
# retraite est nulle jusqu'au 30 juin 2024 : le Conseil d'État a annulé, au
# 1er juin 2024, la rédaction du 7 décembre 2022 « en tant qu'[elle
# n'inclut] pas une cotisation au titre du régime complémentaire » (décision
# n° 471203 du 9 février 2024, en note de LEGIARTI000046714699), sans
# toucher aux cotisations déjà dues. Versions de D. 613-6 relues au texte :
# 10 décembre 2022, 1er juin 2024 (LEGIARTI000049623885, la même que celle
# de 2022), 1er juillet 2024, 2025, 2026. Les rédactions d'avant, de 2020
# (LEGIARTI000041967529) et de 2021 (LEGIARTI000043656780), ne répartissent
# que le forfait de la Cipav ; celui de l'Assurance retraite n'avait pas de
# répartition au code avant le décret n° 2022-1529.
#
# AVANT LE DÉCRET N° 2022-1529 (même étape, le 17 octobre 2026). La Cnav
# affectait le forfait de l'Assurance retraite par des clefs : au régime de
# base, 40,31 % de celui de la vente, 40,36 % des services, 53,23 % du
# libéral ; au RCI, 15,94 %, 15,91 % et rien ; elle validait sur ce qu'elles
# achètent, divisé par 17,75 % (circulaire Cnav n° 2025-20 du 31 juillet
# 2025, annexe 1 : « Clefs de répartition » de 2018 à 2021, et ses exemples
# de 2020 et de 2021). Les taux globaux, de 2018 à septembre 2022 : 12,8 % et
# 22 % (D. 131-5-1, LEGIARTI000036466353, puis D. 613-4, LEGIARTI000041918199
# et LEGIARTI000043656794) ; le taux de base, 17,15 % + 0,60 % (D. 633-3,
# LEGIARTI000031799496 puis LEGIARTI000041967101). De janvier à septembre
# 2022, aucune source lue ne donne les clefs : celles de 2021 valent, les
# taux globaux n'ayant pas changé (circulaire Cnav n° 2023-4, point 2.1).
# Avant 2018, aucune clef n'est lue.
#   La Cipav : D. 131-5-3 (décret n° 2018-1120, en vigueur le 13 décembre
# 2018, LEGIARTI000037798349), puis D. 613-6 (LEGIARTI000041967529 ; puis
# LEGIARTI000043656780, du 1er juillet 2021 pour la Cipav) ; ses taux
# globaux, 22 % puis 22,2 % (D. 131-5-1 et D. 613-4, b). Que la CNAVPL ait
# validé sur ce versement, aucun texte lu ne le dit : ces versions ne
# répartissent que le forfait (`valide: false`).
#
# LA COMPENSATION DE L'ÉTAT, DE 2009 À 2015. L'auto-entrepreneur payait son
# forfait, et l'État compensait aux caisses la cotisation « normalement
# due » sur son revenu abattu (circulaire RSI n° 2010/034, point III) : ses
# trimestres se comptaient sur ce revenu, sauf aux bords. En 2009, sur une
# année civile entière, un trimestre au moins, « quel que soit le montant de
# son chiffre d'affaires » (circulaire RSI n° 2009/024, point I) : le
# `plancher`, en heures de SMIC. Depuis 2010, l'État ne compense plus sous un
# revenu abattu de 200 heures de SMIC, de 300 en 2015 (L. 133-6-8-2,
# LEGIARTI000021538000 ; D. 131-6-4, LEGIARTI000022402023 et
# LEGIARTI000030034478) : en deçà rien ne valide, le forfait de qui relève de
# la maladie du RSI allant tout entier à ce risque (circulaire RSI
# n° 2016/010, point 1) : le `seuil`. Jusqu'en 2013, c'est celui du
# trimestre ; en 2014, le trimestre passe à 150 heures et le premier en
# demande encore 200 ; en 2015, la compensation en valide deux d'un coup
# (circulaire RSI n° 2015/007, point 2). Les circulaires lues sont celles du
# RSI : la Cipav n'y est pas. La compensation cesse en 2016.
#
# LES SEUILS DE 2017 À 2019 (même étape, le 18 octobre 2026). De 2016 à 2021,
# la loi affecte le forfait par ordre, et non par clef : L. 133-6-8-3
# (LEGIARTI000023033721), puis L. 613-9 (LEGIARTI000037061897, du 14 juin 2018
# au 31 décembre 2021), l'affectent « par priorité » à l'impôt sur le revenu,
# puis à la CSG et à la CRDS, et « le solde » aux cotisations dans l'ordre de
# D. 133-4 (LEGIARTI000031799444, LEGIARTI000034721650, LEGIARTI000036475034) :
# la maladie, les indemnités journalières jusqu'en 2017, puis la vieillesse de
# base, avant l'invalidité-décès, la complémentaire et les allocations
# familiales. La part de base croît donc plus vite que le chiffre d'affaires,
# jusqu'à la cotisation due. La caisse en publie les seuils de 2017 à 2019 :
# barème « Chiffre d'affaire des micro-entrepreneurs validant un trimestre »,
# source Urssaf Caisse nationale, ventes, prestations de service BIC et BNC,
# lu le 18 octobre 2026 ; ils valident les trimestres de ces années, sur le
# chiffre d'affaires de l'année. Le revenu annuel moyen garde la clef de 2018
# et de 2019 et le revenu abattu de 2017, le compte la clef et le barème ; la
# Cnav n'applique sa clef qu'aux exemples de 2020 et de 2021 (circulaire
# n° 2025-20). L'« Info-doc RSI » du même barème s'arrête à 2015 : 2016 n'a
# pas de seuils publiés.
schema_version: 1

# La part du chiffre d'affaires que la saisie retire (L. 613-7, II) : le
# revenu du modèle est le chiffre d'affaires fois (1 - abattement).
abattements:
  vente: 0.71
  services: 0.50
  liberal: 0.34
  cipav: 0.34

# Les régimes qui reçoivent la part de base et la part complémentaire du
# forfait, quand le compte notionnel le porte (D. 613-6 ; la Cipav verse ses
# deux tranches de base à la CNAVPL).
regimes_du_forfait:
  vente: [regime_general, rci]
  services: [regime_general, rci]
  liberal: [regime_general, rci]
  cipav: [cnavpl, cipav_complementaire]

compensation:
  activites: [vente, services, liberal]
  plancher: {2009: 200}
  seuil: {2010: 200, 2011: 200, 2012: 200, 2013: 200, 2014: 200, 2015: 300}

# Le chiffre d'affaires qui valide un, deux, trois et quatre trimestres.
seuils:
  vente:
    2017: [3510, 6305, 9120, 20195]
    2018: [4085, 7185, 10250, 20430]
    2019: [4137, 7286, 10426, 20740]
  services:
    2017: [2020, 3635, 5245, 11715]
    2018: [2375, 4185, 5975, 11850]
    2019: [2412, 4239, 6071, 12030]
  liberal:
    2017: [2320, 4190, 6090, 8875]
    2018: [2835, 4990, 7150, 9550]
    2019: [2880, 5062, 7266, 9675]

versions:
  # a) vente de marchandises, 1° du 1 de l'article 50-0 du CGI.
  vente:
    - {debut: "2018-01", taux_global: 0.128, part_base: 0.4031, taux_base: 0.1775, part_complementaire: 0.1594}
    - {debut: "2022-10", taux_global: 0.123, part_base: 0.418, taux_base: 0.1775, part_complementaire: 0.165}
    - {debut: "2025-01", taux_global: 0.123, part_base: 0.418, taux_base: 0.1787, part_complementaire: 0.165}
    - {debut: "2026-01", taux_global: 0.123, part_base: 0.4345, taux_base: 0.1787, part_complementaire: 0.1975}
  # d) services commerciaux ou artisanaux, 2° du 1 de l'article 50-0.
  services:
    - {debut: "2018-01", taux_global: 0.22, part_base: 0.4036, taux_base: 0.1775, part_complementaire: 0.1591}
    - {debut: "2022-10", taux_global: 0.212, part_base: 0.418, taux_base: 0.1775, part_complementaire: 0.165}
    - {debut: "2025-01", taux_global: 0.212, part_base: 0.418, taux_base: 0.1787, part_complementaire: 0.165}
    - {debut: "2026-01", taux_global: 0.212, part_base: 0.4345, taux_base: 0.1787, part_complementaire: 0.1975}
  # e) libéral de l'Assurance retraite (L. 631-1 et 102 ter du CGI).
  liberal:
    - {debut: "2018-01", taux_global: 0.22, part_base: 0.5323, taux_base: 0.1775, part_complementaire: 0.0}
    - {debut: "2022-10", taux_global: 0.211, part_base: 0.555, taux_base: 0.1775, part_complementaire: 0.0}
    - {debut: "2024-07", taux_global: 0.231, part_base: 0.5075, taux_base: 0.1775, part_complementaire: 0.0785}
    - {debut: "2025-01", taux_global: 0.246, part_base: 0.476, taux_base: 0.1787, part_complementaire: 0.13}
    - {debut: "2026-01", taux_global: 0.256, part_base: 0.464, taux_base: 0.1787, part_complementaire: 0.21}
  # b) section de la Cipav (R. 641-1, 11°) : première tranche de la CNAVPL.
  cipav:
    - {debut: "2019-01", taux_global: 0.22, part_base: 0.25, part_base_seconde: 0.05, part_complementaire: 0.20, valide: false}
    - {debut: "2021-07", taux_global: 0.222, part_base: 0.248, part_base_seconde: 0.05, part_complementaire: 0.198, valide: false}
    - {debut: "2022-10", taux_global: 0.212, part_base: 0.26, taux_base: 0.0823, part_base_seconde: 0.053, part_complementaire: 0.2075}
    - {debut: "2024-07", taux_global: 0.232, part_base: 0.2345, taux_base: 0.0823, part_base_seconde: 0.0535, part_complementaire: 0.256}
    - {debut: "2025-01", taux_global: 0.232, part_base: 0.2345, taux_base: 0.0873, part_base_seconde: 0.0535, part_complementaire: 0.256}
    - {debut: "2026-01", taux_global: 0.232, part_base: 0.243, taux_base: 0.0873, part_base_seconde: 0.052, part_complementaire: 0.307}
