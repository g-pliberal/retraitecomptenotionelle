    retraite: false
    dans_la_reduction_generale: true
    salarie: [{jusqu_en_plafonds: null, taux: 0.0000}]
    employeur: [{jusqu_en_plafonds: null, taux: 0.0030}]
    textes:
      - "Article L. 137-40 du code de la sécurité sociale"

  - code: chomage
    libelle: "Assurance chômage"
    retraite: false
    dans_la_reduction_generale: true
    salarie: [{jusqu_en_plafonds: null, taux: 0.0000}]
    employeur:
      - {jusqu_en_plafonds: 4, taux: 0.0400}
      - {jusqu_en_plafonds: null, taux: 0.0000}
    note: >-
      Un agent non titulaire est affilié à l'assurance chômage, à la différence
      d'un fonctionnaire titulaire ; c'est aussi ce qui ouvre à son employeur
      public le bénéfice de la réduction générale.
    textes:
      - "Articles L. 5422-9 et L. 5424-1 du code du travail"

  - code: logement
    libelle: "Fonds national d'aide au logement (FNAL)"
    retraite: false
    dans_la_reduction_generale: true
    salarie: [{jusqu_en_plafonds: null, taux: 0.0000}]
    employeur: [{jusqu_en_plafonds: null, taux: 0.0050}]
    textes:
      - "Articles L. 813-4 et L. 813-5 du code de la construction et de l'habitation"

# Les prélèvements personnels d'un travailleur indépendant, hors retraite
# ------------------------------------------------------------------------
# Ils sont tous « salariaux » au sens de ce module — il n'y a personne d'autre
# pour les payer —, et leur assiette est l'ASSIETTE SOCIALE UNIQUE de l'article
# L. 136-3 : le revenu professionnel après l'abattement de 26 %, la même
# grandeur pour les cotisations et pour la CSG depuis la réforme de 2024. C'est
# celle que la carrière porte, et celle que le compte notionnel encaisse.
#
# Les deux barèmes progressifs ci-dessous ont été lus dans l'index LEGI le
# 19 septembre 2026, dans leur version en vigueur : OpenFisca en portait encore
# la rédaction de 2018, que la réforme de l'assiette unique a remplacée.
postes_independant: &postes_independant

  - code: maladie_maternite
    libelle: "Maladie et maternité"
    retraite: false
    dans_la_reduction_generale: false
    # Taux de base : 8,50 % sur la fraction de l'assiette qui n'excède pas trois
    # plafonds, 6,50 % au-delà (D. 621-1). En deçà de trois plafonds, ce taux
    # « fait l'objet d'une réduction » (D. 621-2) : le taux du palier interpolé
    # porte alors sur la TOTALITÉ de l'assiette, et c'est ce que `progressif`
    # écrit. La continuité est exacte à trois plafonds — 8,50 % des deux côtés.
    progressif:
      jusqu_en_plafonds: 3.0
      paliers:
        - {en_plafonds: 0.2, taux: 0.0000}
        - {en_plafonds: 0.4, taux: 0.0150}
        - {en_plafonds: 0.6, taux: 0.0400}
        - {en_plafonds: 1.1, taux: 0.0650}
        - {en_plafonds: 2.0, taux: 0.0770}
        - {en_plafonds: 3.0, taux: 0.0850}
    salarie:
      - {jusqu_en_plafonds: 3, taux: 0.0850}
      - {jusqu_en_plafonds: null, taux: 0.0650}
    employeur: []
    note: >-
      Le taux est nul en deçà de 20 % du plafond. Il ne l'est pas pour autant
      pour tout le monde : la loi impose une assiette minimale que ce module
      n'applique pas, faute de savoir si l'assuré relève d'une de ses
      exonérations. Le net d'un indépendant à très bas revenu est donc un
      plafond, et `docs/limites.md` le porte.
    textes:
      - "Article D. 621-1 du code de la sécurité sociale, version en vigueur (LEGIARTI000049904610)"
      - "Article D. 621-2 du code de la sécurité sociale, version en vigueur (LEGIARTI000049904592)"
      - "Décret n° 2024-688 du 5 juillet 2024, article 6"

  - code: indemnites_journalieres
    libelle: "Indemnités journalières"
    retraite: false
    dans_la_reduction_generale: false
    salarie:
      - {jusqu_en_plafonds: 5, taux: 0.0050}
      - {jusqu_en_plafonds: null, taux: 0.0000}
    employeur: []
    note: >-
      0,50 % pour les artisans, commerçants et industriels, dans la limite de
      cinq plafonds ; 0,30 % dans la limite de trois plafonds pour les
      professions libérales. Le module retient le premier taux, qui est celui du
      plus grand nombre, et l'écart — 0,20 point sous trois plafonds — ne
      déplace aucun écart entre systèmes. OpenFisca porte encore 0,70 %, taux
      de la rédaction de 2018 : la valeur ci-dessus a été lue dans l'index LEGI,
      comme les deux barèmes progressifs.
    textes:
      - "Article D. 621-3 du code de la sécurité sociale, version en vigueur (LEGIARTI000049904537)"
      - "Article L. 621-2 du code de la sécurité sociale"

  - code: invalidite_deces
    libelle: "Invalidité et décès"
    retraite: false
    dans_la_reduction_generale: false
    salarie:
      - {jusqu_en_plafonds: 1, taux: 0.0130}
      - {jusqu_en_plafonds: null, taux: 0.0000}
    employeur: []
    note: >-
      1,30 % dans la limite d'un plafond, pour les artisans comme pour les
      commerçants et industriels. Le régime invalidité-décès des professions
      libérales est propre à chaque section de la CNAVPL et souvent forfaitaire ;
      le taux retenu est celui des artisans-commerçants.
    textes:
      - "Arrêté du 4 juillet 2014 portant approbation des règlements des régimes d'assurance invalidité-décès des travailleurs indépendants"
      - "Article L. 635-1 du code de la sécurité sociale"

  - code: famille
    libelle: "Allocations familiales"
    retraite: false
    dans_la_reduction_generale: false
    # Nul jusqu'à 110 % du plafond, croissant jusqu'à 3,10 % à 140 %, puis
    # 3,10 % sur la totalité du revenu. Même forme que la maladie : le taux
    # interpolé porte sur tout, et la continuité est exacte à 140 %.
    progressif:
      jusqu_en_plafonds: 1.4
      paliers:
        - {en_plafonds: 1.1, taux: 0.0000}
        - {en_plafonds: 1.4, taux: 0.0310}
    salarie: [{jusqu_en_plafonds: null, taux: 0.0310}]
    employeur: []
    textes:
      - "Article D. 613-1 du code de la sécurité sociale, version en vigueur (LEGIARTI000041966324)"
      - "Article L. 613-1 du code de la sécurité sociale"

# Les quatre profils
# ------------------
# `incidence` dit ce que le modèle tient FIXE quand il compare deux systèmes :
#   `cout_du_travail` — l'employeur a budgété un coût, et ce qu'il ne verse plus
#                       en cotisations, il le verse en salaire. Le brut est
#                       recalculé par dichotomie.
#   `assiette`        — le brut (ou le revenu professionnel) ne bouge pas, et
#                       seule la part de l'assuré change. Lecture prudente, et
#                       la seule disponible quand la contribution de l'employeur
#                       n'est pas un prix du travail.
profils:

  salarie_prive:
    libelle: "Salarié"
    libelle_assiette: "Salaire brut"
    libelle_net: "Salaire net"
    cout_du_travail: true
    incidence: cout_du_travail
    postes: *postes_regime_general
    contributions_sociales: *csg_salariee
    reduction_generale: *reduction_generale

  salarie_ircantec:
    libelle: "Agent non titulaire de la fonction publique"
    libelle_assiette: "Rémunération brute"
    libelle_net: "Rémunération nette"
    cout_du_travail: true
    incidence: cout_du_travail
    postes: *postes_regime_general_sans_agirc
    contributions_sociales: *csg_salariee
    # Le coefficient maximal du décret est un chiffre national, bâti sur les
    # taux du privé ; il ne se refait pas employeur par employeur. Ce qui borne
    # la réduction ici, c'est la règle générale — elle ne peut pas excéder ce
    # qui est dû —, et le périmètre de cet employeur est plus étroit de la CEG
    # et plus large de l'Ircantec. Le modèle applique donc le même coefficient
    # et laisse le plafonnement faire son office.
    reduction_generale: *reduction_generale

  agent_seul:
    libelle: "Fonctionnaire ou agent d'un régime à retenue"
    libelle_assiette: "Traitement indiciaire brut"
    libelle_net: "Traitement net"
    cout_du_travail: false
    incidence: assiette
    # Rien d'autre que la retenue pour pension, que la fiche de régime porte, et
    # la CSG-CRDS. Un fonctionnaire titulaire ne cotise ni à la maladie — la
    # cotisation salariale a disparu en 2018 comme dans le privé —, ni au
    # chômage, dont il n'est pas assuré ; et la contribution exceptionnelle de
    # solidarité de 1 % a été supprimée le 1er janvier 2018 en contrepartie de
    # la hausse de CSG. Cette liste vide est donc un résultat, pas un oubli.
    postes: []
    contributions_sociales: *csg_salariee
    reduction_generale: null
    textes:
      - "Article 2 de la loi n° 82-939 du 4 novembre 1982 (contribution de solidarité), abrogé par l'article 143 de la loi n° 2016-1918 du 29 décembre 2016"
      - "Article L. 5424-1 du code du travail (fonctionnaires non assurés contre le chômage)"
      - "Article L. 61 du code des pensions civiles et militaires de retraite (retenue pour pension)"

  independant:
    libelle: "Travailleur indépendant"
    libelle_assiette: "Revenu professionnel"
    libelle_net: "Revenu disponible"
    cout_du_travail: false
    incidence: assiette
    postes: *postes_independant
    contributions_sociales:
      csg_deductible: 0.068
      csg_imposable: 0.024
      crds: 0.005
      # Pas d'abattement : celui de 1,75 % est propre aux revenus d'activité
      # SALARIÉE. Depuis la réforme de l'assiette unique, la CSG d'un
      # indépendant porte sur la même assiette que ses cotisations.
      abattement_frais_professionnels: []
      note: >-
        CSG 9,20 % et CRDS 0,50 % sur l'assiette sociale unique de l'article
        L. 136-3 — le revenu professionnel après l'abattement de 26 %. C'est la
        même assiette que celle des cotisations depuis la réforme de 2024, et
        c'est ce qui permet de n'en écrire qu'une ici.
      textes:
        - "Article L. 136-3 du code de la sécurité sociale, version en vigueur (LEGIARTI000051284498)"
        - "Article L. 131-6 du code de la sécurité sociale, version en vigueur (LEGIARTI000048683707)"
        - "Loi n° 2023-1250 du 26 décembre 2023, article 18 (LFSS 2024)"
    reduction_generale: null

# Ce qui est prélevé sur une PENSION, et non sur un revenu d'activité
# ===================================================================
# Le reste de ce fichier décrit ce qu'on paie en travaillant. Ce bloc décrit ce
# qu'on paie une fois retraité, et il existe pour une seule raison : sans lui,
# le site comparerait un salaire NET à une pension BRUTE, c'est-à-dire deux
# grandeurs différentes.
#
# Une pension n'est pas un salaire, et ses prélèvements ne sont pas les mêmes :
# aucune cotisation sociale — un retraité n'acquiert plus de droits —, aucun
# abattement pour frais professionnels, et un taux de CSG propre.
#
# LE TAUX DE CSG, ET LA CONVENTION QUI LE FIXE
# --------------------------------------------
# L'article L. 136-8 fait dépendre ce taux du REVENU FISCAL DE RÉFÉRENCE du
# foyer, perçu l'avant-dernière année, et en tire quatre cas pour une part de
# quotient familial (montants 2026, revalorisés chaque année sur les prix) :
#
#     exonéré     revenu fiscal de référence ≤ 11 128 €
#     3,80 %      11 128 € < revenu ≤ 14 548 €
#     6,60 %      14 548 € < revenu < 22 580 €
#     8,30 %      revenu ≥ 22 580 €
#
# Le simulateur ne connaît pas ce revenu : il ne demande ni la composition du
# foyer, ni les autres ressources, ni un revenu d'il y a deux ans. **Le dépôt
# retient donc le TAUX PLEIN pour tout le monde**, et l'écrit sur la page.
#
# C'est la convention la plus simple, et il faut dire ce qu'elle coûte : elle
# SURESTIME le prélèvement sur les petites pensions. Une pension de 660 € par
# mois — l'ordre de grandeur des scénarios notionnels sur la seule part
# salariale — placerait son titulaire, s'il vivait seul et n'avait rien
# d'autre, sous le premier seuil : il serait exonéré de CSG, de CRDS et de
# CASA, et son net vaudrait son brut. Le site lui retire 9,1 %. L'écart entre
# les systèmes affichés est donc, de ce fait, un peu resserré pour les petites
# pensions et exact pour les grandes. `docs/limites.md` porte la réserve.
#
# CE QUI N'EST PAS ICI
# --------------------
# La cotisation d'assurance maladie de 1 % due sur la retraite COMPLÉMENTAIRE
# des salariés. Elle ne porte que sur une partie de la pension, et les cinq
# scénarios notionnels ne distinguent pas base et complémentaire — leur compte
# est unique. L'appliquer aux uns et pas aux autres fabriquerait un écart qui
# ne viendrait d'aucune règle.
#
# LA RENTE DU PILIER CAPITALISÉ suit le même barème que la pension, et c'est
# une convention : le dépôt la traite en rente viagère à titre GRATUIT, ce
# qu'elle est quand la cotisation qui l'a constituée a été prélevée à la
# source et déduite — le cas d'une cotisation obligatoire. Une rente à titre
# onéreux relèverait des prélèvements sur revenus du patrimoine, à 17,2 % sur
# une fraction du montant qui dépend de l'âge. La proposition ne tranche pas ;
# le dépôt retient la lecture qui découle du caractère obligatoire.
pensions:
  csg_taux_plein: 0.083
  crds: 0.005
  casa: 0.003
  #: Les quatre cas de l'article L. 136-8, pour mémoire et pour la page : le
  #: modèle applique le taux plein, mais le lecteur doit pouvoir situer sa
  #: propre situation. Montants 2026, pour une part de quotient familial.
  bareme_csg:
    - {libelle: "exonéré", taux: 0.0, revenu_fiscal_maximum: 11128}
    - {libelle: "taux réduit", taux: 0.038, revenu_fiscal_maximum: 14548}
    - {libelle: "taux médian", taux: 0.066, revenu_fiscal_maximum: 22580}
    - {libelle: "taux plein", taux: 0.083, revenu_fiscal_maximum: null}
  note: >-
    CSG 8,30 %, CRDS 0,50 %, CASA 0,30 % : 9,10 % au total, sans abattement.
    La CASA n'est due qu'au taux plein de CSG, ce que la convention du dépôt
    rend toujours vrai.
  textes:
    - "Article L. 136-8 du code de la sécurité sociale, version en vigueur du 31 décembre 2025 (LEGIARTI000053278668), II 2° pour le taux de 8,30 %, III et III bis pour les taux réduits et leurs seuils"
    - "Article L. 14-10-4, 1° bis, du code de l'action sociale et des familles (CASA, 0,30 %, due au-delà du seuil du taux plein de CSG)"
    - "Ordonnance n° 96-50 du 24 janvier 1996, articles 14 et 19 (CRDS, 0,50 %)"

fiabilite: haute
