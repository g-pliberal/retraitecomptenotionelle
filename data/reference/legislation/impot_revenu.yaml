  reduction_des_salaires:
    - {annee: 1969, monnaie: "FRF", taux: 0.05, age_agees: 75, taux_agees: 0.05, plafond_agees: 270, origine: "rapport", texte: "CGI, art. 198, non lu : « tous les contribuables percevant des salaires ou des pensions bénéficient d'une réduction d'impôt égale à 5 % du montant net imposable de ces salaires ou pensions » (rapport général du Sénat n° 56 (1969-1970), tome III (senat.fr/rap/1969-1970/i1969_1970_0056_03.pdf), p. 14), « ce qui aboutit par conséquent à diminuer de 5 points le jeu du barème » (rapport général du Sénat n° 54 (1970-1971), tome II (senat.fr/rap/1970-1971/i1970_1971_0054_02.pdf), p. 77) ; Loi n° 69-1161 du 24 décembre 1969 (LF pour 1970), art. 4, II, texte définitif adopté par le Sénat le 16 décembre 1969 (senat.fr/leg/1969-1970/ta1969_1970_0055.pdf) : « Les contribuables âgés de plus de 75 ans [...] bénéficient, dans la limite de 270 F, d'une réduction d'impôt égale à 5 % de leurs revenus effectivement soumis à l'impôt [...] Elle ne se cumule pas avec la réduction d'impôt visée à l'article 198 du même code, la réduction dont le montant est le plus élevé étant seule retenue »"}
    - {annee: 1970, monnaie: "FRF", taux: 0.03, age_agees: 70, taux_agees: 0.03, plafond_agees: 170, origine: "loi", texte: "Loi n° 70-1199 du 21 décembre 1970 (LF pour 1971), art. 2, III et VII, et art. 3, I, texte définitif adopté par le Sénat le 9 décembre 1970 (senat.fr/leg/1970-1971/ta1970_1971_0028.pdf) : « Les réductions d'impôts prévues à l'article 198 [...] et au paragraphe II de l'article 4 de la loi de finances pour 1970 sont supprimées pour l'imposition des revenus des années 1971 et suivantes. Leur taux est fixé à 3 % pour l'imposition des revenus de l'année 1970 » ; la seconde « ne peut excéder 170 F » et « est étendue aux personnes âgées de plus de 70 ans » ; la première, « à l'ensemble des salaires, pensions et rentes viagères »"}
    - {annee: 1971, monnaie: "FRF", taux: 0.03, autres_revenus_maximum: 15000, age_agees: 70, taux_agees: 0.03, plafond_agees: 180, origine: "rapport", texte: "Loi n° 71-1061 du 29 décembre 1971 (LF pour 1972), JORFTEXT000000687436, que le Sénat a rejetée et que l'Assemblée nationale a adoptée en lecture définitive, art. 2, II, texte voté par l'Assemblée nationale en première lecture, que reproduit le rapport général du Sénat n° 27 (1971-1972), tome II (senat.fr/rap/1971-1972/i1971_1972_0027_02.pdf) : « 1° Pour l'imposition des revenus de l'année 1971, la réduction d'impôt prévue à l'article 198 [...] est maintenue et étendue aux revenus autres que les traitements, salaires, pensions et rentes viagères lorsqu'ils n'excèdent pas 15.000 F par contribuable. 2° La réduction d'impôt prévue à l'article 4-II de la loi de finances pour 1970 est maintenue pour l'imposition des revenus de l'année 1971. Les plafonds de cette réduction sont fixés à 180 F pour la Métropole »"}
    - {annee: 1972, supprimee: true, texte: "Loi n° 72-1121 du 20 décembre 1972 (LF pour 1973), art. 2, texte définitif adopté par le Sénat le 15 décembre 1972 (senat.fr/leg/1972-1973/ta1972_1973_0048.pdf) : la réduction de 3 % « est maintenant totalement intégrée au barème » (rapport général du Sénat n° 66 (1972-1973), tome II (senat.fr/rap/1972-1973/i1972_1973_0066_02.pdf), p. 8) ; celle des contribuables âgés, supprimée dès 1971 (loi n° 70-1199, art. 2, III, 1), n'a été maintenue que pour 1971"}
