    - {annee: 1972, monnaie: "FRF", abattement_plein: 500, seuil_plein: 12000, seuil_plein_exclu: true, origine: "loi", texte: "Loi n° 72-1121 du 20 décembre 1972 (LF pour 1973), art. 3, texte définitif adopté par le Sénat le 15 décembre 1972 (senat.fr/leg/1972-1973/ta1972_1973_0048.pdf) : « Les contribuables âgés de plus de soixante-cinq ans au 31 décembre de l'année d'imposition, ou remplissant l'une des conditions d'invalidité mentionnées à l'article 195 du Code général des impôts, et dont le revenu net global est inférieur à 12.000 F, peuvent déduire de ce revenu une somme de 500 F. Ils peuvent opérer une déduction identique au titre de leur conjoint »"}
    - {annee: 1973, monnaie: "FRF", abattement_plein: 2000, seuil_plein: 12000, abattement_reduit: 1000, seuil_reduit: 20000, origine: "loi", texte: "Loi n° 73-1150 du 27 décembre 1973 (LF pour 1974), art. 3, texte définitif adopté par le Sénat le 18 décembre 1973 (senat.fr/leg/1973-1974/ta1973_1974_0031.pdf) : « La déduction de 500 F dont les personnes âgées de plus de soixante-cinq ans ou invalides bénéficient [...] est portée à 2 000 F pour celles dont le revenu net global n'excède pas 12 000 F et 1 000 F pour celles dont le revenu net global est compris entre 12 000 F et 20 000 F »"}
