# Profils d'affiliation : quels régimes s'appliquent à qui, et quand
# ------------------------------------------------------------------
# Un assuré ne choisit pas ses régimes : il déclare un STATUT (salarié du privé,
# fonctionnaire d'État, agent SNCF…), et le modèle en déduit l'ensemble des
# régimes — de base et complémentaires — auxquels il a cotisé chaque année.
# C'est ce qui permet à quelqu'un qui ignore tout de la mécanique des caisses de
# faire une simulation juste.
#
# Chaque affiliation liste des tranches temporelles ; pour chaque tranche, les
# régimes actifs. Les régimes marqués `hors_repartition` dans le catalogue sont
# automatiquement isolés dans le compartiment de capitalisation.
#
# `sans_employeur: true` marque les statuts qui n'ont PAS d'employeur : la
# cotisation y est intégralement personnelle. Le drapeau est nécessaire parce
# qu'un non-salarié relève souvent d'un régime partagé avec des salariés — un
# artisan cotise au régime général, dont la fiche porte la répartition 41/59
# d'un salarié. Le taux est le bon, la répartition ne l'est pas : lui, paie
# tout. Sans ce drapeau, les scénarios 4 et 5 lui prêteraient un employeur.

affiliations:

  salarie_prive_non_cadre:
    libelle: Salarié du secteur privé, non cadre
    periodes:
      - {debut: 1930, fin: 1944, regimes: [assurances_sociales]}
      - {debut: 1945, fin: 1956, regimes: [regime_general]}
      - {debut: 1957, fin: 1960, regimes: [regime_general, unirs]}
      - {debut: 1961, fin: 2018, regimes: [regime_general, arrco, arrco_tranche_2]}
      - {debut: 2019, fin: null, regimes: [regime_general, agirc_arrco]}

  salarie_prive_cadre:
    libelle: Salarié du secteur privé, cadre
    periodes:
      - {debut: 1930, fin: 1944, regimes: [assurances_sociales]}
      - {debut: 1945, fin: 1946, regimes: [regime_general]}
      - {debut: 1947, fin: 1960, regimes: [regime_general, agirc]}
      - {debut: 1961, fin: 2018, regimes: [regime_general, arrco, agirc]}
      - {debut: 2019, fin: null, regimes: [regime_general, agirc_arrco]}

  salarie_prive_non_cadre_entreprise_recente:
    libelle: Salarié du secteur privé, non cadre, entreprise créée après 1997
    periodes:
      - {debut: 1930, fin: 1944, regimes: [assurances_sociales]}
      - {debut: 1945, fin: 1956, regimes: [regime_general]}
      - {debut: 1957, fin: 1960, regimes: [regime_general, unirs]}
      - {debut: 1961, fin: 1996, regimes: [regime_general, arrco]}
      - {debut: 1997, fin: 2018, regimes: [regime_general, arrco, arrco_tranche_2_entreprises_nouvelles]}
      - {debut: 2019, fin: null, regimes: [regime_general, agirc_arrco]}
    note: >-
      L'accord Arrco du 25 avril 1996 a imposé aux entreprises créées à compter
      du 1er janvier 1997 un taux de tranche 2 de 14 % d'emblée (16 % en 2000),
      quand les entreprises déjà adhérentes montaient par marches de 4 % à 16 %
      jusqu'en 2005. Ce statut porte ce barème-là ; avant 1997, l'entreprise
      n'existant pas, la tranche 2 n'est pas cotisée. Le statut « salarié non
      cadre » porte le barème des entreprises existantes, le plus nombreux.

  salarie_prive_cadre_entreprise_recente:
    libelle: Salarié du secteur privé, cadre, entreprise créée après 1981
    periodes:
      - {debut: 1930, fin: 1944, regimes: [assurances_sociales]}
      - {debut: 1945, fin: 1946, regimes: [regime_general]}
      - {debut: 1947, fin: 1960, regimes: [regime_general, agirc]}
      - {debut: 1961, fin: 1980, regimes: [regime_general, arrco, agirc]}
      - {debut: 1981, fin: 2018, regimes: [regime_general, arrco, agirc_entreprises_nouvelles]}
      - {debut: 2019, fin: null, regimes: [regime_general, agirc_arrco]}
    note: >-
      L'Agirc a imposé aux entreprises créées à compter du 1er janvier 1981 un
      taux contractuel de 12 % dès 1983, quand les entreprises déjà adhérentes
      gardaient 8 % jusqu'en 1993 ; les deux barèmes se rejoignent en 1996. Ce
      statut porte ce barème-là de 1981 à 2018 ; avant 1981 il suit le cadre de
      droit commun.

  maitre_enseignement_prive:
    libelle: Maître de l'enseignement privé sous contrat
    periodes:
      - {debut: 1945, fin: 1956, regimes: [regime_general]}
      - {debut: 1957, fin: 1960, regimes: [regime_general, unirs]}
      - {debut: 1961, fin: 2004, regimes: [regime_general, arrco, arrco_tranche_2]}
      - {debut: 2005, fin: 2018, regimes: [regime_general, arrco, arrco_tranche_2, enseignants_prive_additionnel]}
      - {debut: 2019, fin: null, regimes: [regime_general, agirc_arrco, enseignants_prive_additionnel]}
    note: >-
      Un salarié de droit privé payé par l'État : régime général et Arrco
      comme le non-cadre, puis, depuis le 1er septembre 2005, le régime
      additionnel de la loi n° 2005-5 (décret n° 2005-1233), assis sur la
      rémunération versée par l'État. Le maître entré avant 2005 y a des
      droits pour ses années antérieures — la fraction de 2 % de l'article
      7 — sans avoir cotisé : ils ne sont pas dans la fiche.

  elu_local:
    libelle: Élu local indemnisé (maire, adjoint, conseiller)
    periodes:
      - {debut: 1973, fin: 2012, regimes: [ircantec]}
      - {debut: 2013, fin: null, regimes: [regime_general, ircantec]}
    note: >-
      L'indemnité de fonction ouvre des points Ircantec depuis la loi
      n° 72-1201 du 23 décembre 1972 (art. 1, LEGIARTI000006338235 ;
      L. 2123-28 du CGCT, LEGIARTI000006390053), sans régime de base ;
      depuis 2013 elle est soumise aux cotisations du régime général
      au-delà d'un seuil (L. 382-31), que le statut ne lit pas : le revenu
      saisi est l'indemnité, cotisée en entier. La collectivité verse la
      part patronale, le statut n'est donc pas sans employeur.

  salarie_saint_pierre_et_miquelon:
    libelle: Salarié de Saint-Pierre-et-Miquelon
    periodes:
      - {debut: 1987, fin: 2018, regimes: [cps_saint_pierre_et_miquelon, arrco, arrco_tranche_2]}
      - {debut: 2019, fin: null, regimes: [cps_saint_pierre_et_miquelon, agirc_arrco]}
    note: >-
      Le régime de base de la loi n° 87-563 remplace en août 1987 celui de
      l'ordonnance n° 77-1102, dont l'index ne porte pas le barème : rien
      n'est routé avant. Les complémentaires de salariés y sont
      applicables (art. 36, LEGIARTI000006757200) : l'Arrco du non-cadre.

  salarie_mayotte:
    libelle: Salarié de Mayotte
    periodes:
      - {debut: 1987, fin: null, regimes: [cssm_mayotte]}
    note: >-
      Le décret n° 87-175 crée le régime au 1er janvier 1987 ; rien avant.
      Aucune complémentaire obligatoire : l'Agirc-Arrco n'est pas
      applicable à Mayotte.

  auteur_dramatique:
    libelle: Auteur ou compositeur dramatique, auteur de l'audiovisuel (SACD)
    periodes:
      - {debut: 1964, fin: 1976, regimes: [ircec_racd]}
      - {debut: 1977, fin: null, regimes: [regime_general, ircec_raap, ircec_racd]}
    note: >-
      Comme l'artiste-auteur, avec le RACD en plus depuis le décret
      n° 64-226 ; le régime général et le RAAP suivent la loi du 31
      décembre 1975. Le diffuseur cotise à côté de l'auteur : le statut
      n'est pas sans employeur.

  auteur_lyrique:
    libelle: Auteur ou compositeur de musique (SACEM)
    periodes:
      - {debut: 1962, fin: 1976, regimes: [ircec_racl]}
      - {debut: 1977, fin: null, regimes: [regime_general, ircec_raap, ircec_racl]}
    note: >-
      Comme l'artiste-auteur, avec le RACL en plus depuis le décret
      n° 61-1304 ; le régime général et le RAAP suivent la loi du 31
      décembre 1975.

  gerant_debit_tabac:
    libelle: Gérant de débit de tabac (buraliste)
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: 1962, regimes: [organic]}
      - {debut: 1963, fin: 2003, regimes: [organic, gerants_debits_tabac]}
      - {debut: 2004, fin: 2005, regimes: [organic, nric, gerants_debits_tabac]}
      - {debut: 2006, fin: 2012, regimes: [rsi, nric, gerants_debits_tabac]}
      - {debut: 2013, fin: 2017, regimes: [rsi, rci, gerants_debits_tabac]}
      - {debut: 2018, fin: null, regimes: [regime_general, rci, gerants_debits_tabac]}
    note: >-
      Un commerçant, avec l'allocation viagère de 1963 par-dessus. Le
      revenu saisi tient lieu de remises sur les tabacs pour la fiche
      `gerants_debits_tabac`, ce qui les surestime pour un débit qui vend
      aussi de la presse ou des jeux.

  micro_entrepreneur:
    libelle: Micro-entrepreneur (commerçant, artisan ou libéral non réglementé)
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: 2003, regimes: [organic]}
      - {debut: 2004, fin: 2005, regimes: [organic, nric]}
      - {debut: 2006, fin: 2008, regimes: [rsi, nric]}
      - {debut: 2009, fin: 2012, regimes: [rsi, nric]}
      - {debut: 2013, fin: 2017, regimes: [rsi, rci]}
      - {debut: 2018, fin: null, regimes: [regime_general, rci]}
    note: >-
      Le micro-social n'est pas un régime mais une manière de cotiser
      (L. 133-6-8) : un pourcentage du chiffre d'affaires, dont une fraction
      va au régime de base et à la complémentaire des commerçants, et des
      droits calculés sur le chiffre d'affaires après abattement (71 %, 50 %
      ou 34 %). Le revenu saisi doit donc être ce revenu reconstitué ; le
      statut route les mêmes régimes que le commerçant, avant 2009 comme
      lui. Les seuils de chiffre d'affaires qui valident les trimestres ne
      sont pas portés.

  fonctionnaire_etat:
    libelle: Fonctionnaire titulaire de l'État (civil ou militaire)
    periodes:
      - {debut: 1930, fin: 1947, regimes: [pensions_civiles_1853]}
      - {debut: 1948, fin: 2004, regimes: [fonction_publique_etat]}
      - {debut: 2005, fin: null, regimes: [fonction_publique_etat, rafp]}

  fonctionnaire_territorial_hospitalier:
    libelle: Fonctionnaire territorial ou hospitalier
    periodes:
      - {debut: 1945, fin: 2004, regimes: [cnracl]}
      - {debut: 2005, fin: null, regimes: [cnracl, rafp]}

  ouvrier_etat:
    libelle: Ouvrier des établissements industriels de l'État
    periodes:
      - {debut: 1930, fin: 2004, regimes: [fspoeie]}
      - {debut: 2005, fin: null, regimes: [fspoeie, rafp]}

  contractuel_public:
    libelle: Agent non titulaire de la fonction publique
    periodes:
      - {debut: 1945, fin: 1950, regimes: [regime_general]}
      - {debut: 1951, fin: 1959, regimes: [regime_general, ipacte]}
      - {debut: 1960, fin: 1970, regimes: [regime_general, ipacte, igrante]}
      - {debut: 1971, fin: null, regimes: [regime_general, ircantec]}
    note: >-
      L'IPACTE naît du décret n° 51-1445 du 12 décembre 1951 et cotise
      au-dessus du plafond ; l'IGRANTE, du décret n° 59-1569 du 31 décembre
      1959, cotise sous le plafond pour les agents qui relèvent aussi de
      l'IPACTE (article 2). Le statut route les deux, sur deux assiettes qui
      ne se recouvrent pas, jusqu'à leur remplacement par l'Ircantec au
      1er janvier 1971.

  artisan:
    libelle: Artisan
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: 1978, regimes: [cancava]}
      - {debut: 1979, fin: 2005, regimes: [cancava, rco_artisans]}
      - {debut: 2006, fin: 2012, regimes: [rsi, rco_artisans]}
      - {debut: 2013, fin: 2017, regimes: [rsi, rci]}
      - {debut: 2018, fin: null, regimes: [regime_general, rci]}

  commercant:
    libelle: Commerçant ou industriel
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: 2003, regimes: [organic]}
      - {debut: 2004, fin: 2005, regimes: [organic, nric]}
      - {debut: 2006, fin: 2012, regimes: [rsi, nric]}
      - {debut: 2013, fin: 2017, regimes: [rsi, rci]}
      - {debut: 2018, fin: null, regimes: [regime_general, rci]}

  profession_liberale:
    libelle: Profession libérale (CNAVPL et CIPAV)
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: 1978, regimes: [cnavpl]}
      - {debut: 1979, fin: null, regimes: [cnavpl, cipav_complementaire]}
    note: >-
      LA SECTION PAR DÉFAUT EST LA CIPAV, et c'est elle que ce statut porte
      depuis que sa fiche existe. Le régime complémentaire obligatoire d'un
      libéral dépend de sa section : les médecins ont la CARMF, les
      chirurgiens-dentistes et sages-femmes la CARCDSF, les avocats la CNBF —
      trois statuts distincts les routent. Tous les autres métiers non
      réglementés, et les professions de la construction, relèvent de la
      CIPAV : architectes, ingénieurs-conseils, géomètres, psychologues,
      ostéopathes, guides. C'est la section la plus nombreuse après les
      auxiliaires médicaux, et le choix le moins arbitraire pour un statut
      générique.
      LES DIX SECTIONS ONT MAINTENANT LEUR FICHE ET LEUR STATUT : CARMF,
      CARCDSF, CARPIMKO, CAVP, CAVEC, CARPV, CAVOM, CAVAMAC, CPRN, et la CIPAV
      que porte ce statut-ci. Les deux dernières venues ne cotisent pas sur le
      revenu de l'assuré mais sur une grandeur qui lui est proportionnelle —
      commissions pour l'une, produits de l'office pour l'autre —, et la CPRN
      ne porte que la moitié proportionnelle de son régime. Voir
      docs/limites.md.
      La borne de 1979 est celle du décret n° 79-262 du 21 mars 1979, qui
      institue le complémentaire des architectes.

  auxiliaire_medical:
    libelle: >-
      Auxiliaire médical libéral (infirmier, masseur-kinésithérapeute,
      orthophoniste)
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: 1983, regimes: [cnavpl]}
      - {debut: 1984, fin: null, regimes: [cnavpl, carpimko_complementaire]}
    note: >-
      La CARPIMKO est la plus nombreuse des dix sections professionnelles de la
      CNAVPL. Son complémentaire est créé par le décret n° 84-143 du 22 février
      1984, d'où la borne : purement forfaitaire jusqu'en 1995, forfait plus
      3 % ensuite, et entièrement proportionnel depuis 2026.
      CE STATUT NE PORTE PAS L'ASV, le régime des prestations complémentaires
      de vieillesse des auxiliaires médicaux conventionnés, dont les deux tiers
      sont payés par l'assurance maladie. Un infirmier conventionné est donc
      sous-estimé de cet étage.

  pharmacien:
    libelle: Pharmacien ou biologiste libéral
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: null, regimes: [cnavpl, cavp_complementaire]}
    note: >-
      Le complémentaire de la CAVP a DEUX VOLETS, et ce statut n'en porte qu'un.
      Celui en RÉPARTITION est une cotisation forfaitaire — identique dans
      toutes les classes —, convertie en annuités : c'est lui qu'un compte
      notionnel sait porter. Celui en CAPITALISATION, réparti en classes de
      2 906 à 17 436 € en 2026, n'est pas au catalogue : il n'est pas de la
      répartition, et sa grille n'est pas publiée sous une forme lisible.
      Un pharmacien simulé ici est donc sous-estimé de la part capitalisée de
      son complémentaire, qui peut en représenter la moitié.

  expert_comptable:
    libelle: Expert-comptable ou commissaire aux comptes
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: 1952, regimes: [cnavpl]}
      - {debut: 1953, fin: null, regimes: [cnavpl, cavec_complementaire]}
    note: >-
      La CAVEC gère pour le compte de la CNAVPL le régime de base des
      professions libérales, et pilote en propre son complémentaire — institué
      en 1953, et par CLASSES depuis l'origine : « un système de points avec
      cotisations indépendantes du revenu », écrit la caisse. C'est lui qui
      pèse l'essentiel de la pension d'un expert-comptable.

  agent_general_assurance:
    libelle: Agent général d'assurance
    periodes:
      - {debut: 1949, fin: 1967, regimes: [cnavpl]}
      - {debut: 1968, fin: null, regimes: [cnavpl, cavamac_complementaire]}
    note: >-
      LE SEUL LIBÉRAL DU CATALOGUE QUI NE COTISE PAS SEUL, et c'est pour cela
      qu'il n'est pas marqué `sans_employeur`. Un tiers des ressources de son
      complémentaire vient du « concours conventionnel des compagnies
      mandantes » — 2,50 points sur les 7,66 % appelés en 2026 —, en vertu
      d'accords de branche successifs « depuis 1952 », rappelait le
      gouvernement au Sénat en 2021. Les compagnies ne sont pas son employeur ;
      elles paient pourtant pour sa retraite, et le modèle ne saurait le dire
      autrement. Son régime de BASE, lui, reste intégralement à sa charge : la
      fiche de la CNAVPL ne porte aucun partage, donc sa part y vaut un.
      SON COMPLÉMENTAIRE NE COTISE PAS NON PLUS SUR SON REVENU mais sur les
      COMMISSIONS que les compagnies lui versent, qui valent en moyenne 2,387
      fois celui-ci — la caisse publie les deux grandeurs, et la fiche du
      régime porte le facteur.
      La borne de 1968 est celle du décret n° 67-1169 du 22 décembre 1967, qui
      institue le régime.

  notaire:
    libelle: Notaire libéral
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: null, regimes: [cnavpl, cprn_complementaire]}
    note: >-
      UN NOTAIRE SIMULÉ ICI EST SOUS-ESTIMÉ, ET DE BEAUCOUP. Son complémentaire
      a deux sections ; le statut n'en porte qu'une, la section C
      proportionnelle, parce que les bornes de classes de la section B ne sont
      publiées nulle part. Il manque environ quatre dixièmes du complémentaire.
      L'assiette elle-même n'est pas son revenu mais les PRODUITS DE SON
      OFFICE : la fiche les reconstitue par un facteur de 2,04, qui est une
      convention — son arithmétique entière est dans les notes du régime.

  veterinaire:
    libelle: Vétérinaire libéral
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: 1949, regimes: [cnavpl]}
      - {debut: 1950, fin: null, regimes: [cnavpl, carpv_complementaire]}
    note: >-
      La CARPV est la plus petite des dix sections de la CNAVPL, et celle dont
      le complémentaire pèse le plus lourd devant la base : un vétérinaire à
      76 000 € de revenus lui verse 10 234 € en 2026 contre 5 377 € au régime
      de base. Cotisation par CLASSES, déterminées par le revenu de l'année
      précédente, et la classe est subie : c'est ce qui la rend modélisable.
      La borne de 1950 est celle du décret n° 50-1318 du 21 octobre 1950, qui
      institue le régime complémentaire au sein de la caisse.

  officier_ministeriel:
    libelle: >-
      Officier ministériel ou public (commissaire de justice, greffier de
      tribunal de commerce, avocat aux Conseils)
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: 1978, regimes: [cnavpl]}
      - {debut: 1979, fin: null, regimes: [cnavpl, cavom_complementaire]}
    note: >-
      Le complémentaire de la CAVOM existe depuis le décret n° 79-265 du
      27 mars 1979 (article 2, LEGIARTI000006770098) et il est routé depuis
      cette date. Il prélevait par classes jusqu'en 2015, selon des bornes de
      revenu que les statuts fixent hors index : la fiche projette en arrière
      le taux proportionnel de 2016 — 12,50 % jusqu'à huit plafonds — au niveau
      estimé, plutôt que de laisser l'officier ministériel sans complémentaire
      pendant trente-sept ans, ce que le dépôt faisait jusqu'à la tranche B4.

  avocat:
    libelle: Avocat
    sans_employeur: true
    periodes:
      - {debut: 1948, fin: 1978, regimes: [cnbf]}
      - {debut: 1979, fin: null, regimes: [cnbf, cnbf_complementaire]}

  salarie_agricole:
    libelle: Salarié agricole
    periodes:
      - {debut: 1930, fin: 1944, regimes: [assurances_sociales]}
      - {debut: 1945, fin: 1960, regimes: [msa_salaries]}
      - {debut: 1961, fin: 2018, regimes: [msa_salaries, arrco, arrco_tranche_2]}
      - {debut: 2019, fin: null, regimes: [msa_salaries, agirc_arrco]}

  exploitant_agricole:
    libelle: Chef d'exploitation ou d'entreprise agricole
    sans_employeur: true
    periodes:
      - {debut: 1952, fin: 2002, regimes: [msa_non_salaries]}
      - {debut: 2003, fin: null, regimes: [msa_non_salaries, msa_rco]}

  agent_sncf:
    libelle: Agent du cadre permanent de la SNCF
    periodes:
      - {debut: 1930, fin: null, regimes: [sncf], entres_avant: 2020}
      - {debut: 2020, fin: null, regimes: [regime_general, agirc_arrco],
         entres_depuis: 2020}
    note: >-
      Régime fermé aux agents RECRUTÉS depuis le 1er janvier 2020, et à eux
      seuls : celui qui était déjà là le garde jusqu'à sa retraite. Le
      routage par la seule année faisait basculer tout le monde en 2020,
      y compris l'agent entré vingt ans plus tôt.

  agent_ratp:
    libelle: Agent statutaire de la RATP
    periodes:
      - {debut: 1930, fin: null, regimes: [ratp], entres_avant: 2023}
      - {debut: 2023, fin: null, regimes: [regime_general, agirc_arrco],
         entres_depuis: 2023}
    note: >-
      Régime fermé aux agents RECRUTÉS depuis le 1er septembre 2023 : la
      réforme du 14 avril 2023 l'éteint par clause du grand-père, et celui
      qui était déjà là le garde.

  agent_ieg:
    libelle: Agent des industries électriques et gazières
    periodes:
      - {debut: 1946, fin: null, regimes: [ieg], entres_avant: 2023}
      - {debut: 2023, fin: null, regimes: [regime_general, agirc_arrco],
         entres_depuis: 2023}
    note: >-
      Régime fermé aux agents RECRUTÉS depuis le 1er septembre 2023 ; celui
      qui était déjà là le garde jusqu'à sa retraite.

  marin:
    libelle: Marin professionnel
    periodes:
      - {debut: 1930, fin: null, regimes: [marins]}

  mineur:
    libelle: Mineur
    periodes:
      - {debut: 1930, fin: null, regimes: [mines], entres_avant: 2011}
      - {debut: 2011, fin: 2018, regimes: [regime_general, arrco, arrco_tranche_2],
         entres_depuis: 2011}
      - {debut: 2019, fin: null, regimes: [regime_general, agirc_arrco],
         entres_depuis: 2011}
    note: >-
      Régime fermé aux mineurs RECRUTÉS depuis le 1er septembre 2010 ; celui
      qui était déjà là le garde jusqu'à sa retraite.

  clerc_de_notaire:
    libelle: Clerc ou employé de notaire
    periodes:
      - {debut: 1937, fin: null, regimes: [crpcen]}

  agent_banque_de_france:
    libelle: Agent titulaire de la Banque de France
    periodes:
      - {debut: 1930, fin: null, regimes: [banque_de_france]}

  personnel_opera:
    libelle: Personnel de l'Opéra national de Paris
    periodes:
      - {debut: 1930, fin: null, regimes: [opera_de_paris], entres_avant: 2023}
      - {debut: 2023, fin: null, regimes: [regime_general, agirc_arrco],
         entres_depuis: 2023}
    note: >-
      Régime fermé aux artistes et personnels RECRUTÉS depuis le
      1er septembre 2023 ; celui qui était déjà là le garde.

  personnel_comedie_francaise:
    libelle: Personnel de la Comédie-Française
    periodes:
      - {debut: 1930, fin: null, regimes: [comedie_francaise], entres_avant: 2023}
      - {debut: 2023, fin: null, regimes: [regime_general, agirc_arrco],
         entres_depuis: 2023}
    note: >-
      Régime fermé aux personnels RECRUTÉS depuis le 1er septembre 2023 ;
      celui qui était déjà là le garde.

  agent_seita:
    libelle: Agent du personnel de la SEITA
    periodes:
      - {debut: 1935, fin: null, regimes: [seita], entres_avant: 1982}
      - {debut: 1982, fin: 2018, regimes: [regime_general, arrco, arrco_tranche_2],
         entres_depuis: 1982}
      - {debut: 2019, fin: null, regimes: [regime_general, agirc_arrco],
         entres_depuis: 1982}
    note: >-
      Régime fermé aux recrutements en 1981 ; les agents recrutés après
      relèvent du droit commun des salariés du privé. Avant 1935, la fiche
      du régime ne porte aucune période : les carrières antérieures ne sont
      pas simulables sous ce statut.

  agent_port_strasbourg:
    libelle: Agent du Port autonome de Strasbourg
    periodes:
      - {debut: 1930, fin: null, regimes: [port_strasbourg], entres_avant: 2023}
      - {debut: 2023, fin: null, regimes: [regime_general, agirc_arrco],
         entres_depuis: 2023}
    note: >-
      Régime fermé aux RECRUTEMENTS depuis le 1er septembre 2023 ; celui qui
      était déjà là le garde.

  agent_chemins_fer_secondaires:
    libelle: Agent des chemins de fer secondaires d'intérêt général
    periodes:
      - {debut: 1930, fin: 1954, regimes: [chemins_fer_secondaires]}
      - {debut: 1955, fin: 1960, regimes: [regime_general]}
      - {debut: 1961, fin: 2018, regimes: [regime_general, arrco, arrco_tranche_2]}
      - {debut: 2019, fin: null, regimes: [regime_general, agirc_arrco]}
    note: >-
      Régime fermé en 1954. La complémentaire ne prend le relais qu'en 1961,
      à la création de l'Arrco : les six années intermédiaires ne relèvent que
      du régime général, comme pour tout salarié du privé de cette période.

  artiste_auteur:
    libelle: Artiste-auteur (écrivain, illustrateur, photographe…)
    periodes:
      - {debut: 1977, fin: null, regimes: [regime_general, ircec_raap]}
    note: >-
      Les artistes-auteurs relèvent du RÉGIME GÉNÉRAL pour leur retraite de
      base — la loi du 31 décembre 1975 les y rattache — et du RAAP pour leur
      complémentaire. Le statut n'est donc PAS marqué `sans_employeur` : le
      diffuseur verse une contribution à côté du précompte de l'auteur, comme
      un employeur. Avant 1977, aucune affiliation obligatoire.

  chirurgien_dentiste_ou_sage_femme:
    libelle: Chirurgien-dentiste ou sage-femme libéral
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: null, regimes: [cnavpl, carcdsf_complementaire]}
    note: >-
      Le complémentaire porte l'essentiel de la pension : la caisse écrit qu'il
      en représente environ la moitié pour un dentiste, le quart pour une
      sage-femme. Sa cotisation est la seule du catalogue à mêler un FORFAIT et
      un taux — 3 210,60 € plus 11,35 % en 2026.

  medecin_liberal:
    libelle: Médecin libéral
    sans_employeur: true
    periodes:
      - {debut: 1949, fin: 1971, regimes: [cnavpl, carmf_complementaire]}
      - {debut: 1972, fin: null, regimes: [cnavpl, carmf_complementaire, asv_conventionnes]}
    note: >-
      Le statut `profession_liberale` route vers le seul régime de base et
      sous-estime donc lourdement toute carrière libérale : la complémentaire
      d'un médecin pèse plus que sa base. Celui-ci ajoute la CARMF. Les neuf
      autres sections de la CNAVPL restent sans complémentaire, faute de
      barème publié — voir docs/limites.md. Depuis le décret n° 72-968 du 27
      octobre 1972, le médecin conventionné cotise aussi à l'ASV, dont les
      caisses d'assurance maladie paient les deux tiers : la fiche
      `asv_conventionnes` porte sa part seule, le statut étant sans employeur.

  personnel_navigant:
    libelle: Personnel navigant professionnel de l'aéronautique civile
    periodes:
      - {debut: 1945, fin: 1946, regimes: [regime_general]}
      - {debut: 1947, fin: 1962, regimes: [regime_general, agirc]}
      - {debut: 1963, fin: 2018, regimes: [regime_general, arrco, agirc, crpnpac, crpnpac_tranche_2]}
      - {debut: 2019, fin: null, regimes: [regime_general, agirc_arrco, crpnpac, crpnpac_tranche_2]}
    note: >-
      Le seul statut du catalogue à cotiser à QUATRE régimes simultanément. La
      CRPN n'est pas un régime de base : c'est un régime spécial légalement
      obligatoire qui s'ajoute au régime général et à la complémentaire de
      droit commun. Le navigant est cadre, d'où l'Agirc dès 1947. Ses deux
      tranches de salaire sont deux fiches, pour la raison qu'elles portent.

  ministre_du_culte:
    libelle: Ministre du culte ou membre d'une congrégation religieuse
    periodes:
      - {debut: 1979, fin: null, regimes: [cavimac]}
    note: >-
      Avant 1979, aucun régime obligatoire : la loi du 2 janvier 1978 crée
      celui-ci et ses cotisations commencent au 1er janvier 1979. Les années
      antérieures ne portent donc aucun droit, ce qui est le droit lui-même et
      non une lacune du modèle. Le statut n'est PAS marqué `sans_employeur` :
      la congrégation joue le rôle d'employeur et l'article R. 382-90 met à sa
      charge la part patronale du régime général, que les scénarios 4 et 5
      doivent donc compter.

  sans_activite:
    libelle: Sans activité professionnelle
    periodes:
      - {debut: 1930, fin: null, regimes: []}
    note: >-
      Aucune cotisation, donc aucun droit dans un système notionnel pur.
      Le système actuel accorde au contraire des trimestres au titre de
      l'AVPF, du chômage ou de la maladie : c'est l'un des écarts les plus
      importants entre les scénarios.

# Régimes du catalogue que AUCUNE affiliation ne route, et pourquoi
# -----------------------------------------------------------------
# Le catalogue et le routage sont deux fichiers distincts, et rien ne les
# reliait : cinq fiches n'étaient atteignables par aucun statut, donc jamais
# calculées, sans que rien ne le dise. Trois ont reçu leur statut ; les deux
# qui suivent n'en recevront pas, et ce tableau porte la raison plutôt que de
# laisser le silence la porter. `tests/test_donnees.py` exige que tout régime
# du catalogue soit routé par une affiliation OU nommé ici : un sixième cas
# muet fait échouer les tests.

regimes_sans_affiliation:

  avts: >-
    Allocation sous condition de ressources, non contributive, servie aux
    salariés âgés démunis — pas un régime d'affiliation. Sa fiche porte les
    8 % des assurances sociales, qui la financent : la router à côté de
    `assurances_sociales` compterait deux fois la même cotisation. Elle reste
    au catalogue parce qu'elle date le premier mécanisme en répartition, ce
    dont le paramètre `annee_debut_repartition` se sert.
