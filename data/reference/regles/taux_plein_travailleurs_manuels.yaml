approximations:
- version: [quarante_trois_ans, quarante_deux_ans, quarante_et_un_ans]
  ecart: >-
    Les travaux de l'article 70-3 — en continu, en semi-continu, à la chaîne, au four, aux
    intempéries —, que le décret n° 76-404 définit et que la circulaire n° 21 SS précise
    métier par métier, la personne les déclare ; le modèle ne compte pas les cinq ans
    dans les quinze dernières années.
  effet: non mesuré
sources:
  lu_le: 2026-10-08
  prochaine_relecture: 2027-04-30
  a_relire:
  - >-
    Lire la loi n° 75-1279 et le décret n° 76-404 au Journal officiel, et le décret n°
    78-318 qui porte la durée à quarante et un ans, pour dater ce passage, que le modèle
    tient de la rédaction de l'article 70-2 du 16 mars 1978.
  lectures:
  - type: jorf
    reference: >-
      loi n° 75-1279 du 30 décembre 1975 (JORFTEXT000000699032) ; décret n° 76-404 du 10
      mai 1976 (JORFTEXT000000855584) : l'index n'en garde que les notices
    date: 1976-05-12
  - type: legifrance
    reference: >-
      décret n° 45-0179, article 70-2 (LEGIARTI000006760658, 1978-03-16 → 1982-07-23) :
      quarante et un ans, « Toutefois, pour les pensions prenant effet avant le 1er juillet
      1977, la durée d'assurance prévue au a est portée à quarante-trois ans » ; lu dans
      l'index LEGI le 8 octobre 2026
    date: 1978-03-16
  - type: circulaire_cnav
    reference: >-
      circulaire ministérielle n° 21 SS du 21 mai 1976 : la loi « dont la date d'effet est
      fixée au 1er juillet 1976 » ; les cinq catégories de travaux ; 43 ans du 1er juillet
      1976 au 30 juin 1977, 42 ans ensuite ; la durée totalisée au régime général et chez
      les salariés agricoles, « ni plus de 22 trimestres pour la période du 1er juillet
      1930 au 31 décembre 1935 »
    url: https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_MIN_21SS_21051976.aspx
    date: 1976-05-21
