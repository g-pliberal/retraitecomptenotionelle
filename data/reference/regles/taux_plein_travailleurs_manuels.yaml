  nee_de: LEGIARTI000006760658
  bornes:
    liquidation.date_effet: [1978-03-16, 1983-04-01]
  contenu:
    droit: >-
      « La pension est également calculée au taux normalement applicable à soixante-cinq
      ans au profit : a) Des travailleurs manuels salariés mentionnés au sixième alinéa
