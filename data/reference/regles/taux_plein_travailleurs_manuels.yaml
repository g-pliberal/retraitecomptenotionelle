historique:
- >-
  2026-10-08 — écrite à l'étape 17 de l'action 138, sur le point d'OpenFisca-France-Pension
  au registre (chantier 138.17) et la liste de la fiche decote_avant_1983.
effet: >-
  Le travailleur manuel parti de 1976 à 1983, entre soixante et soixante-cinq ans, avec
  quarante et un à quarante-trois ans d'assurance, assurances sociales d'avant 1945
  comprises, et cinq ans de travail pénible dans les quinze dernières années : le taux de
  soixante-cinq ans au lieu de la pension minorée de l'âge.
