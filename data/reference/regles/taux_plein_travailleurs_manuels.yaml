schema_version: 1
id: taux_plein_travailleurs_manuels
intitule: >-
  Du 1er juillet 1976 au 31 mars 1983, le travailleur manuel salarié qui réunit
  quarante-trois, puis quarante-deux, puis quarante et un ans d'assurance au régime
  général ou dans ce régime et celui des salariés agricoles, et a exercé pendant cinq ans
  au moins au cours des quinze années qui précèdent sa demande un travail en continu, en
  semi-continu, à la chaîne, au four ou exposé aux intempéries, a le taux de soixante-cinq
  ans dès soixante ans ; la règle de 1983, qui donne le taux plein à cent cinquante
  trimestres, la rend sans objet.
domaine: decote_surcote
regimes: [regime_general, msa_salaries]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- le travail manuel pénible que la personne déclare (exposition travail_manuel)
- la durée d'assurance au régime général, aux assurances sociales d'avant 1945 et chez les
  salariés agricoles
- l'âge à la date d'effet de la pension
- liquidation.date_effet
ecrit:
- le taux de soixante-cinq ans, sans décote, que « liquider chaque régime » applique, et
  que les complémentaires suivent
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/categories.py, `taux_plein_par_categorie`, et son jumeau) lit :
# `existe` ; `regimes` ; `trimestres`, la durée à réunir dans les
# `regimes_de_la_duree` ; `travaux`, le travail manuel déclaré qui la satisfait ;
# `age`, l'âge dès lequel le taux se sert.
versions:
- id: avant_la_loi_du_30_decembre_1975
  statut: supposee
  hypothese: >-
    la loi n° 75-1279 crée le droit, dont « la date d'effet est fixée au 1er juillet
    1976 » (circulaire ministérielle n° 21 SS du 21 mai 1976) : rien avant
  fiabilite: haute
  bornes:
    liquidation.date_effet: [null, 1976-07-01]
  contenu:
    droit: aucun taux propre aux travailleurs manuels
    parametres:
      existe: false
  exemples: aucun trouvé
- id: quarante_trois_ans
