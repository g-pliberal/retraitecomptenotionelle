schema_version: 1
id: decote_fonction_publique
intitule: >-
  Décote propre de la pension civile : coefficient et âge d'annulation lus à l'année
  d'ouverture du droit, montée en charge 2006-2020, limite d'âge du grade ; la durée
  d'assurance qu'elle lit se compte au jour, sans arrondi, ses trimestres manquants
  arrondis à l'entier supérieur (fiche decompte_des_services_fonction_publique).
etat: conforme
effet: Fonctionnaires liquidant avant le taux plein.
sources:
  lu_le: 2026-10-08
  prochaine_relecture: 2027-06-30
  lectures:
  - type: legifrance
    reference: >-
      L. 14, I, rédaction du 31 décembre 2023 (LEGIARTI000048844775), et l'article 20
      du décret n° 2003-1306 (LEGIARTI000054590030), lus dans l'index LEGI : « Le
      nombre de trimestres correspondant est arrondi à l'entier supérieur » ; Conseil
      d'État, 2 février 2010, n° 311495, qui écarte la décote de la pension que
      l'arrondi de R. 26 porte au pourcentage maximum
    date: 2026-08-01
  - type: service_public
    reference: fiche F20349
    date: 2026-01-01
  - type: autre
    reference: >-
      OpenFisca-France-Pension, témoins de la pension civile (tests/test_oracle.py)
    date: 2026-09-13
  - type: autre
    reference: >-
      Service des retraites de l'État, page « La décote », exemple de Brigitte S.
    date: 2026-09-24
    url: >-
      https://retraitesdeletat.gouv.fr/actif/le-calcul-de-ma-retraite/la-decote
textes_a_rattacher:
- reference: L. 14 I et II CPCMR
- reference: loi n° 2003-775, article 66 III
exemples:
- sp_f20349_decote_fonction_publique
- sre_decote_brigitte
reformes:
- reforme_2023
code:
  interrupteurs:
    bareme_decote: fonction_publique
  moteur: >-
    `bareme_decote: fonction_publique` applique le barème de l'article L. 14 du code des
    pensions : le coefficient ET l'âge d'annulation y montent en charge de 2006 à 2020,
    ce dernier étant la LIMITE D'ÂGE du grade diminuée d'un nombre décroissant de trimestres
    (`legislation/decote_fonction_publique.csv`).
