schema_version: 1
id: rachats_et_versements
intitule: >-
  Rachats de trimestres (années d'études, années incomplètes), versements pour la
  retraite, surcotisation du temps partiel de la fonction publique.
regimes: [fonction_publique_etat, msa_salaries, regime_general, rsi]
etat: pas_encore_modelisee
effet: Non saisissables dans le simulateur.
sources:
  lu_le: 2026-09-24
  prochaine_relecture: 2027-09-30
  lectures:
  - type: jorf
    reference: >-
      décret n° 2025-1340, article 1er (barème du rachat d'études de 20 à 66 ans,
      en vigueur au 1er janvier 2026)
    date: 2026-09-24
  - type: autre
    reference: >-
      ENSAP, calculette du rachat d'études, qui applique encore en septembre 2026
      le barème du décret n° 2003-1310 abrogé
    date: 2026-09-24
  - type: circulaire_cnav
    reference: >-
      circulaire 2026-04 du 5 février 2026 : le versement pour la retraite du régime
      général et des artisans et commerçants (L. 351-14-1), et les rachats qui lui sont
      alignés depuis 2010, au barème de l'arrêté du 21 octobre 2012, inchangé de 2013
      à 2026 ; trois tranches de revenu (75 % et 100 % du plafond, 36 045 et 48 060 €
      en 2026), deux options (taux seul, taux et durée), de 20 à 66 ans ; de 1 055 €
      le trimestre à 20 ans, tranche basse, taux et durée, à 6 684 € à 62 ans, tranche
      haute ; au-delà de 67 ans, le montant de 62 ans diminué de 2,5 % par année
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2026_04_05022026.pdf
    date: 2026-10-14
  - type: autre
    reference: >-
      Cnav, « Les rachats de trimestres » : douze trimestres au plus, études au tarif
      réduit jusqu'à la fin de l'année des quarante ans, stages jusqu'à trente ans,
      quatre ans pour payer ; son simulateur, dans l'espace personnel, « en cours de
      mise à jour »
    url: https://www.lassuranceretraite.fr/portail-info/home/actif/ma-carriere/rachat-trimestres-retraite.html
    date: 2026-10-14
textes_a_rattacher:
- reference: L. 351-14-1 CSS
- reference: >-
    L. 9 bis et D. 7-1 à D. 7-3 CPCMR (décret n° 2025-1340 du 26 décembre 2025)
- id: JORFTEXT000050935436
  reference: >-
    décret n° 2024-1282 du 31 décembre 2024 portant application de l'article 94 de la
    loi n° 2023-1250 du 26 décembre 2023 : sa notice fixe, « comme au régime général,
    jusqu'au 31 décembre de l'année civile du quarantième anniversaire l'âge jusqu'auquel
    les fonctionnaires, magistrats, militaires peuvent racheter à tarif réduit les années
    d'études » ; article 4 : l'abattement forfaitaire de l'article 2 bis du décret du 26
    décembre 2003 aux demandes présentées depuis le 1er janvier 2024 par qui avait moins de
    quarante ans au 31 décembre 2023
  publie_le: 2025-01-01
  lu_le: 2026-10-20
  change: >-
    l'âge jusqu'auquel le fonctionnaire, le magistrat et le militaire rachètent leurs
    années d'études au tarif réduit
- reference: L. 11 bis CPCMR
