code:
  interrupteurs:
    abattement_points: ircantec
  moteur: >-
    `abattement_points: ircantec` applique l'escalier de l'article 16 de l'arrêté du 30
    décembre 1970, qui est le MÊME que celui de l'Agirc-Arrco, aux mêmes marches, et se lit
    de la même façon : `coefficient_pour_age` le lit aux trimestres qui séparent la
    liquidation de l'âge du taux plein de la période (`age_taux_plein`, ou
    `age_taux_plein_par_generation` depuis 2011), arrondis au supérieur, au plancher de
    0,43 dix ans avant ; la seconde table, sur la durée manquante, quand la période porte
    `duree_requise_par_generation`, dont la durée exonère aussi.
  python: >-
    droit/liquider.py : liquider_chaque_regime, abattement_points, coefficient_pour_age,
    _coefficient_anticipation, _PALIERS_ANTICIPATION,
    _COEFFICIENT_ANTICIPATION_PLANCHER ; droit/ouvrir.py : age_taux_plein ;
    droit/invalidite.py : taux_plein_de_l_inapte
  javascript: >-
    moteur/js/droit/liquider.js : liquiderChaqueRegime, abattementPoints,
    coefficientPourAge, coefficientAnticipation, PALIERS_ANTICIPATION,
    COEFFICIENT_ANTICIPATION_PLANCHER ; moteur/js/droit/ouvrir.js : ageTauxPlein ;
    moteur/js/droit/invalidite.js : tauxPleinDeLInapte
  parametres: >-
    contenu.parametres de chaque version : age_taux_plein, age_taux_plein_par_generation,
    anticipation_maximale_annees, coefficient_plancher, coefficients_par_annee_d_age,
    paliers_d_anticipation, duree_requise_par_generation,
    duree_de_la_seconde_table_trimestres ; regimes/igrante.yaml, regimes/ipacte.yaml,
    regimes/ircantec.yaml : age_ouverture, age_taux_plein, age_taux_plein_par_generation,
    duree_requise_trimestres, duree_requise_par_generation
  tests:
  - >-
    tests/test_ircantec.py, qui confronte chaque version aux périodes des trois régimes et
    aux constantes du portage, et tient les écarts déclarés
  - tests/test_ircantec_minoration.py
