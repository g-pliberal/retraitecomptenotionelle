      duree_requise_par_generation: duree_requise_par_generation
      duree_de_la_seconde_table_trimestres: null
    droit: >-
      « En cas de liquidation de la retraite entre l'âge prévu au 1° de l'article L. 351-8
      susmentionné diminué de dix ans et 62 ans, le coefficient ci-dessus est majoré de
      0,0175 par trimestre écoulé […] ; En cas de liquidation de la retraite entre l'âge de
      62 ans et 64 ans, le coefficient applicable à 62 ans, soit 0,78, est majoré de 0,0125
      par trimestre écoulé entre 62 ans et l'âge atteint lors de la liquidation de la
      retraite. En cas de liquidation de la retraite entre l'âge de 64 ans et l'âge prévu
      au 1° de l'article L. 351-8 susvisé, le coefficient applicable à 64 ans, soit 0,88, est
      majoré de 0,01 par trimestre écoulé » : des âges fixes, et non plus l'âge légal, que
      la loi du 14 avril 2023 porte à soixante-quatre ans. Pour toute génération qui atteint
      après ce jour l'âge du 1° de L. 351-8, soixante-sept ans, ils tombent vingt et douze
      trimestres avant lui, où le portage rend 0,78 et 0,88. La seconde table (II) s'écrit
      désormais en clair : « le coefficient est minoré de 0,01 par trimestre manquant pour
      atteindre la durée d'assurance […]. Si le nombre de trimestres nécessaire […] est
      strictement supérieur à 12 trimestres, le coefficient est affecté d'une minoration de
      0,0125 pour chaque trimestre manquant au-delà des 12 trimestres », sans plancher
      propre ; c'est l'escalier du portage jusqu'à vingt trimestres manquants, et au-delà,
      le coefficient tombe sous 0,78, que la table des âges donne au moins à l'âge légal,
      et que le II garantit
    conditions: >-
      un nouveau 1° g) : l'inaptitude reconnue (L. 351-7) ou l'incapacité permanente
      (L. 351-1-5) au taux plein du 2° de L. 351-8, exonérées avant l'âge légal ; au 2°, le
      taux plein « d'un régime de retraite obligatoire de base » à l'âge légal, et non plus
      du seul régime général ; les 2° b) et f) et le 3° b) abrogés. La retraite progressive
      (III) suit celle du régime de base
