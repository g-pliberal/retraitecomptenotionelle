schema_version: 1
id: coefficient_anticipation_ircantec
intitule: >-
  Coefficient d'anticipation de l'Ircantec : escalier à trois marches ancré sur
  l'âge du taux plein, plancher 0,43 à dix ans d'anticipation, et seconde table
  par la durée.
etat: conforme
effet: >-
  Toute liquidation Ircantec anticipée. Les quarante et une lignes de la table publiée
  sont rejouées par tests/test_ircantec_minoration.py et le modèle les rend toutes.
  La table de la caisse ajoute ce que le texte ne disait pas : les ancrages sont
  des ÂGES FIXES — 1 à 67 ans, 0,88 à 64, 0,78 à 62, 0,43 à 57 — identiques pour
  les onze générations, alors que l'âge légal passe de 62 à 64 ans sur cette plage.
  C'est l'âge du taux plein qui ancre l'escalier, jamais l'âge d'ouverture, et le
  modèle fait déjà ainsi.
sources:
  lu_le: 2026-10-13
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Les tableaux de la caisse sont toujours ceux de 2023 : leur version du 4 juillet
    2025 ne corrige qu'une coquille (« 66 ans et 3 mois » pour 0,97, où celle de
    décembre 2023 imprimait « 67 ans et 3 mois »). La caisse annonce que la durée
    d'assurance des générations 1964 et 1965, et l'âge à partir duquel la durée
    compte, changent pour les pensions prenant effet depuis le 1er septembre 2026
    (loi de financement pour 2026) : relire les tableaux quand elle les republiera.
    La seconde table de l'article, celle qui lit la DURÉE manquante, a désormais son
    exemple publié (ircantec_minoration_duree_63_ans), que le modèle rend.
  lectures:
  - type: legifrance
    reference: >-
      arrêté du 30 décembre 1970, article 16, versions successives lues dans l'index
      LEGI
    date: 2026-09-18
  - type: autre
    reference: >-
      Ircantec, base documentaire, annexe « Retraite à taux réduit — taux de minoration
      », tableaux 2023, onze générations de 1955 à 1968 et au-delà
    url: https://baseircantec.retraites.fr/
    date: 2026-09-22
  - type: autre
    reference: >-
      Ircantec, « Les conditions de départ à la retraite », Je pars à taux réduit : deux
      exemples, 76,25 % à 61 ans et 9 mois par l'âge seul, avant l'âge légal, et
      85,50 % à 63 ans avec 157 trimestres pour 171, par la durée, « le coefficient le
      plus avantageux » contre 83 % par l'âge
    url: https://www.ircantec.retraites.fr/actif/preparer-ma-retraite/conditions-depart-retraite
    date: 2026-10-13
  - type: autre
    reference: >-
      Ircantec, base documentaire, « Tableaux permettant le calcul du taux de minoration
      dans le cadre de la retraite à taux réduit », version du 4 juillet 2025 (dossier
      2025-07), comparée ligne à ligne à celle de décembre 2023 (dossier 2024-01)
    url: https://baseircantec.retraites.fr/sites/default/files/2025-07/Tableaux%20tx%20de%20mino%20retraite%20%C3%A0%20tx%20r%C3%A9duit%202023%20externe.pdf
    date: 2026-10-13
exemples:
- ircantec_minoration_duree_63_ans
textes_a_rattacher:
- reference: >-
    article 16 de l'arrêté du 30 décembre 1970 (LEGIARTI000006381606, LEGIARTI000024266924)
- reference: L. 351-8 1° CSS
code:
  interrupteurs:
    abattement_points: ircantec
  moteur: >-
    `abattement_points: ircantec` applique le barème de l'article 16 de l'arrêté du 30
    décembre 1970, qui est le MÊME escalier que celui de l'Agirc-Arrco, aux mêmes marches,
    et se lit de la même façon.
