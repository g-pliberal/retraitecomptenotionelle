- id: ages_de_2010
  statut: lue
  textes:
  - {id: LEGIARTI000024266924, article: "arrêté du 30 décembre 1970, article 16, rédaction du 1er juillet 2011", en_vigueur: 2011-07-01}
  nee_de: LEGIARTI000024266924
  bornes:
    liquidation.date_effet: [2011-07-01, 2018-03-31]
  contenu:
    parametres:
      age_taux_plein_par_generation: age_annulation_decote
      anticipation_maximale_annees: 10
      coefficient_plancher: 0.43
      coefficients_par_annee_d_age: null
      paliers_d_anticipation: [[12, 0.01], [20, 0.0125], [40, 0.0175]]
      duree_requise_par_generation: duree_requise_par_generation
      duree_de_la_seconde_table_trimestres: null
    droit: >-
      « L'allocation de retraite est normalement liquidée à l'âge prévu au 1° de l'article
      L. 351-8 du code de la sécurité sociale. Cependant, elle peut faire l'objet d'une
      anticipation, au plus tôt dix ans avant que l'assuré ait atteint cet âge » ; le
      coefficient 0,43 dix ans avant, « majoré de 0,0175 par trimestre écoulé » jusqu'à
      « l'âge prévu à l'article L. 161-17-2 », 0,78 à cet âge, majoré de 0,012 5 par
      trimestre jusqu'à ce même âge « augmenté de deux années », 0,88 là, majoré de 0,01
      jusqu'à l'âge du 1° de L. 351-8. L'âge légal y précède de cinq ans l'âge du 1° de
      L. 351-8 pour chaque génération de la loi du 9 novembre 2010 : le portage, qui ancre
      ses paliers sur l'âge du taux plein, rend les mêmes coefficients. La seconde table
      (paragraphe 2) vaut de l'âge légal à l'âge du 1° de L. 351-8, et y assimile l'âge où la
      durée « déterminée au deuxième alinéa de l'article L. 351-1 » aurait été accomplie
    conditions: >-
      les exonérations regroupées en trois : « 1° Aux personnes admises à faire liquider
      leur pension de vieillesse avant l'âge légal » — carrière longue, handicap, cessation
      anticipée d'activité, incapacité permanente (L. 351-1-4), amiante (article 41 de la
      loi n° 98-1194) ; « 2° Aux personnes qui bénéficient d'une pension de vieillesse à taux
