effet: >-
  Toute liquidation anticipée de l'Ircantec, et des points de l'IPACTE et de l'IGRANTE
  qu'elle a repris. Les quarante et une lignes de la table publiée en 2023 sont rejouées
  par tests/test_ircantec_minoration.py, et le modèle les rend toutes : les ancrages sont
  des âges fixes, 1 à soixante-sept ans, 0,88 à soixante-quatre, 0,78 à soixante-deux,
  0,43 à cinquante-sept, ce que la rédaction du 14 septembre 2023 écrit ; le modèle ancre
  l'escalier sur l'âge du taux plein, et rend les mêmes. Lue au droit le 3 novembre 2026,
  rédaction par rédaction depuis 1971 : le modèle sert l'escalier au trimestre dès 1951,
  quand la table de 1970 ne comptait que les années d'âge ; il exonère à la durée les
  points de l'IPACTE et de l'IGRANTE dès 1951, quand l'article ne le fait que depuis le
  1er avril 1983 ; il ne sert pas l'anticipation avant l'âge légal.
sources:
  lu_le: 2026-11-03
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Les tableaux de la caisse sont toujours ceux de 2023 : leur version du 4 juillet
    2025 ne corrige qu'une coquille (« 66 ans et 3 mois » pour 0,97, où celle de
    décembre 2023 imprimait « 67 ans et 3 mois »). La caisse annonce que la durée
    d'assurance des générations 1964 et 1965, et l'âge à partir duquel la durée
    compte, changent pour les pensions prenant effet depuis le 1er septembre 2026
    (loi de financement pour 2026) : relire les tableaux quand elle les republiera.
    La seconde table de l'article, celle qui lit la DURÉE manquante, a désormais son
    exemple publié (ircantec_minoration_duree_63_ans), que le modèle rend.
  - >-
    La seconde table de 1994 à 2003 (approximation de la version
    escalier_au_trimestre_1983) : la caisse lisait-elle les trente-sept ans et demi du II,
    à la lettre, ou la durée du taux plein de la génération, comme le modèle ? Chercher
    une circulaire de l'Ircantec de 1994, ou sa base documentaire.
  - >-
    Les exonérations d'après 2011 restent à confronter une à une au modèle : l'incapacité
    permanente (L. 351-1-4, puis L. 351-1-5), l'amiante, le handicapé du 1° ter, le compte
    professionnel de prévention ; le modèle en sert-il le taux plein au régime général, et
    l'Ircantec le suit-elle, par `taux_plein_de_l_inapte` ou autrement ?
  - >-
    L'IPACTE et l'IGRANTE avant 1971 : l'arrêté du 12 décembre 1951 (articles 5 et 10) et
    celui du 17 février 1960, que l'index LEGI ne porte pas, diraient leurs âges et leur
    anticipation ; la version ipacte_et_igrante les présume.
