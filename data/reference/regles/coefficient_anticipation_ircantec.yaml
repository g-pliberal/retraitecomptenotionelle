      coefficient_plancher: 0.43
      coefficients_par_annee_d_age: null
      paliers_d_anticipation: [[12, 0.01], [20, 0.0125], [40, 0.0175]]
      duree_requise_par_generation: duree_requise_par_generation
      duree_de_la_seconde_table_trimestres: 150
    droit: >-
      « A cinquante-cinq ans, les points effectivement inscrits au compte de l'intéressé
      sont affectés du coefficient 0,43 ; En cas de prise de retraite entre cinquante-cinq
      et soixante ans, le coefficient ci-dessus est majoré de 0,017 5 par trimestre écoulé
      entre l'âge de cinquante-cinq ans et l'âge atteint lors de la liquidation de la
      retraite ; En cas de prise de retraite entre soixante ans et soixante-deux ans, le
      coefficient applicable à soixante ans, soit 0,78, est majoré de 0,012 5 par trimestre
      écoulé […] ; En cas de prise de retraite entre soixante-deux ans et soixante-cinq ans,
      le coefficient applicable à soixante-deux ans, soit 0,88, est majoré de 0,01 par
      trimestre écoulé » : l'escalier que le portage lit, au trimestre entier écoulé ; et
      la seconde table de la version structure_financiere_1983
    conditions: >-
      « 1° Dans le cas d'une inaptitude au travail reconnue entre soixante et soixante-cinq
      ans par la sécurité sociale ; 2° Aux anciens déportés et internés […] ; 3° Aux anciens
      combattants et prisonniers de guerre […] ; 4° Aux mères de famille qui bénéficient
      d'une pension de vieillesse du régime général de sécurité sociale entre soixante et
      soixante-cinq ans dans les conditions prévues par l'article L. 332 du code de la
      sécurité sociale ; 5° Lorsqu'un agent bénéficiaire du régime est licencié de son
      emploi dans l'intérêt du service entre soixante-trois et soixante-cinq ans ; 6° a) et
      b) [l'ordonnance de 1982] ; c) [le taux plein du régime général] ; d) Aux personnels
      admis en cessation anticipée d'activité au titre des ordonnances n° 82-108 du
      30 janvier 1982 et n° 82-297 du 31 mars 1982 » ; le travailleur manuel et la femme de
      la loi de 1977 en sortent, que le taux plein du 6° c) couvre à soixante ans. La
      rédaction du 2 octobre 1990 n'y ajoute que la retraite progressive (§ 3)
  exemples: aucun trouvé
