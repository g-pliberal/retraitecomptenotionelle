  statut: lue
  textes:
  - {id: LEGIARTI000006368109, article: "décret n° 70-1277 du 23 décembre 1970, article 2 : l'institution « constituée, pour l'application du présent décret », le 1er janvier 1971, jour où le régime remplace l'IPACTE et l'IGRANTE", en_vigueur: 1971-01-01}
  - {id: LEGIARTI000006381606, article: "arrêté du 30 décembre 1970, article 16", en_vigueur: 1971-02-09, publie_le: 1971-02-09}
  - {id: JORFTEXT000000833718, article: "arrêté du 30 décembre 1970, qui annule et remplace les arrêtés de l'IPACTE et de l'IGRANTE (analyse du Journal officiel)", en_vigueur: 1971-02-09, publie_le: 1971-02-09}
  nee_de: LEGIARTI000006368109
  bornes:
    liquidation.date_effet: [1971-01-01, 1976-01-03]
  contenu:
    parametres:
      age_taux_plein: 65
      age_taux_plein_par_generation: null
      anticipation_maximale_annees: 10
      coefficient_plancher: 0.43
      coefficients_par_annee_d_age: [0.43, 0.50, 0.57, 0.64, 0.71, 0.78, 0.83, 0.88, 0.92, 0.96]
      paliers_d_anticipation: null
      duree_requise_par_generation: null
      duree_de_la_seconde_table_trimestres: null
    droit: >-
      « L'allocation de retraite est liquidée à l'âge de soixante-cinq ans. Cependant elle
      peut faire l'objet d'une anticipation, au plus tôt à cinquante-cinq ans. Dans ce cas,
      le total des points de retraite est affecté des coefficients de réduction ci-après :
      AGES COEFFICIENTS […] 55 ans 0,43 60 ans 0,78 56 ans 0,50 61 ans 0,83 57 ans 0,57
      62 ans 0,88 58 ans 0,64 63 ans 0,92 59 ans 0,71 64 ans 0,96 » : une ligne par année
      d'âge, que la fiche lit à l'âge révolu
    conditions: >-
      « Toutefois, ce coefficient de réduction n'est pas applicable : 1° Dans le cas d'une
      inaptitude au travail reconnue entre soixante et soixante-cinq ans par la sécurité
      sociale. 2° Aux anciens déportés et internés âgés de soixante ans au moins et
      titulaires soit de la carte de déporté ou interné de la résistance, soit de la carte
      de déporté ou interné politique. 3° Lorsqu'un agent bénéficiaire du régime est licencié
      de son emploi dans l'intérêt du service entre soixante-trois et soixante-cinq ans. »
      Aucune durée d'assurance n'exonère : le coefficient se lit à l'âge seul
