schema_version: 1
id: coefficient_anticipation_ircantec
intitule: >-
  Coefficient d'anticipation de l'Ircantec : la pension liquidée avant l'âge normal,
  soixante-cinq ans puis l'âge du 1° de L. 351-8, au plus tôt dix ans avant lui, voit
  ses points affectés d'un coefficient de réduction — une table par année d'âge
  jusqu'en 1983, un escalier à trois marches au trimestre depuis, de 0,43 à un —, sauf
  exonération ; depuis le 1er avril 1983, levé pour qui a le taux plein au régime
  général, et lu, à défaut, sur la durée manquante, sans descendre sous celui de l'âge.
domaine: decote_surcote
regimes: [igrante, ipacte, ircantec]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  l'âge de l'agent à la date d'effet de sa pension, et l'âge normal de sa génération :
  soixante-cinq ans, puis, depuis le 1er juillet 2011, l'âge du 1° de l'article L. 351-8
  du code de la sécurité sociale, et l'âge légal de L. 161-17-2
- >-
  depuis le 1er avril 1983, sa durée d'assurance tous régimes, et celle qui ouvre le taux
  plein du régime général à sa génération (L. 331, puis L. 351-1)
- >-
  ce qui l'exonère : l'inaptitude reconnue, une catégorie au taux plein du régime général,
  le départ anticipé pour carrière longue ou pour handicap, et les autres motifs que
  l'article énumère, rédaction par rédaction
- la date d'effet de la pension, qui choisit la rédaction de l'article 16
ecrit:
- >-
  le coefficient qui affecte le total des points de l'Ircantec, et ceux de l'IPACTE et de
  l'IGRANTE qu'elle a repris en 1971, de 0,43 à un, que `abattement_points` rend à
  `liquider_chaque_regime`
dates_qui_decident:
- liquidation.date_effet
versions:
- id: ipacte_et_igrante
  statut: supposee
  hypothese: >-
    les pensions de l'IPACTE (décret n° 51-1445 du 12 décembre 1951) et de l'IGRANTE
    (décret n° 59-1569 du 31 décembre 1959) qui prennent effet avant le 1er janvier 1971
    relèvent des arrêtés de ces institutions, du 12 décembre 1951 et du 17 février 1960,
    que l'arrêté du 30 décembre 1970 annule et remplace (« les dispositions des arrêtés
    du 12-12-1951, du 31-12-1959, du 17-02-1960, du 18-04-1961 sont annulées et remplacées
    par celles du présent arrêté », analyse du Journal officiel, JORFTEXT000000833718) ;
    leurs articles des âges et de l'anticipation (arrêté du 12 décembre 1951, articles 5
    et 10 ; décret n° 60-1019, « limite d'âge ») ne sont pas dans l'index LEGI : la fiche
    présume la table que l'Ircantec reprend le 1er janvier 1971, comme les fiches de
    régime de l'IPACTE et de l'IGRANTE le présument de leurs âges
  fiabilite: faible, aucun texte de l'IPACTE ni de l'IGRANTE sur l'anticipation n'a été lu
