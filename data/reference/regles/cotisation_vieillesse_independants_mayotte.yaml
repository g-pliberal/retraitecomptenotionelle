schema_version: 1
id: cotisation_vieillesse_independants_mayotte
intitule: >-
  L'artisan et le commerçant de Mayotte cotisent à la vieillesse de base de la
  caisse de sécurité sociale de Mayotte à leur taux propre depuis 2019 (décret
  n° 2011-2085, article 4-2) : 5,85 % en 2019, 0,70 point de plus chaque année,
  10,75 % en 2026, sous le plafond de la caisse de Mayotte seulement, et non sous
  celui de la Sécurité sociale ; de 2012 à 2018, aucun texte lu ne leur donne un
  taux propre.
domaine: cotisations
regimes: [cssm_mayotte]
etape: foyer_et_net
face: cotisation
etat: approchee
lit:
- le revenu de l'année et le statut independant_mayotte, sans employeur
  (legislation/affiliations.yaml, sans_employeur)
- >-
  le taux de l'année, dans regimes/taux_cotisation_annuels.csv — les mesures
  taux_plafonne_non_salarie et taux_deplafonne_non_salarie de cssm_mayotte depuis
  2019, la série alignée sur celle du régime général avant
- >-
  le plafond de cotisations de la caisse de Mayotte de l'année, dans
  legislation/mayotte_smig_et_plafond.csv (DonneesMacro.plafond_de_cotisations) :
  13 860 € en 2012, 23 208 € en 2020, 31 728 € en 2024, 36 264 € en 2026
ecrit:
- la cotisation de vieillesse de base que la fiche de paie du droit en vigueur
  prélève, et celle que le compte notionnel porte
dates_qui_decident:
- revenu.annee
versions:
- id: avant_le_taux_propre
  statut: supposee
  hypothese: >-
    de 2012 à 2018, l'indépendant de Mayotte paie, seul, la série du régime général,
    celle du salarié et de son employeur, que la caisse de Mayotte porte faute d'un
    barème lu (taux_cotisation_alignes) ; l'article 4 du décret n° 2011-2085 fixe le
    taux des cotisations de l'article 28-2 de l'ordonnance n° 96-1122 — qui comprend
    celles « des travailleurs indépendants agricoles et non agricoles » — par une
    part salariale et une part patronale, 4,00 % et 9,90 % en 2012, sans dire laquelle,
    ou leur somme, l'indépendant doit : le texte ne le tranche pas
  fiabilite: faible, aucun texte lu ne donnant le taux de l'indépendant
  textes:
  - id: LEGIARTI000025018560
    article: ordonnance n° 96-1122, article 28-2
    en_vigueur: 2012-01-01
    citation: >-
      « 1° Le produit des cotisations, assises sur les rémunérations et revenus
      d'activité définis à l'article 28-1, dans la limite du plafond prévu au deuxième
      alinéa du I de l'article 28-1, qui sont dues par tout employeur de personnes
      mentionnées à l'article 5 de l'ordonnance n° 2002-411 du 27 mars 2002 relative à
      la protection sanitaire et sociale à Mayotte et par tout assuré, ainsi que par les
      travailleurs indépendants agricoles et non agricoles. »
    lu_le: 2026-11-05
  - id: LEGIARTI000026514552
    article: décret n° 2011-2085, article 4
    en_vigueur: 2012-10-21
    citation: >-
      « Le taux des cotisations mentionnées aux articles 28-2, 28-4, 28-5 de
      l'ordonnance du 20 décembre 1996 susvisée […] sont fixés pour la période allant
      du 1er janvier 2012 au 1er janvier 2036 conformément au tableau suivant : ANNÉE
      civile COTISATION au régime d'assurance vieillesse obligatoire de base […]
      Salariale Patronale […] 2012 4,00 % 9,90 % »
    lu_le: 2026-11-05
  - id: LEGIARTI000025018554
    article: ordonnance n° 96-1122, article 28-1, I
    en_vigueur: 2012-01-01
    citation: >-
      « Il est créé un plafond de cotisations de sécurité sociale à Mayotte. Il est
      fixé à intervalles qui ne peuvent être inférieurs au semestre ni supérieurs à
      l'année, dans des conditions prévues par décret. Son montant, calculé selon des
      règles prévues par décret, est arrêté par le ministre chargé de la sécurité
      sociale. » ; les mêmes phrases dans les rédactions du 1er janvier 2015
      (LEGIARTI000025023101), du 16 octobre 2015 (LEGIARTI000031324363) et du
      28 février 2025 (LEGIARTI000051284545)
    lu_le: 2026-11-05
  bornes:
    revenu.annee: [null, 2019-01-01]
  contenu:
    droit: >-
      la série du régime général, faute d'un taux propre lu : 15,45 % sous le plafond
      de la caisse de Mayotte (20 328 € en 2018), que l'article 28-2 désigne, et 2,30 %
      sur la totalité en 2018
- id: taux_de_l_article_4_2
  statut: lue
  textes:
  - id: LEGIARTI000038680068
    article: décret n° 2011-2085, article 4-2, I
    en_vigueur: 2019-06-25
    citation: >-
      « Conformément aux dispositions de l'article 2 du décret n° 2019-632 du 24 juin
      2019, ces dispositions s'appliquent aux cotisations de sécurité sociale dues au
      titre des périodes courant à compter du 1er janvier 2019. I.-La cotisation
      annuelle d'assurance vieillesse de base due par les travailleurs indépendants,
      mentionnée au 1° du I de l'article 28-2 de l'ordonnance du 20 décembre 1996
      susvisée, est assise sur le revenu d'activité, tel que défini au II de l'article
      28-1 de la même ordonnance, dans la limite du plafond prévu au I de l'article
      28-1 de l'ordonnance du 20 décembre 1996 susvisée. […] Le taux de cette
      cotisation est fixé, pour chaque année civile de 2019 à 2036, conformément au
      tableau suivant : Année Cotisation au régime d'assurance vieillesse obligatoire
      de base 2019 5,85 % 2020 6,55 % 2021 7,25 % 2022 7,95 % 2023 8,65 % 2024 9,35 %
      2025 10,05 % 2026 10,75 % 2027 11,45 % 2028 12,15 % 2029 12,85 % 2030 13,55 %
      2031 14,25 % 2032 14,95 % 2033 15,65 % 2034 16,35 % 2035 17,05 % 2036 17,75 % »
    lu_le: 2026-11-05
  - id: LEGIARTI000053297541
    article: décret n° 2011-2085, article 4-2, I
    en_vigueur: 2026-01-01
    citation: >-
      le même I, la même assiette « dans la limite du plafond » et le même tableau, de
      « 2019 5,85 % » à « 2036 17,75 % » ; la rédaction n'ajoute que la condition de
      quatre-vingt-dix jours d'affiliation de l'assiette minimale (fiche
      assiette_minimale_independants)
    lu_le: 2026-11-05
  - id: LEGIARTI000031324363
    article: ordonnance n° 96-1122, article 28-1, I
    en_vigueur: 2015-10-16
    citation: >-
      « Il est créé un plafond de cotisations de sécurité sociale à Mayotte. […] Son
      montant, calculé selon des règles prévues par décret, est arrêté par le ministre
      chargé de la sécurité sociale. » ; la même phrase dans la rédaction du
      28 février 2025 (LEGIARTI000051284545) : le plafond du I de l'article 28-1 est
      celui de la caisse de Mayotte, et non celui de la Sécurité sociale
    lu_le: 2026-11-05
  bornes:
    revenu.annee: [2019-01-01, null]
  contenu:
    droit: >-
      sous le plafond de la caisse de Mayotte (21 768 € en 2019, 23 208 € en 2020,
      31 728 € en 2024, 36 264 € en 2026), 5,85 % en 2019, 6,55 % en 2020, 7,25 % en 2021, 7,95 % en 2022,
      8,65 % en 2023, 9,35 % en 2024, 10,05 % en 2025, 10,75 % en 2026 ; rien sur la
      totalité du revenu
approximations:
- version: avant_le_taux_propre
  ecart: >-
    De 2012 à 2018, l'indépendant de Mayotte paie au modèle la série du régime
    général, 15,45 % sous le plafond et 2,30 % sur la totalité en 2018, quand
    l'article 4 du décret n° 2011-2085 fixe à la vieillesse de base de Mayotte une part
    salariale de 4,00 % à 4,66 % et une part patronale de 9,90 %, sans dire ce que
    doit l'indépendant ; l'article 28-2 de l'ordonnance n° 96-1122 n'appelle aucune
    cotisation sur la totalité du revenu.
  effet: >-
    le compte notionnel de l'indépendant de Mayotte, de 2012 à 2018 ; ni ses trimestres,
    validés sur le revenu, ni sa pension de base, que le taux ne change pas
- version: taux_de_l_article_4_2
  ecart: >-
    La série s'arrête à l'année en cours, comme celle du régime général : de 2027 à
    2036, le modèle garde 10,75 %, quand le tableau monte de 0,70 point par an jusqu'à
    17,75 %.
  effet: nul sur toute année passée
sources:
  lu_le: 2026-11-05
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Ce que doit l'indépendant de Mayotte de 2012 à 2018 : une circulaire de la caisse
    de sécurité sociale de Mayotte, ou un barème de la Cnav de ces années, le dirait.
  lectures:
  - type: legifrance
    reference: >-
      Décret n° 2011-2085 du 30 décembre 2011, article 4-2, LEGIARTI000038680068
      (2019) et LEGIARTI000053297541 (2026) ; article 4, LEGIARTI000025097520 (2012),
      LEGIARTI000026514552 (2012) et LEGIARTI000053469930 (2026), qui ne nomment pas
      les travailleurs indépendants ; ordonnance n° 96-1122, article 28-2,
      LEGIARTI000025018560 (2012) et LEGIARTI000046455192 (2024), « dans la limite du
      plafond » dans les deux ; lus dans l'index LEGI du dépôt à jour du 4 novembre
      2026
    date: 2026-11-05
code:
  python: >-
    donnees/regimes.py : PeriodeRegime.taux_du_cotisant, charger_taux_annuels ;
    donnees/macro.py : DonneesMacro.plafond_de_cotisations ; moteur/compte.py :
    ConstructeurCompte._bornes_proratisees ; remuneration.py : bloc_droit_en_vigueur
  javascript: >-
    moteur/js/regimes.js : PeriodeRegime.tauxDuCotisant ; moteur/js/macro.js :
    DonneesMacro.plafondDeCotisations ; moteur/js/compte.js :
    ConstructeurCompte._bornesProratisees ; moteur/js/remuneration.js :
    blocDroitEnVigueur
  parametres: >-
    regimes/taux_cotisation_annuels.csv : cssm_mayotte, taux_plafonne_non_salarie,
    taux_deplafonne_non_salarie
  tests: tests/test_mayotte.py
  moteur: >-
    regimes/taux_cotisation_annuels.csv porte les mesures taux_plafonne_non_salarie et
    taux_deplafonne_non_salarie de cssm_mayotte, certifiées sur l'article 4-2 par
    scripts/fetch/dila_legi_taux_mayotte.py et scripts/verifier_donnees.py
    (taux_cotisation_mayotte) ; la période de la caisse les sert à l'assuré sans
    employeur, la série alignée au salarié. L'assuré sans employeur de la caisse de
    Mayotte cotise sous le plafond de celle-ci (mayotte_smig_et_plafond.csv, relu par
    scripts/fetch/cnav_mayotte.py au barème « Salaire plafond - Mayotte » de la Cnav).
historique:
- >-
  2026-11-05 — action 177 : depuis 2019, la fiche de paie et le compte prêtaient à
  l'indépendant de Mayotte la série du régime général, celle du salarié et de son
  employeur (15,45 % et 2,30 % en 2019) ; il prend le taux de l'article 4-2, que
  l'étape 8 avait trouvé sans l'écrire.
- >-
  2026-11-05 — action 177, relecture R-D : la fiche de paie et le compte bornaient la
  cotisation au plafond de la Sécurité sociale, quand l'article 28-2 et l'article 4-2
  la bornent au plafond « créé à Mayotte » (article 28-1, I) : 30 000 € en 2020
  donnaient 1 965 € au lieu de 23 208 × 6,55 % = 1 520,12 €. Les deux moteurs prennent
  le plafond de la caisse pour l'assuré sans employeur, depuis 2012.
effet: >-
  L'artisane de Mayotte à 10 000 € par an cotise 585 € en 2019, au lieu de 1 775 €,
  et 935 € en 2024 ; à 30 000 € en 2020, 1 520,12 € au lieu de 1 965 €. Son compte
  notionnel baisse d'autant, sa pension de base ne bouge pas. Le témoin né en 1965
  reçoit 19 353,01 € de 2019 à 2026 au lieu de 29 034,54 €. Aucune pension du
  scénario 1 ne bouge.
