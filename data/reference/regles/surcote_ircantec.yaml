code:
  interrupteurs:
    surcote_points: ircantec
  moteur: >-
    `surcote_points: ircantec` applique le IV de l'article 16 de l'arrêté du 30 décembre
    1970, entré en vigueur le 1er janvier 2010 : deux taux et deux bornes d'âge — 0,75
    % par trimestre ENTIER écoulé entre l'âge du taux plein et la liquidation (son 1°),
    0,625 % par trimestre COTISÉ au-delà de la durée requise entre l'âge légal et l'âge
    du taux plein (son 2°), sans qu'une même période puisse être comptée deux fois. La
    fenêtre du 2° se compte au mois, et celle que l'âge du taux plein ferme garde son
    trimestre entamé (`liquider._fenetre_ircantec`). La période de l'Ircantec porte
    `surcote_points` depuis 2010.
  python: >-
    droit/liquider.py : liquider_chaque_regime, abattement_points, surcote_points,
    surcote_ircantec, _fenetre_ircantec, _SURCOTE_IRCANTEC_AGE,
    _SURCOTE_IRCANTEC_DUREE ; droit/ouvrir.py : age_taux_plein, age_ouverture_commun
  javascript: >-
    moteur/js/droit/liquider.js : liquiderChaqueRegime, abattementPoints, surcotePoints,
    surcoteIrcantec, fenetreIrcantec, SURCOTE_IRCANTEC_AGE, SURCOTE_IRCANTEC_DUREE ;
    moteur/js/droit/ouvrir.js : ageTauxPlein, ageOuvertureCommun
  parametres: >-
    contenu.parametres de chaque version : surcote_points, age_taux_plein,
    age_taux_plein_par_generation, age_ouverture, age_ouverture_par_generation,
    duree_requise_par_generation, majoration_par_trimestre_ecoule,
    majoration_par_trimestre_cotise, trimestre_en_jours ; regimes/ircantec.yaml :
    age_taux_plein, age_ouverture, age_taux_plein_par_generation,
    age_ouverture_par_generation, duree_requise_par_generation, surcote_points
  tests:
  - >-
    tests/test_ircantec.py, qui confronte chaque version aux périodes de l'Ircantec et aux
