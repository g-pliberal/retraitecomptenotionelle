approximations:
- version: [precisions_de_2023]
  textes: >-
    article 16, IV, 3° (le trimestre de quatre-vingt-dix jours) et IV, 2° (une même période
    pour les deux majorations), rédaction du 14 septembre 2023
  ecart: >-
    le modèle compte au mois, trois mois pour un trimestre, quand le IV en compte
    quatre-vingt-dix jours ; et il ne retire pas du 1° les mois du trimestre à cheval sur
    l'âge du taux plein qu'il range au 2°, quand le IV interdit qu'une même période porte
    les deux majorations
  effet: >-
    un trimestre de plus ou de moins à l'un ou l'autre bout de la fenêtre, 0,75 % ou
    0,625 % des points ; non mesuré
effet: >-
  Les affiliés de l'Ircantec qui cotisent après l'âge légal au-delà de la durée requise,
  ou qui liquident après l'âge du taux plein automatique : deux ans après cet âge valent
  6 % de points en plus, cinq ans cotisés au-delà de la durée avant lui 12,5 %, et les
  deux s'additionnent. Le moteur suit le texte pour les deux taux, leurs bornes d'âge
  (soixante et soixante-cinq ans jusqu'au 30 juin 2011, puis les âges des articles
  L. 161-17-2 et L. 351-8, 1°, à la génération), la date du 1er janvier 2010 et la somme
  des deux majorations. Il compte la fenêtre du 2° d'anniversaire à anniversaire, au mois
  près, et y range le trimestre à cheval sur l'âge du taux plein, comme la rédaction du 14
  septembre 2023 (`liquider._fenetre_ircantec`) : il la comptait par année civile, à l'âge
  atteint dans l'année. Il compte en mois, non en trimestres de 90 jours, et ne retire pas
  du 1° le mois du trimestre à cheval qui suit l'âge du taux plein : l'approximation de la
  version de 2023, lue au droit le 3 novembre 2026.
