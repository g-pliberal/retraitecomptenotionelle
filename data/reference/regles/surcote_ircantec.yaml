schema_version: 1
id: surcote_ircantec
intitule: >-
  Majoration des points de l'Ircantec depuis le 1er janvier 2010 : 0,75 % par trimestre
  entier écoulé entre l'âge du taux plein automatique et l'entrée en jouissance, 0,625 %
  par trimestre cotisé après l'âge légal et au-delà de la durée requise, avant cet âge ;
  les deux s'ajoutent, sans qu'une même période les porte toutes deux.
domaine: decote_surcote
regimes: [ircantec]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  l'âge de l'agent à l'entrée en jouissance de sa pension (article 17 de l'arrêté), et
  l'âge du taux plein de sa génération : soixante-cinq ans, puis, depuis le 1er juillet
  2011, l'âge du 1° de l'article L. 351-8 du code de la sécurité sociale
- >-
  ses trimestres d'assurance cotisés entre l'âge légal — soixante ans, puis l'âge de
  L. 161-17-2 — et l'âge du taux plein, et sa durée d'assurance tous régimes au regard de
  la durée du taux plein de sa génération (L. 351-1)
- la date d'effet de la pension, qui choisit la rédaction de l'article 16
ecrit:
- >-
  la majoration du total des points de l'Ircantec, 0,75 % par trimestre entier écoulé
  après l'âge du taux plein, 0,625 % par trimestre cotisé au-delà de la durée avant lui,
  que `surcote_points` rend à `abattement_points`
