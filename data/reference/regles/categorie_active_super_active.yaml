schema_version: 1
id: categorie_active_super_active
intitule: >-
  Âge anticipé et minoré des emplois classés, par génération, décalé d'un trimestre
  par la suspension ; âge d'annulation propre ; dix-sept et vingt-sept ans de services
  classés, quinze et vingt-cinq relevés selon l'année où ils sont atteints.
regimes: [cnracl, fonction_publique_etat, fspoeie]
etat: transcrite
effet: Fonctionnaires déclarés en catégorie active ou super-active.
sources:
  lu_le: 2026-09-17
  prochaine_relecture: 2027-03-31
  a_relire:
  - Chercher un exemple publié (SRE ou CNRACL).
  lectures:
  - type: legifrance
    reference: >-
      décret n° 2026-344, JORFTEXT000054047709, article 3 D lu alinéa par alinéa
    date: 2026-05-07
  - type: legifrance
    reference: >-
      loi n° 2010-1330, article 35 (LEGIARTI000025014546), et décret n° 2011-2103,
      article 6 (LEGIARTI000025100424), lus dans l'index LEGI : la durée de services
      classés relevée selon l'« Année au cours de laquelle est atteinte la durée de
      services de quinze ans » (ou de vingt-cinq), non selon la génération, comme le
      modèle la lisait ; corrigé par `duree_services_actifs.csv`
    date: 2026-10-14
textes_a_rattacher:
- reference: L. 24 I 1° CPCMR
- reference: L. 14 bis CPCMR
- reference: décret n° 2026-344 du 7 mai 2026, article 3 D
reformes:
- reforme_2023
- lfss_2026_suspension
referents:
  trajectoire:
    equivalent: >-
      ageDuree.csv, catégories « Superactif » et « Actif fonction publique » ;
      bonifDeterministes (R/fonctionsCalculsDivers.R) pour la bonification du cinquième
    confrontation: >-
      le 5 octobre 2026, TRAJECTOiRE exécuté à part (tests/test_trajectoire.py) :
      TRAJECTOiRE ouvre encore à 50 ans le policier né en 1963 et en 1964 (51 ans et 2
      mois, 51 ans et 7 mois au dépôt), à 51 ans et 3 mois celui né en 1970 (52 ans au
      dépôt) : l'écart est le sien (registre) ; il sert la bonification du cinquième,
      que le dépôt n'a pas (138.17) ; l'âge de l'actif né en 1970 diffère de la
      suspension
  openfisca_france_pension:
    equivalent: >-
      cnracl_actif_a_la_liquidation et fonction_publique_actif_a_la_liquidation, sur
      nombre_annees_actif et duree_seuil_actif lue à date_quinze_ans_actif ; aod_a,
      la_a, trimtp_a ; super_actif_a_la_liquidation, une entrée sans formule
    confrontation: >-
      le 14 octobre 2026 (action 153, étape 2 ; tests/test_oracle_categorie_active.py)
      : l'âge anticipé, la limite d'âge et la décote des actifs concordent ; il relève
      les quinze ans de services actifs selon l'année où ils sont atteints, ce que le
      dépôt lisait par génération et a corrigé ; il ne connaît pas la super-active —
      ni ses années, ni l'âge minoré, ni la bonification du cinquième : l'écart est le
      sien (registre)
code:
  moteur: >-
    Le classement vient du statut (`Affiliations.classements_actifs`) : `derogation_active`
    retient celui que la carrière a exercé le plus longtemps (`statut_dominant`), dans un
    régime qui sert la catégorie active (`categorie_active` parmi ses
    `avantages_non_contributifs`) et que ce statut route. Elle lit à la génération, dans
    `legislation/categorie_active.csv`, l'âge anticipé ou minoré (`age_ouverture`), que la
    suspension décale d'un trimestre, et l'âge d'annulation (`age_annulation`), que
    `_age_ouverture_de_droit_commun` et `age_taux_plein` opposent. Elle suppose les
    services classés que `services_actifs_requis` exige : la durée de base
    (`services_requis_annees`), quinze ou vingt-cinq ans, relevée à dix-sept ou
    vingt-sept selon l'année où elle est atteinte
    (`legislation/duree_services_actifs.csv`) ; sans eux, l'agent reste au droit commun.
  python: >-
    carriere.py : Affiliations.classements_actifs ; droit/ouvrir.py : derogation_active,
    statut_dominant, _age_ouverture_de_droit_commun, age_taux_plein ; droit/compter.py :
    services_actifs_requis ; scenarios/actuel.py : AgesCategorieActive,
    AgesCategorieActive.derogation, DureesServicesActifs
  javascript: >-
    moteur/js/regimes.js : Affiliations.classementsActifs, AgesCategorieActive,
    AgesCategorieActive.derogation, DureesServicesActifs ; moteur/js/droit/ouvrir.js :
    derogationActive, statutDominant, ageOuvertureDeDroitCommun, ageTauxPlein ;
    moteur/js/droit/compter.js : servicesActifsRequis
  parametres: >-
    legislation/categorie_active.csv : classement, generation, age_ouverture,
    age_annulation, services_requis_annees ; legislation/duree_services_actifs.csv :
    classement, annee_atteinte, annees_requises ; regimes/cnracl.yaml,
    regimes/fonction_publique_etat.yaml, regimes/fspoeie.yaml : avantages_non_contributifs
  tests: [tests/test_simulateur.py, tests/test_fonction_publique_etat.py,
    tests/test_oracle.py, tests/test_departs.py, tests/test_primes_soumises_a_retenue.py,
    tests/test_bonifications_emplois.py, tests/test_limite_age.py, tests/test_pont.py,
    tests/test_cycle_de_vie_script.py, tests/test_versements_uniques.py,
    tests/test_oracle_categorie_active.py, tests/test_flux_fonction_publique.py,
    tests/test_trajectoire.py, tests/js/moteur.test.js, tests/temoins/simulations.json]
