schema_version: 1
id: garantie_minimale_points_agirc
intitule: >-
  De 1989 à 2018, tout cadre de l'Agirc acquiert au moins les points qu'achète une
  cotisation forfaitaire publiée chaque année pour un taux contractuel de 16 % — 144
  jusqu'en 1996, 120 ensuite —, au prorata du taux de son entreprise : celui dont la
  tranche B n'atteint pas ce forfait le paie, au prix de tout autre point, partagé comme
  la tranche B et proratisé sur la durée de présence et le temps partiel.
domaine: points
regimes: [agirc, agirc_entreprises_nouvelles]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- le revenu de chaque année de cadre, de 1989 à 2018, et l'affiliation qui ouvre l'Agirc
- la part de l'année que la ligne couvre, et la quotité de son temps partiel
- le taux contractuel de la tranche B de la période
- le salaire de référence et le taux d'appel de l'Agirc de l'année
- le forfait publié de l'année (regimes/valeurs_point.csv, mesure cotisation_garantie)
ecrit:
- les points Agirc de l'année, au moins ceux que la garantie assure
- au compte notionnel, la cotisation forfaitaire qui les achète, partagée comme la tranche B
dates_qui_decident:
- revenu.annee
versions:
