approximations:
- version: cent_quarante_quatre_points
  ecart: >-
    Les règles du temps partiel, du chômage indemnisé et de l'arrêt de travail ne sont
    lues que dans leurs rédactions de 2006 à 2018 : le modèle les applique aussi de 1989
    à 1996. Le guide réglementaire écrit la validation du chômage « À compter de 1996 »
    (titre VII.3.1.6.2), et les droits d'une période indemnisée avant 1997 se calculaient
    « selon des règles antérieures » (titre VII.3.1.6.1), que le modèle ne suit pas : il
    les calcule, comme ensuite, sur le salaire d'avant l'interruption, garantie comprise.
    L'avenant du 13 juin 1991 à l'accord de 1988, étendu en 1992, n'est pas lu ;
    l'avenant A-145 à la convention et à son annexe I, signé le même jour et soumis à la
    même enquête (avis du JORF du 20 juillet 1991), non plus.
  effet: non mesuré
- version: cent_quarante_quatre_points
  ecart: >-
    Le modèle prête à l'entreprise le taux contractuel minimal de la tranche B, et sert la
    garantie à ce taux : 72 points de 1989 à 1993, quand une entreprise à 16 % en donnait
    144. Le taux de l'entreprise, que la saisie ne porte pas, décidait aussi de ses autres
    points de tranche B ; la garantie le suit.
  effet: non mesuré
- version: cent_vingt_points
  ecart: >-
    Le temps partiel n'est connu que par la quotité d'une ligne, que seule la retraite
    progressive renseigne : un temps partiel ordinaire, que la saisie ne porte pas,
    reçoit la garantie d'une année à temps plein. Le calcul lit déjà la quotité : il
    suivra le jour où la saisie la portera.
  effet: non mesuré
- version: cent_vingt_points
  ecart: >-
    La garantie des intermittents, appelée à la journée (4,00 € par jour en 2018, sous un
    salaire charnière de 201,47 €), et leurs points de chômage, que la délibération D53
    calcule sur ceux de l'année précédente, ne sont pas modélisés : le modèle n'a pas de
    statut d'intermittent.
  effet: non mesuré
- version: cent_vingt_points
  ecart: >-
    L'allocation chômeurs âgés — une allocation de l'Unédic, créée en 1997 pour le
    chômeur qui réunit 160 trimestres et fermée aux entrées nouvelles le 1er janvier 2002
    — n'est pas distinguée des autres : le modèle, qui prête à toute entreprise le taux
    minimal, sert à tout allocataire le taux minimal assorti de la garantie, ce que la
    décision du 10 mars 1997 donnait au titulaire de l'ACA, et porte au compte ce que
    l'Unédic verse pour lui comme pour les autres — le protocole du 2 janvier 2004 range
    cette allocation parmi celles pour lesquelles elle cotise à l'Agirc (art. 1er et 3),
    quand la décision de 1997 parle de points « sans contrepartie de cotisations ».
    L'achat facultatif du reste du système de l'entreprise, pour la moitié de la
    cotisation, n'est pas modélisé.
  effet: >-
    aucun au taux minimal que le modèle prête à toute entreprise : l'allocataire de l'ACA
    et les autres y valident les mêmes points
- version: [cent_quarante_quatre_points, cent_vingt_points]
  ecart: >-
    Pour une année de chômage indemnisé, le compte notionnel porte le forfait de l'année,
    comme pour une année travaillée : l'Unédic versait à l'Agirc des « contributions
    [...] au titre de la garantie minimale de points » (protocole du 2 janvier 2004, art.
    3), dont le montant n'est pas publié. Ses cotisations de tranche B, elle les calculait
    sur 60 % de la tranche B du salaire journalier de référence (accord du 19 septembre
    1996, article unique ; protocole de 2004, art. 3), quand le compte porte la tranche B
    entière du salaire d'avant l'interruption : un écart du traitement du chômage tout
    entier, que la garantie ne fait que suivre.
  effet: non mesuré
sources:
  lu_le: 2026-10-02
  prochaine_relecture: 2027-10-01
  a_relire:
  - >-
    Lire l'avenant du 13 juin 1991 à l'accord du 8 décembre 1988, que l'arrêté du 2
    novembre 1992 étend, et l'avenant A-145 à la convention, signé le même jour : leur
    contenu est inconnu. Ni au JORF — l'index du dépôt n'a ni l'avis du 20 juillet 1991
    qui ouvrit l'enquête, ni l'arrêté du 24 février 1989 —, ni dans KALI, ni dans la
    compilation des accords de la fédération, qui commence en 1993, ni dans la banque
    d'accords du Medef, où l'accord de 1988 se lit (ses 675 documents parcourus le 2
    octobre 2026), ni sur Gallica ; Légifrance oppose un défi anti-robot. Une
    bibliothèque, ou le Bulletin officiel du ministère des affaires sociales de 1991 et
    de 1992.
  - >-
    Lire les circulaires de l'Agirc de 1989 à 1998, que la fédération ne publie pas (son
    site commence en 2003) : les forfaits de 1989 à 1995 et de 1997 et 1998 ne sont
    connus que par le barème IPP, qui cite le Barème social périodique, et les salaires de
    référence prévus de 1991 à 1995 sont une déduction — 144 fois un salaire en francs
    ronds retrouve chaque forfait au dixième de franc —, non une lecture. Les
    Actualités sociales hebdomadaires, en ligne depuis leur n° 1937 (septembre 1995),
    relaient le calcul de 1996 et les mensualités de 1999 à 2003, mais aucun forfait de
    1997 ni de 1998. Le guide réglementaire dit seulement que ce montant et sa répartition
    « sont communiqués par l'AGIRC pour un exercice n », et la banque d'accords du Medef
    n'a aucune de ces circulaires.
  - >-
    Lire la décision de la commission paritaire du 10 mars 1997 sur l'allocation
    chômeurs âgés, et l'avenant A179 du même jour à l'article 8 bis, connus par les seules
    Actualités sociales hebdomadaires (n° 2018, dont la suite est réservée aux abonnés) :
    ce qu'ils prévoient pour les chômeurs âgés qui ne pouvaient prétendre à l'ACA, et ce
    que veut dire « sans contrepartie de cotisations » quand l'Unédic cotisait pour ces
    allocataires. Quand la garantie cessa de l'accompagner n'est plus une question :
    l'allocation, fermée aux entrées nouvelles le 1er janvier 2002, la garde dans le
    guide de 2016, parmi les allocations de l'Unédic.
  lectures_divergentes:
  - >-
    L'article 8 bis de l'annexe I, lu le 2 octobre 2026 comme excluant la garantie d'une
    année de chômage indemnisé, parce que ses dispositions « concernent les points en
    tranche B » : une déduction. Le guide réglementaire valide ces périodes au taux
    minimum « assorti de la GMP (garantie minimale de points) correspondante » (titre
    VII.3.1.6.2), et le protocole du 2 janvier 2004 fait verser par l'Unédic des
    « contributions [...] au titre de la garantie minimale de points » (art. 3) : la
    lecture du guide l'emporte, le même jour, et la garantie est l'une des « Cotisations
    sur la tranche B » de l'article 6, § 2.
  - >-
    L'UGICT-CGT écrit qu'elle « signait le 8 décembre 1988 » l'accord instituant la
    garantie (2015) ; la copie que publie le Medef ne porte que quatre signatures : CNPF,
    CGPME, CFE-CGC et Union des cadres et ingénieurs de la CGT-FO.
