  contenu:
    droit: >-
      Le cadre (articles 4 et 4 bis) dont les cotisations de tranche B n'achètent pas les
      points de la garantie dans l'année — 120 pour un taux de 16 %, au prorata du taux de
      son entreprise, soit 105 au taux minimal de 14 % en 1997 et 112,5 à 15 % en 1998, puis
      120 quand le taux minimal atteint 16 %, en 1999 — paie une cotisation forfaitaire qui
      les complète : le forfait publié de l'année, à ce prorata — 120 fois le salaire de
      référence, au taux d'appel, à la mensualité arrondie près, « taux unique 16 % » —,
      moins ce que la tranche B a prélevé. Fixé avant le salaire de référence de l'année,
      comme en décembre 2003 et en décembre 2004, le forfait en achète un peu plus : les
      points s'inscrivent « sur la base du salaire de référence de l'exercice », connu au
      printemps. Elle est
      due sous le salaire charnière — 43 977,84 € par an en 2018, 3 664,82 € par mois — et
      vaut alors 872,52 € pour 2018, 72,71 € par mois appelés à 20,55 %, dont 27,60 € pour
      le salarié et 45,11 € pour l'employeur, partagés comme la tranche B (au D : 6,24 % et
      10,20 % d'un taux contractuel de 16,44 % depuis 2015). En cas de temps partiel, elle
      est proratisée au rapport des rémunérations à temps partiel et à temps plein, même
      quand le plafond de la Sécurité sociale ne l'est pas (guide réglementaire, titre
      V.2.1.2.2) ; selon la durée de présence, en trentièmes, en cas d'embauche ou de départ
      en cours d'année ; et les points avec elle. Elle vaut aussi pour une année de chômage
      indemnisé par l'Unédic : l'Agirc la valide « sur la base du taux minimum applicable à
      chaque exercice, assorti de la GMP (garantie minimale de points) correspondante »,
      quand l'entreprise cotisait au taux minimum, et sur le système de l'entreprise sinon
      (guide, titre VII.3.1.6.2), et l'Unédic lui verse, en plus de la tranche B, des
      « contributions [...] au titre de la garantie minimale de points » (protocole du 2
      janvier 2004, art. 3). L'article 8 bis, dont les dispositions « concernent les
      points en tranche B », ne l'exclut pas : la garantie est l'une des « Cotisations sur
      la tranche B » de l'article 6, § 2, son F. Le titulaire de l'allocation chômeurs
      âgés, créée en 1997 et fermée aux entrées nouvelles le 1er janvier 2002 (convention
      du 1er janvier 2001, art. 10, § 2), reçoit sans cotisation les points du taux minimal
      « assorti de la garantie », et peut acheter le reste du système de son entreprise
      pour la moitié de la cotisation (décision du 10 mars 1997, jour de l'avenant A179 à
      l'article 8 bis) ; le guide le range parmi les autres allocataires. Un arrêt de
      travail, lui, reprend les points de l'année précédente (art. 8), avec « la GMP
      (garantie minimale de points) sur la base maximale de 120 points » (guide, titre
      VII.4.3.2). Un cadre à plusieurs employeurs ne paie qu'un forfait, que chacun
      prélève au prorata de son salaire (GERESO), la garantie étant « réduite dans les
      mêmes proportions que le plafond » (guide, titre V.1.2.3.1) : le modèle, qui ne voit
      qu'une ligne par année, le retrouve.
    parametres:
      points_minimum_annuels: 120
      taux_de_la_garantie: 0.16
      cotisation_garantie: >-
        le forfait annuel publié (regimes/valeurs_point.csv), multiplié par le taux
        contractuel de la période et divisé par 16 %, sans pouvoir dépasser le forfait
      prix_du_point: le salaire de référence de l'année, au taux d'appel de l'année
  exemples: [agirc_gmp_2004, agirc_gmp_2005, agirc_gmp_2006, agirc_gmp_2007, agirc_gmp_2008,
    agirc_arrco_gmp_2017, audiens_gmp_2018, agirc_arrco_gmp_2018]
