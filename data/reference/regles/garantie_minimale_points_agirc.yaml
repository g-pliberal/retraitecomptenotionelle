    lu_le: 2026-10-02
  bornes:
    revenu.annee: [1989-01-01, 1997-01-01]
  contenu:
    droit: >-
      Le participant des articles 4 et 4 bis de la convention et de l'article 36 de son
      annexe I — le cadre, l'assimilé, et le collaborateur auquel un accord étend le
      régime —, sous le plafond ou non, acquiert chaque année un nombre de points
      proportionnel au taux contractuel
      de tranche B de son entreprise — 72 points à 8 % et 144 à 16 %, dit l'accord du 8
      décembre 1988, 108 à 12 %, ajoute Briens —, en
      cotisant au taux de l'entreprise sur une assiette minimale de tranche B : le
      « plancher fixé par l'AGIRC à 1 290 F » par mois en 1989 (L. Marrache-Jupin, 1989),
      144 points à 16 % au salaire de référence provisoire de 17,20 F. Le forfait publié est
      celui du taux de 16 % : régularisé sur le salaire de référence définitif, il achète
      exactement 144 points en 1989 (2 843 F) et en 1990 (3 068 F). De 1991 à 1995, il vaut
      144 fois un salaire de référence en francs ronds — 18,97, 19,45, 19,63, 19,31 et
      20,07 F —, au taux d'appel, quand celui fixé ensuite valut 18,80, 19,23, 19,28, 19,52
      et 20,03 F : il achète de 142,45 à 146,62 points à 16 %, sans régularisation. En
      1996, 136,31 : fixé à 144 fois le salaire de référence de 1995, que l'Agirc arrête le
      22 décembre 1995 « à titre conservatoire et précaire » pendant la négociation, en
      disant qu'il « permet de calculer » la garantie, il précède l'accord du 25 avril
      1996, qui majore de 4 % celui de 1996 (article 1er). Le modèle prête à
      l'entreprise le taux minimal de la tranche B — 8 % jusqu'en 1993 (12 % aux
      entreprises nouvelles), 10 % en 1994, 12 % en 1995, 13 % en 1996 — et sert la part
      du forfait qui lui revient, au prix de l'année : 72 points en 1989 et en 1990. Il ne
      connaît que des cadres : l'article 36, que l'accord de 1988 nomme, que le guide de
      2016 nomme encore avec l'annexe IV, et que la rédaction de 2018 de l'article 6 ne
      nomme plus, lui est étranger.
    parametres:
      points_minimum_annuels: 144
      taux_de_la_garantie: 0.16
      cotisation_garantie: >-
