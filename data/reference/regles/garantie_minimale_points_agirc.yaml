  contenu:
    droit: aucun
    raison: >-
      l'accord annule et remplace la convention de 1947, qui portait la garantie, et le
      régime unifié n'en a pas : l'accord ne la nomme nulle part, et la circulaire qui en
      détaille la réglementation dit la « Suppression de la GMP ». Les points qu'elle a
      donnés restent acquis, « inscrits jusqu'au 31 décembre 2018 »
