schema_version: 1
id: garantie_minimale_points_agirc
intitule: >-
  De 1989 à 2018, tout cadre de l'Agirc acquiert au moins les points qu'achète une
  cotisation forfaitaire publiée chaque année — 144 jusqu'en 1996, 120 ensuite : celui
  dont la tranche B n'atteint pas ce forfait le paie, au prix de tout autre point,
  partagé comme la tranche B et proratisé sur la durée de présence et le temps partiel.
domaine: points
regimes: [agirc, agirc_entreprises_nouvelles]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- le revenu de chaque année de cadre, de 1989 à 2018, et l'affiliation qui ouvre l'Agirc
- la part de l'année que la ligne couvre, et la quotité de son temps partiel
- le salaire de référence et le taux d'appel de l'Agirc de l'année
- le forfait publié de l'année (regimes/valeurs_point.csv, mesure cotisation_garantie)
ecrit:
- les points Agirc de l'année, au moins ceux que la garantie assure
- au compte notionnel, la cotisation forfaitaire qui les achète, partagée comme la tranche B
dates_qui_decident:
- revenu.annee
versions:
- id: sans_garantie_avant_1989
  statut: lue
  textes:
  - reference: >-
      convention collective nationale de retraite et de prévoyance des cadres du 14 mars
      1947, textes mis à jour au 1er janvier 2018, publiés par l'Agirc-Arrco
    article: article 6, § 2, F
    en_vigueur: 1989-01-01
    citation: « À compter du 1er janvier 1989, tout salarié […] bénéficie de la garantie minimale de points (GMP). »
    lu_le: 2026-10-02
  bornes:
    revenu.annee: [null, 1989-01-01]
  contenu:
    droit: aucun
    raison: >-
      la garantie naît au 1er janvier 1989 : avant, le cadre n'acquiert à l'Agirc que ce
      que sa tranche B achète
  exemples: aucun trouvé
- id: cent_quarante_quatre_points
  statut: lue
  textes:
  - reference: >-
      arrêté du 2 novembre 1992 portant extension et élargissement de l'avenant du 13 juin
      1991 à l'accord du 8 décembre 1988 instituant une garantie minimale de points,
      JORF du 11 novembre 1992 (JORFTEXT000000162226)
    article: visas
    en_vigueur: 1989-01-01
    citation: >-
      « Vu l'arrêté du 24 février 1989 portant extension et élargissement de l'accord du 8
      décembre 1988 instituant une garantie minimale de points ; Vu l'avenant à l'accord du
      8 décembre 1988 instituant une garantie minimale de points »
    lu_le: 2026-10-02
  - reference: >-
      convention collective nationale de retraite et de prévoyance des cadres du 14 mars
      1947, textes mis à jour au 1er janvier 2018, publiés par l'Agirc-Arrco (hors JORF et
      hors KALI)
    article: article 6, § 2, F
    en_vigueur: 1989-01-01
    citation: >-
      « À compter du 1er janvier 1989, tout salarié occupant des fonctions visées par les
      articles 4 et 4 bis bénéficie de la garantie minimale de points (GMP). »
    lu_le: 2026-10-02
  - reference: >-
      accord du 25 avril 1996 relatif au régime de retraite des cadres (Agirc), copie
      publiée par le Medef (hors JORF)
    article: article 7
    citation: >-
      « La Garantie Minimale de Points G.M.P. est ramenée, à compter du 1er janvier 1997, à
      120 points pour un taux de cotisation de 16 %. »
    lu_le: 2026-10-02
  bornes:
    revenu.annee: [1989-01-01, 1997-01-01]
  contenu:
    droit: >-
      La règle de la version suivante, à un objectif de 144 points par an au lieu de 120 :
      l'accord du 8 décembre 1988 les visait (UGICT-CGT, l'un de ses signataires), et le
      forfait publié les achète exactement en 1989 (2 843 F) et en 1990 (3 068 F), au
      salaire de référence et au taux d'appel de l'année. De 1991 à 1995, il en achète de
      142,45 à 146,62. En 1996, 136,31 seulement : fixé à 144 fois le salaire de référence
      de 1995, au taux d'appel, il précède l'accord du 25 avril 1996, qui majore de 4 %
      celui de 1996 (article 1er). Le modèle sert ce que la cotisation achète.
    parametres:
      points_minimum_annuels: 144
      cotisation_garantie: le forfait annuel publié (regimes/valeurs_point.csv)
      prix_du_point: le salaire de référence de l'année, au taux d'appel de l'année
  exemples: aucun trouvé
- id: cent_vingt_points
  statut: lue
  textes:
  - reference: >-
      convention collective nationale de retraite et de prévoyance des cadres du 14 mars
      1947, textes mis à jour au 1er janvier 2018, publiés par l'Agirc-Arrco (hors JORF et
      hors KALI)
    article: article 6, § 2, F
    en_vigueur: 1989-01-01
    citation: >-
      « À compter du 1er janvier 1989, tout salarié occupant des fonctions visées par les
      articles 4 et 4 bis bénéficie de la garantie minimale de points (GMP). En vertu de
      cette garantie, les participants, qui n'obtiennent pas au titre des dispositions
      visées au B) ci-dessus un nombre de points au moins égal à celui ci-après déterminé,
      sont assurés de se voir inscrire, en contrepartie de cotisations, un nombre minimum
      de points. L'objectif consiste à inscrire 120 points par an. Les cotisations
      correspondant à la GMP sont réparties entre l'employeur et le participant suivant
      les règles prévues au D) ci-dessus. »
    lu_le: 2026-10-02
    empreinte: sha256:38966c272726dd11abbcc5ffa18ffb67d2731caa86ca4ce3aa94d0169568ce78
  - reference: >-
      convention collective nationale du 14 mars 1947, annexe I, textes mis à jour au 1er
      janvier 2018, publiés par l'Agirc-Arrco ; la rédaction de 2006, publiée par l'Unédic,
      dit la même chose
    article: annexe I, article 8 bis, D
    citation: >-
      « Les dispositions du présent article concernent les points en tranche B » ; les
      titulaires des allocations de chômage « bénéficient, au titre des périodes pendant
      lesquelles ils reçoivent ces allocations, de points de retraite calculés à partir :
      du salaire journalier de référence […], du système contractuel de cotisations en
      vigueur dans l'entreprise […] et du salaire de référence de l'exercice auquel ces
      points correspondent »
    lu_le: 2026-10-02
  - reference: >-
      convention collective nationale du 14 mars 1947, annexe I, textes mis à jour au 1er
      janvier 2018, publiés par l'Agirc-Arrco
    article: annexe I, article 8, § 1er
    citation: >-
      pour une incapacité de travail de plus de soixante jours, des droits « sans
      contrepartie de cotisations » : « le nombre de points est calculé à partir de ceux
      inscrits au titre de l'année civile précédant celle au cours de laquelle s'est
      produit l'arrêt de travail »
    lu_le: 2026-10-02
  - reference: >-
      accord du 25 avril 1996 relatif au régime de retraite des cadres (Agirc), copie
      publiée par le Medef (hors JORF)
    article: article 7
    en_vigueur: 1997-01-01
    citation: >-
      « La Garantie Minimale de Points G.M.P. est ramenée, à compter du 1er janvier 1997, à
      120 points pour un taux de cotisation de 16 %. En 1999, elle fera l'objet d'un nouvel
      examen. »
    lu_le: 2026-10-02
  bornes:
    revenu.annee: [1997-01-01, 2019-01-01]
  contenu:
    droit: >-
      Le cadre (articles 4 et 4 bis) dont les cotisations de tranche B n'achètent pas 120
      points dans l'année paie une cotisation forfaitaire qui les complète : le forfait
      publié de l'année — 120 fois le salaire de référence, au taux d'appel, à la
      mensualité arrondie près —, moins ce que la tranche B a prélevé. Elle est
      due sous le salaire charnière — 43 977,84 € par an en 2018, 3 664,82 € par mois — et
      vaut alors 872,52 € pour 2018, 72,71 € par mois appelés à 20,55 %, dont 27,60 € pour
      le salarié et 45,11 € pour l'employeur, partagés comme la tranche B (au D : 6,24 % et
      10,20 % d'un taux contractuel de 16,44 % depuis 2015). En cas de temps partiel, et
      selon la durée de présence en cas d'embauche ou de départ en cours d'année, elle est
      proratisée, et les points avec elle. Elle ne vaut pas pour une année de chômage
      indemnisé, dont les points ne portent que sur la tranche B du salaire journalier de
      référence (annexe I, art. 8 bis) ; un arrêt de travail, lui, reprend les points de
      l'année précédente (art. 8), garantie comprise. Un cadre à plusieurs employeurs ne
      paie qu'un forfait, que chacun prélève au prorata de son salaire (GERESO) : le
      modèle, qui ne voit qu'une ligne par année, le retrouve.
    parametres:
      points_minimum_annuels: 120
      cotisation_garantie: le forfait annuel publié (regimes/valeurs_point.csv)
      prix_du_point: le salaire de référence de l'année, au taux d'appel de l'année
  exemples: [audiens_gmp_2018, agirc_arrco_gmp_2017]
- id: eteinte_avec_la_fusion
  statut: lue
  textes:
  - reference: >-
      accord national interprofessionnel du 17 novembre 2017 instituant le régime
      Agirc-Arrco, fait à Paris le 17 novembre 2017, étendu et élargi par l'arrêté du 24
      avril 2018 (JORFTEXT000036847920)
    article: article 155
    en_vigueur: 2019-01-01
    citation: >-
      « Le présent Accord national interprofessionnel porte révision, dans toutes leurs
      stipulations, de la Convention collective nationale de retraite et de prévoyance des
      cadres du 14 mars 1947 et de l'Accord national interprofessionnel de retraite
      complémentaire du 8 décembre 1961. Il annule et remplace, dans toutes leurs
      stipulations, ces deux conventions à compter du 1er janvier 2019. »
    lu_le: 2026-10-02
    empreinte: sha256:352e023e397b2b6c1a01eb10fa295d0791f5d339d9b54c168fb3b3f079af131d
  bornes:
    revenu.annee: [2019-01-01, null]
  contenu:
    droit: aucun
    raison: >-
      l'accord annule et remplace la convention de 1947, qui portait la garantie, et le
      régime unifié n'en a pas : l'accord ne la nomme nulle part. Les points qu'elle a
      donnés restent acquis
  exemples: aucun trouvé
approximations:
- version: cent_quarante_quatre_points
  ecart: >-
    Les règles du temps partiel, du chômage indemnisé et de l'arrêt de travail ne sont
    lues que dans leurs rédactions de 2006 à 2018 : le modèle les applique aussi de 1989
    à 1996. L'avenant du 13 juin 1991 à l'accord de 1988, étendu en 1992, n'est pas lu.
  effet: non mesuré
- version: cent_vingt_points
  ecart: >-
    Le temps partiel n'est connu que par la quotité d'une ligne, que seule la retraite
    progressive renseigne : un temps partiel ordinaire, que la saisie ne porte pas,
    reçoit la garantie d'une année à temps plein. Le calcul lit déjà la quotité : il
    suivra le jour où la saisie la portera.
  effet: non mesuré
- version: cent_vingt_points
  ecart: >-
    La garantie des intermittents, appelée à la journée (4,00 € par jour en 2018, sous un
    salaire charnière de 201,47 €), et leurs points de chômage, que la délibération D53
    calcule sur ceux de l'année précédente, ne sont pas modélisés : le modèle n'a pas de
    statut d'intermittent.
  effet: non mesuré
sources:
  lu_le: 2026-10-02
  prochaine_relecture: 2027-10-01
  a_relire:
  - >-
    Lire l'accord du 8 décembre 1988 et son avenant du 13 juin 1991, qui ne sont ni au
    JORF ni dans KALI : l'objectif de 144 points n'est connu que par l'UGICT-CGT et par
    les forfaits de 1989 et de 1990, et rien n'explique encore que ceux de 1991 à 1995
    achètent de 142,45 à 146,62 points — un forfait fixé sur un salaire de référence
    prévu, ou des taux d'appel de 1991 à 1994 autres que ceux du dépôt.
  - >-
    Confronter les forfaits de 1989 à 2007 à une publication de la fédération : ils sont
    transcrits du barème IPP, qui les tient pour 2005 et avant de barèmes communiqués par
    l'Agirc-Arrco. Ceux de 2008 à 2018 le sont, à 0,5 centime par mois près.
  - >-
    Lire les circulaires Agirc-Arrco 2017-07-DT du 16 octobre 2017, qui fixe les
    paramètres de 2018 (OpenFisca la cite), et 2017-12-DRJ du 13 décembre 2017 (LégiSocial
    la cite), introuvables en ligne ; et un texte de l'Agirc qui fonde le prorata du temps
    partiel : il n'est connu que par la réponse des services Agirc-Arrco que cite
    LégiSocial et par trois fiches pratiques (GERESO, Audiens, UNA Yonne).
  lectures:
  - type: jorf
    reference: >-
      arrêté du 2 novembre 1992 portant extension et élargissement de l'avenant du 13 juin
      1991 à l'accord du 8 décembre 1988 instituant une garantie minimale de points, lu dans
      l'index JORF du dépôt : il vise « l'arrêté du 24 février 1989 portant extension et
      élargissement de l'accord du 8 décembre 1988 instituant une garantie minimale de
      points » (JORFTEXT000000162226)
    date: 1992-11-11
  - type: autre
    reference: >-
      accord du 25 avril 1996 relatif au régime de retraite des cadres (Agirc), copie
      publiée par le Medef : article 1er (salaire de référence majoré de 4 % au titre de
      chacun des exercices 1996 à 2000) ; article 7 (« La Garantie Minimale de Points
      G.M.P. est ramenée, à compter du 1er janvier 1997, à 120 points » ; les autres
      cotisations forfaitaires et garanties supprimées par cinquièmes, remplacées par une
      contribution « exceptionnelle et temporaire, non génératrice de droits ») (copie
      datée, sha256:ef21ec3291e20ee80dae3bafe02b2042081ec8f6deb30206c2b3611390feaf81)
    date: 1996-04-25
    url: https://accords.medef.com/documents/accord_233.pdf
  - type: autre
    reference: >-
      OpenFisca-France, paramètre
      prelevements_sociaux/regimes_complementaires_retraite_secteur_prive/gmp/cotisation_forfaitaire_annuelle
      (barème IPP gmp_cot_f_a) : le forfait annuel de 1989 à 2018, en francs jusqu'en
      2001, de 2 843 F en 1989 à 872,52 € en 2018 ; il cite les circulaires Agirc de 2005
      à 2017 et, pour 2005 et avant, des barèmes communiqués par l'Agirc-Arrco
    date: 2026-10-02
    url: https://github.com/openfisca/openfisca-france/blob/master/openfisca_france/parameters/prelevements_sociaux/regimes_complementaires_retraite_secteur_prive/gmp/cotisation_forfaitaire_annuelle.yaml
  - type: autre
    reference: >-
      UGICT-CGT, « [Fiche Agirc 9] : La garantie minimale de points », 19 février 2015 :
      « L'UGICT-CGT signait le 8 décembre 1988 un accord portant création d'une Garantie
      Minimale de 144 Points annuels (GMP) de retraite » ; « Elle était à l'origine
      calculée pour financer un minimum garanti de 144 points par an, puis réduite, suite
      à l'accord de 1996, pour ne plus financer que 120 points. »
    date: 2015-02-19
    url: https://ugictcgt.fr/lire-fiche-agirc-9-la-garantie-minimale-de-points-avantageuse-pour-les-salaries-et-indispensable-pour-lagirc/
  - type: autre
    reference: >-
      GERESO Édition, « La paie », fiches C190 à C195, « Garantie minimale de cotisations
      à objectifs de points (GMP) » (mise à jour d'octobre 2010) : temps partiel, « Salaire
      à temps partiel/salaire à temps plein x GMP » ; embauche ou départ en cours d'année,
      au prorata « des 30e de présence » ; salariés multi-employeurs, « La GMP est
      proratisée en fonction du rapport entre le salaire perçu chez chaque employeur et la
      totalité des salaires perçus » ; en arrêt maladie, elle « reste exigible » sous le
      salaire charnière (copie datée,
      sha256:c70b24089748d5b3896deaffccca40cd5161c2c78e02eb3385e257f72b1dbba9)
    date: 2010-10-01
    url: https://documents.gereso.com/client/edition/docs-edition/MP-EP-PDF/PAI-PDF/PAIC/PAI-C190.pdf
  - type: autre
    reference: >-
      Agirc-Arrco, « Convention collective nationale de retraite et de prévoyance des
      cadres du 14 mars 1947 et délibérations prises pour son application », textes mis à
      jour au 1er janvier 2018 : article 6, § 2, B (taux contractuel de la tranche B), D
      (partage entre l'employeur et le participant) et F (la garantie minimale de points)
    date: 2026-10-02
    url: https://www.agirc-arrco.fr/wp-content/uploads/2021/11/CCN_14mars1947-1.pdf
  - type: autre
    reference: >-
      Audiens Retraite Agirc, fiche pratique « La GMP (garantie minimale de points) »,
      année 2018 (imprimée le 29 janvier 2018) : « La GMP est une cotisation forfaitaire
      (avec une part salariale et une part patronale) qui est due dès que le salaire du
      cadre n'atteint pas un minimum appelé salaire charnière. En cas de travail à temps
      partiel, la GMP est proratisée. » ; tableau des montants : taux contractuel 16,44 %,
      appelé 20,55 %, 872,52 € par an, 72,71 € par mois, 27,60 € de part salariale et
      45,11 € de part patronale
    date: 2026-10-02
    url: https://www.audiens.org/files/live/sites/siteAudiens/files/03_documents/entreprise/Fiches%20techniques/FP-GMP-V2018.pdf
  - type: autre
    reference: >-
      UNA Yonne, « La Garantie Minimale de Points (GMP) 2018 » (mise à jour de septembre
      2017) : « Pour les salariés à temps partiel, la GMP est calculée selon le rapport
      suivant : rémunération à temps partiel / rémunération qui aurait été versée si le
      salarié était à temps plein » ; « En cas d'embauche ou de départ en cours d'année, la
      proratisation s'effectuera en fonction de la durée de présence sur l'année » ; entre
      le plafond et le salaire charnière, « l'assiette de calcul est constituée de la
      différence entre le salaire charnière et le salaire brut »
    date: 2026-10-02
    url: https://www.unayonne.net/wp-content/uploads/2018/02/96-la-garantie-minimal-de-point-2018.pdf
  - type: autre
    reference: >-
      CFE-CGC Adecco, « La fin de la GMP (garantie minimale de points) », novembre 2018 :
      « Avec la mise en place au 1er janvier 2019 du nouveau régime unique Agirc-Arrco, la
      garantie des 120 points Agirc n'existe plus »
    date: 2026-10-02
    url: https://www.cfecgc-adecco.com/2018/11/la-fin-de-la-gmp-garantie-minimale-de.html
  - type: autre
    reference: >-
      Agirc-Arrco, circulaire 2016-11-DRJ du 16 décembre 2016, « Paramètres 2017 » :
      garantie minimale de points, « Références : Article 6 de la Convention collective
      nationale du 14 mars 1947 ; Décision du Conseil d'administration de l'Agirc du 6
      octobre 2016 » ; « Valeur mensuelle pourcentage d'appel inclus : 70,38 € (Part
      patronale : 43,67 € - Part salariale : 26,71 €) ; Valeur annuelle pourcentage
      d'appel inclus : 844,56 € » ; salaire charnière de 3 611,48 € par mois (copie datée,
      sha256:8245a48b6879fdd370d06cc15259c218ecbc2b2fd8ca81f47afccfc440d166ce)
    date: 2026-10-02
    url: http://cercledelepargne.com/wp-content/uploads/2015/01/201611drj_Parametres_2017.pdf
  - type: autre
    reference: >-
      LégiSocial, « Cotisations au titre de la GMP : un traitement très particulier ! » (13
      mai 2013, mis à jour le 29 septembre 2017), d'après la réponse des services
      Agirc-Arrco du 19 avril 2013 : « La GMP est à proratiser en tenant compte du rapport
      entre les rémunérations perçues en temps partiel et les rémunérations qui auraient
      été obtenues si le participant avait travaillé à temps plein » ; entrée ou sortie en
      cours de mois en trentièmes ; la circulaire 2013-6-DT du 2 avril 2013 : 795,12 € par
      an, 66,26 € par mois, dont 25,13 € de part salariale
    date: 2026-10-02
    url: https://www.legisocial.fr/actualites-sociales/674-cotisations-au-titre-de-la-gmp-un-traitement-tres-particulier.html
  - type: autre
    reference: >-
      UCANSS, lettres circulaires 004-10 du 21 janvier 2010 et 003-11 du 26 janvier 2011 :
      la garantie « reste provisoirement fixée à 62 € par mois » en janvier 2010, puis «
      est maintenue à titre transitoire à son niveau 2010 dans l'attente de la fixation du
      salaire de référence pour l'année 2011. Ce montant reste donc fixé à 62,81 € par mois
      » (38,99 € et 23,82 €) : un montant provisoire, régularisé sur l'année
    date: 2026-10-02
    url: https://jurilettres.ucanss.fr/lettresCirculaires/LC003-11.html
  - type: autre
    reference: >-
      ASH, « La garantie minimale de points AGIRC 2009 est fixée », 16 janvier 2009 : la
      garantie est maintenue en janvier « à titre transitoire, à son niveau de 2008 » —
      « 731 € en valeur annuelle », « 60,92 € en valeur mensuelle », dont 37,81 € pour
      l'employeur et 23,11 € pour le salarié, sous un salaire charnière de 37 908 €
    date: 2026-10-02
    url: https://www.ash.tm.fr/magazine/2592/dans-les-textes/la-garantie-minimale-de-points-agirc-2009-est-fixee-397286.php
  - type: autre
    reference: >-
      Unédic, « Attribution d'avantages (AGIRC) en matière de retraite complémentaire »,
      article 8 bis de l'annexe I à la convention du 14 mars 1947, rédaction de 2006 : «
      Les dispositions du présent article concernent les points en tranche B », calculés
      sur le salaire journalier de référence (copie datée,
      sha256:e91cf7aa507a9bbdbf630457c1d07588e29840aac6f1d687dee7da00909c7a56)
    date: 2026-10-02
    url: https://www.unedic.org/ged/documents/regulatory_texts/pdf/Art8b1947.pdf
  - type: autre
    reference: >-
      accord national interprofessionnel du 17 novembre 2017 instituant le régime
      Agirc-Arrco, copie publiée par la Revue fiduciaire : articles 2 et 155 ; la garantie
      minimale de points n'y est nommée nulle part
    date: 2026-10-02
    url: https://revuefiduciaire.grouperf.com/plussurlenet/complements/20171120_ANI_Regime_Agirc-Arrco_du_17_novembre_2017_(2).pdf
code:
  python: >-
    scenarios/actuel.py : ValeursPoint.garantie, le forfait de la ligne ;
    donnees/regimes.py : PeriodeRegime.points_garantis ; droit/acquerir.py : acquerir, le
    plancher de points du scénario 1 ; moteur/compte.py : ConstructeurCompte._assiette_garantie
    et _cotisation_ligne, la cotisation forfaitaire portée au compte
  javascript: >-
    moteur/js/regimes.js : ValeursPoint.garantie, pointsGarantis ;
    moteur/js/droit/acquerir.js : acquerir ;
    moteur/js/compte.js : _assietteGarantie, _cotisationLigne
  parametres: >-
    le forfait annuel de la garantie, de 1989 à 2018, puis le salaire de référence et le
    taux d'appel de l'Agirc (regimes/valeurs_point.csv : cotisation_garantie,
    salaire_reference, taux_appel) ; points_minimum_annuels des fiches agirc et
    agirc_entreprises_nouvelles, 144 jusqu'en 1996 et 120 ensuite, qui ne servent plus
