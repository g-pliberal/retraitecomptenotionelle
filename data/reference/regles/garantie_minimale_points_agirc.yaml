code:
  python: >-
    scenarios/actuel.py : ValeursPoint.garantie, le forfait de la ligne ;
    donnees/regimes.py : PeriodeRegime.points_garantis ; droit/acquerir.py : acquerir, le
    plancher de points du scénario 1 ; moteur/compte.py : ConstructeurCompte._assiette_garantie
    et _cotisation_ligne, la cotisation forfaitaire portée au compte
  javascript: >-
    moteur/js/regimes.js : ValeursPoint.garantie, pointsGarantis ;
    moteur/js/droit/acquerir.js : acquerir ;
    moteur/js/compte.js : _assietteGarantie, _cotisationLigne
  parametres: >-
    le forfait annuel de la garantie, de 1989 à 2018, puis le salaire de référence et le
    taux d'appel de l'Agirc (regimes/valeurs_point.csv : cotisation_garantie,
    salaire_reference, taux_appel) ; le taux contractuel de la tranche B de la période,
    rapporté au taux de 16 % de la garantie (ValeursPoint.TAUX_DE_LA_GARANTIE) ;
    points_minimum_annuels des fiches agirc et agirc_entreprises_nouvelles, 144 jusqu'en
    1996 et 120 ensuite pour un taux de 16 %, qui ne servent plus qu'à dire où vaut la
    garantie et à tenir lieu d'un forfait non publié
  tests: >-
    tests/test_simulateur.py : test_la_garantie_minimale_de_points_agirc_est_servie, les
    tests de sa cotisation, de son prorata, des années de chômage, de sa proportion au taux
    de l'entreprise, de son forfait fixé avant le salaire de référence et du prix des
    années publiées, des circulaires de l'Agirc de 2003 à 2006 comprises ; les exemples
    agirc_gmp_2004 à agirc_gmp_2008, agirc_arrco_gmp_2017, audiens_gmp_2018 et
    agirc_arrco_gmp_2018 (tests/test_oracle.py)
reformes: [gmp_agirc_1989, gmp_agirc_1997]
historique:
- >-
  2026-10-02 — née avec la cotisation de la garantie. Le scénario 1 servait les 120
  points depuis qu'ils avaient été mis ; la garantie passait pour un droit gratuit,
  absente du compte notionnel des scénarios 2, 4 et 6 et mesurée parmi les avantages non
  contributifs. Une cotisation forfaitaire achetait ces points : le compte la reçoit, la
  garantie a quitté l'inventaire des avantages non contributifs, et le plancher se
  proratise sur la durée de présence et le temps partiel.
- >-
  2026-10-02 — les questions restées ouvertes, reprises le même jour. Une année de
  chômage indemnisé n'a pas de garantie, ses points Agirc ne portant que sur la tranche
  B du salaire journalier de référence (annexe I, art. 8 bis) : le scénario 1 la lui
  servait, cent vingt points de trop par année pour une cadre dont le salaire de
  référence est sous le plafond ; un arrêt de travail la garde (art. 8). L'accord du 17
  novembre 2017 (art. 155), lu, l'éteint ; la circulaire 2016-11-DRJ est rejouée ; six
  montants publiés, de 2008 à 2018, sont retrouvés au centime de chaque mensualité ; un
  témoin de simulation exerce les trois règles.
- >-
  2026-10-02 — le forfait publié, de 1989 à 2018, repris le même jour. Le dépôt
  supposait 120 points dès 1989 ; l'accord du 8 décembre 1988 en visait 144, que l'accord
  du 25 avril 1996 (art. 7) ramène à 120 au 1er janvier 1997. Le forfait annuel,
  transcrit du barème IPP — 2 843 F en 1989, 872,52 € en 2018 —, entre dans
  `valeurs_point.csv` : le scénario 1 en tire les points au prix de l'année, 144 en 1989
  et en 1990, de 142,45 à 146,62 de 1991 à 1995, 136,31 en 1996 ; le compte notionnel,
  la cotisation. Le texte fondateur, que deux fiches et le calendrier citaient « accord
  du 9 février 1988 », est l'accord du 8 décembre 1988, étendu par l'arrêté du 24
  février 1989.
- >-
  2026-10-02 — les sources des questions ouvertes, cherchées le même jour. La garantie
  n'était pas de 144 points quel que fût le taux : l'accord du 8 décembre 1988 donnait
  « un nombre de points proportionnel au taux de cotisations de l'entreprise sur tranche
  B », 72 points à 8 %, 108 à 12 %, 144 à 16 % (G. Briens, 1990), sur une assiette
  minimale de tranche B — un « plancher » de 1 290 F par mois en 1989 (L.
  Marrache-Jupin) —, et l'accord de 1996 la ramène à « 120 points pour un taux de
  cotisation de 16 % ». Le modèle, qui prête à l'entreprise le taux minimal, en sert la
  part : 72 points de 1989 à 1993, puis de 89 à 113 jusqu'en 1998. Les forfaits de 1991 à
  1995 sont, au dixième de franc, 144 fois un salaire de référence prévu ; ceux de 2004
  et de 2005, fixés en décembre, s'inscrivent « sur la base du salaire de référence de
  l'exercice ». Les circulaires 2017-07-DT et 2017-12-DRJ, et celles de l'Agirc de 2003 à
  2008, sont lues sur le site de la fédération ; six exemples nouveaux.
effet: >-
  Tout cadre payé sous le salaire charnière entre 1989 et 2018 — 1,11 plafond en 2018 —,
  surtout en début de carrière. Pour une cadre née en 1975, entrée à 22 ans et payée
  sous le plafond jusqu'en 2018, le compte reçoit 15 386 € de cotisations de garantie
  (5 802 € de part salariale) : mesurée avec et sans elles, sa pension monte de 563 € par
  an au scénario 2, de 1 496 € au scénario 4 et de 1 588 € au scénario 6 ; le scénario 1,
  qui sert ses 2 618 points, et les scénarios 3 et 5, qui les convertissent à la bascule,
  ne bougent pas. Avant 1999, la garantie suit le taux minimal de l'entreprise : un cadre
  entré en 1990 sous le plafond acquiert 3 217 points Agirc, et non les 3 645 qu'une
  garantie de 144 points à tout taux lui donnait, soit 177 € de pension par an de moins
  au scénario 1 et 160 € aux scénarios 4 et 6. Une année
  de chômage indemnisé, sous le plafond, ne vaut pas les points de la garantie au
  scénario 1 ; aucun des 688 témoins d'alors n'en avait.
