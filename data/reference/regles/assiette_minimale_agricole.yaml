schema_version: 1
id: assiette_minimale_agricole
intitule: >-
  Assiette minimale des chefs d'exploitation agricole : la cotisation qui ouvre les points
  de la retraite proportionnelle est due sur 400 SMIC horaires au moins depuis 1990, sur
  600 depuis le décret n° 2004-783 du 29 juillet 2004 ; celle de la complémentaire
  obligatoire sur 2 028 SMIC en 2003, 1 957 en 2004, 1 888 en 2005 et 1 820 depuis 2006,
  qui ouvrent 100 points par an, 117 en 2017 et 133 depuis 2018.
etat: approchee
etape: acquerir_les_droits
effet: >-
  Les chefs d'exploitation aux revenus faibles, et, à la complémentaire, tous les chefs
  qui cotisent depuis 2017. Le moteur suit les textes depuis la correction préparée le 27
  septembre 2026 et publiée après la phase 8 : à la base, un plancher de 400 SMIC horaires
  de 1990 à 2003, qui ouvre quinze points, puis de 600 ; à la complémentaire, un minimum
  de 2 028, 1 957 et 1 888 SMIC de 2003 à 2005, puis de 1 820, qui ouvre 100 points par an
  jusqu'en 2016, 117 en 2017 et 133 depuis 2018, les points au-dessus suivant (« P = N x
  RP/1820 SMIC »), et une cotisation de 2,97 % jusqu'en 2009, 3 % jusqu'en 2016, 3,5 % en
  2017 et 4 % depuis (D. 732-165). Jusque-là, une seule période portait 1 820 SMIC, 100
  points et 4 % depuis 2003, et la base relevait le revenu à 600 SMIC dès 1990. Sur les
  témoins, la pension d'aujourd'hui d'un chef né en 1975, parti à 64 ans au salaire moyen,
  passe de 29 393 € à 30 109 € (+2,4 %), celle d'un chef né en 1965 de 23 483 € à 23 802 €
  (+1,4 %) ; les scénarios rétroactifs de la proposition, dont le compte reçoit désormais
  la cotisation au taux de chaque année, baissent de 1 à 3 %. Reste une approximation : la
  première année de cotisation sur 600 SMIC, que le moteur place en 2004 et que le décret
  n° 2004-783 ne date pas. Depuis le 16 octobre 2026 (étape 138.8), le collaborateur et
  l'aide familial n'ont pas de plancher mais un forfait : 400 SMIC horaires à la base
  depuis 2004 (D. 731-123), 600 depuis 2026 ; à la RCO, 1 200 SMIC depuis 2011, qui
  ouvrent 66 points par an jusqu'en 2016, 77 en 2017 et 88 depuis (D. 732-155, II), au lieu
  des cent points au moins que le plancher du chef leur donnait. Depuis le 17 octobre
  2026 (action 131), l'année où l'exploitant cesse, qu'il cotise entière (L. 731-10-1),
  ouvre à la complémentaire les points d'une année : le collaborateur y a ses 88 points,
  et non leurs mois ; le chef les avait déjà, son revenu des mois rapporté au repère des
  mêmes mois. Depuis le 18 octobre 2026, l'année où il s'installe après le 1er janvier
  n'ouvre aucun point : sans cotisation de l'année (R. 731-57), D. 732-155 n'en porte
  aucun au compte. Depuis le même jour, toute année où il cesse, et non la seule de son
  départ, ouvre les points d'une année, dans le statut du 1er janvier : le statut pris en
  cours d'année n'en ouvre aucun, et le chef parti le 1er août 2024, collaborateur depuis
  avril, a les 133 points de son année de chef, et non 183. Depuis le même jour encore, le
  compte du droit en vigueur — celui des scénarios 4 et 5, et des cotisations que lisent
  les indicateurs du cycle de vie — reçoit ce que l'exploitant verse pour l'année, dans
  le statut du 1er janvier, et non pour les mois de ses lignes : l'année entière celle où
  il cesse, rien celle où il s'installe ou prend un autre statut (`moteur/compte.py`). Le
  chef parti le 1er août 2024 y verse pour 2024 2 084,40 € à la base et 848,12 € à la
  RCO, et non 1 215,90 € et 494,74 €. Le régime fusionné de la proposition, après la
  bascule, prélève toujours sur le revenu des mois. Depuis le 19 octobre 2026, l'année du
  décès du chef, qu'il cotise au prorata depuis 2009 (L. 731-10-1), est une année au
  prorata, comme celle de R. 731-83, dans la carrière arrêtée au décès : la
  complémentaire en garde au chef les points d'une année, 133 pour le chef mort le
  15 août 2024, et le compte qui lit cette carrière n'en reçoit que les cotisations de
  ses mois. Depuis le 22 octobre 2026, ce compte porte la cotisation du collaborateur et
  de l'aide familial sur leur forfait, comme le régime la prélève, et non sur leur revenu
  relevé au plancher du chef : la collaboratrice à 12 000 € par an y verse pour 2023
  783,04 € à la base et 540,96 € à la RCO, et non 2 084,40 € et 820,46 €.
sources:
  lu_le: 2026-10-22
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    L'année que R. 731-83 fait cotiser au prorata : D. 732-155 écrit un « nombre annuel
    de points », 100 puis 133 « par an » au minimum, P = N × RP / 1 820 SMIC au-delà,
    jusqu'aux périodes de 2025 (LEGIARTI000006597593, LEGIARTI000034578860), et le tire
    de « la cotisation acquittée par l'assuré pour l'année considérée » depuis 2026, P =
    C / [(1 820 SMIC × T) / N] (LEGIARTI000049904715) : une année au prorata n'en aurait
    plus que ses mois. Le moteur garde au chef les points d'une année, et au
    collaborateur ceux de ses mois ; la pratique de la MSA n'est pas lue (relu le 18
    octobre 2026). De même l'année du décès du chef, que L. 731-10-1 fait cotiser au
    prorata depuis 2009 (relu le 19 octobre 2026).
  - >-
    L'AVI du collaborateur et de l'aide familial : jusqu'en 2025, L. 731-42, 1°, la doit «
    pour chaque personne non salariée âgée d'au moins seize ans », « en pourcentage des
    revenus professionnels du chef d'exploitation », 800 SMIC au moins (D. 731-120, 1°),
    à 3,2 % puis 3,32 % (D. 731-121). Le modèle, qui ne connaît pas les revenus du chef
    et ne sépare pas l'AVI de l'AVA, porte au compte tout le taux du régime sur le
    forfait de l'AVA : 783,04 € en 2023, quand l'AVI au minimum, 299,33 €, et l'AVA,
    520,67 €, en font 820,00 €, et davantage à mesure que le chef gagne (relu le 22
    octobre 2026). Depuis 2026, la cotisation du collaborateur est une seule, sur le
    forfait (L. 731-42, 2°).
  - >-
    Dire la première année de cotisation assise sur 600 SMIC : le décret n° 2004-783,
    publié au Journal officiel du 1er août 2004, ne la nomme pas dans ce qui en a été lu,
    et 2004 comme 2005 restent possibles ; le moteur la place en 2004.
