- id: tables_de_2023
  statut: lue
  textes:
  - {id: LEGIARTI000047909955, article: "statut national, annexe 3, articles 9, 9-1 et 45, I, I bis et I ter, rédaction du décret n° 2023-692", en_vigueur: 2025-01-01, publie_le: 2023-07-30}
  - {id: LEGIARTI000052046924, article: "même annexe, mêmes articles", en_vigueur: 2025-08-06}
  nee_de: LEGIARTI000047909955
  bornes:
    ouverture_du_droit: [2025-01-01, null]
