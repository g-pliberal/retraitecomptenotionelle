  - {id: LEGIARTI000047908882, article: "même annexe, mêmes articles", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047909955, article: "même annexe, article 45, I bis et I ter, rédaction du décret n° 2023-692", en_vigueur: 2025-01-01, publie_le: 2023-07-30}
  nee_de: LEGIARTI000029150159
  bornes:
    ouverture_du_droit: [2019-07-01, 2025-01-01]
  contenu:
    parametres:
      table_par_generation: {1959.5: 167, 1961: 168, 1964: 169, 1967: 170, 1970: 171, 1973: 172}
      age_de_lecture: 60
      pourcentage_maximum: 0.75
    droit: >-
      « A compter du 1er juillet 2019, elle est fixée à : 167 trimestres, pour les agents
      nés entre le 1er juillet 1959 et le 31 décembre 1960 ; 168 trimestres, pour les agents
      nés entre le 1er janvier 1961 et le 31 décembre 1963 ; 169 trimestres, pour les agents
      nés entre le 1er janvier 1964 et le 31 décembre 1966 ; 170 trimestres, pour les agents
      nés entre le 1er janvier 1967 et le 31 décembre 1969 ; 171 trimestres, pour les agents
      nés entre le 1er janvier 1970 et le 31 décembre 1972 ; 172 trimestres, pour les agents
      nés à partir du 1er janvier 1973 » (article 45, I) ; « la durée des services et des
      bonifications exigée des agents qui remplissent les conditions de liquidation d'une
      pension avant l'âge de soixante ans est celle exigée des agents atteignant l'âge de
      soixante ans l'année à compter de laquelle la liquidation peut intervenir »
      (article 9-1)
    conditions: >-
      la CNIEG lit la table à la génération qui a soixante ans le mois où le droit s'ouvre :
      Monsieur A, né le 1er décembre 1964, dont le droit s'ouvre le 1er décembre 2020, doit
      les 167 trimestres de la génération 1960 (circulaire n° 2024/15, exemple 1) ; à qui a
      réuni les conditions avant le 1er janvier 2025, cette durée reste due après, « quelle
      que soit leur génération ou le motif de départ » (article 45, I ter, et CNIEG,
      « Tableau des durées d'assurance ») ; les rédactions de 2018 à 2023 gardent les deux
      articles mot pour mot
  exemples:
