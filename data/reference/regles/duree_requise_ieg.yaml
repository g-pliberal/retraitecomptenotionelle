    parametres:
      tables_par_services_actifs:
        5: {1964: 170, 1967: 171, 1969: 172}
        8: {1965: 170, 1968: 171, 1970: 172}
        11: {1966: 170, 1969: 171, 1971: 172}
        14: {1967: 170, 1970: 171, 1972: 172}
        17: {1968: 170, 1971: 171, 1973: 172}
      table_des_sedentaires: {1959.5: 167, 1961: 168, 1963: 169, 1964: 170, 1966: 171, 1968: 172}
      pourcentage_maximum: 0.75
    droit: >-
      « Par dérogation à l'article 9 de la présente annexe et au I du présent article, à
      compter du 1er janvier 2025 : [...] 5° Pour les agents mentionnés au 2° du I de
      l'article 16, qui ont accompli des services effectifs actifs, insalubres et
      militaires pour une durée au moins égale à dix-sept ans, cette durée est égale : -
      pour ceux nés avant le 1er janvier 1968, à celle applicable avant l'entrée en vigueur
      du décret n° 2023-692 [...] ; - pour ceux nés à compter du 1er janvier 1968 et
      jusqu'au 31 décembre 1970, à 170 trimestres ; - pour ceux nés à compter du 1er janvier
      1971 et jusqu'au 31 décembre 1972, à 171 trimestres ; - pour ceux nés à compter du
