schema_version: 1
id: duree_requise_ieg
intitule: >-
  La durée de services et bonifications qui donne à l'agent des IEG le pourcentage maximum
  de 75 % : trente-sept annuités et demie, à 2 % chacune, jusqu'en 2008 ; 151 trimestres à
  qui réunit les conditions au second semestre de 2008, un de plus chaque 1er janvier et
  1er juillet jusqu'en 2012, le 1er décembre 2012, puis chaque 1er juillet jusqu'à 166 en
  2018 ; à compter du 1er juillet 2019, 167 à 172 trimestres selon la génération, lue
  depuis 2017 à celle qui a soixante ans l'année où le droit s'ouvre ; à qui les réunit
  depuis le 1er janvier 2025, une table par durée de services actifs — 170 à 172 trimestres
  pour les dix-sept ans de l'actif né depuis 1968 — et l'ancienne règle en deçà.
domaine: duree
regimes: [ieg]
etape: ouvrir_le_droit
face: droit
etat: approchee
lit:
- le mois où l'agent réunit les conditions d'ouverture du droit (`age_ouverture_ieg_actifs`)
- >-
  sa génération, et, de 2017 à 2024, celle qui atteint soixante ans le mois où son droit
  s'ouvre (article 9-1)
- ses années de services actifs, présumées dix-sept
ecrit:
- >-
  la durée des services et bonifications requise pour le pourcentage maximum de 75 %, à
  laquelle se rapportent ses trimestres liquidés et que la décote compte par la durée
  (`decote_regimes_speciaux`)
dates_qui_decident:
- ouverture_du_droit
versions:
- id: statut_de_1946
  statut: lue
  hypothese: >-
    la réforme de 2008 ne dit rien de qui a réuni les conditions avant le 1er juillet 2008
    et liquide plus tard : le calendrier, qui part de 151 trimestres pour le second
    semestre de 2008, lui laisse les cent cinquante de l'annexe de 1946
  textes:
  - {id: LEGIARTI000006632496, article: "statut national, annexe 3, article 3, § 3, rédaction de 1946", en_vigueur: 1946-06-01}
  nee_de: LEGIARTI000006632496
  bornes:
    ouverture_du_droit: [null, 2008-07-01]
  contenu:
    parametres:
      trimestres: 150
      pourcentage_maximum: 0.75
    droit: >-
      la pension est le produit du nombre d'annuités par « 2 % du salaire ou traitement
      annuel », et « les prestations pensions d'ancienneté ne peuvent dépasser 75 % du
      salaire ou traitement considéré » (article 3, § 3) : trente-sept annuités et demie,
      cent cinquante trimestres, la portent au maximum
  exemples: aucun trouvé
- id: calendrier_de_2008
  statut: lue
  textes:
  - {id: LEGIARTI000019226006, article: "statut national, annexe 3, articles 9 et 45, I, rédaction du décret n° 2008-627", en_vigueur: 2008-06-30, publie_le: 2008-06-29}
  - {id: LEGIARTI000020085612, article: "même annexe, mêmes articles", en_vigueur: 2009-01-01}
  - {id: LEGIARTI000023733902, article: "même annexe, mêmes articles", en_vigueur: 2011-03-21}
  - {id: LEGIARTI000024588157, article: "même annexe, mêmes articles", en_vigueur: 2011-09-26}
  - {id: LEGIARTI000026950690, article: "même annexe, mêmes articles", en_vigueur: 2013-04-01}
  - {id: LEGIARTI000029150159, article: "même annexe, articles 9 et 45, I, rédaction du décret n° 2014-698", en_vigueur: 2014-06-28, publie_le: 2014-06-27}
  - {id: LEGIARTI000030058926, article: "même annexe, mêmes articles", en_vigueur: 2015-01-01}
  - {id: LEGIARTI000031800065, article: "même annexe, mêmes articles", en_vigueur: 2016-01-01}
  - {id: LEGIARTI000029150204, article: "même annexe, articles 9, 9-1 et 45, I, rédaction pour les pensions prenant effet au 1er janvier 2017", en_vigueur: 2017-01-01, publie_le: 2014-06-27}
  - {id: LEGIARTI000034764555, article: "même annexe, mêmes articles", en_vigueur: 2018-01-01}
  - {id: LEGIARTI000036755043, article: "même annexe, mêmes articles", en_vigueur: 2018-03-31}
  - {id: LEGIARTI000038189976, article: "même annexe, mêmes articles", en_vigueur: 2019-03-02}
  nee_de: LEGIARTI000019226006
  bornes:
    ouverture_du_droit: [2008-07-01, 2019-07-01]
  contenu:
    parametres:
      calendrier: {"2008-07": 151, "2009-01": 152, "2009-07": 153, "2010-01": 154, "2010-07": 155, "2011-01": 156, "2011-07": 157, "2012-01": 158, "2012-07": 159, "2012-12": 160, "2013-07": 161, "2014-07": 162, "2015-07": 163, "2016-07": 164, "2017-07": 165, "2018-07": 166}
      pourcentage_maximum: 0.75
    droit: >-
      « Sous réserve des dispositions transitoires du I de l'article 45 ci-après, le nombre
      de trimestres nécessaires pour obtenir le pourcentage maximum de la pension est fixé
      à cent soixante trimestres et il évolue comme la durée des services et bonifications
      exigée des fonctionnaires de l'Etat [...]. Le pourcentage maximum de la pension est
      fixé à 75 % » (article 9) ; la durée « est fixée à 151 trimestres pour les personnes
      remplissant les conditions définies à l'article 16 entre le 1er juillet et le 31
      décembre 2008 inclus. Pour les personnes remplissant les conditions définies à
      l'article 16 ci-dessus postérieurement au 31 décembre 2008, elle augmente d'un
      trimestre au 1er janvier et au 1er juillet de chaque année jusqu'au 1er juillet 2012
      inclus, d'un trimestre au 1er décembre 2012, puis d'un trimestre au 1er juillet de
      chaque année jusqu'à atteindre la durée maximum définie à l'article 5 de la loi
      n° 2003-775 » (article 45, I), que la rédaction du 28 juin 2014 arrête : « jusqu'à
      atteindre la durée de 166 trimestres au 1er juillet 2018 », l'article 9 portant
      désormais « cent soixante-douze »
    conditions: >-
      le décret n° 2008-627 entre en vigueur le 1er juillet 2008 (article 2) ; pour les
      pensions prenant effet depuis le 1er janvier 2017 (décret n° 2011-290, article 25,
      I), la durée « est celle qui est en vigueur lorsque les agents atteignent l'âge de
      soixante ans », et, pour qui peut liquider avant, « celle exigée des agents
      atteignant l'âge de soixante ans l'année à compter de laquelle la liquidation peut
      intervenir » (article 9-1, rédaction du décret n° 2014-698) : sur ce calendrier, la
      même, que la CNIEG lit « A la date au plus tôt d'ouverture des droits » (circulaire
      n° 2024/15)
  exemples:
  - cnieg_decote_madame_d
- id: table_de_2014
  statut: lue
  textes:
  - {id: LEGIARTI000029150159, article: "statut national, annexe 3, article 45, I, rédaction du décret n° 2014-698", en_vigueur: 2014-06-28, publie_le: 2014-06-27}
  - {id: LEGIARTI000029150204, article: "même annexe, articles 9-1 et 45, I, rédaction pour les pensions prenant effet au 1er janvier 2017", en_vigueur: 2017-01-01, publie_le: 2014-06-27}
  - {id: LEGIARTI000034764555, article: "même annexe, mêmes articles", en_vigueur: 2018-01-01}
  - {id: LEGIARTI000036755043, article: "même annexe, mêmes articles", en_vigueur: 2018-03-31}
  - {id: LEGIARTI000038189976, article: "même annexe, mêmes articles", en_vigueur: 2019-03-02}
