      même les tables de cinq, huit, onze et quatorze ans ; pour les autres agents, le I
      écrit 167 trimestres des nés du 1er juillet 1959 à 1960, 168 pour 1961 et 1962, 169
      pour 1963, 170 pour 1964 et 1965, 171 pour 1966 et 1967, 172 à compter de 1968 ;
      l'article 9-1 est abrogé
    conditions: >-
      « ces dispositions sont applicables aux pensions prenant effet à compter du 1er
      janvier 2025 » (décret n° 2023-692, article 3, IV), et la durée « pour les assurés
      remplissant les conditions de liquidation de la pension avant le 1er janvier 2025 »
      reste celle d'avant (article 45, I ter) ; la CNIEG publie les mêmes tables, celle de
      l'actif « au titre d'au moins 15 ans de services actifs » (« Tableau des durées
      d'assurance requise à compter du 1er janvier 2025 ») ; la rédaction du 6 août 2025 ne
      change que l'article 1er
  exemples: aucun trouvé
approximations:
- version: calendrier_de_2008
  ecart: >-
    le modèle liquide les pensions du second semestre de 2008 sous la période de 1991 à
    2008, à cent cinquante trimestres, quand l'agent qui a réuni les conditions ce
    semestre-là en doit cent cinquante et un
  effet: >-
    une pension de 0,7 % trop haute au plus, à l'agent qui liquide ce semestre-là avec
    moins de cent cinquante et un trimestres de services
- version: [calendrier_de_2008, table_de_2014, tables_de_2023]
  ecart: >-
    l'agent est présumé en services actifs, de dix-sept ans (`age_ouverture_ieg_actifs`) :
    il lit la durée au mois où son droit s'ouvre et, depuis 2025, la table des dix-sept
    ans ; le sédentaire la lirait, depuis 2017, au mois de ses soixante ans (article 9-1)
    et, depuis 2025, dans la table du I de l'article 45, que le modèle ne transcrit pas ;
    l'agent de cinq à quatorze ans de services actifs, dans la sienne, transcrite et non
    lue
  effet: non mesuré
effet: >-
  La fiche lisait la table commune, suspension de 2026 comprise. Le cas type des
  IEG part à l'âge légal abaissé de cinq ans, celui des dix-sept ans de services
  actifs (2° du I de l'article 16) : il lit désormais leur table, `ieg_actif_17`
  dans `legislation/duree_requise_regimes_speciaux.csv` — 170 trimestres pour les
  nés de 1968 à 1970, 171 pour 1971-1972, 172 à compter de 1973 —, et en deçà la
  table d'avant le décret n° 2023-692. Un agent né en 1968 doit 170 trimestres au
  lieu de 172. Les agents nés avant 1968, qui ont tous ouvert leur droit avant 2025,
  lisent cette table d'avant à la génération qui atteint soixante ans à l'ouverture
  (article 9-1 de l'annexe 3, fiche `regimes_speciaux_par_generation`) : 167
  trimestres pour les nés en 1964, 168 pour 1965 et 1966, 169 pour 1967, au lieu des
  169 de leur génération, et 170 pour 1967, que le modèle leur opposait. Les quatre
  autres tables, de cinq à quatorze ans, sont transcrites sans qu'aucune fiche ne les
  lise.
  La lecture du 22 septembre, qui voulait brancher la table du I, se trompait de
  population : elle est celle des sédentaires.
  Approchée depuis le 29 octobre 2026 : les pensions du second semestre de 2008 gardent
  cent cinquante trimestres, et l'agent est présumé en services actifs.
sources:
  lu_le: 2026-10-29
  prochaine_relecture: 2027-10-29
  a_relire:
  - >-
    Une carrière qui déclarerait moins de dix-sept ans de services actifs devrait lire une
    autre table et partir plus tard : le modèle ne compte pas les années actives aux IEG.
    La table des sédentaires (le I de l'article 45) n'est pas transcrite, ni leur lecture
    de la durée à soixante ans (article 9-1) de 2017 à 2024.
  - >-
    Couper les périodes de `regimes/ieg.yaml` au 1er juillet 2008 (`date_effet`) servirait
    aux pensions du second semestre de 2008 le calendrier de la réforme, et la surcote ;
    celle-ci au taux de 0,75 % que L. 14 du code des pensions écrit jusqu'au 31 décembre
    2008.
  lectures:
  - type: legifrance
    reference: >-
      annexe 3 du statut national des IEG, article 45, I bis, version du 6 août
      2025 (LEGIARTI000052046924) : pour au moins cinq, huit, onze, quatorze et
      dix-sept ans de services effectifs actifs, insalubres et militaires, 170 trimestres
      à compter des générations 1964, 1965, 1966, 1967 et 1968, 171 trois ans plus
      tard, 172 cinq ans plus tard ; « pour ceux nés avant », la durée « applicable
      avant l'entrée en vigueur du décret n° 2023-692 ». Lu dans l'index LEGI du
      dépôt
    date: 2026-09-23
  - type: legifrance
    reference: >-
      même article, version du 3 décembre 2020 (LEGIARTI000042597001), la table
      d'avant le décret n° 2023-692 : 167 trimestres des nés du 1er juillet 1959
      à 1960, 168 pour 1961-1963, 169 pour 1964-1966, 170 pour 1967-1969, 171 pour
      1970-1972, 172 à compter de 1973
    date: 2026-09-23
  - type: autre
    reference: >-
      CNIEG, réglementation, « Tableau des durées d'assurance » applicable à compter
      du 1er janvier 2025, par génération et par motif d'anticipation
    url: >-
      https://www.cnieg.fr/accueil/reglementation/particulier/droit-retraite/calcul/duree-assurance/tableau-duree-assurance.html
    date: 2026-09-22
  - type: legifrance
    reference: >-
      annexe 3 du statut national, ses vingt et une rédactions dans l'index LEGI du dépôt à
      jour de l'incrément du 28 octobre 2026, de 1946 au 6 août 2025, articles 3, 9, 9-1 et
      45 confrontés d'une rédaction à la suivante : la durée ne change qu'au 1er juillet
      2008, au 28 juin 2014, au 1er janvier 2017 (article 9-1) et au 1er janvier 2025
    date: 2026-10-29
  - type: jorf
    reference: >-
      au Journal officiel par l'index JORF du dépôt : décrets n° 2008-69 du 22 janvier 2008
      (article 1er) et n° 2008-627 du 27 juin 2008 (articles 1er et 2) ; décret n° 2011-290
      du 18 mars 2011, articles 3 et 25 ; décret n° 2014-698 du 25 juin 2014, articles 2, 3
      et 5, et sa notice ; décret n° 2023-692 du 28 juillet 2023
    date: 2026-10-29
  - type: autre
    reference: >-
      CNIEG, « Tableau des durées d'assurance requise à compter du 1er janvier 2025 »,
      relu : les assurés qui ouvrent droit à une retraite avant le 1er janvier 2025,
      « quelle que soit leur génération ou le motif de départ, conservent les paramètres de
      calcul applicables jusqu'au 31 décembre 2024 » ; hors anticipation, 169 trimestres en
      1963, 170 en 1964 et 1965, 171 en 1966 et 1967, 172 à compter de 1968 ; pour une
      anticipation de cinq ans, 170 de 1968 à 1970, 171 en 1971 et 1972, 172 à compter de
      1973 ; de même pour quatre, trois, deux et un an
    url: >-
      https://www.cnieg.fr/accueil/reglementation/particulier/droit-retraite/calcul/duree-assurance/tableau-duree-assurance.html
    date: 2026-10-29
historique:
- >-
  2026-10-29 — lue au droit (action 130) : quatre versions sur le mois où le droit
  s'ouvre — les trente-sept annuités et demie de 1946 ; le calendrier de 2008, de 151 à
  166 trimestres ; la table par génération de 2014, depuis juillet 2019, lue depuis 2017 à
  la génération qui a soixante ans à l'ouverture ; les tables par durée de services actifs
  de 2025. Approchée : les pensions du second semestre de 2008, et l'agent présumé actif.
reformes:
- regimes_speciaux_2008
- touraine_2014
- reforme_2023
- lfss_2026_suspension
code:
  moteur: >-
    La période de 2025 et après nomme `ieg_actif_17`, puis `ieg_2014`
    (`duree_requise_table`) : la table des dix-sept ans de services actifs, lue à la
    génération pour qui réunit les conditions à compter de janvier 2025, et en deçà de
    sa première génération la table d'avant le décret n° 2023-692 (`duree_propre`),
    dans `legislation/duree_requise_regimes_speciaux.csv`. Les tables de cinq à
    quatorze ans, `ieg_actif_5` à `ieg_actif_14`, sont transcrites sans qu'aucune période
    ne les nomme.
  python: >-
    droit/ouvrir.py : duree_requise, duree_propre ; scenarios/actuel.py :
    DureesRequisesRegimes, DureesRequisesRegimes.ligne, CalendriersDureeRequise
  javascript: >-
    moteur/js/droit/ouvrir.js : dureeRequise, dureePropre ; moteur/js/regimes.js :
    DureesRequisesRegimes, DureesRequisesRegimes.ligne
  parametres: >-
    contenu.parametres de chaque version : trimestres, pourcentage_maximum, calendrier,
    table_par_generation, age_de_lecture, tables_par_services_actifs, table_des_sedentaires
    ; regimes/ieg.yaml : duree_requise_trimestres, duree_requise_table,
    duree_requise_calendrier, taux_plein ; legislation/duree_requise_regimes_speciaux.csv :
    ieg_actif_5, ieg_actif_8, ieg_actif_11, ieg_actif_14, ieg_actif_17, ieg_2014, depuis,
    generation, trimestres, age_de_lecture ; legislation/duree_requise_calendriers.csv :
    regimes_speciaux_2008
  tests: >-
    tests/test_ieg.py, qui confronte les versions aux données ; tests/test_simulateur.py,
    test_l_agent_des_ieg_qui_ouvre_son_droit_avant_2025_garde_les_regles_d_avant, 170
    trimestres à l'agent né en janvier 1968 ; le cas type des IEG dans les deux moteurs,
    tests/test_cycle_de_vie_script.py ; six des seize témoins des IEG
    (tests/temoins/simulations.json), que le portage rejoue (tests/js/moteur.test.js)
