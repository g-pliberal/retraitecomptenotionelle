schema_version: 1
id: limite_age_ieg
intitule: >-
  L'agent statutaire des industries électriques et gazières est admis d'office à la retraite,
  depuis 1954, à l'âge d'ouverture de sa pension d'ancienneté s'il a vingt-cinq ans de
  services, à l'âge des sédentaires sinon, jusqu'à ce que les employeurs le laissent
  poursuivre, le 28 novembre 2007 ; depuis le 5 juillet 2008, il est mis en inactivité à
  l'initiative de son employeur à soixante-cinq ans, relevés jusqu'à soixante-sept ans pour
  les générations nées depuis 1957, atteints par les nés depuis 1962 ; la limite est reculée
  pour enfants et prolongée pour carrière incomplète, et, depuis le 1er septembre 2023,
  l'agent peut être maintenu en activité jusqu'à soixante-dix ans, qui bornent le tout.
domaine: age
regimes: [ieg]
etape: preparer_la_chronologie
face: droit
etat: approchee
lit:
- le statut d'agent des industries électriques et gazières, quand il route le régime
  spécial ; ses enfants et leurs dates de naissance, pour le recul ; ses services au
  régime, pour la prolongation, et, avant 2008, pour les vingt-cinq ans du décret
  n° 54-50 ; l'aptitude physique n'est pas saisie, et le modèle la présume
ecrit:
- la date de la mise en inactivité par limite d'âge, d'où part la pension du régime
  spécial (`droit/limite_age.py`)
dates_qui_decident:
- age_atteint
