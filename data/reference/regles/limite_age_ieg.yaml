presomptions:
  exceptions_a_la_limite_d_age: >-
    la prolongation pour carrière incomplète et le maintien jusqu'à soixante-dix ans,
    présumés demandés et accordés autant que le départ saisi les demande, l'aptitude
    physique présumée ; la durée manquante se compte, comme celle du fonctionnaire, sur les
    seuls services du régime
approximations:
- version: [decret_de_1954]
  ecart: >-
    l'agent est présumé actif, comme le modèle liquide sa pension : le sédentaire, que la
    saisie ne distingue pas, était admis d'office à soixante ans, et non à cinquante-cinq ;
    ses quinze ans de services actifs (circulaire PERS 70 du 21 mai 1952, que l'arrêt cite)
    sont présumés ; la bonification d'âge de la mère n'avance pas sa limite, pas plus que
    son droit ; ses services militaires, que l'annexe 3 compte, ne comptent pas dans ses
    vingt-cinq ans
  effet: non mesuré
- version: [recommandation_de_2007]
  ecart: >-
    le départ saisi est présumé souhaité, et la recommandation présumée suivie : un agent
    d'EDF qui avait soixante ans en juin 2008 s'est encore vu refuser de poursuivre, sa
    direction s'appuyant sur le décret n° 54-50 (question écrite n° 28700)
  effet: non mesuré
sources:
  lu_le: 2026-10-17
  prochaine_relecture: 2027-10-17
  a_relire:
  - >-
    Le décret n° 54-50 du 16 janvier 1954, au Journal officiel du 17 janvier 1954, que l'index
    ne porte que par son titre : son article 2 n'est lu que dans sa citation par la cour
    d'appel, tronquée, et le reste du décret pas du tout — dont le maintien en activité
    au-delà de soixante ans « afin, par exemple, de les faire bénéficier d'une retraite à taux
    plein », que la question écrite n° 28700 lui prête. Le lire au Journal officiel, sur
    Légifrance ou Gallica, que le réseau de la session refuse.
  - >-
    La recommandation patronale du 28 novembre 2007, qui n'est pas publiée : connue par les
    réponses ministérielles seules.
  - >-
    Depuis 2023, la durée manquante est « la durée d'assurance requise » : le modèle la
    compte, comme avant, sur les seuls services du régime, sans les autres régimes ni les
    bonifications.
  - >-
    La mise en inactivité de l'agent en longue maladie, accidenté, en cessation anticipée
    amiante ou invalide, que la saisie ne connaît pas.
