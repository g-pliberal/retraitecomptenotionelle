historique:
- >-
  2026-10-16 — née et appliquée, action 151, étape 6 : l'agent des industries électriques
  et gazières dont le départ saisi passe sa limite est mis en inactivité à la limite,
  reculée et prolongée, et sa pension du régime spécial en part, comme la décision du
  propriétaire du 14 octobre 2026 le dit du fonctionnaire.
- >-
  2026-10-17 — action 151, étape 9 : avant le 28 novembre 2007, l'agent est admis d'office
  à la retraite à l'ouverture de son droit, cinquante-cinq ans pour l'actif que le modèle
  liquide, s'il a vingt-cinq ans de services, à soixante ans au plus tard (décret n° 54-50,
  article 2) ; du 28 novembre 2007 au 5 juillet 2008, il poursuit s'il le souhaite. Le
  modèle n'opposait aucune limite avant le 5 juillet 2008.
effet: >-
  Tout agent des industries électriques et gazières, affilié au régime spécial, dont le
  départ saisi passe sa limite est mis en inactivité à cette limite, et sa pension du régime
  spécial en part : jusqu'au 27 novembre 2007, à cinquante-cinq ans, ou le jour où il réunit
  vingt-cinq ans de services, soixante ans au plus ; depuis le 5 juillet 2008, à
  soixante-cinq ans — soixante-sept pour les nés depuis 1962, reculés pour enfants,
  prolongés pour carrière incomplète, et soixante-dix depuis le 1er septembre 2023 par le
  maintien présumé. Approchée : le décret de 1954 n'est lu que dans une citation, l'agent y
  est présumé actif, et la durée manquante se compte sur les seuls services du régime.
