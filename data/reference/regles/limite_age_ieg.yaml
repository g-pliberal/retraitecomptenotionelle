- id: decret_de_1954
  statut: supposee
  hypothese: >-
    l'article 2 du décret n° 54-50, dont l'index ne porte que le titre, lu dans sa citation
    par la cour d'appel de Paris, que reproduit l'arrêt de la Cour de cassation du 9 mars
    2016 (n° 14-25.840) : « L'admission à la retraite est prononcée d'office quand
    l'intéressé a atteint l'âge d'ouverture du droit à pension d'ancienneté en ce qui
    concerne les agents ayant accompli la durée des services requise à cette fin par le
    statut national du personnel et en ce qui concerne les agents n'ayant pas atteint l'âge
    d'ouverture du droit à pension d'ancienneté fixé pour les agents appartenant aux services
    sédentaires ». La seconde branche, tronquée, se lit pour l'agent qui n'a pas ces services,
    admis d'office à l'âge des sédentaires. Le Gouvernement décrit des clauses « permettant à
    un employeur de décider la mise à la retraite d'office des agents à la date d'ouverture
    de leurs droits à retraite » (réponses aux questions écrites n° 26598 et 28700, JO AN du
    14 octobre 2008, p. 8831 et 8833)
  fiabilite: moyenne
  textes:
  - {id: JORFTEXT000000302162, article: "décret n° 54-50 du 16 janvier 1954, article 2", en_vigueur: 1954-01-18}
  - {reference: "Cour de cassation, chambre sociale, 9 mars 2016, n° 14-25.840, publié au bulletin : l'article 2 du décret n° 54-50, cité par la cour d'appel de Paris le 24 septembre 2014", lu_le: 2026-10-17}
  - {id: LEGIARTI000006632496, article: "statut national, annexe 3, article 3, § 1, rédaction de 1946", en_vigueur: 1946-06-01}
  - {id: LEGIARTI000019673153, article: "décret n° 2008-1072 du 20 octobre 2008, article 1er, qui abroge le décret n° 54-50", en_vigueur: 2008-10-23}
  bornes:
    age_atteint: [1954-01-18, 2007-11-28]
  contenu:
    parametres:
      limites: {active: 55, sedentaire: 60}
      classe_presumee: active
      services_requis: 25
      a_defaut_des_services: 60
      exceptions: []
    droit: >-
      « Pour avoir droit aux prestations : pension d'ancienneté, un agent doit avoir 55 ans
      d'âge, s'il appartient aux services insalubres ou actifs, 60 ans d'âge, s'il appartient
      aux services sédentaires - et doit totaliser 25 ans de service décomptés conformément
      au paragraphe 5 de l'article 1er de la présente annexe » (annexe 3, article 3, § 1) ;
      l'admission à la retraite est prononcée d'office à cet âge pour l'agent qui a ses
      vingt-cinq ans de services, et à l'âge des sédentaires pour les autres (décret
      n° 54-50, article 2)
    transition: >-
      l'agent est présumé actif, comme le modèle liquide sa pension, ouverte à cinquante-cinq
      ans (`classe_presumee`) ; il est mis en inactivité le premier mois qui suit celui où il
      a son âge et ses vingt-cinq ans de services au régime (`services_requis`), à soixante
      ans au plus tard (`a_defaut_des_services`)
  exemples: aucun trouvé
