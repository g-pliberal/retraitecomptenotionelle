schema_version: 1
id: cnavpl_allocation_avant_2004
intitule: >-
  L'allocation de vieillesse des professions libérales, jusqu'au 31 décembre 2003 : à 65
  ans, ou dès 60 ans, à la cessation de l'activité, affectée des coefficients
  d'anticipation de R. 643-7 — 0,75 à 60 ans, 0,80 à 61, 0,85 à 62, 0,90 à 63, 0,95 à 64
  —, que la durée n'annule pas.
domaine: decote_surcote
regimes: [cnavpl]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- l'âge de l'assuré à l'entrée en jouissance de l'allocation
- la date d'effet de l'allocation, avant le 1er janvier 2004
ecrit:
- >-
  l'âge d'ouverture de la base (60 ans) et le coefficient d'anticipation de
  l'allocation, que `abattement_points` rend à `liquider_chaque_regime`
dates_qui_decident:
- liquidation.date_effet
versions:
- id: avant_le_code
  statut: supposee
  hypothese: >-
    avant le 21 décembre 1985, l'allocation relève des décrets que le code de 1985
    reprend, que l'index LEGI du dépôt ne porte pas : la fiche présume la règle du code
  fiabilite: >-
    faible : rien n'est lu avant la codification de 1985, ni la date à laquelle
    l'anticipation dès soixante ans est née
  bornes:
    liquidation.date_effet: [null, 1985-12-21]
  contenu:
    parametres:
      age_ouverture: 60
      age_taux_plein: 65
      decote_par_trimestre: 0.0125
    droit: celui de la version code_de_1985, présumé
  exemples: aucun trouvé
- id: code_de_1985
  statut: lue
  textes:
  - {id: LEGIARTI000006751830, article: "R. 643-7 CSS", en_vigueur: 1985-12-21}
  - {id: LEGIARTI000006751828, article: "R. 643-6 CSS", en_vigueur: 1985-12-21}
  - {id: LEGIARTI000006743793, article: "L. 643-5 CSS", en_vigueur: 1985-12-21}
  - {id: LEGIARTI000006743786, article: "L. 643-2 CSS", en_vigueur: 1985-12-21}
  nee_de: LEGIARTI000006751830
  bornes:
    liquidation.date_effet: [1985-12-21, 2004-01-01]
  contenu:
    droit: >-
      « L'allocation est liquidée sur demande de l'intéressé. L'entrée en jouissance de
      l'allocation est fixée au premier jour du trimestre civil qui suit cette demande
      sans pouvoir être antérieure au soixante-cinquième anniversaire, ou au soixantième
      au profit des personnes mentionnées au deuxième alinéa de l'article L. 643-2 »
      (R. 643-6) ; « Les assurés peuvent recevoir à partir de l'âge de soixante ans et
      dans les conditions fixées à l'article L. 643-5 une allocation de vieillesse
      calculée conformément aux articles R. 643-10 à R. 643-15 et affectée des
      coefficients d'anticipation déterminés comme suit : 1°) 0,75 si l'allocation est
      attribuée lorsque l'assuré est âgé de soixante ans ; 2°) 0,80 si l'allocation est
      attribuée lorsque l'assuré est âgé de soixante et un ans ; 3°) 0,85 si
      l'allocation est attribuée lorsque l'assuré est âgé de soixante-deux ans ; 4°)
      0,90 si l'allocation est attribuée lorsque l'assuré est âgé de soixante-trois ans
      ; 5°) 0,95 si l'allocation est attribuée lorsque l'assuré est âgé de
      soixante-quatre ans » (R. 643-7) ; « Un décret en Conseil d'Etat fixe l'âge à
      partir duquel l'allocation de vieillesse peut être attribuée avec application de
      coefficients d'anticipation fixés par décret et sous réserve de la cessation de
      l'activité professionnelle libérale au titre de laquelle l'allocation est
      demandée » (L. 643-5)
    parametres:
      age_ouverture: 60
      age_taux_plein: 65
      decote_par_trimestre: 0.0125
    conditions: >-
      la cessation de l'activité libérale (L. 643-5), que le départ déclaré représente ;
      les coefficients ne dépendent que de l'âge, aucune durée ne les annule
  exemples: aucun trouvé
- id: pension_en_points
  statut: lue
  textes:
  - {id: LEGIARTI000006743789, article: "L. 643-3 CSS", en_vigueur: 2004-01-01}
  - id: LEGIARTI000047633290
    article: >-
      R. 643-7 CSS, rédaction du 1er septembre 2023, en vigueur : depuis 2004, l'article
      porte la minoration de la pension en points, et non plus les coefficients de
      l'allocation
    en_vigueur: 2023-09-01
    citation: >-
      « Le coefficient de minoration est égal à 1,25 % par trimestre manquant dans la
      limite de vingt trimestres. »
  nee_de: LEGIARTI000006743789
  bornes:
    liquidation.date_effet: [2004-01-01, null]
  contenu:
    droit: >-
      l'allocation cède la place à la pension en points : « La liquidation de la
      pension prévue à l'article L. 643-1 peut être demandée à partir de l'âge prévu au
      premier alinéa de l'article L. 351-1 » (L. 643-3, I) ; son coefficient est celui de
      la fiche bareme_minoration_regimes_en_points
    parametres:
      age_ouverture: age_legal_de_la_generation
  exemples: aucun trouvé
approximations:
- version: [avant_le_code, code_de_1985]
  textes: R. 643-7 CSS, LEGIARTI000006751830
  ecart: >-
    R. 643-7 compte l'âge en années révolues — « lorsque l'assuré est âgé de soixante
    ans » : 0,75 jusqu'à la veille de ses soixante et un ans ; le modèle compte 1,25 %
    par trimestre manquant avant soixante-cinq ans, arrondi au trimestre supérieur, ce
    qui rend le même coefficient à chaque âge entier et un coefficient plus haut entre
    deux : à 60 ans et 6 mois, 18 trimestres, 0,775, quand le texte dit 0,75
  effet: >-
    au plus trois trimestres, 3,75 % de l'allocation, pour un départ entre deux âges
    entiers ; rien à un âge entier
- version: [avant_le_code, code_de_1985]
  textes: R. 643-6 CSS ; L. 643-2 CSS, deuxième alinéa
  ecart: >-
    l'inapte, le grand invalide, l'ancien déporté ou interné ont l'allocation à
    soixante ans sans coefficient (R. 643-6, L. 643-2) ; les anciens prisonniers de
    guerre, de soixante-cinq à soixante ans selon la captivité (R. 643-9) : le modèle
    ne les sert pas ici, la fiche `inaptitude_au_travail` ne nommant pas la CNAVPL
  effet: non mesuré
- version: [avant_le_code, code_de_1985]
  textes: R. 643-6 CSS
  ecart: >-
    l'entrée en jouissance est « fixée au premier jour du trimestre civil qui suit
    cette demande » ; le modèle la date au premier jour du mois qui suit l'âge
  effet: au plus deux mois d'allocation
- version: pension_en_points
  textes: R. 643-6 CSS
  ecart: >-
    la pension en points entre en jouissance « au premier jour du trimestre civil qui
    suit la demande de l'intéressé » — un 1er janvier, avril, juillet ou octobre ; le
    modèle la date au premier jour du mois qui suit l'âge, comme au régime général.
    Depuis le 5 mars 2023, celle des affiliés de la Cipav est fixée « dans les
    conditions prévues au I de l'article R. 351-37 », au mois : le modèle y est juste.
    La règle est écrite et gardée hors du moteur (action 192, étape 3)
  effet: >-
    un ou deux mois de pension servis trop tôt à deux libéraux sur trois, hors Cipav
    depuis 2023 : le médecin né le 15 janvier 1963, à l'âge légal le 15 octobre 2025,
    est servi au 1er novembre 2025 quand sa base commence le 1er janvier 2026. La règle
    jouée déplace les dates de 87 témoins sur 932, et la pension annuelle de quatre
textes_a_rattacher:
- id: LEGIARTI000047265890
  article: R. 643-6 CSS, rédaction du 5 mars 2023, en vigueur
  en_vigueur: 2023-03-05
  change: >-
    depuis 2004, l'article ne porte plus que la date : « L'entrée en jouissance de la
    pension de retraite est fixée au premier jour du trimestre civil qui suit la demande
    de l'intéressé. » Depuis le 5 mars 2023, « Par dérogation », celle des affiliés de la
    section « mentionnée au 11° de l'article R. 641-1 », la Cipav, « est fixée dans les
    conditions prévues au I de l'article R. 351-37 », au mois. Lue le 12 novembre 2026
    (action 184, étape 6), relue le même jour (action 192, étape 3) : l'écart de date
    est déclaré pour la pension en points, et la règle, écrite, attend hors du moteur ;
    à rattacher à la fiche `cnavpl_entree_en_jouissance` quand elle se publiera
textes_sans_effet:
- id: LEGIARTI000036687904
  article: L. 643-2 CSS, rédaction du 1er septembre 2018, en vigueur
  en_vigueur: 2018-09-01
  motif: >-
    l'article ne porte plus l'allocation à soixante ans de l'inapte et du déporté, que
    la fiche y lit jusqu'en 2003, mais les versements pour la retraite : « Les périodes
    d'études mentionnées au 1° du I de l'article L. 351-14-1 » et les années de moins
    de quatre trimestres, « dans la limite totale de douze trimestres d'assurance »
- id: LEGIARTI000006751836
  article: R. 643-9 CSS, rédaction du 1er janvier 2004, en vigueur
  en_vigueur: 2004-01-01
  motif: >-
    l'article ne porte plus l'âge des anciens prisonniers de guerre, que la fiche y lit
    jusqu'en 2003 : « Il est statué sur l'inaptitude au travail par les sections
    professionnelles suivant les modalités fixées par les statuts » — une procédure
effet: >-
  Tout libéral parti de 60 à 64 ans avant 2004 : le modèle le disait non ouvert à la
  base, qu'il n'ouvrait qu'à 65 ans, et la lui servait pourtant sans coefficient quand
  une complémentaire ouverte à 60 ans ouvrait la liquidation ; il la sert désormais dès
  60 ans, au coefficient de R. 643-7.
sources:
  lu_le: 2026-11-12
  prochaine_relecture: 2027-11-03
  a_relire:
  - >-
    La date d'effet de la pension en points, depuis 2004 : le modèle la date au mois
    quand R. 643-6 la fixe au trimestre civil (approximations). La règle et sa fiche,
    `cnavpl_entree_en_jouissance`, sont écrites et gardées dans
    docs/mesures/192/2026-11-12-etape-3-la-regle-et-ses-tests.txt : publiée seule, elle
    sépare la base des complémentaires datées à part (CARPV, CAVEC, CAVOM, CARPIMKO,
    CPRN), dont la date d'effet n'est pas lue dans les statuts, sauf celle de la
    CARPIMKO de 2026, au trimestre civil elle aussi (règlement, article 7,
    JORFARTI000054435915). Depuis le 14 novembre 2026 (action 130, ligne 12 de la
    file), le moteur sert au trimestre civil les complémentaires de la CAVOM (depuis
    2016), de la CARPIMKO (de 1984 à juin 1987, et depuis le 18 juillet 2026), de la
    CAVP (depuis le 7 juin 2009) et de la CARMF (depuis le 18 juillet 2026), lues dans
    leurs statuts : c'est la base, restée au mois, qui part désormais un ou deux mois
    avant elles. Le correctif gardé ne s'applique plus tel quel — `departs` et la page
    portent déjà le motif `trimestre_civil` —, et l'écart de la CARPIMKO liquidée sans
    sa base, qu'il étendait, est corrigé : elle lit la durée requise de la base. Restent
    à lire la CARPV, la CAVEC et la CPRN.
  - >-
    Lue le 3 novembre 2026 (file L de la vague 6, action 130), quand la base des
    libéraux cessa de s'ouvrir à l'âge de ses complémentaires : elle ne s'ouvrait avant
    2004 qu'à 65 ans dans la fiche du régime. Lire les décrets d'avant la codification
    de 1985, au Journal officiel, pour dater l'anticipation dès soixante ans.
  lectures:
  - type: legifrance
    reference: >-
      R. 643-6 CSS (LEGIARTI000006751828) et R. 643-7 CSS (LEGIARTI000006751830), en
      vigueur du 21 décembre 1985 au 1er janvier 2004, lus dans l'index LEGI du dépôt
    date: 2026-11-03
  - type: legifrance
    reference: >-
      L. 643-2 CSS (LEGIARTI000006743786) et L. 643-5 CSS (LEGIARTI000006743793), même
      période ; R. 643-9 CSS (LEGIARTI000006751835), les anciens prisonniers de guerre
    date: 2026-11-03
  - type: legifrance
    reference: >-
      R. 643-6 CSS, ses rédactions du 1er janvier 2004 (LEGIARTI000006751829) et du 5
      mars 2023 (LEGIARTI000047265890, en vigueur), et leur mot à mot, dans l'index LEGI
      du dépôt ; décret n° 2023-148 du 2 mars 2023, article 1er, 5°
      (JORFARTI000047259558), dont l'article 4 (JORFARTI000047259583) ne diffère que
      d'autres alinéas ; R. 351-37 CSS, I (LEGIARTI000054060160) : « cette date étant
      nécessairement le premier jour d'un mois et ne pouvant être antérieure au dépôt de
      la demande »
    date: 2026-11-12
  - type: autre
    reference: >-
      CARMF, guide « Préparez votre retraite en temps choisi », édition de juin 2026,
      tableau « Dates d'effet de la retraite selon la date de naissance », note 1 : « Les
      retraites étant liquidées au trimestre, elles ne peuvent prendre effet qu'au 1er
      jour du trimestre civil suivant (1er janvier, 1er avril, 1er juillet, 1er
      octobre). » ; « La date d'effet ne peut jamais être antérieure à celle de la
      demande. »
    url: https://www.carmf.fr/doc/documents/guides/guide-retraite.pdf
    date: 2026-11-12
  - type: autre
    reference: >-
      CARPIMKO, « La date de prise d'effet de ma retraite » : « fixée au plus tôt au 1er
      jour du trimestre civil qui suit votre demande » ; « Mme DUPONT, née le 1er
      janvier 1963, [...] son départ en retraite pourra être fixé au plus tôt à partir du
      1er octobre 2025 », un premier jour de mois et de trimestre, qui ne départage pas
      la règle. CARCDSF, « À quel âge demander ses droits » : « La liquidation de vos
      droits prend effet le premier jour du trimestre civil qui suit votre demande
      écrite ». CAVEC, « Faire votre demande de retraite » : « vous pouvez choisir de
      partir le 1er janvier, le 1er avril, le 1er juillet ou le 1er octobre »
    url: >-
      https://www.carpimko.com/je-prepare-ma-retraite/mes-regimes-de-retraite/date-de-ma-retraite
    date: 2026-11-12
code:
  interrupteurs:
    decote_annulee_par_la_duree: false
  moteur: >-
    `decote_annulee_par_la_duree: false` : la durée d'assurance n'annule pas le
    coefficient d'anticipation, que seul l'âge efface, à soixante-cinq ans.
  python: >-
    droit/liquider.py : abattement_points, abattement_regime_de_base, decote_opposable,
    trimestres_de_decote ; droit/ouvrir.py : age_ouverture, age_taux_plein
  javascript: >-
    moteur/js/droit/liquider.js : abattementPoints, abattementRegimeDeBase,
    decoteOpposable, trimestresDeDecote ; moteur/js/droit/ouvrir.js : ageOuverture,
    ageTauxPlein
  parametres: >-
    contenu.parametres de chaque version : age_ouverture, age_taux_plein,
    decote_par_trimestre ; regimes/cnavpl.yaml : age_ouverture, age_taux_plein,
    decote_par_trimestre
  tests: [tests/test_ouverture_des_liberaux.py]
historique:
- >-
  2026-11-03 — née, lue : l'allocation d'avant 2004 dès soixante ans, minorée (R. 643-7).
- >-
  2026-11-12 — l'écart de date d'effet déclaré pour la pension en points (R. 643-6),
  avec ses lectures ; la règle, écrite, reste hors du moteur (action 192, étape 3).
