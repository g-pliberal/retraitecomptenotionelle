schema_version: 1
id: fin_indemnisation_chomage
intitule: >-
  Le chômage cesse d'être indemnisé quand l'allocataire atteint l'âge d'annulation de la
  décote, et depuis le 1er avril 1983 quand il a l'âge légal et la durée requise pour le
  taux plein : les années qui commencent après ne valent ni trimestre assimilé, ni point
  complémentaire, ni versement au compte.
domaine: periodes_assimilees
regimes: [regime_general, msa_salaries, arrco, arrco_tranche_2,
  arrco_tranche_2_entreprises_nouvelles, agirc, agirc_entreprises_nouvelles, agirc_arrco,
  ircantec]
etape: compter_les_durees
face: droit
etat: approchee
lit:
- >-
  les années de chômage d'assurance, de solidarité ou de préretraite du FNE
  (`chomage_indemnise`, `chomage_solidarite`, `preretraite_fne`)
- l'âge légal, la durée requise et l'âge d'annulation de la décote de la génération
- la durée d'assurance acquise année par année, majoration pour enfants comprise
- legislation/chomage_complementaires.yaml (`fin_indemnisation`)
ecrit:
- >-
  la carrière que le relevé lit, dont les années de chômage d'après la coupure sont sans
  activité ; les comptes notionnels et la proposition partent de la même
dates_qui_decident:
- revenu.annee
versions:
- id: soixante_cinq_ans_jusqu_en_mars_1983
  statut: lue
  textes:
  - id: LEGIARTI000006809675
    reference: code du travail, article R. 351-3, rédaction du 23 novembre 1973
    citation: >-
      ne peuvent bénéficier des allocations d'aide publique « Les personnes âgées de plus de
      soixante-cinq ans ou qui se trouvent privées de travail en raison de leur inaptitude
      physique à l'exercice d'un emploi »
    en_vigueur: 1973-11-23
    lu_le: 2026-10-03
  - id: LEGIARTI000006809121
    reference: code du travail, article R. 322-7, rédaction du 23 novembre 1973
    citation: >-
      « L'allocation spéciale est servie jusqu'à la liquidation des prestations de
      vieillesse et au plus tard jusqu'à soixante-cinq ans et trois mois. »
    en_vigueur: 1973-11-23
    lu_le: 2026-10-03
  - id: JORFTEXT000000842986
    reference: >-
      arrêté du 29 avril 1983 portant agrément de la délibération n° 11-D prise à la suite
