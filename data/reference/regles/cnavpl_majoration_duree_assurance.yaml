  exemples: aucun trouvé
approximations:
- version: avant_2010
  ecart: >-
    les périodes de la CNAVPL déclarent `mda` à l'année, depuis celle de 2010 : une
    pension qui prend effet de janvier à mars 2010 reçoit les trimestres que L. 643-1-1
    ne donne qu'à compter du 1er avril
  effet: >-
    seize trimestres de plus pour une libérale née en 1949, mère de deux enfants, partie
    en février 2010 (164 au lieu de 148), et une pension de base de 8 258 € au lieu de
    6 239 €, 32 % de plus : un coefficient de surcote de 1,0225 au lieu d'une décote de
    0,7725
- version: [l_351_4_a_351_4_2, loi_de_2023]
  ecart: >-
    la majoration de l'enfant handicapé (L. 351-4-1) et celle de l'aidant d'un adulte
    handicapé (L. 351-4-2) ne sont pas servies : la carrière ne saisit ni le handicap
    d'un enfant ni la prise en charge d'un adulte
  effet: non mesuré
- version: loi_de_2023
  ecart: >-
    les périodes de la CNAVPL ne déclarent la surcote parentale qu'à compter de 2024,
    quand elle vaut pour les pensions qui prennent effet depuis le 1er septembre 2023
  effet: >-
    nul : aucune pension de 2023 n'a d'âge de L. 161-17-2 égal ou supérieur à
    soixante-trois ans
effet: >-
  La fiche les disait non portés, et le moteur ne cherchait la majoration de durée
  que dans les régimes en annuités : une libérale qui n'avait cotisé qu'à sa section
  perdait jusqu'à 1,25 % de sa pension par trimestre que la loi lui donne. Depuis
  le 23 septembre 2026, `mda` sur les périodes de la CNAVPL depuis 2010, lu dans
  toute fiche qui le porte — les bonifications restant aux annuités —, et `surcote_parentale`
  depuis 2024 ; tenu par tests/test_sections_liberales.py et le témoin `enfants_liberale`.
  Approximation : la maille est l'année. Lue au droit le 29 octobre 2026, elle ne prive
  pas les pensions d'avril à décembre 2010, comme elle le disait : elle donne la
  majoration à celles de janvier à mars, que le texte en exclut.
sources:
  lu_le: 2026-10-29
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Les cent points du trimestre civil d'un accouchement (L. 643-1, troisième alinéa ;
    D. 643-1 : depuis 2004, sans porter les points de l'année au-delà de 550 depuis le 1er
    mars 2012, de 582 depuis 2025), que le modèle ne sert pas quoiqu'il connaisse
    désormais les naissances : aucune fiche ne les porte.
  - >-
    Couper les périodes de la CNAVPL au 1er avril 2010 et au 1er septembre 2023 par leur
    `date_effet`, qui ôterait les deux décalages de la maille annuelle ; à mener avec la
    fiche de la surcote, que R. 643-8 change à la même date (« Conformément au II de
    l'article 7 du décret n° 2023-799 [...] aux pensions prenant effet à compter du 1er
    septembre 2023 ») et que la période de 2024 porte de 0,75 % à 1,25 %, et avec la
    majoration de L. 351-12 (fiche `majoration_enfants_liberaux_avocats`).
  lectures:
  - type: legifrance
    reference: >-
      L. 643-1-1 dans ses versions de 2009 et de 2023, et L. 643-3 dans sa version
      de 2023, lus dans l'index LEGI du dépôt.
    date: 2026-09-23
  - type: autre
    reference: >-
      CNAVPL, page « Comprendre sa retraite » et guide 2026, partie 1 : trimestres
      pour enfants et surcote parentale ; CAVAMAC, page « Le calcul de ma pension
      », qui la décrit pour « les générations nées à partir du 1er avril 1965 ».
    url: https://www.cnavpl.fr/comprendre-sa-retraite/
    date: 2026-09-23
  - type: legifrance
    reference: >-
      L. 643-1-1 dans ses quatre rédactions — L. 351-4 en 2009, L. 351-4 et L. 351-4-1 le
      11 novembre 2010, L. 351-4 à L. 351-4-2 le 22 janvier 2014, et L. 351-12 le 1er
      septembre 2023 —, L. 643-3 de 2023 et de 2025, et ses six autres pour ce qu'elles
      disent des enfants, D. 643-2 depuis 2004, dans l'index LEGI du dépôt à jour de
      l'incrément du 28 octobre 2026 ; le décret n° 2012-138, articles 3 et 4, au Journal
      officiel du 31 janvier 2012 par l'index JORF du dépôt
    date: 2026-10-29
  - type: autre
    reference: >-
      CNAVPL, « Comprendre sa retraite », relue : « Trimestres pour enfants », quatre
      trimestres de maternité, d'adoption et d'éducation par enfant ; « Une augmentation
      de 10 % de la pension est accordée aux parents d'au moins 3 enfants. Cette
      majoration de pension concerne les pensions prenant effet à partir du 1er septembre
      2023 » (copie datée,
      sha256:95559a0897456b5bc23a3948c92a848bb9e49ec9408f3e00913be574c690c925)
    url: https://www.cnavpl.fr/comprendre-sa-retraite/
    date: 2026-10-29
historique:
- >-
  2026-10-29 — lue au droit (action 130) : quatre versions sur la date d'effet — rien avant
  le 1er avril 2010 ; L. 351-4 ; L. 351-4 à L. 351-4-2 à compter du 11 novembre 2010 ;
  L. 351-12 et la surcote parentale pour les pensions depuis le 1er septembre 2023. La
  fiche se trompait de date pour L. 351-4-1 et L. 351-4-2, qu'elle disait de 2023, et de
  sens pour la maille annuelle de 2010.
reformes:
- cnavpl_mda_2010
- majoration_enfants_liberaux_2023
code:
  moteur: >-
    Les périodes de la CNAVPL déclarent `mda` depuis 2010 et `surcote_parentale` depuis
    2024. `majoration_pour_enfants` cherche la majoration de durée dans toute période
    qui déclare `mda`, en points comme en annuités, et les bonifications aux seules
    annuités : la libérale qui n'a cotisé qu'à sa section reçoit les trimestres de ses
    enfants (fiche `majoration_duree_assurance_enfants`), que sa durée d'assurance
    compte. `trimestres_de_surcote_parentale` lui compte ceux de la surcote parentale
    (`SurcoteParentale`), que `completer` sert sur sa pension d'avant la surcote, dans
    le coefficient de sa surcote.
  python: >-
    droit/compter.py : majoration_pour_enfants ; droit/completer.py :
    trimestres_de_surcote_parentale, completer ; scenarios/actuel.py : SurcoteParentale,
    SurcoteParentale.parametres
  javascript: >-
    moteur/js/droit/compter.js : majorationPourEnfants ; moteur/js/droit/completer.js :
    trimestresDeSurcoteParentale, completer ; moteur/js/regimes.js : SurcoteParentale,
    SurcoteParentale.parametres
  parametres: >-
    regimes/cnavpl.yaml : avantages_non_contributifs ; legislation/surcote_parentale.csv
    : age_ouverture, taux_par_trimestre, trimestres_maximum
  tests:
  - tests/test_sections_liberales.py
  - tests/test_simulateur.py
  - >-
    tests/test_coupures_au_mois.py, qui confronte les deux moteurs sur des carrières qui
    les portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    enfants_liberale, seul témoin qui change sans elles
