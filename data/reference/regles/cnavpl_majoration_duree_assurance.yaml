schema_version: 1
id: cnavpl_majoration_duree_assurance
intitule: >-
  Régime de base des professions libérales : majoration de durée d'assurance pour
  enfants de L. 351-4 pour les pensions prenant effet depuis le 1er avril 2010 (L.
  643-1-1), étendue à celle de l'enfant handicapé (L. 351-4-1) le 11 novembre 2010, à
  celle de l'aidant d'un adulte handicapé (L. 351-4-2) le 22 janvier 2014, et à la
  majoration de pension de L. 351-12 pour les pensions prenant effet depuis le 1er
  septembre 2023 ; surcote parentale pour les mêmes pensions (I de L. 643-3).
domaine: enfants
regimes: [cnavpl]
etape: compter_les_durees
face: droit
etat: approchee
lit:
- la date d'effet de la pension, au mois
- le sexe de l'assurée, ses enfants et leurs dates de naissance
- >-
  les régimes de base où elle a validé des trimestres, pour la priorité entre régimes
  (fiche `priorite_majorations_enfants`)
ecrit:
- >-
  les trimestres de majoration de durée d'assurance de chaque enfant, portés au régime de
  base des libéraux quand la priorité le désigne (`majoration_pour_enfants`), que sa
  durée d'assurance compte
- >-
  depuis le 1er septembre 2023, les trimestres de la surcote parentale
  (`trimestres_de_surcote_parentale`)
dates_qui_decident:
- liquidation.date_effet
