    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2017_01_13012017_fiche_3_22.pdf
    date: 2017-01-13
  - type: circulaire_cnav
    reference: >-
      circulaire carrière Cnav n° 2017-01 du 13 janvier 2017, fiche 3.23, « Périodes
      assimilées : les périodes de volontariat international en entreprise ou en
      administration », points 1 à 6, dont le tableau de la prise en compte (point 5)
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2017_01_13012017_fiche_3_23.pdf
    date: 2017-01-13
historique:
- >-
  2026-10-20 — née de la veille du 20 octobre 2026 : le journal du 19 octobre 2026 (action
  89) disait du volontariat international que « le dépôt ne dit rien » et le laissait à la
  session de D. 351-1-2 ; la fiche porte la règle, que le modèle ne sert pas encore.
effet: >-
  Tout assuré qui a accompli un volontariat civil, depuis le 15 mars 2000, ou un
  volontariat international en entreprise ou en administration, d'au moins six mois : un
  trimestre de durée d'assurance par quatre-vingt-dix jours, soit quatre pour un an et huit
  pour deux ans, qui relèvent le taux et la proratisation de qui n'a pas la durée requise ;
  aucun pour la carrière longue, la surcote ou le minimum contributif majoré. Le modèle ne
  le connaît pas.
