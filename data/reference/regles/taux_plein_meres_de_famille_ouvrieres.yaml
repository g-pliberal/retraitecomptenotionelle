historique:
- >-
  2026-10-08 — écrite à l'étape 17 de l'action 138, sur le point d'OpenFisca-France-Pension
  au registre (chantier 138.17) et la liste de la fiche decote_avant_1983.
effet: >-
  La mère de trois enfants qui a trente ans d'assurance, majoration comprise, et a été
  ouvrière cinq des quinze dernières années, a le taux plein sans la durée requise : avant
  1983 dès soixante ans, depuis dès l'âge légal ; sa complémentaire, sans coefficient.
