      décret n° 45-0179, article 70-2 (LEGIARTI000006760658, 1978-03-16 → 1982-07-23) ;
      L. 351-8, 4°, de 1985 à 2025, sans changement ; R. 351-23 (LEGIARTI000006749363,
      depuis 1985), en vigueur ; lus dans l'index LEGI le 8 octobre 2026
    date: 2025-02-28
  - type: circulaire_cnav
    reference: >-
      circulaire ministérielle n° 21 SS du 21 mai 1976 : la loi, « dont la date d'effet est
      fixée au 1er juillet 1976 » ; « Pour les ouvrières mères de famille, la durée
