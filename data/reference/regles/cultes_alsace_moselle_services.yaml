historique:
- >-
  2026-11-24 — née de la fiche cultes_alsace_moselle_pension, qui citait l'ordonnance du
  16 mars 1910 sans en avoir lu le texte.
effet: >-
  Le taux de la pension de chaque ministre des cultes d'Alsace-Moselle : chaque année
  entière de service en plus ajoute 1/60 de ses émoluments jusqu'à trente ans, 1/120
  au-delà.
