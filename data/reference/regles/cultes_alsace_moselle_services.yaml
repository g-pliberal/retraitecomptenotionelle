textes_a_relire:
- reference: loi du 31 mars 1873, articles 45 à 52, même recueil, pages 13 et 14
  question: >-
    valent-ils pour les ministres, l'article 10 renvoyant le décompte à l'ordonnance du
    16 mars 1910 : rien avant dix-huit ans (article 48), l'année de guerre en plus
    (article 49), les services hors d'Europe comptés double (article 51) ?
