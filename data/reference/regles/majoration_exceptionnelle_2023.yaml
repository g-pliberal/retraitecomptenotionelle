approximations:
- ecart: >-
    la comparaison écarte la surcote des seules pensions qui portent le minimum
    contributif ; celle d'une autre pension de base, de la fonction publique par
    exemple, reste dans le total tous régimes
  effet: non mesuré
- ecart: >-
    la révision ne suit que les pensions françaises qui commencent après le 1er
    septembre 2023 parmi celles que les départs liquident ; la seconde pension de qui
    retravaille, et une pension modifiée après coup, dont le minimum contributif que
    révise une pension étrangère, ne la révisent pas
  effet: non mesuré
- ecart: >-
    aux cultes, la durée cotisée et la durée validée sont celles d'après 1997, que le
    minimum contributif lit
  regime: cavimac
  effet: non mesuré
- ecart: >-
    une pension prise avant le 1er avril 1983, que le minimum contributif ne regardait
    pas encore, n'est pas majorée
  effet: non mesuré
