historique:
- >-
  2026-10-08 — servie, à l'étape 138.17 : la règle que TRAJECTOiRE portait et que le
  dépôt ignorait (registre des autres modèles, chantier 138.17).
reformes: [reforme_2023]
exemples: []
effet: >-
  Les retraités du régime général, des indépendants, des salariés agricoles et des
  cultes partis avant le 1er septembre 2023 au taux plein avec cent vingt trimestres
  cotisés, dont la pension de base reste sous 847,57 € par mois : jusqu'à 100 € par
  mois de plus depuis septembre 2023, revalorisés depuis.
referents:
  trajectoire:
    equivalent: >-
      revaloMicoStockEic et revaloMicoStockEir (R/fonctionsCalculsPensions.R), sur la
      chronique des pensions servies
    confrontation: >-
      TRAJECTOiRE recalcule le minimum contributif de septembre 2023 aux montants
      relevés et ne garde que la hausse du minimum majoré, bornée à 100 € par personne
      ; la loi majore toute pension au taux plein, portée ou non au minimum, de 100 €
      au prorata de la durée cotisée dans le régime, sous un plafond au prorata de sa
      durée validée, puis sous celui de L. 173-2
