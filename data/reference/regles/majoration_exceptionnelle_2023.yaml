schema_version: 1
id: majoration_exceptionnelle_2023
intitule: >-
  Les pensions de base du régime général, des régimes qu'il a intégrés, des salariés
  agricoles et des cultes qui ont pris effet avant le 1er septembre 2023, liquidées au
  taux plein, sont majorées depuis cette date, quand l'assuré a cotisé cent vingt
  trimestres tous régimes, de 100 € par mois au prorata de la durée cotisée dans le
  régime, sous un plafond de 847,57 € au prorata de la durée validée que la pension
  du régime ne dépasse pas avec elle, et sous le plafond du minimum contributif que
  toutes les pensions ne dépassent pas avec elle ; elle suit ensuite les pensions.
domaine: minima
regimes: [regime_general, rsi, cancava, organic, msa_salaries, cavimac]
etape: faire_vivre
face: droit
etat: approchee
lit:
- la pension de chaque régime qui porte le minimum contributif, menée au mois où la
  majoration est due, minimum contributif et majoration pour enfants compris, sa
  surcote exclue, et son taux plein
- la durée cotisée et la durée validée dans le régime, la durée d'assurance maximum de
  la génération et les trimestres cotisés tous régimes, français et étrangers
- toutes les pensions françaises, de base et complémentaires, servies ce mois-là, et le
  plafond de l'article L. 173-2 (legislation/minimum_contributif.csv)
ecrit:
- la majoration de chaque régime, théorique, retenue sous le plafond du régime, servie
  sous le plafond tous régimes, puis menée à l'échéance
dates_qui_decident:
- liquidation.date_effet
versions:
- id: pensions_d_avant_septembre_2023
  statut: lue
  textes:
  - id: LEGIARTI000047447828
    article: loi n° 2023-270 du 14 avril 2023, article 18, V
    en_vigueur: 2023-04-16
    citation: >-
      « Les pensions de vieillesse personnelles de base du régime général de sécurité
      sociale, y compris les pensions servies aux personnes relevant, à la date de
      prise d'effet de leur pension, d'un régime ultérieurement intégré au régime
      général, ainsi que les pensions du régime des salariés agricoles ayant pris effet
      avant le 31 août 2023 sont assorties d'une majoration, dont le montant est défini
      par décret » ; « La somme de la pension du régime de base concerné et de la
      majoration [...] ne peut pas excéder un plafond fixé par décret et réduit, le cas
      échéant, en fonction du nombre de trimestres d'assurance validés par l'assuré
      dans le régime concerné » ; « La majoration prévue au présent V est due à
      compter du 1er septembre 2023 »
    lu_le: 2026-10-08
  - id: JORFARTI000047956556
    article: décret n° 2023-754 du 10 août 2023, article 3
    publie_le: 2023-08-11
    en_vigueur: 2023-09-01
    citation: >-
      « Le montant prévu au premier alinéa du V de l'article 18 de la loi du 14 avril
      2023 susvisée est fixé à 1 200 euros par an. La durée prévue au 2° du même V est
      fixée à 120 trimestres. Le plafond prévu au cinquième alinéa du même V est fixé à
      10 170,86 euros par an » ; « chaque régime concerné impute le dépassement [...]
      sur la majoration dont il est redevable, à due concurrence du rapport [...] entre
      le montant de cette majoration et le total des majorations dues par les régimes
      en cause » ; « La majoration [...] est révisée lorsque le montant des avantages
      personnels de retraite a varié »
    lu_le: 2026-10-08
  bornes:
    liquidation.date_effet: [null, 2023-09-01]
  contenu:
    droit: >-
      depuis le 1er septembre 2023, 1 200 € par an au prorata de la durée cotisée dans
      le régime sur la durée maximum de la génération, à qui a liquidé au taux plein et
      cotisé cent vingt trimestres tous régimes ; la pension du régime ne dépasse pas
      avec elle 10 170,86 € par an au prorata de sa durée validée, toutes les pensions
      françaises le plafond de L. 173-2 ; revalorisée ensuite comme les pensions
      (L. 161-23-1)
    parametres:
      existe: true
      due_le: "2023-09-01"
      montant: 1200.0
      trimestres_cotises: 120
      plafond: 10170.86
  unites:
    arrondi: >-
      en euros par mois, chaque montant tronqué au centime, sans arrondi (circulaire
      Cnav n° 2023-21, 3.1, 3.2.2, 3.2.5 et 3.3.4)
  exemples: [cnav_2023_21_majoration_liquidation_unique]
