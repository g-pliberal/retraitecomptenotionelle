schema_version: 1
id: services_passes_outre_mer
intitule: >-
  Les années d'un salarié de Nouvelle-Calédonie antérieures au 1er janvier 1995, et celle
  d'un salarié de Saint-Pierre-et-Miquelon antérieure au 1er janvier 1988, dates où l'Arrco
  y devient obligatoire, sont des services passés : l'institution les valide sans
  cotisation, à une pension prise depuis, quand le régime de base local les reconnaît ; le
  compte notionnel, qui ne porte que ce qui a été versé, n'en porte rien.
domaine: periodes_assimilees
regimes: [arrco, arrco_tranche_2, unirs]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- le statut de l'année — salarié de Nouvelle-Calédonie ou de Saint-Pierre-et-Miquelon — et
  la date d'effet de la pension
- le salaire de l'année, les taux et le prix d'achat du point d'une année cotisée
- legislation/affiliations.yaml (`services_passes` des périodes des deux statuts)
ecrit:
- au scénario 1, les points Arrco ou UNIRS de l'année, ceux d'une année cotisée
- au compte notionnel, rien
dates_qui_decident:
- revenu.annee
- liquidation.date_effet
