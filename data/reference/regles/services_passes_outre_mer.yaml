code:
  python:
  - carriere.py, Affiliations.services_passes
  - droit/acquerir.py, acquerir (pension prise avant la généralisation, fiabilité estimée)
  - moteur/compte.py, ConstructeurCompte._cotisation_ligne
  javascript:
  - regimes.js, Affiliations.servicesPasses
  - droit/acquerir.js
  - compte.js, cotisationLigne
  parametres:
  - legislation/affiliations.yaml (salarie_nouvelle_caledonie,
    salarie_saint_pierre_et_miquelon)
  tests:
  - tests/test_services_passes.py
  - témoins chomage_et_services_passes_caledoniens, chomage_saint_pierre_et_miquelon, et
    le balayage des deux statuts
effet: >-
  Les salariés de Nouvelle-Calédonie, et d'un an ceux de Saint-Pierre-et-Miquelon. Le
  compte notionnel du salarié calédonien ne porte plus d'Arrco avant 1995, quand il en
  portait les cotisations depuis 1961 ; sa pension du scénario 1 garde ces points, sauf
  prise avant 1995, où le modèle lui servait une Arrco qui n'existait pas.
