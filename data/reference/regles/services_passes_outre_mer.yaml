approximations:
- version: [saint_pierre_et_miquelon_depuis_1988, nouvelle_caledonie_depuis_1995]
  ecart: >-
    Les points d'un service passé sont ceux d'une année cotisée de métropole : le salaire
    de l'année, le taux et le prix d'achat du point de l'année — 2,5 % de cotisation de 1961
    à 1966, l'équivalent de 4 % de taux contractuel ensuite. Le droit calcule ceux de
    Nouvelle-Calédonie selon les « opérations supplémentaires » d'avant 1992, au taux de
    l'adhésion — 4 % en 1995, 4,5 % en 1996 —, à 100 % pour les salariés en activité si leur
    âge moyen ne passe pas cinquante-deux ans, selon une pesée démographique globale pour les
    anciens salariés et les retraités : le modèle valide tout à 100 %. Les années accomplies
    entre seize et vingt et un ans, que l'Arrco valide à 75 %, comptent entières.
  effet: non mesuré
- version: [avant_les_generalisations, saint_pierre_et_miquelon_depuis_1988]
  ecart: >-
    Une pension calédonienne prise avant 1995 n'a aucun point Arrco : le modèle calcule la
    pension à sa date d'effet, et ne porte pas la révision qui a servi aux retraités, à la
    généralisation, les droits de leurs services passés au taux de la pesée globale (accord
    du 29 août 1994, art. 6).
  effet: non mesuré
- version: [avant_les_generalisations, saint_pierre_et_miquelon_depuis_1988,
    nouvelle_caledonie_depuis_1995]
  ecart: >-
    Le modèle ne connaît pas l'employeur. Les entreprises calédoniennes déjà adhérentes
    avant 1995 par la caisse de leur siège en métropole (accord du 29 août 1994, art. 4),
    les professions de Saint-Pierre-et-Miquelon couvertes avant 1988 par avenant (guide,
    II.3), cotisaient : leurs années passent pour des services passés. Les années comptent
    depuis 1958, sans lire ce que la CAFAT reconnaît. Les services passés des cadres à
    l'Agirc, antérieurs au 1er janvier 1984 seulement en Nouvelle-Calédonie (guide,
    II.4.2.1.3), sont hors du modèle, qui n'y connaît pas de cadre. La cascade des avantages
    ne les isole pas : ils y comptent comme des points cotisés.
  effet: non mesuré
