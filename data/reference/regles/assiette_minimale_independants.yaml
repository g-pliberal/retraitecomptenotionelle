schema_version: 1
id: assiette_minimale_independants
intitule: >-
  Assiette minimale de la cotisation de base des artisans, commerçants et libéraux
  : 200 SMIC horaires jusqu'en 2011, 5,25 %, 7,70 % puis 11,5 % du plafond, 450
  SMIC horaires depuis 2023, sous condition de 90 jours d'affiliation depuis 2012
  ; le micro-entrepreneur n'y est pas soumis. Sauf demande contraire, en sont
  dispensés depuis 2016 le bénéficiaire du RSA ou de la prime d'activité, depuis
  2020 l'activité accessoire saisonnière (L. 613-11), et, de 2004 à 2015, le
  libéral dont l'activité n'est pas principale ou déjà pensionné (D. 642-4).
regimes: [cancava, carpimko_complementaire, cavom_complementaire, cnavpl, organic,
  regime_general, rsi]
etat: approchee
etape: acquerir_les_droits
effet: >-
  Un indépendant à 3 000 € validait un trimestre au lieu de trois et n'avait ni
  le salaire ni les points du minimum. Dispensé, au RSA par exemple, il cotise sur
  son seul revenu : une artisane née en 1962, à 3 000 € par an de 1990 à 2025,
  valide 59 trimestres au lieu de 75, et son régime général sert 684 € au lieu de
  999 € ; une infirmière libérale, 2 444 € de CNAVPL au lieu de 2 582 €, et sa
  CARPIMKO perd le demi-plafond de 2026. Avant 1985 le dépôt ne connaît aucun
  texte.
sources:
  lu_le: 2026-10-16
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Lire les versions de D. 633-2 antérieures à 1985 dans le JORF : la caisse
    applique depuis 1973 une assiette de 200 heures du Smic (barème « Assiette
    annuelle minimale des cotisations des travailleurs indépendants », lu le 30
    octobre 2026), que la série ne porte pas.
  - >-
    Un exemple chiffré de l'Urssaf d'un indépendant au RSA ou saisonnier (urssaf.fr,
    refusé au réseau de la session le 16 octobre 2026) ; si la dispense des
    activités saisonnières vaut dès les cotisations de 2019, que la loi
    n° 2019-1446 ne date pas, et ce qu'aucun décret ne définit de l'« activité
    accessoire saisonnière ».
  lectures:
  - type: legifrance
    reference: >-
      D. 633-2 et D. 642-4, toutes les versions de l'index LEGI, lues le 22 septembre
      2026
    date: 2026-09-22
  - type: autre
    reference: >-
      calculette de la CARPIMKO : 63,3 points CNAVPL et trois trimestres pour 3
      000 € de revenu, soit l'assiette de 5 409 €
    url: https://www.carpimko.com/
    date: 2026-09-22
  - type: legifrance
    reference: >-
      L. 131-6-3 (LEGIARTI000031675836, 2016 ; LEGIARTI000033713969, 2017), L. 613-9
      (LEGIARTI000036391156, 2018), L. 613-11 (LEGIARTI000037051811,
      LEGIARTI000041394691) : « Sauf demande contraire [...], les montants minimaux
      de cotisations [...] ne sont pas applicables [...] aux cotisations [...] dues
      par les personnes mentionnées à l'article L. 262-2 du code de l'action sociale
      et des familles et à l'article L. 842-1 », et depuis le 28 décembre 2019 « au
      titre des activités accessoires saisonnières qu'elles exercent » ; D. 613-7
      (LEGIARTI000041967556), la demande contraire avant le 31 octobre de l'année
      d'avant ; D. 642-4 de 2004 à 2015, l'activité non principale et le pensionné.
      Index LEGI à jour du 15 octobre 2026, lu le 16
    date: 2026-10-16
  - type: legifrance
    reference: >-
      loi n° 2015-1702, article 21 (JORFARTI000031663570), « aux périodes courant à
      compter du 1er janvier 2016 » ; loi n° 2019-1446, article 10
      (JORFARTI000039675367), sans date d'effet propre
    date: 2026-10-16
  - type: autre
    reference: >-
      Bpifrance Création, « Cotisations minimales dues par les travailleurs
      indépendants » (2023, chiffres de 2026) : « les cotisations minimales ne
      s'appliquent pas aux personnes bénéficiaires du RSA ou de la prime d'activité
      », « sauf demande contraire » ; dues « même s'ils sont par ailleurs salariés
      ou retraités »
    url: https://bpifrance-creation.fr/boiteaoutils/cotisations-minimales-dues-travailleurs-independants-2023
    date: 2026-10-16
  - type: autre
    reference: >-
      barème de la Cnav « Assiette annuelle minimale des cotisations des travailleurs
      indépendants » (ti_cotisation_assiette_minimale_cotisation_bar, version du 23
      décembre 2025) et la table de l'ex-RSI qu'il joint, de 1973 à 2026, que
      tests/test_cnav_baremes.py confronte à la série (action 175, étape 2)
    url: https://legislation.lassuranceretraite.fr/
    date: 2026-10-30
  - type: jorf
    reference: >-
      décret n° 2022-1438 du 16 novembre 2022, article 1er (JORFARTI000046566175) :
      « Par dérogation aux articles D. 633-2 et D. 642-4 [...], la cotisation annuelle
      due au titre de l'année 2022 [...] ne peut être calculée sur une assiette
      inférieure à 4 758 euros ». Index JORF du dépôt, lu le 30 octobre 2026
    date: 2026-10-30
textes_a_rattacher:
- reference: >-
    code de la sécurité sociale, D. 633-2 (LEGIARTI000006737877 à LEGIARTI000048838330)
- reference: >-
    code de la sécurité sociale, D. 642-4 (LEGIARTI000006738120 à LEGIARTI000048838321)
- reference: décret n° 2023-1352 du 29 décembre 2023
- reference: décret n° 2022-1438 du 16 novembre 2022, article 1er (JORFARTI000046566175)
- reference: >-
    code de la sécurité sociale, L. 131-6-3 puis L. 613-9 puis L. 613-11
    (LEGIARTI000031675836 à LEGIARTI000041394691), et D. 613-7 (LEGIARTI000041967556)
- reference: >-
    loi n° 2015-1702 du 21 décembre 2015, article 21 ; loi n° 2019-1446 du 24
    décembre 2019, article 10
approximations:
- ecart: >-
    Les dispenses (`legislation/dispenses_assiette_minimale.yaml`) se déclarent ligne
    par ligne sur le relevé (`dispense_assiette_minimale`), et, sur le site, par
    années entières (champ « Dispenses de l'assiette minimale », `dispenses`) : toutes
    les activités d'une année dispensée portent son motif, si bien que l'indépendant
    qui en exerce deux la même année, dont une seule est accessoire saisonnière, les
    voit dispensées toutes deux. La dispense des activités saisonnières court des
    cotisations de 2020, faute de date dans la loi.
  effet: >-
    non mesuré sur la population ; pour une carrière de 3 000 € par an, 16 trimestres
    sur 36 ans et un tiers du régime de base, voir `effet`
- ecart: >-
    En 2022, le décret n° 2022-1438 fixe l'assiette minimale de l'artisan, du
    commerçant et du libéral à 4 758 €, de quoi valider trois trimestres ; la série
    garde 11,5 % du plafond, 4 731 €, qui n'en valident que deux. Avant 1985, la
    caisse applique 200 heures du Smic depuis 1973, que la série ne porte pas : le
    modèle n'y connaît aucun minimum. Deux écarts que tests/test_cnav_baremes.py
    déclare, à corriger par la session du modèle, les deux moteurs ensemble.
  effet: >-
    un trimestre de moins en 2022 pour l'indépendant au minimum ; avant 1985, pour
    celui qui déclarait moins de 200 heures du Smic, les trimestres et le revenu du
    minimum ; non mesuré sur la population
code:
  moteur: >-
    `_ligne_annuelle` relève, pour l'artisan, le commerçant ou le libéral qui cotise sur
    un revenu positif, hors du micro-entrepreneur, l'assiette de l'année au minimum que
    `assiette_minimale` lit pour son statut et l'année dans
    `legislation/assiette_minimale_independants.csv` : 200 SMIC horaires de 1985 à 2011
    — pour le libéral, depuis 2004 et proratisés —, puis 5,25 %, 7,70 % et 11,5 % du
    plafond, 450 SMIC horaires depuis 2023, rien sous quatre-vingt-dix jours
    d'affiliation depuis 2012 (`AssietteMinimale.montant`). Ses trimestres se valident
    sur le plus grand des deux, et la ligne porte le minimum (`assiette_minimale_base`),
    que `acquerir.assiette_minimale` n'oppose qu'aux régimes de base que la table
    nomme : les points de la CNAVPL (`acquerir`), le salaire annuel moyen des régimes
    alignés (`salaire_de_reference`) et celui de la seconde pension (`_revenus`). Le
    revenu de la ligne reste celui qui est déclaré : la complémentaire des artisans et
    commerçants n'a pas de minimum, et le compte notionnel cotise sur ce revenu. Le
    motif que le relevé porte à la ligne, ou le formulaire à l'année, annule le minimum
    quand `legislation/dispenses_assiette_minimale.yaml` en dispense le statut cette
    année-là (`dispense_assiette_minimale`) : le RSA et la prime d'activité depuis 2016,
    l'activité accessoire saisonnière depuis 2020, l'activité libérale non principale et
    le libéral pensionné de 2004 à 2015 ; les trois premiers écartent aussi l'assiette
    minimale en plafonds de la CARPIMKO et de la CAVOM, au scénario 1 comme au compte
    (`dispense_les_complementaires`).
  python: >-
    carriere.py : _ligne_annuelle ; donnees/chargement.py : AssietteMinimale.montant,
    charger_assiettes_minimales, assiette_minimale, charger_dispenses_assiette_minimale,
    dispense_assiette_minimale, dispense_les_complementaires ; droit/acquerir.py :
    assiette_minimale, acquerir ; droit/liquider.py : salaire_de_reference ;
    droit/seconde.py : _revenus ; moteur/compte.py :
    ConstructeurCompte._cotisation_ligne
  javascript: >-
    moteur/js/carriere.js : ligneAnnuelle, assietteMinimale, montantAssietteMinimale,
    dispenseAssietteMinimale, dispenseLesComplementaires ; moteur/js/droit/acquerir.js :
    assietteMinimale, acquerir ; moteur/js/droit/liquider.js : salaireDeReference ;
    moteur/js/droit/seconde.js : revenus ; moteur/js/compte.js :
    ConstructeurCompte._cotisationLigne
  parametres: >-
    legislation/assiette_minimale_independants.csv : statuts, regimes, debut, fin,
    heures_smic, part_pass, proratise, jours_minimum ;
    legislation/dispenses_assiette_minimale.yaml : familles, dispenses ;
    regimes/carpimko_complementaire.yaml, regimes/cavom_complementaire.yaml :
    assiette_minimale_pass
  tests:
  - tests/test_independants.py
  - tests/test_saisie_des_dispenses.py
  - tests/test_simulateur.py
  - tests/test_emploi_retraite.py
  - tests/test_micro_social.py
  - >-
    tests/test_cumul_activites.py, tests/test_liquidation.py et
    tests/test_versements_uniques.py, qui confrontent les deux moteurs sur des carrières
    qui la portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    trois témoins changent sans le minimum — dispense_liberale_pensionnee,
    dispense_saisonniere_cumulee et seconde_pension_artisane_au_minimum_2026 —, trois
    sans les dispenses, les deux premiers et dispense_rsa_releve_artisane ;
    tests/test_pont.py rejoue le premier à l'octet
