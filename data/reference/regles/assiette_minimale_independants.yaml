- reference: >-
    code de la sécurité sociale, D. 642-4 (LEGIARTI000006738120 à LEGIARTI000048838321)
- reference: décret n° 2023-1352 du 29 décembre 2023
- reference: décret n° 2022-1438 du 16 novembre 2022, article 1er (JORFARTI000046566175)
- reference: >-
    code de la sécurité sociale, L. 131-6-3 puis L. 613-9 puis L. 613-11
