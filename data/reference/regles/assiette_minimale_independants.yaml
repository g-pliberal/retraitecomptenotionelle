schema_version: 1
id: assiette_minimale_independants
intitule: >-
  Assiette minimale de la cotisation de base des artisans, commerçants et libéraux
  : 200 SMIC horaires de 1973 (2004 pour le libéral) à 2011, 5,25 %, 7,70 % puis
  11,5 % du plafond, 4 758 € en 2022, 450 SMIC horaires depuis 2023, sous condition
  de 90 jours d'affiliation depuis 2012 ; le micro-entrepreneur n'y est pas soumis. Sauf demande contraire, en sont
  dispensés depuis 2016 le bénéficiaire du RSA ou de la prime d'activité, depuis
  2020 l'activité accessoire saisonnière (L. 613-11), et, de 2004 à 2015, le
  libéral dont l'activité n'est pas principale ou déjà pensionné (D. 642-4).
regimes: [cancava, carpimko_complementaire, cavom_complementaire, cnavpl, organic,
  regime_general, rsi]
etat: approchee
etape: acquerir_les_droits
effet: >-
  Un indépendant à 3 000 € validait un trimestre au lieu de trois et n'avait ni
  le salaire ni les points du minimum. Dispensé, au RSA par exemple, il cotise sur
  son seul revenu : une artisane née en 1962, à 3 000 € par an de 1990 à 2025,
  valide 59 trimestres au lieu de 75, et son régime général sert 684 € au lieu de
  999 € ; une infirmière libérale, 2 444 € de CNAVPL au lieu de 2 582 €, et sa
  CARPIMKO perd le demi-plafond de 2026. De 1973 à 1984, l'artisane qui déclare 100
  € par an valide un trimestre par an : née en 1945 et partie à soixante-cinq ans,
  19 trimestres et 782 € de CANCAVA, au lieu de 7 et de 230 € sans le minimum.
  L'artisane à 3 000 € valide trois trimestres en 2022, et non deux.
sources:
  lu_le: 2026-10-31
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Si la condition de quatre-vingt-dix jours d'affiliation de D. 633-2 et D. 642-4
    vaut pour les 4 758 € de 2022, que le décret n° 2022-1438 fixe « par dérogation
    » à ces articles sans la redire : une circulaire de l'Urssaf ou de la caisse
    sur 2022 le dirait ; le 31 octobre 2026, seul le décret a été lu.
  - >-
    Un exemple chiffré de l'Urssaf d'un indépendant au RSA ou saisonnier (urssaf.fr,
    refusé au réseau de la session le 16 octobre 2026) ; si la dispense des
    activités saisonnières vaut dès les cotisations de 2019, que la loi
    n° 2019-1446 ne date pas, et ce qu'aucun décret ne définit de l'« activité
    accessoire saisonnière ».
  lectures:
  - type: legifrance
    reference: >-
      D. 633-2 et D. 642-4, toutes les versions de l'index LEGI, lues le 22 septembre
      2026
    date: 2026-09-22
  - type: autre
    reference: >-
      calculette de la CARPIMKO : 63,3 points CNAVPL et trois trimestres pour 3
      000 € de revenu, soit l'assiette de 5 409 €
    url: https://www.carpimko.com/
    date: 2026-09-22
  - type: legifrance
    reference: >-
      L. 131-6-3 (LEGIARTI000031675836, 2016 ; LEGIARTI000033713969, 2017), L. 613-9
      (LEGIARTI000036391156, 2018), L. 613-11 (LEGIARTI000037051811,
      LEGIARTI000041394691) : « Sauf demande contraire [...], les montants minimaux
      de cotisations [...] ne sont pas applicables [...] aux cotisations [...] dues
      par les personnes mentionnées à l'article L. 262-2 du code de l'action sociale
      et des familles et à l'article L. 842-1 », et depuis le 28 décembre 2019 « au
      titre des activités accessoires saisonnières qu'elles exercent » ; D. 613-7
      (LEGIARTI000041967556), la demande contraire avant le 31 octobre de l'année
      d'avant ; D. 642-4 de 2004 à 2015, l'activité non principale et le pensionné.
      Index LEGI à jour du 15 octobre 2026, lu le 16
    date: 2026-10-16
  - type: legifrance
    reference: >-
      loi n° 2015-1702, article 21 (JORFARTI000031663570), « aux périodes courant à
      compter du 1er janvier 2016 » ; loi n° 2019-1446, article 10
      (JORFARTI000039675367), sans date d'effet propre
    date: 2026-10-16
  - type: autre
    reference: >-
      Bpifrance Création, « Cotisations minimales dues par les travailleurs
      indépendants » (2023, chiffres de 2026) : « les cotisations minimales ne
      s'appliquent pas aux personnes bénéficiaires du RSA ou de la prime d'activité
      », « sauf demande contraire » ; dues « même s'ils sont par ailleurs salariés
      ou retraités »
    url: https://bpifrance-creation.fr/boiteaoutils/cotisations-minimales-dues-travailleurs-independants-2023
    date: 2026-10-16
  - type: autre
    reference: >-
      barème de la Cnav « Assiette annuelle minimale des cotisations des travailleurs
      indépendants » (ti_cotisation_assiette_minimale_cotisation_bar, version du 23
      décembre 2025) et la table de l'ex-RSI qu'il joint, de 1973 à 2026, que
      tests/test_cnav_baremes.py confronte à la série (action 175, étape 2)
    url: https://legislation.lassuranceretraite.fr/
    date: 2026-10-30
  - type: jorf
    reference: >-
      décret n° 2022-1438 du 16 novembre 2022, article 1er (JORFARTI000046566175) :
      « Par dérogation aux articles D. 633-2 et D. 642-4 [...], la cotisation annuelle
      due au titre de l'année 2022 [...] ne peut être calculée sur une assiette
      inférieure à 4 758 euros ». Index JORF du dépôt, lu le 30 octobre 2026
    date: 2026-10-30
  - type: jorf
    reference: >-
      décret n° 2022-1438 du 16 novembre 2022, en entier (JORFTEXT000046566167) : sa
      notice, « la modulation de l'assiette minimale vieillesse de base permettant aux
      travailleurs indépendants mentionnés aux articles L. 631-1 et L. 640-1 [...] de
      valider trois trimestres » ; l'article 2 abroge le V de l'article 4 du décret
      n° 2012-443 ; rien sur la durée d'affiliation ni sur les DOM. Index JORF à jour
      du 31 octobre 2026, lu le 31
    date: 2026-10-31
  - type: legifrance
    reference: >-
      décret n° 73-76 du 22 janvier 1973, article 2 (LEGIARTI000006765785, du 24
      janvier 1973 au 21 décembre 1985) : « Toutefois, le montant de la cotisation
      annuelle ne peut être inférieur à celui de la cotisation qui serait due au titre
      d'un revenu égal à 200 fois le montant horaire du salaire minimum de croissance
      en vigueur le 1er janvier de l'année considérée », pour les assurés en activité
      « autres que les aides familiaux des entreprises artisanales », mot pour mot ce
      que D. 633-2 reprend en 1985 (LEGIARTI000006737877) ; ses articles 1er, 5, 6, 9,
      10, 16 et 21, sans autre condition au minimum. Index LEGI à jour du 30 octobre
      2026, lu le 31
    date: 2026-10-31
