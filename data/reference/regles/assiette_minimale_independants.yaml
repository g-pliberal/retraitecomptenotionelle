approximations:
- ecart: >-
    Les dispenses (`legislation/dispenses_assiette_minimale.yaml`) se déclarent ligne
    par ligne sur le relevé (`dispense_assiette_minimale`), et, sur le site, par
    années entières (champ « Dispenses de l'assiette minimale », `dispenses`) : toutes
    les activités d'une année dispensée portent son motif, si bien que l'indépendant
    qui en exerce deux la même année, dont une seule est accessoire saisonnière, les
    voit dispensées toutes deux. La dispense des activités saisonnières court des
    cotisations de 2020, faute de date dans la loi.
  effet: >-
    non mesuré sur la population ; pour une carrière de 3 000 € par an, 16 trimestres
    sur 36 ans et un tiers du régime de base, voir `effet`
- ecart: >-
    En 2022, le décret n° 2022-1438 fixe les 4 758 € « par dérogation aux articles
    D. 633-2 et D. 642-4 », sans redire leur condition de quatre-vingt-dix jours
    d'affiliation ni leur refus du prorata : la série garde l'une et l'autre, une
    lecture qu'aucun texte lu ne tranche. L'édition des DOM du barème de la caisse
    garde pour 2022 11,5 % du plafond, 4 731 € ; le modèle applique aux DOM, comme la
    table de la métropole, les 4 758 € du décret, qui n'excepte aucun indépendant de
    L. 631-1 ou de L. 640-1 (tests/test_cnav_baremes.py,
    `ECARTS_ASSIETTE_MINIMALE_DOM`).
  effet: >-
    en 2022 seulement : pour l'indépendant affilié moins de quatre-vingt-dix jours,
    aucun minimum au lieu de 4 758 €, si le décret ne la retient pas ; pour celui des
    DOM au minimum, un trimestre de plus que l'édition des DOM ne lui en donne ; non
    mesuré sur la population
code:
  moteur: >-
    `_ligne_annuelle` relève, pour l'artisan, le commerçant ou le libéral qui cotise sur
    un revenu positif, hors du micro-entrepreneur, l'assiette de l'année au minimum que
    `assiette_minimale` lit pour son statut et l'année dans
    `legislation/assiette_minimale_independants.csv` : 200 SMIC horaires de 1973 à 2011
    — pour le libéral, depuis 2004 et proratisés —, puis 5,25 %, 7,70 % et 11,5 % du
    plafond, 4 758 € en 2022 (la colonne `euros`), 450 SMIC horaires depuis 2023, rien
    sous quatre-vingt-dix jours d'affiliation depuis 2012 (`AssietteMinimale.montant`,
    `montantAssietteMinimale`). Ses trimestres se valident
    sur le plus grand des deux, et la ligne porte le minimum (`assiette_minimale_base`),
    que `acquerir.assiette_minimale` n'oppose qu'aux régimes de base que la table
    nomme : les points de la CNAVPL (`acquerir`), le salaire annuel moyen des régimes
    alignés (`salaire_de_reference`) et celui de la seconde pension (`_revenus`). Le
    revenu de la ligne reste celui qui est déclaré : la complémentaire des artisans et
    commerçants n'a pas de minimum, et le compte notionnel cotise sur ce revenu. Le
    motif que le relevé porte à la ligne, ou le formulaire à l'année, annule le minimum
    quand `legislation/dispenses_assiette_minimale.yaml` en dispense le statut cette
    année-là (`dispense_assiette_minimale`) : le RSA et la prime d'activité depuis 2016,
    l'activité accessoire saisonnière depuis 2020, l'activité libérale non principale et
    le libéral pensionné de 2004 à 2015 ; les trois premiers écartent aussi l'assiette
    minimale en plafonds de la CARPIMKO et de la CAVOM, au scénario 1 comme au compte
    (`dispense_les_complementaires`).
  python: >-
    carriere.py : _ligne_annuelle ; donnees/chargement.py : AssietteMinimale.montant,
    charger_assiettes_minimales, assiette_minimale, charger_dispenses_assiette_minimale,
    dispense_assiette_minimale, dispense_les_complementaires ; droit/acquerir.py :
    assiette_minimale, acquerir ; droit/liquider.py : salaire_de_reference ;
    droit/seconde.py : _revenus ; moteur/compte.py :
    ConstructeurCompte._cotisation_ligne
  javascript: >-
    moteur/js/carriere.js : ligneAnnuelle, assietteMinimale, montantAssietteMinimale,
    dispenseAssietteMinimale, dispenseLesComplementaires ; moteur/js/droit/acquerir.js :
    assietteMinimale, acquerir ; moteur/js/droit/liquider.js : salaireDeReference ;
    moteur/js/droit/seconde.js : revenus ; moteur/js/compte.js :
    ConstructeurCompte._cotisationLigne
  parametres: >-
    legislation/assiette_minimale_independants.csv : statuts, regimes, debut, fin,
    heures_smic, part_pass, euros, proratise, jours_minimum ;
    legislation/dispenses_assiette_minimale.yaml : familles, dispenses ;
    regimes/carpimko_complementaire.yaml, regimes/cavom_complementaire.yaml :
    assiette_minimale_pass
  tests:
  - tests/test_independants.py
  - >-
    tests/test_cnav_baremes.py, où la série redonne les tables de la caisse de 1973 à
    2026, et celles des DOM hors de 2022
  - tests/test_saisie_des_dispenses.py
  - tests/test_simulateur.py
  - tests/test_emploi_retraite.py
  - tests/test_micro_social.py
  - >-
    tests/test_cumul_activites.py, tests/test_liquidation.py et
    tests/test_versements_uniques.py, qui confrontent les deux moteurs sur des carrières
    qui la portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    trois témoins changent sans le minimum — dispense_liberale_pensionnee,
    dispense_saisonniere_cumulee et seconde_pension_artisane_au_minimum_2026 —, trois
    sans les dispenses, les deux premiers et dispense_rsa_releve_artisane ;
    tests/test_pont.py rejoue le premier à l'octet
