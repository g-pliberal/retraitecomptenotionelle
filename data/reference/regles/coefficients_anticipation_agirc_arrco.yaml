schema_version: 1
id: coefficients_anticipation_agirc_arrco
intitule: >-
  Coefficients d'anticipation de l'Agirc-Arrco, et avant elle de l'Agirc et de l'Arrco :
  liquidée avant l'âge du 1° de l'article L. 351-8 sans le taux plein du régime général
  ou agricole, la pension est multipliée par un coefficient viager qui descend par
  trimestre d'anticipation, de 0,99 à 0,43 dix ans avant ; s'il manque vingt trimestres
  au plus, celui des trimestres manquants, de 0,99 à 0,78, s'applique quand il est plus
  avantageux.
etat: approchee
etape: liquider_chaque_regime
effet: >-
  Toute liquidation anticipée d'une complémentaire des salariés du privé : 1 % à 22 % de
  moins sur vingt trimestres, jusqu'à 57 % dix ans avant l'âge du 1° de l'article
  L. 351-8, 67 ans depuis la génération 1955. Les soixante lignes du moteur — quarante
  par l'âge, vingt par les trimestres manquants — sont, à la décimale, celles de l'accord
  du 17 novembre 2017, de la convention de 1947, de l'accord de 1961 et des tables de la
  caisse de septembre 2026 ; son arrondi au trimestre supérieur rend la ligne de l'âge
  atteint, comme l'exemple de la caisse (63 ans et 11 mois : 0,8675). Les points Agirc de
  la tranche C acquis avant 2016, sur la part du salaire entre quatre et huit plafonds
  (au-delà de 152 160 € en 2015), gardent le coefficient pour âge avant 67 ans même au
  taux plein : le moteur les suit depuis le 28 septembre 2026, de l'acquisition
  (`points_abattus_a_l_age`, sur les périodes de la tranche C de 1991 à 2015) à la
  liquidation, où ils prennent ce coefficient quand les autres points n'en prennent
  aucun ou un plus doux — 22 % de moins à 62 ans, 12 % à 64 ans, sur ces seuls points.
  Aucun témoin cadre n'était payé si haut ; un témoin né pour la règle la montre (1955,
  huit fois le salaire moyen, parti à 62 ans avec la durée : 40 % de ses points Agirc à
  0,78), et un second la suit à travers la fusion de 2019 (1960, parti en 2022 : ses
  points Agirc convertis au quotient des valeurs de service du 31 décembre 2018, article
  52, gardent à part ceux de la tranche C d'avant 2016, que l'article 102 nomme encore). Deux approximations : le report de ces points, sans abattement, à l'âge du 1° de
  L. 351-8, que l'assuré peut demander « au moment de la liquidation » (article 102,
  comme avant 2019 l'annexe I de 1947, article 6, § 3 a), et que le moteur ne sert pas,
  faute de liquider une pension en deux fois : il sert la règle de l'article 102, « la
  liquidation se fait simultanément sur toutes les tranches » ; et les liquidations de
  1991 à 2003, où le moteur applique la même règle sans avoir lu l'accord de l'ASF. De
  2011 à 2018, l'âge de référence est celui que la caisse a servi, 65 ans et 9 mois pour
  1952, 66 ans et 2 mois pour 1953, 66 ans et 7 mois pour 1954, 67 ans dès 1955 (sa
  table de décembre 2018), et non celui de la rédaction que l'accord du 18 mars 2011
  fige : le moteur, qui lit l'âge d'annulation du régime de base, rend cette table
  ligne pour ligne. Une question reste ouverte : les assurés dont la base n'est ni le
  régime général ni le régime agricole. Avant 1955, l'Agirc servait une
  autre table, par année d'âge, et un ajournement : ceux de la convention d'origine
  (fiche coefficients_anticipation_agirc_1947). L'Arrco d'avant 1965 garde ici la table
  des accords, faute du texte de 1961. Jusqu'au 31 mars 1983, l'âge seul abat la
  pension, quelle que soit la durée ; de juillet 1976 à mars 1983, l'Arrco en excepte
  les travailleurs manuels et les mères de famille ouvrières au taux de soixante-cinq
  ans du régime général (protocole du 14 juin 1976). Le moteur levait l'abattement dès
  le 1er janvier 1983, et à toute date sur les points de l'UNIRS ; il n'exceptait pas
  ces deux catégories (18 octobre 2026).
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/liquider.py, `abattement_points`, et son jumeau) y lit ce qui
# exonère des coefficients : `exoneration_au_taux_plein`, l'abattement levé pour
# qui a la durée du taux plein, et la table des trimestres manquants avec lui ;
# `exonerations`, chacune des `motifs` — l'inaptitude, ou la fiche d'un taux plein
# par catégorie de L. 351-8 — que les `regimes` nommés servent sans coefficient,
# tous quand ils ne sont pas nommés. Les tables sont celles des périodes
# (`bareme_anticipation`).
