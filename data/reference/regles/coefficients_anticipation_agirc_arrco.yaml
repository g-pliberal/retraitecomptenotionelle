      coefficients d'abattement dans les conditions définies par les commissions
      paritaires AGIRC - ARRCO en application de l'accord du 23 décembre 1996 » ; « Les
      dispositions du présent titre III s'appliquent à compter du 1er avril 2001 »
    lu_le: 2026-11-03
    empreinte: sha256:0186b6b165ad2a5f5f561deb969c6a35c661dc2e1fedbfcdcaa24801f51104c1
  - id: JORFARTI000001079605
