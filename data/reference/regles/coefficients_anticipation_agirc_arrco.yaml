      activité non salariée ne relevant pas de la CANCAVA »
  - id: JORFARTI000001464687
    reference: >-
      avis relatif à l'extension et à l'élargissement de l'avenant A-208 à la convention
      collective nationale du 14 mars 1947 conclu le 4 juin 2002
    publie_le: 2002-08-18
    citation: >-
      « Modifications du a et du b de l'article 1er de l'annexe V à la convention du 14
      mars 1947 », dans les mêmes termes que l'avenant n° 65
  bornes:
    liquidation.date_effet: [1999-01-01, 2004-01-01]
  contenu:
    droit: >-
      le régime unique de l'Arrco calcule la retraite à soixante-cinq ans et l'anticipe au
      plus tôt à cinquante-cinq, sous la table des quarante trimestres ; il la sert sans
      coefficient de soixante à soixante-cinq ans à l'invalide de l'article 18 de
      l'annexe A et au bénéficiaire de la structure financière, que l'AGFF reprend le
      1er avril 2001 aux mêmes conditions ; les avenants du 4 juin 2002, à une date que
