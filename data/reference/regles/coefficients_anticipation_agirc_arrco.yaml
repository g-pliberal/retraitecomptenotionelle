schema_version: 1
id: coefficients_anticipation_agirc_arrco
intitule: >-
  Coefficients d'anticipation de l'Agirc-Arrco, et avant elle de l'Agirc et de l'Arrco :
  liquidée avant l'âge du 1° de l'article L. 351-8 sans le taux plein du régime général
  ou agricole, la pension est multipliée par un coefficient viager qui descend par
  trimestre d'anticipation, de 0,99 à 0,43 dix ans avant ; s'il manque vingt trimestres
  au plus, celui des trimestres manquants, de 0,99 à 0,78, s'applique quand il est plus
  avantageux.
etat: approchee
etape: liquider_chaque_regime
effet: >-
  Toute liquidation anticipée d'une complémentaire des salariés du privé : 1 % à 22 % de
  moins sur vingt trimestres, jusqu'à 57 % dix ans avant l'âge du 1° de l'article
  L. 351-8, 67 ans depuis la génération 1955. Les soixante lignes du moteur — quarante
  par l'âge, vingt par les trimestres manquants — sont, à la décimale, celles de l'accord
  du 17 novembre 2017, de la convention de 1947, de l'accord de 1961 et des tables de la
  caisse de septembre 2026 ; son arrondi au trimestre supérieur rend la ligne de l'âge
  atteint, comme l'exemple de la caisse (63 ans et 11 mois : 0,8675). Les points Agirc de
  la tranche C acquis avant 2016, sur la part du salaire entre quatre et huit plafonds
  (au-delà de 152 160 € en 2015), gardent le coefficient pour âge avant 67 ans même au
  taux plein : le moteur les suit depuis le 28 septembre 2026, de l'acquisition
  (`points_abattus_a_l_age`, sur les périodes de la tranche C de 1991 à 2015) à la
  liquidation, où ils prennent ce coefficient quand les autres points n'en prennent
  aucun ou un plus doux — 22 % de moins à 62 ans, 12 % à 64 ans, sur ces seuls points.
  Aucun témoin cadre n'était payé si haut ; un témoin né pour la règle la montre (1955,
  huit fois le salaire moyen, parti à 62 ans avec la durée : 40 % de ses points Agirc à
  0,78). Deux approximations : le report de ces points, sans abattement, à l'âge du 1° de
  L. 351-8 (article 102), que l'assuré peut demander et que le moteur ne sert pas, faute
  de liquider une pension en deux fois ; et les liquidations de 1991 à 2003, où le moteur
  applique la même règle sans avoir lu l'accord de l'ASF. Deux questions restent
  ouvertes : l'âge de référence des liquidations de 2011 à 2018, et les assurés dont la
  base n'est ni le régime général ni le régime agricole.
sources:
  lu_le: 2026-09-27
  prochaine_relecture: 2026-12-31
  a_relire:
  - >-
    Tranche C d'avant 2016 : lire l'accord du 4 février 1983 (ASF) et ceux de l'AGFF
    d'avant 2003, pour dater l'exonération « sur les tranches A et B » que le moteur
    applique dès 1991 ; et le report sans abattement de l'article 102, que servir
    demanderait de liquider ces points à part.
  - >-
    À trancher : de juillet 2011 à 2018, l'âge de référence de l'Agirc et de l'Arrco est
    celui du 1° de L. 351-8 « dans la rédaction au 18 mars 2011 » (accord du 18 mars
    2011, article 3), où l'âge légal montait « à raison de quatre mois par génération »
    jusqu'à 62 ans pour la génération 1956. Le moteur lit l'âge d'annulation du régime de
    base, qui suit la rédaction du 23 décembre 2011 : 65,75 ans pour 1952, 66,17 pour
    1953, 66,58 pour 1954, 67 pour 1955. La rédaction figée, lue depuis dans D. 161-2-1-9
    (rédaction du second semestre 2011) augmenté des cinq ans du 1° de L. 351-8, donne 65
    ans et 8 mois, 66 ans, 66 ans et 4 mois et 66 ans et 8 mois : jusqu'à deux trimestres
    d'anticipation de trop pour ces générations liquidées avant 2019. Reste à lire ce que
    la caisse a appliqué, dans ses circulaires 2011-6-DRE et 2011-17-DRE, introuvables le
    27 septembre 2026 ; si elles confirment, après la phase 8 : une table d'âges propre à
    ces périodes.
  - >-
    À lire : les articles 84, 3 et 85, 3 nomment le régime général et le régime des
    assurances sociales agricoles ; le moteur accorde l'exonération et la table des
    trimestres manquants sur la durée de la base, quelle qu'elle soit. Pour les mineurs, la
    circulaire 2020-02-DRJ sert la complémentaire sans coefficient dès 60 ans avec trente
    ans de services miniers, comme l'article 5 de l'annexe V de 1947 : ce que le moteur en
    fait reste à vérifier. Rien n'est lu pour les clercs de notaire.
  - >-
    Non lus : la version consolidée de l'accord au 1er janvier 2026, sur Calaméo, qui
    refuse la requête — ses avenants l'ont été par les circulaires de la caisse, 2023-01-DRJ
    comprise, qui ne touche ni l'article 84, ni le 85, ni le 102 ; l'accord du 4 février
    1983 (ASF), dont seul le résumé de l'agrément est lu (arrêté du 21 mars 1983, Journal
    officiel du 15 avril 1983), et les textes d'origine de 1947 et de 1961. Ni l'âge seul d'avant 1983, ni la
    table des trimestres manquants dès 1983, que le moteur applique, ne sont donc
    confirmés : les plus anciens textes lus sont l'accord Arrco du 25 avril 1996 pour
    l'âge (65 ans, 0,43 à 55 ans, à compter de 1999) et les annexes E et V de 2018 pour
    les trimestres.
  - >-
    L'exemple du dépliant « Décrypter la retraite Agirc tranche C » (63 ans et 11 mois,
    0,8675) est porté, `agirc_arrco_tranche_c_63_ans_11_mois`, pour un cadre sans le taux
    plein : l'écart de la tranche C au taux plein reste sans exemple. Celui de la table
    de septembre 2026, « à 61 ans … vous percevrez 71 % », suppose la complémentaire prise
    sans la retraite de base, que le modèle ne liquide pas à part.
  lectures:
  - type: autre
    reference: >-
      Agirc-Arrco, « Les coefficients de minoration applicables à la retraite
      complémentaire Agirc-Arrco », table datée « Septembre 2026 » : tableau 2,
      « Coefficients d'anticipation pour carrière courte », de « 1 trim. 0,99 » à
      « 12 trim. 0,88 », puis « 20 trim. 0,78 » ; tableau 3, « Coefficients
      d'anticipation pour âge », de « 66 ans et 9 mois 0,99 » à « 62 ans 0,78 », puis
      0,43 à 57 ans ; « votre retraite sera calculée avec la plus faible minoration des
      deux » ; la tranche C d'avant 2016 « sera affectée d'un coefficient d'anticipation
      pour âge qui est définitif ». L'adresse date de 2024, le document du 17 août 2026
    url: https://www.agirc-arrco.fr/storage/2024/10/Coefficients-de-minorations-AA.pdf
    date: 2026-09-27
  - type: autre
    reference: >-
      Réglementation Agirc-Arrco, barèmes « Coefficients d'anticipation pour âge »
      (« Barème en vigueur », quarante lignes, de « 66 ans et 9 mois » 0,99 à « 57 ans »
      0,43) et « Coefficients d'anticipation pour carrière courte » (« Coefficients
      applicables en fonction du nombre de trimestres manquants », vingt lignes, de 0,99
      à 0,78) : les valeurs de la table de septembre 2026, ligne pour ligne
    url: https://reglementation.agirc-arrco.fr/home/baremes/listes-area/baremes-1/coefficients-d-anticipation-pour-age.html
    date: 2026-09-27
  - type: autre
    reference: >-
      Accord national interprofessionnel du 17 novembre 2017, version « Applicable au
      1er janvier 2019 » jointe à la circulaire Agirc-Arrco 2018-09-DC du 19 décembre
      2018. Article 84, 1 : pension « sans abattement dès lors qu'il a atteint l'âge visé
      au 1° de l'article L. 351-8 du code de la sécurité sociale » ; 84, 2 : « au plus tôt
      10 ans avant cet âge. Dans ce cas, le coefficient d'anticipation viager est appliqué
      aux points », table de « moins 10 ans 0,43 » à « moins 1 trimestre 0,99 » ; 84, 3 :
      sans coefficient « à l'âge auquel il a obtenu la pension d'assurance vieillesse du
      régime général ou du régime des assurances sociales agricoles à taux plein ».
      85, 3, « Carrières courtes » : « durée d'assurance inférieure de 20 trimestres au
      plus », table de 0,78 pour vingt trimestres manquants à 0,99 pour un, et
      « l'allocation ainsi obtenue ne pourra être inférieure à celle qui serait versée
      après application du coefficient d'anticipation correspondant à l'âge atteint ».
      102 : pour « les points constitués sur la tranche C des rémunérations avant 2016
      dans l'ancien régime AGIRC », « le report de la liquidation de ces points, sans
      abattement, à l'âge mentionné au 1° de l'article L. 351-8 »
    url: https://www.agirc-arrco.fr/storage/2024/09/201809dc_ANI_du_17_novembre_2017.pdf
    date: 2026-09-27
  - type: autre
