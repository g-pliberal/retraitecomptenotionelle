  lectures_divergentes:
  - >-
    L'âge de la retraite de 2011 à 2018 : l'accord du 18 mars 2011 (article 3) et les
    annexes de 1947 et de 1961 le fixent au 1° de L. 351-8 dans la rédaction du 18 mars
    2011 — 65 ans et 4 mois pour le second semestre de 1951, puis 65 ans et 8 mois, 66
    ans, 66 ans et 4 mois et 66 ans et 8 mois de 1952 à 1955 (D. 161-2-1-9, augmenté de
    cinq ans) ; la caisse a servi celui de la loi n° 2011-1906, 65 ans et 9 mois, 66 ans
    et 2 mois, 66 ans et 7 mois puis 67 ans (sa table de décembre 2018), que le moteur
    sert : le droit tel que la caisse l'applique.
  - >-
    L'ordre de la majoration pour enfants et du coefficient : l'accord de 2017 applique
    le coefficient « aux points de retraite inscrits au compte » (article 84, 2), la
    majoration « de son allocation » (article 94) ; le texte ne dit pas lequel précède. La
    circulaire 2020-02-DRJ le dit (fiche 4, II.2.1) : la majoration « sans tenir compte
    des coefficients d'anticipation » ; avant 2019, le guide n° 9 de la caisse : l'Arrco
    sans, l'Agirc avec.
textes_sans_effet:
- reference: >-
    accord national interprofessionnel du 13 mars 2013 sur les retraites
    complémentaires, dans le recueil de la caisse (hors JORF)
  motif: >-
    aucun de ses articles ne touche l'abattement, l'âge de l'article 3 de l'accord du 18
    mars 2011 ni ses exonérations ; ses signataires « se réuniront également au cours du
    second semestre 2018 pour traiter du devenir de l'AGFF au-delà de 2018 »
code:
  interrupteurs:
    abattement_points: agirc_arrco
    points_abattus_a_l_age: true
  moteur: >-
    `abattement_points: agirc_arrco` applique les coefficients d'anticipation propres
    à ce régime — deux tables, l'une indexée sur les trimestres manquants, l'autre sur
    l'âge, dont la plus avantageuse est retenue. `points_abattus_a_l_age`, sur les
    périodes de la tranche C de l'Agirc jusqu'en 2015, range leurs points à part dès
    l'acquisition (`Droits.abattus`, `Droits.points_abattus`) ; la liquidation leur
    applique le coefficient de la table des âges (`liquider.coefficient_pour_age`) quand
    il est plus sévère que celui des autres points, et affiche le coefficient moyen de
    la pension, pondéré par les montants. Les versions disent, à la date d'effet, ce qui
    exonère (`liquider.exonerations_agirc_arrco`, `liquider.exonere_par_motif`, et leurs
    jumeaux `exonerationsAgircArrco`, `exonereParMotif`) : avant le 1er avril 1983, l'âge
    seul, quelle que soit la période ; tests/test_exonerations_agirc_arrco.py. Depuis le
    1er juillet 2011, le parent de trois enfants que la fiche taux_plein_a_soixante_cinq_ans
    met au taux plein du régime général à l'âge de sa liquidation
    (`liquider.parent_au_taux_plein_du_regime_general`, `parentAuTauxPleinDuRegimeGeneral`,
    qui lisent `categories.age_du_parent_de_trois_enfants`), hors l'Arrco des cultes ;
