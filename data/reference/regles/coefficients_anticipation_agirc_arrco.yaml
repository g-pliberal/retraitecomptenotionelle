    publie_le: 2002-08-18
    citation: >-
      « Modification du a et du b de l'article 1er de l'annexe E à l'accord du 8 décembre
      1961 » ; « faire bénéficier d'une retraite à soixante ans sans abattement les
      personnes qui cessent leur activité salariée au plus tôt à l'âge de cinquante ans,
