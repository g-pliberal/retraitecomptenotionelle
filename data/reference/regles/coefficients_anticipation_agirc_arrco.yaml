      l'abaissement de l'âge de la retraite dans les régimes complémentaires, dont
      l'index JORF ne garde que la notice
    publie_le: 1983-04-15
    en_vigueur: 1983-04-01
    citation: >-
      « POSSIBILITE D'ADMISSION A LA RETRAITE DES SALARIES DU SECTEUR PRIVE,AGES DE 60 A
      65 ANS QUI JUSTIFIENT DE 37 ANNEES ET DEMIE DE COTISATION D'ASSURANCE ET QUI ONT
      FAIT LIQUIDER LEUR PENSION D'ASSURANCE VIEILLESSE » ; « APPLICATION A COMPTER DU
      01-04-1983 »
  - reference: >-
      accord du 23 décembre 1996 relatif à la structure financière, hors du Journal
      officiel ; copie du Medef, https://accords.medef.com/documents/accord_232.pdf
    article: articles 2 et 3
    en_vigueur: 1997-01-01
    citation: >-
      « une allocation égale au montant des droits acquis à l'âge de départ à la retraite
      complémentaire et calculés en supprimant les coefficients d'abattement qui leur
      auraient été appliqués selon les modalités en vigueur avant le 1er avril 1983 » ;
      « La structure financière, créée par les partenaires sociaux avec l'agrément de
      l'Etat à partir du 1er avril 1983 »
    lu_le: 2026-10-18
    empreinte: sha256:07169c7ea0a1bc688623c31194ba8f22bef2d5030427dda42b7a3598c981e6b6
  nee_de: JORFTEXT000000286775
  bornes:
    liquidation.date_effet: [1983-04-01, 1997-01-01]
  contenu:
    droit: >-
      de soixante à soixante-cinq ans, sans coefficient pour le salarié du secteur privé
      qui justifie de trente-sept ans et demi d'assurance et a fait liquider sa pension de
      vieillesse, ce que dit le résumé de l'agrément. Le texte de l'accord du 4 février
      1983, et de ceux du 1er septembre 1990 et du 30 décembre 1993 qui l'ont suivi,
      n'est pas lu : ni la liste de ses bénéficiaires, ni la table des trimestres
      manquants, ni l'exonération de l'inapte et des catégories de L. 351-8, que le
      modèle sert comme ensuite
    parametres:
      exoneration_au_taux_plein: true
      exonerations:
      - motifs: [inaptitude, taux_plein_anciens_deportes_internes,
          taux_plein_meres_de_famille_ouvrieres, taux_plein_travailleurs_manuels,
          taux_plein_anciens_combattants_prisonniers]
        regimes: null
  exemples: aucun trouvé
- id: structure_financiere_de_1996
  statut: lue
  textes:
  - reference: >-
      accord du 23 décembre 1996 relatif à la structure financière, hors du Journal
      officiel ; copie du Medef, https://accords.medef.com/documents/accord_232.pdf
    article: articles 1er, 2 et 3
    en_vigueur: 1997-01-01
    citation: >-
      « se substitue à effet du 1er janvier 1997 aux dispositions de l'accord du 30
      décembre 1993 » ; « Sont bénéficiaires du présent accord dès lors que, âgés de 60 et
      65 ans, ils justifient de la durée d'assurance prévue à l'alinéa 2 de l'article
      R.351-45 du code de la sécurité sociale et qu'ils ont fait liquider leur pension
      d'assurance vieillesse, les salariés affiliés aux régimes de retraites
      complémentaires AGIRC et ARRCO et appartenant par ailleurs aux catégories suivantes :
      les salariés en activité, les anciens salariés qui terminent leur carrière en tant
      qu'artisans relevant du régime de la CANCAVA, les chômeurs indemnisés par le régime
      d'assurance chômage » ; « b. Allocations versées [...] entre 60 et 65 ans aux
      bénéficiaires définis à l'article 2 ci-dessus correspondant aux droits acquis sur
      les tranches A et B des rémunérations »
    lu_le: 2026-10-18
    empreinte: sha256:07169c7ea0a1bc688623c31194ba8f22bef2d5030427dda42b7a3598c981e6b6
  bornes:
    liquidation.date_effet: [1997-01-01, 1999-01-01]
  contenu:
    droit: >-
      de soixante à soixante-cinq ans, avec la durée du taux plein et la pension de
      vieillesse liquidée, sans coefficient sur les droits des tranches A et B pour les
      salariés en activité, les anciens salariés devenus artisans de la CANCAVA, les
      chômeurs indemnisés, les chômeurs inscrits depuis six mois au moins, les situations
      que les commissions paritaires y assimilent, les mineurs et les anciens combattants
      d'Afrique du Nord ; les autres prennent le coefficient de l'âge
    parametres:
      exoneration_au_taux_plein: true
      exonerations:
      - motifs: [inaptitude, taux_plein_anciens_deportes_internes,
          taux_plein_meres_de_famille_ouvrieres, taux_plein_travailleurs_manuels,
          taux_plein_anciens_combattants_prisonniers]
        regimes: null
  exemples: aucun trouvé
- id: regime_unique_arrco_1999
  statut: lue
  textes:
  - reference: >-
      accord du 25 avril 1996 relatif aux régimes complémentaires des salariés Arrco,
      dans le recueil de la caisse « Accords nationaux des partenaires sociaux » (hors
      JORF), https://www.agirc-arrco.fr/storage/2021/11/liste_accords_paritaires_Agirc_Arrco.pdf
    article: article 10
    en_vigueur: 1999-01-01
    citation: >-
      « La retraite est calculée à l'âge de 65 ans et liquidée à la demande des
      intéressés. Toutefois, ceux-ci pourront, à compter du 1er janvier 1999 en demander
      l'ajournement ou l'anticipation au plus tôt à 55 ans. A cet âge, les points de
      retraite effectivement inscrits au compte de l'intéressé seront affectés du
      coefficient 0,43 » ; « majoré de 0,0175 par trimestre écoulé entre l'âge de 55 ans
      et l'âge atteint lors de la liquidation de la retraite », puis de 0,0125 de 60 à 62
      ans et de 0,01 de 62 à 65 ans ; « Les coefficients ci-dessus ne s'appliquent pas en
      cas de liquidation des allocations entre 60 et 65 ans, dans les conditions prévues à
      l'article 18 de l'annexe A (invalides...) et à l'annexe E (structure financière) de
      l'Accord du 8 décembre 1961 »
    lu_le: 2026-11-03
    empreinte: sha256:0186b6b165ad2a5f5f561deb969c6a35c661dc2e1fedbfcdcaa24801f51104c1
  - reference: >-
      accord du 10 février 2001 relatif aux retraites complémentaires AGIRC et ARRCO,
      dans le même recueil (hors JORF)
    article: titre III, 1, 2 et 4
    en_vigueur: 2001-04-01
    citation: >-
      l'AGFF « se substitue » à l'ASF et finance « le supplément de dépenses que
