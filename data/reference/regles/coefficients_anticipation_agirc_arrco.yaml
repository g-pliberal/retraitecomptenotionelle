- version: [structure_financiere, structure_financiere_de_1996, regime_unique_arrco_1999]
  textes: >-
    arrêté du 21 mars 1983, son résumé ; accord du 23 décembre 1996, article 2 ; avis des
    avenants n° 65 et A-208 du 4 juin 2002, et n° 76 du 3 décembre 2003
  ecart: >-
    Le modèle exonère dès le 1er avril 1983, de 60 à 65 ans, quiconque a la durée du taux
    plein. Jusqu'au 31 décembre 2003, la structure financière ne l'accordait qu'aux
    salariés en activité, aux anciens salariés devenus artisans de la CANCAVA, aux
    chômeurs indemnisés ou inscrits depuis six mois, aux situations que les commissions
    paritaires y assimilaient, aux mineurs et aux anciens combattants d'Afrique du Nord
    (accord du 23 décembre 1996, article 2), et, depuis les avenants du 4 juin 2002, à qui
    avait quitté le salariat à cinquante ans au plus tôt, après douze ans, pour une
    activité non salariée hors de la CANCAVA ; l'avenant n° 76 l'ouvre « à l'ensemble des
    personnes qui n'étaient plus salariées » le 1er janvier 2004. De 1983 à 1996, seul le
    résumé de l'agrément est lu, qui dit « salariés ».
  effet: >-
    non mesuré : le modèle, qui ne connaît pas la situation au départ, surestime la
    pension complémentaire de qui partait de 60 à 65 ans avec la durée sans être salarié
    ni chômeur — un inactif, un indépendant après une carrière salariée — de toute la
    part que la table des âges lui retirait, 22 % à 60 ans, 1 % à 64 ans et 9 mois
- version: [accord_du_18_mars_2011, accord_du_30_octobre_2015]
  textes: >-
    convention du 14 mars 1947, annexe I, articles 6, § 1er, 8, § 2, et 9 ; accord du 8
    décembre 1961, annexe A, article 19 ; leurs mises à jour au 1er janvier 2018
  ecart: >-
    Le modèle exonère dans tous les régimes, au taux plein de leur catégorie au régime
    général, l'inapte, l'ancien déporté ou interné, la mère de famille ouvrière, le
    travailleur manuel et l'ancien combattant ou prisonnier. De 2011 à 2018, l'annexe I
    de la convention de 1947 n'exonère à l'Agirc que l'inapte, l'ancien déporté et
    l'ancien combattant, ni les mères de famille ouvrières ni les travailleurs manuels ;
    l'annexe A de l'accord de 1961 n'exonère pas les travailleurs manuels à l'Arrco.
  effet: >-
    non mesuré : les mères de famille ouvrières de l'Agirc et les travailleurs manuels,
    partis de 2011 à 2018 au taux plein de leur catégorie sans la durée, dont le modèle
    sert les points sans le coefficient de l'âge ; ce que l'Agirc servait à ces
    catégories avant 2011, après l'avenant A-220 qui l'aligne sur l'Arrco, n'est pas lu
- version: [accord_du_18_mars_2011, accord_du_30_octobre_2015, regime_unifie, avenant_15]
  textes: >-
    accord du 8 décembre 1961, annexe A, article 19, 4 ; convention du 14 mars 1947,
    annexe V, article 5 ; accord du 17 novembre 2017, article 85, 1 ; circulaire
    2020-02-DRJ, fiche 3, I.1.3.1
  ecart: >-
    Le modèle ne connaît pas les mineurs de fond : l'accord de 2017, comme avant lui
    l'article 19 de l'annexe A, sert sans coefficient dès 60 ans qui a trente ans de
    services miniers validés par la caisse des mines, dont quinze au fond ; l'annexe V
    de 1947 exonérait à l'Agirc le mineur qui avait la durée, ses services miniers
    comptés.
  effet: >-
    non mesuré : le mineur de fond qui liquide sa complémentaire avant l'âge du taux
    plein sans la durée en reçoit les points, dans le modèle, sous le coefficient de
    l'âge, jusqu'à 22 % de moins à 62 ans
- version: [accord_du_18_mars_2011, accord_du_30_octobre_2015, regime_unifie, avenant_15]
  textes: >-
    convention du 14 mars 1947, annexe I, article 6, § 3 a) ; accord du 17 novembre
    2017, article 102
  ecart: >-
    Le modèle liquide ensemble tous les points de l'assuré, ceux de la tranche C acquis
    avant 2016 sous le coefficient de l'âge, même au taux plein ; l'article 102, comme
    avant 2019 l'article 6 de l'annexe I, laisse l'assuré demander « au moment de la
    liquidation » le report de ces points, sans abattement, à l'âge du 1° de L. 351-8.
  effet: >-
    non mesuré : le modèle sert ces seuls points sous le coefficient de l'âge, 22 % de
    moins à 62 ans ; le report les sert entiers, plus tard, ce qui vaut mieux pour qui
    vit assez longtemps
- version: [accord_du_18_mars_2011, accord_du_30_octobre_2015, regime_unifie]
  textes: >-
    annexes E et V de 2011, article 4 ; accord du 17 novembre 2017, article 85, 3 ;
    avenant n° 15 du 16 mars 2023
  ecart: >-
    Le modèle prend la table des trimestres manquants à tout âge. Jusqu'au 16 mars 2023,
    les textes ne l'ouvrent qu'entre l'âge légal de L. 161-17-2 et celui du 1° de L.
    351-8 : avant l'âge légal, l'assuré n'avait que la table des âges.
  effet: >-
    non mesuré, sans doute nul : le modèle ne liquide la complémentaire qu'avec la
    pension de base, et celle-ci avant l'âge légal qu'au taux plein (carrière longue,
    handicap, incapacité permanente) ; dans le droit, il touchait qui partait avant
    l'âge légal sous une décote, depuis 2015 par le compte de prévention
- version: [regime_unique_arrco_1999, accord_du_13_novembre_2003, accord_du_18_mars_2011,
    accord_du_30_octobre_2015, regime_unifie, avenant_15]
  textes: >-
    accord du 25 avril 1996 (Arrco), article 10 ; accord du 18 mars 2011, article 3 ;
    accord du 17 novembre 2017, article 84, 2
  ecart: >-
    Le modèle ne liquide la complémentaire qu'avec la pension de base (fiche
    liquidation_regime_par_regime) : l'anticipation que les textes lui ouvrent seule,
    « au plus tôt » à 55 ans puis dix ans avant l'âge du 1° de L. 351-8, sous les
    coefficients de 0,43 à 0,7625, n'est jamais servie.
  effet: >-
    non mesuré ici ; la fiche liquidation_regime_par_regime le mesure sur un exemple de
    l'Ircantec, une pension servie un an plus tard à 0,90 au lieu de 0,7625
sources:
  lu_le: 2026-11-03
  prochaine_relecture: 2026-12-31
  a_relire:
  - >-
    Les bénéficiaires de la structure financière, de 1983 à 2003. L'accord du 23 décembre
    1996 (article 2) ne lève l'abattement, de soixante à soixante-cinq ans, qu'aux
    salariés en activité, aux anciens salariés qui terminent leur carrière en artisans de
    la CANCAVA, aux chômeurs indemnisés, aux chômeurs non indemnisés inscrits depuis six
    mois au moins, aux situations que les commissions paritaires y assimilent, aux
    mineurs et aux anciens combattants d'Afrique du Nord ; l'avenant A-208 et l'avenant
    n° 65 du 4 juin 2002 y ajoutent qui a quitté le salariat à cinquante ans au plus tôt,
    après douze ans au moins, pour une activité non salariée hors de la CANCAVA ;
    l'avenant n° 76 du 3
    décembre 2003 l'« élargit [...] à l'ensemble des personnes qui n'étaient plus
    salariées au moment de leur demande de liquidation » (avis d'extension, Journal
    officiel du 17 janvier 2004). Le moteur lève l'abattement de tous, dès 1983 : au
    propriétaire, de dire s'il faut servir la condition, et comment le modèle reconnaît
    l'activité ou le chômage au départ ; puis lire les accords de l'ASF du 4 février 1983,
    du 1er septembre 1990 et du 30 décembre 1993, dont l'index n'a que les notices, pour
    les années 1983 à 1996.
  - >-
    Tranche C d'avant 2016 : la structure financière ne finance que les droits « acquis
    sur les tranches A et B » (accord du 23 décembre 1996, article 3, 1, b), comme l'AGFF
    depuis 2001 et l'accord du 13 novembre 2003 : l'exonération que le moteur refuse à la
    tranche C dès 1991 est datée par eux de 1997 au moins ; les accords de 1990 et 1993
    restent à lire. Le report sans abattement de l'article 102 est lu (16 octobre 2026) :
    une faculté de l'assuré, que servir demanderait de liquider ces points à part, et de
    dire quand le report vaut mieux que le coefficient.
  - >-
    Avant le 1er avril 1983, ce qui exonérait l'inapte et les catégories de L. 332 à
    l'Agirc et à l'Arrco : l'article 18 de l'annexe A de l'accord de 1961 et l'article 8 de
    l'annexe I de la convention de 1947 dans leur rédaction d'alors, non lus. Le moteur
    n'en sert rien, hormis le protocole du 14 juin 1976 à l'Arrco ; les points de l'UNIRS
    liquidés avant 1983, qu'il exonérait au taux plein, prennent depuis le 18 octobre 2026
    le coefficient de l'âge, comme ceux de l'Arrco. L'accord Arrco de 1996 ne permet
    l'anticipation « au plus tôt à 55 ans » qu'« à compter du 1er janvier 1999 » (article
    10) : ce que les régimes de l'Arrco permettaient avant 60 ans, de 1965 à 1998, et si
    leurs coefficients allaient par trimestre ou par année d'âge, reste à lire ; l'Agirc
    les écrit « par trimestre écoulé » dans sa convention mise à jour au 20 mars 2007.
  - >-
    Lu le 3 novembre 2026 : les articles 84, 3 et 85, 3, et avant eux les annexes E et V,
    nomment le régime général et le régime agricole, dont la caisse lit la durée « tous
    régimes de base confondus » (circulaire 2020-02-DRJ, fiche 3, I.1.2.2), comme le
    moteur. Les mineurs de fond, que le moteur ne connaît pas, sont une approximation de
    la fiche. Rien n'est lu pour les clercs de notaire.
  - >-
    Non lus : la version consolidée de l'accord au 1er janvier 2026, sur Calaméo, qui
    refuse la requête — ses avenants l'ont été par les circulaires de la caisse, 2023-01-DRJ
    comprise, qui ne touche ni l'article 84, ni le 85, ni le 102 ; l'accord du 4 février
    1983 (ASF), dont seul le résumé de l'agrément est lu (arrêté du 21 mars 1983, Journal
    officiel du 15 avril 1983), ni ceux qui l'ont prorogé avant 1997 — ni le Medef, qui
    publie celui du 23 décembre 1996, ni le recueil de la caisse, qui commence en 1993, ne
    les donnent —, et le texte d'origine de 1961 ; celui de 1947 est lu, qui ne vaut que
    jusqu'en 1955 (fiche coefficients_anticipation_agirc_1947). L'accord de 1996 confirme
    l'âge seul d'avant le 1er avril 1983, sans en écrire la table ; ni elle, de 1955 à
    1983, ni la table des trimestres manquants dès 1983, que le moteur applique, ne sont
    lues : le COR (document n° 13 du 28 janvier 2009, p. 15) donne à l'Agirc, de 1955 à
    1983, les nombres de la table des âges aux années pleines, de 0,43 à 55 ans à 0,96 à
    64 ans, et à l'Arrco, de 1965 à 1983, ceux de 60 à 64 ans ; les plus anciens textes
    lus sont l'accord Arrco du 25 avril 1996 pour l'âge (65 ans, 0,43 à 55 ans, à compter
    de 1999) et les annexes E et V de 2018 pour les trimestres.
  - >-
    L'Arrco d'avant 1965. Le COR et l'IPP donnent à l'UNIRS, de 1957 à 1965, 0,75 à 60
    ans, 0,80, 0,85, 0,90 et 0,95 à 64 ans, rien avant 60 ans, et un ajournement de 1,05 à
    1,25 que le COR écrit de « 65 ans » à « 69 ans » et l'IPP de l'âge du taux plein à
    quatre ans au-delà : 1,05 à l'âge normal même, le décalage que l'IPP fait à l'Agirc de
    1947 et que le texte de 1947 dément. Aucun ne cite de texte, et le moteur sert ici la
    table des accords. Lire avant d'écrire une table : l'accord du 8 décembre 1961, que le
    Journal officiel du 31 mars 1962 publie en annexe de l'arrêté d'agrément du 27 mars
    1962 (JORFTEXT000000435809), dont l'index n'a que la notice, Légifrance n'en servant le
    fac-similé qu'au navigateur ; l'accord du 15 mai 1957 qui crée l'UNIRS, et son
    règlement, hors du Journal officiel ; le texte qui les change en 1965, que l'IPP date
    du 1er janvier.
  - >-
    L'exemple du dépliant « Décrypter la retraite Agirc tranche C » (63 ans et 11 mois,
    0,8675) est porté, `agirc_arrco_tranche_c_63_ans_11_mois`, pour un cadre sans le taux
    plein : l'écart de la tranche C au taux plein reste sans exemple. Celui de la table
    de septembre 2026, « à 61 ans … vous percevrez 71 % », suppose la complémentaire prise
    sans la retraite de base, que le modèle ne liquide pas à part.
  - >-
    Les avenants n° 65 et A-208 du 4 juin 2002 : leur texte, et leur date d'effet, que
    leurs avis d'extension (Journal officiel du 18 août 2002) ne donnent pas ; la version
    regime_unique_arrco_1999 les porte, sans les dater.
  - >-
    Les catégories que l'Agirc exonérait de 2004 à 2011, après l'avenant A-220 du 30
    septembre 2003 qui l'aligne sur l'Arrco « pour certaines catégories », et la table des
    trimestres manquants de 1983 à 2011 : les rédactions d'alors de l'annexe I et de
    l'annexe V de 1947, et de l'annexe E de 1961, ne sont pas lues ; le moteur sert dès
    1983 les catégories et la table des textes de 2018.
  lectures:
  - type: autre
    reference: >-
      Agirc-Arrco, « Les coefficients de minoration applicables à la retraite
