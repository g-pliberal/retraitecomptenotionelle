    date: 2026-09-27
  - type: autre
    reference: >-
      Convention collective nationale du 14 mars 1947, « Mise à jour au 1 janvier
      2018 ». Annexe I, article 6, § 1er : « L'âge de la retraite dans le régime géré
      par l'AGIRC est égal à celui visé au 1° de l'article L. 351-8 du Code de la
      sécurité sociale (dans la rédaction au 18 mars 2011 de l'article L. 351-8-1° et de
      l'article L. 161-17-2 du Code de la sécurité sociale auquel celui-ci se réfère) »,
      anticipation « au plus tôt 10 ans avant », même table de quarante lignes ; § 3 a) :
      les coefficients s'appliquent « sur les droits du participant constitués sur la
      tranche C jusqu'au 31 décembre 2015 ». Annexe V : elle « n'est pas applicable aux
      droits constitués jusqu'au 31 décembre 2015 sur la tranche C des rémunérations » ;
      article 4 : à qui manquent « 20 trimestres au plus », le coefficient de l'article 6
      « en assimilant à l'âge visé au 1er alinéa de l'article 6 de l'annexe I l'âge auquel
      les intéressés auraient effectivement compté le nombre de trimestres d'assurance
      requis », sans descendre sous celui de l'âge atteint
    url: https://www.agirc-arrco.fr/storage/2021/11/CCN_14mars1947-1.pdf
    date: 2026-09-27
  - type: autre
    reference: >-
      Accord national interprofessionnel du 8 décembre 1961, « Mise à jour au 1 janvier
      2018 ». Annexe A, article 18 : même âge, « dans la rédaction au 18 mars 2011 »,
