      Circulaire Agirc-Arrco 2023-03-DRJ du 5 avril 2023 et avenant n° 15 du 16 mars
      2023 : à l'article 85, 3, les mots « Les participants, ayant un âge compris entre
      celui visé à l'article L. 161-17-2 du code de la sécurité sociale et » sont
      remplacés par « Les participants, ayant un âge inférieur à » ; « Toute liquidation
      de la retraite du régime de base à taux minoré entraîne l'application de l'article
      85 de l'ANI lorsque la retraite complémentaire prend effet à la même date ou à une
      date ultérieure que celle du régime de base » ; « Cette mesure est d'application
      immédiate »
    url: https://www.agirc-arrco.fr/storage/2024/09/2023-03-DRJ_Actualisation_texte_de_base.pdf
    date: 2026-09-27
  - type: autre
    reference: >-
