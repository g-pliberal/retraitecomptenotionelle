  textes:
  - id: KALITEXT000036731682
    reference: >-
      accord national interprofessionnel du 17 novembre 2017 instituant le régime
      Agirc-Arrco de retraite complémentaire, version « applicable au 1er janvier 2019 »,
      copie de la fédération (hors JORF),
      https://www.agirc-arrco.fr/storage/2024/09/201809dc_ANI_du_17_novembre_2017.pdf
    article: articles 84, 85, 1 et 3, 98, et sa note 1, et 102
    en_vigueur: 2019-01-01
    citation: >-
      « Le participant peut bénéficier de sa pension au titre du présent régime sans
      abattement dès lors qu'il a atteint l'âge visé au 1° de l'article L. 351-8 du code
      de la sécurité sociale » ; « au plus tôt 10 ans avant cet âge. Dans ce cas, le
      coefficient d'anticipation viager est appliqué aux points de retraite inscrits au
      compte de l'intéressé » ; sans coefficient « à l'âge auquel il a obtenu la pension
      d'assurance vieillesse du régime général ou du régime des assurances sociales
      agricoles à taux plein » ; les mineurs de fond, sans coefficient « à partir de 60
      ans » ; « Les participants, ayant un âge compris entre celui visé à l'article L.
      161-17-2 du code de la sécurité sociale et celui visé au 1° de l'article L. 351-8
      de ce code, justifiant d'une durée d'assurance inférieure de 20 trimestres au
      plus », le coefficient de leurs trimestres manquants, « Toutefois, l'allocation
      ainsi obtenue ne pourra être inférieure à celle qui serait versée après application
      du coefficient d'anticipation correspondant à l'âge atteint » ; « La liquidation se
      fait simultanément sur toutes les tranches », hors le report des points de la
      tranche C d'avant 2016, « sans abattement » ; article 98, hors des coefficients de
      solidarité, qui ne visent que les participants « nés à partir du 1er janvier
      1957 » : « les participants visés au III et IV de l'article 20 de la loi n°
      2010-1330 du 9 novembre 2010 ainsi qu'au 1° bis de l'article L. 351-8 du code de la
      sécurité sociale qui bénéficient du taux plein dans le régime de base dès 65 ans »,
      et sa note 1 : « Il s'agit d'assurés ayant apporté une aide effective à leur enfant
      handicapé, d'assurés nés entre le 1er juillet 1951 et le 31 décembre 1955 parents
      d'au moins trois enfants, de personnes ayant interrompu leur activité
      professionnelle en raison de leur qualité d'aidant familial »
    lu_le: 2026-11-03
    empreinte: sha256:b8af8df7372e4f897c1ca0c4fd9bf4baaa5b706ec4737b8e51b593c5a2a4fccb
