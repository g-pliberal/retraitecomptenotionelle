      rédactions respectives des articles L. 351-8, 1°, et L. 161-17-2 du code de la
      Sécurité sociale en vigueur à la date du présent accord » ; les coefficients
      « seront appliqués, en conséquence, pour toute liquidation intervenant, au plus
      tôt, 10 ans avant l'âge fixé au 1er alinéa ci-dessus »
