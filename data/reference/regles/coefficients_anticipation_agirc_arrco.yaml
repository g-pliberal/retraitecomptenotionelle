      par la durée, la carrière longue, le handicap, la pénibilité, l'amiante, le 1° bis
      ou le 1° ter de L. 351-8, « pourront faire liquider leurs allocations AGIRC et/ou
      ARRCO, sans abattement, sur les tranches A et B des rémunérations » ; « pour toute
      liquidation d'allocations AGIRC et/ou ARRCO prenant effet à compter du 1er juillet
