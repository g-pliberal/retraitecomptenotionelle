      0,43) et « Coefficients d'anticipation pour carrière courte » (« Coefficients
      applicables en fonction du nombre de trimestres manquants », vingt lignes, de 0,99
      à 0,78) : les valeurs de la table de septembre 2026, ligne pour ligne
    url: https://reglementation.agirc-arrco.fr/home/baremes/listes-area/baremes-1/coefficients-d-anticipation-pour-age.html
    date: 2026-09-27
  - type: autre
    reference: >-
      Accord national interprofessionnel du 17 novembre 2017, version « Applicable au
      1er janvier 2019 » jointe à la circulaire Agirc-Arrco 2018-09-DC du 19 décembre
      2018. Article 84, 1 : pension « sans abattement dès lors qu'il a atteint l'âge visé
      au 1° de l'article L. 351-8 du code de la sécurité sociale » ; 84, 2 : « au plus tôt
      10 ans avant cet âge. Dans ce cas, le coefficient d'anticipation viager est appliqué
      aux points », table de « moins 10 ans 0,43 » à « moins 1 trimestre 0,99 » ; 84, 3 :
      sans coefficient « à l'âge auquel il a obtenu la pension d'assurance vieillesse du
      régime général ou du régime des assurances sociales agricoles à taux plein ».
      85, 3, « Carrières courtes » : « durée d'assurance inférieure de 20 trimestres au
      plus », table de 0,78 pour vingt trimestres manquants à 0,99 pour un, et
      « l'allocation ainsi obtenue ne pourra être inférieure à celle qui serait versée
      après application du coefficient d'anticipation correspondant à l'âge atteint ».
      102 : pour « les points constitués sur la tranche C des rémunérations avant 2016
      dans l'ancien régime AGIRC », « le report de la liquidation de ces points, sans
      abattement, à l'âge mentionné au 1° de l'article L. 351-8 »
    url: https://www.agirc-arrco.fr/storage/2024/09/201809dc_ANI_du_17_novembre_2017.pdf
    date: 2026-09-27
  - type: autre
