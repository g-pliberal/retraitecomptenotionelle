schema_version: 1
id: coefficients_anticipation_agirc_arrco
intitule: >-
  Coefficients d'anticipation de l'Agirc-Arrco, et avant elle de l'Agirc et de l'Arrco :
  liquidée avant l'âge du 1° de l'article L. 351-8 sans le taux plein du régime général
  ou agricole, la pension est multipliée par un coefficient viager qui descend par
  trimestre d'anticipation, de 0,99 à 0,43 dix ans avant ; s'il manque vingt trimestres
  au plus, celui des trimestres manquants, de 0,99 à 0,78, s'applique quand il est plus
  avantageux.
domaine: decote_surcote
regimes: [agirc, agirc_arrco, agirc_entreprises_nouvelles, arrco, arrco_cultes,
  arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles, unirs]
etat: approchee
etape: liquider_chaque_regime
face: droit
effet: >-
  Toute liquidation anticipée d'une complémentaire des salariés du privé : 1 % à 22 % de
  moins sur vingt trimestres, jusqu'à 57 % dix ans avant l'âge du 1° de l'article
  L. 351-8, 67 ans depuis la génération 1955. Les soixante lignes du moteur — quarante
  par l'âge, vingt par les trimestres manquants — sont, à la décimale, celles de l'accord
  du 17 novembre 2017, de la convention de 1947, de l'accord de 1961 et des tables de la
  caisse de septembre 2026 ; son arrondi au trimestre supérieur rend la ligne de l'âge
  atteint, comme l'exemple de la caisse (63 ans et 11 mois : 0,8675). Les points Agirc de
  la tranche C acquis avant 2016, sur la part du salaire entre quatre et huit plafonds
  (au-delà de 152 160 € en 2015), gardent le coefficient pour âge avant 67 ans même au
  taux plein : le moteur les suit depuis le 28 septembre 2026, de l'acquisition
  (`points_abattus_a_l_age`, sur les périodes de la tranche C de 1991 à 2015) à la
  liquidation, où ils prennent ce coefficient quand les autres points n'en prennent
  aucun ou un plus doux — 22 % de moins à 62 ans, 12 % à 64 ans, sur ces seuls points.
  Aucun témoin cadre n'était payé si haut ; un témoin né pour la règle la montre (1955,
  huit fois le salaire moyen, parti à 62 ans avec la durée : 40 % de ses points Agirc à
  0,78), et un second la suit à travers la fusion de 2019 (1960, parti en 2022 : ses
  points Agirc convertis au quotient des valeurs de service du 31 décembre 2018, article
  52, gardent à part ceux de la tranche C d'avant 2016, que l'article 102 nomme encore). Deux approximations : le report de ces points, sans abattement, à l'âge du 1° de
  L. 351-8, que l'assuré peut demander « au moment de la liquidation » (article 102,
  comme avant 2019 l'annexe I de 1947, article 6, § 3 a), et que le moteur ne sert pas,
  faute de liquider une pension en deux fois : il sert la règle de l'article 102, « la
  liquidation se fait simultanément sur toutes les tranches » ; et les liquidations de
  1991 à 2003, où le moteur applique la même règle sans avoir lu l'accord de l'ASF. De
  2011 à 2018, l'âge de référence est celui que la caisse a servi, 65 ans et 9 mois pour
  1952, 66 ans et 2 mois pour 1953, 66 ans et 7 mois pour 1954, 67 ans dès 1955 (sa
  table de décembre 2018), et non celui de la rédaction que l'accord du 18 mars 2011
  fige : le moteur, qui lit l'âge d'annulation du régime de base, rend cette table
  ligne pour ligne. Les textes nomment le régime général et le
  régime agricole, dont la caisse lit la durée « tous régimes de base confondus »
  (circulaire 2020-02-DRJ), comme le moteur. Avant 1955, l'Agirc servait une
  autre table, par année d'âge, et un ajournement : ceux de la convention d'origine
  (fiche coefficients_anticipation_agirc_1947). L'Arrco d'avant 1965 garde ici la table
  des accords, faute du texte de 1961. Jusqu'au 31 mars 1983, l'âge seul abat la
  pension, quelle que soit la durée ; de juillet 1976 à mars 1983, l'Arrco en excepte
  les travailleurs manuels et les mères de famille ouvrières au taux de soixante-cinq
  ans du régime général (protocole du 14 juin 1976). Le moteur levait l'abattement dès
  le 1er janvier 1983, et à toute date sur les points de l'UNIRS ; il n'exceptait pas
  ces deux catégories (18 octobre 2026). Il abattait aussi, jusqu'à l'âge de sa
  génération, le parent de trois enfants né de juillet 1951 à 1955 au taux plein du
  régime général dès soixante-cinq ans, que l'Agirc et l'Arrco servent sans abattement
  depuis le 1er juillet 2011, sauf la tranche C d'avant 2016 : 5 à 8 % de sa
  complémentaire (3 novembre 2026 ; fiche taux_plein_a_soixante_cinq_ans).
lit:
- >-
  l'âge de l'assuré à la date d'effet de sa pension, et l'âge de la retraite de sa
  génération : soixante-cinq ans, puis, depuis le 1er juillet 2011, l'âge du 1° de
  l'article L. 351-8 du code de la sécurité sociale, que le moteur lit à l'âge
  d'annulation de la décote du régime général (legislation/age_annulation_decote.csv)
- >-
  depuis le 1er avril 1983, la durée d'assurance de l'assuré, tous régimes de base, et
  celle du taux plein de sa génération au régime général, qui l'exonère ou lui ouvre la
  table des trimestres manquants
- >-
  ce qui l'exonère encore : l'inaptitude reconnue, une catégorie au taux plein du régime
  général (L. 351-8), le départ anticipé des assurés handicapés ; à l'Arrco, de juillet
  1976 à mars 1983, le travailleur manuel et la mère de famille ouvrière ; depuis le
  1er juillet 2011, le parent de trois enfants né de juillet 1951 à 1955 que le IV de
  l'article 20 de la loi n° 2010-1330 met au taux plein du régime général à soixante-cinq
  ans (fiche taux_plein_a_soixante_cinq_ans)
- >-
  la date d'effet de la pension, qui choisit le texte ; et, pour les points de l'Agirc de
  la tranche C, les périodes de 1991 à 2015 qui les ont inscrits
ecrit:
- >-
  le coefficient qui affecte les points de chaque régime de l'Agirc, de l'Arrco, puis du
  régime unifié, de 0,43 à un, que `abattement_points` rend à `liquider_chaque_regime`,
  et, à part, celui des points de la tranche C acquis avant 2016 ; l'allocation qu'il
  réduit est celle que la majoration pour enfants nés ou élevés reprend (fiche
  majoration_enfants_agirc_arrco)
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/liquider.py, `abattement_points`, et son jumeau) y lit ce qui
# exonère des coefficients : `exoneration_au_taux_plein`, l'abattement levé pour
# qui a la durée du taux plein, et la table des trimestres manquants avec lui ;
# `exonerations`, chacune des `motifs` — l'inaptitude, la fiche d'un taux plein
# par catégorie de L. 351-8, ou celle du taux plein à soixante-cinq ans du parent de
# trois enfants (`liquider.parent_au_taux_plein_du_regime_general`) — que les
# `regimes` nommés servent sans coefficient,
# tous quand ils ne sont pas nommés. Les tables sont celles des périodes
# (`bareme_anticipation`). Elles se coupent aux jours où un texte change la
# règle (tests/test_agirc_arrco_au_droit.py) ; depuis le 1er avril 1983, toutes
# portent les mêmes paramètres, et ce que le droit fait autrement, les
# approximations le disent.
versions:
- id: l_age_seul
  statut: supposee
  hypothese: >-
    jusqu'au 30 juin 1976, l'Agirc et l'Arrco abattent à l'âge seul toute liquidation
    avant soixante-cinq ans, quelle que soit la durée, comme le modèle le servait : ce
    que le protocole du 14 juin 1976 lève à l'Arrco pour deux catégories, et la
    structure financière, le 1er avril 1983, pour qui a la durée. Ce qui exonérait alors
    l'inapte ou une catégorie — l'article 18 de l'annexe A de l'accord du 8 décembre
    1961, l'article 8 de l'annexe I de la convention de 1947, dans leur rédaction
    d'alors — n'est pas lu, et le modèle n'en sert rien
  fiabilite: moyenne
  bornes:
    liquidation.date_effet: [null, 1976-07-01]
  contenu:
    droit: >-
      toute liquidation avant l'âge normal, soixante-cinq ans, prend le coefficient de
      l'âge atteint, sans exonération
    parametres:
      exoneration_au_taux_plein: false
      exonerations: []
  exemples: aucun trouvé
- id: protocole_du_14_juin_1976
  statut: lue
  textes:
  - reference: >-
      protocole d'accord du 14 juin 1976 concernant l'attribution d'une retraite sans
      abattement à certains travailleurs manuels, conclu par le CNPF et la CGPME, la
      CFDT, la CFTC, la CGC, la CGT et la CGT-FO, hors du Journal officiel ; copie du
      Medef, https://accords.medef.com/documents/accord_391.pdf
    en_vigueur: 1976-07-01
    citation: >-
      « Les travailleurs manuels visés au nouvel article 70-2 du décret du 29 décembre
      1945 et remplissant les conditions de travail définies aux articles 70-3 et 70-4 du
      décret précité et dont les droits prendront effet à partir du 1er juillet 1976
      pourront bénéficier, auprès des régimes adhérents à l'Arrco, d'une retraite
      calculée sans application de coefficients d'abattement. »
    lu_le: 2026-10-18
    empreinte: sha256:980b7137b5df09364577a2a5bd69c8a65290ff35330750fa498203701228e306
  bornes:
    liquidation.date_effet: [1976-07-01, 1983-04-01]
  contenu:
    droit: >-
      l'article 70-2 met au taux de soixante-cinq ans dès soixante ans « a) Des
      travailleurs manuels salariés », au travail de l'article 70-3, et « b) Des mères de
      famille salariées », au travail manuel ouvrier de l'article 70-4 (fiches
      taux_plein_travailleurs_manuels et taux_plein_meres_de_famille_ouvrieres) ; le
      protocole, qui vise les conditions des deux articles, leur sert les points de tous
      les régimes de l'Arrco, UNIRS et tranche 2 compris, sans coefficient. Il ne nomme
      pas l'Agirc, qui les abat encore à l'âge seul
    beneficiaire: >-
      le travailleur manuel et la mère de famille ouvrière au taux de soixante-cinq ans
      du régime général
    parametres:
      exoneration_au_taux_plein: false
      exonerations:
      - motifs: [taux_plein_travailleurs_manuels, taux_plein_meres_de_famille_ouvrieres]
        regimes: [arrco, arrco_tranche_2, unirs]
  exemples: aucun trouvé
- id: structure_financiere
