    reference: >-
      Arrêté du 24 avril 2018 portant extension et élargissement de l'accord « conclu le
      17 novembre 2017, publié au Journal officiel du 1er mars 2018 »
      (JORFTEXT000036847920) ; arrêté du 11 juillet 2023 pour l'avenant n° 15
