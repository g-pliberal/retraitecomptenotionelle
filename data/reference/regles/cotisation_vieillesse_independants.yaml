approximations:
- version: avant_le_bareme_propre
  textes: >-
    article 6 du décret n° 73-76 (rédaction du 1er janvier 1978), D. 633-6 et D. 633-10
    jusqu'au décret n° 2000-834 ; L. 131-6 depuis le 30 décembre 1999
  ecart: >-
    Le modèle porte au compte de chaque année le revenu de cette année, celui de la
    cotisation régularisée : depuis 1973, la cotisation provisionnelle est ajustée « sur
    la base des revenus de l'année à laquelle se rapportent ces cotisations » (article 9
    du décret n° 73-76, D. 633-10 jusqu'en 2008), et R. 634-1 calcule la pension sur
    « l'ensemble des cotisations versées ». Sauf la première année civile d'activité,
    jusqu'en 1999 : sa cotisation, que ni l'article 6 ni D. 633-6 ne disent
    provisionnelle, est assise sur « un revenu forfaitaire égal au tiers du plafond »,
    que l'ajustement ne relève jamais et n'abaisse que sur demande de l'assuré, quand son
    revenu est moindre. L. 131-6 la rend provisionnelle le 30 décembre 1999, le décret
    n° 2000-834 aligne D. 633-6 et D. 633-10 le 1er septembre 2000. La rédaction de
    l'article 6 d'avant 1978 n'est pas dans l'index LEGI.
  effet: >-
    nul sur la retraite de base d'un artisan de 1980 à 2004 à 0,8 plafond, salarié avant,
    dont la première année n'est pas parmi les meilleures (1980 ramenée au tiers du
    plafond, moteur Python, 31 octobre 2026) ; la complémentaire, que le modèle tire du
    même revenu, perd 2 % : elle suit sa propre assiette, l'avant-dernière année
    (D. 635-4, de 1985 à 2004)
- version: avant_le_bareme_propre
  textes: >-
    article 10 du décret n° 73-76, D. 633-11 et D. 633-5, jusqu'au 1er janvier 2008
  ecart: >-
    Les cotisations des deux dernières années d'une activité qui cesse ne sont jamais
    régularisées : ne font pas l'objet de l'ajustement « les cotisations des assurés qui
    ont cessé leur activité professionnelle à la date à laquelle l'ajustement aurait dû
    être opéré », ni celles « basées sur un revenu annuel pris en compte pour la
    liquidation d'un avantage de vieillesse » (article 10 du décret n° 73-76, D. 633-11).
    Leur revenu porté au compte reste la base provisionnelle de D. 633-5, celui de
    l'avant-dernière année (les revenus « déclarés l'année précédente » avant 1995 ;
    ceux de l'année précédente de 1995 à 2003, la première fraction semestrielle sur
    l'avant-dernière), ou le forfait des deux premières années ; le modèle y porte le
    revenu de chacune.
  effet: >-
    pour l'artisan de 1980 à 2004 parti en 2005, 2003 et 2004 au revenu de 2002 : sa
    retraite de base perd 0,79 %, sa pension totale 0,44 % ; rien pour un artisan au-delà
    du plafond, que le plafond borne déjà (de 1973 à 1999 à 1,2 plafond)
- version: [avant_le_bareme_propre, deplafonnee_progressive, bareme_de_2017, bareme_de_2025]
  ecart: >-
    L'année du départ, la caisse retient, pour le revenu cotisé et les trimestres, la plus
    petite de la cotisation encaissée à la date d'arrêt du compte et de la cotisation
    provisionnelle appelée, au prorata des jours écoulés, et écarte une dette ancienne
    réglée après la date limite de versement, trois mois avant le départ (exemples
    « Prise en compte de la date d'arrêt du compte », pour 2014, 2015 et 2018) ; le
    modèle porte au compte le revenu de l'année, au prorata de ses mois, les cotisations
    étant tenues pour versées.
  effet: non mesuré
