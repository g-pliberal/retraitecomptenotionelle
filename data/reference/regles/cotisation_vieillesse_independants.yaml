code:
  python: >-
    donnees/regimes.py : PeriodeRegime.taux_du_cotisant, charger_taux_annuels ;
    moteur/compte.py : ConstructeurCompte.taux_effectif ; remuneration.py :
    bloc_droit_en_vigueur
  javascript: >-
    moteur/js/regimes.js : PeriodeRegime.tauxDuCotisant ; moteur/js/compte.js :
    ConstructeurCompte.tauxEffectif ; moteur/js/remuneration.js : blocDroitEnVigueur
  parametres: >-
    regimes/taux_cotisation_annuels.csv : rsi, taux_plafonne_non_salarie,
    taux_deplafonne_non_salarie
  tests: tests/test_independants.py
  moteur: >-
    charger_taux_annuels lit les mesures _non_salarie ; ConstructeurCompte.taux_effectif
    compte la cotisation déplafonnée. regimes/taux_cotisation_annuels.csv porte les
    lignes du RSI et les mesures taux_plafonne_non_salarie et
    taux_deplafonne_non_salarie du régime général, certifiées sur D. 633-3 par
    scripts/fetch/dila_legi_taux_independants.py et scripts/verifier_donnees.py.
referents:
  devcrafting_retraites: prélève sur l'artisan 0,60 % au-dessus du plafond, son taux propre
historique:
- >-
  2026-10-13 — action 138, étape 18 : depuis 2018, la fiche de paie et le compte
  prêtaient à l'artisan et au commerçant les taux du salarié et de son employeur
  au régime général (15,45 % et 2,30 à 2,51 %), convention que les limites
  déclaraient ; ils prennent leur barème.
- >-
  2026-10-31 — action 177, étape 5 : l'assiette d'avant 2007, que l'action 175 mettait
  à relire, est tranchée par les textes. La cotisation définitive est celle du revenu
  de l'année, que le modèle porte au compte, sauf la première année d'activité jusqu'en
  1999, les deux dernières d'une activité qui cesse avant 2008 et l'année du départ :
  trois approximations, que le propriétaire a choisi de déclarer sans les modéliser.
  La fiche passe de `transcrite` à `approchee`.
effet: >-
  Artisans, commerçants et libéraux non réglementés, depuis 2018 : sous le
  plafond, presque rien (17,75 % des deux côtés jusqu'en 2023, 0,12 point de moins
  en 2024, 0,09 en 2026) ; au-dessus, 1,70 à 1,79 point de moins sur la part qui
  le dépasse. Le système actuel ne bouge pas ; les comptes notionnels
  rétroactifs d'un artisan à deux fois le salaire moyen baissent de 0,6 à 0,8 %,
  et sa fiche de paie du droit en vigueur prélève 331 € de moins en 2019 sur
  60 000 € de revenu.
