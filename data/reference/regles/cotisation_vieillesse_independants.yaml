code:
  python: >-
    donnees/regimes.py : PeriodeRegime.taux_du_cotisant, charger_taux_annuels ;
    moteur/compte.py : ConstructeurCompte.taux_effectif ; remuneration.py :
    bloc_droit_en_vigueur
  javascript: >-
    moteur/js/regimes.js : PeriodeRegime.tauxDuCotisant ; moteur/js/compte.js :
    ConstructeurCompte.tauxEffectif ; moteur/js/remuneration.js : blocDroitEnVigueur
  parametres: >-
    regimes/taux_cotisation_annuels.csv : rsi, taux_plafonne_non_salarie,
    taux_deplafonne_non_salarie
  tests: tests/test_independants.py
  moteur: >-
    charger_taux_annuels lit les mesures _non_salarie ; ConstructeurCompte.taux_effectif
