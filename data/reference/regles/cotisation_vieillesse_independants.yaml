schema_version: 1
id: cotisation_vieillesse_independants
intitule: >-
  L'artisan et le commerçant cotisent à la vieillesse de base selon leur barème
  propre (D. 633-3) : depuis 2014, un taux sous le plafond et un taux sur la
  totalité du revenu, 17,15 % et 0,60 % depuis 2017, 17,15 % et 0,72 % depuis
  2025 ; intégrés au régime général en 2018, ils gardent ce barème, et non celui
  du salarié et de son employeur.
domaine: cotisations
regimes: [rsi, regime_general]
etape: foyer_et_net
face: cotisation
etat: approchee
lit:
- le revenu de l'année et le statut, qui dit si l'assuré a un employeur
  (legislation/affiliations.yaml, sans_employeur)
- >-
  le barème de l'année, dans regimes/taux_cotisation_annuels.csv — les taux du RSI
  jusqu'en 2017, les mesures taux_plafonne_non_salarie et
  taux_deplafonne_non_salarie du régime général depuis 2018
ecrit:
- la cotisation de vieillesse de base que la fiche de paie du droit en vigueur
  prélève, et celle que le compte notionnel porte
dates_qui_decident:
- revenu.annee
