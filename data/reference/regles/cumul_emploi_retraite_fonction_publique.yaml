    date: 2026-11-12
  - type: service_public
    reference: >-
      fiche F12402, « Cumul emploi-retraite du fonctionnaire », vérifiée le 1er janvier
      2026 : le plafond de 8 198,10 € augmenté du tiers de la pension, et son exemple
      (pension de 18 000 € ; revenu de 21 623 € ; 7 424,90 € déduits)
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F12402
    date: 2026-09-30
  - type: legifrance
    reference: >-
      L. 86 CPCMR, rédaction du 31 décembre 2025 (LEGIARTI000053279638, loi n° 2025-1403,
      article 102), lue entière dans l'index LEGI du 11 novembre 2026, avec L. 6
      (LEGIARTI000028498970), L. 86-1 (LEGIARTI000053279653), R. 92
      (LEGIARTI000006363055), l'article 58 du décret n° 2003-1306
      (LEGIARTI000006400929) et l'article 48 du décret n° 2004-1056
      (LEGIARTI000006781527), qui règlent le cumul des pensions de la CNRACL et des
      ouvriers de l'État « conformément aux dispositions applicables aux fonctionnaires
      de l'Etat »
    date: 2026-11-12
  - type: jorf
    reference: >-
      décrets n° 2026-1016 (JORFTEXT000055047286) et n° 2026-1017 (JORFTEXT000055047344)
      du 2 novembre 2026 relatifs au cumul emploi retraite, Journal officiel du 3
      novembre 2026, lus dans l'index JORF du 11 novembre 2026 : leurs articles 1er
      (R. 91, R. 92, D. 37 et D. 37 bis du code des pensions), les articles 3 et 4 du
      premier (CNRACL, ouvriers de l'État), l'article 3 du second (D. 161-2-5 à
      D. 161-2-13 du code de la sécurité sociale)
    date: 2026-11-12
  - type: autre
    reference: >-
      Service des retraites de l'État, « Les règles de cumul » des militaires, page sans
      date, lue le 12 novembre 2026 : « Si vous exercez dans le secteur privé, vous
      pouvez cumuler votre pension de l'État et une rémunération d'activité » ; dans le
      secteur public, cumule le titulaire « d'une pension de non officier rémunérant
      moins de 25 ans de services (militaires et civils) » et le retraité qui a « atteint
      la limite d'âge de [son] ancien grade » ou « la limite de durée de service » ; rien
      sur 2027
    url: https://retraitesdeletat.gouv.fr/actif/militaires/cumul
    date: 2026-11-12
