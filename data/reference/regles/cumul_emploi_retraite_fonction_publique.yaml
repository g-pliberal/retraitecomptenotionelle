  bornes:
    liquidation.date_effet: [2004-01-01, null]
    liquidation.premiere_pension_de_base: [null, 2015-01-01]
    periode.debut: [2009-01-01, null]
  contenu:
    droit: >-
      la version tiers_de_la_pension_2004, et la pension « peut être entièrement
      cumulée » par qui a liquidé toutes ses pensions, à l'âge du taux plein
      automatique, ou à l'âge légal avec la durée requise
    parametres:
      employeur: public
      cumul_integral: true
  exemples: aucun trouvé
- id: tout_employeur_2015
  statut: lue
  textes:
  - {id: LEGIARTI000028498621, article: "L. 84 CPCMR", en_vigueur: 2014-01-22}
  - {id: LEGIARTI000047453522, article: "L. 84 CPCMR", en_vigueur: 2023-09-01}
  bornes:
    liquidation.date_effet: [2004-01-01, null]
    liquidation.premiere_pension_de_base: [2015-01-01, 2027-01-01]
    periode.debut: [2009-01-01, null]
  contenu:
    droit: >-
      pour la première pension prise depuis le 1er janvier 2015, le plafond du tiers
      vaut pour les revenus « de l'un des employeurs mentionnés à l'article L. 86-1,
      ou de tout autre employeur pour les fonctionnaires civils » ; « les articles
      L. 161-22 et L. 161-22-1 A du même code ne sont pas applicables aux bénéficiaires
      d'une pension militaire »
    parametres:
      employeur: tout_employeur_pour_les_civils
      cumul_integral: true
  exemples: [sp_f12402_cumul_sous_le_plafond, sp_f12402_cumul_plafond_depasse]
- id: regles_communes_2027
