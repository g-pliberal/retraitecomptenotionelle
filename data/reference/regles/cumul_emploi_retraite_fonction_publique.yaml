  - {id: LEGIARTI000053279635, article: "L. 84 CPCMR", en_vigueur: 2025-12-31}
  - {id: LEGIARTI000053279638, article: "L. 86 CPCMR", en_vigueur: 2025-12-31}
  - reference: >-
      décret n° 2026-1016 du 2 novembre 2026, article 1er (JORFARTI000055047298) : R. 91
      abrogé, R. 92 renvoyé à L. 86 ; décret n° 2026-1017 du 2 novembre 2026, article 1er
      (JORFARTI000055047356) : D. 37 et D. 37 bis du code des pensions
    en_vigueur: 2027-01-01
  bornes:
    liquidation.date_effet: [2004-01-01, null]
    liquidation.premiere_pension_de_base: [2027-01-01, null]
    periode.debut: [2009-01-01, null]
  contenu:
    droit: >-
      pour la première pension prise depuis le 1er janvier 2027, « les articles
      L. 161-22 à L. 161-22-1-4 du code de la sécurité sociale s'appliquent à
      l'ensemble des personnes régies par le présent code », « sous réserve du présent
      titre » (L. 84) : les trois régimes selon l'âge de la fiche
      cumul_emploi_retraite_et_retraite_progressive, dont le C du III de L. 161-22 sort
      ceux qui « peuvent cumuler entièrement leur pension », les titulaires « d'une
      pension militaire prévue à l'article L. 6 » et « de pensions civiles et militaires
      ou d'une solde de réforme allouées pour invalidité » (L. 161-22-1-2, 4° et 5°).
      « Par dérogation au C », le titulaire d'une pension militaire payé par un employeur
      de L. 86-1 cumule « dans la limite d'un plafond annuel égal à la somme, pour l'année
      considérée, du tiers du montant brut de sa pension et de la moitié du minimum fixé
      au a de l'article L. 17. Lorsqu'un excédent est constaté, la pension est réduite à
      due concurrence » ; cumulent entièrement « le titulaire d'une pension militaire non
      officier rémunérant moins de vingt-cinq années de services », celui qui atteint « la
      limite d'âge du grade » ou « la limite de durée de services », et le titulaire
      « d'une pension militaire ou d'une solde de réforme allouée pour invalidité »
      (L. 86). Le service des retraites de l'État détecte l'activité et calcule la
      réduction de ces pensions (D. 37)
    parametres:
      regle: celle_du_code_de_la_securite_sociale
      pension_militaire:
        employeur: public
        part_de_la_pension: 0.333333
        abattement_en_minimum_garanti: 0.5
        services_du_non_officier_en_annees: 25
      pension_d_invalidite: cumul_entier
  exemples: aucun trouvé
approximations:
- ecart: >-
    avant 2004, la franchise du traitement de l'indice 100 n'est pas lue : seule celle
    du quart de la pension s'applique, mois par mois ; la limite d'âge est de
    soixante-cinq ans, soixante en catégorie active, cinquante-cinq en catégorie
    super-active ; la pension militaire d'avant 2004 payée par un employeur public
    n'est pas calculée, et la page le dit
  effet: non mesuré
- ecart: >-
    l'excédent de l'année se répartit également entre ses mois d'activité, hors ceux
    du cumul intégral ; l'employeur public est celui du contractuel de la fonction
    publique, et la pension militaire ne compte, depuis 2015, que les revenus d'un
    employeur public
  effet: non mesuré
- ecart: >-
    les activités que L. 86 laisse libres (artistiques, invalidité, sous-officiers de
    moins de vingt-cinq ans de services) ne se déclarent pas ; la CNRACL et les
    ouvriers de l'État suivent la règle du code des pensions, que leurs décrets
    reprennent sans que le modèle les ait relus
  effet: non mesuré
- version: [regles_communes_2027]
  ecart: >-
    la limite d'âge du grade est celle que le modèle prête à la catégorie, faute de grade
    à la saisie (fiche limite_age_militaires) : cinquante-neuf ans pour le non-officier,
    soixante-six pour l'officier, les plus hautes de L. 4139-16 du code de la défense ;
    la limite de durée de services du militaire sous contrat n'est pas lue
  effet: >-
    le militaire d'un grade à la limite plus basse — quarante-sept ans pour un sergent,
    cinquante-neuf pour un officier des armes — reste plafonné devant un employeur
    public jusqu'à la limite que le modèle lui prête, quand le droit le libère plus
    tôt ; non mesuré
- version: [regles_communes_2027]
  ecart: >-
    les années de services que la pension rémunère sont celles des statuts de
    fonctionnaire et de militaire de la carrière, au mois près, bonifications exclues ;
    l'employeur public est celui du contractuel de la fonction publique, sans
    distinguer l'établissement industriel et commercial, que L. 86-1 ne nomme pas ;
    l'année où la limite d'âge est atteinte, l'excédent ne compte que les revenus des
    mois qui la précèdent, et se répartit entre eux
  effet: non mesuré
- version: [regles_communes_2027]
  ecart: >-
    la première pension de base est celle du départ déclaré : la pension militaire ou
    d'invalidité prise avant 2027 par qui déclare un départ en 2027 ou après suit la
    règle de 2027, comme le XI de l'article 102 l'écrit, mais dès l'activité qui précède
    l'entrée en jouissance de son autre pension de base
  effet: non mesuré
sources:
  lu_le: 2026-11-12
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 30 septembre 2026, avec le domaine des départs multiples ; le moteur ne
    la calcule pas encore. Le décret en Conseil d'État de L. 85 n'a pas été trouvé
    dans l'index : R. 91 et R. 92 disent la déclaration et les revenus retenus.
    Vérifier que les décrets de la CNRACL et des ouvriers de l'État (décret
    n° 2003-1306, article 64 ; décret n° 2004-1056) suivent la même règle.
  - >-
    Relevé le 12 novembre 2026, en portant la pension militaire de 2027 : avant 2027, le
    modèle plafonne devant un employeur public la pension d'invalidité et celle du
    non-officier de moins de vingt-cinq ans de services, que L. 86, dans ses rédactions
    de 2004 à 2023, laisse se cumuler entièrement ; depuis que la saisie porte la
    radiation pour invalidité et que le cumul de 2027 compte les services, les deux se
    calculent. À écrire, le test d'abord, sur les versions de 2004 à 2015.
  - >-
    La page du service des retraites de l'État (« Les règles de cumul », lue le 12
    novembre 2026) et la fiche F12402 de service-public, vérifiée le 1er janvier 2026,
    ne disent pas encore la règle de 2027 : la seconde annonce qu'elle « sera mise à
    jour à cette date ». Les relire en janvier 2027, y chercher un exemple chiffré du
    militaire, et ce que le service fait de l'année où la limite d'âge est atteinte.
