schema_version: 1
id: cumul_emploi_retraite_fonction_publique
intitule: >-
  Cumul emploi-retraite du fonctionnaire : sa pension se cumule librement avec un emploi
  privé jusqu'en 2014 ; payé par un employeur public — puis, pour le civil dont la
  première pension date de 2015, par tout employeur —, il ne peut toucher dans l'année
  plus du tiers de sa pension, majoré de la moitié du minimum garanti, sans que
  l'excédent soit déduit de sa pension, hors cumul intégral au taux plein. Avant 2004,
  le fonctionnaire parti avant sa limite d'âge ne touchait, d'un employeur public, que
  l'excédent de sa pension sur sa rémunération.
domaine: cumul
regimes: [fonction_publique_etat, cnracl, fspoeie]
etape: echeancier
face: droit
etat: approchee
lit:
- l'activité exercée après le départ, ses dates, son revenu, et son employeur (public
  ou non)
- la pension de base du fonctionnaire, et le minimum garanti de l'année
- le taux plein, et la liquidation de toutes les pensions
- la limite d'âge de l'emploi quitté, avant 2004
ecrit:
- la pension servie pendant l'activité, réduite de l'excédent des revenus
dates_qui_decident:
- liquidation.date_effet
- liquidation.premiere_pension_de_base
- periode.debut
versions:
- id: limite_d_age_1970
  statut: lue
  textes:
  - {id: LEGIARTI000006362847, article: "L. 86 CPCMR", en_vigueur: 1970-12-31}
  bornes:
    liquidation.date_effet: [null, 2004-01-01]
  contenu:
    droit: >-
      les pensionnés « rayés des cadres [...] avant d'avoir atteint la limite d'âge qui
      leur était applicable dans leur ancien emploi, et qui perçoivent une rémunération
      d'activité servie par l'une des collectivités énumérées à l'article L. 84, ne
      peuvent bénéficier de leur pension avant d'avoir atteint l'âge correspondant à
      cette limite d'âge, sauf à percevoir [...] l'excédent de la pension sur le montant
      de cette rémunération » ; cumulent intégralement les pensions d'invalidité, les
      sous-officiers de moins de vingt-cinq ans de services, et qui gagne au plus « le
      quart du montant de la pension » ou le traitement de l'indice 100
    parametres:
      employeur: public
      franchise_en_part_de_pension: 0.25
  exemples: aucun trouvé
- id: tiers_de_la_pension_2004
  statut: lue
  textes:
  - {id: LEGIARTI000006362844, article: "L. 84 CPCMR", en_vigueur: 2004-01-01}
  - {id: LEGIARTI000006362846, article: "L. 85 CPCMR", en_vigueur: 2004-01-01}
  - {id: LEGIARTI000006362848, article: "L. 86 CPCMR", en_vigueur: 2004-01-01}
  - {id: LEGIARTI000006362850, article: "L. 86-1 CPCMR", en_vigueur: 2004-01-01}
  - {id: LEGIARTI000006363055, article: "R. 92 CPCMR", en_vigueur: 2004-01-01}
  bornes:
    liquidation.date_effet: [2004-01-01, null]
    periode.debut: [null, 2009-01-01]
  contenu:
    droit: >-
      « L'article L. 161-22 du code de la sécurité sociale n'est pas applicable » au
      fonctionnaire (L. 84) ; payé par un employeur de L. 86-1, « Le montant brut des
      revenus d'activité [...] ne peut, par année civile, excéder le tiers du montant
      brut de la pension pour l'année considérée. Lorsqu'un excédent est constaté, il
      est déduit de la pension après application d'un abattement égal à la moitié du
      minimum fixé au a de l'article L. 17 » (L. 85) ; cumul entier pour les activités
      artistiques, l'invalidité, les militaires non officiers de moins de vingt-cinq
      ans de services, la limite d'âge atteinte avant 2004 (L. 86)
    parametres:
      employeur: public
      part_de_la_pension: 0.333333
      abattement_en_minimum_garanti: 0.5
  exemples: aucun trouvé
- id: cumul_integral_2009
