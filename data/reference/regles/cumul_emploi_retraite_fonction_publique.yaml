code:
  python: >-
    droit/cumul.py : _Calcul._fonctionnaire, _deduction_fonction_publique,
    _entiere_2027, _hors_des_ages_2027, fonction_publique_quittee,
    pension_militaire_servie, PART_DE_LA_PENSION, ABATTEMENT_MINIMUM_GARANTI,
    SERVICES_DU_NON_OFFICIER, FRANCHISE_1970, LIMITES_D_AGE_1970 ; droit/limite_age.py :
    limite_de_la_ligne ; echeancier.py : Echeancier._cumuler
  javascript: >-
    moteur/js/droit/cumul.js : fonctionnaire, deductionFonctionPublique, entiere2027,
    horsDesAges2027, fonctionPubliqueQuittee, pensionMilitaireServie,
    PART_DE_LA_PENSION, ABATTEMENT_MINIMUM_GARANTI, SERVICES_DU_NON_OFFICIER,
    FRANCHISE_1970, LIMITES_D_AGE_1970 ; moteur/js/droit/limite_age.js :
    limiteDeLaLigne ; moteur/js/echeancier.js : Echeancier._cumuler ;
    moteur/js/pages.js : cumulEmploiRetraite, sortDeLaBase
  parametres: >-
    contenu.parametres de chaque version : employeur, franchise_en_part_de_pension,
    part_de_la_pension, abattement_en_minimum_garanti, cumul_integral, regle,
    pension_militaire, pension_d_invalidite ;
    legislation/minimum_garanti.csv, legislation/minimum_garanti_montants.csv
  tests: >-
    tests/test_emploi_retraite.py ; tests/js/moteur.test.js ; tests/test_web.py ; les
    exemples sp_f12402_* du registre ; les témoins cumul_fonctionnaire_contractuel,
    cumul_militaire_2027 et simuler_cumul_fonctionnaire
  moteur: >-
    L'abattement se compte en minimum garanti de l'année, que ses deux séries portent ;
    les constantes des deux moteurs redisent les versions.
historique:
- >-
  2026-09-30 — née avec le domaine des départs multiples, de la fiche
  cumul_emploi_retraite_et_retraite_progressive, qui ne portait pas le fonctionnaire.
- >-
  2026-09-30 — calculée, mois par mois de l'activité après le départ, avec le cumul
  du salarié ; l'exemple de la fiche F12402 entre au registre des exemples publiés.
- >-
  2026-11-12 — action 192, étape 5 : pour la première pension de 2027, la pension
  militaire et la pension d'invalidité sortent des trois régimes selon l'âge (L. 161-22,
  III, C, 1°) ; la pension militaire garde, devant un employeur public, le plafond du
  tiers de L. 86, avec ses exceptions. L. 86 du 31 décembre 2025 est rattaché à la
  version regles_communes_2027.
effet: >-
  Le fonctionnaire retraité qui travaille avant le taux plein : payé par un employeur
  public, ou par tout employeur s'il est civil et parti depuis 2015, il perd l'excédent
  de ses revenus sur le tiers de sa pension et 8 198,10 € en 2026 — 7 424,90 € pour
  une pension de 18 000 € et un revenu de 21 623 €, l'exemple de la fiche F12402, que
  le modèle reproduit. La sous-officière partie à quarante-cinq ans en février 2027 et
  salariée du privé d'août 2027 à janvier 2030 garde sa pension entière, quand le
  modèle la lui retirait toute, 60 730 € en trente mois.
