schema_version: 1
id: age_ouverture_banque_de_france_actifs
intitule: >-
  L'agent titulaire de la Banque de France dont l'emploi appartient à l'une des catégories
  que le conseil général nomme ouvre son droit à pension cinq ans avant les autres : à
  cinquante-cinq ans depuis le règlement de 2007 ; depuis le 9 mai 2012, à cinquante-sept
  ans, l'âge étant relevé de trois mois par semestre pour les agents nés depuis 1956,
  puis, depuis le 26 juin 2014, pour ceux nés depuis 1961 ; pour les pensions de 2025 et
  après, à l'âge de L. 161-17-2 abaissé de cinq années, cinquante-neuf ans, relevé de trois
  mois par génération pour les agents nés depuis 1968 (articles 26 et 72 du règlement
  annexé au décret n° 2007-262).
domaine: age
regimes: [banque_de_france]
etape: ouvrir_le_droit
face: droit
etat: approchee
lit:
- >-
  l'appartenance de l'agent à l'une de ces catégories, que la saisie déclare (`banque`),
  à son départ
- sa date de naissance, au semestre
- la date d'effet de la pension, qui désigne la rédaction du règlement
ecrit:
- >-
  l'âge d'ouverture du droit à pension de l'agent, d'où partent le mois où son droit
  s'ouvre et la ligne de sa décote (`decote_banque_de_france`)
dates_qui_decident:
- liquidation.date_effet
