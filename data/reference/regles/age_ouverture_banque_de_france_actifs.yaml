  ecart: >-
    l'âge des autres agents reste au modèle celui du droit commun des salariés, que le
    règlement de la Banque relève plus tard (article 72, I, 1°) : l'écart, relevé le 17
    novembre 2026, attend sa correction
  effet: non mesuré
effet: >-
  L'agent qui déclare un emploi de ces catégories liquide sa pension de la Banque dès son
  départ, cinq ans avant les autres : né en janvier 1962 et parti à cinquante-sept ans en
  2019, il la reçoit aussitôt, avec dix-neuf trimestres de décote à 1,25 %, là où le
  modèle la repoussait à l'âge de droit commun. Sans cette déclaration, rien ne change.
