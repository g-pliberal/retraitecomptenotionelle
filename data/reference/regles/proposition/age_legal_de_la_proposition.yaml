schema_version: 1
id: age_legal_de_la_proposition
intitule: >-
  L'âge légal de la proposition : 65 ans pour les départs qui prennent effet à
  compter de la bascule ; qui serait parti plus tôt part à cet âge, et travaille
  jusque-là dans la situation de sa dernière année.
domaine: age
etape: ouvrir_le_droit
face: droit
etat: transcrite
effet: >-
  Le scénario 6 : tout départ que le droit en vigueur place avant 65 ans, à
  compter de la bascule ; les scénarios 2 à 5 gardent les âges du droit réel.
lit:
- la date d'effet et l'âge du départ
- la dernière année de la carrière, que la prolongation répète
ecrit:
- la carrière poursuivie jusqu'à l'âge légal, et son départ reporté
dates_qui_decident: [liquidation.date_effet, age_atteint]
versions:
- id: age_legal_de_la_proposition_proposition
  textes:
  - reference: README.md, le texte de la proposition (docs/architecture.md, § 3.1)
    article: les six scénarios, scénario 6
    citation: >-
      Et un âge légal de départ de 65 ans à compter de 2026 : qui serait parti
      plus tôt sous le droit en vigueur part à cet âge, et travaille jusque-là.
    lu_le: 2026-09-27
  - reference: README.md, le texte de la proposition (docs/architecture.md, § 3.1)
    article: l'âge légal de départ de la proposition
    citation: >-
      L'inapte, l'ex-invalide et le fonctionnaire radié pour invalidité, que le
      droit en vigueur pensionne à soixante-deux ans ou dès sa radiation, n'y font
      pas exception : leur compte se liquide à 65 ans, comme celui de tous, et
      l'assurance invalidité, hors du système de retraite, les couvre jusque-là.
    lu_le: 2026-10-01
  bornes:
    liquidation.date_effet: [null, null]
  contenu: >-
    Un départ qui prend effet à compter du 1er janvier de la bascule, avant
    `age_legal_liberal`, est reporté à cet âge : la carrière se poursuit
    jusque-là dans la situation de sa dernière année (`Carriere.prolongee`).
    Un départ antérieur à la bascule est resté sous le droit en vigueur, et ne
    bouge pas. Dans un compte notionnel, le report relève la pension : des
    cotisations en plus, un diviseur plus petit. La garantie vieillesse,
    ouverte au même âge, est alors due dès la liquidation. L'invalidité n'y fait
    pas exception, le propriétaire l'a décidé le 1er octobre 2026 (domaine de
    l'invalidité et de l'inaptitude) : l'inapte, l'ex-invalide et le
    fonctionnaire radié pour invalidité, que le scénario 1 fait partir à
    soixante-deux ans ou à la radiation, liquident leur compte à 65 ans, leur
    dernière année prolongée comme celle des autres — l'invalidité, qui ne
    cotise pas, ou l'emploi de l'inapte qui travaillait encore.
  exemples: aucun trouvé
sources:
  lu_le: 2026-10-01
  prochaine_relecture: 2027-03-31
  lectures:
  - type: autre
    reference: README.md, le texte de la proposition
    date: 2026-09-27
  - type: autre
    reference: >-
      README.md, le texte de la proposition, relu à la clôture du domaine de
      l'invalidité et de l'inaptitude, qui y ajoute l'invalidité
    date: 2026-10-01
