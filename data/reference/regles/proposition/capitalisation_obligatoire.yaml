    moteur/js/scenario-notionnel.js: [_pilierCapitalise]
  parametres: [taux_capitalisation_obligatoire, taux_capitalisation_volontaire, capitalisation_volontaire, taux_technique_rente_capitalisation, prime_terme_trente_ans]
  tests: [tests/test_capitalisation.py]
