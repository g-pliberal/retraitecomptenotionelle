schema_version: 1
id: rci_seuil_premiere_tranche
intitule: >-
  De 2013 à 2024, la première tranche du RCI (7 %) s'arrête à un plafond propre
  au régime — le plafond de la sécurité sociale de 2013, puis revalorisé chaque
  année du plus petit des coefficients du revenu de référence et des pensions —,
  et la seconde (8 %) part de lui jusqu'à quatre plafonds de la sécurité sociale
  de l'année ; depuis 2025, la première tranche s'arrête au plafond de la sécurité
  sociale.
domaine: cotisations
regimes: [rci]
etape: acquerir_les_droits
face: cotisation
etat: transcrite
lit:
- le revenu porté au compte du RCI chaque année, et la part de l'année où l'assuré y
  est affilié
- le plafond propre de l'année, tel que la caisse l'a publié (regimes/rci.yaml,
  borne_haute_par_annee et borne_basse_par_annee)
- le plafond de la sécurité sociale de l'année (macro/plafond_securite_sociale.csv)
ecrit:
- l'assiette de chaque tranche du RCI, donc la cotisation et les points de l'année au
  scénario 1, la cotisation que le compte notionnel porte et ce que la fiche de paie
  prélève
dates_qui_decident:
