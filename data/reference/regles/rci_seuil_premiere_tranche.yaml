  lectures_divergentes:
  - >-
    Les circulaires Cnav 2024-36 du 19 décembre 2024 et 2025-31 du 22 décembre 2025
    publient encore un « plafond de cotisation RCI », 43 891 € pour 2025 et 44 286 €
    pour 2026, en citant la rédaction de D. 635-7 qu'a remplacée celle du 7 juillet
    2024, que l'Urssaf n'applique plus (8,1 % jusqu'au plafond de 48 060 € en 2026,
    selon les barèmes publiés de Weblex et de Generali). La fiche suit le texte.
  a_relire:
  - >-
    Lire les publications du RSI de 2014, 2015, 2018 et 2019, dont les montants ne
    sont ici lus que chez des tiers (barème IPP, Harvest, Legisocial).
  - >-
    À quoi sert le plafond que la Cnav publie encore pour 2025 et 2026 : aux
    cotisations provisionnelles de 2025, appelées avant que la réforme de l'assiette
    ne s'applique à la régularisation ?
