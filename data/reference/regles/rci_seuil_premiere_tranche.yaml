    donnees/regimes.py : PeriodeRegime.bornes_assiette_en_euros,
    PeriodeRegime.bornes_de_l_annee ; droit/acquerir.py : acquerir ; moteur/compte.py :
    ConstructeurCompte._bornes_proratisees ; remuneration.py : bloc_droit_en_vigueur,
    Segment
  javascript: >-
