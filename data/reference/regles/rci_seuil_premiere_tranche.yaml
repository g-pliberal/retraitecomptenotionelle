referents:
  modele_social: porte le plafond de 2021 à 2025, dont 43 891 € pour 2025
  devcrafting_retraites: arrête la première tranche à 37 846 €, mais part du plafond de la sécurité sociale pour la seconde
historique:
- >-
  2026-10-13 — action 138, étape 18 : la fiche coupait la première tranche au
  plafond de la sécurité sociale de chaque année, et la passe au plafond propre que
  la caisse a publié, de 2013 à 2024.
reformes:
- rci_2013
effet: >-
  Artisans et commerçants dont le revenu dépasse le plafond propre, de 2014 à 2024 :
  un point de cotisation de plus sur la part comprise entre lui et le plafond de la
  sécurité sociale, 3 422 € en 2024. Pour un artisan né en 1960, parti à 64 ans, la
  pension RCI gagne 0,2 à 0,5 % — 12 à 14 € par an — dès que son revenu passe ce
  plafond.
