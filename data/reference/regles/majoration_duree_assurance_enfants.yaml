schema_version: 1
id: majoration_duree_assurance_enfants
intitule: >-
  Majoration de durée d'assurance pour enfants du régime général et des régimes alignés
  (L. 351-4 du code de la sécurité sociale) : un an par enfant aux mères d'au moins
  deux enfants de 1972 à 1974, deux ans par enfant depuis, attribués à la mère, un
  trimestre par année d'éducation de 2004 à 2010, quatre trimestres de maternité
  et quatre d'éducation depuis 2010.
domaine: enfants
regimes:
- regime_general
- msa_salaries
- organic
- cancava
- rsi
- cnavpl
etape: compter_les_durees
face: droit
etat: approchee
lit:
- enfant.naissance
- le sexe de l'assurée, qui accouche
- le nombre de ses enfants
- liquidation.date_effet
ecrit:
- les trimestres de chaque enfant, en durée d'assurance, dans le régime que la priorité
  entre régimes désigne (priorite_majorations_enfants)
dates_qui_decident:
- liquidation.date_effet
- enfant.naissance
# Les versions forment un partage de ces deux dates (§ 4.1) : la date d'effet
# de la pension choisit la loi, la naissance de l'enfant sépare, depuis 2010,
# ceux qui sont nés avant le 1er janvier 2010. `contenu.parametres` est ce que
# le moteur lit (droit/compter.py et son jumeau) : les trimestres par enfant,
# ceux d'entre eux qui entrent au prorata du régime qui les porte, la
# bénéficiaire, et le nombre d'enfants que la version exige.
