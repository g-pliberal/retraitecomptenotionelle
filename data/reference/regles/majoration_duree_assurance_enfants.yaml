schema_version: 1
id: majoration_duree_assurance_enfants
intitule: >-
  Huit trimestres par enfant au régime général (quatre avant 1975, un an de 1972
  à 1974, à la mère), bonification de la fonction publique (quatre trimestres avant
  2004, deux depuis — dont l'un compte en SERVICES et non en durée pour les pensions
  prenant effet à compter du 1er septembre 2026).
etat: approchee
effet: >-
  Le modèle sert d'un coup les huit trimestres par enfant que le décret de 2003
  attribue un par un, de la naissance au septième anniversaire. Entre le 30 décembre
  2003, où cette version de D. 351-1-7 entre en vigueur, et le 1er avril 2010, où
  la réécriture de L. 351-4 s'applique aux pensions, la mère dont un enfant a moins
  de sept ans à la date d'effet en reçoit donc trop ; effet non mesuré. Les pensions
  prenant effet au second semestre 1974 reçoivent quatre trimestres par enfant,
  à partir du deuxième, quand la loi n° 75-3, qui en donne huit dès le premier,
  s'applique « au 1er juillet 1974 » hors son titre II (article 21), et son décret
  aux avantages prenant effet après le 30 juin 1974 (décret n° 75-109, article 20).
  Les cinq rédactions de L. 351-4 qui changent le droit depuis 2013 ne sont pas
  découpées en versions, sans effet sur les résultats d'aujourd'hui, qui présument
  la mère seule bénéficiaire. Relu dans l'index LEGI le 25 septembre 2026. La règle
  touche toute mère : elle commande la décote, la proratisation, la surcote parentale
  et le SAM des parents ; dans la fonction publique, un trimestre change de case
  sans changer de nombre.
presomptions:
  naissance_des_enfants: >-
    l'année de naissance de l'enfant, qui choisit la bonification de la fonction publique (L. 12 b ou L. 12 bis)
  pas_d_accord_des_parents: >-
    le bénéficiaire des trimestres, la mère à défaut d'accord
  enfant_eleve_neuf_ans: >-
    la condition d'éducation de la majoration, depuis la loi n° 75-3
  interruption_d_activite_par_la_mere: >-
    la condition d'interruption ou de réduction d'activité de la bonification,
    depuis 2003
sources:
  lu_le: 2026-09-25
  prochaine_relecture: 2026-12-31
  a_relire:
  - >-
    LU, ET LA RÉPONSE EST NON. La question posée ici était de savoir si la bonification
    d'un trimestre créée pour les enfants nés depuis 2004 s'AJOUTE aux deux trimestres
    de L. 12 bis. La loi n° 2025-1403 du 30 décembre 2025 (article 104) insère un
    b ter à L. 12 et réécrit L. 12 bis le même jour : les deux trimestres demeurent,
    « dont l'un est pris en compte au titre de la bonification prévue au b ter de
    l'article L. 12 ». Le total ne bouge pas ; un trimestre passe de la durée d'assurance
    aux services, où il entre dans la liquidation au lieu de ne compter que pour
    la durée. Applicable aux pensions prenant effet à compter du 1er septembre 2026,
    et étendu à la même date à la CNRACL et au FSPOEIE par décret en Conseil d'État
    — le décret n° 2026-699. PORTÉ LE 21 SEPTEMBRE 2026. `majoration_duree_assurance.csv`
    porte deux colonnes de plus — `services_par_enfant` et `services_depuis` —,
    le moteur ajoute la durée à la durée et les services aux services, et le portage
    JavaScript suit. Ce que cela a rendu au droit : une mère fonctionnaire d'État
    de trois enfants passe de 142 à 139 trimestres de services et de 46 938 à 45
    946 € par an. Une approximation est assumée et écrite dans l'en-tête de la table
    : le b ter vaut pour les pensions prenant effet à compter du 1er septembre 2026,
    le modèle date à l'année et l'applique dès janvier. RESTE AUSSI À TRANCHER :
    l'attribution au père (partage des trimestres d'éducation depuis 2010) demeure
    une convention du dépôt. CE QUE LES QUATRE TÉMOINS DU 21 SEPTEMBRE FIXENT, ET
    CE QU'ILS NE FIXENT PAS : ils tiennent le NOMBRE de trimestres servis dans les
    quatre cas courants — 8 par enfant au régime général, 4 puis 2 dans la fonction
    publique —, en rejouant la même carrière sans enfant. Ils mesurent donc la durée
    d'assurance, et resteront justes quand le partage entre services et durée sera
    porté : c'est exactement la grandeur que ce partage ne déplace pas. Ce partage,
    lui, n'aura de témoin que le jour où une fiche de calcul publiée en donnera
    un prorata chiffré. CONSTATS DU 25 SEPTEMBRE 2026, CONSIGNÉS SANS ÊTRE CORRIGÉS
    (la note de décision 0001 les avait faits en écrivant ses fiches d'exemple,
    et cette session les a relus mot à mot dans l'index LEGI) : (1) couper la version
    de 2003 de L. 351-4 (LEGIARTI000006742627, « un trimestre pour toute année durant
    laquelle elles ont élevé un enfant [...] dans la limite de huit trimestres »)
    et de D. 351-1-7, qui attribue ces trimestres un par un ; (2) avancer au 1er
    juillet 1974 la borne de 1975 : l'article 21 de la loi n° 75-3 l'applique «
    au 1er juillet 1974 » à l'exclusion de son titre II, et l'article 20 du décret
    n° 75-109 applique ses articles 11 à 19, dont l'article 16 sur la majoration
    des mères, aux avantages prenant effet après le 30 juin 1974. L'index ne donne
    ni la structure de la loi ni l'article qui modifie L. 342-1 ; que le titre II
    soit celui des articles 7 et 8, les seuls que l'index date du 4 janvier 1975
    (formation professionnelle, limites d'âge des emplois publics), est à lire au
    Journal officiel du 4 janvier 1975, dont l'index JORF n'a que les titres ; (3)
    couper L. 351-4 aux rédactions qui changent le droit : les parents de même sexe
    (2013, LEGIARTI000027432121), le tuteur et le délégataire de l'autorité parentale
    (2016, LEGIARTI000033713911), le plancher de deux trimestres pour la mère et
    le décès de l'enfant avant quatre ans (avril 2023, LEGIARTI000047453184), le
    retrait de l'autorité parentale et la condamnation pénale (septembre 2023, LEGIARTI000047456714),
    l'abrogation du IX pour les pensions prenant effet à compter du 1er septembre
    2026 (LEGIARTI000053280393) ; (4) dans la fonction publique, du 1er janvier
    au 30 juin 2011, R. 13 admet déjà « une interruption ou une réduction de l'activité
    » quand L. 12 b ne dit « interrompu ou réduit » que pour les pensions prenant
    effet à compter du 1er juillet 2011 (loi n° 2010-1330, article 118 II) : à trancher
    par la circulaire d'application ; le modèle présume la condition remplie. Aucun
    exemple publié n'a été trouvé pour ces fenêtres.
