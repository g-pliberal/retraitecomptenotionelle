    date: 2017-01-13
  - type: circulaire_cnav
    reference: >-
      circulaire carrière 2017-01 du 13 janvier 2017, fiches n° 6.2a et 6.2b, point
      3 « Compétence » : le régime général est compétent « si un ou plusieurs enfants
      n'ouvrent pas droit à majoration » dans le régime spécial
    date: 2017-01-13
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2017_01_13012017_fiche_6_2a.pdf
  - type: service_public
    reference: >-
      fiche F16336, quatre trimestres de maternité et quatre d'éducation par enfant
    date: 2026-08-14
  - type: legifrance
    reference: >-
      L. 351-4 CSS, ses quatorze rédactions dans l'index LEGI, de LEGIARTI000006742625
      (1985) à LEGIARTI000053280393
    date: 2025-12-31
  - type: legifrance
    reference: >-
      D. 351-1-7 CSS, version LEGIARTI000006736529 : un trimestre à la naissance,
      puis un à chacune des dates anniversaires, dans la limite de sept
    date: 2003-12-30
  - type: legifrance
    reference: >-
      décret n° 2003-1280 du 26 décembre 2003, article 3 (LEGIARTI000006226751) :
      applicable aux pensions de vieillesse prenant effet à compter du 1er janvier
      2004
    date: 2003-12-30
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 2004/22 du 30 avril 2004, § 3 et 4.2 : un trimestre à la
      naissance, puis « au terme de chaque année d'éducation », sept au plus ; « La condition
      de durée minimum d'éducation de 9 ans est supprimée » ; § 5, pensions prenant
      effet à compter du 1er janvier 2004. Lue dans une copie publiée par un particulier,
      la base de la Cnav ne la servant pas à l'adresse attendue
    date: 2004-04-30
    url: http://lenfantsansnom.free.fr/page/PJ%20circulaire%20de%202004.htm
  - type: jorf
    reference: >-
      loi n° 2009-1646 du 24 décembre 2009, article 65 (JORFARTI000021529299) : VIII,
      applicable aux pensions prenant effet à compter du 1er avril 2010 ; IX, les
      majorations d'éducation des enfants nés ou adoptés avant le 1er janvier 2010
      attribuées à la mère, sauf preuve du père
    date: 2009-12-27
  - type: legifrance
    reference: >-
      loi n° 75-3 du 3 janvier 1975, LEGITEXT000006068508, datée du 1er juillet
      1974 dans l'index ; son article 11 (LEGIARTI000006755935) et son article 21
      (LEGIARTI000006755945) : « A l'exclusion des articles du titre II, les dispositions
      de la présente loi s'appliquent au 1er juillet 1974 »
    date: 1974-07-01
  - type: legifrance
    reference: >-
      décret n° 75-109 du 24 février 1975, article 20 (LEGIARTI000006762047) : ses
      articles 4 à 8 et 11 à 19, dont l'article 16 sur la majoration des mères (LEGIARTI000006762040),
      « s'appliquent aux avantages prenant effet postérieurement au 30 juin 1974
      »
    date: 1975-02-26
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 2/72 du 31 janvier 1972, § II B 1° « Nombre d'enfants » :
      « La femme assurée ayant élevé au moins deux enfants pendant 9 ans avant l'âge
      de 16 ans à sa charge ou à celle de son conjoint bénéficie d'une année d'assurance
      supplémentaire par enfant élevé dans les conditions précitées et ceci sans aucune
      limitation. Un enfant n'ouvre aucun droit. » Lue le 27 septembre 2026 dans la
      base législative de la Cnav
    date: 1972-01-31
    url: >-
      https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_272_31011972.aspx
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 31/75 du 5 mars 1975, § 35 : « la majoration d'années d'assurance
      pour enfants est portée à 2 ans par enfant, le premier enfant y ouvrant droit
      » ; § 7 : « l'ensemble des nouvelles dispositions s'appliquent aux avantages
      prenant effet postérieurement au 30 juin 1974 », la majoration n'étant pas
      parmi les réserves. Lue le 27 septembre 2026 dans la base législative de la Cnav
    date: 1975-03-05
    url: >-
      https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_3175_05031975.aspx
