presomptions:
  naissance_des_enfants: >-
    la naissance de chaque enfant dont la date n'est pas déclarée, qui choisit la version
    depuis 2010
  pas_d_accord_des_parents: >-
    le bénéficiaire des trimestres, la mère à défaut d'accord
  enfant_eleve_neuf_ans: >-
    la condition d'éducation de la majoration, de 1972 à 2003 : l'enfant qui a neuf
    ans à la date d'effet est présumé élevé par sa mère neuf ans avant ses seize ans
sources:
  lu_le: 2026-09-27
  prochaine_relecture: 2026-12-31
  a_relire:
  - >-
    La fiche portait jusqu'au 27 septembre 2026, avec la majoration du régime général,
    la bonification de la fonction publique : celle-ci a désormais sa fiche, enfants_fonction_publique
    (docs/architecture.md, § 6.1 et annexe A).
  - >-
    CONSTATS DU 25 SEPTEMBRE 2026, les deux premiers corrigés le 27 (historique),
    le troisième encore ouvert : (1) la version de 2003 de L. 351-4 (LEGIARTI000006742627,
    « un trimestre pour toute année durant laquelle elles ont élevé un enfant [...]
    dans la limite de huit trimestres ») et D. 351-1-7 attribuent ces trimestres
    un par un ; le décret n° 2003-1280, article 3, lu le 27 septembre 2026, l'applique
    aux pensions prenant effet à compter du 1er janvier 2004, date à laquelle la version
    commence ; (2) la loi n° 75-3 s'applique au 1er juillet 1974 : l'index LEGI ne
    date du 4 janvier 1975 que ses articles 7 et 8 (formation professionnelle, limites
    d'âge des emplois publics), soit son titre II, et le décret n° 75-109 applique
    ses articles 11 à 19 aux avantages prenant effet après le 30 juin 1974 ; (3) les
    rédactions de L. 351-4 qui changent le droit depuis 2013 restent à couper en versions
    (textes_a_rattacher). Aucun exemple publié n'a été trouvé pour ces fenêtres.
  - >-
    L'adoption n'est pas portée : la chronologie ne connaît encore que des naissances,
    quand D. 351-1-7 compte aussi les années « à compter de son adoption » et L. 351-4
    accorde depuis 2010 quatre trimestres d'adoption.
  - >-
    L'attribution au père — le partage des trimestres d'éducation depuis 2010 — demeure
    une convention du dépôt : le modèle présume qu'aucun accord des parents n'a été
    exprimé, et sert tout à la mère.
