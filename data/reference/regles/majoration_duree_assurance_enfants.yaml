code:
  python: >-
    scenarios/actuel.py : MajorationsPourEnfants, qui lit les versions de cette fiche
    ; droit/compter.py : majoration_pour_enfants
  javascript: >-
    moteur/js/regimes.js : MajorationsPourEnfants ; moteur/js/droit/compter.js : majorationPourEnfants
  parametres: les versions de cette fiche (contenu.parametres), que le paquet du site porte
  tests: [tests/test_priorite_enfants.py, tests/test_scenarios_meres.py]
referents:
  openfisca_france_pension:
    equivalent: variable nombre_enfants (un nombre, sans dates)
    confrontation: aucune ; les profils de l'oracle sont sans enfant
  destinie_2: à confronter (réversion et enfants y sont modélisés)
historique:
- >-
  Le scénario « système actuel » ajoutait huit trimestres par enfant à tout assuré
  qui en déclarait, sans regarder ni la date de liquidation, ni le sexe, ni le régime
  : un père de trois enfants recevait douze trimestres que le droit ne lui a jamais
  donnés ; corrigé (en-tête de majoration_duree_assurance.csv).
- >-
  2026-09-21 — le b ter de la fonction publique est lu et porté ; la fiche le portait
  alors avec la majoration du régime général (voir enfants_fonction_publique).
- >-
  2026-09-25 — l'index LEGI, lu mot à mot : la version de 2003 attribue les trimestres
  un par un, la loi n° 75-3 s'applique au 1er juillet 1974, et cinq rédactions de
  L. 351-4 changent le droit depuis 2013 sans être découpées.
- >-
  2026-09-27 — la fiche est découpée en versions, que le moteur lit enfant par enfant
  à la place des lignes `mda` de majoration_duree_assurance.csv, qui disparaît ;
  la bonification de la fonction publique passe à sa fiche.
- >-
  2026-09-27 — la loi n° 75-3 à sa date : les pensions prenant effet après le 30 juin
  1974 reçoivent huit trimestres par enfant dès le premier, et non quatre par enfant
  aux seules mères de deux enfants au moins ; et la condition d'éducation de 1972
  à 2003 se lit sur l'âge de l'enfant à la date d'effet, qui ne peut avoir été élevé
  neuf ans s'il n'en a pas neuf. La présomption ne porte plus que sur ce qu'on ne
  sait pas : que la mère l'a élevé.
- >-
  2026-09-27 — de 2004 au 31 mars 2010, un trimestre à la naissance puis un au terme
  de chaque année d'éducation, huit au plus (D. 351-1-7, circulaire Cnav n° 2004/22),
  et non huit d'un coup : la mère d'un enfant de moins de sept ans à la date d'effet
  en reçoit moins.
reformes:
- parents_2026
effet: >-
  Toute mère affiliée au régime général ou à un régime aligné : la règle commande la
  décote, la proratisation, la surcote parentale et le salaire annuel moyen des parents.
  Chaque enfant compte à sa date : les trimestres qu'il vaut dépendent de la loi en
  vigueur à la date d'effet de la pension et, de 1972 à mars 2010, de son âge à cette
  date.
