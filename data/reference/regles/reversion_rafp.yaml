  nee_de: LEGIARTI000006453308
  bornes:
    conjoint.deces: [null, null]
  contenu:
    droit: >-
      50 % de la prestation obtenue par le bénéficiaire ou qu'il aurait pu obtenir au
      titre des droits acquis au jour de son décès, en liquidant à l'âge de son décès, ou
      à l'âge légal s'il meurt avant (soixante ans jusqu'au 30 décembre 2011) ; servie
      en rente, en capital quand elle tombe sous le seuil de 5 125 points de l'article 9,
      apprécié en valeur brute et par tête ; cumulable avec toute rémunération et toute
      autre pension
    beneficiaire: le conjoint survivant, le conjoint séparé de corps et le conjoint divorcé
    conditions: >-
      aucune d'âge, de ressources ni de durée du mariage ; effet au plus tôt au premier
      jour du mois qui suit le décès ; aucune réversion quand la prestation de droit
      direct a été versée en capital ; entre conjoints successifs, un partage au prorata
      de la durée des mariages ; suspendue au remariage ou au concubinage notoire,
      rétablie à leur fin sur demande ; à chaque orphelin de moins de vingt et un ans,
      10 %, réduits si le total dépasse la prestation du défunt
    parametres:
      taux: 0.50
      ex_conjoints: tous
      age_minimum: null
      seuil_capital_points: 5125
      rien_apres_un_capital: true
      compte_aux_ressources: true
      perte_au_remariage: [mariage, concubinage]
      fiabilite: haute
  exemples: [ur_reversion_etat_mariage_3_ans_et_demi, ur_reversion_etat_mariage_4_ans,
             ur_reversion_cnracl_enfant_mariage_1_an]
approximations:
- ecart: >-
    la réversion de moins de 5 125 points, que l'ERAFP verse en capital, est montrée
    comme la rente dont ce capital est l'équivalent, comme le droit direct du défunt ;
    le capital serait cette rente par le coefficient de conversion du conjoint à son
    âge à la date d'effet, au mois (31 ans au moins), lu au barème que l'ERAFP applique
    depuis le 1er janvier 2022 — 30,94 à 54 ans, 25,00 à 62 ans, 46,71 à 31 ans — ;
    celui d'avant 2022 n'est pas publié, le rapport annuel 2012 ne donnant que ceux de
    l'ouvrant droit et de l'orphelin
  effet: >-
    la forme de la prestation, non son montant annuel ; non mesuré
- ecart: >-
    le RAFP compte aux ressources du régime général et de la complémentaire des
    indépendants, R. 353-1, 2°, n'écartant que les réversions des régimes
    complémentaires du régime général, des régimes agricoles, des professions libérales
    et des indépendants : une lecture du texte, que la circulaire de la Cnav qui énumère
    les ressources n'a pas encore confirmée
  effet: >-
    la réversion du régime général d'un fonctionnaire qui a aussi cotisé au privé,
    près du plafond, baisse de la moitié de son RAFP ; non mesuré
- ecart: >-
    la prestation d'orphelin n'est pas portée ; la prestation du fonctionnaire mort
    avant son départ se liquide sur ses points au premier jour du trimestre civil du
    décès, quand l'article 10 compte les droits acquis au jour du décès ; les montants
    sont ceux de l'année du décès
  effet: non mesuré
- ecart: >-
    le partage au prorata des mariages lit les précédents conjoints que la saisie
    déclare, deux au plus, remariés ou non : l'article 4 de l'arrêté suspend le paiement
    du conjoint divorcé remarié sans l'écarter du partage ; le remariage ou le
    concubinage notoire du survivant suspend la prestation au mois qui le suit, et son
    rétablissement, sur demande, quand l'union cesse, n'est pas porté
  effet: non mesuré
presomptions:
  reversion_demandee_dans_l_annee: >-
    la date d'effet, au premier jour du mois qui suit le décès
  deces_apres_le_depart: >-
    la réversion que la page montre sans décès déclaré, pour un décès supposé juste
    après le départ, ou cette année pour qui est déjà parti
sources:
  lu_le: 2026-10-09
  prochaine_relecture: 2027-03-31
  lectures_divergentes:
  - >-
    Le simulateur « Droit à la réversion » d'info-retraite refuse la réversion du RAFP
    quand le mariage ne remplit pas la condition de L. 39 du code des pensions civiles
    (exemple ur_reversion_etat_mariage_3_ans_et_demi, en écart connu) : ni le décret
    n° 2004-569, ni l'arrêté du 26 novembre 2004, ni la fiche pratique de l'ERAFP ne
    posent de condition de durée du mariage, et la fiche dit que le conjoint sans
    réversion d'un régime de base de la fonction publique demande celle du RAFP à la
    Caisse des dépôts. Le modèle suit le texte.
  - >-
    La page « La réversion » de l'ERAFP illustre la conversion par un conjoint de 54 ans,
    130 € de rente, « 130 € x 29 = 3 770 € », quand le barème des conjoints qu'elle
    publie à côté, applicable depuis le 1er janvier 2022, donne 30,94 à 54 ans (4 022,20
    €) : l'exemple suit un barème plus ancien, que le site ne publie pas, ou se trompe.
    Le même barème saute l'âge de 85 ans (8,96 à 84 ans, 7,78 à 86).
  - >-
    La même page plafonne l'ensemble des prestations d'orphelin à 50 % (« à partir de
    six orphelins, les prestations d'orphelin sont proratisées » ; huit orphelins :
    6,25 % chacun), quand l'article 10 du décret ne plafonne que le total du conjoint
    et des orphelins, à la prestation du défunt, en réduisant celles des orphelins : les
    deux lectures ne divergent que sans conjoint survivant, à partir de six orphelins.
    Le modèle ne sert pas la prestation d'orphelin.
  a_relire:
  - >-
    Ouverte le 4 octobre 2026, à l'étape de l'action 142 qui sert la réversion du RAFP,
    de la RCI et de l'Ircantec, lue dans l'index LEGI et sur la fiche pratique de
    l'ERAFP. À confirmer auprès de l'ERAFP : qu'aucune condition de durée du mariage ne
    s'applique, quand le simulateur d'info-retraite en applique une ; et que le
    conjoint divorcé remarié avant le décès compte au partage, son paiement seul
    suspendu, comme l'article 4 de l'arrêté se lit.
  - >-
    La circulaire de la Cnav qui énumère les ressources de R. 353-1 : y compte-t-elle
    la réversion du RAFP, que le texte ne range pas parmi celles qu'il écarte ?
  lectures:
