schema_version: 1
id: reversion_rafp
intitule: >-
  Prestation de réversion de la retraite additionnelle de la fonction publique (décret
  n° 2004-569, article 10, et arrêté du 26 novembre 2004) : 50 % de la prestation
  obtenue par le fonctionnaire ou qu'il aurait pu obtenir au jour de son décès, sans
  condition d'âge, de ressources ni de durée du mariage ; aucune quand le droit direct
  a été versé en capital ; suspendue au remariage ou au concubinage notoire.
domaine: reversion
regimes:
- rafp
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- conjoint.deces
- union.debut et union.fin, d'un mariage ; une nouvelle union du survivant suspend le droit
- les précédents conjoints du défunt, leur mariage et leur divorce, que le partage au
  prorata des mariages lit
- la prestation du défunt, servie ou qu'il aurait pu obtenir au jour de son décès, et sa
  forme, rente ou capital
ecrit:
- la prestation de réversion du survivant, au régime additionnel
dates_qui_decident:
- conjoint.deces
# Une seule version : le taux, les bénéficiaires et le capital n'ont pas changé
# depuis l'arrêté du 26 novembre 2004. Sa rédaction du 31 décembre 2011, qui
# retient l'âge légal plutôt que soixante ans pour la prestation d'un
# fonctionnaire mort avant, et celle du 23 novembre 2017 du décret, qui ne
# change qu'un renvoi, ne changent pas ce que le moteur calcule.
versions:
