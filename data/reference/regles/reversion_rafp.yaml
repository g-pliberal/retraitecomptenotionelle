  - {id: LEGIARTI000019412506, article: "arrêté du 26 novembre 2004, article 5", en_vigueur: 2004-12-01}
  - {id: LEGIARTI000019412508, article: "arrêté du 26 novembre 2004, article 6", en_vigueur: 2004-12-01}
