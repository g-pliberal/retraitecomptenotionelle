historique:
- >-
  2026-10-04 — née et lue par le moteur à l'étape de l'action 142 qui sert la
  réversion du RAFP, de la RCI et de l'Ircantec : les simulateurs anonymes la
  servaient, le modèle disait « non portée ».
- >-
  2026-10-05 — relue à l'action 89 : les barèmes de conversion du conjoint et de
  l'orphelin de 2022, et celui de l'orphelin de 2005, lus et non portés ; deux lectures
  divergentes de la page de l'ERAFP, son exemple converti par 29 et le plafond de 50 %
  des orphelins.
- >-
  2026-10-09 — action 138, étape 4 : la prestation du fonctionnaire mort avant son
  départ, liquidée à son décès ; le partage entre conjoints au prorata des mariages,
  avec tous les précédents conjoints divorcés (article 4 de l'arrêté), et la
  suspension au remariage ou au concubinage notoire du survivant.
effet: >-
  Tout conjoint, ou ex-conjoint, d'un fonctionnaire de l'État ou d'un agent des
  collectivités et des hôpitaux qui décède. Le modèle la calcule pour le conjoint que
  la saisie déclare, partagée avec les précédents conjoints qu'elle déclare, sauf quand
  le défunt a touché son droit en capital.
