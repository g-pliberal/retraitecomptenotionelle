      notoire du conjoint survivant ou divorcé, le paiement de la prestation de
      réversion est suspendu », et elle « est partagée entre le conjoint survivant ou
      séparé de corps et le ou les précédents conjoints divorcés au prorata de la durée
      respective de chaque mariage déterminée de date à date et arrondie au nombre de
