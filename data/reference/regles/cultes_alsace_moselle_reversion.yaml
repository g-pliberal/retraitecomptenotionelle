    citation: >-
      « Articles 10, 11, 12 al. 3 et 4, et article 14. Modification, entre autres, par
      décrets des 13 avril 1923, 17 juillet 1926, 19 juin 1928, 7 décembre 1928, 1er
      juillet 1930, 1er décembre 1931, 9 mars 1933, 5 mai 1934 et 28 octobre 1934. »
