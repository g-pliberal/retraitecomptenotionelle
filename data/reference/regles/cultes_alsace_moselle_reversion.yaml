schema_version: 1
id: cultes_alsace_moselle_reversion
intitule: >-
  La veuve et les enfants d'un pasteur ou d'un rabbin d'Alsace-Moselle, ou d'un employé
  des secrétariats des cultes, reçoivent de l'État les pensions des veuves et orphelins
  des fonctionnaires d'Alsace-Lorraine : la veuve 40 % de la pension du mari, chaque
  orphelin le cinquième de la pension de la veuve, le tiers sans elle, le tout borné à la
  pension du mari ; des règles du code des pensions civiles s'y ajoutent en 1955 et en
  1964.
domaine: reversion
regimes: [cultes_alsace_moselle]
etape: liquider_chaque_regime
face: droit
etat: pas_encore_modelisee
lit:
- la pension que le ministre touchait, ou qu'il aurait eue s'il avait quitté le service le
  jour de son décès (fiche cultes_alsace_moselle_pension)
- son culte, la loi ne donnant de pension qu'aux veuves et enfants des ministres
  protestants et israélites
- la date du mariage et sa durée, la situation du ministre à ce jour (en activité ou
  retraité), un divorce ou une séparation, les âges des époux, les enfants issus du
  mariage
- les enfants, leur âge, leur mariage, et la survie de la mère et son droit à pension
ecrit:
- la pension de la veuve et celle de chaque orphelin, et le jour où chacune commence et
  cesse
dates_qui_decident:
- conjoint.deces
# Les versions forment un partage de la date du décès du ministre, qui ouvre le droit :
# le décret n° 66-807 vise les ayants cause dont les droits « s'ouvrent postérieurement
# au 30 novembre 1964 ».
versions:
- id: loi_locale_1909
  statut: lue
  textes:
  - reference: >-
      loi locale du 15 novembre 1909 relative aux traitements et pensions des ministres
      des cultes rétribués par l'État et de leurs veuves et orphelins, traduction
      officielle publiée au recueil des actes administratifs de la préfecture du
      Bas-Rhin, numéro spécial du 15 mai 2013, page 87 (décret n° 2013-395)
    article: article 11
    en_vigueur: 1910-04-01
    citation: >-
      « Les veuves et les enfants légitimes ou légitimés des ministres du culte
      protestant et du culte israélite désignés aux articles 5, 6, reçoivent des pensions
      sur la Caisse d'Alsace-Lorraine, conformément aux dispositions applicables aux
      veuves et orphelins des fonctionnaires d'Alsace-Lorraine. »
    lu_le: 2026-11-24
    empreinte: >-
      sha256:4409ed75fa679b5c2a3c3fab6e7599615e735384b558dde000b6b453183aa5b3, le PDF du
      recueil (467 442 octets), téléchargé sur bas-rhin.gouv.fr le 24 novembre 2026
  - reference: >-
      loi d'Alsace-Lorraine du 15 novembre 1909 relative aux veuves et orphelins des
      fonctionnaires, même recueil, pages 89 à 92
    article: articles 8 à 12
    citation: >-
      article 8 : « Le montant de la pension de la veuve est de 40 % de la pension à
      laquelle avait droit le défunt ou à laquelle il aurait eu droit, s'il avait quitté
      le service le jour de son décès. » ; article 9 : « 1° Au cinquième de la pension de
      veuve pour chacun des enfants, lorsque la mère vit encore et qu'elle a droit à une
      pension ; 2° Au tiers de la pension de veuve pour chacun des enfants, lorsque la
      mère ne vit plus ou n'a pas droit à une pension. » ; article 10 : « Les pensions à
      payer à la veuve et aux orphelins ne peuvent ni séparément ni réunies dépasser le
      montant de la pension à laquelle avait droit le défunt » ; article 12 : le paiement
      cesse pour la veuve « à l'expiration du mois au cours duquel elle meurt ou se
      remarie », pour chaque enfant au mois où il « meurt ou accomplit sa dix-huitième
      année »
    lu_le: 2026-11-24
  - reference: loi d'Alsace-Lorraine du 15 novembre 1909 sur les veuves et orphelins, même recueil, pages 89 à 91
    article: articles 1er, 2, 4, 6 et 11
    citation: >-
      article 2 : « Si le fonctionnaire, à l'époque de son mariage, se trouvait déjà en
      disponibilité ou à la retraite, sa veuve ainsi que les enfants issus de cette union
      n'ont droit à une pension que si, après ledit mariage, le fonctionnaire a repris du
      service actif. » ; article 4 : « La veuve n'a pas droit à une pension en cas de
      dissolution du mariage par suite de divorce » ; article 11 : « Si la veuve était
      plus jeune que le défunt d'au moins quinze années, la pension […] sera réduite d'un
      vingtième pour toute année dont s'augmente la différence d'âge au-delà de quinze
      jusqu'à vingt-cinq inclusivement »
    lu_le: 2026-11-24
  - reference: >-
      loi du 20 mai 1911 relative au budget d'Alsace-Lorraine pour l'exercice 1911, même
      recueil, page 110
    article: article 12, deuxième alinéa
    citation: >-
      « Les articles 7, 9, 10 et 11 de la loi du 15 novembre 1909 […] sont appliqués par
      analogie aux secrétaires généraux, secrétaires et contrôleurs dont cet emploi tient
      lieu d'occupation principale, et les articles 9, 10, 11, aux expéditionnaires et
      garçons de bureau »
    lu_le: 2026-11-24
  bornes:
    conjoint.deces: [null, 1923-04-13]
  contenu:
    beneficiaires: >-
      la veuve et les enfants légitimes ou légitimés des pasteurs, ministres auxiliaires
      protestants, grands rabbins et rabbins (articles 5 et 6) ; ceux des employés des
      secrétariats des cultes (loi du 20 mai 1911) ; rien pour les prêtres catholiques
    condition: >-
      le ministre touchait une pension ou y aurait eu droit s'il avait quitté le service
      le jour de son décès (article 1er) ; pas de pension à la veuve d'un mariage
      contracté à la retraite sans reprise du service, ni d'un mariage de moins de six
      mois avant le décès contracté pour la pension (article 2), ni après un divorce ou
      la fin de la vie commune (article 4)
    parametres:
      taux_veuve: 0.40
      veuve_minimum_marks: 300
      veuve_maximum_marks: 5000
      orphelin_mere_ayant_droit: 1/5 de la pension de veuve
      orphelin_sans_mere_ayant_droit: 1/3 de la pension de veuve
      plafond: la pension du défunt, réduction proportionnelle (article 10)
      ecart_d_age_seuil_ans: 15
      reduction_par_annee_d_ecart: 1/20, de la seizième à la vingt-cinquième année d'écart
      relevement_par_annee_de_mariage_au_dela_de_cinq: 1/10 de la pension entière
      orphelin_jusqu_a_ans: 18
      arrondi: au multiple de 3 marks supérieur (articles 8 et 9)
    debut: >-
      à l'expiration du trimestre de grâce, ou du jour où le défunt avait droit à ses
      émoluments ou à sa pension (article 6) ; payée par mois et d'avance (article 7)
    fin: >-
      au mois du décès ou du remariage de la veuve ; au mois des dix-huit ans ou du
      mariage d'une fille mineure pour l'orphelin (article 12)
    cas_pose_a_la_main: >-
      Posé à la main, non officiel : la veuve du pasteur de la fiche
      cultes_alsace_moselle_pension (pension de 2 800 marks en 1911, avant l'arrondi),
      mariée depuis vingt ans, de sept ans sa cadette, avec deux enfants mineurs. Veuve :
      40 % × 2 800 = 1 120 marks, portés à 1 122 ; chaque orphelin : 1 120 / 5 = 224
      marks, portés à 225. Total : 1 122 + 450 = 1 572 marks, sous les 2 802 de la
      pension du mari ; l'écart d'âge, sous quinze ans, ne réduit rien.
  exemples: aucun trouvé
  exemples_cherches: >-
    le recueil des actes administratifs du Bas-Rhin du 15 mai 2013, la version consolidée
    de Legirel (copie de l'Internet Archive du 23 mai 2024) : aucun calcul publié, le
    24 novembre 2026
- id: decrets_de_1923_a_1934
  statut: supposee
  hypothese: >-
    Les décrets de 1923 à 1934 que nomme la notice de la loi locale au Journal officiel
    modifient son article 11, et le décret du 1er juillet 1930 étend aux retraités du
    régime local « certaines dispositions nouvelles » de la loi du 14 avril 1924, qui
    donnait 50 % de la pension du mari aux veuves des fonctionnaires de l'État : aucun
    n'est lu. La version suppose les règles de 1909 inchangées, en francs.
  fiabilite: faible, le taux de la veuve pouvant avoir été porté à 50 %
  textes:
