      BENEFICE DE CERTAINES DISPOSITIONS NOUVELLES PREVUES PAR LA LOI DU 14-04-1924 »
    lu_le: 2026-11-24
  bornes:
    conjoint.deces: [1923-04-13, 1955-12-02]
  contenu:
    droit: celui de la version loi_locale_1909, supposé inchangé
    parametres:
      taux_veuve: 0.40
  exemples: aucun trouvé
