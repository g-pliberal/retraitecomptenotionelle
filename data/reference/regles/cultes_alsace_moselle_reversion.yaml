- id: decret_1955
  statut: supposee
  hypothese: >-
    Le décret n° 55-1544 du 29 novembre 1955, publié le 30, n'est connu que par son
    analyse au JORF : il étend « A CERTAINS AYANTS CAUSE DE FONCTIONNAIRES
    D'ALSACE-LORRAINE » les articles L. 55, L. 56 et L. 60 du code des pensions — dans
    le code de 1951, les conditions d'antériorité du mariage, l'orphelin à 10 % de la
    pension du père jusqu'à vingt et un ans, la femme séparée ou divorcée —, et abroge
    « L'ART. 11 DE LA LOI LOCALE DU 15-11-1909 » : sans doute la réduction pour écart
    d'âge de la loi sur les veuves et orphelins, et non l'article 11 de la loi sur les
    ministres des cultes, que le décret de 2007 modifie encore. Ni ses bénéficiaires
    exacts ni son jour d'effet ne sont lus ; la borne est un jour franc après la
    publication. Le taux de 40 % de la veuve demeure : l'article L. 54 (50 %) n'est pas
    étendu.
  fiabilite: faible, le décret n'étant connu que par son analyse
  textes:
  - id: JORFTEXT000000676287
    article: décret n° 55-1544 du 29 novembre 1955, analyse
    publie_le: 1955-11-30
    citation: >-
      « EXTENSION A CERTAINS AYANTS CAUSE DE FONCTIONNAIRES D'ALSACE-LORRAINE DE
      CERTAINES DISPOSITIONS DES ART. L55, L56 ET L60 DU CODE DES PENSIONS CIVILES ET
      MILITAIRES DE RETRAITES. ABROGATION DE L'ART. 6 DE LA LOI D'EMPIRE DU 17-05-1907 ET
      DE L'ART. 11 DE LA LOI LOCALE DU 15-11-1909. »
    lu_le: 2026-11-24
  - reference: >-
      code des pensions civiles et militaires de retraite, codifié par le décret
      n° 51-590 du 23 mai 1951, Journal officiel du 24 mai 1951, page 5366
    article: articles 56 et 60
    citation: >-
      article 56 : « Chaque orphelin a droit jusqu'à l'âge de vingt et un ans […] à une
      pension égale à 10 p. 100 de la pension d'ancienneté ou proportionnelle obtenue par
      le père ou qu'il aurait obtenue le jour de son décès […] sans que le total des
      émoluments attribués à la mère et aux orphelins puisse excéder le montant de la
      pension » ; article 60 : « La femme séparée de corps ou divorcée, lorsque le
      jugement n'a pas été prononcé exclusivement en sa faveur, ne peut prétendre à la
      pension de veuve »
    lu_le: 2026-11-24
    empreinte: >-
      sha256:5f29bc22b4326993c8ffc672f726261352926762dcf10ab96332c90dac8d8cef, le
      fac-similé du Journal officiel du 24 mai 1951 téléchargé de Légifrance
  bornes:
    conjoint.deces: [1955-12-02, 1964-12-01]
  contenu:
    veuve: 40 % de la pension du mari (loi locale, article 8), sans réduction pour écart d'âge
    orphelins: >-
      10 % de la pension du père chacun, jusqu'à vingt et un ans, si l'article L. 56 leur
      est étendu ; sinon les règles de 1909
    plafond: la pension du mari
    parametres:
      taux_veuve: 0.40
      taux_orphelin: 0.10
      orphelin_jusqu_a_ans: 21
  exemples: aucun trouvé
  exemples_cherches: >-
    l'index JORF du dépôt, qui ne porte du décret que son analyse ; Légifrance, qui n'en
    donne que le fac-similé, derrière une vérification humaine, le 24 novembre 2026
- id: decret_1966
  statut: supposee
  hypothese: >-
    Le décret n° 66-807 est lu : depuis les droits ouverts après le 30 novembre 1964, il
    applique aux ayants cause des fonctionnaires du cadre local le dernier alinéa de
    L. 39, les troisième et quatrième alinéas de L. 40, le premier alinéa de L. 41, et
    L. 43 à L. 46 du code de 1964, et abroge les articles 9 (3°) et 12 (1° et 3°) de la
    loi locale sur les veuves et orphelins, et l'article 1er du décret de 1955. La
    version suppose qu'il atteint les veuves et orphelins des ministres, par le renvoi de
    l'article 11 de la loi sur les cultes aux « dispositions applicables aux veuves et
    orphelins des fonctionnaires d'Alsace-Lorraine ». Seul L. 39 se lit dans sa
    rédaction de 1964 ; L. 40 à L. 46 de 1964 ne sont pas dans l'index LEGI. Le taux de
    la veuve reste celui de l'article 8 de la loi locale, 40 %, que le décret n'abroge
    pas, sauf si un décret de 1923 à 1934 l'a changé ; une source secondaire (blog
    « L'assurance vieillesse des ministres du culte en Moselle », 13 septembre 2013)
    écrit 50 %. Que les articles du code s'entendent dans leur rédaction de 1964 ou dans
    celle du jour (le « conjoint survivant » depuis 2004, veufs compris) n'est pas dit.
  fiabilite: faible pour le taux de la veuve ; moyenne pour les conditions
  textes:
  - id: LEGIARTI000006457148
    article: décret n° 66-807 du 28 octobre 1966, article 1er
    publie_le: 1966-11-03
    citation: >-
      « I. - Les dispositions du dernier alinéa de l'article L. 39, des troisième et
      quatrième alinéas de l'article L. 40 et celles des articles L. 41 (1er alinéa),
      L. 43, L. 44, L. 45 et L. 46 du code des pensions civiles et militaires de retraite
      sont applicables aux ayants cause des fonctionnaires et anciens fonctionnaires du
      cadre local du Haut-Rhin, du Bas-Rhin et de la Moselle, tributaires du régime de
      retraites prévu par les lois des 17 mai 1907 et 15 novembre 1909 et par le décret du
      1er juillet 1930, sous réserve que les droits à pension desdits ayants cause
      s'ouvrent postérieurement au 30 novembre 1964. »
    lu_le: 2026-11-24
  - id: LEGIARTI000006457149
    article: décret n° 66-807 du 28 octobre 1966, article 2
    publie_le: 1966-11-03
    citation: >-
      « Sont abrogées toutes dispositions des textes locaux antérieurs contraires au
      présent décret, et notamment les articles 3 (3°) et 14 (1°) de la loi du 17 mai 1907
      modifiée, 9 (3°) et 12 (1° et 3°) de la loi locale du 15 novembre 1909 modifiée et
      1er du décret n° 55-1544 du 29 novembre 1955. »
    lu_le: 2026-11-24
  - id: LEGIARTI000006362767
    article: code des pensions civiles et militaires de retraite, L. 39, rédaction du 1er décembre 1964
    citation: >-
      « Nonobstant les conditions d'antériorité prévues ci-dessus, le droit à pension de
      veuve est reconnu : 1° Si un ou plusieurs enfants sont issus du mariage ; 2° Ou si
      le mariage, antérieur ou postérieur à la cessation de l'activité, a duré au moins
      quatre années. »
    lu_le: 2026-11-24
  bornes:
    conjoint.deces: [1964-12-01, null]
  contenu:
    veuve: >-
      40 % de la pension du mari (loi locale, article 8, non abrogé), 50 % selon une
      source secondaire ; le droit lui est reconnu, même mariée à la retraite, s'il y a un
      enfant du mariage ou quatre années de mariage (L. 39, dernier alinéa)
    remariage: >-
      l'article 12, 1°, de la loi locale (fin au remariage) est abrogé ; L. 46 du code de
      1964 le remplace, rédaction non lue
    orphelins: >-
      les troisième et quatrième alinéas de L. 40 du code de 1964, non lus, et la fin à
      dix-huit ans de l'article 12, 2°, que le décret n'abroge pas
    plafond: le premier alinéa de L. 41 du code de 1964, non lu
    veufs: >-
      la loi ne nomme que les veuves ; rien de lu ne donne de pension au veuf d'une
      ministre du culte
    parametres:
      taux_veuve: 0.40
    cas_pose_a_la_main: >-
      Posé à la main, non officiel : la veuve du pasteur de 25 années de la fiche
      cultes_alsace_moselle_pension, décédé en 2026 (pension de 18 780,42 euros par an),
      avec deux enfants mineurs. Veuve : 40 % = 7 512,17 euros par an ; 50 % si le taux
      avait été relevé = 9 390,21 euros. Chaque orphelin : le cinquième de la pension de
      veuve (1909, article 9) = 1 502,43 euros, ou 10 % de la pension du père (code de
      1951, article 56) = 1 878,04 euros. Total à 40 % et au cinquième : 10 517,03 euros,
      sous la pension du père.
  exemples: aucun trouvé
  exemples_cherches: >-
    l'index LEGI du dépôt, qui n'a pas les rédactions de 1964 de L. 40 à L. 46 ; le
    recueil du Bas-Rhin de 2013 ; la base Ircantec ; la presse : aucun calcul publié, le
    24 novembre 2026
textes_sans_effet:
- id: JORFARTI000002290399
  article: décret n° 2007-1341, article 7 (article 11 de la loi locale)
  en_vigueur: 2007-09-14
  motif: >-
    « A l'article 11, les mots : « désignés aux articles 5, 6, » sont supprimés et les
    mots : « sur la caisse d'Alsace-Lorraine » sont remplacés par les mots : « de
    l'Etat » » : les veuves et enfants des ministres protestants et israélites restent
    seuls nommés, et l'État payait déjà ces pensions depuis la convention de
    Baden-Baden ; ni les bénéficiaires ni les montants ne changent
- id: LEGIARTI000006362768
  article: code des pensions civiles et militaires de retraite, L. 39, rédaction du 1er janvier 2004
  en_vigueur: 2004-01-01
  motif: >-
    « Nonobstant les conditions d'antériorité prévues ci-dessus, le droit à pension de
    réversion est reconnu : 1° Si un ou plusieurs enfants sont issus du mariage ; 2° Ou
    si le mariage, antérieur ou postérieur à la cessation de l'activité, a duré au moins
    quatre années. » : du dernier alinéa, le seul que le décret n° 66-807 applique, la
    rédaction de 2004 ne change que « veuve » en « réversion » ; l'enfant du mariage ou
    les quatre années de mariage restent les deux conditions, et le droit lui-même vient
    de l'article 11 de la loi sur les cultes, qui ne nomme que les veuves
