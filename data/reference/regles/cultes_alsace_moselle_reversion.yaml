historique:
- >-
  2026-11-24 — née de la fiche cultes_alsace_moselle_pension, dont l'intitulé donnait une
  pension à « sa veuve et ses orphelins » sans dire que seuls les ministres protestants et
  israélites en laissent.
effet: >-
  Les veuves et orphelins des pasteurs et rabbins d'Alsace-Moselle : leur pension de 40 %
  ou de 50 % de celle du mari, selon un texte à lire.
