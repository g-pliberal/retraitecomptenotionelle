  nee_de: JORFTEXT000000870158
  bornes:
    revenu.annee: [1961-01-01, 1971-01-01]
  contenu:
    assiette: >-
      « toutefois et à compter du 1er janvier 1961, cette limite est portée à 4,75 fois
      le plafond des cotisations du régime général des assurances sociales » (article
      7) : de 8 100 à 38 475 NF en 1961, de 18 000 à 85 500 F en 1970 (tableau II)
    points: >-
      la règle de l'article 8, aux salaires de référence de 1,36 NF pour 1961, 1,49 F
      pour 1962, 1,64 F pour 1963, 1,74 F pour 1964, 1,82 F pour 1965, 1,89 F pour 1966,
      1,97 F pour 1967, 2,26 F pour 1968, 2,42 F pour 1969 et 2,59 F pour 1970
