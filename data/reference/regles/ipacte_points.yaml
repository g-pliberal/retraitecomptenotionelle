approximations:
- version: [quatre_plafonds, quatre_plafonds_trois_quarts]
  ecart: >-
    Le statut `contractuel_public` cotise à l'IPACTE sur toute la tranche B, sans les
    conditions de l'article 2 : un contractuel qui n'est ni ingénieur ni de catégorie
    A, ou qui est payé moins que l'indice 225, reçoit des points IPACTE au-dessus du
    plafond, au taux de 12,5 %, quand le droit ne lui donnait, de 1960 à 1970, que
    l'IGRANTE jusqu'à trois plafonds, au taux de 3,5 % (fiche igrante_points), et
    avant 1960 rien, hors la validation que l'IGRANTE ouvrit en 1960 ; le temps
    incomplet, exclu jusqu'en 1970, n'est pas distingué.
  effet: >-
    non mesuré ; les seuls contractuels payés au-dessus du plafond de 1951 à 1970, un
    petit nombre que les sources lues ne chiffrent pas
- version: [quatre_plafonds, quatre_plafonds_trois_quarts]
  ecart: >-
    Le taux d'appel de l'Ircantec de 1971, 60 %, est prolongé sur 1951-1970
    (regimes/valeurs_point.csv, niveau `estimee`), et la fiche de régime cotise 12,5 %
    × 0,6 = 7,5 % ; les taux d'avant le décret n° 68-1028 et la suspension de l'arrêté
    du 31 décembre 1953 (un taux de 8 %, puis de 9 %, sans assiette lue) ne sont pas
    lus. Le taux d'appel ne fait que la cotisation payée, que le compte notionnel
    reprend ; les points suivent le taux contractuel, que seul un taux d'avant 1968
    autre que 12,5 % déplacerait.
  effet: non mesuré
- version: quatre_plafonds_trois_quarts
  ecart: >-
    L'assiette de la fiche de régime est la tranche B, d'un à quatre plafonds ; le
    trois quarts de plafond ajouté en 1961 n'est pas porté.
  effet: >-
    les seules rémunérations au-delà de quatre plafonds de 1961 à 1970 : jusqu'à un
    cinquième des points de ces années pour un agent payé 4,75 plafonds ou plus, dont
    l'assiette est de 3,75 plafonds et non de 3
- version: services_de_1914_a_1946
  ecart: >-
    Les services antérieurs à l'affiliation ne se valident pas, et les points gratuits
    du tableau VI ne sont pas attribués : le modèle ouvre l'IPACTE en 1951, et la
    carrière saisie n'y entre qu'à cette date.
  effet: >-
    aucun sur les générations que le simulateur liquide : la validation de 1914 à 1946
    ne concerne que des agents nés avant 1930
- version: [quatre_plafonds, quatre_plafonds_trois_quarts]
  ecart: >-
    Les salaires de référence de 1947 à 1950 que valeurs_point.csv prête à l'IPACTE
    sont ceux de l'annexe de l'arrêté du 17 février 1960 (IGRANTE), 26, 37, 42 et 52 F
    ; ceux de l'IPACTE pour ces années, que portaient peut-être les tableaux III à V
    de l'arrêté de 1951, abrogés en 1960, ne sont pas lus.
  effet: non mesuré ; les seuls services validés de 1947 à 1950
reformes: [ipacte_1951]
sources:
  lu_le: 2026-10-13
  prochaine_relecture: 2027-10-13
  a_relire:
  - >-
    Lire au fac-similé du Journal officiel du 18 décembre 1951 les articles 1er, 3 à 6
    et 11 à 14 du décret n° 51-1445 et les articles 5, 7, 10, 12 à 17 de l'arrêté du
    même jour — la limite d'âge, l'âge de la liquidation, l'allocation, la réversion —,
    puis l'arrêté du 31 décembre 1959 (liquidation avant soixante-cinq ans) et l'arrêté
    du 12 janvier 1967 (coefficient de réduction) : l'index n'en porte que l'analyse.
  - >-
    Lire les décrets n° 53-1305, n° 59-1568 et n° 68-1028 et l'arrêté du 31 décembre
    1953, pour le taux de cotisation et sa suspension année par année, qui feraient du
    taux d'appel de 60 % une valeur lue.
  - >-
    Lire le décret n° 49-1224 du 28 août 1949, « règlement de retraites applicables à
    certaines catégories d'agents de l'Etat », que l'article 14 du décret de 1951
    remplace : le régime avait un prédécesseur, que l'index ne porte que par son
    analyse (JORFTEXT000000319082).
  lectures:
  - type: legifrance
    reference: >-
      décret n° 51-1445 du 12 décembre 1951, articles 2 et 7 à 10 ; arrêté du 12
      décembre 1951, articles 6, 8 et 8 bis et annexes I, II et VI ; décret n° 55-773,
      article 2 ; décret n° 70-1277, article 12, ses trois rédactions ; arrêté du 30
      décembre 1970, article 26 ; décret n° 78-44, article 1er : index LEGI du dépôt, à
      jour au 12 octobre 2026
    date: 2026-10-13
  - type: jorf
    reference: >-
      analyses du décret n° 51-1445 et de l'arrêté du 12 décembre 1951, des décrets n°
      49-1224, n° 53-431, n° 53-1298, n° 54-663, n° 55-712, n° 57-293, n° 59-1568, n°
      61-377, n° 64-1376, n° 67-64, n° 68-1028 et n° 69-200, des arrêtés du 30 août
      1952, du 31 décembre 1959 et du 12 janvier 1967 : index JORF du dépôt, à jour au
      13 octobre 2026
    date: 2026-10-13
textes_a_relire:
- id: JORFTEXT000000876777
  reference: décret n° 64-1376 du 30 décembre 1964, analyse seule
  question: >-
    Il abroge et remplace l'article 1er (« régime de retraite par répartition »), supprime
    l'Algérie de l'article 2, modifie la validation et ajoute un alinéa à l'article 7
    (limite de l'assiette) : lequel ?
code:
  python: >-
    droit/acquerir.py : acquerir ; droit/liquider.py : valeur_du_point ;
    scenarios/actuel.py : ConversionsPoints
  javascript: >-
    moteur/js/droit/acquerir.js : acquerir ; moteur/js/droit/liquider.js :
    valeurDuPoint ; moteur/js/regimes.js : ConversionsPoints
  parametres: >-
    regimes/ipacte.yaml : assiette, taux_cotisation_retraite ; regimes/valeurs_point.csv
    : ipacte ; regimes/conversions_points.csv : ipacte
  tests: >-
    tests/test_donnees.py : test_les_precurseurs_de_l_ircantec_ne_se_recouvrent_pas ;
    tests/test_simulateur.py : test_un_regime_ferme_ne_vaut_jamais_plus_que_son_successeur
  moteur: >-
    Ses données : regimes/ipacte.yaml, une période de 1951 à 1970 sur la tranche B, au
    taux effectif de 7,5 %, routée par le statut contractuel_public. acquerir compte les
    points d'une année : la cotisation divisée par le taux d'appel et le salaire de
    référence. valeur_du_point sert les points IPACTE à la valeur de l'Ircantec,
    recopiée dans la série ipacte jusqu'en 2026, puis les convertit un pour un
    (regimes/conversions_points.csv, 1971, coefficient 1) ; regimes/valeurs_point.csv
    porte ses salaires de référence de 1947 à 1970, le taux d'appel estimé et la valeur
    de service jusqu'en 2026.
historique:
- >-
  2026-10-13 — écrite à l'étape 2 de l'action 145 : l'IPACTE n'avait que la fiche
  générique de liquidation. La lecture ajoute à ce que la fiche de régime disait les
  conditions d'affiliation de l'article 2, la validation des services antérieurs et ses
  points gratuits, et la reprise par l'Ircantec ; elle ne change aucun chiffre.
effet: >-
  Les agents contractuels de l'État et des collectivités payés au-dessus du plafond de
  1951 à 1970, aujourd'hui nés avant 1950 environ : leurs points IPACTE, que l'Ircantec
  sert à sa valeur ; le modèle les donne à tout contractuel au-dessus du plafond, sans
  la condition de qualification ni de traitement.
