schema_version: 1
id: ipacte_points
intitule: >-
  De 1951 à 1970, l'agent contractuel ou temporaire de l'État ingénieur diplômé, ou
  dans des fonctions de catégorie A, payé au moins le traitement de l'indice 225, cotise
  à l'IPACTE, 4,25 % à sa charge et 8,25 % à celle de l'employeur, sur la part de sa
  rémunération comprise entre un et quatre plafonds — quatre et trois quarts depuis
  1961 — ; la cotisation de l'année, divisée par un salaire de référence fixé chaque
  année, donne ses points ; ses services antérieurs se valident, avec des points
  gratuits de 1914 à 1946 ; au 1er janvier 1971, l'Ircantec reprend ces points, restés
  calculés selon ces règles, et les liquide.
domaine: points
regimes: [ipacte, ircantec]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- les services d'un agent non titulaire de l'État, puis, depuis 1955, des départements,
  des communes et de leurs établissements, année par année, avec sa qualification, ses
  fonctions et sa rémunération brute hors éléments familiaux et frais
- le plafond des assurances sociales de chaque année
- le salaire de référence de l'année, fixé par arrêté (arrêté du 12 décembre 1951,
  article 8)
- pour les services antérieurs validés, les tableaux I, II et VI annexés à l'arrêté
ecrit:
- les points IPACTE de chaque année de services, cotisée ou validée, et les points
  gratuits des années 1914 à 1946
- au 1er janvier 1971, ces mêmes points au compte de l'Ircantec, qui les liquide sous
  ses propres règles
dates_qui_decident:
- revenu.annee
# Les versions partagent l'année des services. Aucune n'est lue par un moteur :
# le modèle calcule l'IPACTE par la fiche de régime (regimes/ipacte.yaml) et la
# chaîne de succession (regimes/conversions_points.csv), que `code` nomme.
versions:
- id: services_de_1914_a_1946
  statut: lue
  textes:
  - {id: LEGIARTI000006381672, article: "arrêté du 12 décembre 1951, article 6", en_vigueur: 1951-12-18}
  - {id: LEGIARTI000006381674, article: "arrêté du 12 décembre 1951, article 8 bis", en_vigueur: 1951-12-18}
  - {id: LEGIARTI000006381675, article: "arrêté du 12 décembre 1951, annexe I", en_vigueur: 1951-12-18}
  - {id: LEGIARTI000006381676, article: "arrêté du 12 décembre 1951, annexe II", en_vigueur: 1951-12-18}
  - {id: LEGIARTI000006381677, article: "arrêté du 12 décembre 1951, annexe VI, première des vingt-huit grilles (LEGIARTI000006381677 à LEGIARTI000006381704)", en_vigueur: 1951-12-18}
  - {id: LEGIARTI000006381642, article: "arrêté du 30 décembre 1970, article 26", en_vigueur: 1971-02-09}
  nee_de: LEGIARTI000006381674
  bornes:
    revenu.annee: [null, 1947-01-01]
  contenu:
    droit: >-
      les services accomplis avant l'entrée dans le régime se valident à la demande de
      l'agent (décret, article 6, paragraphe 2, que l'index ne porte pas ; ses délais,
      prorogés par les décrets n° 53-431, n° 53-1298 et n° 55-712, titres seuls) : l'institution vérifie qu'il remplissait les conditions de l'article 2 du
      décret et percevait au moins le traitement budgétaire du tableau I — celui d'un
      rédacteur stagiaire des administrations centrales, 2 000 F de 1914 à 1919, 14 000
      F du 1er octobre 1930 au 30 juin 1943, 54 000 F en 1945 —, puis fixe les
      cotisations rétroactives, assises entre les limites du tableau II — 3 600 et 14
      400 F pour 1914 et avant, 90 000 et 306 000 F pour 1945 ; et « les services validés
      […], accomplis entre 1914 et 1946 inclus, peuvent donner lieu gratuitement à des
      attributions supplémentaires de points de retraite, conformément au tableau VI »
      (article 8 bis)
    points_gratuits: >-
      le tableau VI tient en vingt-huit grilles, une par année ou groupe d'années, qui
      donnent de 12 à plus de 900 points selon le traitement pris en compte ; dans les
      dernières, le nombre de points décroît au-delà d'un certain traitement (de 228 à
      189 points entre 135 000 et 504 000 F)
    apres_1971: >-
      l'Ircantec valide encore ces services « dans les conditions antérieurement fixées
      par » l'article 2 du décret, les articles 6, 8 (paragraphe 3) et 8 bis de l'arrêté
      et « compte tenu des éléments figurant dans les tableaux visés par ces articles »
      (arrêté du 30 décembre 1970, article 26) ; le décret n° 78-44 étend la règle à
      tous les services d'avant 1971 des agents de l'Ircantec
  exemples: aucun trouvé
