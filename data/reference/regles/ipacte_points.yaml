  nee_de: LEGITEXT000006061718
  bornes:
    revenu.annee: [1971-01-01, null]
  contenu:
    droit: >-
      « Les dispositions des décrets n° 51-1445 du 12 décembre 1951, n° 55-773 du 9 juin
      1955, n° 59-1569 du 31 décembre 1959 et n° 61-451 du 18 avril 1961 modifiés sont
      annulées et remplacées par celles du présent décret » ; l'IPACTE demeure jusqu'au
      1er janvier 1971, avec l'article 2 (2° et 3°) et les articles 7 à 10 du décret de
      1951, et « pour les services accomplis avant la date susvisée, les points
      resteront calculés selon les dispositions visées à l'alinéa précédent » ; à cette
      date, les employeurs immatriculés à l'IPACTE et « les agents tributaires desdits
      régimes » sont affiliés de plein droit à l'Ircantec, et les agents à temps
      incomplet, que l'IPACTE n'admettait pas, le sont aussi, leurs périodes antérieures
      se validant sur demande (décret n° 70-1277, article 12)
    conversion: >-
      aucun texte de l'index ne majore ni ne convertit les points de l'IPACTE, quand
      l'arrêté du 10 mars 1971 majore de 3,5 % ceux de l'IGRANTE (fiche
      igrante_points) : ils passent à l'Ircantec un pour un, et c'est l'Ircantec qui les
      liquide, à ses âges et à sa valeur de service
    services_anterieurs: >-
      les validations des services d'avant 1971 suivent les règles de l'IPACTE
      (arrêté du 30 décembre 1970, article 26 ; décret n° 78-44, article 1er : « Les
      services accomplis avant le 1er janvier 1971 par les agents visés à l'article
      1er du décret n° 70-1277 […] sont validés suivant les règles applicables aux
      ressortissants du régime institué par le décret n° 51-1445 »)
