  - {id: JORFTEXT000000833532, reference: "arrêté du 12 décembre 1951, analyse du Journal officiel : les articles 1er à 5, 7 et 9 à 21, absents de LEGI, par leur seul objet", publie_le: 1951-12-18}
  - {id: JORFTEXT000000797895, reference: "arrêté du 30 août 1952 approuvant la convention du 11 juillet 1952 entre l'Agirc et l'IPACTE, titre seul", publie_le: 1952-09-06}
  nee_de: LEGIARTI000006368159
  bornes:
    revenu.annee: [1947-01-01, 1961-01-01]
  contenu:
    beneficiaire: >-
      les « personnels non titulaires » des administrations, services ou établissements
      de l'article 1er qui, d'une part, possèdent « la qualification d'ingénieur
      diplômé, ou une qualification technique assimilée » ou exercent des « fonctions
      correspondant à celles qui incombent à des fonctionnaires titulaires de la
      catégorie A », et, d'autre part, perçoivent, hors primes et indemnités, « une
      rémunération brute, ramenée à l'année, égale au traitement budgétaire d'un agent
      titulaire de l'Etat classé à l'indice 225 » (article 2, 2° et 3°) ; le 1°, le 4°
      et le 5°, qui exige l'emploi en métropole, en Algérie ou dans les quatre
      départements d'outre-mer (décret n° 54-663, analyse seule), ne sont pas dans
      l'index ; l'emploi à
      temps complet est une condition, que l'article 12 du décret n° 70-1277 rappelle
      pour en affranchir les agents à compter de 1971. Le décret n° 55-773 étend le
      régime aux agents des départements, des communes et de leurs établissements, aux
      mêmes conditions ; des arrêtés d'extension l'ouvrent, établissement par
      établissement, de 1954 à 1970
    assiette: >-
      « la fraction de la rémunération excédant le plafond des assurances sociales du
      régime général, à l'exclusion des éléments à caractère familial, des indemnités
      représentatives de frais et des prestations familiales, et dans la limite du
      quadruple dudit plafond » (article 7) ; le tableau II de l'arrêté porte ces deux
      limites année par année, 456 000 et 1 824 000 F en 1953, 660 000 et 2 640 000 F
      en 1959
    taux: >-
      « Les taux de cotisation à la charge des bénéficiaires et des services employeurs
      sont respectivement fixés à 4,25 p. 100 et à 8,25 p. 100 » ; un arrêté peut
      suspendre le versement d'une partie des cotisations, sans toucher « le calcul des
      points ni celui de la valeur du point » (article 7) : c'est un taux d'appel. LEGI
      ne garde de l'article qu'une rédaction consolidée ; les décrets n° 53-1305, n°
      59-1568 et n° 68-1028 l'ont modifié, et l'arrêté du 31 décembre 1953 suspend une
      part des cotisations, l'arrêté du 31 décembre 1959 substituant à son article 3 «
      le taux de 9 % » au « taux de 8 % » (article 6) : quatre textes connus par leur
      titre ou leur analyse, sans leurs chiffres
    points: >-
      « Le nombre de points de retraite acquis par chaque intéressé au cours d'une année
      civile déterminée s'obtient en divisant les cotisations afférentes à l'année
      considérée par un salaire de référence dont le montant est fixé pour chaque
      année » : 63 F pour 1951, 1952 et 1953, 65 F pour 1954, 74 F pour 1955, 80 F pour
      1956, 97 F pour 1957, 116 F pour 1958, 1,25 NF pour 1959, 1,29 NF pour 1960
      (arrêté, article 8)
    gestion: >-
      une institution de prévoyance paritaire, l'IPACTE, qui confie la gestion à la
      Caisse nationale d'assurance sur la vie (articles 8 et 9), et passe des
      conventions avec d'autres institutions de retraite pour les services accomplis
      hors de l'État ou pour assurer des « avantages de retraite équivalents » à ceux
      d'une association d'institutions (article 10) : la convention du 11 juillet 1952
      avec l'Agirc, celles de 1953 à 1963 avec la CARIM, la CPPOSS, le personnel au sol
      d'Air France et la CCPMA (titres seuls)
    allocation: >-
      ce que l'index dit de la liquidation tient aux seules analyses du Journal
      officiel : la limite d'âge et l'indemnité de licenciement (décret, article 5), le
      montant de l'allocation viagère (article 12), les conditions de la liquidation, sa
      date, les droits de la veuve et des orphelins, la valeur du point et le
      remboursement des cotisations (arrêté, articles 5, 7, 10, 12 à 17) ; l'arrêté du
      31 décembre 1959 rend la liquidation possible avant soixante-cinq ans (article 2)
      ; un capital-décès avant soixante ans est créé la même
      année (décret n° 59-1568, article 2) ; la veuve a droit à cinquante ans au lieu de
      soixante, et un coefficient de réduction s'applique à la liquidation anticipée,
      depuis l'arrêté du 12 janvier 1967 — sans un chiffre lu
  exemples: aucun trouvé
