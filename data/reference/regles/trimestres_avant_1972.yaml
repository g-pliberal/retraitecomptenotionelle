schema_version: 1
id: trimestres_avant_1972
intitule: >-
  Avant 1972, un trimestre d'assurance se valide par un salaire, non au SMIC : de 1949 à
  1971, autant de trimestres que le salaire annuel représente de fois le montant
  trimestriel de l'allocation aux vieux travailleurs salariés au 1er janvier de l'année,
  celui des villes de plus de 5 000 habitants jusqu'en 1962, quatre au plus par année
  civile ; de 1946 à 1948, autant de fois 18 F, 1 800 anciens francs. Outre-mer, rien
  avant 1948, puis 1 800 F métropolitains ou 900 F CFA en 1948, l'allocation des
  départements d'outre-mer de 1949 à 1951, et leur SMIC de 1972 à 1995. Avant 1946, par
  la retenue des assurances sociales : rien avant le 1er juillet 1930, soixante
  cotisations journalières par trimestre jusqu'en 1935, un trimestre par retenue de
  15 anciens francs de 1936 à 1945 ; et jusqu'en 1946, rien au salarié payé au-delà du
  plafond d'assujettissement, qui ne subissait aucune retenue.
regimes: [regime_general, assurances_sociales, msa_salaries]
etat: approchee
effet: >-
  Les années travaillées de 1946 à 1971 dont le salaire n'atteint pas quatre fois le
  seuil : 9 à 14 % du salaire moyen pour quatre trimestres, 2 à 3,5 % pour un — une année
  commencée en décembre, un apprentissage, quelques semaines d'été. Le modèle leur
  validait quatre trimestres, en écrivant qu'« aucun seuil de montant n'existait » ; elles
  en valident désormais ce que le salaire paie, dans les deux moteurs, et une année qui
  n'en valide aucun ne compte plus au salaire annuel moyen depuis 2004. Aucun des 737
  témoins n'est touché. Outre-mer, depuis le 18 octobre 2026, le seuil du département :
  37,50 F au lieu de 85 F en 1949, 2 768,20 F à La Réunion et 2 966,80 F aux Antilles et
  en Guyane au lieu de 3 630 F en 1982 ; la carrière et la chronologie portent le
  département, le site n'a pas encore de champ pour le dire, et aucun témoin ne bouge.
  Avant 1946, depuis le 18 octobre 2026 : le modèle validait quatre trimestres à toute
  année travaillée, 1929 comprise, et au cadre payé au-delà du plafond
  d'assujettissement ; il n'en valide plus aucun avant le 1er juillet 1930, deux en 1930,
  ce que la retenue paie de 1936 à 1945 (375 anciens francs de salaire par trimestre,
  272,73 en 1945), et aucun, jusqu'en 1946, au salaire qui dépasse le plafond, dont le
  salaire annuel moyen ne retient plus l'année. Seuls les statuts que le routage porte
  aux assurances sociales sont touchés : le fonctionnaire garde ses années. Six des 883
  témoins perdent de 4 à 18 trimestres, aucune pension de droit direct ne bouge, une
  réversion perd 2,8 % (`reversion_maximum_des_pensions`) ; les cas types nés de
  1885 à 1920 en perdent assez pour que le pilote les fasse partir plus tard (le cadre
  né en 1910, payé 2,2 fois le salaire moyen, à 65 ans au lieu de 60).
sources:
  lu_le: 2026-10-18
  prochaine_relecture: 2027-04-30
  a_relire:
  - >-
    Avant 1946, les textes que l'index de la DILA ne porte pas, à lire au fac-similé : la
    loi du 30 avril 1930 au Journal officiel (le dépôt la lit dans l'édition de 1930 que
    reproduit la COR), le décret-loi du 28 octobre 1935, la loi du 26 août 1936, le décret
    du 14 juin 1938, les lois du 14 mars 1941, du 6 janvier 1942 et du 24 avril 1944, les
    ordonnances du 20 octobre et du 30 décembre 1944 et celle du 20 juin 1945. Ils diraient
    le taux de la retenue de 1936 à 1945, lu dans deux histoires des assurances sociales
    (`legislation/taux_retenue_avant_1946.csv`, niveau `moyenne`), le partage des deux
    premiers trimestres de 1945, supposé par moitié, et les majorations du plafond
    d'assujettissement, que le barème de la Cnav ne date pas. Le barème « Salaire validant
    un trimestre » de la caisse se lit comme la double cotisation, et non le salaire : 30
    anciens francs de 1936 à 1945, deux fois les 15 de la retenue ; 216 en 1946, 12 % de
    1 800, le taux de l'ordonnance du 4 octobre 1945. L'écart que `cnav_avts.py` déclare
    pour 1946 serait ainsi une autre unité, que la caisse ne nomme pas.
  - >-
    Outre-mer : les montants de l'allocation aux vieux travailleurs salariés des
    départements d'outre-mer de 1949 à 1951, 15 000, 22 500 et 32 000 anciens francs au
    1er janvier selon le barème de la Cnav, ne se lisent qu'au fac-similé (loi n° 50-147,
    article 2 ; décrets n° 48-593, 50-1410 et 51-1441, dont l'index n'a que la notice).
    Le site n'a pas de champ pour dire où l'assuré a travaillé : la carrière, le relevé
    et la chronologie portent le département, que la saisie ne remplit pas encore.
  - >-
    Le Journal officiel ne porte dans l'index du dépôt, pour ces années, que la notice du
    décret n° 70-879 (1 750 F au 1er octobre 1970) ; les lois de 1948 à 1956 et les
    décrets de 1962 à 1969 n'y ont que leur titre, à lire au fac-similé. Depuis le
    13 octobre 2026, le seuil de 1971 et ceux de 1946 à 1948 sont `certifiee`
    (`jorf_avts.py`) ; ceux de 1949 à 1970 restent `haute`.
  lectures:
  - type: legifrance
    reference: >-
      R. 753-21 CSS, LEGIARTI000006752616, du 21 décembre 1985 au 1er janvier 2026, lue
      dans l'index LEGI : « Les cotisations versées au titre de la législation sur les
      assurances sociales dans les départements mentionnés à l'article L. 751-1 depuis le
      1er janvier 1948 sont prises en compte [...] : 1°) pour l'année 1948, [...] autant de
      trimestres que le salaire annuel [...] représente de fois 1.800 F métropolitains
      dans les départements de la Guadeloupe, de la Martinique et de la Guyane, ou 900 F.
      C. F. A. dans le département de la Réunion ; 2°) depuis le 1er janvier 1949, [...]
      de fois le montant trimestriel de l'allocation aux vieux travailleurs salariés au
      1er janvier de l'année considérée, dans les départements mentionnés à l'article
      L. 751-1 avec un maximum de quatre trimestres par année civile »
    date: 1985-12-21
  - type: legifrance
    reference: >-
      R. 351-39 CSS, LEGIARTI000053327980, créé par le décret n° 2025-1409, article 2, 32°
      (JORFARTI000053227542), qui abroge R. 753-21 (44°) : pour les assurés de plus de
      soixante-quinze ans au 1er janvier 2026, ou assurés « au titre de périodes
      antérieures de plus de soixante ans », « demeurent applicables [...] des quatre
      premiers alinéas de l'article R. 351-9 [...] et, en ce qui concerne les périodes
      antérieures au 1er janvier 1952, de l'article R. 753-21 dans leur rédaction
      antérieure »
    date: 2026-01-01
  - type: legifrance
    reference: >-
      R. 351-9 CSS, toutes ses rédactions depuis 1985 (LEGIARTI000006749353,
      LEGIARTI000028751530, LEGIARTI000053335598) : « En ce qui concerne les assurés
      ayant, au cours de tout ou partie d'une année déterminée, exercé leur activité dans
      l'un des départements mentionnés à l'article L. 751-1, le montant du salaire minimum
      de croissance à retenir est celui qui est en vigueur dans ledit département au 1er
      janvier de l'année considérée »
    date: 1985-12-21
  - type: legifrance
    reference: >-
      D. 757-2 CSS, LEGIARTI000006738640, du 21 décembre 1985 au 1er janvier 1991 : la
      condition d'ouverture de l'allocation aux vieux travailleurs salariés, une
      rémunération au moins égale à l'allocation entière de 1949 à 1971, puis à 800 heures
      de SMIC — ce que porte le barème « AVTS - Validation des années de salariat » de la
      Cnav, qui intervertit les Antilles et La Réunion de 1975 à 1991 ; sans effet sur le
      trimestre
    date: 1985-12-21
  - type: jorf
    reference: >-
      les arrêtés et les décrets du SMIC des départements d'outre-mer, lus dans l'index du
      dépôt : arrêté du 29 novembre 1974 (JORFTEXT000000857163), 220,74 F la semaine aux
      Antilles et en Guyane au 1er décembre 1974 ; arrêté du 29 février 1980
      (JORFTEXT000000287879), 436,76 F et 392,40 F à La Réunion pour 40 heures ; arrêté du
      30 décembre 1981 (JORFTEXT000000463090), 593,36 F et 553,64 F au 1er janvier 1982 ;
      décret n° 90-1153 (JORFARTI000001313610), 1 048,92 F et 1 012,07 F pour 39 heures au
      1er janvier 1991 ; décret n° 92-17 (JORFARTI000001512356), 1 094,37 F dans les
      quatre départements au 1er janvier 1992 ; décret n° 95-1312 (JORFARTI000001402023),
      36,98 F de l'heure au 1er janvier 1996, celui de la métropole. La Réunion avait le
      SMIC le plus bas : le barème du salaire validant est le bon
    date: 1996-01-01
  - type: legifrance
    reference: >-
      R. 351-9 CSS, LEGIARTI000053335598, en vigueur depuis le 1er janvier 2026, lue dans
      l'index LEGI : « Pour la période comprise entre le 1er janvier 1949 et le 31
      décembre 1971, il y a lieu de retenir autant de trimestres d'assurance que le
      salaire annuel correspondant aux retenues subies par l'assuré sur sa rémunération
      représente de fois le montant trimestriel de l'allocation aux vieux travailleurs
      salariés au 1er janvier de l'année considérée, avec un maximum de quatre trimestres
      par année civile ; jusqu'au 31 décembre 1962, ce montant est celui des villes de plus
      de 5 000 habitants »
    date: 2026-01-01
  - type: legifrance
    reference: >-
      R. 351-9 CSS, rédactions du 21 décembre 1985 (LEGIARTI000006749353) et du 21 mars
      2014 (LEGIARTI000028751530) : « Pour la période comprise entre le 1er janvier 1946
      et le 31 décembre 1948, il y a lieu de retenir autant de trimestres que le salaire
      annuel correspondant aux retenues subies par l'assuré sur sa rémunération
      représente de fois 18 F », et les règles de 1930 à 1945 ; la rédaction de 2026 ne
      commence plus qu'en 1949
    date: 2014-03-21
  - type: legifrance
    reference: >-
      décret n° 45-0179 du 29 décembre 1945, article 71, § 2, rédaction du 1er septembre
      1983 (LEGIARTI000006760608) : les mêmes règles, en anciens francs — « de fois 1.800
      anciens francs » de 1946 à 1948
    date: 1983-09-01
  - type: circulaire_cnav
    reference: >-
      barème « Salaire validant un trimestre », colonnes « Guadeloupe, Guyane,
      Martinique » et « Réunion », de 1948 à 1995 (`cnav_avts.py`, `bareme_seuil`) :
      3 750, 5 625 et 8 000 anciens francs de 1949 à 1951, la métropole de 1952 à 1971,
      200 heures du SMIC de chaque département de 1972 à 1995, que le récupérateur
      recontrôle sur les textes du SMIC ; une seule colonne depuis 1996
    url: https://legislation.lassuranceretraite.fr/#/bareme?file_leaf_ref=salaire_validant_un_trimestre_montant_bar.aspx
    date: 2025-12-23
  - type: circulaire_cnav
    reference: >-
      barèmes « Allocation aux vieux travailleurs salariés, Allocation aux mères de
      famille, Majoration L814-2, Secours viager - Montant » et « Salaire validant un
      trimestre » de la base de législation, par son API (`cnav_avts.py`) : le premier date
      chaque montant depuis la loi du 14 mars 1941 et cite le texte qui le fixe ; le second
      redonne au centime, de 1949 à 1971, le quart du premier au 1er janvier — 8 500
      anciens francs en 1949, 180,95 F de 1956 à 1962, 437,50 F en 1971 — et, de 1972 à
      2026, les 200 puis 150 SMIC horaires du dépôt ; il porte 216 anciens francs pour 1946,
      que le texte contredit
    url: https://legislation.lassuranceretraite.fr/#/bareme?file_leaf_ref=salaire_validant_un_trimestre_montant_bar.aspx
    date: 2025-12-23
  - type: jorf
    reference: >-
      décret n° 70-879 du 29 septembre 1970, notice (JORFTEXT000000518679) : « A COMPTER DU
      01-10-1970, LES TAUX SONT PORTES A 1750FRS PAR AN (ALLOCATIONS AUX VIEUX
      TRAVAILLEURS SALARIES […]) » ; relue avec les autres textes de l'AVTS par
      `jorf_avts.py`, qui en certifie le seuil de 1971, et celui de 1946 à 1948 par
      les rédactions de R. 351-9 ; avant 1970, l'index n'a que le titre des textes
    date: 1970-10-01
  - type: legifrance
    reference: >-
      décret n° 45-0179 du 29 décembre 1945, article 71, § 2 (LEGIARTI000006760608), et
      R. 351-9 CSS, rédactions de 1985 et de 2014 (LEGIARTI000006749353,
      LEGIARTI000028751530), lus dans l'index LEGI le 18 octobre 2026 : « Les périodes
      d'assurance accomplies du 1er juillet 1930 au 31 décembre 1935 comptent pour autant
      de trimestres d'assurance que, durant ce délai, l'intéressé a versé de fois
      soixante cotisations journalières de la catégorie où il était classé, sans que le
      nombre de trimestres entrant en compte puisse dépasser vingt-deux » ; de 1936 à
      1941, « ne comptent comme trimestres d'assurance que ceux au cours desquels
      l'assuré a subi sur son salaire une retenue au moins égale à 15 anciens francs » ;
      de 1942 à 1945, « autant de trimestres que la retenue subie par l'assuré sur son
      salaire annuel représente de fois 15 F (anciens) avec un maximum de quatre
      trimestres par année civile »
    date: 1983-09-01
  - type: autre
    reference: >-
      loi du 5 avril 1928 modifiée par la loi du 30 avril 1930, « Texte officiel et
      complet », 1930, fac-similé de Gallica que reproduit le document n° 7 de la séance
      du COR du 15 décembre 2022 : article 1er, § 2, « Sont affiliés obligatoirement aux
      assurances sociales tous les salariés [...] dont la rémunération totale annuelle
      [...] ne dépasse pas 15.000 fr. », 18 000 F dans les villes de plus de 200 000
      habitants, 2 000 F de plus par enfant à charge, 25 000 F pour trois, et « Ne sont pas
      considérées comme salariées les personnes dont le nombre de journées de travail
      salarié [...] est inférieur à 90 » ; article 2, § 1, « des versements pour moitié à
      la charge de l'assuré et retenus lors de sa paye », § 2, les cinq catégories, la
      cotisation mensuelle de 24 cotisations journalières des quatre premières, § 3, la
      double cotisation, « 8 p. 100 du salaire annuel de base » en moyenne
    url: https://www.cor-retraites.fr/sites/default/files/2022-12/Doc_07_lois_1928_1930.pdf
    date: 1930-04-30
  - type: circulaire_cnav
    reference: >-
      barème « Plafond d'assujettissement avant 1947 »
      (plafond_assujettissement_securite_sociale_avant_1947_bar), lu par l'API de la base
      de législation le 18 octobre 2026 : 15 000 anciens francs du 1er juillet 1930 à la
      fin de 1936, 21 000 au 1er janvier 1937, 30 000 au 1er juillet 1938, 42 000 en 1942,
      48 000 en 1944, 60 000 au 1er septembre 1944, 120 000 du 1er avril 1945 au
      31 décembre 1946, chacun avec son texte (`legislation/plafond_assujettissement_avant_1947.csv`)
    url: https://legislation.lassuranceretraite.fr/#/bareme?file_leaf_ref=plafond_assujettissement_securite_sociale_avant_1947_bar.aspx
    date: 2024-07-25
  - type: autre
    reference: >-
      le taux de la retenue de 1936 à 1945 : B. Valat, « Les retraites et la création de
      la Sécurité sociale en 1945 : révolution ou restauration ? », Revue d'histoire de la
      protection sociale, n° 13, 2020 (document n° 10 de la séance du COR du 15 décembre
      2022), « acquittées à parts égales par employeurs et bénéficiaires (le total pour
      les assurances sociales s'élevant à 8 % des salaires) » et, à la réforme, « les
      salariés [...] voient leur cotisation passer de 4 à 6 % » ; P.-J. Hesse et
      J.-P. Le Crom (dir.), « La protection sociale sous le régime de Vichy », Presses
      universitaires de Rennes, 2001, conclusion : le taux, « bloqué à 8 % depuis 1937,
      passe à 9 % au premier trimestre 1945 », à 11 % au deuxième, à 12 % aux deux
      derniers (`legislation/taux_retenue_avant_1946.csv`)
    url: https://www.cor-retraites.fr/sites/default/files/2022-12/Doc_10_Valat.pdf
    date: 2022-12-15
  - type: legifrance
    reference: >-
      ordonnance n° 45-2250 du 4 octobre 1945, article 32 (LEGIARTI000038154243), lu dans
      l'index LEGI : « Le taux de la cotisation des assurances sociales est de 12 p. 100.
      La moitié de la cotisation est à la charge de l'employeur, l'autre moitié à la
      charge du salarié ou assimilé »
    date: 1945-10-07
  - type: legifrance
    reference: >-
      décret n° 46-1378 du 8 juin 1946, article 216 (LEGIARTI000006761396), lu dans
      l'index LEGI : les années de prévoyance d'avant l'assujettissement, « postérieures au
      1er juillet 1930 », n'entrent que dans l'ouverture du droit, et « La liquidation de
      la pension est faite en tenant compte seulement du temps pendant lequel les
      intéressés ont été soumis à l'assujettissement obligatoire aux assurances
      sociales », sauf le versement fait avant le 24 août 1949 (§ 2)
    date: 1949-04-02
textes_a_rattacher:
- id: LEGIARTI000053335598
  reference: R. 351-9 CSS, rédaction en vigueur, de 1949 à 1971
- id: LEGIARTI000028751530
  reference: R. 351-9 CSS, rédaction de 2014 à 2025, de 1930 à 1948
- id: LEGIARTI000006749353
  reference: R. 351-9 CSS, rédaction de 1985 à 2014
- id: LEGIARTI000006760608
  reference: décret n° 45-0179 du 29 décembre 1945, article 71, § 2
- id: LEGIARTI000006752616
