approximations:
- ecart: >-
    de 1930 à 1935, un trimestre par trimestre civil travaillé, deux en 1930, quand le
    texte compte sur toute la période les cotisations journalières, soixante par
    trimestre, vingt-deux trimestres au plus : le salaire ne dit pas les journées ; un
    salarié à plein temps entré en 1931, à 288 cotisations par an selon le tableau de la
    loi de 1930, en avait vingt-deux, le modèle lui en donne vingt
  effet: non mesuré ; trois trimestres au plus par carrière, pour qui entre en 1932
- ecart: >-
    de 1936 à 1941, autant de trimestres que la retenue de l'année paie de fois 15 anciens
    francs, comme de 1942 à 1945, quand le texte compte les seuls trimestres où la
    retenue les atteint : une année dont la retenue s'étale sur les quatre trimestres
    sans y atteindre 15 anciens francs n'en valide aucun
  effet: >-
    non mesuré ; les années de moins de 1 500 anciens francs de salaire, quelques
    semaines de travail
- ecart: >-
    le plafond d'assujettissement de base, que la Cnav date : ni les 18 000 F des villes
    de plus de 200 000 habitants, ni les majorations pour enfants à charge, ni l'exclusion
    de qui travaillait moins de quatre-vingt-dix journées par an (loi de 1930, article 1er,
    § 2) ; ni les années de prévoyance que le décret n° 46-1378, article 216, fait entrer
    dans l'ouverture du droit, ni les rachats ; le salarié agricole prend la règle du
    régime général
  effet: >-
    non mesuré ; un cadre payé entre 15 000 et 18 000 anciens francs dans une grande ville
    avant 1937, ou chargé de famille, était assujetti
- ecart: >-
    le taux de la retenue de 1936 à 1945, lu dans deux histoires des assurances sociales
    (niveau `moyenne`), et le partage des deux premiers trimestres de 1945, supposé par
    moitié
  effet: >-
    nul en pratique : la retenue de 15 anciens francs demande 375 anciens francs de salaire
    par trimestre, moins d'un dixième du salaire moyen dès 1940
- ecart: >-
    le seuil de la métropole, quand l'assuré a travaillé outre-mer de 1949 à 1951 ou de
    1972 à 1995 : le site n'a pas de champ pour le dire, et la saisie ne remplit pas le
    département que la carrière porte
  effet: non mesuré ; aucun témoin n'a travaillé outre-mer
- ecart: >-
    une année partagée entre la métropole et un département d'outre-mer prend un seul
    seuil : depuis 1972, celui du département, comme R. 351-9 le veut ; avant, celui du
    lieu où l'assuré a passé le plus de mois, comme son statut, quand R. 753-21 compte
    au seuil du département les seules cotisations qui y ont été versées
  effet: non mesuré ; une année travaillée des deux côtés avant 1972
code:
  moteur: >-
    `DonneesMacro.trimestres_valides` (`donnees/macro.py`) et `trimestresValides`
    (`moteur/js/macro.js`) lisent le seuil de 1946 à 1971 dans
    `legislation/salaire_validant_trimestre_avant_1972.csv`, que le paquet porte sous
    `salaire_validant_avant_1972`, et le divisent comme le SMIC depuis 1972 : un salaire
    qui tombe pile sur le seuil le valide (neuf décimales d'euro). Outre-mer, ils lisent
    `legislation/salaire_validant_trimestre_outre_mer.csv` par le département de l'année
    (`AnneeCarriere.outre_mer`, `LigneRelevee.outre_mer`, l'attribut `outre_mer` de la
    période d'activité de la chronologie), sous `salaire_validant_outre_mer_*` au paquet.
    Avant 1946, ils lisent la retenue (`_trimestres_de_la_retenue`,
    `_trimestresDeLaRetenue`) dans `legislation/taux_retenue_avant_1946.csv`, et le
    plafond d'assujettissement de 1930 à 1946 dans
    `legislation/plafond_assujettissement_avant_1947.csv`, proratisé sur les mois de
    l'année, que le paquet porte sous les mêmes noms ; ils ne le font que pour les
    statuts que le routage porte aux assurances sociales
    (`DonneesMacro.statuts_assures_sociaux`, `statutsAssuresSociaux`), que l'année de
    carrière leur passe. Le salaire annuel moyen ne retient pas le salaire d'une année
    non assujettie (`salaire_au_compte`, `salaireAuCompte`).
  python: >-
    donnees/macro.py : DonneesMacro.trimestres_valides,
    DonneesMacro._trimestres_de_la_retenue, DonneesMacro._assujetti,
    DonneesMacro.salaire_au_compte, DonneesMacro.statuts_assures_sociaux ;
    carriere.py : _ligne_annuelle ; droit/liquider.py : salaire_de_reference
  javascript: >-
    moteur/js/macro.js : DonneesMacro.trimestresValides,
    DonneesMacro._trimestresDeLaRetenue, DonneesMacro._assujetti,
    DonneesMacro.salaireAuCompte ; moteur/js/carriere.js : ligneAnnuelle ;
    moteur/js/droit/liquider.js : salaireDeReference
  parametres: >-
    legislation/salaire_validant_trimestre_avant_1972.csv : annee, valeur ;
    legislation/salaire_validant_trimestre_outre_mer.csv : annee, antilles_guyane,
    reunion ; legislation/taux_retenue_avant_1946.csv : annee, valeur ;
    legislation/plafond_assujettissement_avant_1947.csv : annee, valeur ;
    legislation/affiliations.yaml : affiliations
  tests: >-
    `test_avant_1972_le_trimestre_se_valide_au_trimestre_de_l_avts`,
    `test_avant_1946_le_trimestre_se_lit_sur_la_retenue`,
    `test_le_salaire_d_un_non_assujetti_n_entre_pas_au_salaire_annuel_moyen` et
