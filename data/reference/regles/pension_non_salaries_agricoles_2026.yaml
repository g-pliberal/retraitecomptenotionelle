      octroyées aux assurés dont le nombre moyen de points acquis est respectivement
      compris entre 19,51 et 27,34 ou supérieur à 27,34, dans la limite d'une majoration
      de 45 % s'agissant de la seconde de ces deux formules. » Le dernier alinéa compte
      au même article les rachats de L. 732-35 et L. 732-35-1 demandés depuis 2026. Lu
      dans l'index LEGI du dépôt
    date: 2026-10-28
  - type: legifrance
    reference: >-
      décret n° 86-1084 du 7 octobre 1986, article 1er (LEGIARTI000006769404) : « Le
      nombre de points sur la base duquel sont calculées les retraites proportionnelles
      est majoré, à compter du 1er juillet 1986, dans les conditions prévues aux articles
      suivants » ; article 2 (LEGIARTI000006769405), tous deux du 8 octobre 1986 au
      22 avril 2005 : « Pour le calcul des retraites proportionnelles prenant effet
      postérieurement au 30 juin 1986, le nombre de points acquis par les chefs
      d'exploitation ou d'entreprise agricole au titre de la période comprise entre le
      1er juillet 1952 et le 31 décembre 1972 est majoré de : 1° 5 p. 100 lorsque le
      nombre annuel moyen de points acquis par les intéressés au cours de cette période
      est compris entre 15 et 19,51 ; 2° 5 à 30 p. 100 et de 30 à 45 p. 100 selon que [ce
      nombre] est compris entre 19,51 et 27,34 ou est supérieur à 27,34. Dans le premier
      cas, le taux est déterminé par la formule suivante : T p. 100 = 3,19 P - 57,23 Dans
      le second cas, il est déterminé par la formule : T p. 100 = 1,93 P - 22,74 Le terme
      P représentant le nombre annuel moyen de points acquis par l'assuré au cours de la
      période visée ci-dessus. Pour l'application des dispositions du présent article,
      sont exclues les années pour lesquelles des points supplémentaires ont été accordés
      en application du décret susvisé du 26 juin 1968 ainsi que les points afférents
      auxdites années. » Décret n° 2005-368 du 19 avril 2005, article 3, 78°
      (LEGIARTI000006240372) : abrogé « à l'exception des articles 3 et 4 » le jour où
      naissent D. 732-76 et D. 732-77. Lus dans l'index LEGI du dépôt
    date: 2026-10-28
  - type: legifrance
    reference: >-
