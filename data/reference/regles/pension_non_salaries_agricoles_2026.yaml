code:
  interrupteurs:
    meilleures_annees_non_salaries: true
    calcul_provisoire_non_salaries: true
  moteur: >-
    `meilleures_annees_non_salaries`, sur les périodes des non-salariés agricoles depuis
    2026, liquide la pension par `liquider.pension_des_non_salaries_agricoles`
    (`pensionDesNonSalariesAgricoles` dans le portage) : le nombre d'années de chaque
    moyenne par `liquider.repartir_les_annees` (R. 173-3-2) ; le revenu annuel moyen des
    meilleures années depuis 2016 par `liquider.salaire_de_reference`, au taux plein du
    régime général et au prorata de la durée depuis 2016 ; le forfait au prorata de la
    durée d'avant 2016 ; la moyenne des points d'avant 2016, arrondie, multipliée par le
    quart des trimestres d'avant 2016. Les années sans barème de points y entrent par
    l'équivalent en points de leur rendement. Le coefficient de la décote multiplie les
    trois parts, puis la pension est bornée à la moitié du plafond, puis la surcote la
    majore. `calcul_provisoire_non_salaries`, en 2026 et 2027, calcule aussi l'ancienne
    formule, la moyenne d'avant 2016 en plus, et sert la plus forte des deux. Les régimes
    alignés d'un ancien exploitant — régime général, salariés agricoles, indépendants —
    ne retiennent plus au salaire annuel moyen que la part des années que la première
    répartition leur laisse (`liquider.annees_des_regimes_alignes`,
    `anneesDesRegimesAlignes`), là où vaut la réforme ; pour qui est né avant 1953, la
    seconde répartition la partage entre eux (II, a). Le test
    `test_la_reforme_agricole_rend_l_exemple_de_la_msa` rejoue l'exemple de la caisse,
    des deux côtés. Le revenu des années de 2016 à 2025 où le chef affilié avant 2016 a
    cotisé l'AVI au minimum se tire de ses cotisations
    (`liquider.revenu_des_cotisations_minimales`, `revenuDesCotisationsMinimales`),
    que `test_le_revenu_des_annees_cotisees_au_minimum_se_tire_des_cotisations` rejoue,
    posé à la main, dans les deux moteurs. Les points de chef de 1952 à 1972 entrent
    dans la moyenne majorés année par année (`liquider.majorer_les_points_de_1952_a_1972`,
    `majorerLesPointsDe1952A1972`), du taux que fixe leur moyenne
    (`taux_de_majoration_de_1952_a_1972`, `tauxDeMajorationDe1952A1972`), que
    `test_les_points_de_chef_de_1952_a_1972_se_majorent_annee_par_annee` et
    `test_la_pension_agricole_de_2026_majore_les_points_de_chef_de_1952_a_1972`
    rejouent, posés à la main, dans les deux moteurs.
