schema_version: 1
id: pension_non_salaries_agricoles_2026
intitule: >-
  Depuis le 1er janvier 2026, la pension des non-salariés agricoles affiliés avant 2016
  cumule le revenu annuel moyen des meilleures années depuis 2016, au taux et au prorata
  du régime général, la retraite forfaitaire proratisée sur la seule durée d'avant 2016,
  et la moyenne des points des meilleures années d'avant 2016, arrondie à l'entier et
  multipliée par le nombre de ces années ; vingt-cinq années en tout, réparties entre
  régimes et entre les deux périodes au prorata des durées ; la pension bornée à la
  moitié du plafond. Celles de 2026 et de 2027 sont d'abord liquidées par l'ancienne
  section, la moyenne d'avant 2016 en plus, puis recalculées en 2028 si le nouveau calcul
  leur est plus favorable.
etat: approchee
etape: liquider_chaque_regime
effet: >-
  Les chefs d'exploitation dont la pension prend effet depuis le 1er janvier 2026, et
  le salaire annuel moyen de leurs régimes alignés quand ils ont aussi été salariés ou
  indépendants. Le moteur servait jusqu'au 28 septembre 2026 la formule d'avant la réforme — forfait sur
  toute la durée et somme des points de toutes les années —, que la fiche disait « non
  calculable » faute des décrets, parus le 31 décembre 2025. Il sert depuis
  L. 732-24 dans sa rédaction de 2026 (`liquider.pension_des_non_salaries_agricoles`) :
  pour les pensions de 2026 et de 2027, la plus forte du calcul provisoire et du calcul
  de 2028. L'exemple de la MSA est rendu : un salarié agricole de 1984 à 1993 et un
  exploitant de 1994 à 2026 retiennent six, treize et six années, et les treize
  meilleures des vingt-deux années d'avant 2016 donnent « 403 pts / 13 ans = 31 pts » et
  « 31 pts x 22 ans = 682 pts » ; le salarié agricole n'a plus que ses six meilleures
  années sur dix, depuis le 28 septembre 2026 aussi. Restent approchés : les années d'avant 1990, dont le
  barème de points n'est pas lu, qui entrent dans la moyenne par les points que vaut
  leur rendement ; les majorations de points de 1952 à 1972
  (R. 732-67) et les rachats, qu'il ne connaît pas ; le revenu du collaborateur et de
  l'aide familial depuis 2016, que le moteur prend, depuis le 16 octobre 2026, de leur
  assiette forfaitaire (400 SMIC jusqu'en 2025, 600 depuis), quand L. 732-24 le tirerait
  de leurs cotisations jusqu'en 2025 si leur AVI, assise sur les revenus du chef que la
  saisie ne connaît pas, était au minimum ; et les années de chef à titre secondaire
  d'avant 2016, que le moteur garde dans la
  part forfaitaire, L. 732-28 étant abrogé pour ces pensions. Depuis le 17 octobre 2026
  (action 131), le revenu de l'année où l'exploitant cesse, cotisée entière (L.
  731-10-1), entre dans le revenu annuel moyen, au revenu de ses mois porté à douze, sous
  le plafond et au plancher de l'année entière : R. 732-60 arrête ses droits « au dernier
  jour de l'année civile de l'entrée en jouissance ». Le moteur le compte dès la date
  d'effet, quand R. 732-60 ne révise les droits qu'au mois qui suit l'encaissement.
  Depuis le 18 octobre 2026, l'année où il s'installe après le 1er janvier, qu'il ne
  cotise pas (R. 731-57), n'y entre pas (voir la fiche taux_plein_et_proratisation) ;
  toute année où il cesse y entre, et non la seule de son départ, au revenu de ses mois
  porté à douze, dans le statut du 1er janvier, et le revenu du statut pris en cours
  d'année n'y entre pas. Depuis le 24 octobre 2026, le revenu des années de 2016 à 2025
  où le chef à titre exclusif ou principal, affilié avant 2016, a cotisé l'AVI au
  minimum, sous 800 SMIC horaires, est « le rapport entre les montants totaux des
  cotisations [...] acquittées au titre de l'assurance vieillesse de base et les taux
  des cotisations en vigueur pour l'année considérée » (L. 732-24, I, 1°) : l'AVI sur
  800 SMIC, les deux AVA sur 600 ou sur le revenu au-dessus, divisées par la somme des
  trois taux, 17,11 % depuis 2017 : 638,81 SMIC au minimum, et non les 600 du plancher
  que le moteur leur donnait ; 719,40 à 700 SMIC. Le chef à titre secondaire, qui ne
  doit pas l'AVI (L. 731-42, 1°), et l'assuré affilié depuis 2016, que la phrase ne vise
  pas, gardent le plancher de 600 SMIC. Les durées que R. 173-3-2, II, répartit, arrêtées
  pour ce régime « au 31 décembre de l'année civile de l'entrée en jouissance » et pour
  les régimes alignés « au dernier jour du trimestre civil précédant l'entrée en
  jouissance », sont celles du moteur, qui les compte à la date d'effet : l'année où
  l'exploitant cesse y compte ses quatre trimestres (L. 731-10-1), et rien d'autre ne
  donne à ce régime de trimestres après la date d'effet — ses autres lignes, l'année
  cotisée au prorata (R. 731-83) comprise, n'ont que leurs mois, qui la précèdent,
  aucune période assimilée de la chronologie n'y va, et l'année de l'installation ne
  cotise pas (R. 731-57). Depuis le 24 octobre
  2026 (action 131), ces quatre trimestres ne valent plus pour les régimes alignés :
  cette année-là, une période assimilée sans ligne de carrière n'y compte que les
  trimestres civils qui précèdent l'effet (`compter.plafond_de_l_annee`). L'exploitant
  en stage de janvier à mai 2030, parti le 1er juin, compte 29 trimestres au régime
  général, et non 31 ; des vingt-cinq années, 4 aux régimes alignés et 21 à ce régime,
  et non 5 et 20.
sources:
  lu_le: 2026-10-24
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Lire le barème de points d'avant 1990 (article 1123 de l'ancien code rural et ses
    décrets) : les années d'avant 1990 entrent dans la moyenne par l'équivalent en points
    de leur rendement.
  - >-
    Chercher un exemple publié d'une pension entière calculée par la réforme (MSA,
    circulaire ou fiche) : l'exemple de la MSA ne donne que la répartition des années et
    la moyenne des points.
  lectures:
  - type: legifrance
    reference: >-
      code rural et de la pêche maritime, L. 732-24, rédaction du 1er janvier 2026
      (LEGIARTI000053280317) : « Pour les personnes ayant été affiliées au régime institué
      par le présent chapitre avant le 1er janvier 2016, le montant de la pension [...]
      cumule : 1° Un montant calculé dans les conditions prévues à l'article L. 732-18 du
      présent code sur les bases des seuls revenus des années à compter du 1er janvier
      2016 » ; « 2° La somme : a) D'une part dont le montant maximal attribué pour une
      durée minimale d'activité est prévu par décret », « calculé proportionnellement à
      cette durée d'activité » sous la limite de L. 351-1 ; « b) D'une part calculée en
      fonction des montants [...] des cotisations acquittées [...] au titre des périodes
      d'assurance antérieures au 1er janvier 2016, en retenant un nombre d'années
      sélectionnées dans des conditions fixées par voie réglementaire » ; « II. [...] un
      coefficient de minoration est appliqué aux montants prévus au 2° du I » ; « III. -
      Le montant prévu au premier alinéa du I du présent article ne peut excéder la
      moitié du plafond prévu à l'article L. 241-3 ». Lu dans l'index LEGI du dépôt
    date: 2026-09-28
  - type: legifrance
    reference: >-
      L. 732-18, rédaction du 1er janvier 2026 (LEGIARTI000051289367) : les prestations
      sont « calculées, liquidées et servies dans les conditions définies aux chapitres
      Ier à IV, VI et VIII du titre V du livre III du code de la sécurité sociale,
      exception faite des articles L. 351-10 et L. 351-10-1 », « les mots : “ salaire
      annuel de base ” sont remplacés par les mots : “ revenu annuel moyen ” ». Lu dans
      l'index LEGI du dépôt
    date: 2026-09-28
  - type: legifrance
    reference: >-
      D. 732-62, rédaction du 1er janvier 2026 (LEGIARTI000053352584) : « Le montant
      maximal attribué pour une durée minimale d'assurance prévu au a du 2° du I de
      l'article L. 732-24 du présent code est fixé à 3 905,37 euros annuel au 1er
      janvier 2025. Il est revalorisé dans les conditions prévues à l'article L. 161-23-1
      du code de la sécurité sociale. » Lu dans l'index LEGI du dépôt
    date: 2026-09-28
  - type: legifrance
    reference: >-
      R. 732-66, rédaction du décret n° 2026-346 du 7 mai 2026 (LEGIARTI000054059787) :
      la part du b est « égale au produit de la moyenne [...] du nombre de points annuels
      attribués à l'assuré en matière de retraite proportionnelle [...], du quart du
      nombre de trimestres mentionné au III et de la valeur du point [...], auquel est
      appliqué le rapport entre cent-cinquante et la durée d'assurance, exprimée en
      trimestres, mentionnée à l'article L. 161-17-3 » ; « La valeur annuelle du point
      est fixée à 4,589 euros au 1er janvier 2025 » ; « la moyenne des nombres de points
      acquis au cours des années civiles, retenues en nombre fixé selon les modalités
      mentionnées à l'article R. 173-3-2 [...], dont la prise en considération est la
      plus avantageuse pour l'assuré. Le nombre de points annuel moyen ainsi obtenu est
      arrondi à l'entier le plus proche. La fraction égale à 0,5 est comptée pour un
      point. » Lu dans l'index LEGI du dépôt
    date: 2026-09-28
  - type: legifrance
    reference: >-
      R. 732-61 (LEGIARTI000054059805) et R. 732-63 (LEGIARTI000054059797), rédaction du
      décret n° 2026-346 : les majorations de durée d'assurance comptent pour le 1°, et
      pour le a quand l'assuré n'a été affilié qu'avant 2016, les trimestres des enfants
      « en outre » pour le b ; la durée du a est celle des périodes d'assurance de R.
      732-48 et des périodes assimilées. R. 732-48 (LEGIARTI000053328383) : quatre
      trimestres par année civile d'avant 2016 dont les cotisations ont été acquittées.
      Lu dans l'index LEGI du dépôt
    date: 2026-09-28
  - type: legifrance
    reference: >-
      R. 732-60 (LEGIARTI000053336726) : pas de minimum contributif (le 2° du C du I et le
      III de R. 351-29 écartés), les droits « arrêtés au dernier jour de l'année civile de
      l'entrée en jouissance » ; R. 732-68 (LEGIARTI000053336735) : le coefficient de
      minoration « déterminé dans les mêmes conditions que celui mentionné au 2° du I de
      l'article R. 351-27 », 1,25 % par trimestre depuis le 1er août 2026
      (LEGIARTI000054589995). Lu dans l'index LEGI du dépôt
    date: 2026-09-28
  - type: legifrance
    reference: >-
      code de la sécurité sociale, R. 173-3-2, rédactions du 1er janvier 2026
      (LEGIARTI000053327958), du 9 mai 2026 (LEGIARTI000054059837) et du 1er août 2026
      (LEGIARTI000054589934) : « Le nombre d'années retenu dans les régimes mentionnés à
      l'article L. 173-1-2 et le régime des personnes non salariées des professions
      agricoles [...] est égal à vingt-cinq », vingt-quatre ou vingt-trois pour les
      parents depuis le 1er septembre 2026 ; il « fait l'objet d'une répartition au
      prorata des durées d'assurance », d'abord entre les régimes alignés et les
      non-salariés agricoles, puis entre les périodes d'avant 2016 et d'après ; « Les
      nombres d'années obtenus sont arrondis à chaque étape à l'entier non nul le plus
      proche, la fraction d'année égale à 0,5 étant comptée pour une année » ; les années
      surnuméraires sont retranchées à la durée la plus longue, « par priorité au régime
      des personnes non salariées des professions agricoles, en son sein au titre des
      périodes antérieures au 1er janvier 2016, au régime général de sécurité sociale ou
      au régime des personnes salariées des professions agricoles ». Lu dans l'index LEGI
      du dépôt
    date: 2026-09-28
  - type: jorf
    reference: >-
      loi n° 2025-199 du 28 février 2025, article 87, VIII, B (JORFARTI000051269910) : la
      section « dans [sa] rédaction antérieure » continue « de s'appliquer aux pensions
      [...] prenant effet entre le 1er janvier 2026 et le 31 décembre 2027 », les pensions
      de retraite proportionnelle « dues au titre des périodes d'assurance antérieures à
      2016 [étant] liquidées dans les conditions prévues au b du 2° du I du même article
      L. 732-24 » ; « au plus tard le 31 mars 2028, les pensions mentionnées au premier
      alinéa du présent B font l'objet d'un nouveau calcul » ; « Si le montant issu de ce
      nouveau calcul est supérieur à celui attribué dans les conditions prévues au même
      premier alinéa, le niveau de la pension est révisé et les sommes versées
      antérieurement font l'objet d'une régularisation. » Lu dans l'index JORF du dépôt
    date: 2026-09-28
  - type: jorf
    reference: >-
      décret n° 2025-1409 du 30 décembre 2025, article 6 (JORFARTI000053227599), et décret
      n° 2025-1410 du 30 décembre 2025, article 13 (JORFARTI000053227751) : la section 3,
      « dans leur rédaction antérieure », s'applique aux pensions prenant effet en 2026
      et en 2027 ; les points de 2026 et de 2027 sont déterminés « dans les conditions
      fixées à l'article R. 732-71 du même code dans sa rédaction antérieure » ; la date
      du nouveau calcul « est fixée au 31 mars 2028 ». Lu dans l'index JORF du dépôt
    date: 2026-09-28
  - type: autre
    reference: >-
      MSA, « Réforme de la retraite des exploitants : 25 meilleures années », mis à jour
      le 27 avril 2026, section 3 : un salarié agricole de 1984 à 1993 et un exploitant de
      1994 à 2026 retiennent « 6 ans sur les 25 meilleures années », « 13 ans » avant 2016
      et « 6 ans » depuis ; « prendre la moyenne des 13 meilleures années [...] soit 403
      pts / 13 ans = 31 pts », « puis à multiplier cette moyenne par le nombre d'années
      cotisées avant 2016, soit 31 pts x 22 ans = 682 pts » ; en 2026 et 2027, « la
      retraite forfaitaire est calculée sur les 33 années d'activité de non-salarié
      agricole » et la proportionnelle tient compte « des points acquis pour la période
      cotisée à compter de 2016 » ; à partir de 2028, le forfait sur les « 22 années
      d'activité de non-salarié agricoles avant 2016 » et, depuis 2016, « la moyenne des 6
      meilleures années [...] en revenu », « le revenu annuel moyen » ; « si celle-ci
      leur est plus favorable, elle est réhaussée »
    url: https://www.msa.fr/lfp/retraite/reforme-exploitants-25-meilleures-annees
    date: 2026-09-27
  - type: legifrance
    reference: >-
      R. 732-60, 1° (LEGIARTI000053336726) : « Par dérogation à ce qui résulte du 1° de
      l'article R. 351-1 du code de la sécurité sociale, les droits à l'assurance
      vieillesse sont déterminés en tenant compte des cotisations versées et arrêtées au
      dernier jour de l'année civile de l'entrée en jouissance de la pension. Lorsque des
      cotisations sont versées entre la date de liquidation de la pension et le dernier
      jour de l'année d'entrée en jouissance, la révision des droits prend effet à compter
      du premier jour du mois suivant celui au cours duquel ont été encaissées les
      cotisations dues ». Lu dans l'index LEGI du dépôt
    date: 2026-10-17
  - type: legifrance
    reference: >-
      L. 732-24, I, 1°, second alinéa (LEGIARTI000053280317) : « Pour les assurés dont
      les cotisations mentionnées au 1° de l'article L. 731-42, dans sa rédaction
      antérieure à la loi n° 2025-199 [...], dont ils ont été redevables au titre des
      années comprises entre 2016 et 2025 ont été portées à leur valeur minimale, les
      revenus pris en compte pour l'application du premier alinéa du présent 1° sont
      égaux au rapport entre les montants totaux des cotisations qu'ils ont acquittées au
      titre de l'assurance vieillesse de base et les taux des cotisations en vigueur pour
      l'année considérée ». Aucun décret n'en dit davantage dans l'index LEGI du dépôt
    date: 2026-10-24
  - type: legifrance
    reference: >-
      L. 731-42, rédactions du 11 novembre 2010 (LEGIARTI000023034860) et du 28 décembre
      2023 (LEGIARTI000048683785) : « 1° Une cotisation due pour chaque personne non
      salariée âgée d'au moins seize ans, à l'exception des personnes mentionnées à
      l'article L. 732-28 », dans la limite du plafond, l'AVI ; « 2° a) Une cotisation
      due pour chaque chef d'exploitation ou d'entreprise, calculée dans les conditions
      définies au 1° », l'AVA plafonnée ; « 3° Une cotisation à la charge de chaque chef
      d'exploitation ou d'entreprise, calculée sur la totalité » de ses revenus, l'AVA
      déplafonnée. Lu dans l'index LEGI du dépôt
    date: 2026-10-24
  - type: legifrance
    reference: >-
      D. 731-120 (LEGIARTI000028393446, du 1er janvier 2014 au 7 juillet 2024 ;
      LEGIARTI000049904749, jusqu'au 1er janvier 2026) : le montant des cotisations « ne
      peut être inférieur à celui des cotisations qui seraient calculées sur un revenu
      égal à : 1° 800 fois le montant du salaire minimum de croissance en vigueur au 1er
      janvier de l'année considérée pour la cotisation mentionnée au 1° ; 2° 600 fois
      [...] pour les cotisations mentionnées aux 2° a) et 3° ». D. 731-121
      (LEGIARTI000026140087) : « e) 3,32 % à compter de l'année 2016 » ; D. 731-122
      (LEGIARTI000028393435) : « e) 11,55 % à compter de l'année 2016 » ; D. 731-124
      (LEGIARTI000029924569, du 1er janvier 2015 au 7 juillet 2024) : « b) 2,14 % pour
      l'année 2016 ; c) 2,24 % à compter de l'année 2017 ». Lu dans l'index LEGI du dépôt
    date: 2026-10-24
  - type: autre
    reference: >-
      MSA Île-de-France, « Le calcul de vos cotisations non salariées agricoles 2025 »,
      octobre 2025 : l'AVI du chef « à titre exclusif ou principal », 3,32 %, sur 9 504 €
      (800 SMIC) au moins ; l'AVA plafonnée, 11,55 %, sur 7 128 € (600 SMIC) au moins ;
      l'AVA déplafonnée, 2,24 %, sur 7 128 € (600 SMIC) au moins, au SMIC du 1er janvier
      2025, 11,88 €
    url: https://iledefrance.msa.fr/lfp/documents/98865/1903181/75+Le+Calcul+de+vos+cotisations+NSA+2025.pdf
    date: 2026-10-24
  - type: legifrance
    reference: >-
      code de la sécurité sociale, R. 173-3-2, II, dans ses trois rédactions de 2026
      (LEGIARTI000053327958, LEGIARTI000054059837, LEGIARTI000054589934) : « Les durées
      d'assurance mentionnées au premier alinéa du présent II sont arrêtées, pour les
      régimes mentionnés à l'article L. 173-1-2, au dernier jour du trimestre civil
      précédant l'entrée en jouissance de la pension et, pour le régime des personnes non
      salariées des professions agricoles, au 31 décembre de l'année civile de l'entrée en
      jouissance de la pension. » Code rural, R. 731-83 (LEGIARTI000006597265) : les
      cotisations de qui, « après avoir exercé simultanément une activité agricole non
      salariée et une autre activité professionnelle, viennent à cesser la première de ces
      activités », ou prennent une autre activité, « sont calculées au prorata de la
      fraction de l'année considérée comprise entre le 1er janvier et le premier jour du
      mois civil suivant la date de cessation de l'activité agricole non salariée ». Lus
      dans l'index LEGI du dépôt
    date: 2026-10-24
