schema_version: 1
id: retablissement_fonction_publique
intitule: >-
  Le fonctionnaire de l'État, de la CNRACL ou des ouvriers de l'État, le militaire
  et l'agent de la SEITA qui quittent le service sans droit à pension sont rétablis
  au régime général et à l'Ircantec pour toute la période où ils ont relevé de leur
  régime. Sans droit : moins de quinze ans de services pour qui est radié avant
  2011, moins de deux depuis, les trois régimes interpénétrés comptés ensemble ;
  moins de quinze pour le militaire engagé avant le 1er janvier 2014. Le régime
  général porte au compte, chaque année, le dernier traitement soumis à retenue,
  dans la limite du plafond ; l'Ircantec valide les services suivant sa propre réglementation
  ; les primes restent au RAFP. Pour qui a quitté son régime après le 28 janvier
  1950. Le retour dans un régime interpénétré annule le rétablissement.
regimes: [assurances_sociales, cnracl, fonction_publique_etat, fspoeie, igrante, ipacte,
  ircantec, pensions_civiles_1853, regime_general, seita]
etat: transcrite
etape: coordonner_les_affiliations
effet: >-
  Tout agent parti de la fonction publique sans la durée qui ouvre une pension.
  Jusqu'au 24 septembre 2026, le modèle lui servait une pension de son régime au
  prorata de ses années, et laissait le régime général sans elles : un agent hospitalier
  de vingt-deux à trente-cinq ans, parti au privé en 1997 et liquidant en 2026,
  touchait 26 312 € au lieu de 28 718 €, 8,4 % de moins ; dix ans sous l'uniforme,
  1,9 % de moins. Le sens peut s'inverser : la mère de deux enfants passée un an
  par l'État en 1984, qui a déjà sa durée au régime général, touchait une pension
  civile qui ne lui était pas due, 1,0 % de trop. tests/test_retablissement.py,
  et six témoins de parcours rejouent la règle dans les deux moteurs.
presomptions:
  radiation_au_1er_janvier_suivant: >-
    la date à laquelle se lit la durée de services qui ouvre une pension
  validation_ircantec_demandee: >-
    la validation des services à l'Ircantec, faite sur demande pour qui a été radié avant 1990
sources:
  lu_le: 2026-09-24
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Aucun exemple chiffré publié n'a été trouvé. Six approximations. Le militaire
    reçoit au régime général sa dernière solde, et non les salaires forfaitaires
    par catégorie de l'arrêté du 17 décembre 1970 (D. 173-17). L'Ircantec valide
    le traitement de chaque année, hors primes, sans la NBI qu'elle retient. La
    validation de l'Ircantec, faite sur demande pour qui a été radié avant 1990,
    est présumée demandée. Les services d'avant le 1er juillet 1930, que D. 173-16
    exclut, sont rétablis comme les autres. Radiation et premier engagement sont
    datés au 1er janvier, faute du mois. Et un agent parti avant le 29 janvier 1950
    garde la pension au prorata que le modèle lui servait, le droit d'alors n'ayant
    pas été lu. Hors du modèle : les pensions de coordination des autres régimes
    spéciaux (SNCF, RATP, IEG), et la Banque de France, que l'article 9 du décret
    n° 70-1277 nomme ; l'Imprimerie nationale, que D. 173-15 nomme aussi, est un
    régime éteint que le modèle ne calcule pas.
  lectures:
  - type: legifrance
    reference: >-
      L. 65, D. 173-15 à D. 173-17, article 64 du décret n° 2003-1306, article 9
      du décret n° 70-1277 et L. 6, lus dans l'index LEGI : « Cette période entre
      en compte, quel qu'ait été le montant de sa rémunération [...] Ce versement
      est calculé sur la base des derniers émoluments soumis à retenues pour pensions
      au titre du régime spécial de retraites, compte tenu du ou des plafonds »
      (D. 173-16) ; la validation de l'Ircantec « obligatoire et simultanée au rétablissement
      » pour les radiés depuis le 1er janvier 1990, faite « sur demande » avant
      (article 9, II)
    date: 2026-09-24
  - type: jorf
    reference: >-
      loi n° 2014-40, article 42, II, lu dans l'index JORF : les deux ans ne valent
      que pour les « militaires dont le premier engagement a été conclu à compter
      du 1er janvier 2014 »
    date: 2026-09-24
  - type: circulaire_cnav
    reference: >-
      2011/38 du 18 mai 2011, tableau « Rétablissement dans les droits » : « Pour
      les assurés qui, après le 28 janvier 1950, ont quitté leur régime spécial
      sans droit à pension : Salaires reconstitués à partir des cotisations rétroactives
      calculées sur la base des derniers émoluments ou de la dernière solde soumis
      à retenues pour pension au titre du régime spécial de retraites, dans la limite
      du plafond en vigueur » ; pour les militaires, des salaires forfaitaires par
      catégorie (arrêté du 17 décembre 1970)
    date: 2011-05-18
  - type: autre
    reference: >-
      CNRACL, juris-cnracl, « Rétablissement » et ses pages : le versement au régime
      général « calculé sur la base du dernier traitement soumis à retenue au titre
      de la CNRACL, compte tenu du ou des plafonds » ; la validation à l'Ircantec,
      « opéré[e] d'office pour les agents radiés des cadres depuis le 1er janvier
      1990 et sur demande pour ceux qui ont été radiés des cadres antérieurement
      » ; la NBI, exclue du régime général et retenue par l'Ircantec ; l'annulation
      du rétablissement au retour dans un régime interpénétré
    date: 2026-09-24
    url: >-
      https://www.juris-cnracl.retraites.fr/gestion-des-carrieres/retablissement
textes_a_rattacher:
- reference: >-
    L. 65 du code des pensions civiles et militaires, versions de 1964 (LEGIARTI000006362812
    : le régime général seul), de 1991 (LEGIARTI000006362813 : l'Ircantec ajoutée),
    de 1996 (LEGIARTI000006362814) et de 2005 (LEGIARTI000006362815)
- reference: >-
    D. 173-15 (LEGIARTI000006735534), D. 173-16 (LEGIARTI000006735535, LEGIARTI000025766876)
    et D. 173-17 (LEGIARTI000006735536) du code de la sécurité sociale
- reference: >-
    décret n° 2003-1306, article 64 (LEGIARTI000006400936) ; décret n° 70-1277,
    article 9 (LEGIARTI000036754954)
- reference: >-
    L. 6 du code des pensions (LEGIARTI000006362671, LEGIARTI000006362672, LEGIARTI000028498970)
    et loi n° 2014-40, article 42 (JORFARTI000028493863)
code:
  moteur: >-
    `retablir` lit, pour chaque régime rétabli (`REGIMES_RETABLIS` : l'État, pensions
    civiles d'avant 1948 comprises, la CNRACL, le FSPOEIE et la SEITA), le droit de
    l'agent (`droit_a_pension`) : les années que le régime a reçues, les trois régimes
    interpénétrés comptés ensemble, la radiation au 1er janvier qui suit la dernière,
    ou le départ, et la durée qu'elle exige, quinze ans pour qui est radié avant 2011,
    deux depuis, le militaire à son premier engagement
    (`ServicesOuvrantPension.annees`). Sans elle, et radié après le 28 janvier 1950
    (`RETABLISSEMENT_DEPUIS`), chacune de ses années reçoit son dernier traitement,
    hors primes (`revenu_retabli`) : `regimes_de` la route où va le contractuel du
    public, le régime général et l'Ircantec ou ses devancières, les assurances
    sociales du salarié avant 1945 (`STATUTS_DU_RETABLISSEMENT`), et lui garde le
    RAFP ; `assiette_de_reference` porte ce traitement au compte du régime général, et
    `acquerir` valide à l'Ircantec celui de l'année.
  python: >-
    droit/coordonner.py : retablir, _retablir, droit_a_pension, regimes_de,
    REGIMES_RETABLIS, RETABLISSEMENT_DEPUIS, STATUTS_DU_RETABLISSEMENT ;
    scenarios/actuel.py : ServicesOuvrantPension, ServicesOuvrantPension.annees ;
    droit/liquider.py : assiette_de_reference ; droit/acquerir.py : acquerir
  javascript: >-
    moteur/js/droit/coordonner.js : retablir, retablirEnDetail, droitAPension,
    regimesDe, REGIMES_RETABLIS, RETABLISSEMENT_DEPUIS, STATUTS_DU_RETABLISSEMENT ;
    moteur/js/regimes.js : ServicesOuvrantPension, ServicesOuvrantPension.annees ;
    moteur/js/droit/liquider.js : assietteDeReference ; moteur/js/droit/acquerir.js :
    acquerir
  parametres: >-
    legislation/services_ouvrant_pension.csv : fonction_publique_etat, militaires,
    cnracl, fspoeie, seita, radiation_depuis, annees, annees_en_fonctions ;
    legislation/affiliations.yaml : affiliations.contractuel_public.periodes,
    affiliations.salarie_prive_non_cadre.periodes
  tests:
  - tests/test_retablissement.py
  - tests/test_droit.py
  - >-
    tests/test_cumul_activites.py, tests/test_liquidation.py et tests/test_web.py,
    qui confrontent les deux moteurs sur des carrières qui la portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    cinq témoins changent sans lui — enfants_fonctionnaire_un_an_puis_prive,
    metiers_hospitalier_treize_ans_puis_prive,
    metiers_hospitalier_treize_ans_puis_sans_activite,
    metiers_militaire_dix_ans_puis_prive et metiers_militaire_engage_en_2012_quatre_ans
