approximations:
- version: [cotisations_d_avant_2026]
  textes: >-
    décret n° 84-143, article 2, rédaction de 2012 ; règlement de 2026, article 1er
    (JORFARTI000054435915)
  ecart: >-
    Le modèle ne compte pas les points de la CARPIMKO : ni les « 8 points au titre de
    la cotisation forfaitaire » et les « 22 points maximum au titre de la cotisation
    proportionnelle » de 1996 à 2025, ni les points de 1956 à 1995 que le règlement de
    2026 énumère, son régime ne commençant qu'en 1984 ; il sert les cotisations
    revalorisées au rendement. Hors de cette fiche, que la cotisation de 2026 ouvre.
  effet: non mesuré
- version: [decret_2025_1076]
  textes: >-
    décret n° 84-143, article 2, rédaction de 2026 ; décret n° 2025-1076, article 14,
    3°
  ecart: >-
    Le coût d'acquisition du point, que l'article 2 fait fixer « chaque année par
    décret », n'est pas à l'article 14, qui ne donne que le taux et les limites de
    l'assiette ; l'index JORF n'a pas d'autre texte qui le fixe pour 2026. Le modèle ne
    compte pas de points : il sert les cotisations revalorisées au rendement de
    l'année de liquidation, 5,49 % depuis 2026, 21,48 € de service pour 391 €
    d'acquisition, lus sur la calculette de la caisse.
  effet: non mesuré
- version: [decret_2025_1076]
  textes: décret n° 2025-1076, article 14, « Pour l'année 2026 »
  ecart: >-
    Le taux et les limites ne sont fixés que pour 2026 ; le modèle les reconduit aux
    années suivantes, faute du décret de chacune.
  effet: non mesuré
- version: [decret_2025_1076]
  textes: décret n° 84-143, article 2 ; statuts, article 7, rédaction de 2026
