textes_sans_effet:
- id: LEGIARTI000006766332
  article: décret n° 84-143, article 2, rédaction de 1984
  motif: >-
    les cinq classes de cotisation de 1984 à 1996, hors de cette fiche, que la version
    d'avant 2026 laisse aux périodes du régime
reformes: []
effet: >-
  La fiche retranchait un demi-plafond de tout revenu et reconduisait le rendement
  de 2025, 7,36 % : un tiers de points de trop au-dessus d'un demi-plafond, aucun
  en dessous. Le coût du point n'est publié ni au Journal officiel ni sur le site
  : il est lu sur la calculette, d'où l'état. Lue au droit le 5 novembre 2026 (action
  130) : deux versions, avant 2026, laissée aux périodes du régime, et la cotisation
  proportionnelle du décret n° 2025-1076 ; le minimum lu comme le « seuil » de
  l'assiette, que le décret n° 84-143 dit « comprise entre un minimum et un maximum » ;
  le modèle porte le taux et les limites de 2026, et les reconduit.
