    lu_le: 2026-11-05
  - id: LEGIARTI000017870194
    reference: code de la sécurité sociale, D. 351-2-1, du 31 décembre 2007 au 1er avril 2009
    citation: >-
      « Ce montant minimum est majoré au titre des périodes ayant donné lieu à
      cotisations à la charge de l'assuré, de façon à atteindre 7 603,41 euros par an au
      1er janvier 2008 »
    lu_le: 2026-11-05
  - id: LEGIARTI000006749349
    reference: code de la sécurité sociale, R. 351-6, du 27 avril 2007 au 1er janvier 2026
    citation: >-
      « Pour les pensions prenant effet après le 31 décembre 2003, la durée maximum
      d'assurance est fixée à : 150 trimestres pour les assurés nés avant 1944 »
    lu_le: 2026-11-05
  bornes:
    liquidation.date_effet: [2006-11-01, 2010-02-01]
  contenu:
    age: >-
      l'âge légal pour qui a la durée requise tous régimes (I) ; sinon à cet âge avec le
      coefficient de minoration de R. 351-27, ou à soixante-cinq ans (II)
    fraction_d_avant_1998: >-
      le maximum × trimestres d'avant 1998 / durée maximale de R. 351-6 (III), surcote
      comprise (IV) ; au taux plein, une majoration de la fraction de l'écart de la
      génération entre le minimum contributif majoré et le maximum, au prorata des
      trimestres cotisés de 1979 à 1997 (V)
    minimum_majore: >-
      celui de L. 351-10, que le V nomme : sans condition de durée cotisée pour les
      pensions prenant effet jusqu'au 31 mars 2009, à cent vingt trimestres cotisés tous
      régimes depuis (D. 351-2-2), comme la caisse l'écrit
    fraction_depuis_1998: les règles du régime général (L. 382-27)
    revalorisation: >-
      le maximum par les coefficients de L. 161-23-1 (VIII)
  exemples: aucun trouvé
- id: decret_de_2010
  statut: lue
  textes:
  - id: LEGIARTI000021763033
    reference: >-
      décret n° 2006-1325, art. 2, rédaction issue du décret n° 2010-103 du 28 janvier
      2010, pour les pensions prenant effet à compter du 1er février 2010
    citation: >-
      « V bis. - [...] Cette majoration est calculée à partir de l'écart entre, d'une part,
      le maximum de pension [...] et, d'autre part, le montant du minimum de pension, non
      majoré au titre des périodes ayant donné lieu à cotisations à la charge de l'assuré
      [...]. La majoration est attribuée au prorata du nombre de trimestres d'assurance
      accomplis par l'assuré antérieurement au 1er janvier 1979 »
    lu_le: 2026-10-03
  - id: LEGIARTI000023397816
    reference: >-
      la même, rédaction issue du décret n° 2010-1734, pour les pensions prenant effet à
      compter du 1er juillet 2011 : l'âge de L. 161-17-2 au lieu de soixante ans (I)
    citation: >-
      « I. - L'âge fixé au premier alinéa de l'article D. 721-6 du code de la sécurité
      sociale, dans sa rédaction en vigueur au 31 décembre 1997 est celui résultant des
      dispositions de l'article L. 161-17-2 du code de la sécurité sociale pour les
      assurés qui justifient [...] d'une durée au moins égale à la durée fixée au 1° de
      l'article R. 351-27 [...]. II. - Pour les assurés qui ne remplissent pas les
      conditions fixées au I du présent article, la pension de vieillesse mentionnée à
      l'article D. 721-6 [...] peut également être allouée à partir de l'âge mentionné au
      I. Il lui est alors appliqué le coefficient de minoration fixé au 2° du I et au II
      de l'article R. 351-27 » ; « V. - Pour les assurés nés postérieurement au 31
      décembre 1938 et qui soit remplissent les conditions prévues à l'article D. 721-6
      du code de la sécurité sociale, dans sa rédaction en vigueur au 31 décembre 1997,
      soit justifient de la durée d'assurance visée au I du présent article, la pension
      [...] est, lors de sa liquidation, assortie d'une majoration. »
    lu_le: 2026-11-05
  bornes:
    liquidation.date_effet: [2010-02-01, null]
  contenu:
    fraction_d_avant_1998: >-
      celle du décret de 2006, et, au taux plein, une majoration de l'écart entre le
      minimum contributif et le maximum, au prorata des trimestres d'avant 1979 (V bis)
    lecture_de_la_caisse: >-
      « votre pension sera portée au niveau du minimum contributif au prorata notamment de
      votre durée d'assurance « Cavimac » pour cette période » (avant 1979) ; pour 1979 à
      1997, au minimum contributif majoré « si vous totalisez au moins 120 trimestres
      cotisés tous régimes » ; à taux minoré, les deux fractions « seront portées au niveau
      du montant maximum de la pension « Cavimac » et vous aurez de plus une décote »
  exemples: aucun trouvé
approximations:
- version: [regime_forfaitaire, alignement_de_1998]
  ecart: >-
    Les âges abaissés de D. 721-6 — soixante ans pour l'inaptitude et les déportés, de
    soixante à soixante-quatre ans pour les anciens combattants — ne sont pas lus : la
    pension s'ouvre à soixante-cinq ans. Sous huit trimestres d'avant 1998, le modèle ne
    sert rien, et ne rembourse pas les cotisations.
  effet: non mesuré
- version: [alignement_de_1998]
  ecart: >-
    En 2006, L. 382-27 ouvre la fraction d'après 1997 à l'âge légal dès le 20 décembre
    2005, et le décret n° 2006-1325 celle d'avant au 1er novembre : le modèle, qui lit la
    période à l'année et ne liquide pas une fraction sans l'autre, garde soixante-cinq ans
    toute l'année, et pour la fraction d'après 1997 de 1998 à 2005.
  effet: non mesuré
- version: [decret_de_2010]
  ecart: >-
    L'ÂGE DU TAUX PLEIN DE LA FRACTION D'AVANT 1998. Le modèle lui donne celui de la
    pension entière, celui du régime général : la durée requise, ou l'âge d'annulation
    de la décote de la génération ; avant, la fraction est décotée jusqu'à cet âge, sans
    majoration. C'est une lecture de deux pièces d'information de la caisse, qui ne
    disent pas cet âge pour la fraction. Sa page « Demander ma retraite de base » lie la
    décote des fractions d'avant 1979 et de 1979 à 1997 à « une pension calculée à taux
    minoré » (« Si vous bénéficiez d'une pension calculée à taux minoré, les fractions de
    pension avant 1979 et de 1979 à 1997 seront portées au niveau du montant maximum de
    la pension « Cavimac » et vous aurez de plus une décote »), et compte les trimestres
    « entre la date d'effet de la pension et l'âge du taux plein » : un seul âge, qu'elle
    ne chiffre jamais. Son triptyque « Votre assurance retraite » dit : « L'âge
    d'obtention du taux plein dépend de l'année de naissance. L'âge auquel la retraite
    peut être attribuée à taux plein, quel que soit le nombre de trimestres, varie de 65
    à 67 ans », de « la retraite » en général, dans un paragraphe qui ne distingue pas
    les fractions. Ni l'une ni l'autre ne nomme D. 721-6 ni le décret n° 2006-1325 ; la
    page, lue le 5 novembre 2026, cite la loi du 30 décembre 2025 et les montants du 1er
    janvier 2026, le triptyque est de mars 2024 : aucune ne dit comment la caisse
    appliquait la règle en 2018, année du cas ci-dessous. La lettre du décret
    n° 2006-1325, article 2, dit autre chose : le I ne remplace l'âge de D. 721-6 de
    1997, « fixé à soixante-cinq ans », par celui de L. 161-17-2 que pour qui a la durée ;
    le II alloue « également » la pension à l'autre dès cet âge, avec le coefficient de
    minoration de R. 351-27 ; le V majore celle de qui « remplissent les conditions
    prévues à l'article D. 721-6 [...] dans sa rédaction en vigueur au 31 décembre
    1997 ». À soixante-cinq ans, la fraction serait servie sans décote, et majorée. La
    récriture du I en 2011 pèse pour cette lettre, sans la trancher seule : du 30 janvier
    2010 au 1er juillet 2011 (LEGIARTI000021763033, décret n° 2010-103), il disait l'âge
    de D. 721-6 « également abaissé à soixante ans au profit des assurés qui justifient
    [...] d'une durée au moins égale à la durée fixée au 1° de l'article R. 351-27 », et le
    II ouvrait la pension aux autres « à partir de l'âge de soixante ans » ; depuis le 1er
    juillet 2011 (LEGIARTI000023397816, décret n° 2010-1734, article 11), « abaissé à
    soixante ans » est remplacé par l'âge de L. 161-17-2, le II renvoie à « l'âge
    mentionné au I », sans toucher aux soixante-cinq ans de D. 721-6 pour qui n'a pas la
    durée. Le scénario 1 sert la lecture des pièces de la caisse, non la
    lettre ; aucune circulaire, aucun exemple chiffré, aucune notification de la caisse
    ne dit le cas lui-même, et la question reste posée au propriétaire. Les deux lectures
    ne diffèrent que pour qui part entre soixante-cinq ans et l'âge d'annulation de sa
    génération, quand il passe soixante-cinq ans, sans la durée requise ni la mesure des
    parents de trois enfants (fiche taux_plein_a_soixante_cinq_ans).
  effet: >-
    la ministre du culte de 1979 à 1981, puis de 2000 à 2018, née le 15 mars 1953,
    partie à soixante-cinq ans le 1er avril 2018 sans la mesure des parents : avant
    1998, 4 635,65 × 11 / 165 × 0,9375 = 289,73 € par an, comme le modèle le sert, selon
    la lecture des pièces de la caisse ; à la lettre du décret, sans décote et majorée jusqu'au
    minimum, non majoré sous cent vingt trimestres cotisés comme la caisse l'écrit,
    7 615,94 × 11 / 165 = 507,73 €, 218,00 € de plus.
- version: [decret_de_2006, decret_de_2010]
  ecart: >-
    Le minimum contributif majoré des trimestres de 1979 à 1997 suppose, pour les
    pensions prenant effet depuis le 1er avril 2009, cent vingt trimestres cotisés tous
    régimes : la caisse l'écrit (« si vous totalisez au moins 120 trimestres cotisés
    tous régimes, votre pension sera portée au niveau du minimum contributif majoré »),
    et L. 351-10 ne majore son minimum, depuis cette date, qu'à cette durée (D. 351-2-2) ;
    le V nomme « le montant du minimum de pension majoré [...] fixé en application des
    dispositions de l'article L. 351-10 », sans dire lui-même que la condition le suit.
    Jusqu'au 31 mars 2009, L. 351-10 ne pose aucune durée cotisée, ni le modèle depuis
    le 5 novembre 2026. Les deux majorations ne sont pas écrêtées (L. 173-2), faute de
    texte qui le dise. Quand les trimestres d'avant 1998 passent la durée maximale, les
    trimestres cotisés de 1979 à 1997 passent avant ceux d'avant 1979, et les deux
    ensemble ne la dépassent pas : le décret ne dit pas comment se partagent ses deux
    prorata.
  effet: non mesuré
- version: [regime_forfaitaire, alignement_de_1998, decret_de_2006, decret_de_2010]
  ecart: >-
    Le maximum de 1982 est la moyenne géométrique de ceux qui l'encadrent, l'arrêté
    n'étant pas dans l'index ; celui de 1998 à 2025 est revalorisé sans
    l'arrondi de la caisse, à deux centimes par mois près en 2026. Le modèle prend le
    maximum et le minimum contributif de l'année de la date d'effet.
  effet: non mesuré
sources:
