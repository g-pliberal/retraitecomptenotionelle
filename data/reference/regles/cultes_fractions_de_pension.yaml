    lu_le: 2026-10-03
  bornes:
    liquidation.date_effet: [2010-02-01, null]
  contenu:
    fraction_d_avant_1998: >-
      celle du décret de 2006, et, au taux plein, une majoration de l'écart entre le
      minimum contributif et le maximum, au prorata des trimestres d'avant 1979 (V bis)
    lecture_de_la_caisse: >-
      « votre pension sera portée au niveau du minimum contributif au prorata notamment de
      votre durée d'assurance « Cavimac » pour cette période » (avant 1979) ; pour 1979 à
      1997, au minimum contributif majoré « si vous totalisez au moins 120 trimestres
      cotisés tous régimes » ; à taux minoré, les deux fractions « seront portées au niveau
      du montant maximum de la pension « Cavimac » et vous aurez de plus une décote »
  exemples: aucun trouvé
approximations:
- version: [regime_forfaitaire, alignement_de_1998]
  ecart: >-
    Les âges abaissés de D. 721-6 — soixante ans pour l'inaptitude et les déportés, de
    soixante à soixante-quatre ans pour les anciens combattants — ne sont pas lus : la
    pension s'ouvre à soixante-cinq ans. Sous huit trimestres d'avant 1998, le modèle ne
    sert rien, et ne rembourse pas les cotisations.
  effet: non mesuré
- version: [alignement_de_1998]
  ecart: >-
    En 2006, L. 382-27 ouvre la fraction d'après 1997 à l'âge légal dès le 20 décembre
    2005, et le décret n° 2006-1325 celle d'avant au 1er novembre : le modèle, qui lit la
    période à l'année et ne liquide pas une fraction sans l'autre, garde soixante-cinq ans
    toute l'année, et pour la fraction d'après 1997 de 1998 à 2005.
  effet: non mesuré
- version: [decret_de_2006, decret_de_2010]
  ecart: >-
    Le taux plein qui ouvre les majorations est celui du régime général — la durée
    requise, ou l'âge d'annulation de la décote —, que décrit la caisse ; le décret garde
    soixante-cinq ans (D. 721-6 de 1997) pour la fraction d'avant 1998, ce qui ne change
    rien pour les générations nées avant 1951. Le minimum contributif majoré des
    trimestres de 1979 à 1997 suppose cent vingt trimestres cotisés tous régimes, comme
    la caisse l'écrit. Les deux majorations ne sont pas écrêtées (L. 173-2), faute de
    texte qui le dise. Quand les trimestres d'avant 1998 passent la durée maximale, les
    trimestres cotisés de 1979 à 1997 passent avant ceux d'avant 1979, et les deux
    ensemble ne la dépassent pas : le décret ne dit pas comment se partagent ses deux
    prorata.
  effet: non mesuré
- version: [regime_forfaitaire, alignement_de_1998, decret_de_2006, decret_de_2010]
  ecart: >-
    Le maximum de 1982, 1984 et 1986 est la moyenne géométrique de ceux qui l'encadrent,
    les arrêtés n'étant pas dans l'index ; celui de 1998 à 2025 est revalorisé sans
    l'arrondi de la caisse, à deux centimes par mois près en 2026. Le modèle prend le
    maximum et le minimum contributif de l'année de la date d'effet.
  effet: non mesuré
