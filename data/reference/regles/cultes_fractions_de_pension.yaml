    lu_le: 2026-11-05
  - id: LEGIARTI000020090096
    reference: code de la sécurité sociale, D. 351-2-2, du 1er avril 2009 au 1er septembre 2023
    citation: >-
      « La durée d'assurance minimale ayant donné lieu à cotisations à la charge de
