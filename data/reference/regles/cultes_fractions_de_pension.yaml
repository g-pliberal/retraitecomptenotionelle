- id: decret_de_2006
  statut: lue
  textes:
  - id: LEGIARTI000006256155
    reference: >-
      décret n° 2006-1325 du 31 octobre 2006, art. 2, rédaction du 1er novembre 2006 au
      30 janvier 2010
    citation: >-
      « III. - La pension [...] est allouée pour son montant maximum à l'assuré qui
      justifie d'une durée d'assurance [...] au moins égale à la durée maximale fixée à
      l'article R. 351-6 [...] » ; « V. - Pour les assurés nés postérieurement au 31
      décembre 1938 [...] Cette majoration est calculée à partir d'une fraction de l'écart
      entre, d'une part, le maximum de pension [...] et, d'autre part, le montant du
      minimum de pension majoré au titre des périodes ayant donné lieu à cotisations à la
      charge de l'assuré [...] Cette fraction est égale à : a) 20 % de l'écart pour les
      assurés nés en 1939 ; b) 40 % [...] en 1940 ; c) 60 % [...] en 1941 ; d) 80 % [...]
      en 1942 ; e) 100 % de l'écart pour les assurés nés après 1942. La majoration est
      attribuée au prorata du nombre de trimestres cotisés par l'assuré entre le 1er
      janvier 1979 et le 31 décembre 1997 »
    lu_le: 2026-10-03
  - id: LEGIARTI000006742926
    reference: >-
      code de la sécurité sociale, L. 351-10, rédaction du 1er janvier 2004 au 19
      décembre 2008, auquel le V renvoie
    citation: >-
      « Ce montant minimum est majoré au titre des périodes ayant donné lieu à
      cotisations à la charge de l'assuré. »
    lu_le: 2026-11-05
  - id: LEGIARTI000019959492
