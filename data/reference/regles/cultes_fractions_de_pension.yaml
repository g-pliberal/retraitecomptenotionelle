  a_relire:
  - >-
    Les arrêtés du maximum de pension de 1982, 1984 et 1986, à lire sur le fac-similé du
    Journal officiel ; une circulaire de la CAVIMAC sur le décret n° 2006-1325, qui dirait
    l'âge du taux plein de la fraction d'avant 1998, l'écrêtement des majorations et le
    partage de leurs prorata.
  - >-
    Les cotisations de 1979 à 1997 n'étaient pas un taux sur le SMIC mais des montants
    forfaitaires fixés chaque année par arrêté — 2 348 F à la charge de l'assuré en 1980,
    6 210 F en 1990 —, avec une cotisation de solidarité des collectivités (décret
    n° 79-607, art. 24 et 25 ; R. 721-29 et R. 721-30) : le compte notionnel les prend
    aux taux du régime général sur le forfait du SMIC.
code:
  interrupteurs:
    fractions_des_cultes: true
  moteur: >-
    `fractions_des_cultes` : la pension de la CAVIMAC est la somme de deux fractions
    (`droit/cultes.py`). Celle d'après 1997 est celle du régime général, sur le salaire
    annuel moyen des seules années d'après 1997 et leur durée, enfants compris ; elle seule
    porte le minimum contributif. Celle d'avant 1998 est le maximum de l'année au prorata
    des trimestres d'avant 1998 — cent cinquante jusqu'au 31 octobre 2006, la durée de
    R. 351-6 ensuite —, décotée comme l'autre quand le taux n'est pas plein, surcotée et
    majorée jusqu'au minimum contributif quand il l'est.
  python:
  - droit/cultes.py
  - droit/liquider.py, liquider_chaque_regime
  - droit/completer.py, completer (la fraction d'avant 1998 hors du minimum contributif)
  - scenarios/actuel.py, MaximumDesCultes
  - carriere.py, Affiliations.validee_sans_cotisation
  - droit/compter.py, compter ; droit/ouvrir.py, ouvrir
  javascript:
  - droit/cultes.js
  - droit/liquider.js
  - droit/completer.js
  - scenario-actuel.js, MaximumDesCultes
  - regimes.js, Affiliations.valideeSansCotisation
  - droit/compter.js ; droit/ouvrir.js
  parametres:
  - legislation/cultes_maximum_pension.csv
  - regimes/cavimac.yaml (`fractions_des_cultes`, l'âge de soixante-cinq ans jusqu'en
    2006)
  - legislation/affiliations.yaml (ministre_du_culte, membre_congregation)
  tests:
  - tests/test_cultes.py
  - le balayage des deux statuts et les témoins `cultes_*`
effet: >-
  Les ministres des cultes et les membres des congrégations, au scénario 1, partis à
  soixante-quatre ans : + 98 % nés en 1925, + 30 % en 1945, + 5 % en 1955, moins de 1 % en
  1965 ; rien pour qui est au minimum contributif majoré, nés en 1968 ou 1975. Ceux de
  1925 et de 1935 ne sont plus ouverts à cet âge. Les scénarios prospectifs valorisent
  les droits d'avant 1998 à leur part contributive, le maximum : − 11 % pour le ministre
  né en 1965, − 13 % pour le religieux.
