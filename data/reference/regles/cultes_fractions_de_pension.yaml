schema_version: 1
id: cultes_fractions_de_pension
intitule: >-
  La pension du régime des cultes se calcule en deux fractions : celle des périodes
  d'avant le 1er janvier 1998 aux règles du 31 décembre 1997 — le maximum de la pension
  au prorata de la durée, les années d'activité cultuelle d'avant 1979 validées
  gratuitement —, portée depuis le 1er novembre 2006 au minimum contributif au taux plein
  et décotée sinon ; celle des périodes suivantes aux règles du régime général.
domaine: minima
regimes: [cavimac]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- le statut de chaque année — ministre du culte ou membre d'une congrégation — et ses
  trimestres, avant 1979, de 1979 à 1997 et depuis 1998, cotisés ou non
- la génération de l'assuré, la date d'effet de la pension, sa durée d'assurance et ses
  trimestres cotisés tous régimes, le taux plein et la décote du régime
- legislation/cultes_maximum_pension.csv, legislation/revalorisation_pensions.csv,
  legislation/minimum_contributif.csv
- legislation/affiliations.yaml (`services_passes` des périodes d'avant 1979 des deux
  statuts)
ecrit:
- la pension de la CAVIMAC, somme des deux fractions, et le détail de chacune
- la part de cette pension que le minimum contributif peut relever, la seule fraction
  d'après 1997
dates_qui_decident:
- liquidation.date_effet
- periode.debut
- assure.generation
versions:
- id: regime_forfaitaire
  statut: lue
  textes:
  - id: LEGIARTI000006744307
    reference: >-
      code de la sécurité sociale, L. 721-6, rédaction du 21 décembre 1985 au
      23 décembre 1997 (index LEGI du dépôt)
    citation: >-
      « La pension est calculée sur des bases forfaitaires, en fonction de la durée
      d'assurance, dans les limites d'un minimum et d'un maximum fixés par voie
      réglementaire. Un décret fixera le mode de calcul de la pension et les conditions
      dans lesquelles les périodes d'activité antérieures à la création du régime seront
      prises en compte pour le calcul de la pension. »
    lu_le: 2026-10-03
  - id: LEGIARTI000006738455
    reference: code de la sécurité sociale, D. 721-7, rédaction du 21 décembre 1985
    citation: >-
      « Lorsque l'assuré a accompli moins de 150 trimestres d'assurance, mais plus de
      sept, la pension est égale à autant de cent cinquantièmes du montant maximum
      défini ci-dessus qu'il justifie de trimestres d'assurance. Lorsque l'assuré a
      accompli moins de huit trimestres d'assurance, il a droit au remboursement des
      cotisations personnelles qu'il a payées. »
    lu_le: 2026-10-03
  - id: LEGIARTI000006738457
    reference: code de la sécurité sociale, D. 721-8, rédaction du 21 décembre 1985
    citation: >-
      « Le montant annuel du maximum de pension est fixé à 7.500 F au 1er janvier 1979. Ce
      montant est revalorisé chaque année par arrêté »
    lu_le: 2026-10-03
  - id: LEGIARTI000006738898
    reference: code de la sécurité sociale, D. 721-6, rédaction du 21 décembre 1985
    citation: >-
      « L'âge à partir duquel est allouée la pension de vieillesse prévue à la présente
      sous-section est fixé à soixante-cinq ans. »
    lu_le: 2026-10-03
  - id: LEGIARTI000006739120
    reference: code de la sécurité sociale, D. 721-11, rédaction du 13 novembre 1988
    citation: >-
      « sont prises en compte pour l'ouverture du droit et le calcul de la pension, les
      périodes d'exercice d'activités mentionnées à l'article L. 721-1 accomplies
      antérieurement au 1er janvier 1979 en qualité de ministre d'un culte ou de membre
      d'une congrégation ou collectivité religieuse [...] lorsque ces périodes ne sont pas
      validées par un autre régime obligatoire d'assurance vieillesse de base »
    lu_le: 2026-10-03
  - id: LEGIARTI000006766268
    reference: >-
      décret n° 79-607 du 3 juillet 1979, art. 42, du 1er janvier 1979 au 21 décembre
      1985, la même règle dès 1979, qui ne dit pas plus que D. 721-11 « sans
      cotisation »
    citation: >-
      « Sous réserve qu'à la date d'entrée en jouissance de la pension l'assuré soit à
      jour de ses cotisations personnelles, sont prises en compte pour l'ouverture du
      droit et le calcul de la pension, les périodes d'exercice d'activités mentionnées à
      l'article 1er de la loi du 2 janvier 1978 susvisée accomplies antérieurement au 1er
      janvier 1979 en qualité de ministre d'un culte ou de membre d'une congrégation ou
      collectivité religieuse [...] lorsque ces périodes ne sont pas validées par un
      autre régime obligatoire d'assurance vieillesse de base »
    lu_le: 2026-11-05
  - id: LEGIARTI000006766248
    reference: décret n° 79-607 du 3 juillet 1979, art. 24, du 1er janvier 1979 au 21 décembre 1985
    citation: >-
      « Le montant annuel de la cotisation forfaitaire à la charge des assurés [...] est
      fixé chaque année de manière à correspondre à la cotisation d'assurance vieillesse
      qui serait due pour le compte d'un assuré du régime général percevant un salaire lui
      permettant d'acquérir à soixante-cinq ans, pour la durée maximum d'assurance, une
      pension égale à la pension définie à l'article 39 »
    lu_le: 2026-10-14
  - id: LEGIARTI000006766249
    reference: décret n° 79-607 du 3 juillet 1979, art. 25, du 1er janvier 1979 au 21 décembre 1985
    citation: >-
      « La cotisation de solidarité à la charge des associations, congrégations et
      collectivités religieuses [...] est fixée chaque année de manière à assurer
      l'équilibre du régime compte tenu notamment des charges résultant de la prise en
      compte des périodes d'activité antérieures à sa création. Cette cotisation est due
      pour tout assuré non retraité »
    lu_le: 2026-10-14
  - id: LEGIARTI000006752921
    reference: >-
      code de la sécurité sociale, R. 721-29, rédaction du 21 décembre 1985 au 13 novembre
      1988, la règle de l'article 24
    lu_le: 2026-10-14
  bornes:
    liquidation.date_effet: [null, 1998-01-01]
  contenu:
    pension: >-
      le maximum de l'année (D. 721-8 et les arrêtés annuels) × trimestres / 150, borné
      au maximum ; rien sous huit trimestres, que le remboursement des cotisations
      personnelles
    trimestres: >-
      ceux qui ont porté la cotisation forfaitaire depuis 1979, les périodes assimilées,
      et les années d'activité cultuelle d'avant 1979 que ne valide aucun autre régime de
      base (D. 721-9 à D. 721-11)
    age: soixante-cinq ans ; soixante pour l'inaptitude et les déportés (D. 721-6)
    minimum_contributif: aucun, L. 351-10 ne vaut pas pour le régime
    cotisations: >-
      deux montants par assuré non retraité, fixés chaque année par arrêté : le sien, le
      taux total du régime général sur deux fois le maximum, et la solidarité de sa
      collectivité (`legislation/cultes_cotisations_forfaitaires.csv`) ; ils n'ouvrent
      aucun droit au scénario 1, où la pension est forfaitaire, mais font le compte
      notionnel
  exemples: aucun trouvé
- id: alignement_de_1998
  statut: lue
  textes:
  - id: LEGIARTI000006744308
