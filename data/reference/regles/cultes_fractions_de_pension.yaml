schema_version: 1
id: cultes_fractions_de_pension
intitule: >-
  La pension du régime des cultes se calcule en deux fractions : celle des périodes
  d'avant le 1er janvier 1998 aux règles du 31 décembre 1997 — le maximum de la pension
  au prorata de la durée, les années d'activité cultuelle d'avant 1979 validées
  gratuitement —, portée depuis le 1er novembre 2006 au minimum contributif au taux plein
  et décotée sinon ; celle des périodes suivantes aux règles du régime général.
domaine: minima
regimes: [cavimac]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- le statut de chaque année — ministre du culte ou membre d'une congrégation — et ses
  trimestres, avant 1979, de 1979 à 1997 et depuis 1998, cotisés ou non
- la génération de l'assuré, la date d'effet de la pension, sa durée d'assurance et ses
  trimestres cotisés tous régimes, le taux plein et la décote du régime
- legislation/cultes_maximum_pension.csv, legislation/revalorisation_pensions.csv,
  legislation/minimum_contributif.csv
- legislation/affiliations.yaml (`services_passes` des périodes d'avant 1979 des deux
  statuts)
ecrit:
- la pension de la CAVIMAC, somme des deux fractions, et le détail de chacune
- la part de cette pension que le minimum contributif peut relever, la seule fraction
  d'après 1997
dates_qui_decident:
- liquidation.date_effet
- periode.debut
- assure.generation
versions:
- id: regime_forfaitaire
