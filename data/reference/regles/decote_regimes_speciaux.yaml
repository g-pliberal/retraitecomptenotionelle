    (LEGIARTI000019108313), où naissent le taux, le plafond et l'âge de référence, et en
    vigueur depuis le 7 août 2026 (LEGIARTI000054622824)
- id: LEGIARTI000045021319
  reference: décret n° 2008-639, article 13, rédaction du 2 janvier 2022
  change: >-
    les exemptions seules : pas de minoration des pensions liquidées « en application des
    articles 2, 2 bis, 4 et 5 »
- id: LEGIARTI000048240205
  reference: décret n° 2008-639, article 13, rédaction du 22 octobre 2023
  change: >-
    l'âge de référence que diminue l'article 35 est « fixé à cinquante-sept ans » ou à
    soixante-deux ans (voir `age_reference_decote_sncf_ratp`)
- reference: >-
