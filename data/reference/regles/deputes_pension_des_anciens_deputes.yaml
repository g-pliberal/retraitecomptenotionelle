reformes: [deputes_2018]
code:
  moteur: >-
    une fiche de régime en annuités, dont l'âge se lit à la génération (`age_table:
    assemblee_nationale`) et la durée au mois de l'âge d'ouverture
    (`duree_requise_calendrier: assemblee_nationale`)
  python: >-
    donnees/regimes.py : CatalogueRegimes ; droit/liquider.py : liquider_chaque_regime
  javascript: >-
    moteur/js/regimes.js : CatalogueRegimes ; moteur/js/droit/liquider.js :
    liquiderChaqueRegime
  parametres: >-
    regimes/assemblees_parlementaires.yaml : taux_plein, duree_requise_trimestres,
    taux_cotisation_retraite, part_salariale ; legislation/ages_regimes.csv,
    legislation/duree_requise_calendriers.csv
  tests: >-
    tests/temoins/simulations.json, les carrières du statut parlementaire, que le
    portage rejoue
historique:
- >-
  2026-10-14 — écrite à l'étape 2 de l'action 145 : la caisse des députés n'avait que la
  fiche générique de liquidation. Le règlement, lu en entier, est publié au Journal
  officiel, en 2018 puis par ses arrêtés modificatifs de 2023 et 2026 ; il écrit la
  subvention de l'Assemblée, le double de la retenue, que la fiche de régime disait non
  écrite. Aucun chiffre ne change.
effet: >-
  Les anciens députés et, par assimilation, les anciens sénateurs : leur pension est
  simulée au droit lu ; leur cotisation est sous-estimée des deux tiers, la part de
  l'Assemblée n'étant pas portée.
