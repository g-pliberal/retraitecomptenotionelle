approximations:
- version: [valeurs_de_2008, valeurs_a_l_age_d_ouverture, valeurs_a_soixante_quatre_ans]
  ecart: >-
    La fiche de régime dit la part de l'Assemblée non écrite et ne porte que la retenue
    (part salariale 1) ; le règlement l'écrit : « la subvention inscrite dans la
    Dotation égale au double des retenues » (article 2, 4°, publié au Journal officiel du
    4 janvier 2018). La cotisation totale est trois fois la retenue, le tiers à la charge
    du député.
  effet: >-
    sur la cotisation et le compte notionnel des députés, non sur leur pension : un
    effort contributif triple de celui simulé, 32,55 % des sommes soumises à retenue
    depuis 2020 au lieu de 10,85 %
- version: [valeurs_de_2008, valeurs_a_l_age_d_ouverture, valeurs_a_soixante_quatre_ans]
  ecart: >-
    Ni la bonification de deux trimestres par enfant né pendant le mandat d'une femme
    députée, ni la majoration d'annuités pour un enfant invalide, ni l'arrondi au
    trimestre supérieur de toute fraction de trimestre, ni le plafond de la pension
    majorée à l'indemnité, ni la retenue sur l'allocation de retour à l'emploi depuis
    2022 ne sont portés ; les sénateurs suivent la même fiche faute d'un règlement
    publié.
  effet: non mesuré ; quelques trimestres pour les députées mères pendant leur mandat
sources:
  lu_le: 2026-10-14
  prochaine_relecture: 2027-10-14
  a_relire:
  - >-
    Lire les règlements d'avant 2010 — la double cotisation facultative des quinze
    premières années, le système complémentaire supprimé en 2018 — dans les Journaux
    officiels qui les ont publiés, s'ils l'ont été, et l'arrêté des Questeurs qui fixe
    l'âge des générations 1951 à 1968.
  - >-
    Lire le règlement de la Caisse des retraites et de sécurité sociale du personnel de
    l'Assemblée nationale (articles 10, 11, 28, 31 et 38 cités par les arrêtés du Bureau
    n° 35/XVI et 50/XVII, JORFARTI000047879565 et JORFARTI000054113947), que le dépôt ne
    tient pas, et chercher ceux du Sénat, dont le Journal officiel ne publie que l'ordre
    du jour du Bureau (4 juillet 2023, 15 octobre 2024).
  lectures:
  - type: autre
