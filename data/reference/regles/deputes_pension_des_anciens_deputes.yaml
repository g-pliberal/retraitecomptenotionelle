schema_version: 1
id: deputes_pension_des_anciens_deputes
intitule: >-
  L'ancien député reçoit de la caisse de pensions de l'Assemblée nationale, à l'âge
  d'ouverture de sa génération — soixante ans avant juillet 1951, soixante-quatre ans
  depuis la génération 1969 —, une pension égale, par annuité de mandat, à un
  pourcentage des sommes soumises à retenue (l'indemnité parlementaire, de résidence et
  de fonction), de 2,11 % pour quarante annuités au plus jusqu'à la génération 1948, à
  1,9628 % pour quarante-trois annuités après 2028, sans décote ni surcote, majorée de
  10 % pour trois enfants ; la caisse est financée par une retenue sur l'indemnité et
  une subvention de l'Assemblée égale au double de cette retenue.
domaine: duree
regimes: [assemblees_parlementaires]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- les mandats de député, au trimestre, et les périodes d'allocation d'aide au retour à l'emploi différentielle depuis le 1er juillet 2022
- les sommes soumises à retenue de chaque période
- la date de naissance, qui fait l'âge et l'année de la valeur de l'annuité
- les enfants nés ou adoptés pendant le mandat, les enfants élevés, le conjoint et les orphelins
- les mandats détenus dans une autre assemblée, au Parlement européen ou au Gouvernement
ecrit:
- la pension de l'ancien député, sa majoration pour enfants, sa réversion et les pensions d'orphelin
dates_qui_decident:
- assure.generation
# La valeur de l'annuité et le nombre maximal d'annuités se lisent à l'âge d'ouverture
# (générations 1949 à 1968), au soixante-quatrième anniversaire (1969 et après), ou
# sont ceux de 2008 (1948 et avant) : article 21 ter. La fiche de régime les porte par
# le calendrier `assemblee_nationale` (duree_requise_calendriers.csv), lu au mois de
# l'âge d'ouverture, et l'âge par la table de ages_regimes.csv.
versions:
- id: valeurs_de_2008
  statut: lue
  textes:
  - {id: JORFARTI000036376107, reference: "arrêté du Bureau de l'Assemblée nationale n° 11/XV du 8 novembre 2017, article 28 : publication du règlement de la Caisse de pensions des députés et des anciens députés consolidé au 1er janvier 2018", publie_le: 2018-01-04}
  - {id: JORFARTI000036376118, reference: "règlement de la Caisse de pensions des députés et des anciens députés, articles 1er et 2", publie_le: 2018-01-04}
  - {id: JORFARTI000036376120, reference: "règlement de la Caisse de pensions des députés et des anciens députés, article 5", publie_le: 2018-01-04}
  - reference: >-
      règlement de la Caisse de pensions des députés et des anciens députés, à jour des
      arrêtés du Bureau de 2023 et de 2026, articles 1er à 56 et arrêté des Questeurs
      n° 15-043 du 14 avril 2015 (site de l'Assemblée nationale)
    en_vigueur: 2026-05-13
    lu_le: 2026-10-14
    empreinte: sha256:24189bde10a5714b18aa29b437a33142eb6fc01a891c7070980d8487c268491b
  nee_de: JORFARTI000036376107
  bornes:
    assure.generation: [null, 1949-01-01]
  contenu:
    caisse: >-
      « La Caisse instituée par la Résolution du 23 décembre 1904 a pour objet le
      versement de pensions aux anciens députés et à leurs ayants cause » ; « Son
      équilibre financier est assuré dans les conditions fixées par la loi validée du 3
      octobre 1941 » (article 1er) ; ses ressources sont les retenues, le portefeuille,
      les dons et legs et « la subvention inscrite dans la Dotation égale au double des
      retenues opérées sur les indemnités des députés », puis, s'il le faut, les sommes
      nécessaires inscrites au budget de la dotation (article 2)
    retenue: >-
      « une retenue obligatoire sur l'indemnité parlementaire augmentée de l'indemnité de
      résidence et de l'indemnité de fonction » ; le député s'engage à ne pas cotiser à
      un autre régime sans y exercer d'activité ; depuis le 1er juillet 2022, une retenue
      sur l'allocation d'aide au retour à l'emploi différentielle, cinquante jours
      d'allocation valant un trimestre, quatre par an au plus (article 5) ; 9,34 % au 1er
      juin 2015, 9,69 % en 2016, 10,04 % en 2017, 10,31 % en 2018, 10,58 % en 2019 et
      10,85 % depuis 2020 (arrêté des Questeurs n° 15-043)
    calcul: >-
      « Le montant de la pension est égal, pour chaque annuité, à un pourcentage des
      sommes soumises à retenue » (article 21, 1) ; « les anciens députés ayant atteint
      leur soixantième anniversaire avant le 1er janvier 2008 sont soumis aux mêmes
      modalités de liquidation de la pension que les anciens députés ayant atteint cet
      âge au cours de l'année 2008 » (article 21 ter, 2) : « jusqu'en 2008 : 2,1100 % —
      40 annuités », 84,4 % des sommes soumises à retenue au plus ; « toute fraction de
      trimestre de cotisation est comptée pour trois mois » (article 21, 3) ; aucune
      décote ni surcote n'est écrite
    ouverture: >-
      soixante ans, l'âge de la fonction publique pour ces générations (article 8, 2,
      arrêté des Questeurs non publié) ; les pensions sont liquidées « selon les règles
      en vigueur à la date de départ de jouissance de la pension » (article 48 bis)
    enfants: >-
      bonification de deux trimestres par enfant né ou adopté pendant le mandat, pour les
      femmes députées ; trois mois d'annuité par période de trente mois d'éducation d'un
      enfant invalide à 80 %, une annuité au plus (article 21, 4 et 5) ; majoration de 10
      % pour trois enfants élevés neuf ans, 5 % par enfant au-delà (article 25), le tout
      plafonné à l'indemnité d'un député en activité (article 37)
    reversion: >-
      50 % de la pension servie ou à laquelle le député pouvait prétendre (article 22),
      sans condition d'âge ni de ressources, si le mariage précède d'un an le départ ou
      de quatre ans le décès, ou si un enfant en est issu (article 14), partagée par lits
      entre conjoints et orphelins (article 17) ; orphelins jusqu'à vingt et un ans, 10 %
      chacun, la somme ne dépassant pas la pension (articles 16 et 23)
    service: >-
      les pensions suivent « les variations que peuvent subir les pensions du personnel
      retraité de l'État » (article 54) et se paient par mois échu (article 43)
    coordination: >-
      la pension est suspendue pendant un nouveau mandat de député, au Parlement
      européen ou au Gouvernement ; plusieurs pensions des assemblées se cumulent dans
      la limite du maximum d'annuités de l'article 21 ; avec l'indemnité d'une autre
      assemblée, dans la limite de l'indemnité de député (articles 50, 51 et 53)
  exemples: aucun trouvé
