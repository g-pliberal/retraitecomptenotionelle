schema_version: 1
id: points_agricoles_au_revenu_cadastral
intitule: >-
  Retraite proportionnelle des non-salariés agricoles, années 1981 à 1989 : le chef
  d'exploitation acquiert chaque année 15, 30, 45 ou 60 points selon le revenu cadastral
  servant de base à ses cotisations — au plus 1 180 F, de 1 180 F à 5 571 F, de 5 571 F à
  9 830 F, au-delà.
domaine: points
regimes: [msa_non_salaries]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- >-
  l'année de la cotisation, qui dit si le barème du décret n° 80-808 vaut
- >-
  le revenu de l'année du chef d'exploitation, dont le moteur déduit le revenu cadastral
  par convention, faute de le connaître
ecrit:
- >-
  les points de retraite proportionnelle de l'année, que le scénario 1 porte au compte du
  chef à la place du rendement de sa cotisation (`acquerir`)
dates_qui_decident:
- revenu.annee
