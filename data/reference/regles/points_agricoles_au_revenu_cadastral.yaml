effet: >-
  Jusqu'au 20 novembre 2026, le moteur ne donnait aucun point aux années d'avant 1990 :
  il les servait par le rendement de leurs cotisations, 6 % de 8,5 % du revenu. Depuis,
  les années 1981 à 1989 ont les points du barème du décret n° 80-808, que R. 732-69
  reprend. Le simulateur n'a pas le revenu cadastral : il le déduit du revenu de l'année,
  à 5,54 F de revenu professionnel pour 1 F de revenu cadastral, et c'est une
  CONVENTION, que le propriétaire a retenue le 20 novembre 2026 — le texte qui porte ce
  rapport l'écrit pour une autre cotisation, et pour 1992. En euros, les seuils de revenu
  sont 997 €, 4 705 € et 8 302 € par an. Les points sont portés à seize pour une pension
  de 1994 à 2025 (R. 732-73, qui vise R. 732-69). Les années d'avant 1981 restent au
  rendement : leurs décrets ne sont pas lus. Tenu par
  tests/test_points_agricoles_de_1981.py et tests/js/points-agricoles-de-1981.test.js.
sources:
  lu_le: 2026-11-20
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Le revenu cadastral se déduit du revenu par une convention. Un champ de saisie
    facultatif, où l'assuré porterait les points de son relevé, qui primeraient, reste à
    écrire (zone du site).
  - >-
    Les seuils sont en francs courants et aucune rédaction ne les relève de 1981 à 1989,
    alors que les décrets annuels de financement relèvent les tranches de la cotisation
    du a de l'article 1123. Aucun décret annuel lu à l'index ne renvoie au barème de
    1980 pour l'adapter ; la pratique de la caisse sur ce point n'est pas vérifiée, et
    aucun exemple chiffré publié n'a été trouvé.
  - >-
    Les années d'avant 1981 : l'article 8 renvoie aux « décrets du 30 avril 1965, du 21
    janvier 1967, du 26 juin 1968, du 15 mai 1974 et du 10 février 1975 », dont l'index
    de la DILA n'a que des notices. À lire au fac-similé du Journal officiel avant
    d'écrire leurs barèmes.
  - >-
    Le barème vise les cotisations « du 1°, b, de l'article 1123 », celles du chef
    d'exploitation : le moteur ne le sert qu'à la ligne d'exploitant. Le conjoint et
    l'aide familial de ces années, que le modèle ne distingue pas avant 2004, restent au
    rendement des cotisations de leur revenu saisi, alors que le conjoint participant aux
    travaux n'avait que la retraite forfaitaire (fiche retraite_proportionnelle_msa).
  - >-
    La valeur du point de 1981 à 1989, en francs, n'est pas lue : une pension prise dans
    ces années sert ses points à la valeur de la fiche du régime, 4,589 € de 2025
    ramenés aux prix de l'année.
  lectures:
  - type: legifrance
    reference: >-
      décret n° 80-808 du 14 octobre 1980, article 8 (LEGIARTI000006769209, du 1er
      janvier 1981 au 21 septembre 1990) : « Pour le calcul de la retraite
      proportionnelle, le nombre de points acquis chaque année par les intéressés en
      fonction des cotisations versées en application du 1°, b, de l'article 1123 du Code
      rural est déterminé suivant le barème annexé au présent décret. Pour les années
      antérieures à l'entrée en vigueur du présent décret, le nombre de points résulte
      des dispositions des décrets du 30 avril 1965, du 21 janvier 1967, du 26 juin 1968,
      du 15 mai 1974 et du 10 février 1975 susvisés. » Annexe (LEGIARTI000006769235, du
      1er janvier 1981 au 22 avril 2005) : « REVENU CADASTRAL servant de base aux
      cotisations [...] Au plus égal à 1180 F : 15 [...] De 1180 F à 5571 F : 30 [...] De
      5571 F à 9830 F : 45 [...] Supérieur à 9830 F : 60 ». Lu dans l'index LEGI du dépôt
    date: 2026-11-20
  - type: legifrance
    reference: >-
      code rural et de la pêche maritime, R. 732-69 (LEGIARTI000006597478, du 22 avril
      2005 au 28 octobre 2017 ; LEGIARTI000035918355, du 28 octobre 2017 au 1er janvier
      2026) : le même barème, « pour les années 1981 et suivantes » ; cité mot pour mot à
      la fiche retraite_proportionnelle_msa. Lu dans l'index LEGI du dépôt
    date: 2026-11-20
  - type: legifrance
    reference: >-
      décret n° 92-793 du 14 août 1992, article 20 (LEGIARTI000006776481) : « Le taux de
      la cotisation prévue au VI de l'article 1003-7-1 du code rural est égal à 14 p. 100
      des revenus professionnels ou d'une assiette forfaitaire constituée sur la base de
      5,54 F de revenu professionnel pour 1 F de revenu cadastral. » Lu dans l'index LEGI
      du dépôt
    date: 2026-11-20
textes_sans_effet:
- id: LEGIARTI000053337682
  motif: >-
    R. 732-69 dans sa rédaction du 1er janvier 2026 (décret n° 2025-1409) : le numéro
    porte un autre article, sur l'inaptitude au travail — « Le troisième alinéa de
    l'article R. 351-34 du code de la sécurité sociale n'est pas applicable aux demandes
    de liquidation des pensions du régime des non-salariés des professions agricoles.
    Pour l'application de l'article R. 351-37 du code de la sécurité sociale [...] » —,
    sans rapport avec les points. Le barème au revenu cadastral reste celui des points
    d'avant 2016, que R. 732-66 prend « en application des articles R. 732-69 à R.
    732-77 [...] dans leur rédaction antérieure au décret n° 2025-1409 »
code:
  interrupteurs:
    bareme_points: msa_revenu_cadastral
  moteur: >-
    `bareme_points: msa_revenu_cadastral` : de 1981 à 1989, 15, 30, 45 ou 60 points par
    an selon le revenu cadastral (décret n° 80-808, annexe), que le moteur déduit du
    revenu de l'année à 5,54 F de revenu pour 1 F cadastral ; seize points au moins pour
    une pension de 1994 à 2025 (R. 732-73).
  javascript: >-
    moteur/js/droit/acquerir.js : acquerir, pointsAuRevenuCadastral,
    revenuCadastralDeduit, FICHE_DES_POINTS_AU_REVENU_CADASTRAL, pointsMsaRetenus
  parametres: >-
    contenu.parametres de chaque version : existe, seuils_en_francs, points,
    revenu_professionnel_pour_un_franc_cadastral ; regimes/msa_non_salaries.yaml :
    bareme_points, valeur_point_euros, valeur_point_annee
  tests: [tests/test_points_agricoles_de_1981.py, tests/js/points-agricoles-de-1981.test.js]
