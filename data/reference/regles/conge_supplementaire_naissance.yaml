schema_version: 1
id: conge_supplementaire_naissance
intitule: >-
  Le congé supplémentaire de naissance, créé par la loi de financement pour 2026, est une
  période assimilée du régime général depuis le 1er juillet 2026 : un trimestre par
  période, continue ou non, de cinquante-huit jours indemnisés.
domaine: periodes_assimilees
regimes: [regime_general]
etape: compter_les_durees
face: droit
etat: approchee
lit:
- les jours de congé supplémentaire de naissance indemnisés de l'assuré, année par année
ecrit:
- >-
  les trimestres assimilés de chaque année, sans salaire porté au compte, quatre au plus
  par an tous motifs confondus
dates_qui_decident:
- periode.debut
versions:
- id: avant_le_conge
  statut: supposee
  hypothese: >-
    avant le c de R. 351-12, aucun congé supplémentaire de naissance n'est décompté ; le
    congé lui-même naît de la loi n° 2025-1403
  fiabilite: moyenne, les congés indemnisés du premier semestre 2026 restent à lire
  bornes:
    periode.debut: [null, 2026-07-01]
  contenu:
    droit: aucun trimestre à ce titre
    parametres:
      existe: false
      fiabilite: moyenne
  exemples: aucun trouvé
- id: cinquante_huit_jours
  statut: lue
  textes:
  - id: LEGIARTI000053279221
    reference: >-
      CSS, article L. 351-3, 1°, rédaction de la loi n° 2025-1403 du 30 décembre 2025 :
      les périodes « pendant lesquelles l'assuré a bénéficié des prestations maladie,
      maternité, invalidité, accident du travail ou du congé supplémentaire de naissance »
    en_vigueur: 2025-12-31
    lu_le: 2026-10-16
  - id: LEGIARTI000053270151
    reference: CSS, article L. 331-8-1, le congé supplémentaire de naissance
    en_vigueur: 2025-12-31
    lu_le: 2026-10-16
  - id: LEGIARTI000054167657
    reference: >-
      CSS, article R. 351-12, 2°, c, rédaction du décret n° 2026-425 du 30 mars 2026
    citation: >-
      « c) Un trimestre est également décompté pour chaque période, continue ou non, durant
      laquelle l'assuré a bénéficié de cinquante-huit jours d'indemnisation au titre du
      congé supplémentaire de naissance mentionné à l'article L. 331-8-1 »
    en_vigueur: 2026-07-01
    lu_le: 2026-10-16
  nee_de: LEGIARTI000054167657
  bornes:
    periode.debut: [2026-07-01, null]
  contenu:
    droit: un trimestre assimilé par cinquante-huit jours indemnisés, continus ou non
    a_dire: >-
      les bornes suivent l'entrée en vigueur du c (1er juillet 2026) ; un congé indemnisé
      entre le 1er janvier et le 30 juin 2026, que L. 351-3 vise déjà, reste à lire dans le
      décret n° 2026-425 et dans la circulaire de la Cnav qui l'appliquera
    parametres:
      existe: true
      regimes: [regime_general]
      decompte: jours_dans_l_annee
      jours_par_trimestre: 58
      motifs: [conge_supplementaire_de_naissance]
      fiabilite: haute
  exemples: aucun trouvé
presomptions:
  pas_de_periode_assimilee: >-
    les jours de congé supplémentaire de naissance indemnisés, que l'assuré déclare
sources:
  lu_le: 2026-10-16
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Lire le décret n° 2026-425 du 30 mars 2026, article 5, pour les congés pris avant le
    1er juillet 2026, et la circulaire de la Cnav qui applique le c, quand elle paraît ;
    lire L. 331-8-1 pour la durée du congé et la date des naissances qu'il vise.
  lectures:
  - type: legifrance
    reference: >-
      CSS, L. 351-3, rédactions du 31 décembre 2025 et du 1er novembre 2026 ; R. 351-12,
      rédactions du 1er janvier, du 1er juillet et du 1er novembre 2026 ; L. 331-8-1 ;
      dans l'index LEGI à jour du 15 octobre 2026
    date: 2026-10-16
approximations:
- ecart: >-
    les jours se comptent dans l'année civile, sans report, comme les autres périodes
    assimilées du 2° de R. 351-12 : le c ne le dit pas, et la circulaire de la Cnav
    qui l'appliquera n'a pas paru
  effet: >-
    un trimestre au plus, pour un congé à cheval sur deux années ; non mesuré
- ecart: >-
    le congé indemnisé du premier semestre 2026 ne compte pas : la version d'avant le
    c n'ouvre rien, en attendant la lecture du décret n° 2026-425
  effet: >-
    un trimestre au plus, pour les congés de janvier à juin 2026
code:
  python: >-
    droit/compter.py : trimestres_assimiles, trimestres_des_periodes, jours_par_annee, version_ouverte ;
    compter (Durees.assimilees, Durees.plafonds_assimilees) ; scenarios/actuel.py :
    FichesDatees.version_aux_dates
  javascript: >-
    moteur/js/droit/compter.js, les jumeaux de chacune ; moteur/js/regimes.js :
    FichesDatees.versionAuxDates
  parametres: >-
    contenu.parametres de chaque version : existe, decompte, regimes, jours_par_trimestre, motifs, fiabilite
  tests: >-
    tests/test_periodes_assimilees.py, dans les deux moteurs
historique:
- >-
  2026-10-16 — née avec l'étape 1 du sixième domaine (action 130) : le congé
  supplémentaire de naissance, que la frontière contributive portait, lu à la source.
- >-
  2026-10-16 — modélisée, approchée, à l'étape 3 du sixième domaine : l'étape « compter
  les durées » compte les jours de congé indemnisés, cinquante-huit par trimestre, année par année, dans les deux moteurs ; aucune saisie ne les déclare
  encore (étape 5).
effet: >-
  Les parents qui prennent le congé supplémentaire de naissance depuis le 1er juillet
  2026 : un trimestre par cinquante-huit jours, que le modèle compte sans saisie
  qui les déclare encore ; pour une
  carrière de salarié à temps plein, l'année est déjà validée par les salaires, et
  l'effet ne joue que pour les carrières incomplètes.
