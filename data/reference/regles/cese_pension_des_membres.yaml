code:
  interrupteurs:
    annuites_au_taux_de_leur_annee: true
  moteur: >-
    `annuites_au_taux_de_leur_annee` : sur les périodes de la caisse du CESE, les
    trimestres de chaque période pèsent la durée de la liquidation sur la durée requise
    de leur période (`annuites_au_taux_de_leur_annee`, dans droit/liquider.py et
    droit/liquider.js) : une annuité de 2000 liquidée en 2030 vaut 165/142 trimestres,
    soit 2,11 % de l'assiette au lieu de 1,82 %, et le maximum de trois quarts borne la
    somme. Ses données : des périodes en annuités par année civile, au taux plein de 75
    % atteint en 142 à 165 trimestres, la retenue de 3,42 fois L. 61 divisée par 2,06 ;
    liquider_chaque_regime prend la période de l'année de liquidation,
    annuites_au_taux_de_leur_annee compte chaque année au taux de la sienne ; le statut
    membre_cese route les membres entrés depuis le 1er septembre 2023 au régime général
    et à l'Ircantec.
  python: >-
    donnees/regimes.py : CatalogueRegimes ; droit/liquider.py : liquider_chaque_regime,
    annuites_au_taux_de_leur_annee
  javascript: >-
    moteur/js/regimes.js : CatalogueRegimes ; moteur/js/droit/liquider.js :
    liquiderChaqueRegime, annuitesAuTauxDeLeurAnnee
  parametres: >-
    regimes/cese_membres.yaml : taux_plein, duree_requise_trimestres,
    taux_cotisation_retraite ; legislation/affiliations.yaml : affiliations.membre_cese
  tests: >-
    tests/temoins/simulations.json, les carrières du statut membre_cese, que le portage
    rejoue
historique:
- >-
  2026-10-13 — écrite à l'étape 2 de l'action 145 : la caisse du Conseil n'avait que la
  fiche générique de liquidation et celle de sa fermeture. Le règlement lu en entier
  ajoute ce que la fiche de régime ne porte pas — l'allocation viagère et sa réduction
  de 2015, la réversion et son plafond, la coordination entre assemblées — et montre
  que le modèle compte toutes les annuités au pourcentage de l'année de liquidation.
  Aucun chiffre ne change.
- >-
  2026-10-14 — action 121 : le moteur compte chaque annuité au pourcentage de la période
  de son année (interrupteur `annuites_au_taux_de_leur_annee`, Python et JavaScript),
  et non plus à celui de l'année de liquidation ; restent les coupures à l'année civile
  et l'allocation viagère des mandats courts.
effet: >-
  Les anciens membres du CESE désignés avant le 1er septembre 2023 : leurs annuités
  d'avant 2014 se liquident désormais à leur pourcentage, aux coupures de l'année
  civile près ; le modèle compte encore double l'allocation des mandats courts d'après
  2015.
