approximations:
- version: [deux_onze_pour_cent, deux_zero_deux_pour_cent, octobre_2010_sans_taux_ecrit,
    un_quatre_vingt_quinze_pour_cent, un_quatre_vingt_dix_pour_cent,
    un_quatre_vingt_cinq_pour_cent]
  ecart: >-
    Chaque annuité se liquide au pourcentage de la période de la fiche de régime qui
    couvre son année (`annuites_au_taux_de_leur_annee`), mais ces périodes sont des
    années civiles — 1957-2004, 2005-2010, 2011, 2012, 2013, puis 2014 et suivantes —,
    quand le règlement coupe au 1er septembre 2004 et au 28 octobre de 2010 à 2013 :
    septembre à décembre 2004 se comptent à 2,11 % au lieu de 2,02 %, les deux
    derniers mois de 2010 à 2,02 % au lieu de 1,95 %, et ceux de 2011 à 2013 au
    pourcentage de l'année au lieu du suivant. Le pourcentage se lit par la durée
    requise de la période, en trimestres entiers, 75 % sur 142, 149, 154, 158, 162 et
    165 trimestres : 2,113 % au lieu de 2,11 %, 2,013 au lieu de 2,02, 1,948 au lieu
    de 1,95, 1,899 au lieu de 1,90, 1,852 au lieu de 1,85, 1,818 au lieu de 1,82.
  effet: >-
    non mesuré par une simulation ; quatre mois de 2004 et deux mois de chacune des
    années 2010 à 2013 au pourcentage d'à côté, de 0,05 à 0,09 point par annuité ; le
    pourcentage lu par la durée s'écarte du règlement de 0,4 % au plus (2,013 / 2,02)
- version: [deux_onze_pour_cent, allocation_viagere_reduite_de_moitie]
  ecart: >-
    La fiche de régime ne porte ni la condition de cinq années de mandat ni
    l'allocation viagère : moins de cinq ans de mandat donnent la pension normale au
    prorata, que le règlement sert aussi, mais réduite de moitié pour les mandats
    effectués depuis le 16 novembre 2015.
  effet: >-
    non mesuré ; les membres de moins de cinq ans de mandat depuis 2015, dont
    l'allocation est comptée double
- version: deux_onze_pour_cent
  ecart: >-
    Le revenu saisi tient lieu d'assiette de référence — 2,06 fois la rémunération —, et
    la retenue de 3,42 fois L. 61, assise sur la rémunération, est divisée par 2,06 :
    une écriture équivalente, tant que le revenu saisi est bien l'assiette. Le Conseil
    ne paie aucune part écrite, et la fiche de régime n'en porte pas.
  effet: aucun sur la pension ; la cotisation que le compte notionnel reprend est la seule retenue
