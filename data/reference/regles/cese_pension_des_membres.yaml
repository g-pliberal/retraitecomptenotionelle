schema_version: 1
id: cese_pension_des_membres
intitule: >-
  L'ancien membre du Conseil économique, social et environnemental désigné avant le 1er
  septembre 2023, qui a cinq ans de mandat, l'âge légal et sa pension principale
  liquidée, reçoit de la caisse de retraites du Conseil une pension égale, par annuité
  de versement, à un pourcentage de 2,06 fois sa rémunération de membre — 2,11 % pour
  les mandats jusqu'au 31 août 2004, puis 2,02 %, 1,95 %, 1,90 %, 1,85 % et 1,82 %
  depuis le 28 octobre 2013 —, sans dépasser les trois quarts de cette assiette ;
  moins de cinq ans de mandat ouvrent une allocation viagère, réduite de moitié pour
  les mandats d'après le 15 novembre 2015.
domaine: duree
regimes: [cese_membres]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- les périodes de mandat au Conseil, jour par jour, et la date de la première
  désignation
- la rémunération de membre de chaque période (décret n° 59-602, article 1er), hors
  indemnité de résidence et supplément familial
- l'âge, la liquidation de la pension principale et les mandats en cours dans une
  autre assemblée ou au Parlement européen
- les enfants élevés, le conjoint et les orphelins, pour la majoration et la réversion
ecrit:
- la pension normale, ou l'allocation viagère, de l'ancien membre, et ce qui en revient
  à son conjoint et à ses orphelins
dates_qui_decident:
- revenu.annee
- entree_dans_un_regime
# `revenu.annee` est ici la date du mandat qui fait l'annuité : le règlement taxe
# chaque annuité au pourcentage de sa période, coupée au jour (article 17).
# `entree_dans_un_regime` est la première désignation au Conseil, qui ferme la
# caisse aux membres désignés depuis le 1er septembre 2023 (article 1er).
versions:
- id: deux_onze_pour_cent
  statut: lue
  textes:
  - {id: JORFTEXT000000692927, reference: "loi n° 57-761 du 10 juillet 1957 complétant l'article 28 de la loi n° 50-10 : « Le Conseil économique est habilité à instituer, pour ses membres, une caisse de retraite », analyse du Journal officiel", publie_le: 1957-07-11}
  - {id: LEGIARTI000006562302, article: "décret n° 59-601 du 5 mai 1959, article 8", en_vigueur: 1959-05-07}
  - {id: LEGIARTI000022658661, article: "décret n° 59-601 du 5 mai 1959, article 8", en_vigueur: 2010-07-31}
  - reference: >-
      règlement de la caisse de retraites des membres du Conseil économique, social et
      environnemental au 1er janvier 2025, avis conforme du Bureau du 5 novembre 2024,
      arrêté n° 24/DECQ/05 du 8 novembre 2024, articles 1er à 21, 39 à 42, 47 à 49
      (site du Conseil, hors Journal officiel)
    en_vigueur: 2025-01-01
    lu_le: 2026-10-13
    empreinte: sha256:348a9bc8a02677bd6329328e111da01b3a841faa53b0a357f883defd84c91c1f
  nee_de: JORFTEXT000000692927
  bornes:
    revenu.annee: [null, 2004-09-01]
    entree_dans_un_regime: [null, 2023-09-01]
  contenu:
    caisse: >-
      « La Caisse de retraites instituée en application de la loi n° 57-761 du 10
      juillet 1957 et maintenue par le décret n° 59-601 du 5 mai 1959 est destinée à
      assurer des pensions aux anciens membres de l'ancien Conseil économique et du
      Conseil économique, social et environnemental ne relevant pas de l'article 1, à
      leurs conjoints et à leurs orphelins mineurs » ; elle sert aussi des pensions
      d'invalidité et des allocations viagères (article 2) ; le règlement date sa
      création du 27 mars 1954 (article 15) ; il a connu trois rédactions, celle du 21
      janvier 1958, abrogée le 16 novembre 2015, celle du 16 novembre 2015, abrogée le
      1er septembre 2023, et celle d'aujourd'hui (articles 47 et 48)
    retenue: >-
      « égal à 3,42 fois celui prévu au 2° de l'article L61 du code des pensions
      civiles et militaires de retraites », assise sur la rémunération de membre «
      à l'exclusion de l'indemnité de résidence et du supplément familial de
      traitement » ; « Aucune pension ne peut être concédée si le versement de la
      retenue exigible n'a pas été effectué » (article 4) ; les autres ressources de la
      caisse : une contribution de sauvegarde de 3 % du montant brut des pensions,
      jusqu'au 31 décembre 2023 (article 6), le portefeuille, les dons et legs, la
      subvention de la loi de finances, les recettes propres du Conseil et, depuis 2023,
      la compensation de l'État (article 3) ; aucune contribution du Conseil n'est
      chiffrée
    ouverture: >-
      la pension normale est due, sur demande, au lendemain de la fin du mandat ou au
      jour où l'ancien membre réunit trois conditions : « l'âge, mentionné à l'article
      L. 161-17-2 du code de la sécurité sociale », sauf carrière longue (L. 351-1-1)
      ou départ anticipé de L. 25 bis du code des pensions dans sa retraite principale,
      auquel cas l'âge retenu est celui de sa liquidation ; « la liquidation de sa
      pension principale ou la non-détention de droits à pension » ; « un minimum de
      cinq années de mandat » ; et il ne doit détenir aucun mandat dans une autre
      assemblée de la Constitution ni au Parlement européen (article 7)
    calcul: >-
      « L'assiette de référence servant au calcul des pensions est égale à 2,06 fois la
      rémunération » ; la pension vaut, pour chaque annuité de versement, « 2,11 % pour
      les mandats jusqu'au 31/8/2004 » de cette assiette, et « ne peut en aucun cas
      excéder les trois-quarts » de l'assiette ; « toute fraction de mois est comptée
      pour un mois » (article 17) : trente-cinq annuités et demie atteignent le maximum
    allocation_viagere: >-
      l'ancien membre qui a l'âge sans les cinq années de mandat reçoit, sur demande,
      une allocation viagère « proportionnelle au nombre d'annuités de versement des
      cotisations acquises » (articles 8 et 20), aux règles de la pension normale
      (article 10) ; redésigné, il la voit suspendue, et le nouveau mandat complète la
      condition de durée (article 9). Jusqu'au 1er septembre 2009, une pension
      proportionnelle existait (article 11 du règlement de 1958), plafonnée aux deux
      tiers du maximum de la pension normale (article 49)
    enfants: >-
      les pensions normales et de réversion sont majorées de 10 % « pour trois
      enfants, au moins, élevés jusqu'à l'âge de 16 ans », sans dépasser l'assiette de
      référence, les enfants étant ceux de L. 18 du code des pensions (article 18),
      sauf déchéance de l'autorité parentale (article 33)
    reversion: >-
      le conjoint survivant reçoit 50 % de la pension ou de l'allocation, hors
      majoration (article 19), à cinquante-cinq ans, si le mariage précède d'un an la
      liquidation, ou de quatre ans le décès, conditions levées par un enfant du
      mariage (article 11) ; si le membre meurt en exercice, 50 % de ce qu'il aurait
      reçu, au moins la pension de cinq années, au plus la moitié du SMIC brut (article
      12) ; les conjoints divorcés ou séparés partagent au prorata des durées de
      mariage, et perdent leur part en se remariant, en se pacsant ou en concubinage
      (article 15) ; chaque orphelin de moins de vingt et un ans reçoit 10 %, la somme
      ne dépassant pas la pension du membre (articles 13 et 16)
    service: >-
      les pensions se revalorisent comme celles de L. 161-25 (article 21) et se paient
      par trimestre échu (article 26) ; une demande tardive de plus de six mois fait
      partir la pension du premier jour du mois de la demande (article 23)
    coordination: >-
      des mandats successifs dans les assemblées de la Constitution ou au Parlement
      européen n'ajoutent pas plus de cinq annuités au temps passé dans ces
      assemblées (article 39) ; plusieurs pensions des assemblées se cumulent dans la
      limite des trois quarts de l'indemnité parlementaire (article 40) ; la pension
      est suspendue pendant un nouveau mandat au Conseil ou dans une assemblée
      (article 42) ; le membre nommé au Gouvernement peut continuer de cotiser
      (article 41)
  exemples: aucun trouvé
