  statut: lue
  textes:
  - {reference: "accord national interprofessionnel du 17 novembre 2017, article 107, étendu par l'arrêté du 24 avril 2018 (JORFTEXT000036847920)", en_vigueur: 2019-01-01}
  - {reference: "circulaire Agirc-Arrco n° 2020-02-DRJ du 20 janvier 2020, fiche 5, III.2", en_vigueur: 2019-01-01}
  bornes:
    liquidation.date_effet: [2019-01-01, 2020-01-01]
  contenu:
    droit: >-
      « Si ce montant est inférieur ou égal à une somme équivalant à 100 points du régime,
      il n'est pas procédé à l'attribution d'une allocation, et l'intéressé reçoit un
      versement unique correspondant à la valeur viagère de ses allocations. Le versement
      unique au profit des bénéficiaires de droits directs supprime tous droits à
      réversion » (accord, article 107). Les seuils s'apprécient « au regard du montant
      brut des droits directs […], y compris les montants des différentes majorations ou
      coefficients applicables » ; le versement « est égal au produit du montant de
      l'allocation annuelle qui aurait été servie par un coefficient, fonction de l'âge
      révolu du bénéficiaire à la date d'effet de la liquidation des droits » ; la
      retraite progressive donne « dans tous les cas » une allocation (circulaire n°
      2020-02-DRJ, fiche 5, III.2)
    beneficiaire: le participant dont l'allocation n'excède pas l'équivalent de 100 points
    parametres:
      existe: true
      allocations:
