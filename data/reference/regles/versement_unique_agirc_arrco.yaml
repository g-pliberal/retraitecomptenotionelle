    url: https://documents.gereso.com/client/edition/docs-edition/MP-EP-PDF/RET-PDF/RETB-ARRCO/RET-B100.pdf
    date: 2014-02-01
code:
  python: >-
    droit/completer.py : verser_en_capital, completer ; scenarios/actuel.py : FichesDatees
  javascript: >-
    moteur/js/droit/completer.js : verserEnCapital, completer ; moteur/js/regimes.js :
    FichesDatees
  parametres: les versions de cette fiche (contenu.parametres), que le paquet du site porte
  tests: [tests/test_versements_uniques.py]
referents:
  destinie_2:
    equivalent: >-
      src/DroitsRetr.cpp:1267-1279, au commit 4c1d34b : moins de 100 points à l'Arrco,
      moins de 500 à l'Agirc, jusqu'en 2018 ; coefficient de capital de 21 à 55 ans à 2,5
      à 99
    confrontation: aucune exécutée ; sa table est celle du dispositif de 2004
  trajectoire:
    equivalent: >-
      R/fonctionsCalculsPensions.R:3261-3350 (calculeVfu), vfuSeuilPt.csv et vfuCoefAA.csv,
      au commit 0963b57
    confrontation: aucune exécutée
historique:
- >-
  2026-10-08 — écrite à l'étape 17 de l'action 138, sur les points de Destinie 2 et de
  TRAJECTOiRE au registre (chantier 138.17).
reformes:
- fusion_agirc_arrco_2019
effet: >-
  Le salarié dont l'allocation de l'Agirc-Arrco n'excède pas cent points — 143,86 € par
  an en 2026 — reçoit sa valeur viagère en une fois : 31,6 annuités à 60 ans, 26,4 à 65,
  en 2026 ; avant 2019, l'Arrco jusqu'à cent points, l'Agirc sous cinq cents, à 19,1
  annuités à 60 ans.
