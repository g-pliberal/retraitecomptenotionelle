schema_version: 1
id: versement_unique_agirc_arrco
intitule: >-
  L'allocation de l'Agirc-Arrco dont le montant n'excède pas l'équivalent de 100 points
  n'est pas attribuée : l'assuré reçoit un versement unique, sa valeur viagère, égal à
  l'allocation annuelle multipliée par un coefficient de son âge révolu à la date d'effet
  (accord du 17 novembre 2017, article 107). Avant 2019, l'Arrco versait ce capital à qui
  avait cent points au plus, l'Agirc à qui en avait moins de cinq cents. Versé à
  l'assuré, il supprime la réversion.
domaine: points
regimes:
- arrco
- arrco_tranche_2
- arrco_tranche_2_entreprises_nouvelles
- arrco_cultes
- agirc
- agirc_entreprises_nouvelles
- agirc_arrco
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- les pensions des régimes de l'allocation à l'étape qui complète, coefficients
  d'anticipation et majorations faits, et leur part de la majoration pour enfants
- les points de chacun (Droits.points_acquis)
- la valeur de service du point de l'Agirc-Arrco à la date d'effet
- l'âge révolu à la date d'effet, et la nature de la demande
- liquidation.date_effet
ecrit:
- le versement unique qui remplace l'allocation, réparti entre les régimes qui la forment
  (PensionRegime.capital), et la formule qui le dit ; le montant annuel reste celui de
  l'allocation remplacée
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/completer.py, `verser_en_capital`, et son jumeau) lit :
# `existe` ; `allocations`, chacune un groupe de régimes dont les pensions
# forment une allocation, son seuil en points (`seuil_points`), compris ou non
# (`seuil_compris`), et, quand le seuil est un montant, le régime dont la valeur
# de service le fait (`point`) ; `mesure`, `points` (le nombre de points du
# groupe, minoré ou non) ou `montant` (l'allocation annuelle, coefficients et
# majorations compris, comparée au seuil en euros) ; `coefficients`, ceux des
# droits directs, de l'âge `coefficients_depuis` à 99 ans ; `fiabilite`. Un âge
# hors de la table prend le coefficient de son bout.
versions:
- id: avant_2004
  statut: supposee
  hypothese: >-
    le dispositif que la fiche RET-B100 des éditions GERESO date du 1er janvier 2004 en
    remplace un plus ancien, que ni les accords de l'Arrco et de l'Agirc ni leurs
    circulaires, absents des deux index, ne laissent lire ; on ne lui prête aucun
    versement unique, et l'allocation reste servie, comme le modèle la servait avant cette
    fiche
  fiabilite: faible
  bornes:
    liquidation.date_effet: [null, 2004-01-01]
  contenu:
    droit: aucun versement unique lu
    parametres:
      existe: false
  exemples: aucun trouvé
- id: dispositif_de_2004
  statut: supposee
  hypothese: >-
    la règle et la table sont celles que reproduit la fiche RET-B100 des éditions GERESO
    (mises à jour de septembre 2013 et de février 2014) : « L'entrée en vigueur de
    l'ensemble du nouveau dispositif est fixée au 1er janvier 2004 », et la circulaire
    Agirc-Arrco n° 2013-4 du 21 mars 2013 en maintient les seuils. Les accords et les
    circulaires eux-mêmes ne sont pas lus ; Destinie 2 sert les mêmes seuils et la même
    table
  fiabilite: moyenne
  bornes:
    liquidation.date_effet: [2004-01-01, 2019-01-01]
  contenu:
    droit: >-
      « La retraite ARRCO est versée en une seule fois sous forme de capital quand elle est
      calculée sur un nombre de points inférieur ou égal à 100. La retraite AGIRC est
      versée en une seule fois sous forme de capital quand elle est calculée sur un nombre
      de points inférieur à 500. » ; « qu'il s'agisse d'une retraite liquidée avec ou sans
      minoration » ; « Capital unique = Montant brut annuel x Coefficient », le
      coefficient « fonction de l'âge révolu du bénéficiaire au point de départ de sa
      retraite » (fiche RET-B100). L'Arrco sert une fois l'an de cent à deux cents points.
    beneficiaire: le participant de l'Arrco ou de l'Agirc dont les points sont sous le seuil
    parametres:
      existe: true
      allocations:
      - regimes: [arrco, arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles, arrco_cultes]
        seuil_points: 100
        seuil_compris: true
      - regimes: [agirc, agirc_entreprises_nouvelles]
        seuil_points: 500
        seuil_compris: false
      mesure: points
      coefficients_depuis: 55
      coefficients: [21.0, 20.7, 20.3, 19.9, 19.5, 19.1, 18.7, 18.3, 17.9, 17.4, 17.0, 16.5,
        16.0, 15.5, 15.0, 14.5, 14.0, 13.5, 12.9, 12.4, 11.9, 11.3, 10.8, 10.2, 9.7, 9.2,
        8.6, 8.1, 7.6, 7.1, 6.7, 6.2, 5.8, 5.4, 5.1, 4.7, 4.4, 4.0, 3.8, 3.5, 3.2, 3.0, 2.8,
        2.7, 2.5]
      fiabilite: moyenne
  exemples: aucun trouvé
