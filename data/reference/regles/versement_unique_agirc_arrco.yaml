approximations:
- version: [accord_du_17_novembre_2017]
  ecart: >-
    La table des coefficients de 2019 n'est pas trouvée : la circulaire de 2020 en adopte «
    une nouvelle », et le modèle garde en 2019 celle d'avant la fusion, qu'elle remplace.
  effet: >-
    non mesuré ; le capital des seules liquidations de 2019, 29,6 au lieu de 19,1 à 60 ans
    si la table de 2020 valait dès 2019
- version: [table_de_2020]
  ecart: >-
    Aucune table n'est lue pour 2021, et celle de 2022 (circulaire n° 2021-9-DRJ du 17
    décembre 2021, que le Cleiss annonce) n'est pas trouvée : la table de 2020 vaut
    jusqu'à celle de 2023, d'un dixième à un point et demi sous elle.
  effet: non mesuré ; le capital des liquidations de 2021 et de 2022
- version: [dispositif_de_2004, accord_du_17_novembre_2017, table_de_2020, table_de_2023,
    table_de_2024, table_de_2025, table_de_2026]
  ecart: >-
    Le montant annuel de chaque pension reste celui de l'allocation que le versement
    remplace, comme pour le capital du RAFP : les comparaisons annuelles le lisent, et «
    faire vivre » le mène encore ; le versement est dit dans la formule et dans le champ
    capital, réparti entre les régimes au prorata de leur part de l'allocation. Au-delà de
    2026, la table de 2026 reste.
  effet: non mesuré ; les seules allocations d'au plus cent points, quelques années de cotisation
- version: [dispositif_de_2004, accord_du_17_novembre_2017, table_de_2020, table_de_2023,
    table_de_2024, table_de_2025, table_de_2026]
  ecart: >-
    Seuls les droits directs sont versés en capital : la réversion d'au plus cent points,
    que l'article 107 verse aussi en une fois au coefficient de l'âge du survivant, reste
    servie en rente ; et la réversion qu'un capital versé avant 2019 aurait supprimée n'est
    pas lue (fiche reversion_agirc_arrco).
  effet: non mesuré
sources:
  lu_le: 2026-10-08
  prochaine_relecture: 2027-01-31
  lectures_divergentes:
  - >-
    L'accord (article 107) et la circulaire n° 2020-02-DRJ versent en capital
    l'allocation « inférieure ou égale » à l'équivalent de 100 points ; les circulaires des
    coefficients, de 2020 à 2026, résument « inférieur à ». Le modèle suit l'accord.
  - >-
    Destinie 2 (src/DroitsRetr.cpp:1267-1279, au commit 4c1d34b) sert les seuils et la
    table d'avant la fusion, et laisse l'Agirc-Arrco unifiée « à faire ». TRAJECTOiRE
    (inst/extdata/trajectoire/vfuSeuilPt.csv, vfuCoefAA.csv, au commit 0963b57) verse le
    capital jusqu'à 100 points, « pension annuelle × coefficient de l'âge », sur des
    coefficients anciens.
  a_relire:
  - >-
    Lire la circulaire n° 2021-9-DRJ (table de 2022) et la table de 2019, que le site de
    l'Agirc-Arrco ne sert plus ; puis les accords de l'Arrco et de l'Agirc d'avant 2004,
    et la circulaire qui a fixé le dispositif de 2004.
  - >-
    Chaque mois de décembre, la table de l'année suivante.
  lectures:
  - type: autre
    reference: >-
      accord national interprofessionnel du 17 novembre 2017, « applicable au 1er janvier
      2019 », article 107, « Allocations de faible montant » (circulaire n° 2018-09-DC)
    url: https://www.agirc-arrco.fr/storage/2024/09/201809dc_ANI_du_17_novembre_2017.pdf
    date: 2017-11-17
  - type: autre
    reference: >-
      circulaire Agirc-Arrco n° 2020-02-DRJ du 20 janvier 2020, « Réglementation
      applicable aux individus », fiche 5, III.2 : les seuils, le versement unique des
      droits directs et de réversion, la retraite progressive, la réversion supprimée ; «
      Ce qui change : Harmonisation des seuils de référence »
    url: https://gisti.org/IMG/pdf/2020-02-drj_regime_agirc-arrco_reglementation_applicable_aux_individus.pdf
    date: 2020-01-20
  - type: autre
    reference: >-
      circulaires Agirc-Arrco des coefficients de versement unique : n° 2020-05-DRJ
      (2020), n° 2022-15-DRJ du 20 décembre 2022 (2023), n° 2023-15-DRJ du 18 décembre
      2023 (2024), n° 2024-15-DRJ du 17 décembre 2024 (2025), n° 2025-21-SG-DRJ du 15
      décembre 2025 (2026), lues en PDF le 8 octobre 2026 ; les colonnes des droits
      directs extraites par programme
    url: https://www.agirc-arrco.fr/storage/CirculaireAgircArrco2025-21sg-drj.pdf
    date: 2025-12-15
  - type: autre
    reference: >-
      éditions GERESO, « Les retraites », fiche RET-B100, « Paiement des allocations —
