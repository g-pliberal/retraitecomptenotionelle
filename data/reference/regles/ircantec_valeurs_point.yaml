  contenu:
    droit: >-
      Les points d'une année sont ses cotisations au taux théorique — la cotisation
      appelée divisée par le taux d'appel — divisées par le salaire de référence de
      l'année. Les barèmes publiés sont dans regimes/valeurs_point.csv, certifiés de 1971 à
      2021 sur les tableaux du gestionnaire et lus de 2022 à 2026 sur le site de
      l'Ircantec, par `source_valeurs_point_ircantec_publiees` de
      `scripts/verifier_donnees.py` et non par une saisie dans le fichier : le modèle les
      lit, il ne les recalcule pas. Depuis 2018, le plan quadriennal les fixe : le
      rendement réel de 7,75 % conservé de 2018 à 2025, la valeur de service et le salaire
      de référence revalorisés comme les pensions de base ; en 2026, l'un et l'autre de 0,9
      % (0,56053 € et 5,787 €), et le taux d'appel porté de 125 à 127 %, ce qui ramène le
      rendement réel à 7,63 %.
    parametres:
      prix_du_point: >-
        le salaire de référence publié de l'année, au taux d'appel publié : 7,11 / 5,60 en
        2026, le rapport des taux appelés arrondis aux taux théoriques
  exemples: aucun trouvé
- id: prix_au_dela_du_bareme
  statut: supposee
  nee_de: LEGIARTI000053281114
  hypothese: >-
    le plan quadriennal en vigueur continue de revaloriser le salaire de référence et la
    valeur de service comme les pensions de base, sur l'inflation, à rendement réel
    constant, comme en 2026. Le plan de 2026 à 2029, adopté par la délibération n°
    2025-12-15 du conseil d'administration du 11 décembre 2025, que l'Ircantec ne publie
    pas, surindexerait selon la presse le salaire de référence à partir de 2028 ; le
    modèle ne le suit pas tant que ni la caisse ni un texte publié ne le confirment
    (approximations). À défaut de plan, l'article 9 bis ferait croître le salaire de
    référence des cinq tiers et la valeur de service des deux tiers de la revalorisation
    des pensions : les prix toujours, jamais les salaires
