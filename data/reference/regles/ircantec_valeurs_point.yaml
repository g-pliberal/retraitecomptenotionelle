schema_version: 1
id: ircantec_valeurs_point
intitule: >-
  Le salaire de référence de l'Ircantec, prix d'achat de son point, et la valeur de
  service évoluent chaque 1er janvier selon la règle du plan quadriennal du conseil
  d'administration, qui les revalorise tous deux comme les pensions ; au-delà du dernier
  barème publié, le modèle convertit les cotisations au rendement de ce barème, ce qui
  fait suivre les prix à l'un et à l'autre.
domaine: points
regimes: [ircantec]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- la cotisation de chaque année à l'Ircantec, et son année
- le salaire de référence, la valeur de service et le taux d'appel publiés
  (regimes/valeurs_point.csv)
- le rendement du dernier barème, au-delà de lui (regimes/rendements_points.csv, ligne
  ircantec 2027-2100)
- l'indice des prix du modèle, qui revalorise jusqu'à la liquidation les cotisations des
  années sans barème
ecrit:
- les points Ircantec des années d'un barème publié
- la pension que donnent, au rendement du dernier barème, les cotisations des années
  postérieures
dates_qui_decident:
- revenu.annee
