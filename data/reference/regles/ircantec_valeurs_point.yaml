  contenu:
    droit: >-
      Pour une année postérieure au dernier barème publié — 2027 et au-delà le 4 octobre
      2026 —, les cotisations, revalorisées par les prix jusqu'à la liquidation, sont
      converties au rendement du dernier barème, 0,56053 / (7,11 / 5,60 × 5,787), soit
      7,63 % : un salaire de référence et une valeur de service qui suivent tous deux les
      prix, comme le plan les revalorise. L'Ircantec n'a donc pas de ligne dans
      regimes/prolongement_points.csv, dont le seul indice, le salaire moyen, ne
      correspond à aucune de ses règles.
