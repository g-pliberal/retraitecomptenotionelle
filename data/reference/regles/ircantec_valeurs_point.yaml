historique:
- >-
  Jusqu'au 23 septembre 2026, la table s'arrêtait à la valeur de janvier 2022, 0,49241 €,
  et le rendement moyen de 2009 à 2021, 8,52 %, prolongeait tout le reste ; depuis, le
  rendement au-delà de 2026 est celui du barème de 2026, 7,63 %. Mesuré alors sur un
  contractuel entré à 22 ans et parti à 64 : la part Ircantec gagnait 2,8 % pour la
  génération 1960, que les valeurs de 2022 à 2026 relèvent, et perdait 3,2 % pour 1975,
  6,5 % pour 1985 et 10,5 % pour 2005, que le rendement de prolongation abaisse.
- >-
  Le 4 octobre 2026, l'Agirc-Arrco a quitté ce rendement pour un prix d'achat qui suit le
  salaire moyen (fiche agirc_arrco_valeur_achat), et la question s'est posée pour
  l'Ircantec, qui le gardait faute d'avoir lu son texte. Lu le même jour : l'arrêté du
  30 décembre 1970 (article 9 bis, et non 16, qui porte l'anticipation) renvoie au plan
  quadriennal, qui revalorise les deux paramètres comme les pensions. Rien n'a bougé.
effet: >-
  Toute pension Ircantec qui compte des cotisations postérieures au dernier barème : elles
  donnent, au rendement de 7,63 %, ce qu'achèterait un salaire de référence revalorisé
  comme les pensions, la règle du plan quadriennal. La lecture du 4 octobre 2026 ne
  déplace aucun chiffre ; la surindexation que la presse prête au plan à partir de 2028
  baisserait la part Ircantec de 0,8 à 42 % selon sa lecture (approximations).
