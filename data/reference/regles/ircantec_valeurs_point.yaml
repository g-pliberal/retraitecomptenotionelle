code:
  python: >-
    scenarios/actuel.py : ValeursPoint.achat, et achat_prolonge, qui ne prolonge pas
    l'Ircantec ; Rendements.rendement ; droit/acquerir.py : acquerir, les cotisations des
    années sans barème revalorisées par les prix ; droit/liquider.py : leur conversion au
    rendement
  javascript: >-
    moteur/js/regimes.js : ValeursPoint.achatProlonge et rendement ;
    moteur/js/droit/acquerir.js : acquerir ; moteur/js/droit/liquider.js : la conversion
