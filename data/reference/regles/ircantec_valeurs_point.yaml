approximations:
- version: prix_au_dela_du_bareme
  ecart: >-
    Le plan de 2026 à 2029 surindexerait le salaire de référence de 2,6 points par
    rapport à la revalorisation des pensions « à partir de 2028 », selon une dépêche de
    presse, seule source : une fois, en 2028 et 2029, l'horizon du plan, ou chaque année,
    elle ne le dit pas, et la délibération n'est pas publiée. Le modèle n'en suit aucune
    lecture.
  effet: >-
    mesuré le 4 octobre 2026 sur des contractuels entrés à 22 ans et partis à 64, en
    donnant à l'Ircantec un prix d'achat prolongé par les prix, qui redonne le modèle à
    0,01 % près, puis surindexé : des générations 1975 à 2005, la part Ircantec baisserait
    de 0,8 à 2,5 % pour une surindexation de la seule année 2028, de 1,6 à 4,8 % pour 2028
    et 2029, et de 5,0 à 42,1 % si elle valait chaque année ; la pension totale de 0,3 à
    0,7 %, de 0,5 à 1,5 % et de 1,6 à 12,7 %. Rien ne bouge pour la génération 1960,
    partie en 2024.
- version: prix_au_dela_du_bareme
  ecart: >-
    Les prix du modèle, et non la revalorisation de l'article L. 161-23-1, moyenne
    annuelle des prix hors tabac des douze derniers indices ; et le rendement de
    prolongation arrondi à quatre décimales, 7,63 % pour 7,6289 %.
  effet: >-
    l'arrondi : la part Ircantec ressort de 0,01 % au-dessus d'un prix d'achat prolongé
    sans lui, de la génération 1975 à 2005. L'écart d'indice, non mesuré.
