schema_version: 1
id: raap_taux_amenage_racd_racl
intitule: >-
  Le taux de cotisation au RAAP est la moitié du taux de droit commun pour les personnes
  tenues de cotiser au RACD ou au RACL : 4 % depuis les revenus de 2019, la moitié
  de la montée en charge de 2016 à 2018.
regimes: [ircec_raap, ircec_raap_taux_amenage]
etat: conforme
effet: >-
  Les statuts `auteur_dramatique` et `auteur_lyrique` cotisaient au RAAP à 8 % :
  le double de ce que le décret leur demande, et donc le double des points. Porté
  depuis le 22 septembre 2026 par la fiche `ircec_raap_taux_amenage`, que l'affiliation
  leur donne à partir de 2016 et dont les points sont ceux du RAAP (`points_de`)
  ; tenu par tests/test_ircec_auteurs.py. Pour une carrière entière depuis 2016,
  la pension du RAAP d'un auteur dramatique est exactement la moitié de celle d'un
  artiste-auteur au même revenu. Le texte vise la PERSONNE, la caisse écrit « sur
  les revenus déjà soumis » au RACD ou au RACL : les deux lectures coïncident pour
  ces statuts, qui portent tout leur revenu au RACD ou au RACL. La moitié des taux
  de montée en charge de 2016 à 2018 cumule deux textes qu'aucun n'écrit en chiffres.
sources:
  lu_le: 2026-09-22
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Un auteur qui tire une partie seulement de ses revenus de la SACD ou de la SACEM
    demanderait de partager le revenu entre deux statuts.
  lectures:
  - type: legifrance
    reference: >-
      décret n° 62-420, article 2, six versions lues dans l'index LEGI ; le II n'apparaît
      qu'avec la rédaction du 1er janvier 2016
    date: 2026-09-22
  - type: autre
    reference: >-
      IRCEC, guide de la retraite 2026 (« cette cotisation RAAP, au taux aménagé
      de 4 %, vient s'ajouter à celle du RACD »), mémo 2026 et page « Principes
      de calcul et taux de cotisation au RAAP » (« sur les revenus déjà soumis à
      cotisation auprès du RACL et/ou du RACD »)
    url: >-
      https://www.ircec.fr/vos-regimes/raap/cotisations/calcul-taux-cotisations-raap/
    date: 2026-09-22
textes_a_rattacher:
- reference: >-
    décret n° 62-420 du 11 avril 1962, article 2 II, rédaction du décret n° 2015-1877
    (LEGIARTI000031832007 du 1er janvier 2016, LEGIARTI000041766050 depuis le 1er
    avril 2020)
- reference: >-
    décret n° 2015-1877 du 30 décembre 2015, article 3 II (taux de 5 à 8 % de 2016
    à 2019)
reformes:
- ircec_2016
code:
  moteur: >-
    Depuis 2016, `legislation/affiliations.yaml` affilie l'auteur dramatique (SACD) et
    l'auteur lyrique (SACEM), avec le régime général et le RACD ou le RACL, à
    `ircec_raap_taux_amenage` au lieu du RAAP (`Affiliations.regimes`) : ses périodes
    cotisent jusqu'à trois plafonds à 2,5 % en 2016, 3 % en 2017, 3,5 % en 2018 et 4 %
    depuis 2019, la moitié des taux du RAAP, et son barème est celui du RAAP
    (`points_de`) : `acquerir` en cumule les cotisations, revalorisées par les prix
    jusqu'à la liquidation, que `liquider_chaque_regime` sert au rendement du RAAP
    (`Rendements.rendement`), et le compte notionnel les reçoit
    (`ConstructeurCompte._cotisation_ligne`). Le taux vaut pour tout le revenu de ces
    deux statuts, qui le portent entier au RACD ou au RACL.
  python: >-
    carriere.py : Affiliations.regimes ; droit/acquerir.py : acquerir ;
    droit/liquider.py : liquider_chaque_regime ; scenarios/actuel.py :
    Rendements.rendement ; moteur/compte.py : ConstructeurCompte._cotisation_ligne
  javascript: >-
    moteur/js/regimes.js : Affiliations.regimes, Rendements.rendement ;
    moteur/js/droit/acquerir.js : acquerir ; moteur/js/droit/liquider.js :
    liquiderChaqueRegime ; moteur/js/compte.js : ConstructeurCompte._cotisationLigne
  parametres: >-
    regimes/ircec_raap.yaml, regimes/ircec_raap_taux_amenage.yaml :
    taux_cotisation_retraite, assiette, points_de ; legislation/affiliations.yaml :
    affiliations.auteur_dramatique.periodes, affiliations.auteur_lyrique.periodes ;
    regimes/rendements_points.csv : ircec_raap, rendement
  tests:
  - tests/test_ircec_auteurs.py
  - >-
    tests/test_coupures_au_mois.py, tests/test_cumul_activites.py, tests/test_droit.py
    et tests/test_liquidation.py, qui confrontent les deux moteurs sur des carrières qui
    la portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    neuf témoins changent sans elle — les quatre de l'auteur dramatique et les quatre de
    l'auteur lyrique nés depuis 1955, et auteur_dramatique_carriere_courte
