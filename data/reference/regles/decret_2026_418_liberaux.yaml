textes_a_rattacher:
- id: JORFTEXT000054153355
  reference: décret n° 2026-418 du 29 mai 2026 (JORF du 31 mai 2026)
code:
  moteur: >-
    Le décret ne change aucun paramètre que le dépôt porte, hors les dispenses et
    l'exemption de la CARMF et la dispense de la CARCDSF : les périodes des régimes
    qu'il réécrit gardent leurs taux, leurs assiettes, leurs classes et leurs âges, que
    `acquerir` sert en points et `liquider_chaque_regime` liquide comme avant. Ce qu'il
    écrit à neuf et que le modèle porte : la majoration de 10 % pour trois enfants de la
    Cipav (article 20), qui est la fiche `sections_liberales_majoration_enfants`, et la
    dispense des deux premières années d'exercice de la CARMF (article 3), que
    `dispense_de_debut` rend à `acquerir` et au compte (`dispense_de_debut` de la
    période de 2026), son exemption passé le semestre des 75 ans (même article), que
    `exemption_passe_l_age` leur rend de même, et celle de la part proportionnelle des deux premières années
    civiles de la CARCDSF (article 5), que les statuts de 2011 écrivaient déjà
    (`dispense_de_debut` des périodes de 2012 et d'après, `part: proportionnelle`) ; ce
    qu'il
    écrit et que le modèle ne porte pas, ou portait à tort — la majoration pour report
    de la Cipav, que `liquider_chaque_regime` étendait à tous les points jusqu'au
    14 novembre 2026 —,
    `sources.a_relire` le dit.
  python: >-
    droit/acquerir.py : acquerir, dispense_de_debut, exemption_passe_l_age ;
    droit/liquider.py :
    liquider_chaque_regime ; moteur/compte.py : ConstructeurCompte
  javascript: >-
    moteur/js/droit/acquerir.js : acquerir, dispenseDeDebut, exemptionPasseLAge ;
    moteur/js/droit/liquider.js :
    liquiderChaqueRegime ; moteur/js/compte.js : ConstructeurCompte
  parametres: >-
    regimes/asv_auxiliaires_medicaux.yaml, regimes/asv_chirurgiens_dentistes.yaml,
    regimes/asv_conventionnes.yaml, regimes/asv_directeurs_laboratoire.yaml,
    regimes/asv_sages_femmes.yaml, regimes/carcdsf_complementaire.yaml, regimes/carmf_complementaire.yaml,
    regimes/carpimko_complementaire.yaml, regimes/carpv_complementaire.yaml,
    regimes/cavamac_complementaire.yaml, regimes/cavec_complementaire.yaml,
    regimes/cavom_complementaire.yaml, regimes/cavp_complementaire.yaml,
    regimes/cipav_complementaire.yaml, regimes/cprn_complementaire.yaml : assiette,
    taux_cotisation_retraite, avantages_non_contributifs, dispense_de_debut,
    exemption_passe_l_age
  tests:
  - >-
    tests/test_sections_liberales.py, qui tient ce que la lecture du décret dans les
    articles des trois sections a corrigé, et que chacun des 31 articles est rapporté à
    la fiche de sa règle
  - >-
