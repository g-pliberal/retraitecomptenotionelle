schema_version: 1
id: decret_2026_418_liberaux
intitule: >-
  Décret n° 2026-418 du 29 mai 2026 réécrivant les régimes complémentaires et d'invalidité-décès
  des sections libérales, à confronter aux fiches.
regimes: [asv_auxiliaires_medicaux, asv_chirurgiens_dentistes, asv_conventionnes,
  asv_directeurs_laboratoire, asv_sages_femmes, carcdsf_complementaire,
  carmf_complementaire, carpimko_complementaire, carpv_complementaire,
  cavamac_complementaire, cavec_complementaire, cavom_complementaire,
  cavp_complementaire, cipav_complementaire, cprn_complementaire]
etat: transcrite
effet: >-
  Un texte, non un dispositif (architecture, § 6.1 : « Une règle est un dispositif : ce
  qu'un même ensemble d'articles accorde ou exige ») : la fiche ne porte pas de versions
  à elle, et rapporte chacun des 31 articles au décret qu'il modifie, par le visa du
  décret n° 2026-418, et à la fiche de sa règle, qui en coupe les versions (§ 6.6 :
  « Chaque rédaction d'un article est rattachée à une version de fiche ») ; ses
  `sources.lectures` du 31 mai 2026 le font article par article (action 130, E10). Les
  articles 2 à 6, 8, 13, 16, 18 à 20, 22 et 24 à 26 touchent quinze régimes que le
  modèle calcule ; 7, 9 à 12, 14, 15, 17, 21, 23, 27 et 28 des régimes qu'il ne calcule
  pas (notaires de Colmar, invalidité-décès) ; 1, 29, 30 et 31 n'écrivent aucune règle
  de calcul. Ce que le modèle ne sert pas, et ce qu'il sert à tort, `sources.a_relire`
  le dit : à la Cipav, une erreur (E9), qui vaut depuis le 1er janvier 2023 (E11) ; à la
  CARMF, deux ; à la CARCDSF, une (E10).
  Corrigée le 14 novembre 2026 (décision du propriétaire du 13 novembre, ligne 14 de la
  file `130/2026-11-13-corrections-decidees.md`) : l'erreur de la Cipav. Le report ne
  majore plus que les points des trente premières années de cotisation
  (`surcote_par_age_seul`, `surcote_premieres_annees`), au décompte le plus favorable à
  l'affilié — née le 10 mars 1959, pension au 1er juillet 2027, un an de report :
  24 000,52 € par an servis jusque-là, 23 451,33 € depuis, 549,19 € de trop.
  Corrigée le 14 novembre 2026 (décision du propriétaire du 13 novembre, ligne 5 de la
  file `130/2026-11-13-corrections-decidees.md`) : la première des deux erreurs de la
  CARMF. Jusque-là, le modèle faisait cotiser et acquérir les deux premières années
  d'exercice du médecin installé avant 40 ans, que l'article 4, I, du décret n° 49-579
  dispense sans points (article 4-1, II) — née le 1er janvier 2001, installée le
  1er janvier 2027, pension à 67 ans : 53 701,26 € par an au lieu de 51 417,01 €,
  2 284,25 € de trop. Depuis, `dispense_de_debut` à la période de 2026 de
  `carmf_complementaire.yaml`, dans les deux moteurs : ni points au scénario 1, ni
  cotisation au compte notionnel, pour les cotisations de 2027 et d'après.
  Corrigée le 14 novembre 2026 (ligne 6 de la même file) : l'erreur de la CARCDSF.
  Jusque-là, le modèle faisait cotiser et acquérir aux nouveaux affiliés la part
  proportionnelle de leurs deux premières années civiles d'exercice, que l'article 3-1
  du décret n° 50-28 dispense, les droits correspondants supprimés (article 3-5) — née
  le 1er janvier 2001, chirurgienne-dentiste installée le 1er janvier 2027, pension à
  67 ans : 52 158,40 € par an au lieu de 50 630,17 €, 1 528,23 € de trop. La relecture a
  trouvé la même dispense, dans les mêmes mots, aux statuts approuvés par l'arrêté du
  13 avril 2011, en vigueur le 1er juillet 2011 (article 11, puis 13) : l'erreur valait
  depuis les cotisations de 2012, et non depuis le seul 1er juillet 2026. Depuis,
  `dispense_de_debut`, sans condition d'âge et pour la seule part proportionnelle, aux
  périodes de 2012 et d'après de `carcdsf_complementaire.yaml`, dans les deux moteurs :
  le forfait et ses six points restent, au scénario 1 comme au compte notionnel.
  Corrigée le 14 novembre 2026 (ligne 7 de la même file) : la seconde erreur de la
  CARMF. Jusque-là, le modèle faisait cotiser et acquérir jusqu'au départ le médecin
  qui continue d'exercer, que l'article 4, II, du décret n° 49-579 exempte « à partir du
  premier jour du semestre civil qui suit son soixante-quinzième anniversaire », sans
  points (article 4-1, II) — née le 1er janvier 1951, médecin libérale au double du
  salaire moyen depuis ses 30 ans, pension à 76 ans et 6 mois (1er juillet 2027) :
  18 895,60 € par an au lieu de 18 595,38 €, 300,22 € de trop. Depuis,
  `exemption_passe_l_age` à la période de 2026 de `carmf_complementaire.yaml`, dans les
  deux moteurs : ni points au scénario 1, ni cotisation au compte notionnel, pour les
  années civiles d'après celle des 75 ans, cotisations de 2027 et d'après.
sources:
  lu_le: 2026-11-14
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Non portés : l'option pour la classe supérieure, les rachats de points, les
    cotisations volontaires, les dispenses et exonérations accordées sur demande, la
    fraction gérée en capitalisation de la CAVP, la section B, par classes, de la CPRN
    (`cprn_complementaire.yaml`, `manque`) ; le versement
    forfaitaire unique des petites pensions. Portée depuis le 14 novembre 2026 : la
    majoration pour report de la Cipav sur les seuls points des trente premières années
    de cotisation, que le modèle étendait à tous (`surcote_premieres_annees`). Porté, contrairement à ce que cette ligne
    disait jusqu'au 6 novembre 2026 : l'inscription d'office en classe A la première
    année à la CAVEC (`classes_cotisation_epoques.yaml`, `classe_de_debut` de
    `cavec_complementaire`, rang 0, une année, depuis 2019).
  - >-
    Erreur prouvée, déclarée (action 130, E9, 6 novembre 2026) et corrigée le
    14 novembre 2026 (ligne 14 de la file, `surcote_premieres_annees`, au décompte le
    plus favorable à l'affilié, le troisième ci-dessous ; ce qui suit est le constat
    d'avant la correction) : depuis
    le 1er juillet 2026, l'article 5-2, II, du décret n° 79-262 (décret n° 2026-418,
    article 20, JORFARTI000054153655 ; article 30, « Le présent décret entre en vigueur
    le 1 er juillet 2026 ») majore « de 5% par année entière de prorogation » le compte
    de points de l'affilié de trente années d'affiliation qui diffère sa pension d'un à
    cinq ans au-delà de l'âge du a du 1° de l'article 5-1, et « Cette majoration
    s'applique uniquement aux points acquis au titre des trente premières années de
    cotisation à la CIPAV » ; le modèle majorait tous les points (`surcote_par_age_seul`,
    `cipav_complementaire.yaml`). Essai du 6 novembre 2026, née le 10 mars 1959,
    libérale de la Cipav au double du salaire moyen depuis 22 ans, en euros de 2026,
    cotisant de 1981 à la liquidation : à 68 ans et 3 mois, pension au 1er juillet 2027,
    une année entière de report, le modèle sert 0,05 × 374 715,4414 × 0,061 =
    1 142,8821 € de majoration ; le texte, sur les seuls points de 1981 à 2010, 0,05 ×
    184 754,1840 × 0,061 = 563,5003 € : 579,38 € par an de trop ; à 72 ans et 3 mois,
    cinq années, 0,25 × 459 993,6709 × 0,061 = 7 014,9035 € contre 0,25 × 198 030,4407
    × 0,061 = 3 019,9642 € : 3 994,94 € par an de trop. LE DÉCOMPTE DES TRENTE ANNÉES,
    QUAND LA PREMIÈRE EST PARTIELLE (action 130, E10, après R-E10) : l'activité commence
    le 10 mars 1981 (3 771,6290 € de cotisation revalorisée cette année-là, 4 828,4559 €
    en 1982) ; le texte range dans les trente années « les années au titre desquelles
    l'affilié a obtenu une exonération ou une réduction de cotisation », et ne dit pas
    si une première année incomplète en est une. Trois lectures, de trop pour un an de
    report et pour cinq : 1981 à 2010, l'année partielle comptée, 579,38 € et
    3 994,94 € ; 1982 à 2011, non comptée, 560,70 € et 3 894,81 € ; 1981 à 2011,
    trente ans comptés du 10 mars 1981, 2011 pris en entier, 549,19 € et 3 833,16 €.
    L'erreur se déclare au moins de 549,19 € par an pour un an de report, 3 833,16 €
    pour cinq, le montant qui tient sous les trois ; la lecture qu'appliquera la
    correction (candidat 50) est au propriétaire, qui a retenu le 13 novembre 2026 la
    plus favorable à l'affilié, la troisième, servie depuis le 14. DU 1ER JANVIER 2023 AU 30 JUIN 2026,
    LA MÊME ERREUR (action 130, E11, après R-E11) : l'article 3.15 des statuts de la
    Cipav, « Statuts Cipav au 01/01/2023 » que la caisse publie (relus le 6 novembre
    2026, SHA-256 e5034d618178585fdae444ec690247ef83c7e94d7e9ca741682fb98562093790) :
    « Le compte de points qui est alors établi est majoré de 5% par année entière de
    prorogation. Cette majoration s'applique uniquement aux points acquis au titre des
    trente premières années de cotisation à la C•I•P•A•V. Pour la détermination des
    trente années de cotisation, les années au titre desquelles l'adhérent a obtenu une
    exonération ou une réduction de cotisation sont prises en compte. » ; l'arrêté du
    20 mars 2023 qui l'approuve (JORFARTI000047334800, 17° : « a) Au dernier alinéa, les
    mots : « , telles qu'elles sont définies à l'article 3.6 » sont supprimés ; b)
    L'article est complété par un alinéa ainsi rédigé : « Pour la détermination des
    trente années de cotisation, […] » ») est « applicable aux cotisations et aux
    prestations dues au titre des périodes courant à compter du 1er janvier 2023 »
    (article 2, JORFARTI000047334796) ; l'arrêté du 16 décembre 2021 (JORFARTI000044554134,
    19°, en vigueur le 1er janvier 2022 par son article 2, JORFARTI000044554130) ne
    touche que le premier alinéa : « Au premier alinéa de l'article 3.15, les mots :
    « âgé de 65 ans » sont remplacés par les mots : « qui a atteint l'âge prévu au
    deuxième alinéa du 1° de l'article 3.13, » » ; aucun autre arrêté publié depuis ne
    touche l'article 3.15 (celui du 27 décembre 2023 nomme les articles 3.6, 3.13, 3.14,
    3.16 et 3.19). La lecture contraire supposerait que la caisse publie d'autres statuts
    que ceux que l'arrêté approuve : intenable. Née le 10 mars 1957, même carrière,
    pension au 1er janvier 2026, un an entier de report au-delà de 67 ans : le modèle
    sert 354 057,8613 × 0,061 × 1,05 = 22 677,41 €, dont 0,00305 × 354 057,8613 =
    1 079,8765 € de majoration ; sur les seuls points des trente premières années, de
    1979, partielle (1 595,1659 €), à 2008, 0,00305 × 168 552,9726 = 514,0866 €, 565,79 €
    par an de trop ; de 1980 à 2009, 0,00305 × 176 081,2970 = 537,0480 €, 542,83 € ; de
    1979 à 2009, 0,00305 × 177 676,4629 = 541,9132 €, 537,96 € : au moins 537,96 € par
    an. AVANT 2023 : l'alinéa se relit au Journal officiel, par différence, depuis 2007,
    avec un décompte renvoyé à l'article 3.6, non lu ; deux erreurs neuves en naissent,
    de 2008 à 2012 et de 2013 à 2022 (`surcote_par_age_seul`, `sources.a_relire`, E11).
    En 2007, un point non tranché (E12, après R-E12) : l'arrêté du 3 octobre 2006
    (JORFARTI000002050100) approuve la troisième partie des statuts « ainsi que les
    dispositions transitoires », et abroge l'arrêté de 1979 « à compter du 1er janvier
    2007, à l'exception de l'article 16 et de l'article 17, alinéa 2, qui seront abrogés
    le 1er janvier 2008 », tous au seul Bulletin officiel (question 22), qui peuvent régler
    le report de 2007 ; avant 2007, les statuts de 1979, au même Bulletin.
  - >-
    La dispense des deux premières années d'exercice de la CARMF, servie depuis le
    14 novembre 2026 (`effet`), et ce qu'elle laisse. Le texte : depuis le 1er juillet
    2026, l'article 4 du décret n° 49-579 (décret n° 2026-418, article 3,
    JORFARTI000054153420 ; LEGIARTI000054168136) écrit « Tout médecin obligatoirement
    affilié à la caisse est dispensé du paiement de la cotisation afférente au présent
    régime pendant les deux premières années d'exercice de la profession libérale si cet
    exercice débute alors qu'il n'a pas atteint l'âge de 40 ans », et l'article 4-1, II
    (LEGIARTI000054168116) : « Les cotisations ou fractions de cotisations ayant fait
    l'objet d'une dispense au titre des I à III de l'article 4 ne donnent pas lieu à
    acquisition de points ». Quatre limites, déclarées. (a) Les cotisations de 2026 et
    d'avant ne sont pas dispensées : avant le 1er juillet 2026, la dispense tenait aux
    statuts (article 4 d'alors, LEGIARTI000050865157), non lus (question 22) ; le
    médecin installé en 2025 ou en 2026 cotise au modèle toute l'année 2026, quand le
    second semestre au moins en est dispensé. (b) « Les deux premières années
    d'exercice » : le texte ne dit pas si ce sont vingt-quatre mois ou deux années
    civiles ; le modèle dispense l'année civile du début et la suivante, que les deux
    lectures dispensent, et fait cotiser la troisième en entier, dont les premiers
    mois seraient dispensés sous la lecture des vingt-quatre mois, pour un début en
    cours d'année. (c) L'exercice débute au premier jour du mois d'entrée dans le
    statut de médecin libéral, secteur 1 ou secteur 2 ; l'exercice libéral d'une autre
    profession, avant, n'est pas compté. (d) Une faculté, sur demande, que le modèle
    ne porte pas : l'article 4-2, I (LEGIARTI000054168114) ouvre au rachat « un point
    par trimestre d'exercice en qualité de non salarié, antérieur au 1 er juillet 1949
    ou trimestre assimilé dans les conditions prévues à l'article 4-4 ou trimestres
    ayant donné lieu à dispense dans les conditions prévues au I de l'article 4 » ; le
    modèle simule le médecin qui ne rachète pas. Au compte notionnel, la cotisation
    dispensée n'est pas portée, sauf sous le taux commun de la proposition, que le
    droit en vigueur ne règle pas.
  - >-
    L'exemption de la CARMF passé 75 ans, servie depuis le 14 novembre 2026 (`effet`),
    et ce qu'elle laisse. Le texte, relu à l'index LEGI le 14 novembre 2026 : le même
    article 4, II (LEGIARTI000054168136) : « Tout médecin qui continue d'exercer en
    qualité de non salarié est exempté du versement de la cotisation à partir du premier
    jour du semestre civil qui suit son soixante-quinzième anniversaire », sans points
    (article 4-1, II). Le semestre qui suit l'anniversaire s'ouvre le 1er juillet de son
    année ou le 1er janvier de la suivante : le modèle exempte les années civiles
    d'après celle de l'anniversaire, que toute lecture exempte. Née le 1er janvier 1951,
    médecin libérale au double du salaire moyen depuis 30 ans, pension à 76 ans et
    6 mois (1er juillet 2027) : le semestre de 2027 (5 154,8634 € de cotisation
    revalorisée) n'est plus cotisé, (324 443,6335 − 5 154,8634) × 0,0448 × 1,30 =
    18 595,38 € au lieu de 18 895,60 €. Limites déclarées. (a) Le second semestre de
    l'année d'un anniversaire tombé au premier semestre reste cotisé : le texte ne dit
    pas si la cotisation, annuelle (article 2), se partage au semestre, comme le IV du
    même article le fait d'une « cotisation semestrielle », et l'article 3 renvoie son
    versement aux statuts, non lus ; au cas posé, la moitié des 10 239,2845 € de 2026,
    298,17 € par an de trop encore si elle se partage. (b) Les cotisations de 2026 et
    d'avant ne sont pas exemptées : avant le 1er juillet 2026, les rédactions de
    l'article 4 ne disaient rien de l'exemption, qui tenait, si elle existait, aux
    statuts, non lus (question 22) ; ni l'index LEGI ni celui du JORF ne la portent
    avant le décret n° 2026-418. (c) La faculté de l'article 4-3
    (LEGIARTI000054168112) n'est pas portée : « Tout médecin qui continue d'exercer en
    qualité de non salarié et qui n'est plus tenu de cotiser à titre obligatoire, à
    partir du premier jour du semestre civil qui suit son soixante-quinzième
    anniversaire, peut continuer à cotiser volontairement, quel que soit son âge. » ;
    le modèle simule le médecin qui ne cotise pas volontairement. (d) La fiche de paie
    du site, qui ne connaît ni l'âge ni le début d'exercice, prélève la cotisation du
    médecin que rien ne dispense. Au compte notionnel, la cotisation exemptée n'est pas
    portée, sauf sous le taux commun de la proposition, que le droit en vigueur ne
    règle pas.
  - >-
    La dispense de la part proportionnelle des deux premières années civiles de la
    CARCDSF, servie depuis le 14 novembre 2026 (`effet`), et ce qu'elle laisse. Le
    texte : depuis le 1er juillet 2026, l'article 3-1 du décret n° 50-28 (décret
    n° 2026-418, article 5, JORFARTI000054153467 ; LEGIARTI000054168193) écrit « Les
    nouveaux affiliés sont dispensés de la cotisation proportionnelle au titre des deux
    premières années civiles de leur exercice et peuvent, sur demande écrite, bénéficier
    également d'une dispense de la cotisation forfaitaire », et l'article 3-5
    (LEGIARTI000054168184) : « Les dispenses ou réductions partielles mentionnées aux
    articles 3-1 à 3-4 entraînent respectivement la suppression ou la réduction des
    droits correspondants ». Avant, les statuts approuvés par l'arrêté du 13 avril 2011
    (JORFTEXT000023909782), en vigueur le 1er juillet 2011, que l'index LEGI porte en
    quatre rédactions : article 11 (LEGIARTI000023910336, puis LEGIARTI000026210162 du
    22 juillet 2012), « Les nouveaux adhérents sont dispensés de la cotisation
    proportionnelle au titre des deux premières années civiles de leur exercice et
    peuvent, sur demande écrite, bénéficier également d'une dispense de la cotisation
    forfaitaire », et article 16, « Les dispenses ou réductions partielles visées aux
    articles 11 à 15 entraînent respectivement la suppression ou la réduction des droits
    correspondants » ; articles 13 et 18, « Les nouveaux affiliés », depuis le
    25 décembre 2017 (LEGIARTI000036540562, puis LEGIARTI000036621382 du 10 février
    2018). Cinq limites, déclarées. (a) L'année 2011 n'est pas dispensée : les statuts
    approuvés par l'arrêté du 1er octobre 2007 (LEGIARTI000023450470, du 11 octobre 2007
    au 1er juillet 2011), article 11, ne dispensaient que sur demande, « Les nouveaux
    adhérents peuvent être, sur demande écrite, dispensés des cotisations forfaitaires
    et proportionnelles pendant les deux premières années civiles de leur exercice et
    des cotisations forfaitaires les trois années civiles suivantes », et rien ne dit
    comment la caisse a traité, au second semestre de 2011, la cotisation d'une première
    année déjà appelée ; le modèle dispense 2012, deuxième année civile de l'installé de
    2011, et le fait cotiser en 2011. Avant le 11 octobre 2007, les statuts, au seul
    Bulletin officiel, ne sont pas lus. (b) La dispense de la cotisation forfaitaire,
    sur demande écrite, n'est pas portée : le modèle simule l'affilié qui ne la demande
    pas, et lui sert les six points du forfait. (c) Le rachat des points non cotisés
    (article 3-7, I, LEGIARTI000054168176 ; statuts de 2011, article 26), sur demande,
    de la sixième à la quinzième année d'affiliation, ne vise que « les points
    forfaitaires », et n'est pas porté. (d) L'exercice débute au premier jour du mois
    d'entrée dans un statut que la caisse affilie (chirurgien-dentiste ou sage-femme) ;
    l'article 2 (LEGIARTI000054168195) fait prendre effet à l'affiliation « au premier
    jour du trimestre civil suivant le début […] de l'activité professionnelle », ce
    que le modèle ne confronte pas : pour un début au dernier trimestre, l'année civile
    de l'exercice précède celle de la première cotisation, et le modèle dispense les
    deux années civiles de l'exercice, comme le texte l'écrit. (e) Celui qui cesse puis
    reprend n'est pas un nouvel affilié : le modèle ne dispense que depuis la première
    entrée. Au compte notionnel, la part dispensée n'est pas portée, sauf sous le taux
    commun de la proposition, que le droit en vigueur ne règle pas.
  - >-
    Avant le 1er juillet 2026, les dispenses de la CARMF et de la CARCDSF : un point non
    tranché, dont la question 22 du propriétaire part de deux articles des décrets (E11,
    après R-E11 ; `docs/feuille_de_route/130/2026-11-03-decisions-du-proprietaire.md` est
    un récit, que E11 ne récrit pas). Décret n° 49-579, article 4, du 27 août 1996 au
    30 décembre 2024 (LEGIARTI000006781644), puis jusqu'au 1er juillet 2026
    (LEGIARTI000050865157) : « Des dispenses de cotisations peuvent être accordée aux
    adhérents impécunieux et aux professionnels âgés de moins de quarante ans lors de
    leur affiliation, dans les conditions prévues par les statuts mentionnés à l'article
    5 du présent décret. » ; rien sur l'exemption après 75 ans. Décret n° 50-28,
    article 2, du 14 novembre 2025 au 1er juillet 2026 (LEGIARTI000052567910) : « Les
    statuts fixent les conditions dans lesquelles des exonérations, des dispenses, des
    réductions ou des reports de cotisations peuvent être accordés dans les premières
    années d'activité professionnelle, en cas d'insuffisance de revenus, d'incapacité
    d'exercice ou de maternité. » ; du 24 septembre 1981 au 4 août 1982
    (LEGIARTI000006760429) : « Les statuts fixent également les conditions dans
    lesquelles des exonérations ou des dispenses de cotisations peuvent être accordées
    dans les premières années d'activité professionnelle ou en cas d'infortune ou
    d'incapacité d'exercice de la profession ». Le principe est au décret, ses
    conditions aux statuts. Pour la CARCDSF, le point est tranché depuis le 14 novembre
    2026 : l'index LEGI porte les statuts de 2007 et de 2011, et la dispense des
    nouveaux affiliés y est de droit depuis le 1er juillet 2011 (ligne ci-dessus). Pour
    la CARMF, il reste entier : ses statuts ne sont qu'au Bulletin officiel.
  lectures:
  - type: jorf
    reference: >-
      décret n° 2026-418, lu en partie dans l'index JORF le 22 septembre 2026 (articles
      sur l'ASV des auxiliaires médicaux, les rachats de la CARMF)
    date: 2026-09-22
  - type: jorf
    reference: >-
      décret n° 2026-418, articles 3, 4, 5, 6, 16 et 25 (CARMF, CAVP, CARCDSF, CARPV,
      ASV des médecins, CARPIMKO), lus en entier dans l'index JORF : une codification
      — affiliation, dispenses, rachats, classes, cotisations volontaires — qui
      ne change aucun des paramètres que les fiches portent
    date: 2026-09-23
  - type: jorf
    reference: >-
      décret n° 2026-418, articles 8 (CAVEC), 13 (CAVAMAC), 20 et 21 (Cipav), lus
      en entier dans l'index JORF : pour la CAVEC et la CAVAMAC, affiliation, option
      pour la classe supérieure, exonérations, rachats, cotisation de fin de carrière,
      et le renvoi des conditions de service à un règlement ; pour la Cipav, les
