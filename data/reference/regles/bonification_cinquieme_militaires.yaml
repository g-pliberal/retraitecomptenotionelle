- id: loi_du_30_octobre_1975
  statut: supposee
  hypothese: >-
    la loi n° 75-1000 du 30 octobre 1975 crée le i de L. 12, que l'index ne garde que
    dans sa rédaction du 14 juillet 1982 ; on prête à ses sept premières années la règle
    de cette rédaction — à tous les militaires, quinze ans de services, le maximum à
    cinquante-cinq ans, une annuité de moins par année servie au-delà, rien au-delà de
    cinquante-huit —, que le rapport d'information du Sénat n° 236 (2007-2008) date de
    la « création, relativement récente (1975) » : « A partir de 56 ans, la
    bonification était diminuée d'une annuité, puis de deux, puis de trois […]. Au-delà
    de 58 ans tous les avantages conférés par cette bonification étaient totalement
    annulés ». Le projet de loi, que le rapport n° 6 du Sénat (1975-1976) transcrit en
    son article 3, la réservait aux officiers de gendarmerie et aux militaires dont la
    limite d'âge de grade était inférieure à cinquante-huit ans, sans dégressivité : le
    texte voté n'est pas relu. La date d'effet est celle du lendemain de la publication
    de la loi au Journal officiel du 31 octobre 1975, faute d'en avoir lu une autre.
