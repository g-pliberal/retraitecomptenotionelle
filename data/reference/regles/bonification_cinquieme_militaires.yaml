effet: >-
  Le militaire qui réunit dix-sept ans de services, quinze avant juillet 2011 : vingt
  trimestres à qui en a servi vingt-cinq, soit un cinquième de pension en plus au
  sous-officier radié à quarante-quatre ans, et jusqu'à 80 % de taux à l'officier de
