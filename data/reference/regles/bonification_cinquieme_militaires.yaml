approximations:
- version: [loi_de_finances_pour_1972]
  ecart: >-
    La loi de finances pour 1972 réserve la bonification aux militaires dont la limite
    d'âge est, au 1er janvier 1972, inférieure à cinquante-huit ans, et aux officiers de
    gendarmerie, officiers généraux exclus ; elle ne compte pas l'année où une autre
    bonification atteint le cinquième de sa durée. Le modèle, qui ne saisit ni le grade
    ni les autres bonifications, la sert à tout militaire.
  effet: non mesuré ; les officiers à limite d'âge haute partis de 1972 à 1975 reçoivent trop
- version: [loi_de_finances_pour_1972, loi_du_30_octobre_1975, redaction_du_14_juillet_1982,
            loi_du_21_aout_2003, loi_du_9_novembre_2010, loi_du_14_avril_2023]
  ecart: >-
    Les services militaires sont les années servies dans les deux statuts militaires :
    le service national accompli avant l'engagement, les congés de longue durée et de
    longue maladie, assimilés depuis 2015, et les services de réserve, comptés depuis
    2018, n'y entrent pas. La bonification se compte en trimestres, un demi-trimestre
    et plus comptant pour un, et non en jours ajoutés aux services avant le décompte
    final (R. 26).
  effet: non mesuré ; un trimestre au plus, sauf au militaire venu du service national
- version: [loi_de_finances_pour_1972, loi_du_30_octobre_1975, redaction_du_14_juillet_1982,
            loi_du_21_aout_2003, loi_du_9_novembre_2010]
  ecart: >-
    Jusqu'en août 2023, la bonification ne va qu'au militaire, et non à l'ancien
    militaire qui liquide une pension civile : le modèle l'entend de la dernière année
    des services du code des pensions, servie ou non dans un statut militaire. Le
    militaire de dix-sept ans devenu fonctionnaire civil touche au droit sa pension
    militaire dès sa radiation, bonification comprise, à moins d'y renoncer pour la
    fondre dans sa pension civile ; le modèle ne liquide qu'une pension du code, à son
    départ, et la lui retire donc. Le policier devenu militaire, qui jusqu'alors ne
    cumule pas les deux bonifications, garde la sienne et reçoit l'autre.
  effet: non mesuré ; touche le militaire devenu fonctionnaire civil de l'État
- version: [loi_de_finances_pour_1972, loi_du_30_octobre_1975, redaction_du_14_juillet_1982,
            loi_du_21_aout_2003, loi_du_9_novembre_2010, loi_du_14_avril_2023]
  ecart: >-
    La radiation des cadres pour infirmités, qui ouvre la bonification sans la durée de
    services, n'est pas portée : le modèle ne connaît pas la radiation du militaire
    (fiche retraite_pour_invalidite_fonction_publique). La pension afférente au grade
    supérieur, où le service des retraites de l'État ne la prend en compte que « dans
    la limite de 75 % », ne l'est pas non plus.
  effet: non mesuré
