schema_version: 1
id: bonification_cinquieme_militaires
intitule: >-
  Bonification du cinquième du temps de service des militaires (L. 12, i) : un an
  pour cinq ans de services militaires, cinq annuités au plus, à qui en a servi quinze,
  dix-sept depuis juillet 2011 ; aux services liquidés au-delà du pourcentage maximum,
  jusqu'à 80 % ; diminuée d'une annuité par année servie au-delà de cinquante-cinq ans,
  puis cinquante-sept, puis cinquante-neuf, et nulle au-delà de cinquante-huit, puis
  soixante, puis l'âge légal, jusqu'en août 2023 ; aux anciens militaires depuis
  septembre 2023, dans la limite de vingt trimestres avec celles des emplois classés.
domaine: duree
regimes:
- fonction_publique_etat
etape: compter_les_durees
face: droit
etat: approchee
lit:
- les années servies dans les statuts militaire et militaire_officier, et celles de
  services du code des pensions, jusqu'à la liquidation
- le mois de naissance et le jour, pour les services accomplis au-delà des âges qui
  réduisent et suppriment la bonification
- l'âge légal de la génération (legislation/age_ouverture_requis.csv), de juillet 2011
  à août 2023
- liquidation.date_effet
ecrit:
- les trimestres de bonification, aux services liquidés de la fonction publique de
  l'État, au-delà du pourcentage maximum, et à la durée d'assurance (Durees.emplois)
dates_qui_decident:
- liquidation.date_effet
# Les paramètres que le moteur lit (droit/compter.py, `trimestres_des_emplois`, et
# son jumeau) sont ceux des bonifications des emplois classés, et trois de plus.
# La condition `duree_dans_l_emploi` lit les années servies dans les statuts de la
# fiche (`annees_dans_l_emploi`) et, si `en_fonction`, exige que la dernière année
# des services du code des pensions (`services_comptes`) soit servie dans l'un
# d'eux : le militaire à la liquidation, jusqu'en août 2023. Les services accomplis
# au-delà de `age_de_reduction` se comptent au mois, depuis le premier mois vécu
# entier à cet âge, et retirent une annuité par année entière quand
# `reduction_par_annee_entiere` ; au-delà de `age_de_suppression` — un âge, ou
# `age_legal`, l'âge de L. 161-17-2 à la génération —, il n'y a plus de bonification.
# `au_dela_du_maximum` : les bonifications de L. 12 portent le pourcentage à 80 %
# (L. 14 jusqu'en 2003, L. 12 et L. 13 depuis) ; celle de la loi de finances pour 1972,
# qui n'est pas de L. 12, ne le fait pas.
