    soixante ans complètent encore la période d'avant soixante ans ; dans la base de la
    Cnav, la circulaire n° 171 du 30 mai 1947.
  - >-
    Relire la colonne de revalorisation à chaque 1er janvier (cnav_revalorisation_salaires.py).
