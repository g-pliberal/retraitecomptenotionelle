schema_version: 1
id: salaire_annuel_moyen
intitule: >-
  Vingt-cinq meilleures années (dix à vingt-cinq par génération de 1934 à 1948),
  salaires revalorisés par les coefficients de la circulaire annuelle, année du
  départ exclue, plafond proratisé.
etat: conforme
etape: liquider_chaque_regime
effet: Toute pension en annuités du privé.
sources:
  lu_le: 2026-09-17
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Relire la colonne de revalorisation à chaque 1er janvier (cnav_revalorisation_salaires.py).
  - >-
    R. 173-4-3, de 2004 à 2025 (LEGIARTI000022287439, LEGIARTI000038790394) : le
    polypensionné du régime général, des salariés agricoles et des indépendants que la
    liquidation unique ne réunit pas — né avant 1953, ou parti avant le 1er juillet
    2017 — retient dans chaque régime le nombre d'années « multipli[é] par le rapport
    entre la durée d'assurance accomplie au sein de ce régime et le total des durées »,
    arrondi au plus proche sans descendre sous un ; le moteur lui en donne vingt-cinq
    dans chacun. À porter.
  lectures:
  - type: circulaire_cnav
    reference: circulaire de revalorisation des salaires, colonne au 1er janvier
      2026
    date: 2026-01-01
  - type: legifrance
    reference: R. 173-3-2 CSS, LEGIARTI000054059837
    date: 2026-09-01
textes_a_rattacher:
- reference: R. 351-29 CSS
- reference: R. 173-3-2 CSS (nombre d'années, depuis le décret n° 2025-1409)
- reference: R. 351-29-1 CSS (générations d'avant 1948)
exemples:
- sp_f21552_taux_plein_170
code:
  interrupteurs:
    salaire_reference_par_generation: true
  moteur: >-
    `salaire_reference_par_generation` : le nombre d'années retenues au salaire annuel
    moyen est lu dans `legislation/annees_salaire_reference.csv` à l'ANNÉE DE NAISSANCE
    : dix à vingt-cinq années, une par génération, de 1934 à 1948 (loi du 22 juillet 1993).
    Ne vaut que pour un `salaire_reference` en meilleures années. Depuis 2026, l'assuré
    qui a aussi été exploitant agricole n'en retient que la part que la première
    répartition de R. 173-3-2 laisse aux régimes alignés
    (`liquider.annees_des_regimes_alignes`, fiche pension_non_salaries_agricoles_2026).
