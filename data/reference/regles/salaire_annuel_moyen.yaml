      »
    lu_le: 2026-10-05
  - id: LEGIARTI000053335651
    article: R. 351-29 CSS
    en_vigueur: 2026-01-01
    lu_le: 2026-10-05
  - id: LEGIARTI000053327980
    article: R. 351-39 CSS
    en_vigueur: 2026-01-01
    citation: >-
      « Pour les assurés dont les pensions n'ont pas pris effet au 1er janvier 2026 alors
      qu'à cette date ils avaient plus de soixante-quinze ans ou avaient été assurés au
      titre de périodes antérieures de plus de soixante ans, demeurent applicables les
