  nee_de: JORFARTI000001474532
  textes:
  - id: JORFARTI000001474532
    reference: >-
      décret n° 2004-144 du 13 février 2004, article 8 : « Les dispositions du présent
      décret s'appliquent aux pensions prenant effet postérieurement au 31 décembre 2003 »
    publie_le: 2004-02-15
    lu_le: 2026-10-05
  - id: LEGIARTI000006750042
