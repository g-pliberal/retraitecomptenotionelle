reformes: [sam_avant_la_liquidation_1948, sam_dix_meilleures_annees_1973,
           sam_moyenne_annuelle_1995, sam_annees_validantes_2004]
effet: >-
  Toute pension en annuités du régime général et des salariés agricoles. Depuis 2004, une
  année de petit salaire qui ne valide aucun trimestre ne tire plus vers le bas la
  moyenne de qui a moins d'années que le nombre retenu ; avant juillet 1995, une année
  incomplète compte pour ses trimestres et non pour une année entière ; avant 1973, la
  moyenne est celle des dix dernières années, non des dix meilleures. Le polypensionné du
  régime général, des salariés agricoles et des artisans et commerçants que la
  liquidation unique ne réunit pas — né avant 1953, ou parti avant le 1er juillet 2017 —
  retient depuis 2004 dans chaque régime la part des années que leurs durées lui donnent
  (R. 173-4-3). Les deux exemples de la circulaire Cnav n° 2004/29 sont rendus.
