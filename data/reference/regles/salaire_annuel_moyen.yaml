schema_version: 1
id: salaire_annuel_moyen
intitule: >-
  Le salaire annuel moyen du régime général et des régimes qui en suivent les règles : les
  dix dernières années d'assurance avant soixante ans, ou avant l'entrée en jouissance
  quand c'est plus avantageux, jusqu'en 1972 ; les dix meilleures années depuis 1973,
  vingt-cinq par génération de 1934 à 1948 ; rapportées à leurs trimestres jusqu'en juin
  1995, à leur nombre ensuite ; sans les années qui ne valident aucun trimestre depuis
  2004 ; salaires revalorisés par la colonne de la Cnav en vigueur à la date d'effet,
  année du départ exclue, plafond proratisé.
domaine: salaire_de_reference
regimes: [regime_general, msa_salaries, cavimac]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- les salaires portés au compte du régime chaque année civile avant celle de l'effet,
  assiette de l'assurance vieillesse des parents au foyer comprise, écrêtés au plafond de
  l'année proratisé sur ses mois
- les trimestres que chaque année valide au régime, cotisés et assimilés
- la colonne de revalorisation de la Cnav en vigueur à la date d'effet
  (legislation/revalorisation_salaires.csv et revalorisation_salaires_anciennes.csv)
- l'année de naissance, pour le nombre d'années retenues
  (legislation/annees_salaire_reference.csv) et, avant 1973, pour l'année des soixante ans
ecrit:
- le salaire annuel moyen du régime, en euros de l'année de l'effet
dates_qui_decident:
- liquidation.date_effet
versions:
- id: dix_dernieres_annees_avant_soixante_ans
  statut: lue
  textes:
  - reference: >-
      ordonnance n° 45-2454 du 19 octobre 1945, article 71, § 1er, telle que la base de
      législation de la Cnav la donne (ORD_452454_19101945) : « le salaire annuel moyen
      correspondant aux cotisations versées au cours des dix dernières années d'assurance
      accomplies avant l'âge de soixante ans »
    lu_le: 2026-10-05
  - reference: >-
      circulaire ministérielle n° 151 du 5 août 1946 (CR_MIN_151_05081946) : « en tenant
      compte seulement des cotisations des dix dernières années d'assurance avant 60 ans »
    lu_le: 2026-10-05
  - reference: >-
      circulaire ministérielle n° 143 SS du 29 juin 1949 (CR_MIN_143SS_29061949), 3° :
      pas de salaire des années « qui comportent deux trimestres ou plus de périodes
      assimilées » (article 74, § 7, du décret du 29 décembre 1945) ; avec un seul, « le
      salaire perçu pendant trois trimestres est retenu comme salaire annuel » ; « le
      dénominateur de la formule [...] peut se trouver ramené à un nombre inférieur à 40 »
    lu_le: 2026-10-05
  bornes:
    liquidation.date_effet: [null, 1948-07-01]
  contenu:
    droit: >-
      la moyenne des salaires des quarante trimestres d'assurance valables qui précèdent
      les soixante ans, rapportée à ces trimestres ; sans les années qui comptent deux
      trimestres assimilés ou plus
    parametres:
      selection: dernieres
      avant_la_liquidation: false
      calcul: trimestriel
      trimestres_comptes: cotises
      annees_assimilees_exclues: true
      annees_sans_trimestre: retenues
  exemples: aucun trouvé
- id: dix_dernieres_annees_1948
  statut: lue
  textes:
  - reference: >-
      circulaire ministérielle n° 143 SS du 29 juin 1949 (CR_MIN_143SS_29061949), 2° : la
      loi du 23 août 1948 « prévoit que ledit salaire peut aussi être calculé d'après les
      cotisations versées au cours des dix dernières années d'assurance accomplies avant
      l'âge servant de base à la liquidation si ce mode de calcul est plus avantageux » ;
      « ce sont les quarante trimestres d'assurance valables précédant la date retenue pour
      l'entrée en jouissance », pour une « entrée en jouissance [...] fixée au 1er juillet
      1948 ou à une date postérieure »
    lu_le: 2026-10-05
  - reference: >-
      circulaire ministérielle n° 211 SS du 27 décembre 1950 (CR_MIN_211SS_27121950),
      point 13, et n° 20 SS du 6 février 1961 (CR_MIN_20SS_06021961) : « la moyenne des
      dix dernières années avant la liquidation »
    lu_le: 2026-10-05
  bornes:
    liquidation.date_effet: [1948-07-01, 1973-01-01]
  contenu:
    droit: >-
      la plus avantageuse de deux moyennes trimestrielles : celle des quarante trimestres
      d'avant les soixante ans, celle des quarante trimestres d'avant l'entrée en
      jouissance
    parametres:
      selection: dernieres
      avant_la_liquidation: true
      calcul: trimestriel
      trimestres_comptes: cotises
      annees_assimilees_exclues: true
      annees_sans_trimestre: retenues
  exemples: aucun trouvé
- id: dix_meilleures_annees_1973
  statut: lue
  nee_de: JORFTEXT000000693828
  textes:
  - id: JORFTEXT000000693828
    reference: >-
      décret n° 72-1229 du 29 décembre 1972, lu dans la base de législation de la Cnav
      (DEC_721229_29121972) : l'article 343 du code est abrogé ; « le salaire annuel moyen
      correspondant aux cotisations versées au cours des dix années civiles d'assurance
      accomplies postérieurement au 31 décembre 1947 dont la prise en considération est la
      plus avantageuse pour l'assuré » (article 2) ; « aux pensions prenant effet à compter
      du 1er janvier 1973 » (article 5)
    publie_le: 1972-12-30
    lu_le: 2026-10-05
  - id: LEGIARTI000006750038
    article: R. 351-29 CSS
    en_vigueur: 1985-12-21
    lu_le: 2026-10-05
  - reference: >-
      circulaire Cnav n° 1/73 du 3 janvier 1973 (CR_CN_173_03011973) : l'année civile
      d'assurance est « toute année civile au cours de laquelle l'assuré a cotisé même si
      le montant du salaire correspondant est inférieur au minimum prévu pour valider un
      trimestre et même si l'année civile comporte un ou plusieurs trimestres assimilés »,
      celles qui n'ont que des périodes assimilées « doivent être négligées » ; le salaire
      annuel moyen « est ensuite calculé sur la base des salaires revalorisés et du nombre
      de trimestres correspondants (y compris les trimestres assimilés) »
    lu_le: 2026-10-05
  bornes:
    liquidation.date_effet: [1973-01-01, 1995-07-01]
  contenu:
    droit: >-
      les dix meilleures années après 1947, vingt-cinq par génération depuis 1994, choisies
      sur leurs salaires revalorisés ; la somme de leurs salaires rapportée à leurs
      trimestres, assimilés compris, et multipliée par quatre ; une année dont le salaire
      ne valide aucun trimestre compte, sans trimestre
    parametres:
      selection: meilleures
      avant_la_liquidation: false
      calcul: trimestriel
      trimestres_comptes: cotises_et_assimiles
      annees_assimilees_exclues: false
      annees_sans_trimestre: retenues
  exemples: aucun trouvé
- id: moyenne_des_salaires_annuels_1995
