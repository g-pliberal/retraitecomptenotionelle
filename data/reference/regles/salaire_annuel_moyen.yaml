    parametres:
      selection: meilleures
      avant_la_liquidation: false
      calcul: annuel
      trimestres_comptes: cotises_et_assimiles
      annees_assimilees_exclues: false
      annees_sans_trimestre: retenues
  exemples: aucun trouvé
