    en_vigueur: 2004-01-01
    citation: >-
      « Les cotisations et salaires servant de base au calcul des pensions sont
      revalorisés chaque année par application du coefficient annuel de revalorisation
      mentionné à l'article L. 161-23-1 »
    lu_le: 2026-11-20
  - id: LEGIARTI000031688444
    article: L. 351-11 CSS
    en_vigueur: 2015-12-23
    lu_le: 2026-11-20
  - reference: >-
      circulaire Cnav n° 2004/27 du 24 juin 2004 (CR_CN_2004027_24062004) : « L'année
      civile comportant un salaire qui ne valide pas un trimestre d'assurance n'est pas
      retenue pour le calcul du salaire annuel moyen », pour les pensions prenant effet
      depuis le 1er janvier 2004 ; exposés « Revenu annuel moyen » et « Nombre d'années
      retenues » de la base de législation (ancienne disposition « Avant le 01/01/2004 »)
    lu_le: 2026-10-05
  bornes:
    liquidation.date_effet: [2004-01-01, null]
  contenu:
    droit: >-
      la moyenne des salaires annuels revalorisés des meilleures années, parmi celles dont
      le salaire valide au moins un trimestre au sens de R. 351-9 ; les années d'avant
      1948 ne sont prises qu'à défaut d'assez d'années postérieures, « en remontant à
      partir de cette date » (troisième alinéa du I jusqu'en 2025, que R. 351-39 garde
      depuis 2026 à qui a des périodes de plus de soixante ans) ; l'année de l'entrée en
      jouissance n'y entre pas (I, C, 2° depuis 2026, pratique de la caisse avant)
    parametres:
      selection: meilleures
      derniere_annee_a_defaut: 1947
      avant_la_liquidation: false
      calcul: annuel
      trimestres_comptes: cotises_et_assimiles
      annees_assimilees_exclues: false
      annees_sans_trimestre: exclues
  exemples:
  - sp_f21552_taux_plein_170
approximations:
- version: [dix_dernieres_annees_avant_soixante_ans, dix_dernieres_annees_1948]
  ecart: >-
    des années civiles, et non les quarante trimestres qui précèdent les soixante ans ou
    l'entrée en jouissance : les dix dernières années de salaire d'avant l'année des
    soixante ans, et d'avant l'année de l'effet
  effet: non mesuré
- version: dix_dernieres_annees_1948
  ecart: >-
    une année d'un seul trimestre assimilé compte ses trimestres cotisés, sans
    reconstituer le salaire de trois trimestres. Les trimestres d'après soixante ans ne
    complètent pas la période d'avant soixante ans : la circulaire n° 143 SS garde les
    instructions de la circulaire n° 151, qui le font, mais la rédaction de l'article 74
    du décret n° 49-328 n'est pas lue ; la période d'avant l'entrée en jouissance les
    prend, les dernières et non les premières
  effet: non mesuré
- version: dix_dernieres_annees_avant_soixante_ans
  ecart: >-
    une année en partie assimilée compte son salaire réel rapporté à ses trimestres
    cotisés, ses trimestres assimilés neutralisés, comme le veut la circulaire n° 246 à
    compter du 25 août 1947 ; une année toute assimilée, sans salaire, n'est pas retenue.
    Avant, la circulaire n° 151 donnait aux périodes assimilées le salaire fictif de
    l'arrêté du 14 mai 1946, que le dépôt n'a pas lu, et la neutralisation du modèle ne
    rallonge pas la période pour retrouver quarante trimestres cotisés. Le dénominateur de la
    circulaire n° 151, « toujours 10 » années, n'est pas suivi : la somme se rapporte aux
    trimestres retenus, ce qui ne change rien à qui réunit quarante trimestres. Le
    complément d'après soixante ans se prend par années civiles entières, l'année des
    soixante ans d'abord, jusqu'à couvrir les trimestres qui manquent aux quarante ;
    ceux d'avant soixante ans se comptent jusqu'à la fin de l'année qui précède celle des
    soixante ans, assurances sociales de 1930 à 1944 comprises, dont les salaires
    entrent à la moyenne revalorisés par les coefficients de la circulaire n° 151
    (fiche sam_annees_d_avant_1947). L'arrêté du
    9 septembre 1946 et la circulaire n° 171 du 30 mai 1947 (salaire fictif des périodes
    de guerre de l'article 77) ne sont pas lus
  effet: non mesuré
- version: [dix_dernieres_annees_avant_soixante_ans, dix_dernieres_annees_1948,
            dix_meilleures_annees_1973]
  ecart: >-
    les trimestres auxquels la somme des salaires est rapportée sont ceux que le modèle
    valide : au seuil de R. 351-9 depuis 1946 (fiche trimestres_avant_1972), quatre par
    année travaillée avant, et au plus ce que les mois de la ligne permettent
  effet: non mesuré
