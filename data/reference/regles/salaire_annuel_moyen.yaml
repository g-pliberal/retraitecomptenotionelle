    colonneDeRevalorisationEnVigueur
  parametres: >-
    contenu.parametres de chaque version : selection, derniere_annee_a_defaut,
    avant_la_liquidation, apres_soixante_ans_a_defaut, calcul,
    trimestres_comptes, annees_assimilees_exclues, annees_sans_trimestre ;
    legislation/annees_salaire_reference.csv
  tests: >-
    tests/test_simulateur.py et tests/js/moteur.test.js : chaque version rejouée sur une
    carrière à la main, dans les deux moteurs
  moteur: >-
    `regles_du_salaire_annuel_moyen` : le moteur lit la version de la date d'effet — quelles
    années, comment les moyenner, lesquelles écarter — et l'applique aux salaires
    revalorisés de chaque année. `salaire_reference_par_generation` : le nombre d'années
    retenues est lu dans `legislation/annees_salaire_reference.csv` à l'ANNÉE DE NAISSANCE
    : dix à vingt-cinq années, une par génération, de 1934 à 1948 (loi du 22 juillet 1993).
    Ne vaut que pour un `salaire_reference` en meilleures années.
    `liquider.annees_des_regimes_alignes` (`anneesDesRegimesAlignes`) partage ce nombre
    quand d'autres régimes le partagent : depuis 2004, entre régimes alignés que la
    liquidation unique ne réunit pas, au prorata de leurs durées, celles des artisans et
    commerçants depuis 1973, arrêtées au dernier jour du trimestre civil qui précède la
    date d'effet (R. 173-4-3, `liquider.annees_au_prorata`) ; depuis 2026,
    avec les exploitants agricoles, puis, pour qui est né avant 1953, entre régimes
    alignés (R. 173-3-2, fiche pension_non_salaries_agricoles_2026). Le détail de la
    pension dit le nombre retenu et l'article.
referents:
  openfisca_france_pension:
    equivalent: >-
      regime_general_cnav_salaire_de_reference : écarte depuis 2004 les années qui ne
      valident aucun trimestre, comme R. 351-29 ; ne rapporte jamais les salaires aux
      trimestres
    confrontation: >-
      le 16 octobre 2026 (action 153, étape 2 ; tests/test_oracle_salaire_annuel_moyen.py),
      douze carrières à salaires variables liquidées de 1994 à 2017 : rejouée sous les
      coefficients et le plafond du dépôt, sa règle rend notre salaire au centime — les
      meilleures années, l'écrêtement, l'exclusion, le nombre par génération. Ses écarts
      sont les siens : des coefficients composés d'une série annuelle, le plafond de
      janvier en 1960 et 1961, la moyenne annuelle avant juillet 1995 (registre)
  calcul_pension: écarte les années sans trimestre cotisé depuis 2004, comme R. 351-29
  trajectoire:
    equivalent: >-
      calculeSam (R/fonctionsCalculsPensions.R:2038-2135), la série revaloSam enchaînée
      jusqu'à l'année de la liquidation comprise
    confrontation: >-
      le 5 octobre 2026, TRAJECTOiRE exécuté à part (tests/test_trajectoire.py) : refait
      sur les années de chaque cas, le salaire annuel moyen du dépôt est celui des
      colonnes de la Cnav, au millième près, celui de TRAJECTOiRE celui de sa série
      revaloSam, au millionième ; leur écart, de +1,3 % pour un départ de 2015 à −4,5 %
      en 2026, n'est que la chaîne des coefficients, que TRAJECTOiRE a fausse (registre)
  caliper: >-
    rapporte les salaires aux trimestres jusqu'en 1994, comme la Cnav le faisait jusqu'au
    30 juin 1995 (circulaire 95/94)
  baremes_ipp: les dix dernières années avant 1973, comme l'ordonnance de 1945
historique:
- >-
  2026-11-20 — les versions de 1995 et de 2004 confrontées à une grille indépendante
  (action 194) : 78 cas posés depuis LEGI par une session qui n'a pas vu le code. Trois
  s'écartaient, tous par les années d'avant 1948, que le moteur classait avec les autres
  : il ne les prend plus qu'à défaut, en remontant depuis 1947. Les deux simplifications
  qui ne nommaient pas leur version en sont sorties : les indemnités journalières de
  maternité ont leur fiche, sam_indemnites_de_maternite, qui les dit manquantes ; les
  salaires d'avant 1947, sam_annees_d_avant_1947 ; les années de rachat relèvent de
  rachats_et_versements, que le simulateur ne saisit pas.
- >-
  2026-10-05 — datée, à l'étape 138.16 : cinq versions, des dix dernières années de 1945
  aux années validantes de 2004 ; les salaires rapportés aux trimestres jusqu'en juin
  1995 ; la colonne de revalorisation en vigueur à la date d'effet, lue de 1946 à 2026.
  Elle se disait conforme et ne retenait que les dix ou vingt-cinq meilleures années,
  toutes années de salaire comprises, en moyenne annuelle.
exemples: []
reformes: [sam_avant_la_liquidation_1948, sam_dix_meilleures_annees_1973,
           sam_moyenne_annuelle_1995, sam_annees_validantes_2004]
effet: >-
  Toute pension en annuités du régime général et des salariés agricoles. Depuis 2004, une
  année de petit salaire qui ne valide aucun trimestre ne tire plus vers le bas la
  moyenne de qui a moins d'années que le nombre retenu ; avant juillet 1995, une année
  incomplète compte pour ses trimestres et non pour une année entière ; avant 1973, la
  moyenne est celle des dix dernières années, non des dix meilleures. Le polypensionné du
  régime général, des salariés agricoles et des artisans et commerçants que la
  liquidation unique ne réunit pas — né avant 1953, ou parti avant le 1er juillet 2017 —
  retient depuis 2004 dans chaque régime la part des années que leurs durées lui donnent
  (R. 173-4-3). Les deux exemples de la circulaire Cnav n° 2004/29 sont rendus.
