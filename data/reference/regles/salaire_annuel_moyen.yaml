code:
  interrupteurs:
    salaire_reference_par_generation: true
    regles_du_salaire_annuel_moyen: salaire_annuel_moyen
  python: >-
    scenarios/actuel.py : FicheDatee (salaire_annuel_moyen) ; droit/liquider.py :
    salaire_de_reference, moyenne_selon_la_regle, nombre_d_annees_retenues ;
    donnees/macro.py : colonne_de_revalorisation_en_vigueur
  javascript: >-
    moteur/js/regimes.js : FicheDatee ; moteur/js/droit/liquider.js : salaireDeReference,
    moyenneSelonLaRegle, nombreDAnneesRetenues ; moteur/js/macro.js :
    colonneDeRevalorisationEnVigueur
  parametres: contenu.parametres de chaque version
  tests: >-
    tests/test_simulateur.py et tests/js/moteur.test.js : chaque version rejouée sur une
    carrière à la main, dans les deux moteurs
  moteur: >-
    `regles_du_salaire_annuel_moyen` : le moteur lit la version de la date d'effet — quelles
    années, comment les moyenner, lesquelles écarter — et l'applique aux salaires
    revalorisés de chaque année. `salaire_reference_par_generation` : le nombre d'années
    retenues est lu dans `legislation/annees_salaire_reference.csv` à l'ANNÉE DE NAISSANCE
    : dix à vingt-cinq années, une par génération, de 1934 à 1948 (loi du 22 juillet 1993).
    Ne vaut que pour un `salaire_reference` en meilleures années.
    `liquider.annees_des_regimes_alignes` (`anneesDesRegimesAlignes`) partage ce nombre
    quand d'autres régimes le partagent : depuis 2004, entre régimes alignés que la
    liquidation unique ne réunit pas, au prorata de leurs durées, celles des artisans et
    commerçants depuis 1973 (R. 173-4-3, `liquider.annees_au_prorata`) ; depuis 2026,
    avec les exploitants agricoles, puis, pour qui est né avant 1953, entre régimes
    alignés (R. 173-3-2, fiche pension_non_salaries_agricoles_2026). Le détail de la
    pension dit le nombre retenu et l'article.
referents:
  openfisca_france_pension: >-
    écarte depuis 2004 les années qui ne valident aucun trimestre, comme R. 351-29 ; ne
    rapporte jamais les salaires aux trimestres
  calcul_pension: écarte les années sans trimestre cotisé depuis 2004, comme R. 351-29
  trajectoire:
    equivalent: >-
      calculeSam (R/fonctionsCalculsPensions.R:2038-2135), la série revaloSam enchaînée
      jusqu'à l'année de la liquidation comprise
    confrontation: >-
      le 5 octobre 2026, TRAJECTOiRE exécuté à part (tests/test_trajectoire.py) : refait
      sur les années de chaque cas, le salaire annuel moyen du dépôt est celui des
      colonnes de la Cnav, au millième près, celui de TRAJECTOiRE celui de sa série
      revaloSam, au millionième ; leur écart, de +1,3 % pour un départ de 2015 à −4,5 %
      en 2026, n'est que la chaîne des coefficients, que TRAJECTOiRE a fausse (registre)
  caliper: >-
    rapporte les salaires aux trimestres jusqu'en 1994, comme la Cnav le faisait jusqu'au
    30 juin 1995 (circulaire 95/94)
  baremes_ipp: les dix dernières années avant 1973, comme l'ordonnance de 1945
historique:
- >-
  2026-10-05 — datée, à l'étape 138.16 : cinq versions, des dix dernières années de 1945
  aux années validantes de 2004 ; les salaires rapportés aux trimestres jusqu'en juin
  1995 ; la colonne de revalorisation en vigueur à la date d'effet, lue de 1946 à 2026.
  Elle se disait conforme et ne retenait que les dix ou vingt-cinq meilleures années,
  toutes années de salaire comprises, en moyenne annuelle.
