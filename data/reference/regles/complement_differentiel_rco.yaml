historique:
- >-
  2026-10-07 — servi, à l'étape 138.8 : décrit depuis le 19 septembre 2026 dans
  l'inventaire des avantages non contributifs, sous la ligne de la PMR, sans qu'aucun
  code le serve ; sept versions, de son absence avant 2015 aux trimestres pour enfants
  de 2026.
exemples: []
effet: >-
  Les chefs d'exploitation de dix-sept ans et demi liquidant au taux plein depuis 2015 :
  le moteur servait leurs points de RCO seuls ; la garantie porte leurs deux pensions
  agricoles à 75 puis 85 % du SMIC net agricole d'une carrière complète, 1 214,40 € par
  mois en 2026.
referents:
  trajectoire:
    equivalent: >-
      complementDiffRCO (R/fonctionsCalculsPensions.R), appliqué à la chronique des
      pensions servies, la cible lue dans une série du COR
    confrontation: >-
      TRAJECTOiRE porte la pension totale à la cible sans la proratiser à la durée ni la
      plafonner aux pensions agricoles ; il ne tient pas compte des années de chef à
      titre secondaire que L. 732-63 compte depuis 2026
  calcul_pension:
    equivalent: >-
      complementDiffRCO (R/fonctionsCalculsPensions.R) : dureeValidee >= 70 et taux plein,
      la pension tous régimes portée à la cible annuelle du COR
    confrontation: >-
      même lecture que TRAJECTOiRE ; le dépôt suit D. 732-166-4 et D. 732-166-5 : la
      formule, le prorata de la durée de chef et le plafond des pensions agricoles
