approximations:
- ecart: >-
    le SMIC net agricole n'est lu que pour 2021 et 2024 à 2026, tiré des montants
    mensuels que la MSA publie ; les autres années sont estimées, par le rapport au SMIC
    brut que ces montants donnent et les taux salariaux qui ont changé
    (complement_differentiel_rco.csv)
  effet: >-
    de 2015 à 2020, 2022 et 2023 : la fiabilité du résultat tombe à « estimée »
- ecart: >-
    de 2015 à octobre 2021, le complément se calcule au 1er octobre de l'année d'effet,
    sur les pensions de ce jour-là ; le modèle le calcule à la date d'effet, la PMR
    seule étant lue en octobre
  effet: non mesuré
- ecart: >-
    le modèle ne connaît que le statut de chef d'exploitation à titre principal : la
    durée de chef est la durée agricole, et tous les points de RCO sont ceux de chef
  effet: non mesuré
- ecart: >-
    le complément se calcule au départ : servi depuis 2015 aux pensions liquidées avant,
    revu à chaque changement des pensions, il ne l'est pas ; le plafond tous régimes ne
    distingue pas les pensions des élus locaux exclues depuis 2026
  effet: non mesuré
sources:
  lu_le: 2026-10-07
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Lire le SMIC net agricole de 2015 à 2020, de 2022 et de 2023 dans une publication de
    la MSA (circulaire, communiqué, barème), et identifier les 0,79 point qu'elle déduit
    au-delà des taux salariaux d'un salarié non cadre.
  - >-
    Chercher un exemple chiffré publié d'un complément différentiel, et le rejouer dans
    exemples_officiels.yaml.
  lectures:
  - type: legifrance
    reference: >-
      L. 732-63 du code rural (rédactions de 2014, 2020, 2023 et 2026) et D. 732-166-1 à
      D. 732-166-6 (2015, 2021, 2022 et 2026), dans l'index LEGI du dépôt à jour au 6
      octobre 2026
    date: 2026-10-07
  - type: autre
    reference: >-
      MSA, communiqué du 3 novembre 2021 « Revalorisation des retraites agricoles les plus
      faibles au 1er novembre » : « dans la limite de 1035,57 € tous régimes de retraite
      obligatoires pour 2021 »
    url: https://www.msa.fr/lfp/en/presse/revalorisation-retraites-agricoles-faibles-1er-novembre-modalit%C3%A9s-date-versement
    date: 2026-10-07
  - type: autre
    reference: >-
      MSA, « Revalorisation des retraites agricoles », mise à jour le 20 mars 2026 :
      « une garantie de retraite minimale portée à 1214,40 € par mois au 1er janvier
      2026 »
    url: https://www.msa.fr/lfp/en/retraite/revalorisation-retraites-agricoles-loi-3-juillet
    date: 2026-10-07
  - type: autre
    reference: >-
      MSA Mayenne-Orne-Sarthe, « Le complément différentiel RCO pour les chefs
      d'exploitation », mis à jour le 7 octobre 2021 : 73 % au 1er janvier 2015, 74 % en
      2016, 75 % en 2017, versé le 9 novembre 2015 avec un rappel depuis le 1er janvier
    url: https://mayenne-orne-sarthe.msa.fr/lfp/en/le-complement-differentiel-rco
    date: 2026-10-07
