schema_version: 1
id: complement_differentiel_rco
intitule: >-
  Le chef d'exploitation de dix-sept ans et demi reçoit, en points de retraite
  complémentaire obligatoire, ce qui manque à ses pensions agricoles de base et
  complémentaire pour atteindre, au prorata de sa durée, un pourcentage de 1 820 fois le
  SMIC net agricole horaire — 73 % en 2015, 74 % en 2016, 75 % jusqu'en octobre 2021,
  85 % depuis — ; le complément ne fait pas dépasser ce montant à l'ensemble de ses
  pensions depuis novembre 2021, et le taux plein suffit depuis septembre 2023 là où il
  fallait la durée requise.
domaine: minima
regimes: [msa_rco, msa_non_salaries]
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- la pension de base des non-salariés agricoles, pension majorée de référence et surcote
  comprises, et la pension de la RCO, ses points et la valeur de service du point
- la durée d'assurance non salariée agricole et celle de chef d'exploitation, les
  trimestres pour enfants depuis 2026, la durée de la retraite forfaitaire, la durée
  tous régimes et la durée requise, le taux plein du régime
- le SMIC net agricole horaire du 1er janvier de l'année d'effet
  (legislation/complement_differentiel_rco.csv) et la pension majorée de référence
- toutes les pensions personnelles et les majorations pour enfants, celles d'autres
  départs et les pensions étrangères, pour le plafond tous régimes
ecrit:
- les points de RCO que le complément ajoute, et leur montant, après les plafonds
dates_qui_decident:
- liquidation.date_effet
