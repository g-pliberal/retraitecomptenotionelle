reformes:
- cavom_2016
effet: >-
  La fiche portait huit plafonds dès 2016 et aucune assiette minimale : elle surestimait
  le complémentaire des revenus supérieurs à quatre plafonds de 2016 à 2019, et
  ne servait rien aux revenus nuls ou très bas que le décret fait cotiser. Coupée
  en 2016, 2017, 2018, 2019 et 2020 le 23 septembre 2026 ; champs `assiette_minimale_pass`,
  `plafonnee_6_pass` et `plafonnee_7_pass`. Lue au droit le 5 novembre 2026 (action
  130) : quatre versions, les classes d'avant 2016 présumées, le décret n° 2015-1875,
  dont la dérogation est à l'article 3, II, et non au 1er, celui de 2019, celui de
  2026 ; le taux de 12,50 % lu de 2016 à 2025, non trouvé pour 2026 ; le modèle porte
  les plafonds et les minimums de chaque année.
