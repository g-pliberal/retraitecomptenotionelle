schema_version: 1
id: cavom_assiette_2016
intitule: >-
  Depuis 2016, la cotisation au régime complémentaire de la CAVOM est de 12,5 %
  du revenu professionnel dans la limite de huit plafonds de la Sécurité sociale,
  que le décret n° 2015-1875 (article 3, II) fait appeler « dans la limite d'un
  plafond égal à » quatre plafonds en 2016, cinq en 2017, six en 2018 et sept en
  2019 ; l'assiette ne peut être inférieure au quart du plafond, puis à 19 % depuis
  le 1er janvier 2019 ; avant 2016, des classes de cotisation, que le modèle remplace
  par la règle de 2016.
domaine: cotisations
regimes: [cavom_complementaire]
etape: acquerir_les_droits
face: droit
etat: transcrite
lit:
- >-
  l'année du revenu professionnel, qui choisit la rédaction de l'article 2 du décret
  n° 79-265 et le plafond de la Sécurité sociale du 1er janvier de cette année
- le revenu professionnel de l'année, défini à l'article L. 131-6
- la part de l'année où l'officier ministériel exerce, qui proratise la cotisation
ecrit:
- >-
  la cotisation de l'année au régime complémentaire, 12,5 % de l'assiette bornée
  entre le minimum et le plafond, que `acquerir` change en points au scénario 1 et
  que le compte notionnel porte (`ConstructeurCompte._cotisation_ligne`)
dates_qui_decident:
- revenu.annee
versions:
- id: classes_d_avant_2016
  statut: supposee
  hypothese: >-
    de 1979 à 2015, la cotisation est celle d'une classe : « Le régime d'assurance
    vieillesse complémentaire institué par l'article 1er comporte six classes de
    cotisations : - la classe spéciale portant attribution de 18 points de retraite
    [...] La cotisation due par chaque assujetti est celle de la classe à laquelle
    correspond, dans les conditions fixées par les statuts prévus à l'article 5 du
    présent décret, son revenu d'activité » (décret n° 79-265, article 2, rédaction du
    1er janvier 2013, LEGIARTI000026892955) ; les bornes de revenu des classes sont aux
    statuts, hors de l'index, et le montant de la classe spéciale au décret de chaque
    année. Le modèle y projette la règle de 2016, 12,5 % jusqu'à huit plafonds, au
    niveau `estimee`, sans minimum
  fiabilite: >-
    faible : la cotisation et les points de chaque année, que les classes donnaient et
    que le modèle ne reconstitue pas
  bornes:
    revenu.annee: [null, 2016-01-01]
  contenu:
    parametres:
      assiette: plafonnee_8_pass
      taux_cotisation_retraite: 0.125
    droit: 12,5 % du revenu jusqu'à huit plafonds, la règle de 2016, présumée
    conditions: aucune
  exemples: aucun trouvé
