approximations:
- version: [classes_d_avant_2016]
  textes: décret n° 79-265, article 2, rédactions de 1980, 1987 et 2013 ; les statuts
  ecart: >-
    Le modèle remplace les classes de 1979 à 2015 par 12,5 % du revenu jusqu'à huit
    plafonds, la règle de 2016, sans minimum : les bornes des classes sont aux statuts,
    hors de l'index, et la cotisation de chaque année n'est pas reconstituée.
  effet: non mesuré
- version: [decret_2015_1875]
  textes: décret n° 2015-1875, article 3, II, « pour les cotisations appelées en 2016 »
  ecart: >-
    Le décret borne les cotisations « appelées » chaque année, quand la cotisation de
    l'année est d'abord appelée à titre provisionnel, puis régularisée sur le revenu
    définitif (statuts, article 5, rédaction de l'arrêté du 28 août 2020 : « Cette
    cotisation est dans un premier temps fixée à titre provisionnel en pourcentage du
    revenu d'activité de l'avant-dernière année ») ; le modèle borne la cotisation de chaque
    année de revenu par le plafond de cette année. Le texte ne dit pas quel plafond
    borne la régularisation de la cotisation de 2016 appelée en 2017.
  effet: non mesuré
- version: [decret_2015_1875, decret_2019_373, decret_2026_418]
  textes: >-
    statuts, article 9, V, rédaction de l'arrêté du 21 décembre 2016 (annexe, 12°,
    JORFARTI000033702977), publié le 28 décembre 2016
  ecart: >-
    « Lorsqu'un affilié débute son activité en cours d'année, la cotisation est due et
    exigible à compter du premier jour du trimestre civil suivant », et cesse d'être due
    « à compter du premier jour du trimestre civil qui suit sa cessation », « prorata
    temporis » ; le modèle proratise la cotisation, et le minimum par le plafond, aux
    mois de l'année où l'officier ministériel exerce (`acquerir` : « Le plafond est déjà
    proratisé sur les mois de l'année »), et non par trimestres civils entiers.
  effet: >-
    au plus un trimestre de cotisation, et des points qu'elle achète, l'année du début
    et celle de la fin ; non mesuré
- version: [decret_2026_418]
  textes: décret n° 79-265, article 2, I, rédaction du 1er juillet 2026
  ecart: >-
    Le taux de 2026 n'est pas trouvé à l'index JORF du dépôt : le décret n° 2025-1076
    fixe celui de 2025 (12,50 %), et sa notice annonce, pour les libéraux, « les
    modifications des taux de cotisation de retraite complémentaire issus de la réforme
    de l'assiette » au 1er janvier 2026, et son article 14, « Pour l'année 2026 », ne
    nomme que les médecins, les chirurgiens-dentistes et sages-femmes et les auxiliaires
    médicaux (JORFARTI000052565558) : l'index ne porte pas de taux de 2026 pour la
    CAVOM. Le modèle garde 12,5 %, que la page de la CAVOM donne pour 2026.
  effet: non mesuré
- version: [decret_2026_418]
  textes: >-
    décret n° 79-265, article 2, I, deuxième alinéa, rédaction du 1er juillet 2026, « Le
    montant minimum prévu au premier alinéa s'applique pour le calcul de la cotisation
    des deux premières années d'activité »
  ecart: >-
    Le texte ne tranche pas entre deux lectures : le minimum s'applique aussi aux deux
    premières années d'activité, ou il est l'assiette forfaitaire des cotisations
    provisionnelles de ces deux années (L. 131-6-2, deuxième alinéa, auquel l'alinéa
    suivant renvoie), régularisées ensuite sur le revenu. Dans l'une et l'autre, le
    premier alinéa borne l'assiette de toute année au moins à 19 % du plafond : la
    cotisation définitive, que le modèle sert, est la même.
  effet: aucun sur la cotisation définitive
- version: [decret_2026_418]
  textes: >-
    décret n° 79-265, article 2, I, troisième et quatrième alinéas, rédaction du 1er
    juillet 2026 ; L. 131-6-2, deuxième à quatrième alinéas
  ecart: >-
    Le modèle ne porte pas la cotisation provisionnelle, assise sur le revenu de
    l'avant-dernière année ou sur un revenu estimé, ni sa régularisation : il sert
    d'emblée la cotisation définitive, assise sur le revenu de l'année.
  effet: >-
    aucun sur la cotisation définitive et les points qu'elle achète ; le calendrier des
    versements n'est pas modélisé
- version: [decret_2026_418]
  textes: >-
    décret n° 79-265, article 4-2, rédaction du décret n° 2026-418, « un nombre de
    points de retraite, arrêté à la deuxième décimale par excès »
  ecart: >-
    Le modèle ne compte pas les points de la CAVOM : il sert les cotisations
    revalorisées multipliées par le rendement, ce qui revient à des points non
    arrondis ; le règlement les arrête au centième, par excès : le modèle sert donc un
    peu moins que le texte.
  effet: >-
    moins d'un centième de point par cotisation annuelle depuis le 1er juillet 2026 : à
    la valeur de service de 2026 que porte `cavom_complementaire.yaml`, 3,3745 €, 0,01 ×
    3,3745 = 0,0337 €, soit 0,034 € de pension par an au plus pour chaque cotisation,
    qui s'additionnent d'une année à l'autre ; le modèle en sert moins (relecture R-E4)
- version: [decret_2015_1875, decret_2019_373, decret_2026_418]
  textes: >-
    décret n° 79-265, article 2, II ; les décrets de chaque année, « taux de cotisation
    des affiliés relevant de l'article L. 642-4-1 du code de la sécurité sociale : 7,50
    % »
  ecart: >-
    L'officier ministériel salarié (deuxième alinéa de L. 642-4-1) cotise sur sa
    rémunération de L. 242-1, au taux de 7,50 %, pris en charge à 60 % par l'employeur ;
    le modèle ne le distingue pas de l'officier ministériel libéral.
  effet: non mesuré
