historique:
- >-
  2026-11-14 — corrigée (action 130, décision du propriétaire du 13 novembre, ligne 10
  de la file) : le modèle liquidait par sa période de 2004 à 2011, sans majoration, les
  pensions qui prennent effet du 1er juillet au 31 décembre 2011, quand les statuts de
  2011 sont en vigueur depuis le 1er juillet (arrêté du 23 juin 2011, article 2), sans
  disposition transitoire. La période de 2012 à 2018 de `cavamac_complementaire.yaml`
  liquide désormais les pensions qui prennent effet depuis le 1er juillet 2011
  (`date_effet`), dans les deux moteurs : l'agent né en février 1945, au taux plein à
  65 ans, qui liquide en novembre 2011 à 66 ans et 9 mois, une année pleine différée,
  reçoit le coefficient 1,05 de l'article 16, au lieu de 1 ; né en février 1940, à 71
  ans et 9 mois, 1,25. La majoration pour trois enfants de l'article 18 suit la même
  correction (`sections_liberales_majoration_enfants`).
- >-
  2026-11-14 — corrigée (action 130, décision du propriétaire du 13 novembre, ligne 27
  de la file) : le modèle minorait comme les autres l'inapte, l'ancien déporté ou
  interné et l'ancien combattant ou prisonnier de guerre — jusqu'en 2023,
  `abattement_ircec` ne lisait pour la CAVAMAC que l'âge ; depuis 2024,
  `abattement_regime_de_base` n'exonérait l'inapte que dans les régimes de la fiche
  `inaptitude_au_travail`, où la CAVAMAC n'est pas —, quand les statuts de 2011
  (article 15, a et b), l'arrêté du 4 août 2023 (annexe, 6°, b, par le 2° de L. 643-4)
  et le règlement de 2026 (article 4) les servent « sans application d'un coefficient
  de minoration ». Deux paramètres de période, aux quatre périodes de 2012 à 2026 de
  `cavamac_complementaire.yaml`, lus des deux moteurs : `age_sans_coefficient_de_l_inapte`
  (`age_legal_par_generation` jusqu'en 2023, 62 depuis 2024) et
  `categories_sans_coefficient` (l'ancien déporté ou interné partout, l'ancien
  combattant du 5° de L. 351-8 depuis 2024). L'agent né le 1er janvier 1955, inapte,
  parti à 62 ans le 1er janvier 2017, perdait cinq tranches de douze mois × 5 % = 25 %
  de ses points (coefficient 0,75) : il reçoit le coefficient 1, soit 14 984,97 € par
  an au cas posé au lieu de 11 238,73 €. L'ouverture à soixante-deux ans avant l'âge
  légal, les autres catégories et la règle d'avant le 1er juillet 2011 restent aux
  approximations.
code:
  interrupteurs:
    abattement_points: cavom
    decote_annulee_par_la_duree: false
    surcote_points: par_age_seul
    surcote_trimestres_cotises: true
  moteur: >-
    `abattement_points: cavom`, le barème par année d'âge manquante que la fiche `cavom_ages_minoration`
    décrit ; `decote_annulee_par_la_duree: false` : la durée d'assurance n'annule pas
    la minoration ; `age_sans_coefficient_de_l_inapte` et `categories_sans_coefficient`
    rendent le coefficient 1 à l'inapte dès l'âge que la période écrit, et aux
    catégories dont la fiche est nommée, aux conditions qu'elle écrit à la date
    d'effet ; `surcote_points: par_age_seul`, la majoration par l'âge seul que la
    fiche `surcote_par_age_seul` décrit. `surcote_trimestres_cotises` : ne compter que
    les trimestres COTISÉS depuis l'âge de départ du décompte, et non le temps écoulé
    — « pour chaque année pleine cotisée dans le présent régime » (CAVAMAC, statuts dans
    la rédaction de l'arrêté du 4 août 2023, article 16, depuis le 1er janvier 2024 ;
    ils disaient « différée » auparavant). Sans ce renvoi, le temps écoulé suffit, comme
    dans les autres sections.
  python: >-
    droit/liquider.py : abattement_points, abattement_ircec, abattement_regime_de_base,
    decote_opposable, trimestres_de_decote, inapte_sans_coefficient,
    categorie_sans_coefficient, surcote_points, _ABATTEMENTS_IRCEC,
    _ABATTEMENTS_PAR_ANNEE_AGE_SEUL ; droit/ouvrir.py : age_taux_plein
  javascript: >-
    moteur/js/droit/liquider.js : abattementPoints, abattementIrcec,
    abattementRegimeDeBase, decoteOpposable, trimestresDeDecote, inapteSansCoefficient,
    categorieSansCoefficient, surcotePoints ;
    moteur/js/droit/ouvrir.js : ageTauxPlein
  parametres: >-
    contenu.parametres de chaque version : abattement_points, age_ouverture_par_generation,
    age_taux_plein, age_taux_plein_par_generation, decote_par_trimestre,
    age_sans_coefficient_de_l_inapte, categories_sans_coefficient ;
    regimes/cavamac_complementaire.yaml : surcote_par_trimestre, surcote_pas_trimestres,
    surcote_trimestres_maximum, surcote_trimestres_cotises, date_effet
  tests: [tests/test_sections_liberales.py]
