effet: >-
  La fiche opposait la décote du régime de base, que la durée annule : un agent
  général parti à l'âge légal avec sa durée ne perdait rien de sa complémentaire,
  là où ses statuts lui retirent de 5 à 25 %. Depuis le 23 septembre 2026, `abattement_points:
  cavom` jusqu'en 2023, `decote_annulee_par_la_duree: false` partout, la surcote
  par années pleines, et `surcote_trimestres_cotises` depuis 2024, qui ne compte
  que les trimestres cotisés au-delà de 67 ans ; tenu par tests/test_sections_liberales.py.
  Lue au droit le 5 novembre 2026 (action 130) : cinq versions, les statuts de 2011
  en vigueur le 1er juillet 2011, présumés avant, l'article 15 récrit le 1er septembre
  2023, l'article 16 le 1er janvier 2024, le règlement de 2026 ; ni la longue carrière
  à 15 %, ni la réversion ne sont servies. La majoration du second semestre 2011, que
  le modèle ne servait pas, et la minoration qu'il opposait à l'inapte, à l'ancien
  déporté ou interné et, depuis 2024, à l'ancien combattant, 25 % à 62 ans, sont
  corrigées depuis le 14 novembre 2026 (historique).
