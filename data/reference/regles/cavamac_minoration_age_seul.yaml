schema_version: 1
id: cavamac_minoration_age_seul
intitule: >-
  Régime complémentaire de la CAVAMAC : du 1er juillet 2011 au 31 décembre 2023, taux
  plein à l'âge de L. 161-17-2 augmenté de cinq ans, puis à 67 ans dès le 1er
  septembre 2023, liquidation dès l'âge de L. 161-17-2 avec une minoration de 5 % par
  tranche de douze mois d'anticipation, que la durée d'assurance n'annule pas, et
  majoration de 5 % par année pleine différée dans la limite de 25 % ; depuis le 1er
  janvier 2024, taux plein à 67 ans, minoration de 1,25 % par trimestre manquant pour
  l'atteindre, et majoration de 5 % par année pleine COTISÉE au-delà, hors cumul
  emploi-retraite ; avant le 1er juillet 2011, la règle de 2011 présumée.
domaine: decote_surcote
regimes: [cavamac_complementaire]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  l'âge de l'agent général à la date d'effet de sa pension, « au premier jour du
  trimestre civil qui suit la demande écrite », et sa génération, qui donne l'âge de
  l'article L. 161-17-2 et, jusqu'au 31 août 2023, l'âge du taux plein, cinq ans plus
  tard
- >-
  les catégories servies sans minoration dès l'âge légal : de 2011 à 2023, l'inapte
  reconnu par la commission d'inaptitude, l'ancien déporté ou interné, l'ancien
  prisonnier de guerre ou combattant du décret n° 74-436, le grand invalide, l'invalide
  professionnel à 66 % au moins ; depuis le 1er septembre 2023, les assurés des 2° et
  3° de L. 643-4 et l'invalide professionnel à 66 % au moins
- >-
  depuis 2024, le départ anticipé pour longue carrière de L. 351-1-1, à 62 ou 63 ans
- la date d'effet de la pension, qui choisit la rédaction des statuts ou du règlement
ecrit:
- >-
  le coefficient de minoration qui réduit les points de la pension complémentaire, de
  0,75 à cinq ans du taux plein à un, que `abattement_points` rend à
  `liquider_chaque_regime`, et la majoration au-delà, que rend `surcote_points`
dates_qui_decident:
- liquidation.date_effet
versions:
- id: statuts_d_avant_2011
  statut: supposee
  hypothese: >-
    les pensions qui prennent effet avant le 1er juillet 2011 relèvent des statuts
    approuvés par l'arrêté du 22 décembre 1967 (JORFTEXT000000660274), dont l'index
    JORF du dépôt n'a que le titre, et de leurs modifications, publiées au seul Bulletin
    officiel : celle du 12 janvier 1990 touche « (art. 12 et 15) », et « L'arrêté du
    12 janvier 1990 sera publié intégralement au Bulletin officiel no 90-05 »
    (JORFTEXT000000342796) ; celle du 11
    août 1998 « (art. 1er à 10, 12, 13, 15, 15 bis, 16, 19 bis et 20 à 23) »
    (JORFARTI000001232209), « au Bulletin officiel no 98-38 » (JORFARTI000001901194).
    Les articles 15 et 16 sont, en 2011, ceux du taux plein et de la minoration : leur
    rédaction d'avant n'est pas lue. Celle du 17 décembre 2007 ne touche que les
    articles 1er, 3, 4 et 5 (textes sans effet). La fiche présume la règle de 2011
  fiabilite: >-
    faible : l'âge du taux plein, l'âge d'ouverture et le barème, que nul texte lu ne
    date avant le 1er juillet 2011
  bornes:
    liquidation.date_effet: [null, 2011-07-01]
  contenu:
    parametres:
      abattement_points: cavom
      age_ouverture_par_generation: true
      age_taux_plein_par_generation: true
    droit: celui de la version statuts_de_2011, présumé
  exemples: aucun trouvé
- id: statuts_de_2011
  statut: lue
  textes:
  - id: JORFARTI000024270173
    article: >-
      statuts du régime d'assurance vieillesse complémentaire, annexe de l'arrêté du 23
      juin 2011, articles 15 et 16
    en_vigueur: 2011-07-01
    publie_le: 2011-06-29
    citation: >-
      « Sous réserve du respect des conditions mentionnées à l'article 13 des présents
      statuts, la pension de retraite complémentaire est liquidée à taux plein à tout
      adhérent qui atteint l'âge prévu à l'article L. 161-17-2 du code de la sécurité
      sociale augmenté de cinq années. La pension de retraite complémentaire est
      liquidée à taux plein sans application d'un coefficient de minoration au plus
      tôt à partir de l'âge prévu à l'article L. 161-17-2 du code de la sécurité
      sociale : a) Pour les adhérents reconnus atteints d'inaptitude au travail par la
      commission d'inaptitude selon la procédure prévue par les statuts de la Caisse
      nationale d'assurance vieillesse des professions libérales ; b) Pour les anciens
      déportés et internés, titulaires de la carte de déporté ou interné de la
      Résistance, ou de la carte de déporté ou interné politique ; c) Pour les
      personnes, anciens prisonniers de guerre et anciens combattants, visées par le
      décret n° 74-436 du 15 mai 1974, aux âges et conditions de durée de captivité ou
      services fixés par ledit décret pour les régimes d'allocation vieillesse. d) Pour
      les grands invalides mentionnés aux articles L. 36 et L. 37 du code des pensions
      militaires d'invalidité et des victimes de la guerre. e) Pour les adhérents
      reconnus atteints d'une invalidité professionnelle d'un taux supérieur ou égal à
      66 % par le régime d'assurance invalidité des agents généraux d'assurance
      institué par le décret n° 2003-1273 du 26 décembre 2003. » (article 15) ; « Une
      majoration de 5 % du nombre de points de retraite acquis au compte de l'adhérent
      est appliquée pour chaque année pleine différée au-delà de l'âge mentionné à
      l'article 15 des présents statuts, dans la limite maximum de 25 %. Sous réserve
      du respect des conditions mentionnées à l'article 13, la pension de retraite
      complémentaire peut être liquidée au plus tôt à partir de l'âge prévu à l'article
      L. 161-17-2 du code de la sécurité sociale avec application d'un coefficient de
      minoration au nombre de points de retraite acquis au compte de l'adhérent. Le
      coefficient de minoration mentionné à l'alinéa précédent est de : ― 5 % lorsque
      la liquidation de la pension de retraite complémentaire intervient dans les douze
      mois précédant l'âge requis pour l'obtention d'une pension de retraite
      complémentaire à taux plein. ― 10 % lorsque la liquidation de la pension de
      retraite complémentaire intervient entre le 13e et le 24e mois précédant l'âge
      requis pour l'obtention d'une pension de retraite complémentaire à taux plein. ―
      15 % lorsque la liquidation de la pension de retraite complémentaire intervient
      entre le 25e et le 36e mois précédant l'âge requis pour l'obtention d'une pension
      de retraite complémentaire à taux plein. ― 20 % lorsque la liquidation de la
      pension de retraite complémentaire intervient entre le 37e et le 48e mois
      précédant l'âge requis pour l'obtention d'une pension de retraite complémentaire
      à taux plein. ― 25 % lorsque la liquidation de la pension de retraite
      complémentaire intervient entre le 49e et le 60e mois précédant l'âge requis pour
      l'obtention d'une pension de retraite complémentaire à taux plein. » (article 16)
  - id: JORFARTI000024270156
    article: arrêté du 23 juin 2011, article 2
    en_vigueur: 2011-07-01
    publie_le: 2011-06-29
    citation: « Les dispositions du présent arrêté entrent en vigueur le 1er juillet 2011. »
  - id: LEGIARTI000023030950
    article: >-
      code de la sécurité sociale, article L. 351-8, 1°, rédaction du 1er juillet 2011
      au 21 janvier 2014, et de même LEGIARTI000028498855 jusqu'au 31 août 2023
    en_vigueur: 2011-07-01
    citation: >-
      « 1° Les assurés qui atteignent l'âge prévu à l'article L. 161-17-2 augmenté de
      cinq années » : les mots mêmes de l'article 15, d'où la table du 1° de L. 351-8
      que le modèle lit à la génération
  nee_de: JORFARTI000024270173
  bornes:
    liquidation.date_effet: [2011-07-01, 2023-09-01]
  contenu:
    parametres:
      abattement_points: cavom
      age_ouverture_par_generation: true
      age_taux_plein_par_generation: true
      age_sans_coefficient_de_l_inapte: age_legal_par_generation
      categories_sans_coefficient: [taux_plein_anciens_deportes_internes]
    droit: >-
      taux plein à l'âge de L. 161-17-2 augmenté de cinq ans, 65 ans pour les
      générations d'avant juillet 1951, 67 ans depuis celle de 1955 ; liquidation dès
      l'âge de L. 161-17-2 ; 5 % de minoration par tranche de douze mois, le mois
      entamé compté, 25 % au plus ; au-delà du taux plein, 5 % par année pleine
      différée, 25 % au plus ; la durée d'assurance n'entre nulle part
    conditions: >-
      sans minoration dès l'âge de L. 161-17-2, l'inapte, l'ancien déporté ou interné,
      l'ancien prisonnier ou combattant du décret n° 74-436, le grand invalide et
      l'invalide professionnel à 66 % au moins (article 15, a à e)
  exemples: aucun trouvé
- id: statuts_de_septembre_2023
  statut: lue
  textes:
  - id: JORFARTI000047977908
    article: annexe de l'arrêté du 4 août 2023, 6° (article 15) et 7°, b (article 16)
    en_vigueur: 2023-09-01
    publie_le: 2023-08-18
    citation: >-
      « 6° L'article 15 est ainsi modifié : a) Au premier alinéa, les mots : « prévu à
      l'article L. 161-17-2 du code de la sécurité sociale augmenté de cinq années »
      sont remplacés par les mots : « de 67 ans » ; b) Les deuxième à sixième alinéas
      sont remplacés par les dispositions suivantes : « Sont liquidées à partir de
      l'âge prévu au IV de l'article L. 643-3 et sans application d'un coefficient de
      minoration les pensions de retraite complémentaire des assurés mentionnés aux 2°
      et 3° de l'article L. 643-4 du code de la sécurité sociale. « Sont liquidées à
      partir de l'âge prévu à l'article L. 161-17-2 du code de la sécurité sociale et
      sans application d'un coefficient de minoration les pensions de retraite
      complémentaire des adhérents reconnus atteints d'une invalidité professionnelle
      d'un taux supérieur ou égal à 66 % par le régime d'assurance invalidité-décès des
      agents généraux d'assurance institué par le décret n° 2003-1273 du 26 décembre
      2003. » » ; « b) Le premier alinéa est complété par la phrase suivante : « Cette
      majoration ne s'applique pas aux années de cotisations versées dans le cadre du
      dispositif prévu à l'article 14 des présents statuts. » »
  - id: JORFARTI000047977903
    article: arrêté du 4 août 2023, article 2
    en_vigueur: 2023-09-01
    publie_le: 2023-08-18
    citation: >-
      « 1° Les dispositions prévues aux 5°, 6°, b du 7° et 8° de l'annexe au présent
      arrêté entrent en vigueur le 1er septembre 2023 ; 2° Les dispositions prévues aux
      a, c et d du 7° de l'annexe au présent arrêté entrent en vigueur le 1er janvier
      2024. »
  - id: LEGIARTI000047453026
    article: code de la sécurité sociale, article L. 643-4, 2° et 3°, rédaction du 1er septembre 2023
    en_vigueur: 2023-09-01
    citation: >-
      « 2° Des assurés ayant atteint l'âge prévu au IV de l'article L. 643-3 et
      relevant de l'une des catégories suivantes : a) Reconnus inaptes au travail dans
      les conditions prévues à l'article L. 643-5 ; b) Grands invalides mentionnés aux
      articles L. 36 et L. 37 du code des pensions militaires d'invalidité et des
      victimes de la guerre ; c) Anciens déportés et internés titulaires de la carte de
      déporté ou interné de la Résistance ou de la carte de déporté ou interné
      politique ; d) Personnes mentionnées au 5° de l'article L. 351-8. 3° Des
      travailleurs handicapés admis à demander la liquidation de leur pension de
      retraite dans les conditions prévues au III de l'article L. 643-3 »
  - id: LEGIARTI000047453031
    article: >-
      code de la sécurité sociale, article L. 643-3, IV, rédaction du 1er septembre 2023
      (pensions prenant effet à compter de cette date)
    en_vigueur: 2023-09-01
    citation: >-
      « IV.-La condition d'âge prévue au premier alinéa du I du présent article est
      abaissée, dans des conditions fixées par décret, pour les assurés relevant des 2°
      et 3° de l'article L. 643-4. »
  - id: LEGIARTI000047634694
    article: >-
      code de la sécurité sociale, article D. 643-14, rédaction du 1er septembre 2023
    en_vigueur: 2023-09-01
    citation: >-
      « L'âge prévu au IV de l'article L. 643-3 est celui prévu à l'article D.
      351-1-14. » ; « Conformément à l'article 9 du décret n° 2023-436 du 3 juin 2023,
      ces dispositions s'appliquent aux pensions prenant effet à compter du 1er
      septembre 2023. »
  - id: LEGIARTI000047634688
    article: >-
      code de la sécurité sociale, article D. 351-1-14, rédaction du 1er septembre 2023
      au 1er janvier 2026
    en_vigueur: 2023-09-01
    citation: >-
      « L'âge prévu au premier alinéa de l'article L. 351-1 est abaissé, en application
      de l'article L. 351-1-5, à soixante-deux ans pour les assurés reconnus inaptes au
      travail dans les conditions prévues à l'article L. 351-7 et pour les assurés dont
      l'incapacité permanente est supérieure ou égale au pourcentage prévu pour
      l'application de l'article L. 821-2. »
  nee_de: JORFARTI000047977908
  bornes:
    liquidation.date_effet: [2023-09-01, 2024-01-01]
  contenu:
    parametres:
      abattement_points: cavom
      age_ouverture_par_generation: true
      age_taux_plein_par_generation: true
      age_sans_coefficient_de_l_inapte: age_legal_par_generation
      categories_sans_coefficient: [taux_plein_anciens_deportes_internes]
    droit: >-
      taux plein « de 67 ans » ; le barème de 2011 demeure jusqu'au 31 décembre, 5 %
      par tranche de douze mois avant 67 ans ; la majoration par année pleine différée
      demeure, hors des années de cumul emploi-retraite. Le modèle lit 67 ans dans la
      table du 1° de L. 351-8, qui le donne à toute génération que la minoration peut
      atteindre (voir les approximations)
    conditions: >-
      sans minoration, dès l'âge du IV de L. 643-3, les assurés des 2° et 3° de L.
      643-4 — l'inapte, le grand invalide, l'ancien déporté ou interné, l'ancien
      prisonnier de guerre du 5° de L. 351-8, le travailleur handicapé — ; dès l'âge de
      L. 161-17-2, l'invalide professionnel à 66 % au moins. L'âge du IV de L. 643-3
      est celui de D. 351-1-14 (D. 643-14) : soixante-deux ans pour l'inapte et pour
      l'incapacité permanente au taux de L. 821-2 ; D. 351-1-14 ne nomme aucun âge pour
      les autres catégories du 2° (voir les approximations)
  exemples: aucun trouvé
- id: statuts_de_2024
  statut: lue
  textes:
  - id: JORFARTI000047977903
    article: arrêté du 4 août 2023, article 2, 2°
    en_vigueur: 2024-01-01
    publie_le: 2023-08-18
    citation: >-
      « 2° Les dispositions prévues aux a, c et d du 7° de l'annexe au présent arrêté
      entrent en vigueur le 1er janvier 2024. »
  - id: JORFARTI000047977908
    article: annexe de l'arrêté du 4 août 2023, 7°, a, c et d (article 16)
    en_vigueur: 2024-01-01
    publie_le: 2023-08-18
    citation: >-
      « a) Au premier alinéa, le mot : « différée » est remplacée par les mots :
      « cotisée dans le présent régime » ; » ; « c) Au deuxième alinéa, après les mots
      : « au compte de l'adhérent », sont insérés les mots : « de 1,25 % par trimestre
      manquant pour atteindre l'âge mentionné au premier alinéa de l'article 15. » ; d)
      Les troisième à huitième alinéas sont remplacés par les dispositions suivantes :
      « Par dérogation au deuxième alinéa et sous réserve que l'assuré réponde aux
      conditions pour bénéficier du dispositif prévu à l'article L. 351-1-1 du code de
      la sécurité sociale, la retraite complémentaire peut être liquidée au plus tôt :
      « - à 62 ans pour les assurés ayant commencé leur activité avant l'âge de 20 ans ;
      « - à 63 ans pour les assurés ayant commencé leur activité avant l'âge de 21 ans.
      « Avec, dans les deux cas, l'application d'un coefficient de minoration de 15 %. »
  nee_de: JORFARTI000047977903
  bornes:
    liquidation.date_effet: [2024-01-01, 2026-07-18]
  contenu:
    parametres:
      abattement_points: decote_du_regime_de_base
      age_ouverture_par_generation: true
      age_taux_plein: 67
      age_taux_plein_par_generation: false
      decote_par_trimestre: 0.0125
      age_sans_coefficient_de_l_inapte: 62
      categories_sans_coefficient: [taux_plein_anciens_deportes_internes, taux_plein_anciens_combattants_prisonniers]
    droit: >-
      taux plein à 67 ans ; liquidation dès l'âge de L. 161-17-2 avec 1,25 % de
      minoration par trimestre manquant pour atteindre 67 ans, 25 % à 62 ans ; 5 % de
      majoration par année pleine cotisée au-delà, 25 % au plus, hors des années de
      cumul emploi-retraite ; la durée d'assurance n'entre nulle part
    conditions: >-
      celles de la version statuts_de_septembre_2023 ; et, sous les conditions de L.
      351-1-1, la longue carrière liquidée à 62 ou 63 ans à 15 % de minoration
  exemples: [cavamac_rco_decote_cinq_trimestres]
- id: reglement_de_2026
  statut: lue
  textes:
  - id: JORFARTI000054436046
    article: >-
      règlement du régime d'assurance vieillesse complémentaire, annexe I de l'arrêté
      du 10 juillet 2026, articles 4 et 5
    en_vigueur: 2026-07-18
    publie_le: 2026-07-17
    citation: >-
      « Sous réserve du respect des conditions mentionnées à l'article 2, la pension de
      retraite complémentaire est liquidée à taux plein à tout adhérent qui atteint
      l'âge de 67 ans. » (article 4) ; « Sous réserve du respect des conditions
      mentionnées à l'article 2, la pension de retraite complémentaire peut être
      liquidée au plus tôt à partir de l'âge prévu à l'article L. 161-17-2 du code de
      la sécurité sociale avec application d'un coefficient de minoration au nombre de
      points de retraite acquis au compte de l'adhérent de 1,25 % par trimestre manquant
      pour atteindre l'âge mentionné […] » ; « A compter de l'âge de 64 ans, les assurés
      mentionnés au quatrième et cinquième alinéa n'entrent plus dans le champ de la
      dérogation. Ils se voient appliquer le régime de droit commun de minoration prévu
      au deuxième alinéa, soit un coefficient de minoration de 1,25 % par trimestre
      manquant pour atteindre l'âge mentionné au premier alinéa de l'article 4. »
      (article 5)
  - id: LEGIARTI000054168357
    article: >-
      décret n° 67-1169 du 22 décembre 1967, article 4, dans la rédaction du décret n°
      2026-418, en vigueur le 1er juillet 2026
    en_vigueur: 2026-07-01
    citation: >-
      « Les conditions d'attribution et de service des prestations du présent régime
      sont précisées par un règlement de la section professionnelle des agents généraux
      d'assurance, approuvé par arrêté du ministre chargé de la sécurité sociale après
      avis de la Caisse nationale d'assurance vieillesse des professions libérales. »
  - id: LEGIARTI000053355951
    article: >-
      code de la sécurité sociale, article D. 351-1-14, rédaction du 1er janvier 2026
      (pensions prenant effet à compter de cette date)
    en_vigueur: 2026-01-01
    citation: >-
      « L'âge prévu au premier alinéa de l'article L. 351-1 est abaissé, en application
      de l'article L. 351-1-5, à soixante-deux ans pour les assurés reconnus inaptes au
      travail dans les conditions prévues à l'article L. 351-7 et pour les assurés dont
      l'incapacité permanente est supérieure ou égale au pourcentage prévu pour
      l'application de l'article L. 821-2. »
  nee_de: JORFARTI000054436046
  bornes:
    liquidation.date_effet: [2026-07-18, null]
  contenu:
    parametres:
      abattement_points: decote_du_regime_de_base
      age_ouverture_par_generation: true
      age_taux_plein: 67
      age_taux_plein_par_generation: false
      decote_par_trimestre: 0.0125
      age_sans_coefficient_de_l_inapte: 62
      categories_sans_coefficient: [taux_plein_anciens_deportes_internes, taux_plein_anciens_combattants_prisonniers]
    droit: >-
      la règle de 2024, que le règlement reprend des statuts ; la longue carrière n'y
      garde ses 15 % que jusqu'à 64 ans, puis prend le droit commun
    conditions: >-
      celles de 2024 (article 4) ; du 1er au 17 juillet 2026, le décret renvoie à un
      règlement que l'arrêté, qui ne fixe pas de date, n'approuve qu'au 18 : la fiche
      garde les statuts jusque-là, de même règle (ce que le texte ne tranche pas)
  exemples: aucun trouvé
approximations:
- version: [statuts_d_avant_2011]
  textes: >-
    statuts de 1967, articles 15 et 16 dans leurs rédactions de 1990 et de 1998, au
    seul Bulletin officiel
  ecart: >-
    Le modèle sert avant le 1er juillet 2011 la minoration de 2011, que nul texte lu ne
    date ; il n'y sert en revanche aucune majoration (les périodes de 1968 à 2011 n'ont
    pas de `surcote_par_trimestre`), et il y minore l'inapte et l'ancien déporté comme
    les autres : la présomption ne porte que sur la minoration.
    Ce que les statuts d'alors disaient de l'une, de l'autre et des catégories servies
    sans minoration n'est pas lu.
  effet: non mesuré
- version: [statuts_de_2011, statuts_de_septembre_2023, statuts_de_2024, reglement_de_2026]
  textes: >-
    statuts de 2011, article 15, c à e ; arrêté du 4 août 2023, annexe, 6°, b ;
    règlement de 2026, article 4
  ecart: >-
    L'inapte et l'ancien déporté ou interné sont servis sans minoration depuis le 14
    novembre 2026, et l'ancien combattant ou prisonnier de guerre depuis les statuts de
    2024 (historique). Restent minorés comme les autres : l'ancien prisonnier ou
    combattant de 2011 au 31 décembre 2023 — les statuts de 2011 le servent « aux âges
    et conditions de durée de captivité ou services fixés » par le décret n° 74-436 du
    15 mai 1974, dont l'article 1er, de soixante ans pour cinquante-quatre mois à
    soixante-quatre ans pour six (LEGIARTI000006764071), est abrogé depuis le 21
    décembre 1985, et la fiche `taux_plein_anciens_combattants_prisonniers` sert sur ces
    années les âges décalés de la pratique de la Cnav, que ces statuts ne nomment pas ;
    de septembre à décembre 2023, le 5° de L. 351-8 que nomme le 2° de L. 643-4 n'est
    pas servi non plus, la période de 2019 à 2023 gardant la seule catégorie de 2011 — ;
    le grand invalide et l'invalide professionnel à 66 %, que nulle saisie ne dit ; le
    travailleur handicapé du 3° de L. 643-4, depuis le 1er septembre 2023 :
    `abattement_regime_de_base` ne l'exonère que dans les régimes que nomme la fiche du
    handicap, où la CAVAMAC n'est pas. Seule compte l'inaptitude que la carrière
    déclare : la procédure de la commission d'inaptitude n'est pas modélisée.
    L'âge du IV de L. 643-3 est à l'index du dépôt, quand la
    fiche le disait fixé par un décret non lu : L. 643-3, IV (LEGIARTI000047453031, pensions
    prenant effet depuis le 1er septembre 2023) dit que la condition d'âge « est
    abaissée, dans des conditions fixées par décret, pour les assurés relevant des 2°
    et 3° de l'article L. 643-4 » ; D. 643-14 (LEGIARTI000047634694, même date) : « L'âge
    prévu au IV de l'article L. 643-3 est celui prévu à l'article D. 351-1-14 » ; D.
    351-1-14 (LEGIARTI000047634688 du 1er septembre 2023 au 1er janvier 2026, puis
    LEGIARTI000053355951) : l'âge de L. 351-1 « est abaissé, en application de l'article
    L. 351-1-5, à soixante-deux ans pour les assurés reconnus inaptes au travail dans
    les conditions prévues à l'article L. 351-7 et pour les assurés dont l'incapacité
    permanente est supérieure ou égale au pourcentage prévu pour l'application de
    l'article L. 821-2 ». La rédaction de L. 643-3 du 31 décembre 2025
    (LEGIARTI000053280388, pensions prenant effet à compter du 1er septembre 2026) garde
    le IV mot pour mot ; le reste de cette rédaction n'est pas lu ici. Ce que le texte
    ne tranche pas : l'âge du grand invalide, de l'ancien déporté ou interné et de la
    personne du 5° de L. 351-8, que D. 351-1-14 ne nomme pas — le modèle les sert dès
    l'âge de L. 161-17-2, ou aux âges de D. 351-2 — ; et si l'inapte de L. 643-5
    (L. 643-4, 2°, a) est celui que D. 351-1-14 nomme « dans les conditions prévues à
    l'article L. 351-7 » : L. 643-5 n'est pas lu ici. Le modèle
    n'ouvre pas la pension à cet âge de soixante-deux ans : il refuse l'inapte avant
    l'âge légal de sa génération, motif `non_ouverte` (le né en 1965 parti à 62 ans, âge
    légal opposé 62,75 ans, le né en 1966, 63,25 ans : relecture R-E, 5 novembre 2026 ;
    revu le 14 novembre), et ne le sert sans minoration qu'à cet âge légal. De septembre
    à décembre 2023, la période garde pour l'inapte l'âge légal de 2011, ce qui revient
    au même tant que la pension ne s'ouvre pas avant. L'ouverture à soixante-deux ans
    est posée au propriétaire, non corrigée.
  effet: >-
    non mesuré dans la population : les catégories qui restent minorées sont rares
    parmi les agents généraux qui liquident depuis 2011 (un ancien combattant d'Algérie
    a plus de soixante-sept ans en 2011) ; depuis le 1er septembre 2023, le modèle
    refuse la pension de l'inapte entre soixante-deux ans et l'âge légal quand
    celui-ci le dépasse (les générations 1965 et 1966 à 62 ans, motif `non_ouverte`),
    là où le texte l'ouvre
- version: [statuts_de_septembre_2023]
  textes: arrêté du 4 août 2023, annexe, 6°, a
  ecart: >-
    Le texte fixe le taux plein « de 67 ans » pour tous ; le modèle le lit, jusqu'au 31
    décembre 2023, dans la table du 1° de L. 351-8 (67 ans depuis la génération 1955,
    de 65 ans et 4 mois à 66 ans et 7 mois pour celles de juillet 1951 à 1954). La
    minoration n'en change pas : nul n'est minoré qui n'a pas 67 ans au taux plein
    (les générations d'avant 1955 ont toutes plus de 68 ans le 1er septembre 2023).
    La majoration se compte, pour elles, depuis un âge trop bas.
  effet: >-
    non mesuré dans la population ; l'agent né en février 1954 qui liquide en novembre
    2023 à 69 ans et 9 mois a deux années pleines au-delà de 67 ans, 10 % ; le modèle
    en compte trois depuis 66 ans et 7 mois, et sert 1,15 au lieu de 1,10 (essai du 5
    novembre 2026)
- version: [statuts_de_2024, reglement_de_2026]
  textes: >-
    arrêté du 4 août 2023, annexe, 7°, d ; règlement de 2026, article 5, troisième à
    sixième alinéas
  ecart: >-
    Le modèle ne porte pas la longue carrière à 15 % de minoration à 62 ou 63 ans : il
    lui oppose 1,25 % par trimestre manquant jusqu'à 67 ans. Depuis le 18 juillet
    2026, le règlement lui rend le droit commun à 64 ans.
  effet: >-
    non mesuré dans la population ; l'agent né en 1964 au travail depuis ses 18 ans
    reçoit au modèle 0,75 à 62 ans (20 trimestres × 1,25 % = 25 %) et 0,80 à 63 ans (16
    × 1,25 % = 20 %), au texte 0,85 aux deux âges (essai du 5 novembre 2026)
- version: [statuts_de_2011, statuts_de_septembre_2023, statuts_de_2024, reglement_de_2026]
  textes: statuts de 2011, article 20 ; règlement de 2026, article 9
  ecart: >-
    Les deux textes disent la même phrase, mot pour mot : « La date d'effet de la pension
    de retraite complémentaire est fixée, au plus tôt, au premier jour du trimestre civil
    qui suit la demande écrite de l'adhérent et à la condition qu'il ait adressé à la
    caisse l'ensemble des pièces justificatives dans les trois mois suivants sa demande.
    A défaut, cette date d'effet pourra être modifiée par la caisse. » Le modèle ne sert
    pas ce trimestre : la fiche `date_effet_mois_suivant` nomme `cavamac_complementaire`
    et fait partir la pension le premier jour du mois qui suit l'âge atteint. Il liquide
    ainsi l'agent né en février 1945 au 1er novembre 2011, et d'autres au 1er novembre
    2023 ou au 1er février 2026, des jours que le texte ne nomme pas. Ce que le texte ne
    tranche pas : « au plus tôt » fixe un plancher, et il ne dit pas si la caisse fixe
    d'autres jours que le premier d'un trimestre civil ; la demande, dont la date
    décide, n'est pas une donnée du modèle. La phrase est relue en 2011 et en 2026 ;
    entre les deux, ce point n'est pas relu.
  effet: >-
    non mesuré dans la population ; la pension que le modèle fait partir le 1er novembre
    2023 se compare au 1er octobre 2023 ou au 1er janvier 2024, premiers jours de
    trimestre civil : un ou deux mois d'écart sur la date d'effet, selon la demande
- version: [statuts_d_avant_2011, statuts_de_2011, statuts_de_septembre_2023, statuts_de_2024, reglement_de_2026]
  textes: >-
    statuts de 2011, articles 22 et 23 ; règlement de 2026, articles 11 et 12 ; avant
    2011, nul texte lu de la réversion
  ecart: >-
    Le modèle ne sert aucune réversion de la CAVAMAC : aucune fiche de réversion ne
    nomme `cavamac_complementaire`, et la ligne vaut zéro, motif `non_portee`, comme
    pour la CAVEC et la CARPV (relecture R-E). Les statuts de 2011 et le règlement de
    2026 servent au conjoint survivant âgé d'au moins 65 ans, marié deux ans au moins
    ou dont un enfant est issu de l'union, de l'adhérent titulaire d'au moins 1 500
    points, « soixante pour cent (60 %) des points de retraite acquis par l'adhérent
    décédé » ; son montant « n'est pas minoré par le coefficient de minoration »
    mais « bénéficie du coefficient de prorogation ».
  effet: non mesuré ; pour le conjoint survivant, toute la réversion
