historique:
- >-
  2026-11-20 — écrite avec la clause de sauvegarde de 2023 (fiche
  carriere_longue_sauvegarde_de_2023), dont elle sert le taux.
effet: >-
  La pension que la clause de sauvegarde de 2023 ouvre sans la durée de la génération
  est servie au taux plein : 50 % au lieu de 49,375 % pour un trimestre manquant, et sa
  complémentaire sans coefficient d'anticipation. Les autres carrières longues ont déjà
  la durée requise.
a_confronter:
- source: union_retraite_carriere_longue
  quoi: le taux plein du départ anticipé
