schema_version: 1
id: taux_plein_carriere_longue
intitule: >-
  La pension dont l'âge est abaissé pour carrière longue est servie au taux plein, sans
  coefficient de minoration, quelle que soit la durée d'assurance (L. 351-8, 4° ter ;
  L. 14, I, du code des pensions ; L. 732-25 du code rural), pour les pensions prenant
  effet à compter du 1er septembre 2023.
domaine: decote_surcote
regimes: [regime_general, msa_salaries, cancava, organic, rsi, fonction_publique_etat,
  msa_non_salaries]
etape: liquider_chaque_regime
face: droit
etat: conforme
lit:
- ce qui ouvre la liquidation, que dit « ouvrir le droit » (la carrière longue)
- liquidation.date_effet
ecrit:
- le taux plein du régime, sans décote, que « liquider chaque régime » applique, celui
  que le minimum contributif demande et celui que les complémentaires suivent
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le moteur
# (droit/categories.js, `tauxPleinDeLaCarriereLongue`) lit : `existe` ; `regimes`, ceux
# dont le texte écarte la décote de la pension que la carrière longue ouvre.
