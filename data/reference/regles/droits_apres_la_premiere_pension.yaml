schema_version: 1
id: droits_apres_la_premiere_pension
intitule: >-
  Après une première pension de base, l'activité n'ouvre plus aucun droit à retraite,
  de base ni complémentaire : pour qui prend sa première pension depuis le 1er janvier
  2015 (L. 161-22-1 A), puis pour tous depuis le 1er septembre 2023 (L. 161-22-1).
  Échappent à la règle la retraite progressive, la pension militaire et, pour les
  droits constitués depuis le 1er janvier 2023, le cumul intégral, qui ouvre une
  seconde pension ; pour
  les premières pensions prises depuis 2027, le cumul entier, à partir de l'âge du
  taux plein automatique, et les exceptions de L. 161-22-1-2.
domaine: cumul
regimes: [regime_general, msa_salaries, msa_non_salaries, cancava, organic, rsi, cnavpl, cnbf,
  cavimac, mines, fonction_publique_etat, cnracl, fspoeie, banque_de_france,
  chemins_fer_secondaires, comedie_francaise, crpcen, ieg, marins, opera_de_paris,
  port_strasbourg, ratp, seita, sncf, agirc_arrco, ircantec, rci, msa_rco,
  carcdsf_complementaire, carmf_complementaire, carpimko_complementaire,
  carpv_complementaire, cavamac_complementaire, cavec_complementaire,
  cavom_complementaire, cavp_complementaire, cipav_complementaire, cnbf_complementaire,
  cprn_complementaire, ircec_raap, ircec_racd, ircec_racl, rafp]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- la date d'effet de la première pension de vieillesse de base
- les périodes d'activité qui suivent, et leur date
- la nature de la première pension (militaire, progressive) et les conditions du cumul
  intégral
ecrit:
- les lignes du relevé qu'une activité après la première pension n'ouvre pas, ou
  qu'elle ouvre au titre d'une seconde pension
dates_qui_decident:
- liquidation.premiere_pension_de_base
- droit_acquis
versions:
- id: sans_regle_generale
  statut: supposee
  hypothese: >-
    avant la loi du 20 janvier 2014, aucun texte général n'éteint l'acquisition de
    droits après une première pension : chaque régime garde ses règles, et une pension
    prise dans un régime n'empêche pas d'en acquérir dans un autre. Le VIII de
    l'article 19 de cette loi ne l'applique qu'aux premières pensions prises à compter
    du 1er janvier 2015, et l'article L. 161-22-1 de 2023 n'entre en vigueur que le
    1er septembre 2023 (les mois de janvier à août 2023 : version transition_2023)
  fiabilite: moyenne
  bornes:
    liquidation.premiere_pension_de_base: [null, 2015-01-01]
    droit_acquis: [null, 2023-01-01]
  contenu:
    droit: >-
      l'activité après une première pension ouvre des droits dans les régimes qui ne
      l'ont pas liquidée, selon leurs propres règles
    parametres:
      droits_nouveaux: selon_le_regime
  exemples: [cnav_2015_08_exemple_6_premiere_retraite_d_avant_2015]
- id: transition_2023
  statut: lue
  textes:
  - {id: JORFARTI000047445113, article: "loi n° 2023-270 du 14 avril 2023, article 26, XII",
     publie_le: 2023-04-15, lu_le: 2026-11-19}
  - {id: JORFARTI000028493657, article: "loi n° 2014-40 du 20 janvier 2014, article 19, VIII",
     publie_le: 2014-01-21, lu_le: 2026-11-19}
  nee_de: JORFARTI000047445113
  exception_de: loi_2023
  bornes:
    liquidation.premiere_pension_de_base: [null, 2015-01-01]
    droit_acquis: [2023-01-01, 2023-09-01]
  contenu:
    droit: >-
      « Le présent article entre en vigueur le 1er septembre 2023 » (loi n° 2023-270,
      article 26, XII) : jusqu'au 31 août 2023, seul L. 161-22-1 A éteint les droits,
      et il n'est « applicable [qu']aux assurés dont la première pension prend effet à
      compter du 1er janvier 2015 » (loi n° 2014-40, article 19, VIII). Pour une
      première pension d'avant 2015, l'activité de janvier à août 2023 ouvre donc
      encore des droits dans les régimes qui ne l'ont pas liquidée, selon leurs
      propres règles
    exceptions: >-
      dans le régime qui sert déjà la pension, le cumul intégral ouvre dès ces mois
      les droits à une seconde pension, sans borne de première pension : « La
      liquidation des pensions [...] intervenant à compter du 1er septembre 2023 prend
      en compte [...] les droits en vue d'une nouvelle pension de vieillesse constitués
      à partir du 1er janvier 2023 en application du 2° de l'article L. 161-22-1 et de
      l'article L. 161-22-1-1 » (article 26, XII, 3°)
    parametres:
      droits_nouveaux: selon_le_regime
      exceptions: [cumul_integral]
  exemples: aucun trouvé
  exemples_cherches: >-
    le 19 novembre 2026, par la session qui a relu la date sans avoir vu la fiche : les
    66 circulaires de la Cnav de 2023 et 2024, dont aucune n'a le cumul emploi-retraite
    pour objet ; les exposés « Retraite personnelle issue d'un cumul emploi retraite »
    (28 septembre 2026) et « Fin d'acquisition de droits à retraite » (24 novembre
    2025), sans exemple ; la fiche F13243 de service-public.gouv.fr, qui ne dit rien
    des premières pensions d'avant 2015
- id: loi_2014
  statut: lue
  textes:
  - {id: JORFARTI000028493657, article: "loi n° 2014-40 du 20 janvier 2014, article 19",
     publie_le: 2014-01-21}
  - {id: LEGIARTI000028496884, article: "L. 161-22-1 A CSS", en_vigueur: 2014-01-22}
  nee_de: JORFARTI000028493657
  bornes:
    liquidation.premiere_pension_de_base: [2015-01-01, 2027-01-01]
    droit_acquis: [null, 2023-01-01]
  contenu:
    droit: >-
      « La reprise d'activité par le bénéficiaire d'une pension de vieillesse
      personnelle servie par un régime de retraite de base légalement obligatoire
      n'ouvre droit à aucun avantage de vieillesse, de droit direct ou dérivé, auprès
      d'aucun régime légal ou rendu légalement obligatoire d'assurance vieillesse, de
      base ou complémentaire » (L. 161-22-1 A)
    exceptions: >-
      la retraite progressive (« n'est pas opposable à l'assuré qui demande le bénéfice
      d'une pension au titre d'une retraite progressive ») ; la pension militaire :
      « les articles L. 161-22 et L. 161-22-1 A du même code ne sont pas applicables
      aux bénéficiaires d'une pension militaire » (L. 84 CPCMR, par le V du même
      article 19) ; les marins, pour qui le II n'entre en vigueur que le 1er janvier
      2018 (IX)
    parametres:
      droits_nouveaux: aucun
      exceptions: [retraite_progressive, pension_militaire, marins_avant_2018]
  exemples: [cnav_2015_08_exemple_7_premiere_retraite_de_2015]
- id: loi_2023
  statut: lue
  textes:
  - {id: JORFARTI000047445113, article: "loi n° 2023-270 du 14 avril 2023, article 26",
     publie_le: 2023-04-15}
  - {id: LEGIARTI000047453688, article: "L. 161-22-1 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047450790, article: "L. 161-22-1-1 CSS", en_vigueur: 2023-09-01}
  nee_de: JORFARTI000047445113
  bornes:
    liquidation.premiere_pension_de_base: [null, 2027-01-01]
    droit_acquis: [2023-01-01, null]
  contenu:
    droit: >-
      « La reprise ou la poursuite d'une activité professionnelle par le bénéficiaire
      d'une pension de vieillesse personnelle servie par un régime de retraite de base
      légalement obligatoire n'ouvre droit à aucun avantage de vieillesse » (L. 161-22-1,
      premier alinéa), quelle que soit la date de la première pension ; pour celle
      d'avant 2015, à compter du 1er septembre 2023 seulement, date d'entrée en
      vigueur de l'article (XII ; version transition_2023)
    exceptions: >-
      la retraite progressive (1°) ; le cumul intégral des conditions de L. 161-22 et
      de L. 84 CPCMR, la reprise chez le dernier employeur six mois au plus tôt après
      la liquidation (2°), dont les droits ouvrent une seconde pension (fiche
      seconde_pension) : « La liquidation des pensions [...] intervenant à compter du
      1er septembre 2023 prend en compte [...] les droits en vue d'une nouvelle pension
      de vieillesse constitués à partir du 1er janvier 2023 » (article 26, XII, 3°) ;
      la pension militaire, à qui L. 84 CPCMR retire L. 161-22, L. 161-22-1,
      L. 161-22-1-1 et L. 161-22-1-2
    parametres:
      droits_nouveaux: aucun
      exceptions: [retraite_progressive, cumul_integral, pension_militaire]
  exemples: [sp_f13243_nouvelle_pension_plafond, sp_f13243_cumul_dernier_employeur]
- id: lfss_2026
  statut: lue
  textes:
  - {id: LEGIARTI000053279754, article: "L. 161-22-1 CSS", en_vigueur: 2026-01-01}
  - {id: LEGIARTI000053279758, article: "L. 161-22-1-2 CSS", en_vigueur: 2025-12-31}
  - {id: LEGIARTI000053279730, article: "L. 161-22 CSS", en_vigueur: 2025-12-31}
  nee_de: LEGIARTI000053279758
  bornes:
    liquidation.premiere_pension_de_base: [2027-01-01, null]
    droit_acquis: [null, null]
  contenu:
    droit: >-
      la règle de 2023, pour qui « entre en jouissance de [sa] première pension de
      vieillesse de base à compter du 1er janvier 2027 » (loi n° 2025-1403, article
      102, XI)
    exceptions: >-
      la retraite progressive ; le cumul ENTIER, que le 3° du A du III de L. 161-22
      n'ouvre qu'« à l'âge [...] prévu au 1° de l'article L. 351-8 » ; et, par
      L. 161-22-1-2, « la constitution de droits supplémentaires » des marins, des
      artistes du ballet de l'Opéra, d'anciens mineurs, des « titulaires d'une pension
      militaire prévue à l'article L. 6 » et des titulaires de pensions d'invalidité
    parametres:
      droits_nouveaux: aucun
      exceptions: [retraite_progressive, cumul_entier, marins, ballet_de_l_opera,
                   mineurs, pension_militaire, pension_d_invalidite]
  exemples: aucun trouvé
  exemples_cherches: >-
    le 19 novembre 2026 : la fiche F13243 de service-public.gouv.fr, vérifiée le
    12 novembre 2026, qui annonce la règle de 2027 sans exemple ; dans la base de
    législation de la Cnav, l'exposé « Fin d'acquisition de droits à retraite » (24
    novembre 2025) et la fenêtre « Réforme du cumul emploi retraite » (27 février
    2026), sans exemple. Aucune circulaire de la Cnav n'applique encore la
    rédaction de 2026
sources:
  lu_le: 2026-09-30
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 29 septembre 2026 avec le domaine des départs multiples, calculée le 30,
    avec l'activité après le départ que l'adresse déclare : le modèle dit, mois par
    mois, ce que l'activité ouvre ou non, et liquide les droits qu'elle ouvre dans
    les régimes qui n'ont pas liquidé. Reste à lire la circulaire qui dirait si ces
    trimestres ouvrent la surcote du régime qui les liquide.
  - >-
    Lire la circulaire Cnav qui a appliqué L. 161-22-1 A (2014-2015) : la « reprise »
    d'activité y couvre-t-elle l'activité poursuivie dans un autre régime après la
    première pension, que la rédaction de 2023 vise en toutes lettres (« la reprise
    ou la poursuite ») ? Et la version supposée d'avant 2015 : un régime qui a
    liquidé acquiert-il sur une reprise d'activité ? Lue le 19 novembre 2026, la
    circulaire Cnav 2015/8 répond aux deux pour le régime général (lectures) ; les
    autres régimes restent à lire.
  - >-
    Après août 2023, la fiche suit la lettre de L. 161-22-1, qui ne reprend pas la
    borne de 2015 ; l'exposé « Fin d'acquisition de droits à retraite » de la Cnav
    (24 novembre 2025) garde cette borne sans date de fin. Si la caisse ouvre encore
    des droits ordinaires à la première pension d'avant 2015 après août 2023, loi_2023
    est trop large pour elle : seule une circulaire sur le cumul de 2023, que la base
    de la Cnav ne porte pas, ou une instruction ministérielle le trancherait.
  lectures:
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 2015/8 du 6 février 2015, « La cessation d'activité et le
      cumul emploi retraite à compter du 01-01-2015 », point 3, lu en entier dans la
      base de législation de la Cnav : « la notion de reprise d'activité non
      génératrice de droits, comprend également la poursuite d'une activité dans le
      cadre des dérogations à la cessation d'activité » (3.1) ; la reprise au régime
      général par son retraité « ne permet pas d'acquérir de nouveaux droits au
      régime général », son compte étant arrêté (3.2) ; pour une première retraite
      d'avant 2015, « ce sont les règles en vigueur avant la loi du 20 janvier 2014
      qui sont mises en œuvre » (3.6) ; exemples 6, 7 et 8
    date: 2026-11-19
  - type: service_public
    reference: >-
      fiche F13243, « Cumul emploi-retraite du salarié », vérifiée le 1er janvier 2026 :
      depuis le 1er janvier 2023, le cumul intégral ouvre de nouveaux droits « auprès de
      la caisse de retraite de base dont relève votre activité » ; reprise chez le
      dernier employeur dans les six mois, « votre nouvelle activité ne vous génèrera
      jamais de nouveau droit »
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F13243
    date: 2026-09-30
  - type: jorf
    reference: >-
      loi n° 2023-270 du 14 avril 2023, article 26, XII (JORFARTI000047445113), relu
      par une session qui n'avait vu ni la fiche ni la première lecture (note de
      décision 0009) : l'article « entre en vigueur le 1er septembre 2023 », et son 3°
      ne remonte au 1er janvier 2023 que pour « les droits en vue d'une nouvelle
      pension » ; pour une première pension d'avant 2015, les mois de janvier à août
      2023 gardent les règles d'avant (docs/feuille_de_route/191/
      2026-11-19-relecture-de-la-date-de-2023-du-cumul.md)
    date: 2026-11-19
  - type: jorf
    reference: >-
      loi n° 2014-40 du 20 janvier 2014, article 19 (JORFARTI000028493657), lu en
      entier dans l'index JORF : II (L. 161-22-1 A), V (L. 84 CPCMR, la pension
      militaire), VIII (premières pensions prises à compter du 1er janvier 2015), IX
      (les marins, au 1er janvier 2018)
    date: 2026-09-29
  - type: jorf
    reference: >-
      loi n° 2023-270 du 14 avril 2023, article 26 (JORFARTI000047445113), lu en
      entier : L. 161-22-1 A abrogé, L. 161-22-1 réécrit, L. 161-22-1-1 à L. 161-22-1-9
      créés, L. 84 CPCMR modifié ; XII, entrée en vigueur au 1er septembre 2023, droits
      constitués depuis le 1er janvier 2023
    date: 2026-09-29
  - type: legifrance
    reference: >-
      L. 161-22, L. 161-22-1, L. 161-22-1-1 et L. 161-22-1-2 CSS, rédactions de la loi
      n° 2025-1403 du 30 décembre 2025 (LEGIARTI000053279730, LEGIARTI000053279754,
      LEGIARTI000053279747, LEGIARTI000053279758) : applicables aux premières pensions
      prises à compter du 1er janvier 2027
    date: 2026-09-29
approximations:
- ecart: >-
    avant septembre 2023, pour une première pension d'avant 2015, et toujours pour
    une pension militaire, l'activité ouvre des droits dans les régimes qui n'ont pas
    liquidé : le
    modèle les liquide à la fin de l'activité, ou à l'âge d'ouverture du régime s'il
    vient après, sur la carrière prolongée des années qui les ouvrent, dont la durée
    tous régimes fait le taux, surcote comprise ; il tient pour définitive la pension
    du régime qui l'a déjà servie, et la pension d'un régime que le départ liquide
    plus tard, à son âge d'ouverture, ne compte pas l'activité
  effet: non mesuré
- ecart: >-
    les points de l'Agirc-Arrco acquis en cumul avant 2015 ne sont pas calculés ; les
    marins, pour qui la règle de 2014 n'entre en vigueur qu'en 2018, et les exceptions
    de L. 161-22-1-2 pour les premières pensions de 2027 (marins, ballet, mineurs,
    invalidité) ne se distinguent pas
  effet: non mesuré
- ecart: >-
    la reprise chez le dernier employeur dans les six mois de la pension ferme aux
    droits nouveaux toute l'activité déclarée, qui est une seule période
  effet: non mesuré
code:
  javascript: >-
    moteur/js/droit/seconde.js : droits, versionDesDroits, motif,
    liquiderLesRegimesNouveaux ;
    moteur/js/echeancier.js : Echeancier._liquiderLesRegimesNouveaux ;
    moteur/js/pages.js : sansNouveauxDroits, droitsDuCumul
  parametres: >-
    contenu.parametres de chaque version : droits_nouveaux, exceptions
  tests: >-
    tests/test_emploi_retraite.py ; les témoins seconde_pension_* et droits_* des
    simulations
  moteur: >-
    Le moteur lit la version qui vaut à la date de la première pension et à celle
    du mois d'activité (fiches_datees) : les dates de 2015, 2023 et 2027 sont les
    bornes des versions (action 191, étape 2 du cumul) ; le délai de six mois chez
    le dernier employeur reste un nombre de droit/seconde.js.
textes_a_relire:
- {id: LEGIARTI000047960984, article: "R. 161-19-4 CSS", en_vigueur: 2023-09-01,
   question: "les droits supplémentaires des marins, du ballet et des mineurs, qui s'arrêtent après la seconde pension"}
historique:
- >-
  2026-09-29 — née avec le domaine des départs multiples.
- >-
  2026-09-30 — calculée : le modèle dit, mois par mois de l'activité après le
  départ, ce qu'elle ouvre ou non, et en tire la nouvelle pension (fiche
  seconde_pension).
- >-
  2026-09-30 — les droits que l'activité ouvre dans les régimes qui n'ont pas
  liquidé — première pension d'avant 2015, pension militaire — se liquident, comme
  un départ induit.
- >-
  2026-11-19 — le moteur lit la règle dans les versions de la fiche, aux deux dates
  qui décident, et n'écrit plus celles de 2015, 2023 et 2027 (action 191, étape 2
  du cumul) ; aucun résultat ne bouge. Trois versions prennent leurs exemples
  officiels, ceux de la circulaire Cnav 2015/8 et de la fiche F13243, et la
  quatrième dit ce qui a été cherché.
- >-
  2026-11-19 — sur l'accord du propriétaire, la règle des mois du titulaire d'une
  pension militaire est la version qui vaut pour sa première pension :
  sans_regle_generale avant 2023 pour une première pension d'avant 2015, et non
  plus loi_2014 ; lfss_2026 pour une première pension de 2027, et non plus
  loi_2023. Seul ce nom change dans les résultats, pour ces deux cas : les droits
  ouverts sont les mêmes.
- >-
  2026-11-20 — la date de 2023, relue par une session indépendante le 19 et
  corrigée sur l'accord du propriétaire : pour une
  première pension d'avant 2015, la règle de 2023 ne vaut qu'à compter du
  1er septembre 2023, date d'entrée en vigueur de l'article 26 de la loi n° 2023-270,
  et non du 1er janvier. La version transition_2023 porte ses mois de janvier à août
  2023 : des droits ordinaires dans le régime qui n'a rien liquidé, et déjà, en cumul
  intégral, ceux d'une seconde pension dans le régime qui sert la première (XII, 3°).
effet: >-
  Toute personne qui travaille après sa première pension, dans le même régime ou dans
  un autre : le fonctionnaire de catégorie active parti à cinquante-sept ans et passé
  au privé, le retraité qui reprend un emploi. Depuis 2015, ses cotisations ne lui
  ouvrent plus rien, hors la pension militaire et, depuis 2023, le cumul intégral.
  La salariée partie en 2022 sans la durée requise, qui retravaille dix-huit mois,
  n'acquiert rien ; partie au taux plein, elle se constitue une nouvelle pension. Le
  militaire parti à quarante-cinq ans en 2020, salarié ensuite, acquiert au régime
  général et à l'Agirc-Arrco, qui le servent à l'âge légal.
