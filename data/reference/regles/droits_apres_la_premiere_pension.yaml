    droit_acquis: [null, null]
  contenu:
    droit: >-
      la règle de 2023, pour qui « entre en jouissance de [sa] première pension de
      vieillesse de base à compter du 1er janvier 2027 » (loi n° 2025-1403, article
      102, XI)
    exceptions: >-
      la retraite progressive ; le cumul ENTIER, que le 3° du A du III de L. 161-22
