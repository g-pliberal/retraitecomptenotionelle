      exceptions: [retraite_progressive, cumul_entier, marins, ballet_de_l_opera,
                   mineurs, pension_militaire, pension_d_invalidite]
  exemples: aucun trouvé
sources:
  lu_le: 2026-09-30
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 29 septembre 2026 avec le domaine des départs multiples, calculée le 30,
    avec l'activité après le départ que l'adresse déclare : le modèle dit, mois par
    mois, ce que l'activité ouvre ou non, et liquide les droits qu'elle ouvre dans
    les régimes qui n'ont pas liquidé. Reste à lire la circulaire qui dirait si ces
    trimestres ouvrent la surcote du régime qui les liquide.
  - >-
    Lire la circulaire Cnav qui a appliqué L. 161-22-1 A (2014-2015) : la « reprise »
    d'activité y couvre-t-elle l'activité poursuivie dans un autre régime après la
    première pension, que la rédaction de 2023 vise en toutes lettres (« la reprise
    ou la poursuite ») ? Et la version supposée d'avant 2015 : un régime qui a
    liquidé acquiert-il sur une reprise d'activité ?
  lectures:
  - type: service_public
    reference: >-
      fiche F13243, « Cumul emploi-retraite du salarié », vérifiée le 1er janvier 2026 :
      depuis le 1er janvier 2023, le cumul intégral ouvre de nouveaux droits « auprès de
      la caisse de retraite de base dont relève votre activité » ; reprise chez le
      dernier employeur dans les six mois, « votre nouvelle activité ne vous génèrera
      jamais de nouveau droit »
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F13243
    date: 2026-09-30
  - type: jorf
    reference: >-
      loi n° 2014-40 du 20 janvier 2014, article 19 (JORFARTI000028493657), lu en
      entier dans l'index JORF : II (L. 161-22-1 A), V (L. 84 CPCMR, la pension
      militaire), VIII (premières pensions prises à compter du 1er janvier 2015), IX
      (les marins, au 1er janvier 2018)
    date: 2026-09-29
  - type: jorf
    reference: >-
      loi n° 2023-270 du 14 avril 2023, article 26 (JORFARTI000047445113), lu en
      entier : L. 161-22-1 A abrogé, L. 161-22-1 réécrit, L. 161-22-1-1 à L. 161-22-1-9
      créés, L. 84 CPCMR modifié ; XII, entrée en vigueur au 1er septembre 2023, droits
      constitués depuis le 1er janvier 2023
    date: 2026-09-29
  - type: legifrance
    reference: >-
      L. 161-22, L. 161-22-1, L. 161-22-1-1 et L. 161-22-1-2 CSS, rédactions de la loi
      n° 2025-1403 du 30 décembre 2025 (LEGIARTI000053279730, LEGIARTI000053279754,
      LEGIARTI000053279747, LEGIARTI000053279758) : applicables aux premières pensions
      prises à compter du 1er janvier 2027
    date: 2026-09-29
approximations:
- ecart: >-
    avant 2023, pour une première pension d'avant 2015, et toujours pour une pension
    militaire, l'activité ouvre des droits dans les régimes qui n'ont pas liquidé : le
    modèle les liquide à la fin de l'activité, ou à l'âge d'ouverture du régime s'il
    vient après, sur la carrière prolongée des années qui les ouvrent, dont la durée
    tous régimes fait le taux, surcote comprise ; il tient pour définitive la pension
    du régime qui l'a déjà servie, et la pension d'un régime que le départ liquide
    plus tard, à son âge d'ouverture, ne compte pas l'activité
  effet: non mesuré
- ecart: >-
    les points de l'Agirc-Arrco acquis en cumul avant 2015 ne sont pas calculés ; les
    marins, pour qui la règle de 2014 n'entre en vigueur qu'en 2018, et les exceptions
    de L. 161-22-1-2 pour les premières pensions de 2027 (marins, ballet, mineurs,
    invalidité) ne se distinguent pas
  effet: non mesuré
- ecart: >-
    la reprise chez le dernier employeur dans les six mois de la pension ferme aux
    droits nouveaux toute l'activité déclarée, qui est une seule période
  effet: non mesuré
code:
  python: >-
    droit/seconde.py : droits, _motif, liquider_les_regimes_nouveaux ; droit/cumul.py :
    fonction_publique_quittee ; echeancier.py : Echeancier._constituer,
    Echeancier._liquider_les_regimes_nouveaux
  javascript: >-
    moteur/js/droit/seconde.js ; moteur/js/echeancier.js :
    Echeancier._liquiderLesRegimesNouveaux ; moteur/js/pages.js : sansNouveauxDroits,
    droitsDuCumul
  parametres: "constantes de droit/seconde.py : les dates de 2015, 2023 et 2027"
  tests: >-
    tests/test_emploi_retraite.py ; les témoins seconde_pension_* et droits_* des
    simulations
textes_a_relire:
- {id: LEGIARTI000047960984, article: "R. 161-19-4 CSS", en_vigueur: 2023-09-01,
   question: "les droits supplémentaires des marins, du ballet et des mineurs, qui s'arrêtent après la seconde pension"}
historique:
- >-
  2026-09-29 — née avec le domaine des départs multiples.
- >-
  2026-09-30 — calculée : le modèle dit, mois par mois de l'activité après le
  départ, ce qu'elle ouvre ou non, et en tire la nouvelle pension (fiche
  seconde_pension).
- >-
  2026-09-30 — les droits que l'activité ouvre dans les régimes qui n'ont pas
  liquidé — première pension d'avant 2015, pension militaire — se liquident, comme
  un départ induit.
effet: >-
  Toute personne qui travaille après sa première pension, dans le même régime ou dans
  un autre : le fonctionnaire de catégorie active parti à cinquante-sept ans et passé
  au privé, le retraité qui reprend un emploi. Depuis 2015, ses cotisations ne lui
  ouvrent plus rien, hors la pension militaire et, depuis 2023, le cumul intégral.
  La salariée partie en 2022 sans la durée requise, qui retravaille dix-huit mois,
  n'acquiert rien ; partie au taux plein, elle se constitue une nouvelle pension. Le
  militaire parti à quarante-cinq ans en 2020, salarié ensuite, acquiert au régime
  général et à l'Agirc-Arrco, qui le servent à l'âge légal.
