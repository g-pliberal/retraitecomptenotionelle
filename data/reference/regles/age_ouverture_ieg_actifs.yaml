      première phrase du 2° du I de l'article 16 s'applique aux agents nés à compter
      du 1er janvier 1975. Pour les agents nés antérieurement à cette date, cet
      âge est abaissé » — cinquante-cinq ans avant 1962, puis quatre mois, puis
      trois mois par génération jusqu'à cinquante-huit ans et neuf mois pour 1974
      ; V, 1° : l'âge du 1° du I de l'article 16, soixante ans avant 1957, soixante-quatre
      ans à compter de 1970. Lu dans l'index LEGI du dépôt
    date: 2026-09-23
  - type: legifrance
    reference: >-
      même annexe, article 10, II : la surcote ne compte que les trimestres « cotisés
      et effectués après le 1er juillet 2008, au-delà de l'âge mentionné au 1° du
      I de l'article 16 »
    date: 2026-09-23
  - type: legifrance
    reference: >-
      loi n° 2025-1403, article 105 : L. 161-17-2 suspendu pour les générations
      1961 à 1968, soixante-quatre ans à compter de 1969 inchangé ; rien sur l'annexe
      3
    date: 2026-09-23
  - type: legifrance
    reference: >-
      annexe 3 du statut national, ses vingt et une rédactions dans l'index LEGI du dépôt à
      jour de l'incrément du 28 octobre 2026, de celle de 1946 (LEGIARTI000006632496) à
      celle du 6 août 2025, articles 3, 10, 16 et 45 confrontés d'une rédaction à la
      suivante : les quatre qui ne sont jamais entrées en vigueur mises à part, les âges ne
      changent qu'au 1er juillet 2008, au 21 mars 2011 et au 1er janvier 2025 ; L. 161-17-2,
      ses rédactions depuis le 1er septembre 2023
    date: 2026-10-29
  - type: jorf
    reference: >-
      au Journal officiel par l'index JORF du dépôt : décret n° 2008-69 du 22 janvier 2008,
