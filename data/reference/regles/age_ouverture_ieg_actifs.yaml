schema_version: 1
id: age_ouverture_ieg_actifs
intitule: >-
  L'agent des industries électriques et gazières en services actifs ouvre son droit à
  pension à cinquante-cinq ans depuis le statut de 1946, avec quinze ans de services
  actifs depuis le 1er juillet 2008 ; depuis le 21 mars 2011, avec dix-sept ans, à un âge
  relevé de quatre mois par génération née depuis 1962, cinquante-sept ans pour 1967 ;
  pour les pensions de 2025 et après, de trois mois par génération jusqu'à cinquante-huit
  ans et neuf mois pour 1974, puis à l'âge de L. 161-17-2 abaissé de cinq ans,
  cinquante-neuf ans, que la suspension de 2026 ne change pas. Sa surcote, que la réforme
  de 2008 crée, ne court qu'au-delà de soixante ans, puis de l'âge du 1° du I de l'article
  16, relevé par génération jusqu'à soixante-quatre ans pour 1970.
domaine: age
regimes: [ieg]
etape: ouvrir_le_droit
face: droit
etat: approchee
lit:
- la date de naissance de l'agent, dont la génération se lit au mois
- >-
  le statut d'agent des industries électriques et gazières, présumé en services actifs,
  ses années de services actifs et sa durée minimale de services présumées acquises
- la date d'effet de la pension, qui désigne la rédaction de l'annexe 3
ecrit:
- >-
  l'âge d'ouverture du droit à pension de l'agent, d'où partent le mois où son droit
  s'ouvre, la durée requise qui s'y lit (`duree_requise_ieg`) et l'âge d'annulation de sa
  décote (`age_reference_decote_ieg`)
- l'âge au-delà duquel ses trimestres comptent pour la surcote (II de l'article 10)
dates_qui_decident:
- liquidation.date_effet
versions:
- id: statut_de_1946
  statut: lue
  textes:
  - {id: LEGIARTI000006632496, article: "statut national, annexe 3, article 3, § 1 à 3, rédaction de 1946", en_vigueur: 1946-06-01}
  nee_de: LEGIARTI000006632496
  bornes:
    liquidation.date_effet: [null, 2008-07-01]
  contenu:
    parametres:
      ages_des_actifs: {1900: 55}
      ages_de_surcote: null
    droit: >-
      « Pour avoir droit aux prestations : pension d'ancienneté, un agent doit avoir 55 ans
      d'âge, s'il appartient aux services insalubres ou actifs, 60 ans d'âge, s'il
      appartient aux services sédentaires - et doit totaliser 25 ans de service » ; la
      pension proportionnelle, à quinze ans de service, a sa jouissance « différée jusqu'à
      l'âge requis pour la pension d'ancienneté » (article 3, § 1 et 2) ; rien ne majore
      les années passées au-delà, la pension ne pouvant « dépasser 75 % du salaire » (§ 3)
    conditions: >-
      « Les agents mères de famille ayant eu trois enfants bénéficieront d'une bonification
      d'âge et de service d'une année par enfant » (§ 1) ; le texte ne dit pas combien
      d'années de services actifs font l'agent actif, quinze selon la circulaire PERS 70 du
      21 mai 1952, connue par sa citation (Cour de cassation, 9 mars 2016, n° 14-25.840)
    beneficiaire: l'agent des services actifs ou insalubres
  exemples: aucun trouvé
- id: reforme_de_2008
  statut: lue
  textes:
  - {id: LEGIARTI000019226006, article: "statut national, annexe 3, articles 10, II, et 16, I, rédaction du décret n° 2008-627", en_vigueur: 2008-06-30, publie_le: 2008-06-29}
  - {id: LEGIARTI000020085612, article: "même annexe, articles 10, II, et 16, I", en_vigueur: 2009-01-01}
  nee_de: LEGIARTI000019226006
  bornes:
    liquidation.date_effet: [2008-07-01, 2011-03-21]
  contenu:
    parametres:
      ages_des_actifs: {1900: 55}
      ages_de_surcote: {1900: 60}
      services_actifs_requis: 15
    droit: >-
      « La liquidation de la pension de vieillesse intervient sur demande : 1° Lorsque
      l'agent a atteint au moins l'âge de soixante ans ; 2° Lorsque l'agent a atteint au
      moins l'âge de cinquante-cinq ans s'il totalise quinze ans de services effectifs
      actifs, insalubres et militaires ou dix ans de services effectifs insalubres »,
      l'âge de soixante ans étant abaissé « de un an par tranche de trois ans » de services
      actifs pour qui en a moins, sous une durée minimale de quinze ans de services
      (article 16, I) ; la surcote ne compte que les trimestres « cotisés et effectués après
      le 1er juillet 2008, au-delà de l'âge de soixante ans » (article 10, II)
    conditions: >-
      le décret n° 2008-627 « entre en vigueur le 1er juillet 2008 » (article 2) ; la
      rédaction du 1er janvier 2009 ne change, à l'article 10, que le décompte des
      trimestres de surcote, « les trimestres entiers cotisés », et garde l'article 16 mot
      pour mot ; les départs anticipés des parents (3° et 4° du I de l'article 16) relèvent
      d'une autre fiche, `depart_anticipe_parents_trois_enfants`, qui les dit non servis
