    durée requise et cent soixante trimestres d'assurance
textes_sans_effet:
- reference: loi n° 2025-1403 du 30 décembre 2025, article 105
  motif: >-
    la suspension ne change L. 161-17-2 que pour les générations nées avant 1969, quand
    l'annexe 3 n'y renvoie qu'à compter de 1970 pour le 1° du I de l'article 16, et de 1975
    pour le 2° : elle écrit elle-même le calendrier des générations antérieures (article 45,
    V, 1° et 2°)
effet: >-
  LA SUSPENSION NE CHANGE RIEN, MAIS LA FICHE ÉTAIT FAUSSE. Elle portait l'âge des
  actifs lu dans le seul article 16 réécrit en 2023 : 58 ans et 9 mois dès 2025,
  59 ans dès 2027, jusqu'à six trimestres trop tard pour les générations 1968 à
  1974, que le 2° du V de l'article 45 laisse partir de 57 ans et 3 mois à 58 ans
  et 9 mois. Elle suit désormais ce calendrier par année de liquidation, huit périodes
  de 2025 à 2034. Et la surcote partait de l'âge d'ouverture de la fiche : elle
  part de l'âge du 1° du I de l'article 16, par le drapeau `age_surcote_regimes_speciaux`,
  le même calendrier qu'à la SNCF et à la RATP. Le calendrier se lit depuis par
  génération (`age_table: ieg_actif_2023`), et non plus par périodes annuelles. Approchée
  depuis le 29 octobre 2026 : l'agent est présumé en services actifs, la bonification
  d'âge des mères de 1946 n'est pas servie, et les pensions du second semestre de 2008
  n'ont pas de surcote.
sources:
  lu_le: 2026-10-29
  prochaine_relecture: 2027-10-29
  a_relire:
  - >-
    Les années de services actifs de l'agent, et le taux de services actifs de son emploi
    (décret n° 2011-1175), que la saisie ne porte pas : une saisie qui les dirait ouvrirait
    l'âge des sédentaires et celui des agents de cinq à quatorze ans de services actifs
    (V, 6° à 9°, de l'article 45).
  - >-
    La circulaire PERS 70 du 21 mai 1952, qui fixerait à quinze ans les services actifs de
    l'agent actif d'avant 2008, n'est connue que par sa citation : la lire.
