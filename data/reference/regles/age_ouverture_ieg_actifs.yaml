  ecart: >-
    le modèle liquide les pensions du second semestre de 2008 sous la période de 1991 à
    2008, sans surcote : les trimestres cotisés depuis le 1er juillet 2008 au-delà de
    soixante ans n'y comptent pas
  effet: >-
    au plus deux trimestres de surcote à 0,75 % (L. 14, III, du code des pensions, dans sa
