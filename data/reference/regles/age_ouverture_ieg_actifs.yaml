historique:
- >-
  2026-10-29 — lue au droit (action 130) : quatre versions sur la date d'effet — l'annexe
  de 1946, cinquante-cinq ans sans surcote ; la réforme du 1er juillet 2008, quinze ans de
  services actifs et la surcote au-delà de soixante ans ; celle du 21 mars 2011, le
  calendrier par génération jusqu'à cinquante-sept ans et dix-sept ans de services actifs ;
  celle des pensions de 2025, jusqu'à cinquante-neuf ans. Approchée : l'agent présumé
  actif, la bonification d'âge des mères de 1946, la surcote du second semestre de 2008.
