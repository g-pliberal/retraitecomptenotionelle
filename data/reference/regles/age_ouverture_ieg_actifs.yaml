      septembre 2023, les gardent mot pour mot ; les générations nées depuis 1963, qui
      n'ont soixante-deux ans qu'en 2025, et depuis 1968, qui n'ont cinquante-sept ans
      qu'en 2025, ne relèvent que de la version suivante
