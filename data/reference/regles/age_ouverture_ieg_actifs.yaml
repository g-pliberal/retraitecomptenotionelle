      vigueur (articles 1er et 2) ; décret n° 2011-290 du 18 mars 2011, articles 4, 7, 13 et
      25 ; décret n° 2023-692 du 28 juillet 2023 ; décret n° 2025-761 du 4 août 2025
    date: 2026-10-29
  - type: autre
    reference: >-
      CNIEG, « Service actif » : « Pour les générations nées à compter de 1962, l'âge
