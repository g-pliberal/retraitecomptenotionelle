  textes: >-
    guide des salariés n° 9 de l'Agirc-Arrco, « Majorations pour enfants », édition de
    mars 2017, partie « Réversion », « 2. Les modalités de calcul », p. 12,
    https://www.carcept-prev.fr/sites/carcept/files/media/documents/2018/05/Majorations-pour-enfants.pdf,
    sha256 9dfcdaf5c2d655737ce3509a28fbebe7143322006f62a3abfe23f361972743b2, relu le
    3 novembre 2026 ; accord du 17 novembre 2017, article 109
    (https://www.agirc-arrco.fr/storage/2024/09/201809dc_ANI_du_17_novembre_2017.pdf,
    sha256 b8af8df7372e4f897c1ca0c4fd9bf4baaa5b706ec4737b8e51b593c5a2a4fccb) ;
    circulaire Agirc-Arrco 2020-02-DRJ, fiche 6, préambule et I.1.2.2, 1., et fiche 4,
    II.2.2
    (https://www.agirc-arrco.fr/wp-content/uploads/2021/10/2020-02-DRJ_Regime_Agirc-Arrco_Reglementation_applicable_aux_individus.pdf,
    sha256 524779881a0e4e377382f4b3d8ab9cf0ebd4aa21fe2eca841dd523491f4806ae, relue le
    3 novembre 2026, 74e, 79e et 55e pages du fichier) ; fiche reversion_agirc_arrco
  ecart: >-
    Pour la réversion, le guide dit, sans distinguer les régimes : « Lorsque la retraite a
    été minorée, il n'est pas tenu compte du coefficient de minoration pour le calcul de
    la majoration pour enfants » ; pour le retraité de 2012 à 2018, que « le régime Agirc
    en tient compte ». L'article 109, pour un décès depuis 2019 : « Les majorations pour
    enfants nés ou élevés applicables aux droits du participant décédé sont réversibles
    au taux de 100% ». La circulaire 2020-02-DRJ le tranche pour les « décès survenus à
    compter du 1er janvier 2019 » (fiche 6, préambule) : « Les majorations sont calculées
    sur les droits de base du participant décédé, sans tenir compte d'un éventuel
    coefficient d'anticipation dont les droits directs ont pu être affectés » (I.1.2.2,
    1.), sans distinguer la date de liquidation du défunt. Le modèle la suit depuis le 3
    novembre 2026 (fiche reversion_agirc_arrco, `majoration_sans_anticipation`) : il
    reverse la majoration du défunt sans son coefficient, sous le plafond qui bornait la
    sienne, que la circulaire dit s'appliquer « distinctement pour les droits directs et
    les droits de réversion » sans dire lequel prend une réversion depuis 2019 d'une
    allocation d'avant (fiche reversion_agirc_arrco, son approximation de l'accord de
    2017). Reste l'écart d'avant 2019 : le modèle ne reverse aucune majoration pour un
    décès d'avant 2019 (même fiche, son approximation des versions d'avant 2019), quand
    le guide la dit reversée sans le coefficient.
  effet: >-
    pour un décès d'avant 2019, la réversion du conjoint d'un parent de trois enfants
    est sous-estimée de toute la majoration ; non mesuré. Depuis 2019, la majoration
    reversée d'un défunt parti sous un coefficient croît de son inverse, sous le
    plafond : 295,21 € au lieu de 259,78 € en 2020 pour la cadre née en 1950 partie en
    2012 à 0,88 (tests/test_reversion.py)
sources:
  lu_le: 2026-11-03
  prochaine_relecture: 2027-06-30
  lectures_divergentes:
  - >-
    La proratisation du plafond de 2012 à 2018 : l'accord du 18 mars 2011 (article 7)
    veut le plafond « proratisé en fonction de la durée pendant laquelle le participant
    aura relevé du régime » ; ni l'article 17 de l'annexe A ni l'article 6 bis de l'annexe
    I, qui le codifient, ni le guide n° 9 de mars 2017, qui oppose le plafond entier de
    1 028,12 € à un cadre de l'Agirc depuis 1980, ne le proratisent, ni le modèle.
  - >-
    La date des conditions des droits d'avant 2012 : remplies le 31 décembre 2011 selon
    l'accord du 18 mars 2011 (article 7), « appréciée à la date d'effet de la retraite »
    selon les annexes de 2012 ; le modèle suit les annexes.
  a_relire:
  - >-
    Les règlements des caisses de l'Arrco d'avant 1999, et ceux de la Camarca ; les
    rédactions d'avant 2012 de l'article 6 bis de l'annexe I de 1947 — celle que l'avenant
    A-159 du 1er mars 1994 a écrite (Bulletin officiel du ministère, fascicule
    Conventions collectives n° 94-18, d'après l'arrêté d'extension du 8 novembre 1994,
    JORFTEXT000000349883) et celle d'avant, qui diraient la majoration de 10 à 30 % que le
    pourcentage de service réduit — et de l'article 17 de l'annexe A de 1961 : la copie du
    Medef, que lisait la fiche des coefficients d'anticipation, ne se sert plus
    (accords.medef.com, « Site introuvable », le 3 novembre 2026).
  - >-
    Les exemples de la caisse ne sont pas au registre des exemples officiels
    (tests/temoins/exemples_officiels.yaml) : Justine, dépliant de mars 2025, que rejoue
    test_simulateur.py ; les deux du guide n° 9 de mars 2017, à l'Arrco 338,11 € et à
    l'Agirc 1 305,60 € ramenés au plafond de 1 028,12 €, que test_agirc_arrco_au_droit.py
    refait sur les données. Les y inscrire, ce que les versions diraient alors.
  - >-
    Avant 2012, la caisse calculait-elle la majoration avant ou après le coefficient
    d'anticipation ? Le guide de 2017 ne le dit que de 2012 à 2018 ; une édition du guide
    d'avant 2012, ou une circulaire de l'Arrco ou de l'Agirc, le dirait.
  - >-
    Le guide n° 9 de mars 2017 dit l'assiette des retraites qui prennent effet alors ; le
    modèle la lit pour toutes celles de 2012 à 2018, que régit la même rédaction des
    annexes, « applicable aux liquidations d'allocations prenant effet à compter du 1er
    janvier 2012 » (annexe I, article 6 bis, 2) ; une édition du guide de 2012 la
    confirmerait.
  - >-
    L'Agirc de 2012 à 2018, qui « tient compte » du coefficient : s'applique-t-il à la
    majoration avant le plafond, comme le modèle, ou au montant plafonné ? Aucun texte lu
    ne le chiffre ; les deux exemples du guide n° 9 partent au taux plein.
  - >-
    Ce que la caisse a servi, de 1995 à l'arrêt du 23 novembre 1999, aux cadres partis
    avant le 1er mars 1994, et si elle leur a rendu ce que le pourcentage de service avait
    retenu : une circulaire de l'Agirc de 1999 ou 2000 le dirait.
  - >-
    Le site réglementaire de la caisse (reglementation.agirc-arrco.fr), dont le
    certificat ne se vérifiait pas le 3 novembre 2026 : y relire l'assiette de la
    majoration, et si la circulaire 2020-02-DRJ y a une mise à jour.
  - >-
    La circulaire Agirc-Arrco du 7 juillet 2011 (point 3.3.1), qui dirait la
    proratisation et la génération du 2 août 1951 : non retrouvée.
