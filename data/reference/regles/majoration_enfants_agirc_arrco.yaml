schema_version: 1
id: majoration_enfants_agirc_arrco
intitule: >-
  Majoration pour enfants nés ou élevés de l'Agirc-Arrco par année d'acquisition
  des points : 10 à 30 % pour l'Arrco d'avant 1999 si le règlement de la caisse
  la prévoyait, 5 % pour l'Arrco de 1999 à 2011, 8 à 24 % pour l'Agirc d'avant 2012,
  10 % depuis ; plafond en euros sur l'ensemble, 1 000 € par régime au 1er janvier
  2012 pour les allocations de 2012 à 2018, celui du régime unifié depuis, opposé aux
  participants nés à compter du 2 août 1951.
domaine: enfants
regimes:
- agirc
- agirc_arrco
- agirc_entreprises_nouvelles
- arrco
- arrco_cultes
- arrco_tranche_2
- arrco_tranche_2_entreprises_nouvelles
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- >-
  le nombre d'enfants nés ou élevés que la personne déclare, trois au moins, à la date
  d'effet de la pension
- >-
  les points de chaque régime de la complémentaire, chacun avec l'année où il a été
  acquis et le régime qui l'a inscrit (droit/acquerir.py)
- >-
  l'allocation de chaque régime, coefficient d'anticipation compris, et ce coefficient
  (droit/liquider.py : anticipations)
- >-
  la date d'effet de la pension et l'année de naissance de l'assuré, qui décident du
  plafond, et la valeur de service du point, qui le revalorise
ecrit:
- >-
  la majoration pour enfants nés ou élevés de chaque régime de la complémentaire, bornée
  par son plafond, que la majoration pour enfants à charge remplace quand elle est plus
  forte (fiche majoration_enfants_a_charge_agirc_arrco), que la revalorisation sert à
  chaque échéance et que la réversion reprend
dates_qui_decident:
- liquidation.date_effet
- periode.debut
# Les versions forment un partage des deux dates (§ 4.1) : la date d'effet de
# la pension choisit l'accord, et son plafond ; l'année d'acquisition du point,
# son taux. Chaque paramètre porte le nom de ce qui le porte au dépôt
# (tests/test_agirc_arrco_au_droit.py) : `bareme`, la colonne de
# `legislation/majoration_enfants_points.csv`, une ligne par groupe de régimes,
# le taux pour 0 à 7 enfants et plus ; `plafond_majoration_enfants` et
# `plafond_majoration_annee`, les champs des périodes de la date d'effet ;
# `plafond_nes_a_compter_du`, la génération que le portage retient ;
# `sans_anticipation`, que le moteur lit ici même (`FichesDatees`), les régimes
# dont la majoration se calcule sur les droits sans le coefficient
# d'anticipation, les mêmes dans les versions d'une même date d'effet.
versions:
- id: reglements_d_avant_le_regime_unique
  statut: supposee
  hypothese: >-
    avant le 1er janvier 1999, chaque régime membre de l'Arrco majorait selon son
    règlement, que le dépôt ne lit pas ; l'accord du 25 avril 1996 en garde les
    majorations pour les droits d'avant 1999 (article 2), et les accords de 2011 et de
    2017 les servent au barème de 10 à 30 %, « lorsqu'une majoration pour enfant né ou
    élevé est prévue par un règlement » (article 94, 1). Le modèle présume toutes les
    caisses à ce barème, et l'Agirc à celui de l'article 6 bis de l'annexe I de 1947,
    8 à 24 %, dont la rédaction d'alors n'est pas lue ; aucun plafond
  fiabilite: moyenne
  bornes:
    liquidation.date_effet: [null, 1999-01-01]
  contenu:
    droit: >-
      la majoration du règlement de chaque caisse de l'Arrco, et celle de l'Agirc, sur
      tous les points de la pension, sans plafond
    parametres:
      bareme:
      - regimes: [arrco, arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles]
        taux: [0, 0, 0, 0.10, 0.15, 0.20, 0.25, 0.30]
      - regimes: [agirc, agirc_entreprises_nouvelles]
        taux: [0, 0, 0, 0.08, 0.12, 0.16, 0.20, 0.24]
      sans_anticipation: []
  exemples: aucun trouvé
