      « Les participants au régime ARRCO qui ont eu ou justifient avoir élevé au moins
      trois enfants de moins de 16 ans pendant 9 ans, bénéficient d'une majoration de leur
      allocation égale à 10%. Cette disposition s'applique aux allocations liquidées au
      titre de la seule partie de carrière postérieure au 31 décembre 2011 » ; « L'ensemble
      des majorations pour enfants nés ou élevés servies par l'ARRCO sera plafonné à 1000
      euros par an pour toute liquidation d'allocation prenant effet à compter du 1er
      janvier 2012. Ce plafond sera proratisé en fonction de la durée pendant laquelle le
      participant aura relevé du régime ARRCO. » ; l'Agirc, au 1, dans les mêmes termes
    lu_le: 2026-11-03
