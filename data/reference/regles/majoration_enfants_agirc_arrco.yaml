- id: regime_unifie_points_d_avant_1999
  statut: lue
  textes:
  - id: KALITEXT000036731682
    reference: >-
      accord national interprofessionnel du 17 novembre 2017 instituant le régime
      Agirc-Arrco de retraite complémentaire, version « applicable au 1er janvier 2019 »,
      copie de la fédération (hors JORF)
    article: article 94, « Majorations pour enfants nés ou élevés »
    en_vigueur: 2019-01-01
    citation: >-
      « 1. Pour les périodes antérieures au 1er janvier 1999, lorsqu'une majoration pour
      enfant né ou élevé est prévue par un règlement d'un ancien régime ARRCO [...], la
      majoration de ces droits est égale à : 10 % pour 3 enfants, 15 % pour 4, 20% pour
      5, 25% pour 6, 30 % pour 7 » ; « 2. Pour les points inscrits entre 1999 et 2011 au
      titre de l'ancien régime ARRCO, la majoration est égale à 5% » ; « 3. Pour les
      points inscrits au titre de l'ancien régime AGIRC et relatifs à des périodes
      antérieures à 2012 », 8 à 24 % ; « 4. Pour la part de l'allocation correspondant
      aux périodes à compter de 2012, la majoration est égale à 10% » ; « La majoration
      pour enfants nés ou élevés est plafonnée au montant du cumul des plafonds en vigueur
      à l'Agirc et à l'Arrco applicables à l'entrée en vigueur du présent accord. Ce
      montant est revalorisé en fonction de l'évolution de la valeur du point. Le plafond
      de la majoration pour enfants nés ou élevés n'est pas appliqué aux participants nés
      avant le 2 août 1951. »
    lu_le: 2026-11-03
    empreinte: sha256:b8af8df7372e4f897c1ca0c4fd9bf4baaa5b706ec4737b8e51b593c5a2a4fccb
  - id: JORFARTI000036847923
    article: arrêté du 24 avril 2018 portant extension et élargissement de l'accord, article 1er
    en_vigueur: 2018-04-28
    publie_le: 2018-04-28
    citation: >-
      « Sont étendues, conformément aux dispositions de l'article L. 911-3 du code de la
      sécurité sociale, les stipulations de l'accord national interprofessionnel du 17
      novembre 2017 instituant le régime AGIRC-ARRCO de retraite complémentaire »
  - reference: >-
      circulaire Agirc-Arrco 2025-15-DT, « Paramètres du régime 2025-2026 » (hors JORF),
      https://www.agirc-arrco.fr/storage/CirculaireAgircArrco2025-15dt.pdf
    article: circulaire
    en_vigueur: 2026-01-01
    citation: >-
      « Le montant du plafond des majorations pour enfants nés ou élevés reste fixé à
      2 367,48 € »
    lu_le: 2026-11-03
    empreinte: sha256:2e34ce291edcfa5e9d21bf0b80e7c30d8889f7342ee8b5dae4463801ad04b288
  - reference: >-
      circulaire Agirc-Arrco n° 2020-02-DRJ du 20 janvier 2020, « Réglementation
      applicable aux individus » (hors JORF)
    article: fiche 4, II.2.1 et II.2.2
    publie_le: 2020-01-20
    citation: >-
      « Cette circulaire précise, sous forme de fiches indépendantes, la réglementation
      Agirc-Arrco applicable aux individus à compter du 1er janvier 2019 » ; « La
      majoration est calculée sur les droits de base du participant sans tenir compte des
      coefficients d'anticipation éventuellement appliqués et varie en fonction de la
      période d'attribution des points de retraite complémentaire » (II.2.1) ; « La
      majoration pour enfants nés ou élevés est plafonnée au montant du cumul des plafonds
      en vigueur à l'Agirc et à l'Arrco applicables à l'entrée en vigueur de l'ANI » ; « Le
      montant du plafonnement applicable à un allocataire est celui en vigueur à la date
      d'effet de sa retraite » (II.2.2)
    lu_le: 2026-11-03
    empreinte: sha256:524779881a0e4e377382f4b3d8ab9cf0ebd4aa21fe2eca841dd523491f4806ae
  nee_de: KALITEXT000036731682
  bornes:
    liquidation.date_effet: [2019-01-01, null]
    periode.debut: [null, 1999-01-01]
  contenu:
    droit: >-
      les points de l'Arrco d'avant 1999 prennent 10 à 30 % si le règlement de leur caisse
      prévoyait une majoration, sauf ceux de la Camarca, que son ancien règlement majore,
      et ceux qu'aucun compte ne portait avant la liquidation, que 5 % majorent ; ceux de
      l'Agirc, 8 à 24 % ; l'ensemble est plafonné au cumul des deux plafonds de 2018,
      2 071,58 € au 1er janvier 2019, revalorisé comme le point du régime unifié, 2 367,48 €
      depuis le 1er novembre 2024, sauf pour les participants nés avant le 2 août 1951 ;
      la majoration se calcule sur les droits sans le coefficient d'anticipation, et le
      plafond de la date d'effet la borne
    parametres:
      bareme:
      - regimes: [arrco, arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles]
        taux: [0, 0, 0, 0.10, 0.15, 0.20, 0.25, 0.30]
      - regimes: [agirc, agirc_entreprises_nouvelles]
        taux: [0, 0, 0, 0.08, 0.12, 0.16, 0.20, 0.24]
      plafond_majoration_enfants: 2367.48
      plafond_majoration_annee: 2025
      plafond_nes_a_compter_du: 1951-08-02
      sans_anticipation: [agirc_arrco, arrco, arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles,
        arrco_cultes, agirc, agirc_entreprises_nouvelles]
  exemples: aucun trouvé
