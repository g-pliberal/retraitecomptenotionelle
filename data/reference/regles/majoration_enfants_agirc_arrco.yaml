    salariés n° 9 de l'Agirc-Arrco, mars 2017 ; circulaire Agirc-Arrco n° 2020-02-DRJ,
    fiche 4, II.2.1
  ecart: >-
    Pour une pension prenant effet avant le 1er janvier 2012, aucun texte lu ne tranche
    si la majoration se calcule avant ou après le coefficient d'anticipation : l'accord du
    25 avril 1996 majore « leur allocation » (article 11) et affecte du coefficient « les
    points de retraite effectivement inscrits au compte » (article 10) ; le guide n° 9 ne
    le dit que des retraites de 2012 à 2018, la circulaire 2020-02-DRJ que de celles
    d'après 2019. Le modèle garde le coefficient : la majoration se calcule sur
    l'allocation, coefficient compris, comme avant le 3 novembre 2026.
  effet: >-
    si la caisse la calculait déjà sans le coefficient, sous-estime la majoration de qui
    partait avant 2012 sous un coefficient d'anticipation, de la part qu'il retire (12 %
    à 0,88, 22 % à 0,78) ; non mesuré, faute du texte
