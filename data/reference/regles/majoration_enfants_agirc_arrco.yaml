- version: [reglements_d_avant_le_regime_unique, regime_unique_points_d_avant_1999,
    accord_de_2011_points_d_avant_1999, regime_unifie_points_d_avant_1999]
  textes: >-
    accord du 25 avril 1996, article 2 ; annexe A de l'accord du 8 décembre 1961,
    article 17, 2), et sa note ; accord du 17 novembre 2017, article 94, 1
  ecart: >-
    Le modèle ne connaît pas la caisse de l'Arrco d'avant 1999 : il présume que son
    règlement prévoyait la majoration, au barème de l'accord, 10 % pour trois enfants à
    30 % pour sept. Les caisses qui n'en servaient pas n'en doivent aucune, la Camarca
    des salariés agricoles servait 2,5 % par enfant, et les droits qu'aucun compte ne
    portait avant la liquidation ne prennent que 5 %.
  effet: >-
    surestime la majoration des points d'avant 1999 d'une caisse qui n'en servait pas :
    dans l'exemple du guide n° 9 de mars 2017, 2 000 points de 1988 à 1998 d'une caisse
    sans majoration, 250,26 € par an de trop pour 338,11 € dus ; non mesuré sur la
    population, faute de savoir quelles caisses la servaient
- version: [reglements_d_avant_le_regime_unique, regime_unique_points_d_avant_1999,
    regime_unique_points_depuis_1999]
  textes: >-
