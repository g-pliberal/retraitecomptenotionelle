schema_version: 1
id: majoration_enfants_agirc_arrco
intitule: >-
  Majoration pour enfants nés ou élevés de l'Agirc-Arrco par année d'acquisition
  des points : 10 à 30 % pour l'Arrco d'avant 1999 si le règlement de la caisse
  la prévoyait, 5 % pour l'Arrco de 1999 à 2011, pour l'Agirc d'avant 2012 10 à 30 %
  affectés d'un pourcentage de service de l'année où la majoration est servie, 96 % en
  1995, 85 % en 1996, 80 % depuis 1997 (8 à 24 %), sauf pour une retraite liquidée
  avant le 1er mars 1994, 10 % depuis ; plafond en euros sur l'ensemble, 1 000 € par
  régime au 1er janvier
  2012 pour les allocations de 2012 à 2018, celui du régime unifié depuis, opposé aux
  participants nés à compter du 2 août 1951.
domaine: enfants
regimes:
- agirc
- agirc_arrco
- agirc_entreprises_nouvelles
- arrco
- arrco_cultes
- arrco_tranche_2
- arrco_tranche_2_entreprises_nouvelles
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- >-
  le nombre d'enfants nés ou élevés que la personne déclare, trois au moins, à la date
  d'effet de la pension
- >-
  les points de chaque régime de la complémentaire, chacun avec l'année où il a été
  acquis et le régime qui l'a inscrit (droit/acquerir.py), et l'année où la majoration
  est servie, qui décide du pourcentage de service de l'Agirc de 1995 à 1997
- >-
  l'allocation de chaque régime, coefficient d'anticipation compris, et ce coefficient
  (droit/liquider.py : anticipations)
- >-
  la date d'effet de la pension et l'année de naissance de l'assuré, qui décident du
  plafond, et la valeur de service du point, qui le revalorise
ecrit:
- >-
  la majoration pour enfants nés ou élevés de chaque régime de la complémentaire, bornée
  par son plafond, que la majoration pour enfants à charge remplace quand elle est plus
  forte (fiche majoration_enfants_a_charge_agirc_arrco), que la revalorisation sert à
  chaque échéance et que la réversion reprend
dates_qui_decident:
- liquidation.date_effet
- periode.debut
# Les versions forment un partage des deux dates (§ 4.1) : la date d'effet de
# la pension choisit l'accord, et son plafond ; l'année d'acquisition du point,
# son taux. Chaque paramètre porte le nom de ce qui le porte au dépôt
# (tests/test_agirc_arrco_au_droit.py) : `bareme`, la colonne de
# `legislation/majoration_enfants_points.csv`, une ligne par groupe de régimes,
# le taux pour 0 à 7 enfants et plus ; `plafond_majoration_enfants` et
# `plafond_majoration_annee`, les champs des périodes de la date d'effet ;
# `plafond_nes_a_compter_du`, la génération que le portage retient ;
# `sans_anticipation`, que le moteur lit ici même (`FichesDatees`), les régimes
# dont la majoration se calcule sur les droits sans le coefficient
# d'anticipation, les mêmes dans les versions d'une même date d'effet ;
# `pourcentage_de_service`, qu'il lit de même, les régimes dont la majoration
# suit, après la date d'effet, le barème de chaque année de service de la table
# (`servi_debut`, `servi_fin`) : l'Agirc, pour une retraite liquidée du 1er mars
# 1994 au 31 décembre 1996. Le barème d'une version est celui que la table sert
# aux années de ses dates d'effet.
versions:
- id: reglements_d_avant_le_regime_unique
  statut: supposee
  hypothese: >-
    avant le 1er janvier 1999, chaque régime membre de l'Arrco majorait selon son
    règlement, que le dépôt ne lit pas ; l'accord du 25 avril 1996 en garde les
    majorations pour les droits d'avant 1999 (article 2), et les accords de 2011 et de
    2017 les servent au barème de 10 à 30 %, « lorsqu'une majoration pour enfant né ou
    élevé est prévue par un règlement » (article 94, 1) : le modèle présume toutes les
    caisses à ce barème. L'Agirc sert la majoration de l'article 6 bis de
    l'annexe I de 1947 entière, 10 % pour trois enfants à 30 % pour sept, que le COR
    décrit et dont la rédaction d'alors n'est pas lue ; la retraite liquidée avant le
    1er mars 1994 la garde ensuite, la Cour de cassation ayant jugé illicite le
    pourcentage de service qui l'eût réduite ; aucun plafond
  fiabilite: moyenne
  textes:
  - reference: >-
      Cour de cassation, chambre sociale, 23 novembre 1999, n° 97-18.980 et quatre autres,
      publié au bulletin (Bull. 1999 V n° 453), rectifié le 16 décembre 1999, copie de
      Juricaf, https://juricaf.org/arret/FRANCE-COURDECASSATION-19991123-9718980
    article: motifs et dispositif rectifié
    citation: >-
      « un avenant (A-159) a notamment modifié les articles 1er, 6 bis et 12 de la
      Convention collective nationale de retraite et de prévoyance des cadres, du 14 mars
      1947, avec effet du 1er mars 1994, en affectant d'un " pourcentage de service " les
      majorations de points pour charges de famille » ; « Dit que les modifications
      apportées par l'avenant A-159 à l'article 6 bis précité sont illicites en tant
      qu'elles s'appliquent aux participants dont la retraite a été liquidée avant
      l'entrée en vigueur de l'accord de révision. »
    lu_le: 2026-11-03
    empreinte: sha256:21ca4cde332bda5dedbf35f2fc52618c90830d141698a8500fb000002008a901
  - reference: >-
      COR, séance du 25 mai 2011, document n° 7 (DSS), « Document de travail, n'engage pas
      le Conseil », page 3, colonne « Régime complémentaire (AGIRC) Annexe I, art. 6 bis »,
      https://www.cor-retraites.fr/sites/default/files/2019-06/doc-1530.pdf (source
      secondaire : la rédaction de l'article 6 bis d'alors n'est pas publiée en ligne)
    citation: >-
      « majoration du total des points en fonction du nombre d'enfants nés ou élevés et
      application d'un pourcentage de service de 80% (01/03/94) à la majoration suivante :
      10% pour 3 enfants 15% pour 4 enfants 20% pour 5 enfants 25% pour 6 enfants 30% pour
      7 enfants et + » ; « Pas de majoration pour enfant à charge »
    lu_le: 2026-11-03
    empreinte: sha256:952c1af12ace77881e18b58599bd900044fbfc0880950c0964f8308197029a00
  bornes:
    liquidation.date_effet: [null, 1994-03-01]
  contenu:
    droit: >-
      la majoration du règlement de chaque caisse de l'Arrco, et celle de l'article 6 bis
      à l'Agirc, sur tous les points de la pension, sans plafond ; celle de l'Agirc ne suit
      pas le pourcentage de service
    parametres:
      bareme:
      - regimes: [arrco, arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles]
        taux: [0, 0, 0, 0.10, 0.15, 0.20, 0.25, 0.30]
      - regimes: [agirc, agirc_entreprises_nouvelles]
        taux: [0, 0, 0, 0.10, 0.15, 0.20, 0.25, 0.30]
      sans_anticipation: []
      pourcentage_de_service: []
  exemples: aucun trouvé
