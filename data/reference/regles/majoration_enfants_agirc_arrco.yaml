      « pour les périodes antérieures au 1er janvier 1999, majorations pour enfants nés ou
      élevés telles que prévues le cas échéant par les règlements des régimes ARRCO
      antérieurs au régime unique », « pour les périodes entre le 1er janvier 1999 et le 31
      décembre 2011, majoration pour enfants élevés, égale à 5 % », « pour les périodes à
      compter du 1er janvier 2012, majoration pour enfants nés ou élevés, égale à 10 % » ;
      « L'ensemble des majorations prévues au point 2 est plafonné à 1000 euros par an
      (montant revalorisé en fonction de la valeur du point), pour toute liquidation
      prenant effet à compter du 1er janvier 2012 (sauf pour les participants nés avant le
      2 août 1951). »
