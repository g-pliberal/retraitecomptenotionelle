code:
  moteur: >-
    `acquerir` inscrit chaque point avec le taux de son année d'acquisition et du régime
    qui l'inscrit, que `MajorationsEnfantsPoints.taux` lit au nombre d'enfants dans
    `legislation/majoration_enfants_points.csv` : de 10 à 30 % pour l'Arrco d'avant
    1999, que le modèle présume prévus au règlement de chaque caisse, 5 % de 1999 à
    2011, de 8 à 24 % pour l'Agirc d'avant 2012, 10 % depuis. `completer` sert à la
    pension le taux moyen de ses points, au barème commun ceux que la table ne dit pas,
    sur l'allocation, sans le coefficient d'anticipation pour les régimes que la version
    de la date d'effet nomme (`sans_anticipation`, que `FichesDatees` lit :
    `regimes_sans_anticipation`), coefficient compris pour les autres ; puis il borne en
    euros la
    majoration de chaque régime qui oppose le plafond (`plafond_majoration`,
    `regime_du_plafond`) : 1 000 € au titre de l'Arrco et autant au titre de l'Agirc au
    1er janvier 2012, suivis au point de chacun, pour les allocations de 2012 à 2018, le
    plafond du régime unifié depuis 2019, aux seules générations nées depuis 1952.
  python: >-
    droit/acquerir.py : acquerir ; scenarios/actuel.py : MajorationsEnfantsPoints,
    MajorationsEnfantsPoints.taux, FichesDatees ; droit/completer.py : completer,
    plafond_majoration, regime_du_plafond, regimes_sans_anticipation
  javascript: >-
    moteur/js/droit/acquerir.js : acquerir ; moteur/js/regimes.js :
    MajorationsEnfantsPoints, MajorationsEnfantsPoints.taux, FichesDatees ;
    moteur/js/droit/completer.js : completer, plafondMajoration, regimeDuPlafond,
    regimesSansAnticipation
  parametres: >-
    contenu.parametres de chaque version : bareme, plafond_majoration_enfants,
    plafond_majoration_annee, plafond_nes_a_compter_du, sans_anticipation ;
    legislation/majoration_enfants_points.csv : regimes, acquis_debut, acquis_fin,
    bareme, fiabilite ; regimes/agirc.yaml, regimes/agirc_arrco.yaml,
    regimes/agirc_entreprises_nouvelles.yaml, regimes/arrco.yaml,
    regimes/arrco_cultes.yaml, regimes/arrco_tranche_2.yaml,
    regimes/arrco_tranche_2_entreprises_nouvelles.yaml : plafond_majoration_enfants,
    plafond_majoration_annee, plafond_majoration_regime
  tests:
  - tests/test_agirc_arrco_au_droit.py
  - tests/test_majoration_enfants_agirc_arrco_avant_coefficient.py
  - tests/test_destinie.py
  - tests/test_droit.py
  - tests/test_oracle_points_enfants_arrco.py
  - tests/test_simulateur.py
  - tests/test_trajectoire.py
  - >-
    tests/test_majoration_exceptionnelle.py et tests/test_taux_plein_par_categorie.py,
    qui confrontent les deux moteurs sur des carrières qui la portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    cinq témoins changent sans les taux par année d'acquisition — enfants, enfants_pere,
    enfants_carriere_incomplete, taux_plein_mere_ouvriere et
    reversion_deces_avant_le_depart —, six sans le plafond,
    departs_prive_puis_categorie_active_trois_enfants avec eux
historique:
- >-
  2026-11-03 — lue au droit (action 130, file E) : les textes à rattacher, l'accord du 18
  mars 2011 et l'article 94 de l'accord de 2017, coupés en neuf versions sur la date
  d'effet et l'année d'acquisition ; la question du plafond des générations d'avant le 2
  août 1951, ouverte le 16 octobre, tranchée par l'article 94 et les annexes de 2012.
- >-
  2026-11-03 — la majoration avant le coefficient d'anticipation (action 130, décision du
  propriétaire) : chaque version nomme les régimes qui la calculent sur les droits sans
  le coefficient (`sans_anticipation`), que le moteur lit à la date d'effet — l'Arrco de
  2012 à 2018 (guide n° 9), tous depuis 2019 (circulaire 2020-02-DRJ) ; avant 2012, que
  rien ne tranche, le coefficient reste, déclaré.
effet: >-
  Parents de trois enfants salariés du privé avant 2019. Le modèle servait 10 %
  à tous les points ; les points Arrco de 1999 à 2011 n'en valent que 5, ceux de
  l'Agirc d'avant 2012 de 8 à 24 % selon le nombre d'enfants. Une non-cadre née
  en 1962 et entrée à 22 ans voit sa pension Arrco majorée de 7,9 % pour trois enfants,
  et non de 10. La table est `majoration_enfants_points.csv` ; l'exemple de la caisse
  est rejoué par `test_la_majoration_agirc_arrco_suit_la_periode_d_acquisition`,
  hors la ligne de la Capaves. Le plafond de 2012 à 2018 est de 1 000 € au titre de
  l'Arrco et 1 000 € au titre de l'Agirc, revalorisés comme le point : le modèle servait
  le plafond unifié de 2025, commun aux deux et double, et l'opposait dès 1999 ; un
  non-cadre né en 1952, parti en 2018 au salaire de 100 000 € avec trois enfants, perd
  73,53 € par an de majoration (1 031,15 € au lieu de 1 104,68). Depuis le 3 novembre
  2026, la majoration de l'Arrco de 2012 à 2018, et de toute la complémentaire depuis
  2019, se calcule sans le coefficient d'anticipation : celle de qui part avant l'âge du
  taux plein croît de l'inverse du coefficient, de 1/0,99 à 1/0,43, sous le plafond.
