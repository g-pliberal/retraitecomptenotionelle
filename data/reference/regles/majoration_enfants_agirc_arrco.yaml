historique:
- >-
  2026-11-03 — lue au droit (action 130, file E) : les textes à rattacher, l'accord du 18
  mars 2011 et l'article 94 de l'accord de 2017, coupés en neuf versions sur la date
  d'effet et l'année d'acquisition ; la question du plafond des générations d'avant le 2
  août 1951, ouverte le 16 octobre, tranchée par l'article 94 et les annexes de 2012.
- >-
  2026-11-03 — la majoration avant le coefficient d'anticipation (action 130, décision du
  propriétaire) : chaque version nomme les régimes qui la calculent sur les droits sans
  le coefficient (`sans_anticipation`), que le moteur lit à la date d'effet — l'Arrco de
  2012 à 2018 (guide n° 9), tous depuis 2019 (circulaire 2020-02-DRJ) ; avant 2012, que
  rien ne tranche, le coefficient reste, déclaré.
- >-
  2026-11-03 — après la relecture de la majoration avant le coefficient (action 175, note
  2026-11-03-agirc-arrco-des-parents-de-trois-enfants.md) : le pourcentage de service de
  80 % de l'accord Agirc du 9 février 1994 est dit servi de fait par le barème de 8 à
  24 %, non à ajouter ; la réversion du guide n° 9 et l'article 109 de l'accord de 2017,
  déclarés ; la circulaire 2025-15-DT reçoit son adresse, son empreinte refaite ; le titre
  des copies de 1947 et de 1961 cité tel qu'elles l'impriment.
- >-
  2026-11-03 — après la relecture R-M3b (action 175, note
  2026-11-03-corrections-de-la-relecture-r-m3b.md) : la majoration reversée depuis 2019,
  que la fiche disait tranchée par aucun texte lu, l'est par la circulaire 2020-02-DRJ,
  fiche 6, I.1.2.2 : sans le coefficient d'anticipation du défunt, ce que le modèle sert
  désormais ; l'article 2 de l'accord Agirc de 1994 est à la page 16 du recueil, non 15.
- >-
  2026-11-03 — le pourcentage de service de l'Agirc (action 130, file M3, note
  2026-11-03-majoration-enfants-agirc-1995-1996.md) : l'accord du 9 février 1994, article
  2, lu en entier ; l'arrêt de la Cour de cassation du 23 novembre 1999, qui garde la
  majoration entière aux retraites liquidées avant le 1er mars 1994 ; l'arrêt de Lyon du
  18 novembre 2004, qui y soumet celle du 1er juillet 1994. La version d'avant 1999 est
  coupée en cinq ; la table sert aux points de l'Agirc d'avant 2012 10 à 30 % jusqu'en
  1994, 96 % de ce barème en 1995, 85 % en 1996, 80 % depuis 1997, et le moteur suit le
  pourcentage après la date d'effet. Le modèle servait 8 % à toute date.
effet: >-
  Parents de trois enfants salariés du privé avant 2019. Le modèle servait 10 %
  à tous les points ; les points Arrco de 1999 à 2011 n'en valent que 5, ceux de
  l'Agirc d'avant 2012 de 8 à 24 % selon le nombre d'enfants. Une non-cadre née
  en 1962 et entrée à 22 ans voit sa pension Arrco majorée de 7,9 % pour trois enfants,
  et non de 10. La table est `majoration_enfants_points.csv` ; l'exemple de la caisse
  est rejoué par `test_la_majoration_agirc_arrco_suit_la_periode_d_acquisition`,
  hors la ligne de la Capaves. Le plafond de 2012 à 2018 est de 1 000 € au titre de
  l'Arrco et 1 000 € au titre de l'Agirc, revalorisés comme le point : le modèle servait
  le plafond unifié de 2025, commun aux deux et double, et l'opposait dès 1999 ; un
  non-cadre né en 1952, parti en 2018 au salaire de 100 000 € avec trois enfants, perd
  73,53 € par an de majoration (1 031,15 € au lieu de 1 104,68). Depuis le 3 novembre
  2026, la majoration de l'Arrco de 2012 à 2018, et de toute la complémentaire depuis
  2019, se calcule sans le coefficient d'anticipation : celle de qui part avant l'âge du
  taux plein croît de l'inverse du coefficient, de 1/0,99 à 1/0,43, sous le plafond.
  Depuis le 3 novembre 2026, l'Agirc sert aux cadres de trois enfants 10 % et non 8 %
  avant 1995, 9,6 % en 1995, 8,5 % en 1996 : un cadre parti le 1er avril 1995 au double
  du salaire moyen, 6 852,20 € d'Agirc, reçoit 657,81 € de majoration et non 548,18 €,
  puis 8,5 % en 1996 et 8 % depuis 1997, 582,44 € et 548,18 € au point de 1995 ; parti
  avant le 1er mars 1994, il garde 10 %.
