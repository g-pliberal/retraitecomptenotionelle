  statut: lue
  textes:
  - {id: LEGIARTI000037457049, article: "décret n° 2002-634, article 6-1", en_vigueur: 2018-09-30}
  nee_de: LEGIARTI000037457049
  bornes:
    revenu.annee: [2024-01-01, null]
  contenu:
    droit: la même formule, le même hors-plafond
    forfait: >-
      arrêté du 28 août 2009, article 4, rédaction de l'arrêté du 24 novembre 2023,
      en vigueur depuis le 30 novembre 2023 pour les indemnisations à compter du
      1er janvier 2024 : 150 €, 100 €, 83 € (Légifrance)
    exemple_de_la_caisse: >-
      hors de tests/temoins/exemples_officiels.yaml, qu'aucune grandeur du modèle
      ne peut rejouer, faute de jours de CET au simulateur. ERAFP, page « Compte
      épargne-temps », valeurs 2026 : un jour vaut 142,50 €, 95,00 € et 78,85 €
      nets, soit 98, 66 et 55 points. La formule du décret, avec P = 9,7 % ×
      98,25 % et T = 2 × (1 − P), redonne 142,49 €, 95,00 € et 78,85 € ; divisés
      par le salaire de référence de 2026 (1,4596 €, valeurs_point.csv) et
      arrondis au point supérieur, 98, 66 et 55 points. Quinze jours en catégorie
      A, 1 470 points, y valent « 90,03 € » de rente annuelle : 0,061245 € le
      point, 8 % au-dessus de la valeur de service de 2026 (0,05671 €), écart que
      la page n'explique pas.
  exemples: aucun trouvé
