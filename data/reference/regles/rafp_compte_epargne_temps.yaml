  nee_de: LEGIARTI000021010268
  bornes:
    revenu.annee: [2009-01-01, 2019-01-01]
  contenu:
    beneficiaire: >-
      le fonctionnaire titulaire et le magistrat, pas le contractuel ; dans la
      territoriale, si la collectivité l'a délibéré (décret n° 2004-878, article 5)
    droit: >-
      les jours inscrits au compte au-delà du seuil (quinze dans la territoriale) se
      versent au RAFP, s'y gardent ou s'indemnisent, au choix du titulaire ; « en
      l'absence d'exercice d'une option », ils vont au RAFP. Chaque jour vaut
      V = M / (P + T) : M le forfait de la catégorie, P les taux de CSG et de CRDS,
      T les taux de cotisation RAFP de l'agent et de l'employeur ; l'agent cotise
      sur V au taux de 100 % diminué de la CSG et de la CRDS, l'employeur au même
      taux ; « l'indemnité mentionnée au I n'est pas prise en compte dans l'assiette
      des éléments de rémunération auxquels s'applique la limite »
    forfait: >-
      arrêté du 28 août 2009, article 4, du 31 août 2009 au 1er janvier 2019 :
      125 € en catégorie A, 80 € en B, 65 € en C (Légifrance)
  exemples: aucun trouvé
