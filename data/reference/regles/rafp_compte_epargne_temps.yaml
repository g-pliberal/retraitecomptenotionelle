historique:
- >-
  2026-10-04 — née avec l'action 119 : l'une des deux exceptions au plafond de 20 %
  que la fiche `rafp_assiette_plafond` laissait à relire, documentée sans être
  modélisée ; l'autre, la GIPA, a sa fiche, `rafp_gipa_hors_plafond`.
effet: >-
  Les fonctionnaires qui ont versé des jours de compte épargne-temps au RAFP ont
  des points que le modèle ne compte pas : quinze jours en catégorie A, 1 470 points
  en 2026, environ 83 € de rente par an à la valeur de service de 2026. Le
  simulateur ne demande pas ces jours.
textes_a_rattacher:
- reference: 'décret n° 2009-1065 du 28 août 2009 : il crée le versement des jours au RAFP dans la fonction publique de l''État'
