schema_version: 1
id: rafp_compte_epargne_temps
intitule: >-
  Les jours de compte épargne-temps que le fonctionnaire titulaire ou le magistrat
  verse au RAFP, au-delà du seuil de son compte, se valorisent au forfait de sa
  catégorie et cotisent presque en entier, hors de la limite de 20 % du traitement
  indiciaire.
domaine: cotisations
regimes: [rafp]
etape: acquerir_les_droits
face: droit
etat: pas_encore_modelisee
lit:
- les jours de compte épargne-temps au-delà du seuil que le titulaire verse au RAFP, année par année, et sa catégorie statutaire
ecrit:
- la cotisation au RAFP de ces jours, hors plafond, et les points qu'elle achète
dates_qui_decident:
- revenu.annee
versions:
- id: avant_2009
  statut: supposee
  hypothese: >-
    avant le décret n° 2009-1065, qui crée l'article 6-1 du décret n° 2002-634, les
    jours du compte ne se versent pas au RAFP
  fiabilite: haute, l'article 6-1 n'a pas de rédaction antérieure au 31 août 2009 dans l'index
  bornes:
    revenu.annee: [null, 2009-01-01]
  contenu:
    droit: aucun versement de jours au RAFP
  exemples: aucun trouvé
