schema_version: 1
id: baremes_cnbf
intitule: >-
  Pension forfaitaire de base, cotisation forfaitaire, taux proportionnel et grille
  de cotisation du complémentaire des avocats (classe C1), année par année depuis
  2016.
regimes: [cnbf, cnbf_complementaire]
etat: approchee
effet: >-
  Tout avocat. La grille du complémentaire était celle de 2026 depuis 2019, alors
  que le taux de première tranche est passé de 3,20 % en 2016 à 7,00 % en 2026 ;
  la pension de base était celle de 2026 ramenée par les prix. Les deux sont lues
  année par année, et ancrées sur 2016 avant.
sources:
  lu_le: 2026-10-18
  prochaine_relecture: 2027-02-28
  a_relire:
  - >-
    Aucun barème antérieur à 2016 n'est publié par la caisse ; le chercher dans
    ses rapports annuels ou dans la presse professionnelle.
  lectures:
  - type: autre
    reference: >-
      CNBF, barèmes des cotisations et prestations 2016 à 2023, 2025 et 2026, en
      ligne ; barème 2024 (« Bareme-CNBF-2024-01.20.pdf ») lu dans Internet Archive,
      capture du 15 juillet 2024 à l'adresse d'origine.
    url: https://www.cnbf.fr/medias/documents/?_sft_thematique-media=baremes
    date: 2026-09-22
  - type: autre
    reference: >-
      CNBF, « Barème des cotisations et prestations pour l'année 2026 », du 19 janvier
      2026, relu : la cotisation forfaitaire de base selon l'ancienneté (363 € la
      première année, 1 988 € dès la sixième), la proportionnelle de 3,2 % dans la
      limite de 297 549 €, la grille du complémentaire (C1 : 7,00 % jusqu'à 42 507 €,
      puis 10,40 %, 12,20 %, 14,00 % et 15,80 % jusqu'à 212 535 €), l'invalidité-décès
      (68 € puis 170 €, et 163 € recouvrés auprès du barreau). La fiche de paie du site
      prélève depuis ce jour le forfait et les tranches que le compte recevait.
    url: https://www.cnbf.fr/wp-content/uploads/2026/01/Bareme-CNBF-2026.01.01.pdf
    date: 2026-10-18
textes_a_rattacher:
- reference: >-
    R. 723-43 CSS : le montant de la retraite de base est fixé par décision de l'assemblée
    générale de la CNBF
- reference: barèmes annuels des cotisations et prestations de la CNBF, 2016 à 2026
approximations:
- ecart: >-
    La cotisation forfaitaire de base s'appelle selon l'ancienneté, de 363 € la première
    année à 1 988 € dès la sixième en 2026 (barèmes de 2023 à 2026) ; le modèle prélève
    le forfait de croisière à toutes les années : le compte notionnel des cinq premières
    années est surestimé de 4 586 € en 2026, la pension forfaitaire du scénario 1 n'en
    dépend pas.
  effet: >-
    non mesuré ; léger : la coupe du 14 octobre 2026 le déclare sans le faire
    (action 138, classement du 9 octobre)
code:
  moteur: >-
    Les deux fiches ont une période par année depuis 2016. Au régime de base,
    `liquider_chaque_regime` sert la pension forfaitaire de la période en vigueur à la
    date d'effet (`periode_de_liquidation`, `pension_forfaitaire_annuelle`), portée par
    les prix depuis son année (`pension_forfaitaire_annee`), celle de 2016 pour les
    périodes d'avant, et proratisée par la durée ; la cotisation, que le compte
    notionnel reçoit (`ConstructeurCompte._cotisation_ligne`) et que la fiche de paie
    prélève (`bloc_droit_en_vigueur`), est le forfait de croisière de l'année
    (`cotisation_forfaitaire_euros`, `cotisation_forfaitaire_annee`) et la
    proportionnelle sur le revenu entier, sans la limite que le barème écrit
    (`taux_cotisation_retraite`, `deplafonnee`). Au complémentaire, chaque année porte
    les cinq tranches de la classe C1 en euros (`borne_basse_euros`,
    `borne_haute_euros`), que `bornes_assiette_en_euros`, et pour la fiche de paie
    `bornes_en_euros`, font primer sur le plafond, et leurs taux : `acquerir` en achète
    les points, le compte et la fiche de paie en reçoivent les cotisations ; avant 2016,
    8 % sans plafond.
  python: >-
    droit/liquider.py : liquider_chaque_regime ; droit/commun.py :
    periode_de_liquidation ; droit/acquerir.py : acquerir ; donnees/regimes.py :
    PeriodeRegime.bornes_assiette_en_euros, PeriodeRegime.bornes_en_euros ;
    moteur/compte.py : ConstructeurCompte._cotisation_ligne,
    ConstructeurCompte._bornes_proratisees ; remuneration.py : bloc_droit_en_vigueur
  javascript: >-
    moteur/js/droit/liquider.js : liquiderChaqueRegime ; moteur/js/droit/commun.js :
    periodeDeLiquidation ; moteur/js/droit/acquerir.js : acquerir ;
    moteur/js/regimes.js : PeriodeRegime.bornesAssietteEnEuros,
    PeriodeRegime.bornesEnEuros ; moteur/js/compte.js :
    ConstructeurCompte._cotisationLigne, ConstructeurCompte._bornesProratisees ;
    moteur/js/remuneration.js : blocDroitEnVigueur
  parametres: >-
    regimes/cnbf.yaml, regimes/cnbf_complementaire.yaml : pension_forfaitaire_annuelle,
    pension_forfaitaire_annee, cotisation_forfaitaire_euros,
    cotisation_forfaitaire_annee, taux_cotisation_retraite, assiette, borne_basse_euros,
    borne_haute_euros
  tests:
  - tests/test_simulateur.py
  - >-
    tests/test_cumul_activites.py, tests/test_droit.py et tests/test_liquidation.py, qui
    confrontent les deux moteurs sur des carrières qui la portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    huit témoins changent sans les barèmes de l'année, les sept de l'avocat et
    metiers_maximum
