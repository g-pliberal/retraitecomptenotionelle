      11.1 et avant l'âge prévu à l'article 11.2 (a). [...] « 2° Par dérogation aux
      dispositions de l'article 12, les abattements qui sont appliqués en cas de départ
      anticipé des assurés des générations 1955 et antérieures sont les suivants : « - 4
      % par année d'anticipation, plus « - 0,25 % par trimestre manquant pour pouvoir
      liquider la retraite de base à taux plein, dans la limite du nombre de trimestres
      séparant l'assuré de ses 65 ans. « Tout trimestre incomplet est considéré comme un
      trimestre entier d'anticipation. »
