schema_version: 1
id: carpimko_ages_2015
intitule: >-
  Régime complémentaire de la CARPIMKO : de 1984 au 4 juin 1987, pension à 65 ans, ou
  dès 60 ans « affectée des coefficients de minoration » de 0,75 à 0,95 selon l'âge
  seul ;
  depuis le 3 octobre 2015, taux plein à 65 ans pour les générations 1955 et
  antérieures, quatre mois de plus par génération jusqu'à 67 ans, âge minimal de 60 à
  62 ans du même pas, et avant le taux plein un abattement de 1,25 % par trimestre
  manquant au régime de base, dans la limite des trimestres qui séparent de l'âge du
  taux plein — jusqu'au 9 janvier 2024, pour les générations 1955 et antérieures en
  départ anticipé, 4 % par année d'anticipation plus 0,25 % par trimestre manquant, le
  texte ne tranchant pas si leur durée les met au taux plein dès 60 ans — ; une
  majoration de 1,25 % par trimestre civil entier d'ajournement, vingt au plus ; depuis
  le 10 janvier 2024, 10 % pour trois enfants ; la pension au premier jour du trimestre
  civil qui suit la demande ; de juin 1987 à 2015, des statuts que le Journal officiel ne
  publie pas, la règle du modèle présumée.
domaine: decote_surcote
regimes: [carpimko_complementaire]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  l'âge de l'auxiliaire médical à la date d'effet de sa pension, « fixée au premier jour
  du trimestre civil qui suit la demande » (statuts de 1984, article 11 ; règlement de
  2026, article 7), et, depuis le 3 octobre 2015, sa génération, qui donne l'âge
  minimal et l'âge du taux plein (article 12 quater, puis article 6 du règlement)
- >-
  depuis le 3 octobre 2015, sa durée d'assurance au régime de base et les trimestres
  qui lui manquent pour y liquider à taux plein, qui réduisent ou annulent
  l'abattement ; les statuts de 1984 ne la lisent pas
- >-
  l'inaptitude au travail, la qualité de grand invalide, d'ancien déporté ou interné,
  d'ancien combattant ou prisonnier de guerre, le handicap (depuis le 31 mai 2019) et
  le départ anticipé au régime de base (depuis le 10 janvier 2024), qui ouvrent le taux
  plein plus tôt
- la date d'effet de la pension, qui choisit la rédaction des statuts ou du règlement
ecrit:
- >-
  le coefficient qui minore ou majore la pension complémentaire, que
  `liquider_chaque_regime` applique aux cotisations revalorisées, et, depuis 2016,
  l'âge minimal et l'âge du taux plein, que la table `carpimko_2016` de
  `ages_regimes.csv` rend à l'ouverture
