      1) A l'âge prévu au 1° de l'article L. 351-8 du code de la sécurité sociale ; « 2)
      A partir de l'âge prévu à l'article L. 161-17-2 du même code et avant l'âge
      mentionné au 1 au profit des assurés remplissant les conditions leur permettant de
      liquider leur pension du régime de base sans abattement ; [...] « Article 4 «
      Décote « Dans le cas où un assuré liquide sa retraite avant le bénéfice du taux
      plein, un abattement est appliqué sur la pension de retraite, qui est fonction de
      l'âge auquel est demandée la liquidation et de la durée d'assurance lorsque
      l'assuré ne justifie pas de la durée prévue dans le régime de base. « Cet
      abattement est de 1,25 % par trimestre manquant pour pouvoir liquider la retraite
      de base à taux plein, dans la limite du nombre de trimestres les séparant de l'âge
      du taux plein sans condition. [...] « Article 5 « Surcote « Lorsque la liquidation
      de la retraite est ajournée au-delà de l'âge auquel elle aurait pu être liquidée
      sans abattement, les assurés peuvent bénéficier d'une majoration de leur pension.
      « Cette majoration est égale à 1,25 % par trimestre civil entier d'ajournement
      postérieur à l'âge du taux plein dans la limite de vingt trimestres. [...] «
      Article 6 « Conditions d'âge « Par dérogation aux dispositions de l'article 3, les
      conditions de liquidation des assurés nés avant le 1 er septembre 1961 sont les
      suivantes : [...] « Article 7 « Date d'effet de la retraite « La date d'entrée en
      jouissance de la retraite est fixée au premier jour du trimestre civil qui suit la
      demande, sans pouvoir être antérieure à l'âge terme fixé par les dispositions
      précédentes. »
