    droit: >-
      la pension à 65 ans, dès 60 ans pour l'inapte et l'ancien déporté ou interné ;
      avant 65 ans, 0,75 à 60 ans, 0,80 à 61, 0,85 à 62, 0,90 à 63, 0,95 à 64, selon
