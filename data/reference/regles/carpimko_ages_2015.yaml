approximations:
- version: [avant_le_regime]
  textes: décret n° 84-143, articles 1er, 6 et 7
  ecart: >-
    Le modèle ne sert rien d'une pension qui prend effet avant 1984, au titre des
    régimes de 1956 que la CARPIMKO remplace : leurs statuts ne sont pas lus.
  effet: non mesuré
- version: [statuts_de_1984]
  textes: statuts de 1984, article 12
  ecart: >-
    Erreur du modèle, déclarée, non corrigée : les statuts minorent par l'âge seul, «
    0,75 si la liquidation intervient à soixante ans » ; le modèle annule la minoration
    quand la durée du régime de base est atteinte. Né le 10 mars 1925, entré à vingt
    ans, l'auxiliaire médical part à 60 ans le 1er avril 1985 avec sa durée : le modèle
    sert 114,27 € par an, sans coefficient ; les statuts, 0,75 × 114,27 = 85,71 €.
    L'erreur n'est prouvée que jusqu'au 4 juin 1987 : le cas d'une pension prise en
    1990 tombe sous l'arrêté du 20 mai 1987, dont le texte n'est pas lu (version
    `statuts_de_1987`, supposée).
  effet: >-
    28,57 € par an de trop dans le cas posé, jusqu'à 25 points de la pension prise de
    60 à 64 ans avec la durée, du 1er janvier 1984 au 4 juin 1987 ; sans la durée, le
    modèle rend le coefficient du texte aux âges entiers (entré à 26 ans, 0,75,
    85,71 €)
- version: [statuts_de_1984]
  textes: statuts de 1984, article 12
  ecart: >-
    Le texte ne tranche pas l'âge entamé : « 0,75 si la liquidation intervient à
    soixante ans », puis 0,80 à soixante et un ans, sans dire si l'âge se compte en
    années révolues ; le modèle compte 1,25 % par trimestre, 0,775 à 60 ans et 6 mois
    sans la durée, quand les années révolues donneraient 0,75.
  effet: moins de cinq points de la pension ; non mesuré
- version: [statuts_de_1984, reglement_de_2026]
  textes: statuts de 1984, article 11 ; règlement de 2026, article 7
  ecart: >-
    La date d'entrée en jouissance « est fixée au premier jour du trimestre civil qui
    suit la demande, sans pouvoir être antérieure » à l'âge. Le modèle ne connaît pas
    la demande : il tient la pension pour demandée à temps, et reporte la date qu'il
    présume — le premier du mois qui suit l'âge demandé — au premier jour du trimestre
    civil qui commence ce jour-là ou après (`effet_au_trimestre_civil`), du 1er janvier
    1984 au 4 juin 1987 et depuis le 18 juillet 2026. La pension de base, que R. 643-6
    du code de la sécurité sociale date de même, et les prestations complémentaires de
    vieillesse, que leur règlement de 2026 date de même (article 2), restent servies au
    premier du mois : le modèle les sert un ou deux mois avant la complémentaire.
  effet: >-
    aucun sur la complémentaire demandée à temps ; une demande tardive la reporte
    encore
