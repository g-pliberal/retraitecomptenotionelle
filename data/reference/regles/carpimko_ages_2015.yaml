    citation: >-
      « Pour bénéficier de la retraite complémentaire, les affiliés doivent remplir les
      conditions suivantes : 1° Etre âgés de soixante-cinq ans ou de soixante ans en cas
      d'inaptitude au travail, ou s'ils ont la qualité d'ancien déporté ou interné dans
