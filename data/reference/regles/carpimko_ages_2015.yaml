    les pensions qui prennent effet du 5 juin 1987 au 30 novembre 1996 relèvent des
    statuts de 1984 modifiés par l'arrêté du 20 mai 1987, dont l'index JORF n'a que le
    titre, ni article ni annexe : rien ne dit s'il laisse les articles 10 à 12. Ceux du 24
    janvier 1989 (article 13) et du 16 décembre 1991 (article 22, « APPLICABLES A COMPTER
    DU 01-01-1992 », au Bulletin officiel no 91-50) ne les touchent pas. La fiche présume
    la règle du modèle : ouverture à l'âge de L. 161-17-2, minoration de 1,25 % par
    trimestre manquant à la durée du régime de base, dans la limite des trimestres qui
    séparent de l'âge d'annulation de la décote de la génération, aucune majoration
  fiabilite: >-
    faible : l'âge, le coefficient et la place de la durée, que nul texte lu ne dit pour
    ces neuf années ; si l'arrêté de 1987 laisse l'article 12, la minoration à l'âge seul
    de 1984 vaut jusqu'en 1996
