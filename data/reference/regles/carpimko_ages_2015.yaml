      guerre et les anciens combattants [...] sont applicables au présent régime
      complémentaire. »
  - id: LEGIARTI000006782881
    article: statuts de 1984, article 12
    en_vigueur: 1984-01-01
    citation: >-
      « Le bénéfice de la retraite peut être accordé par anticipation si l'adhérent a
      versé toutes les cotisations dues. Dans ce cas, la retraite est affectée des
      coefficients de minoration suivants : 0,75 si la liquidation intervient à soixante
      ans ; 0,80 si la liquidation intervient à soixante et un ans ; 0,85 si la
      liquidation intervient à soixante-deux ans ; 0,90 si la liquidation intervient à
      soixante-trois ans ; 0,95 si la liquidation intervient à soixante-quatre ans. »
