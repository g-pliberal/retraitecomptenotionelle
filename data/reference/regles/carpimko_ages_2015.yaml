    citation: >-
      « La date d'entrée en jouissance de la retraite est fixée au premier jour du
      trimestre civil qui suit la demande, sans pouvoir être antérieure au
      soixante-cinquième anniversaire ou soixantième en cas d'inaptitude au travail. Les
