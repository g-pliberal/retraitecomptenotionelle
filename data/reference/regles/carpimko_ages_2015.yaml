reformes:
- carpimko_report_2015
- carpimko_2024
effet: >-
  La fiche lisait 67 ans dès la génération 1955 ; la table `carpimko_2016` arrête
  la décote et fait partir la majoration à l'âge que l'article 12 quater écrit,
  depuis 2016. Trois enfants majorent la pension depuis 2024. Lue au droit le 5
  novembre 2026 (action 130) : avant 1984, les statuts de 1984 lus dans LEGI, puis
  2015, 2019, 2024 et le règlement de 2026. Retouchée le même jour après la relecture
  R-E4 : huit versions, les statuts de 1984 lus jusqu'au 4 juin 1987 seulement, ceux de
  1987 à 2015 présumés, faute du texte de l'arrêté du 20 mai 1987 et du Bulletin
  officiel no 96-52. Erreurs du modèle déclarées, non corrigées : de 1984 à juin 1987,
  la durée annule une minoration que les statuts font de l'âge seul (28,57 € par an
  dans le cas posé) ; de 2015 à 2024, la majoration des générations 1955 et
  antérieures comptée avant l'âge légal de leur base (136,90 €) ; la date d'effet au
  mois, non au trimestre civil (475,50 €). Non tranchés : les 4 % par année des mêmes
  générations quand elles ont leur durée (136,90 € ou 862,45 € par an), l'âge d'où la
  majoration se compte (1 263,99 €).
  Corrigée le 14 novembre 2026 (action 130, décision du propriétaire du 13, ligne 12 de
  la file) : jusque-là, le modèle servait la complémentaire le premier du mois qui suit
  l'âge, avec la base, quand l'article 11 des statuts de 1984 et l'article 7 du
  règlement de 2026 fixent son entrée en jouissance « au premier jour du trimestre
  civil qui suit la demande » — né le 10 novembre 1959, entré à 26 ans, l'auxiliaire
  médical demande sa pension à 67 ans, en novembre 2026 : servi dès le 1er décembre
  2026, majoré de deux trimestres civils entiers, 1,025, 5 706,01 € par an, au lieu du
  1er janvier 2027, majoré de trois, 1,0375, 5 706,01 / 1,025 × 1,0375 = 5 775,59 € ;
  un mois de trop, 475,50 €, puis 69,59 € par an de moins. Depuis,
  `effet_au_trimestre_civil` aux périodes de 1984 (`[1984-01-01, 1987-06-05]`) et de
  2026 (`[2026-07-18, null]`), dans les deux moteurs : la date présumée, quand elle
  tombe dans ces bornes, est reportée au premier jour du trimestre civil qui commence
  ce jour-là ou après, et la pension s'y liquide seule, après la base, sous la durée
  requise de celle-ci — une complémentaire liquidée sans sa base retombait sur 160
  trimestres, et majorait depuis une durée que sa génération n'avait pas (1,05 au lieu
  de 1,0375 dans le cas posé). Du 5 juin 1987 au 17 juillet 2026, l'article n'est pas
  lu, et le modèle sert au premier du mois.
