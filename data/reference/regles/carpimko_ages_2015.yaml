      jour du trimestre civil qui suit la demande. Le modèle ouvre à l'âge de L. 161-17-2
      et minore jusqu'à l'âge d'annulation de la décote de la génération, 60 et 65 ans
      pour celles qui liquident avant 1987, de 1,25 % par trimestre, cinq points par
      année ; la durée y annule la minoration (voir les approximations)
    conditions: avoir versé toutes les cotisations dues
