- version: [statuts_de_2015, statuts_de_2019]
  textes: >-
    statuts, articles 11, 12 et 12 quater, rédaction de l'arrêté du 31 juillet 2015
  ecart: >-
    Le texte ne tranche pas, du 3 octobre 2015 au 9 janvier 2024, si les générations
    1955 et antérieures qui ont leur durée sont au taux plein avant 65 ans. Première
