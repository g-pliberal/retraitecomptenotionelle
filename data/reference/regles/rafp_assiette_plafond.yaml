effet: >-
  Fonctionnaires, magistrats et militaires dont les primes dépassent le cinquième
  du traitement, soit un sixième de la rémunération. Le modèle prenait toutes les
  primes : à 22 % de primes, le RAFP ressortait trop haut de 41 %. Champ `plafond_primes_traitement`
  de la fiche, lu par `PeriodeRegime.part_du_revenu` dans les deux moteurs, tenu
  par `test_les_primes_au_dela_du_plafond_ne_cotisent_pas_au_rafp` et son pendant
  JavaScript.
sources:
  lu_le: 2026-10-29
  prochaine_relecture: 2027-10-29
  lectures:
  - type: legifrance
    reference: >-
      article 2 en vigueur (LEGIARTI000049424057) : « Ces éléments sont pris en
      compte dans la limite de 20 % du traitement indiciaire brut total ou de la
      solde brute totale perçus au cours de l'année considérée » ; même limite,
      sans la solde avant 2019, dans les versions de 2004, 2017, 2018, 2019 et 2023
      lues dans l'index LEGI du dépôt
    date: 2026-09-23
  - type: autre
    reference: >-
      ERAFP, « Calculer vos cotisations et vos points RAFP » : « L'assiette de cotisation
      au RAFP est plafonnée à 20 % du traitement indiciaire brut », appréciée en
      cumul depuis le 1er janvier, sauf la GIPA et les jours de CET convertis
    url: >-
      https://www.rafp.fr/actif/activite/calculer-vos-cotisations-et-vos-points-rafp
    date: 2026-09-23
  - type: legifrance
    reference: >-
      dans l'index LEGI du dépôt, à jour de l'incrément du 28 octobre 2026 : le décret
      n° 2004-569, articles 2 (ses six rédactions), 3 et 4 (ses deux rédactions) ; la loi
      n° 2003-775, article 76 (ses quatre rédactions : la limite et le taux n'y changent
      pas, l'assiette perd la protection sociale complémentaire en 2022 et l'activité
      hospitalière des hospitalo-universitaires en 2024) ; la loi n° 2022-1726, article
      162 ; la loi n° 2023-1268, article 33 ; l'arrêté du 26 novembre 2004, article 15,
      ses quatre rédactions, qui toutes rapprochent chaque mois l'assiette cumulée depuis
      janvier du plafond cumulé
    date: 2026-10-29
  - type: autre
    reference: >-
      ERAFP, « Calcul et versements des cotisations » (employeurs) : l'assiette
      « correspond à l'ensemble des éléments de rémunération perçus au cours de
      l'année civile et non soumis à cotisation vieillesse auprès du régime de base »,
      sans le traitement indiciaire, la NBI, une activité lucrative privée ni les
      remboursements de frais ; « Le plafond de l'assiette est établi à 20 % du seul
      traitement indiciaire brut total perçu au cours de l'année considérée », par un
      « calcul mensuel cumulé glissant » ; le complément de traitement indiciaire
      n'entre ni dans l'assiette ni dans le calcul de la limite ; aucun exemple chiffré
      de la limite, sur cette page ni sur celle des actifs
    url: https://www.rafp.fr/employeur/calcul-et-versement-des-cotisations
    date: 2026-10-29
historique:
- >-
  2026-10-04 — les deux exceptions au plafond, la GIPA et le compte épargne-temps,
  lues : fiches `rafp_gipa_hors_plafond` et `rafp_compte_epargne_temps` ; la
  cotisation volontaire des agents de l'État outre-mer et sa garantie de 4 000 € :
  fiches `rafp_cotisation_volontaire_outre_mer` et `rafp_garantie_outre_mer`. Ni
  les unes ni les autres ne sont modélisées.
- >-
  2026-10-29 — lue au droit (action 130) : quatre versions, coupées à la naissance
  du régime en 2005 et aux deux exclusions que la loi a ajoutées à son assiette, la
  protection sociale complémentaire en 2022, l'activité hospitalière des
  hospitalo-universitaires en septembre 2024. La limite de 20 %, le taux de 10 % et
  son partage n'ont pas changé depuis 2004, et chaque période du régime les porte
  (`tests/test_rafp.py`).
code:
  moteur: >-
    L'assiette du RAFP est faite des seules primes (`primes_uniquement`) :
    `PeriodeRegime.part_du_revenu` les borne à `plafond_primes_traitement`, 20 %, du
    traitement seul, hors de la prime soumise à retenue d'un policier, d'un
    aide-soignant ou d'un sapeur-pompier (`part_soumise`, `PrimesSoumises.parts`), que
    la pension civile prend avec le traitement. Le scénario 1 (`acquerir`) et le compte
    notionnel (`ConstructeurCompte._cotisation_ligne`) découpent tous deux la ligne par
    là, et y prélèvent `taux_cotisation_retraite`, 10 %, la moitié à l'agent
    (`part_salariale`). Ni la GIPA ni les jours du compte épargne-temps, qui échappent
    au plafond, ne sont portés. La ligne est l'année, comme la limite : le calcul
    cumulé de l'employeur, mois par mois, y revient. La saisie ne connaît ni le
    détachement, ni ce que la loi et le décret retirent de l'assiette — l'activité
    privée autorisée, la participation de l'employeur à la protection sociale
    complémentaire, l'activité hospitalière des hospitalo-universitaires — : la part
    de primes qu'elle demande est l'assiette avant la limite.
  python: >-
    donnees/regimes.py : PeriodeRegime.part_du_revenu ; droit/acquerir.py : acquerir,
    part_soumise ; donnees/primes.py : PrimesSoumises.parts ; moteur/compte.py :
    ConstructeurCompte._cotisation_ligne
  javascript: >-
    moteur/js/regimes.js : PeriodeRegime.partDuRevenu ; moteur/js/droit/acquerir.js :
    acquerir, partSoumise ; moteur/js/primes.js : PrimesSoumises.parts ;
    moteur/js/compte.js : ConstructeurCompte._cotisationLigne
  parametres: >-
    contenu.parametres de chaque version : plafond_primes_traitement,
    taux_cotisation_retraite, part_salariale ; regimes/rafp.yaml : assiette,
    plafond_primes_traitement, taux_cotisation_retraite, part_salariale
  tests:
  - tests/test_simulateur.py
  - tests/test_rafp.py, où chaque période du régime porte les taux de chaque version
  - tests/test_primes_soumises_a_retenue.py
  - tests/test_remuneration.py
  - tests/test_indemnite_csg.py
  - >-
    tests/test_trajectoire.py, la confrontation aux cas types de TRAJECTOiRE
  - >-
    tests/test_liquidation.py, tests/test_pont.py et tests/test_web.py, qui
    confrontent les deux moteurs sur des carrières qui la portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    neuf témoins changent sans le plafond — primes_fonction_publique,
    fonctionnaire_indice_majore_et_primes, releve_fonction_publique,
    departs_super_actif_rafp_a_l_age_legal, progressive_fonctionnaire_2024,
    invalidite_radiation_puis_prive et les trois réversions d'un fonctionnaire
