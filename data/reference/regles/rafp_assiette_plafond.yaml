  nee_de: LEGIARTI000006453300
  bornes:
    revenu.annee: [2005-01-01, 2022-01-01]
  contenu:
    beneficiaire: >-
      les fonctionnaires civils, les magistrats de l'ordre judiciaire et les militaires
      (fiche `rafp_beneficiaires`)
    droit: >-
      le régime est « assis sur une fraction maximale, déterminée par décret en Conseil
      d'Etat, de l'ensemble des éléments de rémunération de toute nature non pris en
      compte dans l'assiette de calcul des pensions civiles et militaires de retraite »
      (loi, article 76, I) : « Ces éléments sont pris en compte dans la limite de 20 %
      du traitement indiciaire brut total perçu au cours de l'année considérée »
      (décret, article 2) ; « Le taux global de cotisation est fixé à 10 % du montant
      de l'assiette. Il est réparti à parts égales entre l'employeur et le
      bénéficiaire » (article 3), comme la loi le veut (article 76, III)
    conditions: >-
      sont pris les éléments « perçus » au cours de l'année civile, et depuis le 30
      septembre 2018 les « revenus d'activité dus au cours de l'année civile » tels que
      la CSG les prend, hors de ceux qui entrent dans la pension civile ou celle de la
      CNRACL ; la rémunération d'une activité privée lucrative autorisée « n'entre pas
      dans l'assiette » ; la limite vaut pour la solde des militaires, que le texte nomme
      depuis le 19 octobre 2019 (« ou de la solde brute totale ») ; détaché dans un
      emploi qui ne conduit pas à pension, le bénéficiaire cotise sur la différence
      entre sa rémunération et le traitement indiciaire de sa retenue pour pension, et
      « La limite de 20 % prévue à l'article 2 s'apprécie au regard de ce traitement »
      (article 4) ; chaque mois, l'employeur rapproche les éléments cotisables versés
      depuis le début de l'année « du plafond de l'assiette déterminée à partir du
      traitement indiciaire brut servi depuis le même début d'année » (arrêté du 26
      novembre 2004, article 15) : la limite vaut pour l'année entière
    parametres:
      plafond_primes_traitement: 0.20
      taux_cotisation_retraite: 0.10
      part_salariale: 0.50
  exemples: aucun trouvé
