schema_version: 1
id: rafp_assiette_plafond
intitule: >-
  Assiette du RAFP : les éléments de rémunération qui n'entrent pas dans celle de
  la pension civile ou de la CNRACL — primes, indemnités, avantages en nature —,
  « dans la limite de 20 % du traitement indiciaire brut total ou de la solde brute
  totale perçus au cours de l'année considérée » ; cotisation de 10 %, moitié agent,
  moitié employeur.
domaine: cotisations
regimes: [rafp]
etape: acquerir_les_droits
face: droit
etat: conforme
lit:
- le traitement et les primes de chaque année de la ligne, que la saisie donne par la
  part des primes dans la rémunération
- la part des primes que la pension civile ou la CNRACL prend avec le traitement — la
  prime soumise à retenue d'un policier, d'un aide-soignant ou d'un sapeur-pompier
- le statut de la ligne, qui l'affilie ou non au RAFP (fiche `rafp_beneficiaires`)
ecrit:
- l'assiette du RAFP de l'année, bornée à 20 % du traitement, et la cotisation de 10 %
  qu'elle porte, la moitié à l'agent, que reçoivent les points du RAFP au scénario 1
  et le compartiment de capitalisation du compte notionnel
dates_qui_decident:
- revenu.annee
