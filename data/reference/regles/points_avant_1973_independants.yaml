schema_version: 1
id: points_avant_1973_independants
intitule: >-
  Les années d'artisan et de commerçant de 1949 à 1972 ouvrent des points de retraite,
  servis à part de la pension alignée : les points acquis, multipliés par la valeur du
  point de retraite à la date d'effet, liquidables à l'âge légal et minorés, faute de
  la durée d'assurance tous régimes, par trimestre manquant ou par trimestre qui sépare
  de l'âge d'annulation de la décote, au plus petit des deux.
domaine: points
regimes: [cancava_avant_1973, organic_avant_1973]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- le revenu porté au compte de chaque année de 1949 à 1972, écrêté au plafond de la
  sécurité sociale de l'année
- la valeur du point de retraite à la date d'effet (regimes/valeurs_service_datees.csv,
  regimes/valeurs_point.csv)
- la durée d'assurance tous régimes, l'âge et la génération, pour la minoration
ecrit:
- les points d'avant 1973 et leur pension, au scénario 1, sous les codes
  cancava_avant_1973 et organic_avant_1973
dates_qui_decident:
- liquidation.date_effet
versions:
- id: classes_de_cotisation
  statut: lue
  textes:
