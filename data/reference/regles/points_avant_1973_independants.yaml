      l'année commençant le 1er janvier suivant, dans les conditions fixées par décret »
    lu_le: 2026-10-14
  - id: LEGIARTI000006764529
    article: décret n° 64-994, art. 26
    en_vigueur: 1968-11-10
    citation: >-
      « Le nombre de points de retraite correspondant à une cotisation annuelle est
