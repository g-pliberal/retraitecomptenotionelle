    lu_le: 2026-10-14
  - id: LEGIARTI000006763964
    article: décret n° 66-248, art. 3
    en_vigueur: 1971-03-31
    citation: >-
      « chaque assujetti opte pour l'une des trois classes de cotisation ci-après :
      Classe VIII correspondant à 36 points de cotisation. Classe VII correspondant à
      24 points de cotisation. Classe VI bis correspondant à 20 points de cotisation.
      La cotisation de l'assujetti qui n'a pas opté pour l'une des classes ci-dessus
      est appelée en classe minimale VI bis »
    lu_le: 2026-10-14
  - id: LEGIARTI000006763981
    article: décret n° 66-248, art. 19
    en_vigueur: 1966-04-22
    citation: >-
      « l'allocation est égale au produit de la valeur du point de retraite fixée,
      comme il est dit ci-après, par la somme des points acquis en raison tant des
      cotisations versées […] que des années d'activité professionnelle visées à
      l'article 17-II »
    lu_le: 2026-10-14
  - id: LEGIARTI000041966593
    article: D. 634-8 CSS
    en_vigueur: 2020-05-25
    citation: >-
      « un revenu annuel égal, dans la limite du plafond […] en vigueur au 1er janvier
      1973, à autant de fois un pourcentage dudit plafond que la dernière cotisation
      annuelle portée à son compte antérieurement au 1er janvier 1973 comporte de
      points. Ce pourcentage est fixé à 3 p. 100 en ce qui concerne les professions
      artisanales et à 5 p. 100 en ce qui concerne les professions industrielles et
      commerciales »
    lu_le: 2026-10-14
  bornes:
    liquidation.date_effet: [null, 1973-01-01]
  contenu:
    droit: >-
      des points par année de cotisation de 1949 à 1972, selon la classe : imposée par
      le revenu de l'année précédente chez les artisans (4 à 60 points), choisie chez
      les commerçants (classe minimale VI bis, 20 points, depuis 1971) ; l'allocation,
      à soixante-cinq ans, vaut les points multipliés par la valeur du point de
      retraite. Les mêmes points se liquident après 1972 selon la version suivante
    parametres:
      points_par_pourcentage_du_plafond: {artisans: 0.03, commercants: 0.05}
  exemples: aucun trouvé
- id: liquidation_a_part
  statut: lue
  textes:
  - id: LEGIARTI000036391704
    article: L. 634-3 CSS
    en_vigueur: 2018-01-01
    citation: >-
      « Les prestations afférentes aux périodes d'assurance ou d'activité
      professionnelle non salariée ou périodes assimilées antérieures au 1er janvier
      1973 demeurent calculées, liquidées et servies dans les conditions définies par
      les dispositions législatives et réglementaires en vigueur au 31 décembre 1972,
      sous réserve d'adaptation par décret. Les coefficients de revalorisation
      mentionnés à l'article L. 161-25 sont applicables aux prestations contributives
      mentionnées au présent article. »
    lu_le: 2026-10-14
  - id: LEGIARTI000006765816
    article: décret n° 73-937, art. 3
    en_vigueur: 1990-01-01
    citation: >-
      « peuvent être liquidées à compter de l'âge de soixante ans. I - Pour les assurés
      qui justifient dans les régimes d'assurance vieillesse de base obligatoires de
      périodes d'assurance ou de périodes reconnues équivalentes d'une durée au moins
      égale à 150 trimestres, il n'est appliqué aucun abattement sur le montant de la
      pension. II - […] un coefficient de minoration qui est fonction soit du nombre de
      trimestres manquant […] soit du nombre de trimestres correspondant à la durée
      séparant l'âge auquel leur pension prend effet de leur soixante-cinquième
      anniversaire […] Le plus petit de ces deux nombres est pris en considération.
      Pour chaque trimestre ainsi retenu le coefficient de minoration à appliquer au
      montant de la pension est fixé à 2,50 p. 100 »
    lu_le: 2026-10-14
  - id: LEGIARTI000006765815
    article: décret n° 73-937, art. 3
    en_vigueur: 1976-03-05
    lu_le: 2026-10-14
  - id: LEGIARTI000006765817
    article: décret n° 73-937, art. 3
    en_vigueur: 1993-08-28
    lu_le: 2026-10-14
