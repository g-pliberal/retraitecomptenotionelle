    en_vigueur: 1968-11-10
    citation: >-
      « La cotisation annuelle est égale au produit du nombre de points prévu pour
      chacune des classes de cotisations énoncées ci-après par la valeur du point :
      Classe I : 4 points. […] Classe XV : 60 points »
    lu_le: 2026-10-14
  - id: LEGIARTI000006764504
