referents:
  baremes_ipp: porte la valeur du point des commerçants depuis 1951 et des artisans depuis 1974
  openfisca_france: porte la valeur du point, sans le barème d'acquisition
historique:
- >-
  2026-10-14 — action 138, étape 18 : le dépôt servait ces années en annuités de la
  pension alignée, comptées dans sa proratisation, la période en points des fiches
  cancava et organic n'étant lue qu'à l'acquisition, au rendement estimé de 9 % ; elles
  ont leur régime, leurs points et la valeur que la Cnav publie.
reformes: []
effet: >-
  Les artisans et commerçants en activité avant 1973, nés avant 1958 environ. Un
  artisan à 80 % du plafond de 1960 à 2004, né en 1940, parti en 2005 : sa pension
  alignée perd les treize années d'avant 1973 de sa proratisation (128/150 au lieu de
  150/150, −1 722 €), et ses 346,67 points en rendent 2 780 € ; sa pension de base
  monte de 11 739 € à 12 798 €. Un artisan de 1955 à 1972 seul, parti en 2000 : 480
  points, 3 501 € au lieu de 3 828 € d'annuités.
