approximations:
- ecart: >-
    les points d'une année se lisent dans le revenu par l'équivalence de D. 634-8 (un
    point par 3 % du plafond pour l'artisan, par 5 % pour le commerçant, au plafond au
    plus), et non dans la classe de l'année : les seuils de revenus des classes des
    artisans et les classes de 1949 à 1970 sont dans des décrets que l'index ne porte
    qu'en notices ; le commerçant, qui choisissait sa classe, en cotisait vingt points
    au moins sans rien demander, quand le modèle lui en ouvre moins sous le plafond
  effet: >-
    un artisan payé au plafond reçoit 33,3 points par an, la classe XII (36 points) à
    un dixième près ; à 80 % du plafond, 26,7 points ; un commerçant au plafond, les 20
    points de la classe minimale, à 80 %, 16
- ecart: >-
    ni les points gratuits des années d'activité d'avant 1949 (classe I chez le
    commerçant, cent vingt points au plus, décret n° 66-248, art. 17 ; tableau de
    reconstitution chez l'artisan), ni les rachats, ni la bonification des points
    acquis au 1er décembre 1962 (décret n° 66-248, art. 20), ni la majoration pour
    ajournement d'avant juillet 1984 (décret n° 73-937, art. 12), ni la bonification
    des points de la mère sans période d'assurance après 1972, la moyenne
    trimestrielle de ses points par année d'éducation, huit au plus par enfant (même
    décret, art. 5)
  effet: non mesuré ; les carrières du modèle commencent après 1949
- ecart: >-
    avant 1990, l'article 3 renvoyait aux règles du régime général ; la fiche applique
    celles de la rédaction de 1990 (150 trimestres, 2,5 % par trimestre) dès 1973, et
    coupe à l'année la rédaction du 7 octobre 2012 ; en 2020, la valeur du point est
    celle des pensions d'au plus 2 000 € par mois
  effet: non mesuré
- ecart: >-
    l'article 3 bis, qui fait liquider ces droits avec la retraite anticipée pour
    carrière longue, et l'article 3 ter, le versement pour la retraite, ne sont pas
    modélisés
  effet: non mesuré
