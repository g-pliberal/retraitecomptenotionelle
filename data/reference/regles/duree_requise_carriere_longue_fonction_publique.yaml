      applicable aux demandes de pension déposées à compter de cette date », que la note
      de la rédaction du 11 novembre 2010 de L. 25 bis reprend (LEGIARTI000023032081) ; le
      décret n° 2010-1748, deux articles et aucune date, pris « Vu la loi n° 2010-1330
      [...], notamment ses articles 43 et 50 », et l'article 16, III, du décret n°
      2010-1740 (JORFARTI000023334739), lus dans l'index JORF le 24 octobre 2026
    date: 2010-11-10
  - type: autre
    reference: >-
      Bulletin officiel du service des retraites de l'État, n° 491 (octobre-décembre
      2010) : L. 25 bis parmi les articles que modifie la loi n° 2010-1330 (« L 25 bis
      (43 I) »), le décret n° 2010-1748 inscrit sans date d'application ; n° 492 à 497,
      de 2011 au premier semestre 2012, et les rapports d'activité du régime de 2010 à
      2012 : rien sur la date de la carrière longue, ni sur les demandes déposées avant
      le 1er juillet 2011 ; lus le 24 octobre 2026
    date: 2010-12-31
    url: https://retraitesdeletat.gouv.fr/files/files/Publications/Bulletins%20d'information/bo491.pdf
