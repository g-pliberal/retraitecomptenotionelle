      du 1er janvier 2008, à cinquante-six ans [...] ; 2° A compter du 1er juillet
      2006, à cinquante-huit ans [...] ; 3° A compter du 1er janvier 2005, à
      cinquante-neuf ans », sur 168, 164 et 160 trimestres cotisés ; D. 16-1, versions
      du 1er janvier 2011 (LEGIARTI000023383582) et du 1er novembre 2012
      (LEGIARTI000026140012)
    date: 2026-10-16
    url: >-
      https://www.juris-cnracl.retraites.fr/pension-normale/calcul-de-la-pension/duree-dassurance-requise-pour-beneficier-du-taux-maximal-de/duree-dassurance-requise-fonctionnaire-beneficiant-dun-depart-anticipe-avant-60-ans-pour-un-autre
  - type: legifrance
    reference: >-
      L. 25 bis CPCMR, rédactions du 1er janvier 2005 (LEGIARTI000006362733) et du 19
      décembre 2008 (LEGIARTI000019959540), et D. 16-1, rédactions du 1er janvier 2011
      (LEGIARTI000023383582), du 1er novembre 2012 (LEGIARTI000026140012) et du 1er
      avril 2014 (LEGIARTI000028751947), relus dans l'index LEGI : « une durée
      d'assurance, ou de périodes reconnues équivalentes, au moins égale à 168
      trimestres », puis à la durée « applicable l'année où l'assuré atteint l'âge
