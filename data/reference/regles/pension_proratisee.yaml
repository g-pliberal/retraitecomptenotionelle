schema_version: 1
id: pension_proratisee
intitule: >-
  Un régime en annuités qui coordonne ses périodes avec un autre État sert la plus
  élevée de deux pensions : la pension nationale, calculée sur les seules périodes
  françaises, et la pension proratisée — la pension théorique qu'aurait servie une
  carrière toute française, taux et durée comptés sur toutes les périodes, réduite au
  prorata des périodes françaises ; une convention à calcul séparé sert la pension
  nationale, les périodes de l'autre État comptées pour le taux. Les régimes en points
  servent leur pension nationale, sans prorata.
domaine: coordination
regimes: [regime_general, msa_salaries, cancava, organic, rsi, fonction_publique_etat,
  cnracl, fspoeie]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- les trimestres étrangers que chaque accord fait compter (fiche
  totalisation_des_periodes_etrangeres), et l'accord lui-même — son calcul et son prorata
- la durée d'assurance de chaque régime, la durée d'assurance tous régimes, la durée maximum
  du régime général
- le salaire annuel moyen de la pension nationale, et la date d'effet de la pension
ecrit:
- la pension de chaque régime coordonné, nationale ou proratisée, la plus élevée des deux,
  avec ses deux calculs et le prorata qu'applique la seconde
dates_qui_decident:
- liquidation.date_effet
- assure.generation
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# type de chaque convention — comparaison, calcul séparé, option — est dans le
# tableau des accords, avec ses dates.
versions:
- id: sans_comparaison_1975
  statut: lue
  textes:
  - {id: "http://data.europa.eu/eli/reg/1971/1408/oj", article: "règlement (CEE) n° 1408/71 du 14 juin 1971, article 46, dans sa rédaction d'origine (JO CE L 149 du 5 juillet 1971)",
     en_vigueur: 1972-10-01}
  - {reference: "circulaire Cnav n° 20/94 du 31 janvier 1994, point 1", publie_le: 1994-01-31}
  bornes:
    liquidation.date_effet: [null, 1992-06-01]
  contenu:
    droit: >-
      « Depuis la loi du 03/01/1975, la comparaison, prévue par les règlements
      européens, entre la retraite nationale et la retraite proratisée n'était pas
      effectuée. Toutes les périodes d'assurance des régimes de base français et des
      autres États étaient retenues pour déterminer le taux de la retraite. La
      retraite n'était pas réduite au prorata temporis. La retraite ainsi calculée
      était toujours au moins égale à la retraite proratisée » (exposé de la Cnav «
      Anciens règlements », circulaire n° 20/94, point 1) : la pension nationale, son
      taux compté sur toutes les périodes
    conventions: >-
      chacune selon son type (tableau des accords) ; une convention dont le calcul n'a
      pas été lu suit la règle générale de la circulaire n° 117/83 — ses périodes
      comptent pour le taux de la pension nationale
    parametres:
      reglements_europeens: calcul_separe
      annees_du_salaire_annuel_moyen: entieres
  exemples: aucun trouvé
- id: comparaison_1992
  statut: lue
  textes:
  - {id: "http://data.europa.eu/eli/reg/1992/1248/oj", article: "règlement (CEE) n° 1248/92 du 30 avril 1992, article 1er, qui remplace l'article 46 du règlement n° 1408/71 et insère son article 95 bis (JO CE L 136 du 19 mai 1992)",
     publie_le: 1992-05-19, en_vigueur: 1992-06-01}
  - {reference: "circulaire ministérielle du 13 juillet 1993 ; circulaire Cnav n° 20/94 du 31 janvier 1994", publie_le: 1994-01-31}
  - {id: "http://data.europa.eu/eli/reg/1998/1606/oj", article: "règlement (CE) n° 1606/98 du 29 juin 1998 (JO CE L 209 du 25 juillet 1998)", en_vigueur: 1998-10-25}
  nee_de: "http://data.europa.eu/eli/reg/1992/1248/oj"
  bornes:
    liquidation.date_effet: [1992-06-01, 2004-01-01]
  contenu:
    droit: >-
      l'institution calcule « d'une part, en vertu des seules dispositions de la
      législation qu'elle applique » — la pension nationale, sur les périodes
      françaises —, « d'autre part » le « montant théorique de la prestation à laquelle
      l'intéressé pourrait prétendre si toutes les périodes d'assurance [...] avaient
      été accomplies dans l'État membre en cause », établi ensuite « au prorata de la
      durée des périodes d'assurance [...] accomplies [...] sous la législation qu'elle
      applique, par rapport à la durée totale », et l'intéressé « a droit [...] au
      montant le plus élevé » (article 46 du règlement n° 1408/71, rédaction de 1992)
    pension_theorique: >-
      le salaire annuel moyen des seuls salaires français ; le taux et la durée comptés
      sur toutes les périodes, sans superposition, la durée ramenée à la durée maximum
      du régime général ; « la retraite proratisée est égale à : retraite théorique x
      (durée d'assurance au régime général ÷ durée d'assurance de la retraite globale).
      Ces durées sont limitées à la durée d'assurance maximum retenue au régime général
      » (exposé « Montant de la retraite communautaire »)
    comparaison: >-
      « La retraite la plus élevée est attribuée. En cas d'égalité la retraite
      proratisée est servie » ; « La comparaison au minimum et au maximum s'effectue
      avant comparaison avec la retraite nationale » (même exposé)
    fonctionnaires: >-
      les régimes spéciaux des fonctionnaires entrent dans la coordination le 25
      octobre 1998 (règlement n° 1606/98) : leur pension se compare de même, la décote
      lue sur la durée tous régimes, périodes étrangères comprises, le prorata sur les
      services
    conventions: chacune selon son type (tableau des accords)
    parametres:
      reglements_europeens: comparaison
      prorata_reglements_europeens: limite
      annees_du_salaire_annuel_moyen: entieres
      fonctionnaires_depuis: 1998-10-25
  exemples: aucun trouvé
- id: salaire_moyen_reduit_2004
  statut: lue
  textes:
  - {id: LEGIARTI000006747869, article: "R. 173-4-3 CSS", en_vigueur: 2004-02-15}
  - {id: LEGIARTI000006747870, article: "R. 173-4-3 CSS", en_vigueur: 2006-01-28}
  - {reference: "circulaire Cnav n° 2004/29 du 30 juin 2004, point 2 ; circulaire ministérielle DSS/3A/DACI/2008/219 du 3 juillet 2008 ; circulaire Cnav n° 2008/58 du 20 octobre 2008, points 1 à 8",
     publie_le: 2008-10-20}
  - {reference: "circulaire Cnav n° 2012/26 du 14 mars 2012, annexe, qui se substitue au tableau des circulaires n° 2008/58 et 2010/30 ; circulaire Cnav n° 2013/56 du 19 décembre 2013 (la Croatie)",
     publie_le: 2012-03-14}
  nee_de: LEGIARTI000006747869
  bornes:
    liquidation.date_effet: [2004-01-01, 2010-05-01]
  contenu:
    droit: la version comparaison_1992
    salaire_annuel_moyen: >-
      pour les pensions prenant effet après le 31 décembre 2003, le nombre d'années du
      salaire annuel moyen d'un polypensionné des régimes alignés se réduit au prorata
      de la durée de chaque régime (R. 173-4-3) ; la circulaire ministérielle du 3
      juillet 2008 l'applique à la pension théorique des travailleurs migrants : «
      Nombre d'années retenues x (Durée d'assurance au régime général non limitée ÷
      Durée d'assurance tous régimes) », arrondi au plus proche, au moins un, quand
      l'assuré a été affilié à des régimes étrangers « équivalant au régime général » —
      « dont le mode de calcul est basé sur des salaires, revenus et cotisations et une
      durée d'assurance d'au moins 15 ans » (exposé « Montant de la retraite
      communautaire », circulaires n° 2012/26 et 2013/56)
    regimes_equivalents: >-
      « Prorata = durée d'assurance au régime général ÷ durée totale des régimes
      retenus » : les régimes alignés, et les régimes étrangers que le tableau de la
      circulaire n° 2012/26 tient pour équivalents, activité par activité — salariés et
      non-salariés en Allemagne, en Autriche, en Belgique, à Chypre, en Espagne, en
      Estonie, au Liechtenstein, au Luxembourg, en Pologne, au Portugal, en République
      tchèque, en Roumanie, en Slovaquie, en Slovénie, en Suède, en Suisse et en
      Italie, son « nouveau système » pour les pensions « prenant effet à compter du
      1er janvier 2011 », ses périodes « accomplies après le 1er janvier 1996 »
      (circulaire de 2008) ; les seuls salariés en Hongrie ; la Croatie pour les
      pensions « prenant effet à compter du 1er juillet 2013 » (circulaire n° 2013/56).
      Les périodes des régimes de fonctionnaires sont « à exclure » ; « la
      totalisation des périodes accomplies dans les régimes d'assurance vieillesse
      retenus s'effectue en application des dispositions prévues par les règlements
      communautaires (totalisation sans superposition [...]) » (circulaire n° 2008/58,
      point 7). Le tableau des accords porte la liste (``salaire_moyen``)
    parametres:
      reglements_europeens: comparaison
      prorata_reglements_europeens: limite
      annees_du_salaire_annuel_moyen: reduites_au_prorata
      fonctionnaires_depuis: 1998-10-25
  exemples: [dss_2008_219_dix_meilleures_annees]
- id: reglement_883_2004
  statut: lue
  textes:
  - {id: "http://data.europa.eu/eli/reg/2004/883/oj", article: "règlement (CE) n° 883/2004 du 29 avril 2004, articles 52, 56 et 60, et annexe VIII, partie 2, France (version consolidée CELEX 02004R0883-20190731)",
     publie_le: 2004-04-30, en_vigueur: 2010-05-01}
  - {id: "http://data.europa.eu/eli/reg/2009/987/oj", article: "règlement (CE) n° 987/2009 du 16 septembre 2009, article 43 (version consolidée CELEX 02009R0987-20180101)",
     en_vigueur: 2010-05-01}
  - {reference: "circulaire Cnav n° 2010/54 du 21 mai 2010, note technique n° 2", publie_le: 2010-05-21}
  - {id: LEGIARTI000022287439, article: "R. 173-4-3 CSS", en_vigueur: 2010-05-08}
  - {id: LEGIARTI000038790394, article: "R. 173-4-3 CSS", en_vigueur: 2019-07-08}
  nee_de: "http://data.europa.eu/eli/reg/2004/883/oj"
  bornes:
    liquidation.date_effet: [2010-05-01, 2022-07-01]
  contenu:
    droit: >-
      la version salaire_moyen_reduit_2004 sous l'article 52 : « a) en vertu de la
      législation qu'elle applique, uniquement lorsque les conditions requises pour le
      droit aux prestations sont remplies en vertu du seul droit national (prestation
      indépendante) ; b) en calculant un montant théorique et ensuite un montant
      effectif (prestation au prorata) » ; « L'intéressé a droit [...] aux montants les
      plus élevés ». « Si la durée totale des périodes [...] est supérieure à la période
      maximale exigée [...] pour le bénéfice d'une prestation complète, l'institution
      compétente [...] prend en compte cette période maximale au lieu de la durée
      totale » (article 56, 1, a)
    regimes_en_points: >-
      « Les régimes de base ou les régimes complémentaires dans lesquels les prestations
      de vieillesse sont calculées sur la base de points de retraite » ne proratisent
      pas : l'intéressé « a droit à la prestation calculée conformément à la
      législation » (article 52, paragraphe 5, et annexe VIII, partie 2, France)
    fonctionnaires: >-
      les articles 6 et 52 à 59 « s'appliquent mutadis mutandis aux personnes couvertes
      par un régime spécial destiné aux fonctionnaires » ; le traitement de référence
      est celui des seules périodes françaises (article 60)
    parametres:
      reglements_europeens: comparaison
      prorata_reglements_europeens: limite
      annees_du_salaire_annuel_moyen: reduites_au_prorata
      fonctionnaires_depuis: 1998-10-25
      regimes_en_points: pension_nationale
  exemples: aucun trouvé
- id: salaire_moyen_lura_2022
  statut: lue
  textes:
  - {id: LEGIARTI000034595887, article: "R. 173-4-4-1 CSS", en_vigueur: 2017-07-01}
  - {id: LEGIARTI000053335493, article: "R. 173-4-4-1 CSS", en_vigueur: 2026-01-01}
  - {reference: "circulaire Cnav n° 2021/33 du 24 novembre 2021, « Revenu annuel moyen de base – pension communautaire »",
     publie_le: 2021-11-24}
  bornes:
    liquidation.date_effet: [2022-07-01, null]
  contenu:
    droit: la version reglement_883_2004
    salaire_annuel_moyen: >-
      « S'agissant des assurés nés à partir de 1953 et des pensions liquidées à compter
      du 1er juillet 2017 dans le cadre des règlements communautaires, le nombre
      d'années à retenir pour la détermination du revenu annuel moyen de la pension
      globale théorique doit être fait dans les mêmes conditions que le revenu annuel
      moyen de la pension nationale, sans avoir recours à une réduction au prorata » ;
      « les instructions énoncées dans la présente circulaire s'appliqueront aux
      dossiers relevant des règlements communautaires dont la liquidation initiale
      prend effet au 1er juillet 2022 » (circulaire n° 2021/33, points 3 et 6). « Par
      dérogation, s'agissant des situations pour lesquelles la liquidation unique ne
      peut pas être mise en œuvre, la détermination du revenu annuel moyen de la
      pension globale théorique [...] continue à être effectuée selon les modalités
      énoncées par la circulaire 2008-58 » (point 4) : les générations d'avant 1953
      gardent la réduction
    parametres:
      reglements_europeens: comparaison
      prorata_reglements_europeens: limite
      annees_du_salaire_annuel_moyen: entieres_sous_la_liquidation_unique
      fonctionnaires_depuis: 1998-10-25
      regimes_en_points: pension_nationale
  exemples: [cleiss_lena_reglements_europeens, cleiss_jahan_inde, cleiss_lena_canada_uruguay,
    cleiss_lena_espagne_tunisie, cnav_2021_33_vingt_cinq_meilleures_annees]
approximations:
- ecart: >-
    les années du salaire annuel moyen se réduisent au prorata des régimes étrangers
    équivalents selon le tableau de la circulaire n° 2012/26 pour toute pension prenant
    effet depuis 2004, quand celui de la circulaire n° 2008/58 a servi d'octobre 2008 à
    mars 2012 — il comptait l'Irlande, la Norvège et la pension additionnelle
    britannique de 1978 à 2002, et ni la Hongrie ni l'Italie — et que la caisse ne
    réduisait les pensions d'avant octobre 2008 que sur une demande de révision
  effet: >-
    la pension proratisée d'avant mars 2012 d'un assuré passé par l'Irlande, la Norvège
    ou le Royaume-Uni : plus faible, son salaire moyen pris sur plus d'années ; par la
    Hongrie : plus élevée ; non mesuré
- ecart: >-
    une période étrangère est présumée accomplie au régime des salariés ou des
    non-salariés de son État, jamais à celui de ses fonctionnaires, que le tableau de la
    circulaire n° 2012/26 exclut presque partout ; l'Italie compte toutes ses périodes
    depuis 1996, comme la circulaire de 2008 l'écrit, sans distinguer l'assuré que son «
    nouveau système » ne couvrait pas encore
  effet: >-
    le salaire annuel moyen de la pension proratisée d'un ancien fonctionnaire d'un autre
    État, ou d'un assuré italien de longue date : pris sur moins d'années que le droit
    n'en retient, plus élevé ; non mesuré
- ecart: >-
    seuls les régimes qui portent le minimum contributif comparent leurs deux pensions :
    la pension nationale d'un autre régime, son taux lu sur moins de trimestres, ne
    l'emporterait que par son minimum. Celle des fonctionnaires ne se compare pas : le
    règlement vaut pour leurs régimes — la France n'est pas à l'annexe VIII, partie 1, qui
    renonce au calcul au prorata —, les périodes européennes entrent dans la durée
    d'assurance de L. 14-I (bulletin officiel du Service des pensions n° 473), et le
    modèle porte la pension qu'elles ouvrent au minimum garanti de ses seuls services,
    sans le proratiser, ses conditions lues avec elles ; la pension nationale, portée au
    même minimum sans elles, ne la dépasse jamais. La règle du Service des retraites de
    l'État et de la CNRACL pour le minimum garanti d'une pension au prorata n'a pas été
    trouvée
  effet: >-
    le fonctionnaire qui n'ouvre le minimum garanti que par ses périodes européennes : un
    minimum entier, là où la caisse le proratiserait peut-être comme la Cnav le sien ;
    non mesuré
- ecart: >-
    la pension nationale se liquide au même départ que la proratisée, l'âge d'ouverture
    et la carrière longue lus avec les périodes étrangères, quand le règlement ne la
    calcule que si le droit national seul l'ouvre
  effet: >-
    une pension nationale servie à qui ne l'aurait pas, s'il part tôt par ses périodes
    étrangères et que son minimum la porte au-dessus de la proratisée ; non mesuré
- ecart: >-
    le prorata se limite à la durée maximum pour toute convention qui compare, celle dont
    l'exposé ne dit pas le prorata comprise ; une convention à option sert la plus élevée
    des deux pensions, comme si l'assuré choisissait toujours au mieux
  effet: >-
    la pension proratisée d'une convention qui retient la durée totale, à qui la dépasse :
    plus élevée ; non mesuré
sources:
  lu_le: 2026-10-01
  prochaine_relecture: 2027-04-30
  a_relire:
  - >-
    Ouverte le 1er octobre 2026 avec le domaine des carrières hors de France, à la
    demande du propriétaire. Le moteur compare les deux pensions depuis la troisième
    étape du domaine, dans les régimes qui portent le minimum contributif.
  - >-
    La réduction des années du salaire annuel moyen de la pension théorique des
    travailleurs migrants est lue et modélisée : circulaires n° 2008/58 et son annexe,
    2012/26 et 2013/56, que la base de la Cnav rend par sa recherche. À lire : la
    circulaire n° 2010/30, qui modifiait le tableau de 2008, pour dater ce qui a changé
    avant 2012 ; les conventions dont le tableau des accords ne lit pas le prorata ; le
    minimum garanti d'une pension au prorata, chez le Service des retraites de l'État et
    à la CNRACL, que ni leurs bulletins ni leurs pages publiques ne disent — l'annexe
    VIII du règlement et le bulletin n° 473 sont lus ; la surcote de la pension
    proratisée, calculée « éventuellement à la date d'attribution définitive » quand les
    pensions des États se succèdent (exposé « Attributions successives »). Et l'exemple franco-japonais du CLEISS, qui rapporte la
    part française à la durée des trois États (« prorata temporis de 100/170 »), quand
    l'accord avec le Japon n'en totalise que deux : le modèle proratise la pension
    théorique sur la durée des États que l'accord totalise, comme la convention et les
    exposés de la Cnav l'écrivent, et le témoin de cet exemple ne compare que ses
    trimestres.
  lectures:
