  - type: autre
    reference: >-
      règlements (CEE) n° 1408/71 (texte d'origine, CELEX 31971R1408) et n° 1248/92, (CE)
      n° 1606/98, 883/2004 — son annexe VIII, partie 1, où la France ne figure pas — et
      987/2009, lus au dépôt de l'Office des publications de l'Union ; accord de commerce
      et de coopération avec le Royaume-Uni, article SSC.47
    url: http://publications.europa.eu/resource/celex/31992R1248
    date: 2026-10-01
  - type: autre
    reference: >-
      bulletin officiel du Service des pensions n° 473, circulaire C-D11-06-4 : les
      périodes d'assurance d'une activité « exercée[s] dans un État membre de l'Union
