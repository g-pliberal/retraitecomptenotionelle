  - >-
    Le règlement d'avant le 1er avril 2007, que l'index LEGI ne porte pas : la version
    `avant_le_reglement_de_2007` suppose qu'il n'avait pas de surcote.
  - >-
    La surcote des parents de la rédaction du 1er janvier 2025, et les bonifications
    écartées de la durée depuis 2016 : à servir.
