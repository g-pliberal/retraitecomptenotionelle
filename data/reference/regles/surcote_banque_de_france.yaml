      (LEGIARTI000020085558), celui du 9 mai 2012 (LEGIARTI000025882187, repris jusqu'au
      31 décembre 2024 à l'espacement de « 1,25 % » près) et celui du 1er janvier 2025
      (LEGIARTI000047909725)
    date: 2026-11-19
