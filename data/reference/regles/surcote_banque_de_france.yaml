approximations:
- version: [sans_limite_de_trimestres]
  ecart: >-
    depuis le 1er janvier 2016, les bonifications de durée de services et les
    majorations de durée d'assurance, hors celles des enfants et du handicap, ne comptent
    pas dans la durée que la surcote lit : le modèle les y compte encore. Depuis le 1er
    janvier 2025, l'article 33 ouvre aux parents une surcote pour les trimestres cotisés
    l'année qui précède l'âge légal, quand celui-ci atteint soixante-trois ans : le
    modèle ne la sert pas à la Banque de France (`surcote_parentale`)
  effet: non mesuré
- version: [vingt_trimestres_au_plus, sans_limite_de_trimestres]
  ecart: >-
    la saisie ne dit pas la catégorie de l'agent : pour celui dont le droit s'ouvre à 55
    puis 57 ans, la surcote se compte quand même depuis l'âge de droit commun, comme le
    texte l'écrit jusqu'en 2012 (« soixante ans ») ; depuis, l'article 33 vise le seul
    troisième alinéa de l'article 26
  effet: non mesuré
effet: >-
  Le dépôt servait à tous les trimestres accomplis depuis l'âge d'ouverture le taux de
  l'année du départ : 0,75 % en 2008, 1,25 % depuis 2009, et rien d'avril à décembre
  2007. Un agent né en janvier 1945, sa durée acquise à soixante ans, parti à 63 ans en
  février 2008, était majoré de douze trimestres, 9 % : le règlement lui en compte
  trois, 2,25 %. Né en janvier 1947 et parti à 63 ans en février 2010, il était majoré de
  15 % : il l'est de 10,25 %, sept trimestres à 0,75 % et quatre à 1,25 %. Parti en
  novembre 2007, il n'avait rien : il a deux trimestres, 1,5 %. L'agent qui a soixante
  ans depuis 2009 ne voit rien changer.
