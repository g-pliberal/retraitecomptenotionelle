textes_sans_effet:
- id: LEGIARTI000053365517
  motif: >-
    D. 732-77 dans sa rédaction du 1er janvier 2026 (décret n° 2025-1410) : le numéro
    porte un autre article, le barème du versement pour la retraite — « En vue d'assurer
    la neutralité actuarielle du versement prévue à l'article L. 351-14-1 du code de la
    sécurité sociale [...], le montant du versement au titre des périodes antérieures à
    2016 à effectuer au titre de chaque trimestre est égal [...] » —, que le modèle ne
    connaît pas. La majoration des points de chef de 1952 à 1972, que l'article portait
    jusqu'au 1er janvier 2026, ne vaut plus pour les pensions
    prises depuis que par R. 732-67, qui la cite « dans [sa] rédaction antérieure au
    décret n° 2025-1409 »
- id: LEGIARTI000006581058
  motif: >-
    l'article 1123 du 31 décembre 1988 au 25 janvier 1990 ajoute seulement que « L'assiette
    des cotisations mentionnées au a et au b dues par les associés exploitants d'une
    exploitation agricole à responsabilité limitée » se répartit entre eux : les montants et
    leur assiette cadastrale ne changent pas
- id: LEGIARTI000006581062
  motif: >-
    l'article 1123 du 10 juillet 1999 au 22 juin 2000 ajoute au b la cotisation due « pour le
    conjoint collaborateur d'exploitation ou d'entreprise mentionné à l'article 1122-1-1 » :
    les taux du chef, que fixe le décret annuel, ne changent pas
- id: LEGIARTI000006585486
  motif: >-
    L. 731-42 du 22 juin 2000 au 1er janvier 2001 codifie l'article 1123 : les mêmes trois
    cotisations, dont la première « en pourcentage des revenus professionnels du chef
    d'exploitation ou d'entreprise », leurs taux restant ceux du décret annuel
- id: LEGIARTI000028393428
  motif: >-
    D. 731-124 dans la rédaction du décret n° 2013-1223 (1,64 %), jamais en vigueur : le
    décret n° 2013-1290 la remplace le même jour, le 1er janvier 2014, par celle qui fixe
    1,94 % (LEGIARTI000028435889)
