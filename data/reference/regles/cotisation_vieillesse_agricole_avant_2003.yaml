  bornes:
    revenu.annee: [1990-01-01, 1993-01-01]
  contenu:
    droit: >-
      le passage aux revenus professionnels, depuis la rédaction de l'article 1123 du 25
      janvier 1990. En 1990 et 1991, la cotisation du a reste un montant par tranche de
      revenu cadastral ou de rémunération ; celle du b se compose d'une part cadastrale
      (article 1125) et d'une part de 2,25 % en 1990, de 7,41 % en 1991, des revenus
      professionnels bornés au plafond ; depuis 1991, celle du c porte sur la totalité des
      revenus professionnels, 1,155 % en 1991, 1,28 % en 1992. En 1992, le b n'est plus
      que 8,105 % des revenus bornés au plafond (article 1125 : « Son taux est fixé par
      décret »), et le a ajoute à son montant par tranche un second élément de 1,23 % des
      revenus bornés au plafond. S'y ajoute la cotisation des dépenses complémentaires de
      l'assurance vieillesse, fixée par arrêté préfectoral autour d'un taux moyen : 0,67 %
      des revenus en 1990 ; 1,78 % de leur partie plafonnée et 0,16 % de leur totalité en
      1991 ; 2,17 % et 0,16 % en 1992
  exemples: aucun trouvé
