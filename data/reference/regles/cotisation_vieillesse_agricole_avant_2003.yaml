approximations:
- version: avant_1983
  ecart: >-
    le modèle prélève 8,5 % du revenu de l'année borné au plafond (4,25 % en 1952), dont
    le scénario 1 tire les points par le rendement de 6 % ; la cotisation de ces années,
    que la loi n° 52-799 et les textes de chaque année fixent, n'est pas lue
  effet: >-
    non mesuré : sans les montants de ces années, l'écart ne se chiffre pas. Il touche la
    pension proportionnelle du scénario 1, que chaque année de chef porte à 8,5 % × 6 % =
    0,51 % de son revenu borné au plafond, revalorisé, et le compte des scénarios 2 à 6
- version: montants_cadastraux_de_1983_a_1989
  ecart: >-
    les textes fixent un montant par tranche de revenu cadastral et une cotisation
    cadastrale, le modèle un taux de 8,5 % du revenu de l'année borné au plafond : il n'a
    pas le revenu cadastral
  effet: >-
    non mesuré : sans le revenu cadastral, que la saisie ne porte pas, ces montants ne se
    rapportent pas au revenu. Il touche, comme avant 1983, la pension proportionnelle du
    scénario 1 et le compte des scénarios 2 à 6
- version: assiette_mixte_de_1990_a_1992
  ecart: >-
    le modèle prélève 8,5 % du revenu borné au plafond, quand la cotisation a une part
    cadastrale en 1990 et 1991, une part sur la totalité du revenu depuis 1991 (le c), et
    une cotisation complémentaire que le modèle ne prélève pas
  effet: >-
    non mesuré. Au scénario 1, depuis 1990, les points viennent du barème de R. 732-71,
    que l'assiette fixe et non le taux : rien n'y bouge. L'écart ne touche que le compte
    des scénarios 2 à 6
- version: trois_taux_de_1993_a_2002
  ecart: >-
    le modèle prélève 8,5 % du revenu borné au plafond, près du seul taux du b (8,14 % à
    8,445 %) ; il omet le a (3,06 % à 3,2 %, borné au plafond), le c (1,26 % à 1,34 %, sur
    la totalité du revenu) et la cotisation complémentaire (2,30 % à 2,53 % de la partie
    plafonnée et 0,16 % à 0,25 % de la totalité, aux taux moyens)
  effet: >-
    non mesuré sur le coût. Posé à la main, pour un revenu sous le plafond en 1996 : le
    compte des scénarios 2 à 6 reçoit 8,5 % du revenu, quand les trois cotisations
    nationales en prélèvent 3,2 + 8,445 + 1,29 = 12,935 %, et 15,715 % avec la
    complémentaire au taux moyen (2,53 + 0,25) ; 8,5 / 12,935 = 66 % et 8,5 / 15,715 = 54
    % de ce qui est prélevé. Au scénario 1, les points de ces années viennent du barème de
    R. 732-71 et non du taux : rien n'y bouge
- version: depuis_2003
  ecart: >-
    LE TAUX DE 17,37 % N'A AUCUNE SOURCE (aucun texte, aucune page précise : le régime porte
    la source générale msa_parametres, la page d'accueil de la MSA, et ses notes ne le
    justifient pas). Le modèle prélève 17,37 % du revenu borné au
    plafond chaque année depuis 2003 (périodes de 2003 à 2025 de la fiche du régime), un
    taux qu'aucun texte lu ne fixe et qu'aucune somme des taux lus ne donne : pour un
    revenu sous le plafond, les trois cotisations nationales en prélèvent de 12,93 % (2003)
    à 17,11 % (2017 à 2025), et, la complémentaire comprise jusqu'en 2013, de 15,71 % à
    16,21 % (version depuis_2003). Écart au 17,37 %, en points de revenu : 4,44 en 2003,
    4,39 en 2004, 4,34 en 2005, 4,14 de 2006 à 2011, 4,06 en 2012, 3,89 en 2013, 0,76 en
    2014, 0,56 en 2015, 0,36 en 2016, 0,26 de 2017 à 2025 ; la complémentaire au taux
    moyen comprise, 1,66 en 2003, 1,61 en 2004, 1,56 en 2005, 1,36 de 2006 à 2011, 1,33
    en 2012, 1,16 en 2013. Au-dessus du plafond, le modèle ne prélève rien, quand le 3° (et
    la complémentaire, 0,25 % puis 0,23 %, jusqu'en 2013) porte sur la totalité du revenu.
    Seule la somme 3,32 + 11,55 + 2,50 tombe sur 17,37, où 2,50 % est la complémentaire
    de 2012 et 2013 (D. 731-125), que les 11,55 % de D. 731-122 comprennent depuis 2014
    (9,05 + 2,50) : elle la compterait deux fois, une coïncidence possible, pas une source
  effet: >-
    non mesuré sur le coût. Sous le plafond, le compte des scénarios 2 à 6 reçoit de 0,26
    à 4,44 points de revenu de plus que les trois cotisations nationales n'en prélèvent :
    17,37 / 12,93 = 1,343 fois en 2003, 17,37 / 17,11 = 1,015 fois de 2017 à 2025. Au
    scénario 1, les points de ces années viennent du barème de R. 732-71, que le taux ne
    touche pas : rien n'y bouge. Le 17,37 % court aussi après 2025 : les périodes de 2026 à
    2027 et de 2028 sans fin du régime le portent encore ; leurs notes disent, depuis le 6
    novembre 2026, ce que les textes en disent. Lu le 6 novembre 2026 : L. 731-42, récrit
    par la loi n° 2025-199, article 3, I, 8° (LEGIARTI000051284150), pour les « cotisations
    dues au titre des périodes courant à compter du 1er janvier 2026 » (même article, III),
    ne porte plus, pour le chef, qu'« une cotisation calculée pour partie sur l'assiette
    [...] retenue dans la limite du plafond [...], et pour partie sur la totalité de cette
    assiette », dont « Les taux applicables à chacune de ces deux parties sont identiques à
    ceux déterminés en application de l'article L. 633-1 du même code » ; D. 731-121 depuis
    le 1er janvier 2026 (LEGIARTI000053296666, décret n° 2025-1417 du 30 décembre 2025,
    article 4, 3°) dit que « les taux applicables à la cotisation prévue au 1° de l'article
    L. 731-42 sont égaux à ceux fixés respectivement au I de l'article D. 633-3 du code de
    la sécurité sociale pour la part calculée sur l'assiette retenue dans la limite du
    plafond [...] et au II du même article pour la part calculée sur la totalité de
    l'assiette », et D. 633-3, depuis le 7 juillet 2024 (LEGIARTI000049904636), fixe
    « 17,15 % » au I et « 0,72 % » au II ; le même décret, article 5, II, fixe « pour les
    périodes courant du 1er janvier 2026 au 31 décembre 2028 » la part sous le plafond du
    chef « exerçant leur activité à titre secondaire » et des personnes du 2° (aide
    familial, collaborateur) « exerçant à titre principal ou exclusif » à « 14,15 % »,
    « 15,15 % » et « 16,15 % », et celle des personnes du 2° « exerçant leur activité à
    titre secondaire » à « 12,33 % », « 13,83 % » et « 16,15 % ». Aucun de ces taux, ni sa
    somme avec les 0,72 % (17,87 % pour le chef à titre principal), n'est 17,37 % : le
    17,37 % n'est le taux d'aucune cotisation de 2026 et après. Il ne déplace aucun
    résultat mesuré : depuis 2026, le compte des scénarios 2 à 6 reçoit le taux du régime
    unifié, et, porté à 27,37 % aux deux périodes, il ne change ni la pension du scénario 1
    ni le compte de deux exploitants partis en 2026 et en 2030 (note
    2026-11-06-notes-de-msa-non-salaries.md de l'action 131)
sources:
  lu_le: 2026-11-12
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    QUESTION AU PROPRIÉTAIRE (3 novembre 2026). Le taux de 8,5 % qu'emploie le modèle de
    1953 à 2002 (et sa moitié en 1952) n'est écrit dans aucun texte lu. De 1993 à 2002,
    les décrets annuels fixent trois taux et une cotisation complémentaire (versions) ; de
    1983 à 1992, des montants en revenu cadastral, puis une assiette mixte ; avant 1983,
    les textes ne sont pas à l'index. Faut-il porter au compte, de 1993 à 2002, la somme
    des taux lus, et lesquels : le a et le b, bornés au plafond, le c, sur la totalité du
    revenu, que le modèle ne sait pas encore prélever d'un seul taux, la complémentaire,
    fixée par département autour d'un taux moyen ? Et quelle convention garder avant 1993,
    sans le revenu cadastral ? À noter : le décret n° 2003-1033 fixe pour 2003 les mêmes
    taux qu'en 2002 (3,2 %, LEGIARTI000006781102 ; 8,44 %, LEGIARTI000006781103 ; 1,29 %,
    LEGIARTI000006781106 ; complémentaire à 2,53 % et 0,25 %, LEGIARTI000006781107), quand
    le modèle passe de 8,5 % en 2002 à 17,37 % en 2003 (période de 2003 de la fiche du
    régime), un taux que cette lecture ne retrouve pas.
  - >-
    QUESTION AU PROPRIÉTAIRE (relecture R-K-bis, 3 novembre 2026 ; lu ici le même jour).
    Le taux de 17,37 % que le modèle porte au compte de 2003 à 2025 n'est écrit dans aucun
    texte lu, et aucune somme des taux de D. 731-121, D. 731-122 et D. 731-124 ne le donne
    : de 12,93 % en 2003 à 17,11 % de 2017 à 2025, de 15,71 % à 16,21 % avec la
    complémentaire jusqu'en 2013 (version depuis_2003, approximation depuis_2003). Il
    naît, avec les 8,5 % d'avant, le 8 septembre 2026 (commit bdaecdbc), sans texte qui le
    fixe ni note qui le justifie : le régime msa_non_salaries portait déjà la source
    msa_parametres (« Paramètres des régimes agricoles (RCO, points, AVA) », la page
    d'accueil de la MSA, fiabilité « moyenne ») et, à sa période de 2003, une note qui dit
    seulement que « le taux de 17,37 % qui figure ici n'a jamais compris les 4 % de la RCO ».
    Faut-il porter au compte, année par année, la somme des taux lus, et comment prélever
    le 3°, sur la totalité du revenu, que le modèle ne sait pas prélever d'un seul taux
    borné au plafond ?
  - >-
    À lire au fac-similé du Journal officiel : la loi n° 52-799 du 10 juillet 1952,
    articles 19 à 21 (Journal officiel du 11 juillet 1952), l'arrêté du 23 juillet 1953 «
    TAUX DES COTISATIONS », et les décrets ou arrêtés de financement de 1953 à 1982, que
    l'index n'a qu'en notice. Le montant de la cotisation cadastrale de 1983 à 1991
    (article 1125) : les budgets annexes des prestations sociales agricoles de ces années,
    dans les lois de finances.
  lectures:
  - type: legifrance
    reference: >-
      code rural (ancien), articles 1123 (rédactions du 5 juillet 1980 au 22 juin 2000),
      1125 (du 25 janvier 1990 au 22 juin 2000) et 1121-1 (du 5 juillet 1980 au 22 juin
