schema_version: 1
id: cotisation_vieillesse_agricole_avant_2003
intitule: >-
  Avant 2003, la cotisation vieillesse des non-salariés agricoles est celle que fixent les
  textes de chaque année : jusqu'en 1989, des montants assis sur le revenu cadastral ; de
  1990 à 1992, une part cadastrale et une part des revenus professionnels ; de 1993 à
  2002, trois taux sur ces revenus (article 1123 du code rural, puis L. 731-42), avec une
  cotisation complémentaire que fixe chaque département.
domaine: cotisations
regimes: [msa_non_salaries]
etape: acquerir_les_droits
face: cotisation
etat: approchee
lit:
- >-
  l'année de la ligne de carrière, qui est l'exercice au titre duquel la cotisation est
  due
- >-
  le revenu de l'année, borné au plafond, et le taux de la période de la fiche du régime
  (regimes/msa_non_salaries.yaml, taux_cotisation_retraite) : 8,5 % de 1953 à 2002, 4,25 %
  en 1952 (fiche cotisation_agricole_de_1952), 17,37 % depuis 2003
ecrit:
- >-
  la cotisation de l'année au régime des non-salariés agricoles, que le scénario 1 change
  en points par le rendement avant 1990, et que le compte des scénarios 2 à 6 reçoit
dates_qui_decident:
- revenu.annee
versions:
- id: avant_le_regime
  statut: supposee
  hypothese: >-
    le régime ne prélève rien avant 1952, l'année où il naît : aucun texte en vigueur
    avant 1952 ne le dit, puisqu'il n'existe pas
  fiabilite: >-
    haute, le décret n° 99-875, article 2, rédaction du 23 février 2001
    (LEGIARTI000006779656), dit « la date de création du régime d'assurance vieillesse des
    professions non salariées agricoles, à savoir le 1er juillet 1952 pour la métropole ou
    le 1er janvier 1964 pour les départements d'outre-mer »
  bornes:
    revenu.annee: [null, 1952-01-01]
  contenu:
    droit: >-
      aucune cotisation au régime, qui naît le 1er juillet 1952
  exemples: aucun trouvé
- id: avant_1983
  statut: supposee
  hypothese: >-
    la cotisation de l'année est, pour le modèle, 8,5 % du revenu de l'année borné au
    plafond, la moitié en 1952 : aucun texte lu ne fixe de taux sur le revenu de ces
    années
  fiabilite: >-
    basse : les textes qui fixent ces cotisations ne sont pas lus. La loi n° 52-799 du 10
    juillet 1952, dont les articles 19 à 21 les fixent, n'est à l'index du Journal
    officiel que par sa notice (JORFTEXT000000512405), comme l'arrêté du 23 juillet 1953 «
    TAUX DES COTISATIONS » (JORFTEXT000000435389) ; de 1952 à 1982, cet index n'a de ces
    textes que des notices, sans les montants (le décret n° 82-396 du 11 mai 1982,
    JORFTEXT000000519366, y est sans texte) ; l'index LEGI n'a l'article 1123 du code
    rural que depuis sa rédaction du 5 juillet 1980, et aucun des décrets annuels de
    financement avant le décret n° 83-664 du 21 juillet 1983
  textes:
  - id: LEGIARTI000006581056
    article: >-
      code rural (ancien), article 1123, rédaction du 5 juillet 1980
    en_vigueur: 1980-07-05
    citation: >-
      « 1° Par une double cotisation professionnelle : a) L'une à la charge de chaque
      membre non salarié âgé d'au moins dix-huit ans dépendant du régime, à l'exception
      des chefs d'exploitation définis à l'article 1121-1 et des titulaires soit d'une
      allocation, pension ou rente de vieillesse, soit d'une retraite, âgés d'au moins
      soixante-cinq ans ou de soixante ans en cas d'inaptitude au travail, et de leurs
      conjoints ; b) L'autre à la charge de chaque exploitation ou entreprise et dont le
      montant global est fixé chaque année dans le budget annexe des prestations sociales
      agricoles »
    lu_le: 2026-11-03
  bornes:
    revenu.annee: [1952-01-01, 1983-01-01]
  contenu:
    droit: >-
      la cotisation de l'année, que fixent la loi n° 52-799 et les textes de chaque année,
      non lus ; depuis le 5 juillet 1980, l'article 1123 en fait une « double cotisation
      professionnelle », l'une due par chaque membre non salarié d'au moins dix-huit ans,
      l'autre par chaque exploitation, « dont le montant global est fixé chaque année dans
      le budget annexe des prestations sociales agricoles » : aucun taux sur le revenu
      n'est lu
  exemples: aucun trouvé
