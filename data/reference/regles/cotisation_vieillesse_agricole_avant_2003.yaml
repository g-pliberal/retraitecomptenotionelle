  bornes:
    revenu.annee: [1993-01-01, 2003-01-01]
  contenu:
    droit: >-
      trois cotisations sur les revenus professionnels du chef d'exploitation. Celle du a
      de l'article 1123 (du 1° de L. 731-42 depuis 2000), bornée au plafond : 3,06 % en
      1993, 3,10 % en 1994 et 1995, 3,2 % de 1996 à 2002. Celle du b (du 2° de L. 731-42
      en 2000, du a du 2° depuis 2001), bornée au plafond : 8,140 % en 1993, 8,36 % en
      1994, 8,27 % en 1995, 8,445 % de 1996 à 1998, 8,44 % de 1999 à 2002. Celle du c (du
      3°), sur la totalité des revenus : 1,306 % en 1993, 1,34 % en 1994, 1,26 % en 1995,
      1,29 % de 1996 à 2002. S'y ajoute la cotisation des dépenses complémentaires de
      l'assurance vieillesse, fixée par arrêté préfectoral autour d'un taux moyen sur la
      partie plafonnée des revenus et d'un autre sur leur totalité : 2,30 % et 0,16 % en
      1993, 2,41 % et 0,16 % en 1994, 2,48 % et 0,24 % en 1995, 2,53 % et 0,25 % de 1996 à
      2002
  exemples: aucun trouvé
