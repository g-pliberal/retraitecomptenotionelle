historique:
- >-
  2026-11-03 — née avec l'action 131 (file K-bis), sur la relecture R-K : le taux de 8,5 %
  qu'emploie le modèle de 1953 à 2002 n'avait aucune source dans le dépôt ; les textes de
  chaque année sont lus, et ne le donnent pas. Le modèle n'est pas changé : la question
  est posée au propriétaire.
- >-
  2026-11-04 — action 131 (file K-ter), sur la relecture R-K-bis : le taux de 17,37 % du
  compte de 2003 à 2025 est déclaré sans source, avec, année par année, les taux de
  D. 731-121, D. 731-122, D. 731-124 et D. 731-125 lus à leurs rédactions et l'écart au
  17,37 % ; le décret n° 87-664 (1987) est cité ; 1993 l'est sous la rédaction de 1991 de
  l'article 1123, et la citation en double de celle de 1994 est ôtée. Aucun taux du
  modèle n'est changé.
- >-
  2026-11-05 — action 131 (file K-ter, relecture R-K-ter ; note
  2026-11-05-retouches-de-la-relecture-r-k-ter.md) : « sans source ni note » est resserré
  — le 17,37 % n'a aucun texte qui le fixe ni note qui le justifie, mais le régime portait
  la source msa_parametres ; le 17,37 % court aussi après 2025, avec D. 731-121 et D. 633-3
  lus. Aucun taux du modèle n'est changé.
- >-
  2026-11-06 — action 131 (file K-notes ; note 2026-11-06-notes-de-msa-non-salaries.md) :
  le décret n° 2025-1417 (articles 4 et 5) et L. 731-42 de 2026 lus ; le 17,37 % des
  périodes de 2026 et de 2028 n'est le taux d'aucune cotisation, et ne déplace aucun
  résultat mesuré ; les notes du régime le disent, et celles de 2003 à 2025 disent ce que
  « aucune source » veut dire. Aucun taux du modèle n'est changé.
effet: >-
  Les chefs d'exploitation et les membres de leur famille qui ont cotisé avant 2003. Au
  scénario 1, avant 1990, le rendement tire leurs points d'une cotisation que le modèle
  porte à 8,5 % du revenu borné au plafond, sans texte : non mesuré. Depuis 1990, le
  barème de R. 732-71 les tire de l'assiette : rien. Aux scénarios 2 à 6, le compte reçoit
  ces 8,5 %, quand les textes de 1993 à 2002 prélèvent 12,935 % du revenu sous le plafond
  en 1996 aux trois cotisations nationales, 15,715 % avec la complémentaire au taux moyen
  : effet sur le coût non mesuré. De 2003 à 2025, le compte reçoit 17,37 % du revenu
  borné au plafond, sans texte, de 0,26 à 4,44 points de plus que les trois cotisations
  nationales sous le plafond (approximation depuis_2003) : effet sur le coût non mesuré.
