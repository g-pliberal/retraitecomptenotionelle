  bornes:
    revenu.annee: [2003-01-01, null]
  contenu:
    droit: >-
      trois cotisations nationales sur les revenus professionnels du chef : celle du 1° de
      L. 731-42 et celle du a du 2°, bornées au plafond, celle du 3°, sur leur totalité.
      Leurs taux sont ceux du décret annuel en 2003 (n° 2003-1033) et en 2004 (n°
      2004-1064), puis de D. 731-121, D. 731-122 et D. 731-124, chacun « Pour l'année »
      qu'il nomme jusqu'en 2007, puis sans année depuis le 22 septembre 2008, puis par
      année depuis 2012 : en 2003, 3,2 %, 8,44 % et 1,29 % ; en 2004, 3,2 %, 8,44 % et,
      au 3°, la moitié de 1,29 % et la moitié de 1,39 %, soit 1,34 % ; en 2005, 3,2 %, 8,44
      % et 1,39 % ; de 2006 à 2011, 3,2 %, 8,64 % et 1,39 % ; en 2012, 3,21 % et 8,69 % «
      pour l'année 2012 » (rédactions du 4 juillet 2012, qui remplacent les 3,2 % et les
      8,67 % du début de l'année) et 1,41 % ; en 2013, 3,26 %, 8,81 % et 1,41 % ; en 2014,
      3,28 %, 11,39 % et 1,94 % ; en 2015, 3,30 %, 11,47 % et 2,04 % ; en 2016, 3,32 %,
      11,55 % et 2,14 % ; de 2017 à 2025, 3,32 %, 11,55 % et 2,24 %. S'y ajoute jusqu'en
      2013 la cotisation complémentaire (D. 731-125 depuis 2005) : de 2003 à 2011, autour
      d'un taux moyen de 2,53 % de la partie plafonnée et de 0,25 % de la totalité, fixée
      par arrêté préfectoral à plus ou moins 5 % de ces taux jusqu'à la rédaction du 15
      octobre 2009, à ces taux depuis ; 2,50 % et 0,23 % en 2012 et 2013. Depuis le 1er
      janvier 2014, le décret n° 2013-1223 la fond dans les autres, « le taux global des
      cotisations sociales dues n'étant pas modifié » : D. 731-122 y gagne 2,50 points à
      chaque année qu'il nomme (11,19 % pour 2012, 11,31 % pour 2013, 8,69 + 2,50 et 8,81 +
      2,50), D. 731-124 0,23 point (1,41 → 1,64 %), que le décret n° 2013-1290 porte à 1,94
      % le même jour ; l'index n'a plus de rédaction de D. 731-125. Sommes des trois taux,
      pour un revenu sous le plafond : 12,93 % en 2003, 12,98 % en 2004, 13,03 % en 2005,
      13,23 % de 2006 à 2011, 13,31 % en 2012, 13,48 % en 2013, 16,61 % en 2014, 16,81 %
      en 2015, 17,01 % en 2016, 17,11 % de 2017 à 2025 ; avec la complémentaire, à son
      taux moyen, 15,71 % en 2003, 15,76 % en 2004, 15,81 % en 2005, 16,01 % de 2006 à
      2011, 16,04 % en 2012 et 16,21 % en 2013. Les 2,36 % de la rédaction de D. 731-124
      du 7 juillet 2024 ne valent que depuis 2026 (décret n° 2024-688, article 6) ; depuis
      2026, D. 731-121 renvoie aux taux de D. 633-3 du code de la sécurité sociale, que
      cette fiche ne lit pas, et l'index n'a de D. 731-122 et D. 731-124 aucune rédaction
      depuis le 1er janvier 2026
