historique:
- >-
  2026-11-03 — née avec l'action 131 (file K-bis), sur la relecture R-K : le taux de 8,5 %
  qu'emploie le modèle de 1953 à 2002 n'avait aucune source dans le dépôt ; les textes de
  chaque année sont lus, et ne le donnent pas. Le modèle n'est pas changé : la question
  est posée au propriétaire.
effet: >-
  Les chefs d'exploitation et les membres de leur famille qui ont cotisé avant 2003. Au
  scénario 1, avant 1990, le rendement tire leurs points d'une cotisation que le modèle
  porte à 8,5 % du revenu borné au plafond, sans texte : non mesuré. Depuis 1990, le
  barème de R. 732-71 les tire de l'assiette : rien. Aux scénarios 2 à 6, le compte reçoit
  ces 8,5 %, quand les textes de 1993 à 2002 prélèvent 12,935 % du revenu sous le plafond
  en 1996 aux trois cotisations nationales, 15,715 % avec la complémentaire au taux moyen
  : effet sur le coût non mesuré.
