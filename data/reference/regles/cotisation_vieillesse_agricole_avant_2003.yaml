  contenu:
    droit: >-
      deux cotisations, aucune en taux du revenu professionnel. Celle du a de l'article
      1123, due pour chaque membre non salarié d'au moins dix-huit ans, est un montant en
      francs par tranche de revenu cadastral de l'exploitation, que fixe le décret de
      chaque année (de 340 F à 860 F en 1983, jusqu'à 2 010 F en 1989) ; ceux de 1987,
      que fixe l'article 10 du décret n° 87-612, le décret n° 87-664 les majore de 4 %
      (article 2). Celle du b, à la
      charge de l'exploitation, est la cotisation cadastrale de l'article 1125, dont
      l'article 1123 dit que « le montant global est fixé chaque année dans le budget
      annexe des prestations sociales agricoles » ; les décrets n'en fixent que le plafond
      du revenu cadastral qui lui sert d'assiette (23 359 F en 1983, 31 448 F en 1989), et
      aucun article de ces décrets, lus à l'index article par article, n'en donne le
      montant par franc de revenu cadastral
