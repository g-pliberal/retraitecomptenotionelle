schema_version: 1
id: surcote_fonction_publique
intitule: >-
  1,25 % par trimestre depuis 2009 sans plafond ; 0,75 % dans la limite de vingt
  trimestres pour ceux d'avant 2009 ; décompte depuis l'âge légal de droit commun
  pour le sédentaire, et pour l'emploi classé depuis l'âge anticipé majoré de cinq
  ans (actifs nés depuis le 1er septembre 1966) ou l'âge minoré majoré de dix (super-actifs
  nés depuis le 1er septembre 1971), soixante-deux ans avant ces générations ; trimestres
  de DURÉE depuis le jour où les conditions sont réunies, et non trimestres civils,
  chacun au taux de sa date d'achèvement.
etat: conforme
effet: >-
  Fonctionnaires liquidant après l'âge légal avec la durée. Jusqu'au 24 septembre
  2026, l'emploi classé attendait l'âge légal de SA génération : jusqu'à sept trimestres
  de surcote perdus pour un actif né de 1966 à 1973. Et le décompte suivait la règle
  du régime général — trimestres civils à compter de celui qui suit l'âge —, quand
  la fonction publique compte des durées : une fonctionnaire à l'âge légal à la
  mi-octobre 2024, partie en février 2026, avait quatre trimestres au lieu de cinq
  (tests/test_cnracl.py).
sources:
  lu_le: 2026-09-24
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    La version de 2009 de L. 14 III (plafond de vingt trimestres) n'a pas été lue
    sur Légifrance, seulement rapportée : la lire. Le modèle date au mois : la période
    s'ouvre au premier du mois qui suit l'âge, ce qui est exact pour qui n'est pas
    né le premier du mois — l'exemple 3 de la CNRACL, dont l'agent est né un 1er
    janvier, a un trimestre de plus. Les exemples de la CNRACL pour les générations
    1963 à 1966 datent d'avant la suspension de 2026 et ne sont pas transcrits.
