schema_version: 1
id: surcote_parentale
intitule: >-
  1,25 % par trimestre cotisé dans l'année qui précède l'âge légal et au-delà de
  la durée requise, quatre au plus, dès que l'âge légal atteint 63 ans, à qui détient
  un trimestre de majoration de durée d'assurance pour enfants ; ces trimestres entrent
  dans le coefficient de la surcote ordinaire, sur la pension d'avant la surcote.
etat: transcrite
etape: completer_tous_regimes
effet: >-
  Parents dont l'âge légal atteint 63 ans, générations 1965 nées après mars et suivantes.
  Jusqu'au 23 septembre 2026, le module faisait courir la fenêtre de 63 ans à l'âge
  légal, et demandait la durée requise à 63 ans : zéro trimestre à la génération
  1965 née après mars, un à 1966, deux à 1967, trois à 1968, là où le texte en ouvre
  quatre à chacune ; et rien du tout à qui atteignait la durée en cours de fenêtre,
  là où le texte paie les trimestres qui la dépassent. La fenêtre est datée au mois,
  les trimestres de chaque année répartis sur ses mois ; `test_la_surcote_parentale_ne_compte_que_les_trimestres_au_dela_de_la_duree`
  tient la règle. Jusqu'au 18 octobre 2026, le module appliquait la surcote parentale
  à la pension déjà surcotée, et relevée au minimum contributif : 1,025 × 1,05 pour
  deux trimestres de droit commun et quatre d'enfants, là où la CNRACL sert 1,075 ;
  5 % du minimum, là où D. 351-2-1 calcule la surcote sur la pension d'avant lui.
  Deux témoins de simulation sur 883 baissaient, de 0,06 % à 0,47 % ;
  `test_la_surcote_parentale_du_fonctionnaire_entre_dans_le_coefficient_de_l_article_l14`
  et `test_la_surcote_parentale_du_regime_general_est_la_surcote_ouverte_un_an_plus_tot`
  tiennent la règle. Jusqu'au 23 octobre 2026, le module servait la surcote parentale du
  fonctionnaire en sus du minimum garanti, et calculée sur lui, là où le service des
  retraites de l'État paie le plus favorable du minimum et de la pension normale, ses
  deux surcotes comprises : 1,05 fois le minimum, 925 euros par an de trop pour une
  agente de la CNRACL née en 1969, partie en 2033 à 30 % du salaire moyen ; et il
  majorait la pension surcotée des libéraux, 1,10 × 1,05 au lieu de 1,15. Aucun des
  889 témoins ne bougeait ;
  `test_le_minimum_garanti_se_compare_a_la_pension_qui_porte_les_deux_surcotes` et
  `test_la_surcote_parentale_du_liberal_entre_dans_le_coefficient_de_sa_surcote`
  tiennent la règle. Jusqu'au 28 octobre 2026, la pension complète d'une retraite
  progressive que la pension provisoire revalorisée relevait portait ensuite la surcote
  parentale, calculée sur le montant relevé, là où la caisse compare la provisoire à la
  pension complète surcote comprise et sert la plus élevée : posée 1 000 euros au-dessus
  de la pension de la mère de deux enfants née en 1969, partie à 64 ans, la provisoire
  lui faisait servir 5 % d'elle de trop, 1 412,83 euros par an. Aucun des 909 témoins ne
  bougeait, aucun n'ayant de plancher qui lie ;
  `test_le_plancher_se_compare_a_la_pension_qui_porte_la_surcote_parentale` tient la
  règle.
sources:
  lu_le: 2026-10-28
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Chercher la circulaire Cnav d'application de L. 351-1-2-1 et son exemple chiffré. Le
    23 octobre 2026, la base documentaire de la Cnav n'en avait aucune : sa recherche ne
    trouve « surcote parentale », « 351-1-2-1 » ni « surcote au titre des enfants » dans
    aucune référence ; son exposé « Surcote », modifié le 6 janvier 2026, n'en parle pas,
    ni les paragraphes « L'incidence sur la surcote » des circulaires 2023/19, 2024/25 et
    2026/7 ; la page « Être parent » de l'Assurance retraite et la fiche F19643 de
    service-public (vérifiée le 1er janvier 2026) n'ont pas d'exemple. Le régime général
    n'a ni circulaire ni exemple ; l'exemple de la CNRACL ne rejoue que la fenêtre du
    fonctionnaire.
  - >-
    LE TRIMESTRE D'ENFANT DATÉ. La CNRACL ne compte la surcote au titre des enfants que
    « sous réserve que l'assuré justifie à partir de cette date » d'un trimestre d'enfant
    (« Calcul de la surcote », exemple 3 : une majoration pour enfant handicapé acquise à
    62 ans et 6 mois, deux trimestres au lieu de quatre) ; le moteur ne date pas ce
    trimestre. Il n'en a pas besoin tant que tous les siens naissent avec l'enfant et vont
    à la mère : la majoration pour enfant handicapé (L. 351-4-1, L. 12 ter), seule à
    s'acquérir tard, n'est pas portée, ni l'adoption (fiche
    `majoration_duree_assurance_enfants`). La date jouera quand l'une ou l'autre le sera ;
    d'ici là, seule une naissance déclarée dans l'année qui précède l'âge légal de la
    mère, que la saisie accepte, s'en écarte.
  lectures:
  - type: legifrance
    reference: >-
      L. 14, IV et V, du code des pensions civiles et militaires, rédaction du 31
      décembre 2023 (LEGIARTI000048844775), lu dans l'index LEGI du dépôt le 14 octobre
      2026 ; L. 351-1-2-1 CSS, rédaction du 28 février 2025 (LEGIARTI000051289776)
    date: 2025-02-28
  - type: legifrance
    reference: >-
      L. 351-1-2-1 CSS, LEGIARTI000047449229, version du 1er septembre 2023 : la
      durée cotisée « accomplie l'année précédant l'âge mentionné à l'article L.
      161-17-2, lorsque celui-ci est égal ou supérieur à soixante-trois ans, et
      au delà de la limite mentionnée au deuxième alinéa de l'article L. 351-1 »
    date: 2026-09-23
  - type: legifrance
    reference: >-
      L. 351-1-2-1 CSS, LEGIARTI000051289776, version du 28 février 2025 : l'âge
      de la surcote, « sous réserve qu'il soit égal ou supérieur à soixante-trois
      ans, est abaissé d'un an »
    date: 2026-09-23
  - type: jorf
    reference: >-
      Loi n° 2023-1250 du 26 décembre 2023, article 92 (JORFARTI000048668789), lu dans
      l'index JORF du dépôt le 18 octobre 2026 : « L'article L. 14 du code des pensions
      civiles et militaires de retraite est complété par un V ainsi rédigé : « V.-La
      majoration mentionnée au III et celle mentionnée au IV ne peuvent pas être
      cumulées. » », sans autre disposition. Le V entre dans L. 14 le 28 décembre 2023
      (LEGIARTI000048697778) ; la rédaction du 1er septembre 2023 (LEGIARTI000047452815)
      ne l'avait pas. Le code de la sécurité sociale n'a pas de clause pareille.
    date: 2023-12-27
  - type: legifrance
    reference: >-
      D. 351-2-1 CSS, LEGIARTI000047961314, lu dans l'index LEGI du dépôt le 18 octobre
      2026 : « La majoration prévue à l'article L. 351-1-2 est calculée sur la base du
      montant de pension avant qu'il ne soit porté au montant minimum »
    date: 2023-09-01
  - type: autre
    reference: >-
      CNRACL, juris-cnracl, « Calcul de la surcote », publiée le 17 février 2025, lue le
      18 octobre 2026 : la dérogation (« une surcote à un âge anticipé (un an avant l'âge
      de surcote de droit commun) au titre de la naissance et/ou de l'éducation d'un
      enfant ») ; « Nota : La surcote de droit commun et la surcote au titre des enfants
      ne sont pas cumulables au titre d'une même période » ; l'exemple 1 de la surcote au
      titre des enfants, quatre trimestres d'enfants puis deux de droit commun,
      « Coefficient de majoration : (4 X 1.25%) + (2 X 1.25%) = 7.5 % », sur la formule
      « Montant de la pension X [1+(coefficient de majoration applicable X nombre de
      trimestres supplémentaires)] ». Ses exemples nés en 1964 et en 1966 datent d'avant
      la suspension de 2026 ; celui de 1969, l'exemple 2, se rejoue.
    date: 2025-02-17
    url: >-
      https://www.juris-cnracl.retraites.fr/pension-normale/duree-dassurance-decote-et-surcote/calcul-de-la-surcote-0
  - type: autre
    reference: >-
      Service des retraites de l'État, page « La surcote », section « La surcote
      spécifique famille », lue le 18 octobre 2026 : réservée depuis le 1er septembre
      2026 « aux personnes nées à partir du 1er avril 1965 », à qui a « un âge
      d'ouverture des droits (AOD) à partir de 63 ans pour les sédentaires » ; les
      trimestres de l'année qui précède « seront pris en compte dans le calcul de la
      surcote, dans la limite de quatre trimestres (soit 5 % max) ». Le moteur ne la sert
      pas aux emplois classés, dont l'âge d'ouverture est sous 63 ans.
    date: 2026-10-18
    url: >-
      https://retraitesdeletat.gouv.fr/actif/le-calcul-de-ma-retraite/la-surcote
  - type: autre
    reference: >-
      Service des retraites de l'État, page « Le minimum garanti », lue le 23 octobre
      2026 : « Le montant normal de votre pension est donc comparé à celui du minimum
      garanti. Dans tous les cas, c'est le montant le plus favorable qui vous est payé,
      sans que vous ayez besoin de le demander. » La pension normale porte les deux
      surcotes ; le minimum, quand il l'emporte, les efface l'une et l'autre. Les pages
      de la CNRACL sur le minimum garanti ne parlent pas de la surcote.
    date: 2026-10-23
    url: >-
      https://retraitesdeletat.gouv.fr/actif/le-calcul-de-ma-retraite/le-minimum-garanti
  - type: legifrance
    reference: >-
      L. 17 du code des pensions civiles et militaires, rédaction du 28 décembre 2023
      (LEGIARTI000048697797), lu dans l'index LEGI du dépôt le 23 octobre 2026 : « le
      montant de la pension ne peut être inférieur » au minimum, sans rien dire de la
      surcote, que L. 14, III, applique « au montant de la pension liquidée ».
    date: 2023-12-28
  - type: legifrance
    reference: >-
      L. 643-3, I, CSS, rédactions du 1er septembre 2023 (LEGIARTI000047453031) et du 31
      décembre 2025 (LEGIARTI000053280388, pensions prenant effet depuis le 1er septembre
      2026), lues dans l'index LEGI du dépôt le 23 octobre 2026 : la durée cotisée de
      l'année qui précède l'âge légal « ouvre droit à une majoration de pension dans les
      mêmes conditions que celles prévues à la première phrase du quatrième alinéa du
      présent I », la surcote ; R. 643-8 (LEGIARTI000047985850) la fixe à « 0,75 % par
      trimestre accompli avant le 1er septembre 2023 et à 1,25 % par trimestre accompli à
      compter de la même date ». Un seul coefficient, sur la pension d'avant la surcote.
    date: 2025-12-31
  - type: autre
    reference: >-
      Assurance retraite, page « Être parent », lue le 23 octobre 2026 : « Votre retraite
      est augmentée de 1,25 % par trimestre ouvrant droit à la surcote parentale, dans la
      limite de 4 trimestres », à qui est « né après le 1er avril 1965 », a « acquis au
      moins un trimestre pour enfant » et a validé « avant votre âge légal de départ » la
      durée du taux plein ; sans exemple chiffré.
    date: 2026-10-23
    url: >-
      https://www.lassuranceretraite.fr/portail-info/home/actif/vie-personnelle-retraite/parentalite-droits-retraite.html
  - type: legifrance
    reference: >-
      D. 161-2-24-7 CSS (LEGIARTI000047959215, depuis le 1er septembre 2023), lu dans
      l'index LEGI du dépôt le 28 octobre 2026 : la pension complète de la retraite
      progressive « est liquidée dans les conditions de droit commun. Toutefois, elle ne
      peut être inférieure au montant entier ayant servi de base au calcul de la fraction
      », revalorisé, comme le disait D. 351-15 depuis 2006 ; rien sur la surcote.
    date: 2023-09-01
  - type: circulaire_cnav
    reference: >-
      circulaire 2018/31 du 21 décembre 2018, la dernière sur la retraite progressive,
      8.2, lue le 28 octobre 2026 : « Pour déterminer le montant le plus élevé, il
      convient de comparer : le montant entier ayant servi de base au calcul de la
      fraction de retraite, revalorisé, soit : le montant calculé, éventuellement majoré
      du minimum ou ramené au maximum ; la majoration pour enfants (10 %) ; la surcote ;
      la majoration de retraite des assurés handicapés ; à la somme de ces éléments
      calculés à la date d'effet de la retraite définitive ». De même les circulaires
      2006/66 (92) et 2011/14 (62), qui y ajoutent la règle de chaque date. La surcote
      parentale, surcote de L. 351-1-2 ouverte un an plus tôt, entre dans la pension
      comparée au plancher, qui l'efface quand il l'emporte.
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2018_31_21122018.pdf
    date: 2018-12-21
  - type: circulaire_cnav
    reference: >-
      exposé « Retraite définitive » de la base de législation de la Cnav, modifié le 24
      octobre 2025, lu le 28 octobre 2026 : « Tous les éléments de la retraite sont
      recalculés au point de départ de la retraite définitive, et les droits de l'assuré
      sont réexaminés (y compris la surcote). La retraite définitive ne peut pas être
      inférieure à la retraite qui a servi de base au calcul de la fraction de retraite
      progressive » ; il cite toujours la circulaire 2018/31, 8.2.
    url: https://legislation.lassuranceretraite.fr/#/expose?file_leaf_ref=retraite_personnelle_retraite_progressive_retraite_definitive_ex.aspx
    date: 2025-10-24
