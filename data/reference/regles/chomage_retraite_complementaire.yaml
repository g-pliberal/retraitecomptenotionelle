effet: >-
  Une année de solidarité vaut, depuis 2019, un tiers de points de moins sur la tranche 1
  et les trois quarts de moins sur la tranche 2 qu'une année d'assurance ; à l'Agirc avant
  2019, la moitié ou le quart de moins. Au-delà de quatre plafonds de salaire, une année
  chômée ne vaut plus de points sur la tranche 2 au-dessus de quatre plafonds. Aucun des
  689 témoins d'avant le 3 octobre 2026 ne bouge ; cinq témoins nouveaux portent ces
  règles, et trois de plus la préretraite du FNE et le salarié agricole, que le modèle
  distingue depuis le même jour.
