  bornes:
    revenu.annee: [1967-10-01, 2019-01-01]
  contenu:
    assurance: >-
      les points d'une année travaillée sur le salaire journalier de référence de
      l'allocation, aux taux obligatoires de la période — le modèle prête à toute
      entreprise le taux minimal —, garantie minimale de points comprise de 1989 à 2018
    solidarite: >-
      depuis le 1er avril 1984, 8 % sur la tranche B de l'Agirc (12 % pour une entreprise
      née après 1981, `agirc_entreprises_nouvelles`), sans garantie minimale de points ;
      4 % à l'Arrco, pour les ruptures postérieures au 31 mai 2000 — les taux
      obligatoires avant —, le modèle prenant l'année pour la rupture (`points_depuis:
      2001`)
    preretraite_fne: >-
      les taux de la solidarité, assortis depuis 1989 de la garantie minimale de points à
      leur proportion — 8 % sur 16 % en valent la moitié — (`ValeursPoint.garantie`,
      `taux_contractuel`) ; un salaire de référence borné à deux plafonds depuis 1998, le
      modèle prenant l'année pour la date de la convention (`fne`)
    borne: quatre plafonds de la sécurité sociale (`plafond_salaire_reference`)
    ircantec: les points d'une année travaillée, depuis le 1er août 1977
    salaries_agricoles: >-
      rien avant le 1er avril 1974, les neuf derniers mois de 1974
      (`validation_depuis_affiliations`)
    duree_minimale: >-
      jusqu'en 1973, rien pour une période de moins de trente jours, que le modèle lit sur
      la part de l'année que la ligne couvre (`duree_minimale`)
  exemples: aucun trouvé
