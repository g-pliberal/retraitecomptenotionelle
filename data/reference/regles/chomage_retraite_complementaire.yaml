schema_version: 1
id: chomage_retraite_complementaire
intitule: >-
  Une période de chômage indemnisé vaut des points complémentaires, jour par jour, sur le
  salaire journalier de référence de l'allocation, borné à quatre plafonds : aux taux de
  calcul des points d'une année travaillée pour l'allocation d'assurance, que l'Unédic
  finance ; à 4 % depuis 2019 — 4 % à l'Arrco, 8 % ou 12 % sur la tranche B de l'Agirc
  avant — pour l'allocation de solidarité et la préretraite du FNE, que l'État finance,
  celle-ci garantie minimale comprise et sur deux plafonds ; rien avant le 1er octobre
  1967, ni avant le 1er août 1977 à l'Ircantec, ni avant le 1er avril 1974 pour un salarié
  agricole.
domaine: points
regimes: [arrco, arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles, agirc,
  agirc_entreprises_nouvelles, agirc_arrco, ircantec]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- >-
  le motif de l'année non travaillée : chômage d'assurance (`chomage_indemnise`), de
  solidarité (`chomage_solidarite`) ou préretraite du FNE (`preretraite_fne`)
- le statut de l'année, pour le salarié agricole, et la part de l'année qu'elle couvre
- le salaire d'avant l'interruption, qui tient lieu de salaire journalier de référence, et
  le plafond de la sécurité sociale de l'année
- les taux de calcul des points de la période, le prix d'achat et le taux d'appel du point
- legislation/chomage_complementaires.yaml (borne, premiers jours validés, durée
  minimale, taux de la solidarité, préretraite du FNE)
ecrit:
- les points complémentaires de l'année chômée, garantie minimale de points comprise de
  1989 à 2018
dates_qui_decident:
- revenu.annee
