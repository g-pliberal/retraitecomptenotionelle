approximations:
- version: [assurance_et_solidarite_jusqu_en_2018, regime_unifie_depuis_2019]
  ecart: >-
    Le salaire d'avant l'interruption tient lieu de salaire journalier de référence, et
    l'année entière de jours indemnisés : le modèle ne connaît ni le calcul du salaire de
    référence sur vingt-quatre mois depuis 2021, ni les jours de différé et le délai
    d'attente, qui valident des trimestres (R. 351-12, 4°, e) mais « ne permettent pas
    l'acquisition de points de retraite complémentaire » (Unédic, fiche « Trimestres et
    points de retraite », 4 juillet 2025).
  effet: non mesuré
- version: assurance_et_solidarite_jusqu_en_2018
  ecart: >-
    Le modèle prête à toute entreprise le taux minimal, quand l'Arrco suit le taux d'une
    entreprise qui cotisait au-dessus, dans la limite de 6 % sur T1 et 16 % sur T2 pour une
    rupture postérieure au 30 juin 1996, et l'Agirc « le système contractuel de
    cotisations en vigueur dans l'entreprise » ; avant 1997, le guide renvoie aux « règles
    antérieures » et aux automates de calcul de la PRC, « par référence à une période
    d'activité de rattachement » : le salaire d'avant l'interruption en tient lieu.
  effet: non mesuré
- version: assurance_et_solidarite_jusqu_en_2018
  ecart: >-
    L'Arrco valide aux taux obligatoires la solidarité qui suit une rupture d'avant le 1er
    juin 2000 : le modèle, qui ne connaît pas la date de la rupture, prend l'année de
    l'allocation, et sert 4 % dès 2001. Il ne connaît pas non plus la date de la
    convention de l'allocation spéciale du FNE, et borne à deux plafonds dès 1998 le
    salaire de celles conclues depuis le 5 mai 1997. Le premier jour propre aux
    départements d'outre-mer (1er mars ou 1er septembre 1980) n'est pas porté : un
    salarié du régime général n'y dit pas où il travaille. La durée minimale de trente
    jours des périodes de 1967 à 1973 se lit sur la ligne, qui compte en mois : elle ne
    mord sur aucune saisie (guide, VII.3.1.3.1).
  effet: non mesuré
- version: [assurance_et_solidarite_jusqu_en_2018, regime_unifie_depuis_2019]
  ecart: >-
    Une seule allocation de solidarité pour l'allocation de solidarité spécifique et
    l'allocation équivalent retraite ; la
    préretraite progressive, qui se calcule sur la différence entre le salaire à temps
    plein et le salaire réel, et l'activité partielle, qui vaut des points sans
    cotisations au-delà de soixante heures (accord de 2017, art. 63 et 67), ne sont pas
    saisies. L'Ircantec sert à la solidarité les points de l'assurance ; sans
    cotisations — un employeur public en auto-assurance —, elle donne en droit des points
    gratuits sur le SMIC, après trois mois de carence, un an au plus (art. 11 ter, II).
    La CNBF, la CRPN et la caisse monégasque valident aussi le chômage par convention
    avec l'Unédic ; le modèle ne l'admet qu'aux régimes de la famille
    `complementaire_prive`. La durée de l'allocation d'assurance — 730 jours, 1 095 à
    cinquante ans ou plus, au règlement de 2009, art. 11, § 1er — n'est bornée que par la
    fin de l'indemnisation au taux plein (fiche `fin_indemnisation_chomage`) : la saisie
    dit ce qui a été versé.
  effet: non mesuré
sources:
