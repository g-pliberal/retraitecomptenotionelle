      produit du montant de la cotisation d'ajustement et des deux tiers du nombre de
      points acquis au titre de la cotisation forfaitaire » et le forfait (article 3) ;
      3 % pour l'assuré en cumul emploi-retraite (L. 643-6) et celui de L. 642-4-2
      (D. 645-2)
    valeur_de_service: >-
