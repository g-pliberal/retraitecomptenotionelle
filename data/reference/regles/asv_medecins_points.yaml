approximations:
- version: [trente_points_seize, vingt_sept_points, forfait_et_ajustement, ajustement_a_quatre_pour_cent]
  ecart: >-
    La fiche de régime ne porte que la part du médecin — un tiers du forfait, la moitié
    de 1993 à 1994 — ; la part des caisses d'assurance maladie est décrite, non comptée.
    Les points ne dépendent pas de la cotisation : seul le compte notionnel, qui
    reprend la cotisation, le voit.
  effet: aucun sur la prestation ; les deux tiers du forfait manquent à la cotisation reprise
- version: [trente_points_seize, vingt_sept_points]
  ecart: >-
    Le tarif de la consultation n'est pas une série du dépôt : le forfait de 1985 à 2011
    est pris à une valeur de consultation de l'année de sa rédaction, ramenée aux prix
    (114,34 € de 1985, 343,01 € de 1993, 264,27 € de 1995, 335,39 € de 1999, 400 € de
    2004), et la période de 1972 à 1984 prend le forfait de 1985.
  effet: aucun sur les points ; la cotisation reprise, sous-estimée là où le tarif a monté plus vite que les prix
- version: [forfait_et_ajustement, ajustement_a_quatre_pour_cent]
  ecart: >-
    Le forfait de 2016, 4 850 € dont un tiers pour le médecin, est prolongé aux prix, et
    non au revenu moyen des affiliés que le décret fait suivre ; les points d'ajustement
    suivent la règle de l'article 3 (fiche asv_medecins_ajustement).
  effet: >-
    à moins de 1 % des points que la calculette de la CARMF donne, selon la fiche
    asv_medecins_ajustement
- version: avantage_social_d_avant_1972
  ecart: >-
    Les 37,52 points des années d'avant le 1er juillet 1972 ne sont pas portés : la
    fiche de régime commence en 1972.
  effet: >-
    aucun sur les générations que le simulateur liquide ; les médecins installés avant
    1972, nés avant 1945 environ
- version: [vingt_sept_points, forfait_et_ajustement, ajustement_a_quatre_pour_cent]
  ecart: >-
    La valeur de service est celle de la période de la fiche de régime en vigueur à la
    liquidation, pour tous les points : elle rejoint l'article 4 pour les liquidations
    depuis 2012, où tous les points d'une même liquidation ont une même valeur, mais
    les liquidations d'avant 2012 prennent 15,55 €, la valeur de 2012, ramenée aux
    prix.
  effet: non mesuré ; les seules liquidations d'avant 2012
sources:
  lu_le: 2026-10-13
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Porter chaque année le forfait que la CARMF publie, revalorisé sur le revenu moyen
    des affiliés, et la valeur de service que le décret n° 2011-1644 fixe.
  - >-
    Lire les rédactions de l'article 2 du décret n° 72-968 d'avant 2012 (1981, 1994,
    1999, 2004, 2006), qui ont fixé les points de chaque période, et l'arrêté de 1972
    qui fixait la cotisation avant le code.
  lectures:
  - type: legifrance
    reference: >-
      décret n° 72-968 du 27 octobre 1972, articles 1er à 7 dans leurs rédactions de 2012
      et de 2026 ; décret n° 2011-1644, articles 1er à 6 ; D. 645-2 et D. 645-3 CSS, de
      1985 à 2020 ; L. 645-5 CSS : index LEGI du dépôt, à jour au 12 octobre 2026
    date: 2026-10-13
reformes: [asv_1972, asv_trois_enfants_1981, asv_part_caisses_1993, asv_2012, asv_2017, carmf_temps_choisi_2017, asv_2026]
code:
  python: >-
    droit/acquerir.py : acquerir ; moteur/compte.py :
    ConstructeurCompte._cotisation_ligne ; donnees/regimes.py :
    PeriodeRegime.prise_en_charge ; droit/liquider.py : liquider_chaque_regime,
    valeur_point_fiche
  javascript: >-
    moteur/js/droit/acquerir.js : acquerir ; moteur/js/compte.js :
    ConstructeurCompte._cotisationLigne ; moteur/js/regimes.js :
    PeriodeRegime.priseEnCharge ; moteur/js/droit/liquider.js : liquiderChaqueRegime,
    valeurPointFiche
  parametres: >-
    regimes/asv_conventionnes.yaml : cotisation_forfaitaire_euros,
    points_par_trimestre_valide, points_ajustement_par_forfait,
    points_ajustement_maximum, taux_cotisation_retraite, valeur_point_euros,
    part_assurance_maladie_forfait, part_assurance_maladie_taux
  tests: tests/temoins/simulations.json, les carrières du statut medecin_liberal
  moteur: >-
    Ses données : regimes/asv_conventionnes.yaml, vingt-deux périodes en points, statut
    medecin_liberal ; la part des caisses va au compte par
    ConstructeurCompte._cotisation_ligne.
historique:
- >-
  2026-10-13 — écrite à l'étape 2 de l'action 145 : l'ASV n'avait que la fiche générique
  de liquidation, et deux fiches partielles sans régime nommé (asv_medecins_ajustement,
  carmf_asv_minoration_enfants). Elle réunit en versions ce que la fiche de régime
  portait par périodes, et ajoute les 37,52 points d'avant 1972, la valeur de service à
  trois étages de L. 645-5 et la réécriture du décret de 1972 au 1er juillet 2026. Aucun
  chiffre ne change.
- >-
  2026-10-14 — action 138, étape 18 : la part des caisses d'assurance maladie, les deux
  tiers du forfait et de l'ajustement en secteur 1 (la moitié du 30 mars 1993 au 8
  juillet 1994, D. 645-3), est portée au compte notionnel comme une part patronale ; les
  points n'en changent pas. Le forfait de 2025 et de 2026, 1 852 et 1 917 € pour le
  médecin, lu au guide de la CNAVPL et chez la CARMF, au lieu de celui de 2016 projeté
  sur les prix.
effet: >-
  Les médecins libéraux conventionnés : près du tiers de la pension d'un médecin de
  secteur 1 ; le modèle en rend les points annuels à moins de 1 % de la calculette de la
  CARMF (fiche asv_medecins_ajustement), sans les points d'avant 1972.
