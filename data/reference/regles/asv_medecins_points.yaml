- version: [trente_points_seize, vingt_sept_points, forfait_et_ajustement, ajustement_a_quatre_pour_cent]
  ecart: >-
    La fiche de régime ne porte que la part du médecin — un tiers du forfait, la moitié
    de 1993 à 1994 — ; la part des caisses d'assurance maladie est décrite, non comptée.
    Les points ne dépendent pas de la cotisation : seul le compte notionnel, qui
    reprend la cotisation, le voit.
  effet: aucun sur la prestation ; les deux tiers du forfait manquent à la cotisation reprise
- version: [trente_points_seize, vingt_sept_points]
  ecart: >-
    Le tarif de la consultation n'est pas une série du dépôt : le forfait de 1985 à 2011
    est pris à une valeur de consultation de l'année de sa rédaction, ramenée aux prix
    (114,34 € de 1985, 343,01 € de 1993, 264,27 € de 1995, 335,39 € de 1999, 400 € de
    2004), et la période de 1972 à 1984 prend le forfait de 1985.
  effet: aucun sur les points ; la cotisation reprise, sous-estimée là où le tarif a monté plus vite que les prix
- version: [forfait_et_ajustement, ajustement_a_quatre_pour_cent]
  ecart: >-
    Le forfait de 2016, 4 850 € dont un tiers pour le médecin, est prolongé aux prix, et
    non au revenu moyen des affiliés que le décret fait suivre ; les points d'ajustement
    suivent la règle de l'article 3 (fiche asv_medecins_ajustement).
  effet: >-
    à moins de 1 % des points que la calculette de la CARMF donne, selon la fiche
    asv_medecins_ajustement
- version: avantage_social_d_avant_1972
  ecart: >-
    Les 37,52 points des années d'avant le 1er juillet 1972 ne sont pas portés : la
    fiche de régime commence en 1972.
  effet: >-
    aucun sur les générations que le simulateur liquide ; les médecins installés avant
    1972, nés avant 1945 environ
- version: [vingt_sept_points, forfait_et_ajustement, ajustement_a_quatre_pour_cent]
  ecart: >-
    La valeur de service est celle que le texte fixe pour l'exercice de la date d'effet
    (`liquidation.date_effet`), la même pour tous les points : 15,55 € de 1999 à 2011,
    13 € de 2012 à 2016, puis 11,31 €, 11,36 €, 11,48 €, 11,71 € et 11,82 €, sans
    indexation (fiche de régime, `valeur_point_annee: null`). Trois choses restent
    approchées. Le premier semestre de 2012 : la période de 2012 porte 13 €, quand le
    texte donne 15,55 € jusqu'au 30 juin à qui part de janvier à juin. Les années 1999 à
    2001 : 102 F font 15,5498 €, et non 15,55 €. Ce que le texte fait ensuite de la
    valeur, exercice par exercice, selon l'année de liquidation — le point liquidé en
    2005 tombe à 14 € de 2015 à 2020, celui de 2015 reste à 13 € jusqu'en 2020 — n'est
    pas porté : la fiche de régime ne donne que la valeur à la date d'effet.
  effet: >-
    six mois à 2,55 € par point de trop peu pour un départ du premier semestre 2012 ;
    0,18 € par an au cas posé de 2002, s'il était parti de 1999 à 2001 ; la suite de la
    pension servie, non mesurée
- version: [trente_points_seize, vingt_sept_points]
  ecart: >-
    Les pensions prises avant 1999 ne sont pas lues au texte : le modèle leur sert
    15,55 €, pris pour valeur de 2011 et ramené aux prix de l'année d'effet
    (`valeur_point_annee: 2011`), quand le texte donne le tarif de la consultation
    jusqu'en 1993, puis « 100 F », valeur « revalorisée chaque année dans les
    conditions prévues pour les pensions du régime général », du 1er janvier 1994 au
    28 mars 1999 (article 2, LEGIARTI000006765944). Le premier trimestre de 1999 prend
    à l'inverse les 15,55 € de la période de 1999.
  effet: non mesuré ; les médecins nés avant 1934 environ, partis à 65 ans avant 1999
- version: ajustement_a_quatre_pour_cent
  ecart: >-
    Passé 2026, dernier exercice que le texte lu le 14 novembre 2026 fixe (« 11,82 euros
    à compter de l'exercice 2025 »), le modèle porte cette valeur aux prix depuis 2026
    (`valeur_point_annee: 2026`) : une projection, non une règle, à remplacer par la
    valeur de chaque décret à sa parution.
  effet: >-
    aucun jusqu'en 2026 ; au-delà, la hausse des prix de la projection, quand le texte
    en vigueur laisse 11,82 €
- version: [trente_points_seize, vingt_sept_points, forfait_et_ajustement]
  ecart: >-
    ERREUR DÉCLARÉE (action 130, E16), non corrigée. Depuis le 15 février 1985, la
    prestation n'est attribuée qu'aux médecins « ayant exercé, pendant au moins un an »
    (article 7 ; dix ans avant, décret n° 71-542, article 7) ; le modèle ne pose aucune
    durée minimale, et sert les points d'un exercice plus court. Le décompte des
    trimestres par le modèle n'est pas confronté non plus à l'article 3 (l'affiliation
    au premier jour du trimestre civil suivant) ni à l'article 2 (« au prorata du nombre
    de trimestres cotisés ») : relevé le 13 novembre 2026, six mois dans une année
    civile donnent 27 points, trois mois aucun, six mois à cheval sur deux années
    aucun ; non mesuré
  effet: >-
    cas posé (moteur Python, réglages par défaut), homme né en janvier 1960, salarié du
    privé non cadre de 22 à 40 ans et de 40 ans 9 mois à la liquidation à 65 ans (niveau
    1), médecin libéral de 40 ans à 40 ans 9 mois : le modèle sert 27 points × 11,82 € ×
    1,15 = 367,01 € par an ; le texte, rien : 367,01 € de trop
sources:
  lu_le: 2026-11-14
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Porter chaque année le forfait que la CARMF publie, revalorisé sur le revenu moyen
    des affiliés, et relire l'article 4 du décret n° 2011-1644 à chaque décret qui le
    récrit : la valeur de service de 2027 et d'après n'est qu'une projection.
  - >-
    Lu le 6 novembre 2026 (action 130, E16) : les rédactions de l'article 2 du décret
    n° 72-968 de 1981 à 2006, et toutes celles que la fiche cite. Reste à lire la
    rédaction de 1972 de l'article 2 (hors de l'index LEGI) et l'arrêté de 1972 qui
    fixait la cotisation avant le code ; à couper les versions à la date de liquidation
    (`liquidation.date_effet`), qui décide de la valeur de service et de la durée
    minimale ; à chiffrer les liquidations d'avant 1999. Une erreur déclarée, non
    corrigée (approximations) : la durée minimale d'un an non servie. La valeur de
    service portée aux prix est corrigée depuis le 14 novembre 2026 (historique).
  - >-
    Relu le 14 novembre 2026 (action 130, file des corrections, ligne 8), à l'index LEGI
    à jour du 13 novembre 2026 : l'article 4 du décret n° 2011-1644, dans ses rédactions
    de 2012 et du 14 novembre 2025, sans rédaction plus récente ; l'article 2 du décret
    n° 72-968 de 1981 à 2026 ; D. 645-2 de 1993 à 1999 et D. 645-3 jusqu'en 2004 ; au
    Journal officiel, le décret n° 81-274 et les articles 1er et 3 du décret n° 94-564.
    Restent à lire : la valeur de service d'avant 1999, année par année ; la source de
    la part des caisses de 2005 à 2011 ; l'article 6 du décret n° 72-968, ses sept
    rédactions, qui décide de la cotisation appelée (ligne 9 de la file).
  lectures:
  - type: legifrance
    reference: >-
      décret n° 72-968 du 27 octobre 1972, articles 1er à 7 dans leurs rédactions de 2012
      et de 2026 ; décret n° 2011-1644, articles 1er à 6 ; D. 645-2 et D. 645-3 CSS, de
      1985 à 2020 ; L. 645-5 CSS : index LEGI du dépôt, à jour au 12 octobre 2026
    date: 2026-10-13
  - type: legifrance
    reference: >-
      décret n° 2011-1644, article 4, rédaction en vigueur (LEGIARTI000052567955) et
      rédaction de 2012 (LEGIARTI000024853556) ; décret n° 72-968, article 2, de 1981 à
      2026 : index LEGI du dépôt, à jour au 13 novembre 2026
    date: 2026-11-14
