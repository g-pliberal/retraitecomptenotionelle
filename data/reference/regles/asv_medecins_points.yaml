historique:
- >-
  2026-10-13 — écrite à l'étape 2 de l'action 145 : l'ASV n'avait que la fiche générique
  de liquidation, et deux fiches partielles sans régime nommé (asv_medecins_ajustement,
  carmf_asv_minoration_enfants). Elle réunit en versions ce que la fiche de régime
  portait par périodes, et ajoute les 37,52 points d'avant 1972, la valeur de service à
  trois étages de L. 645-5 et la réécriture du décret de 1972 au 1er juillet 2026. Aucun
  chiffre ne change.
- >-
  2026-10-14 — action 138, étape 18 : la part des caisses d'assurance maladie, les deux
  tiers du forfait et de l'ajustement en secteur 1 (la moitié du 30 mars 1993 au 8
  juillet 1994, D. 645-3), est portée au compte notionnel comme une part patronale ; les
  points n'en changent pas. Le forfait de 2025 et de 2026, 1 852 et 1 917 € pour le
  médecin, lu au guide de la CNAVPL et chez la CARMF, au lieu de celui de 2016 projeté
  sur les prix.
- >-
  2026-11-14 — action 130, file des corrections décidées le 13 novembre 2026, ligne 8 :
  la valeur de service est celle du texte. Le modèle portait aux prix de l'année
  d'effet une valeur ancrée à une autre année (`valeur_point_annee`), quand les textes
  la fixent en francs puis en euros courants : 102 F, soit 15,55 €, de mars 1999 au
  premier semestre 2012 (décret n° 72-968, article 2), puis 13 €, 11,31 €, 11,36 €,
  11,48 €, 11,71 € et 11,82 € selon l'exercice (décret n° 2011-1644, article 4). Il
  servait donc trop peu avant 2012 et trop entre ses ancres, 2026 compris. Les périodes
  de 1999 à 2025 de la fiche de régime perdent leur année d'ancrage, celle de 2026
  s'ancre en 2026. Aux cas posés, médecins nés un 1er janvier, au salaire moyen de 30 à
  65 ans, dans les deux moteurs : né en 1937 (2002), 879,52 points × 15,55 € =
  13 676,54 € au lieu de 11 709,34 €, 1 967,20 € de plus par an ; né en 1940 (2005),
  14 936,09 € au lieu de 13 575,33 € ; né en 1959 (2024), 1 014,45 points × 11,71 € ×
  1,15 = 13 661,11 € au lieu de 13 934,47 €, 273,36 € de moins ; né en 1961 (2026),
  1 019,93 points × 11,82 € × 1,15 = 13 863,87 € au lieu de 14 106,48 €, 242,62 € de
  moins. La même session reprend les écarts (c) à (g) de la relecture du 13 novembre
  2026 : la cotisation de 1994, le décret n° 71-544, la fin de D. 645-3 en 2004, la
  citation de 2026, les points liquidés de 2006 à 2010, le texte dont naissent les 27
  points.
effet: >-
  Les médecins libéraux conventionnés : près du tiers de la pension d'un médecin de
  secteur 1 ; le modèle en rend les points annuels à moins de 1 % de la calculette de la
  CARMF (fiche asv_medecins_ajustement), sans les points d'avant 1972.
