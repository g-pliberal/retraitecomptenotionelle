schema_version: 1
id: asv_medecins_points
intitule: >-
  Le médecin libéral conventionné acquiert dans l'ASV, par une cotisation forfaitaire
  que les caisses d'assurance maladie paient aux deux tiers, un nombre fixe de points par
  année cotisée — 37,52 avant juillet 1972, 30,16 jusqu'en 1993, 27 depuis —, au prorata
  des trimestres ; depuis 2012, une cotisation d'ajustement proportionnelle au revenu lui
  en ajoute neuf au plus par an ; la prestation vaut les points multipliés par une valeur
  de service qui dépend, depuis 2006, de l'année d'acquisition et de l'année de
  liquidation, après au moins un an d'exercice conventionné.
domaine: points
regimes: [asv_conventionnes]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- les trimestres d'exercice libéral conventionné du médecin, année par année
- son revenu d'activité non salarié, dans la limite de cinq plafonds, depuis 2012
- la cotisation forfaitaire et le taux d'ajustement de l'année, et le tarif de la
  consultation de 1985 à 2011
- à la liquidation, l'année de liquidation et l'année d'acquisition des points, pour la
  valeur de service
ecrit:
- les points ASV de chaque année, forfaitaires et d'ajustement
- la prestation complémentaire de vieillesse, points multipliés par la valeur de service
dates_qui_decident:
- revenu.annee
# `revenu.annee` est l'année de la cotisation, qui décide des points. Aucune version
# n'est lue par un moteur : le modèle calcule l'ASV par la fiche de régime
# (regimes/asv_conventionnes.yaml), que `code` nomme ; les fiches
# asv_medecins_ajustement et carmf_asv_minoration_enfants en tiennent deux pièces.
