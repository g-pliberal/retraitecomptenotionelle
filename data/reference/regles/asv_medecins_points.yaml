      de l'évolution constatée du revenu moyen » des affiliés (article 1er) ; ses
      vingt-sept points restent
    ajustement: >-
      une cotisation sur le revenu de l'avant-dernière année, dans la limite de cinq
      plafonds : 0,25 % en 2012, 0,90 % en 2013, 1,50 % en 2014, 2,10 % en 2015, 2,60 % en
      2016, 2,8 % en 2017, 3,2 % en 2018, 3,6 % en 2019, 3,8 % de 2020 à 2025 (article 2)
      ; elle ouvre, « dans la limite de neuf points par an », le rapport entre « le
      produit du montant de la cotisation d'ajustement et des deux tiers du nombre de
      points acquis au titre de la cotisation forfaitaire » et le forfait (article 3) ;
      3 % pour l'assuré en cumul emploi-retraite (L. 643-6) et celui de L. 642-4-2
      (D. 645-2)
    valeur_de_service: >-
      pour les pensions liquidées avant 2006, 15,55 € au premier semestre 2012, 15,25 €
      au second, 14,80 € en 2013, 14,40 € en 2014, 14 € de 2015 à 2020, 14,06 € en 2021,
      14,21 € en 2022, 14,49 € depuis 2023, 14,63 € depuis 2025 ; pour les points
      liquidés depuis 2011, 13 € du second semestre 2012 à 2020, puis 13,05 €, 13,19 €,
      13,45 € et 13,58 € (2025) ; pour les points liquidés depuis 2017, 11,31 € jusqu'en
