      une cotisation sur le revenu de l'avant-dernière année, dans la limite de cinq
      plafonds : 0,25 % en 2012, 0,90 % en 2013, 1,50 % en 2014, 2,10 % en 2015, 2,60 % en
      2016, 2,8 % en 2017, 3,2 % en 2018, 3,6 % en 2019, 3,8 % de 2020 à 2025 (article 2)
