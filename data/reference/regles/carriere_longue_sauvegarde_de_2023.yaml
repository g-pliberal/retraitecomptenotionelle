schema_version: 1
id: carriere_longue_sauvegarde_de_2023
intitule: >-
  La clause de sauvegarde de la carrière longue de 2023 : l'assuré né du 1er septembre
  1961 au 31 décembre 1963 qui avait, avant le 1er septembre 2023, la durée cotisée que
  demandaient les rédactions d'avant peut demander, pour une pension prenant effet à
  compter de cette date, l'âge de ces rédactions (décret n° 2023-436, article 8).
domaine: depart_anticipe
regimes: [cancava, cnracl, fonction_publique_etat, fspoeie, msa_non_salaries, msa_salaries,
  organic, regime_general, rsi]
etape: ouvrir_le_droit
face: droit
etat: conforme
lit:
- la date de naissance de la personne, au mois
- la durée cotisée, périodes réputées comprises, acquise avant le 1er septembre 2023
- les portes de la carrière longue et la durée requise des rédactions d'avant
- liquidation.date_effet
ecrit:
- l'âge de la carrière longue des rédactions d'avant, que « ouvrir le droit » oppose au
  départ et que la datation des départs lit pour le régime qui attend
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le moteur
# (droit/ouvrir.js, `sauvegardeDe2023`) lit : `existe` ; `regimes`, ceux dont la clause
# nomme les articles ; `nes_du` et `nes_au`, l'année et le mois de naissance des
# générations qu'elle vise, bornes comprises ; `duree_acquise_avant`, l'année et le mois
# avant le premier jour desquels la durée s'acquiert, sous les rédactions d'avant ;
# `redactions_anterieures`, la version de chaque fiche que la clause garde, nommée
# (D. 351-1-1 dans sa rédaction du 1er novembre 2012, fiche carriere_longue).
versions:
- id: avant_le_decret_du_3_juin_2023
  statut: lue
  textes:
  - {id: JORFARTI000047625914, article: "décret n° 2023-436, article 9", publie_le: 2023-06-04, lu_le: 2026-11-20}
  nee_de: JORFARTI000047625914
  bornes:
    liquidation.date_effet: [null, 2023-09-01]
  contenu:
    droit: >-
      « Les dispositions du présent décret s'appliquent aux pensions prenant effet à
      compter du 1er septembre 2023 » (article 9) : avant, la pension s'ouvre sous les
      rédactions que la clause garde, et la clause n'a pas d'objet
    parametres:
      existe: false
  exemples: aucun trouvé
  exemples_cherches: >-
    la circulaire Cnav n° 2023-14 du 10 juillet 2023, lue en entier le 20 novembre 2026 :
    ses exemples sont tous des pensions prenant effet à compter du 1er septembre 2023
- id: decret_du_3_juin_2023
  statut: lue
  textes:
  - {id: JORFARTI000047625907, article: "décret n° 2023-436, article 8", publie_le: 2023-06-04, lu_le: 2026-11-20}
  - {id: LEGIARTI000029134997, article: "décret n° 2003-1306, article 26-1", en_vigueur: 2014-06-26, lu_le: 2026-11-20}
  - {id: LEGIARTI000029134294, article: "décret n° 2004-1056, article 22 ter", en_vigueur: 2014-06-26, lu_le: 2026-11-20}
  nee_de: JORFARTI000047625907
  bornes:
    liquidation.date_effet: [2023-09-01, null]
  contenu:
    droit: >-
      « Par dérogation aux dispositions de l'article 3 du présent décret, les assurés nés
      entre le 1er septembre 1961 et le 31 décembre 1963 et qui justifient, avant le 1er
      septembre 2023, d'une durée d'assurance mentionnée aux articles D. 16-1 et D. 16-2
      du code des pensions civiles et militaires de retraite, D. 732-40 du code rural et
      de la pêche maritime et L. 161-17-3, D. 351-1-1 et D. 351-1-2 du code de la sécurité
      sociale, dans leur rédaction antérieure à l'entrée en vigueur du présent décret,
      peuvent demander à bénéficier, pour une pension prenant effet à compter du 1er
      septembre 2023, d'un âge d'ouverture du droit à pension abaissé dans les conditions
      prévues aux articles D. 16-1 du code des pensions civiles et militaires de retraite,
      D. 732-40 du code rural et de la pêche maritime et D. 351-1-1 du code de la sécurité
      sociale dans leur rédaction antérieure à l'entrée en vigueur du présent décret »
      (article 8) ; « Les trimestres validés au titre de l'AVPF, de l'Ava ainsi que les
      VPLR effectués pour la prise en compte des années d'apprentissage ne doivent pas
      être retenus pour apprécier la durée d'assurance cotisée acquise avant le 1er
      septembre 2023. La retraite est calculée au taux plein, conformément aux
      dispositions de l'article L. 351-8, 4°ter. Toutefois, pour la détermination de la
      durée de proratisation, la durée d'assurance maximum à retenir doit tenir compte de
      l'augmentation de la durée nécessaire pour obtenir le taux plein » (circulaire Cnav
      n° 2023-14, point 9.2)
    beneficiaire: >-
      l'assuré né du 1er septembre 1961 au 31 décembre 1963 qui avait la durée des
      rédactions d'avant au 31 août 2023
    parametres:
      existe: true
      regimes: [cancava, cnracl, fonction_publique_etat, fspoeie, msa_non_salaries,
        msa_salaries, organic, regime_general, rsi]
      nes_du: [1961, 9]
      nes_au: [1963, 12]
      duree_acquise_avant: [2023, 9]
      redactions_anterieures:
        carriere_longue: decret_de_2012
  exemples:
  - cnav_2023_14_sauvegarde_1962
  - cnav_2023_14_sauvegarde_1963_octobre
  - cnav_2023_14_sauvegarde_1963_avpf
approximations:
- version: [decret_du_3_juin_2023]
  ecart: >-
    L'article 8 nomme les articles du code des pensions, non le décret n° 2003-1306 de
    la CNRACL ni le décret n° 2004-1056 des ouvriers de l'État, qui appliquent L. 25 bis
    « dans les conditions et selon les modalités prévues aux articles D. 16-1 à D. 16-3
    » (articles 26-1 et 22 ter) ; la notice du décret vise les « régimes spéciaux de la
    fonction publique ». Le modèle leur ouvre la clause. Aucune instruction de la CNRACL
    n'a été lue.
  effet: non mesuré ; les fonctionnaires territoriaux et hospitaliers et les ouvriers de l'État de ces générations partis sous la clause
- version: [decret_du_3_juin_2023]
  ecart: >-
    La clause s'ouvre « à leur demande » : le modèle la tient pour demandée dès qu'un
    départ déclaré ou un régime qui attend en a besoin, et ne la propose pas comme âge
    de départ d'un cas type (`ageCarriereLongue`), qui continue de lire la rédaction de
    son départ. Le versement pour la retraite au titre de l'apprentissage, que la
    circulaire écarte de la durée acquise, n'est pas une période du modèle.
  effet: non mesuré
sources:
  lu_le: 2026-11-20
