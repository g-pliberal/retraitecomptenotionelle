    date: 2023-06-04
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 2023-14 du 10 juillet 2023, point 9.2 et ses trois exemples,
      point 4.2 (« La retraite anticipée pour carrière longue est obligatoirement
