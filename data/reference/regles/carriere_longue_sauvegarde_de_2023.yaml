    date: 2014-06-26
code:
  javascript: >-
    moteur/js/droit/ouvrir.js : sauvegardeDe2023, carriereLongueAcquise, ouvrir ;
    moteur/js/droit/departs.js : carriereLongueAcquise, ouvertureDe
  parametres: >-
