historique:
- >-
  2026-11-20 — écrite sur le choix du propriétaire (« Sauvegarde de 2023, puis étape
  3 »), après la vérification de la carrière longue aux bascules, qui n'en gardait que
  la date, et à toutes les générations.
effet: >-
  Né le 4 février 1962, 168 trimestres cotisés fin 2022, départ au 1er octobre 2023 : le
  modèle disait le droit « non ouvert », au taux de 49,375 % ; il part par la carrière
  longue, au taux plein, sur 168/169. Le régime qui attend après un départ d'avant
  septembre 2023 ne garde plus l'âge de la rédaction d'avant qu'aux générations de la
  clause.
a_confronter:
- source: union_retraite_carriere_longue
  quoi: l'âge du départ anticipé et la durée exigée
