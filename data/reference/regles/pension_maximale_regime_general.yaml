historique:
- >-
  2026-10-08 — écrite à l'étape 17 de l'action 138, sur le point d'OpenFisca-France-Pension
  au registre (chantier 138.17) et la question que la fiche decote_avant_1983 laissait
  ouverte.
- >-
  2026-10-11 — la loi n° 49-244 et le décret n° 48-361 lus au fac-similé du Journal
  officiel, depuis le poste du propriétaire : les 40 % de 1949 sont lus, sans majoration
  pour l'ajournement, que le modèle applique (première approximation).
- >-
  2026-10-16 — action 131 : le maximum des salariés agricoles, nommé par l'article 59-1 du
  décret n° 50-1225 de 1972 à 1974 et par les articles 2 du décret n° 51-727 et 71 ter
  du décret n° 50-1225 ensuite, borne leur pension depuis 1972, supposé celui du régime
  général.
- >-
  2026-10-25 — action 138, étape 4 : le jour de chaque majoration forfaitaire de 1972 à
  1982, la pension entière, majorée, est comparée au maximum de ce jour, « à retenir
  pour toutes les pensions servies » (circulaire Cnav n° 2/72, I, C ; fiche
  majorations_forfaitaires_1972_1982) ; l'écart des arrérages le dit.
effet: >-
  L'assuré du régime général dont la pension calculée passe la moitié du plafond — un
  salaire annuel moyen au-dessus du plafond de l'année, quand la revalorisation des
  salaires portés au compte a couru plus vite que le plafond, et des carrières complètes
  — la reçoit ramenée au maximum, surcote en sus ; avant 1983, ajournement et taux acquis
  compris. De même le salarié agricole depuis 1972.
