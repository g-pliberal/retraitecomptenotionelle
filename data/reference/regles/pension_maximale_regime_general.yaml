schema_version: 1
id: pension_maximale_regime_general
intitule: >-
  La pension du régime général ne peut dépasser un maximum : 40 % du plafond de la
  Sécurité sociale de l'année jusqu'en 1971, 44 %, 46 % puis 48 % de 1972 à 1974, 50 %
  depuis 1975, majoré comme le taux par l'ajournement au-delà de soixante-cinq ans avant
  le 1er avril 1983, et par le taux acquis au 31 mars 1983 ; la surcote s'applique au
  montant ramené au maximum, et le passe. Celle des salariés agricoles a le sien depuis
  1972, que le modèle suppose égal.
domaine: salaire_de_reference
regimes:
- regime_general
- msa_salaries
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- la pension calculée du régime, salaire annuel moyen × taux × durée, avant la surcote
- le coefficient que l'ajournement avant 1983, le taux acquis au 31 mars 1983 ou la
  surcote appliquent au taux plein
- le plafond de la Sécurité sociale de l'année de la date d'effet
  (macro/plafond_securite_sociale.csv)
- liquidation.date_effet
ecrit:
- la pension ramenée au maximum, et la formule qui le dit ; la comparaison de la
  pension au taux acquis au 31 mars 1983 et de celle sur la durée corrigée, chacune
  ramenée à son maximum
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/liquider.py, `pension_maximale` et `taux_acquis_l_emporte`, et leur
# jumeau) lit : `existe` ; `regimes`, ceux dont la pension est bornée ;
# `pourcentages`, la part du plafond de la Sécurité sociale que le maximum vaut à
# soixante-cinq ans, à chaque date — celui de la date d'effet est le dernier qui ne
# la passe pas —, appliquée au plafond annuel de l'année de la date d'effet ;
# `fiabilite`, que le résultat prend quand le maximum ramène la pension, et
# `fiabilite_par_regime`, celle d'un régime que la version borne sur un autre texte
# que celui qui fixe le pourcentage (les salariés agricoles). Le maximum
# se multiplie par le coefficient que le moteur applique au taux plein au-delà de
# soixante-cinq ans — l'ajournement avant 1983, le taux acquis au 31 mars 1983 — ou
# pour la surcote : la pension ramenée au maximum, puis majorée.
versions:
- id: avant_1949
  statut: supposee
  hypothese: >-
    le barème de la Cnav « Montant maximum de la retraite personnelle » commence au 1er
    janvier 1949, avec le montant que fixe un décret du 2 mars 1948, et l'index ne porte
    aucun texte qui en fixe un avant. Lu au Journal officiel, ce décret, le n° 48-361,
    ne fixe aucun maximum de pension : il porte la rémunération maximum soumise à
    cotisation à 228 000 F par an, dont le maximum de 1949, 91 200 F, est les 40 % ; la
    borne naît de la loi n° 49-244 (article 2), pour les revalorisations qui prennent
    effet du 1er janvier 1949, sans renvoyer à une borne antérieure. La loi n° 48-1306
    du 23 août 1948, qu'elle modifie, n'est pas lue : aucun maximum
  fiabilite: estimee
  bornes:
    liquidation.date_effet: [null, 1949-01-01]
  contenu:
    droit: aucun maximum lu
    parametres:
      existe: false
  exemples: aucun trouvé
- id: quarante_pour_cent_du_plafond
  statut: supposee
  hypothese: >-
    la loi n° 49-244 du 24 février 1949, lue au Journal officiel, borne pour 1949, « à
    titre exceptionnel », toute pension ou rente de vieillesse revalorisée à « 40 p.
    100 du chiffre limite » de l'article 31 de l'ordonnance du 4 octobre 1945, le
    plafond, porté à 228 000 F par le décret n° 48-361 : 91 200 F, le premier montant
    du barème de la Cnav. De 1950 à 1971, le barème vaut, à l'euro près, 40 % du plafond
    de chaque année de 1958 à 1971 où le plafond n'a pas changé en cours d'année, la
    pension de soixante-cinq ans étant de 40 % du salaire annuel moyen ; les décrets
    qu'il cite, un par plafond, ne sont pas dans l'index, qui n'en garde que les titres.
    Au-delà de soixante-cinq ans, la loi de 1949 ne majore pas la borne, qui ne tient
    compte que des coefficients des articles 120 et 121 de l'ordonnance du 19 octobre
    1945, non lus ; la circulaire n° 2/72 la majore par trimestre d'ajournement de 1972
    à 1974 : de 1950 à 1971, non lu
  fiabilite: moyenne
  bornes:
    liquidation.date_effet: [1949-01-01, 1972-01-01]
  contenu:
    droit: >-
      le montant que le barème de la Cnav publie, de 91 200 anciens francs au 1er
      janvier 1949 à 7 920 F au 1er janvier 1971, chacun avec le décret ou la loi qui le
      fixe ; 40 % du plafond de l'année
    beneficiaire: l'assuré dont la pension de vieillesse passe le maximum
    parametres:
      existe: true
      regimes: [regime_general]
      pourcentages: [["1949-01-01", 0.40]]
      fiabilite: moyenne
  exemples: aucun trouvé
- id: arrete_du_28_janvier_1972
  statut: lue
  textes:
  - {id: LEGIARTI000006760613, article: 72-1, en_vigueur: 1972-01-29}
  - id: JORFTEXT000000483786
    reference: >-
      arrêté du 28 janvier 1972 fixant le plafond des pensions de vieillesse servies au
      titre du régime général à partir du 1er janvier 1972, dont l'index JORF ne garde
      que la notice
    publie_le: 1972-01-29
  - {id: LEGIARTI000006774035, article: 59-1, en_vigueur: 1972-07-01, reference: "décret n° 50-1225 du 21 septembre 1950, article 59-1, § 2 : le maximum des pensions des salariés agricoles de 1972 à 1974, fixé par arrêté du ministre de l'agriculture"}
  - id: JORFTEXT000000452192
    reference: >-
      arrêté du 27 juin 1972 fixant le plafond des pensions de vieillesse servies au
      titre des assurances sociales agricoles au cours de la période du 1er janvier 1972
      au 31 décembre 1974, dont l'index JORF ne garde que la notice
    publie_le: 1972-07-01
  nee_de: LEGIARTI000006760613
  bornes:
    liquidation.date_effet: [1972-01-01, 1975-01-01]
  contenu:
    droit: >-
      « Le montant maximum que ne pourront dépasser les pensions servies au cours de la
      période du 1er janvier 1972 au 31 décembre 1974 est fixé par arrêté du ministre
      chargé de la sécurité sociale » (décret n° 45-0179, article 72-1, 2, rédigé par le
      décret n° 72-78) ; l'arrêté du 28 janvier 1972, que la circulaire Cnav n° 2/72
      transcrit : « en pourcentage du salaire limite soumis à cotisations, le maximum des
      arrérages susceptibles d'être servis », 44 % à soixante-cinq ans en 1972, 46 % en
      1973, 48 % en 1974, majorés de 1,10 %, 1,15 % et 1,20 % par trimestre
      d'ajournement après soixante-cinq ans. Chez les salariés agricoles : « Le montant
      maximum que ne pourront dépasser les pensions servies au cours de la période du 1er
      janvier 1972 au 31 décembre 1974 est fixé par arrêté du ministre de l'agriculture »
      (décret n° 50-1225, article 59-1, § 2) ; l'arrêté du 27 juin 1972, dont seule la
      notice est lue, et dont le modèle suppose les pourcentages du régime général
    beneficiaire: l'assuré dont la pension de vieillesse passe le maximum
    parametres:
      existe: true
      regimes: [regime_general, msa_salaries]
      pourcentages: [["1972-01-01", 0.44], ["1973-01-01", 0.46], ["1974-01-01", 0.48]]
      fiabilite: haute
      fiabilite_par_regime: {msa_salaries: moyenne}
  exemples: aucun trouvé
- id: cinquante_pour_cent_du_plafond
  statut: supposee
  hypothese: >-
    les décrets que le barème de la Cnav cite de 1975 à 1985, un par plafond, ne sont
    pas dans l'index ; le barème vaut, au franc près, 50 % du plafond de chaque année
    où celui-ci n'a pas changé en cours d'année, la circulaire n° 22/83 compte le
    maximum de 1983 à 50 % du plafond, 44 460 F, et à 55 % pour le taux acquis, 48 906
    F, et les arrêtés de 1986 écrivent la règle. Chez les salariés agricoles, les
    articles 2 du décret n° 51-727 (rédaction du 12 mars 1981) et 71 ter du décret n°
    50-1225 (rédaction du 1er janvier 1982), lus dans l'index LEGI, bornent le cumul de
    la réversion à « 60 p. 100 » et « 73 p. 100 du montant maximum de la pension de
    vieillesse du régime des assurances sociales agricoles liquidée à soixante-cinq
    ans » : le maximum existe, sa valeur n'est pas lue, le modèle la suppose celle du
    régime général
  fiabilite: haute
  bornes:
    liquidation.date_effet: [1975-01-01, 1986-01-19]
  contenu:
    droit: >-
      50 % du plafond, de 16 500 F au 1er janvier 1975 à 55 320 F au 1er janvier 1986
      (barème de la Cnav) ; « Dispositions antérieures au 1.4.83 Montant maximum de la
      pension : 48 906 Dispositions applicables à partir du 1-4-83 Montant maximum de la
      pension : 44 460 » (circulaire Cnav n° 22/83, point 313) ; chez les salariés
      agricoles, « le montant maximum de la pension de vieillesse du régime des
      assurances sociales agricoles liquidée à soixante-cinq ans » (décret n° 50-1225,
      article 71 ter, LEGIARTI000006774075), supposé le même
    beneficiaire: l'assuré dont la pension de vieillesse passe le maximum
    parametres:
      existe: true
      regimes: [regime_general, msa_salaries]
      pourcentages: [["1975-01-01", 0.50]]
      fiabilite: haute
      fiabilite_par_regime: {msa_salaries: moyenne}
  exemples: [cnav_22_83_taux_acquis_145_trimestres, cnav_22_83_taux_acquis_117_trimestres]
- id: arretes_de_1986
  statut: lue
  textes:
  - {id: LEGIARTI000006784048, article: 3, en_vigueur: 1986-01-19, reference: "arrêté du 8 janvier 1986 relatif à la revalorisation de divers avantages de vieillesse, d'invalidité et d'accident du travail du régime général"}
  - {id: LEGIARTI000006784464, article: 2, en_vigueur: 1986-10-11, reference: "arrêté du 9 octobre 1986 relatif à la revalorisation de divers avantages de vieillesse, d'invalidité et d'accident du travail du régime général"}
  nee_de: LEGIARTI000006784048
  bornes:
    liquidation.date_effet: [1986-01-19, null]
  contenu:
    droit: >-
      « Les dispositions qui précèdent ne pourront avoir pour effet : a) De porter une
      pension ou une rente de vieillesse à une somme supérieure à 50% du plafond de
      rémunérations entrant en compte pour la détermination de l'assiette de cotisations
      visé à l'article L. 241-3 du code de la sécurité sociale […]. Lorsque la
      liquidation des pensions de vieillesse a pris effet au-delà de soixante-cinq ans et
      antérieurement au 1er avril 1983, le pourcentage susvisé est majoré de 1,25% par
      trimestre d'ajournement postérieur à cet âge. Lorsque la liquidation des pensions
      de vieillesse des assurés âgés de plus de soixante-cinq ans au 1er avril 1983 prend
      effet postérieurement au 31 mars 1983, le pourcentage visé au premier alinéa est
      majoré dans les mêmes conditions compte tenu des coefficients de majoration acquis
      à cette dernière date » (arrêté du 9 octobre 1986, article 2, comme l'article 3 de
      celui du 8 janvier). La surcote, depuis 2004 : « il convient, le cas échéant de
      ramener la pension calculée au maximum des pensions de vieillesse avant d'appliquer
      à ce montant la surcote » ; « la somme du montant calculé de la pension
      (éventuellement limité au maximum) et de la surcote peut dépasser le maximum des
      pensions. Dans ce cas, elle n'est pas ramenée au maximum » (circulaire Cnav n°
      2007-5, point 3, lettre ministérielle du 1er septembre 2006). Chez les salariés
      agricoles, l'article 71 ter du décret n° 50-1225 vise jusqu'en 2005 le maximum de
      leur régime (LEGIARTI000006774076), et L. 742-3 du code rural leur rend applicable
      le titre V du livre III du code de la sécurité sociale : le modèle leur applique
      celui de ces arrêtés, qui ne visent que le régime général
    beneficiaire: l'assuré dont la pension de vieillesse passe le maximum
    parametres:
      existe: true
      regimes: [regime_general, msa_salaries]
      pourcentages: [["1986-01-19", 0.50]]
      fiabilite: haute
      fiabilite_par_regime: {msa_salaries: moyenne}
  exemples: aucun trouvé
approximations:
- version: [quarante_pour_cent_du_plafond]
  ecart: >-
    Le modèle majore le maximum de 1949 à 1971 comme le taux, par l'ajournement au-delà de
    soixante-cinq ans. La loi n° 49-244 borne la pension de 1949 à 40 % du chiffre limite
    sans égard à l'âge, et la majoration n'est lue qu'à partir de 1972 (circulaire n°
    2/72) : une pension de 1949 liquidée après soixante-cinq ans sur un salaire annuel
    moyen proche du plafond sort trop haute, et celles de 1950 à 1971 si les décrets de
    ces années disent comme elle.
  effet: >-
    non mesuré ; les seules pensions liquidées après soixante-cinq ans de 1949 à 1971 que
    le maximum ramène, d'assurés nés avant 1907
- version: [quarante_pour_cent_du_plafond, cinquante_pour_cent_du_plafond, arretes_de_1986]
  ecart: >-
    Le maximum se compte sur le plafond annuel de l'année de la date d'effet, que le
    dépôt tient pour la moyenne des plafonds de l'année : quand le plafond change en
    cours d'année — en 1949, 1951, 1952, 1955, 1960, 1961, puis chaque 1er juillet de
    1982 à 1996 —, le maximum de la Cnav est celui du semestre, plus bas de 1 à 4 % au
    premier, plus haut au second.
  effet: non mesuré ; les seules pensions que le maximum ramène, ces années-là
- version: [quarante_pour_cent_du_plafond, arrete_du_28_janvier_1972, cinquante_pour_cent_du_plafond, arretes_de_1986]
  ecart: >-
    Le maximum borne la pension que le modèle liquide, non les arrérages qu'il
    revalorise ensuite : avant 1987, chaque arrêté de revalorisation bornait aussi les
    pensions en cours de service au maximum de la date ; depuis, les pensions suivent
    les prix et le plafond les salaires, et le maximum ne mord plus sur la pension
    servie, sauf de 2021 à 2022, quand le plafond gelé n'a pas suivi la revalorisation
    des pensions, si la Cnav l'appliquait. Seul le jour de chaque majoration
    forfaitaire de 1972 à 1982, la pension qu'elle relève, entière, est comparée au
    maximum de ce jour (fiche majorations_forfaitaires_1972_1982).
  effet: non mesuré
- version: [arretes_de_1986]
  ecart: >-
    De 2004 à 2006, la Cnav ne ramenait pas au maximum la pension majorée par la surcote
    (circulaire n° 2004-37, point 421) ; depuis la lettre ministérielle du 1er septembre
    2006, elle ramène au maximum la pension calculée, puis la surcote s'y applique, pour
    les liquidations nouvelles et « aux arrérages à échoir des pensions en cours de
    service » (circulaire n° 2007-5) : le modèle applique la seconde règle depuis 2004.
  effet: >-
    non mesuré ; les seules pensions surcotées de 2004 à 2006 dont le montant calculé
    passe le maximum, jusqu'en 2007
- version: [arrete_du_28_janvier_1972]
  ecart: >-
    Les pensions de vieillesse substituées à des pensions d'invalidité du deuxième ou du
    troisième groupe gardaient le maximum de 50 % de 1972 à 1974 (circulaire n° 2/72) :
    le modèle leur applique celui de l'année.
  effet: non mesuré
- version: [quarante_pour_cent_du_plafond]
  ecart: >-
    Les salariés agricoles n'ont aucun maximum avant 1972 dans le modèle : aucun texte
    lu de leur régime n'en nomme un avant l'article 59-1 du décret n° 50-1225, et la loi
    n° 49-244, qui borne « une pension ou rente de vieillesse » en 1949, renvoie aux
    arrêtés de l'ordonnance du 19 octobre 1945, du régime général.
  effet: >-
    non mesuré ; les seules pensions agricoles de 1949 à 1971 sur un salaire annuel
    moyen proche du plafond
- version: [arrete_du_28_janvier_1972, cinquante_pour_cent_du_plafond, arretes_de_1986]
  ecart: >-
    Le maximum des salariés agricoles est supposé celui du régime général : l'arrêté du
    27 juin 1972 n'est lu que par sa notice, et les textes de 1975 à aujourd'hui ne
    font que le nommer. Et la liquidation unique de 2017 sert une seule pension aux
    régimes alignés : le modèle borne chacune des parts du régime général et des
    salariés agricoles au maximum entier, ni celle des artisans et commerçants, ni la
    pension unique que l'un d'eux liquide.
  effet: non mesuré ; les seules pensions que le maximum ramènerait
sources:
  lu_le: 2026-10-16
  prochaine_relecture: 2027-04-30
  lectures_divergentes:
  - >-
    Le barème de la Cnav porte 5 184 F au 1er janvier 1965 comme au 1er janvier 1966, en
    citant le décret du 24 décembre 1964 : 40 % du plafond de 1966, 12 960 F. Le plafond
    de 1965, certifié au Journal officiel, est de 12 240 F (macro/plafond_securite_sociale.csv),
    dont 40 % font 4 896 F : le modèle compte sur le plafond de l'année. Le barème du
    maximum de la réversion, lu le 9 octobre 2026, lui donne raison : 2 448 F au 1er
    janvier 1965, la moitié de 4 896 F (fiche reversion).
  - >-
    OpenFisca-France-Pension (regimes/regime_general_cnav.py:1022-1037, au commit
    1c45423) borne la pension à la moitié du plafond annuel, sans le pourcentage de 1949
    à 1974 ni la majoration de l'ajournement et du taux acquis, et ajoute à la pension
    bornée une surcote calculée sur la pension non bornée ; la Cnav l'applique à la
    pension ramenée au maximum (circulaire n° 2007-5).
  a_relire:
  - >-
    Lire l'arrêté du 27 juin 1972 (Journal officiel du 1er juillet 1972), dont l'index
    n'a que la notice, et un barème ou une circulaire de la MSA qui donne le maximum des
    salariés agricoles depuis 1975 ; lire celui des artisans et des commerçants, et dire
    celui de la pension unique des régimes alignés quand un autre que le régime général
    la liquide.
  - >-
    Lire les décrets que le barème de la Cnav cite de 1950 à 1971, et la loi n° 48-1306
    du 23 août 1948 : le maximum restait-il de 40 % du plafond sans égard à l'âge jusqu'en
    1972, comme la loi n° 49-244 l'écrit pour 1949 ? Si oui, ne plus le majorer par
    l'ajournement avant 1972, en Python puis en JavaScript (première approximation).
  lectures:
  - type: legifrance
    reference: >-
      salariés agricoles, lus dans l'index LEGI le 16 octobre 2026 : décret n° 50-1225,
      article 59-1, § 2 (LEGIARTI000006774035, 1972-07-01 → 2005-04-22) : « Le montant
      maximum que ne pourront dépasser les pensions servies au cours de la période du 1er
      janvier 1972 au 31 décembre 1974 est fixé par arrêté du ministre de l'agriculture
      » ; décret n° 51-727, article 2 (LEGIARTI000006773776, 1981-03-12 → 1983-05-08) : «
      jusqu'à concurrence de 60 p. 100 du montant maximum de la pension du régime des
      assurances sociales agricoles liquidée à soixante-cinq ans » ; décret n° 50-1225,
      article 71 ter (LEGIARTI000006774075, 1982-01-01 → 1988-06-23, et
      LEGIARTI000006774076, 1988-06-23 → 2005-04-22) : « 73 p. 100 du montant maximum de
      la pension de vieillesse du régime des assurances sociales agricoles liquidée à
      soixante-cinq ans » ; code rural, L. 742-3 (LEGIARTI000047453569, en vigueur depuis
      le 1er septembre 2023) : sont applicables au régime des assurances sociales
      agricoles les « titres III et IV, titre V à l'exception du 7° de l'article L. 351-3
      et du chapitre VII » du livre III du code de la sécurité sociale. L'article 55 du
      décret n° 50-1225 (1972 et 1982) ne nomme aucun maximum ; l'arrêté du 27 juin 1972
      (JORFTEXT000000452192) n'a que sa notice dans l'index JORF
    date: 2023-09-01
  - type: legifrance
    reference: >-
      décret n° 45-0179, article 72-1 (LEGIARTI000006760613, 1972-01-29 → 1985-12-21) ;
      arrêté du 8 janvier 1986, article 3 (LEGIARTI000006784048) ; arrêté du 9 octobre
      1986, article 2 (LEGIARTI000006784464), en vigueur, et article 3, qui applique «
      les majorations et les plafonds de pensions » aux assurés d'Alsace-Moselle ayant
      cotisé avant 1946 ; R. 351-27, R. 351-29, D. 351-1-4, qui n'écrivent aucun
      maximum ; lus dans l'index LEGI le 8 octobre 2026
    date: 1986-10-11
  - type: jorf
    reference: >-
      loi n° 49-244 du 24 février 1949 relevant le taux de l'allocation temporaire aux
      vieux travailleurs salariés (JORFTEXT000000521124), que le barème de la Cnav cite
      au 1er mars 1949 et à laquelle sa base rattache le maximum (article 2) — « Le
      montant de la retraite pour ancien combattant et prisonnier de guerre doit être
      comparé au montant maximum des retraites » (circulaire Cnav n° 2024-29, point
      2.2.5, sous « Loi n° 49-244 du 24 février 1949 article 2 »). L'index n'en garde que
      la notice ; lue au fac-similé du Journal officiel du 25 février 1949, p. 2019
      (version papier numérisée de Légifrance, téléchargée le 11 octobre 2026 depuis le
      poste du propriétaire), l'article 2 dispose : « A titre exceptionnel, pour l'année
      1949, les arrêtés prévus aux articles 56 (§ 1er), 71 (§ 2) et 120 (§ 2) de
      l'ordonnance n° 45-2454 du 19 octobre 1945, modifiée par la loi n° 48-1306 du 23
      août 1948 prendront effet du 1er janvier 1949. L'application de ces arrêtés ne
      pourra avoir pour conséquence de porter une pension ou rente de vieillesse, compte
      tenu du jeu des coefficients prévus aux articles 120 et 121 de ladite ordonnance, à
      une somme supérieure à 40 p. 100 du chiffre limite fixé en application de l'article
      31 de l'ordonnance n° 45-2250 du 4 octobre 1945, modifiée, pour la détermination
      des cotisations maxima »
    date: 1949-02-25
  - type: jorf
    reference: >-
      décret n° 48-361 du 2 mars 1948 portant relèvement du salaire limite prévu pour le
      calcul des cotisations de sécurité sociale (JORFTEXT000000499844), lu au fac-similé
      du Journal officiel du 3 mars 1948, p. 2236, de la même façon : « La rémunération
      maximum prévue par l'article 31 de l'ordonnance n° 45-2250 du 4 octobre 1945
      portant organisation de la sécurité sociale est portée à 228.000 F par an »
      (article 1er), 19 000 F par mois ; aucun maximum de pension
    date: 1948-03-03
  - type: jorf
    reference: >-
      arrêté du 28 janvier 1972 fixant le plafond des pensions de vieillesse servies au
      titre du régime général à partir du 1er janvier 1972 (JORFTEXT000000483786), et
      son jumeau des articles L. 365 à L. 382 (JORFTEXT000000307746) : l'index n'en garde
      que la notice
    date: 1972-01-29
  - type: circulaire_cnav
    reference: >-
      barème « Montant maximum de la retraite personnelle »
      (retraite_personnelle_montant_maximum_bar), lu par l'API de la base de législation
      de la Cnav le 8 octobre 2026 : 92 dates, de 91 200 anciens francs au 1er janvier
