schema_version: 1
id: micro_social_abattement
intitule: >-
  Les droits du micro-entrepreneur se calculent sur son chiffre d'affaires ou ses
  recettes après un abattement de 71 % pour la vente de marchandises, de 50 % pour
  les services commerciaux ou artisanaux, de 34 % pour les recettes libérales
  (L. 613-7, II ; L. 133-6-8 jusqu'en 2017) ; celui des professions que la Cipav
  garde relève de la CNAVPL et de la Cipav, au même abattement de 34 % (D. 613-4,
  b). Ses trimestres se valident sur le revenu que sa cotisation achète : le
  chiffre d'affaires fois le taux global (D. 613-4), fois la part de base
  (D. 613-6), divisé par le taux de base (D. 633-3, ou la première tranche de
  la CNAVPL), comparé à 150 SMIC horaires (circulaire Cnav n° 2024-23) ; ce
  revenu cotisé est aussi celui que son régime de base porte au compte, dans
  son revenu annuel moyen (R. 351-29, I, B, et D. 634-3 ; R. 634-1 jusqu'en
  2025). Sa cotisation de retraite est la part du taux global que D. 613-6 affecte au
  régime de base et à la complémentaire ; avant le décret n° 2022-1529, la
  clef que la Cnav applique (circulaire n° 2025-20). De 2009 à 2015, l'État
  compense ce que le forfait ne verse pas, au-dessus d'un seuil de 200 heures
  de SMIC, de 300 en 2015 (L. 133-6-8-2, D. 131-6-4), et garantit un
  trimestre en 2009. De 2016 à 2021, le forfait va d'abord à l'impôt, à la CSG
  et à la CRDS, puis à la maladie, puis à la vieillesse de base (L. 133-6-8-3,
  L. 613-9, D. 133-4) ; de 2017 à 2019, ses trimestres se comptent aux seuils
  de chiffre d'affaires que la caisse en publie. Ses points s'achètent avec
  ce qu'il a versé : au RCI, la part complémentaire de son forfait, un point
  par revenu de référence (règlement du RCI, articles 3 et 47) ; à la CNAVPL,
  les parts de la première et de la seconde tranche, « au prorata des
  cotisations acquittées sur chacune des tranches » (D. 643-1) ; à la
  complémentaire de la Cipav, la sienne.
regimes: [cipav_complementaire, cnavpl, nric, rci, regime_general, rsi]
etat: approchee
etape: acquerir_les_droits
effet: >-
  Le micro-entrepreneur saisit son chiffre d'affaires mensuel et son activité
  (champ « micro »), que la saisie abat avant de le donner au modèle : 3 000 € de
  ventes valent un revenu de 870 €. Sans activité dite, le revenu saisi reste lu
  comme déjà abattu, ce qu'il était avant le 14 octobre 2026. Depuis 2023, les
  trimestres se valident sur le revenu cotisé (`legislation/micro_social.yaml`,
  par activité et par année), sans assiette minimale : 12 100 € de ventes en
  2026 en valident deux, et non un ; 2 793 € de recettes à la Cipav, un, et non
  les trois de l'assiette minimale du libéral (tests/test_micro_social.py, sur
  les exemples de F23369 et de la circulaire). Depuis 2023 aussi, le compte
  notionnel porte le forfait versé, part de base et part complémentaire de
  D. 613-6, et non le barème sur le revenu abattu, qui s'en écartait de +39 %
  pour le libéral de 2023, sans part complémentaire jusqu'au 30 juin 2024, de
  +13 à +15 % pour la Cipav de 2023 à 2025, de +5 % puis -3 % pour la vente
  et les services de 2025 et 2026 (le 16 octobre 2026). Depuis le 17 octobre
  2026, la table remonte à 2018 : les clefs de la Cnav, 40,31 % du forfait de
  la vente au régime de base et 15,94 % au RCI, 40,36 et 15,91 % des
  services, 53,23 % et rien du libéral, valident et cotisent (le revenu
  validant de la vente, 1,0024 fois le revenu abattu ; 535,58 € au régime de
  base pour 6 032 € de services en 2020, contre 535,34 € au barème) ; la
  Cipav cotise depuis 2019 sa part de D. 131-5-3, puis de D. 613-6. Depuis le
  18 octobre 2026, le revenu annuel moyen porte ce revenu cotisé, et non le
  revenu abattu : 40 000 € de ventes portent au compte 11 586 € en 2023 et
  11 963 € en 2026, au lieu de 11 600 € ; en 2009, sur une année civile
  entière, au moins la cotisation d'un trimestre, sur 200 heures de SMIC
  (3 000 € de ventes : 1 742 €, au lieu de 870 €). Les quatre témoins du
  micro-entrepreneur de l'Assurance retraite gagnent de 0,19 à 1,21 % au
  scénario 1 ; ceux de la Cipav, liquidés en points, ne bougent pas. Depuis le
  18 octobre 2026 aussi, de 2017 à 2019, les trimestres se comptent aux seuils
  que la caisse publie : 4 085 € de ventes en valident un en 2018, au lieu de
  5 099 € à la clef ; 3 510 € en 2017, au lieu de 5 049 € de revenu abattu ;
  mais le libéral de 2018, dont le forfait passe moins vite la maladie, en
  demande 9 550 € pour le quatrième, au lieu de 8 986 €. Aucun témoin ne bouge,
  aucun n'ayant de petit chiffre d'affaires ces années-là. Depuis le
  18 octobre 2026 encore, ses points s'achètent avec son forfait, aux années
  qui en ont la répartition, et non au barème sur son revenu abattu : le
  libéral de l'Assurance retraite n'a aucun point de RCI de 2018 au 30 juin
  2024, au lieu de 95 en 2023 à 40 000 € de recettes ; 12 100 € de ventes en
  2026 en achètent 13,53, au lieu de 13,08 (service-public, F23369 :
  « 13,53 », que la caisse compte 13) ; 48 000 € de recettes à la Cipav,
  359,25 et 3,22 points de CNAVPL, au lieu de 367,16 et 3,30 (la caisse :
  « 359,37 » et 3,22), et 3 418,75 € à sa complémentaire, au lieu de
  3 545,78 €. Au scénario 1, le libéral de l'Assurance retraite perd 6,55 %,
  la Cipav 3,57 %, la Cipav de petites recettes 12,48 %, dont les classes
  passaient le forfait de 2019 à 2022 ; la vente et les services gagnent de
  0,35 à 0,49 %. Sa nouvelle pension en cumul porte aussi son revenu
  cotisé, et non son revenu abattu. De 2009 à
  2015, la compensation de l'État : un trimestre au moins en 2009, sur l'année
  civile entière (3 000 € de ventes, rien auparavant) ; rien sous 200 heures
  de SMIC en 2014 (6 500 € de
  ventes, un trimestre auparavant), sous 300 en 2015 (7 000 €). Ces seuils
  sont sous les bornes de la saisie (0,1 fois le salaire moyen) : seul le
  modèle les atteint. Approchée sur neuf points : en 2016, ni seuil ni clef
  n'est publié, le revenu abattu valide, et le compte porte le barème, comme
  en 2017 ; de 2017 à 2019, le revenu annuel moyen garde la clef (2018, 2019)
  ou le revenu abattu (2017), quand l'ordre de D. 133-4 donne à la base, sous
  11,5 % du plafond, jusqu'à la cotisation de trois trimestres, et au RCI ce
  qui reste après elle et l'invalidité-décès ; la
  Cipav valide sur le revenu abattu avant 2023, la règle de la CNAVPL n'étant
  pas lue ; les clefs de janvier à septembre 2022 sont celles de 2021 ; en
  2014 et 2015, qui ne relève pas de la maladie du RSI (le salarié, l'assuré
  au RSA) validait dès 150 heures, et le compte garde le barème sous le
  seuil ; l'abattement minimal de 305 € n'est pas opposé ; les points du RCI
  gardent leurs décimales, que la caisse arrondit à l'entier, au plus proche
  pour la circulaire Cnav n° 2025-20 (« 11,92 = 12 points »), à l'inférieur
  pour service-public (« 13,53 arrondi à l'entier inférieur 13 ») ; l'exonération de début
  d'activité (D. 131-6-3) n'est pas portée ; l'année prend la moyenne de ses
  mois, sans les arrondis trimestriels de la caisse. Une seule activité pour
  toute la carrière.
sources:
  lu_le: 2026-10-18
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Les clefs de 2016 et de 2017 (taux globaux de 13,4 % et 23,1 %, circulaires
    RSI n° 2015/006, point D, et n° 2015/007), et celles de janvier à septembre 2022, qu'aucune source
    lue ne donne : une circulaire du RSI ou de l'Acoss, ou la convention qui
    les fixait. En 2016 et 2017, D. 133-4 affecte le forfait par ordre, et
    non par clef : il n'y en a peut-être pas. La règle de la CNAVPL pour la
    Cipav avant octobre 2022 : valide-t-elle sur la part de D. 131-5-3 et de
    D. 613-6, comme la Cnav ?
  - >-
    De 2016 à 2019, la part de base que l'ordre de D. 133-4 donne, pour le
    revenu annuel moyen et le compte, et 2016, sans seuils publiés. Les
    seuils de 2017 à 2019 se refont, à 6 € près en 2017 et à 18 € en 2018 et
    2019, en servant d'abord la CSG et la CRDS, sur le revenu abattu et les
    cotisations dues, la base et l'invalidité-décès sur au moins 11,5 % du
    plafond ; puis la maladie, au taux de D. 612-5 et aux indemnités
    journalières en 2017, au taux de D. 621-2 pris à 40 % du plafond (4,018 %)
    en 2018 et 2019 ; puis la base, jusqu'à sa cotisation due. Aucun texte lu
    ne dit que la caisse calcule ainsi : une circulaire de l'Acoss ou de la
    Sécurité sociale des indépendants, de 2016 à 2019, le dirait. La clef de la
    circulaire Cnav n° 2025-20, titrée « 2018 à 2020 », s'en écarte en 2018 et
    en 2019 : la caisse ne l'applique qu'aux exemples de 2020 et de 2021.
  - >-
    D. 131-6-3, la fraction du taux pendant l'exonération de début d'activité,
    que les circulaires n° 2023-4 et n° 2026-12 neutralisent pour les droits.
