schema_version: 1
id: micro_social_abattement
intitule: >-
  Les droits du micro-entrepreneur se calculent sur son chiffre d'affaires ou ses
  recettes après un abattement de 71 % pour la vente de marchandises, de 50 % pour
  les services commerciaux ou artisanaux, de 34 % pour les recettes libérales
  (L. 613-7, II ; L. 133-6-8 jusqu'en 2017) ; celui des professions que la Cipav
  garde relève de la CNAVPL et de la Cipav, au même abattement de 34 % (D. 613-4,
  b). Ses trimestres se valident sur le revenu que sa cotisation achète : le
  chiffre d'affaires fois le taux global (D. 613-4), fois la part de base
  (D. 613-6), divisé par le taux de base (D. 633-3, ou la première tranche de
  la CNAVPL), comparé à 150 SMIC horaires (circulaire Cnav n° 2024-23). Sa
  cotisation de retraite est la part du taux global que D. 613-6 affecte au
  régime de base et à la complémentaire ; avant le décret n° 2022-1529, la
  clef que la Cnav applique (circulaire n° 2025-20). De 2009 à 2015, l'État
  compense ce que le forfait ne verse pas, au-dessus d'un seuil de 200 heures
  de SMIC, de 300 en 2015 (L. 133-6-8-2, D. 131-6-4), et garantit un
  trimestre en 2009.
etat: approchee
etape: acquerir_les_droits
effet: >-
  Le micro-entrepreneur saisit son chiffre d'affaires mensuel et son activité
  (champ « micro »), que la saisie abat avant de le donner au modèle : 3 000 € de
  ventes valent un revenu de 870 €. Sans activité dite, le revenu saisi reste lu
  comme déjà abattu, ce qu'il était avant le 14 octobre 2026. Depuis 2023, les
  trimestres se valident sur le revenu cotisé (`legislation/micro_social.yaml`,
  par activité et par année), sans assiette minimale : 12 100 € de ventes en
  2026 en valident deux, et non un ; 2 793 € de recettes à la Cipav, un, et non
  les trois de l'assiette minimale du libéral (tests/test_micro_social.py, sur
  les exemples de F23369 et de la circulaire). Depuis 2023 aussi, le compte
  notionnel porte le forfait versé, part de base et part complémentaire de
  D. 613-6, et non le barème sur le revenu abattu, qui s'en écartait de +39 %
  pour le libéral de 2023, sans part complémentaire jusqu'au 30 juin 2024, de
  +13 à +15 % pour la Cipav de 2023 à 2025, de +5 % puis -3 % pour la vente
  et les services de 2025 et 2026 (le 16 octobre 2026). Depuis le 17 octobre
  2026, la table remonte à 2018 : les clefs de la Cnav, 40,31 % du forfait de
  la vente au régime de base et 15,94 % au RCI, 40,36 et 15,91 % des
  services, 53,23 % et rien du libéral, valident et cotisent (le revenu
  validant de la vente, 1,0024 fois le revenu abattu ; 535,58 € au régime de
  base pour 6 032 € de services en 2020, contre 535,34 € au barème) ; la
  Cipav cotise depuis 2019 sa part de D. 131-5-3, puis de D. 613-6. De 2009 à
  2015, la compensation de l'État : un trimestre au moins en 2009, sur l'année
  civile entière (3 000 € de ventes, rien auparavant) ; rien sous 200 heures
  de SMIC en 2014 (6 500 € de
  ventes, un trimestre auparavant), sous 300 en 2015 (7 000 €). Ces seuils
  sont sous les bornes de la saisie (0,1 fois le salaire moyen) : seul le
  modèle les atteint. Approchée sur huit points : en 2016 et 2017, aucune
  clef n'est lue, le revenu abattu valide et le compte porte le barème ; la
  Cipav valide sur le revenu abattu avant 2023, la règle de la CNAVPL n'étant
  pas lue ; les clefs de janvier à septembre 2022 sont celles de 2021 ; en
  2014 et 2015, qui ne relève pas de la maladie du RSI (le salarié, l'assuré
  au RSA) validait dès 150 heures, et le compte garde le barème sous le
  seuil ; l'abattement minimal de 305 € n'est pas opposé ; les points du RCI
  se calculent au barème, non sur la part du forfait, et le revenu cotisé
  n'entre pas dans le salaire annuel moyen ; l'exonération de début
  d'activité (D. 131-6-3) n'est pas portée ; l'année prend la moyenne de ses
  mois, sans les arrondis trimestriels de la caisse. Une seule activité pour
  toute la carrière.
sources:
  lu_le: 2026-10-17
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Les clefs de 2016 et de 2017 (taux globaux de 13,4 % et 23,1 %, circulaire
    RSI n° 2015/007), et celles de janvier à septembre 2022, qu'aucune source
    lue ne donne : une circulaire du RSI ou de l'Acoss, ou la convention qui
    les fixait. La règle de la CNAVPL pour la Cipav avant octobre 2022 :
    valide-t-elle sur la part de D. 131-5-3 et de D. 613-6, comme la Cnav ?
  - >-
    Le salaire annuel moyen : la circulaire n° 2024-23 détermine « les droits »
    par le forfait payé, L. 613-7, II par le chiffre d'affaires abattu ; la
    circulaire RSI n° 2010/034 (point III, B) reconstitue le revenu du RAM sur
    la cotisation et la compensation. Lire ce que la caisse reporte au compte.
  - >-
    D. 131-6-3, la fraction du taux pendant l'exonération de début d'activité,
    que les circulaires n° 2023-4 et n° 2026-12 neutralisent pour les droits.
  lectures:
  - type: legifrance
    reference: >-
      L. 613-7 CSS, LEGIARTI000037061904 (2018), LEGIARTI000046193899 (2022) et
      LEGIARTI000048683570 (en vigueur depuis le 28 décembre 2023), II : « Les
      prestations attribuées aux personnes mentionnées au présent article sont
      calculées sur la base de leur chiffre d'affaires ou de leurs recettes après
      application d'un taux d'abattement de 71 % […], de 50 % […] et de 34 % »,
      lus dans l'index LEGI du dépôt
    date: 2026-10-14
  - type: legifrance
    reference: >-
      D. 613-4 CSS, LEGIARTI000052218738 (en vigueur depuis le 1er janvier 2026) :
      la section de la Cipav (R. 641-1, 11°) à 34 % d'abattement et 23,2 % de taux
      global, la vente à 71 % et 12,3 %, les services à 50 % et 21,2 %, le libéral
      de la Sécurité sociale des indépendants à 34 % et 25,6 %
    date: 2026-10-14
  - type: legifrance
    reference: >-
      CGI, 50-0 (LEGIARTI000018026446, 2008) : abattements de 71 % et 50 %, « ne
      peuvent être inférieurs à 305 euros » ; 102 ter (LEGIARTI000006302649,
      2006-2008) : réfaction de 34 %, minimum 305 €
    date: 2026-10-14
  - type: legifrance
    reference: >-
      D. 613-6 CSS, LEGIARTI000046714699 (10 décembre 2022), LEGIARTI000049625264
      (1er juillet 2024), LEGIARTI000049625405 (2025), LEGIARTI000052218747
      (2026) : la part de base, 41,80 % puis 43,45 % pour la vente et les
      services, 55,50 %, 50,75 %, 47,60 % puis 46,40 % pour le libéral, 26,00 %,
      23,45 % puis 24,30 % (première tranche) pour la Cipav ; D. 613-4 dans ses
      versions de 2022 à 2026 ; D. 633-3, LEGIARTI000041967101 et
      LEGIARTI000049904636 (17,75 % puis 17,87 % depuis 2025)
    date: 2026-10-14
  - type: legifrance
    reference: >-
      D. 613-6 CSS, les mêmes versions et LEGIARTI000049623885 (1er juin 2024),
      relues pour la part complémentaire : 16,50 % puis 19,75 % pour la vente
      et les services ; aucune pour le libéral jusqu'au 30 juin 2024, puis
      7,85 %, 13,00 % et 21,00 % ; 20,75 %, 25,60 % puis 30,70 % pour la Cipav,
      avec la seconde tranche de la CNAVPL, 5,30 %, 5,35 % puis 5,20 %. En
      note de LEGIARTI000046714699 : la décision n° 471203 du Conseil d'État
      du 9 février 2024 annule, au 1er juin 2024, la rédaction de 2022 « en
      tant qu'[elle n'inclut] pas une cotisation au titre du régime
      complémentaire obligatoire », ses effets passés étant « regardés comme
      définitifs ». Les rédactions de 2020 (LEGIARTI000041967529) et de 2021
      (LEGIARTI000043656780) ne répartissent que le forfait de la Cipav
    date: 2026-10-16
  - type: circulaire_cnav
    reference: >-
      Circulaire Cnav n° 2024-23 du 16 juillet 2024, « Les modalités de
      détermination des droits à la retraite des travailleurs indépendants
      relevant du dispositif micro-social », point 4 : revenu cotisé = parts du
      forfait affectées au régime de base / taux de cotisation de base, comparé à
      150 SMIC horaires ; exemples de 2023 (6 220 € de ventes, un trimestre) et de
      2024
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2024_23_16072024.pdf
    date: 2024-07-16
  - type: service_public
    reference: >-
      « Régime de retraite du micro-entrepreneur », F23369, vérifié le 1er avril
      2026 : les professions affiliées à la Cipav, et la validation des
      trimestres par le versement, avec ses exemples de 2026 (12 100 € : deux
      trimestres pour la vente, trois pour les services, quatre pour le libéral ;
      2 792 € par trimestre à la Cipav)
    url: https://entreprendre.service-public.gouv.fr/vosdroits/F23369
    date: 2026-04-01
  - type: legifrance
    reference: >-
      L. 133-6-8-2 CSS, LEGIARTI000021538000 (2009-2015) : sous un revenu abattu
      que fixe un décret, l'auto-entrepreneur « n'entre pas dans le champ de la
      compensation assurée par l'État » ; D. 131-6-4, LEGIARTI000022402023 et
      LEGIARTI000030034478 : 200 heures de SMIC, 300 en 2015. D. 131-5-1,
      LEGIARTI000036466353 : 12,8 %, 22 % et, pour la Cipav, 22 % de 2018 à
      2020 ; D. 613-4, LEGIARTI000041918199 et LEGIARTI000043656794 (22,2 % pour
      la Cipav du 1er juillet 2021). D. 131-5-3, LEGIARTI000037798349 (décret
      n° 2018-1120, en vigueur le 13 décembre 2018), puis D. 613-6 : la Cipav,
      25 % à la première tranche, 5 % à la seconde, 20 % à la complémentaire,
      puis 24,80, 5 et 19,80 %. D. 633-3, LEGIARTI000031799496 : 17,15 % +
      0,60 % depuis 2017. Lus dans l'index LEGI du dépôt
    date: 2026-10-17
  - type: circulaire_cnav
    reference: >-
      Circulaire Cnav n° 2023-4 du 13 février 2023, points 2.1 et 3 : les taux
      globaux du 1er janvier 2018 au 30 septembre 2022 (12,80 %, 22 %, 22 %) ;
      D. 613-6 répartissait « exclusivement » le forfait de la Cipav avant le
      décret n° 2022-1529. Circulaire Cnav n° 2025-20 du 31 juillet 2025,
      annexe 1, exemples 1 et 2 : les « Clefs de répartition » de 2018 à 2021
      (au régime de base 40,31, 40,36 et 53,23 % ; au RCI 15,94, 15,91 et 0 %)
      et les droits de 2020 et de 2021, revenu cotisé et points
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2025_20_31072025.pdf
    date: 2025-07-31
  - type: autre
    reference: >-
      Circulaires du RSI, au site de la Cnav : n° 2009/024 (un trimestre au
      moins en 2009, à l'année civile entière), n° 2010/034 (point III : la
      compensation, rien sous 200 heures de SMIC depuis 2010, le revenu
      théorique au-delà), n° 2015/007 (point 2 : 300 heures en 2015, deux
      trimestres), n° 2016/010 (point 1 : en 2014, le premier trimestre à 200
      heures pour qui relève de la maladie du RSI, à 150 pour les autres ; la
      compensation supprimée en 2016)
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_rsi_2016_010_15062016.pdf
    date: 2016-06-15
textes_a_rattacher:
