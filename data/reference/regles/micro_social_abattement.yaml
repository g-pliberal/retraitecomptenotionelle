- reference: code de la sécurité sociale, L. 133-6-8 (de 2009 à 2017)
- reference: code de la sécurité sociale, D. 613-4 (LEGIARTI000052218738)
- reference: code de la sécurité sociale, D. 613-6 (LEGIARTI000052218747)
- reference: >-
    décret n° 2018-1120 du 10 décembre 2018, le micro-social des libéraux de la
    Cipav (LEGITEXT000037798308)
- reference: code de la sécurité sociale, L. 133-6-8-2 et D. 131-6-4 (de 2010 à 2015)
- reference: code de la sécurité sociale, D. 131-5-1 et D. 131-5-3 (de 2018 à 2020)
code:
  python: >-
    saisie.py : ACTIVITES_MICRO, ABATTEMENTS_MICRO, Saisie.en_chiffre_d_affaires et
    Saisie.abattu, appelée par parcours et emploi_retraite_declare ;
    carriere.py : Metier.micro, AnneeCarriere.micro, _revenu_validant ;
    donnees/chargement.py : charger_validation_micro, charger_cotisation_micro,
    forfait_micro, charger_compensation_micro, validant_compense ;
    moteur/compte.py : ConstructeurCompte._cotisation_ligne
  javascript: moteur/js/saisie.js (enChiffreDAffaires, abattu) ; moteur/js/pages.js
    (microFormulaire, champChiffreDAffaires) ; moteur/js/carriere.js
    (revenuValidant, validantCompense, forfaitMicro, paquets validation_micro,
    cotisation_micro et compensation_micro) ; moteur/js/compte.js (_cotisationLigne)
  tests: >-
    tests/test_web_saisie.py ; tests/test_micro_social.py ; témoins
    micro_entrepreneur_* et simuler_micro_entrepreneur*
