schema_version: 1
id: agirc_arrco_valeur_achat
intitule: >-
  La valeur d'achat du point Agirc-Arrco, qui convertit en points la cotisation de
  l'année, évolue chaque 1er janvier comme le salaire annuel moyen des ressortissants du
  régime estimé pour l'année précédente ; au-delà du dernier barème publié, le modèle
  prolonge le dernier salaire de référence par le salaire moyen du modèle, avec un an de
  retard, et la valeur de service qui sert ces points par les prix.
domaine: points
regimes: [agirc_arrco]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- la cotisation de chaque année au régime, et son année
- le dernier salaire de référence publié et le taux d'appel (regimes/valeurs_point.csv)
- la croissance nominale du salaire moyen par tête du modèle (macro/salaire_moyen.csv, puis
  le scénario de projection de macro/hypotheses_projection.yaml)
- le prolongement que regimes/prolongement_points.csv déclare
ecrit:
- les points Agirc-Arrco des années postérieures au dernier barème publié, achetés au
  salaire de référence prolongé
dates_qui_decident:
- revenu.annee
versions:
