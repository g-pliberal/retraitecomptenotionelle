- id: salaire_moyen_2023_2026
  statut: lue
  textes:
  - id: KALITEXT000048674954
    reference: >-
      accord national interprofessionnel du 5 octobre 2023 relatif à la retraite
      complémentaire Agirc-Arrco, étendu et élargi par arrêtés du 18 décembre 2023 (JORF du
      9 janvier 2024), lu sur Légifrance
    article: article 5, « Valeur d'achat du point »
    en_vigueur: 2023-01-01
    citation: >-
      « La valeur d'achat du point évolue au premier janvier de chaque année 2023 à 2026
      comme le salaire annuel moyen des ressortissants du régime tel qu'estimé pour
      l'exercice précédent. En conséquence, elle est fixée : – pour 2023 à 18,7669 € ; –
      pour 2024 à 19,6321 €. En aucun cas pendant cette période 2023 à 2026, la valeur
      d'achat du point ne peut diminuer en valeur absolue. » (5.1) ; « Le conseil
      d'administration fixe, pour les années 2025 et 2026, la valeur d'achat du point dans
      le respect des orientations stratégiques définies au point 5.1 et des règles
      suivantes : En cas d'écart entre la prévision de l'année ou des années précédente(s)
      et l'évolution constatée du salaire annuel moyen des ressortissants du régime, il
      est procédé à un rattrapage. » (5.2)
    lu_le: 2026-10-04
  - id: KALITEXT000048674954
    reference: même accord, annexe 1, « Hypothèses d'indexations retenues »
    article: annexe 1
    citation: >-
      « Indexation de la valeur d'achat sur l'évolution du salaire moyen. Indexation de la
      valeur de service : – 2023 : + 4,9 % ; – 2024-2026 : inflation hors tabac – 0,4 % ;
      – 2027-2037 : Salaire moyen – 1,16 %. »
    lu_le: 2026-10-04
  - reference: >-
      Agirc-Arrco, communiqué de presse du 17 octobre 2025, « Les retraites
      complémentaires Agirc-Arrco ne seront pas revalorisées » (hors JORF)
    article: communiqué
    en_vigueur: 2026-01-01
    citation: >-
      « Ce 17 octobre, faute d'accord entre les représentants des organisations patronales
      et syndicales qui le composent, les retraites complémentaires Agirc-Arrco ne seront
      pas revalorisées au 1er novembre 2025. La valeur d'achat du point Agirc-Arrco ne sera
      pas modifiée au 1er janvier 2026. »
    lu_le: 2026-10-04
    empreinte: sha256:a97f2c387043cd3ef8dc8506f9b719b0786ad70d8691b41f4241ae103a6f87ff
  - reference: >-
      circulaire Agirc-Arrco 2025-15-DT, « Paramètres du régime 2025-2026 » (hors JORF),
      celle qui applique la décision du conseil d'administration du 17 octobre 2025
    article: circulaire
    en_vigueur: 2026-01-01
    citation: >-
      « La valeur d'achat du point est également inchangée ; elle demeure fixée à
      20,1877€ pour l'exercice 2026 » ; « La valeur de service du point est inchangée au
      1er novembre 2025 ; elle reste fixée à 1,4386€ » ; « Le montant du plafond des
      majorations pour enfants nés ou élevés reste fixé à 2 367,48 € »
    lu_le: 2026-10-05
    empreinte: sha256:2e34ce291edcfa5e9d21bf0b80e7c30d8889f7342ee8b5dae4463801ad04b288
  - reference: >-
      accord national interprofessionnel du 17 novembre 2017 et circulaire Agirc-Arrco
      2025-16-SG-DRJ, « Paramètres 2026 » (hors JORF) : les points se calculent au « taux
      de calcul » de 6,20 % sur la tranche 1 et de 17 % sur la tranche 2, la cotisation
      étant appelée à « 127% du taux de calcul » (7,87 % et 21,59 %) ; livret n° 3 de la
      fédération, « Cotisations et points » (mai 2024), pages 16 à 19
    article: circulaire et guide
    citation: >-
      « 29 538 6,20 % 1 831,36 € » ; « 1 831,36 18,7669 97,58 points Agirc-Arrco » ;
      « 2 874,82 19,6321 146,43 points Agirc-Arrco » ; « 3 910 19,6321 199,16 points
      Agirc-Arrco »
    lu_le: 2026-10-05
    empreinte: sha256:70923aee80b981a778dabed49a3b510147d6f1c0406cb5f6e46be9af9c11c0da
  bornes:
    revenu.annee: [2023-01-01, 2027-01-01]
  contenu:
    droit: >-
      La même règle, de 2023 à 2026, avec un plancher : la valeur d'achat ne baisse pas,
      et un rattrapage corrige la prévision du salaire moyen. Barèmes publiés, dans
      regimes/valeurs_point.csv : 18,7669 € en 2023, 19,6321 € en 2024, 20,1877 € en 2025,
      et 20,1877 € en 2026, que le conseil d'administration a laissé inchangé faute
      d'accord, le 17 octobre 2025, en même temps qu'il gelait la valeur de service à
      1,4386 €. Le gel de 2026 n'applique pas la règle de l'article 5.1 : il est le
      barème, et le modèle le lit.
    parametres:
      prix_du_point: >-
        le salaire de référence publié de l'année ; les points valent l'assiette au taux
        de calcul, 6,20 % et 17 % (taux_calcul_points de la fiche de régime), et non la
        cotisation appelée, arrondie, divisée par 127 %
      # Le facteur que l'annexe 1 retire au salaire moyen pour projeter la valeur
      # de service de 2027 à 2037 : une hypothèse de projection financière, que
      # le modèle ne suit pas (voir les lectures divergentes).
      soutenabilite_valeur_service_projetee: 0.0116
  exemples: [aa_livret3_points_2023, aa_livret3_points_2024_deux_tranches]
- id: salaire_moyen_au_dela_du_bareme
  statut: supposee
  nee_de: KALITEXT000048674954
  hypothese: >-
    le dernier texte reste en vigueur. L'accord du 5 octobre 2023 arrive à échéance le 31
    décembre 2026, et celui qui fixera les orientations de 2027 à 2030 se négocie encore
    le 4 octobre 2026 ; l'accord du 17 novembre 2017, conclu sans terme, détermine la
    valeur d'achat « en fonction du taux d'évolution du salaire moyen des ressortissants
    du régime, éventuellement corrigé d'un facteur de soutenabilité », et les deux
    accords quadriennaux l'ont fait suivre ce salaire sans correction, comme leurs
    annexes la projettent. Le modèle prolonge donc le dernier salaire de référence publié
    par la croissance du salaire moyen par tête de son scénario, celle de l'année
    précédente, sans facteur de soutenabilité ni rattrapage du gel de 2026
  fiabilite: moyenne
  textes:
  - id: KALITEXT000036731682
    reference: >-
      accord national interprofessionnel du 17 novembre 2017 instituant le régime
      Agirc-Arrco de retraite complémentaire, étendu et élargi par l'arrêté du 24 avril
      2018 (JORFTEXT000036847920), lu sur Légifrance dans sa version en vigueur
    article: article 28, « Valeur d'achat du point (prix d'acquisition d'un point de retraite) »
    en_vigueur: 2019-01-01
    citation: >-
      « La valeur d'achat du point, paramètre servant au calcul du nombre de points à
      inscrire au compte des participants salariés, est fixée par le conseil
      d'administration de la fédération dans le respect des décisions prises par les
      partenaires sociaux. Elle est déterminée en fonction du taux d'évolution du salaire
      moyen des ressortissants du régime, éventuellement corrigé d'un facteur de
      soutenabilité selon des critères définis à l'article 25 et tenant compte de la
      situation économique et du marché du travail. La valeur d'achat du point est
      déterminée, chaque année, au même moment que la valeur de service du point et prend
      effet au 1er janvier de l'année suivante. »
    lu_le: 2026-10-04
  - id: KALITEXT000048674954
    reference: accord national interprofessionnel du 5 octobre 2023, lu sur Légifrance
    article: article 10, « Dispositions finales »
    en_vigueur: 2023-01-01
    citation: >-
      « le présent accord est conclu pour une durée de quatre ans. Il arrive à échéance le
      31 décembre 2026. »
    lu_le: 2026-10-04
  bornes:
    revenu.annee: [2027-01-01, null]
  contenu:
    droit: >-
      Pour une année postérieure au dernier barème publié — 2027 et au-delà le 4 octobre
      2026 —, le salaire de référence est le dernier publié, multiplié par la croissance
      du salaire moyen par tête du modèle entre l'année qui précède le dernier barème et
      celle qui précède l'année d'acquisition : celui de 2027 suit la croissance de 2026,
      2,45 % au scénario de référence, soit 20,6823 €. Le taux d'appel reste le dernier en
      vigueur, 127 %. Les points s'achètent ainsi environ 0,7 % par an plus cher qu'aux
      prix, et la valeur de service qui les sert à la liquidation suit les prix
      (droit/liquider.py, valeur_du_point).
    parametres:
      indice: salaire_moyen
      decalage: 1
      fichier: regimes/prolongement_points.csv
  exemples: aucun trouvé
approximations:
- version: salaire_moyen_au_dela_du_bareme
  ecart: >-
    Le salaire moyen est celui du modèle — le salaire moyen par tête des comptes
    nationaux, puis la croissance de son scénario de projection, 2,45 % par an en nominal
    au scénario de référence —, non celui des ressortissants du régime, que la fédération
    estime pour ses salariés du privé et que le dépôt ne porte pas. Ni facteur de
    soutenabilité, ni rattrapage du gel de 2026, que le prochain accord peut décider.
  effet: >-
    non mesuré contre le salaire des ressortissants. Confrontée le 4 octobre 2026 à « Mon
    estimation retraite », la page achetait les points d'une carrière à plus de trente
    ans du départ comme si leur prix croissait de 0,55 à 0,6 % par an au-delà des prix ;
    le modèle les achète à 0,69 %. Sur des carrières fictives parties à 64 ans, la
    complémentaire ressort désormais de 0,5 % (née en 1975) à 2,8 % (née en 2005)
    au-dessous d'un prix croissant de 0,575 %, quand elle ressortait de 2,4 % à 15,7 %
    au-dessus
- version: salaire_moyen_au_dela_du_bareme
  ecart: >-
    La valeur de service des liquidations postérieures au dernier barème suit les prix,
    avec un an de retard, comme pour tout régime en points (valeur_du_point). L'accord du
    17 novembre 2017 la détermine « en fonction du taux d'évolution du salaire moyen des
    ressortissants du régime éventuellement corrigé d'un facteur de soutenabilité »
    (article 27), et l'annexe de l'accord du 5 octobre 2023 la projette de 2027 à 2037 au
    « Salaire moyen – 1,16 % », soit 1,29 % par an au scénario de référence, 0,46 point
    sous les prix ; « Mon estimation retraite » compte les points à leur « valeur
    actuelle ». Depuis le 5 octobre 2026 (action 147, étape 4), le modèle suit la
    convention du COR, qui reprend l'annexe jusqu'en 2037 et passe ensuite les deux
    valeurs au salaire moyen moins 0,86 % (rapport annuel de juin 2026, encadré « Le
    pilotage de l'Agirc-Arrco », p. 61) : conventions_points de
    macro/hypotheses_projection.yaml, pour la valeur de service à la liquidation, la
    valeur d'achat au-delà de 2037 et, dans les masses de la page Coût, la
    revalorisation des pensions servies. Le salaire moyen est celui du modèle, non celui
    du secteur privé ; l'inflation, l'IPC du modèle, non l'inflation hors tabac.
  effet: >-
    161 témoins de simulation du scénario 1 baissent, −1,20 % en médiane, jusqu'à −4,1 %
    pour une carrière qui liquide loin dans l'avenir ; la pension moyenne relative du
    système actuel projeté recule de 0,5 % de plus en 2070 par la liquidation, de 0,45 %
    par la revalorisation des pensions servies
sources:
  lu_le: 2026-10-05
  prochaine_relecture: 2026-10-31
  a_relire:
  - >-
    La décision du conseil d'administration attendue le 14 octobre 2026 : la valeur de
    service au 1er novembre 2026 et la valeur d'achat de 2027, « déterminée, chaque
    année, au même moment que la valeur de service du point » (article 28). Publiée, la
    valeur d'achat de 2027 entre dans regimes/valeurs_point.csv par le récupérateur de la
    fédération (scripts/fetch/agirc_arrco_valeurs_point.py), et le prolongement part de
    2028.
  - >-
    L'accord national interprofessionnel de 2027 à 2030, dès sa signature : s'il corrige
    la valeur d'achat d'un facteur de soutenabilité, rattrape le gel de 2026 ou indexe
    autrement la valeur de service, la version supposée se coupe, et prolongement_points.csv
    suit.
  - >-
    Le salaire annuel moyen des ressortissants du régime, que la fédération estime et que
    ses accords citent : une série publiée permettrait de mesurer ce que le salaire moyen
    par tête du modèle en écarte.
  lectures_divergentes:
  - >-
    La valeur de service au-delà de 2026. L'accord du 17 novembre 2017 la fait déterminer
    en fonction du salaire moyen des ressortissants, « éventuellement corrigé d'un facteur
    de soutenabilité » (article 27) ; l'annexe 1 de l'accord du 5 octobre 2023 la projette
    au « Salaire moyen – 1,16 % » de 2027 à 2037, comme celle du 10 mai 2019 de 2023 à
    2033 ; « Mon estimation retraite » compte les points à leur « valeur actuelle », ce
    qui revient à une valeur de service qui suit les prix ; le modèle la prolonge par les
    prix. Aucune source ne tranche : le facteur n'est pas encore décidé, et l'annexe est
    une hypothèse de projection financière, non une règle. Le scénario 1 gardait les
    prix, la convention du simulateur officiel, et le disait (§ 3.3, point 5). Le 5
    octobre 2026, le propriétaire a demandé que la page Coût soit « indiscutable » et
    que la projection suive les conventions du COR : le scénario 1 prend désormais
    celle du COR, que l'annexe de l'accord de 2023 fonde jusqu'en 2037, et qui reste
    une hypothèse, que la fédération dit « purement conventionnelle ».
  lectures:
  - type: legifrance
    reference: >-
      accord national interprofessionnel du 17 novembre 2017 instituant le régime
      Agirc-Arrco, articles 25 à 29 (« Pilotage »), version en vigueur sur Légifrance
      (KALITEXT000036731682) : article 27, la valeur de service « déterminée en fonction du
      taux d'évolution du salaire moyen des ressortissants du régime éventuellement corrigé
      d'un facteur de soutenabilité », revalorisée au 1er novembre ; article 28, la valeur
      d'achat, de même, avec effet au 1er janvier de l'année suivante
    date: 2017-11-17
    url: https://www.legifrance.gouv.fr/conv_coll/id/KALITEXT000036731682
  - type: autre
    reference: >-
      accord national interprofessionnel du 10 mai 2019 sur la retraite complémentaire
      Agirc-Arrco : article 1er, la valeur de service sur le salaire moyen moins un facteur
      de soutenabilité, au moins comme les prix ; article 2, la valeur d'achat ; article
      6.4, le conseil d'administration la fixe chaque année ; annexe 1, les deux
      indexations projetées (copie datée,
      sha256:0f239c783c1a328ba15022f27f961beabead8ab29c76346986312edaccd3f5b3)
    date: 2019-05-10
    url: https://www.agirc-arrco.fr/wp-content/uploads/2021/11/Accord_national_interprofessionnel_10052019.pdf
  - type: legifrance
    reference: >-
      accord national interprofessionnel du 5 octobre 2023 relatif à la retraite
      complémentaire Agirc-Arrco, sur Légifrance (KALITEXT000048674954) : article 4, la
      valeur de service 2024-2026 « comme les prix à la consommation hors tabac estimée pour
      l'année en cours moins un facteur de soutenabilité de 0,40 point », « Par exception à
      l'application de l'article 27 de l'ANI du 17 novembre 2017 » ; article 5, la valeur
      d'achat ; article 10, l'échéance du 31 décembre 2026 ; annexe 1, les indexations
      projetées jusqu'en 2037
    date: 2023-10-05
    url: https://www.legifrance.gouv.fr/conv_coll/id/KALITEXT000048674954
  - type: autre
    reference: >-
      Agirc-Arrco, communiqué de presse du 17 octobre 2025 : ni revalorisation au 1er
      novembre 2025, ni changement de la valeur d'achat au 1er janvier 2026, faute
      d'accord au conseil d'administration (copie datée,
      sha256:a97f2c387043cd3ef8dc8506f9b719b0786ad70d8691b41f4241ae103a6f87ff)
    date: 2025-10-17
    url: https://www.agirc-arrco.fr/storage/20251017_CP_Revalorisation-valeur-du-point-Agirc-Arrco.pdf
  - type: autre
    reference: >-
      presse spécialisée de septembre 2026 (Meilleurtaux Placement, 28 septembre 2026) : le
      conseil d'administration décide de la revalorisation le 14 octobre 2026, et l'accord
      de 2027 à 2030 n'est pas conclu ; aucune règle nouvelle pour la valeur d'achat
    date: 2026-09-28
    url: https://placement.meilleurtaux.com/retraite/actualites/2026-septembre/agirc-arrco-quels-scenarios-de-hausse-au-1er-novembre-2026.html
  - type: autre
    reference: >-
      « Mon estimation retraite » (simulateur 27.50.5 d'info-retraite), confrontée le 4
      octobre 2026 à une carrière réelle à plus de trente ans du départ (feuille de route,
      action 142, étape 2) : la retraite de base concorde à l'euro ; les points
      Agirc-Arrco de la page se retrouvent à un demi pour cent près avec un prix d'achat
      qui croît de 0,55 à 0,6 % par an au-delà des prix, et la complémentaire du modèle,
      qui gardait le rendement de 2026, ressortait de 8,8 à 9,0 % au-dessus
    date: 2026-10-04
    url: https://www.info-retraite.fr/portail-services/sir
code:
  python: >-
    donnees/macro.py : DonneesMacro.coefficient_salaire_moyen ; scenarios/actuel.py :
    ValeursPoint.achat_prolonge, qui lit regimes/prolongement_points.csv ;
    droit/acquerir.py : acquerir, les points de chaque année ; droit/seconde.py :
    _prix_du_point, ceux de la seconde pension, qui suivaient le plafond de la sécurité
    sociale ; droit/liquider.py : valeur_du_point, la valeur de service prolongée par
    ValeursPoint.indice_convenu ; revalorisation.py :
    RevalorisationServie.coefficient_points et cout.py : coefficient_actuel, les pensions
    servies
  javascript: >-
    moteur/js/macro.js : coefficientSalaireMoyen ; moteur/js/regimes.js :
    ValeursPoint.achatProlonge et indiceConvenu ; moteur/js/droit/acquerir.js : acquerir ;
    moteur/js/droit/seconde.js : prixDuPoint ; le paquet porte prolongement_points
    (scripts/construire_donnees.py)
  parametres: >-
    regimes/prolongement_points.csv : agirc_arrco, salaire_moyen, décalage d'un an,
    fiabilité moyenne ; les salaires de référence et le taux d'appel publiés de
    regimes/valeurs_point.csv ; la croissance du salaire moyen de macro/salaire_moyen.csv
    et de macro/hypotheses_projection.yaml. La ligne agirc_arrco 2027-2100 de
    regimes/rendements_points.csv ne sert plus que de filet
  tests: >-
    tests/test_simulateur.py :
    test_le_prix_d_achat_agirc_arrco_suit_le_salaire_moyen_au_dela_du_bareme,
    test_les_annees_apres_le_dernier_bareme_agirc_arrco_ont_des_points,
    test_le_prix_du_point_n_est_pas_prolonge_au_dela_du_publie ; les témoins de simulation,
    que le portage rejoue
historique:
- >-
  2026-10-05 — la convention du COR (action 147, étape 4) : la valeur de service suivait
  les prix au-delà du dernier barème, avec un an de retard ; elle suit le salaire moyen
  moins 1,16 point de 2027 à 2037, moins 0,86 ensuite, sur l'année en cours, et la
  valeur d'achat le salaire moyen moins 0,86 point dès 2038.
- >-
  Jusqu'au 4 octobre 2026, les cotisations des années postérieures au dernier barème
  publié passaient par le rendement instantané du dernier barème, 5,61 % (fiche
  ircantec_valeurs_point) : un prix d'achat et une valeur de service qui suivaient tous
  deux les prix. La confrontation à « Mon estimation retraite » (action 142, étape 2) a
  montré l'écart, et les accords l'ont tranché.
- >-
  2026-10-05 — les points au taux de calcul (action 89) : le livret n° 3 de la
  fédération compte 97,58 points pour 29 538 € en 2023, le modèle en rendait 97,53, la
  cotisation appelée de 7,87 % divisée par 127 % faisant 6,197 % au lieu de 6,20 % ;
  deux exemples, sur les deux tranches, concordent.
effet: >-
  Toute carrière qui cotise à l'Agirc-Arrco après 2026 : ses points de ces années coûtent
  le salaire moyen et non les prix, environ 0,7 % de plus par année d'écart à 2026. Sur
  des carrières fictives entrées à 22 ans et parties à 64, la complémentaire baisse de 2,8
  % pour une salariée non cadre née en 1975, de 7,6 % pour 1990 et de 14,6 % pour 2005 —
  de 3,2 %, 8,6 % et 16,0 % pour une cadre —, la pension totale de 0,4 % à 4,1 % ; rien ne
  bouge pour qui a liquidé avant 2027.
