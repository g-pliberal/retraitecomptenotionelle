textes_a_rattacher:
- reference: L. 351-1 CSS, deuxième alinéa, dont R. 351-27 est l'application
code:
  interrupteurs:
    decote_par_generation: true
  moteur: >-
    Le moteur ne lit pas les paramètres des versions, que tests/test_decote_versions.py
    confronte à la table. `decote_par_generation` : le coefficient de minoration est lu dans `legislation/coefficient_minoration.csv`
    à l'ANNÉE DE NAISSANCE. La table de l'article R. 351-27 vaut aussi bien pour l'ancien
    droit (2,5 % par trimestre) que pour la montée en charge de la loi Fillon (jusqu'à
    1,25 % à partir de la génération 1953) : elle se branche donc sur toutes les périodes
    des régimes alignés depuis 1983.
  javascript: >-
    moteur/js/droit/liquider.js : liquiderChaqueRegime, decoteOpposable,
    trimestresDeDecote, auTrimestreSuperieur ; moteur/js/droit/ouvrir.js :
    ageTauxPlein ; moteur/js/regimes.js : CoefficientsMinoration
  parametres: >-
    regimes/cancava.yaml, regimes/cancava_avant_1973.yaml, regimes/cavimac.yaml,
    regimes/cps_saint_pierre_et_miquelon.yaml, regimes/msa_salaries.yaml,
    regimes/nric.yaml, regimes/organic.yaml, regimes/organic_avant_1973.yaml,
    regimes/rci.yaml, regimes/rco_artisans.yaml, regimes/regime_general.yaml,
    regimes/rsi.yaml : decote_par_trimestre, taux_plein, age_taux_plein,
    duree_requise_trimestres ; legislation/coefficient_minoration.csv : coefficient ;
    contenu.parametres de chaque version : coefficient, age_du_decompte
  tests: [tests/test_decote_versions.py, tests/test_simulateur.py, tests/test_oracle.py, tests/js/moteur.test.js,
    tests/temoins/simulations.json]
