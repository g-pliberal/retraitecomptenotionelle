schema_version: 1
id: minimum_vieillesse
intitule: >-
  ASPA différentielle sur les pensions — les françaises, et celles qu'un autre État
  sert, déclarées —, jusqu'au barème du foyer : celui d'une personne seule ; avec un
  conjoint déclaré, le plafond du couple sur les ressources des deux, la moitié de ce
  qui manque à chacun de deux allocataires, tout ce qui manque à un seul, au plus le
  montant d'une personne seule. À tous, en ligne séparée. Revalorisée sur les prix :
  L. 816-2 renvoie au coefficient de L. 161-25, moyenne annuelle des prix hors tabac,
  plancher à 1. Jusqu'en 2006, deux étages : la pension portée au montant de
  l'allocation aux vieux travailleurs salariés (L. 814-2), puis l'allocation
  supplémentaire, depuis 1956, réduite de ce que son total et les ressources dépassent
  le plafond (L. 815-8).
regimes: [avts, cancava, cancava_avant_1973, cnavpl, cps_saint_pierre_et_miquelon,
  cssm_mayotte, msa_non_salaries, msa_salaries, organic, organic_avant_1973,
  regime_general, rsi]
etat: approchee
etape: foyer_et_net
presomptions:
  ressources_du_conjoint: le plafond du couple, quand le conjoint déclaré ne dit pas ses ressources
exemples:
- sp_f16871_aspa_deux_allocataires
- sp_f16871_aspa_un_seul_allocataire
- sp_f16871_aspa_un_seul_allocataire_au_maximum
effet: >-
  Les plus petites pensions. L'allocation complète « les ressources personnelles de
  l'intéressé et du conjoint » jusqu'au plafond de L. 815-9 : celui d'une personne
  seule, ou celui du couple — marié, concubin ou partenaire d'un pacte civil de
  solidarité —, que D. 815-2 égale au montant que D. 815-1, b, sert à deux
  allocataires, par moitié (R. 815-28) ; à un seul, D. 815-1, a, ne sert au plus que
  le montant d'une personne seule. En 2026, 1 620,18 € par mois pour le couple,
  1 043,59 € pour une personne seule. Le modèle donne le barème du couple à qui
  déclare un conjoint, à compter du mariage, et compte les ressources que la saisie
  lui prête, aucune sinon ; le conjoint est allocataire à 65 ans. Il ignore, ce que
  limites.md dit : les ressources de l'assuré hors de ses pensions — revenus
  d'activité et leur abattement, patrimoine — ; l'abattement des revenus d'activité
  du conjoint (R. 815-29), dont les ressources comptent entières et au même montant
  chaque année ; l'âge abaissé du conjoint inapte ou ex-invalide, et l'allocation
  supplémentaire d'invalidité qui lui donnerait le barème du couple (D. 815-1, dernier
  alinéa) ; l'appréciation sur trois mois, ou sur douze (R. 815-29) ; la demande,
  l'allocation étant servie à tous. Avant avril 2010, le plafond d'une personne seule
  dépassait son montant (7 500,53 € contre 7 323,48 € en 2006, D. 815-2) : le modèle
  prend le montant. Une pension étrangère déclarée compte : « il est tenu compte,
  pour l'appréciation des ressources, de tous les avantages d'invalidité et de
  vieillesse dont bénéficie l'intéressé » (R. 815-22), à son montant brut, revalorisé
  « dans les mêmes conditions que ceux du régime général ». AVANT L'ASPA, depuis le 7
  octobre 2026 (action 138, étape 6), les deux étages de chaque année de 1941 à 2006,
  au lieu du montant de 2006 ramené sur les prix (1 195 € en 1970 au lieu de 457 €) :
  sous un plafond qui dépassait de moitié la somme des deux étages en 1970, une pension
  au-dessus du minimum recevait encore une part de l'allocation supplémentaire. Deux
  témoins des cultes bougent, de −0,95 % et +2,53 % ; la page Coût reconstitue les
  minima de pension de 1970 à 0,4 Md€ au lieu de 2,2, de 1990 à 2,4 au lieu de 4,2.
  Le modèle ignore, avant 2007, la majoration pour conjoint à charge et l'allocation
  spéciale de qui n'avait aucun régime ; il donne le premier étage à toute pension
  sous l'allocation aux vieux travailleurs salariés, sans en lire le plafond avant
  1956, et au montant des villes de plus de 5 000 habitants jusqu'en 1961. Ces montants
  sont relus au Journal officiel, ligne entière, de 1982 à 2003 (13 octobre 2026).
sources:
  lu_le: 2026-10-13
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Les montants de 2027, que fixera la circulaire de la Cnav de décembre 2026 :
    relancer scripts/fetch/cnav_minimum_vieillesse.py.
  - >-
    Avant 2007, les montants que le Journal officiel ne redit pas dans l'index du
    dépôt (action 138, étape 6) : les décrets de l'allocation supplémentaire de 1956
    à 1981, que le filtre thématique de l'index a laissés au dump ; les lois et les
    décrets d'avant 1970, dont l'index n'a que le titre, au fac-similé du Journal
    officiel ; de 2004 à 2006, des arrêtés qui ne fixent qu'un coefficient.
  lectures:
  - type: service_public
    reference: montants de l'ASPA 2026
    date: 2026-01-01
  - type: legifrance
    reference: L. 816-2 CSS, LEGIARTI000036393188, en vigueur depuis le 2018-12-31
    date: 2026-09-19
  - type: legifrance
    reference: L. 161-25 CSS, LEGIARTI000031781092, en vigueur depuis le 2016-01-01
    date: 2026-09-19
  - type: legifrance
    reference: >-
      L. 815-9 CSS, LEGIARTI000006744880, en vigueur depuis le 2006-01-01 ; R. 815-22
      CSS, LEGIARTI000047770487, en vigueur depuis le 2023-07-01, et ses versions
      depuis le 2007-01-13 : « tous les avantages d'invalidité et de vieillesse dont
      bénéficie l'intéressé »
    date: 2026-10-01
  - type: legifrance
    reference: >-
      D. 815-1 CSS, LEGIARTI000036760292, en vigueur depuis le 2018-04-01, et ses
      versions du 2007-01-13 (LEGIARTI000006739608), du 2009-04-30
      (LEGIARTI000020562595) et du 2014-10-23 (LEGIARTI000029619584) : a), « les
      personnes seules, ou lorsque seul un des conjoints » en bénéficie ; b), les deux,
      « le montant est servi par moitié à chacun des deux allocataires » ; lues dans
      l'index LEGI du dépôt
    date: 2026-10-05
  - type: legifrance
    reference: >-
      D. 815-2 CSS, LEGIARTI000029619577, en vigueur depuis le 2014-10-23, et ses
      versions du 2007-01-13 (LEGIARTI000006739612 : 7 500,53 € pour une personne
      seule et 13 137,69 € pour un couple, au 1er janvier 2006) et du 2009-04-30
      (LEGIARTI000020562591 : 8 309,27 € pour une personne seule au 1er avril 2009) :
      le plafond du couple égale le montant du b) de D. 815-1 ; R. 815-28 CSS,
      LEGIARTI000006753729, en vigueur depuis le 2007-01-13 : la réduction « porte pour
      moitié » sur l'allocation de chacun ; R. 815-29 CSS, LEGIARTI000029968931, en
      vigueur depuis le 2015-01-01 : trois mois de ressources, ou douze, et
      l'abattement des revenus professionnels, 0,9 SMIC pour une personne seule, 1,5
      pour le foyer d'un couple ; lus dans l'index LEGI du dépôt
    date: 2026-10-05
  - type: circulaire_cnav
    reference: >-
      base législative de la Cnav, barèmes « Montant de l'allocation de solidarité aux
      personnes âgées » et « Plafond de ressources pour l'allocation de solidarité aux
      personnes âgées », lus par leur API : vingt-trois dates de 2006 à 2026, chacune
      avec son texte, du décret n° 2007-57 à la circulaire n° 2025/29 du 22 décembre
      2025 ; ils redonnent au centime les montants de D. 815-1
    date: 2026-10-05
  - type: service_public
    reference: >-
      fiche F16871, Allocation de solidarité aux personnes âgées, vérifiée le 23 juin
      2026 : en couple, 1 043,59 € par mois au plus quand un seul membre la reçoit, sous
      un plafond de 1 620,18 € ; quand les deux la reçoivent, la différence entre
      1 620,18 € et les revenus du couple, et un exemple, un couple de 1 000 € par mois
    date: 2026-10-05
  - type: circulaire_cnav
    reference: >-
      base législative de la Cnav, exposé « Evaluation des ressources - Aspa » : les
      avantages viagers « sont retenus », « Le montant retenu est le montant brut avant
      cotisations », « revalorisés dans les mêmes conditions que ceux du régime
      général », « Les monnaies étrangères sont converties au taux de change en vigueur
      le 1er jour du trimestre civil qui comprend le point de départ » ; l'allocation «
      est révisée le 1er jour du mois qui suit la date de modification d'un avantage
      viager »
    date: 2026-10-01
  - type: legifrance
    reference: >-
      L. 814-2 CSS, rédaction du 11 juillet 1990 (LEGIARTI000006745108) : les
      avantages de vieillesse « dont les ressources sont inférieures au plafond […]
      sont majorés, le cas échéant, pour être portés au montant de l'allocation aux
      vieux travailleurs salariés » ; L. 815-2 (LEGIARTI000006745116) : l'allocation
      supplémentaire du titulaire d'un avantage de vieillesse ; L. 815-4
      (LEGIARTI000006744834) : son montant « peut varier suivant la situation
      matrimoniale » ; L. 815-8 (LEGIARTI000006744866) : elle « n'est due que si le
      total de cette allocation et des ressources personnelles de l'intéressé et du
      conjoint, si le bénéficiaire est marié, n'excède pas des chiffres limites
      fixés par décret », et se réduit « à due concurrence » au-delà ; lus dans
      l'index LEGI du dépôt
    date: 1990-07-11
  - type: circulaire_cnav
    reference: >-
      base législative de la Cnav, barèmes « Allocation aux vieux travailleurs
      salariés […] - Montant » (depuis la loi du 14 mars 1941), « Allocation
      supplémentaire - Montant » (un et deux allocataires, depuis le 1er avril 1956)
      et « Allocation supplémentaire - Plafond de ressources », par leur API
      (`cnav_avts.py`), chaque date avec la loi, le décret ou l'arrêté qui la fixe ;
      ils redonnent les montants des décrets n° 70-879, 80-1159, 90-265 et 90-266 du
      Journal officiel et, au 1er janvier 2006, l'ancre de D. 815-1 (3 009,45 € et
      4 314,03 €, 7 323,48 €)
    date: 2025-12-22
  - type: jorf
    reference: >-
      les décrets « fixant le montant de divers avantages de vieillesse et
      d'invalidité », « de l'allocation supplémentaire du Fonds national de
      solidarité » et « portant revalorisation » de l'un et de l'autre, de 1970 à
      2003, lus dans les index JORF et LEGI du dépôt (`jorf_avts.py`) : leurs articles,
      des n° 81-1166 et 81-1167 aux n° 2002-115 et 2002-1619, redisent à sa date
      chaque montant de la ligne de 1982 à 2003 — « Sont portés à 13 470 F par an à
      compter du 1er janvier 1987 […] : - le montant de l'allocation aux vieux
      travailleurs salariés » (n° 87-77), « b) Pour les couples mariés, à 34 300 F par
      an » (n° 92-50), « les montants limites annuels […] sont fixés à 24.900 F pour
      une personne seule et à 44.400 F pour deux époux » (n° 81-1167) ; de 1970 à
      1981, leurs notices redisent l'AVTS. L'allocation supplémentaire d'un
      allocataire marié est fixée en 1982 (12 700 F, n° 82-560), puis plus jusqu'en
      1991 : le plafond du couple la borne, ce que la notice du n° 87-78 chiffre
      (14 865 F) sans que l'article l'écrive
    date: 2003-01-01
textes_a_rattacher:
- id: LEGIARTI000006745108
  reference: L. 814-2 CSS, rédaction de 1990, le premier étage avant l'ASPA
- id: LEGIARTI000006744866
  reference: L. 815-8 CSS, rédaction de 1990, le plafond du second étage
- reference: L. 815-1 CSS et suivants
- reference: R. 815-22 CSS
- reference: L. 816-2 CSS
- reference: L. 161-25 CSS
- reference: D. 815-1 et D. 815-2 CSS, les barèmes d'une personne seule et d'un couple
- reference: R. 815-28 et R. 815-29 CSS, le partage et l'appréciation des ressources
referents:
  ines: >-
    exécuté le 13 octobre 2026 (tests/test_ines.py) : la même règle, d'une personne seule
    et d'un couple d'un ou de deux allocataires, au centime une fois les barèmes égalés ;
    son barème est la moyenne des douze mois, celui de la caisse au centime de 2022 à 2025
    et 0,20 € sous lui pour le couple de 2021 ; il compte les revenus d'activité abattus
    (R. 815-29), que le modèle ignore, et ajoute la CRDS à la pension brute
  saphir: >-
    rejoué le 24 octobre 2026 au droit de 2017 (tests/test_referents.py) : la même règle,
    d'une personne seule et d'un couple d'un ou de deux allocataires, au centime une fois
    les barèmes égalés ; son barème est la moyenne des douze mois de 2017, celui de la
    caisse au centime du mensuel ; il compte les revenus d'activité, mais n'en abat qu'un
    trimestre sur l'année, au lieu de quatre (R. 815-29)
approximations:
- ecart: >-
    L'allocation se récupère sur la succession de l'allocataire, au-delà d'un actif net
    que la caisse publie (barèmes « Montant de la succession permettant la récupération
    », de l'ASPA et de l'allocation supplémentaire, lus le 30 octobre 2026) : 150 000 F
    de 1978 à 1982, 250 000 F ensuite, 39 000 € de 2002 au 31 août 2023 (100 000 €
    outre-mer depuis mars 2017), 100 000 € puis 108 585,14 € en 2026 (150 000 €
    outre-mer), dans la limite d'une somme par année d'allocation (8 463,42 € pour un
    allocataire en 2026). Le modèle, qui calcule des pensions et non des successions,
    ne sert pas cette récupération ; la proposition la remplace par la reprise de la
    garantie dès le premier euro (action 47).
  effet: >-
    aucun sur l'allocation servie ; non mesuré sur ce qu'elle coûte, net de ce que la
    caisse récupère
- ecart: >-
    La série d'une personne seule ne porte qu'un montant par an : 2008, 2013 et 2015 y
    manquent, 2014 est au montant d'octobre, 2022 à celui de janvier, et l'annuel vaut
    douze fois le mensuel en 2007, en 2017 et depuis 2021 (9 638,40 € pour 9 638,42 € en
    2017, 12 523,08 € pour 12 523,14 € en 2026) ; Ines tient le barème au mois, Saphir
    en sert la moyenne de 2017 : la revalorisation d'avril au prorata.
  effet: >-
    non mesuré ; léger : la coupe du 14 octobre 2026 le déclare sans le faire
    (action 138, classement du 9 octobre)
- ecart: >-
    R. 815-1 ouvre l'allocation dès l'âge de leur taux plein aux assurés des 2° à 5° de
    L. 351-8 ; le modèle ne la sert ainsi qu'à l'inapte et à l'ancien invalide, à
    soixante-cinq ans aux autres (fiches taux_plein_anciens_combattants_prisonniers,
    taux_plein_meres_de_famille_ouvrieres, taux_plein_travailleurs_manuels).
  effet: >-
    non mesuré ; léger : la coupe du 14 octobre 2026 le déclare sans le faire
    (action 138, classement du 9 octobre)
code:
  moteur: >-
    `foyer_et_net` sert l'allocation de l'année quand l'âge est atteint, la condition de
    résidence remplie (`condition_de_residence`) et les avantages non contributifs
    gardés, sur les ressources de l'assuré : ses pensions françaises et celles qu'un
    autre État lui sert (`pensions_etrangeres_servies`). Le barème est celui du foyer
    (`conjoint_au_foyer`, `conjoint_allocataire`) : une personne seule reçoit ce qui lui
    manque pour atteindre son plafond (`MinimumVieillesse.plafond`) ; un couple, ce qui
    manque à leurs deux ressources pour atteindre le sien
    (`MinimumVieillesse.plafond_couple`), par moitié à deux allocataires, entier à un
    seul, au plus le montant d'une personne seule. Les montants se lisent par année,
    puis suivent les prix au-delà de la dernière (`MinimumVieillesse._en_vigueur`).
    Avant 2007, `avant_l_aspa` sert les deux étages de l'année
    (`MinimumVieillesse.deux_etages`) : le premier porte la pension au montant de
    l'allocation aux vieux travailleurs salariés, sous le plafond ; le second,
    l'allocation supplémentaire, se réduit de ce que son total et les ressources du
    ménage dépassent le plafond, par moitié entre deux allocataires.
  python: >-
    droit/foyer.py : foyer_et_net, avant_l_aspa, conjoint_au_foyer,
    conjoint_allocataire, condition_de_residence, Foyer ; droit/etranger.py :
    pensions_etrangeres_servies ; scenarios/actuel.py : MinimumVieillesse,
    MinimumVieillesse.plafond, MinimumVieillesse.plafond_couple,
    MinimumVieillesse.deux_etages, MinimumVieillesse._en_vigueur, DeuxEtages
  javascript: >-
    moteur/js/droit/foyer.js : foyerEtNet, avantLAspa, conjointAuFoyer,
    conjointAllocataire, conditionDeResidence ; moteur/js/droit/etranger.js :
    pensionsEtrangeresServies ; moteur/js/regimes.js : MinimumVieillesse,
    MinimumVieillesse.plafond, MinimumVieillesse.plafondCouple,
    MinimumVieillesse.deuxEtages, MinimumVieillesse._enVigueur
  parametres: >-
    legislation/minimum_vieillesse.csv, legislation/minimum_vieillesse_couple.csv :
    annee, valeur ; legislation/minimum_vieillesse_avant_2007.csv : avts,
    supplementaire, supplementaire_menage, plafond, plafond_couple
  tests:
  - tests/test_simulateur.py
  - tests/test_liquidation.py
  - tests/test_minima_agricoles.py
  - tests/test_invalidite.py
  - tests/test_etranger.py
  - >-
    tests/temoins/exemples_officiels.yaml, que tests/test_oracle.py rejoue :
    sp_f16871_aspa_deux_allocataires, sp_f16871_aspa_un_seul_allocataire et
    sp_f16871_aspa_un_seul_allocataire_au_maximum, qui tombent aussi sans le barème du
    couple
  - >-
    tests/test_etranger.py, tests/test_exonerations_agirc_arrco.py,
    tests/test_independants.py, tests/test_majoration_conjoint_a_charge.py,
    tests/test_majoration_exceptionnelle.py, tests/test_minima_agricoles.py,
    tests/test_minimum_pension_sncf.py, tests/test_pension_minimum_avant_1983.py,
    tests/test_pont.py, tests/test_reversion.py et tests/test_versements_uniques.py, qui
    confrontent les deux moteurs sur des carrières qui le portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    soixante-six témoins changent sans l'allocation, soixante-cinq dans leur pension
    d'aujourd'hui, huit au scénario 1 et sept dans leur compte notionnel ; cinq sans les
    deux étages d'avant 2007 — cultes_avant_1998, cultes_deux_fractions_avant_2006,
    retraite_majoree_en_1982, reversion_avant_1973 et reversion_majorations_avant_1983 — ;
    six sans le barème du couple — aspa_couple_deux_allocataires_aujourd_hui,
    aspa_couple_un_seul_allocataire, reversion_agent_sncf_minimum, reversion_avant_1973,
    reversion_majorations_avant_1983 et reversion_minimum_contributif
