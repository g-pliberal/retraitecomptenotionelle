schema_version: 1
id: reversion_agirc_arrco
intitule: >-
  Pension de réversion de la retraite complémentaire des salariés : 60 % des points
  de l'assuré décédé, à partir de cinquante-cinq ans pour un décès depuis 2019, sans
  condition de ressources ; ni au partenaire de PACS ni au concubin, et perdue au
  remariage ; avant 2019, les âges de l'Arrco et de l'Agirc, que la date du décès
  choisit.
domaine: reversion
regimes:
- agirc_arrco
- arrco
- arrco_tranche_2
- arrco_tranche_2_entreprises_nouvelles
- agirc
- agirc_entreprises_nouvelles
- unirs
- regimes_professionnels_integres
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- conjoint.deces
- union.debut et union.fin, d'un mariage ; un remariage éteint le droit
- la naissance du survivant, qui dit son âge
- les enfants à charge du survivant, et son invalidité, qui lèvent la condition d'âge
- les points de l'assuré décédé, par régime avant 2019
ecrit:
- la pension de réversion du survivant, en points de l'assuré décédé
dates_qui_decident:
- conjoint.deces
# Les versions forment un partage de la date du décès (§ 4.1), qui choisit les
# âges : l'accord de 2017 pour un décès depuis 2019, l'Arrco et l'Agirc avant.
# `contenu.parametres` dit l'âge de chaque régime ; `age_minimum_minore` est
# l'âge auquel l'Agirc sert une réversion minorée, avant soixante ans ;
# `invalidite_sans_age`, que l'invalidité du survivant lève la condition d'âge,
# « quel que soit la date du décès », dit la fédération.
versions:
- id: avant_1990
  statut: supposee
  hypothese: >-
    lue sur le site de la fédération Agirc-Arrco (« La pension de réversion »), faute
    d'avoir pu relire depuis cette session le texte de l'accord et des règlements
    antérieurs sur Légifrance, que protège une vérification du navigateur
  fiabilite: haute
  bornes:
    conjoint.deces: [null, 1990-05-17]
  contenu:
    droit: 60 % des points de l'assuré
    beneficiaire: la veuve à cinquante ans ; le veuf à soixante-cinq ans à l'Agirc, selon la caisse à l'Arrco
    parametres:
      taux: 0.60
      age_minimum_veuve: 50
      age_minimum_veuf: 65
      age_minimum_minore: null
      perte_au_remariage: true
      invalidite_sans_age: true
      fiabilite: moyenne
  exemples: aucun trouvé
- id: veufs_1990
  statut: supposee
  hypothese: >-
    lue sur le site de la fédération Agirc-Arrco (« La pension de réversion »), faute
    d'avoir pu relire depuis cette session le texte de l'accord et des règlements
    antérieurs sur Légifrance, que protège une vérification du navigateur
  fiabilite: haute
  bornes:
    conjoint.deces: [1990-05-17, 1994-03-01]
  contenu:
    droit: 60 % des points de l'assuré
    beneficiaire: >-
      la veuve à cinquante ans ; le veuf à cinquante ans pour les droits acquis depuis
      le 1er janvier 1990, soixante-cinq ans à l'Agirc pour les autres
    parametres:
      taux: 0.60
      age_minimum_veuve: 50
      age_minimum_veuf: 65
      age_minimum_minore: null
      perte_au_remariage: true
      invalidite_sans_age: true
      fiabilite: moyenne
  exemples: aucun trouvé
- id: agirc_1994
  statut: supposee
  hypothese: >-
    lue sur le site de la fédération Agirc-Arrco (« La pension de réversion »), faute
    d'avoir pu relire depuis cette session le texte de l'accord et des règlements
    antérieurs sur Légifrance, que protège une vérification du navigateur
  fiabilite: haute
  bornes:
    conjoint.deces: [1994-03-01, 1996-07-01]
  contenu:
    droit: >-
      60 % des points ; à l'Agirc, à soixante ans, ou dès cinquante-cinq ans avec une
      minoration de 52 % à 58,4 %, sauf si le survivant obtient la réversion du régime
      de base
    parametres:
      taux: 0.60
      age_minimum_arrco: 50
      age_minimum_agirc: 60
      age_minimum_minore: 55
      perte_au_remariage: true
      invalidite_sans_age: true
      fiabilite: moyenne
  exemples: aucun trouvé
- id: arrco_1996
  statut: supposee
  hypothese: >-
    lue sur le site de la fédération Agirc-Arrco (« La pension de réversion »), faute
    d'avoir pu relire depuis cette session le texte de l'accord et des règlements
    antérieurs sur Légifrance, que protège une vérification du navigateur
  fiabilite: haute
  bornes:
    conjoint.deces: [1996-07-01, 2019-01-01]
  contenu:
    droit: >-
      60 % des points ; à l'Arrco à cinquante-cinq ans, à l'Agirc à soixante ans ou
      minorée dès cinquante-cinq
    parametres:
      taux: 0.60
      age_minimum_arrco: 55
      age_minimum_agirc: 60
      age_minimum_minore: 55
      perte_au_remariage: true
      invalidite_sans_age: true
      fiabilite: haute
  exemples: aucun trouvé
- id: accord_2017
  statut: supposee
  hypothese: >-
    lue sur le site de la fédération Agirc-Arrco (« La pension de réversion »), faute
    d'avoir pu relire depuis cette session le texte de l'accord et des règlements
    antérieurs sur Légifrance, que protège une vérification du navigateur
  fiabilite: haute
  textes:
  - {reference: "accord national interprofessionnel du 17 novembre 2017, étendu par l'arrêté du 24 avril 2018 (JORFTEXT000036847920)", en_vigueur: 2019-01-01}
  bornes:
    conjoint.deces: [2019-01-01, null]
  contenu:
    droit: >-
      60 % des points de l'assuré décédé, à la valeur du point au paiement ; sans le
      coefficient d'anticipation de l'assuré retraité, mais sans pouvoir dépasser sa
      retraite
    beneficiaire: le conjoint et l'ex-conjoint marié, non remarié
    conditions: >-
      cinquante-cinq ans, ou aucun âge avec deux enfants à charge ou en invalidité ;
      entre conjoint et ex-conjoints, un partage au prorata de la durée des mariages ;
      l'ex-conjoint seul reçoit la part de la durée de son mariage dans la durée
      d'assurance du défunt, plafonnée à 169 trimestres depuis décembre 2023, 170 depuis
      octobre 2025
    parametres:
      taux: 0.60
      age_minimum: 55
      age_minimum_minore: null
      perte_au_remariage: true
      invalidite_sans_age: true
      fiabilite: haute
  exemples: [aa_reversion_leila, aa_reversion_kim, aa_reversion_annie, aa_reversion_eric,
             aa_reversion_francois, aa_reversion_david, aa_reversion_simone,
             aa_reversion_claude, ur_reversion_prive_63_ans,
             ur_reversion_prive_50_ans_deux_enfants,
             ur_reversion_prive_ressources_plafond_2024,
             ur_reversion_prive_veuve_invalide_52_ans, ur_reversion_salarie_agricole]
approximations:
- ecart: >-
    les 60 % s'appliquent à la retraite servie, coefficient d'anticipation compris,
    quand l'Agirc-Arrco les calcule sur les points de l'assuré, sans ce coefficient,
    dans la limite de sa retraite
  effet: >-
    la réversion d'un assuré parti avec un coefficient de minoration est sous-estimée
    d'autant ; non mesuré
- version: [agirc_1994, arrco_1996]
  ecart: >-
    la réversion minorée de l'Agirc, dès cinquante-cinq ans, n'est pas servie : le
    moteur attend soixante ans
  effet: non mesuré
- version: [avant_1990, veufs_1990]
  ecart: >-
    le veuf attend soixante-cinq ans à l'Agirc comme à l'Arrco, où chaque caisse le
    disait, et ses droits acquis depuis 1990 ne s'ouvrent pas à cinquante ans
  effet: non mesuré
- ecart: >-
    la retraite du défunt est servie au mois : versée par trimestre ou par an, elle
    court jusqu'au terme de sa période, et la réversion ne commence qu'à la suivante
  effet: >-
    la réversion commence un à dix mois trop tôt pour le survivant d'une petite
    retraite ; trois exemples de la fédération le montrent, en écart connu
- ecart: >-
    la condition d'âge n'est pas levée par deux enfants à charge ; le partage entre
    ex-conjoints et la perte au remariage ne sont pas portés ; les régimes absorbés —
    l'UNIRS, les régimes professionnels intégrés — suivent les âges de l'Arrco ; les
    montants sont ceux de l'année du décès
  effet: >-
    mesuré pour les enfants à charge : la veuve de 50 ans qui en a deux touche sa
    réversion complémentaire au décès, le modèle la lui sert à 55 ans, quatre ans et
    sept mois trop tard (exemple ur_reversion_prive_50_ans_deux_enfants, en écart
    connu) ; le reste non mesuré
- ecart: >-
    l'invalidité du survivant lève l'âge depuis le mois qui suit sa reconnaissance, et
    pour toujours : la fédération interrompt la réversion quand l'invalidité cesse,
    jusqu'à l'âge requis, et le modèle ne sait pas quand elle cesse ; elle se déclare
    sans dire qui la constate — la Sécurité sociale, un médecin expert, la CDAPH, le
    juge des tutelles —, que la fédération admet tous
  effet: non mesuré
presomptions:
  conjoint_de_l_autre_sexe: >-
    l'âge du veuf ou de la veuve, avant 1994, quand le sexe du conjoint n'est pas dit
  reversion_demandee_dans_l_annee: >-
    la date d'effet, au premier jour du mois qui suit le décès, ou qui suit l'âge
    requis
  deces_apres_le_depart: >-
    la réversion que la page montre sans décès déclaré, pour un décès supposé juste
    après le départ, ou cette année pour qui est déjà parti
sources:
  lu_le: 2026-10-01
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 28 septembre 2026 avec le domaine de la réversion (docs/architecture.md,
    § 11). Le moteur la lit depuis la deuxième étape du domaine, le même jour.
  - >-
    À LIRE AU TEXTE : l'accord national interprofessionnel du 17 novembre 2017, ses
    articles sur les droits des conjoints survivants, sur Légifrance (base KALI, où ses
    articles portent des identifiants KALIARTI) ; depuis cette session, la page
    répond par une vérification du navigateur. Et les règlements de l'Arrco et de
    l'Agirc d'avant 2019 pour les versions antérieures.
  - >-
    Les exemples datés du site sont aux exemples officiels depuis la troisième étape du
    domaine : Leïla, Kim, Annie et Eric concordent ; François, David et Simone, dont
    le défunt était payé par trimestre ou par an, sont en écart connu ; Claude, devenu
    invalide, l'était aussi, et concorde depuis le 1er octobre 2026 (domaine de
    l'invalidité et de l'inaptitude). Max, qui a deux enfants à charge et dont l'âge
    n'est pas dit, et Léo, qui demande sa réversion dix-huit mois après le décès, n'y
    sont pas.
  lectures:
  - type: autre
    reference: >-
      fédération Agirc-Arrco, « La pension de réversion » : les conditions d'âge par date
      de décès (55 ans depuis 2019 ; Arrco 55 ans depuis le 1er juillet 1996, 50 avant ;
      Agirc 60 ans depuis le 1er mars 1994, 55 minorée ; 50 ans pour les veufs sur les
      droits acquis depuis 1990, pour un décès depuis le 17 mai 1990), « 60 % des droits
      de la retraite complémentaire de l'assuré », le remariage, le partage, les dates
      d'effet et leurs exemples
    date: 2026-09-28
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/demander-ma-retraite/la-pension-de-reversion/
  - type: autre
    reference: >-
      la même page, relue : « La pension de réversion peut être versée sans condition
      d'âge quel que soit la date du décès : [...] ou s'il est en situation d'invalidité
      au moment du décès ou plus tard » ; l'invalidité constatée par la Sécurité sociale
      (pension d'invalidité, rente d'accident du travail des deux tiers), un médecin
      expert, la CDAPH ou une décision de justice ; « Lorsque l'état d'invalidité cesse,
      le versement de la pension est interrompu »
    date: 2026-10-01
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/demander-ma-retraite/la-pension-de-reversion/
code:
  python: >-
    droit/reversion.py : reversion, _age_agirc_arrco, _a_l_age ; scenarios/actuel.py :
    Reversions
  javascript: >-
    moteur/js/droit/reversion.js : reversion, ageAgircArrco, aLAge ;
    moteur/js/regimes.js : Reversions
  parametres: >-
    contenu.parametres de chaque version : taux, age_minimum, age_minimum_arrco,
    age_minimum_agirc, age_minimum_veuve, age_minimum_veuf, invalidite_sans_age
  tests: tests/test_reversion.py ; les témoins reversion_* des simulations
historique:
- >-
  2026-09-28 — née avec le domaine de la réversion.
- >-
  2026-09-28 — lue par le moteur, à la deuxième étape du domaine ; les régimes
  absorbés par l'Arrco et l'Agirc-Arrco la suivent.
- >-
  2026-10-01 — l'invalidité du survivant lève la condition d'âge, au mois qui suit sa
  reconnaissance, à la quatrième étape du domaine de l'invalidité et de l'inaptitude :
  l'exemple de Claude concorde.
effet: >-
  Tout conjoint, ou ex-conjoint marié, d'un salarié ou ancien salarié du privé qui
  décède. Le modèle la calcule pour le conjoint que la saisie déclare, sur la
  retraite servie.
