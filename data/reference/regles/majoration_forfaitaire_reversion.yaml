schema_version: 1
id: majoration_forfaitaire_reversion
intitule: >-
  Majoration forfaitaire de la réversion pour enfant à charge (L. 353-5 du code de la
  sécurité sociale) : au survivant qui n'a pas de retraite personnelle d'un régime de
  base et n'a pas l'âge que R. 353-9 fixe — soixante-cinq ans, puis l'âge du taux
  plein depuis juin 2011 —, un montant forfaitaire par enfant à sa charge, depuis le
  1er janvier 1988 (R. 353-11), dû de la date d'effet de la réversion ou du mois qui
  suit le jour où ses conditions sont remplies (R. 353-10), réduit dans la proportion
  où la réversion l'est pour ressources ou pour cumul (D. 353-2), et servi par le
  régime de la dernière affiliation de l'assuré (D. 173-21-1, D. 173-21-7, R. 173-17-3).
domaine: reversion
regimes:
- regime_general
- msa_salaries
- organic
- cancava
- rsi
- assurances_sociales
etape: liquider_chaque_regime
face: droit
etat: transcrite
lit:
- la réversion du régime général ou d'un régime aligné, entière et réduite, et sa date
  d'effet
- la naissance du survivant, qui dit son âge le jour où la majoration s'attribue, et
  l'âge du taux plein de sa génération
- ses ressources hors de ses revenus d'activité, que le modèle tient pour ses retraites
  personnelles
- les enfants du défunt, nés avant ou après la date d'effet, que le modèle tient pour à
  la charge du survivant jusqu'à l'âge de la version en vigueur chaque jour, et jusqu'à
  vingt ans pendant les études, l'apprentissage ou l'infirmité que la chronologie dit
- l'union où il vit après le décès, qui l'écarte, ou l'arrête quand elle suit, avant
  juillet 2004
- le jour où sa propre retraite prend effet, s'il le dit, qui l'arrête
- la dernière année cotisée du défunt dans chaque régime, et sa durée d'assurance dans
  chacun, qui disent le régime qui la sert
ecrit:
- la majoration forfaitaire pour enfant à charge, comprise dans la réversion du régime
  qui la sert, et ce qu'elle devient depuis chaque jour où la part d'un enfant commence
  ou cesse
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage du jour où la majoration s'attribue — la date
# d'effet de la réversion, ou le jour où la première part commence (R. 353-10) —,
# où R. 353-9 apprécie l'âge du survivant (« La condition d'âge est exigée
# uniquement au moment de l'attribution », exposé de la Cnav), et du jour où la
# charge de chaque enfant se lit : seize ans, puis la majorité depuis 2016, vingt
# ans pour l'étudiant, l'apprenti et l'enfant infirme. Le montant annuel par
# enfant, de chaque année, est dans
# `legislation/majoration_forfaitaire_enfant_reversion.csv`.
