approximations:
- ecart: >-
    l'enfant est à charge jusqu'à seize ans, puis, depuis 2016, jusqu'à sa majorité, quand
    l'étudiant, l'apprenti et l'enfant infirme le restent jusqu'à vingt ans (R. 313-12,
    R. 161-4) ; le modèle compte les enfants du défunt nés à la date d'effet, tenus pour
    à la charge du survivant, chacun jusqu'au mois qui suit l'âge de la version en
    vigueur ce jour-là, sans prolonger l'étudiant, ni rouvrir en 2016 la part de l'enfant
    qui a eu seize ans juste avant, ni la commencer quand un enfant naît ou que la
    condition se remplit après la date d'effet (R. 353-10)
  effet: >-
    la majoration de l'étudiant ou de l'apprenti s'arrête deux à quatre ans trop tôt.
    Non mesuré
- ecart: >-
    le survivant qui n'a pas de retraite personnelle est celui dont les ressources ne
    comptent que des revenus d'activité, ou qui n'en déclare pas ; la pension
    d'invalidité, qui n'écarte pas la majoration, et les prestations d'orphelin du chef
    du défunt, qui l'écartent, ne se distinguent pas dans la saisie
  effet: non mesuré
- ecart: >-
    la majoration est servie par le régime général quand il sert une réversion, sinon par
    le premier régime aligné qui en sert une, et non par celui de la dernière affiliation
    du défunt ou de la plus longue durée (D. 173-21-1, D. 173-21-7) ; elle n'est pas
    partagée entre les conjoints, chacun ayant « autant de majorations que d'enfants à
    sa charge » (exposé de la Cnav), et le modèle la sert au seul survivant ; elle est
    réduite dans la proportion de la réversion réduite pour ressources, pour cumul ou
    par son maximum
  effet: non mesuré
presomptions:
  reversion_demandee_dans_l_annee: >-
    la majoration examinée à la date d'effet de la réversion, que l'exposé de la Cnav
    dit examinée « lors de la demande d'un avantage de réversion »
  retraites_du_survivant_servies: >-
    le survivant qui déclare des ressources hors de son activité, sans dire quand sa
    propre retraite commence, l'a dès la date d'effet, et n'a pas la majoration
sources:
  lu_le: 2026-10-09
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 9 octobre 2026, à l'étape 4 de l'action 138 : lue dans l'index LEGI
    (L. 353-5, R. 353-9 à R. 353-11, D. 353-2, D. 173-21-1) et dans les exposés de la
    Cnav ; sa durée, le même jour, dans la circulaire Cnav n° 76/88. Aucun exemple
    chiffré publié n'a été trouvé : la fiche reste transcrite.
  lectures:
  - type: legifrance
    reference: >-
      L. 353-5, ses quatre rédactions dans l'index LEGI (LEGIARTI000006742652, 653, 654,
      LEGIARTI000031688429) — « Le conjoint survivant qui n'est pas titulaire d'un
      avantage personnel de vieillesse d'un régime de base obligatoire et qui satisfait
      à une condition d'âge a droit à une majoration forfaitaire de sa pension de
      réversion pour chaque enfant dont il a la charge » ; R. 353-9 (« moins de
      soixante-cinq ans », puis « ne doit pas avoir atteint l'âge prévu par le 1° de
      l'article L. 351-8 » depuis le 3 juin 2011 ; l'enfant, au sens de R. 313-12, puis
      de R. 161-4 depuis 2016) ; R. 353-10 (due à la date d'entrée en jouissance de la
      réversion, ou au mois qui suit les conditions remplies) ; R. 353-11 (« 400 F au 1er
      janvier 1988 », puis « 112,58 euros par mois au 1er janvier 2025 ») ; D. 353-2
      (réduite « dans les mêmes proportions » que la réversion, par D. 355-1, puis par
      le quatrième alinéa de L. 353-1)
    date: 2026-10-09
  - type: circulaire_cnav
    reference: >-
      exposés de la base de législation de la Cnav, lus le 9 octobre 2026 par son API :
      « Majoration forfaitaire pour charge d'enfant - Conditions d'attribution » (21
      janvier 2026), « - Montant » et « - Point de départ » (24 octobre 2025), « Qualité
      d'enfant à charge » (22 janvier 2026) ; avant juillet 2004, « n'était pas attribuée
      au conjoint survivant remarié ou vivant maritalement » ; « MFE réduite = montant de
      la majoration × (Retraite de réversion réduite ÷ Retraite de réversion entière) »,
      non réduite au partage entre conjoints
    date: 2026-01-22
    url: https://legislation.lassuranceretraite.fr/#/expose?file_leaf_ref=mfe_condition_attribution_ex.aspx
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 76/88 du 29 juin 1988, lue le 9 octobre 2026 par l'API de la
      base de législation de la Cnav, fiche n° 9 : « La majoration n'est plus servie
      lorsque son bénéficiaire se remarie, vit maritalement, perçoit [...] une retraite
      personnelle » ou « lorsque l'enfant n'est plus à charge » ou « atteint l'âge
      limite » ; « Date de cessation du versement : 1er jour du mois suivant celui au
      cours duquel l'une des conditions d'attribution n'est plus satisfaite à
      l'exception de la condition d'âge du titulaire du droit de réversion » ; fiche
      n° 4 : l'enfant « n'est plus à charge le jour de son » anniversaire ; et l'exposé
      « Qualité d'enfant à charge » (22 janvier 2026) : la majorité depuis le 1er
      janvier 2016, seize ans avant, vingt ans pour l'étudiant, l'apprenti et l'enfant
      infirme
    date: 1988-06-29
    url: https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_7688_29061988.aspx
  - type: circulaire_cnav
    reference: >-
      barème « Montant mensuel de la majoration forfaitaire pour charge d'enfant » de la
      Cnav, de 400 F au 1er janvier 1988 à 113,59 € au 1er janvier 2026
    date: 2026-10-09
    url: https://legislation.lassuranceretraite.fr/#/bareme?file_leaf_ref=mfe_montant_bar.aspx
code:
  python: >-
    droit/reversion.py : reversion, _majoration_forfaitaire_enfants, _fin_de_la_charge ;
    scenarios/actuel.py : Reversions.majoration_enfant
  javascript: >-
    moteur/js/droit/reversion.js : reversion, majorationForfaitaireEnfants,
    finDeLaCharge ;
    moteur/js/regimes.js : Reversions.majorationEnfant
  parametres: >-
    contenu.parametres : servie, age_maximum, age_du_taux_plein, enfant_moins_de_ans,
    refusee_en_couple ; le montant annuel par enfant, dans
    legislation/majoration_forfaitaire_enfant_reversion.csv
  tests: >-
    tests/test_reversion.py ; les témoins reversion_enfants_a_charge et
    reversion_enfants_jusqu_a_sa_retraite des simulations
historique:
- >-
  2026-10-09 — née et lue par le moteur, à l'étape 4 de l'action 138 : la fiche
  reversion la déclarait absente.
- >-
  2026-10-09 — sa durée, le même jour : chaque enfant compte jusqu'au mois qui suit
  l'âge limite, et toute la majoration cesse le mois qui suit la retraite du survivant,
  qu'il date, ou, avant juillet 2004, son union nouvelle (circulaire Cnav n° 76/88,
  fiche n° 9).
effet: >-
  Le survivant d'un assuré du régime général ou d'un régime aligné qui élève encore ses
  enfants, sans retraite personnelle : 1 363,08 euros par an et par enfant en 2026.
