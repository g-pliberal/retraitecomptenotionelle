approximations:
- ecart: >-
    le modèle compte les enfants du défunt, tenus pour à la charge du survivant, nés
    avant ou après la date d'effet, chacun sous l'âge de la version en vigueur chaque
    jour ; il ne les tient à charge jusqu'à vingt ans que pendant les études,
    l'apprentissage ou l'infirmité que la chronologie dit, que le formulaire ne demande
    pas encore (présomption charge_jusqu_a_l_age_limite) ; il ne distingue ni l'apprenti
    d'avant le 18 mai 1994, à charge jusqu'à dix-huit ans et sous 55 % du SMIC
    (circulaire Cnav n° 76/88, fiche n° 4 ; n° 44/94), ni l'enfant dont la maladie a
    interrompu les études, à charge avant 2016 jusqu'au 30 septembre de l'année de ses
    vingt et un ans (R. 313-12, R. 313-14), ni l'enfant du survivant qui n'est pas celui
    du défunt, ni l'enfant recueilli
  effet: >-
    sans études déclarées, la majoration de l'étudiant ou de l'apprenti s'arrête deux à
    quatre ans trop tôt. Non mesuré
- ecart: >-
    le survivant qui n'a pas de retraite personnelle est celui dont les ressources ne
    comptent que des revenus d'activité, ou qui n'en déclare pas ; la pension
    d'invalidité, qui n'écarte pas la majoration, et les prestations d'orphelin du chef
    du défunt, qui l'écartent, ne se distinguent pas dans la saisie
  effet: non mesuré
- ecart: >-
    la dernière affiliation se lit à l'année, et non au jour : deux régimes quittés la
    même année se départagent par la durée d'assurance, puis par le montant de leur
    réversion (circulaire Cnav n° 76/88, fiche n° 7), là où le texte ne les départage
    ainsi que si l'assuré en relevait « simultanément » ; le modèle choisit parmi les
    régimes dont la réversion n'est pas nulle, quand la caisse laisse la majoration au
    régime prioritaire, réduite avec sa réversion (exposé de la Cnav, « Montant ») ;
    elle n'est pas partagée entre les conjoints, chacun ayant « autant de majorations
    que d'enfants à sa charge » (exposé de la Cnav), et le modèle la sert au seul
    survivant ; elle est réduite dans la proportion de la réversion réduite pour
    ressources, pour cumul ou par son maximum
  effet: non mesuré
- ecart: >-
    la part qui commence après la date d'effet — l'enfant né après elle, celui qui
    redevient à charge, la majoration de 1988 qui rejoint une réversion déjà servie —
    s'écrit en étapes, avec la réduction de la date d'effet ; le montant de la ligne
    reste celui des enfants à charge ce jour-là, et rien ne le revalorise à part
  effet: non mesuré
presomptions:
  reversion_demandee_dans_l_annee: >-
    la majoration examinée à la date d'effet de la réversion, que l'exposé de la Cnav
    dit examinée « lors de la demande d'un avantage de réversion »
  retraites_du_survivant_servies: >-
    le survivant qui déclare des ressources hors de son activité, sans dire quand sa
    propre retraite commence, l'a dès la date d'effet, et n'a pas la majoration
  charge_jusqu_a_l_age_limite: >-
    l'enfant que la chronologie ne dit ni étudiant, ni apprenti, ni infirme n'est à
    charge que jusqu'à l'âge limite, seize ans, puis sa majorité
  majoration_demandee_des_sa_condition: >-
    la part qui commence après la date d'effet, ou qui revient, est demandée dès que sa
    condition est remplie, et servie le premier jour du mois qui suit
sources:
  lu_le: 2026-10-24
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 9 octobre 2026, à l'étape 4 de l'action 138 : lue dans l'index LEGI
    (L. 353-5, R. 353-9 à R. 353-11, D. 353-2, D. 173-21-1) et dans les exposés de la
    Cnav ; sa durée, le même jour, dans la circulaire Cnav n° 76/88. Le 24 octobre 2026,
    ses parts après la date d'effet, la prolongation à vingt ans et le régime qui la
    sert. Aucun exemple chiffré publié n'a été trouvé — ni dans les exposés de la Cnav,
    ni dans ses circulaires n° 76/88 et n° 44/94, ni dans la circulaire RSI n° 2007/061,
    ni sur service-public — : la fiche reste transcrite, et le cas de 2026 se pose à la
    main (tests/test_reversion.py).
  - >-
    La fiche F13104 de service-public, vérifiée le 1er janvier 2026, tient à charge
    l'« Enfant de moins de 21 ans qui poursuit ses études » ; R. 161-4 dit vingt ans, et
    la Cnav « repoussé à 20 ans ». Elle compte aussi la majoration au plafond («
    Lorsque le montant de votre pension de réversion, de la majoration forfaitaire et de
    vos ressources dépasse » le plafond, elle est réduite « de façon à ce que ce plafond
    ne soit pas dépassé »), là où la Cnav la réduit dans la proportion de la réversion
    réduite à l'entière (exposé « Montant », D. 353-2) : sur les deux points, le modèle
    suit la caisse.
  - >-
    La majoration des exploitants agricoles (L. 732-50 du code rural, jusqu'au 31
    décembre 2025), que D. 173-21-7 range avec celle-ci, est hors du modèle, qui ne
    liquide pas leur réversion.
  lectures:
  - type: legifrance
    reference: >-
      L. 353-5, ses quatre rédactions dans l'index LEGI (LEGIARTI000006742652, 653, 654,
      LEGIARTI000031688429) — « Le conjoint survivant qui n'est pas titulaire d'un
      avantage personnel de vieillesse d'un régime de base obligatoire et qui satisfait
      à une condition d'âge a droit à une majoration forfaitaire de sa pension de
      réversion pour chaque enfant dont il a la charge » ; R. 353-9 (« moins de
      soixante-cinq ans », puis « ne doit pas avoir atteint l'âge prévu par le 1° de
      l'article L. 351-8 » depuis le 3 juin 2011 ; l'enfant, au sens de R. 313-12, puis
      de R. 161-4 depuis 2016) ; R. 353-10 (due à la date d'entrée en jouissance de la
      réversion, ou au mois qui suit les conditions remplies) ; R. 353-11 (« 400 F au 1er
      janvier 1988 », puis « 112,58 euros par mois au 1er janvier 2025 ») ; D. 353-2
      (réduite « dans les mêmes proportions » que la réversion, par D. 355-1, puis par
      le quatrième alinéa de L. 353-1)
    date: 2026-10-09
  - type: legifrance
    reference: >-
      lus le 24 octobre 2026 dans l'index LEGI : L. 313-3 (LEGIARTI000006742453,
      LEGIARTI000020123579 : « jusqu'à des âges limites [...] a) les enfants placés en
      apprentissage [...] ; b) les enfants qui poursuivent leurs études ; c) les enfants
      qui, par suite d'infirmités ou de maladies chroniques, sont dans l'impossiblité
      permanente de se livrer à un travail salarié ») ; R. 313-12 (LEGIARTI000006749965,
      966 : seize ans, dix-huit pour l'apprenti, « vingt ans pour les enfants qui
      poursuivent leurs études » et l'enfant infirme) ; L. 161-1 (LEGIARTI000031686766 :
      « Les enfants mineurs à leur charge et, jusqu'à un âge limite [...] a) Les enfants
      qui poursuivent leurs études ; b) Les enfants qui, par suite d'infirmités ou de
      maladies chroniques, sont dans l'impossibilité permanente d'exercer un travail
      salarié ») et R. 161-4 (LEGIARTI000031827756 : « La limite d'âge prévue au 2° de
      l'article L. 161-1 est fixée à vingt ans ») ; R. 353-10 (LEGIARTI000006749416 : « La
      majoration est supprimée le premier jour du mois suivant celui au cours duquel
      l'assuré cesse d'y avoir droit ») ; D. 173-21-1 (LEGIARTI000006735543,
      LEGIARTI000022266577), D. 173-21-7 (LEGIARTI000034624366) et R. 173-17-3
      (LEGIARTI000053327900) : « accordée, par priorité, par le régime auquel l'assuré a
      été affilié en dernier lieu si ce régime sert la majoration. Lorsque l'assuré
      décédé relevait simultanément à la date de son décès de plusieurs régimes servant
      la majoration, le service et la charge de cette majoration incombent au régime qui
      verse la pension de réversion rémunérant la plus longue durée d'assurance » ;
      L. 732-50 du code rural (LEGIARTI000006585611, 612) ; et dans l'index JORF, le
      décret n° 2015-1865 du 30 décembre 2015, article 10, 18° (« A l'article R. 353-9,
      la référence : « R. 313-12 » est remplacée par la référence : « R. 161-4 » »), et
      article 12 (« Le présent décret entre en vigueur le 1er janvier 2016 »)
    date: 2026-10-24
  - type: circulaire_cnav
    reference: >-
      exposés de la base de législation de la Cnav, lus par son API : « Majoration
      forfaitaire pour charge d'enfant - Conditions d'attribution » (21 janvier 2026), «
      - Montant » et « - Point de départ » (24 octobre 2025), « Qualité d'enfant à
      charge » (22 janvier 2026) ; avant juillet 2004, « n'était pas attribuée au
      conjoint survivant remarié ou vivant maritalement » ; « MFE réduite = montant de
      la majoration × (Retraite de réversion réduite ÷ Retraite de réversion entière) »,
      non réduite au partage entre conjoints ; relus le 24 octobre 2026 : « Si
      plusieurs régimes de base français peuvent attribuer la majoration pour charge
      d'enfant, le régime de la dernière affiliation de l'assuré est prioritaire [...].
      Si le dernier régime est un des régimes visés par la liquidation unique (Lura), le
      régime compétent pour la liquidation unique sert la majoration » ; « Si les
      conditions ne sont pas remplies à cette date, elle est attribuée le 1er jour du
      mois qui suit la date à laquelle les conditions sont remplies » ; depuis 2016, «
      L'âge limite est fixé à la majorité », « repoussé à 20 ans » pour l'étudiant et
      l'enfant infirme, et « Les apprentis et les stagiaires de la formation
      professionnelle inscrits dans un établissement scolaire ou universitaire sont
      considérés poursuivre leurs études » ; avant, « l'âge limite était repoussé à la
      veille du 20ème anniversaire » pour l'apprenti, l'étudiant et l'enfant infirme
    date: 2026-01-22
    url: https://legislation.lassuranceretraite.fr/#/expose?file_leaf_ref=mfe_qualite_enfant_charge_ex.aspx
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 76/88 du 29 juin 1988, lue le 9 octobre 2026 par l'API de la
      base de législation de la Cnav, fiche n° 9 : « La majoration n'est plus servie
      lorsque son bénéficiaire se remarie, vit maritalement, perçoit [...] une retraite
      personnelle » ou « lorsque l'enfant n'est plus à charge » ou « atteint l'âge
      limite » ; « Date de cessation du versement : 1er jour du mois suivant celui au
      cours duquel l'une des conditions d'attribution n'est plus satisfaite à
      l'exception de la condition d'âge du titulaire du droit de réversion » ; fiche
      n° 4 : l'enfant « n'est plus à charge le jour de son » anniversaire — vingt ans
      l'étudiant et l'enfant infirme, dix-huit l'apprenti, « percevoir un salaire < à
      55 % du SMIC » ; relue le 24 octobre 2026 : « La majoration est attribuée au plus
      tôt le 1er janvier 1988 », demandée aux titulaires d'une réversion « âgés de moins
      de 65 ans dont le point de départ de la prestation se situe au plus tard le 1er
      janvier 1988 » (§ 3 et 31) ; « dans l'hypothèse où l'enfant redeviendrait à
      charge après avoir cessé de l'être [...] La majoration est alors payée à compter
      du premier jour du mois suivant la date à laquelle l'ensemble des conditions sont
      à nouveau remplies » (§ 6) ; fiche n° 7 : le régime de la dernière affiliation,
      puis « celui qui valide la plus longue durée d'assurance », et « en cas d'égalité
      de durée d'assurance », celui de la réversion « dont le montant est le plus élevé »
    date: 1988-06-29
    url: https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_7688_29061988.aspx
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 44/94 du 18 mai 1994, lue le 24 octobre 2026 par l'API : «
      quel que soit le niveau de leurs rémunérations, les jeunes apprentis ou en
      formation professionnelle peuvent être considérés à charge jusqu'à 20 ans (au
      lieu de 18) pour ouvrir droit à l'allocation de veuvage ou à la majoration des
      pensions de réversion » ; « Ces dispositions s'appliquent aux dossiers en cours et
      à venir à la date de publication de la présente circulaire »
    date: 1994-05-18
    url: https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_4494_18051994.aspx
  - type: circulaire_cnav
    reference: >-
      barème « Montant mensuel de la majoration forfaitaire pour charge d'enfant » de la
      Cnav, de 400 F au 1er janvier 1988 à 113,59 € au 1er janvier 2026
    date: 2026-10-09
    url: https://legislation.lassuranceretraite.fr/#/bareme?file_leaf_ref=mfe_montant_bar.aspx
  - type: service_public
    reference: >-
      fiche F13104, « Pension de réversion de l'Assurance retraite », vérifiée le 1er
      janvier 2026, lue le 24 octobre 2026 : « Le montant de la majoration est de 113,59
      par enfant et par mois » ; « Le versement de la majoration forfaitaire pour enfant
      à charge cesse lorsque vous percevez une pension de retraite ou lorsque l'enfant
