  - id: LEGIARTI000024111781
    article: R. 26 ter du code des pensions civiles et militaires de retraite, I, seule
      rédaction, que le décret n° 2011-620, article 3 (JORFARTI000024110126), insère
    en_vigueur: 2011-06-03
    citation: >-
      « 1° Sont considérés comme remplissant la condition d'interruption d'activité les
      fonctionnaires qui ont interrompu leur activité pendant une durée d'au moins une
      année au cours de la période comprenant l'année civile de la naissance ou de
      l'adoption de l'enfant et les deux années civiles suivantes ou, si l'enfant est né
      ou a été adopté au cours d'un second semestre, au cours de la période comprenant les
      trois années civiles suivant celle de cette naissance ou adoption, et qui justifient,
      au titre des deux années précédant l'année de la naissance ou de l'adoption, d'une
      durée d'assurance, telle que définie à l'article L. 14, égale ou supérieure à huit
      trimestres. Cette interruption d'activité doit être intervenue dans le cadre des
      congés ou de la disponibilité mentionnés au 1° de l'article R. 13 du présent code ;
      2° Sont considérés comme remplissant la condition de réduction d'activité les
      fonctionnaires qui ont accompli leur service à temps partiel pendant une période
      d'au moins deux années pour une quotité de temps de travail de 50 % [...] ; 3° Le
      nombre minimum de trimestres de durée d'assurance, telle que définie à l'article L.
      14, dont doit justifier le fonctionnaire, à raison de l'exercice d'une activité
      professionnelle, préalablement à l'interruption ou à la réduction d'activité
      mentionnée dans les deux alinéas précédents, est fixé à huit trimestres »
  - id: LEGIARTI000023449727
