  - >-
    À la file des complémentaires : servir sans coefficient à ces parents l'Agirc-Arrco,
    que l'accord du 18 mars 2011 (article 1er) et celui du 17 novembre 2017 (article 84)
    servent sans abattement, l'Ircantec, qui les nomme (arrêté du 30 décembre 1970,
    article 16, I, 3°, d), et le RCI (règlement, article 12) ; dire de quel âge
    l'Agirc-Arrco compte leur coefficient avant soixante-cinq ans depuis 2019, et ce
    qu'elle sert aux points de l'Arrco des cultes, que les textes lus ne tranchent pas.
    À la file du régime général : servir le même âge aux fonctionnaires (article 28, III,
    et R. 26 ter, dont la forme de l'interruption n'est pas saisie), à la CAVIMAC et aux
    points d'avant 1973 ; puis aux non-salariés agricoles (article 21, IV), aux libéraux
    (R. 643-7) et aux avocats (R. 723-38, puis R. 653-2), dont les rédactions de 2016 à
    2022 restent à lire.
