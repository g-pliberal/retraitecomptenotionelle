    à 0,95 (5 trimestres jusqu'à 66 ans et 2 mois), à 1 s'ils se comptaient de
    soixante-cinq ans. Les deux moteurs le servent
    (tests/test_taux_plein_a_soixante_cinq_ans.py, NON_TRANCHE et la tranche C).
