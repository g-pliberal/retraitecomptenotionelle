  nee_de: LEGIARTI000023023835
  bornes:
    liquidation.date_effet: [2011-07-01, 2026-01-01]
  contenu:
    droit: >-
      l'âge du 1° de L. 351-8 est soixante-cinq ans pour l'assuré né du 1er juillet 1951 au
      31 décembre 1955 qui a eu ou élevé trois enfants, a validé au plus huit trimestres
      l'année de la naissance de l'un d'eux et les deux suivantes — les trois suivantes
      s'il est né au second semestre —, sans compter l'AVPF, l'invalidité ni l'accident du
      travail, huit au moins les deux années qui la précèdent, cotisés ou au titre de la
      maladie, de la maternité, du chômage, de la formation, et huit trimestres d'activité
      avant elle, jusqu'au dernier jour du trimestre civil qui la précède. La décote
      s'annule à soixante-cinq ans, et se compte jusqu'à son soixante-cinquième
      anniversaire (R. 351-27) ; la majoration de durée court après lui (R. 351-7). Le
      fonctionnaire sédentaire de l'État, de la CNRACL ou l'ouvrier de l'État né dans les
      mêmes générations, qui a trois enfants (L. 18, II), a interrompu son activité au
      moins une année l'année de la naissance de l'un d'eux et les deux suivantes — les
      trois suivantes s'il est né au second semestre —, dans un congé ou une disponibilité
      de R. 13, 1°, ou travaillé à temps partiel de R. 13, 2°, deux ans à 50 %, un an et
      huit mois à 60 %, un an et cinq mois à 70 %, qui a huit trimestres de durée
      d'assurance les deux années d'avant et huit d'activité avant l'interruption (R. 26
      ter, I) : l'âge d'annulation de sa décote, la limite d'âge moins les trimestres du
      tableau de l'article 66, III, de la loi n° 2003-775, ne peut être supérieur à
      soixante-cinq ans (loi n° 2010-1330, article 28, III ; décrets n° 2003-1306,
      article 65-3, et n° 2004-1056, article 50-3). Les trimestres de décote se comptent
      jusqu'à lui (L. 14, I, 1°), et le minimum garanti s'ouvre à lui (L. 17). La borne ne
      change rien aux générations de 1951 à 1953, dont le tableau annule la décote avant
      soixante-cinq ans ; elle vaut pour celles de 1954 (65 ans et 4 ou 7 mois) et de 1955
      (66 ans et 3 mois). Aux cultes, le même âge (L. 382-27) : la fraction d'après 1997 au
      taux plein à soixante-cinq ans, décotée avant jusqu'à son soixante-cinquième
      anniversaire ; celle d'avant 1998 allouée à soixante-cinq ans (D. 721-6 du code de
      1985), avec la majoration du V, et, avant, minorée du coefficient de R. 351-27, I, 2°,
      et II (décret n° 2006-1325, article 2) ; les années cultuelles d'avant 1979, prises en
      compte (D. 721-11), que le modèle tient pour non cotisées sans qu'aucun texte lu
      (D. 721-11, L. 721-3, L. 721-6 du code de 1985) l'écrive, ne comptent pas parmi les
      huit trimestres des deux années d'avant la naissance. Aux points d'avant 1973 des
      artisans et des commerçants, la minoration se compte jusqu'au soixante-cinquième
      anniversaire (décret n° 73-937, article 3, II)
    beneficiaire: >-
      le parent de trois enfants né du 1er juillet 1951 au 31 décembre 1955, qui a cessé ou
      réduit son activité après la naissance de l'un d'eux ; le fonctionnaire sédentaire
      qui l'a interrompue au moins un an dans un congé ou une disponibilité pour l'élever
    parametres:
      existe: true
      age: 65
      regimes: [regime_general, msa_salaries, rsi, cavimac, cancava_avant_1973,
        organic_avant_1973]
      parents_de_trois_enfants:
        nes_du: [1951, 7]
        nes_au: [1955, 12]
        enfants: 3
        apres_au_plus: 8
        avant_au_moins: 8
        activite_au_moins: 8
      fonctionnaires:
        regimes: [fonction_publique_etat, cnracl, fspoeie]
        interruptions: [education_enfant]
        interruption_au_moins_annees: 1
        avant_au_moins: 8
        activite_au_moins: 8
  exemples: aucun trouvé
