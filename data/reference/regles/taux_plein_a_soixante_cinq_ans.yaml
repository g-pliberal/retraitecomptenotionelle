textes_a_rattacher:
- reference: L. 351-8 CSS, 1° bis et 6°
- reference: loi n° 2010-1330 du 9 novembre 2010, article 20, III
- id: LEGIARTI000051289852
  article: L. 351-8 CSS
  en_vigueur: 2025-02-28
  change: >-
    le 6° garde le taux plein à soixante-cinq ans au parent qui a une majoration de durée
    pour enfant handicapé ou qui a aidé son enfant bénéficiaire de la prestation de
    compensation, pour les pensions prenant effet à compter du 1er janvier 2026 (loi
    n° 2025-199, article 87, II, 19°, que le VIII, A, applique à ces pensions)
code:
  moteur: >-
    L'âge du 1° de L. 351-8 que lit tout le moteur (`ouvrir.age_taux_plein`) est, dans les
    régimes de la version, l'âge qu'elle fixe quand l'assuré en remplit les conditions
    (`categories.age_du_parent_de_trois_enfants`) : sa génération, ses enfants, et, pour
    l'un d'eux dont la saisie déclare la naissance, les trimestres que la carrière valide
    année par année (`Carriere.trimestres_par_annee`) — dans la fenêtre qui suit la
    naissance, hors AVPF, invalidité et accident du travail ; les deux années qui la
    précèdent, l'emploi cotisé (`commun.ligne_cotisee`), la maladie, la maternité et le
    chômage ; l'emploi seul avant
    elle, et, l'année de la naissance, les trimestres civils écoulés avant le sien
    (`categories._remplit_pour_l_enfant`). La décote, la majoration de durée et le
    minimum contributif lisent cet âge sans autre changement ; aux cultes, les deux
    fractions (`liquider.liquider_chaque_regime`, `cultes.fraction_d_avant_1998`) le lisent
    aussi, par le taux plein. Aux fonctionnaires, l'âge
    d'annulation que rend la décote en table de la fonction publique
    (`liquider.decote_opposable`), la limite d'âge moins les trimestres de l'article 66,
    III, est borné à l'âge de la version pour le sédentaire — ni catégorie active dont il a
    les services, ni militaire (`liquider._age_du_parent_sedentaire`) — qui remplit les
    conditions (`categories.age_du_fonctionnaire_parent_de_trois_enfants`) : sa
    génération, ses enfants, et, pour l'un d'eux dont la naissance est déclarée, une année
    au moins dans la fenêtre dont la ligne porte un motif de `interruptions`, la durée
    d'assurance de tous les régimes les deux années d'avant, l'emploi avant la première
    année de l'interruption (`categories._remplit_pour_l_enfant_fonctionnaire`). Les
    trimestres de décote et le minimum garanti lisent cet âge sans autre changement.
  python: >-
    droit/categories.py : age_du_parent_de_trois_enfants, _remplit_pour_l_enfant,
    age_du_fonctionnaire_parent_de_trois_enfants, _remplit_pour_l_enfant_fonctionnaire,
    _regle_du_parent, FICHE_DES_SOIXANTE_CINQ_ANS ; droit/commun.py : ligne_cotisee ;
    droit/liquider.py : decote_opposable,
    _age_du_parent_sedentaire ; droit/ouvrir.py : age_taux_plein ; carriere.py :
    Carriere.trimestres_par_annee
  javascript: >-
    moteur/js/droit/categories.js : ageDuParentDeTroisEnfants, remplitPourLEnfant,
    ageDuFonctionnaireParentDeTroisEnfants, remplitPourLEnfantFonctionnaire, regleDuParent,
    FICHE_DES_SOIXANTE_CINQ_ANS ; moteur/js/droit/commun.js : ligneCotisee ;
    moteur/js/droit/liquider.js : decoteOpposable,
    ageDuParentSedentaire ; moteur/js/droit/ouvrir.js : ageTauxPlein ;
    moteur/js/carriere.js : trimestresParAnnee
  parametres: >-
    contenu.parametres de chaque version : existe, age, regimes, parents_de_trois_enfants,
    fonctionnaires ;
    regimes/regime_general.yaml, regimes/msa_salaries.yaml, regimes/rsi.yaml,
    regimes/cavimac.yaml, regimes/cancava_avant_1973.yaml, regimes/organic_avant_1973.yaml :
    age_taux_plein_par_generation
  tests:
  - >-
    tests/test_taux_plein_a_soixante_cinq_ans.py, qui date la fiche, rend l'âge de
    dix-sept carrières dans les deux moteurs et sert la pension de bout en bout, et
    l'Agirc-Arrco sans coefficient (SANS_ABATTEMENT, NON_TRANCHE, la tranche C), et, aux
    fonctionnaires, l'âge d'annulation de dix-sept carrières (CAS_FONCTIONNAIRES), les
    trois régimes et la catégorie active, la pension de bout en bout (BOUT_EN_BOUT) et le
    minimum garanti à soixante-cinq ans ; aux cultes, la pension de bout en bout
    (CULTES_DE_BOUT_EN_BOUT), les années d'avant 1979 et l'activité cultuelle
    (NON_TRANCHE_CULTES) ; les points d'avant 1973 (AVANT_1973)
historique:
- >-
  2026-11-03 — née de l'étape 4 de l'action 175 (la base de législation de la Cnav, thème
  « Retraite personnelle de base ») : ces taux pleins n'avaient pas de fiche depuis que
  la fiche inaptitude_invalidite_penibilite_amiante a rendu, le 30 septembre 2026, son
  texte à rattacher « L. 351-8 1° bis et 6° ».
- >-
  2026-11-03 — le parent de trois enfants né de juillet 1951 à 1955 est servi dans les
  deux moteurs, sur décision du propriétaire du même jour (action 175, note
  2026-11-03-taux-plein-parents-de-trois-enfants.md) : la fiche passe de
  pas_encore_modelisee à approchee.
- >-
  2026-11-03 — corrigée après la relecture indépendante du même jour (note
  2026-11-03-relecture-taux-plein-parents-de-trois-enfants.md), chaque texte rouvert :
  l'Agirc-Arrco, que la fiche disait garder l'âge de la génération, sert ces parents sans
  abattement (accords du 18 mars 2011 et du 17 novembre 2017) ; cet écart, et ceux des
  fonctionnaires, de la CAVIMAC, des points d'avant 1973 et du RCI, sont déclarés et
  chiffrés, en attendant le calcul ; trois références reprises (note
  2026-11-03-correction-taux-plein-parents-de-trois-enfants.md).
- >-
  2026-11-03 — l'Agirc-Arrco des parents de trois enfants (action 175, note
  2026-11-03-agirc-arrco-des-parents-de-trois-enfants.md) : l'Agirc et l'Arrco de 2011 à
  2018, puis l'Agirc-Arrco, les servent sans coefficient dès qu'ils ont à soixante-cinq
  ans le taux plein du régime général, la tranche C d'avant 2016 gardant le sien, dans les
  deux moteurs ; avant soixante-cinq ans, l'âge d'où se compte leur coefficient reste
  celui de la génération, que les textes lus ne tranchent pas, déclaré.
- >-
  2026-11-03 — les fonctionnaires (file M4 de la sixième vague, décision 14 du
  propriétaire ; note 2026-11-03-taux-plein-parents-de-trois-enfants-fonctionnaires.md) :
  l'âge d'annulation de la décote du sédentaire de l'État, de la CNRACL et de l'ouvrier de
  l'État né de juillet 1951 à 1955, parent de trois enfants, qui a interrompu son activité
  au moins un an pour élever l'un d'eux, est borné à soixante-cinq ans dans les deux
  moteurs (loi n° 2010-1330, article 28, III ; R. 26 ter) ; l'écart déclaré ne garde que
  ce que la saisie ne porte pas.
- >-
  2026-11-03 — la CAVIMAC et les points d'avant 1973 (file M4 de la sixième vague,
  décision 14 du propriétaire ; note
  2026-11-03-taux-plein-parents-de-trois-enfants-cavimac.md) : le même âge à la pension
  des cultes (L. 382-27), ses deux fractions au taux plein à soixante-cinq ans, et aux
  points d'avant 1973 des artisans et des commerçants (décret n° 73-937, article 3, II),
  dans les deux moteurs ; l'emploi des deux années d'avant la naissance compté cotisé
  seulement, ce que l'activité cultuelle d'avant 1979 n'est pas (D. 721-11) ; ce que les
  textes ne tranchent pas de l'activité cultuelle, déclaré. Les deux écarts faibles de
  la relecture R-M4-bis : le congé de maternité de 1978, quatorze semaines, et le renvoi
  des statuts de la CNRACL et des ouvriers de l'État à la sécurité sociale.
- >-
  2026-11-05 — les retouches de la relecture R-M4c (vague 7 ; note
  2026-11-05-retouches-de-la-relecture-r-m4c.md) : D. 721-11 ne dit pas « sans
  cotisation » — la fiche le dit, et cite L. 721-3 et L. 721-6 du code de 1985 avec
  L. 382-25 ; l'effet chiffré du point non tranché, 289,73 € au modèle contre 507,73 € au
  texte de D. 721-6, distingue ce que le modèle servirait de ce que le texte donnerait.
  Aucune valeur, aucune règle ne change.
