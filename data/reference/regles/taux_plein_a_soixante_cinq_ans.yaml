textes_a_rattacher:
- reference: L. 351-8 CSS, 1° bis et 6°
- reference: loi n° 2010-1330 du 9 novembre 2010, article 20, III
- id: LEGIARTI000051289852
  article: L. 351-8 CSS
  en_vigueur: 2025-02-28
  change: >-
    le 6° garde le taux plein à soixante-cinq ans au parent qui a une majoration de durée
    pour enfant handicapé ou qui a aidé son enfant bénéficiaire de la prestation de
    compensation, pour les pensions prenant effet à compter du 1er janvier 2026 (loi
    n° 2025-199, article 87, VIII, C)
code:
  moteur: >-
    L'âge du 1° de L. 351-8 que lit tout le moteur (`ouvrir.age_taux_plein`) est, dans les
    régimes de la version, l'âge qu'elle fixe quand l'assuré en remplit les conditions
    (`categories.age_du_parent_de_trois_enfants`) : sa génération, ses enfants, et, pour
    l'un d'eux dont la saisie déclare la naissance, les trimestres que la carrière valide
    année par année (`Carriere.trimestres_par_annee`) — dans la fenêtre qui suit la
    naissance, hors AVPF, invalidité et accident du travail ; les deux années qui la
    précèdent, l'emploi, la maladie, la maternité et le chômage ; l'emploi seul avant
    elle, et, l'année de la naissance, les trimestres civils écoulés avant le sien
    (`categories._remplit_pour_l_enfant`). La décote, la majoration de durée et le
    minimum contributif lisent cet âge sans autre changement.
  python: >-
    droit/categories.py : age_du_parent_de_trois_enfants, _remplit_pour_l_enfant,
    FICHE_DES_SOIXANTE_CINQ_ANS ; droit/ouvrir.py : age_taux_plein ; carriere.py :
    Carriere.trimestres_par_annee
  javascript: >-
    moteur/js/droit/categories.js : ageDuParentDeTroisEnfants, remplitPourLEnfant,
    FICHE_DES_SOIXANTE_CINQ_ANS ; moteur/js/droit/ouvrir.js : ageTauxPlein ;
    moteur/js/carriere.js : trimestresParAnnee
  parametres: >-
    contenu.parametres de chaque version : existe, age, regimes, parents_de_trois_enfants ;
    regimes/regime_general.yaml, regimes/msa_salaries.yaml, regimes/rsi.yaml :
    age_taux_plein_par_generation
  tests:
  - >-
    tests/test_taux_plein_a_soixante_cinq_ans.py, qui date la fiche, rend l'âge de
    dix-sept carrières dans les deux moteurs et sert la pension de bout en bout
historique:
- >-
  2026-11-03 — née de l'étape 4 de l'action 175 (la base de législation de la Cnav, thème
  « Retraite personnelle de base ») : ces taux pleins n'avaient pas de fiche depuis que
  la fiche inaptitude_invalidite_penibilite_amiante a rendu, le 30 septembre 2026, son
  texte à rattacher « L. 351-8 1° bis et 6° ».
- >-
  2026-11-03 — le parent de trois enfants né de juillet 1951 à 1955 est servi dans les
  deux moteurs, sur décision du propriétaire du même jour (action 175, note
  2026-11-03-taux-plein-parents-de-trois-enfants.md) : la fiche passe de
  pas_encore_modelisee à approchee.
