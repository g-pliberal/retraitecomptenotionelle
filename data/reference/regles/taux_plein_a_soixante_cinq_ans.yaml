    l'âge de la génération, ou, depuis le 3 novembre 2026, jusqu'au soixante-cinquième
    anniversaire de ces parents, comme celle du 7 octobre 2012. Du 7 octobre au 31
    décembre 2012, il garde la première pour qui n'est pas parent de trois enfants.
  effet: non mesuré ; les pensions prenant effet du 7 octobre au 31 décembre 2012
- version: [loi_du_9_novembre_2010]
  textes: >-
    arrêté du 9 février 2012 portant approbation du règlement du régime complémentaire
    obligatoire d'assurance vieillesse des professions artisanales, industrielles et
    commerciales, article 12 (LEGIARTI000054891893, du 1er janvier 2013 au 26 juin 2024)
  ecart: >-
    Le modèle abat les points du RCI, et ceux du RCO des artisans et du NRIC des
    commerçants qu'il liquide avec eux, jusqu'à l'âge de la génération (fiche
    abattement_rci). Le règlement du RCI, article 12, les sert pourtant « sans aucun
    abattement : a) A partir de l'âge fixé à l'article L. 161-17-2 du code de la sécurité
    sociale et à partir de la première liquidation à taux plein de la retraite de base
    servie par le régime social des indépendants » : la retraite de base de ces parents,
    que le modèle sert à taux plein dès soixante-cinq ans, l'ouvre.
  effet: >-
    le parent artisan ou commerçant parti de soixante-cinq ans à l'âge de sa génération.
    L'artisane de l'approximation précédente, à 5 trimestres de 66 ans et 2 mois, reçoit
    dans le modèle ses points du RCI et du RCO des artisans sous le coefficient 0,95, et
    une commerçante ses points du RCI et du NRIC de même ; le droit les sert entiers :
    5 % de sa complémentaire.
- version: [loi_du_9_novembre_2010, loi_du_28_fevrier_2025]
  ecart: >-
    Les autres taux pleins à soixante-cinq ans de la fiche ne sont pas servis : l'aidant
    familial (L. 351-8, 1° bis) ; le parent d'un enfant handicapé ou qui l'aide (article
    20, III, de la loi n° 2010-1330, puis L. 351-8, 6°, depuis le 1er janvier 2026). Ils
    tiennent à des faits que la saisie ne porte pas : trente mois d'interruption pour
    aider une personne handicapée ; un trimestre de majoration pour enfant handicapé
    (L. 351-4-1) ; trente mois d'aide à son enfant bénéficiaire de la prestation de
    compensation.
  effet: non mesuré
effet: >-
  Les parents de trois enfants nés de juillet 1951 à décembre 1955 qui ont cessé ou réduit
  leur activité après une naissance, et que la saisie dit nés au mois, partis de la fin de
  2011 à 2022 sans la durée requise : leur décote ne se compte plus que jusqu'à soixante-cinq
  ans, et s'annule à soixante-cinq ans au lieu de soixante-cinq ans et quatre mois à
  soixante-sept ans. Les autres catégories de la fiche restent décotées. Non mesuré.
  Depuis le 3 novembre 2026, l'Agirc et l'Arrco, puis l'Agirc-Arrco, les servent sans
  coefficient dès soixante-cinq ans, sauf la tranche C d'avant 2016 : de 5,26 % à 8,70 %
  de plus à leur complémentaire, 175,30 € à 274,66 € par an dans les cas posés à la main
  (note 2026-11-03-corrections-de-la-relecture-r-m3b.md, action 175). L'Ircantec et le
  RCI, où vaut le même âge, les abattent encore jusqu'à l'âge de leur génération :
  l'approximation du RCI le chiffre sur un exemple, 5 %. Depuis le 3 novembre 2026, la
  CAVIMAC sert ses deux fractions au taux plein dès soixante-cinq ans, celle d'avant 1998
  majorée jusqu'au minimum de L. 351-10 au prorata de ses trimestres cotisés de 1979 à
  1997, et les points d'avant 1973 des artisans et des commerçants ne sont plus minorés
  à soixante-cinq ans : 6,25 % de plus à cette part pour la génération de 1953, et, à la
  ministre du culte des cas posés à la main, 1 477,03 € au lieu de 842,85 € pour sa
  fraction d'avant 1998 (note 2026-11-03-taux-plein-parents-de-trois-enfants-cavimac.md).
  Depuis le 3 novembre 2026, le fonctionnaire sédentaire de l'État, de la CNRACL et
  l'ouvrier de l'État nés en 1954 et en 1955 qui ont interrompu leur activité au moins un
  an pour élever un enfant, et le disent, ont l'âge d'annulation de leur décote borné à
  soixante-cinq ans : partis à soixante-cinq ans, 2 trimestres de décote de moins au plus
  pour les nés de janvier à mai 1954 (65 ans et 4 mois), 3 pour ceux de juin à décembre
  1954 (65 ans et 7 mois), 5 en 1955 (66 ans et 3 mois), le nombre de trimestres
  « arrondi à l'entier supérieur » (L. 14, I), une décote de 2,5 %, de 3,75 % et de
  6,25 % en moins, et le minimum garanti à soixante-cinq ans.
sources:
  lu_le: 2026-11-03
  prochaine_relecture: 2027-06-30
  a_relire:
  - >-
    Les autres catégories tiennent à un fait que la saisie ne porte pas : trente mois
    d'interruption pour aider une personne handicapée, comme aidant familial ou tierce
    personne ; un trimestre de majoration pour enfant handicapé (L. 351-4-1) ; trente
    mois d'aide à son enfant bénéficiaire de la prestation de compensation.
  - >-
    À la file des complémentaires : servir sans coefficient à ces parents l'Ircantec,
    qui les nomme (arrêté du 30 décembre 1970, article 16, I, 3°, d), et le RCI
    (règlement, article 12) ; dire de quel âge l'Agirc-Arrco compte leur coefficient
    avant soixante-cinq ans, et celui des points de la tranche C d'avant 2016, et ce
    qu'elle sert aux points de l'Arrco des cultes, que les textes lus ne tranchent pas,
    la circulaire 2020-02-DRJ non plus : une circulaire de la caisse qui nomme ces
    parents, ou sa réponse écrite.
    À la file du régime général : servir le même âge aux non-salariés agricoles (article
    21, IV), aux libéraux (R. 643-7) et aux avocats (R. 723-38, puis R. 653-2), dont les
    rédactions de 2016 à 2022 restent à lire. Aux fonctionnaires, la réduction d'activité de R. 26 ter, I, 2°, demande le
    motif du temps partiel saisi — un temps partiel pris pour élever un enfant, de R. 13,
    2° —, que la saisie ne porte pas. L'année d'interruption de R. 26 ter, I, 1°, se lirait
    au mois si la carrière portait la durée de chaque période sans emploi, que la saisie
    borne au mois et que le modèle range à l'année (plus de la moitié de ses mois) ; le
    congé de maternité compterait alors sa durée avec le congé parental qui le suit.
  - >-
    Aux cultes : une circulaire, une page ou une réponse écrite de la CAVIMAC qui dise si
    elle compte l'activité cultuelle comme l'activité professionnelle du 2° et du 3° du
    IV, celle d'avant 1979 comprise, et un exemple chiffré de la pension qu'elle sert à
    ces parents.
  - >-
    Une circulaire ou une note du Service des retraites de l'État ou de la CNRACL qui
    dise comment elles ont appliqué l'article 28, III, et R. 26 ter : leurs pages sur la
    décote, lues le 3 novembre 2026, n'en parlent plus.
