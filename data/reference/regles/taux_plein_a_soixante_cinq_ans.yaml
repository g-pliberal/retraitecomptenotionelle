effet: >-
  Les parents de trois enfants nés de juillet 1951 à décembre 1955 qui ont cessé ou réduit
  leur activité après une naissance, et que la saisie dit nés au mois, partis de la fin de
  2011 à 2022 sans la durée requise : leur décote ne se compte plus que jusqu'à soixante-cinq
  ans, et s'annule à soixante-cinq ans au lieu de soixante-cinq ans et quatre mois à
  soixante-sept ans. Les autres catégories de la fiche restent décotées. Non mesuré.
  Leurs complémentaires, et les fonctionnaires, la CAVIMAC et les points d'avant 1973,
  où vaut le même âge, les abattent encore jusqu'à l'âge de leur génération : les
  approximations le chiffrent sur des exemples : de 5 % à 8 % de la complémentaire,
  6,25 % de la pension de base de la fonctionnaire née en 1955, de la ministre du culte
  et des points d'avant 1973.
