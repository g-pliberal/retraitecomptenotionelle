    (LEGIARTI000006646773, LEGIARTI000006646774) ; l'assurance vieillesse des parents au foyer : code de la
    sécurité sociale, L. 381-1 (LEGIARTI000006742941)
  ecart: >-
    Aux fonctionnaires : depuis le 3 novembre 2026, le modèle borne à soixante-cinq ans
    l'âge d'annulation de la décote du sédentaire de l'État, de la CNRACL et de l'ouvrier
    de l'État qui remplit les conditions de l'article 28, III, et de R. 26 ter, que les
    articles 65-3 et 50-3 étendent. Il ne les lit que dans ce que la saisie porte.
    L'interruption « pendant une durée d'au moins une année », « dans le cadre des congés
    ou de la disponibilité mentionnés au 1° de l'article R. 13 » : les années que la
    saisie dit « élever un enfant », chacune comptée une année entière, quand une période
    sans emploi qu'elle borne au mois donne son motif à l'année dont elle occupe plus de
    la moitié des mois : une année « élever un enfant » a pu n'en compter que sept. R. 26
    ter ne dit pas l'année continue, quand son II veut, de l'aidant familial, « trente
    mois consécutifs ». Depuis le 3 novembre 2026, à la relecture R-M4, une année dite
    « congé de maternité » ne compte pas : le congé de maternité est un congé de R. 13,
    1°, a, mais il dure seize semaines, vingt-six à partir du troisième enfant, de
    dix-huit à quarante-six pour des naissances multiples (L. 331-3 et L. 331-4 du code
    de la sécurité sociale, auxquels renvoient, « d'une durée égale à celle prévue par la
    législation sur la sécurité sociale », l'article 34, 5°, de la loi n° 84-16 pour le
    fonctionnaire de l'État, l'article 57, 5°, de la loi n° 84-53 et l'article 41, 5°, de
    la loi n° 86-33 pour celui de la CNRACL, l'article 4 du décret n° 72-154 pour
    l'ouvrier de l'État ; pour la salariée, au code du travail, L. 122-26, quatorze
    semaines jusqu'au 30 septembre 1978, seize dès le 1er octobre 1978), deux de
    plus pour un état pathologique (L. 331-5), et, depuis le 20 décembre 2005, les jours
    qui séparent une naissance très prématurée du début du congé ; la saisie n'en dit ni
    la durée, ni le nombre des enfants nés, ni ce qui l'a suivi, et un relevé range
    l'adoption avec lui. Le congé de maternité suivi d'un congé parental ou d'une
    disponibilité se dit « élever un enfant ». Une année dite « sans activité » n'est pas
    lue comme un congé parental ni comme une disponibilité pour élever un enfant, et une
    année « élever un enfant » est lue comme l'un d'eux, quand elle a pu être une
    disponibilité pour convenances personnelles ou une démission. De même l'année qu'un
    relevé porte à l'assurance vieillesse des parents au foyer : L. 381-1 l'ouvre au
    parent « n'exerçant pas d'activité professionnelle, bénéficiaire du complément
    familial, de l'allocation au jeune enfant ou de l'allocation parentale d'éducation »,
    sous un plafond de ressources (LEGIARTI000006742941 ; ni LEGIARTI000006742945 ni
    LEGIARTI000023034972 ne demandent davantage), sans congé ni disponibilité : elle ne
    prouve pas le cadre de R. 13, que le modèle présume. La réduction d'activité, un temps partiel de R.
    13, 2°, « pendant une période d'au moins deux années pour une quotité de temps de
    travail de 50 % », un an et huit mois à 60 %, un an et cinq mois à 70 %, n'est pas
    lue : le temps partiel saisi ne dit pas son motif. Les enfants de L. 18, II, que la
    saisie ne distingue pas — du conjoint, délégués, sous tutelle, recueillis — sont
    comptés dans leur nombre ; l'adoption n'est pas saisie. Que ces enfants aient dû
    « avoir été élevés pendant au moins neuf ans » (L. 18, III), ce que la majoration de
    pension demande, le texte ne le tranche pas : l'article 28, III, ne renvoie qu'au II
    de L. 18, et le 1° du IV de l'article 20 au deuxième alinéa de L. 351-12 du code de
    la sécurité sociale, « les enfants élevés dans les conditions prévues au deuxième
    alinéa de l'article L. 342-4 » ; le modèle ne lit pas cette durée.
  effet: >-
    le fonctionnaire parent qui a cessé son activité sans la dire « élever un enfant », ou
    qui l'a réduite à temps partiel, parti de soixante-cinq ans à son âge d'annulation ;
    à l'inverse, celui dont l'année « élever un enfant » n'a été que sept mois, une
    démission, une disponibilité pour convenances personnelles ou une année d'AVPF sans
    congé ni disponibilité, a la borne que le droit ne lui donne pas. La
    fonctionnaire de l'État née le 15 mars 1955, sans activité de 1978 à 2002, trois
    enfants nés en avril 1978, juin 1980 et juin 1982, partie à soixante-cinq ans en 2020 :
    66 ans et 3 mois (« Limite d'âge moins 3 trimestres » en 2017, de soixante-sept ans),
    5 trimestres après soixante-cinq ans ; le modèle lui sert 75 % × (1 − 5 × 1,25 %) =
    70,3125 %, de même à la CNRACL et aux ouvriers de l'État ; dites « élever un enfant »,
    ses années 1978 à 1980 lui donnent 75 %, ce que le droit lui sert si elles ont été un
    congé ou une disponibilité de R. 13 : 6,25 % de sa pension. Née en septembre 1954, 65
    ans et 7 mois, 3 trimestres : 75 % × (1 − 3 × 1,25 %) = 72,1875 % au lieu de 75 % ;
    née de janvier à mai 1954, 61 ans et 7 mois en 2015, « Limite d'âge moins 5
    trimestres » de 66 ans et 7 mois, 65 ans et 4 mois, 2 trimestres : 75 % × (1 − 2 ×
    1,25 %) = 73,125 %. Nées de 1951 à 1953, rien : le tableau annule leur décote avant
    soixante-cinq ans.
