    (LEGIARTI000023023835) ; décret n° 2011-620, article 2 (LEGIARTI000024111672)
  ecart: >-
    Depuis le 3 novembre 2026, le modèle sert le même âge à la CAVIMAC, dont les ministres
    des cultes « reçoivent une pension de vieillesse dans les conditions définies aux
    articles [...] L. 351-8 à L. 351-13 » (L. 382-27) : ses deux fractions au taux plein à
    soixante-cinq ans, celle d'avant 1998 avec la majoration du V du décret n° 2006-1325,
    article 2 (et du V bis pour les années d'avant 1979), et, avant soixante-cinq ans,
    décotées jusqu'au soixante-cinquième anniversaire (R. 351-27, I, 2°, et le II du même
    article 2). Les deux années qui précèdent la naissance n'y comptent l'emploi que
    cotisé : l'activité cultuelle d'avant 1979, que la CAVIMAC prend en compte (D. 721-11 :
    « sont prises en compte pour l'ouverture du droit et le calcul de la pension » les
    périodes « accomplies antérieurement au 1er janvier 1979 », « sous réserve » que
    l'assuré soit à jour de ses cotisations personnelles), n'en est pas pour le modèle, qui
    la tient pour non cotisée. D. 721-11 ne dit pas « sans cotisation », et aucun texte lu
    ne dit que ces années n'ont pas été cotisées : L. 721-6 du code de 1985 renvoie à un
    décret « les conditions dans lesquelles les périodes d'activité antérieures à la
    création du régime seront prises en compte pour le calcul de la pension », et L. 721-3
    finance le régime « par des cotisations forfaitaires à la charge des assurés »
    (rédactions du 21 décembre 1985 et du 23 juillet 1993, la seconde en vigueur au 31
    décembre 1997), puis L. 382-25, I, 1° (« à la charge des assurés », depuis le 20
    décembre 2005). Aucune rédaction de L. 721-3 d'avant le 21 décembre 1985, qui
    couvrirait 1979 à 1985, n'est à l'index : cette part ne repose que sur la date de
    D. 721-11. CE QUE LES TEXTES NE TRANCHENT PAS :
    l'activité cultuelle est-elle l'« activité professionnelle » que le 2° et le 3° du IV
    demandent, interrompue après la naissance et validée avant elle ? Le code n'en dit
    que des « activités mentionnées à l'article L. 382-15 » ; le décret n° 2011-620 et la
    circulaire Cnav n° 2014-64 ne nomment pas les cultes ; la CAVIMAC ne publie rien de
    la mesure (sa page « Demander ma retraite de base » et son triptyque « retraite » de
    2024, lus le 3 novembre 2026). Le modèle compte l'activité cultuelle comme l'emploi,
    celle d'avant 1979 comprise pour l'activité d'avant la naissance.
  effet: >-
