schema_version: 1
id: taux_plein_a_soixante_cinq_ans
intitule: >-
  Le taux plein dès soixante-cinq ans, quand l'âge du taux plein de la génération est plus
  élevé, pour l'aidant familial qui a interrompu son activité (L. 351-8, 1° bis) ; pour le
  parent qui a une majoration de durée pour enfant handicapé, ou qui a aidé son enfant
  bénéficiaire de la prestation de compensation du handicap (L. 351-8, 6°, depuis la loi
  n° 2025-199 ; avant, l'article 20 de la loi n° 2010-1330) ; pour le parent de trois
  enfants né du 1er juillet 1951 au 31 décembre 1955 qui a cessé ou réduit son activité
  pour en élever un (même article 20), et, chez les fonctionnaires sédentaires de l'État, de
  la CNRACL et les ouvriers de l'État, l'âge d'annulation de sa décote, qui ne peut être
  supérieur à soixante-cinq ans (même loi, article 28, III). Le bénéficiaire de
  l'allocation des travailleurs de l'amiante a sa fiche
  (inaptitude_invalidite_penibilite_amiante).
domaine: decote_surcote
regimes: [cancava_avant_1973, cavimac, cnracl, fonction_publique_etat, fspoeie, msa_salaries,
  organic_avant_1973, regime_general, rsi]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- l'année et le mois de naissance de l'assuré
- le nombre de ses enfants, et la naissance de chacun que la saisie déclare, au mois ou à
  l'année ; une naissance présumée n'est pas lue
- les trimestres que valide chaque année civile de la carrière, ligne par ligne, et la
  nature de la ligne — l'emploi, le chômage, la maladie, la maternité, l'invalidité,
  l'accident du travail, le service militaire — et l'AVPF qu'elle porte ; si l'emploi est
  cotisé, ce que l'activité cultuelle d'avant 1979 n'est pas (droit/commun.py,
  ligne_cotisee)
- le motif de chaque année d'interruption que la saisie déclare — élever un enfant —, le
  statut de chaque ligne, le classement de l'emploi, sédentaire ou
  actif, et la pension militaire (droit/ouvrir.py, derogation_active, droit_militaire)
- liquidation.date_effet
ecrit:
- l'âge du 1° de L. 351-8 de l'assuré au régime général, chez les salariés agricoles,
  chez les artisans et les commerçants et à la CAVIMAC, et celui d'où se compte la
  minoration des points d'avant 1973 des artisans et des commerçants
  (ouvrir.age_taux_plein) — celui où la décote
  s'annule, d'où se comptent la décote (R. 351-27, I, 2°) et la majoration de durée
  (R. 351-7), et que le minimum contributif demande —, soixante-cinq ans au parent de trois
  enfants qui remplit les conditions
- l'âge d'annulation de la décote du fonctionnaire sédentaire de l'État, de la CNRACL et de
  l'ouvrier de l'État (liquider.decote_opposable) — celui jusqu'où se comptent les
  trimestres de décote de L. 14, I, 1°, et que le minimum garanti demande (L. 17) —,
  borné à soixante-cinq ans quand il remplit les conditions de R. 26 ter
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/categories.py, `age_du_parent_de_trois_enfants`, et son jumeau)
# lit : `existe` ; `age`, l'âge que la dérogation fixe ; `regimes`, ceux où elle
# vaut ; `parents_de_trois_enfants`, les conditions du parent de trois enfants —
# `nes_du` et `nes_au`, l'année et le mois de naissance qui bornent ses
# générations ; `enfants`, ceux qu'il doit avoir eus ou élevés ;
# `apres_au_plus`, les trimestres au plus de l'année de la naissance et des deux
# suivantes, ou des trois suivantes pour l'enfant né au second semestre ;
# `avant_au_moins`, les trimestres au moins des deux années qui précèdent ;
# `activite_au_moins`, les trimestres d'activité avant la naissance ;
# `fonctionnaires`, les conditions de R. 26 ter, I, que lit
# `age_du_fonctionnaire_parent_de_trois_enfants` (les générations, les enfants et
# l'âge sont ceux de `parents_de_trois_enfants` et `age`) — `regimes`, ceux du code
# des pensions et de ses décrets ; `interruptions`, les motifs de la saisie dont
# l'année compte entière pour un congé ou une disponibilité de R. 13, 1° — « élever
# un enfant » ; le congé de maternité, qui ne dure pas une année, n'y est pas ;
# `interruption_au_moins_annees`, la durée de l'interruption dans la fenêtre ;
# `avant_au_moins`, la durée d'assurance des deux années d'avant ;
# `activite_au_moins`, l'activité avant l'interruption.
