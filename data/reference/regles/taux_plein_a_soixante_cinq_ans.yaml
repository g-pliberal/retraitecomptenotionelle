  ecart: >-
    Depuis le 3 novembre 2026, le modèle sert ces parents sans coefficient d'anticipation
    à l'Agirc et à l'Arrco, puis à l'Agirc-Arrco, quand ils ont à leur départ le taux plein
    du régime général à soixante-cinq ans (fiche coefficients_anticipation_agirc_arrco,
    ses versions dès le 1er juillet 2011). L'accord du 18 mars 2011, article 1er, « pour
    toute liquidation d'allocations AGIRC et/ou ARRCO prenant effet à compter du 1er
    juillet 2011 et jusqu'au 31 décembre 2018 au plus tard » : « Les participants aux
    régimes AGIRC et ARRCO qui justifient avoir, avant l'âge fixé au 1° de l'article
    L. 351-8 du code de la Sécurité sociale, fait liquider, leur pension d'assurance
    vieillesse, à taux plein, auprès du régime général d'assurance vieillesse de la
    Sécurité sociale ou du régime des assurances sociales agricoles », notamment « en
    application des III et IV de l'article 20 de la loi n° 2010-1330 du 9 novembre 2010
    [...] (aidants familiaux, assurés handicapés, parents d'enfant handicapé et parents de
    3 enfants sous certaines conditions) ; pourront faire liquider leurs allocations AGIRC
    et/ou ARRCO, sans abattement, sur les tranches A et B des rémunérations » ; l'annexe V
    de 1947 et l'annexe E de 1961, article 2 ter, les y admettent « à l'âge de 65 ans ».
    L'accord national interprofessionnel du 17 novembre 2017, article 84, depuis le 1er
    janvier 2019 : « 3. Le participant bénéficie de sa pension au titre du présent régime
    avant l'âge visé au paragraphe 1. et sans application des coefficients viagers
    mentionnés au paragraphe 2. à l'âge auquel il a obtenu la pension d'assurance
    vieillesse du régime général ou du régime des assurances sociales agricoles à taux
    plein » ; son article 98 exclut des coefficients de solidarité, qui ne visent que
    « Les participants, nés à partir du 1er janvier 1957 », « les participants visés au
    III et IV de l'article 20 de la loi n° 2010-1330 du 9 novembre 2010 ainsi qu'au 1° bis
    de l'article L. 351-8 du code de la sécurité sociale qui bénéficient du taux plein dans
    le régime de base dès 65 ans », sa note 1 nommant les « assurés nés entre le 1er
    juillet 1951 et le 31 décembre 1955 parents d'au moins trois enfants ». La tranche C
    garde son coefficient : « Cette annexe n'est pas applicable aux droits constitués
    jusqu'au 31 décembre 2015 sur la tranche C des rémunérations » (annexe V, préambule) ;
    « Ce coefficient correspond à l'application des coefficients d'anticipation visés au
    § 1er du présent article sur les droits du participant constitués sur la tranche C
    jusqu'au 31 décembre 2015 » (convention de 1947, annexe I, article 6, § 3 a), pages
    30 et 31 de la copie mise à jour au 1er janvier 2018) ; depuis 2019, l'article 102 de
    l'accord de 2017 ne l'écrit pas, il en permet le report « sans abattement », et la
    circulaire 2020-02-DRJ le dit en passant, fiche 4, III.1 (page 9 de la fiche) : « les
    participants qui liquident leur retraite complémentaire Agirc-Arrco avec application
    d'un coefficient d'anticipation en fonction de l'âge, y compris les droits constitués
    sur la tranche C des salaires avant 2016 au titre de l'ancien régime Agirc liquidés
    avant l'âge de 67 ans ». Ce que les textes lus ne tranchent pas, et que le modèle
    sert à l'âge de la génération : partis avant soixante-cinq ans, sans le taux plein du
    régime de base, de quel âge se compte leur coefficient — l'accord de 2011 fige l'âge
    de la retraite « dans les rédactions respectives des articles L. 351-8, 1°, et
    L. 161-17-2 du code de la Sécurité sociale en vigueur à la date du présent accord »
    (article 3) et ne les admet qu'« à l'âge de 65 ans » ; depuis 2019, le coefficient se
    compte de « cet âge », celui du 1° de L. 351-8 (article 84, 2), que le IV de l'article
    20 fixe pour eux : « Par dérogation aux dispositions de l'article L. 351-8 du code de
    la sécurité sociale, l'âge mentionné au 1° dudit article est fixé à soixante-cinq ans »,
    quand la circulaire 2020-02-DRJ dit « l'âge de 67 ans, âge visé au 1° de l'article
    L. 351-8 du code de la sécurité sociale pour les participants nés à compter du 1er
    janvier 1955 », sans nommer la dérogation ; de même, l'âge d'où se compte le
    coefficient des points de la tranche C d'avant 2016 ; et les points de l'Arrco des
    cultes, dont la pension de base est celle de la CAVIMAC, quand les accords ne nomment
    que le régime général et les assurances sociales agricoles : le modèle ne les exonère
    pas. Le choix est asymétrique : les autres motifs de la fiche
    coefficients_anticipation_agirc_arrco, qui valent pour tous ses régimes (`regimes:
    null`), exonèrent l'Arrco des cultes sur ce que le moteur lit au régime des salariés
    — l'inaptitude (`invalidite.taux_plein_de_l_inapte`, sur `REGIME_DES_SALARIES`), une
    catégorie de L. 351-8 — ; aucun texte lu ne tranche l'un ni l'autre.
  effet: >-
    ce que le modèle sert sans le trancher. Née le 15 mars 1953, partie avant soixante-cinq
