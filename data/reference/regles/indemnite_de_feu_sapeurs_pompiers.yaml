historique:
- >-
  2026-10-10 — née de l'étape 17 de l'action 138, douzième partie : le sapeur-pompier
  professionnel, qui a son statut depuis le 7 octobre 2026, liquidait sur sa
  rémunération hors primes sans l'indemnité de feu à part, et sans ses retenues
  supplémentaires.
effet: >-
  Le sapeur-pompier professionnel : sa pension se liquide sur son traitement majoré de
  l'indemnité au prorata de ses années de sapeur-pompier ; sa retenue compte 2 % de
  plus, et 1,8 % de 2001 à 2021.
