schema_version: 1
id: indemnite_de_feu_sapeurs_pompiers
intitule: >-
  L'indemnité de feu des sapeurs-pompiers professionnels, depuis 1991, dans l'assiette
  de leurs retenues et dans le traitement que leur pension liquide, intégrée de 1991 à
  2003 et proratisée sur les années de sapeur-pompier, à qui en compte quinze, puis
  dix-sept ; et ses cotisations supplémentaires, jusqu'en 2021.
domaine: salaire_de_reference
regimes:
- cnracl
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- le statut sapeur_pompier_professionnel de la dernière ligne de services, et sa part de
  primes, l'assiette du RAFP
- le taux de l'indemnité et la part comptée, année par année
  (legislation/primes_soumises_a_retenue.yaml)
- les années servies dans le statut, et tous les services que la liquidation retient
- la bonification du cinquième des sapeurs-pompiers (Durees.emplois)
- la radiation pour invalidité et son imputabilité
- liquidation.date_effet
ecrit:
- le traitement de référence majoré de l'indemnité, que la pension liquide
- les retenues et contributions supplémentaires, à la fiche de paie et au compte
  (droit en vigueur)
dates_qui_decident:
- liquidation.date_effet
# Les paramètres que le moteur lit (droit/primes.py, `prime_de_la_pension`, et son
# jumeau) ; la condition est celle des emplois classés (droit/compter.py,
# `condition_d_un_emploi`) : les années servies dans le statut (`annees_dans_l_emploi`),
# sans l'âge, qui diffère la jouissance sans la retirer (`age_anticipe` à faux).
