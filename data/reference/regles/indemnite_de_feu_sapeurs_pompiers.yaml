approximations:
- version: [loi_du_28_novembre_1990, decret_du_30_decembre_2010, decret_du_31_decembre_2024]
  ecart: >-
    La majoration n'est servie qu'à qui est sapeur-pompier à la radiation : l'ancien
    sapeur-pompier, que la loi y admet depuis 2021 sur le traitement de son dernier
    grade de sapeur-pompier, n'est pas suivi. Les services se comptent à l'année dans le
    statut, au jour pour l'ensemble ; dix-sept ans valent pour toute pension prise
    depuis le 1er juillet 2011, sans la montée en charge de la loi du 9 novembre 2010 ;
    seule la radiation pour invalidité imputable au service dispense de la condition.
    La jouissance, que la loi diffère jusqu'à l'âge de la catégorie active, court dès
    la date d'effet : la pension prise plus tôt, une carrière longue, la compte trop tôt,
    et la valorisation des droits acquis, qui liquide à l'âge de la bascule, la compte,
    le droit étant acquis par les années de services.
  effet: >-
    non mesuré, sinon sur la valorisation des droits acquis : le sapeur-pompier né en
    1975 garde la majoration de ses trente années de services à la bascule de 2026
- version: [loi_du_28_novembre_1990]
  ecart: >-
    Les cotisations supplémentaires de 1991 à 2021 et la retenue de 2 % de la
    bonification se prennent sur le traitement et l'indemnité entière, l'intégration ne
    jouant que sur l'assiette de la retenue ordinaire, comme la CNRACL l'écrit ; les
    pensions concédées avant 1991, que la loi révise, ne le sont pas.
  effet: non mesuré
