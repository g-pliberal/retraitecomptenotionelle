schema_version: 1
id: cultes_retraite_complementaire
intitule: >-
  Retraite complémentaire obligatoire des cultes : depuis le 1er janvier 2006, les
  personnes du régime des cultes (L. 382-15) « qui bénéficient d'un revenu d'activité
  perçu individuellement » sont affiliées à une institution de retraite complémentaire
  (L. 921-1). La CAVIMAC recouvre la cotisation sur l'assiette forfaitaire de ses
  autres cotisations, le SMIC mensuel, au « taux de base » de 10,02 % — les 7,87
  % de l'Agirc-Arrco et les 2,15 % de sa contribution d'équilibre générale —, dont
  les trois cinquièmes à la charge de la collectivité ; une institution de l'Arrco
  calcule et sert les points.
regimes: [arrco_cultes]
etat: conforme
effet: >-
  Ministres des cultes rémunérés, depuis 2006 : le modèle ne leur routait que la
  CAVIMAC. Au statut du simulateur, le ministre né en 1975 gagne 14 % de pension
  au scénario 1, celui né en 1955 6,2 %. Fiche `arrco_cultes` — points de l'Arrco
  puis de l'Agirc-Arrco, assiette forfaitaire —, statut `ministre_du_culte` scindé
  de `membre_congregation`, tenu par `test_le_ministre_du_culte_remunere_cotise_a_l_arrco_sur_le_forfait`
  et son pendant JavaScript. Le taux est celui de base : les huit taux spécifiques
  de la CAVIMAC, que rien de publié ne définit, ont leur fiche,
  `cultes_retraite_complementaire_taux_specifiques`.
sources:
  lu_le: 2026-10-13
  prochaine_relecture: 2027-10-13
  a_relire:
  - >-
    Le taux de 2006 à 2019, repris de la tranche 1 de l'Arrco puis de l'Agirc-Arrco :
    les circulaires de la CAVIMAC lues commencent en janvier 2020, et seul un guide
    pour les associations cultuelles le confirme, au 1er mai 2008. Ce guide fait
    aussi verser l'AGFF aux cultes, 2,00 % du forfait, que
    `contributions_equilibre_agirc_arrco.yaml` ne leur fait pas verser (action 138).
  - >-
    Le lecteur de relevé rattache encore toute ligne de la CAVIMAC au ministre rémunéré.
  lectures:
  - type: legifrance
    reference: >-
      L. 921-1 en vigueur (LEGIARTI000047452643) : « Ces dispositions sont applicables
      aux personnes mentionnées à l'article L. 382-15 qui bénéficient d'un revenu
      d'activité perçu individuellement »
    date: 2026-09-23
  - type: autre
    reference: >-
      CAVIMAC, circulaire n° 2026/03 du 27 mai 2026 : « les assiettes forfaitaires
      respectives des cotisations mensuelles d'assurance maladie – maternité – invalidité,
      vieillesse et retraite complémentaire obligatoire des cultes » portées au
      SMIC, 1 867 € ; « RCO — Tous cultes - taux de base » 10,02 %, part collective
      6,01 %, part personnelle 4,01 % ; même règle dans chaque circulaire lisible
      depuis la n° 2021/04 du 15 octobre 2021
    url: https://www.cavimac.fr/publications
    date: 2026-09-23
  - type: autre
    reference: >-
      CAVIMAC, circulaires n° 2020/01 du 17 janvier 2020 et n° 2021/01 du 15 janvier
      2021, deux images numérisées, lues page à page le 13 octobre 2026 : le SMIC
      mensuel arrondi, 1 539 € puis 1 555 €, « constitue la nouvelle assiette
      forfaitaire de calcul des cotisations mensuelles d'assurance maladie –
      maternité – invalidité, vieillesse et retraite complémentaire obligatoire des
      cultes » (n° 2020/01) ; dans les deux, « Taux contractuel de référence
      10, 02 % », « Part collective (60%) », « Part personnelle (40 %) » ; copies
      datées dans data/brut/cultes_rco
    url: https://www.cavimac.fr/publications
    date: 2021-01-15
  - type: autre
    reference: >-
      Actes 6, « Le culte et la législation », chapitre « La rémunération des
      ministres du culte », juin 2008, guide pour les associations cultuelles hors
      culte catholique : cotisations au 1er mai 2008 sur le forfait de 1 309 €,
      « Retraite complémentaire 1 309.00 3.00 39.27 4.50 58.91 » — 3,00 % pour
      l'assuré, 4,50 % pour la collectivité — et « AGFF […] 1 309.00 0.80 10.47
      1.20 15.70 » ; « Par décision de l'ARRCO, la caisse de retraite désignée est
      Vauban Humanis ». Source de seconde main, la seule lue avant 2020 ; copie
      datée dans data/brut/cultes_rco
    url: http://www.actes6.com/images_ok/file/social/remuneration_ministres_culte.pdf
    date: 2008-06-23
  - type: autre
    reference: >-
      Agirc-Arrco, circulaire 2025-2-DRJ du 22 janvier 2025, qui transmet l'avenant
      n° 25 : il attribue « à Malakoff Humanis Agirc-Arrco la gestion de l'ensemble
      des adhésions des ministres des cultes et des membres des congrégations et des
      collectivités religieuses affiliés au régime de base » de la CAVIMAC, y
      compris outre-mer, depuis le 1er janvier 2025 ; copie datée dans
      data/brut/cultes_rco
    url: https://www.agirc-arrco.fr/storage/2025/01/CirculaireAgircArrco2025-2drj.pdf
    date: 2025-01-22
  - type: autre
    reference: >-
      CAVIMAC, espace partenaires : « Il a été institué à compter du 1er janvier
      2006 (Loi n° 2005 – 1579 du 19 décembre 2005) une couverture de retraite complémentaire
      obligatoire pour les ministres des cultes. Tous les ministres des cultes,
      quelle que soit leur nationalité, qui perçoivent des rémunérations individuelles
      du fait de leur activité cultuelle, sont assujettis, à titre obligatoire »
      ; gestion par des institutions de l'Arrco
    url: https://www.cavimac.fr/bienvenue-sur-lespace-partenaires
    date: 2026-09-23
textes_a_rattacher:
- reference: >-
    loi n° 2005-1579 du 19 décembre 2005, article 75, VII (JORFARTI000002070677)
- reference: >-
    code de la sécurité sociale, L. 921-1, de sa version du 20 décembre 2005 (LEGIARTI000006745503)
    à celle en vigueur depuis le 1er septembre 2023 (LEGIARTI000047452643), la phrase
    dans toutes
- reference: >-
    code de la sécurité sociale, R. 382-89 et R. 382-90 : l'assiette forfaitaire
    du régime des cultes
textes_sans_effet:
- reference: >-
    avenant n° 25 du 18 décembre 2024 à l'accord Agirc-Arrco, avis d'extension du
    9 avril 2025 (JORFARTI000051439935), texte lu dans la circulaire Agirc-Arrco
    2025-2-DRJ du 22 janvier 2025, hors JORF
  article: annexe B, article 2, dernière phrase
  citation: >-
    « La dernière phrase de l'article 2 de l'Annexe B est complétée de la façon
    suivante : après le mot « employeur » est ajoutée la phrase suivante « et aux
    ministres des cultes et aux membres des congrégations et des collectivités
    religieuses affiliés au régime de base de la Caisse d'assurance vieillesse,
    invalidité et maladie des cultes (CAVIMAC). » » ; « Le présent avenant entre en
    vigueur à compter du 1er janvier 2025. »
  lu_le: 2026-10-13
  empreinte: sha256:69986ec98ea0a734b1134ed63a83066269435aa9d8231cf130b81045fa35ebc1
  motif: >-
    l'annexe B désigne les « institutions compétentes » : l'avenant confie les
    cultes à Malakoff Humanis Agirc-Arrco, outre-mer compris, sans toucher
    l'assiette, le taux ni les points
reformes:
- cultes_arrco_2006
code:
  interrupteurs:
    assiette_forfaitaire: true
  moteur: >-
    `assiette_forfaitaire` : la cotisation se prélève sur l'assiette forfaitaire des autres
    cotisations des cultes, le SMIC mensuel, que la fiche `cultes_salaire_annuel_moyen`
    décrit.
  python: >-
    carriere.py : Affiliations.regimes ; droit/acquerir.py : acquerir ;
    donnees/regimes.py : PeriodeRegime.repere_assiette ; moteur/compte.py :
    ConstructeurCompte._cotisation_ligne ; contributions_equilibre.py :
    contributions_d_une_carriere, _forfait
  javascript: >-
    moteur/js/regimes.js : Affiliations.regimes, PeriodeRegime.repereAssiette ;
    moteur/js/droit/acquerir.js : acquerir ; moteur/js/compte.js :
    ConstructeurCompte._cotisationLigne ; moteur/js/contributions-equilibre.js :
    contributionsDUneCarriere, forfait
  parametres: >-
    regimes/arrco_cultes.yaml : assiette_repere_smic, taux_cotisation_retraite,
    part_salariale, points_de ; regimes/valeurs_point.csv : arrco, agirc_arrco ;
    legislation/affiliations.yaml : affiliations.ministre_du_culte ;
    legislation/contributions_equilibre_agirc_arrco.yaml : contributions
  tests: [tests/test_simulateur.py, tests/test_contributions_equilibre.py,
    tests/js/moteur.test.js, tests/temoins/simulations.json]
