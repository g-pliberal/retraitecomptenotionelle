schema_version: 1
id: cultes_retraite_complementaire
intitule: >-
  Retraite complémentaire obligatoire des cultes : depuis le 20 décembre 2005, les personnes
  du régime des cultes (L. 382-15) « qui bénéficient d'un revenu d'activité perçu
  individuellement » sont affiliées à une institution de retraite complémentaire (L. 921-1),
  de l'Arrco jusqu'en 2018, de l'Agirc-Arrco depuis. La CAVIMAC recouvre la cotisation sur
  l'assiette forfaitaire de ses autres cotisations, le SMIC mensuel, au taux de la tranche 1
  — depuis 2019, un « taux de base » de 10,02 %, les 7,87 % de l'Agirc-Arrco et les 2,15 %
  de sa contribution d'équilibre générale —, dont les trois cinquièmes à la charge de la
  collectivité ; l'institution calcule et sert les points.
domaine: points
regimes: [arrco_cultes]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- >-
  le statut de chaque année : ministre du culte qui perçoit un revenu d'activité
  individuellement, ou membre d'une congrégation qui n'en perçoit pas
- >-
  la base forfaitaire de chaque année, celle des autres cotisations des cultes : le SMIC
  horaire fois la durée légale du travail mensuel (R. 382-89, R. 382-90)
- >-
  le taux de la tranche 1 de l'Arrco, puis de l'Agirc-Arrco, sa part salariale et le prix
  d'achat de leur point ; les contributions d'équilibre de leur barème
ecrit:
- >-
  les points de l'Arrco, puis de l'Agirc-Arrco, du ministre du culte rémunéré, achetés sur
  la base forfaitaire
- >-
  sa cotisation, dont les trois cinquièmes à la charge de la collectivité, et, depuis 2019,
  la contribution d'équilibre générale, qui n'achète aucun point
