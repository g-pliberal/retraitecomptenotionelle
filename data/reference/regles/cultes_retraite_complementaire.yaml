effet: >-
  Ministres des cultes rémunérés, depuis 2006 : le modèle ne leur routait que la
  CAVIMAC. Au statut du simulateur, le ministre né en 1975 gagne 14 % de pension
  au scénario 1, celui né en 1955 6,2 %. Fiche `arrco_cultes` — points de l'Arrco
  puis de l'Agirc-Arrco, assiette forfaitaire —, statut `ministre_du_culte` scindé
  de `membre_congregation`, tenu par `test_le_ministre_du_culte_remunere_cotise_a_l_arrco_sur_le_forfait`
  et son pendant JavaScript. Le taux est celui de base : les huit taux spécifiques
  de la CAVIMAC, que rien de publié ne définit, ont leur fiche,
  `cultes_retraite_complementaire_taux_specifiques`. Lue au droit le 3 novembre 2026 : le
  modèle ne fait pas verser au ministre l'AGFF de 2006 à 2018, qui n'achète aucun point.
