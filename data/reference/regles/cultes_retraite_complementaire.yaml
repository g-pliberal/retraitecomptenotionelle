code:
  interrupteurs:
    assiette_forfaitaire: true
  moteur: >-
    `assiette_forfaitaire` : la cotisation se prélève sur l'assiette forfaitaire des autres
    cotisations des cultes, le SMIC mensuel, que la fiche `cultes_salaire_annuel_moyen`
    décrit, au SMIC de chaque mois (`smic_du_mois`) : la caisse modifie au mois du relèvement
    « les assiettes forfaitaires respectives des cotisations mensuelles [...] vieillesse et
    retraite complémentaire obligatoire des cultes » (circulaire n° 2025/01). Les affiliations ne routent le régime qu'au statut `ministre_du_culte`, depuis
    2006, et les points sont ceux du régime que nomme `points_de`.
  python: >-
    carriere.py : Affiliations.regimes ; droit/acquerir.py : acquerir ;
    donnees/regimes.py : PeriodeRegime.repere_assiette ; moteur/compte.py :
    ConstructeurCompte._cotisation_ligne ; contributions_equilibre.py :
    contributions_d_une_carriere, _forfait
  javascript: >-
    moteur/js/regimes.js : Affiliations.regimes, PeriodeRegime.repereAssiette ;
    moteur/js/droit/acquerir.js : acquerir ; moteur/js/compte.js :
    ConstructeurCompte._cotisationLigne ; moteur/js/contributions-equilibre.js :
    contributionsDUneCarriere, forfait
  parametres: >-
    contenu.parametres de chaque version : assiette_forfaitaire, assiette_repere_smic,
    contribution_agff, contribution_ceg, part_salariale, points_de, smic_du_mois,
    statuts_affilies, taux_cotisation_retraite ; regimes/arrco_cultes.yaml :
    assiette_forfaitaire, assiette_repere_smic, smic_du_mois, taux_cotisation_retraite,
    part_salariale, points_de ; macro/smic_horaire_releves.csv : smic_horaire ;
    regimes/valeurs_point.csv : arrco, agirc_arrco ;
    legislation/affiliations.yaml : affiliations.ministre_du_culte,
    affiliations.membre_congregation ;
    legislation/contributions_equilibre_agirc_arrco.yaml : contributions
  tests:
  - >-
    tests/test_cultes_au_droit.py, qui confronte chaque version aux périodes du régime, à
    ses affiliations et au barème des contributions d'équilibre, et tient l'écart déclaré
  - tests/test_simulateur.py
  - tests/test_contributions_equilibre.py
  - tests/js/moteur.test.js
  - tests/temoins/simulations.json
