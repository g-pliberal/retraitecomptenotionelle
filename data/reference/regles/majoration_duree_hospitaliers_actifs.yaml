schema_version: 1
id: majoration_duree_hospitaliers_actifs
intitule: >-
  Majoration de durée d'assurance des fonctionnaires hospitaliers de catégorie active,
  pour les pensions prenant effet depuis 2008 : quatre trimestres par période de dix
  années de services effectifs, au prorata, pour la seule décote ; cumulée depuis
  septembre 2023 avec les bonifications des emplois classés dans la limite de vingt
  trimestres.
domaine: duree
regimes:
- cnracl
etape: compter_les_durees
face: droit
etat: approchee
lit:
- les années servies dans le statut fonctionnaire_hospitalier_actif, et la dernière
  année servie dans la fonction publique civile
- les années de services effectifs dans les statuts de la fonction publique civile
- la durée de services actifs et l'âge anticipé de la génération
  (legislation/categorie_active.csv)
- l'âge à la liquidation
- liquidation.date_effet
ecrit:
- les trimestres de majoration de la durée d'assurance que la CNRACL oppose à sa
  décote (Durees.emplois)
dates_qui_decident:
- liquidation.date_effet
# Les paramètres que le moteur lit (droit/compter.py, `trimestres_des_emplois`, et
# son jumeau), comme pour la bonification des policiers : `nature: majoration`
# dit que le droit ne touche ni les services liquidés ni la durée tous régimes,
# mais la seule durée que la CNRACL oppose à sa décote ; `services_comptes`, les
# statuts dont les années sont des services effectifs de la fonction publique
# civile, sur lesquels se compte le dixième.
versions:
- id: avant_2008
  statut: lue
  textes:
  - {id: LEGIARTI000006758626, article: 78, en_vigueur: 2004-01-01}
  - {id: LEGIARTI000006400884, article: 21, en_vigueur: 2004-01-01}
  nee_de: LEGIARTI000006758626
  bornes:
    liquidation.date_effet: [null, 2008-01-01]
  contenu:
    droit: >-
      aucune majoration : elle ne vaut que pour qui réunit les conditions de la catégorie
      active « à compter de l'année 2008 », les droits s'ouvrant « à compter du 1er
      janvier 2008 au plus tôt » (réponse ministérielle du 6 mai 2008)
    parametres:
      existe: false
  exemples: aucun trouvé
- id: loi_de_2003
  statut: lue
  textes:
  - {id: LEGIARTI000006758626, article: 78, en_vigueur: 2004-01-01}
  - {id: LEGIARTI000006400884, article: 21, en_vigueur: 2004-01-01}
  nee_de: LEGIARTI000006758626
  bornes:
    liquidation.date_effet: [2008-01-01, 2011-07-01]
  contenu:
    droit: >-
      « la durée d'assurance fait l'objet d'une majoration. Cette majoration est fixée à
      un an par période de dix années de services effectifs », « pour l'application des
      dispositions du I de l'article L. 14 » : la décote seule ; services effectifs
      « en catégorie active ou sédentaire, auprès des fonctions publiques
      hospitalière, territoriale ou de l'État », sans plafond
    conditions: >-
      fonctionnaire hospitalier dont la limite d'âge est de soixante ans, qui réunit les
      conditions de la catégorie active — quinze ans de services actifs, l'âge anticipé
      — au moment de la radiation des cadres, et qui est alors « titulaire d'un emploi
      classé en catégorie active »
    parametres:
      existe: true
      nature: majoration
      statuts: [fonctionnaire_hospitalier_actif]
      regime: cnracl
      classement: active
      services_comptes: [fonctionnaire_etat, fonctionnaire_etat_actif,
                         fonctionnaire_etat_super_actif, fonctionnaire_territorial_hospitalier,
                         fonctionnaire_territorial_hospitalier_actif,
                         fonctionnaire_hospitalier_actif,
                         fonctionnaire_territorial_hospitalier_super_actif]
      fraction: 0.1
      plafond_trimestres: null
      condition: categorie_active_en_fonction
      age_de_reduction: null
      au_dela_du_maximum: false
      cumul_maximum_trimestres: null
      fiabilite: moyenne
  exemples: aucun trouvé
