approximations:
- version: [loi_de_2003, loi_du_9_novembre_2010, loi_du_14_avril_2023]
  ecart: >-
    Le dixième se compte sur les années servies dans les statuts de la fonction
    publique civile, à temps plein comme à temps partiel, arrondi au trimestre comme
    les services de L. 13 : la Caisse des dépôts le compte « au prorata » (Conseil
    d'orientation des retraites, document n° 15 du 23 mars 2023), et le modèle ne connaît
    les services qu'à l'année. Les services militaires n'y entrent pas.
  effet: non mesuré ; un trimestre au plus
- version: [loi_de_2003, loi_du_9_novembre_2010, loi_du_14_avril_2023]
  ecart: >-
    Seul le statut fonctionnaire_hospitalier_actif ouvre la majoration : le statut
    fonctionnaire_territorial_hospitalier_actif, qui ne dit pas le versant, ne la reçoit
    pas, et les services hospitaliers sédentaires ne se distinguent pas des
    territoriaux.
  effet: non mesuré ; l'aide-soignant déclaré sous le statut commun n'a rien
- version: [loi_du_14_avril_2023]
  ecart: >-
    La limite de vingt trimestres se tient sur les bonifications et majorations que le
    modèle sert : ni le i de L. 12, ni la bonification des égoutiers, ni la majoration
    de L. 12 quater ne le sont.
  effet: non mesuré
sources:
  lu_le: 2026-10-07
  prochaine_relecture: 2027-04-30
  a_relire:
  - >-
    Chercher un exemple chiffré de la Caisse des dépôts, et l'arrondi qu'elle applique
    au dixième des services.
  lectures:
  - type: legifrance
    reference: >-
      loi n° 2003-775 du 21 août 2003, article 78, ses trois rédactions
      (LEGIARTI000006758626, LEGIARTI000023096779, LEGIARTI000047453001)
    date: 2023-09-01
  - type: legifrance
    reference: >-
      décret n° 2003-1306 du 26 décembre 2003, article 21, ses six rédactions
      (LEGIARTI000006400884 à LEGIARTI000054590043), et article 15, IV : le cumul dans la
      limite de vingt trimestres
    date: 2026-08-01
  - type: jorf
    reference: >-
      loi n° 2023-270 du 14 avril 2023, article 10, XVIII (JORFARTI000047445097) : les
      anciens fonctionnaires hospitaliers, les conditions du deuxième alinéa de L. 24
    date: 2023-04-15
  - type: autre
    reference: >-
      réponse ministérielle à la question écrite n° 15107 (13e législature, JO du 6 mai
      2008, p. 3840) : « quatre trimestres par période de dix années de services
      effectifs effectués en catégorie active ou sédentaire, auprès des fonctions
      publiques hospitalière, territoriale ou de l'État », « pas limitée », comptée
      « uniquement dans le calcul de la durée d'assurance », pour des droits ouverts
      « à compter du 1er janvier 2008 au plus tôt », l'agent étant « titulaire d'un
      emploi classé en catégorie active au moment de la radiation des cadres »
    url: https://questions.assemblee-nationale.fr/dyn/13/questions/QANR5L13QE15107.pdf
    date: 2008-05-06
  - type: autre
    reference: >-
      Conseil d'orientation des retraites, séance du 23 mars 2023, document n° 15, § 3.4.2
      : « Le calcul se fait au prorata : la majoration de durée d'assurance est égale à
      1/10e des services effectifs », « uniquement dans la durée d'assurance retenue pour
      la décote »
    url: >-
      https://www.cor-retraites.fr/sites/default/files/2023-03/Doc_15_SG_Catégories%20actives_fonction%20publique.pdf
    date: 2023-03-23
code:
  python: >-
    scenarios/actuel.py : FichesDatees ; droit/compter.py : trimestres_des_emplois,
    trimestres_d_un_emploi, condition_d_un_emploi ; droit/liquider.py :
    liquider_chaque_regime, qui ajoute la majoration à la durée de la décote de la
    CNRACL
  javascript: >-
    moteur/js/regimes.js : FichesDatees ; moteur/js/droit/compter.js :
    trimestresDesEmplois, trimestresDUnEmploi, conditionDUnEmploi ;
    moteur/js/droit/liquider.js
  parametres: les versions de cette fiche (contenu.parametres), que le paquet du site porte
  tests: [tests/test_bonifications_emplois.py, tests/test_trajectoire.py]
referents:
  trajectoire:
    equivalent: >-
      « majoration_duree » « 1 tous les 10 » des cas types de la fonction publique
      hospitalière (bonifDeterministes, R/fonctionsCalculsDivers.R), en durée tous régimes
    confrontation: >-
      le 7 octobre 2026, sur les sorties du 5 (tests/test_trajectoire.py) : quinze
      trimestres à l'aide-soignante du cas type 9, des deux côtés
historique:
- >-
  2026-10-07 — née de l'étape 17 de l'action 138, avec le statut
  fonctionnaire_hospitalier_actif : TRAJECTOiRE servait la majoration à l'aide-soignante
  du cas type 9, et le dépôt lui opposait une décote de 5,6 à 21 % (registre, 138.17).
effet: >-
  L'aide-soignant ou l'agent hospitalier actif : quinze trimestres pour trente-sept ans et
  demi de services, qui effacent la décote de qui part à l'âge anticipé.
