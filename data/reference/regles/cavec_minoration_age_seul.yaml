reformes:
- cavec_report_2008
- woerth_2010
- reforme_2023
- cavec_report_2026
effet: >-
  La note de la fiche disait la règle, mais la période laissait la durée annuler
  la minoration, et lisait avant 2008 les âges du régime général : un expert-comptable
  parti à 62 ans avec sa durée ne perdait rien, là où l'article 3.13 lui retire
  15 %. Depuis le 23 septembre 2026, ouverture à 60 ans et taux plein à 65 ans pour
  toutes les générations, `decote_annulee_par_la_duree: false` partout ; la loi
  de 2010 et celle de 2023 sont déclarées `non_appliquee` à la section ; tenu par
  tests/test_sections_liberales.py. Lue au droit le 3 novembre 2026 (action 130) :
  cinq versions, la règle la même de 2008 à 2026 ; avant 2008, celle de 2008 en tient
  lieu ; l'inapte sans abattement n'est pas servi, ni aucune réversion (relecture R-E,
  corrigée par la file E-bis).
sources:
  lu_le: 2026-11-03
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Dater le taux de l'abattement d'avant 2008, et l'âge d'ouverture, que seuls les
    statuts publiés au Bulletin officiel portent.
  - >-
    Le jour où la caisse a mis en œuvre les statuts de 2008 : le 1er janvier 2009, que
    les statuts de 2018 donnent pour la réversion, ou le 2 mars 2008.
  - >-
    Comment la caisse compte un trimestre entamé : la pension prend effet au premier
    jour d'un trimestre civil, l'âge n'y tombe pas toujours sur un trimestre entier, et
    les statuts disent « par trimestre manquant » sans dire l'arrondi ; le modèle compte
    le trimestre entamé, comme R. 351-27 au régime général.
  lectures:
  - type: jorf
    reference: >-
      Dans l'index JORF du dépôt, à jour au 3 novembre 2026 : l'arrêté du 22 février
      2008 et ses articles ; ceux du 26 novembre 2010, des 9 février et 27 mars 2012,
      des 7 octobre 2013 et 2014, du 20 août 2018, du 19 juin 2019, du 2 juillet 2024,
      du 4 juillet 2025 et du 16 décembre 2025, leurs annexes ; les articles 8 et 30 du
      décret n° 2026-418 ; l'arrêté du 10 juillet 2026 et son règlement, aussi lu dans
      l'index LEGI. Avant 2008, l'index n'a des statuts que des titres et des analyses.
    date: 2026-11-03
  - type: autre
    reference: >-
      CAVEC, « Depuis 1949, une histoire d'avenir, le livre des 70 ans » : en 1983,
      ses administrateurs « choisissent de ne pas abaisser l'âge de départ en retraite
      à 60 ans (comme annoncé pour le régime général […]). Il reste et restera fixé
      à 65 ans. » Guide « Bien préparer votre retraite » et page « Le calcul de
      votre retraite » : mêmes âges.
    url: >-
      https://www.cavec.fr/wp-content/uploads/Cavec-depuis-1949-une-histoire-davenir-le-livre-des-70-ans.pdf
    date: 2026-09-23
  - type: autre
    reference: >-
      Le même livre, relu par la file E-bis : 80 564 762 octets, sha256
      f37b161dfcd8636591b5e49aeb3aafa916baa27bde6773896678f696a0efd030 ; la phrase de
      1983, page 15 du PDF, « (comme annoncé pour le régime général par Pierre Mauroy
      en 1982) », que la fiche cite à l'ellipse près.
    url: >-
      https://www.cavec.fr/wp-content/uploads/Cavec-depuis-1949-une-histoire-davenir-le-livre-des-70-ans.pdf
    date: 2026-11-03
  - type: jorf
    reference: >-
      Relu par la file E-bis, d'après la relecture R-E, dans les index JORF et LEGI à
      jour au 3 novembre 2026 : les articles 3.13 et 3.16 à 3.18 des statuts de 2008 ;
      les articles 12, 15 et 16 de la partie 2 des statuts de 2018 ; les articles 1.2.1
      et 1.2.2 du règlement de 2026 ; le II de l'arrêté du 2 juillet 2024 ; les articles
      des arrêtés du 20 août 2018, du 19 juin 2019 et du 10 juillet 2026, dont aucun ne
      fixe de date ; le décret n° 53-506 du 21 mai 1953 et l'arrêté du 23 mai 1953 ;
      L. 643-3, I, de 2004 à 2026, L. 643-4 de 2008, L. 161-17-2 de 2011, L. 351-1 de
      2010.
    date: 2026-11-03
code:
  interrupteurs:
    decote_annulee_par_la_duree: false
  moteur: >-
    `decote_annulee_par_la_duree: false` : la durée d'assurance n'annule pas la minoration,
    que seul l'âge efface.
  python: >-
    droit/liquider.py : abattement_points, abattement_regime_de_base, decote_opposable,
    trimestres_de_decote ; droit/ouvrir.py : age_ouverture, age_taux_plein
  javascript: >-
    moteur/js/droit/liquider.js : abattementPoints, abattementRegimeDeBase,
    decoteOpposable, trimestresDeDecote ; moteur/js/droit/ouvrir.js : ageOuverture,
    ageTauxPlein
  parametres: >-
    contenu.parametres de chaque version : age_ouverture, age_taux_plein,
    decote_par_trimestre ; regimes/cavec_complementaire.yaml : age_ouverture,
    age_taux_plein, decote_par_trimestre
  tests: [tests/test_sections_liberales.py]
