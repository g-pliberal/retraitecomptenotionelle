schema_version: 1
id: cavec_minoration_age_seul
intitule: >-
  Régime complémentaire de la CAVEC : liquidation « à 65 ans à taux plein ; entre
  60 et 65 ans, avec application d'un abattement définitif de 1,25 % par trimestre
  manquant », sans condition de durée d'assurance, pour toutes les générations ;
  à 60 ans sans abattement au titre de l'inaptitude. Statuts de 2008, de 2018,
  règlement de 2026 ; la même règle supposée avant 2008.
domaine: decote_surcote
regimes: [cavec_complementaire]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  l'âge de l'expert-comptable ou du commissaire aux comptes à la date d'effet de sa
  pension, au premier jour du trimestre civil qui suit sa demande, et les trimestres
  qui le séparent de 65 ans
- >-
  l'inaptitude : depuis 2008, la retraite du régime de base de la CNAVPL liquidée à
  ce titre ; depuis le 28 juin 2019, l'inaptitude au travail, que valide le médecin
  conseil et confirme la commission d'inaptitude
- la date d'effet de la pension, qui choisit la rédaction des statuts ou du règlement
ecrit:
- >-
  le coefficient qui affecte les points acquis par cotisations et par rachat, de 0,75 à
  60 ans à un à 65 ans, que `abattement_points` rend à `liquider_chaque_regime`
dates_qui_decident:
- liquidation.date_effet
versions:
- id: statuts_d_avant_2008
  statut: supposee
  hypothese: >-
    les pensions qui prennent effet avant le 2 mars 2008 relèvent des statuts approuvés
    par l'arrêté du 23 mai 1953 et des arrêtés qui les ont modifiés, que le Journal
    officiel ne publie qu'en titre ou en analyse et le Bulletin officiel du ministère en
    entier (« sera publié intégralement au Bulletin officiel », arrêté du 13 mai 1994,
    JORFARTI000001391556) ; l'arrêté du 22 février 2008 « rédige » l'article 3.13, qui
    existait donc avant lui. La fiche présume la règle de 2008 : la caisse écrit
    qu'en 1983 ses administrateurs « choisissent de ne pas abaisser l'âge de départ en
    retraite à 60 ans (comme annoncé pour le régime général […]). Il reste et restera
    fixé à 65 ans » (« Depuis 1949, une histoire d'avenir, le livre des 70 ans »)
  fiabilite: >-
    faible pour le taux, que rien ne date avant 2008 ; moyenne pour l'âge du taux plein,
    65 ans, que la caisse dit gardé depuis 1983
  bornes:
    liquidation.date_effet: [null, 2008-03-02]
  contenu:
    parametres:
      age_ouverture: 60
      age_taux_plein: 65
      decote_par_trimestre: 0.0125
    droit: celui de la version statuts_de_2008, présumé
  exemples: aucun trouvé
- id: statuts_de_2008
  statut: lue
  textes:
  - id: JORFARTI000018197778
    article: >-
      statuts de la section professionnelle des experts-comptables et des commissaires
      aux comptes, article 3.13, dans la rédaction de l'annexe de l'arrêté du 22 février
      2008
    en_vigueur: 2008-03-02
    publie_le: 2008-03-01
    citation: >-
      « La retraite est liquidée sur demande expresse par lettre recommandée par
      l'intéressé : ― à 65 ans à taux plein ; ― entre 60 et 65 ans, avec application
      d'un abattement définitif de 1,25 % par trimestre manquant. L'abattement s'applique
      au nombre de points acquis ; ― à 60 ans lorsque la retraite du régime de base de la
      CNAVPL est liquidée au titre de l'inaptitude. »
  - id: JORFARTI000018197775
    article: >-
      arrêté du 22 février 2008, article 1er, qui approuve les articles 3.1 à 3.20 du
      régime de retraite complémentaire, sans date d'effet propre
    en_vigueur: 2008-03-02
    publie_le: 2008-03-01
  nee_de: JORFARTI000018197778
  bornes:
    liquidation.date_effet: [2008-03-02, 2018-09-05]
  contenu:
    parametres:
      age_ouverture: 60
      age_taux_plein: 65
      decote_par_trimestre: 0.0125
    droit: >-
      un abattement définitif de 1,25 % par trimestre manquant entre 60 et 65 ans, sur
      les points acquis ; aucune durée d'assurance n'y entre, et aucune liquidation avant
      60 ans
    conditions: >-
      à 60 ans sans abattement « lorsque la retraite du régime de base de la CNAVPL est
      liquidée au titre de l'inaptitude » ; la retraite est liquidée « à dater du premier
      jour du trimestre civil suivant la demande » (article 3.15)
  exemples: aucun trouvé
- id: statuts_de_2018
  statut: lue
  textes:
  - id: JORFARTI000037363871
    article: >-
      statuts de la section professionnelle des experts-comptables et des commissaires
      aux comptes, que l'annexe de l'arrêté du 20 août 2018 « remplace », partie 2,
      article 12
    en_vigueur: 2018-09-05
    publie_le: 2018-09-04
    citation: >-
      « La retraite est liquidée sur demande de l'affilié adressée par lettre
      recommandée : « - à 65 ans à taux plein ; « - entre 60 et 65 ans, avec application
      d'un abattement définitif de 1,25 % par trimestre manquant ; « L'abattement
      s'applique au nombre de points acquis par cotisations et par rachat ; « - à 60 ans
      lorsque la retraite du régime de base de la CNAVPL est liquidée au titre de
      l'inaptitude. « La demande de retraite du régime complémentaire au titre de
      l'inaptitude doit faire l'objet d'une présentation et d'une validation par le
      médecin conseil. « Cette décision doit être confirmée par la commission
      d'inaptitude. « Cette retraite est liquidée à taux plein. »
  nee_de: JORFARTI000037363871
  bornes:
    liquidation.date_effet: [2018-09-05, 2019-06-28]
  contenu:
    parametres:
      age_ouverture: 60
      age_taux_plein: 65
      decote_par_trimestre: 0.0125
    droit: >-
      la règle de 2008, l'abattement portant sur les points acquis « par cotisations et
      par rachat »
    conditions: >-
      l'inapte de 2008, dont la demande est validée par le médecin conseil et confirmée
      par la commission d'inaptitude
  exemples: aucun trouvé
- id: inaptitude_au_travail_2019
  statut: lue
  textes:
  - id: JORFARTI000038689131
    article: >-
      annexe de l'arrêté du 19 juin 2019, II, 7°, qui modifie le cinquième alinéa de
      l'article 12 de la partie 2 des statuts
    en_vigueur: 2019-06-28
    publie_le: 2019-06-27
    citation: >-
      7° Le cinquième alinéa de l'article 12 est ainsi modifié : a) Les mots : « lorsque
      la retraite du régime de base de la CNAVPL est liquidée » sont supprimés ; b) Après
      le mot : « inaptitude » sont insérés les mots : « au travail »
  - id: JORFARTI000037363871
    article: statuts de 2018, partie 2, article 12, ses deux premières phrases
    en_vigueur: 2018-09-05
    publie_le: 2018-09-04
  nee_de: JORFARTI000038689131
  bornes:
    liquidation.date_effet: [2019-06-28, 2026-07-18]
  contenu:
    parametres:
      age_ouverture: 60
      age_taux_plein: 65
      decote_par_trimestre: 0.0125
    droit: la règle de 2018
    conditions: >-
      à 60 ans « au titre de l'inaptitude au travail », que la caisse reconnaît
      elle-même, sans plus attendre la liquidation du régime de base à ce titre
  exemples: aucun trouvé
- id: reglement_de_2026
  statut: lue
  textes:
  - id: LEGIARTI000054437585
    article: >-
      règlement du régime d'assurance vieillesse complémentaire de la section, approuvé
      par l'arrêté du 10 juillet 2026, article 1.1.3 (au Journal officiel,
      JORFARTI000054435943)
    en_vigueur: 2026-07-18
    publie_le: 2026-07-17
    citation: >-
      « La retraite est liquidée sur demande du cotisant adressée soit de façon
      dématérialisée, soit par tous moyens donnant date certaine à sa réception par la
      CAVEC. « - à 65 ans à taux plein ; « - entre 60 et 65 ans, avec application d'un
      abattement définitif de 1,25 % par trimestre manquant, l'abattement s'applique au
      nombre de points acquis, par cotisations et par rachat ; « - à 60 ans au titre de
      l'inaptitude au travail. »
  - id: JORFARTI000054153497
    article: >-
      décret n° 2026-418 du 29 mai 2026, article 8, 7° : l'article 5 du décret du 21 mai
      1953 renvoie les conditions d'attribution et de service à « un règlement de la
      section professionnelle des experts comptables et des commissaires aux comptes,
