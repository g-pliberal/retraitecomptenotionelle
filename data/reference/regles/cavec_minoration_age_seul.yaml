    en_vigueur: 2026-07-01
    publie_le: 2026-05-31
  - id: JORFARTI000054153813
    article: décret n° 2026-418, article 30
    en_vigueur: 2026-07-01
    publie_le: 2026-05-31
    citation: « Le présent décret entre en vigueur le 1 er juillet 2026. »
  nee_de: LEGIARTI000054437585
  bornes:
    liquidation.date_effet: [2026-07-18, null]
  contenu:
    parametres:
      age_ouverture: 60
      age_taux_plein: 65
      decote_par_trimestre: 0.0125
    droit: la règle de 2018, mot pour mot, que le règlement reprend des statuts
    conditions: >-
      l'inapte de 2019 ; du 1er au 17 juillet 2026, le décret renvoie à un règlement que
      l'arrêté n'approuve qu'au 18 : la fiche garde les statuts jusque-là, de même règle
