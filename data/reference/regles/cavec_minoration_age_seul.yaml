approximations:
- version: [statuts_d_avant_2008]
  textes: >-
    statuts du régime que le décret n° 53-506 du 21 mai 1953 institue, et leurs
    modifications, au seul Bulletin officiel
  ecart: >-
    Le modèle sert avant 2008 la règle de 2008 — 60 ans, 65 ans, 1,25 % par trimestre
    manquant —, que nul texte lu ne date : la caisse ne dit qu'un âge de 65 ans, gardé
    en 1983, et l'ouverture à 60 ans n'a pas de source.
  effet: non mesuré
- version: [statuts_de_2008, statuts_de_2018, inaptitude_au_travail_2019, reglement_de_2026]
  textes: >-
    statuts de 2008, article 3.13 ; statuts de 2018, partie 2, article 12, et sa
    rédaction de 2019 ; règlement de 2026, article 1.1.3
  ecart: >-
    Le modèle abat l'inapte comme les autres : la fiche `inaptitude_au_travail` ne nomme
    pas la CAVEC parmi les régimes qui le servent au taux plein, et `abattement_regime_de_base`
    ne le dispense donc pas. Les statuts le servent sans abattement : du 2 mars 2008 au
    27 juin 2019, « à 60 ans lorsque la retraite du régime de base de la CNAVPL est
    liquidée au titre de l'inaptitude », que la base ne liquide qu'« à partir de l'âge
    prévu au premier alinéa de l'article L. 351-1 » (L. 643-3, I, de 2004 à 2023 ;
    L. 643-4, 2°, a, rédaction du 19 décembre 2008, LEGIARTI000019959512), l'âge de
    L. 161-17-2 depuis le 1er juillet 2011, « soixante-deux ans pour les assurés nés à
    compter du 1er janvier 1955 » (LEGIARTI000025014605) ; depuis le 28 juin 2019, « à
    60 ans au titre de l'inaptitude au travail ».
  effet: >-
    non mesuré dans la population ; pour l'inapte, toute la minoration de l'âge où les
    statuts le servent : depuis le 28 juin 2019, 20 trimestres × 1,25 % = 25 % de la
    pension complémentaire à 60 ans ; avant, pour les générations nées depuis 1955,
    à l'âge légal de la base, 12 × 1,25 % = 15 % à 62 ans
- version: [statuts_d_avant_2008, statuts_de_2008, statuts_de_2018, inaptitude_au_travail_2019, reglement_de_2026]
  textes: >-
    statuts de 2008, articles 3.16 et 3.17 ; statuts de 2018, partie 2, articles 15 et
    16 ; règlement de 2026, articles 1.2.1 et 1.2.2 ; avant 2008, nul texte lu
  ecart: >-
    Le modèle ne sert aucune réversion de la CAVEC : aucune fiche de réversion ne nomme
    `cavec_complementaire`, et la ligne vaut zéro, motif `non_portee`
    (`droit/reversion.py`, `moteur/js/droit/reversion.js`), dans les deux moteurs. Les
    statuts servent au conjoint survivant âgé d'au moins 60 ans, marié deux ans au
    moins avant le décès ou dont un enfant est issu du mariage, et non remarié
    (articles 3.16 et 3.18 en 2008, 15 en 2018, 1.2.1 en 2026), « sans application du
    coefficient de réduction » : en 2008, 60 % des points, ceux « acquis avant la mise
    en œuvre des présents statuts » à 50 % (article 3.17) ; depuis 2018, 50 % des
    points acquis « avant le 1er janvier 2009 » et 60 % des autres (article 16, puis
    1.2.2), en totalité ceux des années de la cotisation facultative.
  effet: >-
    non mesuré dans la population ; pour le conjoint survivant, toute la réversion.
    L'expert-comptable né le 10 février 1964, au travail depuis ses 26 ans à deux fois
    le salaire moyen, parti à 62 ans le 1er mars 2026 au coefficient 0,85, mort en juin
    2027, laisse au conjoint né en 1962, marié en juin 1988, de 50 % à 60 % de sa
    pension sans le coefficient, selon la part des points d'avant 2009, que le modèle,
    qui compte la CAVEC en cotisations revalorisées, ne sépare pas : de 0,50 × 27 616,84
    / 0,85 = 16 245,20 € à 0,60 × 27 616,84 / 0,85 = 19 494,24 € par an, aux montants
    de 2026 ; le modèle sert 0 (essai du 3 novembre 2026, les deux moteurs au bit près)
