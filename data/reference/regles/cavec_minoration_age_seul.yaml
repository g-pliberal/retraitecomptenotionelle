  exemples: aucun trouvé
approximations:
- version: [statuts_d_avant_2008]
  textes: >-
    statuts approuvés par l'arrêté du 23 mai 1953 et leurs modifications, au seul
    Bulletin officiel
  ecart: >-
    Le modèle sert avant 2008 la règle de 2008 — 60 ans, 65 ans, 1,25 % par trimestre
    manquant —, que nul texte lu ne date : la caisse ne dit que l'âge du taux plein,
    65 ans, gardé en 1983.
  effet: non mesuré
- version: [statuts_de_2008, statuts_de_2018, inaptitude_au_travail_2019, reglement_de_2026]
  textes: >-
    statuts de 2008, article 3.13 ; statuts de 2018, partie 2, article 12, et sa
    rédaction de 2019 ; règlement de 2026, article 1.1.3
  ecart: >-
    Le modèle abat l'inapte comme les autres : la fiche `inaptitude_au_travail` ne nomme
    pas la CAVEC parmi les régimes qui le servent au taux plein, et `abattement_regime_de_base`
    ne le dispense donc pas. Les statuts le servent à 60 ans sans abattement.
  effet: >-
    non mesuré dans la population ; pour l'inapte, toute la minoration de son âge : 20
    trimestres × 1,25 % = 25 % de la pension complémentaire à 60 ans, 12 × 1,25 % = 15 %
    à 62 ans
- version: [statuts_de_2008, statuts_de_2018, inaptitude_au_travail_2019, reglement_de_2026]
  textes: >-
    statuts de 2008, article 3.17 ; statuts de 2018, partie 2, article 16 ; règlement de
    2026, article 1.2.2
  ecart: >-
    Les points de l'adhérent décédé « sont réversibles à 60 % sur la tête du conjoint
    survivant âgé d'au moins 60 ans tel qu'il est défini à l'article 3.16, sans
    application du coefficient de réduction prévu à l'article 3.13 » (2008) ; depuis
    2018, 50 % des points acquis avant le 1er janvier 2009 et 60 % des autres, toujours
    « sans application du coefficient de réduction » (article 12, puis 1.1.3). Le moteur
    applique le taux de réversion à la retraite servie, coefficient compris
    (`droit/reversion.py`, sa notice).
  effet: >-
    non mesuré dans la population ; pour le conjoint survivant d'un expert-comptable
    parti à 62 ans, une réversion de 15 % trop basse : sur des points d'après 2009,
    0,60 × 0,85 = 0,51 des points au lieu de 0,60
