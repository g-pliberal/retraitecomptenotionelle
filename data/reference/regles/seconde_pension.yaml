approximations:
- ecart: >-
    le modèle calcule la nouvelle pension du régime général et des salariés agricoles,
    au mois qui suit la fin de l'activité, au 1er septembre 2023 au plus tôt, la
    seconde retraite de l'Agirc-Arrco au 1er janvier 2024 au plus tôt, et celle du
    RCI, sur les périodes de 2025 et après ; celle des libéraux, des avocats, des exploitants
    agricoles, des fonctionnaires et des régimes spéciaux n'est pas calculée, et le
    résultat nomme leur régime ; les secondes retraites des autres complémentaires —
    celle de l'Ircantec, sur l'activité exercée depuis le 1er septembre 2024, celles de
    la RCO des exploitants et des sections libérales — ne sont ni calculées ni nommées
  effet: non mesuré
- ecart: >-
    le salaire de la période est la part de ses mois dans le revenu de l'année, et ses
    trimestres se valident à cent cinquante heures de SMIC chacun, quatre par an au
    plus ; les années de la période se revalorisent par les coefficients des salaires
    portés au compte
  effet: non mesuré
- ecart: >-
    l'indépendant — artisan, commerçant, micro-entrepreneur — a son revenu annuel
    moyen (R. 634-1, puis D. 634-3) : la somme des revenus revalorisés des années de
    la période qui valident un trimestre, divisée par leur nombre, l'année de l'effet
    comprise, le micro-entrepreneur y portant son revenu cotisé ; une année entamée y
    pèse de ses seuls mois, comme une année entière. Restent approchés : la part
    d'une année dans la période, celle de ses mois dans un revenu qui est annuel ; les
    revenus, que la caisse arrondit à l'euro ; plus de vingt-cinq années de cumul,
    qui ne se voient pas avant 2048, toutes retenues, et non les vingt-cinq
    meilleures. La Cnav n'en a publié ni instruction ni exemple : « Le dispositif
    réglementaire n'est pas encore entièrement défini »
  effet: >-
    mesuré le 19 octobre 2026 : au même revenu, de la moitié à la totalité de la
    nouvelle pension d'une salariée — 631 € au lieu de 757 € pour trente mois, de
    février 2023 à juillet 2025, sur trois années civiles ; 119 € au lieu de 239 € pour
    six mois de 2023 ; autant quand la période tombe sur des années civiles entières
- ecart: >-
    l'artisan et le commerçant y portent l'assiette minimale sur laquelle ils ont
    cotisé (D. 633-2), comme à leur première pension, sur l'année de leur activité.
    Restent approchés : l'année du départ, l'activité poursuivie a deux assiettes
    minimales, une de chaque côté du départ, là où la caisse n'appelle qu'une
    cotisation annuelle ; le pensionné au RSA ou à la prime d'activité, que la saisie
    du cumul ne dit pas, n'en est pas dispensé (L. 613-11)
  effet: >-
    mesuré le 19 octobre 2026 : l'artisane qui déclare 5 % du salaire moyen en cumul
    de janvier 2024 à décembre 2025 a six trimestres et 97 € par an, au lieu de deux
    trimestres et 13 €
- ecart: >-
    la seconde retraite du RCI est servie quel que soit son nombre de points, quand le
    règlement remplace par « un versement forfaitaire unique » la pension de « moins
    de 40 points de retraite », ces points au revenu de référence du jour de l'effet
    (article 39), et toute pension dont la base a fait l'objet d'un tel versement
    (article 40) : le modèle ne le fait pas non plus à la première pension du RCI. Le
    nombre de points n'est pas arrondi ; au-delà du dernier prix d'achat publié, celui
    que le régime prolonge (`ValeursPoint.achat_prolonge`)
  effet: >-
    mesuré le 19 octobre 2026 : le commerçant au demi-salaire moyen de février 2023 à
    juillet 2025, 45,7 points, 61 € par an ; l'artisane au minimum, 7,8 points, 10,55 €
    par an, que le règlement verserait une fois, quelque 170 €
- ecart: >-
    au-delà du dernier prix d'achat publié, le salaire de référence de l'Agirc-Arrco
    suit le plafond de la sécurité sociale ; le versement en capital sous cent points,
    et annuel sous deux cents, ne se distinguent pas
  effet: non mesuré
- ecart: >-
    la nouvelle pension n'entre ni dans la pension du résultat, qui reste celle du
    départ, ni dans celle d'aujourd'hui, et « faire vivre » ne la revalorise pas
  effet: non mesuré
sources:
  lu_le: 2026-10-19
