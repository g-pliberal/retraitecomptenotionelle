    Le taux plein, le plafond en part du plafond annuel de la sécurité sociale, les
    heures de SMIC d'un trimestre et les dates de 2023, de 2025 et de 2027 sont des
    constantes de droit/seconde.py et de son jumeau. ResultatActuel porte les droits
