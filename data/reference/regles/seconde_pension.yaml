  a_relire:
  - >-
    Ouverte le 29 septembre 2026 avec le domaine des départs multiples, calculée le 30.
    R. 351-29 (III) est lu ; restent ses équivalents dans les autres régimes et la
    circulaire Cnav qui l'applique. La rédaction de 2026 de L. 161-22-1-1 ne porte plus
    la phrase du plafond, et D. 161-2-22-1 ne vise que la rédaction issue de la loi
    n° 2023-270 : les premières pensions de 2027 n'ont pas de plafond.
  - >-
    La nouvelle pension du travailleur indépendant, calculée le 19 octobre 2026 sur
    son revenu annuel moyen : la « Circulaire Cnav RAM », dont l'exposé de la Cnav
    cite le § 5 sans lien, et son exemple. Sa recherche ne la rend pas le 19 octobre
    2026 (« D634-3 », « revenu annuel moyen », « nouvelle pension », « salaire
    mensuel moyen ») ; l'exposé l'attend : « Le site sera mis à jour lors de la
    publication des instructions réglementaires stabilisées ». D. 634-3, 5°, vise
    « la pension liquidée en application de l'article L. 161-22-1 » : la nouvelle
    pension est celle de L. 161-22-1-1, que R. 634-1 nommait. Pour qui calculera
    celle de l'exploitant agricole : R. 732-60 du code rural écarte aussi, depuis
    2026, « Le 2° du C du I et le III de l'article R. 351-29 ».
  - >-
    La seconde retraite du RCI, calculée le 19 octobre 2026 sur le règlement du
    régime : aucune instruction de la Cnav ni page de l'Urssaf, que le réseau de la
    session refuse, ne la décrit ; ni exemple. L'article 27 dit aussi, depuis 2013,
    que la pension du RCI se sert en cumul selon les règles de la base (L. 634-6) :
    le modèle la sert entière en cumul plafonné (fiche
    cumul_emploi_retraite_et_retraite_progressive).
