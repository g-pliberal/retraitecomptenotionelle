sources:
  lu_le: 2026-09-29
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 29 septembre 2026 avec le domaine des départs multiples ; le moteur ne
    la calcule pas encore (étape 4 du domaine). Lire R. 351-29 (le salaire de la
    nouvelle pension au régime général), ses équivalents des autres régimes, la
    circulaire Cnav qui l'applique, et vérifier que la rédaction de 2026 a bien retiré
    le plafond de 5 % : le décret D. 161-2-22-1 renvoie toujours au « dernier alinéa »
    de L. 161-22-1-1.
  lectures:
  - type: legifrance
    reference: >-
      L. 161-22-1-1 CSS, rédactions du 1er septembre 2023 (LEGIARTI000047450790), du
      28 février 2025 (LEGIARTI000051289731) et du 1er janvier 2026
      (LEGIARTI000053279747) ; D. 161-2-22-1 (LEGIARTI000047958952) ; R. 161-19-2 et
      R. 161-19-4, dans l'index LEGI
    date: 2026-09-29
textes_a_relire:
- {id: LEGIARTI000053335651, article: "R. 351-29 CSS", en_vigueur: 2026-01-01,
   question: "le salaire annuel moyen de la nouvelle pension au régime général"}
historique:
- >-
  2026-09-29 — née avec le domaine des départs multiples, de la fiche
  cumul_emploi_retraite_et_retraite_progressive, qui ne porte plus que le cumul.
effet: >-
  Les retraités en cumul intégral depuis 2023 : leurs cotisations, jusque-là à fonds
  perdus, leur ouvrent une seconde pension, au plus 5 % du plafond de la sécurité
  sociale, soit 2 403 € par an en 2026. Le modèle ne la calcule pas.
