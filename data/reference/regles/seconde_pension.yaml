approximations:
- ecart: >-
    le modèle calcule la nouvelle pension du régime général et des salariés agricoles,
    au mois qui suit la fin de l'activité, au 1er septembre 2023 au plus tôt, et la
    seconde retraite de l'Agirc-Arrco au 1er janvier 2024 au plus tôt ; celle des libéraux, des avocats, des exploitants
    agricoles, des fonctionnaires et des régimes spéciaux n'est pas calculée, et le
    résultat nomme leur régime
  effet: non mesuré
- ecart: >-
    le salaire de la période est la part de ses mois dans le revenu de l'année, et ses
    trimestres se valident à cent cinquante heures de SMIC chacun, quatre par an au
    plus ; les années de la période se revalorisent par les coefficients des salaires
    portés au compte
  effet: non mesuré
- ecart: >-
    l'indépendant — artisan, commerçant, micro-entrepreneur — a son revenu annuel
    moyen (R. 634-1, puis D. 634-3) : la somme des revenus revalorisés des années de
    la période qui valident un trimestre, divisée par leur nombre, l'année de l'effet
    comprise, le micro-entrepreneur y portant son revenu cotisé ; une année entamée y
    pèse de ses seuls mois, comme une année entière. Restent approchés : la part
    d'une année dans la période, celle de ses mois dans un revenu qui est annuel ; les
    revenus, que la caisse arrondit à l'euro ; plus de vingt-cinq années de cumul,
    qui ne se voient pas avant 2048, toutes retenues, et non les vingt-cinq
    meilleures. La Cnav n'en a publié ni instruction ni exemple : « Le dispositif
    réglementaire n'est pas encore entièrement défini »
  effet: >-
    mesuré le 19 octobre 2026 : au même revenu, de la moitié à la totalité de la
    nouvelle pension d'une salariée — 631 € au lieu de 757 € pour trente mois, de
    février 2023 à juillet 2025, sur trois années civiles ; 119 € au lieu de 239 € pour
    six mois de 2023 ; autant quand la période tombe sur des années civiles entières
- ecart: >-
    au-delà du dernier prix d'achat publié, le salaire de référence de l'Agirc-Arrco
    suit le plafond de la sécurité sociale ; le versement en capital sous cent points,
    et annuel sous deux cents, ne se distinguent pas
  effet: non mesuré
- ecart: >-
    la nouvelle pension n'entre ni dans la pension du résultat, qui reste celle du
    départ, ni dans celle d'aujourd'hui, et « faire vivre » ne la revalorise pas
  effet: non mesuré
