schema_version: 1
id: seconde_pension
intitule: >-
  Seconde pension, depuis le 1er septembre 2023 : le retraité en cumul intégral se
  constitue de nouveaux droits dans les régimes de base, sur les périodes accomplies
  depuis le 1er janvier 2023. La nouvelle pension est liquidée au taux plein, sur les
  seules périodes cotisées, sans majoration ni minimum, et plafonnée à 5 % du plafond
  annuel de la sécurité sociale ; aucun droit ne s'acquiert plus après elle.
domaine: cumul
regimes: [regime_general, msa_salaries, msa_non_salaries, rsi, cnavpl, cnbf,
  fonction_publique_etat, cnracl, fspoeie]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- les périodes d'activité en cumul intégral, depuis le 1er janvier 2023, et leurs
  cotisations
- la date d'effet de la première pension de base
ecrit:
- la nouvelle pension de chaque régime de base, de nature « seconde »
dates_qui_decident:
- liquidation.date_effet
- liquidation.premiere_pension_de_base
versions:
- id: sans_droit_avant_2023
  statut: lue
  textes:
  - {id: JORFARTI000047445113, article: "loi n° 2023-270 du 14 avril 2023, article 26, qui crée la nouvelle pension",
     publie_le: 2023-04-15}
  bornes:
    liquidation.date_effet: [null, 2023-09-01]
  contenu:
    droit: aucun
    raison: >-
      la nouvelle pension naît de l'article 26 de la loi n° 2023-270, qui entre en
      vigueur le 1er septembre 2023 (XII)
  exemples: aucun trouvé
- id: loi_2023
  statut: lue
  textes:
  - {id: JORFARTI000047445113, article: "loi n° 2023-270 du 14 avril 2023, article 26", publie_le: 2023-04-15}
  - {id: LEGIARTI000047450790, article: "L. 161-22-1-1 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000051289731, article: "L. 161-22-1-1 CSS", en_vigueur: 2025-02-28}
  - {id: LEGIARTI000047958952, article: "D. 161-2-22-1 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047960982, article: "R. 161-19-2 CSS", en_vigueur: 2023-09-01}
  nee_de: JORFARTI000047445113
  bornes:
    liquidation.date_effet: [2023-09-01, null]
    liquidation.premiere_pension_de_base: [null, 2027-01-01]
  contenu:
    droit: >-
      « La nouvelle pension de vieillesse, résultant de l'exercice d'une activité
      professionnelle faisant suite à la liquidation d'une première pension, bénéficie
      du taux plein » ; « Seules sont retenues les périodes d'assurance ayant donné
      lieu à cotisations à la charge de l'assuré », rachats exclus ; « Aucune
      majoration, aucun supplément ni aucun accessoire » ; « ne peut dépasser un
      plafond annuel déterminé par décret » (L. 161-22-1-1), soit « 5 % du montant
      annuel du plafond » de la sécurité sociale (D. 161-2-22-1) ; elle est « calculée,
      liquidée et servie dans les conditions applicables à la pension de vieillesse
      dans le régime dont relève l'assuré au titre de cette nouvelle pension »
      (R. 161-19-2)
    conditions: >-
      le cumul intégral (fiche droits_apres_la_premiere_pension) ; les droits
      constitués depuis le 1er janvier 2023, pris en compte par les liquidations
      intervenant depuis le 1er septembre 2023 (article 26, XII, 3°)
    complementaire: >-
      l'Agirc-Arrco attribue des points sur la tranche 1 des salaires perçus en cumul
      sans limite « à compter du 1er janvier 2023 », qui ouvrent « une seconde retraite
      complémentaire », sans minoration ni majoration, servie à la cessation de
      l'activité salariée ; aucun point en cumul plafonné (page de l'Agirc-Arrco, lue le
      30 septembre 2026)
    salaire_de_base: >-
      « le salaire mensuel moyen correspondant aux cotisations versées au cours de
      chaque année civile ayant donné lieu, au titre de la nouvelle pension, à la
      validation d'au moins un trimestre », sur « les mois d'assurance entre la date à
      laquelle l'assuré remplit les conditions prévues au 2° de l'article L. 161-22-1
      et la date d'entrée en jouissance de la nouvelle pension » (R. 351-29, III)
    parametres:
      taux_plein: true
      plafond_en_pass: 0.05
  exemples: [sp_f13243_nouvelle_pension_plafond]
- id: lfss_2026
  statut: lue
  textes:
  - {id: LEGIARTI000053279747, article: "L. 161-22-1-1 CSS", en_vigueur: 2026-01-01}
  nee_de: LEGIARTI000053279747
  bornes:
    liquidation.date_effet: [2023-09-01, null]
    liquidation.premiere_pension_de_base: [2027-01-01, null]
  contenu:
    droit: >-
      la version loi_2023, ouverte au seul cumul entier — à partir de l'âge du taux
      plein automatique, sauf les exceptions de L. 161-22-1-2 —, pour qui « entre[ ] en
      jouissance de [sa] première pension de vieillesse de base à compter du 1er
      janvier 2027 » ; la rédaction ne porte plus la phrase du plafond annuel
    parametres:
      taux_plein: true
      plafond_en_pass: null
  exemples: aucun trouvé
approximations:
- ecart: >-
    le modèle calcule la nouvelle pension du régime général et des salariés agricoles,
    et la seconde retraite de l'Agirc-Arrco, au mois qui suit la fin de l'activité, au
    1er septembre 2023 au plus tôt ; celle des libéraux, des avocats, des exploitants
    agricoles, des fonctionnaires et des régimes spéciaux n'est pas calculée, et le
    résultat nomme leur régime
  effet: non mesuré
- ecart: >-
    le salaire de la période est la part de ses mois dans le revenu de l'année, et ses
    trimestres se valident à cent cinquante heures de SMIC chacun, quatre par an au
    plus ; les années de la période se revalorisent par les coefficients des salaires
    portés au compte
  effet: non mesuré
- ecart: >-
    au-delà du dernier prix d'achat publié, le salaire de référence de l'Agirc-Arrco
    suit le plafond de la sécurité sociale ; le versement en capital sous cent points,
    et annuel sous deux cents, ne se distinguent pas
  effet: non mesuré
- ecart: >-
    la nouvelle pension n'entre ni dans la pension du résultat, qui reste celle du
    départ, ni dans celle d'aujourd'hui, et « faire vivre » ne la revalorise pas
  effet: non mesuré
sources:
  lu_le: 2026-09-30
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 29 septembre 2026 avec le domaine des départs multiples, calculée le 30.
    R. 351-29 (III) est lu ; restent ses équivalents dans les autres régimes et la
    circulaire Cnav qui l'applique. La rédaction de 2026 de L. 161-22-1-1 ne porte plus
    la phrase du plafond, et D. 161-2-22-1 ne vise que la rédaction issue de la loi
    n° 2023-270 : les premières pensions de 2027 n'ont pas de plafond.
  lectures:
  - type: legifrance
    reference: >-
      R. 351-29 CSS, rédaction du 1er janvier 2026 (LEGIARTI000053335651), III : le
      salaire de la nouvelle pension, dans l'index LEGI
    date: 2026-09-30
  - type: service_public
    reference: >-
      fiche F13243, « Cumul emploi-retraite du salarié », vérifiée le 1er janvier 2026 :
      la nouvelle pension au taux plein, sans décote ni majoration, « ne peut pas
      dépasser 2 403 € brut par an », une seule par caisse de base, jamais après une
      reprise chez le dernier employeur dans les six mois
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F13243
    date: 2026-09-30
  - type: autre
    reference: >-
      Agirc-Arrco, page « Cumul emploi-retraite » : les points de la tranche 1 depuis le
      1er janvier 2023 en cumul sans limite, la seconde retraite complémentaire
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/vivre-ma-retraite/cumul-emploi-retraite/
    date: 2026-09-30
  - type: legifrance
    reference: >-
      L. 161-22-1-1 CSS, rédactions du 1er septembre 2023 (LEGIARTI000047450790), du
      28 février 2025 (LEGIARTI000051289731) et du 1er janvier 2026
      (LEGIARTI000053279747) ; D. 161-2-22-1 (LEGIARTI000047958952) ; R. 161-19-2 et
      R. 161-19-4, dans l'index LEGI
    date: 2026-09-29
code:
  python: >-
    droit/seconde.py : droits, _nouvelle_pension, _seconde_retraite_complementaire,
    _prix_du_point ; echeancier.py : Echeancier._constituer ; scenarios/actuel.py :
    ResultatActuel.droits_apres_depart
  javascript: >-
    moteur/js/droit/seconde.js ; moteur/js/echeancier.js : Echeancier._constituer ;
    moteur/js/pages.js : droitsDuCumul
  parametres: >-
    constantes de droit/seconde.py : TAUX_PLEIN, PLAFOND_EN_PASS, HEURES_PAR_TRIMESTRE,
    les dates de 2023 et de 2027
  tests: >-
    tests/test_emploi_retraite.py ; les témoins seconde_pension_* des simulations et
    simuler_seconde_pension des pages ; l'exemple sp_f13243_nouvelle_pension_plafond
historique:
- >-
  2026-09-29 — née avec le domaine des départs multiples, de la fiche
  cumul_emploi_retraite_et_retraite_progressive, qui ne porte plus que le cumul.
- >-
  2026-09-30 — calculée au régime général, aux salariés agricoles et à
  l'Agirc-Arrco, sur les mois de cumul intégral que le cumul emploi-retraite dit ;
  R. 351-29 (III) lu, et le plafond des premières pensions de 2027 vérifié absent.
effet: >-
  Les retraités en cumul intégral depuis 2023 : leurs cotisations, jusque-là à fonds
  perdus, leur ouvrent une seconde pension, au plus 5 % du plafond de la sécurité
  sociale, soit 2 403 € par an en 2026. La salariée partie au taux plein en 2022, qui
  travaille à la moitié du salaire moyen de février 2023 à janvier 2025, se constitue
  496 € par an au régime général et 183 € à l'Agirc-Arrco.
