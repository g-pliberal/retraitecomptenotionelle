  bornes:
    liquidation.date_effet: [2023-09-01, null]
    liquidation.premiere_pension_de_base: [null, 2027-01-01]
  contenu:
    droit: >-
      « La nouvelle pension de vieillesse, résultant de l'exercice d'une activité
      professionnelle faisant suite à la liquidation d'une première pension, bénéficie
      du taux plein » ; « Seules sont retenues les périodes d'assurance ayant donné
      lieu à cotisations à la charge de l'assuré », rachats exclus ; « Aucune
      majoration, aucun supplément ni aucun accessoire » ; « ne peut dépasser un
      plafond annuel déterminé par décret » (L. 161-22-1-1), soit « 5 % du montant
      annuel du plafond » de la sécurité sociale (D. 161-2-22-1) ; elle est « calculée,
      liquidée et servie dans les conditions applicables à la pension de vieillesse
      dans le régime dont relève l'assuré au titre de cette nouvelle pension »
      (R. 161-19-2)
    conditions: >-
      le cumul intégral (fiche droits_apres_la_premiere_pension) ; les droits
      constitués depuis le 1er janvier 2023, pris en compte par les liquidations
      intervenant depuis le 1er septembre 2023 (article 26, XII, 3°)
    complementaire: >-
      l'Agirc-Arrco attribue des points sur la tranche 1 des salaires perçus en cumul
      sans limite « à compter du 1er janvier 2023 », qui ouvrent « une seconde retraite
      complémentaire », sans minoration ni majoration, servie à la cessation de
      l'activité salariée ; aucun point en cumul plafonné (page de l'Agirc-Arrco, lue le
      30 septembre 2026) ; l'accord du 17 novembre 2017, article 91, dans la rédaction
      de l'avenant n° 16 (circulaire 2024-04-DRJ, lue le 5 octobre 2026) : « Une deuxième
      pension issue des activités cotisées en cumul emploi retraite […] prend effet, au
      plus tôt, le 1er janvier 2024 », et « Les articles 93, 94, 95 et 99 ne sont pas
      applicables » ; ses points au taux de calcul de 6,20 %
    complementaire_des_independants: >-
      le RCI, sur les seules périodes courant depuis le 1er janvier 2025. Jusque-là, « les
      cotisations versées au régime d'assurance vieillesse complémentaire obligatoire
      par un retraité de ce régime afférentes à des périodes postérieures à la date
      d'arrêt du compte ne sont pas productives de droits » (règlement du RCI, article
      4) ; l'arrêté du 19 juin 2024 réserve depuis le 26 juin 2024 « les dispositions du
      deuxième alinéa de l'article 27 », qui « entrent en vigueur le 1er janvier 2025 »
      (son article 2) : « Lorsque les conditions mentionnées aux alinéas 3 à 6 de
      l'article L. 634-6 du code de la sécurité sociale sont réunies, l'assuré se
      constitue de nouveaux droits à pension au titre du présent régime » ; « La
      seconde pension de vieillesse est calculée, liquidée et servie dans les
      conditions applicables à la pension de vieillesse du présent régime », sa demande
      « effectuée en même temps que celle du régime de base » (article 27). Ses points
      s'achètent comme ceux de la première pension, au taux de chaque tranche (D. 635-7)
      ou, pour le micro-entrepreneur, par la part complémentaire de son forfait
      (D. 613-6), au prix de l'année ; la nouvelle pension de base étant au taux plein,
      la seconde du RCI est « servie entière » (exposé de la Cnav « Retraite personnelle
      complémentaire »)
    assiette_minimale: >-
      l'artisan ou le commerçant qui déclare peu cotise sur l'assiette minimale :
      « La cotisation annuelle ne peut être calculée sur une assiette inférieure à 450
      fois le montant horaire du salaire minimum de croissance en vigueur le 1er janvier
      de l'année considérée », pour qui a quatre-vingt-dix jours d'affiliation dans
      l'année, « à compter des cotisations annuelles dues au titre de l'année 2023 »
      (D. 633-2) ; aucun texte n'en dispense le pensionné, et la Cnav ne l'écarte pas :
      « Une cotisation minimale de retraite de base permet aux travailleurs
      indépendants de valider 3 trimestres de retraite par an » (exposé « Travailleurs
      indépendants »). Les trimestres de la nouvelle pension « sont validés dans les
      conditions de droit commun » (exposé « Retraite personnelle issue d'un cumul
      emploi retraite »), et son revenu annuel moyen « correspond aux cotisations
      versées » (R. 634-1 ; R. 351-29, I, B, par D. 634-3) : l'assiette minimale y entre
      quand le revenu déclaré n'y atteint pas
    salaire_de_base: >-
      « le salaire mensuel moyen correspondant aux cotisations versées au cours de
      chaque année civile ayant donné lieu, au titre de la nouvelle pension, à la
      validation d'au moins un trimestre », sur « les mois d'assurance entre la date à
      laquelle l'assuré remplit les conditions prévues au 2° de l'article L. 161-22-1
      et la date d'entrée en jouissance de la nouvelle pension » (R. 351-29, III)
    revenu_de_base_de_l_independant: >-
      l'artisan, le commerçant, le micro-entrepreneur : leur revenu annuel moyen, et
      non le salaire mensuel moyen du salarié. Pour les pensions prenant effet de
      2023 à 2025, D. 634-1 applique les règles du régime général « à l'exception des
      articles R. 351-11, R. 351-29, R. 351-29-1 », et le revenu annuel moyen
      « correspond aux cotisations versées dans la limite du plafond […] permettant la
      validation d'au moins un trimestre d'assurance […] et versées au cours des années
      civiles de la carrière », les vingt-cinq meilleures au-delà ; « Par dérogation
      aux alinéas précédents, il est tenu compte du revenu annuel de l'année durant
      laquelle la pension mentionnée à l'article L. 161-22-1-1 prend effet » (R. 634-1).
      Depuis le 1er janvier 2026, D. 634-1 n'écarte plus R. 351-29 ; le revenu annuel
      moyen « est déterminé dans les conditions prévues à l'article R. 351-29 sous
      réserve des adaptations suivantes », dont « 5° Le 2° du C du I n'est pas
      applicable au calcul de la pension liquidée en application de l'article
      L. 161-22-1 » — l'année d'entrée en jouissance — et « 7° Les III et IV ne sont
      pas applicables » (D. 634-3). La Cnav : « le salaire mensuel moyen (travailleurs
      salariés) ou le revenu annuel moyen (travailleurs indépendants) de la période de
      référence » (exposé « Retraite personnelle issue d'un cumul emploi retraite »),
      ce revenu étant la « Somme des revenus et/ou salaires annuels revalorisés des x
      meilleures années retenues ÷ Nombre d'années correspondant » (exposé « Revenu
      annuel moyen »)
    parametres:
      taux_plein: true
      plafond_en_pass: 0.05
  exemples: [sp_f13243_nouvelle_pension_plafond]
