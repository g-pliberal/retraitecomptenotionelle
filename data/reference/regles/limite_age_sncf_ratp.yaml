schema_version: 1
id: limite_age_sncf_ratp
intitule: >-
  L'agent du cadre permanent de la SNCF et de la RATP est admis à la retraite à sa limite
  d'âge : soixante-cinq ans depuis le 31 janvier 2010, relevés jusqu'à soixante-sept ans
  pour les générations nées depuis 1957, atteints par les nés depuis 1962 ; depuis le
  1er septembre 2023, l'agent dont l'emploi n'ouvre pas de départ anticipé peut, sur
  autorisation de son employeur, être maintenu en fonctions jusqu'à soixante-dix ans.
domaine: age
regimes: [sncf, ratp]
etape: preparer_la_chronologie
face: droit
etat: approchee
lit:
- le statut d'agent de la SNCF ou de la RATP, quand il route le régime spécial ; ni le
  roulant ni le sédentaire ne sont saisis, et le modèle traite tout agent en sédentaire
ecrit:
- la date de l'admission à la retraite par limite d'âge, d'où part la pension du régime
  spécial (`droit/limite_age.py`)
dates_qui_decident:
- age_atteint
versions:
