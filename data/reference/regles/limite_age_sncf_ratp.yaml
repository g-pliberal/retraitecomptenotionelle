    porte pas, n'est pas lu, mais sa notice et sa rédaction de 2023 le sont
  fiabilite: moyenne, les deux bouts lus, la marche supposée
  textes:
  - {id: JORFTEXT000023728583, article: "décret n° 2011-288, notice", en_vigueur: 2011-03-21}
  - {id: LEGIARTI000048031571, article: "décret n° 2011-288, article 1er", en_vigueur: 2023-09-01}
  bornes:
    age_atteint: [2011-03-21, 2023-09-01]
  contenu:
    parametres:
