  statut: supposee
  hypothese: >-
    aucune limite opposée à l'agent avant le décret du 28 janvier 2010 : les décrets n°
    54-24 et n° 54-23 du 9 janvier 1954, qu'il abroge, et les règlements de retraite des
    deux entreprises ne sont pas lus
  fiabilite: faible
  textes: []
  bornes:
    age_atteint: [null, 2010-01-31]
  contenu:
    parametres:
      exceptions: []
    droit: >-
      aucune limite au modèle
  exemples: aucun trouvé
- id: decret_de_2010
  statut: lue
  textes:
  - {id: LEGIARTI000021764893, article: "décret n° 2010-105, article 1er", en_vigueur: 2010-01-31}
  nee_de: LEGIARTI000021764893
  bornes:
    age_atteint: [2010-01-31, 2011-03-21]
  contenu:
    parametres:
      limites: {sedentaire: 65}
      exceptions: []
    droit: >-
      « La limite d'âge à laquelle les agents du cadre permanent de la Société nationale
      des chemins de fer français et de la Régie autonome des transports parisiens sont
