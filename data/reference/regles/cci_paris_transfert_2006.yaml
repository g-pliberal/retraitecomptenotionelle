    date: 2026-10-04
  - type: legifrance
    reference: décret n° 91-613, article 16, rédactions de 1991 à 2013 (LEGIARTI000006775993 à LEGIARTI000006776000)
    date: 2026-10-04
  - type: autre
    reference: >-
      réponse du ministre à la question écrite n° 73172 de M. François Lamy, JO
      Assemblée nationale du 11 octobre 2005 : délibération unanime de l'assemblée
      générale de la chambre du 29 juin 2005 demandant l'intégration
    date: 2026-10-04
    url: https://www.assemblee-nationale.fr/dyn/12/questions/QANR5L12QE73172
historique:
- >-
  2026-10-04 — née avec l'action 145 : la chambre de Paris, membre du GIP Info
  Retraite en 2004 au même titre que la Banque de France, n'avait pas de ligne
  d'inventaire.
effet: >-
  Les agents titulaires de la chambre partis avant 2006 touchent depuis leur pension
  en deux parts, une rente du régime général et ce que la chambre sert au-delà
  (article 70, IV) ; les agents en poste en 2006 sont rétablis au régime général et
  affiliés à l'Agirc-Arrco, ce que le modèle simule déjà en les traitant en salariés
  du privé, au complément de la chambre près.
