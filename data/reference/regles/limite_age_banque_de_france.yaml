schema_version: 1
id: limite_age_banque_de_france
intitule: >-
  L'agent titulaire de la Banque de France doit prendre sa retraite dès qu'il atteint la
  limite d'âge que le statut du personnel fixe par semestre de naissance (article 241) :
  depuis le 26 juillet 2012, soixante et un ans pour le né au second semestre de 1947,
  relevés de trois mois par semestre jusqu'à soixante-sept ans pour le né depuis le second
  semestre de 1959, les agents des plus hauts niveaux partant plus tard jusqu'aux nés de
  1955 ; prorogée d'un ou deux ans pour enfants à charge, deux ans au plus (article 242),
  ou, sans cumul, maintenu en activité pour carrière incomplète, dix trimestres au plus
  (article 242-1).
domaine: age
regimes: [banque_de_france]
etape: preparer_la_chronologie
face: droit
etat: approchee
lit:
- le statut d'agent titulaire de la Banque de France, quand il route le régime spécial ; la
  saisie ne dit pas le niveau, et le modèle prend la colonne « Limite d'âge » du tableau,
  celle des agents qui ne sont pas des niveaux nommés ; les naissances des enfants ; ses
  services au régime, pour la prolongation
ecrit:
- la date de la mise à la retraite par limite d'âge, d'où part la pension du régime spécial
  (`droit/limite_age.py`)
dates_qui_decident:
- age_atteint
