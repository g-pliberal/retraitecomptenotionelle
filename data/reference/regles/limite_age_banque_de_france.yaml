    droit: >-
      « Sous réserve des dérogations prévues aux articles 242, 242-1, ils doivent prendre
      leur retraite dès qu'ils ont atteint l'âge prévu dans le tableau ci-dessous » : par
      période de naissance, la « Limite d'âge » est de 61 ans pour le 2e semestre 1947, 61
      ans 3 mois pour le 1er semestre 1948, et ainsi de trois mois par semestre, 65 ans pour
      le 2e semestre 1955, 66 ans pour le 2e semestre 1957, 66 ans 9 mois pour le 1er
      semestre 1959, 67 ans « à partir du 2e semestre 1959 » ; les « Agents des 4e et 5e
      degrés » ont un an de plus jusqu'aux nés du 1er semestre 1954, qui ont 65 ans, ceux du
      « 6e degré » 64 ans pour le 2e semestre 1947 et 65 ans depuis le 2e semestre 1949, ceux
      du « 7e degré » 65 ans ; toutes les colonnes se rejoignent depuis le 1er semestre
      1956 (65 ans 3 mois). « Le dernier alinéa de l'article est supprimé » (24°). Le décret
      n° 2012-697 « étend la réforme des retraites aux personnels de la Banque de France en
      ce qui concerne la limite d'âge », en modifiant l'article 1er du décret n° 68-299
      (notice)
    transition: >-
      la marche se compte par la date de naissance (`ecart_de_reference` égal à la limite
      du 2e semestre 1947), trois mois par semestre, tels que le tableau les écrit ; le
      tableau ne dit rien des nés avant le 2e semestre 1947, que le modèle traite comme eux,
      et qui avaient passé soixante-cinq ans quand l'article est né. Les articles 242 et
      242-1 de 2012 ne sont pas lus : le modèle leur prête leur rédaction de 2019
      (`enfants`, `sans_cumul`), que le Conseil d'État décrit déjà en 2017 (report pour
      enfants à charge)
