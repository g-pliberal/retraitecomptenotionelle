      dans les index JORF et LEGI du dépôt
    date: 2026-10-16
historique:
- >-
  2026-10-16 — née et appliquée, action 151, étape 8 : l'agent titulaire de la Banque de
  France dont le départ saisi passe sa limite prend sa retraite à la limite, prorogée pour
  enfants ou prolongée pour carrière incomplète, et sa pension du régime spécial en part,
  comme la décision du propriétaire du 14 octobre 2026 le dit du fonctionnaire.
effet: >-
  Tout agent titulaire de la Banque de France, affilié au régime spécial, dont le départ
  saisi passe sa limite depuis le 26 juillet 2012 — soixante et un à soixante-sept ans selon
  le semestre de naissance, prorogés d'un ou deux ans pour enfants à charge ou de dix
  trimestres au plus pour carrière incomplète — prend sa retraite à cette limite, et sa
  pension du régime spécial en part. Approchée : le niveau n'est pas distingué, et aucune
  limite n'est opposée avant 2012.
