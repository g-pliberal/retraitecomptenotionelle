presomptions:
  exceptions_a_la_limite_d_age: >-
    le maintien en activité pour carrière incomplète, dix trimestres au plus, présumé demandé
    et accordé autant que le départ saisi le demande et que les services n'atteignent pas la
    durée du taux maximum, l'intérêt du service et l'aptitude physique présumés ; il remplace
    la prorogation pour enfants quand il mène plus loin ; tout agent prend la colonne « Limite
    d'âge », la saisie ne disant pas son niveau
sources:
  lu_le: 2026-10-16
  prochaine_relecture: 2027-10-16
  a_relire:
  - >-
    Le niveau de l'agent, que la saisie ne porte pas : jusqu'aux nés de 1955, les agents des
    niveaux 5 et 6 (4e et 5e degrés en 2012) ont un an de plus, et ceux des niveaux 7 et 8
    (6e et 7e degrés) jusqu'à soixante-cinq ans ; le modèle les radie à la limite de la
    première colonne.
  - >-
    La limite d'avant le 26 juillet 2012 : la délibération du conseil général du 18 février
    1954 (décret n° 54-474, article 2), le décret n° 68-299, que l'index de la DILA ne porte
    pas, l'arrêté du conseil général du 19 janvier 2007 qui l'avait relevée de soixante-trois
    à soixante-cinq ans pour certains emplois (Conseil d'État, 18 décembre 2017, n° 395450).
    Le modèle n'y oppose aucune limite, et radie le 26 juillet 2012 l'agent qui avait alors
    passé la sienne.
  - >-
    Les articles 242 et 242-1 dans leur rédaction de 2012, non lus ; la date exacte de la
    publication de l'arrêté n° A-2024-01, que le modèle date du 22 avril 2024, jour du fichier
    publié, sans effet sur la limite.
