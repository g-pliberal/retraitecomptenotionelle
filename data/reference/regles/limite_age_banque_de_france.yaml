    droit: >-
      Article 241 : le même tableau, qui commence au « 1er semestre 1950 » (62 ans 3 mois),
      les colonnes devenant les « Agents des niveaux 5 et 6 » et les « Agents des niveaux 7
      et 8 ». Article 242 : « La limite d'âge du personnel titulaire arrêtée conformément
      aux dispositions de l'article 241 ci-dessus est prorogée des durées ci-après sans que
      la prorogation totale puisse excéder deux ans : un an pour les agents qui, lorsqu'ils
      atteignent ladite limite, ont la charge légale de deux enfants ou la charge légale
      d'un seul enfant s'ils en ont par ailleurs élevé au moins deux autres jusqu'à l'âge de
      16 ans, deux ans pour les agents qui, lorsqu'ils atteignent ladite limite, ont la
      charge légale d'au moins trois enfants ou la charge légale de deux enfants s'ils en
      ont par ailleurs élevé au moins un autre jusqu'à l'âge de 16 ans, Ne peuvent être
      considérés comme à charge que les enfants âgés de moins de 18 ans ou -s'ils sont en
      cours d'études ou d'apprentissage- de moins de 21 ans, un an par enfant ouvrant droit
      au versement de l'allocation aux adultes handicapés, un an pour chaque enfant décédé
      au Champ d'honneur ». Article 242-1 : les agents « dont la durée des services
      admissibles en liquidation est inférieure à celle définie au I de l'article 31 du
      règlement du régime des retraites des agents titulaires peuvent, lorsqu'ils
      atteignent la limite d'âge qui leur est applicable, sur leur demande, sous réserve de
      l'intérêt du service et de leur aptitude physique, être maintenus en activité. La
      prolongation d'activité prévue à l'alinéa précédent ne peut avoir pour effet de
      maintenir l'agent concerné en activité au-delà de la durée des services liquidables
      prévue à l'article 31 dudit règlement ni au-delà d'une durée de dix trimestres. [...]
      Elle n'est pas cumulable avec la prorogation de la limite d'âge visée à l'article
      242 ». Depuis 2024, ces articles visent les agents titulaires « visés à l'article
      240 », ceux d'avant le 1er septembre 2023, les seuls que le modèle affilie au régime
      spécial
    transition: >-
      l'enfant à charge est celui de moins de dix-huit ans, la saisie ne disant ni les
      études ni l'apprentissage ; l'enfant « élevé jusqu'à 16 ans » est celui qui n'est plus
      à charge, né dix-huit ans au moins avant la limite, sa vie présumée ; l'allocation aux
      adultes handicapés et le décès au champ d'honneur, que la saisie ne connaît pas, ne
      prorogent rien. La prolongation pour carrière incomplète prend ses dix trimestres de
      la fiche `prolongation_activite_carriere_incomplete`, qui les dit aussi, et la durée
      du taux maximum du régime ; sans cumul, le modèle garde celle des deux exceptions qui
      mène le plus loin
