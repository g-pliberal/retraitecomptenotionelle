- id: LEGIARTI000054589995
  article: code de la sécurité sociale, R. 351-27
  en_vigueur: 2026-08-01
  motif: >-
    la rédaction finit le 2° par « le coefficient de minoration à appliquer au " taux
    plein " est 1,25 % », à la place de « 2,5 % pour les pensions ayant pris effet avant
    le 1er janvier 2004 », et retire le renvoi au décret n° 2025-1409 ; le reste, mot
