code:
  interrupteurs:
    duree_requise_par_generation: true
  moteur: >-
    `duree_requise_par_generation` : la durée requise est lue dans `legislation/duree_assurance_requise.csv`
    à l'ANNÉE DE NAISSANCE, et la valeur de la période (`duree_requise_trimestres`) ne
    sert que de repli pour les générations hors table. C'est la règle depuis la loi du
    22 juillet 1993 : deux assurés qui liquident le même jour n'ont pas la même exigence
    s'ils ne sont pas de la même génération. Sans renvoi, la durée est celle de la période,
    lue à l'année de liquidation — ce qui reste correct avant 1993. Les deux droits
    contrefactuels de la page des résultats (action 138, étape 10) posent sur elle la
    table qu'ils gardent (`TableRecouverte`, `ScenarioActuel._sous_le_droit`) : celle
    d'avant la suspension pour la loi de 2023 sans elle, celle de 2014 au 31 août 2023,
    qui vaut alors aussi pour les pensions d'avant septembre 2026. L'escalier des nés
    de 1934 à 1942 ne vaut que pour une pension prenant effet avant 2003 : depuis, la
    table cède la place à 160 trimestres (`DUREE_UNIQUE_2003`), sauf à la génération
    de décembre 1942 partie le 1er janvier 2003 (R. 351-45, I à III). Et la table
    ne vaut, au-dessus de 160, que pour une pension prenant effet depuis 2009
    (`DUREE_PAR_GENERATION_EFFET`) ; les nés de 1953 à 1955 gardent jusqu'au décret
    de leur génération 164 ou 165 trimestres (`DUREES_AVANT_LE_DECRET`).
  javascript: >-
    moteur/js/droit/ouvrir.js : dureeRequise ; moteur/js/regimes.js : DureesRequises,
    DureesRequisesAvantReforme2023, DureesRequisesAvantSuspension, TableRecouverte,
    REFORME_2023_EFFET, GENERATION_REFORME_2023, SUSPENSION_2026_EFFET,
    GENERATIONS_SUSPENSION, DUREE_UNIQUE_2003, DUREE_UNIQUE_2003_EFFET,
    GENERATION_DECEMBRE_1942, DUREE_PAR_GENERATION_EFFET, DUREES_AVANT_LE_DECRET ;
    moteur/js/scenario-actuel.js : ScenarioActuel._sousLeDroit
  parametres: >-
    legislation/duree_assurance_requise.csv,
    legislation/duree_requise_avant_reforme_2023.csv,
    legislation/duree_requise_avant_suspension.csv : generation, trimestres
  tests: [tests/test_simulateur.py, tests/test_donnees.py,
    tests/test_droits_contrefactuels.py, tests/test_oracle.py, tests/js/moteur.test.js,
    tests/test_cnav_exposes.py, tests/temoins/simulations.json]
