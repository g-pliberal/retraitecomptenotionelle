code:
  interrupteurs:
    duree_requise_par_generation: true
  moteur: >-
    `duree_requise_par_generation` : la durée requise est lue dans les versions de
    cette fiche, que le paquet porte (`fiches_datees`) : la date d'effet de la
    pension choisit la version (`DureesRequises.aLEffet`), la génération sa ligne, et
    une génération que la table de la version ne nomme pas lit ce que la version
    laisse à sa rédaction antérieure, ou la valeur qu'elle écrit pour toutes
    (`trimestres`). Sans date d'effet, la dernière version, le droit en vigueur. La
    valeur de la période (`duree_requise_trimestres`) ne sert plus que si la version
    ne dit rien de la génération. Sous un droit contrefactuel, le moteur lit la fiche
    que la pile de couches a résolue (`FichesDatees.sousLeDroit`) : la version de 2014
    sans fin au 31 août 2023, celle de 2023 sans fin pour la loi de 2023 sans la
    suspension. Reste au code une pratique de la caisse : les nés de 1953 à 1955
    gardent jusqu'au décret de leur génération 164 ou 165 trimestres
    (`DUREES_AVANT_LE_DECRET`, circulaire Cnav 2011/25), que la fonction publique ne
    suit pas. La table par génération `duree_assurance_requise.csv` reste celle que
    la fabrique, le coût et la prose lisent : la durée de chaque génération sous la
    version qui l'a vue partir à l'âge légal, confrontée aux versions
    (tests/test_duree_requise.py).
  javascript: >-
    moteur/js/droit/ouvrir.js : dureeRequise ; moteur/js/regimes.js : DureesRequises,
    DureesRequisesDUneVersion, DUREES_AVANT_LE_DECRET ; moteur/js/droit/invalidite.js
    : dureeLimite
  parametres: >-
    contenu.parametres de chaque version : trimestres ;
    legislation/duree_requise_par_version.csv : entree_en_vigueur, article,
    generation, generation_fin, trimestres ; legislation/duree_assurance_requise.csv :
    generation, trimestres ; couches/sans_la_reforme_de_2023.yaml,
    couches/sans_la_suspension_de_2026.yaml
  tests: [tests/test_duree_requise.py, tests/js/duree-requise.test.js,
    tests/test_simulateur.py, tests/test_donnees.py,
    tests/test_droits_contrefactuels.py, tests/test_oracle.py, tests/js/moteur.test.js,
    tests/test_cnav_exposes.py, tests/temoins/simulations.json]
