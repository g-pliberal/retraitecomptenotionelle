schema_version: 1
id: duree_requise_par_generation
intitule: >-
  Durée d'assurance requise pour le taux plein et dénominateur du prorata, par génération
  ; pour les pensions prenant effet avant le 1er septembre 2026, les nés en 1964
  et 1965 doivent celle de la loi de 2023, 171 et 172 trimestres ; pour les pensions
  prenant effet avant le 1er septembre 2023, les nés à compter du 1er septembre
  1961 doivent celle de la version de 2014 de L. 161-17-3, 168 trimestres jusqu'en
  1963 et 169 de 1964 à 1966.
regimes: [agirc, agirc_arrco, agirc_entreprises_nouvelles, arrco, arrco_cultes,
  arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles, asv_conventionnes,
  banque_de_france, cancava, cancava_avant_1973, carcdsf_complementaire,
  carmf_complementaire, carpimko_complementaire, cavimac, cavp_complementaire,
  cipav_complementaire, cnavpl, cnbf, cnbf_complementaire, cnracl, comedie_francaise,
  crpcen, enseignants_prive_additionnel, fonction_publique_etat, fspoeie, ieg, igrante,
  ipacte, ircantec, ircec_raap, ircec_raap_taux_amenage, ircec_racd, ircec_racl,
  msa_non_salaries, msa_rco, msa_salaries, opera_de_paris, organic, organic_avant_1973,
  organic_conjoints_batiment, ratp, rci, regime_general, rsi, sncf, unirs]
etat: conforme
etape: ouvrir_le_droit
effet: >-
  Taux et proratisation de toute liquidation. Les vingt segments depuis 1958 sont
  certifiés (action 27). Jusqu'au 23 septembre 2026, le modèle opposait la table
  de la suspension à toute pension de ces générations, quelle que soit sa date d'effet
  : un à deux trimestres de moins aux départs anticipés de 1964 et 1965 antérieurs
  à septembre 2026. Table `duree_requise_avant_suspension.csv` ; les témoins de
  carrière longue de la circulaire 2026-29, qui rejouaient sa règle en 2024 et 2025,
  liquident désormais en septembre 2026. Et jusqu'au 24 septembre 2026, le modèle
  opposait la table de 2023 aux nés de septembre 1961 à 1965 partis avant septembre
  2023 — 169 trimestres au lieu de 168 au né en 1962 parti en carrière longue en
  janvier 2022, 172 au lieu de 169 à un départ de 1965 : `duree_requise_avant_reforme_2023.csv`.
  Et jusqu'au 3 novembre 2026, il opposait aux nés de 1934 à 1942 l'escalier de 151 à
  159 trimestres à toute date d'effet, quand R. 351-45 ne le leur oppose que pour une
  pension prenant effet avant 2003 : depuis, 160 trimestres, sauf au né en décembre 1942
  parti le 1er janvier 2003 — jusqu'à neuf trimestres de décote en moins, de 2003 à
  leurs soixante-cinq ans. Et jusqu'au 16 novembre 2026, il opposait 161 à 164 trimestres
  aux nés de 1949 à 1952 partis avant 2009, quand R. 351-45, I, leur en demande 160 :
  un départ en carrière longue refusé à qui avait 168 trimestres, et un prorata réduit
  de 0,6 à 2,4 % ; et 165 ou 166 aux nés de 1953 à 1955 partis avant le décret de leur
  génération, à qui la caisse en opposait 164, ou 165 aux nés en 1955 de juin à août 2011.
sources:
  lu_le: 2026-11-16
  prochaine_relecture: 2026-12-31
  a_relire:
  - >-
    La circulaire Cnav 2011/24, jumelle de la 2011/25 pour la carrière longue des nés
    de 1953 et après, n'a pas été lue : la règle de la date de demande y est présumée
    la même.
  - >-
    La clause de sauvegarde de l'article 8 du décret n° 2023-436 — la carrière longue
    aux conditions d'avant septembre 2023 pour les nés de septembre 1961 à 1963
    qui avaient leur durée cotisée à cette date, proratisée sur la durée nouvelle
    (circulaire Cnav 2023-14, point 9.2) — n'est pas appliquée.
  lectures:
  - type: legifrance
    reference: >-
      L. 161-17-3 CSS, LEGIARTI000053280903, version du 31 décembre 2025, lue par
      le récupérateur dans l'index LEGI à jour au 16 septembre 2026
    date: 2026-09-17
  - type: legifrance
    reference: >-
      L. 161-17-3 CSS, LEGIARTI000053280903 : « s'appliquent aux pensions prenant
      effet à compter du 1er septembre 2026 » ; version du 1er septembre 2023, LEGIARTI000047452764
      : « 171 trimestres, pour les assurés nés en 1964 ; 172 trimestres, pour les
      assurés nés à partir du 1er janvier 1965 »
    date: 2026-09-23
  - type: circulaire_cnav
    reference: >-
      2026-07 du 5 mars 2026, point 2.1 : « La durée de 171 trimestres pour les
      assurés nés en 1964 et celle de 172 trimestres pour les assurés nés en 1965
      reste opposable aux assurés prenant leur retraite avant le 1er septembre 2026
      »
    date: 2026-03-05
  - type: legifrance
    reference: >-
      L. 161-17-3 CSS, version du 22 janvier 2014, LEGIARTI000028494794 : « 168
      trimestres, pour les assurés nés entre le 1er janvier 1961 et le 31 décembre
      1963 ; 169 trimestres, pour les assurés nés entre le 1er janvier 1964 et le
      31 décembre 1966 » ; loi n° 2023-270, article 10, XXX, B (LEGIARTI000053280920)
      : « Les autres dispositions du présent article […] s'appliquent aux pensions
      prenant effet à compter du 1er septembre 2023 »
    date: 2026-09-24
  - type: circulaire_cnav
    reference: >-
      2023-19 du 15 septembre 2023, point 2 : les nouvelles durées « s'appliquent
      aux retraites personnelles prenant effet à compter du 1er septembre 2023 »
      ; l'exemple de réversion oppose 169 trimestres à un assuré né en 1965 dont
      la pension aurait pris effet avant cette date, 172 après
    date: 2023-09-15
  - type: service_public
    reference: fiche F14044
    date: 2026-08-14
  - type: legifrance
    reference: >-
      R. 351-45 CSS, rédactions du 28 août 1993 (LEGIARTI000006749449) et du 10 mai
      1995 (LEGIARTI000006749450, jusqu'au 1er janvier 2009), index LEGI à jour au
      2 novembre 2026 : « I. - La durée d'assurance et de périodes reconnues
      équivalentes de 160 trimestres […] est applicable aux pensions prenant effet
      postérieurement au 31 décembre 2002, quelle que soit la date de naissance de
      l'assuré. II. - En ce qui concerne les pensions prenant effet avant le 1er janvier
      2003, […] 150 trimestres pour l'assuré né avant le 1er janvier 1934 ; 151
      trimestres pour l'assuré né en 1934 ; […] 159 trimestres pour l'assuré né en
      1942. III. - Par dérogation au I ci-dessus, la durée […] demeure fixée à 159
      trimestres pour les assurés nés en décembre 1942 et dont la pension prend effet
      au 1er janvier 2003 » ; puis R. 351-27, de sa rédaction du 1er janvier 2009
      (LEGIARTI000020082993) à celle du 1er septembre 2023 : « Pour les assurés nés
      avant le 1er janvier 1949, cette limite est fixée à 160 trimestres »
    date: 2026-11-03
  - type: circulaire_cnav
    reference: >-
      base de législation de la Cnav, exposé « Durée d'assurance pour le taux plein »
      (version du 15 septembre 2026), « Anciennes dispositions, avant le 01/01/2009 » :
      « Le nombre de trimestres était fixé à 160 trimestres pour les retraites
      attribuées à partir de 2003. L'assuré né en décembre 1942, qui totalisait 159
      trimestres bénéficiait du taux plein si le point de départ de sa retraite était
      fixé le 01/01/2003 » ; ses tableaux, confrontés aux séries par
      tests/test_cnav_exposes.py (action 175, étape 4)
    date: 2026-09-15
  - type: legifrance
    reference: >-
      décret n° 2008-1555 du 31 décembre 2008, article 4 (JORFARTI000020021132), en
      vigueur le 1er janvier 2009 (article 5) : il remplace au 1° de R. 351-27 « 160
      trimestres » par la limite « résultant de l'article 5 de la loi n° 2003-775 », et
      abroge la section qui portait R. 351-45 ; loi n° 2003-775, article 5, III
      (JORFARTI000001914387) : la durée est « majorée d'un trimestre par année » « à
      compter de 2009 ». Avant 2009, 160 trimestres à toute génération
    date: 2026-11-16
  - type: circulaire_cnav
    reference: >-
      2008/41 du 25 juillet 2008, § 211 et 213 : les durées totale et cotisée « évoluent
      à compter du 1er janvier 2009 » ; les demandes « pour des dates d'effet
      postérieures au 1er décembre 2008 » se liquident aux nouvelles durées
    date: 2008-07-25
  - type: circulaire_cnav
    reference: >-
      2011/25 du 17 mars 2011 : « La durée d'assurance à retenir pour les assurés nés au
      cours des années 1953, 1954 et suivantes est donc de 164 ou 165 trimestres selon
      que la date de demande [...] se situe avant ou après le 1er janvier 2011 », pour
      l'ouverture du droit « de même que pour procéder au calcul de la pension » ; les
      attestations d'avant 2011 « pour des dates d'effet de pension jusqu'au 1er juin
      2011 au plus tard ne doivent pas être remises en cause ». Le modèle, qui n'a pas
      de date de demande, lit 164 jusqu'à une pension prenant effet le 1er juin 2011,
      165 au-delà, la fiabilité ramenée à moyenne pour les pensions de 2011. La
      circulaire est celle de la caisse : la fonction publique garde la table de la
      génération, comme OpenFisca (tests/test_oracle_carriere_longue_fonction_publique.py)
    date: 2011-03-17
  - type: legifrance
    reference: >-
      décret n° 2011-916 du 1er août 2011 (JORFTEXT000024419259), article 1er : 166
