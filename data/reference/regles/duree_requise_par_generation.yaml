      des décrets qui fixeront la durée d'assurance applicable aux générations nées à
      compter de 1955, la durée d'assurance à retenir correspond à celle en vigueur pour
      les assurés nés en 1953 et 1954 pour les estimations de retraite ». Elle ne dit rien
      des départs anticipés de 2011, ni de la date de la demande : elle ne contredit pas
      la 2011/25
    date: 2011-03-17
  - type: legifrance
    reference: >-
      décret n° 2011-916 du 1er août 2011 (JORFTEXT000024419259), article 1er : 166
      trimestres « pour les assurés nés en 1955 » ; entrée en vigueur « le lendemain de
      la publication », le 3 août 2011 : 165 aux nés en 1955 jusqu'à une pension
      prenant effet le 1er août 2011
    date: 2026-11-16
