    droit/invalidite.py : reconnu_inapte, age_d_inaptitude, taux_plein_de_l_inapte,
    age_de_l_aspa ;
    scenarios/actuel.py, echeancier.py et revalorisation.py, où l'ASPA s'ouvre ;
    droit/ouvrir.py :
    age_ouverture, ouvrir, age_taux_plein_droit ; droit/liquider.py : la décote, le
    minimum contributif, abattement_points, abattement_regime_de_base ;
    scenarios/actuel.py : Invalidites
