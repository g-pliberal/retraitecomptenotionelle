    simulations, dans les deux moteurs
sources:
  lu_le: 2026-10-05
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 30 septembre 2026 avec le domaine de l'invalidité et de l'inaptitude
    (docs/architecture.md, § 11), à la demande du propriétaire, et lue par le moteur à
    sa troisième étape : l'âge, le taux plein et l'âge de l'allocation aux personnes
    âgées. L'exemple de la circulaire Cnav n° 2012/27 la rejoue depuis la quatrième
    étape, le taux plein et le cumul intégral à l'âge du taux plein automatique ; ne se
    rejouent pas ceux de la circulaire RSI n° 2011/017, d'avant le relèvement de 2011,
    ni l'ASPA de l'ex-invalide de la circulaire Cnav n° 2012/63 (§ 8282), parti pour
    pénibilité avec l'allocation supplémentaire d'invalidité, que le modèle ne porte
    pas.
  - >-
    À lire : l'article L. 332 du code de 1956, que la loi n° 71-1132 réécrit, et la
    rédaction de l'article 70-1 du décret de 1945 applicable en 1972, que l'index ne
    porte qu'à compter du 1er janvier 1973 ; l'article de la loi n° 2010-1330 qui fait
    suivre l'âge légal aux inaptes ; les règles propres aux exploitants agricoles
    (L. 732-23 du code rural), aux professions libérales, aux avocats et aux régimes
    spéciaux, que la fiche ne couvre pas ; l'inaptitude des régimes des assurances
    sociales d'avant 1945.
  - >-
    Un contrôle négatif du 20 septembre 2026 (journal de veille) disait qu'« L. 351-7
    CSS [...] N'EXISTE PAS dans le code de la sécurité sociale — la référence exacte
    est L. 351-8 1° bis ». C'était faux : l'index LEGI porte L. 351-7 au code de la
    sécurité sociale depuis 1985 (LEGIARTI000006742675), et l'inaptitude est au 2° de
    L. 351-8, le 1° bis étant l'aidant familial à soixante-cinq ans. La requête
    `--num L351-7` rendait d'abord les articles homonymes du code de la construction ;
    la fiche et l'inventaire des avantages citent désormais les bons articles.
  lectures:
  - type: legifrance
    reference: >-
      arrêté du 30 décembre 1970 (Ircantec), article 16, dans ses rédactions de 1971
      (LEGIARTI000006381606), 1978, 1983, 2011, 2018 et 2023 (LEGIARTI000048065521) :
      « Toutefois, ce coefficient de réduction n'est pas applicable : 1° Dans le cas
      d'une inaptitude au travail reconnue entre soixante et soixante-cinq ans par la
      sécurité sociale », puis « Les agents et anciens agents atteints d'une inaptitude
      au travail reconnue par la sécurité sociale dans les conditions prévues à
      l'article L. 351-7 […] et liquidant à taux plein leur pension de vieillesse du
      régime général » ; l'accord Agirc-Arrco du 17 novembre 2017, article 84, 3, lu le
      27 septembre 2026 (fiche coefficients_anticipation_agirc_arrco)
    date: 2026-09-30
  - type: legifrance
    reference: >-
      L. 351-7 (1985), L. 351-8 (1985, 2003, 2011, 2014, 2023, 2025), R. 351-21 (1985),
      R. 351-22 (1985, 2001), L. 351-1-5 (2023), D. 351-1-14 (2023, 2026), R. 815-1
      (2007, 2011, 2015, 2023), L. 821-1 (1998 à 2026), L. 351-7-1 A (2020, 2023) CSS ;
      décret n° 45-0179, article 70-1 (1973), dans l'index LEGI du dépôt mis à jour au
      30 septembre 2026
    date: 2026-09-30
  - type: autre
    reference: >-
      ordonnance n° 45-2454 du 19 octobre 1945, articles 63 à 65, lue dans la base
      législative de la Cnav (ORD_452454_19101945)
    url: https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=ORD_452454_19101945.aspx
    date: 2026-09-30
  - type: autre
    reference: >-
      circulaire Cnav n° 2024-26 du 2 août 2024, « La retraite anticipée au titre de
      l'inaptitude au travail à compter du 1er septembre 2023 », qui remplace pour
      partie la n° 2023-22 : la reconnaissance médicale et la présomption d'inaptitude
      (ex-invalides, bénéficiaires de l'AAH, de l'ASI, de la carte d'invalidité,
      incapacité permanente d'au moins 50 %...) ; la retraite « au taux maximum de 50 %,
      quelle que soit la durée d'assurance », portée au minimum contributif ; la date
      d'effet de droit commun, sans âge limite ; l'Aspa « à compter de 62 ans » ; la
      retraite complémentaire des indépendants sans abattement à la même date
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2024_26_02082024.pdf
    date: 2026-09-30
  - type: service_public
    reference: >-
      fiche F16871, « Allocation de solidarité aux personnes âgées (Aspa) » :
      « Cas général : Vous pouvez obtenir l'Aspa dès 65 ans », plus tôt pour une
      retraite anticipée ; R. 815-1 relu dans ses rédactions de 2007 à 2023 : l'âge
      « est abaissé à l'âge prévu à l'article L. 351-1-5 pour les personnes mentionnées
      aux 2° à 5° de l'article L. 351-8 »
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F16871
    date: 2026-09-30
  - type: service_public
    reference: >-
      fiche F14044, « Pension de retraite à taux plein », vérifiée le 14 août 2026 :
      « Vous avez droit à une retraite à taux plein à partir de 62 ans si vous êtes
      reconnu inapte au travail »
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F14044
    date: 2026-09-30
  - type: autre
    reference: >-
      circulaire Cnav n° 2012/27 du 16 mars 2012, point 4 : les inaptes « peuvent
      obtenir le taux plein, dès l'âge légal, quelle que soit leur durée d'assurance » ;
      l'assurée née le 15 novembre 1951, reconnue inapte, partie le 1er avril 2012 avec
      158 trimestres, cumule entièrement « à partir du 1er avril 2017, soit à 65 ans et
      4 mois », dans la limite de L. 161-22 avant
    url: https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=circulaire_cnav_2012_27_16032012.aspx
    date: 2026-10-01
