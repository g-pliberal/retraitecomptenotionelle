  nee_de: JORFTEXT000000888522
  bornes:
    liquidation.date_effet: [1983-04-01, 2011-07-01]
  contenu:
    droit: >-
      « Bénéficient du taux plein même s'ils ne justifient pas de la durée requise
      d'assurance [...] : [...] 2°) les assurés reconnus inaptes au travail dans les
      conditions prévues à l'article L. 351-7 » (L. 351-8) ; « Peut être reconnu inapte
      au travail, l'assuré qui n'est pas en mesure de poursuivre l'exercice de son
      emploi sans nuire gravement à sa santé et qui se trouve définitivement atteint
