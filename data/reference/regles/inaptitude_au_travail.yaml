schema_version: 1
id: inaptitude_au_travail
intitule: >-
  L'assuré reconnu inapte au travail — qui ne peut poursuivre son emploi sans nuire
  gravement à sa santé et dont l'incapacité de travail, définitive, atteint 50 % — a
  le taux plein quelle que soit sa durée d'assurance, au régime général et dans les
  régimes alignés : le taux de soixante-cinq ans dès soixante ans jusqu'au 31 mars
  1983, le taux plein à l'âge légal ensuite, à soixante-deux ans depuis le
  1er septembre 2023 quand l'âge légal monte ; l'allocation de solidarité aux personnes
  âgées, au même âge au lieu de soixante-cinq ans. Les bénéficiaires de l'allocation
  aux adultes handicapés, les ex-invalides et d'autres encore sont réputés inaptes ;
  depuis 2015, l'assuré dont l'incapacité permanente atteint 50 % a le même droit.
domaine: age
regimes: [regime_general, msa_salaries, cancava, organic, rsi, assurances_sociales]
etape: ouvrir_le_droit
face: droit
etat: approchee
lit:
- la reconnaissance de l'inaptitude au travail, ou ce qui la fait présumer (pension
  d'invalidité substituée, allocation aux adultes handicapés, carte d'invalidité,
  incapacité permanente d'au moins 50 %)
- l'âge à la date d'effet de la pension, et la génération
ecrit:
- l'âge auquel le droit s'ouvre à l'inapte, et le motif de l'ouverture
- le taux plein, sans condition de durée, que « liquider chaque régime » applique
- l'âge d'ouverture de l'allocation de solidarité aux personnes âgées
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1).
