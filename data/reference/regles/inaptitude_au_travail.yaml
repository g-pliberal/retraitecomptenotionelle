approximations:
- version: [taux_plein_1983]
  ecart: >-
    avant 2007, l'âge de l'allocation supplémentaire du fonds national de solidarité
    (L. 815-2), qui précède l'allocation de solidarité aux personnes âgées, n'est pas
    lu : la version le tient pour le même, soixante ans pour l'inapte ; l'âge de
    l'allocation se lit à la date de la pension, et non à celle de sa demande
  effet: non mesuré
- ecart: >-
    les régimes que la fiche ne nomme pas gardent leur décote ou leur coefficient pour
    l'inapte : les exploitants agricoles, les professions libérales, les avocats, les
    régimes spéciaux, et les complémentaires des indépendants, dont les textes ne sont
    pas lus ; l'Agirc et l'Arrco d'avant 1983 aussi, dont les règlements d'alors ne le
    sont pas
  effet: >-
    la pension des inaptes de ces régimes, sous-estimée ; non mesuré
- ecart: >-
    seuls l'inaptitude déclarée, l'ex-invalide et, depuis le 1er janvier 2015,
    l'incapacité permanente d'au moins 50 % que la saisie date la font reconnaître ;
    les autres réputés inaptes (allocation aux adultes handicapés, carte d'invalidité)
    ne se déclarent pas, et la condition de trente, puis de trente-sept ans et demi
    d'assurance d'avant 1983 n'est pas contrôlée : la pension s'y proratise à la
    durée, comme le texte le dit en deçà
  effet: non mesuré
code:
