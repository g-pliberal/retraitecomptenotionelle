historique:
- >-
  2026-09-30 — née avec le quatrième domaine, l'invalidité et l'inaptitude, ouvert à la
  demande du propriétaire ; de la fiche inaptitude_invalidite_penibilite_amiante, qui
  la portait sans versions et sous un article qui n'était pas le sien.
- >-
  2026-09-30 — lue par le moteur, à la troisième étape du domaine : l'inapte et
  l'ex-invalide ont le taux plein à l'âge de la version, que l'âge légal de leur
  génération n'ouvre pas encore depuis 2023 ; l'Agirc-Arrco (accord de 2017, article
  84, 3, et les accords de l'ASF depuis 1983) et l'Ircantec (arrêté du 30 décembre
  1970, article 16, dès 1971) les servent sans coefficient d'anticipation ; l'ASPA
  s'ouvre à leur âge, au départ et aux échéances (R. 815-1).
- >-
  2026-10-01 — rejouée par l'exemple de la circulaire Cnav n° 2012/27, à la quatrième
  étape du domaine.
- >-
  2026-10-05 — la version age_legal_2011 coupée au 1er janvier 2015 : depuis, l'assuré
  dont l'incapacité permanente atteint 50 % a le taux plein à l'âge légal (L. 351-8,
  1° ter ; R. 351-24-3), puis à soixante-deux ans avec l'inapte (2°, depuis le
  1er septembre 2023), et l'allocation au même âge (R. 815-1) ; la saisie date cette
  incapacité, avec le départ anticipé des assurés handicapés (action 142, fiche
  retraite_anticipee_handicap).
effet: >-
  Les retraités partis au taux plein pour inaptitude : 1,36 million fin 2016 (DREES,
  EIR), et avec les ex-invalides 19 % des nouveaux retraités du régime général en 2024
  (COR). Le modèle les sert au taux plein à leur âge, au régime général et dans les
  régimes alignés, leurs complémentaires de salariés sans coefficient, et l'allocation
  de solidarité aux personnes âgées à leur âge.
