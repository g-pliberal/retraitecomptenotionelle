schema_version: 1
id: ravgdt_allocation_viagere
intitule: >-
  Le gérant de débit de tabac acquiert chaque année des « points tabac » sur les remises
  que lui vaut la vente des tabacs — depuis 2006, ses remises corrigées divisées par
  cent fois la valeur d'achat du point —, cotise sur ces remises, 2 % jusqu'en 2007 puis
  de 1,98 % à 1,55 %, l'État versant le double, et touche à soixante-cinq ans, ou dès
  soixante avec une réduction définitive, une allocation égale à ses points multipliés
  par la valeur de service du point, en rente s'il a quinze ans de gestion, au prorata
  de sept à quinze ans, en capital en deçà.
domaine: points
regimes: [gerants_debits_tabac]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- les années de gestion d'un débit de tabac, et les remises brutes allouées chaque année
  sur la vente des tabacs, par produit depuis 2008
- la valeur d'achat et la valeur de service du point de chaque année (arrêté du 13
  novembre 1963, article 14)
- à la liquidation, l'âge, la durée de gestion, l'invalidité, le conjoint et les enfants
ecrit:
- les points tabac de chaque année de gestion
- l'allocation viagère, en rente ou en capital, et ce qui en revient au conjoint et aux
  orphelins
dates_qui_decident:
- revenu.annee
# `revenu.annee` est l'année des remises, qui décide du taux, du plafond et du prix
# du point. Aucune version n'est lue par un moteur : le modèle calcule le régime par
# sa fiche (regimes/gerants_debits_tabac.yaml) et un rendement, que `code` nomme.
