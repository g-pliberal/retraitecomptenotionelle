approximations:
- version: [points_tabac_a_valeur_d_achat, taux_par_produit, taux_unique_decroissant]
  ecart: >-
    Le modèle convertit la seule cotisation du gérant, 2 % du revenu saisi, à 49 centimes
    de rente par euro (rendements_points.csv, ligne gerants_debits_tabac, 1963-2100,
    niveau `estimee`) : c'est le rapport de la valeur de service à la valeur d'achat,
    2,42 / 4,94, comme si un point coûtait 4,94 € de cotisation. L'article 14 fait
    coûter un point cent fois la valeur d'achat en remises corrigées, 494 € en 2026,
    soit 9,88 € de cotisation du gérant à 2 % et 7,68 € à 1,555 %. Si les remises
    corrigées valent les remises brutes, le modèle sert 0,98 % des remises par année
    de gestion quand le barème en sert 0,49 %.
  effet: >-
    non mesuré par une simulation ; calculé sur le barème de 2026, l'allocation du
    modèle est le double de celle du droit, à remises corrigées égales aux remises
    brutes, que l'index ne permet pas de vérifier
- version: [taux_ministeriel_et_plafond_de_remises, deux_pour_cent_des_remises_brutes,
    points_tabac_a_valeur_d_achat, taux_par_produit, taux_unique_decroissant]
  ecart: >-
    Le taux de 2 % est appliqué de 1963 à aujourd'hui, et le revenu saisi tient lieu de
    remises sans le plafond de 1963 à 2006 (30 000 F en 1963, 290 000 F depuis 1981) ;
    le droit donne un taux fixé par le ministre avant 1990, puis 1,98 % à 1,555 % depuis
    2008 ; et, depuis 2006, les points suivent les remises, non la cotisation.
  effet: non mesuré
- version: taux_unique_decroissant
  ecart: >-
    L'allocation est servie à soixante-cinq ans, sans l'anticipation dès soixante ans
    et ses réductions de 6 à 23 %, sans la liquidation pour invalidité, sans les seuils
    de quinze ans et de 400 points, le prorata de sept à quinze ans et le capital en
    deçà, sans les seuils de la réversion ; le rendement est le même de 1963 à 2100,
    quand la valeur de service a été sous-indexée de 2006 à 2015 et que le rapport des
    deux valeurs est passé de 0,55 en 2005 à 0,49 en 2026.
  effet: non mesuré
sources:
  lu_le: 2026-10-13
  prochaine_relecture: 2027-07-31
  a_relire:
  - >-
    Trouver la correction des remises (décret, article 4 : « corrigées dans les
    conditions fixées par arrêté ») et l'article 15 de l'arrêté de 1963 (tranches de
    remises), absents de l'index : c'est d'eux que dépend l'écart de rendement que la
    fiche signale, et qui ferait de l'allocation du modèle le double de celle du droit.
  - >-
    Lire chaque 1er juillet la valeur de service, et chaque 1er janvier la valeur
    d'achat (arrêté, article 14), et chaque décret qui fixe le taux de l'année
    (décret, article 2) : la rédaction de 2024 s'arrête à 2025.
  lectures:
  - type: legifrance
    reference: >-
      décret n° 63-1104 du 30 octobre 1963, articles 2 (dix-sept rédactions, de 1963 à
      2024) et 4 (trois rédactions) ; arrêté du 13 novembre 1963, articles 5, 5 bis, 6
      (neuf rédactions), 11, 12, 13, 14 (trente-trois rédactions, de 2006 à 2026), 16,
      17, 18, 20, 21, 22, 24 et annexe : index LEGI du dépôt, à jour au 12 octobre 2026
    date: 2026-10-13
reformes: [ravgdt_1963, ravgdt_1990]
code:
  python: >-
    données : regimes/gerants_debits_tabac.yaml, deux périodes en points (1963-1989,
    1990 et après), 2 % du revenu saisi, déplafonné, statut gerant_debit_tabac ;
    droit/acquerir.py : acquerir, qui convertit la cotisation par le rendement, faute de
    barème du point dans valeurs_point.csv ; droit/liquider.py : liquider_chaque_regime
  javascript: >-
    moteur/js/droit/acquerir.js : acquerir ; moteur/js/droit/liquider.js :
    liquiderChaqueRegime
  parametres: regimes/rendements_points.csv (gerants_debits_tabac, 1963-2100, 0,49)
  tests: tests/temoins/simulations.json, les carrières du statut gerant_debit_tabac
historique:
- >-
  2026-10-13 — écrite à l'étape 2 de l'action 145 : le régime n'avait que la fiche
  générique de liquidation, et sa fiche de régime tenait le barème du point pour « hors
  index ». L'index LEGI le porte année par année depuis 2006 (arrêté, article 14), avec
  le taux de chaque année (décret, article 2) et les règles de liquidation ; la lecture
  ne change aucun chiffre, et signale un rendement du modèle double de celui du barème.
effet: >-
  Les gérants de débits de tabac et leurs conjoints :
  leur allocation viagère, que le modèle sert à soixante-cinq ans, et sans doute à un
  rendement double de celui du barème.
