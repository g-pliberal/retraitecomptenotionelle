  contenu:
    taux: >-
      « Une cotisation de 2 % de la remise visée au 3° du I de l'article 570 du code
      général des impôts » à la charge du débitant, et « une cotisation de l'Etat égale
      au double de celle des débitants » (décret, article 2) ; le ministre pilote le
      régime pour « maintenir son équilibre à l'horizon de trente ans » et, l'équilibre
      garanti, « son taux de rendement tel que constaté en 2005 »
    points: >-
      « Le nombre de "points tabac" acquis au titre d'une année résulte de la formule
      suivante : Remises corrigées/100 x valeur d'achat du point » (rédaction de 2010 ;
      celle de 2006 pose la même fraction sur deux lignes) — les remises
      corrigées divisées par cent fois la valeur d'achat —, les remises étant celles de
      l'année précédente, « corrigées dans les conditions fixées par arrêté » (décret,
      article 4), une correction que l'index ne détaille pas ; le rendement du régime
      vaut « Valeur de service du point/ Taux de cotisation (*) x 100 x Valeur d'achat
      du point × Remises corrigées/ Remises brutes », le taux réunissant celui des
      débitants et celui de l'État (arrêté, article 14) ; au 1er janvier 2006, 3,59 €
      d'achat pour l'exercice 2005 et 1,99 € de service
    valeur_de_service: >-
      révisée chaque 1er juillet ; « A compter de 2006, la valeur de service du point est
      sous-indexée chaque année, pendant dix ans, d'un point par rapport à l'inflation
      hors tabac constatée pour l'année civile précédente » (décret, article 4)
    allocation: >-
      en rente, aux points par la valeur de service, avec quinze ans de gestion et plus
      de 400 points, ou sur 400 points au moins avec quinze ans ; de sept à quinze ans et
      plus de 300 points, aux points multipliés par autant de quinzièmes que d'années de
      gestion ; en capital, sous sept ans, ou de sept à quinze ans avec moins de 300
      points, « dix fois le nombre de points accumulés multiplié par autant de quinzièmes
      d'années de service accomplies, par la valeur de service du point » ; moins d'un
      an compte pour un an (article 16) ; l'allocation part du premier jour du trimestre
      civil qui suit la demande, présentée au plus tôt trois mois avant la cessation
      (article 13), et se paie par trimestre d'avance (article 22) ; l'invalidité ouvre
      la liquidation dès soixante ans avec quinze ans de gestion (article 12, barème
      d'invalidité en annexe)
    reversion: >-
      le conjoint survivant, et les conjoints divorcés au prorata des mariages, reçoivent
      une allocation sur la moitié des points, à soixante ans ou avec un enfant à
      charge, si le mariage a deux ans ou a donné un enfant (article 20) ; chaque
      orphelin mineur, sur le quart des points, et l'enfant majeur handicapé à charge,
      sur la moitié (article 21)
