    date: 2018-02-01
  - type: circulaire_cnav
    reference: 2026-07 du 5 mars 2026, point 4.2
    date: 2026-03-05
  - type: service_public
    reference: fiche F19643
    date: 2026-01-01
textes_a_rattacher:
