schema_version: 1
id: surcote_regime_general
intitule: >-
  Trimestres civils entiers cotisés après l'âge légal et au-delà de la durée requise,
  depuis le trimestre qui suit l'âge légal ou le mois qui suit la durée ; taux à
  la date de chaque trimestre (0,75 %, 1 %, 1,25 % après 65 ans, 1,25 % depuis 2009).
etat: conforme
etape: liquider_chaque_regime
effet: Toute liquidation après l'âge légal avec la durée requise.
sources:
  lu_le: 2026-09-17
  prochaine_relecture: 2027-06-30
  lectures:
