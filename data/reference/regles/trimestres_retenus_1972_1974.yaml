schema_version: 1
id: trimestres_retenus_1972_1974
intitule: >-
  Au régime général et aux salariés agricoles, la loi n° 71-1132 porte de 120 à 150 le
  nombre de trimestres retenus pour calculer la pension, par paliers : la pension est
  égale à autant de cent cinquantièmes de la pension calculée au taux que l'assuré
  justifie de trimestres, dans la limite de 128 pour une pension qui prend effet en 1972,
  de 136 en 1973, de 144 en 1974 ; les 150 sont tous retenus à compter de 1975.
etat: transcrite
effet: >-
  Les pensions du régime général et des salariés agricoles prenant effet de 1972 à 1974,
  que le modèle borne à 128, 136 puis 144 trimestres (`trimestres_retenus_maximum`,
  périodes de 1972, 1973 et 1974 des deux fichiers). Les deux régimes ne comptant la
  durée, dans le modèle, qu'à partir de 1945, où leurs périodes commencent, une carrière
  n'y atteint au plus que 108 trimestres en 1972, 116 en 1974 : le plafond ne mord que
  sur la majoration de durée des mères, de cinq enfants et plus en 1972, six en 1973,
  sept en 1974. Une mère de huit enfants partie à soixante-cinq ans en 1972 voit ses 140
  trimestres ramenés à 128, 8,6 % de pension en moins. Aucun des 535 témoins n'est
  touché.
sources:
  lu_le: 2026-09-27
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Aucun exemple chiffré publié n'a été trouvé : la fiche reste `transcrite`.
  - >-
    Le 2 de l'article 72-1 renvoie à un arrêté le « montant maximum que ne pourront dépasser
    les pensions servies » de 1972 à 1974 ; la circulaire Cnav n° 2/72 le chiffre à 44 %,
    46 % puis 48 % du plafond à soixante-cinq ans. Le modèle ne le porte pas : avec 128
    trimestres sur 150, une pension au taux plein reste sous 43 % du plafond, et il ne
    pèserait qu'avec la majoration d'ajournement au-delà de soixante-cinq ans (fiche
    `decote_avant_1983`).
  lectures:
  - type: legifrance
    reference: >-
      décret n° 45-0179 du 29 décembre 1945, article 72-1, rédaction du 29 janvier 1972 au
      21 décembre 1985 (LEGIARTI000006760613), issue du décret n° 72-78 du 28 janvier 1972 :
      « Pour les pensions dont l'entrée en jouissance se situe en 1972, la durée maximum
      d'assurance prise en compte est fixée à trente-deux années (soit 128 trimestres) et la
      pension est égale à autant de cent cinquantièmes de la pension calculée selon les taux
      prévus à l'article 70 ou à l'article 70-1 ci-dessus, que l'assuré justifie de
      trimestres d'assurance, dans la limite de 128 », trente-quatre années (136 trimestres)
      en 1973, trente-six années (144 trimestres) en 1974. Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      décret n° 50-1225 du 21 septembre 1950 (assurances sociales agricoles), article 59-1,
      rédaction du 1er juillet 1972 au 22 avril 2005 (LEGIARTI000006774035) : le même
      paragraphe, au mot près, sur « la pension calculée selon les taux prévus à l'article
      55 ou à l'article 55-1 », 128, 136 et 144 trimestres pour les pensions dont l'entrée en
      jouissance se situe en 1972, 1973 et 1974. Et la loi n° 71-1132, article 10
      (LEGIARTI000006756029) : « La présente loi est applicable aux pensions des
      travailleurs salariés agricoles. » Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 2/72 du 31 janvier 1972, application de la loi n° 71-1132 et
      du décret n° 72-78 du 28 janvier 1972, point I : « Le montant de la pension à servir
      est égal à autant de 150° de la pension normale que l'assuré justifie de trimestres
      d'assurance. Le nombre de trimestres à retenir ne peut être supérieur à » 128 « si le
      point de départ de la pension est fixé en 1972 », 136 en 1973, 144 en 1974, et 150
      « si la pension prend effet postérieurement au 31 décembre 1974 »
    url: >-
      https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_272_31011972.aspx
    date: 2026-09-27
textes_a_rattacher:
- id: LEGIARTI000006760613
  reference: >-
    décret n° 45-0179 du 29 décembre 1945, article 72-1, rédaction du 29 janvier 1972 (décret
    n° 72-78) : les paliers de 128, 136 et 144 trimestres au régime général
- id: LEGIARTI000006774035
  reference: >-
    décret n° 50-1225 du 21 septembre 1950, article 59-1, rédaction du 1er juillet 1972 : les
    mêmes paliers aux salariés agricoles
- id: LEGIARTI000006756029
  reference: >-
    loi n° 71-1132 du 31 décembre 1971, article 10 : la loi est applicable aux pensions des
    travailleurs salariés agricoles
code:
  moteur: >-
    `trimestres_retenus_maximum`, paramètre des périodes de 1972, 1973 et 1974 du régime
    général et des salariés agricoles, borne les trimestres que la pension retient sans
    toucher au dénominateur de la proratisation, 150 : `liquider` et son portage prennent le
    plus petit des trimestres du régime et de ce plafond.
