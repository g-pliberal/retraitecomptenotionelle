  contenu:
    droit: >-
      la loi n° 87-563 récrite rend applicables les chapitres I à VI et VIII du titre V
      du livre III du code de la sécurité sociale, sous réserve d'adaptations (article 5,
      3°), aux pensions prenant effet depuis le 1er juillet 2016 (ordonnance, article 4)
    ouverture: >-
      l'âge de L. 161-17-2 et la durée de L. 161-17-3 décalés : 150 trimestres avant
      1956, deux de plus par génération jusqu'à 166 pour 1963, 172 à compter de 1973
      (article 5, 1°, b et c)
    calcul: >-
      le revenu professionnel de base de L. 351-1 « pour les assurés nés à compter du
      1er janvier 1962 », vingt-cinq années ; avant, « 40 ans pour les assurés nés avant
      1956 ; 38 ans pour les assurés nés en 1956 », deux de moins par génération jusqu'à
      « 28 ans pour les assurés nés en 1961 » (article 5, 3°, d) ; le décret n° 2017-1000
      écrit pourtant « égal à vingt-cinq » à R. 351-29 pour tous (article 3, XV, 2°) ; les
      allocations de chômage de la morte-saison du tourisme, de la pêche, de
      l'agriculture et du bâtiment entrent dans le revenu (article 5, 3°, e)
    surcote: >-
      « 1,25 % pour chaque trimestre accompli à compter du 1er juillet 2016 » au-delà de
      l'âge et de la durée (décret n° 2017-1000, article 3, XI, adaptant D. 351-1-4)
    periodes_d_avant: >-
      les années du 1er mai 1960 au 31 juillet 1987 « correspondent à un montant
      forfaitaire fixé par décret », et leurs trimestres se comptent à 173,33 heures de
      cotisation (article 5, 3°, f et g)
    cotisations: >-
      au plafond de L. 241-3, celui de la sécurité sociale (article 4, I) ; aux taux
      nationaux « A compter du 1er janvier 2026 » pour la part plafonnée et « à compter
      du 1er janvier 2030 » pour la part déplafonnée, et, entre-temps, à des taux
      « fixés par décret » (article 4, IV) : 5,78 % pour l'employeur et 6,08 % pour le
      salarié en 2016, 6,61 % et 6,33 % en 2019, 7,44 % et 6,57 % en 2022 ; aucune part
      déplafonnée avant 2027 (décret n° 89-110, article 38-3)
