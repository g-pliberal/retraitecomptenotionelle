approximations:
- version: loi_de_1987
  ecart: >-
    Le revenu de base est la moyenne de toutes les années d'assurance (décret n° 89-110,
    article 8), quand la fiche de régime prend les dix meilleures ; les années de 1960 à
    1987 entrent au forfait de 97 000 F revalorisé, que la fiche de régime, ouverte en
    1987, ne porte pas, ni la validation de leurs trimestres à deux mois de cotisations.
  effet: >-
    non mesuré ; les pensions liquidées de 1987 à juin 2016 : la moyenne de toute la
    carrière est plus basse que celle des dix meilleures années, et la carrière d'avant
    1987, au forfait, peut la relever ou l'abaisser
- version: [ordonnance_de_2015, reforme_de_2023, suspension_de_2026]
  ecart: >-
    Depuis juillet 2016, le revenu moyen se calcule sur quarante à vingt-huit années
    pour les générations nées avant 1962, et vingt-cinq ensuite, quand la fiche de
    régime prend dix années en 2016 et vingt-cinq depuis 2017 ; la surcote de
    1,25 % par trimestre, le forfait des années 1960 à 1987 et le chômage de la
    morte-saison ne sont pas portés.
  effet: >-
    non mesuré ; les assurés nés avant 1962, dont le salaire moyen simulé compte trop
    peu d'années, et ceux qui travaillent au-delà du taux plein, dont la surcote manque
- version: [loi_de_1987, ordonnance_de_2015, reforme_de_2023, suspension_de_2026]
  ecart: >-
    Les taux de cotisation sont écrits : 10,5 % en 1989, 11 % en 1996, 11,5 % depuis
    1998, 11,86 % en 2016 montant à 15,09 % en 2025, plus 0,20 % depuis 2025, et aucune
    part déplafonnée avant 2027 ; la fiche de régime, qui les disait fixés localement et
    absents de l'index, prête ceux du régime général, 14,61 % à 15,45 % plafonnés et
    0,44 % à 2,41 % déplafonnés.
  effet: >-
    la cotisation simulée est trop haute, de 42 à 52 % de 1989 à 2016, de 17 % en 2025 ;
    la pension, en annuités, n'en dépend pas, mais l'effort contributif comparé dans
    les scénarios, oui
