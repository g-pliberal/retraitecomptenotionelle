code:
  moteur: >-
    une fiche de régime en annuités, une période par réforme, l'âge et la durée lus à la
    génération par les tables `spm_2015`, `spm_2023` et `spm_2026`
  python: >-
    donnees/regimes.py : CatalogueRegimes ; droit/liquider.py : liquider_chaque_regime
  javascript: >-
    moteur/js/regimes.js : CatalogueRegimes ; moteur/js/droit/liquider.js :
    liquiderChaqueRegime
  parametres: >-
    regimes/cps_saint_pierre_et_miquelon.yaml : taux_plein, duree_requise_trimestres,
    salaire_reference, decote_par_trimestre, taux_cotisation_retraite ;
    legislation/ages_regimes.csv, legislation/duree_requise_regimes_speciaux.csv
  tests: >-
    tests/temoins/simulations.json, les carrières du statut
    salarie_saint_pierre_et_miquelon, que le portage rejoue
historique:
- >-
  2026-10-16 — écrite à l'étape 2 de l'action 145 : le régime de Saint-Pierre-et-Miquelon
  n'avait que la fiche générique de liquidation. Le décret n° 89-110 écrit le revenu
  moyen de toute la carrière et le forfait des années 1960 à 1987 ; les arrêtés de 1989,
  1996 et 1998 et le décret n° 2015-1876 écrivent les taux de cotisation, que la fiche de
  régime disait absents de l'index. Aucun chiffre ne change.
effet: >-
  Les assurés de Saint-Pierre-et-Miquelon : leur pension est simulée au droit pour l'âge
  et la durée, mais sur un revenu moyen de trop peu d'années, sans surcote ni carrière
  d'avant 1987, et leur cotisation au taux national, plus haut que celui de l'archipel.
