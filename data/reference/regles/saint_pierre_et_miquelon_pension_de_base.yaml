schema_version: 1
id: saint_pierre_et_miquelon_pension_de_base
intitule: >-
  Le salarié et le non-salarié de Saint-Pierre-et-Miquelon reçoivent de la caisse de
  prévoyance sociale une pension de base : de 1987 à juin 2016, le taux de R. 351-27
  appliqué au revenu moyen de toute la carrière, les années de 1960 à 1987 au forfait de
  97 000 F revalorisé, en autant de 150es que de trimestres, pour une durée qui monte de
  108 trimestres en 1987 à 150 en 1998 ; depuis le 1er juillet 2016, le code de la
  sécurité sociale adapté, l'âge et la durée décalés de sept générations, le revenu
  moyen de quarante à vingt-huit années pour les nés avant 1962 et de vingt-cinq ensuite,
  une surcote de 1,25 % par trimestre ; et des cotisations à des taux propres, 10,5 % en
  1989, 11,5 % en 1998, puis montant jusqu'aux taux nationaux en 2026 et 2030.
domaine: salaire_de_reference
regimes: [cps_saint_pierre_et_miquelon]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- les revenus professionnels soumis à cotisation, plafonnés au plafond de l'archipel puis, depuis 2016, au plafond de la sécurité sociale, et les périodes d'activité du 1er mai 1960 au 31 juillet 1987
- les périodes assimilées, les majorations pour enfants et la durée d'assurance dans les autres régimes de base
- la date de naissance et la date d'effet, l'inaptitude et le handicap
- le conjoint, ses ressources et celles du ménage, pour la réversion
ecrit:
- la pension de base de Saint-Pierre-et-Miquelon, sa surcote, sa majoration pour enfants et sa réversion
- les cotisations vieillesse du salarié, de l'employeur et du non-salarié de l'archipel
dates_qui_decident:
- liquidation.date_effet
# Depuis le 1er juillet 2016, l'âge, la durée requise et le nombre d'années du revenu
# moyen se lisent à la génération (loi n° 87-563, article 5, 1°, b et c, et 3°, d) ; la
# fiche de régime les porte par ses tables `spm_2015`, `spm_2023` et `spm_2026`, et la
# version qui les écrit est bornée à la date d'effet.
