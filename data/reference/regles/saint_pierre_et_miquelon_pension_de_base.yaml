  nee_de: LEGIARTI000006275326
  bornes:
    liquidation.date_effet: [null, 2016-07-01]
  contenu:
    creation: >-
      le régime naît le 1er août 1987 et remplace celui de l'ordonnance n° 77-1102 ; il
      affilie « les personnes exerçant une activité professionnelle salariée ou non
      salariée » dans l'archipel, et, pour leurs périodes de débarquement, les marins de
      l'ENIM (loi, article 3) ; la borne basse ouverte ne sert qu'à couvrir toutes les
      dates
    ouverture: >-
      soixante ans, taux plein à soixante-cinq, à l'inaptitude, aux anciens déportés et
      prisonniers de guerre, et à la mère de trois enfants ouvrière depuis le décret n°
      96-72 (loi, articles 6 et 11 ; décret n° 89-110, article 7, par renvoi à R. 351-1 et
      suivants)
    calcul: >-
      « le taux applicable au revenu professionnel annuel de base est déterminé selon les
      modalités définies à l'article R. 351-27 », 50 % au taux plein ; la durée limite,
      celle du 1° de R. 351-27, « est abaissée à 108 trimestres pour les pensions dont
      l'entrée en jouissance intervient entre le 1er août 1987 et le 31 décembre 1987.
      Elle est égale à 110 trimestres au 1er janvier 1988 ; elle augmente ultérieurement
      de 4 trimestres par année civile », 150 en 1998 ; « La pension est égale à autant
      de 150es » (décret n° 89-110, article 9) ; le revenu de base « est le revenu
      professionnel moyen correspondant aux cotisations versées au cours de toutes les
      années civiles d'assurance », revalorisé comme au régime général (décret, article
      8 ; loi, article 13)
    periodes_d_avant: >-
      « Pour toute période d'assurance comprise entre le 1er mai 1960 et le 31 juillet
      1987, les revenus professionnels annuels pris en compte sont fixés forfaitairement
      à 97 000 F », revalorisés par L. 351-11 (décret, article 8), et un trimestre se
      valide pour « deux mois de cotisations sur la base de 173 heures 1/3 de travail »,
      quatre par an au plus ; depuis le 1er août 1987, au salaire de R. 351-9 (décret,
      article 10)
    enfants: >-
      deux ans de durée d'assurance par enfant élevé neuf ans avant ses seize ans, à la
      mère, et 10 % de la pension à qui en a élevé trois, depuis le décret n° 96-72 du 29
      janvier 1996 (articles 1er et 3) ; avant lui, la loi renvoyait la majoration de
      durée à un décret (article 9)
    minimum: >-
      sous un minimum, un versement forfaitaire unique, le montant de 175 F de R. 351-26
      remplacé par 632 F au 1er août 1987 (loi, article 12 ; décret, article 14) ; aucun
      minimum contributif ; l'allocation minimale et l'allocation supplémentaire
      relèvent du titre II de la loi
    reversion: >-
      au conjoint survivant, sous conditions de ressources, de durée de mariage et d'âge,
      un pourcentage de la pension « fixé par décret », par renvoi à R. 353-1 et suivants
      (loi, article 16 ; décret, article 19)
    cotisations: >-
      sur les revenus plafonnés au plafond de l'archipel, « automatiquement revalorisé à
      la même date et du même taux que le plafond des cotisations du régime général »,
      à des taux fixés par arrêté (loi, article 5) : 10,5 %, « 5 % à la charge de
      l'employeur, 5,5 % à la charge du salarié », depuis le 1er septembre 1989 (arrêté
      du 11 juillet 1989) ; 5,5 % et 5,5 % pour les rémunérations versées depuis le 1er
      février 1996, la part salariale portée à 6 % au 1er janvier 1998 (arrêté du 29
      janvier 1996) ; 11,5 % pour le non-salarié (arrêté du 24 septembre 1998) ; aucun
      arrêté de l'index ne les change jusqu'en 2015, et le taux d'avant septembre 1989
      (article 6 de l'arrêté du 12 septembre 1983) n'y est pas
  exemples: aucun trouvé
