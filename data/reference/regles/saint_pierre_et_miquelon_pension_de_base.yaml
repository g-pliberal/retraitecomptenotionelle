  a_relire:
  - >-
    Lire le décret qui fixe le forfait des années 1960 à 1987 depuis 2016 (loi n°
    87-563, article 5, 3°, f), dans le décret n° 2017-1000, article 3, et dire s'il
    reprend les 97 000 F revalorisés du décret n° 89-110.
  - >-
    Relever le plafond de l'archipel de 1987 à 2015, fixé par arrêté, et le taux de
    l'article 6 de l'arrêté du 12 septembre 1983, que l'index ne donne pas.
  - >-
    Lire les articles 21 à 38 de la loi n° 87-563 et 19 à 38-2 du décret n° 89-110
    (réversion, allocations minimales), et le régime de l'ordonnance n° 77-1102
    d'avant août 1987.
