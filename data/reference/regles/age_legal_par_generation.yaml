schema_version: 1
id: age_legal_par_generation
intitule: >-
  Âge d'ouverture du droit par génération, coupures au mois (1er juillet 1951, 1er
  septembre 1961, 1er avril 1965).
regimes: [agirc, agirc_arrco, agirc_entreprises_nouvelles, arrco, arrco_cultes,
  arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles, asv_chirurgiens_dentistes,
  asv_conventionnes, asv_sages_femmes, banque_de_france, cancava, cancava_avant_1973,
  carcdsf_complementaire, carmf_complementaire, carpimko_complementaire,
  cavamac_complementaire, cavimac, cavom_complementaire, cavp_complementaire,
  cese_membres, cipav_complementaire, cnavpl, cnbf, cnbf_complementaire, cnracl,
  cprn_complementaire, crpcen, enseignants_prive_additionnel, fonction_publique_etat,
  fspoeie, ircantec, ircec_raap, ircec_raap_taux_amenage, ircec_racd, ircec_racl,
  msa_non_salaries, msa_rco, msa_salaries, nric, organic, organic_avant_1973,
  organic_conjoints_batiment, rafp, rci, rco_artisans, regime_general, rsi]
etat: conforme
etape: ouvrir_le_droit
effet: >-
  Toute liquidation. Les soixante-dix-neuf segments de la table sont certifiés :
  lus dans L. 161-17-2 et D. 161-2-1-9, chaque version à sa date d'effet (action
  27). Les deux droits contrefactuels de la page des résultats (action 138, étape
  10) posent sur elle l'âge des versions qu'ils gardent : celui du 31 août 2023,
  62 ans dès 1955 (`age_ouverture_avant_reforme_2023.csv`) ; la loi de 2023 sans
  la suspension, 63 ans pour 1964 et 64 ans dès 1968 (`age_ouverture_avant_suspension.csv`).
sources:
  lu_le: 2026-10-19
  prochaine_relecture: 2026-12-31
  lectures:
  - type: autre
    reference: >-
      Conseil constitutionnel, décision n° 2023-849 DC du 14 avril 2023 : le report de
      l'âge légal de soixante-deux à soixante-quatre ans (article 10 de la loi
      n° 2023-270) est conforme à la Constitution ; six séries de « cavaliers sociaux »
      sont censurées, dont l'index et le contrat de travail des seniors ; décision
      n° 2025-899 DC du 30 décembre 2025 : de l'article 105 de la loi de financement pour
      2026, qui suspend le relèvement, seul le VII (un rapport sur les pensions de
      Mayotte) est censuré, le reste n'ayant pas été déféré
    url: https://www.conseil-constitutionnel.fr/decision/2023/2023849DC.htm
    date: 2023-04-14
  - type: legifrance
    reference: >-
      L. 161-17-2 CSS, LEGIARTI000053280889, version du 31 décembre 2025, lue par
      le récupérateur dans l'index LEGI à jour au 16 septembre 2026
    date: 2026-09-17
  - type: legifrance
    reference: D. 161-2-1-9 CSS, LEGIARTI000047634502, version du 1er septembre
      2023
    date: 2026-09-17
  - type: legifrance
    reference: >-
      Pour les droits contrefactuels, lues dans l'index LEGI à jour au 18 octobre
      2026 : L. 161-17-2 CSS, LEGIARTI000025014605, version du 23 décembre 2011 («
      soixante-deux ans pour les assurés nés à compter du 1er janvier 1955 ») et
      LEGIARTI000051289659, version du 28 février 2025, la dernière d'avant la
      suspension (« soixante-quatre ans pour les assurés nés à compter du 1er janvier
      1968 ») ; D. 161-2-1-9 CSS, LEGIARTI000025089933, version du 31 décembre 2011
      (« 6° Soixante deux ans pour les assurés nés à compter du 1er janvier 1955 »),
      et LEGIARTI000047634502, version du 1er septembre 2023, 10° à 14°
    date: 2026-10-19
  - type: circulaire_cnav
    reference: 2026-07 du 5 mars 2026, point 1.1 et annexe 1
    date: 2026-03-05
  - type: service_public
    reference: fiches F14043 et F14044
    date: 2026-08-14
  - type: service_public
    reference: actualité A18825, suspension de la réforme
    date: 2026-02-27
textes_a_rattacher:
- reference: L. 161-17-2 CSS (réécrit par la loi n° 2025-1403, article 105)
- reference: >-
    D. 161-2-1-9 CSS (version 2023, que la loi laisse valoir pour les nés avant
    le 1er septembre 1961)
exemples:
- cnav_2026_07_age_legal_1964
- cnav_2026_07_age_legal_1965_premier_trimestre
- cnav_2026_07_age_legal_1965_apres_avril
- sp_f19643_surcote
- sp_f16494_surcote_fonction_publique
reformes:
- reforme_2023
- lfss_2026_suspension
code:
  interrupteurs:
    age_ouverture_par_generation: true
  moteur: >-
    `age_ouverture_par_generation` : l'âge d'ouverture est lu dans `legislation/age_ouverture_requis.csv`
    à l'ANNÉE DE NAISSANCE, et la valeur de la période (`age_ouverture`) ne sert que de
    repli. Réservé aux régimes alignés sur l'âge légal général : les régimes spéciaux
    gardent le leur. Sous un droit contrefactuel (`Parametres.droit_contrefactuel`),
    `TableRecouverte` pose sur cette table celle du droit qu'il garde, de sa première
    génération à toutes les suivantes (`ScenarioActuel._sous_le_droit`).
  python: >-
    droit/ouvrir.py : age_ouverture, age_ouverture_commun ; scenarios/actuel.py :
    AgesOuverture, AgesOuvertureAvantReforme2023, AgesOuvertureAvantSuspension,
    TableRecouverte, ScenarioActuel._sous_le_droit
  javascript: >-
    moteur/js/droit/ouvrir.js : ageOuverture, ageOuvertureCommun ;
    moteur/js/regimes.js : AgesOuverture, AgesOuvertureAvantReforme2023,
    AgesOuvertureAvantSuspension, TableRecouverte ; moteur/js/scenario-actuel.js :
    ScenarioActuel._sousLeDroit
  parametres: >-
    legislation/age_ouverture_requis.csv,
    legislation/age_ouverture_avant_reforme_2023.csv,
    legislation/age_ouverture_avant_suspension.csv : generation, age
  tests: [tests/test_simulateur.py, tests/test_donnees.py,
    tests/test_droits_contrefactuels.py, tests/test_oracle.py, tests/js/moteur.test.js,
    tests/temoins/simulations.json]
