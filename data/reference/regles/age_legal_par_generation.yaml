  - id: LEGIARTI000025089933
    article: D. 161-2-1-9, rédaction en vigueur le 31 décembre 2011
    en_vigueur: 2011-12-31
    citation: >-
      « 1° Soixante ans pour les assurés nés avant le 1er juillet 1951 ; 2° Soixante
      ans et quatre mois pour les assurés nés entre le 1er juillet 1951 et le 31
