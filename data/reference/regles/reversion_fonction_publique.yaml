approximations:
- version: [avant_1980, veuves_1980]
  ecart: >-
    le veuf d'une fonctionnaire reçoit la moitié de sa pension comme la veuve : ni
    le report à l'âge minimal de jouissance ni le plafond de L. 50 ne sont appliqués
  effet: non mesuré
- ecart: >-
    le complément qui porte la réversion à l'allocation aux vieux travailleurs
    salariés, puis à l'ASPA pour les réversions liquidées depuis 2025, n'est pas
    appliqué, ni la moitié de la rente d'invalidité et de la majoration de L. 18
  effet: >-
    la réversion des petites pensions, et de qui a élevé trois enfants, est
    sous-estimée ; non mesuré
- ecart: >-
    la condition de L. 39 tient le départ, ou le décès qui le précède, pour la
    cessation d'activité, et tout enfant déclaré pour un enfant issu du mariage ; la
    pension d'orphelin (L. 40) et la pension pour décès en service (L. 50) ne sont
    pas portées ; les montants sont ceux de l'année du décès
  effet: non mesuré
- ecart: >-
    le partage au prorata des mariages (L. 45, puis L. 43 depuis 2012) lit les
    précédents conjoints que la saisie déclare, deux au plus, non remariés au décès,
    sans leur opposer la condition d'antériorité de L. 39 ; il ignore les lits que
    représentent des orphelins seuls (L. 43), le droit que retrouve l'ex-conjoint
    dont la nouvelle union a cessé (L. 44, L. 46) et le concubinage d'un précédent
    conjoint, que la saisie ne dit pas ; avant 1980, aucun précédent conjoint ne
    partage, quand L. 45 les compte depuis le 18 juillet 1978 ; le remariage ou le
    concubinage notoire du survivant éteint la réversion au mois qui le suit, et ce
    qu'il recouvre quand cette union cesse n'est pas porté
  effet: non mesuré
- ecart: >-
    la pension que le fonctionnaire mort en activité « aurait pu obtenir au jour de
    son décès », sans coefficient de minoration (L. 14, I), se liquide sur ses
    services au premier jour du trimestre civil du décès, quand le texte les compte
    jusqu'au décès, et avant 2004 sur la règle de la décote de sa date, nulle
  effet: >-
    jusqu'à deux mois de services de moins, soit, sur une carrière de quarante ans,
    0,4 % de la pension
presomptions:
  mariage_des_conjoints: >-
    la condition d'antériorité du mariage de L. 39, quand sa date n'est pas déclarée
  conjoint_de_l_autre_sexe: >-
    la veuve, seule bénéficiaire avant 2004, quand le sexe du conjoint n'est pas dit
  deces_apres_le_depart: >-
    la réversion que la page montre sans décès déclaré, pour un décès supposé juste
    après le départ, ou cette année pour qui est déjà parti
sources:
  lu_le: 2026-10-09
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 28 septembre 2026 avec le domaine de la réversion (docs/architecture.md,
    § 11), lue dans l'index LEGI. Le moteur la lit depuis la deuxième étape du
    domaine, le même jour.
  - >-
    La pension qu'il « aurait pu obtenir au jour de son décès » : services acquis
    jusqu'au décès, sans décote (L. 14, I, lu le 9 octobre 2026), que le moteur sert
    depuis ce jour au survivant du fonctionnaire mort avant son départ. La circulaire
    du service des retraites de l'État, et l'exemple chiffré qu'elle donnerait,
    restent à lire.
  - >-
    Les régimes spéciaux qui reprennent la règle — FSPOEIE, ouvriers de l'État, IEG,
    SNCF, RATP, mines, marins — ont chacun leurs textes, à lire avant d'être ajoutés.
    Les orphelins (L. 40, 10 %) et les pensions pour décès en service (L. 50) ne sont
    pas portés, ni les orphelins qui recueillent la part du conjoint qui la perd
    (L. 46, jusqu'en 2012).
  lectures:
  - type: legifrance
    reference: >-
      L. 38 CPCMR, ses six rédactions dans l'index LEGI, de LEGIARTI000006362764 (1980)
      à LEGIARTI000053549564 (2026) ; L. 39 (1964, 2004), L. 43, L. 45, L. 46, L. 50
    date: 2026-09-28
  - type: legifrance
    reference: >-
      décret n° 2003-1306, articles 40, 41 et 45 (CNRACL), dans l'index LEGI : la règle
      de L. 38 et L. 39, mot pour mot
    date: 2026-09-28
  - type: legifrance
    reference: >-
      relus le 9 octobre 2026 dans l'index LEGI : L. 14, I, ses rédactions depuis le 1er
      janvier 2004 (LEGIARTI000006362704 à 048844775) — « Le coefficient de minoration
      n'est pas applicable aux pensions de réversion lorsque la liquidation de la
      pension dont le fonctionnaire aurait pu bénéficier intervient après son décès » ;
      le décret n° 2003-1306, article 20 (LEGIARTI000006400883), le dit de la CNRACL,
      mot pour mot
    date: 2026-10-09
  - type: legifrance
    reference: >-
      relus le 9 octobre 2026 dans l'index LEGI, pour le partage et le remariage :
      L. 45 (LEGIARTI000006362776, 1978, puis 006362777, 2004) — « la pension est
      répartie entre ces conjoints au prorata de la durée respective de chaque
      mariage » ; L. 43 (LEGIARTI000006362773, 1982, abrogé au 1er janvier 2012 par la
      décision n° 2010-108 QPC, puis 025076834) — depuis 2012, les conjoints se
      partagent la part des lits qu'ils représentent, « au prorata de la durée
      respective de chaque mariage » ; L. 44 (LEGIARTI000006362774) — le conjoint
      divorcé a droit à la pension ; L. 46 (LEGIARTI000006362778, puis 025076807) —
      « Le conjoint survivant ou le conjoint divorcé, qui contracte un nouveau mariage
      ou vit en état de concubinage notoire, perd son droit à pension »
    date: 2026-10-09
textes_a_rattacher:
- {id: LEGIARTI000025076827, article: L. 40, en_vigueur: 2012-01-01, change: "la pension d'orphelin"}
code:
  python: >-
    droit/reversion.py : reversion, _mariage_suffit, _part_du_survivant,
    _admis_ailleurs, _fin_au_remariage, _jusqu_au_remariage ; scenarios/actuel.py :
    Reversions
  javascript: >-
    moteur/js/droit/reversion.js : reversion, mariageSuffit, partDuSurvivant,
    admisAilleurs, finAuRemariage, jusquAuRemariage ; moteur/js/regimes.js : Reversions
  parametres: >-
    contenu.parametres de chaque version : taux, mariage_minimum_annees,
    mariage_services_minimum_annees, ex_conjoints, perte_au_remariage
  tests: >-
    tests/test_reversion.py ; les témoins reversion_fonctionnaire,
    reversion_fonctionnaire_mort_en_activite et
    reversion_fonctionnaire_partage_concubinage des simulations
historique:
- >-
  2026-09-28 — née avec le domaine de la réversion, de la fiche reversion qui ne portait
  que le régime général.
- >-
  2026-09-28 — lue par le moteur, à la deuxième étape du domaine.
- >-
  2026-10-09 — action 138, étape 4 : la réversion du fonctionnaire mort avant son
  départ, sur la pension qu'il « aurait pu obtenir au jour de son décès », sans
  coefficient de minoration (L. 14, I) ; sa cessation d'activité, que lit la
  condition de L. 39, est son décès.
- >-
  2026-10-09 — action 138, étape 4 : le partage entre conjoints au prorata des
  mariages (L. 45, L. 43), avec les précédents conjoints non remariés
  (ex_conjoints), et la perte de la réversion au remariage ou au concubinage notoire
  du survivant (L. 46, perte_au_remariage).
effet: >-
  Tout conjoint, ou ex-conjoint, d'un fonctionnaire de l'État ou d'un agent des
  collectivités qui décède. Le modèle la calcule pour le conjoint que la saisie
  déclare, partagée avec les précédents conjoints qu'elle déclare, sans le complément
  ni la part de la rente d'invalidité.
