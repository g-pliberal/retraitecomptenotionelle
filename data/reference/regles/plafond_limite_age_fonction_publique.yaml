  - {id: LEGIARTI000006450727, article: "loi n° 84-834, article 1-1", en_vigueur: 2004-01-01}
  - {id: LEGIARTI000044425138, article: "L. 556-5 CGFP", en_vigueur: 2022-03-01}
  - {id: LEGIARTI000044425134, article: "L. 556-7 CGFP", en_vigueur: 2022-03-01}
  nee_de: LEGIARTI000006451372
  bornes:
    age_atteint: [null, 2023-06-14]
  contenu:
    droit: >-
      aucun plafond commun : de 1986 à 2022, le recul par enfant ne passe pas soixante-
      treize ans pour la catégorie A et soixante-huit pour la B, celui du parent de trois
      enfants soixante et onze et soixante-six ans (loi de 1936, article 4) ; la
      prolongation pour carrière incomplète vient « Sous réserve des droits au recul »,
      dix trimestres au plus (loi n° 84-834, article 1-1, puis L. 556-5) ; le maintien de
      l'actif, sous réserve des reculs et de cette prolongation (article 1-3, puis L.
      556-7) ; le code de 2022 ne reprend aucun des plafonds de la loi de 1936
  exemples: aucun trouvé
- id: soixante_dix_ans
  statut: lue
  textes:
  - {id: LEGIARTI000047452904, article: "L. 556-1 CGFP", en_vigueur: 2023-06-14}
  - {id: LEGIARTI000044425138, article: "L. 556-5 CGFP", en_vigueur: 2022-03-01}
  - {id: LEGIARTI000047452899, article: "L. 556-7 CGFP", en_vigueur: 2023-06-14}
  nee_de: LEGIARTI000047452904
  bornes:
    age_atteint: [2023-06-14, null]
  contenu:
    droit: >-
      « Le bénéfice cumulé de ce maintien en fonctions, des prolongations d'activité et des
      reculs de limite d'âge prévus aux articles L. 556-2 à L. 556-5 ne peut conduire le
      fonctionnaire à être maintenu en fonctions au delà de soixante-dix ans » (L. 556-1)
    ordre: >-
      les reculs de L. 556-2 à L. 556-4 ; la prolongation de L. 556-5, « après application »
      des reculs ; pour l'actif, la prolongation jusqu'à soixante-sept ans de L. 556-7 ;
