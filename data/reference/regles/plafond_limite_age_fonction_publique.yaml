schema_version: 1
id: plafond_limite_age_fonction_publique
intitule: >-
  Les reculs et les prolongations de la limite d'âge du fonctionnaire civil
  s'appliquent dans un ordre que la loi fixe — les reculs pour enfants d'abord, puis la
  prolongation pour carrière incomplète, puis celle de l'actif jusqu'à la limite des
  sédentaires ou le maintien du sédentaire jusqu'à soixante-dix ans —, et depuis le 14
  juin 2023 leur bénéfice cumulé ne mène pas au-delà de soixante-dix ans. Avant, chaque
  recul avait son plafond, jusqu'en 2022, et la prolongation ses dix trimestres.
sorte: plafond
fiches:
- fiche: limite_age_fonction_publique
  role: la limite d'âge de l'emploi, d'où partent les reculs et les prolongations
- fiche: recul_limite_age_enfants
  role: >-
    les reculs pour enfants, appliqués les premiers ; plafonnés chacun, de 1986 à 2022,
    à soixante-treize ou soixante-huit ans et à soixante et onze ou soixante-six ans
- fiche: prolongation_activite_carriere_incomplete
  role: >-
    la prolongation de dix trimestres au plus, « après application des possibilités de
    recul de la limite d'âge » (L. 556-5)
- fiche: prolongation_activite_categorie_active
  role: >-
    le maintien de l'actif jusqu'à la limite des sédentaires, « sous réserve des
    possibilités de recul » de L. 556-2, L. 556-3 et L. 556-5 (L. 556-7)
- fiche: maintien_en_fonctions_jusqu_a_70_ans
  role: >-
    le maintien du sédentaire jusqu'à soixante-dix ans, dont L. 556-1 fait la borne de
    tout le reste depuis le 14 juin 2023
rang: 1
domaine: age
regimes: [fonction_publique_etat, cnracl]
etape: preparer_la_chronologie
face: droit
etat: manquante
lit:
- la limite d'âge de l'emploi, et chaque recul et chaque prolongation que les fiches
  reliées accordent
ecrit:
- l'âge où le fonctionnaire est radié des cadres, au plus tard
dates_qui_decident:
- age_atteint
