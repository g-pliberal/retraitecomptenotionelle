sources:
  lu_le: 2026-10-10
  prochaine_relecture: 2027-10-10
  a_relire:
  - >-
    Le plafond de soixante-dix ans vaut-il sans le maintien ? L. 556-1 parle du « bénéfice
    cumulé de ce maintien en fonctions, des prolongations d'activité et des reculs » ;
    service-public l'écrit de tout cumul — « Le bénéfice cumulé des prolongations
    d'activité ne peut pas conduire à vous maintenir en activité au-delà de 70 ans » —,
    pour le sédentaire comme pour le contractuel, et ne le nomme pas pour l'actif.
  lectures:
  - type: legifrance
    reference: >-
      L. 556-1, L. 556-5 et L. 556-7 CGFP ; loi du 18 août 1936, article 4 ; loi n° 84-834,
      articles 1-1 et 1-3. Lus dans l'index LEGI du dépôt
    date: 2026-10-10
  - type: service_public
    reference: >-
      fiche F12395 : les reculs pour enfants d'abord, la prolongation pour carrière
      incomplète « après application » de ceux-ci, et le plafond de soixante-dix ans de
      leur cumul
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F12395
    date: 2026-01-01
historique:
- >-
  2026-10-10 — née avec l'action 151, étape 2 : la relation qui ordonne les exceptions à
  la limite d'âge, et le plafond qui les borne depuis 2023.
effet: >-
  Aucun aujourd'hui, le modèle n'appliquant aucune limite d'âge. La limite appliquée, cette
  relation fixe l'âge le plus tardif où un fonctionnaire civil peut servir : soixante-dix
  ans depuis le 14 juin 2023, hors les corps de la fiche
  `maintiens_en_fonctions_de_certains_corps`.
