effet: >-
  La fiche servait 36 points à tout médecin, soit jusqu'à 7,75 points de trop sous
  70 000 €. Le forfait, revalorisé sur le revenu moyen des médecins que le dépôt
  n'a pas, suit les prix : le modèle rend 28,21, 30,63, 32,81 et 35,46 points, à
  moins de 1 % de la caisse. Lue au droit le 6 novembre 2026 (action 130) : une
  version, le décret n° 2011-1644, dont l'article 3 n'a qu'une rédaction ; 27 points,
  18 fois l'ajustement sur le forfait et neuf points au plus rendus par le modèle ;
  trois écarts chiffrés ou nommés, le revenu de l'avant-dernière année, l'arrondi au
  centième, la base forfaitaire des deux premières années.
sources:
  lu_le: 2026-11-06
  prochaine_relecture: 2027-03-31
  a_relire:
