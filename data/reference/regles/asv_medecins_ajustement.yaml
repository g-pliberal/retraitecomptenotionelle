schema_version: 1
id: asv_medecins_ajustement
intitule: >-
  ASV des médecins depuis 2012 : 27 points pour la cotisation forfaitaire, plus
  18 fois la cotisation d'ajustement divisée par le forfait — les deux tiers des 27
  points —, arrondis au centième, neuf points au plus par an ; la cotisation
  d'ajustement assise sur le revenu de l'avant-dernière année, dans la limite de cinq
  plafonds.
domaine: points
regimes: [asv_conventionnes]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- >-
  les trimestres d'exercice conventionné de l'année, qui donnent les 27 points du
  forfait au prorata
- >-
  le revenu d'activité non salarié, que le décret prend à « la deuxième année
  précédant celle au titre de laquelle la cotisation est appelée », dans la limite de
  cinq fois le plafond de l'année, et le taux d'ajustement de l'année (de 0,25 % en
  2012 à 4 % depuis 2026)
- la cotisation forfaitaire de l'année (article 1er)
ecrit:
- >-
  les points de l'année, forfaitaires et d'ajustement, que `acquerir` crédite à l'ASV
  et que `asv_medecins_points` multiplie par la valeur de service
dates_qui_decident:
- revenu.annee
# `revenu.annee` est l'exercice au titre duquel la cotisation est appelée, qui
# décide des points ; le revenu qui l'asseoit est celui de l'avant-dernière année.
versions:
- id: avant_l_ajustement
  statut: supposee
  hypothese: >-
    avant l'exercice 2012, l'ASV ne sert que les points de la cotisation forfaitaire
    (`asv_medecins_points`) : le décret n° 2011-1644 « est applicable, à l'exception du
    dernier alinéa de l'article 2, à compter du 1er janvier 2012 » (article 9), et les
    décrets annuels n° 2007-1901, 2008-1439, 2009-1741 et 2010-1675, lus, ne nomment
    aucune cotisation d'ajustement ; des décrets n° 2004-1452 et 2005-1775, l'index n'a
    que le titre
  fiabilite: >-
    moyenne : nul texte lu ne fonde de points d'ajustement avant 2012, mais deux décrets
    annuels ne se lisent qu'en titre
  bornes:
    revenu.annee: [null, 2012-01-01]
  contenu:
    droit: aucun point d'ajustement ; les points du forfait seuls
  exemples: aucun trouvé
