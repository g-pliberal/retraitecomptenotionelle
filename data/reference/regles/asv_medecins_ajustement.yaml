      (LEGIARTI000024871109, LEGIARTI000054168410) ; code de la sécurité sociale, L.
      131-6-2 du 23 décembre 2011 (LEGIARTI000025013725) ; décrets n° 2016-1198,
      2021-645, 2022-1633, 2023-1351, 2024-1214, 2025-1076 et 2026-418 (articles 3, 16
      et 30), qui ne récrivent pas l'article 3 ; lus dans les index LEGI et JORF du
      dépôt, à jour des 5 et 6 novembre 2026.
    date: 2026-11-06
  - type: autre
