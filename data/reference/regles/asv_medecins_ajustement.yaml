  nee_de: LEGIARTI000024853554
  bornes:
    revenu.annee: [2012-01-01, null]
  contenu:
    parametres:
      points_par_trimestre_valide: 6.75
      points_ajustement_par_forfait: 18
      points_ajustement_maximum: 9
    droit: >-
      27 points pour la cotisation forfaitaire de l'année, au prorata des trimestres
      cotisés ; et, pour la cotisation d'ajustement, le rapport, arrondi au centième, de
      son montant multiplié par 18 au montant du forfait, neuf points au plus ; la
      cotisation d'ajustement au taux de l'exercice, sur le revenu de l'avant-dernière
      année, dans la limite de cinq plafonds de l'exercice
  exemples: aucun trouvé
approximations:
- version: [decret_de_2011]
  textes: >-
    décret n° 2011-1644, article 2, dans chacune de ses rédactions : « perçus la
    deuxième année précédant celle au titre de laquelle la cotisation est appelée »
  ecart: >-
    Le modèle assied la cotisation d'ajustement sur le revenu de l'exercice même, le
    décret sur celui de l'avant-dernière année ; le plafond et le forfait sont ceux de
    l'exercice dans les deux cas. Un revenu qui croît donne au modèle des points de
    trop, un revenu qui baisse des points de moins, sous le plafond de neuf points.
    Cas posé à la main, exercice 2026, taux de 4 %, forfait total de 5 751 € (les 1 917
    € du médecin, un tiers) : revenu de 40 000 € en 2024 et de 42 000 € en 2026. Le
    décret : 18 × (4 % × 40 000) / 5 751 = 18 × 1 600 / 5 751 = 5,0078, 5,01 points.
    Le modèle : 18 × 1 680 / 5 751 = 5,2582 points, 0,2482 de plus.
  effet: >-
    0,2482 point de trop pour l'exercice, soit 0,2482 × 11,82 = 2,93 € de pension
    annuelle par exercice ainsi cotisé, à la valeur de service de 2025 des points
    liquidés depuis 2017.
- version: [decret_de_2011]
  textes: >-
    décret n° 2011-1644, article 3 : « arrondi au centième le plus proche »
  ecart: >-
    Le modèle n'arrondit pas les points d'ajustement : 5,2582 au lieu de 5,26 dans le
    cas posé, au plus un demi-centième de point par exercice.
  effet: >-
    au plus 0,005 × 11,82 = 0,06 € de pension annuelle par exercice.
- version: [decret_de_2011]
  textes: >-
    décret n° 2011-1644, article 2, rédaction du 30 décembre 2012 : les deux premières
    années, « les mêmes bases forfaitaires que celle due au titre du deuxième alinéa de
    l'article L. 131-6-2 » ; le décret qui fixe ce revenu forfaitaire n'est pas lu
  ecart: >-
    Le modèle assied l'ajustement des deux premières années sur le revenu de l'année ;
    le décret, sur le revenu forfaitaire des cotisations provisionnelles de L. 131-6-2
    (« Pour les deux premières années d'activité, les cotisations provisionnelles sont
    calculées sur un revenu forfaitaire fixé par décret », rédaction du 23 décembre
    2011, LEGIARTI000025013725). Non chiffré : le décret qui fixe ce revenu n'est pas lu
    pendant la session (question au propriétaire).
  effet: >-
    inconnu tant que le revenu forfaitaire n'est pas lu ; deux exercices au plus par
    carrière.
- version: [decret_de_2011]
  textes: >-
    décret n° 2011-1644, article 1er : le forfait « revalorisé chaque année en fonction
    de l'évolution constatée du revenu moyen » depuis 2017
  ecart: >-
    Le revenu moyen des affiliés de la section, que le dépôt n'a pas, fait le forfait de
    2017 à 2024 ; le modèle y porte celui de 2016 par les prix, puis les forfaits que la
    caisse publie.
  effet: >-
    le modèle rend 28,21, 30,63, 32,81 et 35,46 points à 10 000, 30 000, 48 060 et 70
    000 € de revenu, la calculette de la caisse 28,25, 30,76, 33,02 et 35,76 : moins
    de 1 % d'écart (22 septembre 2026).
