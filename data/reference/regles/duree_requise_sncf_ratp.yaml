  effet: au plus 0,7 % de pension
- version: [tables_de_2023]
  regime: sncf
  ecart: >-
    le modèle lit la table de l'agent de conduite, qui donne un trimestre de moins que la
    durée par année de l'article 12-1 à l'agent de conduite né d'avril à décembre 1975 ou
    d'octobre à décembre 1977
  effet: non mesuré
- version: [calendrier_de_2008, table_de_2014, tables_de_2023]
  ecart: >-
    l'agent est présumé agent de conduite de la SNCF ou roulant de la RATP : la table des
    autres agents de la SNCF de 2023 et ce que le II de l'article 35 leur retranche ne sont
    pas transcrits, et la durée que doivent les agents qui partent après cinquante-cinq ans
    (SNCF) ou soixante ans (RATP), lue quand ils atteignent cet âge, n'est pas servie ; la
    table qui porte, à la RATP depuis 2025, la durée par année de qui part avant soixante
    ans (`ratp_avant_60`), lue à sa propre génération par qui ouvrirait son droit à cet âge
    ou après, lui demanderait un trimestre de moins que l'article 51 s'il est né de 1966 à
    1970 : le roulant, que le modèle sert, ouvre le sien avant cinquante-cinq ans
  effet: non mesuré
effet: >-
  Les deux fiches lisaient la table commune, suspension de 2026 comprise. Elles
  lisent désormais la leur (`duree_requise_table`, dans `legislation/duree_requise_regimes_speciaux.csv`),
  sur les périodes de 2025 et après ; en deçà de la première génération de la table,
  la table commune reste le repli. L'agent de conduite né en 1975 doit 170 trimestres
  et non 172 ; celui né en 1980 compte sa décote par la durée sur 162. La table
  des agents SÉDENTAIRES de la SNCF (1° du I de l'article 35) n'est pas transcrite
  : aucune fiche ne les modélise. Depuis le 2 novembre 2026, l'agent qui réunit les
  conditions avant cinquante-cinq ans (SNCF) ou soixante ans (RATP) de juillet 2019 à 2024
  lit la table de 2014 à la génération qui atteint cet âge ce mois-là (`age_de_lecture`),
  et le roulant de la RATP qui les réunit depuis 2025 doit la durée par année de l'article
  23-1 (`ratp_avant_60`) : le modèle lui opposait la table de sa génération. L'agent de
  conduite doit un trimestre de moins — 167 au lieu de 168 pour le né en novembre ou
  décembre 1968, 168 au lieu de 169 pour 1970 et 1971, 169 au lieu de 170 pour 1972 —, et
  deux pour 1969, 167 au lieu de 169. Le roulant de la RATP en doit trois de moins s'il
  est né de novembre 1968 à 1971 (167 au lieu de 170 pour 1969, 168 au lieu de 171 pour
  1970 et 1971), deux pour 1972 (169 au lieu de 171), deux s'il ouvre son droit de 2025 à
  2027, nés de 1973 à mars 1975 (170 au lieu de 172), un de 2028 à 2030, nés d'avril 1975
  à septembre 1977 (171 au lieu de 172). Un trimestre de moins à exiger ajoute un
  cent-soixante-huitième de pension à qui n'a pas la durée, et retire 1,25 % de décote à
  qui la lui doit. Les témoins le mesurent : le roulant né en 1970, parti à cinquante-six
  ans avec 140 trimestres, gagne 1,79 % (140/168 au lieu de 140/171) ; le roulant né en
  1975, parent de trois enfants, 1,18 % (140/170 au lieu de 140/172) ; l'agent de
  conduite né en 1970, au même départ, 0,6 % (140/168 au lieu de 140/169).
sources:
  lu_le: 2026-11-02
  prochaine_relecture: 2027-11-02
  a_relire:
  - >-
    La durée par année de l'article 12-1 de la SNCF, depuis 2025 : les tableaux de la
    CPRPSNCF donnent 170 trimestres à l'agent de conduite né d'avril à décembre 1975, dont
    le droit s'ouvre en 2028, quand l'article lui en demande 171, et 171 au lieu de 172 au
    né d'octobre à décembre 1977. Demander à la caisse laquelle elle applique, avant de
    porter à la SNCF la durée par année, comme à la RATP (`ratp_avant_60`).
  - >-
    La CRP RATP ne publie pas ses tableaux par génération hors de l'espace de ses affiliés :
    la lecture de l'article 23-1, la table de 2014 à la génération qui a soixante ans et la
    durée par année depuis 2025, n'y est pas confrontée à la caisse.
