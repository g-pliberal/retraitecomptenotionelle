      l'article 35, la durée des services et des bonifications requise pour les agents qui
      remplissent les conditions de liquidation d'une pension avant l'âge de cinquante-cinq
      ans est fixée à cent soixante-dix trimestres. Cette durée augmente d'un trimestre tous
      les trois ans pour atteindre cent soixante-douze trimestres en 2031 » (article 12-1) ;
      à la RATP, 167 trimestres pour les nés du 1er juillet 1959 à 1960, jusqu'à 172 à
      compter de 1968 (article 51, I), et la même durée par année avant soixante ans
      (article 23-1)
