schema_version: 1
id: duree_requise_sncf_ratp
intitule: >-
  La durée des services et bonifications qui donne à l'agent de la SNCF et de la RATP le
  pourcentage maximum de 75 % : cent cinquante trimestres à qui réunit les conditions avant
  le 1er juillet 2008 ; puis le calendrier de la réforme, de 151 à 166 trimestres en
  juillet 2018 ; à compter du 1er juillet 2019, la table par génération de 2014 de chaque
  régime, lue depuis 2017, pour l'agent qui peut partir avant cinquante-cinq ans (SNCF) ou
  soixante ans (RATP), à la génération qui atteint cet âge l'année où son droit s'ouvre ; à
  compter du 1er janvier 2025, les tables de 2023, que la suspension de 2026 ne touche pas,
  et, pour qui part avant ces âges, cent soixante-dix trimestres, un de plus tous les trois
  ans ; la SNCF compte en outre la décote par la durée sur une cible abaissée de deux à dix
  trimestres.
domaine: duree
regimes: [ratp, sncf]
etape: ouvrir_le_droit
face: droit
etat: approchee
lit:
- >-
  le mois où l'agent réunit les conditions d'ouverture du droit
  (`mois_ouverture_des_droits`)
- sa génération
ecrit:
- >-
  la durée des services et bonifications qui donne le pourcentage maximum, d'où se
  comptent la proratisation, la décote par la durée et la surcote
- >-
  à la SNCF, depuis 2025, les trimestres que le II de l'article 35 retranche à cette durée
  pour compter la décote par la durée
dates_qui_decident:
- ouverture_du_droit
versions:
- id: trente_sept_annuites_et_demie
  statut: supposee
  hypothese: >-
    les règlements des deux entreprises d'avant le 1er juillet 2008, que les index du dépôt
    ne portent pas, ne sont pas lus : la fiche leur prête cent cinquante trimestres, que les
    décrets du 30 juin 2008 portent à cent cinquante et un pour qui réunit les conditions au
    second semestre de 2008, et que la CPRPSNCF écrit pour l'agent de conduite né au premier
    semestre de 1958, dont le droit s'ouvre au premier semestre de 2008
  fiabilite: haute à la SNCF, dont la caisse l'écrit ; moyenne à la RATP
  textes:
  - {id: LEGIARTI000019108289, article: "décret n° 2008-639 (SNCF), article 35, I", en_vigueur: 2008-07-01, publie_le: 2008-07-01}
  - {id: LEGIARTI000019104897, article: "décret n° 2008-637 (RATP), article 51, I", en_vigueur: 2008-07-01, publie_le: 2008-07-01}
  bornes:
    ouverture_du_droit: [null, 2008-07-01]
  contenu:
    parametres:
      trimestres: 150
      pourcentage_maximum: 0.75
    droit: trente-sept annuités et demie, à 2 % du traitement par annuité
    conditions: >-
      les décrets de 2008 ne fixent la durée qu'à qui réunit les conditions à compter du
      1er juillet 2008
  exemples: aucun trouvé
