      en 2028, et de celui né d'octobre à décembre 1977, en 2031 : un de plus par l'article
      12-1, qui y déroge. La CPRPSNCF écrit 170 trimestres pour l'agent de conduite né de
      1973 à 1975, 171 pour 1976 et 1977, 172 ensuite ; 172 pour l'agent du cas général né à
      compter de 1973
