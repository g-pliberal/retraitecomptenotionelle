historique:
- >-
  2026-11-02 — lue au droit (action 130) : quatre versions sur le mois où le droit
  s'ouvre — cent cinquante trimestres avant juillet 2008 ; le calendrier de 2008, de 151 à
  166 trimestres ; les tables de 2014 depuis juillet 2019, lues depuis 2017 à la génération
  qui a cinquante-cinq ans (SNCF) ou soixante ans (RATP) l'année où le droit de l'agent qui
  part plus tôt s'ouvre ; les tables de 2023, et la durée par année de qui part avant ces
  âges. Approchée : le modèle lit les tables à la génération de l'agent.
- >-
  2026-11-02 — l'écart levé (action 130) : les tables de 2014 se lisent, avant
  cinquante-cinq ans (SNCF) ou soixante ans (RATP), à la génération qui atteint cet âge le
  mois où le droit s'ouvre (`age_de_lecture` à 55 et à 60), et la RATP a, depuis 2025, sa
  durée par année avant soixante ans (`ratp_avant_60`). Reste approchée : les pensions du
  second semestre de 2008, la durée par année de l'article 12-1 de la SNCF, et l'agent
  présumé agent de conduite ou roulant.
reformes:
- regimes_speciaux_2008
- touraine_2014
- reforme_2023
- lfss_2026_suspension
code:
  moteur: >-
    La période de 2025 et après nomme ses tables (`duree_requise_table`), essayées dans
    l'ordre avant la table commune : `sncf_conduite` puis `sncf_2014` à la SNCF,
    `ratp_avant_60`, `ratp` puis `ratp_2014` à la RATP, dans
    `legislation/duree_requise_regimes_speciaux.csv`. Chacune se lit à la génération, pour
    qui réunit les conditions à compter de sa date (`depuis`), au mois que
    `mois_ouverture_des_droits` dit (`duree_propre`) ; les tables de 2014 et
    `ratp_avant_60`, à qui les réunit avant cinquante-cinq ans (SNCF) ou soixante ans
    (RATP), à la génération qui atteint cet âge ce mois-là (`age_de_lecture`,
    `DureesRequisesRegimes.ligne`) ; la suspension, qui n'abaisse que la table commune, n'y
    entre pas. La table de la SNCF
    porte aussi les trimestres que le II de l'article 35 retranche à la durée pour
    compter la décote par la durée (`retranche_decote`). Avant juillet 2019, le calendrier
    de 2008 (`duree_requise_calendrier`), lu au même mois.
  python: >-
    droit/ouvrir.py : duree_requise, duree_propre, mois_ouverture_des_droits ;
    droit/liquider.py : retranche_decote ; scenarios/actuel.py : DureesRequisesRegimes,
    DureesRequisesRegimes.ligne, CalendriersDureeRequise
  javascript: >-
    moteur/js/droit/ouvrir.js : dureeRequise, dureePropre, moisOuvertureDesDroits ;
    moteur/js/droit/liquider.js : retrancheDecote ; moteur/js/regimes.js :
    DureesRequisesRegimes, DureesRequisesRegimes.ligne
  parametres: >-
    contenu.parametres de chaque version : trimestres, pourcentage_maximum, calendrier,
    tables_par_generation, ages_de_lecture, retranche_decote, duree_avant_l_age_de_lecture ;
    regimes/ratp.yaml, regimes/sncf.yaml : duree_requise_table, duree_requise_calendrier,
    duree_requise_trimestres, taux_plein ; legislation/duree_requise_regimes_speciaux.csv :
    ratp, ratp_2014, ratp_avant_60, sncf_conduite, sncf_2014, depuis, generation,
    trimestres, retranche_decote, age_de_lecture ;
    legislation/duree_requise_calendriers.csv : regimes_speciaux_2008
  tests:
  - tests/test_sncf_ratp.py
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    statut_agent_sncf, enfants_sncf_trois_enfants et
    sncf_surcote_apres_soixante_quatre_ans changent sans la table de l'agent de
    conduite ; sncf_generation_1970 et ratp_generation_1970 sans l'âge de lecture des
    tables de 2014 (140 trimestres sur 168, et non sur 169 ou 171) ;
    enfants_ratp_trois_enfants et statut_agent_ratp sans la durée par année de la RATP
    (170 trimestres, et non 172)
