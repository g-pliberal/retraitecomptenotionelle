schema_version: 1
id: reversion_sncf
intitule: >-
  Pension de réversion du régime spécial de la SNCF (décret n° 2008-639, articles 18 à
  23 et 31) : la moitié de la pension obtenue par l'agent ou qu'il aurait obtenue au
  jour de son décès, sans condition d'âge ni de ressources, majorée pour enfants
  comme la pension, et, quand la pension de l'agent atteint le minimum de pension de
  l'article 15, 54 % de ce minimum au moins ; au conjoint marié deux ans le jour de la
  cessation des
  fonctions, ou quatre ans au décès, deux s'il existe un enfant issu du mariage, sans
  durée quand un enfant est né avant la cessation ; partagée avec les conjoints
  divorcés non remariés au prorata des mariages ; ni le remariage, ni le pacs, ni le
  concubinage après le décès ne l'éteignent : ils la figent.
domaine: reversion
regimes:
- sncf
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- conjoint.deces
- union.debut, d'un mariage, et la cessation des fonctions de l'agent, pour la
  condition de l'article 19
- les enfants, leur naissance avant ou après la cessation des fonctions
- les précédents conjoints de l'agent, leur mariage, leur divorce et leur remariage,
  que le partage au prorata des mariages lit
- le ménage où vit le survivant, au décès ou après
- la pension du défunt, servie ou qu'il aurait obtenue au jour de son décès, et sa
  majoration pour enfants
- le minimum de pension de l'article 15 (minimum_pension_sncf.csv), revalorisé
  comme les pensions (revalorisation_pensions.csv), à l'année des montants
ecrit:
- la pension de réversion du survivant, à la SNCF
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la réversion (§ 4.1) : le
# règlement de retraites d'avant le 1er juillet 2008, que l'index ne porte pas, puis
# le décret n° 2008-639, dont les taux de passage du minimum, en 2008 et en 2009,
# sont deux exceptions. Le moteur les lit par sa branche propre (droit/reversion.py
# et son jumeau) : le taux, la condition de l'article 19, la part de la majoration
# pour enfants reversée, le concubinage au décès, et la part du minimum de pension
# que la réversion garde.
versions:
- id: avant_2008
  statut: supposee
  hypothese: >-
    le règlement de retraites du personnel de la SNCF, qui réglait la réversion avant
    le 1er juillet 2008 et que l'index LEGI ne porte pas, n'a pas été lu ; on lui
    prête la règle de 2008
  fiabilite: moyenne
  bornes:
    liquidation.date_effet: [null, 2008-07-01]
  contenu:
    droit: la moitié de la pension de l'agent, majorée pour enfants comme elle
    beneficiaire: le conjoint survivant ; les conjoints divorcés non remariés
    parametres:
      taux: 0.50
      ex_conjoints: non_remaries
      beneficiaire: conjoint
      mariage_cessation_minimum_annees: 2
      mariage_minimum_annees: 4
      mariage_minimum_annees_avec_enfant: 2
      majoration_reversible: 0.50
      sans_jouissance_au_deces: [concubinage]
      age_minimum: null
      part_du_minimum_de_pension: null
      fiabilite: moyenne
  exemples: aucun trouvé
- id: conjoints_2008
  statut: lue
  textes:
