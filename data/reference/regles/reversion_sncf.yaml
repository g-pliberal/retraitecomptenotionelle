  nee_de: LEGIARTI000019108265
  bornes:
    liquidation.date_effet: [2008-07-01, null]
  contenu:
    droit: >-
      « La pension de retraite est reversée pour moitié au conjoint survivant et,
      s'il y a lieu, au conjoint divorcé » (article 18) ; « tant qu'il existe un ayant
      droit, égale à la moitié de ladite pension » (article 20) ; « Les pensions de
      conjoints ou d'ex-conjoints sont, le cas échéant, majorées dans les conditions
      fixées à l'article 16 » (article 18) ; au décès avant la liquidation, « les
      mêmes droits que si l'agent avait été admis à la retraite le jour de son
      décès » (article 18)
    beneficiaire: >-
      le conjoint survivant ; le conjoint divorcé qui n'a pas « contracté de nouveau
      mariage ou conclu de pacte civil de solidarité avant le décès de l'agent » ni
      ne vit en concubinage à ce moment (article 19, II, 1°, rédaction du
      1er janvier 2009 ; le pacs n'y est pas avant)
    conditions: >-
      « si la durée de son mariage avec l'agent atteignait au moins deux ans le jour
      de la cessation des fonctions de ce dernier ou, lorsque cette condition n'est
      pas remplie, si la durée du mariage [...] atteignait au moins quatre ans au
      moment du décès du retraité, cette durée étant ramenée à deux ans s'il existe
      un ou plusieurs enfants issus du mariage » ; la première condition n'est pas
      exigée « si, au moment du décès, il existe un enfant né ou conçu des conjoints
      avant la date de cessation des fonctions », ni après un accident en service
      (article 19, I) ; « Le conjoint survivant vivant en concubinage au moment du
      décès de l'agent ou du retraité ne peut entrer en jouissance de sa pension »
      (article 19, I) ; « Le conjoint survivant qui se remarie perçoit, sans
      revalorisation ultérieure, la pension dont il bénéficiait antérieurement à son
      nouvel état », le pacs et le concubinage valant remariage (article 31)
    minimum: >-
      « Lorsque la pension de l'agent a été portée au montant du minimum de pension
      prévu à l'article 15, la pension de réversion est portée à 51,3 % de ce montant
      au 1er juillet 2008, à 52,7 % de ce montant au 1er juillet 2009 et à 54 % de ce
      montant au 1er juillet 2010. Lorsque la pension de l'agent est supérieure au
      montant du minimum de pension prévu à l'article 15, la pension de réversion ne
      peut être inférieure à celle qui résulterait de l'application de l'alinéa
      précédent » (article 18) ; « Le montant du minimum de pension est égal à
      3 367,02 € par trimestre à compter du 1er juillet 2008 et à 3 379,38 € par
      trimestre à compter du 1er décembre 2008 », puis « à 1 215,64 euros par mois à
      partir du 1er octobre 2014 », « revalorisé dans les conditions définies à
      l'article 30 » (article 15, IV), « du taux et à la date prévus pour les
      fonctionnaires de l'Etat » (article 30) : `minimum_pension_sncf.csv`
    parametres:
      taux: 0.50
      ex_conjoints: non_remaries
      beneficiaire: conjoint
      mariage_cessation_minimum_annees: 2
      mariage_minimum_annees: 4
      mariage_minimum_annees_avec_enfant: 2
      majoration_reversible: 0.50
      sans_jouissance_au_deces: [concubinage]
      age_minimum: null
      part_du_minimum_de_pension: 0.54
      fiabilite: haute
  exemples: aucun trouvé
# Les taux de passage du minimum de la réversion, à sa date d'effet : 51,3 % du
# minimum de pension au 1er juillet 2008, 52,7 % au 1er juillet 2009 (article
# 18) ; la version conjoints_2008 pour le reste.
