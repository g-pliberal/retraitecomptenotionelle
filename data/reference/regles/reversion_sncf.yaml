approximations:
- version: [avant_2008]
  ecart: >-
    le règlement de retraites d'avant le 1er juillet 2008 n'a pas été lu : la règle de
    2008 lui est prêtée, au veuf comme à la veuve, sans son minimum, dont aucun
    montant n'est lu avant le 1er juillet 2008
  effet: non mesuré
- ecart: >-
    ne sont pas portés : l'allocation de solidarité aux personnes âgées que la
    réversion de la personne seule de 55 à 64 ans atteint au moins (article 23),
    « sous conditions de ressources » que la caisse dit sans les détailler, et que
    le texte ne dit pas ; la pension d'orphelin et le partage qu'elle impose
    (articles 20 et 21) ; la réversion refusée à qui recueille « un avantage de même
    nature d'un autre chef » (article 18) ; la condition levée par l'accident en
    service (article 19, I, 2°)
  effet: non mesuré
- version: [conjoints_2008, minimum_2008, minimum_2009]
  ecart: >-
    le minimum de la réversion ne joue que si la pension de l'agent, telle que le
    modèle la liquide, atteint le minimum de pension : le modèle n'y porte pas la
    pension de l'agent (article 15, I et IV), et la réversion d'une pension qu'il y
    aurait portée reste la moitié de la pension calculée ; ce minimum est celui des
    pensions d'ancienneté, sans celui de l'emploi à service discontinu ni le minimum
    réduit de la pension de réforme (article 15, I et II) ; il suit les pensions
    depuis ses ancres de 2008 et de 2014, au coefficient de 1 % en 2020, celui des
    pensions de 2 000 € par mois au plus, et sans la révision des montants de 2008
    (article 15, IV ; article 36, c), qui le laisse de 2009 à 2013 à 0,3 % sous ce
    que le décret de 2015 fixe au 1er octobre 2014 ; le taux de 51,3 % ou de 52,7 %
    est celui de la date d'effet, que les relèvements de juillet 2009 et de juillet
    2010 ne suivent pas
  effet: >-
    la réversion d'un agent sous le minimum de pension, que l'article 15 y aurait
    porté, est sous-estimée d'au moins 4 % de ce minimum ; non mesuré
- ecart: >-
    la cessation des fonctions est le départ, ou le décès qui le précède ; tout enfant
    déclaré est un enfant des conjoints, né avant la cessation s'il naît avant le
    départ — l'enfant conçu avant et né après ne lève pas la condition — ; la
    majoration de la réversion est celle de l'agent au même taux du montant de la
    réversion, la moitié de la sienne quand elle n'est pas portée au minimum, sans le
    plafond de la moitié de la rémunération qui a servi de base au calcul de la
    pension (article 18), comme la majoration de l'agent est servie sans le sien (fiche
    majoration_enfants_regimes_speciaux) ; la réversion part le premier jour du mois
    qui suit le décès, comme pour le retraité, et non le lendemain du décès de
    l'agent en activité (article 22) ; les montants sont ceux de l'année du décès
  effet: non mesuré
- version: [conjoints_2008]
  ecart: >-
    le partage au prorata des mariages (article 20, 1°) lit les précédents conjoints
    que la saisie déclare, deux au plus, non remariés au décès, sans leur opposer la
    durée du mariage de l'article 19, II, 2°, ni le pacs ou le concubinage au décès ;
    la réversion que le remariage, le pacs ou le concubinage du survivant après le
    décès fige sans revalorisation (article 31) est servie comme sans union
    nouvelle ; le survivant en concubinage au décès ne reçoit rien, et ce qu'il
    recouvre seul à soixante ans n'est pas porté
  effet: non mesuré
presomptions:
  mariage_des_conjoints: >-
    la condition de l'article 19, quand la date du mariage n'est pas déclarée
  survivant_seul: >-
    le survivant qui ne déclare pas de ménage ne vit pas en concubinage au décès
  deces_apres_le_depart: >-
    la réversion que la page montre sans décès déclaré, pour un décès supposé juste
    après le départ, ou cette année pour qui est déjà parti
sources:
  lu_le: 2026-10-18
  prochaine_relecture: 2027-04-30
  a_relire:
  - >-
    Le règlement de retraites du personnel de la SNCF d'avant le 1er juillet 2008,
    que l'index LEGI ne porte pas et que le JORF ne publie pas : la version
    avant_2008 lui prête la règle de 2008, au veuf comme à la veuve.
  - >-
    La condition de ressources du minimum de l'article 23, que le texte ne dit pas et
    que la caisse dit sans la détailler : la réversion portée à l'ASPA d'une personne
    seule, moins ses autres ressources, comme l'allocation que L. 815-9 rend
    différentielle ? Au propriétaire, avant de l'écrire, avec la ligne qui ne montre
    qu'un montant, quand le survivant n'a cinquante-cinq ans qu'après la date
    d'effet ou en atteint soixante-cinq.
  - >-
    Les montants du minimum de pension des années que le texte n'écrit pas : la
    caisse n'en publie aucun que le dépôt ait trouvé ; le modèle les refait par
    l'article 30.
  lectures:
  - type: legifrance
    reference: >-
      décret n° 2008-639, articles 18 à 23 et 31, toutes leurs rédactions dans
      l'index LEGI du dépôt, mis à jour le 18 octobre 2026 ; l'article 16
      (LEGIARTI000048240189) pour la majoration ; l'article 15, ses six rédactions
      (LEGIARTI000019108319 à LEGIARTI000048896995), pour le minimum de pension :
      3 367,02 € par trimestre au 1er juillet 2008, 3 379,38 € au 1er décembre 2008,
      1 215,64 € par mois au 1er octobre 2014 ; l'article 30, ses trois rédactions,
      pour sa revalorisation, celle des pensions de l'État ; l'article 35, III, pour
      celle du 1er avril 2009, et l'article 36, c, pour les augmentations de salaire
      du second semestre de 2008, qui révisent ses montants de 2008 ; le décret
      n° 2025-746 ne touche aucun d'eux (il modifie les articles 5, 14 et 17)
    date: 2026-10-18
  - type: autre
    reference: >-
      CPRP, « La pension de réversion — régime spécial », lue le 18 octobre 2026
      (sans date) : « 50 % de la pension acquise » ; deux ans de mariage pendant
      l'activité, quatre ans sinon, deux avec un enfant de l'union, aucune durée
      avec un enfant « né, conçu ou adopté durant l'activité » ; le survivant en
      concubinage au décès servi seulement redevenu seul, à soixante ans ; après la
      liquidation, une nouvelle union fait que la pension « n'est plus
      revalorisée » ; le minimum « égal à 54 % du montant du minimum de pension » ;
      l'ASPA de 55 à 65 ans selon les ressources ; la date d'effet, le lendemain du
      décès de l'agent en activité, le premier jour du mois qui suit celui du
      retraité. La caisse a changé de domaine : cprpsncf.fr ne se résout plus
    date: 2026-10-18
    url: https://www.cprpf.fr/retraites/veuvage-et-reversion/la-pension-de-reversion-regime-special/
code:
  python: >-
    scenarios/actuel.py : Reversions, qui lit les versions de cette fiche ;
    droit/reversion.py : reversion, _mariage_sncf, _sans_jouissance_au_deces,
    _part_du_survivant, _admis_ailleurs, _minimum_de_pension
  javascript: >-
    moteur/js/regimes.js : Reversions ; moteur/js/droit/reversion.js : reversion,
    mariageSncf, sansJouissanceAuDeces, partDuSurvivant, admisAilleurs,
    minimumDePension
  parametres: les versions de cette fiche (contenu.parametres), que le paquet du site porte
  tests: [tests/test_reversion.py, tests/test_web.py]
historique:
- >-
  2026-10-18 — la fiche naît (action 138, étape 9) : la SNCF n'avait pas de
  réversion, et sa ligne disait « la réversion de ce régime n'est pas encore
  portée » ; la cotisation maladie de la réversion se prend sous la moitié du
  plafond (décret n° 2007-1056, article 7, VII).
- >-
  2026-10-18 — le minimum de l'article 18 (action 138, étape 9) : la réversion de la
  pension qui atteint le minimum de pension de l'article 15 ne descend pas sous 54 %
  de ce minimum, 51,3 % et 52,7 % en 2008 et en 2009 ; l'agent né en 1958, parti à
  57 ans à 55 % du salaire moyen, trois enfants, mort en mai 2023, laisse 9 425 € par
  an en euros de 2023 au lieu de 8 859.
effet: >-
  Tout conjoint d'un agent de la SNCF : la moitié de sa pension, majorée pour enfants,
  sans âge ni ressources, dès que le mariage remplit la condition de l'article 19,
  partagée avec les précédents conjoints non remariés ; 54 % du minimum de pension au
  moins quand la pension de l'agent l'atteint, ce qui relève la réversion des
  pensions qui le dépassent de moins de 8 %, sous 1 428 € par mois en 2023.
