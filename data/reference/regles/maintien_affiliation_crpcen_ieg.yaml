  contenu:
    beneficiaire: >-
      les recrutés d'avant le 1er septembre 2023 « qui remplissent, à compter de cette
      date, les conditions d'affiliation » : « sans aucune interruption » est supprimé (V,
      1°, a), et le VIII applique la rédaction « aux congés et aux suspensions et aux
      ruptures du contrat de travail intervenus avant » le 1er janvier 2024
    maintien_avant: >-
      « En cas de suspension ou de rupture du contrat de travail intervenue avant le
      1er septembre 2023, quelle qu'en soit la cause, l'affiliation est maintenue pour une
      durée maximale de dix ans à compter de la suspension ou de la rupture du contrat »
    maintien_apres: >-
      après une rupture postérieure, « 1° Pour une durée d'un mois à compter de la rupture
      du contrat lorsque cette rupture est à l'initiative du salarié ou d'un commun
      accord ; 2° Pour une durée d'un an [...] lorsque cette rupture est à l'initiative de
      l'employeur » ; « Par dérogation aux 1° et 2°, l'affiliation est maintenue jusqu'à
      la reprise d'une activité entraînant une affiliation auprès d'un autre régime de
      sécurité sociale lorsque cette reprise d'activité intervient avant l'expiration »
      de ces durées
    conges: >-
      les congés et suspensions « qui ne donnent lieu ni au versement de cotisations ni à
      la constitution de droits à pension » et maintiennent pourtant l'affiliation :
      treize pour la CRPCEN (décret n° 2025-799), dix-sept pour les IEG (décret
      n° 2025-761) — l'adoption internationale, le congé parental d'éducation, la présence
      parentale, la solidarité familiale, le proche aidant, le congé sabbatique, la
      mobilité volontaire sécurisée, les mandats parlementaires et locaux, la réserve
      opérationnelle, la création ou la reprise d'entreprise, la grève, la sanction, la
      détention, et « tout autre congé ou absence dont la durée est inférieure à un mois » ;
      aux IEG s'y ajoutent les congés sans solde du statut national, la solidarité
      internationale et une mobilité de cinq ans au plus hors du statut ; à la CRPCEN, le
      congé des natifs d'outre-mer de la convention collective (art. 18.6)
    application: >-
      la CNIEG : une suspension qui « donne lieu au versement de cotisations et/ou à la
      constitution de droits à pension vieillesse », l'arrêt maladie à salaire maintenu,
      maintient l'affiliation ; toute autre, hors de la liste, « entraine la rupture
      d'affiliation » ; parti le 1er mars 2021 et réembauché le 1er février 2026, l'agent
      « bénéficie d'un maintien d'affiliation au régime spécial des IEG »
  exemples: aucun trouvé
approximations:
- version: [loi_2023_270, lfss_2024]
  ecart: >-
    Le modèle ne connaît la carrière qu'à l'année. Un départ et un retour qui ne laissent
    entre eux aucune année civile entière sans emploi sous le statut ne rompent rien, quand
    le droit rompt l'affiliation un mois après une démission ou une rupture
    conventionnelle, un an après un licenciement, ou dès la reprise d'une activité
    affiliée ailleurs ; une année civile entière dépasse l'un et l'autre maintien. Le
    départ se date de la fin de sa dernière année d'emploi sous le statut, le retour de
    janvier : celui de 2023 précède la fermeture, le départ de 2023 la suit.
  effet: non mesuré ; aucune carrière des témoins ne revient au statut
- version: lfss_2024
  ecart: >-
    Le modèle ne connaît ni le contrat ni le congé. Une année d'interruption déclarée sous
    le statut le suspend, sauf le chômage et la préretraite, qui supposent le contrat rompu
    (`INTERRUPTIONS_DE_RUPTURE`) : la maladie, la maternité et l'invalidité, qui ouvrent
    des droits, le maintiennent comme le veut le texte ; l'inactivité, les études et le
    service sont présumés l'un des congés des deux listes, quand un congé hors liste, sans
    cotisation ni droit, rompt l'affiliation. À l'inverse, une année passée sous un autre
    statut rompt toujours : le modèle ne voit ni la mobilité de cinq ans au plus hors des
    IEG (décret n° 2025-761, 12°) ni le congé de création d'entreprise, qui la maintiennent
    pendant que l'assuré travaille ailleurs.
  effet: non mesuré
- version: lfss_2024
  ecart: >-
    Une suspension ou une rupture d'avant le 1er septembre 2023 se maintient dix ans quoi
    qu'il s'y passe : le texte ne la borne que par sa durée, « quelle qu'en soit la cause »,
    et la dérogation de la reprise d'activité ne vise que les 1° et 2° ; le modèle ne coupe
    pas non plus ce maintien à une rupture postérieure survenue pendant une suspension, que
    le texte ne règle pas.
  effet: non mesuré
- version: loi_2023_270
  ecart: >-
    Pour une pension prise de septembre à décembre 2023, le modèle applique la rédaction de
    2024 : une interruption de ces quatre mois, que « sans aucune interruption »
    sanctionnait, ne se voit pas à l'année.
  effet: nul, à l'année
