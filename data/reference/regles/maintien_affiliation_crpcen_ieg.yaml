  a_relire:
  - >-
    La doctrine de la CRPCEN, que la session n'a pas lue : comment elle date la rupture
    et le retour, et si elle maintient l'affiliation dix ans à qui a travaillé ailleurs
    entre une rupture d'avant le 1er septembre 2023 et son retour, comme la CNIEG le fait
    dans son exemple.
  - >-
    Une rupture postérieure au 1er septembre 2023 pendant une suspension commencée avant :
    le maintien de dix ans court-il encore, ou celui d'un mois ou d'un an ? Le texte ne le
    dit pas.
historique:
- >-
  2026-10-25 — née avec l'action 138, étape 9 : le retour à la CRPCEN et aux IEG après
  le 1er septembre 2023, que le modèle gardait au régime spécial, la carrière datant
  l'entrée du premier recrutement.
code:
  python: >-
    carriere.py : Affiliations.maintien, Affiliations.date_entree, Carriere.retours,
    INTERRUPTIONS_DE_RUPTURE ; droit/coordonner.py : coordonner, regimes_de ;
    moteur/compte.py : ConstructeurCompte._cotisation_ligne ; remuneration.py :
    remuneration_de_la_carriere ; contributions_equilibre.py : _dues
  javascript: >-
    moteur/js/regimes.js : Affiliations.maintien, Affiliations.dateEntree ;
    moteur/js/carriere.js : Carriere.retours, INTERRUPTIONS_DE_RUPTURE ;
    moteur/js/droit/coordonner.js : coordonner, regimesDe ; moteur/js/compte.js :
    ConstructeurCompte._cotisationLigne ; moteur/js/remuneration.js :
    remunerationDeLaCarriere ; moteur/js/contributions-equilibre.js : dues
  parametres: >-
    legislation/affiliations.yaml : affiliations.clerc_de_notaire.periodes,
    affiliations.agent_ieg.periodes
  tests:
  - tests/test_retour_crpcen_ieg.py
  moteur: >-
    chaque routage lit la date d'entrée de l'année, celle d'Affiliations.date_entree :
    les étapes du scénario 1, le compte, la fiche de paie, les contributions d'équilibre,
    et au portage le cycle de vie
effet: >-
  Les clercs et les agents des IEG recrutés avant le 1er septembre 2023 qui quittent le
  statut et y reviennent : le retour que rien ne maintient — après une rupture
  postérieure, une année civile entière ailleurs ou au chômage ; après une rupture ou une
  suspension antérieure, plus de dix ans — cotise au régime général et à l'Agirc-Arrco,
  quand le modèle lui gardait le régime spécial.
