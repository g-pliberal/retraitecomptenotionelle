schema_version: 1
id: maintien_affiliation_crpcen_ieg
intitule: >-
  La CRPCEN et les IEG ne servent la pension de vieillesse qu'aux recrutés d'avant le
  1er septembre 2023 qui remplissent, à compter de cette date, les conditions
  d'affiliation : l'affiliation se maintient dix ans au plus après une suspension ou une
  rupture antérieure ; un mois ou un an après une rupture postérieure, selon qu'elle vient
  du salarié ou de l'employeur, et jusqu'à la reprise d'une activité affiliée ailleurs ;
  pendant les congés que deux décrets énumèrent. Revenu après qu'elle a cessé, l'assuré est
  un nouvel entrant, au régime général et à l'Agirc-Arrco.
domaine: coordination
regimes: [crpcen, ieg]
etape: coordonner_les_affiliations
face: droit
etat: approchee
lit:
- les lignes de la carrière sous le statut, années d'emploi et interruptions avec leur
  motif (`Carriere.retours`), et la date d'entrée dans le statut (`Carriere.date_entree`)
- legislation/affiliations.yaml (`entres_avant` et `maintien` des périodes de
  clerc_de_notaire et d'agent_ieg)
ecrit:
- la date d'entrée qui décide des régimes de chaque année (`Affiliations.date_entree`),
  que lisent les étapes du scénario 1, le compte, la fiche de paie et les contributions
  d'équilibre
dates_qui_decident:
- entree_dans_un_regime
- cessation_d_activite
- revenu.annee
- liquidation.date_effet
