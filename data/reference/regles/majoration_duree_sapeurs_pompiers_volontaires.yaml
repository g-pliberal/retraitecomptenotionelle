    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2026_22_23072026.pdf
    date: 2026-07-23
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 2026-31 du 30 septembre 2026, qui étend le champ à la caisse de
      sécurité sociale de Mayotte à compter du 1er janvier 2027
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2026_31_30092026.pdf
    date: 2026-09-30
historique:
- >-
  2026-10-19 — née de la veille du 19 octobre 2026 : L. 173-1-5 existait depuis la loi de
  2023 sans fiche, et le décret n° 2026-18, appliqué aux pensions de juillet 2026, n'était
  cité par aucune ; la seule trace du dépôt était la prestation de fidélisation des
  volontaires, rangée hors champ (`regimes/sapeurs_pompiers_volontaires.yaml`).
effet: >-
  Tout assuré qui a été sapeur-pompier volontaire au moins dix ans et liquide depuis le
  1er juillet 2026 : un à trois trimestres de durée d'assurance. Pour qui n'a pas la
  durée requise, chacun épargne au régime général 1,25 % de décote et ajoute un
  cent-soixante-douzième, 0,58 %, au prorata d'une durée requise de cent soixante-douze
  trimestres ; sans effet sur l'âge, faute d'être cotisé. Le modèle ne connaît pas
  l'engagement et ne la sert pas.
