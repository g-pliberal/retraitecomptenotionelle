      décret n° 2003-1306 article 15, décret n° 2004-1056 article 12, R. 8-1 du code des
      pensions des marins, R. 732-61 du code rural, décret n° 2017-1000 article 3
    date: 2026-10-19
  - type: jorf
    reference: >-
      Index JORF du dépôt : décret n° 2026-18 du 20 janvier 2026 (JORFTEXT000053388196),
      ses articles 1 à 9, et ordonnance n° 2026-647 du 22 juillet 2026, article 3
      (JORFARTI000054456513) : la majoration à Mayotte pour les pensions prenant effet à
      compter du 1er janvier 2027
    date: 2026-10-19
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 2026-22 du 23 juillet 2026, « Majoration de durée d'assurance au
      titre des périodes d'engagement en tant que sapeur-pompier volontaire » : le
