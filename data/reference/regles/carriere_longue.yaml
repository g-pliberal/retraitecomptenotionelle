schema_version: 1
id: carriere_longue
intitule: >-
  Quatre bornes d'entrée (16, 18, 20, 21 ans), cinq trimestres de durée d'assurance —
  cotisés ou assimilés — avant la fin de l'année civile, quatre pour les nés au dernier
  trimestre, dans cette seule année pour les pensions d'avant novembre 2012 ; durée
  requise cotisée ; la borne des vingt ans par génération ; portes lues à la date d'effet,
  chacune aux seules générations que sa rédaction nomme ; jusqu'en octobre 2012, une durée
  d'assurance tous régimes de huit trimestres au-delà de la durée requise.
etat: conforme
etape: ouvrir_le_droit
effet: >-
  Tout départ avant l'âge légal. Les quatre-vingts portes de 2004 à 2026 sont lues
  et certifiées (action 27) : celles de 2011 et de 2012 génération par génération
  dans les versions abrogées (LEGIARTI000023397567, LEGIARTI000026139949), celles
  de 2004 dans LEGIARTI000006736521. Le moteur retient désormais une porte par couple
  (borne d'entrée, supplément) et non plus par borne seule. Depuis le 20 octobre 2026,
  le début d'activité compte les périodes assimilées — service national, chômage,
  maladie — comme la Cnav depuis 2004 : l'assuré entré tard dans l'année de ses
  dix-neuf ans, puis sous les drapeaux, n'est plus déclaré sans porte. Depuis le 22
  octobre 2026, le né au dernier trimestre dont la pension prend effet avant novembre
  2012 doit ses quatre trimestres à l'année même de son anniversaire, « au titre de »
  laquelle le texte de l'époque les demandait : répartis sur deux années, ils ne lui
  ouvrent plus la porte, que le moteur lui ouvrait sous la règle de 2012. Depuis le 24
  octobre 2026, chaque porte ne vaut que pour les générations que sa rédaction nomme
  (colonne `generation_fin`, certifiée) : le moteur étendait la dernière ligne d'une porte
  à toutes les générations suivantes, et le né de 1955 à 1962 entré à seize ans partait
  à 59 ans et 8 mois par la porte que le décret du 2 juillet 2012 ne donne qu'aux nés de
  1953 — au droit en vigueur de novembre 2012 à août 2023, au droit du 31 août 2023 à
  toute date —, quand le texte ne lui ouvre que 60 ans. Et les rédactions de 2003 et de
  2010 n'ouvrent la carrière longue qu'avec une durée d'assurance tous régimes de huit
  trimestres au-delà de la durée requise, que le moteur ne vérifiait pas : le né de 1950
  entré à seize ans, deux ans sans rien valider, partait à 59 ans en 2009 avec 164
  trimestres quand il lui en fallait 170 (action 138, étape 21 ; tests/test_simulateur.py).
sources:
  lu_le: 2026-10-24
  prochaine_relecture: 2026-12-31
  a_relire:
  - >-
    Le 2° de l'article 3 bis du décret n° 73-937, du 1er juillet 2011 au 1er novembre 2012
    (LEGIARTI000023397572), ne nomme que les seizième et dix-septième anniversaires, quand
    son 1° nomme aussi le dix-huitième : à la lettre, l'artisan ou le commerçant né au
    dernier trimestre n'avait pas, à la porte des dix-huit ans, l'option des quatre
    trimestres, que le modèle lui laisse comme au régime général. Lire comment le RSI
    l'appliquait avant de l'en priver.
  lectures:
  - type: legifrance
    reference: >-
      D. 351-1-1 CSS, rédactions du 31 octobre 2003 (LEGIARTI000006736521), du 1er
      juillet 2011 (LEGIARTI000023397567) et du 1er novembre 2012 (LEGIARTI000026139949),
      relues dans l'index LEGI : chaque bloc de portes « Pour les assurés nés en 1953 : »
      ne vaut que pour les générations qu'il nomme, « à compter du 1er janvier 1960 »
      sans fin ; le chapeau de 2003 et de 2010 exige de tous « une durée minimale
      d'assurance ou de périodes reconnues équivalentes au moins égale à la limite fixée
      en application du deuxième alinéa de l'article L. 351-1 majorée de huit
      trimestres », celui de 2012 la seule durée cotisée
    date: 2026-10-24
  - type: legifrance
    reference: >-
      Les mêmes portes et la même durée majorée aux autres régimes auxquels le modèle
      ouvre la table : l'article 3 bis du décret n° 73-937 pour les artisans et les
      commerçants (LEGIARTI000006765840, LEGIARTI000023397572, portes identiques) ;
      l'article 28 ter du décret n° 55-753 (LEGIARTI000006763597) puis D. 732-40 du code
      rural pour les non-salariés agricoles (LEGIARTI000006597425 ; LEGIARTI000023397791 et
      LEGIARTI000026139992, « dans les conditions prévues » à D. 351-1-1) ; L. 25 bis du
      code des pensions (LEGIARTI000006362733, « au moins égale à 168 trimestres » ;
      LEGIARTI000019959540) et D. 16-1 (LEGIARTI000023383582, LEGIARTI000026140012,
      LEGIARTI000028751947), dont les blocs des nés de 1952 à 1960 sont ceux du régime
      général ; celui de 2012 garde en outre ceux des générations d'avant 1952, sans
      effet sur une pension prise depuis novembre 2012, après soixante ans
    date: 2026-10-24
  - type: circulaire_cnav
    reference: >-
      2003-46 du 18 novembre 2003, point 111 : « Les assurés doivent justifier, dans le
      régime général et dans un ou plusieurs autres régimes de base obligatoires, d'une
      durée minimale d'assurance et de périodes reconnues équivalentes au moins égale à
      168 trimestres. Cette durée minimale prend en compte tous les trimestres retenus
      pour déterminer le taux de la pension » ; relue le 24 octobre 2026 par l'API de la
      base de législation de la Cnav
    url: https://legislation.lassuranceretraite.fr/references-reglementaires?file_leaf_ref=CR_CN_2003046_18112003.aspx
    date: 2003-11-18
  - type: legifrance
    reference: >-
      Le 2° de D. 351-1-3 CSS dans ses rédactions du 31 octobre 2003
      (LEGIARTI000006736523) et du 1er janvier 2011 (LEGIARTI000023397562) : « d'une
      durée d'assurance d'au moins quatre trimestres au titre de l'année au cours de
      laquelle est survenu » l'anniversaire ; « à la fin de l'année » dans celle du
      1er novembre 2012 (LEGIARTI000026139940). Le même 2° à D. 16-3 du code des pensions
      (LEGIARTI000023383594, du 1er janvier 2011 au 1er novembre 2012) et au 3 bis du
      décret n° 73-937 pour les artisans et les commerçants (LEGIARTI000023397572, même
      fin) : les régimes auxquels le modèle ouvre la carrière longue changent tous de règle
      le 1er novembre 2012
    date: 2026-10-22
  - type: legifrance
    reference: >-
      D. 351-1-3 CSS, ses cinq rédactions dans l'index LEGI du dépôt
      (LEGIARTI000006736523 du 31 octobre 2003, LEGIARTI000023397562 du 1er janvier 2011,
      LEGIARTI000026139940 du 1er novembre 2012, LEGIARTI000047634559 du 1er septembre
      2023, LEGIARTI000053356007 du 1er janvier 2026) : toutes posent la condition de début
      d'activité sur « une durée d'assurance d'au moins cinq trimestres », non sur la durée
      cotisée de D. 351-1-1
    date: 2026-10-20
  - type: circulaire_cnav
    reference: >-
      2003-46 du 18 novembre 2003, point 113 : « La durée d'assurance désigne les périodes
      de cotisations à l'assurance vieillesse obligatoire ou volontaire, les rachats ainsi
      que les périodes assimilées à des périodes d'assurance retenus dans un ou plusieurs
      régimes de base » ; lue par l'API de la base de législation de la Cnav
    url: https://legislation.lassuranceretraite.fr/references-reglementaires?file_leaf_ref=CR_CN_2003046_18112003.aspx
    date: 2003-11-18
  - type: circulaire_cnav
    reference: >-
      2012-60 du 4 septembre 2012, point 211 : la condition reste une « durée d'assurance
      d'au moins 5 trimestres » ; le dernier trimestre de naissance passe de quatre
      trimestres « dans l'année civile » de l'anniversaire à quatre « avant la fin de
      l'année civile » ; point 5 : « applicables aux pensions prenant effet à compter du
      1er novembre 2012 » (article 14 du décret n° 2012-847). Ni elle ni la circulaire
      n° 2003-46 ne donnent d'exemple chiffré de la règle ancienne. Relue le 24 octobre
      2026, points 2 et 211 : le décret « supprime par ailleurs la condition de durée
      d'assurance totale pour tous les âges de départ » ; « L'assuré doit avoir débuté son
      activité avant 16 ans ou 17 ans selon son année de naissance et l'âge de départ fixé
      sa génération (annexe 2) », que l'API ne sert pas
    url: https://legislation.lassuranceretraite.fr/references-reglementaires?file_leaf_ref=circulaire_cnav_2012_60_04092012.aspx
    date: 2012-09-04
  - type: circulaire_cnav
    reference: >-
      2026-29 du 4 septembre 2026, point 1.1.4 : « Sont prises en compte, pour apprécier la
      condition relative au début d'activité, les périodes de cotisations à l'assurance
      vieillesse obligatoire ou volontaire (les rachats et versements pour la retraite en
      fonction de leur nature et de la date de la demande) ainsi que les périodes assimilées
      à des périodes d'assurance validés dans le ou les régimes de base » — même phrase au
      point 1.1.4 de la circulaire 2023-14 du 10 juillet 2023 ; copie datée,
      sha256:9fd38e870dd0178b5c81d206f5e75c42220347a5c01ed2855653d7020be3498b
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2026_29_04092026.pdf
    date: 2026-09-04
  - type: circulaire_cnav
    reference: >-
      2026-29 du 4 septembre 2026, point 1.1.1 et annexe 3, relue ligne à ligne
      le 21 septembre 2026 : mêmes âges et mêmes durées que la 2026-17 qu'elle annule
      et remplace
    date: 2026-09-04
  - type: legifrance
    reference: >-
      D. 351-1-1 CSS, versions du 1er septembre 2023 (LEGIARTI000047634571), du
      1er janvier 2026 (LEGIARTI000053356023, sans changement de valeur) et du 1er
      septembre 2026 (LEGIARTI000054059621), lues par le récupérateur dans l'index
      LEGI, I et II
    date: 2026-09-17
  - type: service_public
    reference: fiche F13845
    date: 2026-09-01
