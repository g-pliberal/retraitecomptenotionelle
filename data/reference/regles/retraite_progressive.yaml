- id: salaries_1988
  statut: lue
  textes:
  - {id: JORFTEXT000000509071, article: "loi n° 88-16 du 5 janvier 1988", publie_le: 1988-01-06}
  - {id: LEGIARTI000006742644, article: "L. 351-15 CSS", en_vigueur: 1988-01-06}
  - {id: LEGIARTI000044629917, article: "L. 351-15 CSS", en_vigueur: 2022-01-01}
  nee_de: JORFTEXT000000509071
  bornes:
    liquidation.date_effet: [1988-01-06, 2023-09-01]
  contenu:
    droit: >-
      « la liquidation de sa pension de vieillesse et le service d'une fraction de
      celle-ci » à l'assuré qui exerce « à titre exclusif une activité à temps
      partiel », dans le régime général, celui des salariés agricoles, et ceux des
      non-salariés que l'article nomme ; la fraction « varie [...] en fonction de la
      durée du travail à temps partiel »
    conditions: >-
      l'âge de L. 351-1 en 1988 ; en 2022, « l'âge prévu au premier alinéa de l'article
      L. 351-1 diminué de deux années, sans pouvoir être inférieur à soixante ans » ;
      une durée d'assurance et une quotité fixées par décret
  exemples: aucun trouvé
- id: tous_regimes_2023
  statut: lue
  textes:
  - {id: JORFARTI000047445113, article: "loi n° 2023-270 du 14 avril 2023, article 26", publie_le: 2023-04-15}
  - {id: LEGIARTI000047961574, article: "D. 161-2-24 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047961034, article: "R. 161-19-6 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047959203, article: "D. 161-2-24-3 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047451909, article: "L. 89 bis CPCMR", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047957966, article: "D. 37-1 CPCMR", en_vigueur: 2023-08-12}
  nee_de: JORFARTI000047445113
  bornes:
    liquidation.date_effet: [2023-09-01, 2025-09-01]
  contenu:
    droit: >-
      « la liquidation provisoire et le service d'une même fraction de pension dans
      tous les régimes de retraite de base légalement obligatoires » (L. 161-22-1-5) ;
      au fonctionnaire, « une pension partielle » (L. 89 bis) ; puis « la pension
      complète est liquidée en tenant compte du montant de la pension initiale et de
      la durée d'assurance accomplie depuis la liquidation de celle-ci »
      (L. 161-22-1-7), et le bénéfice « ne peut pas être à nouveau demandé »
    conditions: >-
      l'âge de L. 161-17-2 « abaissé de deux ans » (D. 161-2-24) ; une quotité « ne
      [pouvant] être inférieure à 40 % ou supérieure à 80 % de la durée de travail à
      temps complet », arrondie à l'unité (R. 161-19-6) ; cent cinquante trimestres au
      fonctionnaire (D. 37-1)
    fraction: >-
      « la différence entre 100 % et la quotité de travail à temps partiel »
      (D. 161-2-24-3) ; supprimée à la reprise d'un temps plein ou d'un revenu au moins
      égal à celui d'avant (L. 161-22-1-8)
    parametres:
      age: age_legal_moins_deux_ans
      quotite_minimum: 0.40
      quotite_maximum: 0.80
  exemples: aucun trouvé
