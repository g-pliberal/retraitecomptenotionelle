approximations:
- ecart: >-
    une seule quotité, déclarée avec la date de la demande, court jusqu'au départ : les
    changements de quotité, qui révisent la fraction au mois suivant (R. 351-42,
    D. 161-2-24-4), la suspension et la reprise d'un temps plein qui la supprime
    (L. 161-22-1-8) ne sont pas représentés
  effet: non mesuré
- ecart: >-
    le non-salarié ne déclare pas la baisse de ses revenus, qui fait sa fraction
    (D. 634-16, D. 161-2-24-3, 2°) : sa quotité en tient lieu, et la réduction de son
    revenu est celle d'un temps partiel. Sa fraction se sert aussi à la date qu'il
    déclare, quand elle « prend effet au 1er janvier qui suit la demande » depuis le
    1er septembre 2023 (D. 161-2-24-2), sans les dix-huit mois à 50 % « à titre
    provisionnel » des pensions de 2026 et après (D. 161-2-24-3, II), ni la condition
    d'un revenu d'au moins 40 % du SMIC (D. 161-2-24-1, 1°)
  effet: non mesuré
- ecart: >-
    la décote de la pension provisoire, bornée à 25 % du 18 décembre 2014 au 1er
    septembre 2023 (R. 351-41), n'a pas de code : chaque régime borne déjà sa décote à
    vingt trimestres, et les générations qui pouvaient alors la demander, nées après
    1952, perdent 1,25 % par trimestre. tests/test_retraite_progressive.py le vérifie
  effet: aucun
- ecart: >-
    les complémentaires qui suivent un régime liquidé servent la même fraction et
    liquident leur pension complète au départ par leurs propres règles ; le coefficient
    temporaire et les conditions propres de l'Agirc-Arrco (accord du 17 novembre 2017,
    article 88) et de l'Ircantec ne sont pas relus ; celles des libéraux attendent
    2023, comme leur régime de base ; le RAFP attend l'âge légal
  effet: non mesuré
- ecart: >-
    avant 2023, les régimes spéciaux ne liquident rien avec la retraite progressive, et
    depuis, seuls ceux que les décrets n° 2023-751 et 2023-753 nomment, et les IEG, dont
    l'annexe 3 au statut rend le code applicable (article 21-1), l'ouvrent à qui y
    travaille ; les autres liquident à titre provisoire la pension de qui a travaillé
    chez eux, L. 161-22-1-5 visant tous les régimes de base. Leurs décrets propres, lus
    le 19 octobre 2026, l'ouvrent pourtant à leurs agents : la RATP (décret n° 2008-637,
    article 22 bis) et la Banque de France (annexe au décret n° 2007-262, article
    35 bis, la pension partielle du code des pensions civiles) depuis le 1er septembre
    2023, la SNCF (décret n° 2008-639, article 6 bis) depuis le 22 octobre 2023, et le
    modèle la refuse à qui y travaille ; la Comédie-Française, que le modèle ne sert
    pas, liquide sans la cessation d'activité qu'elle exige d'ordinaire (décret
    n° 68-960, article 26) ; l'index LEGI ne dit rien des marins
  effet: >-
    l'agent de la SNCF, de la RATP ou de la Banque de France à temps partiel qui la
    demande depuis 2023 ne la reçoit pas ; non mesuré
- ecart: >-
    le plancher de la pension complète se compare régime par régime, à la pension
    provisoire revalorisée par la revalorisation de chaque régime, surcote parentale
    comprise, mais avant la majoration pour enfants, que la caisse met des deux côtés
    (circulaire Cnav 2018/31, 8.2) : le plus élevé est le même tant que les deux pensions
    la portent au même taux, les 10 % du régime général ; avant le 8 juin 2006, la
    pension complète est la provisoire dans les régimes de base, les complémentaires se
    recalculant
  effet: non mesuré
sources:
  lu_le: 2026-09-29
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Appliquée le 29 septembre 2026, avec le domaine des départs multiples (étape 3).
    Aucun exemple chiffré publié n'a été trouvé : le parcours d'info-retraite, lu le
    19 octobre 2026, ne chiffre que la fraction (« pour un temps de travail à 80%, la
    retraite progressive est de 20% ; pour un temps de travail à 65%, elle est de
    35% »), que le modèle rend ; les circulaires Cnav 2006/66, 2011/14 et 2018/31, lues
    le 28 octobre 2026, ne chiffrent rien. En chercher un (service-public, simulateur de
    l'Agirc-Arrco) avant de la dire conforme.
  - >-
    Couper en versions ce que le parcours d'info-retraite a fait relire le 19 octobre
    2026 : le 1er janvier qui suit la demande, les dix-huit mois à 50 % et le revenu
    minimal des non-salariés (D. 161-2-24-1 à D. 161-2-24-3), et la retraite
    progressive des agents de la SNCF, de la RATP et de la Banque de France
    (approximations ci-dessus).
  - >-
    La pratique de la CNAVPL avant 2023 : L. 351-15 nomme les professions libérales
    parmi les régimes qui liquident avec le salarié, mais aucune lecture ne dit qu'elle
    l'ait fait. Les assurés en retraite progressive au 1er septembre 2023, qui gardent
    les anciennes règles (loi n° 2023-270, article 26, XII, 4°).
