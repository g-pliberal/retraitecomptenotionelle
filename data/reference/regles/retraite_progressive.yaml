- {id: LEGIARTI000028498553, article: "L. 351-15 CSS", en_vigueur: 2014-01-22, change: "à lire"}
- {id: LEGIARTI000036391731, article: "L. 351-15 CSS", en_vigueur: 2018-01-01, change: "à lire"}
historique:
- >-
  2026-09-29 — née avec le domaine des départs multiples, de la fiche
  cumul_emploi_retraite_et_retraite_progressive, qui ne porte plus que le cumul.
effet: >-
  Les salariés, les indépendants et, depuis 2023, les fonctionnaires qui passent à
  temps partiel en fin de carrière : une fraction de pension pendant ce temps partiel,
  puis une pension complète recalculée. Le modèle n'en calcule aucune.
