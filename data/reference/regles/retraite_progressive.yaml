schema_version: 1
id: retraite_progressive
intitule: >-
  Retraite progressive : l'assuré qui travaille à temps partiel touche une fraction de
  sa pension, liquidée à titre provisoire, puis une pension complète qui tient compte
  de la durée accomplie depuis. Ouverte aux salariés et aux non-salariés depuis 1988,
  aux fonctionnaires, aux libéraux et aux avocats depuis le 1er septembre 2023 ; à
  l'âge légal, puis à deux ans de l'âge légal, puis à soixante ans pour les pensions
  prenant effet depuis le 1er septembre 2025 ; une quotité de 40 à 80 %, une fraction
  égale à ce qui manque de la quotité pour faire 100 %.
domaine: cumul
regimes: [regime_general, msa_salaries, msa_non_salaries, cancava, organic, rsi, cnavpl, cnbf,
  crpcen, opera_de_paris, mines, fonction_publique_etat, cnracl, fspoeie, agirc_arrco, arrco,
  arrco_tranche_2, agirc, ircantec]
etape: echeancier
face: droit
etat: approchee
lit:
- la date de la demande et la quotité du temps partiel gardé jusqu'au départ
- le régime où l'assuré travaille à temps partiel, l'année de la demande
- l'âge, la durée d'assurance tous régimes, les régimes de la carrière
- la date du départ, où la pension complète se liquide
ecrit:
- la pension provisoire de chaque régime liquidé, et la fraction qui en est servie
  jusqu'au départ
- la pension complète, liquidée au départ, et le plancher que lui fait la pension
  provisoire revalorisée
- les années à temps partiel, dont le revenu est réduit de la quotité et que les
  services de la fonction publique comptent à leur durée réelle
dates_qui_decident:
- liquidation.date_effet
