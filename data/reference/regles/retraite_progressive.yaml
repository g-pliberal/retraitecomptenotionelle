sources:
  lu_le: 2026-09-29
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 29 septembre 2026 avec le domaine des départs multiples ; le moteur ne
    la calcule pas encore (étape 3 du domaine). Il lui manque la quotité de chaque
    période, que la saisie ne demande pas.
  - >-
    À lire avant de la porter : la durée d'assurance du régime général (cent cinquante
    trimestres à la fonction publique, D. 37-1 ; le texte du régime général n'a pas
    été trouvé dans l'index), les rédactions de L. 351-15 de 2003, 2010, 2014 et 2018,
    R. 351-39 à R. 351-44 (1988) et le calcul de la pension complète (D. 161-2-24-4,
    L. 89 ter CPCMR) ; la retraite progressive de l'Agirc-Arrco et de l'Ircantec ;
    les assurés en retraite progressive au 1er septembre 2023, qui gardent les
    anciennes règles (loi n° 2023-270, article 26, XII, 4°).
  lectures:
  - type: legifrance
    reference: >-
      L. 351-15 CSS, rédactions du 6 janvier 1988 (LEGIARTI000006742644) et du
      1er janvier 2022 (LEGIARTI000044629917) ; L. 161-22-1-5, rédaction du 26 octobre
      2025 (LEGIARTI000052437156) ; D. 161-2-24 (2023 et 2025) ; R. 161-19-6 ;
      D. 161-2-24-3 (2023 et 2026) ; R. 161-19-7 (2023 et 2026), dans l'index LEGI
    date: 2026-09-29
  - type: jorf
    reference: >-
      loi n° 2023-270, article 26, lu en entier : L. 161-22-1-5 à L. 161-22-1-9,
      L. 89 bis et L. 89 ter CPCMR
    date: 2026-09-29
