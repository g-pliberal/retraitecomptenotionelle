      dans la pension différée
    date: 2026-10-10
  - type: autre
    reference: >-
      Union Retraite, parcours « Retraite progressive » d'info-retraite.fr, quinze
      questions et vingt-cinq réponses, tout l'arbre dans la page : soixante ans pour
      les retraites progressives prenant effet à partir du 1er septembre 2025,
