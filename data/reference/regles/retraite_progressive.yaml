schema_version: 1
id: retraite_progressive
intitule: >-
  Retraite progressive : l'assuré qui travaille à temps partiel touche une fraction de
  sa pension, liquidée à titre provisoire, puis une pension complète qui tient compte
  de la durée accomplie depuis. Ouverte aux salariés et aux non-salariés depuis 1988,
  à tous les régimes de base et aux fonctionnaires (L. 89 bis) depuis le 1er septembre
  2023 ; à deux ans de l'âge légal, puis à soixante ans pour les pensions prenant effet
  depuis le 1er septembre 2025 ; une quotité de 40 à 80 %, une fraction égale à ce qui
  manque de la quotité pour faire 100 %.
domaine: cumul
regimes: [regime_general, msa_salaries, msa_non_salaries, cancava, organic, rsi, cnavpl,
  fonction_publique_etat, cnracl, fspoeie, agirc_arrco, ircantec]
etape: liquider_chaque_regime
face: droit
etat: pas_encore_modelisee
lit:
- la quotité de l'activité à temps partiel gardée, et ses changements
- l'âge, et la durée d'assurance tous régimes
- la date de la demande de la pension complète
ecrit:
- la pension provisoire de chaque régime de base, et la fraction qui en est servie
- la pension complète, liquidée à la cessation d'activité
dates_qui_decident:
- liquidation.date_effet
versions:
