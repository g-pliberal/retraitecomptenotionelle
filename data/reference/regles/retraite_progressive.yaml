  moteur: >-
    completer reçoit les pensions provisoires de la retraite progressive, sous
    lesquelles la pension complète ne descend pas, et qu'elle vaut sans recalcul
    (initiales, recalcul). Les lignes à temps partiel portent leur quotité
    (AnneeCarriere.quotite) ; le traitement de référence se lit à temps plein
    (salaire_de_reference).
historique:
- >-
  2026-09-29 — née avec le domaine des départs multiples, de la fiche
  cumul_emploi_retraite_et_retraite_progressive, qui ne porte plus que le cumul.
- >-
  2026-09-29 — appliquée, approchée, dans les deux moteurs (étape 3 du domaine) : la
  demande examinée à sa date, la pension provisoire liquidée et sa fraction servie
  jusqu'au départ, la pension complète recalculée et bornée par la provisoire
  revalorisée, les années à temps partiel. Ses textes relus le même jour ont corrigé
  trois lectures : les libéraux et les avocats ne la demandent que depuis 2023, la
  pension de libéral d'un salarié se liquide avec la sienne depuis 1988, et la pension
  complète du fonctionnaire n'a pas de plancher.
- >-
  2026-10-10 — le traitement de référence à temps plein, aussi quand l'année du départ
  n'a pas de ligne, dans les deux moteurs. Le fonctionnaire qui part un 1er janvier, et
  l'agent radié des cadres avant de liquider, liquidaient le revenu de leur dernière
  année à sa quotité : née le 1er janvier 1963, à 70 % depuis ses soixante et un ans,
  partie au 1er janvier 2027, l'assurée liquidait 29 631,12 € de traitement au lieu de
  42 330,16 €. La conversion des droits acquis à la bascule du 1er janvier 2026 en sort
  corrigée (feuille de route, action 135, note du 10 octobre 2026 sur le traitement de
  janvier).
- >-
  2026-10-19 — confrontée au parcours « Retraite progressive » d'Union Retraite (action
  89) : l'âge, la durée, les quotités et la fraction concordent. Deux écarts s'y ajoutent,
  déclarés sans être codés : la fraction d'un non-salarié servie au 1er janvier qui suit
  la demande, et la retraite progressive que les décrets de la SNCF, de la RATP et de la
  Banque de France ouvrent à leurs agents, et que le modèle leur refuse.
- >-
  2026-10-28 — le plancher de la pension complète se compare à la pension qui porte la
  surcote parentale, dans les deux moteurs (fiche surcote_parentale, action 159, étape
  9) : la caisse compare la pension provisoire, revalorisée, à la somme des éléments de
  la pension complète, la surcote comprise, et sert la plus élevée (circulaire Cnav
  2018/31, 8.2). Le modèle relevait la pension au plancher, puis la surcotait.
effet: >-
  Les salariés, les indépendants et, depuis 2023, les fonctionnaires, les libéraux et les
  avocats qui passent à temps partiel en fin de carrière. Une salariée née en 1965,
  entrée à vingt ans au salaire moyen, à 60 % depuis novembre 2025 (le témoin
  progressive_salariee_2025), touche 40 % de sa pension provisoire, 9 522,70 € par an
  en euros de 2025, en plus de son salaire à temps partiel ; à son départ à
  soixante-quatre ans, sa pension complète est de 31 114,77 €, contre 32 221,46 € si
  elle avait travaillé à temps plein. Jusqu'au 29 septembre 2026, le modèle n'en
  calculait aucune.
