intitule: >-
  Fermetures de 2023 (RATP, IEG, clercs, Banque de France, CESE), réformes 2023-2026
  des sections libérales, de la MSA, de Mayotte, de Saint-Pierre-et-Miquelon, des
  collectivités du Pacifique.
etat: transcrite
effet: >-
  Populations petites ; chaque fiche dit ce qu'elle ne porte pas (regimes.md, limites.md
  § 4).
sources:
  lu_le: 2026-09-17
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Mayotte : la fiche est indexée par année, non par génération ; relire le décret
    n° 2026-345, article 3 (62 ans et 6 mois de 1963 à 1965 jusqu'à 63 ans et 9
    mois pour 1969) et vérifier les dernières périodes. La réforme agricole de 2026
    a sa fiche, pension_non_salaries_agricoles_2026.
