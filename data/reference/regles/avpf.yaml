schema_version: 1
id: avpf
intitule: >-
  Assurance vieillesse des parents au foyer : pendant l'interruption pour enfant, depuis
  le 1er juillet 1972, un salaire porté au compte du régime général sur une assiette
  forfaitaire de 169 heures par mois du SMIC du 1er juillet de l'année précédente.
regimes: [msa_salaries, regime_general]
etat: transcrite
effet: >-
  Carrières interrompues pour enfant. L'assiette est celle que la Cnav publie, date par
  date, de juillet 1972 à 2026 ; le modèle portait 1 820 heures du SMIC de janvier de
  l'année, 9 à 10 % de trop peu depuis 1982, 12,5 % avant, et une assiette avant 1972,
  quand l'AVPF n'existait pas. Depuis le 6 novembre 2026 (action 175, H7), le père ne
  la reçoit que depuis le 1er janvier 1985 : le modèle lui portait au compte l'assiette
  de toute année d'éducation depuis juillet 1972, 3 037,70 € pour 1978.
lit:
- la période d'éducation que la personne déclare (interruption education_enfant), son
  année et sa part de l'année
- le sexe de la personne (sexe)
ecrit:
- le salaire porté au compte du régime général pour l'année (revenu_avpf de la ligne)
dates_qui_decident:
- revenu.annee
# Les versions forment un partage de l'année portée au compte (`revenu.annee`), non du
# début de la période d'éducation (relecture R-H7, écart 3) : un père au foyer de 1983
# à 1987 a l'AVPF de 1985 à 1987, comme l'exposé de la Cnav le veut (« Depuis le
# 01/01/1985 »). L'assiette est mensuelle : de l'année 1972, seuls comptent les mois
# depuis juillet ; la borne de juillet 1979, celle du seul père qui a un handicapé à
# charge, que le modèle ne sert pas, coupe aussi une année. Le moteur ne lit pas les
# versions : l'assiette datée de la Cnav, sommée mois par mois, ouvre l'AVPF en juillet
# 1972 (`ANNEE_CREATION_AVPF`), et `ANNEE_AVPF_DES_HOMMES` celle du père en 1985, par
# l'année de la ligne (macro.py, macro.js ; `_ligne_annuelle`, `ligneAnnuelle`).
