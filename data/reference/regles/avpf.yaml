  - id: LEGIARTI000006768734
    article: >-
      décret n° 85-830, l'article que LEGI numérote 1er (relecture R-H7, écart 7) : il
      renvoie aux « articles 1er et 2 du présent décret », il n'est donc pas l'article
      1er du Journal officiel, dont l'index JORF ne garde que la notice ; son numéro au
      JO ne se lit pas
    en_vigueur: 1985-08-04
    citation: >-
      « A titre transitoire, est également affilié à l'assurance vieillesse du régime
      général de sécurité sociale, dans les conditions fixées aux articles 1er et 2 du
      présent décret *affiliation*, la personne isolée et, pour un couple, l'un ou
      l'autre de ses membres n'exerçant pas d'activité professionnelle, ayant à charge au
      moins un enfant de moins de trois ans *âge limite* conçu avant le 1er janvier 1985
      *date* »
  - id: LEGIARTI000006742941
    article: L. 381-1 CSS
    en_vigueur: 1985-12-21
    citation: >-
      « La personne isolée et, pour un couple, l'un ou l'autre de ses membres n'exerçant
      pas d'activité professionnelle, bénéficiaire du complément familial, de
      l'allocation au jeune enfant ou de l'allocation parentale d'éducation , est
      affilié obligatoirement à l'assurance vieillesse du régime général de sécurité
      sociale » ; et, pour le handicap, sans « isolée » (relecture R-H7, écart 7) : « En
      outre, est affilié obligatoirement à l'assurance vieillesse du régime général de
      sécurité sociale, pour autant que ses ressources ou celles du ménage ne dépassent
      pas le plafond du complément familial et que cette affiliation ne soit pas acquise
      à un autre titre, la personne et, pour un couple, l'un ou l'autre de ses membres :
      1°) ayant la charge d'un enfant handicapé [...] ; 2°) ou assumant, au foyer
      familial, la charge d'un handicapé adulte [...] »
