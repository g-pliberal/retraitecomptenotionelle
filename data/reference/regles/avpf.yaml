approximations:
- version: hommes_ayant_la_charge_d_un_handicape
  ecart: >-
    le père qui avait au foyer, de juillet 1979 à 1984, un enfant ou un adulte
    handicapé était affilié ; la saisie ne dit pas le handicap, et le modèle ne lui
    sert rien. Sur toute la période, 28 153,42 € portés au compte en moins : six fois
    286,700195 € (1979), douze fois 321,050008, 369,935834, 441,807923, 506,002680 et
    563,971419 € (1980 à 1984), assiettes de la Cnav
- version: l_un_ou_l_autre_parent
  ecart: >-
    NON TRANCHÉ, du 1er janvier au 3 août 1985 : la caisse affilie le père « Depuis le
    01/01/1985 », lecture que le modèle suit ; le décret n° 73-88, dans sa rédaction en
    vigueur du 5 janvier au 4 août 1985 (LEGIARTI000006761986), ne nomme que « les
    femmes isolées » et « les mères de famille », et le texte de la loi n° 85-17 du 4
    janvier 1985, qui pourrait avoir changé L. 242-2 dès janvier, ne se lit qu'au
    fac-similé. Sous la lecture du décret, le père d'une année 1985 entière perd sept
    mois d'assiette, 7 × 614,210992 = 4 299,48 € portés au compte en moins (7 370,53 €
    au lieu de 3 071,05 €), si son affiliation prend effet au 1er août
sources:
  lu_le: 2026-11-06
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Relire l'assiette de chaque 1er janvier (circulaire Cnav « Revalorisation du Smic »,
    cnav_assiette_avpf.py). En 2026, la circulaire 2025/33 fixe 2 031,38 € par mois, 169
    fois le SMIC de janvier 2026 et non celui de juillet 2025 que R. 381-3 désigne :
    voir si la caisse s'en explique.
  - >-
    LE PÈRE n'a l'AVPF que depuis le 1er janvier 1985 dans les deux moteurs (action
    175, H7 ; versions ci-dessus). Restent au fac-similé du Journal officiel : L. 242-2
    de l'ancien code tel que la loi n° 72-8 le rédige (JO du 5 janvier 1972), l'article
    1er d'origine du décret n° 73-88 (JO du 28 janvier 1973), celui du décret n°
    80-1068 (JO du 26 décembre 1980), la loi qui « complète » L. 242-2 pour les hommes
    après le 1er juillet 1979 (circulaire Cnav 25/79), introuvable dans les notices de
    l'index JORF, et la loi n° 85-17 du 4 janvier 1985, qui dira si le père est affilié
    dès janvier 1985 ou au 4 août 1985 (approximation non tranchée) ; la lettre
    ministérielle du 13 février 1979, jointe à la circulaire 25/79, que l'API ne sert
    pas. Ni la condition de ressources, ni le handicap à charge de 1979 à 1984, ni
    l'assiette ramenée, pour le bénéficiaire de la prestation partagée d'éducation à
    taux partiel, à vingt ou à cinquante pour cent selon le taux servi, ne se saisissent
    (action 175, étape 4, « Carrière : cotisations-salaires »).
  - >-
    CANDIDAT (action 175, H7) : une année d'éducation valide quatre trimestres
    (`trimestres_assimiles` de education_enfant, periodes_non_travaillees.csv), que
    l'AVPF la couvre ou non : la mère avant juillet 1972, le père avant 1985. Un père né
    en 1955, au foyer de 1980 à 1984, garde 160 trimestres et 18 194,73 € par an au
    lieu de 140 et 13 472,38 € (portage, carrière simple, salaire moyen, départ à 62
    ans). À corriger dans les deux moteurs, la classe entière, après lecture des règles
    de la fonction publique que la même ligne sert (colonne services_fonction_publique).
