- id: hommes_ayant_la_charge_d_un_handicape
  statut: lue
  textes:
  - reference: >-
      lettre ministérielle du 13 février 1979, Bureau des prestations familiales, signée
      Pierre Schopflin, sur le troisième alinéa de L. 242-2 ; lue par l'API de la base de
      législation de la Cnav (LE_MIN_13021979.aspx). Une lettre, non un texte : elle agit
      « dans l'attente d'une modification législative »
    lu_le: 2026-11-06
    citation: >-
      « Aux termes de cet article, la possibilité d'un telle affiliation est réservée aux
      femmes et mères de famille. Toutefois dans des cas extrêmement rares, des hommes
      assument la charge d'une épouse ou d'un enfant handicapé. » ; « Dans ces
      conditions et dans l'attente d'une modification législative sur ce point, je
      souhaite que les Caisses d'Allocations Familiales procèdent à l'affiliation et
      prennent en charge les cotisations de ces personnes à partir du 1er juillet 1979.
      Une telle mesure ne serait pas rétroactive. » ; « l'assurance vieillesse
      obligatoire ne peut bénéficier à plus d'une personne par foyer au titre du
      troisième alinéa de l'article L 242-2. »
  - reference: circulaire Cnav 25/79 du 6 mars 1979, lue par l'API de la base de législation
    citation: >-
      « A compter du 1er juillet 1979 les Caisses d'Allocation Familiales sont
      autorisées à procéder à l'affiliation à l'assurance vieillesse du régime général
      des hommes assumant la charge d'une épouse ou d'un enfant handicapé et à prendre en
      charge les cotisations correspondantes. » ; « en application du 3ème alinéa de
      l'article L. 242-2 du code de la Sécurité Sociale, non seulement les mères de
      famille et les femmes assumant au foyer la charge d'un handicapé, mais également
      les hommes ne trouvant dans cette situation. » ; « L'article L. 242.2 précité sera
      ultérieurement complété sur ce point. »
  - reference: exposé « Parent au foyer - AVPF » de la Cnav, version du 24 octobre 2025
    citation: >-
      « Du 01/07/1979 au 31/12/1984, les hommes étaient affiliés uniquement s'ils
      assumaient la charge d'un enfant ou d'un adulte handicapé. »
  - id: LEGIARTI000006760068
