schema_version: 1
id: avpf
intitule: >-
  Assurance vieillesse des parents au foyer : pendant l'interruption pour enfant, depuis
  le 1er juillet 1972, un salaire porté au compte du régime général sur une assiette
  forfaitaire de 169 heures par mois du SMIC du 1er juillet de l'année précédente.
regimes: [msa_salaries, regime_general]
etat: transcrite
effet: >-
  Carrières interrompues pour enfant. L'assiette est celle que la Cnav publie, date par
  date, de juillet 1972 à 2026 ; le modèle portait 1 820 heures du SMIC de janvier de
  l'année, 9 à 10 % de trop peu depuis 1982, 12,5 % avant, et une assiette avant 1972,
  quand l'AVPF n'existait pas.
sources:
  lu_le: 2026-10-14
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Relire l'assiette de chaque 1er janvier (circulaire Cnav « Revalorisation du Smic »,
    cnav_assiette_avpf.py). En 2026, la circulaire 2025/33 fixe 2 031,38 € par mois, 169
    fois le SMIC de janvier 2026 et non celui de juillet 2025 que R. 381-3 désigne :
    voir si la caisse s'en explique.
  - >-
    LE PÈRE, que le modèle affilie comme la mère : toute période d'éducation que la
    saisie déclare depuis juillet 1972 porte l'assiette au compte, quel que soit le
    sexe. La caisse n'affilie l'homme que depuis le 1er juillet 1979, et jusqu'au 31
    décembre 1984 seulement s'il assume la charge d'un enfant ou d'un adulte handicapé ;
    depuis le 1er janvier 1985, comme la femme (exposé « Parent au foyer - AVPF »,
    version du 24 octobre 2025 ; circulaire Cnav 25/79 du 6 mars 1979). Le décret n°
    73-88 ne nomme que « les mères de famille et les femmes » de 1978 à 1980
    (LEGIARTI000006761985), « les femmes isolées » encore dans sa rédaction du 5 janvier
    1985 (LEGIARTI000006761986), « les personnes isolées » et « celui des conjoints ou
    concubins » depuis celle du 4 août 1985 (LEGIARTI000006761987) ; L. 381-1, à sa
    codification, « la personne isolée et, pour un couple, l'un ou l'autre de ses
    membres ». Lire la loi de 1979 et la loi n° 85-17 du 4 janvier 1985, dont l'index
    de la DILA n'a que la notice, puis ne servir l'AVPF au père, dans les deux moteurs,
    que depuis la date que les textes fixent, l'exception du handicap d'avant 1985
    déclarée. Ni la condition de ressources, ni l'assiette ramenée, pour le bénéficiaire de la
    prestation partagée d'éducation à taux partiel, à vingt ou à cinquante pour cent selon
    le taux servi, ne se saisissent (action 175, étape 4, « Carrière :
    cotisations-salaires »).
  lectures:
  - type: legifrance
    reference: L. 381-1 CSS
    date: 2023-09-01
  - type: legifrance
    reference: >-
      R. 381-3 CSS, rédactions de 1985 à 2002 (LEGIARTI000006750080 à 006750083 : le SMIC
      multiplié par les cinquante-deux douzièmes de la durée hebdomadaire légale, au 1er
      juillet de l'année précédente), d'octobre 2002 (LEGIARTI000006750084) et de
      septembre 2023 (LEGIARTI000047961951) : « 169 fois le salaire horaire minimum de
      croissance en vigueur au 1er juillet de l'année civile précédente »
    date: 2026-10-05
  - type: circulaire_cnav
    reference: >-
      barème « Assurance vieillesse des parents au foyer (AVPF) » de la base de
      législation, par son API : l'assiette mensuelle du 1er juillet 1972 (667,32 F) au
      1er janvier 2026 (2 031,38 €) ; circulaire 2025/33, point 2.7
    url: https://legislation.lassuranceretraite.fr/#/bareme?file_leaf_ref=cotisation_salaire_avpf_bar.aspx
    date: 2026-10-05
  - type: jorf
    reference: loi n° 72-8 du 3 janvier 1972, « allocation de la mère au foyer » (JORFTEXT000000509305)
    date: 1972-01-05
  - type: legifrance
    reference: >-
      décret n° 73-88 du 26 janvier 1973, article 3 (LEGIARTI000006761990, de 1973 à
      1982) : la cotisation « est assise sur une assiette forfaitaire correspondant par
      mois à 173,33 fois le montant du salaire horaire minimum de croissance [...] en
      vigueur au 1er juillet de l'année civile précédente » ; article 1er
      (LEGIARTI000006761985) : les bénéficiaires « sont affiliées obligatoirement à
      l'assurance vieillesse du régime général ». Les périodes de 1972 à 1982 du régime
      général la comptent depuis le 14 octobre 2026.
    date: 2026-10-14
  - type: legifrance
    reference: >-
      décret n° 73-88, article 1er, rédactions du 1er janvier 1978
      (LEGIARTI000006761985 : « les mères de famille et les femmes »), du 5 janvier 1985
      (LEGIARTI000006761986 : « les femmes isolées ») et du 4 août 1985
      (LEGIARTI000006761987 : « les personnes isolées », « celui des conjoints ou
      concubins ») ; L. 381-1 CSS, rédaction du 21 décembre 1985 (LEGIARTI000006742941),
      lus dans l'index LEGI : le père n'y entre qu'en 1985
    date: 2026-11-03
textes_a_rattacher:
- reference: L. 381-1 CSS
- id: LEGIARTI000047961951
  reference: R. 381-3 CSS, l'assiette forfaitaire
code:
  moteur: >-
    `_ligne_annuelle` porte à la ligne non cotisée d'une période qui l'ouvre —
    l'éducation d'un enfant (colonne `avpf` de
    `legislation/periodes_non_travaillees.csv`) — le salaire de l'assurance vieillesse
    des parents au foyer, à sa part de l'année : `DonneesMacro.revenu_avpf` somme les
    assiettes mensuelles que la Cnav publie, date par date, du 1er juillet 1972 au 1er
    janvier 2026 (`assiette_avpf`), rien avant juillet 1972 (`ANNEE_CREATION_AVPF`), et
    au-delà du barème 169 heures par mois du SMIC du 1er juillet de l'année précédente
    (`HEURES_AVPF_PAR_MOIS`, `smic_horaire_au_1er_juillet`). `salaire_de_reference`
    porte ce salaire au compte des périodes qui déclarent `avpf`, au régime général
    depuis 1972, aux salariés agricoles pour les pensions prenant effet depuis le 1er
    avril 1983 (`date_effet`), et en compte les trimestres avec les cotisés dans la
    moyenne d'avant juillet 1995 ; `liquider` en mesure l'effet, la ligne `avpf` de la
    cascade.
  python: >-
    carriere.py : _ligne_annuelle ; donnees/macro.py : DonneesMacro,
    DonneesMacro.revenu_avpf, DonneesMacro.assiette_avpf,
    DonneesMacro.smic_horaire_au_1er_juillet, ANNEE_CREATION_AVPF, HEURES_AVPF_PAR_MOIS
    ; droit/liquider.py : salaire_de_reference ; droit/liquidation.py : liquider
  javascript: >-
    moteur/js/carriere.js : ligneAnnuelle ; moteur/js/macro.js : DonneesMacro,
    DonneesMacro.revenuAvpf, DonneesMacro.smicHoraireAu1erJuillet, ANNEE_CREATION_AVPF,
    HEURES_AVPF_PAR_MOIS ; moteur/js/droit/liquider.js : salaireDeReference ;
    moteur/js/droit/liquidation.js : liquider
  parametres: >-
    legislation/assiette_avpf.csv : date_effet, assiette_mensuelle ;
    legislation/periodes_non_travaillees.csv : avpf ; regimes/msa_salaries.yaml,
    regimes/regime_general.yaml : avantages_non_contributifs, date_effet
  tests:
  - tests/test_liquidation.py
  - tests/test_salaire_annuel_moyen.py
  - tests/test_simulateur.py
