- reference: >-
    décret n° 65-773, article 8 (LEGIARTI000006368193, 5° : services de L. 5, 1°
    et 3°) ; décret n° 2003-1306, articles 8 (LEGIARTI000047633135), 13 (LEGIARTI000047633115)
    et 64 (LEGIARTI000006400936)
- reference: >-
