approximations: []
presomptions:
  pension_d_invalidite_de_la_periode: >-
    la pension d'invalidité de l'assuré que la carrière finit en invalidité, quand il ne
    la date pas
sources:
  lu_le: 2026-09-30
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 30 septembre 2026 avec le domaine de l'invalidité et de l'inaptitude
    (docs/architecture.md, § 11), à la demande du propriétaire. Le moteur ne la calcule
    pas encore : il lui faut la pension d'invalidité dans la chronologie (étape 2 du
    domaine), puis le départ induit à l'âge et son plancher (étape 3).
  - >-
    À lire : l'article du code de 1956 qui reprend l'article 62 de l'ordonnance de 1945
    jusqu'à la recodification de 1985, et la loi n° 83-430 du 31 mai 1983 elle-même,
    dont l'index ne porte que les titres ; les règles des salariés agricoles (code
    rural), qui suivent le régime général par renvoi ; le règlement d'invalidité des
    travailleurs indépendants de 2023 (article 29), qui sert un complément différentiel
    jusqu'à leur pension d'invalidité.
  lectures:
  - type: legifrance
    reference: >-
      L. 341-15 (1985, 2003, 2008, 2023), L. 341-16 (1985, 2003, 2010, 2020, 2023),
      L. 341-17 (2016, 2023), R. 341-22 (1985, 2011, 2023), D. 341-1 (1986, 2017, 2023),
      L. 351-1-5 (2023) et D. 634-10 (1990, 2011, 2020, 2023) CSS, dans l'index LEGI du
      dépôt mis à jour au 30 septembre 2026
    date: 2026-09-30
  - type: autre
    reference: >-
      ordonnance n° 45-2454 du 19 octobre 1945, articles 62 à 65, lue dans la base
      législative de la Cnav (ORD_452454_19101945), l'index JORF n'en portant que le titre
    url: https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=ORD_452454_19101945.aspx
    date: 2026-09-30
  - type: autre
    reference: >-
      circulaire Cnav n° 2018-18 du 1er août 2018, « Passage à la retraite des assurés
      titulaires d'une pension d'invalidité » : substitution au premier jour du mois qui
      suit l'âge légal, « quelle que soit la date de dépôt de la demande » ; retraite «
      calculée au taux maximum de 50 %, quelle que soit la durée d'assurance », portée
      au minimum contributif, puis comparée à l'AVTS ou à la pension d'invalidité
      d'avant le 31 mai 1983 ; l'invalide qui travaille, sa retraite au titre de
      l'inaptitude à sa demande, comparée à celle de l'âge légal revalorisée ; le
      demandeur d'emploi, six mois de plus
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2018_18_01082018.pdf
    date: 2026-09-30
  - type: autre
    reference: >-
      circulaire Cnav n° 2023-25 du 28 novembre 2023, « Passage à la retraite des
      assurés bénéficiaires d'une pension d'invalidité à compter du 1er septembre
      2023 » : la substitution à soixante-deux ans ; « si la pension d'invalidité avait
      été supprimée pour raisons médicales, l'assuré n'est plus considéré comme
      ex-invalide » ; au-delà de l'âge du taux plein automatique, la demande n'est plus
      celle d'un ex-invalide
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2023_25_28112023.pdf
    date: 2026-09-30
  - type: service_public
    reference: >-
      fiche F672, « Pension d'invalidité de la Sécurité sociale », vérifiée le 1er avril
      2026 : « L'âge légal de départ à la retraite pour inaptitude est de 62 ans. Vous
      percevez alors une pension de retraite à partir du 1er jour du mois qui suit celui
      au cours duquel vous avez atteint l'âge légal » ; qui travaille garde sa pension
      d'invalidité « après 62 ans et jusqu'à 67 ans »
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F672
    date: 2026-09-30
textes_sans_effet:
- {id: LEGIARTI000006736513, article: "D. 341-1 CSS", en_vigueur: 1986-01-29,
   motif: "le contrôle trimestriel des droits des invalides, sans effet sur la pension substituée"}
historique:
- >-
  2026-09-30 — née avec le quatrième domaine, l'invalidité et l'inaptitude, ouvert à la
  demande du propriétaire ; de la fiche inaptitude_invalidite_penibilite_amiante, qui
  la portait sans versions.
effet: >-
  Les titulaires d'une pension d'invalidité à l'âge légal : 0,90 million de retraités
  partis au taux plein à ce titre fin 2016 (DREES, EIR). Le modèle compte leurs années
  d'invalidité en trimestres assimilés, mais ne les fait pas partir à l'âge de la
  substitution, et les décote s'ils n'ont pas la durée.
