schema_version: 1
id: pension_d_invalidite_substituee
intitule: >-
  La pension d'invalidité du régime général et des régimes alignés prend fin à l'âge
  légal — soixante ans jusqu'en 2011, l'âge de L. 161-17-2 ensuite, soixante-deux ans
  depuis le 1er septembre 2023 — et la pension de vieillesse allouée en cas
  d'inaptitude au travail la remplace d'office, au premier jour du mois qui suit :
  taux plein quelle que soit la durée, et un plancher, la pension d'invalidité d'avant
  le 31 mai 1983 ou l'allocation aux vieux travailleurs salariés. L'invalide qui
  travaille garde depuis 2010 sa pension d'invalidité jusqu'à sa demande, au plus tard
  à l'âge du taux plein automatique, et sa retraite ne peut être inférieure à celle
  de la substitution.
domaine: age
regimes: [regime_general, msa_salaries, cancava, organic, rsi]
etape: echeancier
face: droit
etat: pas_encore_modelisee
lit:
- la pension d'invalidité de l'assuré, sa date d'effet et le régime qui la sert
- l'activité exercée à l'âge légal, et la demande de retraite de l'invalide qui travaille
- l'indemnisation du chômage à l'âge légal, et l'activité des six mois qui le précèdent
ecrit:
- un départ induit du régime général et des régimes alignés, au premier jour du mois qui
  suit l'âge, de motif « invalidite », liquidé au taux plein
- le plancher de la pension substituée, que l'étape « compléter tous régimes » applique
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension substituée
# (§ 4.1). La substitution elle-même ne change pas depuis 1945 ; changent l'âge
# où elle se fait, son plancher, et ce que peut l'invalide qui travaille.
versions:
- id: ordonnance_1945
  statut: lue
  textes:
  - {id: JORFTEXT000000333985, article: "ordonnance n° 45-2454 du 19 octobre 1945, article 62",
     publie_le: 1945-10-20}
  nee_de: JORFTEXT000000333985
  bornes:
    liquidation.date_effet: [null, 1983-06-01]
  contenu:
    droit: >-
      « La pension d'invalidité prend fin à l'âge de 60 ans. Elle est remplacée, à
      partir de cet âge, par la pension de vieillesse allouée en cas d'inaptitude au
      travail. Toutefois, la pension de vieillesse ne peut en aucun cas, être inférieure
      à la pension d'invalidité dont bénéficie l'invalide à l'âge de soixante ans »
      (article 62) ; la pension de vieillesse de l'inapte, c'est le taux de soixante-cinq
      ans dès soixante ans (fiche inaptitude_au_travail)
    plancher: la pension d'invalidité servie à soixante ans
    parametres:
      age: 60
      plancher: pension_d_invalidite
      invalide_qui_travaille: aucune_derogation
  exemples: aucun trouvé
- id: plancher_avts_1983
  statut: lue
  textes:
  - {id: LEGIARTI000006742610, article: "L. 341-15 CSS", en_vigueur: 1985-12-21}
  - {id: LEGIARTI000006742611, article: "L. 341-15 CSS", en_vigueur: 2003-08-22}
  - {id: LEGIARTI000019959677, article: "L. 341-15 CSS", en_vigueur: 2008-12-19}
  - {id: LEGIARTI000006742612, article: "L. 341-16 CSS", en_vigueur: 1985-12-21}
  - {id: LEGIARTI000006742613, article: "L. 341-16 CSS", en_vigueur: 2003-08-22}
  - {id: LEGIARTI000006749330, article: "R. 341-22 CSS", en_vigueur: 1985-12-21}
  - {id: JORFTEXT000000504456, article: "loi n° 83-430 du 31 mai 1983", publie_le: 1983-06-01}
  nee_de: JORFTEXT000000504456
  bornes:
    liquidation.date_effet: [1983-06-01, 2010-03-01]
  contenu:
    droit: >-
      « La pension d'invalidité prend fin à l'âge minimum auquel s'ouvre le droit à
      pension de vieillesse. Elle est remplacée à partir de cet âge par la pension de
      vieillesse allouée en cas d'inaptitude au travail. La pension de vieillesse
      substituée à une pension d'invalidité ne peut être inférieure au montant de
      l'allocation aux vieux travailleurs salariés » (L. 341-15) ; l'entrée en
      jouissance est « fixée au premier jour du mois suivant le soixantième anniversaire
      du pensionné » (R. 341-22)
    plancher: >-
      l'allocation aux vieux travailleurs salariés ; « les titulaires d'une pension
      d'invalidité liquidée avant le 31 mai 1983 peuvent prétendre à une pension de
      vieillesse qui ne peut être inférieure à la pension d'invalidité dont bénéficiait
      l'invalide à cet âge »
    invalide_qui_travaille: >-
      la pension substituée « n'est concédée que si l'assuré n'y fait pas opposition » ;
      qui s'y oppose voit ses droits « ultérieurement liquidés, lorsqu'il en fait la
      demande, dans les conditions prévues aux articles L. 351-1 et L. 351-8 », sans
      pouvoir recevoir moins que la pension substituée (L. 341-16)
    parametres:
      age: 60
      plancher: avts
      plancher_invalidite_avant: 1983-05-31
      invalide_qui_travaille: opposition
  exemples: aucun trouvé
- id: invalide_qui_travaille_2010
  statut: lue
  textes:
  - {id: LEGIARTI000021537943, article: "L. 341-16 CSS", en_vigueur: 2010-03-01}
  nee_de: LEGIARTI000021537943
  bornes:
    liquidation.date_effet: [2010-03-01, 2011-07-01]
  contenu:
    droit: la version plancher_avts_1983, hors l'invalide qui travaille
    invalide_qui_travaille: >-
      « la pension de vieillesse allouée au titre de l'inaptitude au travail n'est
      concédée que si l'assuré en fait expressément la demande. L'assuré qui exerce une
      activité professionnelle et qui, à l'âge prévu au premier alinéa de l'article
      L. 351-1, ne demande pas l'attribution de la pension de vieillesse substituée
      continue de bénéficier de sa pension d'invalidité jusqu'à la date pour laquelle il
      demande le bénéfice de sa pension de retraite et au plus tard jusqu'à l'âge
      mentionné au 1° de l'article L. 351-8 » ; sa retraite, au titre de l'inaptitude
      (lettre ministérielle du 4 octobre 2010, point 61), « ne peut pas être inférieure
      à celle dont il serait bénéficiaire si la liquidation de ses droits avait été
      effectuée dans les conditions fixées à l'article L. 341-15 »
    parametres:
      age: 60
      plancher: avts
      plancher_invalidite_avant: 1983-05-31
      invalide_qui_travaille: maintien_jusqu_a_la_demande
      maintien_au_plus_tard: age_annulation_decote
  exemples: aucun trouvé
- id: age_legal_2011
  statut: lue
  textes:
