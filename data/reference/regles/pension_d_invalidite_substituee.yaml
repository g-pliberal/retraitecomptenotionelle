code:
  python: >-
    droit/invalidite.py : substitution, plancher_de_la_substitution,
    categorie_de_la_pension, pension_d_invalidite_servie ; droit/completer.py :
    completer ; droit/departs.py : departs_et_demandes ; scenarios/actuel.py :
    Invalidites
  javascript: >-
    moteur/js/droit/invalidite.js : substitution, plancherDeLaSubstitution,
    categorieDeLaPension, pensionDInvaliditeServie ; moteur/js/droit/completer.js :
    completer ; moteur/js/droit/departs.js : departsEtDemandes ; moteur/js/regimes.js :
    Invalidites
  parametres: >-
    contenu.parametres de chaque version : age, plancher, invalide_qui_travaille,
    plancher_invalidite_avant, taux_des_categories, annees_du_salaire_moyen,
    maintien_au_plus_tard, maintien_du_demandeur_d_emploi_mois
  tests: >-
    tests/test_invalidite.py ; les témoins invalidite_* des simulations, et la page
    simuler_invalidite_substituee, dans les deux moteurs
  moteur: >-
    departs_et_demandes donne la date de l'unité du régime général. L'étape
    « compléter tous régimes » oppose le plancher (plancher, plancher_invalidite_avant)
    à la pension du régime qui servait la pension d'invalidité, portée au minimum
    contributif, et sert le plus haut ; la pension d'invalidité d'avant juin 1983 se
    calcule au taux de sa catégorie (taux_des_categories), sur les meilleures ou les
    dernières années (annees_du_salaire_moyen) que la règle du salaire annuel moyen de
    sa date retient.
historique:
- >-
  2026-09-30 — née avec le quatrième domaine, l'invalidité et l'inaptitude, ouvert à la
  demande du propriétaire ; de la fiche inaptitude_invalidite_penibilite_amiante, qui
  la portait sans versions.
- >-
  2026-09-30 — lue par le moteur, à la troisième étape du domaine : la pension de
  vieillesse de l'ex-invalide commence d'office à l'âge de la substitution, avant son
  départ déclaré s'il le faut, au taux plein de l'inapte (fiche inaptitude_au_travail) ;
  l'invalide qui travaille part à sa demande, au plus tard à l'âge du taux plein
  automatique ; le demandeur d'emploi indemnisé, six mois après l'âge au plus tard.
- >-
  2026-10-01 — rejouée par deux exemples de la circulaire Cnav n° 2024/25, à la
  quatrième étape du domaine.
- >-
  2026-10-24 — le plancher servi (action 138, étape 4) : la pension du régime qui
  servait la pension d'invalidité, portée au minimum contributif, puis à l'AVTS, ou à la
  pension d'invalidité liquidée avant le 31 mai 1983, au taux de sa catégorie, déclarée
  ou présumée (présomption categorie_de_la_pension_d_invalidite) ; la version
  ordonnance_1945 coupée au 30 mars 1961, quand le décret n° 61-272 porte le deuxième
  groupe de 40 % à 50 %.
effet: >-
  Les titulaires d'une pension d'invalidité à l'âge légal : 0,90 million de retraités
  partis au taux plein à ce titre fin 2016 (DREES, EIR). Le modèle les fait partir à
  l'âge de la substitution, au taux plein, et leurs complémentaires sans coefficient ;
  l'allocation de solidarité aux personnes âgées au même âge. Leur pension ne descend
  pas sous l'AVTS, ni sous leur pension d'invalidité d'avant juin 1983 : l'ex-invalide de
  1980 des témoins, au prorata de 141 trimestres sur 150, est porté à sa pension
  d'invalidité, + 6,1 %.
