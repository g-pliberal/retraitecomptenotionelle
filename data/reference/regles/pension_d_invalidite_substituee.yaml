approximations:
- ecart: >-
    le plancher se compare à la date d'effet, puis suit la pension ; depuis 1983, la
    caisse compare la pension à l'AVTS « chaque fois que l'un d'entre eux augmentera »,
    l'AVTS se fixant par décret à ses propres dates (circulaire Cnav n° 84/83, II)
  effet: >-
    l'ex-invalide porté à l'AVTS : de juillet 1983 à janvier 2004, l'AVTS a crû de 3,8 %
    de moins que les pensions, et le modèle le sert jusqu'à 3,8 % au-dessus d'elle ; de
    2004 à 2026, de 1,3 % de plus (barème de la Cnav, revalorisations de L. 161-23-1) ;
    sans effet sur ses ressources tant que l'allocation de solidarité aux personnes
    âgées, qui le porte à 12 523 euros par an en 2026, lui est servie
- ecart: >-
    la pension d'invalidité d'avant le 31 mai 1983 se calcule au 1er janvier de l'année
    où elle commence, par les coefficients des salaires de la pension de vieillesse que
    les mêmes arrêtés fixent, sur les salaires de son régime, puis se revalorise comme
    les pensions ; son maximum, 30 % ou 50 % du plafond (décret n° 61-272, article 3 bis),
    ne lui est pas opposé
  effet: >-
    nul pour le maximum, le salaire annuel moyen de salaires plafonnés, revalorisés
    comme les pensions, restant sous le plafond de son année, qui suit les salaires ; le
    mois de la pension d'invalidité, non mesuré
- ecart: >-
    les pensions d'invalidité du régime général et des salariés agricoles, que la
    liquidation unique compare ensemble à sa retraite (circulaire Cnav n° 2018-18, 7.1),
    n'en font qu'une : celle du régime de l'affiliation qui la précède
  effet: non mesuré
- ecart: >-
    la pension d'invalidité proratisée des règlements européens, qui n'est pas une
    pension d'invalidité au sens de L. 341-15 et n'ouvre ni l'AVTS ni la pension
    d'invalidité d'avant 1983 en plancher (circulaire Cnav n° 73/99), n'est pas
    distinguée : le modèle sert le plancher à toute pension d'invalidité
  effet: non mesuré
- ecart: >-
    l'indépendant ex-invalide n'a pas son plancher, l'allocation aux vieux travailleurs
    non salariés, ni « l'allocation différentielle » qui porte ses retraites à sa pension
    d'invalidité de travailleur indépendant (exposé de la Cnav, « Retraite substituée à
    pension d'invalidité » ; circulaire Cnav n° 2023-22, 2.4.2)
  effet: >-
    l'allocation de solidarité aux personnes âgées le porte plus haut que l'allocation
    aux vieux travailleurs non salariés ; non mesuré pour l'allocation différentielle
- ecart: >-
    l'activité et l'indemnisation du chômage se lisent sur la ligne principale de
    l'année où l'âge est atteint, et non au mois ; la condition d'activité des six mois
    qui précèdent l'âge (D. 341-1) n'est pas contrôlée
  effet: non mesuré
- version: [invalide_qui_travaille_2010, age_legal_2011, demandeurs_d_emploi_2017,
    soixante_deux_ans_2023]
  ecart: >-
    la retraite de l'invalide qui travaille n'est pas comparée à celle qu'il aurait eue
    à l'âge de la substitution, revalorisée (L. 341-16 ; circulaire Cnav n° 2018-18)
  effet: >-
    nul tant que l'activité poursuivie ne fait pas baisser le salaire annuel moyen ;
    non mesuré sinon
- ecart: >-
    le régime qui sert la pension d'invalidité ne date pas la substitution : elle se fait
    dans le régime général et les régimes alignés de la carrière, quel qu'il soit ; les
    salariés agricoles la font par renvoi au code de la sécurité sociale, non lu. Le
    plancher, lui, se compare à la pension du régime que les affiliations de l'année où
    la pension d'invalidité commence désignent, le régime général ou les salariés
    agricoles
  effet: non mesuré
presomptions:
  pension_d_invalidite_de_la_periode: >-
    la pension d'invalidité de l'assuré que la carrière finit en invalidité, quand il ne
    la date pas
  opposition_a_la_substitution: >-
    avant le 1er mars 2010, l'invalide qui travaille encore à l'âge de la substitution
    s'y oppose, et demande sa pension à son départ
  categorie_de_la_pension_d_invalidite: >-
    la pension d'invalidité que l'assuré ne classe pas est de la première catégorie
    quand il travaille à l'âge de la substitution, de la deuxième sinon : elle fixe
    le taux de la pension d'invalidité d'avant le 31 mai 1983 qui reste un plancher
sources:
  lu_le: 2026-10-24
  prochaine_relecture: 2027-04-24
  a_relire:
  - >-
    Ouverte le 30 septembre 2026 avec le domaine de l'invalidité et de l'inaptitude
    (docs/architecture.md, § 11), à la demande du propriétaire, et lue par le moteur à
    sa troisième étape : le départ du régime général et des régimes alignés à l'âge de
    la substitution, au taux plein. L'exemple de la circulaire Cnav n° 2024/25 la
    rejoue depuis la quatrième étape, la substitution d'office et le cumul intégral à
    l'âge légal de la génération ; celui de la circulaire RSI n° 2011/017, d'avant le
    relèvement de 2011 et à diffusion restreinte, ne se rejoue pas.
  - >-
    Le plancher, servi depuis le 24 octobre 2026 (action 138, étape 4) : l'article 62 de
    l'ordonnance de 1945 devenu L. 322 du code de 1956, que le décret n° 61-272 récrit en
    règlement (article 1er) ; les lois n° 83-430 et n° 84-575, dont l'index ne porte que
    les titres, lues dans les circulaires Cnav n° 84/83 et n° 94/84 qui les citent. Aucun
    exemple chiffré ne compare la pension au plancher ; la lettre ministérielle n° 6742/S
    du 5 septembre 1962, qui revalorise comme une pension la pension substituée au taux
    de l'AVTS, porte aussi la rente des assurances sociales de 1940, hors du modèle, et
    ne se rejoue pas.
  - >-
    À lire : la première rédaction de l'article 2 du décret n° 61-272, que l'index LEGI
    ne garde que depuis le 23 février 1984 ; les règles des salariés agricoles (décret
    n° 50-1225, article 54 ; code rural), qui suivent le régime général par renvoi ; le
    règlement d'invalidité des travailleurs indépendants de 2023 (article 29), qui sert
    un complément différentiel jusqu'à leur pension d'invalidité. La comparaison des
    majorations de 1972 à 1982 au plancher reste à faire (fiche
    majorations_forfaitaires_1972_1982).
  lectures:
  - type: legifrance
    reference: >-
      L. 341-4, L. 341-5 (1985), R. 341-4 (1985, 1993, 2011, 2022), R. 341-5 (1985, 2011)
