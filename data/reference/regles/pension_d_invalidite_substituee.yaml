      d'invalidité « au plus tard jusqu'à l'âge prévu au premier alinéa de l'article
      L. 351-1 augmenté de six mois » (D. 341-1), puis la pension de vieillesse la
      remplace au premier jour du mois suivant (circulaire Cnav n° 2018-18, 2.2.2.1)
    parametres:
      age: age_legal_par_generation
      plancher: avts
      plancher_invalidite_avant: 1983-05-31
      invalide_qui_travaille: maintien_jusqu_a_la_demande
      maintien_au_plus_tard: age_annulation_decote
      maintien_du_demandeur_d_emploi_mois: 6
  exemples: aucun trouvé
- id: soixante_deux_ans_2023
  statut: lue
  textes:
  - {id: LEGIARTI000047453137, article: "L. 341-15 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047453121, article: "L. 341-16 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047453130, article: "L. 341-17 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047633241, article: "R. 341-22 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047634682, article: "D. 341-1 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047449233, article: "L. 351-1-5 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047634707, article: "D. 634-10 CSS", en_vigueur: 2023-09-01}
  nee_de: LEGIARTI000047453137
  bornes:
    liquidation.date_effet: [2023-09-01, null]
  contenu:
    droit: >-
      « La pension d'invalidité prend fin à l'âge prévu à l'article L. 351-1-5 », soit
      soixante-deux ans (D. 351-1-14), quand l'âge légal monte à soixante-quatre ;
      l'entrée en jouissance « au premier jour du mois suivant la date à laquelle le
      pensionné atteint l'âge prévu à l'article L. 351-1-5 » (R. 341-22), « quelle que
      soit la date de dépôt effective de la demande » (circulaire Cnav n° 2023-25, 1.5).
      La pension d'invalidité des travailleurs indépendants, d'incapacité partielle au
      métier ou d'invalidité totale et définitive, est remplacée au même âge (D. 634-10)
    invalide_qui_travaille: >-
      la version invalide_qui_travaille_2010, au même âge ; ses droits sont liquidés
      « dans les conditions prévues aux articles L. 351-1, à l'exclusion de son premier
      alinéa, et L. 351-8 » ; en cas de seconde pension, la demande est celle de la
      première liquidation (L. 341-16)
    parametres:
      age: 62
      plancher: avts
      plancher_invalidite_avant: 1983-05-31
      invalide_qui_travaille: maintien_jusqu_a_la_demande
