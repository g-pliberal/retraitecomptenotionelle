  contenu:
    droit: >-
      la version invalide_qui_travaille_2010, à l'âge de L. 161-17-2 : l'entrée en
      jouissance « au premier jour du mois suivant la date à laquelle le pensionné
      atteint l'âge prévu à l'article L. 161-17-2 » (R. 341-22), soixante ans et
      quatre mois pour les nés du second semestre 1951, jusqu'à soixante-deux ans pour
      les nés depuis 1955
    parametres:
      age: age_legal_par_generation
      plancher: avts
      plancher_invalidite_avant: 1983-05-31
      invalide_qui_travaille: maintien_jusqu_a_la_demande
      maintien_au_plus_tard: age_annulation_decote
  exemples: aucun trouvé
- id: demandeurs_d_emploi_2017
  statut: lue
  textes:
  - {id: LEGIARTI000033689553, article: "L. 341-17 CSS", en_vigueur: 2016-12-25}
  - {id: LEGIARTI000034736797, article: "D. 341-1 CSS", en_vigueur: 2017-09-01}
  - {id: LEGIARTI000041398892, article: "L. 341-16 CSS", en_vigueur: 2020-01-01}
  nee_de: LEGIARTI000034736797
  bornes:
    liquidation.date_effet: [2017-09-01, 2023-09-01]
  contenu:
