    droit: la version ordonnance_1945, au taux nouveau du deuxième groupe
    plancher: >-
      la pension d'invalidité servie à soixante ans, que le décret n° 61-272
      majore : « Pour les invalides du deuxième groupe [...], la pension est égale à
      50 p. 100 du salaire défini à l'article 2 » (article 3), ceux du troisième ce
