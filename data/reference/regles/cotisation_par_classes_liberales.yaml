      à l'article 4 peuvent demander, dans les conditions prévues par lesdits statuts, à
      opter pour l'une des deux classes spéciales I et II. »
  nee_de: LEGIARTI000006770087
  bornes:
    revenu.annee: [1980-01-01, 1987-01-01]
  contenu:
    droit: >-
      CAVEC : six classes, de 48 à 180 points, selon le revenu, la classe supérieure sur
