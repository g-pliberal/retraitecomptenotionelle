  textes:
  - id: LEGIARTI000006770087
    article: décret n° 53-506, article 2 (CAVEC), du 1er janvier 1980 au 13 mars 1987
    en_vigueur: 1980-01-01
    citation: >-
      « Le régime d'assurance vieillesse complémentaire comporte six classes de
      cotisations : Classe 4 correspondant à 48 points de retraite ; Classe 5
      correspondant à 60 points de retraite ; Classe 7 correspondant à 84 points de
      retraite ; Classe 10 correspondant à 120 points de retraite ; Classe 12
      correspondant à 144 points de retraite ; Classe 15 correspondant à 180 points de
      retraite. La cotisation due par chaque assujetti est celle de la classe à laquelle
      correspond, dans les conditions fixées par les statuts prévus à l'article 5, son
      revenu professionnel net provenant de son activité libérale. Les adhérents peuvent
      toutefois opter, dans les conditions prévues auxdits statuts, pour la classe
      immédiatement supérieure à celle qui correspond à leur revenu. La classe III est
      maintenue pour les adhérents qui justifient de l'insuffisance de l'ensemble de leurs
      revenus professionnels salariés et non-salariés dans les conditions fixées par les
      statuts. »
  - id: LEGIARTI000006767473
    article: décret n° 79-262, article 2 (Cipav), jusqu'au 21 juin 1985
    en_vigueur: 1979-01-01
  - id: LEGIARTI000006767474
    article: décret n° 79-262, article 2 (Cipav), du 21 juin 1985 au 30 décembre 2012
    en_vigueur: 1985-06-21
    citation: >-
      « La cotisation ainsi fixée peut faire l'objet d'un appel réduit dans les conditions
      fixées par les statuts prévus à l'article 5. Le taux d'appel, qui ne peut être
      inférieur à 80 p. 100 de la cotisation ci-dessus prévue, est proposé par le conseil
      d'administration de la section professionnelle susmentionnée, lors de l'élaboration
      du budget prévisionnel du régime. »
  - id: LEGIARTI000006776821
    article: décret n° 50-1318, article 2 (CARPV), du 4 août 1982 au 1er janvier 1993
    en_vigueur: 1982-08-04
    citation: >-
