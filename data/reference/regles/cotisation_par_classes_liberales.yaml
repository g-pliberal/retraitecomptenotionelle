  effet: non mesuré
- version: [carpv_de_2014, statuts_de_2016, cavec_de_2019, cipav_de_2021, carpv_de_2022, sans_la_cipav_2023, reglements_de_2026]
  regime: carpv_complementaire
  ecart: >-
    le modèle proratise la cotisation d'une année incomplète à la part de l'année que la
    ligne couvre, au mois ; la CARPV la doit « à compter du premier jour du trimestre civil
    suivant son installation » (statuts de 2014) et la proratise « au nombre de trimestres
    d'activité libérale » (statuts de 2021, décret depuis le 1er juillet 2026)
  effet: non mesuré ; nul pour une ligne qui commence et finit avec un trimestre civil
- version: [classes_de_2013, carpv_de_2014, statuts_de_2016, cavec_de_2019, cipav_de_2021, carpv_de_2022, sans_la_cipav_2023, reglements_de_2026]
  regime: cavec_complementaire
  textes: [LEGIARTI000026885098, LEGIARTI000052567925, LEGIARTI000054168240, JORFARTI000037363871]
  ecart: >-
    POINT NON TRANCHÉ (action 130, E15). Depuis le 1er janvier 2013, « En cas de cumul de
    l'activité libérale et salariée, les cotisations afférentes au présent régime sont
    appelées dans les conditions prévues à l'alinéa précédent, sans pouvoir être
    inférieures à la cotisation en classe C » (décret n° 53-506, article 2, onzième
    alinéa, dans ses trois rédactions depuis) ; le modèle range le cumulant sur son seul
    revenu libéral. Lecture A : le décret vaut pour tout cumul d'un exercice libéral et
    d'un salariat, la classe C au moins, et le modèle sert trop peu. Lecture B :
    « l'activité … salariée » est celle de l'expert-comptable salarié de l'alinéa suivant,
    et les statuts du 20 août 2018 ne font de la classe C qu'une option (« L'affilié a la
    possibilité d'opter pour la classe C, dès lors que le revenu TNS situe l'affilié dans
    une classe inférieure à celle-ci ») : le modèle, qui ne sert aucune option, est juste
  effet: >-
    cas posé (moteur Python, réglages par défaut), née en mars 1960, salariée du privé non
    cadre depuis 22 ans (niveau de salaire 1), expert-comptable en cumul de 55 ans à la
    liquidation à 65 ans (niveau 0,1) : le modèle range chaque année en classe A (revenu libéral de
    5 353,54 € en 2023, 760 € de cotisation en 2024) et sert 621,59 € par an de pension de
    la CAVEC (cotisations revalorisées 7 462 € × 8,33 %). Lecture A : la classe C, 284
    points au lieu de 48 ; en 2024, 284 × 760 / 48 = 4 496,67 € de cotisation, 3 736,67 €
    de plus, 311,26 € de pension annuelle à 8,33 %, avant revalorisation ; sur toute la
    carrière, 621,59 × 284 / 48 = 3 677,73 €, soit 3 056,14 € par an servis en moins, si
    le minimum vaut aussi les deux années de classe A d'office des statuts. Lecture B : 0 €
effet: >-
  Les vétérinaires, les experts-comptables et commissaires aux comptes, et les affiliés de
  la Cipav jusqu'en 2022. L'article 2 des trois décrets est lu version par version. Depuis
  le 14 octobre 2026, la grille de chaque exercice est celle de son texte à la Cipav (1979
  à 2022) et à la CAVEC (1980 à 2025) : les classes de l'article 2 dans sa rédaction de
  l'exercice, le montant que le décret annuel donne à la classe de référence, lu dans les
  index LEGI et JORF pour 38 exercices de la Cipav et 40 de la CAVEC, et les bornes que la
  caisse publie (Cipav 2019 et 2022, CAVEC 2022 à 2026)
  (`classes_cotisation_epoques.yaml`). Restent des conventions, chacune déclarée : un
  exercice sans décret lu (Cipav de 1979 à 1983 et 1989 ; CAVEC de 1980 à 1983, 1989 et
  2008) prend le montant lu le plus proche ramené au rapport des plafonds ;
  les bornes des autres exercices sont les publiées les plus proches ramenées de même, et
  une époque de moins de classes (six à la Cipav jusqu'en 2012, six puis sept à la CAVEC
  jusqu'en 2007) en prend les premières, rang pour rang. Les classes 5, 7 et 10 de la
  Cipav n'entrent qu'en 1980, 1981 et 1982, comme le texte de 1979 les rend obligatoires.
  En 2008, la CAVEC prend le montant de 2009 ramené : le décret n° 2008-1303 fixe la classe
  A à 2 262 €, le prix du point de la classe 4 de 2007, qui ferait 70 687 € la classe H.
  À la CAVEC d'avant 1980, que le décret de 1953 faisait choisir, la grille de 1980
  ramenée tient lieu. CARPV : la grille du moteur a la forme du texte depuis 2016 (trois
  classes à 16, 20 et 24 points, quatre à 17, 21, 25 et 28 points depuis 2026) ; avant
  1998, un nombre d'actes selon l'âge, sans égard au revenu, où la grille de 1998 ramenée
  tient lieu ; de 1998 à 2015, depuis le 16 octobre 2026, la grille du texte : classes B,
  C et D à 480, 600 et 720 actes médicaux vétérinaires, au taux d'appel que le décret
  annuel fixe et que le moteur lit pour chacun des dix-huit exercices (77 % de 1998 à
  2001, 104 % en 2015). La valeur de l'acte, que l'ordre fixait, n'est publiée nulle
  part : CONVENTION, la valeur d'achat du point de 2016 (446 €) prolonge l'appel de 2015,
  et l'acte de chaque exercice antérieur en est tiré au rapport des plafonds (14,08 € en
  2015) ; les bornes, 4 500 et 6 000 actes, sont celles du livret de 2024 ramenées. Le
  barème réduit des moins de trente-trois ans de 1997 (décret n° 97-1112, article 3) n'est
  pas porté. L'année de revenu est celle du texte, et la classe de début d'activité
  aussi : l'avant-dernière année à la CAVEC de 2008 à 2018 et à la CARPV de 1998 à 2021,
  la précédente à la CAVEC depuis 2019, à la CARPV depuis 2022 et à la Cipav de 2016 à
  2020, l'année même à la Cipav depuis 2021 ; la classe A les deux premières années à la
  CAVEC de 2012 à 2018, la première depuis 2019, la classe B les deux premières à la CARPV
  de 2014 à 2021, la première depuis 2022, la classe A les deux premières à la Cipav de
  2016 à 2020. Le moteur reconnaît le régime d'une autre année à l'affiliation de la
  ligne. Avant les statuts lus (Cipav avant 2016, CAVEC avant 2008), l'année même.
  Les grilles du texte abaissent les pensions des 24 cas types de la Cipav et de la CAVEC,
  de 2 % à 20 % au scénario 1 ; l'année de revenu et la classe de début en déplacent
  quinze de plus, de moins de 1 % pour la plupart. La grille de la CARPV de 1998 à 2015
  abaisse celles des sept cas types vétérinaires, de 3,7 % à 14,4 % au scénario 1.
sources:
  lu_le: 2026-11-06
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Point non tranché (action 130, E15, 6 novembre 2026) : le minimum de la classe C du
    cumul de l'activité libérale et salariée à la CAVEC, depuis le 1er janvier 2013
    (décret n° 53-506, article 2, onzième alinéa), que le modèle ne sert pas ; les deux
    lectures et leur chiffrage sont à l'approximation de `classes_de_2013` et suivantes.
    À trancher par le propriétaire, ou par la CAVEC : appelle-t-elle la classe C à
    l'expert-comptable libéral qui est aussi salarié hors de la profession ?
  - >-
    Hors de cette fiche, relevés par E9 (action 130) et lus le 6 novembre 2026 : la classe
    3 d'office des deux premières années de la CAVP (décret n° 49-580, article 2, dans la
    rédaction du décret n° 2026-418, article 4, JORFARTI000054153444 : « La cotisation
    est appelée en classe 3 pendant les deux premières années de son affiliation ou de sa
    réaffiliation après au moins un trimestre d'interruption de son activité ») : la CAVP
    n'est pas de ses régimes ; la fiche `decret_2026_418_liberaux` la porte, le modèle
    servant à toutes les classes la même fraction en répartition (`cavp_complementaire`).
    La classe des notaires sur la moyenne de leurs produits de N - 4 à N - 2, son coût
    selon la classe, l'âge et la date de prestation de serment (décret n° 49-578, article
    2-3, dans la rédaction du décret n° 2026-418, article 2, JORFARTI000054153399 : « Le
    montant de la cotisation de chaque notaire est déterminé en fonction de sa classe,
    de son âge à la date de changement de classe et de sa date de prestation de serment,
    selon les modalités définies à l'annexe 1 du présent décret ») : la section B de la
    CPRN, que le modèle ne calcule pas (`cprn_complementaire.yaml`, `manque`) ; aucune
    fiche de règle ne la porte.
  - >-
    Fait le 14 octobre 2026 pour la Cipav et la CAVEC, le 16 octobre pour la CARPV de 1998 à
    2015, le 28 octobre pour les décrets de 1984, de 1985 et de 1991
    (`classes_cotisation_epoques.yaml`). Restent : la valeur de l'acte médical
    vétérinaire (l'acte médical ordinal) de 1997 à 2015, que fixait le Conseil supérieur de
    l'ordre des vétérinaires et qu'aucun texte du Journal officiel ne porte (index LEGI et
    JORF, 16 octobre 2026) : la demander à l'ordre ou à la CARPV, ou la chercher dans ses
    bulletins, et remplacer la convention de 2016 prolongée ; le barème réduit des moins de
    trente-trois ans (décret n° 97-1112, article 3, II : 304, 380 et 456 AMV) ; les
    décrets de la Cipav de 1979 à 1983 (n° 79-372, 80-404, 81-831, 82-678, 83-651), de la
    CAVEC de 1980 à 1983 (n° 80-439, 81-828, 82-674, 83-619) et des deux de 1989 (n° 89-313),
    dont les index n'ont que le titre ou le sommaire : leur texte n'est qu'au fac-similé du
    Journal officiel, que le réseau de la session n'atteint pas (au propriétaire, le 28
    octobre 2026) ; la date d'effet de la grille A à H de la CAVEC, qu'aucun texte publié ne
    donne (le décret n° 2008-85, les statuts de 2008 et leur modification de 2010), et le
    montant de 2 262 € de 2008 : à demander à la CAVEC (au propriétaire). Les
    montants publiés de la classe H (17 583 € en 2019 à la Cipav, 20 925 € en 2022 à la
    CAVEC) s'écartent de quelques euros du multiple de la classe A que le moteur appelle
    (17 589 €, 20 937,50 €) : la caisse arrondit au point.
  - >-
    Chercher les autres millésimes de bornes dans ce que publient les caisses : guides de la
    CAVEC d'avant 2022 et de la Cipav d'avant 2019, livrets de la CARPV d'avant 2024 (celui
    de 2021 n'est plus sur carpv.fr) ; la valeur de l'acte médical que fixait l'ordre des
    vétérinaires, et celle de l'indice de référence, que les livrets de 2024 à 2026 ne
    donnent pas. L'Internet Archive n'a pas répondu le 27 septembre 2026.
  - >-
    Fait le 14 octobre 2026 : l'année de revenu et la classe de début d'activité
    (`classes_cotisation_epoques.yaml`, bloc `regles`). Restent : les statuts de la Cipav
    d'avant 2016 et de la CAVEC d'avant 2008, au Bulletin officiel, non lus ; la classe
    provisoire de la Cipav, que le moteur ne sert pas, puisqu'elle est régularisée ; la
    date d'effet des statuts de 2018 de la CAVEC, que le moteur prend aux cotisations de
    2019.
  - >-
    CAVEC d'avant 1980 : le décret de 1953 fait opter l'assujetti, « dans les conditions
    fixées par les statuts », pour l'une de cinq classes, sans nommer le revenu ; quand la
    classe a suivi le revenu, avant 1980, n'est pas lu. Les quinze décrets qui modifient
    l'article 2 de 1955 à 1974 n'ont que leur titre dans l'index JORF ; Gallica n'a pas le
    Journal officiel après 1955, ni le numéro du 5 février 1955 (décret n° 55-188) ; les
    statuts d'avant 2008 sont au Bulletin officiel du ministère, non lu. Après la phase 8 :
    ne servir à la CAVEC d'avant 1980 une grille de revenu que si ses statuts, une fois lus,
    l'écrivent.
  - >-
    Après la phase 8 : corriger les notes des périodes. CARPV : la grille y est dite
    « indexée sur les prix », le moteur la ramène par le rapport des plafonds ; les décrets
    modificatifs sont le n° 97-1112 du 26 novembre 1997 et le n° 2015-712 du 22 juin 2015.
    Cipav : la version de 1985 ne touche pas l'option, elle ouvre un « appel réduit », à
    80 % au moins, et porte de 15 à 25 % la cotisation facultative du conjoint.
  lectures:
  - type: jorf
    reference: >-
      action 130, E15 : l'article 2 des trois décrets, chacune de ses rédactions lue dans
      l'index LEGI du dépôt (à jour au 2 novembre 2026), et les statuts dans l'index JORF
      (au 3 novembre), avec la date de publication et l'article qui les date : CAVEC, 22
      février 2008 (publié le 1er mars), 9 février 2012 (23 février), 27 mars 2012 (14
      avril), 20 août 2018 (4 septembre), aucun ne fixant de date ; CARPV, 16 avril 2014
      (17 mai), 2 novembre 2015 (1er décembre), 18 octobre 2021 (« entrent en vigueur le
      1er janvier 2022 ») ; Cipav, 18 décembre 2015 (« entre en vigueur le 1er janvier
      2016 »), 16 mars 2021 (30 mars, sans date). Les statuts de la CAVEC de 2018, partie
      2, article 3, 5 : le cumul d'un revenu non salarié et d'un revenu salarié, la classe
      C sur option ; le décret n° 53-506, article 2, depuis 2013 : la classe C au moins
    date: 2026-11-06
  - type: legifrance
    reference: >-
      décrets annuels des cotisations des complémentaires libérales, de 1984 à 2025, lus
      exercice par exercice dans les index LEGI et JORF du dépôt : la classe 1, puis A, de
      la Cipav de 1986 à 2022 (de « Classe 1 (classe de référence) 2 288 F », décret
      n° 86-1022, LEGIARTI000006769506, à « Cotisation forfaitaire de la classe A : 1 527
      euros », décret n° 2022-1633, LEGIARTI000046809720) ; de la CAVEC, la classe 4 de
      1984 à 2007 (« Classe 4 6.720 F », décret n° 84-447, LEGIARTI000006767447, à
      « Classe IV : 2 184 Euros », décret n° 2007-1437, LEGIARTI000006268615), la classe A
      de 2008 à 2025 (« Classe A : 2 262 € » en 2008, décret n° 2008-1303 ; « Classe A :
      480 euros » en 2009, décret n° 2009-1635, LEGIARTI000021537812 ; 782 euros en 2025).
      Les décrets de 2015, de 2017 et de 2018 fixent deux exercices, et ceux de 2018 et de
      2019 corrigent le second : la CAVEC passe de 631,20 € à 625,44 € pour 2018, de
      640,80 € à 639 € pour 2019. Chaque montant, avec son identifiant, est dans
      classes_cotisation_epoques.yaml. Le décret n° 2008-85 (JORFARTI000017991856) récrit
      l'article 2 de la CAVEC sans date d'effet
    date: 2026-10-14
  - type: legifrance
    reference: >-
      décrets annuels de la section des architectes, agréés en architecture, ingénieurs,
      techniciens, experts et conseils (Cipav), article 1 : « Pour l'année 1984, les montants
      des cotisations des six classes prévues à l'article 2 du décret n° 79-262 du 21 mars
      1979 susvisé sont fixés ainsi qu'il suit : Classe 1 2.038 F Classe 2 4.076 F Classe 3
      6.114 F Classe 5 10.190 F Classe 7 14.266 F Classe 10 20.380 F » (décret n° 84-442 du
      12 juin 1984, LEGIARTI000006767456) ; pour 1985, de « Classe 1 ... 2180 F » à « Classe
      10 ... 21800 F » (décret n° 85-1092 du 10 octobre 1985, LEGIARTI000006768801). Chaque
      classe est le multiple de la classe 1 que l'article 2 écrit. Lu dans l'index LEGI du
      dépôt
    date: 2026-10-28
  - type: jorf
    reference: >-
      décret n° 91-864 du 30 août 1991 (JORFTEXT000000882367), dont l'index JORF n'a sous son
      titre que le sommaire, et range les articles sous le « Décret du 3 septembre 1991
      portant délégation de signature », paru au même Journal officiel du 5 septembre :
      « Art. 1er. - Pour l'année 1991 les montants annuels des cotisations des régimes
      d'assurance vieillesse complémentaire des personnes non salariées des professions
      libérales sont fixés ainsi qu'il suit : Section professionnelle des architectes,
      agréés en architecture, ingénieurs, techniciens experts et conseils : Classe 1 (classe
      de référence) : 2772F » (JORFARTI000001376516) ; « Section professionnelle des
      experts-comptables et comptables agréés et des commissaires aux comptes : Classe 3 :
      6624 F ; Classe 4 : 8832 F », jusqu'à « Classe 18 : 39744 F » (JORFARTI000001183737).
      Ce sont les articles du n° 91-864 : leurs hausses sur 1990 (décret n° 90-311) sont
      celles que son sommaire annonce, « ENTRE 3,85% ET 5% A L'EXCEPTION DES SECTIONS
      PROFESSIONNELLES DES GEOMETRES-EXPERTS (+11,01%) ET DES CHIRURGIENS-DENTISTES
      (14,74%) » (de 9 504 F à 10 550 F, de 9 120 F à 10 464 F ; les infirmiers de 2 288 F à
      2 376 F, 3,85 %), la part proportionnelle des médecins passe de 2 à 5 %, et
      l'invalidité-décès des architectes et des experts-comptables reste à 572 F et de
      1 142 F à 3 426 F, comme il l'écrit
    date: 2026-10-28
  - type: jorf
    reference: >-
      les décrets annuels que l'index JORF ne porte que par leur titre ou leur sommaire, et
      l'index LEGI pas du tout, leur texte n'étant qu'au fac-similé du Journal officiel.
      Cipav : n° 79-372 du 2 mai 1979 (JORFTEXT000000702959), n° 80-404 du 4 juin 1980
      (JORFTEXT000000518282), « A COMPTER DU 01-01-1980 », n° 81-831 du 3 septembre 1981
      (JORFTEXT000000701112), n° 82-678 du 2 août 1982 (JORFTEXT000000686796, rectifié au
      Journal officiel du 7 septembre 1982, page 2726), n° 83-651 du 13 juillet 1983
      (JORFTEXT000000686082). CAVEC : n° 80-439 du 17 juin 1980 (JORFTEXT000000696609),
      « MONTANT DES COTISATIONS A COMPTER DU 01-01-1980 », n° 81-828 du 3 septembre 1981
      (JORFTEXT000000878448), n° 82-674 du 2 août 1982 (JORFTEXT000000859680, même
      rectificatif), n° 83-619 du 1er juillet 1983 (JORFTEXT000000507436). Les deux : n° 89-313
      du 11 mai 1989 (JORFTEXT000000522924), dont le sommaire nomme les huit sections
    date: 2026-10-28
  - type: jorf
    reference: >-
      CAVEC, la date d'effet de la grille A à H, que rien ne donne. Décret n° 2008-85 du 24
      janvier 2008 (JORFTEXT000017991848), ses quatre articles : l'intitulé, l'article 1er et
      l'article 2 du décret de 1953 récrits, l'exécution. Statuts approuvés le 22 février
      2008 (JORFARTI000018197778) : l'article 3.3 donne les huit classes et laisse au conseil
      d'administration « la cotisation correspondant à un point de retraite » ; l'article
      3.17 nomme les « points de retraite acquis avant la mise en œuvre des présents
      statuts », sans la dater. Arrêté du 26 novembre 2010 (JORFTEXT000023172855) : rien sur
      les classes
    date: 2026-10-28
  - type: legifrance
    reference: >-
      décret n° 50-1318 du 21 octobre 1950, article 2 (CARPV), ses onze versions. De 1950 à
      1997 (LEGIARTI000006776818, LEGIARTI000006776819, LEGIARTI000006776820,
      LEGIARTI000006776821, LEGIARTI000006776822) : « La cotisation annuelle des vétérinaires
      est calculée en fonction d'un certain nombre d'actes médicaux, compte tenu de l'âge des
      intéressés ». Version du 2 décembre 1997 (LEGIARTI000006776823) : « Chaque vétérinaire
      doit verser sa cotisation dans une classe déterminée selon son revenu professionnel
      libéral net imposable de l'avant-dernière année » ; classe B à 480 AMV sous 4 500 AMV
      de revenu, C à 600 AMV jusqu'à 6 000 AMV, D à 720 AMV au-delà, pour 16, 20 et 24
      points ; « Le taux d'appel des cotisations est fixé chaque année par décret ». Mêmes
      classes le 30 décembre 2012 (LEGIARTI000026885093). Version du 25 juin 2015
      (LEGIARTI000030774327) : « La cotisation annuelle est égale au prix d'achat du point
      (PA) multiplié par le nombre de points correspondant à la tranche de revenu », B 16 ×
      PA, C 20 × PA, D 24 × PA. Revenu « de l'année précédente » le 1er janvier 2022
      (LEGIARTI000044223137). Pour les périodes courant à compter du 1er janvier 2026
      (LEGIARTI000052567915, puis LEGIARTI000054168212 le 1er juillet 2026) : B 17, C 21,
      D 25 et E 28 × PA, E au-delà de 7 500 × IR, et « La cotisation est appelée sur la base
      de la classe B la première année civile d'activité ». Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      décret n° 53-506 du 21 mai 1953, article 2 (CAVEC), le texte qui fixe les classes.
      Version de 1980 (LEGIARTI000006770087) : « six classes de cotisations », de « Classe 4
      correspondant à 48 points de retraite » à « Classe 15 correspondant à 180 points de
      retraite », la cotisation étant « celle de la classe à laquelle correspond, dans les
      conditions fixées par les statuts prévus à l'article 5, son revenu professionnel net ».
      Version du 13 mars 1987 (LEGIARTI000006770088) : une septième, « Classe 18
      correspondant à 216 points de retraite ». Versions du 28 janvier 2008
      (LEGIARTI000018042862) et du 30 décembre 2012 (LEGIARTI000026885098) : « sept classes
      de cotisations », dont le texte énumère huit, de « Classe A correspondant à 48 points
