    article: décret n° 79-262, article 2 (Cipav), du 1er janvier 2013 au 1er janvier 2023
    en_vigueur: 2013-01-01
    citation: >-
      « comporte huit classes de cotisation : - la classe A portant attribution annuelle de
      36 points ; - la classe B portant attribution annuelle de 72 points ; - la classe C
      portant attribution annuelle de 108 points ; - la classe D portant attribution
      annuelle de 180 points ; - la classe E portant attribution annuelle de 252 points ;
      - la classe F portant attribution annuelle de 396 points ; - la classe G portant
      attribution annuelle de 432 points ; - la classe H portant attribution annuelle de
      468 points. Les montants des cotisations des classes B, C, D, E, F, G et H sont
      respectivement égaux à 2,3,5,7,11,12 et 13 fois le montant de la cotisation de la
      classe A. »
  - id: LEGIARTI000026885098
    article: décret n° 53-506, article 2 (CAVEC), du 30 décembre 2012 au 14 novembre 2025
    en_vigueur: 2012-12-30
    citation: >-
      « (1) Décret n° 2012-1485 du 27 décembre 2012, article 20 : Les onzième et
      quatorzième alinéas de l'article 2 du décret du 21 mai 1953 susvisé , dans leur
      rédaction résultant du présent décret, entrent en vigueur le 1er janvier 2013. » ;
      « son revenu d'activité tel que défini à l'article L. 131-6 du code de la sécurité
      sociale. En cas de cumul de l'activité libérale et salariée, les cotisations
      afférentes au présent régime sont appelées dans les conditions prévues à l'alinéa
      précédent, sans pouvoir être inférieures à la cotisation en classe C. (1) » ; « En
      cas de passage d'une activité salariée à une activité libérale, l'adhérent a la
      possibilité de maintenir sa cotisation en classe C ou D. Il est maintenu dans sa
      classe d'option pour les deux premières années civiles d'exercice de l'activité
      libérale. A défaut, il est inscrit d'office en classe A pour cette même période. »
  - id: LEGIARTI000026885093
