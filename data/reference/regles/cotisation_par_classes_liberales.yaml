    range l'assuré n'est pas lue : le modèle prend l'année même
  effet: non mesuré
- version: [cavec_de_2008, cavec_de_2012, carpv_de_2014, cavec_de_2019, cipav_de_2021]
  ecart: >-
    les statuts qui valent en cours d'année sont servis dès l'exercice de leur année (CAVEC
    le 2 mars 2008 et le 24 février 2012, CARPV le 18 mai 2014, Cipav le 31 mars 2021), ou
    de la suivante (CAVEC, le 5 septembre 2018, servis à l'exercice 2019) : les textes ne
    disent pas à quel exercice ils s'appliquent
  effet: non mesuré
- version: [avant_1979, cipav_de_1979, cavec_de_1980, cavec_de_1987, carpv_de_1998, cavec_de_2008, cavec_de_2012, classes_de_2013, carpv_de_2014, statuts_de_2016, cavec_de_2019, cipav_de_2021, carpv_de_2022, sans_la_cipav_2023, reglements_de_2026]
  ecart: >-
    le modèle ne sert aucune option, que rien ne lui dit prise : la classe supérieure (aux
    trois), les classes réduites de la CARPV sur demande depuis 1997, la classe III de la
    CAVEC pour les revenus insuffisants de 1980 à 2007, l'appel réduit de la Cipav de 1985
    à 2012, la cotisation facultative pour le conjoint survivant (Cipav 15 puis 25 %,
    CAVEC le tiers puis 30 %, CARPV)
  effet: nul pour qui n'a pas opté ; non mesuré sinon
- version: [cavec_de_2008, cavec_de_2012, classes_de_2013, carpv_de_2014, statuts_de_2016, cavec_de_2019, cipav_de_2021, carpv_de_2022, sans_la_cipav_2023, reglements_de_2026]
  ecart: >-
    le simulateur ne pose ni l'expert-comptable salarié inscrit à l'ordre, en classe C
    depuis 2008, ni le vétérinaire des 11°, 12° et 23° de L. 311-3, sur sa rémunération
