      section professionnelle des experts comptables ». L'index JORF n'a que le titre des
      quinze décrets qui modifient l'article 2 de 1955 (n° 55-188) à 1974 (n° 74-199), et le
      résumé du décret n° 80-439 : « POSSIBILITE POUR LES ADHERENTS D'OPTER POUR LA CLASSE
      IMMEDIATEMENT SUPERIEURE A CELLE QUI CORRESPOND A LEUR REVENU »
