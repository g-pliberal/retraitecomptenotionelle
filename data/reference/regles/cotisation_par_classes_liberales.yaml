schema_version: 1
id: cotisation_par_classes_liberales
intitule: >-
  Cotisation par classes de trois complémentaires libérales : un montant par classe de
  revenu, et non un taux, à la CAVEC, à la Cipav de 1979 à 2022 et à la CARPV depuis 1998 ;
  la CARPV appelait auparavant un nombre d'actes médicaux fixé selon l'âge.
regimes: [carpv_complementaire, cavec_complementaire, cipav_complementaire]
etat: approchee
etape: acquerir_les_droits
domaine: cotisations
lit:
- >-
  le revenu d'activité libérale de chaque exercice de la section, et celui de l'année que
  le texte désigne pour ranger l'assuré : l'avant-dernière, la précédente ou l'année même
  (`classes_cotisation_epoques.yaml`, bloc `regles`, `annee_de_revenu`)
- >-
  la première année civile d'activité dans la section, qui impose sa classe
  (`classe_de_debut`)
- >-
  le plafond annuel de la sécurité sociale, qui ramène les montants et les bornes des
  exercices dont le texte n'est pas lu
- la part de l'année que la ligne couvre, au mois
ecrit:
- >-
  la cotisation de l'exercice au régime complémentaire de la section, le montant de sa
  classe (`ConstructeurCompte._cotisation_par_classes`), portée au compte, que la
  liquidation convertit par le rendement du régime
dates_qui_decident:
# `revenu.annee` est l'exercice au titre duquel la cotisation est appelée : les versions
# le coupent au 1er janvier de l'exercice que chaque rédaction régit ; une rédaction en
# vigueur en cours d'année est dite à sa date, dans la version de l'exercice qu'elle
# touche le premier (approximation des statuts en cours d'année).
- revenu.annee
versions:
- id: avant_1979
  statut: supposee
  hypothese: >-
    CARPV : l'article 2 du décret n° 50-1318 compte la cotisation en actes médicaux selon
    l'âge, sans égard au revenu ; la valeur de l'acte, que l'ordre constate, n'est publiée
    nulle part, ni le nombre de points d'un acte ; le modèle sert la grille de 1998 ramenée.
    CAVEC : le décret n° 53-506 fait opter l'assujetti « dans les conditions fixées par
    les statuts » pour l'une de cinq classes (rédaction d'origine, lue au fac-similé du
    Journal officiel du 24 mai 1953 le 27 septembre 2026, `sources.lectures`, non relue :
    file des fac-similés) ; les quinze décrets qui modifient l'article 2 de 1955 à 1974
    n'ont que leur titre dans l'index ; le modèle sert la grille de 1980 ramenée, sur le
    revenu de l'année. Cipav : pas de régime avant 1979
  fiabilite: >-
    faible : ni la valeur de l'acte de la CARPV, ni les statuts de la CAVEC ne sont lus ;
    le modèle remplace, aux deux, un barème sans égard au revenu par une grille de revenu
  textes:
  - id: LEGIARTI000006776818
    article: décret n° 50-1318 du 21 octobre 1950, article 2 (CARPV), rédaction d'origine
    en_vigueur: 1950-10-24
    citation: >-
      « La cotisation annuelle des vétérinaires est calculée en fonction d'un certain
      nombre d'actes médicaux, compte tenu de l'âge des intéressés. La valeur moyenne de
      l'acte médical est constatée par le conseil supérieur de l'ordre des vétérinaires. »
  - id: LEGIARTI000006776819
    article: décret n° 50-1318, article 2, du 14 octobre 1954 au 20 août 1967
    en_vigueur: 1954-10-14
    citation: >-
      « Age : Moins de 35 ans Nombre d'actes : 50 Age : 35 ans à 65 ans Nombre d'actes :
      80 Age : Plus de 65 ans Nombre d'actes : 50 »
  - id: LEGIARTI000006776820
    article: décret n° 50-1318, article 2, du 20 août 1967 au 4 août 1982
    en_vigueur: 1967-08-20
    citation: >-
      « Age : Moins de trente-cinq ans Nombre d'actes : 95 Age : Trente-cinq ans à
      soixante-cinq ans Nombre d'actes : 152 Age : Plus de soixante-cinq ans : 95 »
  - id: JORFTEXT000000670150
    article: >-
      décret n° 53-506 du 21 mai 1953, article 2 (CAVEC), rédaction d'origine, au seul
      fac-similé du Journal officiel du 24 mai 1953
    publie_le: 1953-05-24
  nee_de: LEGIARTI000006776818
  bornes:
    revenu.annee: [null, 1979-01-01]
  contenu:
    droit: >-
      CARPV : un nombre d'actes selon l'âge, 50, 80 et 50 de 1954, 95, 152 et 95 de 1967,
      avant, de trente-cinq à soixante-cinq ans et après (un coefficient de réduction des
      moins de quarante-cinq ans jusqu'en 1956, de 15 à 5 % avant trente-cinq ans). CAVEC : l'une des classes I à V, de 12 à
      60 points, au choix de l'assujetti, aux conditions des statuts
    conditions: >-
      le modèle sert aux deux la grille la plus ancienne qu'il lit, ramenée au plafond, sur
      le revenu de l'année (approximations)
  exemples: aucun trouvé
- id: cipav_de_1979
  statut: supposee
  hypothese: >-
    comme `avant_1979` pour la CARPV et la CAVEC ; la Cipav range l'assuré sur son revenu
    « dans les conditions fixées par les statuts », que le Bulletin officiel porte seul :
    le modèle prend le revenu de l'année
  fiabilite: >-
    haute pour les classes de la Cipav, au texte ; faible pour l'année de revenu, et pour
    la CARPV et la CAVEC
  textes:
  - id: LEGIARTI000006767473
    article: décret n° 79-262 du 21 mars 1979, article 2 (Cipav), du 1er janvier 1979 au 21 juin 1985
    en_vigueur: 1979-01-01
    citation: >-
      « Le régime d'assurance vieillesse complémentaire institué par l'article 1er comporte
      six classes de cotisation : Classe 1 portant attribution de quatre points de
      retraite ; Classe 2 portant attribution de huit points de retraite ; Classe 3
      portant attribution de douze points de retraite ; Classe 5 portant attribution de
      vingt points de retraite ; Classe 7 portant attribution de vingt-huit points de
      retraite ; Classe 10 portant attribution de quarante points de retraite. Les montants
      des cotisations des classes 2, 3, 5, 7 et 10 sont respectivement égaux à deux, trois,
      cinq, sept et dix fois le montant de la cotisation de la classe 1. La cotisation due
      par chaque assujetti est celle de la classe à laquelle correspond, dans les
      conditions fixées par les statuts prévus à l'article 5, son revenu professionnel net
      provenant de l'activité libérale […]. A titre transitoire, les classes 5, 7 et 10 ne
      deviennent obligatoires en fonction du revenu professionnel qu'à compter du 1er
      janvier 1980 pour la classe 5, du 1er janvier 1981 pour la classe 7 et du 1er
      janvier 1982 pour la classe 10. Les adhérents peuvent toutefois opter dans les
      conditions prévues auxdits statuts pour la classe immédiatement supérieure à celle
      qui correspond à leur revenu. »
  - id: LEGIARTI000006776820
    article: décret n° 50-1318, article 2 (CARPV), du 20 août 1967 au 4 août 1982
    en_vigueur: 1967-08-20
  nee_de: LEGIARTI000006767473
  bornes:
    revenu.annee: [1979-01-01, 1980-01-01]
  contenu:
    droit: >-
      Cipav : les classes 1, 2 et 3 (4, 8 et 12 points), une, deux et trois fois la classe
      1, la classe 5 n'étant obligatoire qu'en 1980 ; CARPV et CAVEC, comme `avant_1979`
    conditions: >-
      le modèle sert à la Cipav en 1979 les trois premières classes (`epoques`, multiples
      1, 2 et 3), sur le revenu de l'année
  exemples: aucun trouvé
- id: cavec_de_1980
  statut: supposee
  hypothese: >-
    la CAVEC et la Cipav rangent l'assuré sur son revenu « dans les conditions fixées par
    les statuts », au seul Bulletin officiel : le modèle prend le revenu de l'année ; les
    décrets annuels de 1980 à 1983 n'ont dans l'index que leur titre ou leur sommaire ; la
