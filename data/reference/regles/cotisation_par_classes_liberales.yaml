  - type: jorf
    reference: >-
      CAVEC, statuts, index JORF. Arrêté du 22 février 2008 (JORFARTI000018197778), article
      3.3 : « Le conseil d'administration fixe, chaque année, les tranches de revenu
      professionnel correspondant aux différentes classes de cotisation ainsi que la
      cotisation correspondant à un point de retraite » ; article 3.4 : « en fonction de son
      revenu professionnel net provenant de l'ensemble des activités libérales de
      l'avant-dernière année ». Arrêté du 9 février 2012 (JORFARTI000025395367), article
      3.4 : « b) Sauf option pour la classe B, l'adhérent est inscrit d'office en classe A
      pour les deux premières années civiles d'exercice », que reprend l'arrêté du 27 mars
      2012 (JORFARTI000025687514). Arrêté du 20 août 2018 (JORFARTI000037363871), partie 2,
      article 2 : « Le conseil d'administration fixe, chaque année, les tranches de revenu
      professionnel issu de l'activité non salariée et correspondant aux différentes classes
      de cotisation » ; article 3 : « en fonction de son revenu d'activité provenant de
      l'ensemble des activités non salariées non agricoles de l'exercice précédent », « Sauf
      option pour la classe B, l'affilié est inscrit d'office en classe A pour sa première
      année civile d'exercice ». Avant 2008, les arrêtés d'approbation renvoient au Bulletin
      officiel : « L'arrêté du 13 mai 1994 sera publié intégralement au Bulletin officiel du
      ministère no 94-17 »
    date: 2026-09-27
  - type: jorf
