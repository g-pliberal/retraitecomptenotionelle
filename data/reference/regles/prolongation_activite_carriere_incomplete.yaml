sources:
  lu_le: 2026-10-10
  prochaine_relecture: 2027-10-10
  a_relire:
  - >-
    Avant 2004 : l'article 2 du décret n° 48-1907 du 18 décembre 1948, que le décret n°
    53-711 laisse aux fonctionnaires actifs dont la limite est inférieure à soixante-cinq
    ans, et les prolongations que la CNRACL comptait « dans les mêmes conditions » (décret
    n° 65-773, article 2) : lus, ils peuvent faire une version de plus.
  - >-
    « sous réserve de l'intérêt du service » : un refus est possible, que le simulateur
    ne connaîtra pas. L'étape 3 dira s'il la présume accordée quand le départ saisi la
    demande.
  lectures:
  - type: legifrance
    reference: >-
      loi n° 84-834, article 1-1, rédaction du 1er janvier 2004 (LEGIARTI000006450727) ; L.
      556-5 CGFP (LEGIARTI000044425138) ; L. 556-1, rédaction du 14 juin 2023
      (LEGIARTI000047452904). Lus dans l'index LEGI du dépôt
    date: 2026-10-10
  - type: service_public
    reference: >-
      fiche F12395 : « 10 trimestres maximum » (2 ans et demi), jusqu'au nombre de
      trimestres requis, sous réserve de « l'intérêt du service » et de l'aptitude physique,
      sans dépasser soixante-dix ans ; accordée « après application » des reculs pour
      enfants ; ouverte à l'actif, demande six mois avant sa limite
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F12395
    date: 2026-01-01
historique:
- >-
  2026-10-10 — née avec l'action 151, étape 2, avec la fiche `limite_age_fonction_publique`.
effet: >-
  Aucun aujourd'hui, le modèle n'appliquant pas la limite d'âge : il garde tout
  fonctionnaire en activité jusqu'au départ saisi, que sa durée soit complète ou non. La
  limite appliquée, le fonctionnaire entré tard pourra rester jusqu'à dix trimestres de
  plus, s'il lui manque cette durée.
