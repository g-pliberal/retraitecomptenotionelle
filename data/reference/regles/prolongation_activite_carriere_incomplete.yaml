schema_version: 1
id: prolongation_activite_carriere_incomplete
intitule: >-
  Le fonctionnaire civil qui atteint sa limite d'âge sans la durée de services et de
  bonifications du taux maximum (L. 13 CPCMR) peut, sur sa demande, sous réserve de
  l'intérêt du service et de son aptitude physique, prolonger son activité jusqu'à cette
  durée, dix trimestres au plus, après les reculs pour enfants ; la prolongation compte
  dans la constitution et la liquidation de sa pension. Depuis 2004 ; depuis le 14 juin
  2023, pas au-delà de soixante-dix ans.
domaine: age
regimes: [fonction_publique_etat, cnracl]
etape: preparer_la_chronologie
face: droit
etat: manquante
lit:
- la limite d'âge de l'emploi, reculée le cas échéant (fiches `limite_age_fonction_publique`
  et `recul_limite_age_enfants`)
- la durée des services liquidables à cette date, et la durée de L. 13 de sa génération
ecrit:
- la date où la prolongation finit, que la radiation des cadres suit
dates_qui_decident:
- age_atteint
versions:
- id: avant_2004
  statut: lue
  textes:
  - {id: LEGIARTI000006501737, article: "décret n° 53-711 du 9 août 1953, article 1er", en_vigueur: 1953-08-10}
  - {id: LEGIARTI000006362689, article: "L. 10 CPCMR", en_vigueur: 1964-12-01}
  nee_de: LEGIARTI000006501737
  bornes:
    age_atteint: [null, 2004-01-01]
  contenu:
    droit: >-
      aucune prolongation pour une carrière incomplète : depuis 1953, les limites d'âge
      « sont exclusives de toute prolongation au-delà de la limite d'âge résultant de
      textes législatifs ou réglementaires en vigueur », hors les reculs que le décret
      maintient (décret n° 53-711, article 1er), et « Les services accomplis
      postérieurement à la limite d'âge ne peuvent être pris en compte dans une pension,
      sauf dans les cas exceptionnels prévus par une loi » (L. 10)
  exemples: aucun trouvé
- id: loi_de_2003
  statut: lue
  textes:
  - {id: LEGIARTI000006450727, article: "loi n° 84-834, article 1-1", en_vigueur: 2004-01-01}
  nee_de: LEGIARTI000006450727
  bornes:
    age_atteint: [2004-01-01, 2022-03-01]
  contenu:
    droit: >-
      « Sous réserve des droits au recul des limites d'âge reconnus au titre des
      dispositions de la loi du 18 août 1936 [...], les fonctionnaires dont la durée des
      services liquidables est inférieure à celle définie à l'article L. 13 du code des
      pensions civiles et militaires de retraite peuvent, lorsqu'ils atteignent les limites
      d'âge applicables aux corps auxquels ils appartiennent, sur leur demande, sous réserve
      de l'intérêt du service et de leur aptitude physique, être maintenus en activité. La
      prolongation d'activité [...] ne peut avoir pour effet de maintenir le fonctionnaire
      concerné en activité au-delà de la durée des services liquidables prévue à l'article
      L. 13 du même code ni au-delà d'une durée de dix trimestres. Cette prolongation
      d'activité est prise en compte au titre de la constitution et de la liquidation du
      droit à pension »
    parametres:
      trimestres_au_plus: 10
  exemples: aucun trouvé
