      la même prolongation, « sur sa demande, lorsqu'il atteint la limite d'âge qui lui est
      applicable dans le corps ou le cadre d'emplois auquel il appartient [...], sous
      réserve de l'intérêt du service et de son aptitude physique », « ni au-delà d'une
      durée de dix trimestres » ; elle « intervient, le cas échéant, après application des
      possibilités de recul de la limite d'âge prévues aux articles L. 556-2 et L. 556-3 »
      (L. 556-5)
    parametres:
      trimestres_au_plus: 10
  exemples: aucun trouvé
