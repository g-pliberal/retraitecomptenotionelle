schema_version: 1
id: trimestres_au_revenu
intitule: >-
  Les régimes où le revenu de l'année, et lui seul, dit ses trimestres : « autant de
  trimestres que le salaire annuel [...] représente de fois » le seuil de l'année, « avec
  un maximum de quatre trimestres par année civile », sans regarder les mois d'activité ;
  ailleurs, et avant 1946, les mois de l'année bornent ses trimestres civils. L'année de
  la date d'effet de la pension s'arrête partout au trimestre civil qui la précède
  (R. 351-1, fiche `taux_plein_et_proratisation`).
domaine: duree
regimes: [regime_general, msa_salaries, cancava, organic, rsi]
etape: compter_les_durees
face: droit
etat: approchee
lit:
- l'année de la ligne d'emploi, qui choisit la version
- les régimes de base de son statut cette année-là (`affiliations` du paquet)
- les mois travaillés de l'année et la date d'effet de la pension
ecrit:
- >-
  la borne des trimestres validés de la ligne d'emploi (`trimestres_valides`) : quatre
  dans un régime de la version, les trimestres civils écoulés avant la date d'effet
  l'année du départ, les trimestres civils de ses mois ailleurs
dates_qui_decident:
- revenu.annee
versions:
- id: avant_1946
  statut: lue
  textes:
  - id: LEGIARTI000006749353
    article: code de la sécurité sociale, R. 351-9, rédaction du 21 décembre 1985
    en_vigueur: 1985-12-21
    citation: >-
      « Les périodes d'assurance accomplies du 1er juillet 1930 au 31 décembre 1935
      comptent pour autant de trimestres d'assurance que, durant ce délai, l'intéressé a
      versé de fois soixante cotisations journalières [...]. Pour la période comprise
      entre le 1er janvier 1936 et le 31 décembre 1941, ne comptent comme trimestres
      d'assurance que ceux au cours desquels l'assuré a subi sur son salaire une retenue
      au moins égale à 0,15 F. »
  - id: LEGIARTI000006597801
    article: code rural, R. 742-21, rédaction du 22 avril 2005
    en_vigueur: 2005-04-22
    citation: >-
      « 2° Pour la période comprise entre le 1er juillet 1930 et le 31 décembre 1945, il
      est décompté un trimestre pour tout versement correspondant à cinquante jours de
      travail »
  bornes:
    revenu.annee: [null, 1946-01-01]
  contenu:
    parametres:
      regimes: []
    droit: >-
      les assurances sociales comptent les trimestres au cours desquels une retenue a été
      subie, ou par cinquante jours de travail aux salariés agricoles : les mois de
      l'année bornent ses trimestres
  exemples: aucun trouvé
  exemples_cherches: >-
    le 21 novembre 2026, dans les exemples officiels du dépôt
    (tests/temoins/exemples_officiels.yaml) : aucun ne publie à la fois un début
    d'activité en cours d'année et les trimestres de cette année ; les circulaires
    Cnav lues par la recherche de la base de la Cnav ne donnent pas d'exemple chiffré
    de l'année d'entrée
- id: salaries_1946
  statut: lue
  textes:
  - id: LEGIARTI000006749353
    article: code de la sécurité sociale, R. 351-9, rédaction du 21 décembre 1985
    en_vigueur: 1985-12-21
    citation: >-
      « Pour la période comprise entre le 1er janvier 1946 et le 31 décembre 1948, il y
      a lieu de retenir autant de trimestres que le salaire annuel correspondant aux
      retenues subies par l'assuré sur sa rémunération représente de fois 18 F avec un
      maximum de quatre trimestres par année civile. »
  - id: LEGIARTI000028751530
    article: code de la sécurité sociale, R. 351-9, rédaction du 21 mars 2014
    en_vigueur: 2014-03-21
    citation: >-
