approximations:
- version: [avant_1946]
  textes: code de la sécurité sociale, R. 351-9, rédaction du 21 décembre 1985, troisième alinéa
  ecart: >-
    De 1942 à 1945, R. 351-9 compte au régime général « autant de trimestres que la
    retenue subie par l'assuré sur son salaire annuel représente de fois 0,15 F avec un
    maximum de quatre trimestres par année civile », sans condition de mois ; le modèle
    garde à ces quatre années la borne des mois, comme de 1930 à 1941.
  effet: non mesuré ; la seule année d'entrée, de 1942 à 1945
- version: [artisans_et_commercants_1973]
  textes: >-
    code de la sécurité sociale, D. 643-3 (LEGIARTI000006738142, LEGIARTI000039123745) et
    R. 643-1 (LEGIARTI000006751822)
  ecart: >-
    Les professions libérales valident aussi au revenu depuis 2004 : « autant de
    trimestres que les revenus professionnels ayant servi d'assiette au calcul des
    cotisations représentent de fois » le seuil, « avec un maximum de quatre trimestres
    par année civile d'affiliation » (D. 643-3). Mais leur affiliation ne prend effet
    qu'au « premier jour du trimestre civil suivant le début » de l'activité (R. 643-1),
    et l'assiette de la première année est provisionnelle : le modèle, qui ne date pas
    l'affiliation, leur garde la borne des trimestres civils de leurs mois, plus proche
    de cette règle que le revenu seul.
  effet: non mesuré ; la seule année d'entrée d'un libéral
textes_sans_effet:
- id: LEGIARTI000006765814
  reference: décret n° 73-937 du 2 octobre 1973, article 2, rédaction du 1er janvier 1990
  motif: >-
    l'article ne porte plus la règle des trimestres : « Pour l'ouverture du droit aux
    prestations mentionnées à l'article L. 634-3 du Code de la sécurité sociale, sont
    supprimées » des conditions d'années d'activité ; D. 634-1, en vigueur le même jour,
    applique R. 351-9 aux artisans et aux commerçants (version
    artisans_et_commercants_1973)
- id: LEGIARTI000039123745
  reference: code de la sécurité sociale, D. 643-3, rédaction du 1er novembre 2019
  motif: >-
    les libéraux restent aux trimestres civils de leurs mois (approximation de la
    version artisans_et_commercants_1973) ; la rédaction ne change que les renvois à
    D. 643-2 (« 2°, 3° et 6° » au lieu de « 2° et 3° »)
- id: LEGIARTI000047265883
  reference: code de la sécurité sociale, R. 643-1, rédaction du 5 mars 2023
  motif: >-
    la fiche laisse les libéraux aux mois ; la phrase ajoutée exclut de l'article « les
    travailleurs indépendants libéraux affiliés à la section professionnelle mentionnée
    au 11° de l'article R. 641-1 », sans toucher au compte des trimestres
reformes: []
effet: >-
  L'année d'entrée, ou de retour, d'un salarié, d'un artisan ou d'un commerçant. Le modèle bornait toute année d'emploi aux trimestres civils de ses mois :
  entré au SMIC à temps plein le 1er octobre 2015, 4 372,60 € sous un seuil de
  1 441,50 €, il validait un trimestre au lieu de trois. Corrigé le 21 novembre 2026
  (action 134, point 5) : 58 témoins de simulation sur 937 bougent au scénario 1,
  +1,53 % en médiane.
sources:
  lu_le: 2026-11-21
  prochaine_relecture: 2027-11-30
  a_relire:
  - >-
    La pratique des sections libérales sur « l'année civile d'affiliation » de D. 643-3
    et l'affiliation au trimestre civil suivant de R. 643-1, et celle des caisses sur
    l'année d'entrée : aucune circulaire lue. L'assiette de début d'activité des artisans
    et des commerçants (D. 633-*) n'est pas lue.
  lectures:
  - type: legifrance
    reference: >-
      code de la sécurité sociale, R. 351-9, ses trois rédactions (LEGIARTI000006749353,
      LEGIARTI000028751530, LEGIARTI000053335598) ; R. 351-1 (LEGIARTI000006749339) ;
      code rural, R. 742-21 (LEGIARTI000006597801) ; D. 634-1 (LEGIARTI000006737960,
      LEGIARTI000026139975, LEGIARTI000049917702, LEGIARTI000053356087) ; décret n° 73-937,
      article 2 (LEGIARTI000006765813), seule rédaction que l'index porte ; D. 643-3
      (LEGIARTI000006738142, LEGIARTI000028751534, LEGIARTI000039123745) et R. 643-1
      (LEGIARTI000006751822) pour les libéraux, laissés aux mois. Lus dans l'index LEGI du
      dépôt, à jour au 16 novembre 2026
    date: 2026-11-21
code:
  javascript: >-
    moteur/js/carriere.js : plafondDeLAnneeDEmploi, FICHE_DES_TRIMESTRES_AU_REVENU,
    lignesDuParcours, Carriere.trimestresEcoules, Carriere.plafondTrimestres ;
    moteur/js/regimes.js : FichesDatees
  moteur: >-
    `plafondDeLAnneeDEmploi` lit la version de l'année de la ligne : si tous les régimes
    de base du statut cette année-là sont de ses `regimes`, la ligne d'emploi vaut au plus
    quatre trimestres, et l'année du départ les trimestres civils écoulés avant la date
    d'effet ; sinon, les trimestres civils de ses mois. `trimestresEcoules` et
    `plafondTrimestres` ne rognent plus une année antérieure au départ.
  parametres: "contenu.parametres de chaque version : regimes"
  tests:
  - >-
    tests/js/mois.test.js, « l'année d'entrée valide ce que son salaire vaut, au plus
    quatre (R. 351-9) » : entré au SMIC le 1er octobre 2015, trois trimestres
sans_reference: 'Au relevé du 22 novembre 2026, ni exemple officiel, ni grille posée sans le
  code, ni autre modèle du droit réel cité par la fiche, et aucune source du vivier ne lui est
  rattachée : seul le texte la tient.'
