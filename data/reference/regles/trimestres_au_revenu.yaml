      sa rémunération représente de fois le montant du salaire minimum de croissance en
      vigueur au 1er janvier de l'année considérée calculé sur la base de 150 heures, avec
      un maximum de quatre trimestres par année civile. »
  - id: LEGIARTI000053335598
