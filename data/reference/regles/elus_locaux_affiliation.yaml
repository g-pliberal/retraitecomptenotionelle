  contenu:
    ircantec: >-
      les maires et les adjoints, réglementaires et supplémentaires, qui reçoivent une
      indemnité de fonction, les maires délégués des communes associées et les présidents et
      vice-présidents des communautés urbaines
    non_affilies: >-
      les autres élus, même indemnisés : conseillers municipaux, conseillers généraux et
      régionaux, présidents et vice-présidents des syndicats de communes, des districts et
      des autres groupements, membres des délégations spéciales
