      « maire d'une commune de plus de 10.000 habitants ou adjoint au maire d'une commune
      d'au moins 30.000 habitants » ; « Pour prendre en compte la loi 2000-295 du 5 avril
      2000 relative à la limitation du cumul des mandats électoraux et des fonctions
      électives et à leurs conditions d'exercice, et notamment son article 12, qui a modifié
