- id: lfss_2013
  statut: lue
  nee_de: LEGIARTI000026790815
  textes:
  - id: LEGIARTI000026790815
    article: code de la sécurité sociale, L. 382-31, rédaction du 1er janvier 2013
    en_vigueur: 2013-01-01
    citation: >-
      « Les élus des collectivités territoriales mentionnées à l'article 72 de la
      Constitution dans lesquelles s'applique le régime général de sécurité sociale, ainsi que
      les délégués de ces collectivités territoriales membres d'un établissement public de
      coopération intercommunale, sont affiliés au régime général de sécurité sociale pour
      l'ensemble des risques. Leurs indemnités de fonction sont assujetties aux cotisations de
      sécurité sociale lorsque leur montant total est supérieur à une fraction, fixée par
      décret, de la valeur du plafond défini à l'article L. 241-3. Toutefois, pour les élus
      mentionnés aux articles L. 2123-9, L. 3123-7, L. 4135-7, L. 4422-22, L. 5214-8, L.
      5215-16 et L. 5216-4 du code général des collectivités territoriales qui ont cessé toute
      activité professionnelle pour l'exercice de leur mandat et ne relèvent plus, à titre
      obligatoire, d'un régime de sécurité sociale, les indemnités de fonction dont le montant
      est inférieur à cette fraction sont assujetties aux cotisations de sécurité sociale. »
    lu_le: 2026-11-24
  - id: JORFARTI000026785490
    article: >-
      loi n° 2012-1404 du 17 décembre 2012 de financement de la sécurité sociale pour 2013,
      article 18, qui crée L. 382-31 et abroge L. 2123-26, L. 3123-21 et L. 4135-21
    publie_le: 2012-12-18
    citation: >-
      « 2° L'article L. 2123-26 est abrogé » ; « 7° L'article L. 3123-21 est abrogé » ; « 12°
      L'article L. 4135-21 est abrogé » ; « III. ― Les I et II s'appliquent à compter du 1er
      janvier 2013. »
    lu_le: 2026-11-24
  - id: LEGIARTI000027364746
    article: code de la sécurité sociale, D. 382-34, et l'article 2 du décret n° 2013-362 du 26 avril 2013
    en_vigueur: 2013-01-01
    citation: >-
      « Les présentes dispositions s'appliquent aux indemnités de fonctions afférentes : 1°
      Aux mandats débutant à compter du 1er janvier 2013 ; 2° Aux mandats en cours au 1er
      janvier 2013, au titre de la période du mandat postérieure à cette date. » ; « Les
      indemnités de fonctions des élus des collectivités territoriales et des délégués de ces
      collectivités membres d'un établissement public de coopération intercommunale sont
      assujetties aux cotisations sociales, en application des dispositions de l'article L.
      382-31, lorsque leur montant total dépasse la moitié du plafond mentionné à l'article L.
      241-3. »
    lu_le: 2026-11-24
  - id: LEGIARTI000026798580
    article: code général des collectivités territoriales, L. 2123-25-2, rédaction du 1er janvier 2013
    en_vigueur: 2013-01-01
    citation: >-
      « Les élus municipaux sont affiliés au régime général de sécurité sociale dans les
      conditions définies à l'article L. 382-31 du code de la sécurité sociale. »
    lu_le: 2026-11-24
  - id: LEGIARTI000026798577
    article: code général des collectivités territoriales, L. 2123-29, rédaction du 1er janvier 2013
    en_vigueur: 2013-01-01
    citation: >-
      « Les cotisations des communes et celles de leurs élus résultant de l'application des
      articles L. 2123-27 et L. 2123-28 sont calculées sur le montant des indemnités
      effectivement perçues par ces derniers »
    lu_le: 2026-11-24
  - id: LEGIARTI000006390053
    article: code général des collectivités territoriales, L. 2123-28
    en_vigueur: 1996-02-24
    citation: >-
      « Les élus qui perçoivent une indemnité de fonction [...] sont affiliés au régime
      complémentaire de retraite institué au profit des agents non titulaires des
      collectivités publiques. »
    lu_le: 2026-11-24
  - id: LEGIARTI000027574152
    article: code général des collectivités territoriales, L. 3123-23, rédaction du 22 mars 2015
    en_vigueur: 2015-03-22
    citation: >-
      « Les membres du conseil départemental sont affiliés au régime complémentaire de
      retraite institué au profit des agents non titulaires des collectivités publiques. »
    lu_le: 2026-11-24
  - id: LEGIARTI000044374619
    article: code général des collectivités territoriales, L. 1424-27-1, rédaction du 27 novembre 2021
    en_vigueur: 2021-11-27
    citation: >-
      « Les présidents et vice-présidents d'un conseil d'administration de service d'incendie
      et de secours, qui perçoivent [...] des indemnités pour l'exercice effectif de leurs
      fonctions, sont affiliés au régime complémentaire de retraite institué au profit des
      agents non titulaires des collectivités publiques. »
    lu_le: 2026-11-24
  bornes:
    periode.debut: [2013-01-01, 2023-09-01]
  contenu:
    ircantec: inchangée, tout élu indemnisé
    regime_general: >-
      l'élu d'une collectivité où s'applique le régime général, et le délégué de ces
      collectivités membre d'un établissement de coopération intercommunale, est affilié
      pour l'ensemble des risques ; ses indemnités sont assujetties quand leur montant total
      dépasse la moitié du plafond de L. 241-3 ; en deçà, elles le sont aussi pour l'élu des
      articles L. 2123-9, L. 3123-7, L. 4135-7, L. 4422-22, L. 5214-8, L. 5215-16 et L.
      5216-4, que l'index ne porte pas, qui a cessé toute activité professionnelle pour son
      mandat et ne relève plus d'un régime obligatoire
    seuil: >-
      la moitié du plafond, au sens strict : le montant total « dépasse » la moitié
    mandats_en_cours: >-
      la version vaut pour les mandats qui commencent avec elle, et pour la part restante des
      mandats en cours
    assiette: les indemnités effectivement perçues
  exemples: aucun trouvé
  exemples_cherches: >-
