- id: avant_1973
  statut: lue
  nee_de: LEGIARTI000006338235
  textes:
  - id: LEGIARTI000006338235
    article: >-
      loi n° 72-1201 du 23 décembre 1972, article 1er, qui n'affilie les maires et adjoints
      indemnisés qu'à compter de son entrée en vigueur
    en_vigueur: 1973-01-01
    publie_le: 1972-12-29
    citation: >-
      « Les maires et adjoints qui recoivent une indemnité de fonction par application des
      dispositions du chapitre II du titre IV du livre 1er du Code de l'administration
      communale bénéficient d'un régime de retraite par affiliation au régime complémentaire
      de retraite institué au profit des agents non titulaires des collectivités publiques »
    lu_le: 2026-11-24
  - id: LEGIARTI000006338237
    article: loi n° 72-1201 du 23 décembre 1972, article 3
    en_vigueur: 1973-01-01
    publie_le: 1972-12-29
    citation: >-
      « Un décret fixera les modalités d'application de la présente loi et notamment les
      conditions dans lesquelles seront pris en compte les services rendus par les maires et
      adjoints. »
    lu_le: 2026-11-24
  - id: LEGIARTI000025266780
    article: code général des collectivités territoriales, D. 2123-25, rédaction du 1er février 2012
    en_vigueur: 2012-02-01
    citation: >-
      « Les maires, adjoints aux maires, maires délégués dans les communes associées, maires
      délégués dans les communes déléguées, présidents et vice-présidents des communautés
      urbaines, affiliés obligatoirement au régime de l'institution de retraite
      complémentaire des agents non titulaires de l'Etat et des collectivités publiques
      (I.R.C.A.N.T.E.C.) à partir du 1er janvier 1973 ou qui l'ont été depuis cette date
      peuvent, sur leur demande, faire prendre en compte les services accomplis avant le 1er
      janvier 1973 et pour lesquels ils ont perçu une indemnité de fonction. Ils doivent, à
      cet effet, effectuer un versement égal au montant des cotisations qui auraient été
      acquittées [...] ; la commune doit alors verser la part des cotisations qui lui aurait
      incombé. La demande de validation doit être formulée dans le délai de deux ans à compter
      de l'affiliation de l'intéressé. La validation demandée après l'expiration du délai de
      deux ans [...] est subordonnée au versement par l'intéressé de sa cotisation majorée dans
      la même proportion que le salaire de référence depuis la date de forclusion. »
    lu_le: 2026-11-24
  - id: LEGIARTI000006395797
    article: même article, rédaction du 9 avril 2000, sans les maires délégués des communes déléguées
    en_vigueur: 2000-04-09
    citation: >-
      « Les maires, adjoints aux maires, maires délégués dans les communes associées,
      présidents et vice-présidents des communautés urbaines, affiliés obligatoirement [...] à
      partir du 1er janvier 1973 ou qui l'ont été depuis cette date peuvent, sur leur demande,
      faire prendre en compte les services accomplis avant le 1er janvier 1973 »
    lu_le: 2026-11-24
  - id: LEGIARTI000006347266
    article: code des communes, R. 123-5, rédaction du 20 mars 1977
    en_vigueur: 1977-03-20
    citation: >-
      « Les élus mentionnés à l'article précédent peuvent, sur leur demande, faire prendre en
      compte les services accomplis avant le 1er janvier 1973 et pour lesquels ils ont perçu
      une indemnité de fonctions telle qu'elle est définie par l'article L. 123-10. »
    lu_le: 2026-11-24
  - reference: >-
      réponse du ministre de l'intérieur à la question écrite n° 8683 (10e législature),
      Journal officiel, Assemblée nationale, 13 juin 1994, page 2989, lue dans la copie du
      site de l'Assemblée nationale
    citation: >-
      « La loi du 23 decembre 1972 portant affiliation a l'Ircantec des maires et adjoints au
      1er janvier 1973 n'a pas prevu l'extension de ces dispositions aux anciens magistrats
      municipaux qui n'etaient plus en fonctions a cette date. »
    lu_le: 2026-11-24
    empreinte: sha256:fe20a0c8492069efd524fea25e27f4ae86c05b0884634352f92d0f56f7887df3
  - reference: >-
      Ircantec, base réglementaire, « Validation de services anciens accomplis par des élus -
      Définition », page du 30 avril 2024
    citation: >-
      « Ne sont donc pas validables, les services antérieurs au 1er janvier 1973 accomplis par
      des élus qui n'exerçaient plus de fonction à cette date et n'en ont pas exercé
      ultérieurement. La loi n° 92-108 du 3 février 1992 n'a pas prévu de reprise
      d'antériorité pour les conseillers régionaux, généraux et municipaux, présidents et
      vice-présidents des établissements publics de coopération intercommunale, excepté pour
      les présidents et vice-présidents des communautés urbaines »
    lu_le: 2026-11-24
    empreinte: sha256:627b227242c08660f88252a4d2468d2fd170b4c853ef31e7b21b0ba0df099a66
  bornes:
    periode.debut: [null, 1973-01-01]
  contenu:
    droit: >-
      aucun : le mandat n'affilie à aucun régime de retraite, et l'indemnité n'ouvre aucun
      droit d'elle-même
    validation: >-
      le maire, l'adjoint, le maire délégué ou le président ou vice-président de communauté
      urbaine affilié à l'Ircantec au 1er janvier 1973 ou depuis peut faire valider, sur sa
      demande, ses mandats antérieurs indemnisés ; il verse les cotisations qui auraient été
      dues, et la commune sa part ; la demande se fait dans les deux ans de l'affiliation,
      après quoi la cotisation de l'élu est majorée comme le salaire de référence ; les
      mandats de qui n'était plus en fonction le 1er janvier 1973 et ne l'a plus été ne se
      valident pas, ni ceux des conseillers municipaux, généraux et régionaux et des
      présidents et vice-présidents des autres groupements
  exemples: aucun trouvé
  exemples_cherches: >-
    Le 24 novembre 2026 : les pages de la base réglementaire de l'Ircantec sur les élus
    locaux (évolution de l'affiliation, six catégories de mandats, assiette, calcul des
    droits, validation des services anciens, liquidation) et les réponses ministérielles
    n° 334, 3906, 8683 (10e législature) et 39235 (11e) ; aucune ne chiffre une validation.
