approximations:
- version: loi_1972
  ecart: >-
    Le statut route à l'Ircantec, dès 1973, tout élu indemnisé ; la loi n'y affilie que les
    maires, adjoints, maires délégués et présidents et vice-présidents de communauté urbaine.
    L'indemnité d'un conseiller général, d'un conseiller régional, d'un conseiller municipal
    de grande ville ou d'un président de syndicat n'ouvrait aucun droit avant le 30 mars
    1992.
  effet: >-
    Conseiller général de 1985 à 1996, salarié non cadre par ailleurs, né en 1945, parti à
    soixante ans en 2005, indemnité d'un quart du salaire moyen (4 015 € en 1985) : 509 € par
    an d'Ircantec au modèle, 226 € au droit, qui n'affilie qu'à compter du 30 mars 1992 ;
    18 466 € de pension en tout au lieu de 18 183 €.
- version: [loi_1992, loi_1999, loi_2000, loi_2002]
  ecart: >-
    Le statut ne route jamais l'élu au régime général avant 2013 ; la loi y affilie, pour la
    vieillesse, celui qui a cessé son activité professionnelle pour son mandat et n'acquiert
    aucun autre droit à pension, dans les mandats que nomme chaque version : dans la
    commune, le maire d'une ville de 10 000 habitants au moins et l'adjoint d'une ville de
    30 000 habitants au moins jusqu'au 5 avril 2000, puis le maire de toute commune et
    l'adjoint d'une commune de 20 000 habitants au moins ; au département et à la région, le
    président et les vice-présidents ayant délégation de l'exécutif ; dans l'établissement
    de coopération intercommunale, depuis le 13 juillet 1999, les membres que L. 5211-14
    renvoie aux règles de la commune.
  effet: >-
    Maire d'une ville de 20 000 habitants au moins qui cesse son activité de cadre de 2002 à
    2008, né en 1950, parti à soixante-deux ans en 2012, indemnité de 1,2 salaire moyen
    (33 293 € en 2002) : 11 992 € par an de régime général au modèle (136 trimestres sur 162
    dans le régime), 15 074 € au droit (160 sur 162) ; 22 966 € de pension en tout au lieu de
    26 047 €. Les deux comptent 160 trimestres tous régimes, le modèle par l'écart des
    années d'Ircantec seule (plus bas) : à taux égal, l'écart chiffré est celui de la seule
    proratisation du régime général.
- version: [lfss_2013, pension_d_avant_septembre_2023, option_2023, option_epci_2023]
  ecart: >-
    Sous la moitié du plafond, le statut ne route que l'Ircantec ; la loi assujettit aussi
    au régime général l'élu des articles L. 2123-9, L. 3123-7, L. 4135-7, L. 4422-22,
    L. 5214-8, L. 5215-16 et L. 5216-4 qui a cessé toute activité professionnelle pour son
    mandat.
  effet: >-
    Maire qui a cessé toute activité, de 2014 à 2021, né en 1960, parti à soixante-deux ans
    en 2022, indemnité de 0,45 salaire moyen (16 499 € en 2014, 18 632 € en 2021, sous la
    moitié du plafond) : 11 546 € par an de régime général au modèle (128 trimestres sur 167
    dans le régime), 14 432 € au droit (160 sur 167) ; 16 711 € de pension en tout au lieu de
    19 597 €. Comme plus haut, les deux comptent 160 trimestres tous régimes, à taux égal.
- version: avant_1973
  ecart: >-
    Avant 1973, le statut ne route l'élu à aucun régime, et le modèle valide pourtant les
    trimestres de l'année sur l'indemnité, comme sur un salaire ; le droit n'en valide
    aucun, faute de régime : L. 351-1 du code de la sécurité sociale (rédaction du 23
    juillet 1993) fait dépendre le taux de « la durée d'assurance, dans une limite
    déterminée, tant dans le régime général que dans un ou plusieurs autres régimes
    obligatoires ».
  effet: >-
    Salarié non cadre de 1960 à 1964, maire de 1965 à 1972 sans autre activité, puis
    salarié de 1973 à 1999, né en 1940, parti à soixante ans en 2000, indemnité de 0,3
    salaire moyen (490 € en 1965) : 160 trimestres validés au modèle, 128 au droit, pour 157
    requis ; le taux du régime général passe de 50 % à 25 %, et l'Arrco et l'Unirs prennent
    le coefficient d'anticipation de 0,78 ; 13 369 € de pension en tout au modèle, 7 598 €
    au droit.
- version: [loi_1972, loi_1992, loi_1999, loi_2000, loi_2002, lfss_2013, pension_d_avant_septembre_2023,
    option_2023, option_epci_2023]
  ecart: >-
    Une année que le statut ne route qu'à l'Ircantec, régime complémentaire, compte au
    modèle dans la durée d'assurance tous régimes, ses trimestres lus sur l'indemnité comme
    sur un salaire ; le droit ne la compte pas, faute de régime de base : l'Ircantec exige de
    l'élu, pour le taux plein avant soixante-cinq ans, « le relevé de trimestres du régime de
    base de l'élu local (régime général, agricole ou spécial) ». Seul ce statut, parmi ceux
    du modèle, route des années à un régime complémentaire seul.
  effet: >-
    Adjointe d'une commune de moins de 20 000 habitants, sans autre activité de 2002 à 2012,
    salariée non cadre avant, née en 1955, partie à soixante-deux ans en 2017, indemnité de
    0,3 salaire moyen (8 238 € en 2002) : 152 trimestres validés au modèle, 108 au droit, pour
    166 requis ; le taux du régime général passe de 41,25 % à 37,5 %, les coefficients
    d'anticipation de l'Arrco et de l'Ircantec de 0,855 à 0,78 ; 10 579 € de pension en tout
    au modèle, 9 628 € au droit.
- version: [lfss_2013, pension_d_avant_septembre_2023, option_2023, option_epci_2023]
  ecart: >-
    Le seuil se compare au modèle par « revenu ≥ moitié du plafond » ; le décret veut que le
    montant total « dépasse » la moitié. Le texte ne dit pas non plus sur quelle période le
    montant se compare au plafond : le modèle compare l'indemnité de l'année à la moitié du
    plafond annuel.
  effet: >-
    Une indemnité de 20 568 € en 2020, la moitié exacte du plafond de 41 136 €, est routée au
    régime général et à l'Ircantec, quand le droit ne la porte qu'à l'Ircantec ; à 20 567 €,
    le modèle et le droit concordent. La période de comparaison : non mesuré.
- version: [option_2023, option_epci_2023]
  ecart: >-
    L'assujettissement sur demande n'est pas porté : le modèle présume que l'élu sous le
    seuil ne l'a pas demandé.
  effet: non mesuré
