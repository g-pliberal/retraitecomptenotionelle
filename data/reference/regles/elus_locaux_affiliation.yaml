  a_relire:
  - >-
    Lire L. 2123-9 du code général des collectivités territoriales dans ses rédactions,
    que l'index LEGI ne porte pas : celle de 1996, qui codifie L. 121-44 du code des
    communes ; celle de l'article 12 de la loi n° 2000-295, que seule décrit la notice du
    décret n° 2002-684 ; celles des lois n° 2015-366 et 2019-1461 (l'ordonnance n° 2020-1256
    donne L. 2123-9 dans la rédaction de la seconde), et l'alinéa que l'article 28 de la loi
    n° 2025-1249 y ajoute pour les élus salariés qui remplacent le maire. Elles disent quels
    élus municipaux qui ont cessé leur activité relèvent du régime général de 1992 à 2012,
    et, depuis 2013, sous le seuil (L. 382-31). Lire de même L. 3123-7, L. 4135-7, L.
    4422-22, L. 5214-8, L. 5215-16 et L. 5216-4.
  - >-
    Lire L. 5211-14 du code général des collectivités territoriales dans sa rédaction de
    1996 et dans celles d'après 1999, que l'index ne porte pas : quels élus des
    établissements de coopération intercommunale relèvent du régime général avant le 13
    juillet 1999, et lesquels de leurs membres L. 2123-25 vise ensuite ; la réponse
    ministérielle n° 39235, de juillet 2000, y transpose les seuils du maire et de l'adjoint.
  - >-
    Lire l'article 41 de la loi n° 92-108 lui-même, et les articles 11 et 11-1 de la loi
    n° 72-619 dans leur rédaction de 1992 (la région jusqu'à la codification de 1996) :
    l'index ne les porte pas, et Légifrance refuse la lecture automatique.
  - >-
    Lire la règle d'entrée en vigueur des lois d'avant 2004 (décret du 5 novembre 1870),
    que l'index ne porte pas : les bornes du 13 juillet 1999 et du 6 avril 2000 sont des
    dates de publication, celle du 1er mars 2002 la date de l'Ircantec.
  - >-
    Lire les textes des affiliations particulières que l'Ircantec date, et que le statut ne
    distingue pas : le Centre national de la fonction publique territoriale (20 février
    1988), les centres de gestion (1er juillet 1995), les syndicats mixtes « ouverts
    restreints » (1er mars 2002), les métropoles, pôles métropolitains, communes nouvelles
    et communes déléguées (1er janvier 2011), les pôles d'équilibre territorial et rural (1er
    février 2014), les établissements publics territoriaux (1er janvier 2016), les maires
    et adjoints d'arrondissement de Paris en fonction le 24 mars 1977 (décret n° 77-229), et
    outre-mer, Mayotte (ordonnance n° 2002-411, article 26), la Nouvelle-Calédonie, la
    Polynésie française et Saint-Pierre-et-Miquelon (ordonnance n° 2026-648, dont la date
    d'effet n'est pas lue).
  - >-
    Dire sur quelle période l'Urssaf compare les indemnités à la moitié du plafond (le mois
    ou l'année), et ce qu'il en est des indemnités des présidents et vice-présidents de
    service d'incendie et de secours, établissement public que L. 382-31 ne nomme pas.
  - >-
    Dire si l'élu salarié qui remplace le maire ou le président, et que l'article 28 de la
    loi n° 2025-1249 ajoute à L. 2123-9, L. 3123-7 et L. 4135-7, compte parmi les élus que L.
    382-31 assujettit sous le seuil, pendant le remplacement.
