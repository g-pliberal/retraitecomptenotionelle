      « Leurs indemnités de fonction sont assujetties aux cotisations de sécurité sociale
      lorsque leur montant total est supérieur à une fraction, fixée par décret, de la valeur
      du plafond défini à l'article L. 241-3. Toutefois, pour les élus mentionnés aux
      articles L. 2123-9, L. 3123-7, L. 4135-7, L. 4422-22, L. 5214-8, L. 5215-16 et L.
      5216-4 du code général des collectivités territoriales qui ont cessé toute activité
      professionnelle pour l'exercice de leur mandat et ne relèvent plus, à titre obligatoire,
      d'un régime de sécurité sociale, les indemnités de fonction dont le montant est
      inférieur à cette fraction sont assujetties aux cotisations de sécurité sociale. »
