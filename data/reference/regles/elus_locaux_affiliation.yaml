- id: option_2023
  statut: lue
  nee_de: LEGIARTI000047453392
  textes:
  - id: LEGIARTI000047453392
    article: code de la sécurité sociale, L. 382-31, rédaction du 1er septembre 2023
    en_vigueur: 2023-09-01
    citation: >-
      « Les indemnités de fonction des élus des collectivités territoriales mentionnées à
      l'article 72 de la Constitution dans lesquelles s'applique le régime général de sécurité
      sociale et qui ne sont pas assujetties aux cotisations de sécurité sociale en
      application des deux premiers alinéas du présent article peuvent, sur demande des élus
      concernés, être assujetties aux mêmes cotisations. Un décret fixe les modalités selon
      lesquelles cette faculté s'exerce. »
    lu_le: 2026-11-24
  - id: JORFARTI000047445110
    article: >-
      loi n° 2023-270 du 14 avril 2023 de financement rectificative de la sécurité sociale
      pour 2023, article 23, IV
    publie_le: 2023-04-15
    citation: >-
      « IV.-Les I à III sont applicables aux pensions prenant effet à compter du 1er
      septembre 2023. »
    lu_le: 2026-11-24
  - id: JORFARTI000048010886
    article: >-
      décret n° 2023-838 du 30 août 2023 relatif à la mise en œuvre pour les élus locaux de
      la faculté de cotisation, article 3, qui applique son article 1er, D. 382-34-1
    publie_le: 2023-08-31
    citation: >-
      « I. - Les dispositions de l'article 1er du présent décret s'appliquent aux indemnités
      de fonctions afférentes : 1° Aux mandats débutant à compter du 1er septembre 2023 ; 2°
      Aux mandats en cours au 1er septembre 2023, au titre de la période postérieure à cette
      date. »
    lu_le: 2026-11-24
  - id: LEGIARTI000048027757
    article: code de la sécurité sociale, D. 382-34-1
    en_vigueur: 2023-09-01
    citation: >-
      « la demande d'assujettissement des indemnités de fonction aux cotisations de sécurité
      sociale est adressée par l'élu à sa collectivité territoriale par tout moyen conférant
      date certaine à sa réception. Les cotisations sociales sont dues à compter du premier
      jour du mois suivant la réception par la collectivité territoriale de la demande pour la
      durée du mandat restant à courir. II. - L'élu bénéficiant de l'assujettissement des
      indemnités dans les conditions prévues au I peut y renoncer à tout moment pendant la
      durée de son mandat, dans les mêmes conditions. »
    lu_le: 2026-11-24
  - id: LEGIARTI000027364746
    article: code de la sécurité sociale, D. 382-34
    en_vigueur: 2013-01-01
    citation: >-
