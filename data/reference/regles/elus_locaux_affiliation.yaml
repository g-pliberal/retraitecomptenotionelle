      « Entrée en vigueur : le décret entre en vigueur le 1er septembre 2023 . Notice : le
      décret définit la procédure permettant aux élus des collectivités locales et délégués
      de ces collectivités territoriales membres d'un établissement public de coopération
      intercommunale d'assujettir leurs indemnités d'élus aux cotisations de sécurité
      sociale. »
