    citation: >-
      « Les cotisations des communes et celles de leurs élus résultant de l'application des
      articles L. 2123-26 à L. 2123-28 sont calculées sur le montant des indemnités
      effectivement perçues par ces derniers [...]. Les cotisations des élus ont un caractère
      personnel et obligatoire. »
    lu_le: 2026-11-24
  - reference: >-
      réponse du ministre de l'intérieur à la question écrite n° 39235 (11e législature),
      Journal officiel, Assemblée nationale, 31 juillet 2000, page 4559, lue dans la copie du
      site de l'Assemblée nationale ; elle lit L. 5211-14 du code général des collectivités
      territoriales, que l'index LEGI ne porte pas
    citation: >-
      « les présidents et les vice-présidents de ces établissements qui cessent leur activité
      professionnelle pour se consacrer à leur mandat bénéficient, comme les maires et les
      adjoints, de l'affiliation au régime général de la sécurité sociale [...] pour la
      retraite lorsqu'ils ne bénéficient plus d'un régime obligatoire. Ces dispositions
      s'appliquent au président de ces établissements, quelle que soit la population
      regroupée et, lorsque l'établissement comporte 20 000 habitants au moins, aux
      vice-présidents. » ; « les membres des organes délibérants de l'ensemble des EPCI sont,
      lorsqu'ils perçoivent une indemnité de fonction, affiliés au régime de l'Ircantec »
    lu_le: 2026-11-24
    empreinte: sha256:6846f516a1425222acb88a8a47e9c172ea75e70063a136ea7ceb08b980ad6388
  - id: LEGIARTI000006390055
    article: code général des collectivités territoriales, L. 2123-30, rédaction de 1996
    en_vigueur: 1996-02-24
    citation: >-
      « Les pensions de retraite déjà liquidées et les droits acquis avant le 30 mars 1992 des
      élus communaux continuent d'être honorés par les institutions et organismes auprès
      desquels ils ont été constitués ou auprès desquels ils ont été transférés. »
    lu_le: 2026-11-24
  - reference: >-
      Ircantec, base réglementaire, « Évolution de l'affiliation des élus », page du 29 avril
      2024
    citation: >-
      « Le champ d'application du régime est étendu aux présidents et vice-présidents des
      centres de gestion départementaux ou interdépartementaux de la fonction publique
      territoriale à compter du 1er juillet 1995. » ; « À compter de juillet 1999, le
      bénéfice de l'Ircantec, déjà ouvert aux présidents et vice-présidents d'EPCI par la loi
      du 3 février 1992, est étendu à l'ensemble des membres de l'organe délibérant des EPCI »
    lu_le: 2026-11-24
    empreinte: sha256:ed1bc7d922702c76647024640e1178c28525d5bf0a66bff99dea5fabb291dbb3
  bornes:
    periode.debut: [1992-03-30, 2002-02-28]
  contenu:
    ircantec: >-
      tout élu qui perçoit une indemnité de fonction, « en application des dispositions du
      présent code ou de toute autre disposition régissant l'indemnisation de leurs
      fonctions » : élus municipaux, membres du conseil général et du conseil régional,
      présidents et vice-présidents des établissements publics de coopération
      intercommunale ; un mandat entre dans le régime quand une indemnité lui est ouverte, les
      autres membres indemnisés des organes délibérants de ces établissements et les
      présidents et vice-présidents des centres de gestion au cours de la version, selon
      l'Ircantec
    regime_general: >-
      l'assurance vieillesse, à l'élu qui, pour la durée de son mandat, a cessé son activité
      professionnelle et n'acquiert aucun droit à pension d'un régime obligatoire : dans la
      commune, l'élu visé à L. 121-44 du code des communes, puis à L. 2123-9 et L. 2123-11 du
      code général, articles que l'index ne porte pas ; au département et à la région, le
      président et les vice-présidents ayant délégation de l'exécutif qui ont cessé toute
      activité professionnelle ; dans l'établissement de coopération intercommunale, son
      président, et ses vice-présidents s'il compte 20 000 habitants au moins
    assiette: >-
      les indemnités effectivement perçues, pour l'Ircantec comme pour le régime général ; la
      cotisation de l'élu est personnelle et obligatoire
    droits_anterieurs: >-
      les pensions liquidées et les droits acquis avant la version auprès d'autres
      institutions continuent d'être honorés par elles (régime `elus_locaux_avant_1992`,
      hors champ)
  exemples: aucun trouvé
