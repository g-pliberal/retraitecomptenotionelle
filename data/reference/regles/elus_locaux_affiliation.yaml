sources:
  lu_le: 2026-11-24
  prochaine_relecture: 2027-11-24
  a_relire:
  - >-
    Lire L. 2123-9 du code général des collectivités territoriales dans ses rédactions
    depuis 1996, et L. 121-44 du code des communes de 1992, que l'index LEGI ne porte pas :
    ils disent quels élus municipaux qui ont cessé leur activité relèvent du régime général
    de 1992 à 2002, et, depuis 2013, sous le seuil (L. 382-31). La réponse ministérielle
    n° 39235 décrit les présidents et vice-présidents d'établissement de coopération
    intercommunale « comme les maires et les adjoints » : le président quelle que soit la
    population, les vice-présidents à partir de 20 000 habitants. Lire de même L. 3123-7,
    L. 4135-7, L. 4422-22, L. 5214-8, L. 5215-16 et L. 5216-4.
  - >-
    Lire L. 5211-14 du code général des collectivités territoriales dans ses rédactions, et
    la loi n° 99-586 du 12 juillet 1999, pour l'affiliation des présidents, vice-présidents
    et membres des établissements de coopération intercommunale à l'Ircantec et au régime
    général ; l'index ne porte pas l'article.
  - >-
    Lire l'article 41 de la loi n° 92-108 lui-même : l'index JORF ne le porte pas, et
    Légifrance refuse la lecture automatique ; la borne du 30 mars 1992 repose sur la
    réponse ministérielle n° 334.
  - >-
    Lire les textes des affiliations particulières que l'Ircantec date, et que le statut ne
    distingue pas : le Centre national de la fonction publique territoriale (20 février
    1988), les centres de gestion (1er juillet 1995), les syndicats mixtes « ouverts
    restreints » (1er mars 2002), les métropoles, pôles métropolitains, communes nouvelles
    et communes déléguées (1er janvier 2011), les pôles d'équilibre territorial et rural (1er
    février 2014), les établissements publics territoriaux (1er janvier 2016), les maires
    et adjoints d'arrondissement de Paris en fonction le 24 mars 1977 (décret n° 77-229), et
    outre-mer, Mayotte (ordonnance n° 2002-411, article 26), la Nouvelle-Calédonie et la
    Polynésie française.
  - >-
    Dire sur quelle période l'Urssaf compare les indemnités à la moitié du plafond (le mois
    ou l'année), et ce qu'il en est des indemnités des présidents et vice-présidents de
    service d'incendie et de secours, établissement public que L. 382-31 ne nomme pas.
