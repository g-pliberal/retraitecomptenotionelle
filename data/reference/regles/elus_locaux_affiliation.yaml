    ircantec: inchangée, tout élu indemnisé
    regime_general: >-
      comme dans la version lfss_2013, dans la rédaction de L. 382-31 d'avant l'article 23 :
      le remplacement de L. 4422-22 par L. 4422-19 ne vaut, comme la demande, que pour les
      pensions qui prennent effet à compter du 1er septembre 2023 ; depuis le 24 décembre
      2025, L. 2123-9, L. 3123-7 et L. 4135-7 s'appliquent aussi aux élus salariés qui
      remplacent le maire ou le président, comme dans la version option_epci_2023
    option: >-
      le IV ne fait valoir la demande que pour les pensions qui prennent effet à compter du
      1er septembre 2023 ; aucun texte lu ne l'interdit à l'élu dont la pension a pris effet
      avant, et l'article 3 du décret n° 2023-838 l'ouvre aux mandats en cours sans
      condition de pension
    portee: >-
      aucune période d'après le 1er septembre 2023 n'entre dans une première pension qui a
      pris effet avant : la version ne dit que l'affiliation des indemnités de l'élu déjà
      retraité ; une pension qui prend effet après relève des versions qui suivent
