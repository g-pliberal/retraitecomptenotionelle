  - id: LEGIARTI000006338235
    article: loi n° 72-1201 du 23 décembre 1972, article 1er
    en_vigueur: 1973-01-01
    publie_le: 1972-12-29
    citation: >-
      « Les maires et adjoints qui recoivent une indemnité de fonction par application des
