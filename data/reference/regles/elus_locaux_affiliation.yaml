  - id: LEGIARTI000047452730
    article: >-
      code de la sécurité sociale, L. 351-14-1, rédaction du 1er septembre 2023, I, 4°, que
      le I, 2°, de l'article 23 insère : le versement pour la retraite des périodes de mandat
    en_vigueur: 2023-09-01
    citation: >-
      « 4° Les périodes pendant lesquelles l'assuré a été membre de l'organe délibérant d'une
      collectivité territoriale mentionnée à l'article 72 de la Constitution dans laquelle
      s'applique le régime général de sécurité sociale, ainsi que les périodes pendant
      lesquelles l'assuré a été délégué de ces collectivités territoriales membres d'un
      établissement public de coopération intercommunale. »
    lu_le: 2026-11-25
  bornes:
    periode.debut: [2023-09-01, 2023-12-28]
    liquidation.date_effet: [2023-09-01, null]
  contenu:
    ircantec: inchangée, tout élu indemnisé
    regime_general: >-
      comme dans la version lfss_2013 ; le 1° du III de l'article 23 remplace, pour les
      pensions qui prennent effet depuis le 1er septembre 2023, L. 4422-22 par L. 4422-19
    option: >-
      l'élu d'une collectivité dont les indemnités ne sont pas assujetties peut demander à sa
      collectivité qu'elles le soient ; les cotisations sont dues du premier jour du mois qui
      suit la réception de la demande jusqu'à la fin du mandat, soit le 1er octobre 2023 au
      plus tôt, le décret entrant en vigueur le 1er septembre, et l'élu peut y renoncer à
      tout moment. Le délégué d'une collectivité membre d'un établissement de coopération
      intercommunale ne le peut pas encore selon la lettre de L. 382-31, que la notice du
      décret n° 2023-838 dit pourtant ouvert à « délégués de ces collectivités territoriales
      membres d'un établissement public de coopération intercommunale »
    mandats_en_cours: >-
      la demande vaut pour les mandats qui commencent avec la version, et pour la part
      restante des mandats en cours
    hors_champ: >-
      le versement pour la retraite des périodes de mandat, que le même article 23 ouvre aux
      pensions qui prennent effet depuis le 1er septembre 2023 (L. 351-14-1, I, 4°) : il
      rachète des trimestres pour un mandat de toute date, et relève de la fiche
      `rachats_et_versements`, pas encore modélisée
