  2026-11-24 — née de la ligne d'inventaire `elus_locaux_ircantec`, dont le manque nommait
  l'élu qui a cessé toute activité et la date d'affiliation de chaque mandat ; les versions
  le disent, et les approximations chiffrent ce que le statut n'en porte pas.
- >-
  2026-11-25 — relue en seconde lecture : deux versions de plus, au 13 juillet 1999 (les
  établissements de coopération intercommunale) et au 6 avril 2000 (le maire de toute
  commune, l'adjoint dès 20 000 habitants), que cachait la réponse n° 39235 lue pour toute
  la décennie ; la borne de 2002 au 1er mars, date de l'Ircantec ; L. 381-32, l'article 32
  de la loi n° 92-108 et la réponse n° 3906 cités ; la version des pensions d'avant
  septembre 2023 récrite ; les textes de 2025 et 2026 lus ; l'année d'avant 1973, qui
  n'a aucun régime, chiffrée à part.
effet: >-
  Tout élu local indemnisé : le conseiller général, régional ou municipal d'avant 1992 que
  le statut affilie à tort ; l'élu qui a cessé son activité, dont le statut ignore le
  régime général de 1992 à 2012, et sous le seuil depuis 2013 ; l'élu sans autre activité,
  dont les années d'avant 1973, sans régime, et d'Ircantec seule ensuite comptent au
  modèle dans la durée d'assurance.
