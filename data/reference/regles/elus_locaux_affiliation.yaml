schema_version: 1
id: elus_locaux_affiliation
intitule: >-
  L'élu local qui perçoit une indemnité de fonction est affilié à l'Ircantec sur les
  indemnités qu'il reçoit : de 1973 au 29 mars 1992, les seuls maires, adjoints, maires
  délégués et présidents et vice-présidents de communauté urbaine, puis tout élu indemnisé.
  Le régime général ne le couvre, du 30 mars 1992 à 2012, que s'il a cessé son activité
  professionnelle pour son mandat sans acquérir d'autre droit à pension, dans les mandats
  que chaque loi nomme, et qu'elle élargit en 1999, 2000 et 2002 ; depuis 2013, dès
  que ses indemnités dépassent la moitié du plafond de la sécurité sociale, ou en deçà s'il
  a cessé toute activité, et, depuis septembre 2023, sur sa demande, pour une pension qui
  prend effet à compter de ce mois.
domaine: coordination
regimes: [elus_locaux_ircantec, ircantec, regime_general]
etape: coordonner_les_affiliations
face: droit
etat: approchee
lit:
- le statut `elu_local` de l'année et son revenu, qui est l'indemnité de fonction
- le plafond annuel de la sécurité sociale de l'année
- legislation/affiliations.yaml (périodes du statut `elu_local` et leur `seuil_pass`)
- la date d'effet de la pension, que l'assujettissement sur demande ne sert qu'à compter de septembre 2023
ecrit:
- les régimes de l'année d'élu, l'Ircantec et, à compter de 2013 au-dessus du seuil, le régime général
dates_qui_decident:
- periode.debut
- liquidation.date_effet
