  bornes:
    periode.debut: [1992-03-30, 1999-07-13]
  contenu:
    ircantec: >-
      tout élu qui perçoit une indemnité de fonction, « en application des dispositions du
      présent code ou de toute autre disposition régissant l'indemnisation de leurs
      fonctions » : élus municipaux, membres du conseil général et du conseil régional,
      présidents et vice-présidents des établissements publics de coopération
      intercommunale, élus municipaux délégués dans les conseils des communautés urbaines et
      des communautés de villes ; les présidents et vice-présidents des centres de gestion
      depuis le 1er juillet 1995, selon l'Ircantec ; un mandat entre dans le régime quand une
      indemnité lui est ouverte
    regime_general: >-
      l'assurance vieillesse, à l'élu qui, pour la durée de son mandat, a cessé son activité
      professionnelle et n'acquiert aucun droit à pension d'un régime obligatoire, que L.
      381-32 du code de la sécurité sociale renvoie aux codes et lois qui les nomment : dans
      la commune, le maire d'une ville de 10 000 habitants au moins et l'adjoint d'une ville
      de 30 000 habitants au moins (L. 121-44 du code des communes, codifié en 1996 à L.
      2123-9 du code général, que l'index ne porte pas) ; au département, et à la région
      depuis la codification du 24 février 1996, le président et les vice-présidents ayant
      délégation de l'exécutif qui ont cessé toute activité professionnelle ; à la région de
      1992 à 1996, les articles 11 et 11-1 de la loi n° 72-619, non lus ; dans
      l'établissement de coopération intercommunale, aucun texte lu : L. 381-32 ne le nomme
      qu'à compter du 13 juillet 1999
    assiette: >-
      les indemnités effectivement perçues, pour l'Ircantec comme pour le régime général ; la
      cotisation de l'élu est personnelle et obligatoire
    droits_anterieurs: >-
      les pensions liquidées et les droits acquis avant la version auprès d'autres
      institutions continuent d'être honorés par elles (régime `elus_locaux_avant_1992`,
      hors champ)
  exemples: aucun trouvé
  exemples_cherches: >-
    Le 24 novembre 2026 : les pages de la base réglementaire de l'Ircantec sur les élus
    locaux et les réponses ministérielles n° 334, 3906, 8683 et 39235 ; aucune ne chiffre
    l'affiliation d'un élu au régime général ou à l'Ircantec.
