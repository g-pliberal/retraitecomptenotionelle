  - {id: LEGIARTI000026637129, article: "décret n° 2012-1256, article 9", en_vigueur: 2012-11-16}
  - {id: LEGIARTI000026637132, article: "décret n° 2012-1256, article 10", en_vigueur: 2012-11-16}
  - {id: LEGIARTI000026637135, article: "décret n° 2012-1256, article 14", en_vigueur: 2012-11-16}
  - {id: LEGIARTI000026637137, article: "décret n° 2012-1256, article 15", en_vigueur: 2012-11-16}
