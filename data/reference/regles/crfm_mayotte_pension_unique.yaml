schema_version: 1
id: crfm_mayotte_pension_unique
intitule: >-
  Les agents titulaires de la collectivité, des communes et des établissements publics
  de Mayotte cotisent, de 1977 à leur intégration dans l'une des trois fonctions
  publiques, à la caisse de retraite des fonctionnaires et agents des collectivités
  publiques de Mayotte (CRFM) ; intégrés, ils reçoivent une pension unique du régime
  d'accueil, dont la part des services d'avant l'intégration suit les règles de la
  caisse au 1er janvier 2006, sur les derniers émoluments, et gardent l'âge de 55 ans
  de la caisse, sauf option pour celui de leur corps ; les pensions de ceux qui ne sont
  pas intégrés sont versées depuis 2011 par la CNRACL ou par l'État.
domaine: coordination
regimes: [crfm_mayotte, cnracl, fonction_publique_etat]
etape: coordonner_les_affiliations
face: droit
etat: pas_encore_modelisee
lit:
- les services accomplis à Mayotte sous l'affiliation à la caisse, et la date de l'intégration ou de la titularisation dans un corps ou cadre d'emplois
- les derniers émoluments soumis à retenue, perçus depuis six mois au moins avant l'affiliation au régime d'accueil
- l'option pour l'âge d'ouverture du droit et la limite d'âge du corps d'intégration
- les enfants nés avant et après l'affiliation au régime d'accueil
ecrit:
- une pension de la caisse, ou une pension unique du régime d'accueil faite de deux parts, l'une préliquidée aux règles de la caisse, l'autre au code des pensions civiles et militaires ou au régime de la CNRACL
dates_qui_decident:
- liquidation.date_effet
# Le régime est hors champ (inventaire) : aucune version n'est lue par un moteur. Les
# statuts de fonctionnaire portent la carrière, aux règles du régime d'accueil sur
# toute sa durée.
versions:
- id: caisse_locale
  statut: supposee
  hypothese: >-
    la caisse, établissement public administratif créé le 16 mars 1977 (répertoire
    Sirene), a un règlement adopté localement, hors Journal officiel, que l'index ne
    porte pas ; ce que les textes nationaux en disent : un « régime spécial local »
    ouvrant le droit à 55 ans, « avec prolongation d'activité possible jusqu'à 60 ans »
    (rapport au Président de la République sur l'ordonnance n° 2012-790), et des
    règles de bonification pour enfants propres (décret n° 2012-1256, article 10) ;
    la durée, le taux, la retenue et le salaire de référence ne sont pas lus
  fiabilite: haute pour l'âge et l'existence, nulle pour le calcul
  textes: []
  bornes:
    liquidation.date_effet: [null, 2007-08-01]
  contenu:
    droit: >-
      une pension de la caisse, créée le 16 mars 1977, dès 55 ans, dont le calcul n'est
      pas lu
    affiliation: >-
      les agents titulaires de la collectivité, des communes et des établissements
      publics administratifs de Mayotte ; jusqu'à leur intégration, ils restent
      assujettis aux régimes de sécurité sociale auxquels ils étaient affiliés au
      21 juillet 2003 (loi n° 2001-616, article 64-1, VI)
  exemples: aucun trouvé
- id: pension_unique
