schema_version: 1
id: cavp_minoration_deux_pentes
intitule: >-
  Volet par répartition de la complémentaire de la CAVP : du 7 juin 2009 au 29 juin
  2011, retraite entière à 65 ans et minoration de 1,25 % par trimestre manquant
  pour l'atteindre, à l'âge seul ; depuis le 30 juin 2011, retraite entière à l'âge
  du 1° de L. 351-8 pour les nés depuis 1956 (65 ans jusqu'en 1952, 66 ans de 1953
  à 1955), minoration de 1,25 % par trimestre jusqu'à 65 ans puis de 0,5 % de 65 ans
  à cet âge — un tableau annexé l'écrit pour les nés jusqu'en 1955 —, que la durée
  n'annule pas, et majoration de 0,5 % par trimestre au-delà ; depuis le 10 janvier
  2024, la carrière longue minorée de 1,25 % par trimestre jusqu'à 65 ans seulement ;
  la pension au premier jour du trimestre civil qui suit la demande ; bonification
  d'un dixième pour trois enfants. Avant le 7 juin 2009, statuts non lus.
domaine: decote_surcote
regimes: [cavp_complementaire]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  l'âge du pharmacien à la date d'effet de sa pension, dont l'entrée en jouissance
  « est fixée au premier jour du trimestre civil qui suit cette demande », et sa
  génération, qui donne l'âge de la retraite entière — 65 ans jusqu'en 1952, 66 ans
  de 1953 à 1955, l'âge du 1° de L. 351-8 depuis 1956 —, la valeur de service et,
  pour les nés jusqu'en 1955, la ligne du tableau annexé en 2011
- >-
  depuis le 10 janvier 2024, la liquidation anticipée du régime de base « dans les
  conditions prévues aux II, III et IV de l'article L. 643-3 » — carrière longue,
  handicap, inaptitude —, que la complémentaire suit, la carrière longue minorée
  jusqu'à 65 ans seulement ; de 2009 à 2024, l'inaptitude reconnue par la commission
  de la caisse, sans coefficient dès 60 ans puis dès l'âge d'ouverture
- le nombre d'enfants, trois au moins ouvrant la bonification
- la date d'effet de la pension, qui choisit la rédaction des statuts ou du règlement
ecrit:
- >-
  le coefficient qui minore ou majore les points de la pension complémentaire, que
  `abattement_regime_de_base` et la majoration de `surcote_par_age_seul` rendent à
  `liquider_chaque_regime`, et l'âge de la retraite entière, que la table `cavp` de
  `ages_regimes.csv` rend à l'ouverture ; la bonification de 10 % pour trois enfants
dates_qui_decident:
- liquidation.date_effet
versions:
- id: statuts_d_avant_2009
  statut: supposee
  hypothese: >-
    les pensions qui prennent effet avant le 7 juin 2009 relèvent des statuts approuvés
    par les arrêtés du 29 décembre 1948 et du 1er juin 1950, que l'article 2 de l'arrêté
    du 11 mai 2009 abroge (JORFARTI000020694602), et de leurs modifications. L'index
    JORF n'en porte que les titres, ni article ni annexe, et de quelques-uns un court
    résumé (« MODIFICATION DES ART. 16, 2, 6 BIS ET 10 DES STATUTS », 6 juillet 1977,
    JORFTEXT000000664820 ; « ENTREE EN VIGUEUR: 01-01-1989 », 30 décembre 1988,
    JORFTEXT000000498997) : l'arrêté du 17 septembre 1956 (« APPROBATION DE DISPOSITIONS
    STATUTAIRES COMPLETANT LE REGLEMENT DE LA SECTION PROFESSIONNELLE DES PHARMACIENS »,
    JORFTEXT000000281088), celui du 14 septembre 1957
    (« ART. 3, ET 20 A 24 », JORFTEXT000000285277), celui du 18 février 1976 (« ART. 1ER,
    3, 7, 9, 10, 24 ET 25 », JORFTEXT000000854013), celui du 20 juillet 1979 (« ART. 6,
    10-BIS, 11, 11-BIS, 24 », JORFTEXT000000858658), celui du 27 juillet 1981 (« ART.
    4,11,22BIS ET 22TER », JORFTEXT000000489822), ceux de 1960, 1961, 1963, 1964, 1968,
    1977, du 24 janvier 1978, de 1984, 1986 et 1988. Deux ne sont qu'au Bulletin
    officiel : celui du 6 avril 1989, « L'ARRETE SERA PUBLIE INTEGRALEMENT AU BULLETIN
    OFFICIEL [...] N0 8920 » (JORFTEXT000000318409), et celui du 31 août 1990 (« art.
    27 »), « PUBLIE AU BULLETIN OFFICIEL DU MINISTERE DE LA SOLIDARITE 90-40 »
    (JORFTEXT000000533978). Aucun ne se lit. Le modèle sert la règle du régime de base : 1,25 % par trimestre manquant
    jusqu'à l'âge d'annulation de la décote de la génération, que la durée annule, sans
    majoration ni bonification pour enfants
  fiabilite: >-
    faible : l'âge, le coefficient, la place de la durée et la bonification, que nul
    texte lu ne date avant le 7 juin 2009
