- id: statuts_de_2009
  statut: lue
  textes:
  - id: JORFARTI000020694605
    article: >-
      statuts du régime complémentaire d'assurance vieillesse des pharmaciens, partie
      III de l'annexe de l'arrêté du 11 mai 2009, articles 12, 14, 15 et 17
    en_vigueur: 2009-06-07
    publie_le: 2009-06-06
    citation: >-
      « Le droit à la retraite définie à l'article 11 est acquis à l'âge de 65 ans à
      tout pharmacien qui a validé le nombre de trimestres de cotisations correspondant
      à la durée d'assurance prévue au deuxième alinéa de l'article L. 643-3 du code de
      la sécurité sociale et qui a cessé toute activité pharmaceutique non salariée.
      [...] La retraite est liquidée sur demande de l'affilié. L'entrée en jouissance de
      la retraite de droits propres est fixée au premier jour du trimestre civil qui
      suit cette demande. [...] L'affilié remplissant les conditions pour prétendre au
      versement de la pension de retraite du régime complémentaire peut demander à en
      bénéficier dès l'âge de 60 ans. La pension de retraite est alors réduite par
      application d'un coefficient d'anticipation qui est fonction du nombre de
      trimestres manquants, à la date d'effet des droits, pour atteindre l'âge de 65
      ans. Ce coefficient est égal à 1, 25 % par trimestre manquant dans la limite de 20
      trimestres. Ce coefficient est déterminé définitivement lors de la liquidation des
      droits de l'affilié. Toutefois, le pharmacien reconnu inapte à l'exercice de sa
      profession conformément à l'article 16 des présents statuts peut bénéficier d'une
      retraite sans coefficient d'anticipation à partir de l'âge de 60 ans. [...] La
      retraite prévue au présent titre est augmentée d'une bonification d'un dixième
      pour tout allocataire ayant eu au moins trois enfants. »
  - id: JORFARTI000020694601
    article: arrêté du 11 mai 2009, article 1er
    en_vigueur: 2009-06-07
    publie_le: 2009-06-06
    citation: >-
      « Sont approuvés, tels qu'ils sont annexés au présent arrêté, les statuts
      généraux, les statuts du régime d'assurance vieillesse de base ainsi que les
      statuts du régime d'assurance vieillesse complémentaire de la section
      professionnelle des pharmaciens. » : ni cet article ni l'article 3 ne fixent de
      date ; l'arrêté entre en vigueur le lendemain de sa publication
  nee_de: JORFARTI000020694605
  bornes:
    liquidation.date_effet: [2009-06-07, 2011-06-30]
  contenu:
    parametres:
      age_table: cavp
      decote_par_trimestre: 0.0125
      decote_annulee_par_la_duree: false
      decote_palier_age: null
      surcote_par_trimestre: null
    droit: >-
      retraite entière à 65 ans ; dès 60 ans, 1,25 % par trimestre manquant pour
      atteindre 65 ans, vingt au plus, à l'âge seul ; aucune majoration ; l'inapte sans
      coefficient dès 60 ans ; un dixième de plus pour trois enfants ; la pension au
      premier jour du trimestre civil qui suit la demande
    conditions: >-
      la cessation de toute activité pharmaceutique non salariée ; l'inaptitude
      reconnue par la commission d'inaptitude de la caisse (article 16)
  exemples: aucun trouvé
- id: statuts_de_2011
  statut: lue
  textes:
  - id: JORFARTI000024270214
    article: >-
      annexe de l'arrêté du 23 juin 2011, statuts du régime complémentaire, articles 12
      et 15, et tableau annexé à l'article 15
    en_vigueur: 2011-06-30
    publie_le: 2011-06-29
    citation: >-
      « Pour les affiliés nés à compter du 1er janvier 1956, le droit à la retraite
      définie à l'article 11 est acquis à l'âge permettant d'obtenir une pension de
      retraite à taux plein tel qu'il est fixé à l'article L. 351-8 (1°) du code de la
      sécurité sociale [...] Pour les affiliés nés à compter du 1er janvier 1956, le
      montant de la retraite définie à l'article 11 est majoré de 4 %. » 2. Il est
      inséré un second alinéa ainsi rédigé : « De façon transitoire, le droit à la
      retraite définie à l'article 11 est acquis dans les mêmes conditions qu'à
      l'alinéa précédent sauf pour la condition d'âge, qui s'établit à 65 ans pour les
      affiliés nés jusqu'au 31 décembre 1952 et à 66 ans pour les affiliés nés en 1953,
      1954 et 1955. Le montant de la retraite définie à l'article 11 est majoré de 2 %
      pour les affiliés nés en 1953, 1954 et 1955. » [...] La pension de retraite est
      majorée lorsqu'elle est liquidée au-delà de l'âge permettant d'obtenir une
      retraite à taux plein et jusqu'à cet âge augmenté de 3 ans pour les affiliés nés à
      compter du 1er janvier 1956. Cette majoration est égale à 0,5 % par trimestre.
      De façon transitoire : ― les affiliés nés jusqu'au 31 décembre 1952 peuvent
      bénéficier d'une majoration de leur pension de retraite dans les mêmes conditions,
      mais uniquement jusqu'à l'âge permettant d'obtenir une retraite entière augmenté
      d'un an [...] Article 15 : Cet article est remplacé par les dispositions suivantes : «
      Article 15 L'affilié remplissant les conditions pour prétendre au versement de la
      pension de retraite du régime complémentaire peut demander à en bénéficier dès
      l'âge d'ouverture du droit à pension de retraite tel qu'il est fixé à l'article L.
      161-17-2 du code de la sécurité sociale. A titre transitoire, pour les affiliés
      nés avant le 1er janvier 1956, l'âge d'ouverture du droit à pension de retraite
      est fixé selon le calendrier figurant à l'article D. 161-2-1-9 du code de la
      sécurité sociale. La pension de retraite est réduite par application d'un
      coefficient d'anticipation qui est fonction du nombre de trimestres manquants, à
      la date d'effet des droits, pour atteindre l'âge permettant d'obtenir une pension
      de retraite à taux plein tel qu'il est fixé à l'article L. 351-8 (1°) du code de
      la sécurité sociale. Pour les affiliés nés à compter du 1er janvier 1956, ce
      coefficient est égal à : 1,25 % par trimestre manquant pour un âge de départ à la
      retraite compris entre l'âge d'ouverture du droit à pension de retraite et 65 ans
      ; 0,5 % par trimestre manquant pour un âge de départ à la retraite compris entre
      65 ans et l'âge permettant d'obtenir une pension de retraite à taux plein. Pour
      les affiliés nés jusqu'au 31 décembre 1955, les coefficients d'anticipation
      figurent dans un tableau en annexe des présents statuts. [...] 1. Pour les assurés
      nés avant le 30 juin 1951 inclus, les coefficients sont fixés ainsi qu'il suit :
      ÂGE DE DÉPART COEFFICIENT 60 ― 25,00 % [...] 62 ― 15,00 % [...] 65 0,00 % Pas de
      majoration de pension pour un départ après 65 ans. 2. Pour les assurés nés entre
      le 1er juillet 1951 et le 31 décembre 1952 inclus, [...] 66 2,00 % Pas de
      majoration de pension pour un départ après 66 ans. 3. Pour les assurés nés entre
      le 1er janvier 1953 et le 31 décembre 1955 inclus, les coefficients sont fixés
      ainsi qu'il suit : ÂGE DE DÉPART COEFFICIENT 61 ― 22,00 % [...] 62 ― 17,00 % [...]
      64 ― 7,00 % [...] 65 ― 2,00 % [...] 66 0,00 % [...] 68 4,00 % Pas de majoration
      de pension pour un départ après 68 ans. »
  - id: JORFARTI000024270209
    article: arrêté du 23 juin 2011, article 3
    en_vigueur: 2011-06-30
    publie_le: 2011-06-29
    citation: >-
      « Sont approuvées, telles qu'elles sont annexées au présent arrêté, les
      modifications apportées aux statuts du régime d'assurance vieillesse
      complémentaire des pharmaciens. » : l'arrêté ne fixe pas de date, et entre en
      vigueur le lendemain de sa publication
  nee_de: JORFARTI000024270214
  bornes:
    liquidation.date_effet: [2011-06-30, 2024-01-10]
  contenu:
    parametres:
      age_table: cavp
      decote_par_trimestre: 0.0125
      decote_annulee_par_la_duree: false
      decote_palier_age: 65
      decote_par_trimestre_apres_palier: 0.005
