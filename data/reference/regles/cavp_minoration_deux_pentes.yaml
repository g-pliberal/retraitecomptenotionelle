effet: >-
  La fiche lisait la décote du régime de base, que la durée annule : un pharmacien
  parti à 64 ans avec sa durée ne perdait rien de sa complémentaire, là où la caisse
  lui retire 9 %. Depuis le 23 septembre 2026, table `cavp`, `decote_annulee_par_la_duree:
  false` et `decote_palier_age: 65`, dans les deux moteurs. Lue au droit le 5 novembre
  2026 (action 130) : cinq versions, les statuts d'avant le 7 juin 2009 non lus, ceux
  du 11 mai 2009, leurs articles 12 et 15 récrits le 30 juin 2011 — le tableau des nés
  jusqu'en 1955, que la fiche disait absent de l'index, y est, et le modèle le rend
  ligne pour ligne —, l'article 15 récrit le 10 janvier 2024, le règlement de 2026.
  Deux erreurs déclarées, la carrière longue depuis 2024 et la date d'effet au
  trimestre civil ; deux points non tranchés, la valeur de service par génération et le
  trimestre entamé. Retouchée le même jour, après la relecture R-E5 : un troisième
  non-tranché, la majoration des nés jusqu'au 30 juin 1951 de 2011 à 2026, et les
  arrêtés de 1956 et de 1989 nommés.
sources:
  lu_le: 2026-11-05
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Lire les statuts d'avant le 7 juin 2009 : l'arrêté du 1er juin 1950 et ses
    modifications, dont celles de 1976, 1979 et 1981 qui touchent les articles 10 et
    11, et l'arrêté du 31 août 1990 (Bulletin officiel no 90-40) ; ou les demander à la
    CAVP ; l'article 10 que touche aussi l'arrêté du 6 juillet 1977, et celui du 6 avril
    1989 (Bulletin officiel no 8920). Trouver un exemple de la caisse : la valeur de
    service servie à un pharmacien né avant 1953, la majoration d'un pharmacien né
    avant juillet 1951 parti après 65 ans de 2011 à 2026, et une pension de carrière
    longue liquidée depuis 2024.
