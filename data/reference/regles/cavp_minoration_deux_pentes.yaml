      juin 2011, articles 3 et 6 et annexe, le tableau de l'article 15 compris
      (JORFARTI000024270209, JORFARTI000024270214) ; arrêté du 19 décembre 2023, annexe,
      II (JORFARTI000048880592) ; arrêté du 10 juillet 2026, article 1er et annexe I,
      articles 8 à 16 (JORFARTI000054436084, JORFARTI000054436087) ; décret n° 2026-418,
      articles 4 et 30 ; les arrêtés sans effet de 2007, 2012, 2015, 2016, 2017, 2019,
      2023, 2025 et du 21 septembre 2026 ; les titres des arrêtés de 1956 à 1990 ; lus
      dans l'index JORF du dépôt, à jour du 5 novembre 2026, les textes qui touchent la
      section relevés par leur titre et par « CAVP » ou « assurance vieillesse des
      pharmaciens » dans leur corps, sans borne.
    date: 2026-11-05
  - type: jorf
    reference: >-
      Relus après la relecture R-E5 : arrêté du 23 juin 2011, annexe, article 12 et
