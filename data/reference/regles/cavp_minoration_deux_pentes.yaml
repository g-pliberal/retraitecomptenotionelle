    novembre 2026, dans les deux moteurs, requête du formulaire, entré à 21 ans
- version: [statuts_de_2011, statuts_de_2024, reglement_de_2026]
  textes: >-
    statuts de 2011, article 15 et son tableau ; règlement de 2026, article 12
  ecart: >-
    Le texte ne tranche pas le trimestre entamé : le coefficient est « fonction du
    nombre de trimestres manquants » (2011) ou « déterminé en fonction de l'âge de
    l'affilié » (2026), et le tableau ne donne que des âges en trimestres entiers, «
    60,25 ― 23,75 % » ; l'assuré né au second semestre de 1951 s'ouvre à 60 ans et 4
