- id: reglement_de_2026
  statut: lue
  textes:
  - id: JORFARTI000054436087
    article: annexe I de l'arrêté du 10 juillet 2026, règlement, articles 8, 12, 14 et 15
    en_vigueur: 2026-07-18
    publie_le: 2026-07-17
    citation: >-
      « Le conseil d'administration de la caisse d'assurance vieillesse des pharmaciens
      détermine chaque année la valeur de service d'un trimestre de retraite applicable
      à l'âge du taux plein fixé au 1° de l'article L. 351-8 du code de la sécurité
      sociale. « A titre transitoire : « - pour les générations nées en 1953, 1954 et
      1955, cet âge est fixé à 66 ans et la valeur de service du trimestre de retraite
      est multipliée par le quotient de 0,96 sur 0,98 ; « - pour les générations nées
      avant le 1 er janvier 1953, cet âge est fixé à 65 ans et la valeur de service du
      trimestre de retraite est multipliée par 0,96. [...] « L'affilié peut demander à
      bénéficier de sa pension de retraite du régime complémentaire dès l'âge
      d'ouverture du droit à pension de retraite tel qu'il est fixé à l'article L.
      161-17-2 du code de la sécurité sociale. « La pension de retraite est réduite par
      application d'un coefficient de minoration déterminé en fonction de l'âge de
      l'affilié à la date d'effet des droits. « Ce coefficient est égal à : « - 1,25 %
      par trimestre d'anticipation entre l'âge d'ouverture des droits et 65 ans ; « -
      0,5 % par trimestre d'anticipation entre 65 ans et l'âge fixé au 1° de l'article
      L. 351-8 du code de la sécurité sociale. [...] « Par dérogation, en cas de
      liquidation anticipée dans les conditions prévues au II de l'article L. 643-3, la
      pension de retraite complémentaire est affectée d'un coefficient de minoration
      égal à - 1,25 % par trimestre d'anticipation jusqu'à l'âge de 65 ans. « La pension
      de retraite est majorée lorsqu'elle est liquidée au-delà de l'âge du taux plein
      fixé à l'article 8 du présent règlement et jusqu'à cet âge augmenté de trois ans
      pour les affiliés nés à compter du 1 er janvier 1956. « Cette majoration est égale
      à 0,5 % par trimestre. « De façon transitoire : « - les affiliés nés avant le 30
      juin 1951 inclus ne bénéficient pas d'une majoration de leur pension de retraite
      pour un départ après 65 ans [...] « L'entrée en jouissance de la retraite de droits
      propres est fixée au premier jour du trimestre civil qui suit cette demande. [...]
      « La pension de retraite prévue au présent chapitre est augmentée d'une
      bonification de 10 % pour tout affilié ayant eu au moins trois enfants. »
