  textes:
  - id: JORFARTI000048880592
    article: annexe de l'arrêté du 19 décembre 2023, II, 2° (article 12) et 6° (article 15)
    en_vigueur: 2024-01-10
    publie_le: 2024-01-09
    citation: >-
      « 2° L'article 12 est ainsi modifié : a) Au premier alinéa, les mots : « et qui a
      cessé toute activité pharmaceutique non salariée » sont supprimés ; [...] 6°
      L'article 15 est ainsi modifié : a) Au premier alinéa les mots : « remplissant les
      conditions pour prétendre au versement de la pension de retraite du régime
      complémentaire » sont supprimés et les mots : « en bénéficier » sont remplacés par
      les mots : « bénéficier de sa pension de retraite du régime complémentaire » ; b)
      Les quatre derniers alinéas sont remplacés par deux alinéas ainsi rédigés : «
      L'affilié qui bénéficie d'une liquidation anticipée au régime de base, dans les
      conditions prévues aux II, III et IV de l'article L. 643-3 en bénéficie dans les
      mêmes conditions et modalités au régime complémentaire fonctionnant par
      répartition. « Par dérogation, en cas de liquidation anticipée dans les conditions
      prévues au II de l'article L. 643-3, sa pension de retraite complémentaire est
      affectée d'un coefficient de minoration égal à - 1,25 % par trimestre manquant
      jusqu'à l'âge de 65 ans. »
  - id: JORFARTI000048880590
    article: arrêté du 19 décembre 2023, article 2
    en_vigueur: 2024-01-10
    publie_le: 2024-01-09
    citation: >-
      « Le présent arrêté sera publié au Journal officiel de la République française. » :
      l'arrêté ne fixe pas de date, et entre en vigueur le lendemain de sa publication
  nee_de: JORFARTI000048880592
  bornes:
    liquidation.date_effet: [2024-01-10, 2026-07-18]
  contenu:
    parametres:
      age_table: cavp
      decote_par_trimestre: 0.0125
      decote_annulee_par_la_duree: false
      decote_palier_age: 65
      decote_par_trimestre_apres_palier: 0.005
      surcote_par_trimestre: 0.005
      surcote_trimestres_maximum: 12
    droit: >-
      celui des statuts de 2011, l'inapte et la carrière longue exceptés : qui liquide
      sa base par anticipation au titre des II, III ou IV de L. 643-3 liquide sa
