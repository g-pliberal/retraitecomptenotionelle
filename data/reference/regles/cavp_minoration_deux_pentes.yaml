    une pension de retraite à taux plein ». À soixante ans, les deux s'accordent.
  effet: >-
    né le 10 mars 1965, entré à 19 ans, parti en carrière longue à 62 ans le 1er avril
    2027 : le modèle sert 0,81 (12 × 1,25 % + 8 × 0,5 % = 19 %), 11 035,07 € par an ; le
