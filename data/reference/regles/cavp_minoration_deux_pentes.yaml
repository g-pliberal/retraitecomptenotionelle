      surcote_trimestres_maximum: 12
    droit: >-
      ouverture à l'âge de L. 161-17-2 (de D. 161-2-1-9 pour les nés avant 1956) ;
      retraite entière à 65 ans jusqu'à la génération 1952, à 66 ans de 1953 à 1955, à
      l'âge du 1° de L. 351-8 depuis 1956 ; 1,25 % par trimestre manquant jusqu'à 65 ans,
      0,5 % de 65 ans à cet âge, le tableau annexé l'écrivant pour les nés jusqu'en 1955 ;
      majoration de 0,5 % par trimestre au-delà, pour les nés jusqu'au 30 juin 1951
      aucune selon le tableau, jusqu'à 66 ans selon l'article 12 (non tranché), jusqu'à
      66 ans pour les nés du 1er juillet 1951 à 1952, jusqu'à 68 ans de
      1953 à 1955, trois ans depuis 1956 ; le montant majoré de 4 % depuis 1956, de 2 %
      de 1953 à 1955 ; l'inapte sans coefficient dès l'âge d'ouverture
    conditions: >-
      la cessation de toute activité pharmaceutique non salariée, jusqu'au 9 janvier
      2024 ; l'inaptitude reconnue par la commission de la caisse
  exemples: aucun trouvé
