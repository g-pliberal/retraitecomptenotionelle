    nés depuis le 1er juillet 1951, qui n'avaient pas soixante-cinq ans. Dans celle de
    l'article 12, les nés jusqu'en 1946 partis de 65 à 66 ans du 30 juin au 31 décembre
    2011 perdent leur majoration (le point non tranché suivant).
  effet: aucun dans la lecture du tableau ; voir le point suivant
- version: [statuts_de_2011, statuts_de_2024]
  textes: >-
    statuts de 2011, article 12, et tableau annexé à l'article 15, dans la même annexe
    (JORFARTI000024270214) ; règlement de 2026, article 12
  ecart: >-
    Le texte ne tranche pas, du 30 juin 2011 au 17 juillet 2026, la majoration des nés
    jusqu'au 30 juin 1951. L'article 12 la leur donne : « De façon transitoire : ― les
    affiliés nés jusqu'au 31 décembre 1952 peuvent bénéficier d'une majoration de leur
    pension de retraite dans les mêmes conditions, mais uniquement jusqu'à l'âge
    permettant d'obtenir une retraite entière augmenté d'un an », soit 66 ans. Le
    tableau la leur refuse : « 1. Pour les assurés nés avant le 30 juin 1951 inclus [...]
    Pas de majoration de pension pour un départ après 65 ans ». Pour le tableau, texte
    spécial, que le règlement de 2026 reprend (« les affiliés nés avant le 30 juin 1951
    inclus ne bénéficient pas d'une majoration de leur pension de retraite pour un
    départ après 65 ans ») et que le modèle suit ; pour l'article 12, l'article qui
    crée la majoration, quand le tableau n'est annexé qu'à celui des « coefficients
    d'anticipation ». Aucune des deux lectures n'est exclue. Depuis le 18 juillet 2026,
    le règlement tranche pour le tableau.
  effet: >-
    né le 10 mars 1950, entré à 21 ans, parti à 66 ans le 1er avril 2016 : le modèle et
    le tableau, 12 330,55 € par an, sans majoration ; l'article 12, quatre trimestres
    entiers au-delà de 65 ans (du 10 mars 2015 au 1er avril 2016, douze mois et 22
    jours), 4 × 0,5 % = 2 %, 12 330,55 × 1,02 = 12 577,16 €, 246,61 € par an de plus.
    Essai du 5 novembre 2026, dans les deux moteurs, requête du formulaire
- version: [statuts_de_2011, statuts_de_2024, reglement_de_2026]
  textes: >-
    statuts de 2011, article 12 (« majoré de 4 % », « majoré de 2 % ») ; règlement de
    2026, article 8 (« multipliée par 0,96 », « par le quotient de 0,96 sur 0,98 »)
  ecart: >-
    Le texte ne tranche pas, pour le modèle, quelle génération il sert mal. Les textes
    donnent trois valeurs de service : depuis le 30 juin 2011, celle des nés depuis 1956
    vaut 1,04 fois la retraite entière de l'article 11, celle des nés de 1953 à 1955,
    1,02 fois ; depuis le 18 juillet 2026, celle des nés avant 1953 vaut 0,96 fois celle
    des nés depuis 1956, celle des nés de 1953 à 1955, 0,96/0,98 fois. Le modèle en sert
    une seule, le rendement de 4,66 % calé sur l'annuité du mémento de 2024, 320,75 €,
    puis 4,29 % sur celle de 2026, 328,80 €, dont aucun texte lu ne dit la génération.
    Si c'est la valeur des nés depuis 1956, ce que l'article 8 de 2026 dit de la valeur
    qu'il fait fixer, le modèle sert trop aux nés jusqu'en 1955 ; si c'est la retraite
    entière de l'article 11, il sert trop peu aux nés depuis 1953 de 2011 à 2026. Les
    deux textes ne disent pas non plus le même rapport : 1/1,04 = 0,9615 en 2011, 0,96
    en 2026, pour les nés avant 1953.
  effet: >-
    dans la première lecture, né le 10 mars 1950, parti à 65 ans le 1er avril 2015 :
    12 040,82 € par an servis, 12 040,82 / 1,04 = 11 577,71 € aux statuts de 2011,
    463,11 € par an de trop, et 12 040,82 × 0,96 = 11 559,19 € au règlement de 2026,
    481,63 € ; né le 10 mars 1954, parti à 66 ans le 1er avril 2020 : 12 890,56 €
    servis, × 1,02 / 1,04 = 12 642,67 €, 247,90 € de trop, × 0,96 / 0,98 = 12 627,49 €,
