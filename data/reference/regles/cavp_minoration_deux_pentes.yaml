- version: [statuts_de_2009, statuts_de_2011, statuts_de_2024, reglement_de_2026]
  textes: statuts de 2009, article 14 ; règlement de 2026, article 14
  ecart: >-
    Erreur du modèle, déclarée, non corrigée, la même que pour la CAVOM et la CARPIMKO :
    l'entrée en jouissance « est fixée au premier jour du trimestre civil qui suit cette
    demande », phrase qu'aucun texte ne touche de 2009 à 2026 (2011 ajoute à l'article
    le paiement mensuel, 2016 en change le dernier alinéa, la fin du versement, 2025 en
    supprime le quatrième, qui n'est pas celui de l'entrée en jouissance, qu'on compte
