    sert la pension le premier du mois qui suit l'âge, avec la base
    (`date_effet_mois_suivant`). Le texte ne tranche pas si un trimestre entamé
    au-delà de l'âge du taux plein majore.
  effet: >-
    né le 10 mai 1960, entré à 21 ans, le pharmacien demande sa pension à 67 ans, en mai
    2027 : le modèle la sert dès le 1er juin 2027, 14 548,91 € par an ; le règlement, le
