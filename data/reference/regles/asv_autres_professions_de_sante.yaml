  nee_de: LEGIARTI000025077318
  bornes:
    revenu.annee: [2012-01-01, null]
  contenu:
    sages_femmes: >-
      forfait de 687 € en 2012, 705 € en 2013, 735 € en 2014, 780 € de 2015 à 2025 ;
      dix-huit points par an, sans ajustement ; valeur de service de 6,10 €, revalorisée
      chaque 1er avril jusqu'en 2025 par le coefficient de L. 161-23-1 (décret n°
      2011-2002, articles 1er et 2)
    chirurgiens_dentistes: >-
      ajustement sur le revenu, dans la limite de cinq plafonds, de 1,10 % en 2018 et
      1,45 % depuis 2019, qui ouvre 1,47 point en 2018 et 1,93 point depuis 2019 au
      plafond, au prorata en deçà (décret n° 2007-458, article 2) ; la prestation ne
      dépasse pas 420 points jusqu'en 2021 (décret n° 78-283, article 3)
    directeurs_de_laboratoire: >-
      forfait de 1 382 € en 2013, 1 469 € en 2014, 1 555 € en 2015, qui donne 262 points
      ; ajustement de 1,2 % depuis 2022 ; valeur de service revalorisée sur les prix
      moins deux points de 2013 à 2020, puis sur le coefficient de L. 161-25 moins un
      demi-point de 2022 à 2034 (décret n° 2007-597, articles 1er à 3) ; le pharmacien
      biologiste exonéré par L. 131-6-4 peut être dispensé, sans acquérir de droits
      (décret n° 81-1046, article 5 ter)
    auxiliaires_medicaux: >-
      l'ajustement de 0,40 % assis sur le revenu de la dernière année, et non plus de
      l'avant-dernière, depuis la rédaction du 14 novembre 2025 (décret n° 2008-1044,
      article 2) ; dispense sous un seuil de revenu fixé par
      arrêté (décret n° 75-891, article 6)
    depuis_2026: >-
      le décret n° 2026-418 renvoie les conditions d'attribution et de service de chaque
      régime au règlement de sa section professionnelle, approuvé par arrêté (décrets
      n° 75-891, article 7-2, et n° 81-1046, article 2) : les règlements approuvés le 10
      juillet 2026 ne sont pas lus ici
  exemples: aucun trouvé
sources:
  lu_le: 2026-10-13
  prochaine_relecture: 2027-10-13
  a_relire:
  - >-
    Lire les règlements des quatre sections approuvés par l'arrêté du 10 juillet 2026
    (JORFTEXT000054435848), et son modificatif du 21 septembre 2026 : l'âge, la
    minoration, la majoration pour enfants et la réversion de chaque régime.
  - >-
    Lire les rédactions d'origine des décrets de 1975, 1978, 1981 et 1984 — les
    cotisations en lettres clés, les points d'avant les forfaits en euros — et les
    forfaits de 2016 et d'après des directeurs de laboratoire.
  - >-
    Donner une ASV aux statuts des auxiliaires médicaux, des chirurgiens-dentistes, des
    sages-femmes et des biologistes, qui n'en ont aucune dans le modèle : c'est une
    étape de modélisation, hors de l'action 145.
  lectures:
  - type: legifrance
    reference: >-
      décrets n° 75-891, n° 78-283, n° 81-1046 et n° 84-254, dans leurs rédactions de 2012
      à 2026 ; décrets n° 2007-458, n° 2007-597, n° 2008-1044 et n° 2011-2002, leurs
      articles de cotisation, de points et de valeur de service : index LEGI du dépôt, à
      jour au 12 octobre 2026
    date: 2026-10-13
historique:
- >-
  2026-10-13 — écrite à l'étape 2 de l'action 145 : l'inventaire nomme les cinq
  professions de l'ASV, et la fiche de régime ne porte que les médecins. Les quatre
  autres régimes sont lus, non calculés.
effet: >-
  Les auxiliaires médicaux, chirurgiens-dentistes, directeurs de laboratoire et
  sages-femmes conventionnés : la part de leur pension que l'ASV sert manque dans le
  modèle, qui ne leur en donne aucune.
