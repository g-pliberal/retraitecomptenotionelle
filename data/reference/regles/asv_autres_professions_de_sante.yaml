  - {id: LEGITEXT000006062837, reference: "décret n° 78-283 du 28 février 1978 rendant obligatoire le régime de prestations supplémentaires de vieillesse des chirurgiens-dentistes conventionnés", en_vigueur: 1978-01-01}
  - {id: LEGITEXT000006063390, reference: "décret n° 81-1046 du 24 novembre 1981 relatif au régime des prestations supplémentaires de vieillesse des directeurs de laboratoires privés d'analyses médicales", en_vigueur: 1981-07-01}
  - {id: LEGITEXT000006064424, reference: "décret n° 84-254 du 5 avril 1984 rendant obligatoire le régime de prestations supplémentaires de vieillesse des sages-femmes conventionnées", en_vigueur: 1984-01-01}
