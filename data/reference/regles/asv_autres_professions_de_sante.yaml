schema_version: 1
id: asv_autres_professions_de_sante
intitule: >-
  Les auxiliaires médicaux (depuis 1975), les chirurgiens-dentistes (1978), les
  directeurs de laboratoire non médecins (1981) et les sages-femmes (1984) conventionnés
  ont chacun leur régime de prestations complémentaires de vieillesse, en points, que les
  caisses d'assurance maladie financent en partie : une cotisation forfaitaire donne un
  nombre fixe de points par an, une cotisation d'ajustement proportionnelle au revenu en
  ajoute — sauf aux sages-femmes —, et la prestation vaut les points multipliés par une
  valeur de service propre à chaque profession.
domaine: points
regimes: [asv_conventionnes]
etape: acquerir_les_droits
face: droit
etat: pas_encore_modelisee
lit:
- la profession, les années d'exercice libéral conventionné et le revenu d'activité non
  salarié de chaque année, dans la limite de cinq plafonds
- le forfait, le taux d'ajustement et la valeur de service de la profession et de
  l'année
ecrit:
- les points de prestation complémentaire de vieillesse de chaque année, et la
  prestation qu'ils donnent
dates_qui_decident:
- revenu.annee
# `revenu.annee` est l'année de la cotisation. Les quatre professions sont décrites
# ensemble, version par version ; aucune n'est calculée : leurs statuts n'ont pas d'ASV
# dans le modèle, qui ne porte que les médecins (fiche asv_medecins_points).
versions:
