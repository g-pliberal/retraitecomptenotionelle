  contenu:
    chirurgiens_dentistes: >-
      forfait de 3 150 € en 2007, 3 600 € en 2008, 3 900 € en 2009, puis revalorisé sur
      les prix hors tabac, qui donne dix points ; valeur de service de 30,49 € en 2007,
      29 € en 2008, 28 € en 2009 et 27,5 € depuis 2010 pour les pensions de l'article L.
      645-5, premier alinéa, et une grille par année d'acquisition pour les autres
      (décret n° 2007-458, articles 1er et 3)
    directeurs_de_laboratoire: >-
      un forfait, et depuis 2008 une cotisation d'ajustement de 0,30 % du revenu dans la
      limite de cinq plafonds, qui ouvre « 50 points de retraite » au plafond, au
      prorata en deçà ; valeur de service de 1,92 € au premier semestre 2007, puis 0,96 €
      jusqu'en 2010, revalorisée sur les prix ensuite (décret n° 2007-597, articles 2 et
      3)
    auxiliaires_medicaux: >-
      forfait de 400 € en 2008, 500 € en 2009 et 2010, 540 € en 2011, puis revalorisé sur
      les prix, qui donne 44 points en 2008, 26,5 en 2009, 24,5 depuis 2010 ; ajustement
      de 0,40 % du revenu dans la limite de cinq plafonds depuis 2010 (0,25 % en 2010),
      dont les points sont le rapport de la cotisation, multipliée par les points du
      forfait, au forfait, arrondi au dixième supérieur ; valeur de service de 2,60 € en
      2008, 2,54 € au second semestre 2009, 2,48 € en 2010, 2,42 € depuis 2011 (décret
      n° 2008-1044, articles 1er à 5)
    sages_femmes: les dix-huit points par an du décret de 1984
