  nee_de: LEGITEXT000006062390
  bornes:
    revenu.annee: [null, 2007-01-01]
  contenu:
    droit: >-
      quatre régimes rendus obligatoires par décret, gérés par la section
      professionnelle de chaque profession — celle des auxiliaires médicaux, la caisse
      des chirurgiens-dentistes et des sages-femmes, celle des pharmaciens pour les
      biologistes — ; pour les
      chirurgiens-dentistes, « Les cotisations et les prestations […] sont exprimées en
      fonction de la lettre clé C » (décret n° 78-283, article 2) ; pour les
      sages-femmes, « une prestation égale à 18 points de retraite par année de
      cotisations antérieure ou postérieure au 1er janvier 1984 » (décret n° 84-254,
      article 3, rédaction de 2012) ; les articles 2 à 4 du décret de 1975, qui
      portaient la cotisation des auxiliaires médicaux, sont abrogés en 2008 et ne sont
      pas lus
