historique:
- >-
  2026-10-01 — née avec le cinquième domaine, les carrières hors de France, ouvert à la
  demande du propriétaire.
- >-
  2026-10-01 — modélisée, approchée, à la troisième étape du domaine : les périodes que
  la saisie déclare comptent pour le taux de chaque régime, selon l'accord en vigueur
  avec leur État à la date d'effet.
effet: >-
  Toute personne qui a travaillé hors de France : 1,28 million de retraités résidaient à
  l'étranger fin 2024 (DREES, enquête annuelle auprès des caisses), et 20,3 % des retraités
  étaient nés à l'étranger fin 2016 (DREES, EIR). Sans ses périodes étrangères, une
  carrière commencée ailleurs partait décotée faute de durée : né en 1962, entré en France
  à vingt-huit ans après dix ans et demi au Maroc, un salarié parti à soixante-quatre ans
  passe de 142 à 185 trimestres, du taux de 42,5 % à celui de 53,75 %, surcote comprise.
