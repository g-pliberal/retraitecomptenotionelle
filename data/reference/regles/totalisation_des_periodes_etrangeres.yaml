     en_vigueur: 1998-10-25}
  nee_de: JORFTEXT000000888522
  bornes:
    liquidation.date_effet: [1983-04-01, 2010-01-01]
  contenu:
    droit: >-
      depuis que le taux plein se lit sur la durée d'assurance tous régimes (R. 351-27,
      « périodes d'assurance et périodes reconnues équivalentes »), les périodes que
      l'accord applicable fait compter s'y ajoutent : « les périodes accomplies dans un
      pays lié à la France par un accord international ou de coordination sont
      retenues pour le taux de la retraite » (circulaire n° 117/83). Sous les
      règlements européens, elles comptent dans la pension théorique, qui fixe le taux
      de la pension proratisée, et non dans la pension nationale ; sous une
      convention, dans le calcul que la convention prévoit. Elles ne comptent jamais
      dans la durée qui proratise la pension d'un régime, faite de ses seuls trimestres
    accords: >-
      celui que le tableau data/reference/legislation/accords_internationaux.yaml donne
      à l'État de la période, en vigueur à la date d'effet de la pension ; il prend en
      compte les périodes accomplies avant lui. Une convention dont le calcul n'a pas
      été lu suit la règle générale de la circulaire n° 117/83 : ses périodes comptent
      pour le taux
    superposition: >-
      « Il n'est pas retenu plus de 4 trimestres par année civile » (R. 351-5, exposés
      de la Cnav) : les périodes étrangères complètent celles que la carrière valide en
      France, sans se superposer à elles ; une période dont les dates ne sont pas
      précises est présumée ne pas se superposer (règlement 987/2009, article 12, 6)
    conversion: >-
      trois mois ou treize semaines font un trimestre, un an quatre trimestres ; une
      fraction de trimestre est arrondie au trimestre supérieur (règlement 987/2009,
      article 13 ; arrangements des conventions)
    equivalentes: >-
      l'activité professionnelle exercée à l'étranger avant le 1er avril 1983, qui « peut
      ou aurait pu donner lieu à rachat » (L. 742-2), est une période reconnue
      équivalente (R. 351-4, 1°) : elle compte pour le taux seul, sans accord, et pour
      les périodes qu'un accord ne fait pas déjà compter
    ouverture: >-
      les mêmes périodes comptent pour la carrière longue — début d'activité et durée
      cotisée, « dans les mêmes conditions que les périodes accomplies en France » —,
      pour la surcote et pour les 120 trimestres cotisés du minimum contributif majoré,
      « telles qu'indiquées sur le formulaire réglementaire de liaison » (exposés de la
      Cnav)
    regimes: >-
      le régime général et les régimes liquidés avec lui ; sous les règlements
      européens, tous les régimes légaux, ceux des fonctionnaires depuis le 25 octobre
      1998 seulement (règlement 1606/98) ; une convention ne vise que les régimes et
      les personnes qu'elle nomme — souvent les seuls salariés
    parametres:
      compte_pour_le_taux: true
      trimestres_par_annee_au_plus: 4
      mois_par_trimestre: 3
      equivalentes_avant: 1983-04-01
      fonctionnaires_depuis: 1998-10-25
  exemples: aucun trouvé
