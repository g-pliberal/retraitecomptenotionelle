code:
  python: >-
    droit/etranger.py : coordonner_les_periodes, compter_les_periodes, famille_du_regime,
    famille_des_regimes, trimestres_etrangers ; droit/coordonner.py : coordonner
    (Coordination.etranger) ; droit/compter.py : compter (Durees.etranger,
    Durees.pour_le_taux) ; droit/liquider.py : liquider_chaque_regime ; droit/ouvrir.py :
    ouvrir, age_carriere_longue ; droit/departs.py : _carriere_longue_acquise ;
    scenarios/actuel.py : CarrieresHorsDeFrance, CarriereLongue, ResultatActuel
  javascript: >-
    moteur/js/droit/etranger.js, et les jumeaux de chacune : moteur/js/droit/coordonner.js,
    compter.js, liquider.js, ouvrir.js, departs.js ; moteur/js/regimes.js :
    CarrieresHorsDeFrance, CarriereLongue ; moteur/js/scenario-actuel.js
  parametres: >-
    contenu.parametres de chaque version : compte_pour_le_taux,
    trimestres_par_annee_au_plus, mois_par_trimestre, equivalentes_avant,
    equivalentes_trimestres_francais_au_moins, fonctionnaires_depuis,
    organisations_internationales, jours_par_trimestre_organisations_internationales ;
    data/reference/legislation/accords_internationaux.yaml
  tests: >-
    tests/test_etranger.py, dans les deux moteurs
