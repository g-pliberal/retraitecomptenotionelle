approximations:
- ecart: >-
    les trimestres d'une période se comptent année civile par année civile, trois mois
    en faisant un, la fraction arrondie au trimestre supérieur dans l'année, et non sur
    le relevé que l'institution de l'autre État transmet ; l'activité à l'étranger
    d'avant 1983, reconnue équivalente, se compte de même, sa règle n'étant pas lue ;
    les quatre-vingt-dix jours d'une organisation internationale se comptent aussi
    dans l'année, et non de date à date sur toute la période
  effet: un trimestre au plus par période, à ses deux bords ; non mesuré
- ecart: >-
    l'année civile que la période occupe pour plus de la moitié des mois de la
    carrière est une année sans activité en France, et l'autre une année française
    entière : les mois de l'année partagée comptent d'un seul côté
  effet: un trimestre au plus à chaque bord d'une période ; non mesuré
- ecart: >-
    une convention bilatérale coordonne avec le régime général tous les régimes que la
    fiche nomme hors de la fonction publique — les indépendants, les exploitants
    agricoles, les professions libérales, les avocats —, alors qu'elle ne vise que les
    régimes qu'elle nomme ; l'accord avec le Royaume-Uni ne coordonne pas les régimes
    des fonctionnaires, son texte n'étant pas lu sur ce point ; les régimes spéciaux
    ne retiennent aucune période étrangère, que les règlements européens leur font
    pourtant compter ; l'équivalence d'avant 1983 ne vaut pas pour la fonction
    publique
  effet: non mesuré
- ecart: >-
    depuis 2011, l'équivalence d'avant 1983 ne se lit que sur les vingt trimestres
    d'assurance en France ; les cinq années civiles à la charge de l'assurance maladie
    française, l'autre branche de la condition, ne sont pas connues
  effet: >-
    l'activité d'avant 1983 de qui a moins de vingt trimestres en France, mais cinq
    ans d'assurance maladie française, ne compte pas ; non mesuré
- ecart: >-
    les trimestres étrangers ne comptent ni pour la surcote — seuls ceux accomplis en
    France après l'âge légal la font —, ni pour la retraite progressive, ni pour les
    points gratuits de la retraite complémentaire des exploitants agricoles
  effet: non mesuré
sources:
  lu_le: 2026-10-01
  prochaine_relecture: 2027-04-30
  a_relire:
  - >-
    Ouverte le 1er octobre 2026 avec le domaine des carrières hors de France
    (docs/architecture.md, § 11), à la demande du propriétaire. La chronologie porte
    les périodes à l'étranger depuis la deuxième étape du domaine ; le moteur en compte
    les trimestres depuis la troisième, pour le taux, la décote, la surcote, la carrière
    longue et la durée cotisée, jamais pour la proratisation.
  - >-
    À lire : le texte réglementaire qui fixe la durée d'affiliation à l'assurance maladie
    exigée par L. 742-2 depuis 2011, que seul l'exposé de la Cnav donne (cinq années
    civiles, ou vingt trimestres) ; les arrangements administratifs de chaque convention
    pour la conversion de leurs périodes ; les conventions d'avant l'entrée des États
    dans l'Union, dont le tableau des accords ne dit que les dates ; la convention
    franco-espagnole du 27 juin 1957 et franco-portugaise du 16 novembre 1957, dont les
    dates ne sont pas lues ; la règle de la caisse des fonctionnaires, que la
    documentation de la CNRACL et du Service des retraites de l'État, injoignables d'une
    session, n'a pas permis de lire au-delà de la page « La durée d'assurance » du
    Service des retraites de l'État.
  - >-
    Les périodes d'activité en Algérie antérieures au 1er juillet 1962, que le régime
    général valide gratuitement (loi n° 64-1330, protocole n° 3 du 19 janvier 1965),
    sont des périodes françaises : elles relèvent du domaine des périodes assimilées,
    non de celui-ci.
