  contenu:
    droit: >-
      avant le 1er avril 1983, le taux du régime général se lit sur l'âge seul — 25 %
      à soixante ans, 50 % à soixante-cinq (fiche decote_avant_1983) — et la durée ne
      fait que proratiser la pension : les périodes accomplies dans un autre État
      n'en changent pas le taux. Les règlements et les conventions les totalisent
      pour ouvrir le droit et pour la pension théorique, que le prorata ramène aux
      périodes françaises (fiche pension_proratisee)
    parametres:
      compte_pour_le_taux: false
  exemples: aucun trouvé
