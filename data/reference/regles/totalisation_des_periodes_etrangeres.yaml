schema_version: 1
id: totalisation_des_periodes_etrangeres
intitule: >-
  Les périodes d'assurance accomplies hors de France comptent dans la durée qui fixe
  le taux de la pension et ouvre les droits — taux plein, décote, surcote, carrière
  longue, majoration du minimum contributif —, jamais dans la durée qui proratise la
  pension : celles d'un État lié à la France par les règlements européens ou par une
  convention de sécurité sociale, selon l'accord en vigueur à la date d'effet de la
  pension ; depuis 2010, celles d'une institution européenne ou d'une organisation
  internationale, pour le taux seul ; à défaut d'accord, l'activité exercée à
  l'étranger avant le 1er avril 1983, pour le taux seul, comme période reconnue
  équivalente.
domaine: coordination
regimes: [regime_general, msa_salaries, cancava, organic, rsi, fonction_publique_etat,
  cnracl, fspoeie, cnavpl, cnbf, msa_non_salaries]
etape: coordonner_les_affiliations
face: droit
etat: approchee
lit:
- les périodes à l'étranger de la personne, l'État où chacune a été accomplie, son début et
  sa fin, et la nature de son activité, salariée ou non
- l'accord que data/reference/legislation/accords_internationaux.yaml donne à cet État à la
  date d'effet de la pension
- les trimestres que la carrière valide en France chaque année, que les périodes étrangères
  complètent sans dépasser quatre
ecrit:
- pour chaque accord applicable, les trimestres étrangers qu'il fait compter, année par
  année, dans la durée d'assurance tous régimes qui fixe le taux et ouvre les droits, et qui
  restent hors de la durée qui proratise la pension de chaque régime
- les trimestres reconnus équivalents de l'activité à l'étranger antérieure au 1er avril
  1983, et ceux d'une institution européenne ou d'une organisation internationale, qui ne
  comptent que pour le taux
dates_qui_decident:
- liquidation.date_effet
- periode.debut
- periode.fin
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Ce
# qui change d'un État à l'autre — l'accord et sa date — est dans le tableau
# des accords ; ce qui change ici est ce que le droit français fait des
# périodes que l'accord lui apporte.
