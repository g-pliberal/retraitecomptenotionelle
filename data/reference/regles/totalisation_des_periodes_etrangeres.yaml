    url: https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_2010042_22042010.aspx
    date: 2010-04-22
  - type: autre
    reference: >-
      CLEISS, « Quelle retraite après avoir travaillé à l'étranger ? » et ses quatre
      pages (règlements européens, un accord, plusieurs accords, un État sans accord) :
      les trois types d'accords bilatéraux et les exemples de Léna ; la page de chaque
      accord (textes, entrée en vigueur, personnes visées)
    url: https://www.cleiss.fr/particuliers/retraite/index.html
