    article: convention, article 2
    citation: >-
      « Le Gouvernement français supportera la charge des pensions civiles acquises par
      les anciens fonctionnaires, instituteurs et ministres des cultes du pays
      d'Alsace-Lorraine ainsi que par leurs veuves et orphelins »
    lu_le: 2026-11-24
