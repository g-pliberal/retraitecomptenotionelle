    article: article 1er, deuxième alinéa
    citation: >-
      « Le traitement du personnel des cultes sera déterminé conformément aux crédits
      alloués par la loi de finances de l'exercice 1923. Les traitements ainsi établis
      serviront de base pour le calcul de la retraite. »
    lu_le: 2026-11-24
  - reference: >-
      décret du 19 février 1921 sur les pensions d'Alsace-Lorraine (convention de
      Baden-Baden du 3 mars 1920), extrait publié par Legirel, copie de l'Internet Archive
