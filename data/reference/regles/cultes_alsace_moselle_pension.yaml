    Lire le texte français de la loi locale et de son règlement, publié en traduction
    au recueil des actes administratifs des préfectures du Bas-Rhin, du Haut-Rhin et de
    la Moselle (décret n° 2013-395) ou sur Legirel, injoignable le 4 octobre 2026 : le
