sources:
  lu_le: 2026-11-24
  prochaine_relecture: 2027-11-24
  a_relire:
  - >-
    Lire les décrets de 1923 à 1934 et l'arrêté du 6 mars 1978 (textes_a_relire), au
    fac-similé du Journal officiel sur Légifrance ou sur Gallica : les deux sites
    demandent une vérification humaine.
  - >-
    Demander au bureau des cultes de la préfecture du Bas-Rhin, qui liquide ces
    pensions, sa pratique : les émoluments qui comptent (traitement indiciaire seul ou
    avec l'indemnité de résidence), l'arrondi au multiple de 3 transposé en euros ou
    non, la revalorisation des pensions servies (sur le traitement des actifs ou sur les
    prix), la pension de besoin de l'article 39 et son montant.
  - >-
    La coordination du ministre qui quitte le ministère avant dix années, ou sans
    incapacité : la base Ircantec dit qu'il « ne peut pas bénéficier » de l'Ircantec ;
    aucun texte lu ne le rétablit au régime général.
  - >-
    Les règles de temps de service du statut de 1873 (articles 45 à 52) valent-elles
    pour les ministres, l'article 10 renvoyant le décompte à l'ordonnance du 16 mars
    1910 ? Voir la fiche cultes_alsace_moselle_services.
