  lectures_divergentes:
  - >-
    La base Ircantec écrit que les ministres « cotisent auprès d'un régime local de
    retraite » ; le Journal du Net (« les ministres des cultes ne cotisent pas du
    tout ») et les textes lus — la loi de 1909, le statut de 1873, les décrets de 2007,
    qui ne retiennent rien sur le traitement — disent qu'aucune cotisation n'est
    retenue. Reste à vérifier qu'aucun texte de 1923 à 1934 n'en ait institué une.
  - >-
    L'ancienne lecture de la fiche (4 octobre 2026) tenait la suppression de « l'âge
    ou » à l'article 7 pour une règle d'incapacité : l'article 7, deuxième alinéa, règle
    le passage à l'échelon de traitement supérieur (« au début du trimestre qui suit
    celui où l'intéressé a atteint l'âge ou l'ancienneté de service qui lui donne droit
    à ce passage ») ; depuis 2007, seule l'ancienneté y fait monter.
historique:
- >-
  2026-10-04 — née avec l'action 145 : le régime de retraite des ministres des cultes
  concordataires n'avait pas de ligne d'inventaire.
- >-
  2026-11-24 — relue dans la traduction officielle de 2013 et la version consolidée de
  Legirel : la version de 1909 devient lue, avec le barème du statut de 1873 ; naissent
  les versions des décrets de 1923 à 1934 et de l'arrêté de 1978, supposées ; la borne
  du décret de 2007 passe au lendemain de sa publication, celle de l'arrêté de 2001 à un
  jour franc après la sienne ; la règle de l'article 7 est corrigée ; le décompte des
  services et les veuves et orphelins passent dans leurs fiches.
effet: >-
  Les quelque 1 400 ministres et employés des cultes rémunérés par l'État en
  Alsace-Moselle : le modèle n'a ni leur statut ni leur pension d'État.
