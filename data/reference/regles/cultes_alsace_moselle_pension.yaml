schema_version: 1
id: cultes_alsace_moselle_pension
intitule: >-
  Le ministre d'un culte reconnu d'Alsace-Moselle, et l'employé des secrétariats de ses
  autorités supérieures, mis à la retraite parce qu'il est devenu durablement incapable
  d'exercer son ministère, reçoit de l'État, sans avoir cotisé, après dix années de
  services au moins, une pension de 20/60 de ses émoluments, augmentée de 1/60 par année
  accomplie de la onzième à la trentième et de 1/120 au-delà, 45/60 au plus ; aucun
  certificat médical ne lui est demandé à partir de 70 ans en 1910, de 65 ans depuis 1978,
  de 60 ans depuis 2001.
domaine: duree
regimes: [cultes_alsace_moselle]
etape: liquider_chaque_regime
face: droit
etat: pas_encore_modelisee
lit:
- les années entières de services valables pour la retraite, que la fiche
  cultes_alsace_moselle_services compte
- les émoluments de service touchés en dernier lieu ; depuis 2007, le traitement de
  l'indice brut de l'échelon (arrêté du 8 octobre 2007), converti en indice majoré
  (grilles/bareme/indices.csv) et multiplié par la valeur du point
  (legislation/point_indice_fonction_publique.csv)
- les émoluments plus élevés touchés un an au moins dans un poste antérieur, et la raison
  du changement de poste (statut de 1873, article 43)
- l'âge du ministre à la demande de mise à la retraite, son consentement, la constatation
  de son incapacité et sa cause, en service ou non
ecrit:
- la pension annuelle de l'État du ministre, et le jour où elle commence à être due
- la fraction de ses émoluments qu'elle représente, et la pension sur laquelle se
  calculent celles de sa veuve et de ses orphelins (fiche cultes_alsace_moselle_reversion)
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension. La règle est celle de
# la loi locale du 15 novembre 1909, lue dans sa traduction officielle (décret
# n° 2013-395) ; des décrets de 1923 à 1934, que ni l'index ni Légifrance ne donnent,
# modifient ses articles 10, 11, 12 et 14 : les versions qui suivent le premier d'entre
# eux le disent (textes_a_relire).
versions:
- id: loi_locale_1909
  statut: lue
  textes:
  - reference: >-
      loi locale du 15 novembre 1909 relative aux traitements et pensions des ministres
      des cultes rétribués par l'État et de leurs veuves et orphelins, traduction
      officielle publiée au recueil des actes administratifs de la préfecture du
      Bas-Rhin, numéro spécial du 15 mai 2013, pages 84 à 88 (décret n° 2013-395)
    article: article 10, premier alinéa, et troisième alinéa, première phrase
    en_vigueur: 1910-04-01
    citation: >-
      « Les ministres du culte désignés aux articles 1er à 6 reçoivent une pension sur la
      Caisse d'Alsace-Lorraine conformément aux dispositions en vigueur pour les
      fonctionnaires d'Alsace-Lorraine, lorsqu'après dix années au moins de service, ils
      deviennent d'une façon durable par suite d'une infirmité corporelle ou de
      l'affaiblissement de leurs facultés physiques ou intellectuelles incapables
      d'exercer leur ministère et sont pour cette raison mis à la retraite. » ; « Pour le
      calcul de la pension, on ajoutera aux émoluments de service une somme de 400 marks
      à raison du droit au logement gratuit ou de l'indemnité en tenant lieu. »
    lu_le: 2026-11-24
    empreinte: >-
      sha256:4409ed75fa679b5c2a3c3fab6e7599615e735384b558dde000b6b453183aa5b3, le PDF du
      recueil (467 442 octets), téléchargé sur bas-rhin.gouv.fr le 24 novembre 2026
  - reference: >-
      loi du 31 mars 1873 relative au statut des fonctionnaires d'Empire, même recueil,
      page 12
    article: article 41
    citation: >-
      « La pension s'élève, si le fonctionnaire compte dix années entières de services ou
      moins, aux 20/60 des émoluments de service déterminés aux articles 42 à 44 ; elle
      s'augmente de 1/60 desdits émoluments pour chaque année accomplie en plus après la
      dixième année jusqu'à la trentième révolue, et de 1/120 pour chaque année accomplie
      en sus de trente années. Lorsqu'elle a atteint les 45/60 desdits émoluments, la
      pension ne s'augmente plus. » ; « Le montant annuel de la pension doit être augmenté
      de telle manière que son chiffre divisé par 3 donne comme quotient des marks
      entiers. »
    lu_le: 2026-11-24
  - reference: loi du 31 mars 1873, même recueil, page 12
    article: articles 36, 39 et 43
    citation: >-
      article 36 : le fonctionnaire dont l'incapacité a été contractée « dans l'exercice
      ou à l'occasion de ses fonctions, sans qu'il y ait faute de sa part, […] a droit à
      la pension, même s'il ne compte pas encore dix ans de services » ; article 39 : le
      fonctionnaire mis à la retraite pour incapacité avant ses dix années, « se trouve
      dans le besoin, il peut lui être accordé […] une pension, soit temporaire, soit
      viagère » ; article 43 : « En aucun cas, le total de la pension ne pourra dépasser
      les émoluments de service, comptant pour la pension, touchés en dernier lieu. »
    lu_le: 2026-11-24
  - reference: >-
      règlement ministériel du 19 mars 1910 portant règlement d'administration publique
      pour l'exécution de la loi du 15 novembre 1909, même recueil, page 97
    article: articles 7 et 8
    citation: >-
      « La demande d'agrément devra être appuyée du consentement du ministre du culte, et,
      s'il n'a pas encore accompli l'âge de 70 ans, d'une attestation d'un médecin
      assermenté. » ; sans consentement, « la mise à la retraite s'effectuera à
      l'expiration du trimestre qui suit le mois au cours duquel la décision prononçant
      l'admission à la retraite a été notifiée au ministre du culte ; à ce moment cesse
      le paiement du traitement ou du supplément de traitement, et la pension commence à
      être due »
    lu_le: 2026-11-24
  - reference: >-
      loi du 20 mai 1911 relative au budget d'Alsace-Lorraine pour l'exercice 1911, même
      recueil, page 110
    article: article 12, deuxième alinéa
    citation: >-
      « Les articles 7, 9, 10 et 11 de la loi du 15 novembre 1909 […] sont appliqués par
      analogie aux secrétaires généraux, secrétaires et contrôleurs dont cet emploi tient
      lieu d'occupation principale, et les articles 9, 10, 11, aux expéditionnaires et
      garçons de bureau dont cet emploi tient lieu d'occupation principale. »
    lu_le: 2026-11-24
  - id: JORFARTI000027408505
    article: décret n° 2013-395 du 14 mai 2013, article 1er
    publie_le: 2013-05-15
    citation: >-
      « La version officielle en langue française des textes énumérés ci-dessous est
      annexée au présent décret et sera publiée au recueil des actes administratifs des
      préfectures du Bas-Rhin, du Haut-Rhin et de la Moselle », la liste nommant la loi
      du 31 mars 1873, la loi du 15 novembre 1909 sur les ministres des cultes, la loi du
      même jour sur les veuves et orphelins des fonctionnaires, l'ordonnance du 16 mars
      1910, le règlement du 19 mars 1910, la loi du 20 mai 1911 et l'ordonnance du
      1er septembre 1911
    lu_le: 2026-11-24
  bornes:
    liquidation.date_effet: [null, 1923-04-13]
  contenu:
    beneficiaires: >-
      les ministres des cultes rétribués par l'État que nomment les articles 1er à 6 —
      vicaires généraux, chanoines, curés, desservants, chapelains et vicaires
      catholiques, pasteurs et ministres auxiliaires protestants, grands rabbins et
      rabbins — ; par analogie, les secrétaires généraux, secrétaires et contrôleurs
      des secrétariats des autorités supérieures des cultes dont c'est l'occupation
      principale (loi du 20 mai 1911, article 12). Avant le 1er avril 1910, la loi du
      13 mai 1884 (catholiques) et celle du 6 juillet 1901 (pasteurs), que l'article 12
      abroge, et qui ne sont pas lues.
    condition: >-
      dix années de services au moins, une incapacité durable d'exercer le ministère, par
      infirmité corporelle ou affaiblissement des facultés physiques ou intellectuelles,
      et la mise à la retraite pour cette raison (article 10) ; sans les dix années, la
      pension est due si l'incapacité vient du service, sans faute (article 36 du statut
      de 1873), et peut être accordée par le Ministère au ministre dans le besoin, 20/60
      au plus (articles 39 et 41) ; aucun texte lu ne fixe de limite d'âge
    certificat_medical: >-
      la demande de mise à la retraite porte le consentement du ministre et, avant
      70 ans, l'attestation d'un médecin assermenté (règlement, article 7) : passé
      70 ans, l'incapacité se déclare sans médecin
    mise_a_la_retraite: >-
      prononcée par l'autorité compétente pour la destitution, avec l'approbation du
      Statthalter ou du Ministère (article 10, deuxième alinéa)
    parametres:
      services_minimum_ans: 10
      age_sans_certificat_medical: 70
      taux_jusqu_a_dix_ans: 20/60
      taux_par_annee_de_la_onzieme_a_la_trentieme: 1/60
      taux_par_annee_au_dela_de_trente: 1/120
      taux_maximum: 45/60
      taux_maximum_pension_de_besoin: 20/60
      annees: entières (« chaque année accomplie »)
      logement_ajoute_marks: 400
      arrondi: au multiple de 3 marks supérieur
    base: >-
      les émoluments de service touchés en dernier lieu — le traitement des articles 1er
      à 6, en marks —, plus 400 marks pour le logement ; ni l'indemnité pour
      l'administration d'un poste vacant ni les indemnités spéciales de certains postes ;
      pour les chapelains et vicaires catholiques, le total de leur traitement, allocation
      et supplément ; le pasteur devenu pasteur auxiliaire après un an au moins comme
      pasteur, sur son dernier traitement de pasteur (article 10, troisième alinéa) ; des
      émoluments plus élevés touchés un an au moins dans un poste antérieur, sauf
      changement à sa demande ou disciplinaire, la pension ne dépassant jamais les
      derniers émoluments (statut de 1873, article 43)
    debut: >-
      au jour que l'autorité fixe dans sa demande, quand le ministre consent ; sinon, à
      l'expiration du trimestre qui suit le mois où la décision lui a été notifiée, où
      cesse le traitement (règlement, article 8)
    debiteur: la Caisse d'Alsace-Lorraine
    cotisation: aucune ; la loi ne retient rien sur le traitement
    deces: >-
      la pension continue d'être payée pendant le trimestre qui suit le mois du décès, en
      une fois et d'avance (article 10, renvoi à l'article 69 du statut de 1873)
    cumul: >-
      la pension est suspendue, pour ce qui dépasse les derniers émoluments, quand le
      pensionné touche de nouveaux émoluments d'un service public (statut de 1873,
      article 57)
    disciplinaire: >-
      le Ministère peut laisser au ministre relevé de ses fonctions une partie de sa
      pension légale (article 10, quatrième alinéa)
    cas_pose_a_la_main: >-
      Posé à la main, non officiel : un pasteur mis à la retraite en 1911 après
      25 années de services, au traitement de 4 400 marks (« Au-delà de 24 années de
      service », article 5). Base : 4 400 + 400 = 4 800 marks ; taux : 20/60 + 15/60 =
      35/60 ; pension : 4 800 × 35/60 = 2 800 marks, portée à 2 802 marks, multiple de 3.
  exemples: aucun trouvé
  exemples_cherches: >-
    le recueil des actes administratifs du Bas-Rhin du 15 mai 2013, la version consolidée
    de Legirel (copie de l'Internet Archive du 23 mai 2024), la réponse du ministre de
    l'intérieur à la question écrite n° 06644 (JO Sénat du 27 juillet 2023) et la
    réponse à la question n° 12996 de l'Assemblée nationale : aucun calcul de pension
    publié, le 24 novembre 2026
- id: decrets_de_1923_a_1934
  statut: supposee
  hypothese: >-
    La notice de la loi locale au Journal officiel (JORFTEXT000000315082) la dit modifiée
    en ses « articles 10, 11, 12 al. 3 et 4, et article 14 […] entre autres, par décrets
    des 13 avril 1923, 17 juillet 1926, 19 juin 1928, 7 décembre 1928, 1er juillet 1930,
    1er décembre 1931, 9 mars 1933, 5 mai 1934 et 28 octobre 1934 », dont ni l'index ni
    Légifrance ne donnent le texte ; le décret du 1er juillet 1930 codifie « divers
    textes rendus applicables en matière de pensions aux retraités du service local
    d'Alsace-Lorraine » et étend à ces retraités « certaines dispositions nouvelles » de
    la loi du 14 avril 1924 (son analyse au JORF). La version suppose que les conditions,
    le barème et l'arrondi de 1909 demeurent, sur le traitement que fixe la loi de
    finances (loi du 22 juillet 1923, article 1er, lue) ; la presse décrit aujourd'hui
    le même barème (un tiers du dernier traitement après dix ans, trois quarts après
    quarante ans). La somme ajoutée pour le logement, 400 marks dans le texte jusqu'en
    2007, n'a pas de montant lu en francs.
  fiabilite: moyenne, faute des décrets de 1923 à 1934
  textes:
