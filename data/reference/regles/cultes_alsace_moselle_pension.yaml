  exemples: aucun trouvé
- id: decret_2007
  statut: lue
  textes:
  - {id: JORFARTI000002478887, article: "décret n° 2007-1341, article 2 (nouvel article 1er de la loi locale)", publie_le: 2007-09-13}
  - {id: JORFARTI000001307187, article: "décret n° 2007-1341, article 3 (article 7 de la loi locale)", publie_le: 2007-09-13}
  - {id: JORFARTI000002478888, article: "décret n° 2007-1341, article 4 (article 8 de la loi locale)", publie_le: 2007-09-13}
  - {id: JORFARTI000002290398, article: "décret n° 2007-1341, article 6 (article 10 de la loi locale)", publie_le: 2007-09-13}
  - {id: JORFARTI000002290399, article: "décret n° 2007-1341, article 7 (article 11 de la loi locale)", publie_le: 2007-09-13}
  nee_de: JORFARTI000002478887
  bornes:
    liquidation.date_effet: [2007-09-13, null]
  contenu:
    traitement: >-
      les ministres « perçoivent un traitement de l'État selon un classement indiciaire
      fixé par décret et par référence aux indices » des personnels civils et militaires
      de l'État (nouvel article 1er) — la pension suit ce traitement
    incapacite: « l'âge ou » est supprimé de l'article 7 de la loi locale
    anciennete: >-
      s'appliquent les articles 2 à 4 (article 8) puis 5 à 7 (article 10) de
      l'ordonnance du Statthalter du 16 mars 1910 « relative à la fixation de
      l'ancienneté de traitement et de l'ancienneté de pension des ministres du culte »
    debiteur: >-
      les pensions des articles 10 et 11 sont dues « de l'État » et non plus « sur la
      caisse d'Alsace-Lorraine », le « Statthalter » devenant le ministre de l'intérieur
    en_2023: >-
      inchangée par la loi du 14 avril 2023 : la loi de 1909 « détermine le régime de
      retraite spécifique des agents des cultes statutaires d'Alsace-Moselle »
      (réponse du ministre de l'intérieur, JO Sénat du 27 juillet 2023)
  exemples: aucun trouvé
