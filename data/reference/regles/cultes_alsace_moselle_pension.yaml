schema_version: 1
id: cultes_alsace_moselle_pension
intitule: >-
  Le ministre d'un culte reconnu d'Alsace-Moselle rétribué par l'État reçoit de l'État,
  sans avoir cotisé, une pension de retraite selon la loi locale du 15 novembre 1909 et
  l'arrêté du 19 mars 1910, après dix années de services au moins, quand il devient
  durablement incapable d'exercer son ministère ; sa veuve et ses orphelins ont droit à
  une pension. Le décret n° 2007-1341 met sa pension à la charge « de l'État » et lui
  applique les règles d'ancienneté de l'ordonnance du 16 mars 1910.
domaine: duree
regimes: [cultes_alsace_moselle]
etape: liquider_chaque_regime
face: droit
etat: pas_encore_modelisee
lit:
- les années de services du ministre rétribuées par l'État, et son ancienneté de pension
- son dernier traitement, selon le classement indiciaire des ministres des cultes
- la constatation de son incapacité, et son âge à la demande
ecrit:
- la pension de l'État du ministre, et celle de sa veuve et de ses orphelins
dates_qui_decident:
- liquidation.date_effet
versions:
- id: loi_locale_1909
  statut: supposee
  hypothese: >-
    le texte de la loi locale et de son règlement de 1910 n'est pas dans l'index, qui
    n'en porte que la notice (« articles 10, 11, 12 al. 3 et 4, et article 14 »,
    modifiés par des décrets de 1923 à 1934) ; sa règle est reprise de l'extrait de sa
    version consolidée sur le site Legirel du CNRS, lu par un moteur de recherche le
    4 octobre 2026, le site étant injoignable : les ministres « peuvent obtenir une
    pension de retraite sur la caisse d'Alsace-Lorraine, conformément aux dispositions
    applicables aux fonctionnaires d'Alsace-Lorraine, lorsque, après au moins dix ans de
    service, ils deviennent définitivement incapables d'exercer leur ministère en raison
    d'une infirmité physique ou d'un affaiblissement de leurs facultés physiques ou
    intellectuelles, et sont mis à la retraite pour cette raison » (article 10)
  fiabilite: moyenne, une lecture indirecte que les modifications de 2001 et 2007 confirment
  bornes:
    liquidation.date_effet: [null, 2001-06-23]
  contenu:
    condition: dix années de services au moins, et l'incapacité définitive d'exercer le ministère
    droit: une pension « sur la caisse d'Alsace-Lorraine », aux règles des fonctionnaires d'Alsace-Lorraine
    age: >-
      aucun âge légal : la mise à la retraite suit l'incapacité ; l'arrêté du 19 mars
      1910 (article 7, modifié en 1978) fixait à soixante-cinq ans un seuil que l'arrêté
      de 2001 abaisse à soixante — selon la presse, l'âge en deçà duquel un certificat
      médical est exigé
    cotisation: aucune, selon la presse (Journal du Net) et le Conseil d'État, qui refuse aux ministres la qualité de fonctionnaire (avis du 27 août 1948)
  exemples: aucun trouvé
