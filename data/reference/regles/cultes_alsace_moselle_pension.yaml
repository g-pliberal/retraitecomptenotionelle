    base: >-
      le traitement de l'État de l'échelon, selon le classement indiciaire (décret
      n° 2007-1445 et arrêté du 8 octobre 2007, à compter du 1er octobre 2007) : l'indice
      brut de l'échelon, son indice majoré, la valeur du point ; la somme de 400 marks
      pour le logement, l'exclusion des indemnités et la règle des chapelains et vicaires
      sont supprimées (« La quatrième, la cinquième et la sixième phrases sont
      supprimées ») ; la phrase du pasteur auxiliaire et l'article 43 du statut de 1873
      demeurent
    debiteur: l'État (« de l'Etat »)
    cotisation: >-
      aucune retenue dans les textes lus ; les ministres sont « affiliés au régime local
      des pensions de retraite » (décret n° 2007-1445, article 1er)
    arrondi: >-
      le multiple de 3 marks de l'article 41 n'a pas de règle lue en euros (sources,
      a_relire)
    parametres:
      services_minimum_ans: 10
      age_sans_certificat_medical: 60
      taux_jusqu_a_dix_ans: 20/60
      taux_par_annee_de_la_onzieme_a_la_trentieme: 1/60
      taux_par_annee_au_dela_de_trente: 1/120
      taux_maximum: 45/60
      taux_maximum_pension_de_besoin: 20/60
      annees: entières (« chaque année accomplie »)
    cas_pose_a_la_main: >-
      Posés à la main, non officiels, pour une pension qui prend effet en 2026, à la
      valeur annuelle de l'indice 100 majoré de 5 907,34 euros (décret n° 2023-519,
      article 1er), sans l'arrondi au multiple de 3. Un curé de 40 années de services :
      indice brut 672, majoré 565 ; traitement 565 × 59,0734 = 33 376,47 euros ; taux
      20/60 + 20/60 + 10/120 = 45/60 ; pension 25 032,35 euros par an (2 086,03 par
      mois). Un pasteur de 25 années : indice brut 646, majoré 545 ; traitement
      32 195,00 euros ; 35/60 ; pension 18 780,42 euros. Un desservant de 12 années :
      indice brut 493, majoré 430 ; traitement 25 401,56 euros ; 22/60 ; pension
      9 313,91 euros. Un ministre parti après huit années, sans incapacité venue du
      service et sans besoin reconnu : aucune pension de l'État.
