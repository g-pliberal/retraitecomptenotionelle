historique:
- >-
  2026-10-04 — née avec l'action 145 : le régime de retraite des ministres des cultes
  concordataires n'avait pas de ligne d'inventaire.
effet: >-
  Les quelque 1 400 ministres et employés des cultes rémunérés par l'État en
  Alsace-Moselle : le modèle n'a ni leur statut ni leur pension d'État.
