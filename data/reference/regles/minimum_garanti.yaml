  - type: legifrance
    reference: >-
      L. 17 CPCMR, rédaction du 28 décembre 1975 au 1er janvier 2004
      (LEGIARTI000006362711), lue dans l'index LEGI du dépôt : « a) Lorsque la
      pension rémunère vingt-cinq années au moins de services effectifs, au
      traitement brut afférent à l'indice 100 [...] ; b) Lorsque la pension
      rémunère moins de vingt-cinq années de services effectifs, à 4 p. 100 [...]
      par année de services effectifs et de bonifications » : le barème de 1976 du
      dépôt, 60 % à quinze ans et la totalité à vingt-cinq
    date: 2026-09-29
  - type: legifrance
    reference: >-
      décret n° 65-773 du 9 septembre 1965 (CNRACL), article 17, rédactions du 12
