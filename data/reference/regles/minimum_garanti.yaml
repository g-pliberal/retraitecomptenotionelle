historique:
- >-
  2026-09-29 — servi aux pensions liquidées avant 2004, dans les trois régimes : leurs
  périodes le déclarent depuis le code de 1964 et les décrets de 1965, le barème du
  dépôt commençant en 1976 (domaine des départs multiples, la pension militaire
  servie dès la sortie de l'armée).
