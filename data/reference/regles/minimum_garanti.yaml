schema_version: 1
id: minimum_garanti
intitule: >-
  Plancher de la pension civile, barème en escalier sur la durée de services, référence
  gelée en 2004 puis indexée sur les prix. Sous quinze ans, depuis 2011, la référence
  rapportée à la durée qui ouvre le pourcentage maximum (L. 17, d), le quinzième
  de 57,5 % par année restant à l'invalidité et à qui avait atteint l'âge d'ouverture
  avant 2011 (L. 17, c). Sans la durée, ouvert à l'âge d'annulation de la décote,
  minoré de neuf, sept, cinq, trois et un trimestres pour un âge d'ouverture atteint
  de 2011 à 2015.
etat: conforme
etape: completer_tous_regimes
effet: >-
  Fonctionnaires à carrière courte. Jusqu'au 24 septembre 2026, le modèle servait
  à toute pension de moins de quinze ans le quinzième de 57,5 % de l'invalidité
  : 680,90 € par mois pour treize ans en 2026, au lieu de 417,94 € (170 trimestres).
  Les exemples publiés sont rejoués par tests/test_fonction_publique_etat.py, le
  harnais des témoins officiels ne construisant qu'une affiliation. Jusqu'au 29
  septembre 2026, les trois régimes ne le déclaraient qu'à partir de 2004 : une
  pension liquidée avant restait sans plancher, alors que le barème de 1976 et
  le texte étaient dans le dépôt ; le militaire liquidé à sa sortie de l'armée
  en 2000, qu'un départ par régime fait paraître, perdait 2 378,39 € par an en
  euros de son départ déclaré.
sources:
  lu_le: 2026-09-29
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    L'écrêtement du sixième alinéa de L. 17 — le minimum n'est servi que si le total
    des pensions ne dépasse pas « un montant fixé par décret » — et la condition
    d'avoir liquidé toutes ses pensions ne sont pas appliqués, et c'est le droit
    : la CNRACL écrit de chacune que « cette mesure n'est pas appliquée en l'absence
    de décret d'application » (lu le 24 septembre 2026). Surveiller la parution
    de ce décret. Le montant de 2023 du fichier (1 248,33 € par mois) était celui
    du 1er juillet 2022 : il est corrigé le 23 septembre 2026 à 1 258,32 €, valeur
    du 1er janvier 2023, que deux chemins officiels donnent — la revalorisation
    de 0,8 %, et le montant publié de 2024 divisé par la sienne. Aucune page lue
    ne la publie en toutes lettres.
