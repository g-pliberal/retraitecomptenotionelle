- id: statuts_de_2005
  statut: supposee
  hypothese: >-
    les pensions qui prennent effet du 1er janvier 2005 au 31 décembre 2013 relèvent des
    statuts approuvés par l'arrêté du 28 décembre 2004, « publié intégralement au
    Bulletin officiel n° 2005/01 », que l'index JORF ne porte pas. Trois de leurs
    phrases se lisent ailleurs : l'article 20 récrit par l'arrêté du 27 février 2008, la
    majoration de 30 % par enfant à charge ; et deux que l'arrêté du 16 décembre 2013
    remplace, au premier alinéa de l'article 14, « La demande ne peut être antérieure ni
    au soixante-cinquième anniversaire du notaire, ni à la fin de son exercice », et
    l'article 15, dont le premier alinéa, avant les neuf qu'il insère, devient le
    dixième, que l'arrêté récrit : on n'en lit que la rédaction de 2014, celle de l'inapte.
    Le reste ne se lit pas. Que ces phrases datent de 2005 n'est dit nulle part, mais
    l'index JORF ne porte, du 28 décembre 2004 au 16 décembre 2013, qu'une approbation de
    modifications de ces statuts, celle du 27 février 2008, qui ne récrit que l'article
    20. Le modèle sert la règle du régime de base, à l'âge d'ouverture de la base
  fiabilite: >-
    faible : l'âge d'ouverture, que l'article 14 en vigueur le 31 décembre 2013 met à
    65 ans, sans qu'aucun texte lu ne dise s'il l'était depuis 2005 ni qu'aucun autre
    article ne l'avance ; le coefficient et la place de la durée, non lus
  textes:
  - id: JORFARTI000001075201
    article: arrêté du 28 décembre 2004, mention au Journal officiel
    en_vigueur: 2005-01-01
    publie_le: 2005-02-04
    citation: >-
      « sont approuvés les nouveaux statuts du régime d'assurance vieillesse
      complémentaire de la section professionnelle des notaires. L'arrêté du 24 avril
      1962 portant approbation du nouveau règlement de la section professionnelle des
      notaires au régime d'assurance vieillesse complémentaire est abrogé. Le présent
      arrêté prend effet le 1er janvier 2005. Nota. - L'arrêté du 28 décembre 2004 sera
      publié intégralement au Bulletin officiel n° 2005/01 »
  - id: JORFARTI000018229446
    article: arrêté du 27 février 2008, article 1er (article 20 des statuts)
    en_vigueur: 2008-03-09
    publie_le: 2008-03-08
    citation: >-
      « L'article 20 des statuts annexés à l'arrêté du 28 décembre 2004 susvisé est rédigé
      comme suit : « 1. Le notaire retraité ayant des enfants à charge, âgés de moins de
      vingt et un ans ou inaptes à assurer seuls leur existence, perçoit pour chacun
      d'entre eux une majoration de 30 % des droits qu'il a acquis à la fin de son
      exercice professionnel. » : l'arrêté ne fixe pas de date, et entre en vigueur le
      lendemain de sa publication
  - id: JORFARTI000028387445
    article: >-
      annexe de l'arrêté du 16 décembre 2013, articles 14 et 15 des statuts, les mots
      qu'elle remplace
    publie_le: 2013-12-27
    citation: >-
      « L'article 14 est ainsi modifié : ― au premier alinéa, les mots : « cette demande.
      La demande ne peut être antérieure ni au soixante-cinquième anniversaire du notaire,
      ni à la fin de son exercice » sont remplacés par les mots [...] L'article 15 est
      ainsi modifié : ― avant le premier alinéa, sont insérés neuf alinéas [...] le
      dixième alinéa est ainsi rédigé : « Toutefois, le conseil d'administration peut
      accorder à celui que des infirmités ou une maladie grave ont contraint de cesser ses
      fonctions et rendent inapte à exercer régulièrement toute activité professionnelle,
      la jouissance »
  nee_de: JORFARTI000001075201
  bornes:
    liquidation.date_effet: [2005-01-01, 2014-01-01]
  contenu:
    parametres:
      age_table: null
      decote_par_trimestre: 0.0125
      decote_annulee_par_la_duree: true
      surcote_par_trimestre: null
      surcote_age_maximum: null
    droit: >-
      présumé : la règle du modèle, celle du régime de base, à l'âge d'ouverture de la
      base ; non tranché, la demande pas avant le soixante-cinquième anniversaire, sauf
      l'inapte, au moins le 31 décembre 2013 ; 30 % des droits par enfant à charge depuis
      le 9 mars 2008, non modélisé
    conditions: >-
      la fin de l'exercice ; l'inaptitude reconnue par le conseil d'administration
  exemples: aucun trouvé
- id: statuts_de_2014
  statut: lue
  textes:
  - id: JORFARTI000028387445
    article: >-
      annexe de l'arrêté du 16 décembre 2013, articles 14, 15 et 16 des statuts
    en_vigueur: 2014-01-01
    publie_le: 2013-12-27
    citation: >-
      « L'article 14 est ainsi modifié : ― au premier alinéa, les mots : « cette demande.
      La demande ne peut être antérieure ni au soixante-cinquième anniversaire du notaire,
      ni à la fin de son exercice » sont remplacés par les mots : « la fin d'exercice,
      sous réserve que le dossier de demande de retraite soit parvenu à la caisse dans les
      trois mois suivant cette date. A défaut, l'entrée en jouissance sera fixée au 1er
      jour du mois civil qui suit la réception du dossier de demande de retraite » [...]
      L'article 15 est ainsi modifié : ― avant le premier alinéa, sont insérés neuf
      alinéas ainsi rédigés : « L'âge du bénéfice de la pension à la retraite est fixé
      comme suit : « Pour les affiliés nés avant le 1er janvier 1954 : « ― l'âge légal
      d'ouverture des droits est fixé à 60 ans ; « ― l'âge légal du départ à taux plein
      est fixé à 65 ans. « Pour les affiliés nés à compter du 1er janvier 1954 : « ―
      l'âge légal d'ouverture des droits est celui visé à l'article L. 161-17-2 du code
      de la sécurité sociale différé de vingt-quatre mois ; « ― l'âge légal du départ à
      taux plein est celui visé à l'article L. 161-17-2 du code de la sécurité sociale
      différé de vingt-quatre mois et augmenté de cinq ans. « Si la demande de retraite
      intervient avant l'âge du taux plein, il est appliqué un coefficient de minoration
      sur la pension déterminé en fonction de l'âge atteint à la date de liquidation. «
      Ce coefficient de minoration est fixé à 1,25 % par trimestre séparant l'âge de
      l'affilié à la date de liquidation de l'âge du taux plein. » [...] le dixième alinéa
      est ainsi rédigé : « Toutefois, le conseil d'administration peut accorder à celui
      que des infirmités ou une maladie grave ont contraint de cesser ses fonctions et
      rendent inapte à exercer régulièrement toute activité professionnelle, la
      jouissance, à partir de l'âge légal mentionné ci-dessus minoré de dix ans, des
      retraites auxquelles il pourrait prétendre, sans l'application du coefficient de
      minoration. [...] L'article 16 est ainsi rédigé : « Si la demande de retraite
      intervient après l'âge du taux plein, un coefficient de majoration est appliqué à la
      pension des notaires ayant continué à exercer et à cotiser dans les conditions de
      l'article 15. « Le coefficient de majoration est fixé à 0,5 % par trimestre au-delà
      de l'âge du taux plein, jusqu'à l'âge de 70 ans. »
  - id: JORFARTI000028387441
    article: arrêté du 16 décembre 2013, article 2
    en_vigueur: 2014-01-01
    publie_le: 2013-12-27
    citation: « Le présent arrêté prend effet au 1er janvier 2014. »
  nee_de: JORFARTI000028387445
  bornes:
    liquidation.date_effet: [2014-01-01, 2017-06-22]
  contenu:
    parametres:
      age_table: cprn_2014
      decote_par_trimestre: 0.0125
      decote_annulee_par_la_duree: false
      surcote_par_trimestre: 0.005
      surcote_age_maximum: 70
    droit: >-
      ouverture à 60 ans et taux plein à 65 ans pour les nés avant 1954 ; depuis, l'âge
      de L. 161-17-2 « différé de vingt-quatre mois » et ce même âge « augmenté de cinq
      ans » ; 1,25 % par trimestre séparant l'âge de la liquidation de l'âge du taux
      plein, la durée n'y entrant pas ; 0,5 % par trimestre au-delà, jusqu'à 70 ans ;
      l'inapte sans coefficient dix ans avant l'âge légal ; l'entrée en jouissance après
      la fin d'exercice, au mois civil faute du dossier dans les trois mois
    conditions: >-
      la fin de l'exercice ; l'inaptitude accordée par le conseil d'administration
  exemples: aucun trouvé
- id: statuts_de_2017
  statut: lue
  textes:
  - id: JORFARTI000034975971
    article: >-
      annexe de l'arrêté du 31 mai 2017, statuts du régime d'assurance vieillesse
      complémentaire, articles 18, 19, 21 et 23
    en_vigueur: 2017-06-22
    publie_le: 2017-06-21
    citation: >-
      « Le droit aux allocations ne peut être reconnu qu'aux notaires ayant acquitté
      l'intégralité de leurs cotisations. « L'âge de l'ouverture du droit à pension de
      retraite est fixé comme suit : « Pour les affiliés nés avant le 1er janvier 1954 :
      « - l'âge légal d'ouverture des droits est fixé à 60 ans ; « - l'âge légal du
      départ à taux plein est fixé à 65 ans. « Pour les affiliés nés à compter du 1er
      janvier 1954 : «- l'âge légal d'ouverture des droits est celui visé à l'article L.
      161-17-2 du code de la sécurité sociale différé de vingt-quatre mois ; «- l'âge
      légal du départ à taux plein est celui visé à l'article L. 161-17-2 du code de la
      sécurité sociale différé de vingt-quatre mois et augmenté de cinq ans. [...] « Le
      droit à l'allocation est fixé au premier jour du mois civil qui suit la date de fin
      d'exercice ou la date souhaitée par l'affilié, sous réserve que le dossier de
      demande de retraite comprenant l'ensemble des pièces justificatives soit parvenu à
      la caisse de retraite dans les trois mois. [...] « 1. - Si la demande de retraite
      intervient avant l'âge requis pour bénéficier d'une allocation au taux plein, il est
      appliqué une décote sur la pension déterminé en fonction de l'âge atteint à la date
      de la liquidation. « La décote est fixée à 1,25% par trimestre séparant l'âge de
      l'affilié à la date de liquidation de l'âge requis pour bénéficier d'une allocation
      au taux plein. « 2. - A partir de l'âge légal si l'affilié est reconnu invalide par
      le médecin expert de la caisse, il pourra bénéficier d'une retraite sans
      application de coefficient de minoration. [...] « 1. - Si la demande de retraite
      intervient après l'âge du taux plein défini à l'article 18, une surcote est
      appliquée à la pension des notaires ayant continué à exercer et à cotiser dans les
      conditions définies par les présents statuts. « La surcote est fixée à 0,5 % par
      trimestre au-delà de l'âge du taux plein, jusqu'à l'âge de 70 ans. « 2. - Le
      notaire retraité ayant des enfants reconnus fiscalement à charge, âgés de moins de
      vingt et un ans ou inaptes à assurer seuls leur existence, perçoit pour chacun
      d'entre eux une majoration de 30 % des droits acquis à la fin de son exercice
      professionnel. »
  - id: JORFARTI000034975968
    article: arrêté du 31 mai 2017, article 1er
    en_vigueur: 2017-06-22
    publie_le: 2017-06-21
    citation: >-
      « Sont approuvés, tels qu'ils sont annexés au présent arrêté, les statuts du régime
      invalidité-décès des notaires et les modifications apportées aux statuts de la
      section professionnelle des notaires, aux statuts du régime d'assurance vieillesse
      complémentaire des notaires » : ni cet article ni l'article 2 ne fixent de date ;
      l'arrêté entre en vigueur le lendemain de sa publication
  nee_de: JORFARTI000034975971
  bornes:
    liquidation.date_effet: [2017-06-22, 2024-01-01]
  contenu:
    parametres:
      age_table: cprn_2014
      decote_par_trimestre: 0.0125
      decote_annulee_par_la_duree: false
      surcote_par_trimestre: 0.005
      surcote_age_maximum: 70
    droit: >-
      les âges, la décote et la surcote des statuts de 2014, récrits mot pour mot ; la
      pension au premier jour du mois civil qui suit la fin d'exercice ou la date
      souhaitée ; l'invalide sans coefficient « à partir de l'âge légal » ; 30 % des
      droits par enfant reconnu fiscalement à charge de moins de vingt et un ans
    conditions: >-
      l'intégralité des cotisations acquittée ; l'invalidité reconnue par le médecin
      expert de la caisse
  exemples: aucun trouvé
- id: statuts_de_2024
  statut: lue
  textes:
  - id: JORFARTI000048679350
    article: >-
      annexe de l'arrêté du 29 novembre 2023, I, 3° à 5° (articles 18, 21 et 23 des
      statuts)
    en_vigueur: 2024-01-01
    publie_le: 2023-12-28
    citation: >-
      « 3° L'article 18 est remplacé par les dispositions suivantes : « Art. 18. - Le
      droit aux allocations ne peut être reconnu qu'aux notaires ayant acquitté
      l'intégralité de leurs cotisations. « L'âge de l'ouverture du droit à pension de
      retraite est celui mentionné à l'article L. 161-17-2 du code de la sécurité
      sociale. « La retraite est attribuée à taux plein à compter de l'âge mentionné au 1°
      de l'article L. 351-8 du code de la sécurité sociale. » ; 4° L'article 21 est ainsi
      modifié : a) Au premier alinéa, le mot : « déterminé » est remplacé par le mot : «
      déterminée » ; b) Au troisième alinéa, les mots : « l'âge légal » sont remplacés
      par les mots : « l'âge mentionné au IV de l'article L. 643-3 du code de la sécurité
      sociale » [...] 5° L'article 23 est ainsi modifié : a) Au deuxième alinéa, le
      pourcentage : « 0,5 % » est remplacé par le pourcentage : « 1 % » et les mots : «
      70 ans » sont remplacés par les mots : « fin d'activité » ; b) L'article est
      complété par un alinéa ainsi rédigé : « 3. - La pension de retraite est assortie
      d'une majoration de 10 % pour tout affilié ayant eu un nombre minimum de 3 enfants
      dans les conditions définies à l'article L. 351-12 du code de la sécurité sociale.
      »
  - id: JORFARTI000048679346
    article: arrêté du 29 novembre 2023, article 2
    en_vigueur: 2024-01-01
    publie_le: 2023-12-28
    citation: « Les dispositions du présent arrêté entrent en vigueur le 1er janvier 2024. »
  nee_de: JORFARTI000048679350
  bornes:
    liquidation.date_effet: [2024-01-01, 2026-07-18]
  contenu:
    parametres:
      age_table: null
      decote_par_trimestre: 0.0125
      decote_annulee_par_la_duree: false
      surcote_par_trimestre: 0.01
      surcote_age_maximum: null
    droit: >-
      ouverture à l'âge de L. 161-17-2, taux plein à celui du 1° de L. 351-8 ; 1,25 %
      par trimestre séparant l'âge de la liquidation de l'âge du taux plein, la durée n'y
      entrant pas ; 1 % par trimestre au-delà, jusqu'à la fin d'activité ; l'invalide
      sans coefficient à l'âge du IV de L. 643-3 ; 30 % par enfant à charge ; 10 % pour
      trois enfants ; la pension au mois civil, comme en 2017
    conditions: >-
      l'intégralité des cotisations acquittée ; l'invalidité reconnue par le médecin
      expert de la caisse
  exemples: aucun trouvé
- id: reglement_de_2026
  statut: lue
  textes:
  - id: JORFARTI000054435995
    article: >-
      annexe de l'arrêté du 10 juillet 2026, règlement du régime d'assurance vieillesse
      complémentaire, articles 4, 5, 7 et 9
    en_vigueur: 2026-07-18
    publie_le: 2026-07-17
    citation: >-
      « L'âge de l'ouverture du droit à pension de retraite est celui mentionné à
      l'article L. 161-17-2 du code de la sécurité sociale. « La retraite est attribuée à
      taux plein à compter de l'âge mentionné au 1° de l'article L. 351-8 du code de la
      sécurité sociale. [...] « Le droit à l'allocation est fixé au premier jour du mois
      civil qui suit la date de fin d'exercice ou la date souhaitée par l'affilié [...] «
      1° Si la demande de retraite intervient avant l'âge requis pour bénéficier d'une
      allocation au taux plein, il est appliqué une décote sur la pension déterminée en
      fonction de l'âge atteint à la date de la liquidation. « La décote est fixée à 1,25
      % par trimestre séparant l'âge de l'affilié à la date de liquidation de l'âge requis
      pour bénéficier d'une allocation au taux plein ; [...] « La surcote est fixée à 1 %
      par trimestre au-delà de l'âge du taux plein, jusqu'à l'âge de fin d'activité ; « 2°
      Le notaire retraité ayant des enfants reconnus à charge, âgés de moins de vingt et
      un ans ou inaptes à assurer seuls leur existence, perçoit pour chacun d'entre eux une
      majoration de 30 % des droits contributifs acquis à la fin de son exercice
      professionnel, à l'exclusion de toute majoration, surcote ou accessoire de pension.
      [...] « 3° La pension de retraite est assortie d'une majoration de 10 % pour tout
      affilié ayant eu un nombre minimum de 3 enfants dans les conditions définies à
      l'article L. 351-12 du code de la sécurité sociale. »
  - id: JORFARTI000054435992
