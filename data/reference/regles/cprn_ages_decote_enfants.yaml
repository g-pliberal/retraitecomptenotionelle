    90-42), du 16 décembre 1996 (no 97-03) et du 21 février 2001, au seul Bulletin
    officiel ; statuts de 2005, au seul Bulletin officiel (no 2005/01) ; l'article 14 que
    cite l'arrêté du 16 décembre 2013
  ecart: >-
    Avant le 1er janvier 2014, le modèle sert la complémentaire à l'âge d'ouverture de
    la base, sous la décote du régime de base, que la durée annule. Le texte ne tranche
    pas, faute d'être lu (question 22 du propriétaire). Première lecture, celle du modèle
    : rien de ce qui se lit ne ferme la complémentaire avant 65 ans ni n'en fixe le
    coefficient. Seconde lecture : l'article 14 en vigueur le 31 décembre 2013 dit « La
    demande ne peut être antérieure ni au soixante-cinquième anniversaire du notaire, ni
    à la fin de son exercice », et l'article 15 n'excepte que l'inapte : l'arrêté de 2013
    n'en laisse pas voir l'ancien premier alinéa, il le récrit (« le dixième alinéa est
    ainsi rédigé : « Toutefois, le conseil d'administration peut accorder à celui que des
    infirmités ou une maladie grave ont contraint de cesser ses fonctions [...] »), et que
    l'ancien visât l'inapte se déduit des onzième et douzième alinéas, qu'il ne modifie
    que par mots (« d'un médecin agréé par la caisse », « 2° Une attestation du président
    de la chambre ») ; l'ancien article 16, qu'il récrit aussi (« L'article 16 est ainsi
    rédigé »), n'est pas lu et a pu porter une liquidation anticipée. La complémentaire
    ne s'ouvre alors qu'à 65 ans, sans coefficient. Elle n'est pas tenable pour la
    première tant que les statuts ne sont pas lus : un autre article, ou le troisième
    alinéa de l'article 14, peut avancer l'âge. Que la phrase de l'article 14 date de
    2005 n'est dit nulle part, mais, du 28 décembre 2004 au 16 décembre 2013, l'index JORF
    ne porte qu'une approbation de modifications de ces statuts, celle du 27 février
    2008, qui ne récrit que l'article 20 : sauf une modification que le Journal officiel
    n'aurait pas mentionnée, la seconde lecture vaut, si elle vaut, depuis le 1er janvier
    2005. Le même texte décide du passage de 2014 pour qui a cessé d'exercer avant. Déjà
    déclaré dans
    `liquidation_regime_par_regime`, non doublé : ici, chiffré
  effet: >-
    né le 10 mars 1948, entré à 22 ans, parti à 60 ans le 1er avril 2008 : le modèle sert
    la CPRN dès ce jour, 6 979,83 € par an (8 trimestres manquant à la durée, 0,90) ; la
    seconde lecture ne la sert qu'au 1er avril 2013, à 65 ans, sans coefficient : 5 ×
    6 979,83 = 34 899,15 € servis avant, puis 6 979,83 / 0,90 = 7 755,37 € par an, 775,54
