- version: [statuts_de_2017, statuts_de_2024]
  textes: >-
    statuts de 2017, articles 18 et 19 ; arrêté du 29 novembre 2023, annexe, I, 3°
    (article 18), et article 2
  ecart: >-
    Erreur du modèle, déclarée, non corrigée, celle de `liquidation_regime_par_regime`
    (le passage de 2024), prouvée et chiffrée ici : le modèle lit l'âge de la CPRN dans
    les règles en vigueur au départ déclaré. Le notaire qui cesse d'exercer en 2023 à
    l'âge de L. 161-17-2 attend « l'âge [...] différé de vingt-quatre mois » des statuts
    de 2017 ; mais depuis le 1er janvier 2024, « L'âge de l'ouverture du droit à pension
    de retraite est celui mentionné à l'article L. 161-17-2 », sans réserve pour qui a
    cessé avant, et le droit « est fixé au premier jour du mois civil qui suit la date de
    fin d'exercice ou la date souhaitée par l'affilié ». La lecture contraire — les
    statuts du jour de la cessation garderaient leur âge — n'est pas tenable : l'arrêté
    entre en vigueur le 1er janvier 2024 sans disposition transitoire, et la pension
    prend effet sous la rédaction de sa date d'effet
  effet: >-
    né le 10 mars 1961, entré à 22 ans, parti à 62 ans le 1er avril 2023 : le modèle sert
    la CPRN le 1er avril 2025, à 64 ans, 14 679,08 € par an de 2025 (12 trimestres
    jusqu'à 67 ans, 0,85) ; les statuts la lui ouvrent le 1er janvier 2024, à 62 ans, 9
    mois et 22 jours, 17 trimestres compté le trimestre entamé, 0,7875 : 14 679,08 / 0,85
    × 0,7875 = 13 599,74 € par an aux valeurs de 2025, et 13 599,74 × 15 / 12 = 16 999,675,
    soit 16 999,68 € sur les quinze mois que le modèle ne sert pas (16 999,67 € si l'on
    n'arrondit pas l'annuel avant de le multiplier) ; puis 1 079,34 € par an de trop, qui
    compare deux dates de liquidation, le 1er janvier 2024 et le 1er avril 2025, que les
    statuts permettent toutes deux (« la date souhaitée par l'affilié ») et ne vaut donc
    que dans la règle du modèle, servir chaque caisse dès son ouverture (16 trimestres,
    0,80 : 13 815,60 €, 13 815,60 × 15 / 12 = 17 269,50 € sur les quinze mois, 17 269,51 €
    sans arrondir l'annuel, et 863,48 € par an de trop). Essai du 5 novembre 2026, dans les
    deux moteurs, requête du formulaire
