schema_version: 1
id: cprn_ages_decote_enfants
intitule: >-
  Régime complémentaire de la CPRN, section C. Avant 2014, des statuts que le Journal
  officiel ne publie pas, non lus. Du 1er janvier 2014 au 31 décembre 2023 : ouverture
  à 60 ans et taux plein à 65 pour les nés avant 1954, puis à l'âge de L. 161-17-2 «
  différé de vingt-quatre mois » et à ce même âge « augmenté de cinq ans » — 64 et 69
  ans pour les générations 1955 et suivantes. Depuis 2024 : l'âge de L. 161-17-2 et
  celui du 1° de L. 351-8. Dans les deux cas, une décote de 1,25 % par trimestre
  séparant l'âge de l'affilié de l'âge du taux plein, que la durée n'annule pas ; la
  pension au premier jour du mois civil qui suit la fin d'exercice ou la date souhaitée
  ; 30 % des droits par enfant à charge de moins de vingt et un ans ; depuis 2024, une
  majoration de 10 % pour trois enfants dans les conditions de L. 351-12.
domaine: decote_surcote
regimes: [cprn_complementaire]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  l'âge du notaire à la date d'effet de sa pension, dont le droit « est fixé au premier
  jour du mois civil qui suit la date de fin d'exercice ou la date souhaitée par
  l'affilié », et sa génération, qui donne l'âge d'ouverture et l'âge du taux plein —
  de 2014 à 2023, 60 et 65 ans pour les nés avant 1954, puis l'âge de L. 161-17-2 «
  différé de vingt-quatre mois » et ce même âge « augmenté de cinq ans » ; depuis 2024,
  l'âge de L. 161-17-2 et celui du 1° de L. 351-8
- >-
  l'invalidité reconnue par le médecin expert de la caisse, qui ouvre la retraite sans
  coefficient de minoration
- >-
  le nombre d'enfants, trois au moins ouvrant 10 % depuis 2024, et les enfants à charge
  de moins de vingt et un ans, 30 % des droits chacun
- la date d'effet de la pension, qui choisit la rédaction des statuts ou du règlement
ecrit:
- >-
  le coefficient qui minore ou majore les points de la section C, que
  `abattement_regime_de_base` et la majoration de `surcote_par_age_seul` rendent à
  `liquider_chaque_regime`, et l'âge d'ouverture et du taux plein, que la table
  `cprn_2014` de `ages_regimes.csv` rend de 2014 à 2023 ; la majoration de 10 % pour
  trois enfants depuis 2024
dates_qui_decident:
- liquidation.date_effet
versions:
- id: reglement_d_avant_2005
  statut: supposee
  hypothese: >-
    les pensions qui prennent effet avant le 1er janvier 2005 relèvent des statuts
    approuvés par l'arrêté du 29 octobre 1948, puis du règlement approuvé par l'arrêté
    du 24 avril 1962 (« PORTANT APPROBATION DU NOUVEAU REGLEMENT DE LA SECTION
    PROFESSIONNELLE DES NOTAIRES RELATIF AU REGIME D'ASSURANCE VIEILLESSE
    COMPLEMENTAIRE », JORFTEXT000000804758), que l'arrêté du 28 décembre 2004 abroge, et
    de leurs modifications. L'index JORF n'en porte que les titres, ni article ni annexe,
    et de quelques-uns un court résumé : l'arrêté du 21 avril 1954 (« ART. 19 »,
    JORFTEXT000000475360), du 2 août 1963 (JORFTEXT000000437564), du 20 novembre 1964 («
    ART. 8 » et « ART. 20-BIS,50 A 55 », JORFTEXT000000620399), du 21 avril 1966 (« ART.
    10 BIS », JORFTEXT000000485481), du 10 octobre 1967 (JORFTEXT000000480805), du 15 juin
    1971 (JORFTEXT000000638038), du 18 février 1975 (JORFTEXT000000308317), du 1er
    septembre 1983 (« ART. 9-BIS,16,16-BIS,20,39,41 ET 47 », JORFTEXT000000468711), du 20
    juin 1985 (« ART. 8,9,20,43 ET 52 », JORFTEXT000000491023) et du 8 décembre 1987
    (JORFTEXT000000340498). Cinq ne se lisent qu'au Bulletin officiel : celui du 9 juin
    1980 (« ART. 18 (AL. 1 ET 3) », JORFTEXT000000314300), celui du 19 avril 1983 (« ART.
    2 ET 2-BIS DES STATUTS », JORFTEXT000000652420), celui du 12 septembre 1990 (« art.
    18, 23, 29 et 59 », Bulletin officiel 90-42, JORFTEXT000000533318), celui du 16
    décembre 1996 (« ART. 2,8,9-BIS,10,12,16,16-BIS,17,18,57,ANNEXES N0S 1 ET 2 »,
    JORFTEXT000000368550 ; « sera publié intégralement au Bulletin officiel no 97-03 »,
    JORFARTI000002135074) et celui du 21 février 2001 (« art. 30, 36, 39, 40, 41 et 47 »,
    JORFARTI000002396641 ; « paraîtra dans un prochain Bulletin officiel »,
    JORFARTI000001924450). Aucun ne se lit. Le
    modèle sert la règle du régime de base : 1,25 % par trimestre manquant jusqu'à l'âge
    d'annulation de la décote de la génération, que la durée annule, à l'âge d'ouverture
    de la base, sans majoration ni bonification pour enfants
  fiabilite: >-
    faible : l'âge, le coefficient, la place de la durée et les majorations, que nul
    texte lu ne date avant le 1er janvier 2005
  bornes:
