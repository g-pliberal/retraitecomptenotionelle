effet: >-
  La fiche lisait les âges du régime général et laissait la durée annuler la décote :
  un notaire parti à l'âge légal avec sa durée ne perdait rien de sa section C, là où
  les statuts lui retirent 1,25 % par trimestre jusqu'au taux plein — 15 % à 64 ans
  depuis 2024, 25 % à 64 ans de 2014 à 2023 pour les générations d'après 1954, qui
  n'avaient le taux plein qu'à 69 ans. Depuis le 23 septembre 2026 : `age_table:
  cprn_2014`, `decote_annulee_par_la_duree: false` et `majoration_enfants` ; tenu par
  tests/test_sections_juridiques.py. Lue au droit le 5 novembre 2026 (action 130) : six
  versions, le règlement et les statuts d'avant 2014 non lus, les statuts de 2014, de
  2017 et de 2024, le règlement de 2026 ; les âges, la décote, la surcote et les dix
  pour cent de trois enfants rendus par le modèle ; une erreur déclarée, le passage de
  2024 ; deux points non tranchés, l'âge d'avant 2014 et le trimestre entamé ; les 30 %
  par enfant à charge non modélisés ; la date d'effet au mois civil, comme le modèle.
