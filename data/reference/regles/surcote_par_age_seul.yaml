  textes:
  - id: JORFARTI000033521562
    article: arrêté du 30 novembre 2016, annexe, 1°, statuts de la CARMF, article 15
    publie_le: 2016-12-04
    en_vigueur: 2017-01-01
    citation: >-
      « A compter du 1er janvier 2017, pour bénéficier de l'ouverture des droits à la
      retraite complémentaire, le médecin doit simultanément : « 1. Etre âgé de l'âge
      prévu au premier alinéa de l'article L. 351-1 du code de la sécurité sociale. « Si
      le médecin demande à bénéficier de la retraite complémentaire après cet âge, il
      est fait application d'un coefficient de majoration de 1,25 % par trimestre
      séparant le premier jour du trimestre civil suivant celui où le médecin atteint
      cet âge de la date d'effet de la retraite. « Le coefficient de majoration est le
      cas échéant réduit à 0,75 % par trimestre à partir du premier jour du trimestre
      civil suivant celui où le médecin atteint l'âge de 65 ans, sans pouvoir
      s'appliquer au-delà du premier jour du trimestre civil suivant le soixante dixième
      anniversaire du médecin. »
