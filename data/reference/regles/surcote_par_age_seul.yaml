      L. 351-1 du code de la sécurité sociale, « Si le médecin demande à bénéficier des
      prestations supplémentaires de vieillesse après cet âge, il est fait application
      d'un coefficient de majoration de 1,25 % par trimestre séparant le premier jour du
      trimestre civil suivant celui où le médecin atteint cet âge de la date d'effet de
      la retraite. »
