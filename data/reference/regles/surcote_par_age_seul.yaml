schema_version: 1
id: surcote_par_age_seul
intitule: >-
  Majoration de la pension des complémentaires libérales liquidées après l'âge du taux
  plein, par trimestre ou par année pleine de report, au taux et dans les bornes que
  fixent les statuts de chaque section : depuis 2017, 1,25 % par trimestre après 62 ans,
  0,75 % après 65 ans, jusqu'à 70 ans (CARMF, ASV des médecins) ; 1,25 % par trimestre
  civil entier dans la limite de vingt trimestres (CARPIMKO) ; au-delà de 65 ans, 1,25 %
  par trimestre plein dans la limite de 25 %, 0,75 % et 15 % de septembre 2018 à juillet
  2025 (CAVEC) ; 0,5 % par trimestre pendant trois ans au plus, moins pour les nés avant
  1956 (CAVP) ; 5 % par année entière de report, d'un à cinq ans, avec trente années
  d'affiliation, sur les points des trente premières années (Cipav) ; aux notaires qui
  continuent d'exercer, 0,5 % jusqu'à 70 ans, puis 1 % jusqu'à la fin d'activité depuis
  2024 (CPRN).
regimes: [asv_conventionnes, carmf_complementaire, carpimko_complementaire,
  cavec_complementaire, cavp_complementaire, cipav_complementaire, cprn_complementaire]
etat: approchee
etape: liquider_chaque_regime
effet: >-
  Les complémentaires de la CARMF, de la CARPIMKO, de la CAVEC, de la CAVP, de la Cipav et
  de la CPRN, et l'ASV des médecins, dont les périodes renvoient à cette fiche ; la
  CARCDSF et la CAVAMAC, par leurs propres fiches. Relue à la source le 27 septembre 2026,
  caisse par caisse. La CARMF et l'ASV sont servies comme leurs textes, qui comptent
  « après l'âge de 62 ans » depuis l'arrêté du 22 mars 2017. La CARPIMKO majore depuis
  l'âge où la pension pouvait être liquidée sans abattement, l'âge légal dès que la durée
  du régime de base est atteinte (`surcote_depuis_la_duree`) ; la CAVP, dans les bornes
  de la génération — rien pour les nés jusqu'au 30 juin 1951, jusqu'à 66 ans pour ceux du
  1er juillet 1951 à 1952, jusqu'à 68 ans pour ceux de 1953 à 1955, trois ans au-delà du
  taux plein ensuite (`age_surcote_maximum` de la table `cavp`) ; la Cipav, cinq années
  au plus, comptées de 65 ans jusqu'en 2021 et de l'âge du taux plein ensuite ; la CPRN,
  les seuls trimestres d'exercice (`surcote_trimestres_cotises`). À la CAVEC, les taux
  changent aux pensions qui prennent effet depuis le 5 septembre 2018 (0,75 %) et depuis
  le 7 juillet 2025 (1,25 %), lendemains de la publication de deux arrêtés sans date
  d'effet propre, que ses périodes coupent au jour (`date_effet`, docs/architecture.md,
  § 4.6) ; le moteur les servait en 2019 et en 2026, jusqu'à 10 points d'écart aux
  liquidations de septembre à décembre 2018 et de juillet à décembre 2025. Un écart y
  reste, qui attend ce que le modèle ne sait pas encore faire : jusqu'au 4 septembre 2018,
  seuls les points acquis jusqu'à la fin de l'année, puis, depuis 2012, du trimestre du
  65e anniversaire, étaient majorés ; le moteur, qui ne garde pas les points année par
  année, les majore tous, non mesuré. Avant 2017, la CARMF ne majore pas le départ
  après 65 ans, comme sa propre table le dit (« Avant réforme », 100 % de 65 à 70 ans) :
  l'article 32 et son « différé » supposent la cessation, et la fiche du régime, qui
  les servait de 2000 à 2016 sans plafond, ne les sert plus depuis le 16 octobre 2026.
  Reste à lire la rédaction d'origine de l'article 32 des statuts de la CARMF, publiée au
  Bulletin officiel ; l'article 3.15 des statuts de la Cipav de 2006, au même Bulletin, se
  relit par différence, sûr depuis 2008, non tranché en 2007, où l'arrêté du 3 octobre
  2006 garde deux articles des statuts de 1979 (`sources.a_relire`).
domaine: decote_surcote
lit:
- >-
  la date d'effet de la pension de la complémentaire, qui choisit la version, et la
  période de liquidation de chaque section (`periode_de_liquidation`)
- >-
  l'âge de l'assuré à cette date, et l'âge d'où le report se compte : 65 ans, ou l'âge du
  taux plein de sa génération
- >-
  la durée d'affiliation à la section : à la Cipav, trente années, cent vingt trimestres
  (`surcote_affiliation_minimale_trimestres`)
- >-
  les points de la section, ou ses cotisations revalorisées, que la majoration multiplie
ecrit:
- >-
  le coefficient de majoration de la pension de chaque section (« coefficient de
  majoration » du détail servi), que `liquider_chaque_regime` applique à ses points
dates_qui_decident:
- liquidation.date_effet
