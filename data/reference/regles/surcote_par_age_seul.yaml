    citation: >-
      « II. - L'affilié qui a atteint l'âge prévu au a du 1° de l'article 5-1 et comptant
      un minimum de trente années d'affiliation à la CIPAV, peut différer la date d'entrée
      en jouissance de la pension de retraite complémentaire de 1 à 5 ans. »
  - id: LEGIARTI000054168515
    article: décret n° 79-262, article 5-2, II, en vigueur le 1er juillet 2026
    en_vigueur: 2026-07-01
    citation: >-
      « Le compte de points qui est alors établi est majoré de 5% par année entière de
      prorogation. Cette majoration s'applique uniquement aux points acquis au titre des
      trente premières années de cotisation à la CIPAV. Pour la détermination des trente
      années de cotisation, les années au titre desquelles l'affilié a obtenu une
      exonération ou une réduction de cotisation sont prises en compte. »
