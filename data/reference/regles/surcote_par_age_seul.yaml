  a_relire:
  - >-
    CAVEC : jusqu'au 4 septembre 2018, ne majorer que les points acquis jusqu'à la fin de
    l'année du 65e anniversaire, puis, depuis 2012, de son trimestre, quand le moteur
    gardera les points année par année. Et la date d'effet : « La retraite est liquidée à
    dater du premier jour du trimestre civil suivant la demande » (statuts approuvés par
    l'arrêté du 20 août 2018, article 14), quand le moteur la liquide au premier jour du
    mois, comme le régime de base ; lire si la caisse le fait toujours, et depuis quand.
  - >-
    Cipav, l'article 3.15 relu au Journal officiel par différence (action 130, E11,
    6 novembre 2026), la réserve de 2006 écrite (E12, après R-E12). L'arrêté du 3 octobre
    2006 (JORFARTI000002050100) approuve « les modifications apportées aux statuts […]
    (art. 2.7 et 2.21 de la seconde partie « règlement intérieur », troisième partie
    « Régime de retraite complémentaire », ainsi que les dispositions transitoires) » ;
    « L'arrêté du 21 mars 1979 portant approbation des statuts […] est abrogé à compter
    du 1er janvier 2007, à l'exception de l'article 16 et de l'article 17, alinéa 2, qui
    seront abrogés le 1er janvier 2008 » ; « L'arrêté, accompagné de son annexe, sera
    publié intégralement au Bulletin officiel d'octobre 2006 ». Les statuts de 2006, leurs
    dispositions transitoires et ceux de 1979 sont au seul Bulletin officiel (question
    22), comme les arrêtés qui modifient ceux de 1979, l'article 17 compris : du 5 mai
    1981 (JORFTEXT000000871027, « art. 8, 11 et 17 », son titre seul à l'index), du 17 juin 1985 (JORFTEXT000000840042, « art. 4, 9, 12, 13, 17, 17-bis et 21 »), du 9 mars 1987 (JORFTEXT000000321565, « annexe n° 5 » : « art. 8, 13, 17 et 17-bis ») et du 29 juillet 2003 (JORFARTI000001531753, « art. 9, 11, 13, 15, 17 et 17 bis », « publié
    intégralement au Bulletin officiel n° 2003-35 ») ; ceux du 4 mai 1982 (JORFTEXT000000677739, « une modification », « intégralement publié au Bulletin officiel ») et du 13 août 1987 (JORFTEXT000000475761, son titre seul à l'index) ne disent pas l'article ; ceux du 7 février 1980 (art. 6, 8 et 10), du 22 août 1986 (art. 11), du 12 mai 2000 (JORFARTI000002418428, « art. 1er, 4, 4 bis, 11, 12 et 18 »), du 27 février 2003 (JORFARTI000001710064, « art. 6 ») et du 28 décembre 2004 (art. 7) ne touchent ni l'article 16 ni l'article 17 (index JORF, action 130, E13, complété par E14 après R-E14). Tous les arrêtés qui modifient ensuite les statuts sont publiés en entier au
    Journal officiel — 17 décembre 2007, 3 décembre 2010, 6 juillet 2012, 7 octobre 2014,
    18 décembre 2015, 19 janvier 2016, 3 août 2017, 22 juin 2020, 16 mars 2021,
    16 décembre 2021, 20 mars 2023, 27 décembre 2023, 4 et 17 septembre 2025 —, aucun ne
    renumérote la troisième partie (celui de 2017 renumérote la deuxième, articles 2.13
    à 2.27), et seuls ceux du 16 décembre 2021 (19°, le premier alinéa, « âgé de 65
    ans ») et du 20 mars 2023 (17°) touchent l'article 3.15. Son texte de 2007 au
    31 décembre 2021 est donc celui des statuts au 1er janvier 2023, ces deux
    modifications ôtées : « L'adhérent âgé de 65 ans et comptant un minimum de trente
    années d'affiliation à la C•I•P•A•V, peut différer la date d'entrée en jouissance de
    la pension de retraite complémentaire de 1 à 5 ans. Le compte de points qui est
    alors établi est majoré de 5% par année entière de prorogation. Cette majoration
    s'applique uniquement aux points acquis au titre des trente premières années de
    cotisation à la C•I•P•A•V », avec les mots « , telles qu'elles sont définies à
    l'article 3.6 », à une place que l'arrêté de 2023 ne montre pas ; en 2022, le premier
    alinéa de 2023. Qu'il s'applique dès le 1er janvier 2007 n'est pas prouvé : les
    articles 16 et 17, alinéa 2, de 1979, en vigueur toute l'année 2007, et les
    dispositions transitoires, non lus, peuvent régler le report de cette année-là, ou
    les points acquis avant 2007. L'article 3.6 n'est pas lu dans ces rédactions : le
    décompte des trente années, avant 2023, reste ouvert ; quatre décomptes sont chiffrés,
    les trois de la première année du régime (de 1979 à 2008, de 1980 à 2009, de 1979 à
    2009) et celui que nomme R-E12, depuis l'affiliation à la caisse (à 22 ans dans les
    cas posés). Cas posés : libérale de la Cipav au double du salaire moyen depuis
    22 ans, en euros de 2026, un an entier de report au-delà de 65 ans ; 0,05 × 0,062 =
    0,0031. (1) DEPUIS 2013, ERREUR CORRIGÉE le 14 novembre 2026 (décision du
    propriétaire du 13 novembre, ligne 14 de la file, au décompte le plus favorable à
    l'affilié) : le modèle majorait tous les points (périodes de `cipav_complementaire`
    depuis 2013), le texte ceux des trente premières années, que le modèle majore seuls
    depuis (`surcote_premieres_annees`). Le cas posé d'avant la correction. Née le 10 mars 1949,
    pension au 1er janvier 2016 : le modèle sert 193 940,3125 × 0,062 × 1,05 =
    12 625,51 €, dont 0,0031 × 193 940,3125 = 601,2150 € de majoration ; les cotisations
    revalorisées de la Cipav courent de 1979, première année du régime (1 558,2124 €), à
    2015 ; sur les trente premières années, de 1979 à 2008, 0,0031 × 137 466,6071 =
    426,1465 €, 175,07 € par an de trop ; de 1980 à 2009, 0,0031 × 143 335,1748 =
    444,3390 €, 156,88 € ; de 1979 à 2009, 0,0031 × 144 893,3872 = 449,1695 €, 152,05 € ;
    depuis l'affiliation, en 1971, les trente années s'arrêtent en 2000 et l'écart
    grossit : au moins 152,05 € par an. La correction sert 12 450,45 €, 175,07 € de
    moins : le régime est institué « A compter du 1er janvier 1979 » (décret n° 79-262,
    article 1er, LEGIARTI000006767470, relu le 14 novembre 2026), 1979 y est une année
    entière, et les trente années vont de 1979 à 2008 ; les décomptes de 1980 à 2009 et
    de 1979 à 2009 ne se posent que pour une première année partielle. (2) DE 2008 À 2012, ERREUR CORRIGÉE le
    14 novembre 2026 (décision du propriétaire du 13 novembre, ligne 15 de la file) : le
    modèle ne majorait rien (périodes de 1979 à 2012, `surcote_par_trimestre: null`), le
    texte le fait, et la période de 2008 à 2012 de `cipav_complementaire.yaml` le sert
    depuis, au décompte de (1) : 10 210,60 € au cas qui suit, 419,43 € de plus. Le cas
    posé d'avant la correction. Née le
    10 mars 1945, pension au 1er janvier 2012 : le modèle servait 157 922,1741 × 0,062 =
    9 791,17 €, sans majoration ; le texte ajoute 0,0031 fois les cotisations des trente
    premières années : de 1979 à 2008, 135 298,4577 €, 419,43 € par an servis en moins ;
    de 1980 à 2009, 141 074,4652 €, 437,33 € ; de 1979 à 2009, 142 608,1012 €,
    442,09 € ; depuis l'affiliation, en 1967, les trente années vont de 1967 à 1996, les
    points de 1979 à 1996, 69 492,8927 €, 215,43 € : au moins 215,43 € par an, au moins
    419,43 € sous les trois décomptes de la première année ; 1979 étant une année
    entière du régime, les trente années vont de 1979 à 2008, et la correction sert
    419,43 €. La réserve, qui reste : les
    dispositions transitoires de 2006, non lues, peuvent borner les points majorés
    (question 22). (3) EN 2007, POINT NON TRANCHÉ. Née le 10 mars 1940, libérale depuis
    mars 1962, pension au 1er janvier 2007 (66 ans et 9 mois ; 65 ans le 10 mars 2005) :
    le modèle sert 112 063,7981 × 0,062 = 6 947,96 €, sans majoration, les cotisations
    de 1979 (1 410,1318 €) à 2006. Lecture A, l'article 3.15 de 2006 dès le 1er janvier
    2007 : 0,0031 × 112 063,7981 = 347,40 € par an servis en moins (de 1979 à 2008, et de
    1979 à 2009 : les 28 années) ; 0,0031 × 110 653,6663 = 343,03 € (de 1980 à 2009) ;
    0,0031 × 43 931,5488 = 136,19 € (depuis l'affiliation, de 1962 à 1991 : les points
    de 1979 à 1991). Lecture B, les articles 16 et 17, alinéa 2, des statuts de 1979, ou
    les dispositions transitoires, règlent l'année 2007 : leur texte n'est pas lu ; s'ils
    ne majorent rien, le modèle sert juste, 0 € d'écart. Sous la lecture A même, si les
    trente années d'affiliation se comptent depuis 1979, comme les trois décomptes de
    la première année du régime comptent la cotisation, la pension de 2007 n'en a que
    vingt-huit, 1979 à 2006 : 0 € ; celle de 2008, vingt-neuf : rien n'est dû, le modèle
    sert juste ; elles sont trente au 1er janvier 2009. Avant 2007 : les statuts de
    1979, au seul Bulletin officiel (question 22). Depuis 2023 et depuis le 1er juillet
    2026, l'erreur de (1), corrigée le même jour, est dite dans
    `decret_2026_418_liberaux` (`sources.a_relire`).
  - >-
    CPRN : trancher la lecture divergente de la borne de 70 ans par ce que la caisse publie
    d'autre de la règle qu'elle applique, sans la solliciter (docs/architecture.md, § 3.5).
  - >-
    CARMF : l'article 32 des statuts, lu dans les statuts que publie la caisse, à jour de
    l'arrêté du 7 janvier 2025 : « 5 % par année pleine de différé » pour le médecin
    « remplissant toutes les conditions », sans nommer 65 ans, que la fiche de régime sert
    de 2000 à 2016, et ne sert plus depuis le 16 octobre 2026 : la caisse ne majore pas le
    départ après 65 ans avant 2017, ni ne cumule depuis les deux majorations (1,30 à
    70 ans, sa table de 2018). Dater sa rédaction d'origine (Bulletin officiel), et lire
    à quoi elle sert : le différé entre la cessation et la demande, que le modèle ne
    connaît pas.
  lectures_divergentes:
  - >-
    CPRN, borne de la majoration depuis le 1er janvier 2024 : l'arrêté du 29 novembre 2023
    remplace « 70 ans » par « fin d'activité », et le règlement de 2026 (article 9, 1°)
    écrit « jusqu'à l'âge de fin d'activité » ; la page de la caisse, mise à jour le 26
    janvier 2026, écrit encore « jusqu'au 70e anniversaire ». Rien de publié ne dit encore
    laquelle la caisse applique (docs/architecture.md, § 3.3) ; le moteur suit les textes :
    depuis 2024, sa période de `cprn_complementaire` ne porte plus de borne d'âge.
  lectures:
  - type: legifrance
    reference: >-
      action 184, étape 6, les rédactions en vigueur ou à venir que la fiche n'avait pas
      lues : décret n° 79-262, article 5, rédaction du 1er juillet 2026, dans l'index LEGI
      du dépôt à jour au 11 novembre 2026 ; le statut de chacune est aux textes de la
      fiche
    date: 2026-11-12
  - type: jorf
    reference: >-
      Action 130, E13, 6 novembre 2026, index JORF à jour du 3 novembre 2026 et LEGI du
      2 novembre. CARMF et ASV : les arrêtés qui modifient leurs statuts de 2016 à 2026,
      relevés au titre (« section professionnelle des médecins » ou « carmf », sans borne
      de réponses), lus à l'annexe aux articles 15 et 12 : ceux des 30 novembre et
      1er décembre 2016 (« A compter du 1er janvier 2017 […] après cet âge », l'âge du
      premier alinéa de L. 351-1 ; en vigueur « au 1er janvier 2017 », article 2), du
      21 décembre 2016 (l'inaptitude seule), du 22 mars 2017 (« après l'âge de 62 ans »,
      sans date d'effet : le 30 mars 2017), du 21 février 2024 (« A compter du 1er janvier
      2017 » ôté), les règlements du 10 juillet 2026 (article 2 de chacun, le 18 juillet
