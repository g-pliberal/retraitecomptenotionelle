  a_relire:
  - >-
    CAVEC : jusqu'au 4 septembre 2018, ne majorer que les points acquis jusqu'à la fin de
    l'année du 65e anniversaire, puis, depuis 2012, de son trimestre, quand le moteur
    gardera les points année par année. Et la date d'effet : « La retraite est liquidée à
    dater du premier jour du trimestre civil suivant la demande » (statuts approuvés par
    l'arrêté du 20 août 2018, article 14), quand le moteur la liquide au premier jour du
    mois, comme le régime de base ; lire si la caisse le fait toujours, et depuis quand.
  - >-
    Cipav, l'article 3.15 relu au Journal officiel par différence (action 130, E11,
    6 novembre 2026), la réserve de 2006 écrite (E12, après R-E12). L'arrêté du 3 octobre
    2006 (JORFARTI000002050100) approuve « les modifications apportées aux statuts […]
    (art. 2.7 et 2.21 de la seconde partie « règlement intérieur », troisième partie
    « Régime de retraite complémentaire », ainsi que les dispositions transitoires) » ;
    « L'arrêté du 21 mars 1979 portant approbation des statuts […] est abrogé à compter
    du 1er janvier 2007, à l'exception de l'article 16 et de l'article 17, alinéa 2, qui
    seront abrogés le 1er janvier 2008 » ; « L'arrêté, accompagné de son annexe, sera
    publié intégralement au Bulletin officiel d'octobre 2006 ». Les statuts de 2006, leurs
    dispositions transitoires et ceux de 1979 sont au seul Bulletin officiel (question
    22). Tous les arrêtés qui modifient ensuite les statuts sont publiés en entier au
    Journal officiel — 17 décembre 2007, 3 décembre 2010, 6 juillet 2012, 7 octobre 2014,
    18 décembre 2015, 19 janvier 2016, 3 août 2017, 22 juin 2020, 16 mars 2021,
    16 décembre 2021, 20 mars 2023, 27 décembre 2023, 4 et 17 septembre 2025 —, aucun ne
    renumérote la troisième partie (celui de 2017 renumérote la deuxième, articles 2.13
    à 2.27), et seuls ceux du 16 décembre 2021 (19°, le premier alinéa, « âgé de 65
    ans ») et du 20 mars 2023 (17°) touchent l'article 3.15. Son texte de 2007 au
    31 décembre 2021 est donc celui des statuts au 1er janvier 2023, ces deux
    modifications ôtées : « L'adhérent âgé de 65 ans et comptant un minimum de trente
    années d'affiliation à la C•I•P•A•V, peut différer la date d'entrée en jouissance de
    la pension de retraite complémentaire de 1 à 5 ans. Le compte de points qui est
    alors établi est majoré de 5% par année entière de prorogation. Cette majoration
    s'applique uniquement aux points acquis au titre des trente premières années de
    cotisation à la C•I•P•A•V », avec les mots « , telles qu'elles sont définies à
    l'article 3.6 », à une place que l'arrêté de 2023 ne montre pas ; en 2022, le premier
    alinéa de 2023. Qu'il s'applique dès le 1er janvier 2007 n'est pas prouvé : les
    articles 16 et 17, alinéa 2, de 1979, en vigueur toute l'année 2007, et les
    dispositions transitoires, non lus, peuvent régler le report de cette année-là, ou
    les points acquis avant 2007. L'article 3.6 n'est pas lu dans ces rédactions : le
    décompte des trente années, avant 2023, reste ouvert ; quatre décomptes sont chiffrés,
    les trois de la première année du régime (de 1979 à 2008, de 1980 à 2009, de 1979 à
    2009) et celui que nomme R-E12, depuis l'affiliation à la caisse (à 22 ans dans les
    cas posés). Cas posés : libérale de la Cipav au double du salaire moyen depuis
    22 ans, en euros de 2026, un an entier de report au-delà de 65 ans ; 0,05 × 0,062 =
    0,0031. (1) DE 2013 À 2022, ERREUR DÉCLARÉE, non corrigée (candidat, au
    propriétaire) : le modèle majore tous les points (périodes de `cipav_complementaire`
    depuis 2013), le texte ceux des trente premières années. Née le 10 mars 1949,
    pension au 1er janvier 2016 : le modèle sert 193 940,3125 × 0,062 × 1,05 =
    12 625,51 €, dont 0,0031 × 193 940,3125 = 601,2150 € de majoration ; les cotisations
    revalorisées de la Cipav courent de 1979, première année du régime (1 558,2124 €), à
    2015 ; sur les trente premières années, de 1979 à 2008, 0,0031 × 137 466,6071 =
    426,1465 €, 175,07 € par an de trop ; de 1980 à 2009, 0,0031 × 143 335,1748 =
    444,3390 €, 156,88 € ; de 1979 à 2009, 0,0031 × 144 893,3872 = 449,1695 €, 152,05 € ;
    depuis l'affiliation, en 1971, les trente années s'arrêtent en 2000 et l'écart
    grossit : au moins 152,05 € par an. (2) DE 2008 À 2012, ERREUR DÉCLARÉE, non
    corrigée (candidat, au propriétaire), sous une réserve : le modèle ne majore rien
    (périodes de 1979 à 2012, `surcote_par_trimestre: null`), le texte le fait. Née le
    10 mars 1945, pension au 1er janvier 2012 : le modèle sert 157 922,1741 × 0,062 =
    9 791,17 €, sans majoration ; le texte ajoute 0,0031 fois les cotisations des trente
    premières années : de 1979 à 2008, 135 298,4577 €, 419,43 € par an servis en moins ;
    de 1980 à 2009, 141 074,4652 €, 437,33 € ; de 1979 à 2009, 142 608,1012 €,
    442,09 € ; depuis l'affiliation, en 1967, les trente années vont de 1967 à 1996, les
    points de 1979 à 1996, 69 492,8927 €, 215,43 € : au moins 215,43 € par an, au moins
    419,43 € sous les trois décomptes de la première année. La réserve : les
    dispositions transitoires de 2006, non lues, peuvent borner les points majorés
    (question 22). (3) EN 2007, POINT NON TRANCHÉ. Née le 10 mars 1940, libérale depuis
    mars 1962, pension au 1er janvier 2007 (66 ans et 9 mois ; 65 ans le 10 mars 2005) :
    le modèle sert 112 063,7981 × 0,062 = 6 947,96 €, sans majoration, les cotisations
    de 1979 (1 410,1318 €) à 2006. Lecture A, l'article 3.15 de 2006 dès le 1er janvier
    2007 : 0,0031 × 112 063,7981 = 347,40 € par an servis en moins (de 1979 à 2008, et de
    1979 à 2009 : les 28 années) ; 0,0031 × 110 653,6663 = 343,03 € (de 1980 à 2009) ;
    0,0031 × 43 931,5488 = 136,19 € (depuis l'affiliation, de 1962 à 1991 : les points
    de 1979 à 1991). Lecture B, les articles 16 et 17, alinéa 2, des statuts de 1979, ou
    les dispositions transitoires, règlent l'année 2007 : leur texte n'est pas lu ; s'ils
    ne majorent rien, le modèle sert juste, 0 € d'écart. Avant 2007 : les statuts de
    1979, au seul Bulletin officiel (question 22). Depuis 2023 et depuis le 1er juillet
    2026, l'erreur de (1) est déclarée dans `decret_2026_418_liberaux`
