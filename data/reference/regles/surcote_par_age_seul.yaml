schema_version: 1
id: surcote_par_age_seul
intitule: >-
  Majoration de la pension des complémentaires libérales liquidées après l'âge du taux
  plein, par trimestre ou par année pleine de report, au taux et dans les bornes que
  fixent les statuts de chaque section : depuis 2017, 1,25 % par trimestre après 62 ans,
  0,75 % après 65 ans, jusqu'à 70 ans (CARMF, ASV des médecins) ; 1,25 % par trimestre
  civil entier dans la limite de vingt trimestres (CARPIMKO) ; au-delà de 65 ans, 1,25 %
  par trimestre plein dans la limite de 25 %, 0,75 % et 15 % de septembre 2018 à juillet
  2025 (CAVEC) ; 0,5 % par trimestre pendant trois ans au plus, moins pour les nés avant
  1956 (CAVP) ; 5 % par année entière de report, d'un à cinq ans, avec trente années
  d'affiliation, sur les points des trente premières années (Cipav) ; aux notaires qui
  continuent d'exercer, 0,5 % jusqu'à 70 ans, puis 1 % jusqu'à la fin d'activité depuis
  2024 (CPRN).
regimes: [asv_conventionnes, carmf_complementaire, carpimko_complementaire,
  cavec_complementaire, cavp_complementaire, cipav_complementaire, cprn_complementaire]
etat: approchee
etape: liquider_chaque_regime
effet: >-
  Les complémentaires de la CARMF, de la CARPIMKO, de la CAVEC, de la CAVP, de la Cipav et
  de la CPRN, et l'ASV des médecins, dont les périodes renvoient à cette fiche ; la
  CARCDSF et la CAVAMAC, par leurs propres fiches. Relue à la source le 27 septembre 2026,
  caisse par caisse. La CARMF et l'ASV sont servies comme leurs textes, qui comptent
  « après l'âge de 62 ans » depuis l'arrêté du 22 mars 2017, et de l'âge légal de la
  génération, 60 ans à 61 ans et 7 mois avant 1955, du 1er janvier au 29 mars 2017
  (`surcote_depuis_l_age_legal`, périodes coupées au 30 mars 2017 par `date_effet`),
  du « premier jour du trimestre civil suivant celui où le médecin atteint cet âge »
  à la date d'effet (`surcote_du_trimestre_civil_suivant`) : jusqu'au 14 novembre 2026,
  le modèle comptait du premier jour du mois où l'âge est atteint, un trimestre de trop
  pour le médecin né le premier jour d'un trimestre civil, et pour qui, né un autre
  jour, ne prenait pas sa pension au premier jour d'un trimestre civil — né le
  1er janvier 1958, pension au 1er janvier 2025 : dix-neuf trimestres du 1er avril
  2020, douze à 1,25 % et sept à 0,75 %, 1,2025, quand le modèle en comptait vingt,
  1,21 — 99,89 € par an servis en trop à la CARMF (16 116,03 € servis, 16 016,14 €
  depuis), 119,42 € à l'ASV (19 267,20 €, 19 147,78 € depuis) ; le passage à 0,75 %
  se lit de même au trimestre civil qui suit les 65 ans — né le 10 septembre 1951,
  pension au 1er janvier 2017 : dix-huit trimestres à 1,25 % du 1er avril 2012, un à
  0,75 % du 1er octobre 2016, 1,2325 au lieu de 1,2375 ; corrigé ce jour (action 130,
  décision du propriétaire du 13 novembre, ligne 18 de la file), dans les deux
  moteurs. Jusqu'au 14 novembre
  2026, le modèle comptait de 62 ans dès le 1er janvier 2017, ce que le texte n'écrit
  que depuis le 30 mars : née le 10 mars 1952 (60 ans et 9 mois le 10 décembre 2012),
  pension au 1er janvier 2017, seize trimestres à 1,25 % du 1er janvier 2013, 1,20,
  quand le modèle en comptait onze, 1,1375 — 679,34 € par an servis en moins à la CARMF
  (12 364,01 € servis, 13 043,35 € depuis), 873,34 € à l'ASV (15 894,81 €, 16 768,15 €
  depuis) ; corrigé ce jour (action 130, décision du propriétaire du 13 novembre,
  ligne 13 de la file), dans les deux moteurs. La CARPIMKO majore les
  pensions qui prennent effet depuis le 3 octobre 2015, lendemain de la publication de
  l'arrêté du 31 juillet 2015 : jusqu'au 14 novembre 2026, le modèle ne la servait qu'en
  2016 — né le 10 mars 1949, auxiliaire médical depuis ses 25 ans, 65 ans le 10 mars
  2014, pension au 1er novembre 2015, six trimestres civils entiers d'ajournement :
  5 298,19 € servis, 5 695,55 € depuis, 397,36 € par an servis en moins ; corrigé ce jour
  (ligne 16 de la file), dans les deux moteurs, par les données du régime. Elle majore depuis
  l'âge où la pension pouvait être liquidée sans abattement, l'âge légal dès que la durée
  du régime de base est atteinte (`surcote_depuis_la_duree`) ; la CAVP, dans les bornes
  de la génération — rien pour les nés jusqu'au 30 juin 1951, jusqu'à 66 ans pour ceux du
  1er juillet 1951 à 1952, jusqu'à 68 ans pour ceux de 1953 à 1955, trois ans au-delà du
  taux plein ensuite (`age_surcote_maximum` de la table `cavp`) ; la Cipav, cinq années
  au plus, comptées de 65 ans jusqu'en 2021 et de l'âge du taux plein ensuite, sur les
  seuls points des trente premières années de cotisation (`surcote_premieres_annees`),
  au décompte le plus favorable à l'affilié : jusqu'au 14 novembre 2026, le modèle les
  majorait tous — née le 10 mars 1949, pension au 1er janvier 2016, un an de report :
  12 625,51 € servis, 12 450,45 € depuis, 175,07 € par an de trop ; corrigé ce jour
  (action 130, décision du propriétaire du 13 novembre, ligne 14 de la file), dans les
  deux moteurs ; elle est servie depuis le 1er janvier 2008, où tombent les derniers
  articles des statuts de 1979 : jusqu'au 14 novembre 2026, le modèle ne majorait rien
  avant 2013 — née le 10 mars 1945, pension au 1er janvier 2012, un an de report :
  9 791,17 € servis, 10 210,60 € depuis, 419,43 € par an servis en moins ; corrigé ce
  jour (ligne 15 de la file), dans les deux moteurs, par les données du régime ; la CPRN,
  les seuls trimestres d'exercice (`surcote_trimestres_cotises`). À la CAVEC, les taux
  changent aux pensions qui prennent effet depuis le 5 septembre 2018 (0,75 %) et depuis
  le 7 juillet 2025 (1,25 %), lendemains de la publication de deux arrêtés sans date
  d'effet propre, que ses périodes coupent au jour (`date_effet`, docs/architecture.md,
  § 4.6) ; le moteur les servait en 2019 et en 2026, jusqu'à 10 points d'écart aux
  liquidations de septembre à décembre 2018 et de juillet à décembre 2025. Un écart y
  reste, qui attend ce que le modèle ne sait pas encore faire : jusqu'au 4 septembre 2018,
  seuls les points acquis jusqu'à la fin de l'année, puis, depuis 2012, du trimestre du
  65e anniversaire, étaient majorés ; le moteur, qui ne garde pas les points année par
  année, les majore tous, non mesuré. Avant 2017, la CARMF ne majore pas le départ
  après 65 ans, comme sa propre table le dit (« Avant réforme », 100 % de 65 à 70 ans) :
  l'article 32 et son « différé » supposent la cessation, et la fiche du régime, qui
  les servait de 2000 à 2016 sans plafond, ne les sert plus depuis le 16 octobre 2026.
  Reste à lire la rédaction d'origine de l'article 32 des statuts de la CARMF, publiée au
  Bulletin officiel ; l'article 3.15 des statuts de la Cipav de 2006, au même Bulletin, se
  relit par différence, sûr depuis 2008, non tranché en 2007, où l'arrêté du 3 octobre
  2006 garde deux articles des statuts de 1979 (`sources.a_relire`).
domaine: decote_surcote
lit:
- >-
  la date d'effet de la pension de la complémentaire, qui choisit la version, et la
  période de liquidation de chaque section (`periode_de_liquidation`)
- >-
  l'âge de l'assuré à cette date, et l'âge d'où le report se compte : 65 ans, ou l'âge du
  taux plein de sa génération
- >-
  la durée d'affiliation à la section : à la Cipav, trente années, cent vingt trimestres
  (`surcote_affiliation_minimale_trimestres`)
- >-
  les points de la section, ou ses cotisations revalorisées, que la majoration multiplie
ecrit:
- >-
  le coefficient de majoration de la pension de chaque section (« coefficient de
  majoration » du détail servi), que `liquider_chaque_regime` applique à ses points
dates_qui_decident:
- liquidation.date_effet
versions:
- id: avant_2007
  statut: supposee
  hypothese: >-
    la Cipav ne majore pas pour report une pension qui prend effet avant le 1er janvier
    2007, ce que le modèle sert : le décret n° 79-262 renvoie aux statuts, et ceux de
    1979, modifiés par les arrêtés du 7 février 1980 (art. 6, 8 et 10), du 5 mai 1981
    (art. 8, 11 et 17), du 4 mai 1982 (article non dit), du 17 juin 1985 (art. 4, 9,
    12, 13, 17, 17-bis et 21), du 22 août 1986 (art. 11), du 9 mars 1987 (art. 8, 13, 17 et 17-bis), du 13 août 1987 (article non dit), du 12 mai 2000 (art. 1er, 4, 4 bis, 11, 12 et 18), du 27 février 2003 (art. 6), du 29 juillet 2003 (art. 9, 11, 13, 15, 17 et 17 bis) et du 28 décembre 2004 (art. 7), ne sont qu'au Bulletin
    officiel ; la CARMF et l'ASV ne majorent pas avant 2017 (leurs articles 15 et 12
    n'écrivent la majoration qu'« A compter du 1er janvier 2017 »), la CARPIMKO avant
    le 3 octobre 2015 (l'article 12 ter n'est inséré qu'alors) ; la CAVEC ne majore pas avant le 2 mars 2008 (supposée : ses statuts d'avant ne sont pas lus. Depuis 1979, six arrêtés en approuvent des modifications au régime complémentaire, dont l'index du Journal officiel n'a que le titre ou une mention : 17 juin 1980 (JORFTEXT000000680010, « ART. 52,55,57,58 ET 61 AU REGIME D'ASSURANCE VIEILLESSE COMPLEMENTAIRE », « CES ARRETES SERONT PUBLIES AU BULLETIN OFFICIEL DU MINISTERE DE LA SANTE ET DE LA SECURITE SOCIALE »), 22 août 1986 (JORFTEXT000000862986, « (ART. 47 ET 55 ANNEXE 2) »), 9 mars 1987 (JORFTEXT000000321565, « 4EME PARTIE,TITRES XVI (ART. 52) ET XVII (ART. 57 ET 58) »), 23 juillet 1992 (JORFTEXT000000724876, « (art. 49 et 50) »), 13 mai 1994 (JORFARTI000001005266, « (art. 49 et 59) », JORFARTI000001391556, « L'arrêté du 13 mai 1994 sera publié intégralement au Bulletin officiel du ministère no 94-17 »), 27 février 2003 (JORFARTI000001710064, « du régime complémentaire d'assurance vieillesse (art. 58) […] de la section professionnelle des experts-comptables et des comptables agréés », « publié intégralement au Bulletin officiel n° 2003-14 ») ; ceux de 1986 à 1994, à lire au fac-similé ou au Bulletin officiel ; avant 1979, onze de 1957 à 1977, titres seuls, le premier du 14 septembre 1957 (JORFTEXT000000477655, « APPROBATION DES MODIFICATIONS APPORTEES A L'ART. 31 DU REGLEMENT D'ASSURANCE VIEILLESSE COMPLEMENTAIRE DES EXPERTS COMPTABLES ET COMPTABLES AGREES ») ; aucun du 28 février 2003 au 21 février 2008. L'arrêté du 22 février 2008 approuve les articles « 3.1, 3.3, 3.4, […] 3.20 », sans 3.2, et dit « L'article 3.14 est ainsi rédigé », ce qui suppose une numérotation en 3.x déjà en place ; mais celui du 27 février 2003 nomme encore l'« art. 58 » : le texte qui a introduit cette numérotation, et ce que disait son article 3.14, ne sont pas identifiés), ni la CAVP avant le 30 juin 2011 (ses statuts d'avant 2009, au Bulletin officiel ; ceux de 2009, lus, n'en écrivent aucune), ni la CPRN avant le 1er janvier 2014 (ses statuts de 2004, au seul Bulletin officiel ; l'arrêté du 16 décembre 2013 « rédige » l'article 16)
  fiabilite: >-
    faible pour la Cipav : aucun texte lu ne dit ni la majoration, ni son absence
    (question 22) ; moyenne pour la CARMF, l'ASV et la CARPIMKO : le texte qui institue
    leur majoration est lu, ce qui le précède ne l'est pas ; faible pour la CAVEC, la CAVP et la CPRN, dont les statuts d'alors ne sont pas lus
