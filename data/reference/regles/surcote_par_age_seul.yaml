- id: cipav_2007
  statut: supposee
  hypothese: >-
    point non tranché (E12, après R-E12). Lecture A : l'article 3.15 des statuts de 2006
    vaut dès le 1er janvier 2007, comme de 2008 à 2021. Lecture B : l'arrêté du 3 octobre
    2006 laisse en vigueur jusqu'au 1er janvier 2008 les articles 16 et 17, alinéa 2, des
    statuts de 1979, et approuve des « dispositions transitoires », au seul Bulletin
    officiel : ils peuvent régler le report de 2007 ; le modèle, qui ne majore rien, suit
    une lecture B où ils ne majorent pas. L'article 17 en vigueur en 2007 est celui de
    1979 modifié par les arrêtés du 5 mai 1981 (« art. 8, 11 et 17 »), du 17 juin 1985 (« art. 4, 9, 12, 13, 17, 17-bis et 21 »), du 9 mars 1987 (« art. 8, 13, 17 et 17-bis ») et du 29 juillet 2003 (« art. 9, 11, 13, 15, 17 et 17 bis »), et peut-être du 4 mai 1982 (« une modification ») et du 13 août 1987 (son titre seul), qui ne disent pas l'article, tous publiés en entier au seul Bulletin officiel. Sous la lecture A, si les
    « trente années d'affiliation » se comptent depuis la première année du régime,
    1979, une pension de 2007 n'en a que vingt-huit (1979 à 2006) : rien n'est dû, 0 €,
    comme le modèle sert ; les CARMF, ASV et CARPIMKO, rien (version précédente)
  fiabilite: >-
    faible : ni les statuts de 2006, ni leurs dispositions transitoires, ni ceux de 1979
    ne sont lus (question 22)
  nee_de: JORFARTI000002050100
  textes:
  - id: JORFARTI000002050100
    article: arrêté du 3 octobre 2006, article unique
    publie_le: 2006-10-13
    citation: >-
      « sont approuvées les modifications apportées aux statuts […] (art. 2.7 et 2.21 de
      la seconde partie « règlement intérieur », troisième partie « Régime de retraite
      complémentaire », ainsi que les dispositions transitoires). L'arrêté du 21 mars 1979
      portant approbation des statuts de la section professionnelle des architectes,
      agréés en architecture, ingénieurs, techniciens, experts et conseils et relatif au
      régime d'assurance vieillesse complémentaire est abrogé à compter du 1er janvier
      2007, à l'exception de l'article 16 et de l'article 17, alinéa 2, qui seront abrogés
      le 1er janvier 2008. »
  bornes:
    liquidation.date_effet: [2007-01-01, 2008-01-01]
  contenu:
    parametres:
      surcote_par_trimestre: {carmf_complementaire: 0.0, asv_conventionnes: 0.0, carpimko_complementaire: 0.0,
        cavec_complementaire: 0.0, cavp_complementaire: 0.0, cprn_complementaire: 0.0}
    droit: >-
      non tranché à la Cipav : la majoration de 2008 à 2021 (lecture A), ou ce que les
      articles 16 et 17, alinéa 2, de 1979 et les dispositions transitoires disent
      (lecture B, non lue) ; rien à la CARMF, à l'ASV ni à la CARPIMKO ; à la CAVEC, rien (supposée) ; à la CAVP, rien ; à la CPRN, rien (supposée)
  exemples: aucun trouvé
- id: cipav_de_2008
  statut: supposee
  hypothese: >-
    l'article 3.15 des statuts de 2006, au seul Bulletin officiel, relu par différence :
    son texte est celui des statuts au 1er janvier 2023, ôtées les deux seules
    modifications que le Journal officiel publie (arrêtés du 16 décembre 2021, 19°, et
    du 20 mars 2023, 17°) : « L'adhérent âgé de 65 ans et comptant un minimum de trente
    années d'affiliation à la C•I•P•A•V, peut différer la date d'entrée en jouissance de
    la pension de retraite complémentaire de 1 à 5 ans. Le compte de points qui est
    alors établi est majoré de 5% par année entière de prorogation. Cette majoration
    s'applique uniquement aux points acquis au titre des trente premières années de
    cotisation à la C•I•P•A•V », avec les mots « , telles qu'elles sont définies à
    l'article 3.6 », à une place que l'arrêté de 2023 ne montre pas ; dès le 1er janvier
    2008, où tombent les deux articles de 1979 que l'arrêté de 2006 gardait (l'article 17 dans la rédaction des arrêtés du 5 mai 1981, du 17 juin 1985, du 9 mars 1987 et du 29 juillet 2003, et peut-être du 4 mai 1982 et du 13 août 1987, version précédente). Si les trente années d'affiliation se comptent depuis
    1979, une pension de 2008 n'en a que vingt-neuf (1979 à 2007) : rien n'est dû, et
    le modèle sert juste ; elles sont atteintes au 1er janvier 2009. Rien à la CARMF,
    à l'ASV ni à la CARPIMKO
  fiabilite: >-
    haute pour le texte (R-E12 : aucun arrêté ne manque, aucun ne renumérote la
    troisième partie) ; le décompte des trente années, renvoyé à l'article 3.6, non lu ;
    les dispositions transitoires de 2006, non lues (question 22)
  nee_de: JORFARTI000002050100
  textes:
