  textes:
  - id: JORFARTI000054435859
    article: >-
      arrêté du 10 juillet 2026 (CARMF), annexe : règlement du régime complémentaire,
      article 2, et règlement des prestations complémentaires de vieillesse, article 2
    publie_le: 2026-07-17
    en_vigueur: 2026-07-18
    citation: >-
      « Si le médecin demande à bénéficier de la retraite complémentaire après l'âge de
      62 ans, il est fait application d'un coefficient de majoration de 1,25 % par
      trimestre, séparant le premier jour du trimestre civil suivant celui où le médecin
      atteint cet âge de la date d'effet de la retraite. « Le coefficient de majoration
      est le cas échéant réduit à 0,75 % par trimestre à partir du premier jour du
      trimestre civil suivant celui où le médecin atteint l'âge de 65 ans, sans pouvoir
      s'appliquer au-delà du premier jour du trimestre civil suivant le soixante-dixième
      anniversaire du médecin. » ; ASV : « Si le médecin demande à bénéficier des
      prestations complémentaires de vieillesse après l'âge de 62 ans, il est fait
      application d'un coefficient de majoration de 1,25 % par trimestre séparant le
      premier jour du trimestre civil suivant celui où le médecin atteint cet âge de la
      date d'effet de la retraite. »
  - id: JORFARTI000054435856
    article: arrêté du 10 juillet 2026 (CARMF), article 1er (ni lui ni l'article 2 ne fixent de date)
    publie_le: 2026-07-17
    citation: >-
      « Sont approuvés, tels qu'ils sont annexés au présent arrêté, les règlements des
      régimes d'assurance vieillesse complémentaire, d'assurance invalidité-décès et de
      prestations complémentaires de vieillesse de la section professionnelle des
      médecins. »
  - id: JORFARTI000054435915
    article: arrêté du 10 juillet 2026 (CARPIMKO), annexe, règlement, article 5
    publie_le: 2026-07-17
    en_vigueur: 2026-07-18
    citation: >-
      « Article 5 « Surcote « Lorsque la liquidation de la retraite est ajournée au-delà
      de l'âge auquel elle aurait pu être liquidée sans abattement, les assurés peuvent
      bénéficier d'une majoration de leur pension. « Cette majoration est égale à 1,25 %
      par trimestre civil entier d'ajournement postérieur à l'âge du taux plein dans la
      limite de vingt trimestres. »
  - id: JORFARTI000054435912
    article: arrêté du 10 juillet 2026 (CARPIMKO), article 1er (ni lui ni l'article 2 ne fixent de date)
