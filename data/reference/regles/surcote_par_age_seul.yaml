  textes: >-
    statuts de la CAVEC d'avant le 2 mars 2008, au seul Bulletin officiel ; arrêté du
    22 février 2008, annexe, article 3.14 (JORFARTI000018197778)
  ecart: >-
    Point non tranché (action 130, E14). Le modèle majore la CAVEC dès le 1er janvier 2008
    (période de 2008, `date_effet` du 1er janvier 2008 au 5 septembre 2018) ; l'article
    3.14 de 2008 ne vaut que le 2 mars 2008, et celui qu'il « rédige », en vigueur avant,
    n'est pas lu (Bulletin officiel). Lecture A, celle de la fiche : rien avant le 2 mars
    2008 ; le modèle sert trop aux pensions qui prennent effet du 1er janvier au 1er mars
    2008. Lecture B : l'article d'avant majorait déjà comme celui de 2008 ; le modèle sert
    trop peu avant 2008, et juste au taux en 2008. La pension de la CAVEC ne prenant effet
    qu'au premier jour d'un trimestre civil (statuts de 2008, article 3.15), la seule date
