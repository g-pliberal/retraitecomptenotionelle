  - id: JORFARTI000024270214
    article: >-
      arrêté du 23 juin 2011, annexe, statuts du complémentaire de la CAVP, article 12 et
      tableau annexé à l'article 15
    publie_le: 2011-06-29
    en_vigueur: 2011-06-30
    citation: >-
      « La pension de retraite est majorée lorsqu'elle est liquidée au-delà de l'âge
      permettant d'obtenir une retraite à taux plein et jusqu'à cet âge augmenté de 3 ans
      pour les affiliés nés à compter du 1er janvier 1956. Cette majoration est égale à
      0,5 % par trimestre. De façon transitoire : ― les affiliés nés jusqu'au 31 décembre
      1952 peuvent bénéficier d'une majoration de leur pension de retraite dans les mêmes
      conditions, mais uniquement jusqu'à l'âge permettant d'obtenir une retraite entière
      augmenté d'un an ; ― les affiliés nés en 1953, 1954 et 1955 peuvent bénéficier d'une
      majoration de leur pension de retraite dans les mêmes conditions, mais uniquement
      jusqu'à l'âge permettant d'obtenir une retraite entière augmenté de deux ans. » ;
      tableau : « Pas de majoration de pension pour un départ après 65 ans. 2. Pour les
      assurés nés entre le 1er juillet 1951 et le 31 décembre 1952 inclus » ; « 66 2,00 %
      Pas de majoration de pension pour un départ après 66 ans » ; « 68 4,00 % Pas de
      majoration de pension pour un départ après 68 ans »
