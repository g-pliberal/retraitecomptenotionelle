- id: cavec_statuts_de_2008
  statut: supposee
  hypothese: >-
    la CAVEC est lue : l'arrêté du 22 février 2008, publié le 1er mars 2008, ne fixe
    aucune date (articles 1er et 2, ni son annexe) et vaut le lendemain, le 2 mars 2008 ;
    il « rédige » l'article 3.14 de ses statuts ; à la CAVP, rien : supposée jusqu'au 6
    juin 2009, puis les statuts approuvés par l'arrêté du 11 mai 2009
    (JORFARTI000020694605, Journal officiel du 6 juin 2009), lus, n'écrivent aucune
    majoration au régime complémentaire, la retraite entière y étant acquise « à l'âge de
    65 ans » (article 12) ; à la CPRN, rien (version `avant_2007`) ; la Cipav, comme
    `cipav_de_2008` ; rien à la CARMF, à l'ASV ni à la CARPIMKO
  fiabilite: >-
    haute pour la CAVEC, au texte ; comme `cipav_de_2008` pour la Cipav ; faible pour la
    CPRN, et pour la CAVP jusqu'au 6 juin 2009, dont les statuts d'alors ne sont pas lus
  nee_de: JORFARTI000018197778
  textes:
  - id: JORFARTI000018197778
    article: arrêté du 22 février 2008, annexe, article 3.14 des statuts de la CAVEC
    publie_le: 2008-03-01
    en_vigueur: 2008-03-02
    citation: >-
      « Article 3.14 Liquidation différée de la pension de retraite complémentaire
      L'article 3.14 est ainsi rédigé : « Le compte de points de l'assuré qui diffère la
      liquidation de la retraite au-delà du 65e anniversaire est majoré de 1,25 % par
      trimestre plein de prorogation dans la limite de 25 %. La majoration s'applique au
      compte de points arrêté au 31 décembre de l'année du 65e anniversaire. Les points
      provenant des cotisations versées pendant cette période de prorogation ne
      bénéficient pas de cette majoration. »
