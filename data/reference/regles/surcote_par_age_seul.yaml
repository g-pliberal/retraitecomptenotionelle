code:
  interrupteurs:
    surcote_points: par_age_seul
    surcote_trimestres_cotises: true
    surcote_depuis_la_duree: true
    surcote_depuis_l_age_legal: true
    surcote_du_trimestre_civil_suivant: true
  moteur: >-
    `surcote_points: par_age_seul` : trimestres civils ENTIERS écoulés entre `surcote_age_debut`
    — l'âge du taux plein de la période, lu à la génération, si le champ est nul — et
    la liquidation, sans condition de durée ni de cotisation, au taux `surcote_par_trimestre`
    ; c'est la forme qu'écrivent les statuts des sections libérales, bornée par les autres
    champs `surcote_*` de la période, et par l'`age_surcote_maximum` que la table d'âges
    de la période écrit pour la génération (la CAVP). `surcote_trimestres_cotises: true`
    ne compte que les trimestres cotisés depuis le début du décompte (la CPRN) ;
    `surcote_depuis_la_duree: true` le fait partir de l'âge légal dès que la durée du
    régime de base est atteinte (`liquider.age_de_la_duree_atteinte`, la CARPIMKO) ;
    `surcote_depuis_l_age_legal: true`, de l'âge d'ouverture de la période lu à la
    génération, l'âge légal (`ouvrir.age_ouverture_commun`, la CARMF et l'ASV du
    1er janvier au 29 mars 2017). Le second taux vaut du premier trimestre qui commence
    à `surcote_palier_age` ou après. `surcote_du_trimestre_civil_suivant: true` (la
    CARMF et l'ASV) compte les trimestres de trois mois entiers du premier jour du
    trimestre civil qui suit celui où l'âge de départ est atteint jusqu'à la date
    d'effet, sans dépasser le premier jour du trimestre civil qui suit
    `surcote_age_maximum`, le second taux valant du premier jour du trimestre civil qui
    suit `surcote_palier_age` (`liquider._trimestre_civil_suivant`). `surcote_premieres_annees` (la Cipav, trente) ne
    majore que les cotisations de ces premières années de cotisation au régime, une de
    plus quand la première est partielle (`liquider.premieres_annees_majorees`) : le
    coefficient affiché est celui de la pension entière, et le détail nomme les années
    majorées.
  python: >-
    droit/liquider.py : liquider_chaque_regime, abattement_points, surcote_points,
    age_de_la_duree_atteinte, _trimestres_cotises_apres, premieres_annees_majorees,
    _trimestre_civil_suivant ;
    droit/ouvrir.py :
    age_taux_plein, age_ouverture_commun ; scenarios/actuel.py :
    AgesRegimes.age_surcote_maximum
  javascript: >-
    moteur/js/droit/liquider.js : liquiderChaqueRegime, abattementPoints, surcotePoints,
    ageDeLaDureeAtteinte, trimestresCotisesApres, premieresAnneesMajorees,
    trimestreCivilSuivant ;
    moteur/js/droit/ouvrir.js :
    ageTauxPlein, ageOuvertureCommun ; moteur/js/regimes.js :
    AgesRegimes.ageSurcoteMaximum
  parametres: >-
    regimes/asv_conventionnes.yaml, regimes/carmf_complementaire.yaml,
    regimes/carpimko_complementaire.yaml, regimes/cavec_complementaire.yaml,
    regimes/cavp_complementaire.yaml, regimes/cipav_complementaire.yaml,
    regimes/cprn_complementaire.yaml : surcote_par_trimestre, surcote_age_debut,
    surcote_age_maximum, surcote_affiliation_minimale_trimestres,
    surcote_trimestres_maximum, surcote_pas_trimestres, surcote_palier_age,
    surcote_par_trimestre_apres_palier, surcote_trimestres_cotises,
    surcote_depuis_l_age_legal, surcote_du_trimestre_civil_suivant,
    surcote_premieres_annees, date_effet, age_table,
    age_taux_plein ;
    legislation/ages_regimes.csv : age_surcote_maximum ;
    contenu.parametres de chaque version : surcote_par_trimestre, surcote_pas_trimestres,
    surcote_trimestres_maximum, surcote_age_debut,
    surcote_affiliation_minimale_trimestres, points_majores, surcote_palier_age,
    surcote_par_trimestre_apres_palier, surcote_age_maximum, surcote_trimestres_cotises,
    surcote_depuis_l_age_legal, surcote_du_trimestre_civil_suivant
  tests: [tests/test_simulateur.py, tests/test_sections_sante.py,
    tests/test_sections_liberales.py, tests/test_oracle.py, tests/js/moteur.test.js,
    tests/temoins/simulations.json]
