code:
  interrupteurs:
    surcote_points: par_age_seul
    surcote_trimestres_cotises: true
    surcote_depuis_la_duree: true
  moteur: >-
    `surcote_points: par_age_seul` : trimestres civils ENTIERS écoulés entre `surcote_age_debut`
    — l'âge du taux plein de la période, lu à la génération, si le champ est nul — et
    la liquidation, sans condition de durée ni de cotisation, au taux `surcote_par_trimestre`
    ; c'est la forme qu'écrivent les statuts des sections libérales, bornée par les autres
    champs `surcote_*` de la période, et par l'`age_surcote_maximum` que la table d'âges
    de la période écrit pour la génération (la CAVP). `surcote_trimestres_cotises: true`
    ne compte que les trimestres cotisés depuis le début du décompte (la CPRN) ;
    `surcote_depuis_la_duree: true` le fait partir de l'âge légal dès que la durée du
    régime de base est atteinte (`liquider.age_de_la_duree_atteinte`, la CARPIMKO).
