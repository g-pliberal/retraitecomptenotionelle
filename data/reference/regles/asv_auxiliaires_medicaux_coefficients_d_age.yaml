schema_version: 1
id: asv_auxiliaires_medicaux_coefficients_d_age
intitule: >-
  Prestations complémentaires de vieillesse des auxiliaires médicaux conventionnés
  (ASV de la CARPIMKO) : le taux plein à 65 ans révolus, ou à 60 ans pour l'inapte ;
  dès 60 ans, un coefficient d'anticipation par année d'âge, de 0,75 à 60 ans à 0,95 à
  64 ans, que ni la durée d'assurance ni le taux plein du régime de base n'annulent ;
  aucune majoration au-delà de 65 ans.
domaine: decote_surcote
regimes: [asv_auxiliaires_medicaux]
etape: liquider_chaque_regime
face: droit
etat: transcrite
lit:
- >-
  l'âge de l'auxiliaire médical à la date d'effet de sa pension, en années révolues
- >-
  l'inaptitude au travail, « dûment constatée », et la qualité d'ancien combattant ou
  d'ancien prisonnier de guerre aux conditions du 5° de L. 351-8
- la date d'effet de la pension, qui choisit la version
ecrit:
- >-
  le coefficient d'anticipation qui réduit la pension de l'ASV, de 0,75 à 60 ans à un
  à 65 ans, que `abattement_points` rend à `liquider_chaque_regime`
- >-
  le coefficient ramené à un pour l'inapte dès 60 ans
  (`age_sans_coefficient_de_l_inapte`) et pour l'ancien combattant ou prisonnier de
  guerre à l'âge de sa fiche (`categories_sans_coefficient`)
dates_qui_decident:
- liquidation.date_effet
versions:
- id: avant_le_reglement_de_2026
  statut: supposee
  hypothese: >-
    les pensions qui prennent effet avant le 18 juillet 2026 relèvent de statuts de la
    section que le Journal officiel ne publie pas : l'index JORF du dépôt n'en porte
    aucun avant l'arrêté du 10 juillet 2026. Le guide de l'assurance vieillesse des
    professions libérales de la CNAVPL, édition 2025, p. 95-96, écrit la même règle :
    la retraite « à 65 ans », et « par anticipation dès l'âge de 60 ans », avec « un
    coefficient réducteur allant de 0,75 à 60 ans à 0,95 à 64 ans ». La fiche présume
    la règle de 2026 à toutes les dates d'avant
  fiabilite: >-
    moyenne pour 2025, que le guide de la CNAVPL atteste ; faible avant, qu'aucun texte
    lu ne date
  bornes:
    liquidation.date_effet: [null, 2026-07-18]
  contenu:
    parametres:
      abattement_points: cavom
      decote_annulee_par_la_duree: false
      age_sans_coefficient_de_l_inapte: 60
      categories_sans_coefficient: [taux_plein_anciens_combattants_prisonniers]
    droit: celui de la version reglement_de_2026, présumé
  exemples: aucun trouvé
- id: reglement_de_2026
  statut: lue
  textes:
  - id: JORFARTI000054435915
    article: >-
      règlement du régime de prestations complémentaires de vieillesse, annexe de
      l'arrêté du 10 juillet 2026, II, articles 2 à 4
    en_vigueur: 2026-07-18
    publie_le: 2026-07-17
    citation: >-
      « Article 2 « Conditions d'ouverture de droits à la retraite « Conformément à
      l'article L. 645-1 du code de la sécurité sociale les prestations complémentaires
      de vieillesse sont attribuées aux auxiliaires médicaux ayant exercé pendant au
      moins un an une activité conventionnée. « La pension prend effet au premier jour
      du trimestre civil qui suit la demande d'attribution de retraite. [...] « Article
      3 « Taux plein « Pour bénéficier des prestations complémentaires de vieillesse
      prévues par les présents statuts, l'auxiliaire médical doit remplir les conditions
      suivantes : « Etre âgé de 65 ans révolus ou de 60 ans en cas d'inaptitude au
      travail dûment constatée (ou pour les plus grands invalides relevant des articles
      L. 132-1 et L. 132-2 du code des pensions militaires d'invalidité et des victimes
      de guerre, ainsi que pour les déportés et internés titulaires de la carte de
      déporté ou interné de la Résistance ou de la carte de déporté ou interné
      politique) ou de l'âge prévu pour les anciens combattants et les anciens
      prisonniers de guerre remplissant les conditions du 5° de l'article L 351-8 du
      code de la sécurité sociale. [...] « Article 4 « Décote « Le bénéfice des
      prestations complémentaires de vieillesse peut être accordé à partir de l'âge de
      60 ans, avec application des coefficients d'anticipation suivants : « - 0,75 si la
      pension est liquidée à l'âge de 60 ans ; « - 0,80 si la pension est liquidée à
      l'âge de 61 ans ; « - 0,85 si la pension est liquidée à l'âge de 62 ans ; « - 0,90
      si la pension est liquidée à l'âge de 63 ans ; « - 0,95 si la pension est liquidée
      à l'âge de 64 ans. » »
  nee_de: JORFARTI000054435915
  bornes:
    liquidation.date_effet: [2026-07-18, null]
  contenu:
    parametres:
      abattement_points: cavom
      decote_annulee_par_la_duree: false
      age_sans_coefficient_de_l_inapte: 60
      categories_sans_coefficient: [taux_plein_anciens_combattants_prisonniers]
    droit: >-
      taux plein à 65 ans révolus ; dès 60 ans, 0,75 à 60 ans, 0,80 à 61 ans, 0,85 à 62
      ans, 0,90 à 63 ans, 0,95 à 64 ans, l'âge compté en années révolues ; la durée
      d'assurance, le taux plein du régime de base, la carrière longue et la
      complémentaire n'entrent nulle part ; aucune majoration après 65 ans
    conditions: >-
      sans coefficient dès 60 ans, l'inapte, le grand invalide de guerre et l'ancien
      déporté ou interné ; à l'âge du 5° de L. 351-8, l'ancien combattant et l'ancien
      prisonnier de guerre
  exemples: aucun trouvé
approximations:
- version: [avant_le_reglement_de_2026]
  textes: statuts de la section d'avant le 18 juillet 2026, non publiés au Journal officiel
  ecart: >-
    la fiche sert la règle du règlement de 2026 aux pensions d'avant, sur la foi du
    guide de la CNAVPL de 2025, qui écrit les mêmes coefficients ; depuis quand ils
    valent n'est pas établi
  effet: non mesuré
- version: [avant_le_reglement_de_2026, reglement_de_2026]
  textes: règlement de 2026, article 3
  ecart: >-
    le moteur ne sert pas sans coefficient dès 60 ans le grand invalide de guerre
    (L. 132-1 et L. 132-2 du code des pensions militaires d'invalidité), qu'aucune
    carrière ne déclare, ni l'ancien déporté ou interné, dont la fiche du régime
    général donne le taux plein à l'âge légal de la génération et non à 60 ans
  effet: non mesuré ; des populations très peu nombreuses
- version: [avant_le_reglement_de_2026, reglement_de_2026]
  textes: règlement de 2026, article 2, « au premier jour du trimestre civil qui suit la demande »
  ecart: >-
    le règlement donne à l'ASV sa propre demande, dès 60 ans. Le moteur la liquide
    avec la complémentaire de la CARPIMKO, à la date de celle-ci : le parti en carrière
    longue, dont la complémentaire attend son âge, reçoit l'ASV au coefficient de cet
    âge, quand il pourrait la demander plus tôt à un coefficient plus bas, ou attendre
    65 ans. Convention du modèle, qui ne connaît qu'une demande par caisse
  effet: non mesuré
sources:
  lu_le: 2026-11-20
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Trouver les statuts de l'ASV de la CARPIMKO d'avant 2026, que le Journal officiel
    ne publie pas, pour dater le barème ; un exemple chiffré de la caisse, dont la
    notice « Départ anticipé » ne se télécharge plus le 20 novembre 2026 ; savoir si la
    caisse liquide ses trois régimes ensemble ou l'ASV à sa propre demande.
  lectures:
  - type: jorf
    reference: >-
      arrêté du 10 juillet 2026 (JORFTEXT000054435904), annexe, II, règlement du régime
      de prestations complémentaires de vieillesse (JORFARTI000054435915), articles 1er
      à 4, lus mot à mot ; article 2 de l'arrêté (JORFARTI000054435913) : « Le présent
      arrêté sera publié au Journal officiel de la République française », sans autre
      date : il entre en vigueur le lendemain de sa publication, le 18 juillet 2026. Lu
      dans l'index JORF du dépôt
    date: 2026-11-20
  - type: autre
    reference: >-
      CARPIMKO, page « Âge de ma retraite », lue le 20 novembre 2026 par la relecture
      des régimes : pour l'ASV, « Âge minimum légal 60 ans », « Taux plein 65 ans » ; sa
      page de calcul : « 5 % à 64 ans, 10 % à 63 ans, 15 % à 62 ans, 20 % à 61 ans, 25 %
      à 60 ans »
    date: 2026-11-20
  - type: autre
    reference: >-
      CNAVPL, guide de l'assurance vieillesse des professions libérales, 2025, p. 95-96 :
      la retraite « à 65 ans », « par anticipation dès l'âge de 60 ans », avec « un
      coefficient réducteur allant de 0,75 à 60 ans à 0,95 à 64 ans »
    date: 2026-11-20
textes_sans_effet:
- id: JORFARTI000054435912
  article: arrêté du 10 juillet 2026, article 1er
  publie_le: 2026-07-17
  motif: l'approbation des règlements, sans date d'entrée en vigueur
code:
  interrupteurs:
    abattement_points: cavom
    decote_annulee_par_la_duree: false
  moteur: >-
    `abattement_points: cavom` : 5 % par année manquante jusqu'à l'âge du taux plein,
    une année entamée comptant entière, et seul l'âge ouvre le taux plein — la règle
    que la CAVOM écrit « non susceptible de fractionnement » ; à 65 ans de taux plein,
    c'est le barème de l'article 4, par année d'âge révolue. `decote_annulee_par_la_duree:
    false` : la durée d'assurance n'annule pas le coefficient.
    `age_sans_coefficient_de_l_inapte: 60` : le coefficient de l'affilié dont la
    carrière déclare l'inaptitude revient à un dès cet âge.
    `categories_sans_coefficient` : l'ancien combattant ou prisonnier de guerre, aux
    conditions de sa fiche.
  javascript: >-
    moteur/js/droit/liquider.js : abattementPoints, abattementIrcec,
    inapteSansCoefficient, categorieSansCoefficient ; moteur/js/droit/ouvrir.js :
    ageTauxPlein
  parametres: >-
    contenu.parametres de chaque version : abattement_points,
    decote_annulee_par_la_duree, age_sans_coefficient_de_l_inapte,
    categories_sans_coefficient ;
    regimes/asv_auxiliaires_medicaux.yaml : age_ouverture, age_taux_plein,
    age_sans_coefficient_de_l_inapte, categories_sans_coefficient ;
    legislation/ages_regimes.csv : pcv_auxiliaires_medicaux
  tests: [tests/test_pcv_sante.py]
historique:
- >-
  2026-11-20 — née de la relecture des régimes (action 191) : le moteur servait l'ASV
  sans coefficient à qui avait le taux plein de son régime de base, et comptait 1,25 %
  par trimestre manquant, quand le règlement ne connaît que l'âge, par année révolue.
  Corrigé le jour même, selon la règle du propriétaire du 20 novembre 2026.
effet: >-
  Tout auxiliaire médical conventionné parti avant 65 ans avec sa durée d'assurance :
  son ASV perd de 5 % (à 64 ans) à 25 % (à 60 ans). Né en 1964, entré à 17 ans, parti à
  63 ans : 0,90 au lieu de 1. Celui qui n'avait pas sa durée passe du décompte par
  trimestre au décompte par année d'âge : à 62 ans et 9 mois, 0,85 au lieu de 0,8875.
sans_reference: 'Au relevé du 22 novembre 2026, ni exemple officiel, ni grille posée sans le
  code, ni autre modèle du droit réel cité par la fiche, et aucune source du vivier ne lui est
  rattachée : seul le texte la tient.'
