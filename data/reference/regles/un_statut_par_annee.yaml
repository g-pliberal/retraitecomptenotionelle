approximations:
- ecart: >-
    La saisie n'a pas de statut pour le conjoint collaborateur d'un libéral, qui cotise
    sur un forfait ou sur une part du revenu du chef (L. 662-1) — celui d'un artisan ou
    d'un commerçant a le sien depuis le 16 octobre 2026 (fiche
    `conjoint_collaborateur_independants`) —, ni pour le dirigeant assimilé salarié, sans
    assurance chômage ni réduction générale, qui se saisit en salarié du privé. Elle ne
    porte ni l'année d'incapacité d'exercice du libéral, qui reçoit 400 points (D.
    643-1), ni l'artiste-auteur sous le seuil d'affiliation au RAAP, que le modèle fait
    cotiser.
  effet: >-
    non mesuré ; léger : la coupe du 14 octobre 2026 le déclare sans le faire
    (action 138, classement du 9 octobre)
- ecart: >-
    L'activité accessoire de l'agent d'un régime spécial suit D. 171-4 par ANNÉES
    ENTIÈRES, de 1981 à 2014 : l'année 1980, dont la dispense ne court que du
    1er juillet (résumé du décret n° 80-475), et l'année 2015, dont seules les
    rémunérations versées à compter du 19 juillet ouvrent des droits (circulaire Cnav
    2016/15), gardent toutes deux leurs droits au régime général ; la ligne ne dit pas
    ses mois, et le modèle ne la coupe pas. Avant le 1er juillet 1980, la règle n'est pas
    lue (fac-similé du JO du 29 juin 1980) : le modèle laisse les droits.
  effet: >-
    au plus six mois de l'activité accessoire, deux années : sur le cas du test, salarié
    du privé à 0,3 fois le salaire moyen toute l'année 2015, le régime général sert
    128,29 € par an sur quatre trimestres, dont les rémunérations de janvier à juin
    n'ouvraient rien
- ecart: >-
    QUI EST L'AGENT D'UN RÉGIME SPÉCIAL, lu dans R. 711-1 : le modèle range les régimes
    que ses dix numéros nomment (`REGIMES_DES_ORGANISATIONS_SPECIALES`), et non le
    militaire, que le 1° ne nomme pas (« pour les fonctionnaires, les magistrats et les
    ouvriers de l'Etat »), ni l'agent de la RATP, du SEITA, de la CRPCEN, du port de
    Strasbourg : R. 711-24, qui vise d'autres salariés, renvoie au décret du 28 octobre
    1935, non lu. La Cnav ne parle que du « fonctionnaire ». Deux lectures : le texte
    seul (le modèle) ; ou tout agent d'un régime spécial, comme le disait la note du
    3 novembre.
  effet: >-
    pour le militaire, l'agent de la RATP… qui déclare une activité salariée cumulée de
    1981 à 2014, le modèle sert le régime général, que la seconde lecture lui ôte : sur le
    cas du test, 606,65 € par an au militaire non officier (vingt trimestres)
- ecart: >-
    « ACTIVITÉ SALARIÉE OU ASSIMILÉE RELEVANT DU RÉGIME GÉNÉRAL » : le modèle y range
    toute activité que le routage porte au régime général cette année-là, l'artiste-auteur
    et, depuis 2013, l'élu local compris, qu'il rattache au régime général ; une lecture
    qui ne compterait que l'activité d'un employeur les garderait au régime général.
    L'activité principale est la ligne en tête de l'année, celle qui en couvre le plus de
    mois, exercée : l'année d'un changement, ou d'une interruption de l'activité
    principale, se lit à cette ligne.
  effet: non mesuré ; rare
- ecart: >-
    CE QUE LA RÈGLE NE TOUCHE PAS : la complémentaire de l'activité accessoire (D. 171-4
    ne dispense que de la cotisation de L. 241-3), que le modèle laisse à l'Arrco, non
    relue ; sans pension du régime général, le modèle liquide cette Arrco au coefficient
    d'anticipation qu'il lit pour le régime de l'activité principale (1 pour l'agent de la
    SNCF, 0,98 pour celui des IEG, au lieu de 0,93), non relu ; la cotisation salariale
    vieillesse que la fiche de paie de l'activité prélève, dont l'assuré était dispensé ;
    le compte notionnel, que la proposition tient à part. Un relevé fait foi : ce que la
    caisse y a reporté reste au compte, comme la lettre Cnav du 25 janvier 1988 le dit
    d'une cotisation précomptée à tort.
  effet: >-
    l'Arrco de l'agent de la SNCF du cas du test passe de 243,40 € à 261,72 €, celle de
    l'agent des IEG à 256,48 € ; le reste non mesuré
- ecart: >-
    DEUX RÈGLES VOISINES, NON PORTÉES : D. 171-11, en vigueur, ôte toute cotisation et
    tout droit à l'activité accessoire du fonctionnaire de l'État ou de la collectivité
    « au service de l'Etat, d'un département, d'une commune ou d'un établissement
    public » — le contractuel du public cumulé : ni régime général depuis 2015, ni
    Ircantec, à toute date ; R. 741-41 du code rural, en vigueur, dispense de même
    l'activité salariée agricole accessoire de l'agent d'un régime spécial, que le modèle
    fait valider à la MSA.
  effet: >-
    non mesuré : l'agent qui déclare cumulée une activité de contractuel du public ou de
    salarié agricole (candidats de la note du 6 novembre 2026)
code:
  moteur: >-
    `_lignes_du_parcours` bâtit une ligne par année et par activité : celle de
    l'activité principale, la plus longue l'année d'un changement, puis une par activité
    que l'assuré déclare cumulée (`Metier`, son champ `cumul`), sur ses propres mois,
    marquée `cumulee`. `coordonner.ecarter_les_accessoires`, au bout de
    `coordonner.retablir`, ôte au régime général l'activité accessoire de l'agent d'un
    régime de R. 711-1, de 1981 à 2014 (`accessoire_d_un_regime_special`, que
    `coordonner.regimes_de` lit).
    `DonneesMacro.trimestres_valides` valide les trimestres d'une ligne sur son revenu,
    un par seuil de deux cents heures de SMIC depuis 1972, de cent cinquante depuis 2014
    (`DonneesMacro.seuil_d_un_trimestre`), quatre au plus ;
    `Carriere.trimestres_ecoules` les borne aux trimestres civils des mois que la ligne
    couvre avant le départ. `Carriere.trimestres_par_annee` borne la durée tous régimes
    à quatre trimestres par année civile, ceux de l'activité qui en couvre le plus
    (`Carriere._plafonds_trimestres`), et `Carriere.trimestres_cumules` en fait la
    somme.
  python: >-
    carriere.py : _lignes_du_parcours, Metier, Carriere.trimestres_par_annee,
    Carriere._plafonds_trimestres, Carriere.trimestres_cumules,
    Carriere.trimestres_ecoules ; donnees/macro.py : DonneesMacro.trimestres_valides,
    DonneesMacro.seuil_d_un_trimestre ; droit/coordonner.py : ecarter_les_accessoires,
    regimes_de
  javascript: >-
    moteur/js/carriere.js : lignesDuParcours, Carriere.trimestresParAnnee,
    Carriere.trimestresCumules, Carriere.trimestresEcoules ; moteur/js/macro.js :
    DonneesMacro.trimestresValides, DonneesMacro.seuilDUnTrimestre ;
    moteur/js/droit/coordonner.js : ecarterLesAccessoires, regimesDe
  parametres: >-
    macro/smic_horaire.csv : smic_horaire ; legislation/validation_trimestres.csv :
    heures
  tests:
  - tests/test_cumul_activites.py
  - >-
    tests/test_cumul_activites.py et tests/test_minima_agricoles.py, qui confrontent les
    deux moteurs sur des carrières qui la portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    trois témoins changent sans le plafond de quatre trimestres par année civile :
    cumul_salarie_et_artisan_borne et dispense_saisonniere_cumulee, au scénario 1, et
    cumul_salarie_et_liberal, dans sa seule durée
