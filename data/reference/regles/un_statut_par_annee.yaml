approximations:
- ecart: >-
    La saisie n'a pas de statut pour le conjoint collaborateur d'un libéral, qui cotise
    sur un forfait ou sur une part du revenu du chef (L. 662-1) — celui d'un artisan ou
    d'un commerçant a le sien depuis le 16 octobre 2026 (fiche
    `conjoint_collaborateur_independants`) —, ni pour le dirigeant assimilé salarié, sans
    assurance chômage ni réduction générale, qui se saisit en salarié du privé. Elle ne
    porte ni l'année d'incapacité d'exercice du libéral, qui reçoit 400 points (D.
    643-1), ni l'artiste-auteur sous le seuil d'affiliation au RAAP, que le modèle fait
    cotiser.
  effet: >-
    non mesuré ; léger : la coupe du 14 octobre 2026 le déclare sans le faire
    (action 138, classement du 9 octobre)
- ecart: >-
    L'activité accessoire de l'agent d'un régime spécial suit D. 171-4 par ANNÉES
    ENTIÈRES, de 1981 à 2014 : l'année 1980, dont la dispense ne court que du
    1er juillet (résumé du décret n° 80-475), et l'année 2015, dont seules les
    rémunérations versées à compter du 19 juillet ouvrent des droits (circulaire Cnav
    2016/15), gardent toutes deux leurs droits au régime général ; la ligne ne dit pas
    ses mois, et le modèle ne la coupe pas. Avant le 1er juillet 1980, la règle n'est pas
    lue (fac-similé du JO du 29 juin 1980) : le modèle laisse les droits.
  effet: >-
    au plus six mois de l'activité accessoire, deux années : sur le cas du test, salarié
    du privé à 0,3 fois le salaire moyen toute l'année 2015, le régime général sert
    128,29 € par an sur quatre trimestres, dont les rémunérations de janvier à juin
    n'ouvraient rien. À droit exact, si les rémunérations de janvier à juin sont versées
    avant le 19 juillet 2015 et celles de juillet à décembre après, à mensualités égales
    (hypothèse : la ligne ne dit pas ses mois) : la moitié du salaire de 2015,
    11 739,30 / 1,049 / 2 = 5 595,95 € (1,049, coefficient des salaires de 2015 au
    1er janvier 2022, `revalorisation_salaires.csv`), reste sous le seuil de quatre
    trimestres, 4 × 150 × 9,61 = 5 766 € (R. 351-9 ; SMIC horaire de 2015,
    `smic_horaire.csv`) : trois trimestres, et une pension de
    5 869,65 × 45,625 % × 3/167 = 48,11 € par an (5 595,95 × 1,049 = 5 869,65). Le modèle, qui garde l'année entière,
    sert 80,18 € de plus ; une lecture qui l'ôterait, 48,11 € de moins (session H6-bis)
- ecart: >-
    QUI EST L'AGENT D'UN RÉGIME SPÉCIAL, lu dans R. 711-1 : le modèle range les régimes
    que ses dix numéros nomment (`REGIMES_DES_ORGANISATIONS_SPECIALES`), et non le
    militaire, que le 1° ne nomme pas (« pour les fonctionnaires, les magistrats et les
    ouvriers de l'Etat »), ni l'agent de la RATP, du SEITA, de la CRPCEN, du port de
    Strasbourg : R. 711-24, qui vise d'autres salariés, renvoie au décret du 28 octobre
    1935, non lu. La Cnav ne parle que du « fonctionnaire ». Deux lectures : le texte
    seul (le modèle) ; ou tout agent d'un régime spécial, comme le disait la note du
    3 novembre. LA COMPAGNIE GÉNÉRALE DES EAUX, que R. 711-1 nommait au 9° du
    21 décembre 1985 au 16 mai 1991 (LEGIARTI000006752039), et avant lui l'article 61 du
    décret n° 46-1378, n'est pas dans la constante : son régime spécial a pris fin le
    1er janvier 1991 (loi n° 91-73, article 17, I), le décret n° 91-489 l'a ôtée de
    R. 711-1 le 17 mai 1991, et aucun statut de la saisie ne la route
    (`compagnie_generale_eaux`, sans statut à l'inventaire) : son salarié se simule en
    salarié du privé, et la règle ne peut s'y appliquer. R. 711-24, que D. 171-2 vise
    aussi, porte au moins la chambre de commerce et d'industrie de Paris : le décret
    n° 97-1325 qui approuve le règlement de son régime spécial vise « le code de la
    sécurité sociale, notamment ses articles L. 711-1 et R. 711-24 » ; la constante
    l'omet, et aucun statut ne la route (`cci_paris`). LA RATP, POINT NON TRANCHÉ, deux
    indices contraires : cinq décrets de son régime, de 1991 à 2008 (n° 91-226,
    n° 2004-174, n° 2005-1635, n° 2005-1639, n° 2008-637), visent R. 711-1 ; mais un visa
    n'est pas une disposition, R. 711-1 ne la nomme à aucun numéro, et D. 412-79, de
    1985 à aujourd'hui, la range au « d. », à part du « c. des chemins de fer d'intérêt
    général secondaire et d'intérêt local et des tramways » (le 7° de R. 711-1) et du
    « i. des régimes spéciaux mentionnés à l'article R. 711-24 » — une liste qui garde
    pourtant, à sa rédaction en vigueur, « f. de la compagnie générale des eaux »,
    fermée en 1991.
  effet: >-
    pour le militaire, l'agent de la RATP… qui déclare une activité salariée cumulée de
    1981 à 2014, le modèle sert le régime général, que la seconde lecture lui ôte : sur le
    cas du test, 606,65 € par an au militaire non officier (vingt trimestres). L'agent de
    la RATP du même cas (né le 15 janvier 1960, entré en 1982, parti à 62 ans, salarié
    du privé en plus de 2000 à 2004 à 0,3 fois le salaire moyen) reçoit du régime
    général 10 130,98 × 45,625 % × 20/167 = 553,56 € par an (taux : 160 trimestres tous
    régimes sur 167, sept manquants, moins que les vingt trimestres jusqu'à 67 ans :
    50 − 7 × 0,625 = 45,625 %) ; la lecture qui range la RATP sous
    R. 711-1 les lui ôte, et le modèle liquide alors l'Arrco de l'activité sans
    coefficient d'anticipation (261,72 € au lieu de 261,72 × 0,93 = 243,40 €) : sa
    pension passe de 34 015,90 € à 33 480,66 €, 535,24 € de moins par an (553,56 −
    18,32 ; moteur Python, la constante élargie en mémoire, le code inchangé). La
    compagnie générale des eaux et la CCI de Paris : sans effet, aucun statut ne les
    route (session H6-bis)
- ecart: >-
    « ACTIVITÉ SALARIÉE OU ASSIMILÉE RELEVANT DU RÉGIME GÉNÉRAL » : le modèle y range
    toute activité que le routage porte au régime général cette année-là, l'artiste-auteur
    et, depuis 2013, l'élu local compris, qu'il rattache au régime général ; une lecture
    qui ne compterait que l'activité d'un employeur les garderait au régime général.
    L'activité principale est la ligne en tête de l'année, celle qui en couvre le plus de
    mois, exercée : l'année d'un changement, ou d'une interruption de l'activité
    principale, se lit à cette ligne.
  effet: non mesuré ; rare
- ecart: >-
    CE QUE LA RÈGLE NE TOUCHE PAS : la complémentaire de l'activité accessoire (D. 171-4
    ne dispense que de la cotisation de L. 241-3), que le modèle laisse à l'Arrco, non
    relue ; sans pension du régime général, le modèle liquide cette Arrco au coefficient
    d'anticipation qu'il lit pour le régime de l'activité principale (1 pour l'agent de la
    SNCF, 0,98 pour celui des IEG, au lieu de 0,93), non relu ; la cotisation salariale
    vieillesse que la fiche de paie de l'activité prélève, dont l'assuré était dispensé ;
    le compte notionnel, que la proposition tient à part. Un relevé fait foi : ce que la
    caisse y a reporté reste au compte. La lettre Cnav du 25 janvier 1988 ne le dit que
    de sa « Situation n°1 », la cotisation ouvrière précomptée à tort, dont les droits
    « restent acquis à l'assuré » ; de la « Situation n°2 », un report fait sans
    précompte, faute d'avoir vu l'exonération, elle dit : « le report effectué à tort
    doit être annulé car il ne doit pas générer de droit à pension ». Un relevé ne dit
    pas laquelle : le modèle garde le report dans les deux.
  effet: >-
    l'Arrco de l'agent de la SNCF du cas du test passe de 243,40 € à 261,72 €, celle de
    l'agent des IEG à 256,48 € ; le report d'une situation n° 2 qu'un relevé porte de
    1981 à 2014, que la caisse annulerait : non mesuré ; le reste non mesuré
- ecart: >-
    DEUX RÈGLES VOISINES, NON PORTÉES : D. 171-11, en vigueur, écarte D. 171-3 à
    D. 171-9 pour les « fonctionnaires titulaires et stagiaires de l'Etat et [les]
    agents permanents des collectivités locales ne relevant pas, au titre de leur
    activité principale, des dispositions du livre IV du présent code, lorsqu'ils
    exercent une activité accessoire au service de l'Etat, d'un département, d'une
    commune ou d'un établissement public » : « aucune cotisation n'est due, au titre de
    l'activité accessoire par l'administration, la collectivité ou l'établissement
    employeur, ni par l'intéressé. Ce dernier n'a droit qu'aux prestations prévues par
    le régime dont il relève du fait de son activité principale. » Le contractuel du
    public cumulé n'aurait donc pas de régime général, depuis 2015 aussi ; l'Ircantec,
