  nee_de: JORFTEXT000030906593
  bornes:
    revenu.annee: [2015-01-01, null]
  contenu:
    droit: >-
      chaque activité cumulée valide à son régime, le régime général compris : la Cnav,
      « Le fonctionnaire cotise à l'assurance vieillesse du régime général sur ses
      rémunérations versées à partir du 19/07/2015 pour son activité accessoire relevant
      de ce régime. Cette activité lui donne des droits au régime général » ; la
      circulaire Cnav 2016/15 : « La dispense de la cotisation salariale vieillesse pour
      les activités accessoires relevant du régime général est supprimée pour les
      rémunérations versées à compter du 19 juillet 2015 »
    conditions: >-
      l'année 2015 entière ; ses rémunérations versées avant le 19 juillet n'ouvraient
      pourtant rien (approximation déclarée)
  exemples: aucun trouvé
effet: >-
  DEPUIS LE 22 SEPTEMBRE 2026, DEUX ACTIVITÉS À LA FOIS se décrivent, dans les deux
  moteurs : chacune verse à son régime, sur son revenu, et les régimes distincts
  servent chacun leur pension ; la durée tous régimes, la durée cotisée et, dans
  un groupe liquidé ensemble, la durée du groupe sont bornées à quatre trimestres
  par année civile. Rien n'est supposé : une activité n'est cumulée que si elle
  le déclare (`Metier.cumul`). Le formulaire du site le propose : un menu « remplace
  / s'ajoute », réglé sur « remplace ». Reste une approximation : l'année d'un CHANGEMENT
  de métier principal relève d'un seul régime, celui qui en occupe le plus de mois
  ; limites.md le mesure. DEPUIS LE 6 NOVEMBRE 2026, l'activité accessoire de l'agent
  d'un régime de R. 711-1 ne valide plus, de 1981 à 2014, ni trimestre ni salaire au
  régime général (D. 171-2 et D. 171-4, rédactions de 1985) : le fonctionnaire de l'État
  né le 15 janvier 1960, parti à 62 ans, salarié du privé en plus de 2000 à 2004 à 0,3
  fois le salaire moyen, perd la pension du régime général de 553,56 € par an
  (31 936,65 € à 31 383,09 €), que le modèle lui servait sur vingt trimestres ; de même
  l'ouvrier de l'État, l'agent de la CNRACL, de la SNCF et des IEG
  (`tests/test_cumul_activites.py`).
