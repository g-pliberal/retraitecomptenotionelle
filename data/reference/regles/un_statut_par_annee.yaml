code:
  moteur: >-
    `_lignes_du_parcours` bâtit une ligne par année et par activité : celle de
    l'activité principale, la plus longue l'année d'un changement, puis une par activité
    que l'assuré déclare cumulée (`Metier`, son champ `cumul`), sur ses propres mois,
    marquée `cumulee`. `coordonner.ecarter_les_accessoires`, au bout de
    `coordonner.retablir`, ôte au régime général l'activité accessoire de l'agent d'un
    régime de R. 711-1, de 1981 à 2014 (`accessoire_d_un_regime_special`, que
    `coordonner.regimes_de` lit).
    `DonneesMacro.trimestres_valides` valide les trimestres d'une ligne sur son revenu,
    un par seuil de deux cents heures de SMIC depuis 1972, de cent cinquante depuis 2014
    (`DonneesMacro.seuil_d_un_trimestre`), quatre au plus ;
    `Carriere.trimestres_ecoules` les borne aux trimestres civils des mois que la ligne
    couvre avant le départ. `Carriere.trimestres_par_annee` borne la durée tous régimes
    à quatre trimestres par année civile, ceux de l'activité qui en couvre le plus
    (`Carriere._plafonds_trimestres`), et `Carriere.trimestres_cumules` en fait la
    somme.
  python: >-
    carriere.py : _lignes_du_parcours, Metier, Carriere.trimestres_par_annee,
    Carriere._plafonds_trimestres, Carriere.trimestres_cumules,
    Carriere.trimestres_ecoules ; donnees/macro.py : DonneesMacro.trimestres_valides,
    DonneesMacro.seuil_d_un_trimestre ; droit/coordonner.py : ecarter_les_accessoires,
    regimes_de
  javascript: >-
    moteur/js/carriere.js : lignesDuParcours, Carriere.trimestresParAnnee,
    Carriere.trimestresCumules, Carriere.trimestresEcoules ; moteur/js/macro.js :
    DonneesMacro.trimestresValides, DonneesMacro.seuilDUnTrimestre ;
    moteur/js/droit/coordonner.js : ecarterLesAccessoires, regimesDe
  parametres: >-
    macro/smic_horaire.csv : smic_horaire ; legislation/validation_trimestres.csv :
    heures
  tests:
  - tests/test_cumul_activites.py
  - >-
    tests/test_cumul_activites.py et tests/test_minima_agricoles.py, qui confrontent les
    deux moteurs sur des carrières qui la portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    trois témoins changent sans le plafond de quatre trimestres par année civile :
    cumul_salarie_et_artisan_borne et dispense_saisonniere_cumulee, au scénario 1, et
    cumul_salarie_et_liberal, dans sa seule durée
