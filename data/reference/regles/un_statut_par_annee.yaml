schema_version: 1
id: un_statut_par_annee
intitule: >-
  Une ligne de carrière par année et par ACTIVITÉ : l'activité principale d'abord,
  puis chaque activité que l'assuré déclare cumulée, sous un autre statut. Trimestres
  validés par le revenu (150 heures de SMIC), plafonnés aux trimestres civils de
  l'année, et quatre au plus par année civile tous régimes confondus. L'activité
  accessoire de l'agent d'un régime spécial n'ouvrait, jusqu'au 18 juillet 2015, aucun
  droit au régime général.
regimes: [banque_de_france, cancava, chemins_fer_secondaires, cnracl, comedie_francaise,
  fonction_publique_etat, fspoeie, ieg, imprimerie_nationale, marins, mines, msa_salaries,
  opera_de_paris, organic, regime_general, rsi, sncf]
etape: coordonner_les_affiliations
etat: approchee
lit:
- >-
  chaque ligne de la carrière, et si l'assuré l'a déclarée cumulée à l'activité
  principale de l'année (`cumulee`, que bâtit le parcours ; jamais sur un relevé)
- >-
  l'année de la ligne cumulée, qui est celle de ses rémunérations (revenu.annee)
- >-
  les régimes où vont, cette année-là, la ligne cumulée et la ligne de l'activité
  principale, et si l'activité principale est celle d'un militaire
ecrit:
- >-
  la carrière que le scénario 1 liquide (`coordonner.retablir`) : l'activité accessoire
  de l'agent d'un régime de R. 711-1, de 1981 à 2014, n'y valide aucun trimestre et ne va
  plus au régime général (`regimes_de`) ; ses autres régimes la reçoivent
dates_qui_decident:
- revenu.annee
versions:
- id: avant_le_1er_juillet_1980
  statut: supposee
  hypothese: >-
    la règle d'avant le décret n° 80-475 n'est pas lue : l'index JORF n'en porte que le
    résumé, « A COMPTER DU 01-07-1980, LES TRAVAILLEURS AYANT EXERCE SIMULTANEMENT UNE
    ACTIVITE RELEVANT D'UN REGIME SPECIAL, ET, A TITRE ACCESSOIRE OU REDUIT, UNE
    ACTIVITE RELEVANT DU REGIME GENERAL, SONT DISPENSES DE LA COTISATION OUVRIERE
    D'ASSURANCE VIEILLESSE DU REGIME GENERAL. EN CONTREPARTIE, ILS N'ONT PAS DROIT AUX
    PRESTATIONS DE CE REGIME » ; le texte est au fac-similé du JO du 29 juin 1980. Le
    modèle laisse à l'activité cumulée ses droits au régime général, jusqu'à l'année
    1980 entière
  fiabilite: faible
  textes:
  - {id: JORFTEXT000000696623, article: "décret n° 80-475 du 27 juin 1980, résumé de l'index JORF", en_vigueur: 1980-07-01, publie_le: 1980-06-29}
  bornes:
    revenu.annee: [null, 1981-01-01]
  contenu:
    droit: >-
      chaque activité cumulée valide à son régime, le régime général compris, quatre
      trimestres au plus par année civile tous régimes confondus
  exemples: aucun trouvé
- id: dispense_de_l_activite_accessoire
  statut: lue
  textes:
  - id: LEGIARTI000006735483
    article: D. 171-2 CSS
    en_vigueur: 1985-12-21
    citation: >-
      « Les dispositions des articles D. 171-3 à D. 171-11 sont applicables aux
      travailleurs des branches d'activité ou entreprises mentionnées à l'article R. 711-1
      ou relevant de l'article R. 711-24, bénéficiaires d'une organisation spéciale pour
      tout ou partie des législations de sécurité sociale, lorsqu'ils exercent
      simultanément et à titre accessoire une activité salariée ou assimilée relevant du
      régime général de sécurité sociale. »
  - id: LEGIARTI000006735484
    article: D. 171-4 CSS
    en_vigueur: 1985-12-21
    citation: >-
      « Les travailleurs mentionnés à l'article D. 171-2 qui bénéficient pour tout ou
      partie des risques d'un régime spécial de sécurité sociale, sont, lorsqu'ils
      exercent simultanément et à titre accessoire une activité salariée ou assimilée,
      relevant du régime général de sécurité sociale, dispensés au titre de cette
      activité de la cotisation d'assurance vieillesse incombant au salarié en vertu de
      l'article L. 241-3. Ils n'ont droit qu'aux prestations prévues par le régime auquel
      ils sont affiliés au titre de leur activité principale. »
  - id: LEGIARTI000006752040
    article: R. 711-1 CSS
    en_vigueur: 1991-05-17
    citation: >-
      « Restent soumis à une organisation spéciale de sécurité sociale, si leurs
      ressortissants jouissent déjà d'un régime spécial au titre de l'une ou de plusieurs
      des législations de sécurité sociale : 1°) les administrations, services, offices,
      établissements publics de l'Etat, les établissements industriels de l'Etat et
      l'Imprimerie Nationale, pour les fonctionnaires, les magistrats et les ouvriers de
      l'Etat ; 2°) les régions, les départements et communes ; 3°) les établissements
      publics départementaux et communaux n'ayant pas le caractère industriel ou
      commercial ; 4°) les activités qui entraînent l'affiliation au régime d'assurance des
      marins […] ; 5°) les entreprises minières […] ; 6°) la société nationale des chemins
      de fer français ; 7°) les chemins de fer d'intérêt général secondaire et d'intérêt
      local et les tramways ; 8°) les exploitations de production, de transport et de
      distribution d'énergie électrique et de gaz ; 9°) la Banque de France ; 10°) le
      Théâtre national de l'Opéra de Paris et la Comédie Française. »
  - {id: LEGIARTI000006752039, article: "R. 711-1 CSS, rédaction de 1985, qui nomme aussi au 9° la compagnie générale des eaux", en_vigueur: 1985-12-21}
  - {id: JORFTEXT000000696623, article: "décret n° 80-475 du 27 juin 1980, résumé de l'index JORF", en_vigueur: 1980-07-01, publie_le: 1980-06-29}
  nee_de: JORFTEXT000000696623
  bornes:
    revenu.annee: [1981-01-01, 2015-01-01]
  contenu:
    droit: >-
      l'activité salariée ou assimilée relevant du régime général que l'agent d'un régime
      de R. 711-1 exerce en plus de son activité principale ne lui ouvre rien au régime
      général, ni trimestre ni salaire au compte ; la Cnav : « Avant le 19/07/2015, le
      fonctionnaire qui exerçait, à titre accessoire, une activité salariée relevant du
      régime général, ne cotisait pas à l'assurance vieillesse du régime général. Cette
      activité ne lui ouvre pas de droit au régime général » (exposés « Taux des
      cotisations » et « Annulation au profit d'un régime spécial », version du
      24 octobre 2025) ; « le compte individuel des intéressés ne doit présenter aucun
      report de salaire » (lettre Cnav du 25 janvier 1988)
    conditions: >-
      années entières de 1981 à 2014 : la dispense court du 1er juillet 1980 (résumé du
      décret n° 80-475) aux rémunérations versées avant le 19 juillet 2015 ; l'activité
      principale est la ligne en tête de l'année, exercée, et routée à un régime de
      R. 711-1 ; le militaire, que le 1° ne nomme pas, n'y est pas rangé
  exemples: aucun trouvé
- id: affiliation_simultanee_depuis_2015
  statut: lue
  textes:
  - id: LEGIARTI000030910656
