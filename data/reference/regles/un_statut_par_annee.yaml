      d'un assuré relevant à titre principal d'un régime spécial », lue entière (PDF de
      la base) : « Avant le 19 juillet 2015, l'assuré, qui relevait au titre de son
      activité principale d'un régime spécial et exerçait une activité accessoire au
      profit d'un employeur privé, était dispensé du versement de la cotisation salariale
      vieillesse […]. Par conséquent, en l'absence de versement de la cotisation salariale
      vieillesse, l'assuré n'ouvrait aucun droit à la retraite au régime général » ; « Il
      s'agit des personnes visées […] aux articles R. 711-1 et R. 711-24 CSS » ; « La
      dispense […] est supprimée pour les rémunérations versées à compter du 19 juillet
      2015 »
