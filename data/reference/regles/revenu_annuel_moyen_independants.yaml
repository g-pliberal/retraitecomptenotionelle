schema_version: 1
id: revenu_annuel_moyen_independants
intitule: >-
  Le revenu annuel moyen des artisans et des commerçants : dix meilleures années depuis
  1973, puis une de plus toutes les deux générations à partir de 1934, une par génération
  à partir de 1944, vingt-cinq pour les assurés nés après 1952 ; sans les années dont les
  cotisations ne valident aucun trimestre depuis 2004 ; la règle commune de R. 173-3-2
  pour les pensions prenant effet depuis 2026.
domaine: salaire_de_reference
regimes: [organic, cancava, rsi]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- les revenus portés au compte du régime chaque année civile avant celle de l'effet,
  écrêtés au plafond de l'année, et l'assiette minimale sur laquelle la cotisation a été
  appelée
- les trimestres que chaque année valide au régime
- l'année de naissance, pour le nombre d'années retenues
  (legislation/annees_revenu_annuel_moyen_independants.csv, et, depuis 2026,
  legislation/annees_salaire_reference.csv)
ecrit:
- le revenu annuel moyen du régime, en euros de l'année de l'effet
dates_qui_decident:
- liquidation.date_effet
