approximations:
- ecart: >-
    le revenu moyen est la moyenne des revenus annuels ; la Cnav décrit, dans les
    anciennes dispositions de son exposé « Revenu annuel moyen », un calcul trimestriel
    pour les travailleurs indépendants — les revenus des meilleures années, multipliés
    par quatre, rapportés aux trimestres cotisés et assimilés —, que ni R. 634-1 ni R.
    634-1-1 ne portent et dont la date reste à lire (étape 138.18)
  effet: non mesuré
- ecart: >-
    après l'intégration des indépendants au régime général, de 2018 à 2025, le modèle
    liquide leurs années avec celles du régime général, sur la table des salariés, quand
    la Cnav calcule leur revenu moyen à part pour qui est né avant 1953 (étape 138.18)
  effet: non mesuré
- ecart: >-
    ni la neutralisation des années défavorables (D. 634-4, alinéa 2), ni le revenu
    partagé du conjoint collaborateur (R. 742-40), que la Cnav décrit avant juillet 2017
  effet: non mesuré
sources:
  lu_le: 2026-10-05
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Dater le calcul trimestriel du revenu annuel moyen des indépendants que l'exposé de la
    Cnav range dans ses anciennes dispositions, et lire le texte qui le fonde (étape
    138.18).
  lectures:
  - type: legifrance
    reference: >-
      R. 634-1 (1985, 1993, 2004, 2011-2023) et R. 634-1-1 (1993, 2004, 2007) dans l'index
      LEGI du dépôt ; article 2 du décret n° 2025-1409 au Journal officiel
    date: 2026-10-05
  - type: circulaire_cnav
    reference: >-
      exposés « Revenu annuel moyen » et « Nombre d'années retenues » de la base de
      législation de la Cnav, par son API
    url: https://legislation.lassuranceretraite.fr/#/expose?file_leaf_ref=retraite_personnelle_salaire_annuel_moyen_nombre_annee_retenue_ex.aspx
    date: 2026-10-05
code:
  interrupteurs:
    salaire_reference_par_generation: independants
    regles_du_salaire_annuel_moyen: revenu_annuel_moyen_independants
  python: >-
    scenarios/actuel.py : FicheDatee (revenu_annuel_moyen_independants),
    AnneesRevenuAnnuelMoyenIndependants ; droit/liquider.py : salaire_de_reference,
    nombre_d_annees_retenues
  javascript: >-
    moteur/js/regimes.js : FicheDatee, AnneesRevenuAnnuelMoyenIndependants ;
    moteur/js/droit/liquider.js : salaireDeReference, nombreDAnneesRetenues
  parametres: >-
    contenu.parametres de chaque version ;
    data/reference/legislation/annees_revenu_annuel_moyen_independants.csv
  tests: tests/test_simulateur.py et tests/js/moteur.test.js
  moteur: >-
    `salaire_reference_par_generation` vaut `independants` : le nombre d'années se lit
    dans la table des artisans et des commerçants tant que la version de la date d'effet
    dit `table: independants`, dans celle du régime général ensuite.
    `regles_du_salaire_annuel_moyen` nomme cette fiche : le moteur y lit, à la date
    d'effet, quelles années écarter.
referents:
  baremes_ipp: >-
    porte la table de R. 634-1-1 (retraites/independants/ram.yaml), que le dépôt
    remplaçait par celle des salariés
historique:
- >-
  2026-10-05 — née à l'étape 138.16 : le modèle appliquait aux artisans et aux
  commerçants la table du régime général, qui atteint vingt-cinq années dès 1948, et
  gardait les années sans trimestre après 2004.
exemples: []
reformes: [sam_annees_validantes_2004]
effet: >-
  Artisans et commerçants nés de 1935 à 1952, partis avant 2026 : leur revenu moyen
  porte sur une à cinq meilleures années de moins que celui d'un salarié, onze au lieu
  de douze pour 1935, quinze au lieu de vingt pour 1943, vingt au lieu de vingt-cinq
  pour 1948.
