    date: 2026-10-10
historique:
- >-
  2026-10-10 — née avec l'action 151, étape 2, avec la fiche `limite_age_fonction_publique`
  des civils.
effet: >-
  Tout militaire dont le départ saisi passe sa limite d'âge ou de durée de services : le
  modèle, qui ne connaît ni le grade ni le corps, le garde en service jusqu'au départ
  saisi, jusqu'à 119 ans depuis l'étape 1 de l'action 151, quand la loi le raye des
  cadres de quarante-sept à soixante-sept ans, trois de plus s'il est maintenu.
