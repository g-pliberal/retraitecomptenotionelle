      plafond_trimestres: 20
      condition: duree_de_l_age_minore
      age_de_reduction: 55
      au_dela_du_maximum: false
      fiabilite: moyenne
  exemples: aucun trouvé
- id: loi_du_9_novembre_2010
  statut: lue
  textes:
