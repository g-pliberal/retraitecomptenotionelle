approximations:
- version: [loi_de_1957, loi_du_9_novembre_2010, loi_du_14_avril_2023]
  ecart: >-
    Le statut réunit policiers et surveillants pénitentiaires, et le modèle leur sert
    les dates de la police. Les surveillants n'ont la bonification que pour les pensions
    prenant effet depuis le 29 mai 1996, d'une annuité au plus en 1996, deux en 1997,
    trois en 1998 et quatre en 1999 (loi n° 96-452, article 24, IV) ; les services
    accomplis au-delà de leur limite d'âge n'y comptent pas, quand ceux des policiers la
    réduisent. Les autres emplois que le statut couvre — ingénieurs du contrôle de la
    navigation aérienne, identificateurs de l'institut médico-légal, égoutiers — ont des
    règles propres, que le modèle ne distingue pas.
  effet: non mesuré ; les liquidations de surveillants d'avant 2000 reçoivent trop
- version: [loi_de_1957, loi_du_9_novembre_2010, loi_du_14_avril_2023]
  ecart: >-
    La radiation par limite d'âge, qui ouvre la bonification sans la durée de services,
    n'est pas portée : le modèle ne l'ouvre qu'à la durée de services super-actifs qui
    ouvre l'âge minoré à la génération, ou à la radiation pour invalidité. Les
    services accomplis au-delà de l'âge qui réduit la bonification se comptent à
    l'année : l'année de cet anniversaire est réputée servie avant lui.
  effet: non mesuré ; l'agent entré tard qui part à sa limite d'âge n'a rien
- version: [loi_de_1957, loi_du_9_novembre_2010, loi_du_14_avril_2023]
  ecart: >-
    La bonification n'entre qu'à la durée d'assurance de la fonction publique de l'État,
    pour la décote et le minimum garanti : la durée tous régimes, que le régime général
    oppose à sa propre décote, ne la lit pas, faute d'avoir lu comment la Cnav reçoit
    les bonifications des régimes spéciaux.
  effet: non mesuré ; ne joue que pour l'ancien policier passé au privé
- version: [loi_de_1957, loi_du_9_novembre_2010, loi_du_14_avril_2023]
  ecart: >-
    L'indemnité de sujétions spéciales des policiers entre dans l'assiette de leur
    pension depuis 1983, contre une retenue majorée (loi n° 57-444, article 6 bis,
    LEGIARTI000006451461) : le modèle liquide le traitement seul, et verse l'indemnité
    au RAFP avec les autres primes.
  effet: >-
    non mesuré au dépôt ; TRAJECTOiRE la porte (cas type 8 du COR)
sources:
  lu_le: 2026-10-07
  prochaine_relecture: 2027-04-30
  a_relire:
  - >-
    Lire comment le service des retraites de l'État applique, de 2004 à 2023, la
    « pension d'ancienneté » de l'article 1er de la loi de 1957 : le modèle y lit la
    durée de services qui ouvre l'âge minoré, vingt-cinq puis vingt-sept ans.
  - >-
    Lire si la Cnav compte la bonification dans la durée tous régimes d'un ancien
    policier liquidé au régime général.
  - >-
    Porter l'indemnité de sujétions spéciales dans l'assiette de la pension des
    policiers (article 6 bis de la loi de 1957 et son décret).
  lectures:
  - type: legifrance
    reference: >-
      loi n° 57-444 du 8 avril 1957, articles 1er, 2, 6 et 6 bis, toutes leurs rédactions
      dans l'index LEGI (LEGIARTI000006451453 à LEGIARTI000048697299)
    date: 2023-12-28
  - type: legifrance
    reference: >-
      loi n° 96-452 du 28 mai 1996, article 24, ses six rédactions (LEGIARTI000006696955
      à LEGIARTI000048697310)
    date: 2023-12-28
  - type: jorf
    reference: >-
      loi n° 2023-270 du 14 avril 2023, article 10, XII et XVII (JORFARTI000047445097) ;
      loi n° 2023-1250 du 26 décembre 2023, article 97 (JORFARTI000048668794)
    date: 2023-12-27
  - type: legifrance
    reference: >-
      L. 12, L. 13, L. 14 et L. 24 CPCMR, rédactions en vigueur (LEGIARTI000053280361,
      LEGIARTI000048844775, LEGIARTI000047452804) : la bonification du i de L. 12 et
      les bonifications des emplois classés se cumulent dans la limite de vingt
      trimestres ; celles qui ne sont pas accordées au titre des enfants ou du handicap
      ne comptent pas pour la surcote
    date: 2023-12-31
  - type: autre
    reference: >-
      Service des retraites de l'État, page « Les bonifications » : les bonifications
      spécifiques des fonctionnaires actifs « ne sont prises en compte que dans la
      limite du taux maximal de 75 % »
    url: https://retraitesdeletat.gouv.fr/actif/le-calcul-de-ma-retraite/les-bonifications
    date: 2026-10-07
  - type: autre
    reference: >-
      Conseil d'orientation des retraites, séance du 23 mars 2023, document n° 15, « Les
      catégories actives de la fonction publique : définition et historique », § 3.3 et
      3.4.1 : une annuité par cinq années de services, cinq au plus ; pas de surcote ;
      pas de dépassement de 75 % ; la réduction au-delà de cinquante-sept ans
    url: >-
      https://www.cor-retraites.fr/sites/default/files/2023-03/Doc_15_SG_Catégories%20actives_fonction%20publique.pdf
    date: 2023-03-23
  - type: autre
    reference: >-
      réponse ministérielle à la question écrite n° 7025 (16e législature, JO du 20 juin
      2023, p. 5610) : les policiers nationaux « peuvent bénéficier, sous conditions,
      pour le calcul de leurs droits à pension, d'une annuité supplémentaire par période
      de cinq années de services effectifs sans que la bonification ne puisse être
      supérieure à cinq ans » ; les policiers municipaux, classés en catégorie active,
      ne l'ont pas
    url: https://questions.assemblee-nationale.fr/dyn/16/questions/QANR5L16QE7025.pdf
    date: 2023-06-20
textes_a_rattacher:
- reference: loi n° 89-1007 du 31 décembre 1989, article 5 (ingénieurs du contrôle de la navigation aérienne)
- reference: loi n° 2003-1312 du 30 décembre 2003, article 93 (douaniers de la branche surveillance)
code:
  python: >-
    scenarios/actuel.py : FichesDatees, qui lit les versions de cette fiche ;
    droit/compter.py : trimestres_des_emplois, bonification_d_emploi ;
    droit/liquider.py : liquider_chaque_regime, qui ajoute la bonification aux
    services et à la durée de la décote
  javascript: >-
    moteur/js/regimes.js : FichesDatees ; moteur/js/droit/compter.js :
    trimestresDesEmplois, bonificationDEmploi ; moteur/js/droit/liquider.js
  parametres: les versions de cette fiche (contenu.parametres), que le paquet du site porte
  tests: [tests/test_bonifications_emplois.py, tests/test_trajectoire.py]
referents:
  trajectoire:
    equivalent: >-
      bonifDeterministes (R/fonctionsCalculsDivers.R) : « 4 trim tous les 5 ans, limites
      a 20 », en durée tous régimes, et une majoration de pension à part
      (`majoration_pour_bonification`) ; l'indemnité de sujétions spéciales dans la base
    confrontation: >-
      le 7 octobre 2026, sur les sorties du 5 (tests/test_trajectoire.py) : vingt
      trimestres au policier du cas type 8, des deux côtés, au tiers de trimestre près
      de ses services
historique:
- >-
  2026-10-07 — née de l'étape 17 de l'action 138 : le dépôt ne servait aucune
  bonification de service, et TRAJECTOiRE servait celle-ci (registre, 138.17).
effet: >-
  Le policier ou le surveillant qui réunit la durée de l'âge minoré : vingt trimestres
  de services à qui en a servi vingt-cinq, soit jusqu'à 15 % de pension à qui part à
  l'âge minoré, et la décote qu'ils effacent.
