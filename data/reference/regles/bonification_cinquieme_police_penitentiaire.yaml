schema_version: 1
id: bonification_cinquieme_police_penitentiaire
intitule: >-
  Bonification du cinquième des policiers actifs et des surveillants pénitentiaires :
  une annuité par cinq années de services super-actifs, cinq au plus, aux services
  liquidés dans la limite du pourcentage de 75 %, à la durée d'assurance de la décote
  et non à celle de la surcote ; réduite, jusqu'en août 2023, des services accomplis
  au-delà de cinquante-cinq ans, puis de cinquante-sept.
domaine: duree
regimes:
- fonction_publique_etat
etape: compter_les_durees
face: droit
etat: approchee
lit:
- les années servies dans le statut fonctionnaire_etat_super_actif, jusqu'à la liquidation
- la durée de services super-actifs qui ouvre l'âge minoré à la génération
  (legislation/categorie_active.csv)
- la radiation des cadres pour invalidité
- l'année de naissance, pour les services accomplis au-delà de l'âge qui réduit la
  bonification
- liquidation.date_effet
ecrit:
- les trimestres de bonification, aux services liquidés de la fonction publique de
  l'État et à sa durée d'assurance pour la décote (Durees.emplois)
dates_qui_decident:
- liquidation.date_effet
# Les paramètres que le moteur lit (droit/compter.py, `trimestres_des_emplois`, et
# son jumeau) : le statut qui ouvre la bonification et le régime qui la sert ; la
# fraction du temps servi et son plafond, en trimestres ; la condition, que le
# moteur connaît par son nom ; l'âge au-delà duquel les services réduisent la
# bonification ; et si elle porte le pourcentage au-delà du maximum, ce que ni la
# loi de 1957 ni celle de 1996 ne font : seules les bonifications de L. 12 le
# portent à 80 % (L. 13), et le service des retraites de l'État les borne à 75 %.
versions:
- id: avant_la_loi_de_1957
  statut: lue
  textes:
  - {id: LEGIARTI000006451453, article: 1er, en_vigueur: 1957-04-09}
  nee_de: LEGIARTI000006451453
  bornes:
    liquidation.date_effet: [null, 1957-01-01]
  contenu:
    droit: >-
      aucune bonification : la loi n° 57-444 l'accorde « à compter du 1er janvier 1957 »
    parametres:
      existe: false
  exemples: aucun trouvé
- id: loi_de_1957
  statut: lue
  textes:
  - {id: LEGIARTI000006451453, article: 1er, en_vigueur: 1957-04-09}
  - {id: LEGIARTI000006451459, article: 6, en_vigueur: 1957-04-09}
  - {id: LEGIARTI000006696955, article: 24, en_vigueur: 1996-05-29}
  - {id: LEGIARTI000006696956, article: 24, en_vigueur: 2007-02-06}
  nee_de: LEGIARTI000006451453
  bornes:
    liquidation.date_effet: [1957-01-01, 2011-07-01]
  contenu:
    droit: >-
      « une bonification pour la liquidation de ladite pension, égale à un cinquième du
      temps qu'ils ont effectivement passé en position d'activité dans des services
      actifs de police », pas plus de cinq annuités ; aux surveillants pénitentiaires
      depuis 1996, la même (loi n° 96-452, article 24)
    conditions: >-
      une pension d'ancienneté — vingt-cinq années de services effectifs ouvrant droit à
