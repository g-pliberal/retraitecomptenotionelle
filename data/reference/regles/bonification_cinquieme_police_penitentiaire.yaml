- id: loi_du_14_avril_2023
  statut: lue
  textes:
  - {id: LEGIARTI000047452953, article: 1er, en_vigueur: 2023-09-01}
  - {id: LEGIARTI000048697299, article: 1er, en_vigueur: 2023-12-28}
  - {id: LEGIARTI000047453009, article: 24, en_vigueur: 2023-09-01}
