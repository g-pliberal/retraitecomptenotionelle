schema_version: 1
id: points_au_prorata_des_cotisations
intitule: >-
  Au régime de base des professions libérales, les points se comptent, depuis 2004, « au
  prorata des cotisations acquittées » sur chaque tranche : la cotisation annuelle au
  plafond de la première en ouvre 450 jusqu'en 2014, 525 de 2015 à 2024, 557 depuis
  2025, celle de la seconde 100 puis 25 (D. 643-1), et une année d'affiliation
  incomplète, dont les plafonds sont réduits au prorata de ses trimestres d'affiliation
  (D. 642-3, jusqu'en 2020), puis de sa durée d'affiliation (R. 613-17, depuis 2019),
  n'en a que la part de sa cotisation ; avant 2004, les droits acquis sont transformés
  en points, cent pour un soixantième de l'allocation aux vieux travailleurs salariés.
domaine: points
regimes: [cnavpl]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- >-
  le revenu de chaque année d'activité libérale affiliée à la CNAVPL depuis 2004, et la
  part de l'année que sa ligne couvre, au mois
- le plafond annuel de la sécurité sociale de l'année
- avant 2004, les trimestres que chaque année d'affiliation valide
ecrit:
- >-
  les points de l'année, tranche par tranche, portés au compte du régime de base des
  libéraux (`acquerir`) ; avant 2004, cent points par trimestre validé
dates_qui_decident:
- revenu.annee
