      aucun point au prorata de la cotisation : le régime servait une allocation, « autant
      de soixantièmes du montant de l'allocation aux vieux travailleurs salariés [...] que
      l'assuré justifie de trimestres d'assurance » jusqu'à quinze années, « majoré d'un
