  - type: legifrance
    reference: >-
      Code de la sécurité sociale, D. 643-1, rédactions de 2015 (LEGIARTI000029825121)
      et de 2024 (LEGIARTI000049904642) : « Le versement de la cotisation annuelle
      correspondant au plafond de revenu fixé au 1° de l'article D. 642-3 ouvre droit à
      l'attribution de 525 points de retraite » (557 pour les périodes depuis 2025), 25
      pour la seconde tranche, et « le nombre de points acquis est calculé au prorata
      des cotisations acquittées sur chacune des tranches de revenus définies à
      l'article D. 642-3, arrondi à la décimale la plus proche » ; la même phrase dans
      la rédaction de 2004 (LEGIARTI000006738137). D. 642-3, rédaction de 2017
      (LEGIARTI000034624570) : 8,23 % jusqu'au plafond, 1,87 % jusqu'à cinq plafonds, et
      « en cas de période d'affiliation inférieure à une année, les plafonds prévus aux
      1° et 2° ci-dessus sont réduits au prorata des trimestres d'affiliation » ;
      rédaction de 2020 (LEGIARTI000041966479), sans cette phrase, que R. 613-17
      (LEGIARTI000038750258, depuis le 8 juillet 2019) écrit pour tout travailleur
      indépendant : la valeur du plafond « est réduite au prorata de la durée
      d'affiliation ». Lus dans l'index LEGI du dépôt
    date: 2026-10-18
  - type: legifrance
    reference: >-
      D. 643-1, ses sept rédactions, D. 642-3, ses quinze, L. 642-1, ses dix, R. 643-1,
      ses quatre, R. 643-10 de 1985, et l'article 96 de la loi n° 2003-775 dans ses deux
      rédactions,
      dans l'index LEGI du dépôt à jour de l'incrément du 28 octobre 2026 ; les décrets
      qui ont écrit D. 643-1, au Journal officiel par l'index JORF du dépôt : n° 2004-461
      (29 mai 2004), n° 2005-1004 (24 août 2005), n° 2010-1678 (30 décembre 2010),
      n° 2012-138 (31 janvier 2012, le plafond de 550 points), n° 2014-1413 (29 novembre
      2014, 525 et 25 points), n° 2024-688 (6 juillet 2024, 557 points)
    date: 2026-10-29
  - type: autre
    reference: >-
      CNAVPL, « Comprendre sa retraite », « Acquisition du nombre de points » : 450 et 100
      points « au titre des années d'activités de 2004 à 2014 », 525 et 25 de 2015 à 2024,
      557 et 25 « à compter de 2025 », « au prorata de la cotisation effective sur la
      cotisation maximale et arrondi à la décimale la plus proche » ; les trimestres
      d'avant 2004 « convertis en points à raison de 100 points par trimestre » ; deux
      exemples de 2025, 238,6 points à 20 000 € et 565,5 à 80 000 € (copie datée,
      sha256:95559a0897456b5bc23a3948c92a848bb9e49ec9408f3e00913be574c690c925)
    url: https://www.cnavpl.fr/comprendre-sa-retraite/
    date: 2026-10-29
historique:
- >-
  2026-10-29 — lue au droit (action 130) : quatre versions sur l'année du revenu — avant
  2004, l'allocation et sa conversion en points ; 450 et 100 points de 2004 à 2014 ; 525 et
  25 de 2015 à 2024 ; 557 et 25 depuis 2025 —, que les périodes de `regimes/cnavpl.yaml`
  portent toutes. Approchée : l'arrondi au dixième, et le prorata au mois plutôt qu'au
  trimestre d'affiliation.
code:
  interrupteurs:
    points_au_prorata_des_cotisations: true
  moteur: >-
    `points_au_prorata_des_cotisations`, avec `points_maximum` : les points sont ceux de
    la cotisation annuelle au repère, et ceux d'une ligne incomplète sont multipliés
    par la part de l'année qu'elle cotise (`acquerir`, `acquerir.js`). Le repère et
    l'assiette d'une telle ligne sont tous deux réduits à ses mois, et leur rapport
    rend le taux d'une année : sans l'interrupteur, une ligne de six mois reçoit les
    points d'une année entière. Les quatorze périodes en points de la CNAVPL, de 2004 à
    aujourd'hui, renvoient à cette fiche ; celle d'avant 2004 porte cent points par
    trimestre validé (`points_par_trimestre_valide`).
  python: >-
    droit/acquerir.py : acquerir ; donnees/regimes.py : PeriodeRegime.repere_assiette
  javascript: >-
    moteur/js/droit/acquerir.js : acquerir ; moteur/js/regimes.js :
    PeriodeRegime.repereAssiette
  parametres: >-
    contenu.parametres de chaque version : points_par_trimestre_valide,
    points_au_plafond, tranches_en_plafonds ; regimes/cnavpl.yaml : points_maximum,
    assiette, points_par_trimestre_valide, points_au_prorata_des_cotisations
  tests: [tests/test_sections_liberales.py, tests/js/moteur.test.js,
    tests/temoins/simulations.json]
