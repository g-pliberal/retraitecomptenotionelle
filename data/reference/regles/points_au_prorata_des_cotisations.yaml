      un soixantième de l'allocation visée à l'article L. 811-1 du code de la sécurité
      sociale vaut 100 points » (loi n° 2003-775, article 96, II, mot pour mot dans ses deux
      rédactions)
    conditions: >-
      la caisse en fait cent points par trimestre : « Les trimestres validés avant le 1er
      janvier 2004 ont été convertis en points à raison de 100 points par trimestre »
      (CNAVPL, « Comprendre sa retraite »)
