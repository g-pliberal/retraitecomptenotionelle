      présente ordonnance entreront en vigueur le 1er avril 1983. Toutefois, les
      personnels visés aux articles L. 351-16 et L. 351-17 du code du travail, âgés d'au
      moins soixante-trois ans et justifiant d'une durée d'assurance de 150 trimestres,
      bénéficient, dès le 1er juillet 1982, du taux plein défini à l'article 1er de la
      présente ordonnance » ; article 8 (LEGIARTI000006275867) : « Les dispositions de la
      présente ordonnance sont applicables aux salariés agricoles ». Lu dans l'index LEGI
      du dépôt ; les articles 1 à 4, 6 et 7, qui modifient le code, n'y sont pas, et
      l'index JORF ne porte que les titres des articles du Journal officiel du 28 mars
      1982
    date: 2026-09-27
  - type: legifrance
    reference: >-
      ordonnance n° 82-270, rapport au Président de la République (LEGIARTI000006759661) :
      « le service à soixante ans d'une pension calculée au taux prévu à soixante-cinq ans
      a été accordée à quelques catégories d'assurés : inaptes au travail, anciens
      déportés et internés, anciens combattants et prisonniers de guerre, travailleurs
      manuels et ouvrières mères de famille, femmes justifiant de 37,5 années d'assurance
      dans le régime général et celui des salariés agricoles » ; « Au-delà de
      soixante-cinq ans, les coefficients d'ajournement seront remplacés par une
      majoration de la durée d'assurance » ; « les taux de pension plus élevés qui auront
      été acquis avant le 1er avril 1983 seront maintenus » ; « La concertation […]
      permettra de déterminer dans quels délais et selon quelles modalités les professions
      artisanales et commerciales pourront bénéficier de la retraite à soixante ans ». Lu
      dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
