      l'ordonnance n° 82-270 du 26 mars 1982 et 16 du décret n° 82-628 du 21 juillet 1982,
      la pension de vieillesse ne peut pas être d'un montant inférieur à celui qu'elle
      aurait atteint si la liquidation en était intervenue avant le 1er avril 1983 compte
      tenu de l'âge de l'assuré à cette date ; ainsi l'assuré conserve le bénéfice des
      coefficients de majoration acquis au 31 mars 1983 » ; sa remarque : « en application
      de la législation en vigueur jusqu'au 31 mars 1983, le taux de 50 % augmente, sans
      limitation, de 2,5 % par trimestre d'âge après 65 ans » ; son exemple d'un assuré né
      en mars 1917, dont la pension prend effet le 1er septembre 1983 : « Coefficient acquis
      au 31-3-83 : 55 % » ; point 322, pour la pension calculée selon ce droit, « le taux
      applicable au salaire limite soumis à cotisations est celui qui a servi au calcul de
      la pension de vieillesse »
    date: 2026-09-27
    url: https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_2283_16021983.aspx
  - type: legifrance
    reference: >-
      ordonnance n° 82-270, article 11, en vigueur du 1er avril 1983 au 31 juillet 1987
      (LEGIARTI000006759664) : « Les dispositions de l'article L. 331 du code de la sécurité
      sociale, telles qu'elles résultent de la présente ordonnance, ne sauraient avoir pour
      effet de réduire le montant de la pension à un montant inférieur à celui qu'elle
      aurait atteint si la liquidation en était intervenue avant le 1er avril 1983, compte
      tenu de l'âge atteint à cette date. » Lu dans l'index LEGI du dépôt, qui ne porte
      toujours pas les articles 1er à 4, 6 et 7
    date: 2026-09-27
