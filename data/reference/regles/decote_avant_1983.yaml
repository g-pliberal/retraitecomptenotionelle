code:
  interrupteurs:
    decote_annulee_par_la_duree: false
    majoration_d_ajournement: true
    ajournement_par_annee_d_assurance: true
  moteur: >-
    La durée d'assurance annule la décote depuis l'ordonnance du 26 mars 1982, qui ouvre
    le taux plein à 60 ans à qui a la durée requise. `decote_annulee_par_la_duree: false`
    pour les périodes antérieures, où le taux ne dépendait QUE de l'âge ;
    `majoration_d_ajournement: true` le fait croître au-delà de l'âge du taux plein, du
    coefficient de la décote par trimestre civil entier (`liquider.ecart_au_taux_plein`),
    et fait garder le taux acquis au 31 mars 1983 aux périodes suivantes, qui le lisent
    dans celle de 1982 (`liquider.taux_acquis_au_31_mars_1983`) ;
    `ajournement_par_annee_d_assurance: true`, au régime général avant 1951, compte les
    années d'assurance accomplies après l'âge d'ouverture au lieu de l'âge. Les paramètres
    `age_taux_plein_femmes`, `duree_taux_plein_femmes_trimestres` et
    `duree_taux_plein_femmes_regimes` des périodes de 1978 et de 1979 à 1982 annulent la
    décote des femmes qui réunissent la durée (`liquider.taux_plein_des_femmes`).
