code:
  interrupteurs:
    decote_annulee_par_la_duree: false
  moteur: >-
    La durée d'assurance annule la décote depuis l'ordonnance du 26 mars 1982, qui ouvre
    le taux plein à 60 ans à qui a la durée requise. `decote_annulee_par_la_duree: false`
    pour les périodes antérieures, où le taux ne dépendait QUE de l'âge.
