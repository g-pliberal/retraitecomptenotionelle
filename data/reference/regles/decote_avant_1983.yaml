schema_version: 1
id: decote_avant_1983
intitule: >-
  Jusqu'au 31 mars 1983, au régime général et chez les salariés agricoles, le taux de la
  pension croissait avec l'âge seul — de 1972 à 1983, 25 % du salaire annuel moyen à
  soixante ans, majorés de 1,25 point par trimestre d'ajournement — ; la durée
  n'ouvrait le taux de soixante-cinq ans qu'à des catégories nommées, dont, depuis 1978,
  les femmes justifiant de trente-sept ans et demi d'assurance.
etat: approchee
etape: liquider_chaque_regime
effet: >-
  Les pensions du régime général et des salariés agricoles liquidées avant 1983, et celles
  des artisans et commerçants de 1973 à 1982. Le moteur compte le taux sur l'âge seul,
  comme la caisse : sur 40 % jusqu'en 1971, « le pourcentage de 20% étant augmenté en cas
  d'ajournement de 1 % par trimestre postérieur au soixantième anniversaire » (circulaire
  n° 93 SS du 17 mai 1951) ; sur 50 % depuis le 1er janvier 1972, 25 % à soixante ans,
  « majoré de 1,25 % (au lieu de 1 %) par trimestre d'ajournement » (circulaire Cnav n°
  2/72). Il compte par trimestres civils entiers, au-delà de soixante-cinq ans comme en
  deçà (`majoration_d_ajournement`) : « le taux de 50 % augmente, sans limitation, de 2,5 %
  par trimestre d'âge après 65 ans » (circulaire Cnav n° 22/83). Au régime général, avant
  1951, il compte les années d'assurance accomplies après soixante ans, non les années
  d'âge (`ajournement_par_annee_d_assurance`). Les femmes qui réunissent trente-sept ans
  et demi d'assurance au régime général, aux assurances sociales d'avant 1945 et chez les
  salariés agricoles ont le taux de soixante-cinq ans dès soixante-trois ans en 1978, dès
  soixante ans ensuite (`age_taux_plein_femmes`). Et qui avait passé soixante-cinq ans au
  1er avril 1983 garde le taux acquis au 31 mars (`liquider.taux_acquis_au_31_mars_1983`)
  sur la durée non majorée, si cette pension passe celle de 50 % sur la durée majorée
  après soixante-cinq ans (fiche `majoration_duree_apres_65_ans`), comme dans les deux
  premiers exemples de la circulaire Cnav n° 22/83 ; le troisième, qu'un salaire moyen de
  1,7 plafond et le maximum décident, est un écart connu. Cinq écarts restent, aucun
  mesuré. Une pension de janvier à mars 1983 relève encore de l'âge seul : le moteur, qui
  choisit la période à l'année, lui applique la règle d'avril et sert le taux plein à
  soixante ans à qui a 150 trimestres. Le maximum des pensions n'est pas porté, qui ramène
  parfois la pension du taux acquis. Les autres taux pleins d'avant 1983 — inaptitude,
  travaux pénibles de l'ordonnance de 1945, déportation, services de guerre, travail
  manuel, ouvrières mères de famille, agents non titulaires de soixante-trois ans dès le
  1er juillet 1982 — tiennent à des faits que le modèle ne porte pas. Chez les salariés
  agricoles, la rédaction du 6 juin 1951 ne majorait le taux que pour une liquidation
  demandée « après soixante et un ans » : si la caisse la lisait ainsi, le moteur sert
  jusqu'à trois points de trop entre soixante et soixante et un ans. Pour les artisans et
  commerçants, le moteur passe à la règle nouvelle en 1983, quand les textes lus datent
  leur taux plein à soixante ans du 1er juillet 1984, et il arrête leur taux au taux
  plein, faute d'avoir lu que l'ajournement y courait au-delà.
sources:
  lu_le: 2026-09-27
  prochaine_relecture: 2026-12-31
  a_relire:
  - >-
    Couper au 1er avril 1983 la période de 1983 du régime général et des salariés
    agricoles (ordonnance, article 9 ; décret n° 82-1054, article 2) quand le moteur saura
    dater une règle au mois (docs/architecture.md, § 4.6) : une pension de janvier à mars
    1983 relève encore de l'âge seul, de l'ajournement et de la règle des femmes de 1979,
    sans minimum contributif. Le moteur liquidant au mois de l'anniversaire (fiche
    `date_effet_mois_suivant`), la coupure seule rangerait avant avril les pensions qui
    prennent effet le 1er avril.
  - >-
    Porter le maximum des pensions, que la circulaire Cnav n° 22/83 applique aux deux
    pensions qu'elle compare (point 313, troisième exemple) et que l'article 72-1 du décret
    de 1945 renvoie, de 1972 à 1974, à un arrêté ; le moteur n'en porte aucun, avant 1983
    ni après.
  - >-
    Artisans et commerçants : le décret n° 84-560 (article 12-2 du décret n° 73-937) ouvre
    le 1er juillet 1984 le taux plein à soixante ans, pour 150 trimestres, aux prestations
    de l'article L. 663-5, et l'article 12 de la loi n° 84-575 règle, à partir du même
    jour, le service des pensions artisanales et commerciales prises dès soixante ans ; le
    moteur ouvre ce taux plein dès 1983 dans les fiches cancava et organic. Lire, pour la
    part alignée (L. 663-1), l'ancien article L. 663-1, les articles 1 à 4, 6 et 7 de
    l'ordonnance et l'article 2 du décret n° 73-937 avant le 24 février 1984, que l'index
    ne porte pas ; si rien n'avance la date, après la phase 8, décaler au 1er juillet 1984
    la période de 1983 de ces deux fiches. Gallica s'arrête en 1955 ; la base de la Cnav
    ne donne de l'ordonnance que son titre et son article 9, et ne porte aucune circulaire
    Organic ou Cancava de 1983 ou 1984.
  - >-
    Lire ce qui reste du droit de 1945 à 1972, que ni les index, ni Gallica, ni la base
    de la Cnav ne portent : l'article L. 331 du code de la sécurité sociale de 1956 à
    1971, dont la circulaire n° 20 SS de 1961 recopie la règle ; les articles 1er à 7 de
    la loi n° 71-1132, et les rédactions des articles 70 et 70-1 du décret de 1945 issues
    du décret n° 72-78 du 28 janvier 1972, que la circulaire Cnav n° 2/72 applique et
    dont l'index ne porte que l'article 72-1 (fiche `trimestres_retenus_1972_1974`) ; les
    rédactions des articles 70 et 71 du décret de 1945 issues des
    décrets n° 51-1321 et n° 56-144, qui touchent, selon les résumés de l'index JORF, à
    l'entrée en jouissance et à la détermination des droits (le Journal officiel du 20
    novembre 1951 manque à Gallica). Chez les salariés agricoles, les rédactions de
    l'article 8 du décret du 30 octobre 1935 de 1951 à 1972, et l'usage de la caisse
    centrale : celle du 6 juin 1951 ne majore « de 4 p. 100 par année postérieure à
    soixante ans » que « lorsque la liquidation en est demandée après soixante et un
    ans », sans dire si ces 4 p. 100 portent sur le salaire ou sur la pension ; et la date
    où les 25 % les ont atteints, que l'article 55 du décret n° 50-1225 ne porte qu'au 1er
    juillet 1972.
