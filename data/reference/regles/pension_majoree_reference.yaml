schema_version: 1
id: pension_majoree_reference
intitule: >-
  La pension de base des non-salariés agricoles liquidée au taux plein est portée à un
  montant minimum, la pension majorée de référence, au prorata de la durée d'assurance
  non salariée agricole sur la durée de la retraite forfaitaire, trente-sept ans et demi
  au moins ; de 2009 à 2021, un montant pour les périodes de qui a été chef
  d'exploitation dix-sept ans et demi, un autre, plus bas, sinon, et vingt-deux puis
  dix-sept ans et demi de durée exigés jusqu'en janvier 2014 ; un montant unique depuis
  2022, relevé au minimum contributif majoré, et de cent euros par mois pour les
  pensions de septembre 2023 ; la majoration est écrêtée de ce que toutes les pensions
  dépassent d'un plafond, celui de l'article L. 173-2 depuis 2026.
domaine: minima
regimes: [msa_non_salaries]
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- la pension de base des non-salariés agricoles, avant surcote et sans la majoration
  pour enfants, et le taux plein qui l'ouvre
- la durée d'assurance non salariée agricole, les trimestres pour enfants depuis 2026,
  et la durée de la retraite forfaitaire
- les montants de la PMR et du plafond en vigueur à la date d'effet
  (legislation/pension_majoree_reference.csv ; le plafond de l'article L. 173-2 depuis
  2026, legislation/minimum_contributif.csv)
- toutes les pensions et les majorations pour enfants, celles d'autres départs et les
  pensions étrangères, pour l'écrêtement
ecrit:
- ce que la majoration ajoute à la pension de base des non-salariés agricoles, après
  l'écrêtement
dates_qui_decident:
- liquidation.date_effet
versions:
- id: avant_la_pension_majoree
  statut: lue
  textes:
  - id: LEGIARTI000006585622
    article: L. 732-54-1 code rural
    en_vigueur: 2001-12-29
    citation: >-
      « Les chefs d'exploitation ou d'entreprise agricole dont la pension de retraite
      servie à titre personnel prend effet postérieurement au 31 décembre 1996 [...]
      peuvent bénéficier d'une majoration de leur pension de retraite proportionnelle.
      Cette majoration a pour objet de porter le montant de celle-ci à un minimum qui est
      fixé par décret »
    lu_le: 2026-10-07
  - id: LEGIARTI000006597537
    article: D. 732-113 code rural
    en_vigueur: 2005-04-22
    citation: >-
      « Le nombre minimal annuel moyen de points de retraite proportionnelle A est
      déterminé [...] selon la formule suivante : A = (MV 1 - AVTS) / 37,5 x VP »
    lu_le: 2026-10-07
  bornes:
    liquidation.date_effet: [null, 2009-01-01]
  contenu:
    droit: >-
      pas de pension majorée de référence : les plans de revalorisation de 1994 à 2002
      majoraient la retraite PROPORTIONNELLE en points — un minimum de points par année
      de chef d'exploitation, que le modèle sert depuis le 14 octobre 2026 (fiche
      majoration_retraite_proportionnelle), des points pour les années d'aide familial
      ou de conjoint, qu'il ne sert pas — ; et la PMR de 2009 a relevé aussi les
      pensions liquidées avant elle, ce que l'échéancier ne sert pas
    parametres:
      existe: false
      duree_minimale: null
      montant: null
      montant_reduit: null
      seuil_chef: null
      plafond: null
      majorations_de_duree: false
  exemples: aucun trouvé
- id: pmr_de_2009
  statut: lue
  textes:
  - id: LEGIARTI000019959465
    article: L. 732-54-1 code rural
    en_vigueur: 2008-12-19
    citation: >-
      « Peuvent bénéficier d'une majoration de la pension de retraite servie à titre
      personnel les personnes dont cette pension a pris effet : [...] 2° A compter du
      1er janvier 2002 lorsqu'elles justifient des conditions prévues par les articles
      L. 732-23 et L. 732-25 [...] pour ouvrir droit à une pension à taux plein [...] et
      qu'elles remplissent des conditions fixées par décret de durées minimales
      d'assurance » ; « ne peuvent bénéficier de la majoration que si elles ont fait
      valoir l'intégralité des droits »
    lu_le: 2026-10-07
  - id: LEGIARTI000019959460
    article: L. 732-54-2 code rural
    en_vigueur: 2008-12-19
    citation: >-
      « La majoration [...] a pour objet de porter le total des droits propres et
      dérivés servis à l'assuré par le régime [...] des personnes non salariées des
      professions agricoles à un montant minimum [...] différencié en fonction de la
      qualité de l'assuré »
    lu_le: 2026-10-07
  - id: LEGIARTI000019959457
    article: L. 732-54-3 code rural
    en_vigueur: 2008-12-19
