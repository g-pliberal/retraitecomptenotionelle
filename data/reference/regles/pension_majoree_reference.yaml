approximations:
- ecart: >-
    le statut se lit année par année : chef à titre principal quand la ligne du chef
    d'exploitation est l'activité principale de l'année, à titre secondaire quand une
    autre la précède ; conjoint collaborateur et aide familial sont un même statut, que
    la règle traite de même (D. 732-110, II, 4°) ; les périodes de collaborateur
    régularisées de 1999 à 2008, que le 3° range avec celles du chef, et celles de qui
    peut prétendre à une réversion, que le 2° y range aussi, reçoivent PMR2
  effet: non mesuré
- ecart: >-
    la réversion n'entre ni dans la pension comparée ni dans l'écrêtement : le modèle
    liquide la pension personnelle seule, et PMR1 n'est pas servie à la personne
    « susceptible de bénéficier d'une pension de réversion » qui n'a pas été chef
  effet: non mesuré
- ecart: >-
    la PMR attribuée le 1er janvier 2009 aux pensions liquidées avant elle (D. 732-109,
    1° et 2°) est servie depuis le 16 octobre 2026 : à l'échéance, la règle des pensions
    dues jusqu'à celle de 2022 — le montant et le plafond de septembre 2023 et de 2026
    ne nomment que les pensions prises depuis —, comparée à la pension de base surcote
    comprise et plans de 1997 à 2008 révisés compris (D. 732-112), écrêtée sur toutes
    les pensions de l'échéance ; le taux plein n'est demandé qu'aux pensions prises
    depuis 2002. La durée de chef d'une pension d'avant 1997, que D. 732-110, III,
    reconstitue des points d'avant 1994 divisés par seize, est celle de la carrière ; le
    complément différentiel du relèvement de septembre 2023 ne compte pas cette PMR
    dans les pensions agricoles qu'il plafonne
  effet: non mesuré, faible
- ecart: >-
    la majoration d'une pension liquidée depuis 2009 se calcule au départ et suit
    ensuite le coefficient de la pension : sa révision quand les ressources changent,
    et la PMR unique de 2022 servie aux pensions déjà liquidées au taux de PMR2
    (L. 732-54-2, « y compris aux pensions de retraite ayant pris effet avant cette
    date »), ne le sont pas
  effet: >-
    les conjoints collaborateurs partis de 2009 à 2021, et les pensions qu'une pension
    étrangère ou une seconde pension vient écrêter après le départ
- ecart: >-
    la durée de référence DR est la durée de proratisation de la retraite forfaitaire que
    le modèle lit, 150 trimestres au moins ; pour les générations 1944 à 1948, R. 732-61
    en fixe une plus courte, que le modèle ne lit pas non plus pour le forfait
  effet: non mesuré
- ecart: >-
    entre deux ancres, les montants sont ceux que la loi définit — l'ancre revalorisée
    par les coefficients de l'article L. 161-23-1, au centime inférieur, la tranche de
    2020 étant celle des petites pensions —, aucune caisse n'en publiant la série
  effet: >-
    au plus quelques centimes par revalorisation ; le plafond de juillet 2022 retrouve
    celui que la MSA publie, 11 441,49 €
sources:
  lu_le: 2026-10-16
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Chercher un exemple chiffré publié par la MSA (circulaire, fiche, simulateur) d'une
    pension portée à la PMR, et le rejouer dans exemples_officiels.yaml.
  - Relire les montants à chaque revalorisation de janvier.
  lectures:
  - type: legifrance
    reference: >-
      L. 732-54-1 à L. 732-54-4 du code rural (rédactions de 2002, 2008, 2014, 2022,
      2023 et 2026), D. 732-109 à D. 732-115 (2005, 2009, 2010, 2011, 2014, 2016, 2017,
      2022, 2023 et 2026), R. 732-61 (2017), D. 173-21-4 CSS, dans l'index LEGI du dépôt
      à jour au 6 octobre 2026
    date: 2026-10-07
  - type: jorf
    reference: >-
      décrets n° 2010-126 du 8 février 2010 (plafond de 9 600 €) et n° 2021-1919 du 30
      décembre 2021 (PMR unique au minimum contributif majoré, plafond à l'ASPA), dans
      l'index JORF du dépôt
    date: 2026-10-07
  - type: jorf
    reference: >-
      décret n° 2009-173 du 13 février 2009, article 1er (JORFARTI000020252116) : D. 732-109,
      « 1° Les personnes dont la pension de retraite servie à titre personnel a pris effet
      avant le 1er janvier 2002, qui justifient d'une durée d'assurance non salariée
      agricole [...] au moins égale à vingt-deux années et demie au 1er janvier 2009, puis
      à dix-sept années et demie au 1er janvier 2011 » ; D. 732-112, « Pour les personnes
      mentionnées aux 1° et 2° de l'article D. 732-109, les pensions de retraite et de
      réversion sont appréciées après mise en œuvre des revalorisations prévues aux
      articles D. 732-110 à D. 732-149 dans leur rédaction antérieure au 1er janvier 2009
      ou de la majoration de pension prévues à l'article L. 732-25-1 » ; D. 732-115, «
      s'appliquent aux pensions [...] dues à compter du 1er janvier 2009 » ; L. 732-54-1
      (LEGIARTI000019959465), loi n° 2008-1330, article 77, I, dans les index du dépôt
    date: 2026-10-16
  - type: autre
    reference: >-
      MSA, tableaux de bord « Les retraites du régime des non-salariés agricoles » d'août
      2023 et de mai 2024 : « Au 1er janvier 2022, le montant mensuel de la PMR maximum
      est relevé à 8 557,38 €/ an (713,11 €/mois) et le plafond des pensions [...] soit
      11 001,44 euros/an » ; « Au 1 er juillet 2022, le plafond des pensions augmente
      [...] et passe à 11 441,49 €/an (953,45 €/mois) »
    url: https://statistiques.msa.fr/wp-content/uploads/2024/05/TB-retraites-NSA-T4-2023-stock.pdf
    date: 2026-10-07
textes_a_rattacher:
- reference: L. 732-54-1 à L. 732-54-4 code rural
- reference: D. 732-109 à D. 732-115 code rural
code:
  python: >-
    scenarios/actuel.py : PensionMajoreeReference (regle, montant) ; droit/completer.py :
    pension_majoree, completer ; droit/liquider.py : EligibleAgricole ;
    revalorisation.py : reviser_les_exploitants
  javascript: >-
    moteur/js/regimes.js : PensionMajoreeReference ; moteur/js/droit/completer.js :
    pensionMajoree, completer ; moteur/js/droit/liquider.js ;
    moteur/js/revalorisation.js : reviserLesExploitants
  parametres: >-
    contenu.parametres de chaque version ; data/reference/legislation/pension_majoree_reference.csv,
    écrit par scripts/fetch/dila_legi_pension_majoree.py
  tests: >-
    tests/test_minima_agricoles.py, dans les deux moteurs
historique:
- >-
  2026-10-07 — servie, à l'étape 138.8 : déclarée depuis le 19 septembre 2026 dans six
  périodes de msa_non_salaries.yaml sans qu'aucun code la serve ; sept versions, de son
  absence avant 2009 au plafond de l'article L. 173-2 en 2026.
- >-
  2026-10-16 — étape 138.8 : servie aux pensions liquidées avant 2009, depuis le
  1er janvier 2009, à l'étape « faire vivre » (revalorisation.reviser_les_exploitants).
exemples: []
effet: >-
  Les petites pensions de base des chefs d'exploitation liquidées au taux plein depuis
  2009 : le moteur ne servait que le calcul contributif, forfait et points, souvent sous
  la PMR — un chef parti en 2019 avec 44 ans de carrière à faible revenu touchait
  6 892 € avant surcote, quand la PMR était de 8 273 €.
referents:
  calcul_pension:
    equivalent: >-
      R/fonctionsCalculsPensions.R : PMR1 au prorata de la durée sur la durée de
      proratisation, depuis 2009, PMR2 omise ; écrêtement à l'ASPA d'une personne seule
    confrontation: >-
      le dépôt écrête au plafond de D. 732-113, que le décret de 2021 n'a porté au niveau
      de l'ASPA qu'en 2022, et sert PMR2 au chef de moins de dix-sept ans et demi
  baremes_ipp:
    equivalent: parameters/retraites/independants/pmr_msa.yaml et pmr2_msa.yaml
    confrontation: >-
      les ancres de 2009, 2022 et 2023 concordent ; entre elles, l'IPP revalorise sur
      les prix et au 1er janvier, le dépôt par les coefficients de l'article L. 161-23-1
      à leurs dates : 8 388,94 € en 2021 au lieu de 8 515,89 €
