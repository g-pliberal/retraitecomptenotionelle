      1er janvier 2002 lorsqu'elles justifient des conditions prévues par les articles
      L. 732-23 et L. 732-25 [...] pour ouvrir droit à une pension à taux plein [...] et
      qu'elles remplissent des conditions fixées par décret de durées minimales
