      d'une durée d'assurance non salariée agricole exercée à titre exclusif ou
      principal, au moins égale à vingt-deux années et demie. Cette durée est fixée à
      dix-sept années et demie à compter du 1er janvier 2011 »
    lu_le: 2026-10-07
  - id: LEGIARTI000020254712
    article: D. 732-110 code rural
    en_vigueur: 2009-02-16
