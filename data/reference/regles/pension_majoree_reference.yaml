    lu_le: 2026-10-07
  bornes:
    liquidation.date_effet: [2009-01-01, 2011-01-01]
  contenu:
    droit: >-
      au taux plein et avec vingt-deux ans et demi d'assurance non salariée agricole, la
      pension de base, comparée avant surcote et sans la majoration pour enfants, est
      portée à (PMR1 × DM1 + PMR2 × DM2) / DR : DM1, les périodes de chef
      d'exploitation de qui l'a été dix-sept ans et demi, retenues en priorité ; DM2,
      celles du conjoint participant aux travaux ou collaborateur, de l'aide familial,
      et du chef qui ne l'a pas été dix-sept ans et demi ; DM1 + DM2 au plus DR, DR au
      moins 150 trimestres ; les périodes à titre secondaire n'y entrent pas ; la
      majoration est écrêtée de ce que toutes les pensions, majorations pour enfants
      comprises, dépassent du plafond
