approximations:
- ecart: >-
    le modèle ne connaît que le statut de chef d'exploitation, à titre principal : la
    durée d'assurance non salariée agricole est celle de chef, les périodes de conjoint,
    d'aide familial ou de collaborateur et celles d'activité secondaire n'y sont pas, et
    PMR2 ne sert qu'au chef qui n'a pas dix-sept ans et demi de cette qualité
  effet: non mesuré
- ecart: >-
    la réversion n'entre ni dans la pension comparée ni dans l'écrêtement : le modèle
    liquide la pension personnelle seule, et PMR1 n'est pas servie à la personne
    « susceptible de bénéficier d'une pension de réversion » qui n'a pas été chef
  effet: non mesuré
- ecart: >-
    la majoration se calcule au départ : sa révision quand les ressources changent, et
    la PMR attribuée en 2009 aux pensions liquidées avant elle, ne sont pas servies ;
    les majorations des plans de 1994 à 2002, avant 2009, non plus
  effet: >-
    les pensions agricoles liquidées avant 2009, et celles qu'une pension étrangère ou
    une seconde pension vient écrêter après le départ
- ecart: >-
    la durée de référence DR est la durée de proratisation de la retraite forfaitaire que
    le modèle lit, 150 trimestres au moins ; pour les générations 1944 à 1948, R. 732-61
    en fixe une plus courte, que le modèle ne lit pas non plus pour le forfait
  effet: non mesuré
- ecart: >-
    entre deux ancres, les montants sont ceux que la loi définit — l'ancre revalorisée
    par les coefficients de l'article L. 161-23-1, au centime inférieur, la tranche de
    2020 étant celle des petites pensions —, aucune caisse n'en publiant la série
  effet: >-
    au plus quelques centimes par revalorisation ; le plafond de juillet 2022 retrouve
    celui que la MSA publie, 11 441,49 €
sources:
