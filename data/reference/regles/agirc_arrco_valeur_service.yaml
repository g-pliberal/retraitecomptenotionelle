code:
  python: >-
    scenarios/actuel.py : ValeursPoint.service_au et ValeursPoint.millesime ;
    droit/liquider.py : valeur_du_point, qui reçoit la date d'effet ; revalorisation.py :
    PensionServie.coefficient, la valeur du jour aux deux bouts ; droit/completer.py :
    plafond_majoration ; droit/seconde.py : la seconde retraite
  javascript: >-
    moteur/js/regimes.js : ValeursPoint.serviceAu et ValeursPoint.millesime ;
    moteur/js/droit/liquider.js : valeurDuPoint ; moteur/js/revalorisation.js :
    PensionServie.coefficient ; moteur/js/droit/completer.js : plafondMajoration ;
    moteur/js/droit/seconde.js ; le paquet porte valeurs_service_datees
    (scripts/construire_donnees.py)
  parametres: >-
    regimes/valeurs_service_datees.csv : 268 valeurs datées, Agirc 1947-2018, UNIRS et
    Arrco 1961-2018, Agirc-Arrco 2019-2025 ; regimes/valeurs_point.csv au-delà
  tests: >-
    tests/test_revalorisation.py : test_la_liquidation_sert_la_valeur_du_point_du_jour,
    test_la_pension_menee_recoit_le_relevement_de_novembre,
    test_les_pensions_de_2018_passent_au_point_unifie_sans_changer ; tests/test_donnees.py :
    test_la_valeur_datee_du_31_decembre_est_celle_de_l_annee ; tests/test_oracle.py :
    l'exemple agirc_arrco_drj_2020_02_valeur_du_1er_janvier_2019, et OpenFisca au
    1er janvier ; tests/test_trajectoire.py et tests/test_destinie.py ; les témoins de
    simulation, que le portage rejoue
referents:
  trajectoire:
    equivalent: table valeur_service datée au mois (parametres_trajectoire.valeur_service)
    confrontation: >-
      le 5 octobre 2026, TRAJECTOiRE exécuté à part (tests/test_trajectoire.py) : il
      servait déjà la valeur du mois du départ, et le dépôt la sert désormais ; les
      valeurs du point concordent, hors ses valeurs projetées au-delà de 2023
  destinie_2:
    equivalent: série annuelle des valeurs de service (ParamRetrComp)
    confrontation: >-
      Destinie sert la valeur du 31 décembre de l'année du départ : 1,2588 € à l'Arrco
      pour un départ de février 2018, quand la caisse et le dépôt servent 1,2513 € ;
      l'écart est le sien (tests/test_destinie.py, VALEUR_DU_JOUR)
  openfisca_france_pension:
    equivalent: valeur du point lue au 1er janvier de la liquidation
    confrontation: >-
      les valeurs de l'Arrco et de l'Agirc qu'il lit au 1er janvier de la liquidation sont
      celles que le dépôt sert à ce jour-là (tests/test_oracle.py)
historique:
- >-
  Jusqu'au 5 octobre 2026, le scénario 1 servait à la liquidation la valeur de service du
  31 décembre de l'année, la seule que valeurs_point.csv portait : à tout départ antérieur
  au relèvement de l'année, le relèvement par avance. TRAJECTOiRE, exécuté à part, l'a
  montré (action 142, étape 4) ; l'étape 20 de l'action 138 l'a corrigé, dans les deux
  moteurs, avec la date de chaque valeur depuis 1947.
effet: >-
  Tout départ antérieur au relèvement de son année : la complémentaire baisse de 4,87 %
  pour un départ de janvier à octobre 2022, de 4,67 % avant novembre 2023, de 1,58 % avant
  novembre 2024, de 0,60 % de janvier à octobre 2018, jusqu'à 12,5 % à l'UNIRS en août
  1974 ; tout départ futur antérieur au 1er novembre perd la revalorisation projetée de
  l'année, 1,72 %. Sur 735 témoins de simulation, 251 baissent au scénario 1, de 0,44 % en
  médiane de la pension totale, de 2,18 % au plus. La pension d'aujourd'hui de qui est
  déjà parti ne bouge pas : elle ne tient qu'à ses points et à la valeur de l'échéance.
