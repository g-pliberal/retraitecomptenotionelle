schema_version: 1
id: agirc_arrco_valeur_service
intitule: >-
  La retraite complémentaire du secteur privé se liquide à la valeur de service du point
  en vigueur à sa date d'effet, non à celle du 31 décembre de l'année, puis suit chacun
  de ses relèvements : au 1er novembre à l'Agirc-Arrco, comme à l'Agirc et à l'Arrco
  depuis 2016 ; au 1er avril, au 1er janvier, au 1er juillet ou au 1er octobre avant.
domaine: points
regimes: [agirc_arrco, arrco, agirc, unirs]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- la date d'effet de la pension, au mois, et celle de l'échéance qu'on lui fait atteindre
- les valeurs de service datées au jour de leur effet (regimes/valeurs_service_datees.csv)
- les valeurs de service du 31 décembre (regimes/valeurs_point.csv), au-delà de la dernière
  décision datée
- les coefficients de fusion des points (regimes/conversions_points.csv)
ecrit:
- la valeur de service qui sert les points à la liquidation
- le coefficient qui mène la pension de sa date d'effet à une échéance, relèvement après
  relèvement
dates_qui_decident:
- liquidation.date_effet
- pension.echeance
versions:
- id: avant_le_regime_unifie
  statut: lue
  textes:
  - reference: >-
      fédération Agirc-Arrco, « Valeurs de service du point et salaires de référence /
      valeurs d'achat du point — Historique », compilation au 1er novembre 2025 (hors JORF)
    article: tables « Agirc », « Arrco » et « Unirs », « Valeurs de point et salaires de référence »
    en_vigueur: 1947-01-01
    citation: >-
      Une ou deux valeurs du point par année, chacune dans la colonne de sa date : « au
      1er janvier », « au 1er avril », « au 1er juillet », « au 1er octobre », « au 1er
      novembre » ; « Conformément aux dispositions de l'accord signé par les partenaires
