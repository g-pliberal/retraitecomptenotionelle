  contenu:
    droit: >-
      la valeur de service en vigueur à la date d'effet, que la compilation de la
      fédération date : à l'Agirc, au 1er janvier et au 1er juillet jusqu'en 1989 (au
      1er octobre en 1948), au 1er janvier de 1990 à 2000, au 1er avril de 2001 à 2015, au
      1er novembre de 2016 à 2018 ; à l'Arrco unifiée, au 1er janvier 1999 puis au 1er
      avril jusqu'en 2015 et au 1er novembre de 2016 à 2018 ; à l'UNIRS, qui tient lieu de
      l'Arrco avant 1999, aux deux dates que chaque année imprime ; puis chaque relèvement
