    lu_le: 2026-10-05
    empreinte: sha256:b8af8df7372e4f897c1ca0c4fd9bf4baaa5b706ec4737b8e51b593c5a2a4fccb
  - reference: >-
      accord national interprofessionnel du 17 novembre 2017 instituant le régime
      Agirc-Arrco ; copie de la fédération (hors JORF)
    article: article 92, « Calcul de l'allocation »
    en_vigueur: 2019-01-01
    citation: >-
      « L'allocation est calculée en multipliant le nombre de points inscrits au compte du
