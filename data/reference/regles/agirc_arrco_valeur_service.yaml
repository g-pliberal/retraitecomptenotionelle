    lu_le: 2026-10-05
    empreinte: sha256:b8af8df7372e4f897c1ca0c4fd9bf4baaa5b706ec4737b8e51b593c5a2a4fccb
  - reference: >-
      circulaire Agirc-Arrco 2020-02-DRJ du 20 janvier 2020, « Régime Agirc-Arrco –
      Réglementation applicable aux individus » (hors JORF)
    article: fiche 4, « Calcul des droits à la retraite », I ; fiche 1, I.2
    en_vigueur: 2019-01-01
    citation: >-
      « l'allocation de retraite complémentaire Agirc-Arrco est calculée en multipliant le
      nombre de points Agirc-Arrco inscrits au compte du participant, à la date de la
      liquidation de ses droits, par la valeur de service du point de retraite du régime
      à cette même date » ; « La revalorisation, si elle a lieu, prend effet au 1er
      novembre de l'année » ; la pension servie avant le 1er janvier 2019 devient des
      points « en divisant son montant par la valeur de service du point du régime au 1er
