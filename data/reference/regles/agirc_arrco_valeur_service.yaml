    lu_le: 2026-10-05
    empreinte: sha256:524779881a0e4e377382f4b3d8ab9cf0ebd4aa21fe2eca841dd523491f4806ae
  bornes:
    liquidation.date_effet: [2019-01-01, null]
  contenu:
    droit: >-
      la valeur de service en vigueur à la date d'effet : 1,2588 € au 1er janvier 2019, la
      valeur de l'Arrco, que le point Agirc converti retrouve (0,4378 €), puis celle que
