  exemples: [agirc_arrco_drj_2020_02_valeur_du_1er_janvier_2019]
approximations:
- version: avant_le_regime_unifie
  regime: unirs
  ecart: >-
    L'UNIRS imprime, pour chaque année, la valeur en vigueur à deux dates que le document
    change d'une période à l'autre (le 1er janvier et le 1er octobre, le 1er avril et le
    1er octobre, le 1er janvier et le 1er avril…), sans dire le jour d'une hausse
    survenue entre elles : la table la date à la colonne qui la montre. Le même partage
    vaut pour l'Arrco d'avant 1999, que l'UNIRS remplace au niveau moyenne.
  effet: non mesuré ; la valeur du 31 décembre de chaque année est celle que la fédération certifie
