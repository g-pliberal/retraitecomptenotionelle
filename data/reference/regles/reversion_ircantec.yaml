schema_version: 1
id: reversion_ircantec
intitule: >-
  Allocation de réversion de l'Ircantec (arrêté du 30 décembre 1970, articles 20 à 25) :
  la moitié des points de l'agent décédé, sans son coefficient d'anticipation, à partir
  de cinquante ans, ou dès le décès avec deux enfants de moins de vingt et un ans à
  charge, sous condition de durée ou d'antériorité du mariage ; supprimée au remariage.
domaine: reversion
regimes:
- ircantec
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- conjoint.deces
- union.debut, d'un mariage, la naissance de l'agent et la cessation de ses fonctions,
  pour la condition de durée ou d'antériorité du mariage
- union.fin, pour l'ex-conjoint divorcé, et une nouvelle union du survivant, qui éteint
  le droit
- la naissance du survivant, qui dit son âge, et les enfants de moins de vingt et un ans
  à sa charge, qui le lèvent
- les enfants issus du mariage
- les points de l'agent décédé
ecrit:
- l'allocation de réversion du survivant, en points de l'agent décédé
dates_qui_decident:
- conjoint.deces
# Les versions forment un partage de la date du décès (§ 4.1). L'arrêté du 26
# décembre 2003 applique sa rédaction aux « décès qui interviennent à compter
# du 1er janvier 2004 » ; les rédactions de 1976, 1980 et 1994 sont prêtées de
# même aux décès qui les suivent. Celles de 2018 et de 2024 de l'article 20
# (une numérotation, puis les droits de l'article 14) ne changent pas ce que le
# moteur calcule. `deux_enfants_sans_age` dit quels survivants deux enfants
# dispensent de l'âge : la veuve seule avant 2004, le conjoint depuis.
versions:
- id: veuves_1971
  statut: lue
  textes:
  - {id: LEGIARTI000006381623, article: "arrêté du 30 décembre 1970, article 20", en_vigueur: 1971-02-09}
  - {id: LEGIARTI000006381628, article: "arrêté du 30 décembre 1970, article 21", en_vigueur: 1971-02-09}
  - {id: LEGIARTI000006368133, article: "décret n° 70-1277, article 11", en_vigueur: 1970-12-30}
  nee_de: LEGIARTI000006381623
  bornes:
    conjoint.deces: [null, 1976-01-03]
  contenu:
    droit: >-
      une allocation calculée sur la moitié des points du défunt, sans son coefficient
      d'anticipation, sans pouvoir dépasser ses points affectés de ce coefficient
    beneficiaire: la veuve non remariée, à cinquante ans ; le veuf n'a pas de droit
    conditions: >-
      un mariage contracté deux ans au moins avant que le mari ait atteint cinquante-cinq
      ans ou cessé ses fonctions, ou qui a duré quatre ans ; dès le décès, à tout âge,
      avec deux enfants mineurs à charge, jusqu'à la majorité du dernier
    parametres:
      taux: 0.50
      beneficiaire: veuve
      age_minimum: null
      age_minimum_veuve: 50
      age_minimum_veuf: null
      mariage_minimum_annees: 4
      mariage_avant_annees: 2
      mariage_avant_age: 55
      mariage_leve_par_enfant: false
      deux_enfants_sans_age: [F]
      deux_enfants_moins_de_ans: 21
      rien_apres_un_capital: true
      perte_au_remariage: true
      fiabilite: haute
  exemples: aucun trouvé
