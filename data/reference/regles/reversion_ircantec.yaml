  nee_de: LEGIARTI000006381624
  bornes:
    conjoint.deces: [1976-01-03, 1980-03-18]
  contenu:
    droit: >-
      la version veuves_1971 ; le veuf non remarié reçoit à soixante ans la moitié des
      points de la défunte, dans la limite de 26 000 points
    beneficiaire: la veuve à cinquante ans, le veuf à soixante ans
    conditions: >-
      celles de veuves_1971 ; deux enfants de moins de vingt et un ans à charge, depuis
      le 23 mars 1978, dispensent la veuve de l'âge
    parametres:
      taux: 0.50
      beneficiaire: conjoint
      age_minimum: null
      age_minimum_veuve: 50
      age_minimum_veuf: 60
      mariage_minimum_annees: 4
      mariage_avant_annees: 2
      mariage_avant_age: 55
      mariage_leve_par_enfant: false
      deux_enfants_sans_age: [F]
      deux_enfants_moins_de_ans: 21
      rien_apres_un_capital: true
      perte_au_remariage: true
      fiabilite: haute
  exemples: aucun trouvé
- id: divorces_1980
  statut: lue
  textes:
  - {id: LEGIARTI000006381625, article: "arrêté du 30 décembre 1970, article 20", en_vigueur: 1980-03-18}
  - {id: LEGIARTI000006381630, article: "arrêté du 30 décembre 1970, article 21", en_vigueur: 1980-03-18}
  nee_de: LEGIARTI000006381625
  bornes:
    conjoint.deces: [1980-03-18, 1994-01-06]
  contenu:
    droit: >-
      la version veufs_1976, sans le coefficient d'anticipation pour le veuf aussi ;
      l'ancien conjoint divorcé non remarié y a droit aux mêmes âges, et l'allocation se
      partage entre les conjoints au prorata de la durée de chaque mariage
    beneficiaire: la veuve et l'ancienne épouse à cinquante ans, le veuf à soixante ans
    conditions: >-
      quatre ans de mariage, ou un mariage contracté deux ans au moins avant les
      cinquante-cinq ans de l'agent ou la cessation de ses fonctions ; deux enfants de
      moins de vingt et un ans à charge dispensent la veuve ou l'ancienne épouse de l'âge
    parametres:
      taux: 0.50
      beneficiaire: conjoint
      age_minimum: null
      age_minimum_veuve: 50
      age_minimum_veuf: 60
      mariage_minimum_annees: 4
      mariage_avant_annees: 2
      mariage_avant_age: 55
      mariage_leve_par_enfant: false
      deux_enfants_sans_age: [F]
      deux_enfants_moins_de_ans: 21
      rien_apres_un_capital: true
      perte_au_remariage: true
      fiabilite: haute
  exemples: aucun trouvé
- id: enfant_1994
  statut: lue
  textes:
  - {id: LEGIARTI000006381626, article: "arrêté du 30 décembre 1970, article 20", en_vigueur: 1994-01-06}
  nee_de: LEGIARTI000006381626
  bornes:
    conjoint.deces: [1994-01-06, 2004-01-01]
  contenu:
    droit: >-
      la version divorces_1980 ; le veuf titulaire d'une pension d'invalidité d'un régime
