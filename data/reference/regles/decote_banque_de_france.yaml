approximations:
- version: [tableau_par_periode_de_liquidation, tableau_par_periode_de_naissance]
  ecart: >-
    la saisie ne dit ni le niveau de l'agent ni sa catégorie : le modèle prend la colonne
    de droit commun. Ne sont pas servis l'âge des agents dont le droit s'ouvre à 55 ans
    (vingt trimestres de moins), celui des personnels de direction du quatrième au
    septième degré nés avant 1956, ni l'exemption du c de l'article 32, depuis le 9 mai
    2012, pour l'agent d'au moins soixante-cinq ans qui a élevé un enfant handicapé
  effet: non mesuré
effet: >-
  Le dépôt opposait à l'agent le barème de l'article L. 14 du code des pensions, lu à
  l'année où son droit s'ouvre : en avance de trois ans sur le règlement, et sur une
  limite d'âge de 65 puis 67 ans au lieu de celle du statut. Un agent né en janvier 1948
  parti à 60 ans avec cinq trimestres manquants perdait 1,875 % de sa pension : il n'en
  perd rien. Né en janvier 1949 et parti à 60 ans, il perdait 0,5 % par trimestre sur
  sept trimestres, 3,5 % : il perd 0,125 % sur quatre, 0,5 %. Né en janvier 1958 et
  parti à 62 ans avec dix-neuf trimestres manquants, il perdait 23,75 % : il en perd
  15 %, sa décote s'annulant à 65 ans et non à 67.
