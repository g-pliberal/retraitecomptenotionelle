    droit: >-
      article 32 : « Sous réserve des dispositions transitoires de l'article 70, […] un
      coefficient de minoration calculé sur la base de 1,25 % par trimestre manquant
      s'applique au montant de la pension […] dans la limite de vingt trimestres », les
      trimestres manquants étant le plus petit de ceux qui séparent « l'âge auquel la
      pension est liquidée de la limite d'âge du grade » et de ceux qui manquent à la
      durée ; article 70 : « Jusqu'au 30 juin 2022, sont fixés comme indiqué dans le
      tableau suivant : 1° Le taux du coefficient de minoration, par dérogation aux
      dispositions de l'article 32 ; 2° L'âge auquel s'annule le coefficient de
      minoration », par « période au cours de laquelle l'agent est susceptible de liquider
      sa pension (art. 26) » : « Jusqu'au 31 décembre 2008. Sans objet » ; « Du 1er
      janvier 2009 au 30 juin 2009. 0,125 % 61 ans 56 ans » ; par semestre jusqu'au
      « 1er janvier 2018 au 30 juin 2018. 1,250 % 63 ans et 3 trimestres », puis par an
      jusqu'au « 1er juillet 2021 au 30 juin 2022. 1,250 % 64 ans et 3 trimestres 59 ans
      et 3 trimestres » ; la dernière colonne vaut « pour les agents dont les droits sont
      ouverts à l'âge de 55 ans »
    conditions: >-
      la ligne se lit au mois où l'agent atteint l'âge d'ouverture de son droit, au plus
      tard à son départ : qui pouvait partir en 2008 n'a pas de décote, même parti en
      2010. Le tableau écrit « 58 ans et 3 trimestres » à la colonne des agents à 55 ans
      du premier semestre 2014, entre 57 ans et 3 trimestres et 58 ans : transcrit tel
      quel, et hors d'atteinte, la version s'arrêtant au 8 mai 2012. Au-delà du 30 juin
      2022, l'article 32 seul
