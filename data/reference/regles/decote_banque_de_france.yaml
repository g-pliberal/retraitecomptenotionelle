schema_version: 1
id: decote_banque_de_france
intitule: >-
  La décote de l'agent titulaire de la Banque de France est celle de son règlement :
  aucune à l'agent susceptible de liquider sa pension jusqu'au 31 décembre 2008 ; puis
  un taux par trimestre manquant qui monte de 0,125 % en 2009 à 1,25 % en 2018, et un
  âge d'annulation qui monte de 61 ans à la limite d'âge (article 70 du règlement
  annexé au décret n° 2007-262) ; depuis le 9 mai 2012, le tableau se lit à la période
  de naissance, pour les agents nés avant 1963, l'âge étant la limite d'âge du statut
  diminuée d'un à sept trimestres ; aux autres, 1,25 % jusqu'à la limite d'âge
  (article 32).
domaine: decote_surcote
regimes: [banque_de_france]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  la date d'effet de la pension, qui choisit le tableau : celui de 2007, par période, ou
  celui de 2012, par naissance
- >-
  le mois où l'agent est susceptible de liquider sa pension, celui où il atteint l'âge
  d'ouverture de son droit, ou son départ s'il part plus tôt (tableau de 2007)
- sa date de naissance (tableau de 2012)
- >-
  la limite d'âge que le statut du personnel écrit pour sa période de naissance, colonne
  « Limite d'âge » (`limite_age_banque_de_france`)
ecrit:
- >-
  le taux du coefficient de minoration par trimestre manquant, et l'âge auquel il
  s'annule, d'où se comptent les trimestres manquants par l'âge (1° de l'article 32)
dates_qui_decident:
- liquidation.date_effet
