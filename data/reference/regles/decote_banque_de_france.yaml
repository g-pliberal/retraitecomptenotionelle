      d'âge », par « période de naissance » : « Jusqu'au 2e semestre 1948 Sans objet » ;
      « 1er semestre 1949 0,125 % Lim. âge - 3 trimestres » ; « 1er semestre 1952 0,500 %
      Lim. âge - 4 trimestres » ; « 1er semestre 1955 0,875 % Lim. âge - 7 trimestres » ;
      « 1er semestre 1958 1,250 % Lim. âge - 5 trimestres » ; jusqu'au « 1er semestre
      1962 1,250 % Lim. âge - 1 trimestre ». « Pour les agents appartenant à une des
      catégories visées au quatrième alinéa de l'article 26, l'âge visé au 2° est minoré
      de 20 trimestres. » Un second tableau donne leur âge aux « personnels de direction
      à partir du quatrième degré nés avant le 1er janvier 1956 ». Aux agents nés depuis
