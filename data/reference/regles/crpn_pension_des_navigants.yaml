  nee_de: LEGIARTI000006845207
  bornes:
    liquidation.date_effet: [1995-07-01, 2012-01-01]
  contenu:
    ouverture: >-
      la durée du taux plein suit la réserve du régime, N, la valeur du fonds en années
      de prestations : dès cinquante ans, « 25, lorsque N est supérieur ou égal à 7 ;
      (32 - N), lorsque N est supérieur à 2 et inférieur à 7 ; 30, lorsque N est
      inférieur ou égal à 2 » (R. 426-11-1) ; la pension proportionnelle demande quinze
      ans d'affiliation et (75 - âge) annuités si N ≥ 7, (82 - N) - âge sinon
      (R. 426-11-2), ou s'ouvre à soixante ans sans condition (R. 426-11-3)
    anticipation: >-
      la pension à taux plein dès quarante-cinq ans, aux coefficients de 0,65 à 0,95
      (R. 426-18) ; la pension proportionnelle dès cinquante ans, à un coefficient
      actuariel compris entre 0,6 et 1 qui dépend de N et du temps validé (R. 426-18-1),
      sauf aux navigants nés avant 1955 qu'il exonère
    calcul: >-
      vingt-cinq annuités au plus, 1,85 % et 1,4 %, multipliées depuis 1995 par
      « l'indice de variation des salaires corrigé applicable à la date de liquidation »
      (R. 426-16-1), sur le salaire moyen des vingt-cinq meilleures annuités (R. 426-5, c)
    majorations: >-
      trois enfants : 2,5 % de la première tranche jusqu'en 2004, puis « 0,12 % du
      plafond mensuel [...] pour toute annuité validée dans la limite de 25 » ; de l'âge
      d'ouverture à soixante ans, une majoration mensuelle de 1,21 pour dix mille de huit
      plafonds par annuité, puis, depuis 2005, de 0,8 % du plafond mensuel par annuité,
      vingt-cinq au plus, davantage pour qui n'a pas d'assurance maladie (R. 426-16-1)
    cotisation: >-
      le taux d'appel vaut 118 - 3 N, à 1,5 point près (R. 426-8, 1995), puis 125 - 4 N
      + E, E entre - 1,5 et + 1,5 (2005), N étant lu à l'avant-dernier exercice
  exemples: aucun trouvé
