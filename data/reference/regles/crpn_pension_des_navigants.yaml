  nee_de: LEGIARTI000044496243
  bornes:
    liquidation.date_effet: [2022-01-01, 2027-01-01]
  contenu:
    ouverture: >-
      cinquante ans et vingt annuités, ou l'âge de R. 6527-23 sans condition de durée
      (R. 6527-21) ; « La pension est dite à taux plein si l'affilié justifie [...]
      d'au moins trente annuités [...]. Lorsque l'affilié n'atteint pas cette durée,
      une décote égale à 5 % par annuité manquante est appliquée », les annuités
      manquantes se comptant en jours validés divisés par 360 (R. 6527-22) ; aucune
      décote à soixante ans (R. 6527-23), ni pour l'inapte permanent de cinquante ans
      et vingt annuités, l'invalide ou l'accidenté du service aérien (R. 6527-24), ni
      pour le licencié économique à la fin de ses allocations de chômage (R. 6527-27) ;
      les nés avant 1971 partis à cinquante-cinq ans ou plus ont le taux plein avec 21
      annuités jusqu'à la génération 1962, une de plus par génération ensuite (décret
      n° 2011-1500, article 26, III)
    calcul: >-
      la pension se calcule sur le salaire moyen indexé de carrière (R. 6527-34), la
      moyenne des salaires plafonnés divisés par l'indice corrigé de variation des
      salaires, réduite aux « vingt-cinq meilleures annuités » quand l'affilié en a plus
      (R. 6527-36), ou sur un salaire moyen indexé majoré pour les services de guerre
      et militaires (R. 6527-40, formule et tableau publiés en image) ; « un taux de
      pension égal à 1,85 % pour la première tranche et à 1,4 % pour la seconde » par
      annuité validée à titre onéreux, « dans la limite d'une durée égale à la valeur «
      a » [...] divisée par 360 », la somme étant « multipliée par l'indice corrigé de
      variation des salaires [...] applicable à la date de liquidation » (R. 6527-43),
      les tranches s'arrêtant à quatre et huit plafonds de l'exercice (R. 6527-44)
    majorations: >-
      trois enfants : « 0,12 % du montant du plafond mensuel [...] pour toute annuité
      validée à titre onéreux dans la limite de 25 » (R. 6527-45) ; de l'âge auquel
      l'affilié a ses annuités, cinquante-cinq ans au plus tôt, à l'âge légal de
      L. 161-17-2, une majoration de « 0,8 % du plafond mensuel [...] par annuité
      validée à titre onéreux dans la limite de vingt-cinq » si la pension est sans
      décote, doublée de soixante-deux ans à l'âge légal, sans dépasser 40 % du plafond
      mensuel, pour qui a la durée d'assurance du taux plein et n'est pas en carrière
      longue (R. 6527-46, depuis le 22 novembre 2023) ; et, depuis la même date, une
      prestation de la moitié du salaire mensuel moyen des trente-six derniers mois,
      dans la limite de la moitié du plafond mensuel, au navigant sorti à soixante ans
      dont le chômage a pris fin, jusqu'au taux plein du régime général (R. 6527-46-1)
    minimum: >-
      avec vingt-cinq annuités cotisées ou rachetées, pas moins de « 795 euros par
      annuité » avant décote, revalorisés comme l'indice corrigé depuis 2020
      (R. 6527-47) ; un capital unique sous 2 % du plafond mensuel (R. 6527-68)
    service: >-
      revalorisation au 1er janvier comme les prix hors tabac de novembre à novembre
      (R. 6527-48) ; réversion de 60 % au conjoint (R. 6527-52), orphelins à 12 %,
      50 % ou 72 % (R. 6527-60)
    cotisation: >-
      7,668 % et 13,632 % jusqu'à huit plafonds (D. 6527-12, D. 6527-13), appelés à
      105 % depuis 2016 (D. 6527-14) et « à 111 % » depuis l'exercice 2024 (D. 6527-15)
  exemples: aucun trouvé
