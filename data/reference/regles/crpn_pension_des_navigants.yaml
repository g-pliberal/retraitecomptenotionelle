- version: [vingt_cinq_annuites, valeur_n_du_fonds, decote_age_et_duree, trente_annuites_duree_seule, jours_cotises_2027]
  ecart: >-
    La fiche de régime calcule sur la carrière entière (`salaire_reference:
    carriere_entiere`), quand le droit ne retient que les vingt-cinq meilleures annuités
    de qui en compte plus (R. 426-5, c, puis R. 6527-36), et le revalorise par l'indice
    du modèle, non par l'indice corrigé de variation des salaires de la caisse, qui
    n'est publié que par ses notices.
  effet: >-
    non mesuré ; les navigants de plus de vingt-cinq annuités, dont les années faibles
    de début de carrière abaissent la pension simulée
- version: [vingt_cinq_annuites, valeur_n_du_fonds, decote_age_et_duree, trente_annuites_duree_seule]
  ecart: >-
    Aucune majoration n'est portée : ni celle de trois enfants (2,5 % de la première
    tranche, puis 0,12 % du plafond mensuel par annuité, vingt-cinq au plus), ni la
    majoration temporaire de l'âge d'ouverture à soixante ans puis à l'âge légal (1 %
    du plafond par année jusqu'en 1995, 0,8 % du plafond mensuel par annuité depuis
    2005, doublée de soixante-deux ans à l'âge légal depuis le 22 novembre 2023), ni
    la prestation de R. 6527-46-1, ni le minimum de 795 € par annuité.
  effet: >-
    non mesuré ; la majoration temporaire vaut, pour vingt-cinq annuités, 20 % du
    plafond mensuel par mois, soit 9 612 € par an au plafond de 2026 (4 005 €), servis
    de cinquante-cinq ans à l'âge légal : la pension d'un pilote parti à cinquante-cinq
    ans est sous-estimée, sur ces années, de près de dix mille euros par an
- version: [vingt_cinq_annuites, valeur_n_du_fonds]
  ecart: >-
    Avant 2012, la fiche de régime porte vingt-cinq annuités et cinquante ans, sans
    coefficient : ni la liquidation dès quarante-cinq ans aux coefficients de 0,65 à
    0,95, ni, de 1995 à 2011, la durée du taux plein qui monte de 25 à 30 annuités quand
    la réserve N descend sous sept ans, ni la pension proportionnelle et son
    coefficient actuariel, ni le seuil d'heures de vol qui fait l'annuité.
  effet: non mesuré ; les navigants partis avant 2012
- version: [decote_age_et_duree, trente_annuites_duree_seule]
  ecart: >-
    Le taux d'appel de 2024 et de 2025 est écrit : « A compter de l'exercice 2024, le
    taux d'appel est fixé à 111 % » (R. 426-8 dans la rédaction du décret n° 2021-570,
    lue ; D. 6527-15) ; la fiche de régime garde 105 % jusqu'en 2025 et sa ligne
    d'inventaire disait ces deux taux non publiés. Ceux de 2017 à 2023, de 105 % à
    110 % selon la réserve et le conseil, restent à lire dans les notices de la caisse.
  effet: >-
    sur la cotisation et le compte notionnel qu'elle alimente, non sur la pension : 6 %
    de cotisation en moins en 2024 et 2025 (22,37 % au lieu de 23,64 %)
- version: [decote_age_et_duree, trente_annuites_duree_seule, jours_cotises_2027]
  ecart: >-
    La durée qui borne les annuités suit la valeur « a » du tableau de R. 6527-40, puis
    les jours cotisés depuis 2027 ; la fiche de régime la tient pour trente annuités
    dès 2012, et compte au trimestre ce que la caisse compte au jour (jours validés
    divisés par 360).
  effet: non mesuré ; les navigants de plus de vingt-cinq annuités partis de 2012 à 2026
sources:
