    date: 2026-10-14
reformes: [navigants_2012, navigants_2022]
code:
  moteur: >-
    les deux tranches sont deux fiches de régime, parce que la liquidation ne retient
    qu'une période active par régime ; `decote_par_la_duree_seule` (decote_crpn) et la
    table `crpn_2022` portent la version trente_annuites_duree_seule Ses données : des
    périodes en annuités, 1963, 1995, 2012, 2016, 2022 et 2026 ; trimestres_de_decote
    compte la décote à la durée seule.
  python: >-
    donnees/regimes.py : CatalogueRegimes ; droit/liquider.py : liquider_chaque_regime,
    trimestres_de_decote
  javascript: >-
    moteur/js/regimes.js : CatalogueRegimes ; moteur/js/droit/liquider.js :
    liquiderChaqueRegime, trimestresDeDecote
  parametres: >-
    regimes/crpnpac.yaml, regimes/crpnpac_tranche_2.yaml : taux_plein,
    duree_requise_trimestres, taux_cotisation_retraite, decote_par_trimestre,
    decote_par_la_duree_seule
  tests: >-
    tests/temoins/simulations.json, les carrières du statut personnel_navigant, que le
    portage rejoue
historique:
- >-
  2026-10-14 — écrite à l'étape 2 de l'action 145 : la caisse des navigants n'avait que
  la fiche générique de liquidation. Les articles R. 426 du code de l'aviation civile
  et R. et D. 6527 du code des transports, lus dans toutes leurs rédactions, ajoutent
  ce que les fiches de régime ne portent pas — les vingt-cinq meilleures annuités, la
  majoration temporaire, celle des enfants, le minimum, la durée liée à la réserve de
  1995 à 2011 — et montrent que le taux d'appel de 111 % est écrit pour 2024 et 2025.
  Aucun chiffre ne change.
effet: >-
  Les navigants de l'aéronautique civile : leur pension de la caisse est simulée sans
  la majoration temporaire de cinquante-cinq ans à l'âge légal, ni celle des enfants,
  ni le minimum, et sur la carrière entière plutôt que les vingt-cinq meilleures
  annuités.
