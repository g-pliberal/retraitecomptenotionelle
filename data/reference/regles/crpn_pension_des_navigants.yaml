  contenu:
    ouverture: >-
      la pension est servie à qui a « atteint l'âge de cinquante ans » et justifie de
      « vingt annuités », condition levée à l'âge de R. 426-12 ; elle est « à taux
      plein » si l'affilié a cinquante-cinq ans ou trente annuités et si « la somme de
      l'âge et du nombre d'annuités [...] est supérieure ou égale à 80 », et sinon
      décotée de « 5 % par année manquante » (R. 426-11) ; aucune décote à l'âge du
      premier alinéa de L. 6521-4 du code des transports, soixante ans (R. 426-12)
    calcul: >-
      1,85 % et 1,4 %, pour toute annuité validée à titre onéreux « dans la limite
      d'une durée » égale à « a »/360, « a » montant année après année vers trente
      annuités (R. 426-5, d ; R. 426-16-1) ; tranches à quatre et huit plafonds
      (R. 426-16-1-1)
    majorations: >-
      trois enfants : 0,12 % du plafond mensuel par annuité, vingt-cinq au plus ; de
      l'âge d'ouverture, cinquante-cinq ans au plus tôt, à l'âge légal de L. 161-17-2,
      une majoration mensuelle de 0,8 % du plafond mensuel par annuité, vingt-cinq au
      plus, si la pension est sans décote, sans la distinction de l'assurance maladie
      depuis le 7 mai 2018 (R. 426-16-1)
    minimum: >-
      avec vingt-cinq annuités cotisées ou rachetées, la pension avant décote ne peut
      être inférieure à 2 % du plafond annuel par annuité (R. 426-16-3, 2012), puis à «
      795 € par annuité », revalorisés depuis 2020 comme l'indice corrigé (2019)
    cotisation: >-
      7,668 % pour l'affilié et 13,632 % pour l'employeur, appelés à 101 % en 2012, un
      point de plus chaque année jusqu'à 105 % en 2016 ; de 2016 à 2023, un demi-point
      de plus l'année suivante si le fonds, à trente ans, tombe sous cinq années de
      prestations, et un demi-point au choix du conseil, sans dépasser 110 % ; « A
      compter de l'exercice 2024, le taux d'appel est fixé à 111 % » (R. 426-8, rédaction
      du décret n° 2021-570)
  exemples: aucun trouvé
