    reference: >-
      code de l'aviation civile, R. 426-5, R. 426-8, R. 426-11 à R. 426-12, R. 426-15-1,
      R. 426-16-1, R. 426-16-1-1, R. 426-16-3, R. 426-18 et R. 426-18-1, toutes leurs
      rédactions de 1984 à 2023 ; code des transports, R. 6527-1 à R. 6527-73 et
