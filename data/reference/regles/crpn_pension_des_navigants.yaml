schema_version: 1
id: crpn_pension_des_navigants
intitule: >-
  Le navigant professionnel de l'aéronautique civile reçoit de sa caisse, en plus du
  régime général et de l'Agirc-Arrco, une pension de 1,85 % par annuité de son salaire
  moyen indexé jusqu'à quatre plafonds et de 1,4 % de quatre à huit plafonds, calculé
  sur ses vingt-cinq meilleures annuités ; vingt-cinq annuités au plus jusqu'en 2011,
  puis une durée qui monte vers trente ; dès cinquante ans avec vingt annuités depuis
  2012, à taux plein avec trente annuités et à 5 % de décote par annuité manquante
  depuis 2022, sans décote à soixante ans ; une majoration temporaire, de cinquante-cinq
  ans à l'âge légal, de 0,8 % du plafond mensuel par annuité, une majoration pour trois
  enfants et un minimum par annuité.
domaine: salaire_de_reference
regimes: [crpnpac, crpnpac_tranche_2]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- les jours de services valables, en qualité de navigant, cotisés, rachetés ou validés à titre gratuit, et les heures de vol ou de sauts de chaque année jusqu'en 2011
- le salaire brut plafonné de chaque année, à quatre puis huit plafonds, et l'indice corrigé de variation des salaires de la caisse
- l'âge à la date d'effet, l'inaptitude, l'invalidité ou le licenciement économique, la durée d'assurance tous régimes
- les enfants eus, adoptés ou élevés neuf ans, le conjoint et les orphelins
ecrit:
- la pension des deux tranches, sa décote ou ses coefficients de minoration, sa majoration temporaire, sa majoration pour enfants, son minimum, et la réversion
dates_qui_decident:
- liquidation.date_effet
# Le régime est calculé (deux fiches de régime, une par tranche, sous le même statut
# personnel_navigant) : les versions coupent comme les textes, à la date d'effet de la
# pension. Les cotisations, elles, se taxent à l'année de leur exercice : la fiche de
# régime les porte par période.
versions:
- id: avant_le_code_de_1984
  statut: supposee
  hypothese: >-
    la caisse, créée en 1951 et dont le code de l'aviation civile reprend le statut en
    1967 (R. 426-1, R. 426-4, R. 426-6 et R. 426-7 dans leur rédaction du 9 avril 1967),
    sert avant le 1er juillet 1984 une pension dont l'index ne porte pas les articles de
    calcul ; on lui prête la règle de 1984 — 1,85 % et 1,4 % par annuité, vingt-cinq au
    plus, dès cinquante ans —, que la fiche de régime applique depuis 1963
  fiabilite: faible pour le montant, haute pour l'existence du régime
  bornes:
    liquidation.date_effet: [null, 1984-07-01]
  contenu:
    droit: la pension de la caisse, aux règles de 1984 supposées
  exemples: aucun trouvé
