  nee_de: LEGIARTI000006845228
  bornes:
    liquidation.date_effet: [1984-07-01, 1995-07-01]
  contenu:
    ouverture: >-
      « Le droit à pension à taux plein n'est ouvert que lorsque l'affilié compte au
      moins vingt-cinq annuités » ; en deçà, « une pension proportionnelle » (R. 426-11) ;
      l'entrée en jouissance ne peut précéder cinquante ans, sauf la liquidation
      anticipée dès quarante-cinq ans de qui compte vingt-cinq annuités, aux
      coefficients de 0,65 à quarante-cinq ans à 0,95 à quarante-neuf (R. 426-15-1,
      R. 426-18), et l'inaptitude définitive reconnue par le conseil médical
    annuite: >-
      une année compte entière si elle a été cotisée douze mois avec quatre fois (trois
      fois depuis 1995) la durée mensuelle normale du travail en heures de vol, et pour
      la fraction des heures faites sinon (R. 426-12)
    calcul: >-
      « A chacune [des deux tranches] est attribué, pour toute annuité validée [...]
      dans la limite de vingt-cinq, un taux de pension égal à 1,85 p. 100 pour la
      première tranche et à 1,4 p. 100 pour la deuxième tranche » (R. 426-16-1), sur le
      salaire moyen indexé de carrière, réduit aux vingt-cinq meilleures annuités au-delà
      de vingt-cinq (R. 426-5, c) ; depuis le 1er juillet 1990, « la somme obtenue est
      multipliée par l'indice de revalorisation des pensions » à la liquidation
    majorations: >-
      trois enfants majorent de 2,5 % la part de la première tranche ; de cinquante à
      soixante ans, une majoration de 1 % du plafond de la sécurité sociale par année
      validée, vingt-cinq au plus, 1,4 % sans assurance maladie (R. 426-16-1)
    cotisation: >-
      les cotisations sont appelées « à concurrence des quatre cinquièmes des taux
      fixés », jusqu'à ce que les charges atteignent 75 % des ressources (R. 426-8)
  exemples: aucun trouvé
