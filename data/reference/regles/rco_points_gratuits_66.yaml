  contenu:
    conditions: >-
      les majorations de durée d'assurance de la pension de base s'ajoutent aux
      années qui comptent, pour les dix-sept ans et demi comme pour les annuités
      (décret n° 2025-1410) ; les statuts sont ceux de L. 732-34 et L. 732-35
      « dans leur rédaction antérieure à la loi n° 2025-199 »
    droit: inchangé
  exemples: aucun trouvé
