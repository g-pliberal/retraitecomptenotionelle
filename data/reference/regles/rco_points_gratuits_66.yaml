    Aucun exemple chiffré d'un assuré n'est publié : la page de la MSA sur les
    non-salariés agricoles ne parle plus que des cent points, et son guide de
    septembre 2023 (réf. 8687) de l'assouplissement du taux plein.
  - >-
    La réversion de ces points (L. 732-62, rédaction de la loi n° 2014-40) n'est pas
    lue pour elle-même.
  lectures:
  - type: legifrance
    reference: >-
      code rural, L. 732-56, ses sept rédactions dans l'index LEGI, de
      LEGIARTI000006585649 (2003) à LEGIARTI000051289591 (2026), les V et VI depuis
      LEGIARTI000028498813 ; D. 732-151 (LEGIARTI000053365751), D. 732-151-1
      (…028941346, …053365762), D. 732-154-1 (…028941720, …047961246), D. 732-154-2
      (…028941700, …053365768), D. 732-154-3 (…028941729) ; loi n° 2014-40,
      article 34 (JORFARTI000028493774), et décret n° 2014-494, article 2
      (JORFARTI000028939595), dans l'index JORF
    date: 2026-10-04
  - type: autre
    reference: >-
      MSA, « La retraite complémentaire obligatoire agricole », synthèse statistique
      de décembre 2018 : l'article 34 de la loi du 20 janvier 2014, « 66 points par an
      avant 2011, dans la limite de 17 années », appliqué au 1er février 2014 aux
      pensions déjà liquidées ; 467 500 bénéficiaires en 2015, 448 000 en 2017 ;
      en 2017, au taux plein, 377 € de points gratuits par an pour une aide
      familiale, 416 € et 377 € pour un conjoint collaborateur et une conjointe —
      1 122 points (17 × 66) à 0,3362 € (valeurs_point.csv) font 377,22 €
    date: 2026-10-04
    url: https://statistiques.msa.fr/wp-content/uploads/2018/12/SY-RCO.pdf
historique:
- >-
  2026-10-04 — née avec l'action 119 : les points du V et du VI de L. 732-56 que la
  fiche `rco_points_gratuits` laissait à relire, documentés sans être modélisés.
effet: >-
  Les conjoints, aides familiaux et collaborateurs d'exploitation d'avant 2011 —
  près de 450 000 retraités en 2017, sept sur dix des femmes — et les chefs aux
  carrières courtes : jusqu'à 1 122 points, 440 € par an à la valeur de service de
  2025, que le modèle ne sert pas. Le simulateur ne connaît que le statut de chef,
  pour qui les deux durées de dix-sept ans et demi se confondent : la règle n'y
  trouve jamais à s'appliquer.
