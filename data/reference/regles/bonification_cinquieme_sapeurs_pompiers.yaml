approximations:
- version: [decret_de_1986, decret_de_2003, decret_du_30_decembre_2010]
  ecart: >-
    L'âge d'admission à la retraite, cinquante-cinq ans puis cinquante-sept, se lit à
    l'âge anticipé de la catégorie active de la génération, que la loi du 9 novembre
    2010 relève de cinq mois par génération : le décret du 30 décembre 2010 écrit
    cinquante-sept ans pour toute pension liquidée depuis le 1er juillet 2011, et le
    modèle en dispense les générations de la montée en charge.
  effet: non mesuré ; les sapeurs-pompiers nés de 1956 à 1959 partis avant 57 ans
- version: [decret_de_1986, decret_de_2003, decret_du_30_decembre_2010, decret_du_3_juin_2023]
  ecart: >-
    Les services se comptent à l'année, ceux de la fonction publique civile seule :
    les services militaires « pris en compte dans la constitution de leurs droits à
    pension » n'y entrent pas. Le congé pour difficulté ou raison opérationnelle et le
    reclassement après un accident de service ne sont pas saisis.
  effet: non mesuré
