referents:
  trajectoire:
    equivalent: >-
      bonifDeterministes (R/fonctionsCalculsDivers.R), « 4 trim tous les 5 ans, limites
      a 20 » aux cas types super-actifs
    confrontation: >-
      aucune exécutée : aucun cas type du COR n'est sapeur-pompier ; le registre lui
      reproche d'omettre les dix-sept et vingt-sept années (138.17)
historique:
- >-
  2026-10-07 — née de l'étape 17 de l'action 138, avec le statut
  sapeur_pompier_professionnel : le sapeur-pompier était rangé au statut super-actif
  de la CNRACL, qui lui ouvrait l'âge minoré au lieu de l'âge anticipé, et ne recevait
  aucune bonification.
effet: >-
  Le sapeur-pompier professionnel qui réunit ses durées : vingt trimestres à qui a servi
  vingt-cinq ans en cette qualité, sous le maximum de 75 %.
