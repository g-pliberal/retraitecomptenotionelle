schema_version: 1
id: bonification_cinquieme_sapeurs_pompiers
intitule: >-
  Bonification du cinquième des sapeurs-pompiers professionnels, depuis février 1986 :
  un cinquième du temps de service accompli en cette qualité, cinq ans au plus, aux
  services liquidés sans dépasser le maximum, à qui part à l'âge anticipé avec trente
  ans de services dont quinze de sapeur-pompier, puis vingt-sept dont dix-sept.
domaine: duree
regimes:
- cnracl
etape: compter_les_durees
face: droit
etat: approchee
lit:
- les années servies dans le statut sapeur_pompier_professionnel, et celles de services
  dans la fonction publique civile, jusqu'à la liquidation
- l'âge anticipé de la catégorie active à la génération (legislation/categorie_active.csv)
- l'âge à la liquidation
- la radiation des cadres pour invalidité, et son imputabilité au service
- liquidation.date_effet
ecrit:
- les trimestres de bonification, aux services liquidés de la CNRACL et à la durée
  d'assurance pour la décote (Durees.emplois)
dates_qui_decident:
- liquidation.date_effet
# Les paramètres que le moteur lit (droit/compter.py, `trimestres_des_emplois`, et
# son jumeau) sont ceux de la bonification des policiers, et la condition
# `durees_et_age_de_l_emploi` lit trois seuils : les années servies dans le statut
# (`annees_dans_l_emploi`), les années de services de la fonction publique civile
# (`annees_de_services`, sur `services_comptes`), et l'âge anticipé de la catégorie
# active à la génération (`age_anticipe`) ; la radiation pour invalidité imputable au
# service en dispense.
