schema_version: 1
id: retraite_anticipee_handicap
intitule: >-
  L'assuré handicapé part avant l'âge légal, dès cinquante-cinq ans, quand il a cotisé
  en situation de handicap la durée requise de sa génération diminuée de 60 à 100
  trimestres selon l'âge (L. 351-1-3, D. 351-1-5) : au taux plein (L. 351-8, 4° bis),
  sa pension majorée d'un tiers du rapport de cette durée cotisée à sa durée
  d'assurance, sous la pension entière ; de même le fonctionnaire (L. 24, I, 5°, du
  code des pensions), que le coefficient de minoration n'atteint jamais (L. 14, I).
  Le taux d'incapacité exigé est de 80 % jusqu'au 31 décembre 2014, de 50 % depuis.
domaine: age
regimes: [regime_general, msa_salaries, cancava, organic, rsi, rci, fonction_publique_etat,
  cnracl, fspoeie]
etape: ouvrir_le_droit
face: droit
etat: approchee
lit:
- le mois depuis lequel l'incapacité permanente atteint 50 %, que la saisie déclare
- les trimestres cotisés et validés de chaque année civile depuis celle de ce mois, tous
  régimes, et ceux de chaque régime de la fiche
- l'âge et la génération à la date d'effet de la pension, la durée requise qu'elle oppose
ecrit:
- l'âge auquel le handicap ouvre le droit, et le motif de l'ouverture
- le taux plein, sans décote ni coefficient d'anticipation des complémentaires qui le
  suivent
- la majoration de pension de chaque régime de la fiche
- la pension du fonctionnaire handicapé sans coefficient de minoration
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1).
# Paramètres : `taux_incapacite`, le taux exigé, que la saisie, qui dit « au
# moins 50 % », n'établit qu'à 50 ; `ages`, les âges abaissés ; les trimestres
# retranchés à la durée requise pour la durée cotisée, et pour la durée validée
# quand la version l'exige, âge par âge ; `retranches_en_plus`, ce que la
# version retranche encore par génération, [début, fin), décimales ;
# `duree_d_avant_2023_jusqu_a`, la génération avant laquelle la durée retranchée
# est celle de L. 161-17-3 d'avant la loi du 14 avril 2023 ; `majoration`, la
# fraction du rapport des durées et l'arrondi du coefficient ;
# `fonctionnaire_sans_decote`, le coefficient de minoration écarté au même taux.
