approximations:
- version: [decret_2004, majoration_2006, travailleurs_handicapes_2011]
  ecart: >-
    avant 2015, le taux exigé est de 80 % (la carte d'invalidité) : la saisie, qui dit
    une incapacité d'au moins 50 %, ne l'établit pas, et le handicap déclaré n'ouvre
    alors ni le départ anticipé, ni le taux plein, ni la majoration, ni la pension du
    fonctionnaire sans minoration
  effet: >-
    les départs anticipés pour handicap pris de juillet 2004 à décembre 2014, refusés ;
    non mesuré
- ecart: >-
    une seule date, celle depuis laquelle l'incapacité atteint 50 %, et l'incapacité
    réputée continue jusqu'au départ ; la reconnaissance de la qualité de travailleur
    handicapé, qui compte pour les périodes antérieures au 1er janvier 2016, ne se
    déclare pas ; la commission nationale (L. 161-21-1), qui valide jusqu'à 30 % de la
    durée sans justificatif, n'est pas représentée ; la concomitance se lit année civile
    par année civile, comme la circulaire Cnav n° 2026-18 (1.1.3.1) la prescrit au
    régime général, et de même pour les services du fonctionnaire
  effet: non mesuré
- ecart: >-
    les régimes que la fiche ne nomme pas — non-salariés agricoles (L. 732-18-2 du
    code rural), professions libérales (L. 643-3), avocats, cultes, et les régimes
    spéciaux des industries électriques et gazières, de la RATP, de la SNCF, des
    clercs de notaire, de la Banque de France, de la Comédie-Française et de l'Opéra —
    liquident au même départ sans le taux plein ni la majoration du handicap, leurs
    textes n'étant pas lus
  effet: non mesuré
- ecart: >-
    la majoration de qui part à l'âge légal ou plus tard sans avoir demandé le départ
    anticipé — la retraite anticipée fictive que la circulaire Cnav n° 2026-18 (§ 4,
    après la circulaire n° 2006-51, point 9) compare à la pension servie — n'est pas
    calculée ; ni la majoration pour tierce personne ; la réversion se calcule sur la
    pension majorée, quand la circulaire (3.8) la calcule sur la pension non majorée
  effet: non mesuré
code:
  python: >-
    droit/invalidite.py : incapacite_reconnue, version_du_handicap,
    trimestres_en_situation_de_handicap, exigences_du_handicap, age_du_handicap,
    age_propose_du_handicap, sans_decote_du_fonctionnaire, coefficient_de_majoration,
    annee_en_situation_de_handicap ; droit/ouvrir.py : ouvrir, age_ouverture_droit,
    age_taux_plein_droit, age_handicap_propose ; droit/departs.py ; droit/liquider.py :
    la décote, la majoration, le minimum contributif, abattement_points,
    abattement_regime_de_base ; scenarios/actuel.py : Invalidites ; avantages.py :
    la neutralisation qui retire la fiche
  javascript: >-
    moteur/js/droit/invalidite.js ; moteur/js/droit/ouvrir.js ;
    moteur/js/droit/departs.js ; moteur/js/droit/liquider.js ; moteur/js/regimes.js :
    Invalidites ; moteur/js/avantages.js
  parametres: >-
    contenu.parametres de chaque version : existe, taux_incapacite, ages,
    cotisees_retranchees, validees_retranchees, retranches_en_plus,
    duree_d_avant_2023_jusqu_a, majoration, fonctionnaire_sans_decote
  tests: >-
    tests/test_invalidite.py ; les exemples ur_handicap_* et cnav_2026_18_majoration*
    de tests/temoins/exemples_officiels.yaml ; les témoins handicap_* des simulations,
    dans les deux moteurs
sources:
  lu_le: 2026-10-05
  prochaine_relecture: 2027-09-30
  a_relire:
  - >-
    À lire : les départs anticipés des régimes que la fiche ne nomme pas (L. 732-18-2
    du code rural, L. 643-3 et L. 653-2 CSS, les décrets des régimes spéciaux), pour
    les y ajouter ; la circulaire Cnav qui appliquait la version de 2015, pour la
    concomitance d'alors ; la règle du minimum garanti du fonctionnaire majoré.
  - >-
    Le simulateur d'info-retraite répond pour un départ à cet âge, sans date : ses
    vingt-quatre saisies sont rejouées à la seule date d'effet qu'un âge et une
    génération permettent, celle de la version alors en vigueur, sur la durée cotisée
    qu'il annonce ; la durée validée de la version de 2015, qu'il ne dit que pour le
    fonctionnaire né en 1961, n'est rejouée que là.
  lectures:
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 2026-18 du 15 juin 2026, « Retraite anticipée au profit des
      assurés handicapés à compter du 1er septembre 2026 » : les conditions (1.1), la
      concomitance de la durée cotisée et du handicap année civile par année civile, et
      pour l'année du départ avant l'arrêt du compte (1.1.3.1), le taux maximum de 50 %
      (2.4.2), le minimum (2.4.4), pas de surcote (2.4.6), la majoration (3.1 à 3.3 :
      « 135/160 x 1/3 = 0,281 arrondi à 0,28 », l'écrêtement à la retraite entière, le
      minimum comparé au seul montant calculé, la majoration s'y ajoutant), la réversion
