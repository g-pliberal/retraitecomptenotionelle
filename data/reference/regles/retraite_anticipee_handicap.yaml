historique:
- >-
  2026-10-04 — les vingt-quatre saisies du simulateur d'info-retraite, toutes
  concordantes avec D. 351-1-5 sur la durée cotisée ; la fiche disait le départ « pas
  encore modélisé », l'assuré déclaré non ouvert.
- >-
  2026-10-05 — lue dans tous ses textes, coupée en sept versions et lue par le moteur
  (action 142) : la saisie dit le mois depuis lequel l'incapacité atteint 50 % ; le
  départ s'ouvre de 55 ans à l'âge légal au taux plein, la pension majorée, le
  fonctionnaire handicapé sans coefficient de minoration ; l'Agirc-Arrco et l'Ircantec
  le servent sans coefficient. Le fonctionnaire né en 1961 n'est plus un écart : parti à
  59 ans, il partait en 2020, sous la double condition de la version de 2015.
effet: >-
  Les assurés qui ont cotisé en situation de handicap, depuis 2015 : le modèle leur
  ouvre ce départ à leur âge, au taux plein, leur pension majorée, et sert le
  fonctionnaire handicapé sans coefficient de minoration ; leur nombre n'est pas lu.
