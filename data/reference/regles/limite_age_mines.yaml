    date: 2026-10-18
historique:
- >-
  2026-10-18 — née et appliquée, action 151, étape 10 : le mineur dont le départ saisi passe
  cinquante-cinq ans a passé sa limite d'âge, et le modèle le présume maintenu dans l'intérêt
  du service jusqu'à son départ ; la limite ne le radie pas. Le modèle ne lui en connaissait
  aucune.
effet: >-
  Tout mineur affilié au régime spécial dont le départ saisi passe cinquante-cinq ans, depuis
  le 18 janvier 1954, a passé sa limite d'âge, et le modèle le dit maintenu dans l'intérêt du
  service, présumé, jusqu'à son départ : aucune pension ne bouge. Approchée : le mineur est
  traité en agent de la seule caisse autonome nationale, et l'abaissement par les années au
  fond n'avance pas sa limite.
