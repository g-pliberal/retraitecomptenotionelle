  prochaine_relecture: 2027-10-18
  a_relire:
  - >-
    La rédaction de l'article 146 du décret n° 46-2769 en vigueur de 1954 au 30 décembre 1971,
    que l'index LEGI ne porte pas, et la place de l'abaissement pour les années au fond dans
    la rédaction de 1985, au premier alinéa ou hors de lui : l'index ne garde pas les alinéas.
  - >-
    Le statut du mineur (décret n° 46-1433 du 14 juin 1946) et les règles des Charbonnages
    et des Houillères sur la mise à la retraite, que l'index ne porte pas : le maintien de
    l'article 3 y est peut-être encadré, et la pratique d'une mise à la retraite à la limite
    peut-être écrite.
