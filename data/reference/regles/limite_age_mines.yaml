schema_version: 1
id: limite_age_mines
intitule: >-
  Depuis le 18 janvier 1954, la limite d'âge du mineur affilié au régime spécial de sécurité
  sociale dans les mines est l'âge d'ouverture de sa pension, cinquante-cinq ans, reculée pour
  l'employé, le technicien et l'agent de maîtrise affiliés à une caisse complémentaire,
  soixante ans pour l'ingénieur ; tout agent peut, dans l'intérêt du service, être admis à
  rester en activité au-delà, sans autre borne, ce maintien prenant fin à l'initiative de
  l'une ou de l'autre partie.
domaine: age
regimes: [mines]
etape: preparer_la_chronologie
face: droit
etat: approchee
lit:
- le statut de mineur, quand il route le régime spécial ; la saisie ne distingue ni
  l'employé, le technicien et l'agent de maîtrise affiliés à une caisse complémentaire, ni
  l'ingénieur, ni les années au fond, et le modèle traite tout mineur en agent affilié à la
  seule caisse autonome nationale
ecrit:
- la limite du mineur et son maintien dans l'intérêt du service, jusqu'au départ saisi
  (`droit/limite_age.py`) ; la limite ne radie jamais, le maintien n'ayant pas de borne
