  contenu:
    parametres:
      limites: {sedentaire: 55}
      exceptions: [interet_du_service]
    droit: >-
      « L'âge limite de maintien en activité des personnels désignés à l'article 1er du
      présent décret est l'âge fixé pour l'ouverture du droit à rente ou pension de retraite
      par les dispositions du premier alinéa de l'article 146 du décret n° 46-2769 du
      27 novembre 1946 portant organisation de la sécurité sociale dans les mines. Toutefois,
      en ce qui concerne les employés, techniciens, agents de maîtrise, affiliés à l'un des
      régimes complémentaires mentionnés à l'article 1er, cet âge est reculé jusqu'à l'âge
      fixé pour l'ouverture du droit à pension d'ancienneté normale par les règlements desdits
      régimes complémentaires. Pour les ingénieurs et assimilés, l'âge limite de maintien en
      activité est fixé à soixante ans » (article 2) ; « L'assurance vieillesse garantit une
      rente ou pension de retraite aux affiliés âgés de cinquante-cinq ans » (article 146,
      rédactions de 1971 et de 1985) ; « Tout agent peut, dans l'intérêt du service, être
      admis à rester en activité au delà de l'âge limite défini ci-dessus. Ce maintien au
      service prend fin à l'initiative de l'une ou de l'autre partie, sous réserve des règles
      applicables en matière de préavis » (article 3)
    transition: >-
      la rédaction de l'article 146 d'avant le 30 décembre 1971, que l'index ne porte pas, est
      présumée garantir la pension au même âge, que la fiche du régime ouvre à cinquante-cinq
      ans depuis 1930 ; le maintien de l'article 3 (`interet_du_service`) court jusqu'au départ
      saisi
