presomptions:
  exceptions_a_la_limite_d_age: >-
    le maintien dans l'intérêt du service, présumé accordé autant que le départ saisi le
    demande : le texte ne lui donne pas d'autre borne que la volonté de l'une ou l'autre
    partie, et le mineur dont le départ saisi passe sa limite n'est jamais radié par elle
approximations:
- version: [decret_de_1954, article_125_de_1993]
  ecart: >-
    tout mineur est traité en agent affilié à la seule caisse autonome nationale :
    l'employé, le technicien et l'agent de maîtrise affiliés à une caisse complémentaire
    avaient pour limite l'âge de leur pension d'ancienneté normale, et l'ingénieur soixante
    ans ; l'abaissement de l'âge d'ouverture par les années au fond — que la rédaction de 1985
    écrit à l'article 146, sans que l'index dise s'il est de son premier alinéa, et que
    l'article 127 porte depuis 1993 — n'avance pas la limite
  effet: nul tant que le maintien est présumé, la limite ne radiant personne
sources:
