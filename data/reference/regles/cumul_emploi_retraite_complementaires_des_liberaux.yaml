  moteur: >-
    La complémentaire lit la décision de L. 643-6 sur sa propre pension, que la règle de la
    base rend, et le montant de la base ; les deux moteurs redisent la table des sections,
    que tests/test_emploi_retraite.py confronte à la fiche.
historique:
- >-
  2026-10-24 — née de la fiche cumul_emploi_retraite_et_retraite_progressive, qui servait
  les complémentaires des sections entières faute d'en avoir lu les statuts, et calculée
  dans les deux moteurs (action 138, étape 12).
effet: >-
  Le libéral qui reprend une activité libérale avant le taux plein, au-delà du plafond de la
  sécurité sociale : la dentiste partie avant 2015 perd sa complémentaire avec sa base ; le
  médecin, l'officier ministériel, le vétérinaire perdent sur elle tout ou partie du
  dépassement ; le notaire libéral n'y a pas droit, même sous le seuil.
