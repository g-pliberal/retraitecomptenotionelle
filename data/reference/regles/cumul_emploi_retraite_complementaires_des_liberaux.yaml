schema_version: 1
id: cumul_emploi_retraite_complementaires_des_liberaux
intitule: >-
  Cumul emploi-retraite de la complémentaire des sections professionnelles des libéraux :
  chaque section l'écrit dans ses statuts. La CARCDSF de 2007 la suspend dès la reprise de
  la profession ; depuis 2011, elle et la CAVAMAC la suspendent pour la même durée que la
  base (L. 643-6), et la CAVAMAC la règle depuis 2026 comme la base ; la CARMF et la CAVOM
  de 2020 ne lui font perdre que ce que la base n'absorbe pas du dépassement, la CARPV de
  2011 et la CAVOM de 2026 le dépassement entier ; la CPRN la refuse au notaire libéral.
  Pour la première pension de 2027, L. 161-22 la réduit de ce que les pensions de base
  n'absorbent pas.
domaine: cumul
regimes: [carcdsf_complementaire, carmf_complementaire, carpimko_complementaire,
  carpv_complementaire, cavamac_complementaire, cavec_complementaire, cavom_complementaire,
  cavp_complementaire, cipav_complementaire, cprn_complementaire]
etape: echeancier
face: droit
etat: approchee
lit:
- l'activité exercée après le départ, ses dates, son statut et son revenu
- ce que L. 643-6 fait de la pension de base du libéral, le même mois, et son montant
- la date de la première pension de base, le taux plein et la liquidation de toutes les
  pensions
ecrit:
- >-
  la pension complémentaire servie pendant l'activité : entière, réduite, suspendue, ou non
  due
dates_qui_decident:
- liquidation.premiere_pension_de_base
- periode.debut
# La version des statuts porte, pour chaque section dont les statuts sont lus,
# la règle de chacune de leurs rédactions et le premier mois entier où elle
# vaut (`sections`), que les deux moteurs redisent (REGLES_DES_SECTIONS) :
# `suspendue_a_la_reprise`, dès la reprise de la profession ;
# `suspendue_avec_la_base`, pour la même durée que la base ;
# `reduite_comme_la_base`, suspendue ou réduite du dépassement comme elle ;
# `reduite_apres_la_base`, de ce que la base n'absorbe pas du dépassement ;
# `reduite_du_depassement`, du dépassement entier ; `sans_suspension` ;
# `incompatible_avec_le_notariat_liberal`. Une section, ou un mois, qui n'y
# figure pas sert sa complémentaire entière.
