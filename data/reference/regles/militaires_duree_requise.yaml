schema_version: 1
id: militaires_duree_requise
intitule: >-
  Durée de services et bonifications requise d'un militaire qui peut liquider avant
  soixante ans : celle des fonctionnaires qui atteignent soixante ans l'année où
  son droit s'ouvre (150 trimestres si c'est avant 2004, la table de la loi de 2003
  de 2004 à 2008) ; et s'il peut liquider à compter du 1er septembre 2023, 169 trimestres,
  170 en 2025, 171 en 2027, 172 à compter de 2028.
regimes: [fonction_publique_etat]
etat: transcrite
effet: >-
  CORRIGÉ LE 23 SEPTEMBRE 2026. Le modèle opposait au militaire la durée de sa génération,
  lue à l'année de sa liquidation : 172 trimestres au sous-officier né en 1970 dont
  le droit s'ouvrait en 2002, là où la loi de 2003 lui en garde 150. Ce que la correction
  rend, pour un militaire entré à dix-huit ans et parti à quarante-cinq : +14,67
  % de pension au né en 1970, +3,58 % au né en 1980 (165 trimestres au lieu de 172)
  ; rien aux nés de 1985 et 1990, dont les services atteignent déjà le pourcentage
  maximum. CORRIGÉ LE 28 OCTOBRE 2026. Le droit ouvrait la pension militaire le mois
  même où les services s'achèvent, un mois avant le premier départ qui les a (L. 24,
  II, 2° ; L. 90, I) : elle s'ouvre le mois qui suit (Carriere.age_de_service), et
  l'année de la durée est celle où les services s'achèvent, à quelque jour que le
  militaire soit né (annee_ouverture_des_droits). Au scénario 1, l'âge d'ouverture des
  témoins militaires recule d'un mois, et aucune durée ni aucune pension ne bouge ;
  le notionnel prospectif, qui lit cet âge, sert de 0,55 à 0,60 % de moins à trois
  d'entre eux.
sources:
  lu_le: 2026-10-28
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Le III de L. 13 (2014 à 2023) lit la durée à « l'année à compter de laquelle la
    liquidation peut intervenir », celle du mois qui suit les services, et le XXIV, C,
    de la loi de 2023 vise « ceux pouvant liquider leur pension à compter du 1er
    septembre 2023 » ; la Cour des comptes, elle, dit « l'année où ils ont accompli
    le nombre d'années de service requis ». Le modèle compare au mois de
    l'anniversaire de l'âge d'ouverture (duree_requise_avant_soixante_ans) : le mois
    où les services s'achèvent pour qui est né en cours de mois, le suivant pour qui
    est né un premier du mois. À trancher, pour le militaire comme pour l'emploi
    classé et la carrière longue de la même fonction ; l'article 5 de la loi n°
    2003-775 (2009 à 2013) reste à lire.
  - >-
    Aucun exemple chiffré publié : ni le SRE ni service-public ne donnent la durée
    d'un militaire par année d'ouverture, et la Cour la décrit sans la chiffrer.
    Les bonifications de service, qui portent un quart de la durée validée des
    militaires selon la Cour, sont servies pour le cinquième depuis le 8 octobre 2026
    (fiche bonification_cinquieme_militaires) ; les bénéfices de campagne et les
    services aériens restent hors du modèle, et c'est avec eux que se dira si la
    durée requise mord.
  lectures:
  - type: legifrance
    reference: >-
      Loi n° 2023-270, article 10, version LEGIARTI000053280920, XXIV, C, lu dans
      l'index LEGI : « la durée de services et de bonifications requise pour les
      fonctionnaires civils, autres que ceux mentionnés aux A et B du présent XXIV,
      et les militaires remplissant les conditions de liquidation de la pension
      avant l'âge de soixante ans est égale : 1° Pour ceux pouvant liquider leur
      pension avant le 1er septembre 2023, à celle applicable avant l'entrée en
      vigueur du présent XXIV ; 2° Pour ceux pouvant liquider leur pension à compter
      du 1er septembre 2023, à 169 trimestres. Cette durée augmente d'un trimestre
      au 1er janvier 2025 puis au 1er janvier 2027. A compter du 1er janvier 2028,
      cette durée est égale à la durée mentionnée au 6° de l'article L. 161-17-3
      du code de la sécurité sociale. »
    date: 2026-09-23
  - type: legifrance
    reference: >-
      L. 13 du code des pensions, version LEGIARTI000028498258, III (« des fonctionnaires
      de l'Etat et des militaires qui remplissent les conditions de liquidation
      d'une pension avant l'âge de soixante ans ») ; loi n° 2003-775, article 66,
      version LEGIARTI000006758610, tableau « Jusqu'en 2003 : 150 ; 2004 : 152 […]
      2008 : 160 » ; L. 161-17-3, version LEGIARTI000053280903, 6° : 172 trimestres.
    date: 2026-09-23
  - type: legifrance
    reference: >-
      Lus dans l'index LEGI le 28 octobre 2026. L. 24 du code des pensions, version
      LEGIARTI000047452804, II, 2° : « Lorsqu'un militaire non officier est radié
      des cadres par limite d'âge, ou par suite d'infirmités, ou encore s'il réunit,
      à la date de son admission à la retraite, dix-sept ans de services effectifs »
      (quinze ans, version LEGIARTI000006362730, jusqu'au 1er juillet 2011) ; L. 26,
      version LEGIARTI000006362735 : « La mise en paiement de la pension de retraite
      […] ne peut être antérieure à la date de la décision de radiation des cadres » ;
      L. 90, version LEGIARTI000023034140, I, pour les pensions liquidées depuis le
      1er juillet 2011 : « La pension […] est due à compter du premier jour du mois
      suivant la cessation de l'activité ». Loi n° 2003-775, article 66, II : le
      tableau se lit à l'« Année au cours de laquelle sont réunies les conditions
      mentionnées au I et au II de l'article L. 24 » ; L. 13, version
      LEGIARTI000006362702 (2004 à 2014), n'a pas de III ; version
      LEGIARTI000028498258, III : « celle exigée des fonctionnaires atteignant cet
      âge l'année à compter de laquelle la liquidation peut intervenir ».
    date: 2026-10-28
  - type: autre
    reference: >-
      Cour des comptes, « Les retraites des fonctionnaires de l'État », septembre
      2026, chapitre I, III, A : pour les militaires, la durée requise « n'est pas
      déterminée […] en fonction de l'année de naissance, comme c'est le cas pour
      les civils. Elle l'est en fonction de l'année où ils ont accompli le nombre
      d'années de service requis pour bénéficier du droit à liquidation immédiate.
      »
    url: >-
      https://www.ccomptes.fr/fr/publications/les-retraites-des-fonctionnaires-de-letat
    date: 2026-09-22
textes_a_rattacher:
- reference: >-
    loi n° 2003-775 du 21 août 2003, article 66 (tableau par année où sont réunies
    les conditions de L. 24)
- reference: >-
    loi n° 2003-775 du 21 août 2003, article 5, VI, version du 11 novembre 2010
- reference: >-
    L. 13, III, du code des pensions civiles et militaires, version du 22 janvier
    2014
- reference: loi n° 2023-270 du 14 avril 2023, article 10, XXIV, C
- reference: L. 161-17-3 CSS, 6°, version du 31 décembre 2025
reformes:
- reforme_2023
- lfss_2026_suspension
code:
  moteur: >-
    `duree_requise_avant_soixante_ans` oppose au militaire que `droit_militaire` fait
    liquider avant soixante ans la durée de l'année où son droit s'ouvre
    (`duree_de_l_annee`) : avant 2004, la durée que la période de cette année-là porte,
    cent cinquante trimestres ; de 2004 à 2008, la table de la loi de 2003
    (`legislation/duree_requise_fonction_publique.csv`) ; ensuite celle de L. 13, III
    (lignes `l13_iii` de `legislation/duree_requise_avant_soixante_ans.csv`). Qui peut
    liquider à compter du 1er septembre 2023 doit celle du C du XXIV
    (`DureesRequisesAvantSoixanteAns.depuis_2023`, lignes `xxiv_c`) : 169 trimestres,
    170 en 2025, 171 en 2027, 172 à compter de 2028.
  python: >-
    droit/ouvrir.py : duree_requise, duree_requise_avant_soixante_ans, droit_militaire,
    duree_de_l_annee ; scenarios/actuel.py : DureesRequisesAvantSoixanteAns,
    DureesRequisesAvantSoixanteAns.par_annee, DureesRequisesAvantSoixanteAns.depuis_2023,
    DureesRequisesFonctionPublique
  javascript: >-
    moteur/js/droit/ouvrir.js : dureeRequise, dureeRequiseAvantSoixanteAns,
    droitMilitaire, dureeDeLAnnee ; moteur/js/regimes.js :
    DureesRequisesAvantSoixanteAns, DureesRequisesAvantSoixanteAns.parAnnee,
    DureesRequisesAvantSoixanteAns.depuis2023, DureesRequisesFonctionPublique
  parametres: >-
    legislation/duree_requise_avant_soixante_ans.csv : l13_iii, xxiv_c, annee_ouverture,
    trimestres ; legislation/duree_requise_fonction_publique.csv : annee_ouverture,
    trimestres ; regimes/fonction_publique_etat.yaml : duree_requise_trimestres
  tests: >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    sept des vingt-deux témoins militaires changent sans elle, statut_militaire et
    droits_pension_militaire parmi eux ; la grille du coût la fait passer d'un moteur
    à l'autre (tests/test_pont.py), et les cas types statutaires la confrontent aux
    départs de 2025 (tests/test_flux_fonction_publique.py) ; aucun test ne la pose à la
    main
