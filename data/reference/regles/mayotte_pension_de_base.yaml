  contenu:
    ouverture: >-
      soixante ans avant la génération 1956, quatre mois de plus par génération jusqu'à
      soixante-deux ans pour 1961, puis, pour les pensions prenant effet depuis le 1er
      septembre 2026, soixante-deux ans et trois mois pour 1962, soixante-deux ans et
      six mois du 1er janvier 1963 au 30 juin 1965, trois mois de plus par génération
      jusqu'à soixante-trois ans et neuf mois pour 1969, l'âge de L. 161-17-2 ensuite
      (décret, article 2 ; ordonnance, article 6) ; taux plein à l'âge du 1° de L. 351-8,
      à l'inaptitude, ou à soixante-cinq ans pour l'assuré handicapé (article 10)
    calcul: >-
      vingt-cinq meilleures années pour la génération 1965, et, « Pour les pensions
      prenant effet après le 31 décembre 2017 et avant le 1er janvier 2028 [...] 16
      années pour l'assuré né avant 1957 », une de plus par génération jusqu'à 24 pour
      1964 (décret, article 7) ; 172 trimestres pour la génération 1973, et, pour les
      pensions prenant effet avant 2035, 120 trimestres avant 1956, quatre de plus par
      génération jusqu'à 160 pour 1965, puis deux jusqu'à 172 (article 9) ; minoration de
      2,5 % par trimestre pour les pensions d'avant 2026, puis de 2,5 % avant la
      génération 1964 à 1,25 % à compter de 1973, 0,125 point de moins par génération
      (article 11)
    trimestres: >-
      200 heures du SMIG de Mayotte par trimestre avant 2017, 150 heures en 2017, 150
      heures du SMIC de Mayotte depuis 2018, quatre par an au plus (article 8)
    minimum: >-
      au taux plein, un minimum de 54,9212 % de 151,67 heures du SMIC de Mayotte au 1er
      janvier 2024, majoré jusqu'à 10 170,86 € par an au 1er novembre 2023 pour cent
      vingt trimestres cotisés, proratisé (ordonnance, article 14 ; décret, article 15)
    reversion: >-
      sous plafond de ressources, 2 080 heures du SMIC de Mayotte pour le conjoint seul,
      1,6 fois ce plafond pour le ménage (décret, article 17)
