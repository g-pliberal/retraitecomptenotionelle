historique:
- >-
  2026-10-14 — écrite à l'étape 2 de l'action 145 : le régime de Mayotte n'avait que la
  fiche générique de liquidation. Le décret n° 87-175, que la fiche de régime disait
  sans formule, l'écrit ; l'ordonnance n° 2026-647 fond le régime dans le code de la
  sécurité sociale en 2028. Aucun chiffre ne change.
- >-
  2026-10-31 — action 177, étape 3 : les trimestres se valident au SMIG de Mayotte
  depuis 2002 (décret n° 2003-589, article 8), et le salaire annuel moyen s'écrête au
  plafond de la caisse depuis 2005 (article 7), lus dans `mayotte_smig_et_plafond.csv`,
  dans les deux moteurs. Des 913 témoins de simulation, les cinq de Mayotte baissent,
  de 13 à 28 % au scénario 1, au plafond.
effet: >-
  Les salariés de Mayotte : leur pension est simulée au droit depuis 2003, à leur
  salaire moyen près pour les nés avant 1965, et à leurs trimestres d'avant 2002 et à
  leur plafond d'avant 2005 près ; celles de 1987 à 2002 le sont à la formule du
  régime général et non à celle du décret.
