code:
  moteur: >-
    une fiche de régime en annuités, une période par réforme, l'âge, la durée et la
    minoration lus à la génération par les tables `mayotte_2018`, `mayotte_2026_01` et
    `mayotte_2026_09` ; les trimestres au SMIG de Mayotte depuis 2002 et le salaire
    annuel moyen au plafond de la caisse depuis 2005, lus dans
    `mayotte_smig_et_plafond.csv`
  python: >-
    donnees/regimes.py : CatalogueRegimes ; droit/liquider.py : liquider_chaque_regime,
    salaire_de_reference ; donnees/macro.py : REGIME_DE_MAYOTTE,
    DonneesMacro.trimestres_valides, DonneesMacro.seuil_d_un_trimestre,
    DonneesMacro.plafond_de_cotisations, DonneesMacro.smig_mayotte,
    DonneesMacro.plafond_mayotte, DonneesMacro.statuts_de_mayotte
  javascript: >-
    moteur/js/regimes.js : CatalogueRegimes ; moteur/js/droit/liquider.js :
    liquiderChaqueRegime, salaireDeReference ; moteur/js/macro.js : REGIME_DE_MAYOTTE,
    DonneesMacro.trimestresValides, DonneesMacro.seuilDUnTrimestre,
    DonneesMacro.plafondDeCotisations
  parametres: >-
    regimes/cssm_mayotte.yaml : taux_plein, duree_requise_trimestres, salaire_reference,
    decote_par_trimestre ; legislation/ages_regimes.csv,
    legislation/duree_requise_regimes_speciaux.csv ;
    legislation/mayotte_smig_et_plafond.csv : smig_horaire, plafond_annuel ;
