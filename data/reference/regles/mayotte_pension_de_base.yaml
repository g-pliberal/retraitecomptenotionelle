  textes:
  - {id: JORFTEXT000054456323, reference: "ordonnance n° 2026-647 du 22 juillet 2026 relative à l'extension et à l'adaptation du code de la sécurité sociale à Mayotte et à l'accélération de la convergence sociale, et son rapport au Président de la République (JORFARTI000054456299)", publie_le: 2026-07-23}
