    date: 2026-10-14
  - type: legifrance
    reference: >-
      décret n° 87-175, articles 3, 9 et 21 ; décret n° 2003-589, articles 7, 8 et 21,
      toutes leurs rédactions ; ordonnance n° 2002-411, article 19 ; ordonnance
      n° 96-1122, articles 28-1 et 28-2 : index LEGI du dépôt, à jour au 30 octobre 2026
