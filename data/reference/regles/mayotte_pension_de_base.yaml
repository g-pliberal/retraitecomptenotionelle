schema_version: 1
id: mayotte_pension_de_base
intitule: >-
  Le salarié de droit privé de Mayotte, et depuis 2012 le non-salarié, reçoit de la
  caisse de sécurité sociale de Mayotte une pension de base : de 1987 à 2002, 1,5 % par
  année d'assurance du salaire moyen des cinq meilleures années ; depuis 2003, au plus
  50 % du salaire annuel moyen des vingt-cinq meilleures années — seize à vingt-cinq
  selon la génération pour les pensions de 2018 à 2027 —, pour une durée qui monte de
  64 trimestres en 2003 à 172 pour la génération 1973, minorée de 2,5 % par trimestre
  manquant, puis de 1,25 % à 2,375 % selon la génération depuis 2026 ; au 1er janvier
  2028, le code de la sécurité sociale s'étend à Mayotte et le régime général reprend ses
  périodes.
domaine: salaire_de_reference
regimes: [cssm_mayotte]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- les salaires annuels soumis à retenue, plafonnés au plafond de Mayotte, et le SMIG puis le SMIC de Mayotte au 1er janvier de chaque année, qui font les trimestres
- les périodes assimilées, les majorations pour enfants et la durée d'assurance dans les autres régimes de base
- la date de naissance et la date d'effet, l'inaptitude et le handicap
- le conjoint, ses ressources et celles du ménage, pour la réversion
ecrit:
- la pension de base de Mayotte, son minimum et sa réversion
dates_qui_decident:
- liquidation.date_effet
# Depuis 2018, l'âge, la durée requise, le nombre d'années du salaire moyen et le
# coefficient de minoration se lisent à la génération (décret n° 2003-589, articles 2, 7,
# 9 et 11) ; la fiche de régime les porte par ses tables `mayotte_2018`,
# `mayotte_2026_01` et `mayotte_2026_09`, et la version qui les écrit est bornée à la
# date d'effet.
