  nee_de: JORFTEXT000054456323
  bornes:
    liquidation.date_effet: [2028-01-01, null]
  contenu:
    droit: >-
      l'ordonnance n° 2002-411 est abrogée et le code de la sécurité sociale s'applique à
      Mayotte, au SMIC et au plafond de Mayotte (L. 759-1) ; « Pour l'ouverture du droit
      et pour le calcul des pensions de vieillesse des assurés justifiant d'une durée
      minimale d'assurance [...] dans le régime mentionné à l'article 5 de l'ordonnance
      n° 2002-411 [...] ou ayant été affiliés exclusivement à ce même régime, prenant
      effet avant le 1er janvier 2035 », L. 161-17-2 et L. 161-17-3 s'appliquent avec
      l'âge et la durée « fixés par décret » par génération, 172 trimestres à compter de
      la génération 1973 (L. 759-22, jusqu'au 31 mars 2036) ; le régime général reprend
      les périodes et les salaires portés au compte avant 2028 (ordonnance, article 19,
      selon son rapport)
  exemples: aucun trouvé
approximations:
- version: decret_de_1987
  ecart: >-
    La fiche de régime dit que « La formule de la pension n'est pas dans l'index » et lui
    prête celle du régime général : 50 % pour 120 trimestres, dix meilleures années,
    2,5 % de décote. Le décret n° 87-175 l'écrit : 1,5 % par année, 150 trimestres au
    plus, sur les cinq meilleures années, sans minoration, et un minimum de 22,5 % du
    SMIG annuel avec soixante trimestres.
  effet: >-
    non mesuré ; les pensions de Mayotte liquidées de 1987 à 2002, sur quinze ans au
    plus de carrière dans le régime : le droit sert 1,5 % par année quand la fiche sert
    1,67 % par année au taux plein et décote au-dessous
- version: duree_a_la_generation
  ecart: >-
    Le salaire annuel moyen se calcule sur seize à vingt-quatre années pour les
    générations 1956 à 1964, quand la fiche de régime en prend vingt-cinq depuis 2003.
  effet: >-
    non mesuré ; les assurés nés avant 1965 liquidant de 2018 à 2027, dont le salaire
    moyen simulé compte jusqu'à neuf années faibles de trop
- version: [ordonnance_de_2002, duree_a_la_generation]
  ecart: >-
    Les trimestres se valident au SMIG puis au SMIC de Mayotte, que le dépôt n'a pas en
    série : la fiche de régime valide au SMIC national ; et le taux et le plafond de la
    caisse sont ceux du régime général.
  effet: la fiche valide moins vite que le droit ; la cotisation est celle du régime général
- version: code_de_la_securite_sociale_2028
  ecart: >-
    La fiche de régime prolonge le régime de Mayotte après 2027 ; le droit le fond dans
    le régime général au 1er janvier 2028, aux âges et durées que des décrets doivent
    fixer, et l'ordonnance étend aussi le régime complémentaire des indépendants à
    compter de 2028.
  effet: >-
    non mesuré ; les pensions prenant effet depuis 2028, dont les paramètres de
    convergence ne sont pas encore fixés
sources:
  lu_le: 2026-10-14
  prochaine_relecture: 2027-04-14
  a_relire:
  - >-
    Lire les décrets d'application de l'ordonnance n° 2026-647 dès leur parution : l'âge
    et la durée de L. 759-22 pour les générations d'avant 1970 et 1973, et l'article 19
    de l'ordonnance (reprise des périodes d'avant 2028), que l'index ne porte que par le
    rapport au Président de la République.
  - >-
    Relever le SMIG puis le SMIC de Mayotte au 1er janvier de chaque année depuis 1987,
    et le plafond de la caisse, pour valider les trimestres au droit.
  - >-
    Lire le chapitre III du décret n° 2003-589 (articles 31 et suivants), qui adapte le
    revenu annuel moyen des non-salariés, et dire s'ils méritent un statut.
  lectures:
  - type: legifrance
    reference: >-
      décret n° 87-175, articles 1er à 19 ; ordonnance n° 2002-411, articles 5 à 14 et
      23-4, toutes leurs rédactions ; décret n° 2003-589, articles 2, 3, 7 à 11, 15 à 17,
      toutes leurs rédactions ; code de la sécurité sociale, L. 759-1 à L. 759-27 dans
      leur rédaction du 1er janvier 2028 : index LEGI du dépôt, à jour au 13 octobre
      2026
    date: 2026-10-14
  - type: jorf
    reference: >-
      ordonnance n° 2026-647 du 22 juillet 2026 et son rapport au Président de la
      République : index JORF du dépôt
    date: 2026-10-14
reformes: []
code:
  moteur: >-
    une fiche de régime en annuités, une période par réforme, l'âge, la durée et la
    minoration lus à la génération par les tables `mayotte_2018`, `mayotte_2026_01` et
    `mayotte_2026_09`
  python: >-
    donnees/regimes.py : CatalogueRegimes ; droit/liquider.py : liquider_chaque_regime
  javascript: >-
    moteur/js/regimes.js : CatalogueRegimes ; moteur/js/droit/liquider.js :
    liquiderChaqueRegime
  parametres: >-
    regimes/cssm_mayotte.yaml : taux_plein, duree_requise_trimestres, salaire_reference,
    decote_par_trimestre ; legislation/ages_regimes.csv,
    legislation/duree_requise_regimes_speciaux.csv
  tests: >-
    tests/temoins/simulations.json, les carrières du statut salarie_mayotte, que le
    portage rejoue
historique:
- >-
  2026-10-14 — écrite à l'étape 2 de l'action 145 : le régime de Mayotte n'avait que la
  fiche générique de liquidation. Le décret n° 87-175, que la fiche de régime disait
  sans formule, l'écrit ; l'ordonnance n° 2026-647 fond le régime dans le code de la
  sécurité sociale en 2028. Aucun chiffre ne change.
effet: >-
  Les salariés de Mayotte : leur pension est simulée au droit depuis 2003, à leur
  salaire moyen près pour les nés avant 1965 ; celles de 1987 à 2002 le sont à la
  formule du régime général et non à celle du décret.
