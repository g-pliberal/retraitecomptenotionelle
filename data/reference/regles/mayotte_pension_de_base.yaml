  contenu:
    ouverture: >-
      « une pension de retraite à l'assuré qui en demande la liquidation à partir de
      l'âge prévu au premier alinéa de l'article L. 351-1 », soixante ans, et qui
      justifie d'une durée minimale d'assurance (ordonnance, article 6) ; à titre
      transitoire, cinquante-cinq ans pour les pensions de 2003 à 2005, un an de plus
      chaque année jusqu'à soixante ans en 2010 (décret, article 2)
    calcul: >-
      « le salaire annuel moyen déterminé à partir des vingt-cinq meilleurs salaires
      annuels », ou de toute la carrière sous vingt-cinq années (décret, article 7) ; le
      taux plein de 50 % demande 160 trimestres, « pour les pensions prenant effet en
      2003, [...] 64 trimestres, puis, chaque année, cette durée est augmentée de quatre
      trimestres » (article 9) ; sinon, « un coefficient de minoration » de 2,5 % par
      trimestre manquant ou séparant l'âge du taux plein, « Le plus petit de ces nombres
      est pris en considération » (article 11)
    trimestres: >-
      autant de trimestres que le salaire soumis à retenue représente de fois « le
      montant du salaire minimum garanti en vigueur à Mayotte au 1er janvier de l'année
      considérée, calculé sur la base de 200 heures », quatre par an au plus (décret,
      article 8) ; 150 heures « pour les périodes postérieures au 31 décembre 2016 »
      (rédaction du 26 septembre 2016)
    plafond: >-
      les salaires « reportés au compte de l'assuré dans la limite du plafond annuel de
      cotisations » (décret, article 7), celui sur lequel l'ordonnance assied les
      cotisations (article 19), puis le « plafond de cotisations de sécurité sociale à
      Mayotte » (ordonnance n° 96-1122, article 28-1, depuis 2012) : « 825 Euros par
      mois », revalorisé comme le salaire minimum garanti de Mayotte « majoré de trois
      points », pour les rémunérations de 2003 (décret, article 21), puis « 1 070 euros
      par mois pour les rémunérations ou gains versés à compter du 1er janvier 2011 »,
      revalorisé comme le plafond de la métropole « majoré de cinq points et un
      dixième »
