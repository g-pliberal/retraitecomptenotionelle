  nee_de: LEGIARTI000006770149
  bornes:
    liquidation.date_effet: [null, 2003-01-01]
  contenu:
    creation: >-
      le régime naît le 1er janvier 1987 (article 1er) : aucune période d'avant n'est au
      compte, et la borne basse ouverte ne sert qu'à couvrir toutes les dates
    ouverture: >-
      « La caisse de prévoyance sociale sert une pension d'ancienneté aux assurés
      réunissant 150 trimestres d'assurance à compter de l'âge de soixante ans », et une
      pension proportionnelle à soixante-cinq ans avec quarante trimestres (article 2) ;
      « à titre transitoire, l'âge [...] est abaissé de cinq ans », la durée de la
      pension d'ancienneté est de 120 trimestres et celle de la pension proportionnelle
      de 20 (article 27, reproduit en tête des articles 2, 6 et 8) ; la femme qui a
      élevé un enfant neuf ans avant ses seize ans a une année de bonification par
      enfant, trois au plus (article 5)
    trimestres: >-
      autant de trimestres que le salaire soumis à retenue représente de fois 200 heures
      du salaire minimum interprofessionnel garanti de Mayotte au 1er janvier, quatre par
      an au plus (article 3)
    calcul: >-
      « La pension d'ancienneté et la pension proportionnelle sont calculées sur la base
      du salaire annuel moyen des cinq meilleures années civiles d'assurance », plafonné
      au plafond fixé par arrêté préfectoral (article 9), au taux de « 1,5 p. 100 du
      salaire annuel moyen [...] par année civile liquidable » (article 11), « La durée
      maximum d'assurance susceptible d'être prise en compte [...] est de 150
      trimestres » (article 8) : 56,25 % au plus ; aucune minoration n'est écrite
    minimum: >-
      avec soixante trimestres au moins, pas moins de « 22,5 p. 100 de la valeur annuelle
      du salaire minimum interprofessionnel garanti » de Mayotte (article 12)
    reversion: >-
      la veuve de cinquante-cinq ans (cinquante à titre transitoire), mariée deux ans
      avant le décès, reçoit 50 % de la pension du mari (article 13), partagée par
      familles quand le salarié n'était pas marié sous le code civil (article 15) ;
      chaque orphelin de moins de seize ans, 10 % (article 14)
  exemples: aucun trouvé
