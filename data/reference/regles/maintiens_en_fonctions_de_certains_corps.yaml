historique:
- >-
  2026-10-10 — née avec l'action 151, étape 2 : les exceptions à la limite d'âge qui ne
  tiennent qu'à un corps ou à une fonction, que le simulateur ne connaît pas.
effet: >-
  Les membres de ces corps, que le simulateur ne distingue pas : il les simule comme
  tout fonctionnaire de l'État, sans limite d'âge. Un professeur au Collège de France peut
  servir jusqu'à soixante-treize ans, un magistrat jusqu'à soixante-dix, au-delà du
  plafond commun des sédentaires partis avant le 14 juin 2023.
