  contenu:
    hauts_magistrats: >-
      soixante-huit ans pour le vice-président du Conseil d'État, le premier président et le
      procureur général de la Cour des comptes (loi n° 84-834, article 1er, depuis 1984)
    conseil_d_etat_et_cour_des_comptes: >-
      maintien en activité, sur demande, jusqu'à soixante-huit ans des membres du Conseil
      d'État, des magistrats de la Cour des comptes et des inspecteurs généraux des
      finances (loi n° 86-1304, article 1er), qui « conservent la rémunération afférente aux
      grade, classe et échelon qu'ils détenaient » (article 4, jusqu'au 14 juin 2023) ;
      depuis, jusqu'à l'âge du « cinquième alinéa de l'article L. 556-1 », soixante-dix ans,
      pour exercer les fonctions de conseiller d'État ou de premier conseiller (code de
      justice administrative, L. 133-7-1 et L. 233-7)
    magistrats_judiciaires: >-
      ceux de la Cour de cassation, des cours d'appel et des tribunaux, à leur limite d'âge,
      « sur leur demande, maintenus en activité en surnombre » jusqu'à soixante-huit ans
      (ordonnance n° 58-1270, article 76-1-1, depuis le 12 novembre 2010), soixante-dix ans
      depuis le 22 novembre 2023
    enseignement_superieur: >-
      limite de soixante-cinq ans (loi n° 84-834, article 3), soixante-sept depuis le 1er
      juillet 2011 ; soixante-dix ans au Collège de France, soixante-treize depuis le 27
      décembre 2020 ; à la limite, « maintenus en activité, en surnombre, jusqu'au 31 août
      suivant la date à laquelle ils atteignent l'âge de soixante-huit ans » (L. 952-10,
      2011), « pour une durée d'un an » depuis le 1er janvier 2022 ; « restent en fonctions
      jusqu'au 31 août » quand la limite tombe en cours d'année universitaire
    enseignants: >-
      depuis le 14 juin 2023, l'enseignant du premier ou du second degré, le personnel
      d'inspection et le maître du privé sous contrat qui atteignent la limite d'âge en
      cours d'année scolaire « restent en fonction à leur demande, si les besoins du
      service le justifient, jusqu'à la fin de l'année scolaire » (L. 911-9 du code de
      l'éducation)
    emplois_superieurs: >-
      le fonctionnaire qui occupe à sa limite d'âge un emploi supérieur de l'article 25 de
      la loi n° 84-16 peut y être maintenu « pour une durée maximale de deux ans », d'une
      année de plus pour les emplois de la défense des intérêts fondamentaux de la nation
      depuis 2016, sa radiation et sa pension « différées à la date de cessation de leur
      prolongation d'activité » (loi n° 84-834, article 3, de 2011 à 2022)
    emplois_fonctionnels_territoriaux: >-
      le fonctionnaire ou le contractuel recruté directement sur un emploi fonctionnel
      d'une collectivité peut être maintenu « jusqu'au renouvellement de l'assemblée
      délibérante », si celui-ci intervient dans les dix-huit mois jusqu'en 2012, sa
      pension liquidée à la cessation de ses fonctions (loi n° 84-834, article 7-1, de 2007
      à 2022)
  exemples: aucun trouvé
