  a_relire:
  - >-
    Où les articles 3 et 7-1 de la loi n° 84-834, abrogés le 1er mars 2022, ont été
    codifiés, et ce qu'ils sont devenus ; l'article 76 de l'ordonnance n° 58-1270, qui fixe
    la limite des magistrats judiciaires, et les articles 1er et 2 de la loi n° 86-1304
    dans leur lettre.
  - >-
    La saisie ne porte ni le corps ni la fonction : ces maintiens restent hors du modèle
    tant que l'étape 3 n'ajoute pas un statut ou une question qui les nomme.
