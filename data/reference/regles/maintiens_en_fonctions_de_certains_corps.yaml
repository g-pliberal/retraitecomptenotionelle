schema_version: 1
id: maintiens_en_fonctions_de_certains_corps
intitule: >-
  Des corps ont leur propre limite d'âge ou leur propre maintien au-delà : les plus hauts
  magistrats administratifs et financiers, les membres du Conseil d'État et de la Cour
  des comptes, les magistrats judiciaires, maintenus en surnombre jusqu'à soixante-huit
  puis soixante-dix ans ; les professeurs de l'enseignement supérieur, maintenus en
  surnombre, et ceux du Collège de France, à soixante-dix puis soixante-treize ans ; les
  enseignants, jusqu'à la fin de l'année scolaire ; les emplois supérieurs de l'État et
  les emplois fonctionnels des collectivités, quelques mois ou années de plus.
domaine: age
regimes: [fonction_publique_etat, cnracl]
etape: preparer_la_chronologie
face: droit
etat: pas_encore_modelisee
lit:
- le corps, l'emploi ou la fonction de l'assuré à sa limite d'âge, que la saisie ne porte
  pas
ecrit:
- la limite d'âge du corps, ou la date où le maintien finit, que la radiation des cadres
  suit
dates_qui_decident:
