    url: https://www.msa.fr/lfp/documents/11566/41428048/Bar%C3%A8me+des+cotisations+et+contributions+sociales+des+non+salari%C3%A9s+agricoles+2026
    date: 2026-11-12
code:
  moteur: >-
    `seconde_part_de_rco` lit la version de l'année de la cotisation et rend la seconde
    part d'une ligne de chef d'exploitation : le taux, affine par morceaux entre les
    seuils de la version (`seuils_en_plafonds`, `taux_aux_seuils`), de zéro à l'origine,
    constant au-delà du dernier, appliqué à l'assiette d'avant le minimum ; le plafond
    est celui des mois de la ligne. `acquerir` en tire les points, `points_maximum` × la
    part / (le repère × `taux_cotisation_retraite`), qu'il ajoute à ceux de la première
    part ; `ConstructeurCompte._cotisation_ligne` l'ajoute à la cotisation que le compte
    du droit en vigueur reçoit. Le régime fusionné de la proposition, après la bascule,
    ne la prélève pas.
  python: >-
    droit/acquerir.py : seconde_part_de_rco, acquerir ; moteur/compte.py :
    ConstructeurCompte._cotisation_ligne ; scenarios/actuel.py : FichesDatees
  javascript: >-
    moteur/js/droit/acquerir.js : secondePartDeRco, acquerir ; moteur/js/compte.js :
    ConstructeurCompte._cotisationLigne ; moteur/js/regimes.js : FichesDatees
  parametres: >-
    contenu.parametres de chaque version : existe, seuils_en_plafonds, taux_aux_seuils ;
    regimes/msa_rco.yaml : assiette_repere_smic, points_maximum, taux_cotisation_retraite
  tests:
  - >-
    tests/test_simulateur.py, test_la_cotisation_de_rco_du_chef_a_deux_parts_depuis_2026,
    cinq revenus posés à la main, un par pente du taux, la cotisation au compte et les
    points au scénario 1, dans les deux moteurs ;
    test_la_seconde_part_de_rco_ne_touche_ni_les_annees_d_avant_ni_le_collaborateur
