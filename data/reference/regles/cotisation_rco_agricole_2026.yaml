schema_version: 1
id: cotisation_rco_agricole_2026
intitule: >-
  Retraite complémentaire obligatoire du chef d'exploitation agricole depuis 2026 : sa
  cotisation « est constituée de deux parts », 4 % de l'assiette relevée à 1 820 SMIC et
  une part sur l'assiette au taux qui croît avec elle, de 0 à 3 % selon ce qu'elle
  représente du plafond de la sécurité sociale ; les points sont ceux de « la cotisation
  acquittée », P = C / [(1 820 SMIC × T) / N], si bien que la seconde part en achète ;
  avant 2026, une seule part et N points par 1 820 SMIC d'assiette, hors de cette fiche.
domaine: cotisations
regimes: [msa_rco]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- >-
  l'année de la cotisation, qui choisit la rédaction des articles D. 732-165 et D. 732-155
  du code rural, et le plafond de la sécurité sociale de cette année
- >-
  l'assiette de la cotisation du chef d'exploitation, avant qu'elle soit relevée au
  minimum de 1 820 SMIC, que le modèle prend pour le revenu de la ligne
- >-
  le statut de la ligne : le collaborateur et l'aide familial, au forfait, n'ont pas de
  seconde part
ecrit:
- >-
  la seconde part de la cotisation de l'année, que le compte du droit en vigueur reçoit
  avec la première (`ConstructeurCompte._cotisation_ligne`)
- >-
  les points que cette part achète, 133 × la part / (1 820 SMIC × 4 %), que le scénario 1
  ajoute à ceux de la première (`acquerir`)
dates_qui_decident:
- revenu.annee
versions:
- id: une_part_jusqu_en_2025
  statut: lue
  textes:
  - id: LEGIARTI000034578860
    article: code rural et de la pêche maritime, D. 732-155, rédaction du 5 mai 2017 au 6 juillet 2024
    en_vigueur: 2017-05-05
    citation: >-
      « 2° Lorsque l'assiette des cotisations mentionnée au premier alinéa de l'article
      L. 732-59 est supérieure à l'assiette minimale susmentionnée, le nombre annuel de
      points porté au compte de l'assuré est calculé selon la formule suivante : P = N x
