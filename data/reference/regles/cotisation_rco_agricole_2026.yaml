  a_relire:
  - >-
    Comment la MSA arrondit les points de l'année, et ce qu'elle porte au compte du chef
    l'année cotisée au prorata (son décès, R. 731-83) depuis que les points se tirent de
    la cotisation acquittée : ni le barème de 2026 ni la page « RCO : comment est-elle
    calculée ? », qui s'en tient aux cent points d'avant 2017, ne le disent.
  - >-
    Les taux de cotisation de la RCO peuvent être arrêtés par les ministres sur
    proposition de la caisse centrale, dans un plan triennal (L. 732-60-1, L. 732-59,
    dernier alinéa) : à chaque relecture, chercher au Journal officiel un arrêté ou un
    décret qui changerait ceux de D. 732-165.
