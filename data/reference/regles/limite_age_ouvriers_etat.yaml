- id: reforme_2023
  statut: lue
  textes:
  - {id: LEGIARTI000047633407, article: "décret n° 2004-1057, article 1er", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000023394391, article: "décret n° 2004-1057, article 3-1", en_vigueur: 2011-07-01}
  nee_de: LEGIARTI000047633407
  bornes:
