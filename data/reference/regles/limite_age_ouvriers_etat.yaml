schema_version: 1
id: limite_age_ouvriers_etat
intitule: >-
  L'ouvrier des établissements industriels de l'État est mis à la retraite à sa limite
  d'âge : soixante-cinq ans depuis le décret du 5 octobre 2004, atteints par paliers de
  six mois jusqu'en 2012, et soixante ans pour qui a quinze ans de travaux insalubres ;
  soixante-sept et soixante-deux ans depuis la loi de 2010, relevés comme ceux des
  fonctionnaires ; reculée pour enfants, prolongée pour carrière incomplète, et, depuis le
  1er septembre 2023, prolongée pour l'insalubre jusqu'à la limite des autres, ou
  maintenue sur autorisation jusqu'à soixante-dix ans, comme pour les fonctionnaires.
domaine: age
regimes: [fspoeie]
etape: preparer_la_chronologie
face: droit
etat: approchee
lit:
- le statut d'ouvrier de l'État, sédentaire (`ouvrier_etat`) ou d'un emploi insalubre
  (`ouvrier_etat_actif`)
- les naissances des enfants, pour le recul de droit
- la durée des services au FSPOEIE, pour la prolongation pour carrière incomplète
ecrit:
- la date de la radiation des contrôles par limite d'âge, d'où part la pension du
  FSPOEIE (`droit/limite_age.py`)
dates_qui_decident:
- age_atteint
versions:
- id: avant_2004
  statut: supposee
  hypothese: >-
    soixante ans pour tous, la limite que le décret de 2004 dit « inférieure » à
    soixante-cinq ans et qu'il relève, par six mois, à partir de soixante ans et demi en
    2004 (article 2), l'insalubre partant au même âge (article 3) ; les décrets qui
    l'appliquaient à chaque administration depuis 1953 (décret n° 2004-1057, article 4)
    ne sont pas lus
  fiabilite: faible
  textes: []
  bornes:
    age_atteint: [null, 2004-10-07]
  contenu:
    parametres:
      limites: {sedentaire: 60, active: 60}
      exceptions: []
    droit: >-
      les limites d'âge « des personnels ouvriers affiliés au régime de retraite de la loi
      du 2 août 1949 », fixées par règlement, « ne pourront être inférieures à celles des
      fonctionnaires civils » (décret n° 53-711, article 3), puis par les décrets de 1954
      à 1960 que le décret n° 2004-1057 abroge
  exemples: aucun trouvé
- id: decret_de_2004
  statut: lue
  textes:
  - {id: LEGIARTI000006234954, article: "décret n° 2004-1057, article 1er", en_vigueur: 2004-10-07}
  - {id: LEGIARTI000006234955, article: "décret n° 2004-1057, article 2", en_vigueur: 2004-10-07}
  - {id: LEGIARTI000006234956, article: "décret n° 2004-1057, article 3", en_vigueur: 2004-10-07}
  - {id: LEGIARTI000006781476, article: "décret n° 2004-1056, article 7", en_vigueur: 2004-01-01}
  nee_de: LEGIARTI000006234954
  bornes:
    age_atteint: [2004-10-07, 2011-07-01]
  contenu:
    parametres:
      limites: {sedentaire: 60.5, active: 60}
      paliers:
      - {depuis: "2005-01-01", sedentaire: 61, active: 60}
      - {depuis: "2006-01-01", sedentaire: 61.5, active: 59}
      - {depuis: "2007-01-01", sedentaire: 62, active: 58.5}
      - {depuis: "2008-01-01", sedentaire: 62.5, active: 58}
      - {depuis: "2009-01-01", sedentaire: 63, active: 58}
      - {depuis: "2010-01-01", sedentaire: 63.5, active: 58.5}
      - {depuis: "2011-01-01", sedentaire: 64, active: 59}
      exceptions: [enfants, carriere_incomplete]
    droit: >-
      « Sous réserve des droits au recul des limites d'âge reconnus au titre des
      dispositions de la loi du 18 août 1936 [...], la limite d'âge des personnels relevant
      du régime des pensions des ouvriers des établissements industriels de l'Etat est
      fixée à soixante-cinq ans. Toutefois, pour le personnel ayant effectivement accompli
      quinze ans de services dans des emplois comportant des risques particuliers
      d'insalubrité, la limite d'âge est fixée à soixante ans » (article 1er) ; « A titre
      transitoire, pour le personnel dont la limite d'âge était inférieure », soixante ans
      et six mois jusqu'au 31 décembre 2004, six mois de plus chaque année, soixante-quatre
      ans et six mois jusqu'au 31 décembre 2012 (article 2), abaissés pour l'insalubre de
      six mois en 2004, d'un an en 2005, de deux ans et demi en 2006, de trois ans et demi
      en 2007, de quatre ans et demi en 2008, de cinq ans de 2009 à 2012 (article 3) ; « Les
      services accomplis postérieurement à la limite d'âge sont pris en compte dans les
      conditions prévues par l'article 1er-1 de la loi du 13 septembre 1984 » (décret n°
      2004-1056, article 7), la prolongation pour carrière incomplète
    transition: >-
      les paliers de l'article 2, que le modèle oppose à tout ouvrier, la saisie ne disant
      pas sa limite d'avant 2004
  exemples: aucun trouvé
