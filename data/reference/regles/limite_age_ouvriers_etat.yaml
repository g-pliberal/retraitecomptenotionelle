      jusqu'à la limite des autres, le maintien jusqu'à soixante-dix ans et son plafond
  exemples: aucun trouvé
presomptions:
  exceptions_a_la_limite_d_age: >-
    la prolongation pour carrière incomplète, celle de l'insalubre et le maintien jusqu'à
    soixante-dix ans, présumés demandés et accordés autant que le départ saisi les demande
sources:
  lu_le: 2026-10-16
  prochaine_relecture: 2027-10-16
  a_relire:
  - >-
    La limite des ouvriers avant le 7 octobre 2004 : les décrets n° 54-1181 à 54-1184,
    56-870, 56-871, 57-288 et 60-416, et l'article 15 bis du décret n° 47-2097, que le
    décret n° 2004-1057 abroge (article 4). La version `avant_2004` suppose soixante ans.
  - >-
    Le personnel dont la limite était déjà de soixante-cinq ans en 2004, que les paliers de
    l'article 2 ne touchent pas : la saisie ne le distingue pas, et le modèle lui oppose les
    paliers.
  - >-
    La prolongation pour carrière incomplète compte les seuls services au FSPOEIE, comme
    celle des fonctionnaires compte les seuls services.
  lectures:
  - type: legifrance
    reference: >-
      décret n° 2004-1057, articles 1er (rédactions du 7 octobre 2004, du 1er juillet 2011
      et du 1er septembre 2023), 2, 3, 3-1 et 4 ; décret n° 2004-1056, article 7 ; décret n°
      53-711, article 3. Lus dans l'index LEGI du dépôt
    date: 2026-10-16
historique:
- >-
  2026-10-16 — née et appliquée, action 151, étape 4 : l'ouvrier de l'État dont le départ
  saisi passe sa limite est radié à la limite, reculée et prolongée par les exceptions qui
  s'appliquent, et sa pension du FSPOEIE en part, comme la décision du propriétaire du
  14 octobre 2026 le dit du fonctionnaire.
effet: >-
  Tout ouvrier de l'État dont le départ saisi passe sa limite — soixante-sept ans pour
  les générations nées depuis 1955, soixante-deux pour l'insalubre, et moins avant — est
  radié à la limite, prolongée jusqu'à soixante-dix ans depuis le 1er septembre 2023 pour
  qui n'est pas insalubre, et sa pension du FSPOEIE en part. Approchée : la limite d'avant
  2004 est supposée, et l'ouvrier dont la limite était déjà de soixante-cinq ans en 2004
  n'est pas distingué.
