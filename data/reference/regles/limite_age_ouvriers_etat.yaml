  contenu:
    parametres:
      limites_avant: {sedentaire: 65, active: 60}
      ecart_de_reference: 5
      marche:
      - {depuis: "2011-07-01", mois: 4}
      - {depuis: "2012-01-01", mois: 9}
      - {depuis: "2013-01-01", mois: 14}
      - {depuis: "2014-01-01", mois: 19}
      - {depuis: "2015-01-01", mois: 24}
