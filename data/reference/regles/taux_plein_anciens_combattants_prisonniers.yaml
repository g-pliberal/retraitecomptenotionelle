    equivalent: >-
      parameters/.../regime_general_cnav/aad.yaml:246-262, au commit 1c45423 : le taux
      plein à soixante ans à tout ancien combattant dès 1975
    confrontation: aucune exécutée ; son écart est au registre
historique:
- >-
  2026-10-08 — écrite à l'étape 17 de l'action 138, sur le point d'OpenFisca-France-Pension
  au registre (chantier 138.17) et la liste de la fiche decote_avant_1983.
effet: >-
  L'ancien prisonnier ou combattant qui n'a pas la durée requise reçoit le taux plein
  avant l'âge du taux plein, d'autant plus tôt que sa captivité et ses services de guerre
  ont été longs : de 1975 à 2011, dès soixante ans à cinquante-quatre mois ; depuis août
  2024, de soixante-six ans à l'âge légal.
