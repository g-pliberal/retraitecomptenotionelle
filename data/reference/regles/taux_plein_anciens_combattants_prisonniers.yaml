- id: pratique_de_la_caisse_depuis_2011
  statut: lue
  textes:
  - {id: LEGIARTI000006736530, article: D. 351-2, en_vigueur: 1985-12-21}
  - {id: LEGIARTI000047634554, article: D. 351-2, en_vigueur: 2023-09-01}
  - reference: >-
      circulaire Cnav n° 2024-29 du 30 octobre 2024, introduction, base de législation de
      la Cnav
    citation: >-
      « Bien que la loi n° 2010-1330 du 9 novembre 2010 ait relevé de 60 à 62 ans l'âge
      légal de départ à la retraite, l'article D.351-2 CSS n'a pas été modifié. En
      pratique, pour corriger cette discordance, il était ajouté à chaque âge de départ
      AC/PG prévu à l'article D351-2 CSS deux années de plus (exemple 62 ans au lieu de 60
      ans pour ceux dont la durée de captivité et des services militaires en temps de
      guerre a été d'au moins cinquante-quatre mois […]) »
  nee_de: LEGIARTI000006736530
  bornes:
    liquidation.date_effet: [2011-07-01, 2024-07-08]
  contenu:
    droit: >-
      les âges de D. 351-2, que le décret de 2023 ne change pas, deux ans plus tard, comme
      l'âge légal ; le modèle ajoute l'écart de l'âge légal de la génération à soixante
      ans, deux ans au plus : rien aux générations d'avant juillet 1951, deux ans dès 1955
    beneficiaire: l'ancien prisonnier de guerre ou l'ancien combattant titulaire de la carte
    parametres:
      existe: true
      regimes: [regime_general, msa_salaries, cancava, organic, rsi]
