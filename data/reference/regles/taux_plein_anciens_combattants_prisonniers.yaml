approximations:
- version: [premiere_annee_1974, decret_du_23_janvier_1974, article_d_351_2, pratique_de_la_caisse_depuis_2011, decret_du_7_juillet_2024]
  ecart: >-
    L'ancien prisonnier de guerre évadé après six mois de captivité, ou rapatrié pour
    maladie, a le taux plein à l'âge du dernier palier quelle que soit sa durée : la
    saisie ne le distingue pas, et le modèle lui applique le palier de ses mois.
  effet: non mesuré
- version: [pratique_de_la_caisse_depuis_2011]
  ecart: >-
    La circulaire n° 2024-29 dit « deux années de plus », sans dire ce que recevaient les
    générations de 1951 à 1954, dont l'âge légal montait par mois : le modèle leur ajoute
    l'écart de leur âge légal à soixante ans.
  effet: non mesuré ; les seuls anciens combattants de ces générations
- version: [premiere_annee_1974, decret_du_23_janvier_1974, article_d_351_2, pratique_de_la_caisse_depuis_2011, decret_du_7_juillet_2024]
  ecart: >-
    Le modèle sert la règle du régime général aux salariés agricoles (décret n° 74-427), aux
    artisans et aux commerçants (décrets n° 74-432 et 74-433, puis D. 634-4) aux mêmes
    dates, que leurs textes ne sont pas lus.
  effet: non mesuré
