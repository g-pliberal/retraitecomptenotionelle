  exemples: aucun trouvé
- id: decret_du_7_juillet_2024
  statut: lue
  textes:
  - {id: LEGIARTI000049917724, article: D. 351-2, en_vigueur: 2024-07-09}
  - {id: LEGIARTI000051289852, article: L. 351-8, en_vigueur: 2025-02-28}
  nee_de: LEGIARTI000049917724
  bornes:
    liquidation.date_effet: [2024-07-08, null]
  contenu:
    droit: >-
      le taux plein « lorsque, sur leur demande, leur pension est liquidée avant l'âge
      prévu au 1° de l'article L. 351-8 et à partir de : 1°) L'âge prévu au 1° de l'article
