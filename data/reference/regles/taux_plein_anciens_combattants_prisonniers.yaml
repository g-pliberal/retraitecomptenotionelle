schema_version: 1
id: taux_plein_anciens_combattants_prisonniers
intitule: >-
  L'ancien prisonnier de guerre, ou l'ancien combattant titulaire de la carte du
  combattant, a le taux plein quelle que soit sa durée d'assurance à un âge qui descend
  avec la durée de sa captivité et de ses services militaires en temps de guerre
  (L. 351-8, 5° ; D. 351-2) : de soixante-quatre ans pour six à dix-sept mois à soixante
  ans pour cinquante-quatre mois depuis 1974, deux ans de plus dans la pratique de la
  caisse depuis le recul de l'âge légal de 2010, et, depuis le 8 juillet 2024, de
  soixante-six ans à l'âge légal.
domaine: decote_surcote
regimes: [regime_general, msa_salaries, cancava, organic, rsi]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- les mois de captivité et de services militaires en temps de guerre que la personne
  déclare (titre ancien_combattant_ou_prisonnier)
- l'âge à la date d'effet de la pension, la génération, son âge légal et l'âge du 1° de
  L. 351-8
- liquidation.date_effet
ecrit:
- le taux plein du régime, sans décote, que « liquider chaque régime » applique, celui
  que le minimum contributif demande et celui que les complémentaires suivent
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/categories.py, `age_des_anciens_combattants`, et son jumeau)
# lit : `existe` ; `regimes` ; `paliers`, chacun dès `des_mois` de captivité et
# de services de guerre, l'âge du taux plein — un nombre ou
# `age_legal_par_generation` (`age`), ce qu'il retranche à l'âge du 1° de L. 351-8
# (`avant_l_age_du_taux_plein`), et les générations dès lesquelles c'est l'âge
# légal (`age_legal_des_la_generation`) — ; `age_minimum`, sous lequel aucun
# palier ne descend ; `decalage_age_legal`, ce que la caisse ajoute à chaque âge,
# l'écart de l'âge légal à soixante ans, `au_plus` deux ans.
versions:
- id: avant_la_loi_du_21_novembre_1973
  statut: supposee
  hypothese: >-
    la loi n° 73-1051 et le décret n° 74-54 créent le droit pour les « prestations
    prenant effet au 1er janvier 1974 ou postérieurement » (circulaire Cnav n° 20/74) :
    rien avant
  fiabilite: haute
  bornes:
    liquidation.date_effet: [null, 1974-01-01]
  contenu:
    droit: aucun taux plein propre aux anciens combattants et prisonniers de guerre
    parametres:
      existe: false
  exemples: aucun trouvé
- id: premiere_annee_1974
  statut: lue
  textes:
  - id: JORFTEXT000000322528
    reference: >-
      loi n° 73-1051 du 21 novembre 1973 permettant aux anciens combattants et aux
      anciens prisonniers de guerre de bénéficier, entre soixante et soixante-cinq ans,
      d'une pension de retraite calculée sur le taux de soixante-cinq ans, dont l'index
      JORF ne garde que la notice
    publie_le: 1973-11-22
  - id: JORFTEXT000000337146
    reference: >-
      décret n° 74-54 du 23 janvier 1974 fixant les modalités d'application de la loi n°
      73-1051, dont l'index JORF ne garde que la notice
    publie_le: 1974-01-24
  - {id: LEGIARTI000006762026, article: 1, en_vigueur: 1975-01-05}
  nee_de: JORFTEXT000000322528
  bornes:
    liquidation.date_effet: [1974-01-01, 1975-01-01]
  contenu:
    droit: >-
      « La pension accordée aux anciens combattants et anciens prisonniers de guerre sur
      justification de leur durée de captivité et de services militaires ne peut être
      liquidée au taux de 50 p. 100 […] que si les intéressés ont atteint, à la date
      d'entrée en jouissance de leur pension, l'âge de : Soixante-trois ans si l'entrée en
      jouissance se situe en 1974 » (décret n° 74-54, article 1er, II)
    beneficiaire: l'ancien prisonnier de guerre ou l'ancien combattant titulaire de la carte
    parametres:
      existe: true
      regimes: [regime_general, msa_salaries, cancava, organic, rsi]
      paliers:
      - {des_mois: 6, age: 64}
      - {des_mois: 18, age: 63}
      - {des_mois: 30, age: 62}
      - {des_mois: 42, age: 61}
      - {des_mois: 54, age: 60}
      age_minimum: 63
  exemples: aucun trouvé
- id: decret_du_23_janvier_1974
  statut: lue
  textes:
  - {id: LEGIARTI000006762026, article: 1, en_vigueur: 1975-01-05}
  nee_de: LEGIARTI000006762026
  bornes:
    liquidation.date_effet: [1975-01-01, 1985-12-21]
  contenu:
    droit: >-
      « La pension des assurés justifiant d'au moins trente-sept ans et demi d'assurance
      qui sont anciens combattants titulaires de la carte du combattant ou qui ont été
      détenus comme prisonniers de guerre est égale à 50 p. 100 du salaire de base
      lorsqu'elle est liquidée avant l'âge de soixante-cinq ans et à partir de :
      Soixante-quatre ans pour ceux dont la durée de captivité et des services militaires
      en temps de guerre a été de six à dix-sept mois ; Soixante-trois ans […] de
      dix-huit à vingt-neuf mois ; Soixante-deux ans […] de trente à quarante et un mois ;
      Soixante et un ans […] de quarante-deux à cinquante-trois mois ; Soixante ans […]
      d'au moins cinquante-quatre mois et pour les anciens prisonniers de guerre évadés
      justifiant d'une captivité d'au moins six mois ou rapatriés pour maladie » ; «
      Soixante ans si l'entrée en jouissance se situe en 1975 ou postérieurement »
      (décret n° 74-54, article 1er)
    beneficiaire: l'ancien prisonnier de guerre ou l'ancien combattant titulaire de la carte
    parametres:
      existe: true
      regimes: [regime_general, msa_salaries, cancava, organic, rsi]
      paliers:
      - {des_mois: 6, age: 64}
      - {des_mois: 18, age: 63}
      - {des_mois: 30, age: 62}
      - {des_mois: 42, age: 61}
      - {des_mois: 54, age: 60}
  exemples: aucun trouvé
- id: article_d_351_2
