  contenu:
    droit: 50 % de la pension principale, que la retraite personnelle du survivant réduit
    beneficiaire: le conjoint survivant, et le conjoint divorcé non remarié
    conditions: >-
      soixante-cinq ans, soixante en cas d'inaptitude au travail ; deux ans de mariage
      à la date du décès, sauf enfant issu du mariage ; des ressources personnelles qui
      ne dépassent pas 2 080 fois le SMIC horaire, ses retraites exceptées
    parametres:
