    date: 2026-09-28
  - type: legifrance
    reference: >-
      D. 353-1 (six rédactions, de 52 % en 1985 à la rédaction du 1er janvier 2026),
      D. 353-1-1, D. 353-2, D. 353-3, D. 353-4, R. 353-1 (neuf rédactions), R. 353-1-1,
      R. 353-2, R. 353-6, R. 353-7 (quatre rédactions) ; décret n° 2004-858, article
      24 (trois rédactions) ; décret n° 2008-1509, article 2
    date: 2026-09-28
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 120/82 du 28 décembre 1982, § 11 : « Lorsqu'elle prend effet
      à compter du 1er décembre 1982, la pension de réversion est calculée au taux de
      52 % » ; le taux de la pension d'invalidité de veuve ou de veuf « porté de 50 à
      52 % »
    date: 1982-12-28
    url: https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_12082_28121982.aspx
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 3/95 du 5 janvier 1995 : le décret n° 94-1140 « porte de 52
