    url: https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_395_05011995.aspx
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 2005/17 du 11 avril 2005, réforme des pensions de réversion au
