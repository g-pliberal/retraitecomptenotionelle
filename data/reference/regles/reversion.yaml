      titre définitif lors du calcul de la 1re retraite de réversion » ; « Lorsque
      seule l'année du mariage est connue, la date présumée du mariage est le 31
      décembre de l'année » ; avant juillet 2004, l'ex-conjoint remarié ne l'avait
      que sous réserves ; le remariage du survivant ne retire rien au régime général
    date: 2025-10-24
    url: https://legislation.lassuranceretraite.fr/#/expose?file_leaf_ref=retraite_reversion_montant_existence_ex_conjoint_ex.aspx
  - type: circulaire_cnav
    reference: >-
      barème « Plafond de ressources pour la retraite de réversion »
      (retraite_reversion_plafond_ressource_bar), lu par l'API le 9 octobre 2026 : depuis
      le 1er juillet 2004, le plafond d'une personne seule et celui d'un couple,
      40 002,56 euros en 2026, 1,6 fois le premier ; de 2005 à 2026, le modèle les
      redonne au centime (tests/test_reversion.py) ; service-public.gouv.fr, fiche
      F13104, vérifiée le 1er janvier 2026 : « 40 002,56 € si vous vivez en couple »,
      et les revenus d'activité « pris en compte qu'à hauteur de 70 % de leur montant »
    date: 2026-01-01
    url: https://legislation.lassuranceretraite.fr/#/bareme?file_leaf_ref=retraite_reversion_plafond_ressource_bar.aspx
  - type: legifrance
    reference: >-
      lus le 9 octobre 2026 dans l'index LEGI : D. 355-1 (LEGIARTI000006736555,
      1985-2004) — la réversion se cumule avec les avantages personnels « dans la
      limite de 52 p. 100 du total de ces avantages et de la pension principale », qui
      « ne peut être inférieure à 73 p. 100 du montant maximum de la pension de
      vieillesse du régime général liquidée à 65 ans » ; l'article 90 du décret
      n° 45-179, rédactions de 1975 (« la moitié du total », 60 % puis 70 % du maximum
      de juillet 1977 à juin 1979) et de 1982 (52 % et 73 %) ; son article 91 (la
      limite divisée par le nombre des régimes) ; la loi n° 75-3, article 21 (« au 1er
      juillet 1974 ») ; le décret n° 72-1098, articles 1er et 5 (l'âge de soixante-cinq
      ans, soixante en cas d'inaptitude, abrogé au 1er janvier 1973 ; pour un décès
      antérieur, la réversion à cinquante-cinq ans, « au plus tôt à compter du 1er
      janvier 1973 ») ; R. 353-1, rédactions de 1985 et 1990 (les ressources
      appréciées « dans les conditions fixées par les articles R. 815-25 et suivants »)
    date: 2026-10-09
  - type: circulaire_cnav
    reference: >-
      exposés de la base de législation de la Cnav, lus le 9 octobre 2026 par son API :
      « Retraite de réversion cumulable » (24 octobre 2025) — les deux limites, la plus
      haute retenue, pas moins que la réversion « portée au minimum ou ramenée au
      maximum », la limite forfaitaire de 1974 à 2004, 52 % de 1982 à 2004, « non
      modifiée lors de l'augmentation du taux de la retraite de réversion à 54 % »,
      calculée sur la pension du défunt « sans être porté au minimum, ni ramené au
      maximum », les avantages et la limite divisés par le nombre des régimes ;
      « Condition de ressources » — avant juillet 2004, « Les avantages personnels de
      vieillesse ou d'invalidité du demandeur n'étaient pas retenus dans les
      ressources » ; « Montant - retraite de réversion », « Anciennes dispositions » —
      la majoration de 3,846 % au 1er janvier 1995, celle de 4 % au 1er décembre 1982
      « avant comparaison au minimum et après application éventuelle des majorations
      forfaitaires précédentes » ; barème « Limite forfaitaire de cumul pour la retraite
      de réversion », de 6 300 F au 1er juillet 1974 à 17 541,90 € en 2026
    date: 2025-10-24
    url: https://legislation.lassuranceretraite.fr/#/expose?file_leaf_ref=retraite_reversion_montant_retraite_reversion_cumulable_avant_2004_ex.aspx
