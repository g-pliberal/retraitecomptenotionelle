    Carriere.exConjoints ; moteur/js/chronologie.js : exConjoints, debutDuMenage ;
    moteur/js/droit/completer.js : completer ; moteur/js/droit/liquider.js :
    maximumDesPensions
  parametres: >-
    contenu.parametres de chaque version : taux, age_minimum, mariage_minimum_annees,
