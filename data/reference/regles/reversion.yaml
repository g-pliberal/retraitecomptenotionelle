    droit/reversion.py : reversion, _a_l_age, _mariage_dure, _part_du_minimum,
    _ressources_du_plafond, _majorer_les_petites_retraites, mois_de_mariage,
    _part_du_survivant, _remarie_avant, _admis_au_regime_general, _admis_ailleurs,
    _fin_au_remariage, _jusqu_au_remariage, _premiere_date_d_effet,
    _date_d_effet_du_regime_general, _cumuler, _majorations_ulterieures ;
    scenarios/actuel.py : Reversions ;
    echeancier.py : Echeancier._reverser, Echeancier._pensions_au_deces,
    Echeancier._pensions_eues_au_deces ; carriere.py : Carriere.arretee_au_deces,
    Carriere.ex_conjoints ; chronologie.py : ex_conjoints, debut_du_menage ;
    droit/completer.py : completer, la part du minimum contributif de chaque pension ;
    droit/liquider.py : maximum_des_pensions, et ce que la pension ramenée au maximum
    porte pour la réversion (PensionRegime.ecretement_du_maximum, surcote,
    coefficient_du_maximum)
  javascript: >-
