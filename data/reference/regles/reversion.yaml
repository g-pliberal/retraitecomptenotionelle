approximations:
- ecart: >-
    avant juillet 2004, les retraites personnelles du survivant, que le cumul de
    D. 355-1 retient et que ses ressources ne comptent plus, sont ses ressources
    déclarées hors de ses revenus d'activité ; la limite se compare une fois, à la
    date d'effet, aux montants de l'année du décès, et non à l'attribution du second
    avantage, qui peut la suivre ; ses retraites et la limite forfaitaire se divisent
    par le nombre de ses réversions de base que le modèle sert, sans celles des
    régimes qu'il ne porte pas ; la majoration pour enfants de ses retraites, que la
    limite comptait avant septembre 2003, n'est pas distinguée ; avant juillet 1974, la
    réversion complète sa retraite au lieu de s'y ajouter, dans chaque régime aligné,
    sa retraite divisée de même
  effet: >-
    la réversion d'avant 2004 d'un survivant qui a sa propre retraite : réduite, ou
    nulle, quand le total passe la limite ; non mesuré sur une population
- ecart: >-
    les majorations forfaitaires de 4 % au 1er décembre 1982 et de 3,846 % au 1er
    janvier 1995 (exposé de la Cnav) s'écrivent à leur date, hors du montant, sur la
    réversion calculée, portée au minimum et ramenée au maximum de la date d'effet,
    sans la réviser pour ressources ni pour cumul ; les majorations des retraites
    personnelles d'avant 1983 (1972, 1976, 1977, 1982, selon la durée de l'assuré),
    que la réversion suivait « dès lors que l'assuré décédé aurait pu en bénéficier »,
    ne sont pas portées
  effet: >-
    quelques pour cent de la réversion attribuée avant 1995, à partir de sa date ;
    non mesuré
- ecart: >-
    avant 1973, l'âge de soixante ans, au lieu de soixante-cinq, est celui du
    survivant « inapte au travail », que le modèle tient pour celui qui déclare son
    invalidité, au plus tôt le mois qui suit
  effet: non mesuré
- ecart: >-
    le maximum de la réversion se compare une fois, aux montants de l'année du décès,
    et non « à chaque revalorisation des retraites ou du montant maximum des
    retraites » (exposé de la Cnav) ; il se compte, comme le maximum des pensions, sur
    le plafond annuel de l'année, quand celui de la Cnav, de 1982 à 1996, est celui du
    semestre — au 31 décembre, celui du second, plus haut de 0,5 % (1995) à 3,6 %
    (1982) que la moyenne de l'année, d'après le barème de la Cnav ; il ne borne que
    la réversion du régime général, et celle que la liquidation unique fait liquider
    par lui, comme le maximum des pensions
  effet: >-
    non mesuré ; les seules réversions qui l'atteignent, celles des pensions que le
    maximum avait ramenées, de 1973 à 1990 surtout : moins 3,5 % en 1982 pour la veuve
    d'un cadre parti à soixante-dix ans en 1982, son maximum de 0,52 × 0,75 plafond
    compté sur le plafond moyen de l'année
- ecart: >-
    le minimum de réversion ne s'applique pas, depuis le 1er juillet 2012, à la
    réversion d'une pension inférieure « au minimum prévu à l'article L. 351-9 »
    (L. 353-1) — le seuil du versement forfaitaire unique, 175 francs par an au 1er
    juillet 1974 revalorisés (R. 351-26), et non le minimum contributif, que la fiche
    lisait jusqu'au 7 octobre 2026 ; le modèle, qui ne sert pas ce versement unique,
    sert alors le minimum, réduit en soixantièmes
  effet: >-
    quelques dizaines d'euros par an, pour un défunt qui n'avait qu'un ou deux
    trimestres
- ecart: >-
    sous la liquidation unique (Lura), le minimum lit la somme des durées des régimes
    qu'elle réunit, chacune plafonnée à quatre trimestres par année, et non leur somme
    plafonnée ; les durées de tous les régimes alignés se totalisent pour le prorata
    « même s'ils se superposent », comme le dit la Cnav
  effet: non mesuré
- ecart: >-
    le survivant est tenu pour avoir eu ou élevé les enfants que le défunt déclare
    (majoration de 10 %), pour avoir demandé toutes ses retraites, et ses ressources
    déclarées, hors de ses revenus d'activité, pour ses retraites personnelles, de base
    et complémentaires, à l'âge du taux plein (majoration de 11,1 %) ; la majoration de
    11,1 % d'une réversion dont
    la date d'effet précède 2010 n'est pas calculée, ni sa révision quand les
    retraites du survivant varient (R. 353-13)
  effet: non mesuré
- version: [avant_1982, taux_52, taux_54]
  ecart: >-
    les limites de cumul de la réversion avec la retraite personnelle du survivant
    (D. 355-1) ne sont pas appliquées ; l'enfant issu du mariage, qui lève la
    condition de durée, est tout enfant déclaré
  effet: non mesuré
- ecart: >-
    le ménage du survivant est celui qu'il déclare, sans date : le plafond du ménage
    s'applique dès la date d'effet, et la réversion n'est révisée ni quand il se
    forme ou se défait, ni quand les ressources varient (R. 353-1-1) ; elles se
    comparent sur l'année, et non sur les trois mois qui précèdent la date d'effet,
    les douze à défaut (R. 353-1), ce qui ne change rien à des ressources égales
    chaque mois ; les ressources du survivant et de son nouveau conjoint sont celles
    que la saisie déclare, comptées entières : le modèle n'en ôte ni ce que le droit
    de l'allocation supplémentaire exclut, ni la majoration pour enfants des
    retraites du survivant (lettre ministérielle n° 237 du 22 mars 2005)
  effet: non mesuré
- ecart: >-
    les montants sont ceux de l'année du décès — l'année courante pour un décès à
    venir, l'année du départ s'il la suit —, au SMIC horaire du 1er janvier de cette
    année, même quand l'âge requis reporte la date d'effet ; en 2004, la caisse
    prend celui du 1er juillet (circulaire Cnav n° 2005-17, § 145) : son plafond,
    15 828,80 euros, est 5,8 % au-dessus de celui du modèle, 14 955,20
  effet: >-
    non mesuré ; pour le plafond de 2004, 873,60 euros de ressources de plus sous le
    plafond, pour une réversion qui prend effet au second semestre
- ecart: >-
    la pension que l'assuré mort avant son départ eût obtenue se liquide au premier
    jour du trimestre civil de son décès, sous les règles de ce jour : la caisse
    prend celles de la date d'effet de la réversion pour les majorations de durée
    pour enfants, la surcote et le salaire annuel moyen des polypensionnés, et, pour
    un décès du 1er juillet 2004 au 30 juin 2011, le nombre d'années du salaire
    annuel moyen et la durée de référence de la génération qui avait soixante ans
    l'année du décès, quand le modèle prend toujours ceux de la génération du
    défunt (circulaire Cnav n° 2005-17, § 211 à 213 ; exposé « Retraite de l'assuré
    décédé ») ; une pension déjà servie au décès, avant le départ déclaré — la
    pension militaire, celle de l'ex-invalide, celle du fonctionnaire radié — s'y
    recalcule au décès au lieu d'être lue telle qu'elle était servie ; la page
    montre toujours la pension du départ déclaré, comme si l'assuré vivait
  effet: >-
    non mesuré ; pour un assuré né en 1960 et mort en 2006, la durée de référence de
    sa génération, 166 trimestres, au lieu des 156 de la caisse — 6 % de moins sur
    la pension que la réversion lit, quand sa durée n'atteint pas 156 —, et un
    salaire annuel moyen sur vingt-cinq années au lieu de vingt-trois
- ecart: >-
    le partage entre conjoints lit les précédents conjoints que la saisie déclare,
    deux au plus, tenus pour vivants au décès ; il se fige au décès, quand la caisse
    le fige « lors du calcul de la 1re retraite de réversion » et le refait au décès
    d'un ayant droit, dont la part « accroîtra » celle des autres (R. 353-4) ; la
    date d'un mariage dite par son année tombe au 1er janvier, quand la caisse la
    présume au 31 décembre (exposé « Existence d'ex-conjoint(s) ») ; avant le 19
    juillet 1978, l'ex-conjoint n'avait droit à rien, ou seulement après un divorce
    pour rupture de la vie commune, et le modèle partage déjà ; avant juillet 2004,
    l'enfant qui dispense un précédent mariage de ses deux ans est tout enfant
    déclaré ; la réversion des précédents conjoints eux-mêmes n'est pas calculée
  effet: >-
    non mesuré ; une date de mariage dite par l'année déplace jusqu'à onze mois la
    durée qui fait les parts
- ecart: >-
    l'union que le survivant forme après la date d'effet ne révise pas la réversion
    du régime général, qui compterait alors les ressources du ménage (R. 353-1-1),
    ni celle de la complémentaire des indépendants
  effet: non mesuré
presomptions:
  mariage_des_conjoints: >-
    la condition de durée de mariage d'avant juillet 2004, quand la date du mariage
    n'est pas déclarée
  ressources_du_survivant: >-
    le plafond de ressources, que le survivant qui ne déclare pas les siennes
    n'atteint que par ses réversions, ni son nouveau conjoint quand il vit en couple ;
    de même le plafond de la majoration de 11,1 %
  survivant_seul: >-
    le plafond d'une personne seule, quand la saisie ne dit pas que le survivant vit
    en couple
  reversion_demandee_dans_l_annee: >-
    la date d'effet, au premier jour du mois qui suit le décès, ou qui suit l'âge
    requis
  deces_apres_le_depart: >-
    la réversion que la page montre sans décès déclaré, pour un décès supposé juste
    après le départ, ou cette année pour qui est déjà parti
sources:
  lu_le: 2026-10-09
  prochaine_relecture: 2027-03-31
  lectures_divergentes:
  - >-
    R. 353-6, dans ses deux rédactions (LEGIARTI000006749413, 024113077), calcule la
    réversion « lorsque le pensionné ou le titulaire de droits à une pension décède »
    avant l'âge du taux plein sur la pension « qui aurait été allouée au de cujus au
    titre de l'inaptitude au travail » ; l'exposé de la Cnav ne l'applique qu'à
    l'assuré dont la retraite « n'est pas attribuée », et reverse au pensionné « le
    montant calculé » de sa retraite, décote comprise. Le modèle suit la caisse.
  - >-
    L'article 24 du décret n° 2004-858, dans la rédaction que l'index LEGI date du 24
    août 2005 (LEGIARTI000006781421), porte « 65 ans pour les pensions prenant effet
    au plus tard le 30 juin 2005 et 60 ans pour les pensions prenant effet au plus tard
    le 30 juin 2006 », quand la circulaire Cnav n° 2005/17 (§ 11) et la rédaction du
    30 décembre 2004 disent cinquante-cinq ans jusqu'au 30 juin 2005, puis cinquante-deux.
    Le modèle suit la circulaire ; la rédaction de 2005 reste à confronter au Journal
    officiel.
  a_relire:
  - >-
    Ouverte le 28 septembre 2026 avec le domaine de la réversion (docs/architecture.md,
    § 11) : la fiche, qui ne portait que son intitulé, est découpée en versions, lues
    dans l'index LEGI et dans les circulaires de la Cnav. Le moteur la lit depuis la
    deuxième étape du domaine, le même jour : la réversion du survivant d'un assuré
    décédé après son départ.
  - >-
    Ce que les versions ne portent pas encore : la réversion d'un assuré disparu
    (L. 353-2), la révision de la pension quand les ressources, le ménage ou les
    ayants droit changent (R. 353-1-1, R. 353-4), et la pension de vieillesse de veuve
    ou de veuf. Les limites de cumul d'avant juillet 2004 (D. 355-1), l'âge d'avant
    1973 et les majorations forfaitaires de 1982 et de 1995 sont portés depuis le 9
    octobre 2026, la majoration forfaitaire pour enfant à charge (L. 353-5) dans sa
    propre fiche, majoration_forfaitaire_reversion.
  - >-
    Avant le 1er juillet 1974, la réversion « ne se cumulait pas avec un avantage
    personnel » : l'exposé de la Cnav dit « avant le 01/01/1974 », quand la loi
    n° 75-3, qui ouvre le cumul, s'applique « au 1er juillet 1974 » (article 21), date
    du premier montant de la limite forfaitaire du barème. Le modèle suit la loi. Le
    même exposé date du 1er juillet 1979 la fin des 70 % du maximum des pensions,
    quand l'article 90 du décret n° 45-179 et le barème les mènent jusqu'en novembre
    1982 : le modèle lit le barème, que le récupérateur confronte au maximum.
  - >-
    La pension dont l'assuré « eût bénéficié » : mort avant son départ, celle qui lui
    aurait été allouée au titre de l'inaptitude au travail, au taux plein quel que soit
    son âge (R. 353-6), que le moteur sert depuis le 9 octobre 2026. Le texte nomme
    aussi « le pensionné » mort avant l'âge du taux plein, que la caisse reverse sur sa
    pension servie (lecture divergente) : à confronter à une circulaire qui le dise.
  - >-
    Le minimum de base : D. 353-1 n'écrit son montant que depuis le 1er janvier 2026
    (3 983,29 euros au 1er janvier 2025). Depuis le 7 octobre 2026, les montants de
    chaque année, de 1941 à 2026, sont ceux du barème de la Cnav, qui redonne celui
    de l'article (`legislation/minimum_reversion.csv`) ; ceux d'avant 2004 restent à
    confronter aux décrets du Journal officiel qu'il cite.
  - >-
    Le plancher de la majoration de 10 % : R. 353-2 la veut au moins « au dixième du
    montant minimum de la pension de réversion », que le modèle lit comme le minimum
    de cette réversion, soixantièmes faits ; l'exemple de la circulaire Cnav
    n° 2022-26 (§ 3.6), dont le minimum n'est pas dit, ne tranche pas.
