schema_version: 1
id: reversion
intitule: >-
  Pension de réversion du régime général et des régimes alignés (L. 353-1 du code de
  la sécurité sociale) : au conjoint, ou à l'ex-conjoint, de l'assuré décédé, un
  pourcentage de la pension dont celui-ci bénéficiait ou eût bénéficié — 50 %, puis
  52 % en décembre 1982, 54 % depuis 1995 —, à partir d'un âge et sous plafond de
  ressources, sans passer ce pourcentage du maximum des pensions, la surcote en sus ;
  réduite à due concurrence du dépassement depuis juillet 2004, majorée de 11,1 %
  depuis 2010 pour le survivant aux petites retraites.
domaine: reversion
regimes:
- regime_general
- msa_salaries
- organic
- cancava
- rsi
- assurances_sociales
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- conjoint.deces
- union.debut, d'un mariage ; ni le PACS ni le concubinage n'ouvrent la réversion
- union.fin, pour l'ex-conjoint divorcé ; les précédents conjoints de l'assuré, leur
  mariage, leur divorce et leur remariage, que le partage au prorata des mariages lit
- la naissance du survivant, qui dit son âge à la date d'effet
- les ressources du survivant, et ce qu'en rapporte son activité, abattu de 30 % à
  cinquante-cinq ans ; le reste, que le modèle tient pour ses retraites personnelles,
  que le cumul d'avant juillet 2004 retient hors de ses ressources (D. 355-1)
- l'invalidité qu'il déclare, qui le tient pour inapte avant 1973
- l'union où il vit après le décès — mariage, PACS ou concubinage —, le mois où elle
  commence, et les ressources de son nouveau conjoint, que le plafond du ménage
  compte avec les siennes quand elle est formée à la date d'effet
- la pension principale du défunt, servie ou dont il eût bénéficié à son décès — mort
  avant son départ, celle qu'il eût obtenue au premier jour du trimestre civil de son
  décès, sur la carrière de ce jour-là, sans décote
- ce que le maximum des pensions en a retiré, sa surcote et le coefficient de son
  ajournement d'avant 1983, et le maximum des pensions de l'année des montants
  (fiche pension_maximale_regime_general)
- les enfants issus du mariage, pour la condition de durée d'avant 2004
ecrit:
- la pension de réversion du survivant, dans le régime du défunt, et sa majoration
dates_qui_decident:
- liquidation.date_effet
- conjoint.deces
# Les versions forment un partage de ces deux dates (§ 4.1). La date d'effet
# de la réversion choisit le taux (décret n° 82-1035, décret n° 94-1140), la
# réforme de juillet 2004, l'âge requis de 2004 à 2008 et depuis 2009, la
# majoration de 2010 et les règles du minimum ; le décès, à partir de 2009,
# l'âge dérogatoire de cinquante et un ans qu'il garde au survivant d'un
# assuré décédé avant le 1er janvier 2009 (décret n° 2008-1509, article 2, II).
# `contenu.parametres` dit ce que le moteur lira : le taux, l'âge, la
# condition de durée de mariage, le traitement des ressources — condition
# d'ouverture avant juillet 2004, écrêtement depuis —, le plafond en heures de
# SMIC et son facteur pour le ménage, l'abattement des revenus d'activité du
# survivant et l'âge qui l'ouvre ; le minimum — sa durée, ses soixantièmes
# depuis décembre 1982, son prorata entre régimes alignés depuis juillet 2004 —,
# dont le montant de chaque année est dans `legislation/minimum_reversion.csv` ;
# les taux des deux majorations, celle de 11,1 % sous le plafond de
# `legislation/plafond_majoration_reversion.csv` ; les précédents conjoints qui
# partagent la réversion (`ex_conjoints`) : les non remariés avant juillet 2004,
# tous depuis. Le maximum de la réversion n'a pas
# de paramètre : c'est le taux de la version, appliqué au maximum des pensions que
# la fiche `pension_maximale_regime_general` fixe à la date d'effet de la réversion.
versions:
- id: avant_1973
  statut: supposee
  hypothese: >-
    l'âge de soixante-cinq ans, soixante en cas d'inaptitude au travail, est celui que
    le décret n° 72-1098 abroge au 1er janvier 1973 ; le taux de 50 % est celui que la
    circulaire Cnav n° 120/82 dit porté à 52 % au 1er décembre 1982 ; la durée de
    mariage et les ressources sont prêtées à ce texte d'avant la codification de
    1985, telles que R. 353-1 les codifie en 1985 ; la réversion ne se cumule pas
    avec une retraite personnelle, mais en complète le montant (exposé de la Cnav,
    « Retraite de réversion cumulable », d'après la circulaire ministérielle du 29
    juin 1949)
  fiabilite: moyenne
  textes:
