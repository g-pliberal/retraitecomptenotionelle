historique:
- >-
  Jusqu'au 28 septembre 2026, la fiche ne portait que son intitulé : « le modèle décrit
  une carrière, pas un ménage », et les 756 périodes de régime qui déclarent la
  réversion étaient une intention que nul code ne servait
  (legislation/avantages_non_contributifs.yaml).
- >-
  2026-09-28 — ouverte avec le domaine de la réversion, découpée en quatorze versions
  lues dans l'index LEGI et dans cinq circulaires de la Cnav.
- >-
  2026-09-28 — lue par le moteur, à la deuxième étape du domaine : le scénario 1
  liquide la réversion du conjoint que la saisie déclare, au décès de l'assuré après
  son départ, régime par régime.
- >-
  2026-10-05 — confrontée à Destinie 2, exécuté à part (action 142, étape 4) : la
  majoration de 10 % du survivant de trois enfants, que la fiche portait en paramètre
  sans la dire absente, rejoint les approximations.
- >-
  2026-10-07 — action 138, étape 4 : le moteur sert le minimum de D. 353-1, la
  majoration de 10 % du survivant de trois enfants et celle de 11,1 % ; le paramètre
  minimum_sous_minimum_contributif, qui lisait le « minimum prévu à l'article
  L. 351-9 » comme le minimum contributif, et que le moteur ne lisait pas, est
  retiré : c'est le seuil du versement forfaitaire unique.
- >-
  2026-10-07 — action 138, étape 4 : la réversion se calcule sur la pension du défunt
  sans le minimum contributif, que la Cnav laisse hors de la base « avant comparaison
  au minimum » ; la part du minimum dans chaque pension, menée au décès comme elle,
  est ôtée de la base, et l'approximation qui le déclarait est retirée.
- >-
  2026-10-09 — action 138, étape 4 : le maximum de la réversion, son taux du maximum
  des pensions « opposable à l'assuré décédé », la surcote en sus, sur la pension
  d'avant le maximum des pensions, que la Cnav mène entière ; l'approximation qui le
  déclarait absent est remplacée par ce qui reste du maximum : une comparaison par
  réversion, le plafond moyen de l'année.
- >-
  2026-10-09 — action 138, étape 4 : le plafond du ménage, 1,6 fois celui d'une
  personne seule, pour le survivant qui déclare vivre en couple, marié, pacsé ou en
  concubinage, ses ressources et celles de son nouveau conjoint comptées ensemble ;
  l'abattement de 30 % de ses revenus d'activité à cinquante-cinq ans, que la
  version abattement_2005, coupée dans reforme_2004 au 1er janvier 2005, ouvre ; la
  majoration de 11,1 % ne compte plus ces revenus pour des retraites. Avant juillet
  2004, les réversions des autres régimes de base ne comptent plus aux ressources,
  appréciées « sans tenir compte des avantages de réversion » (R. 353-1, rédactions
  de 1985 et de 1990) : le moteur les y comptait.
- >-
  2026-10-09 — action 138, étape 4 : la réversion d'un assuré mort avant son départ, sur
  la pension qu'il « eût obtenue » à son décès, que l'échéancier liquide sur la
  carrière arrêtée au trimestre civil qui précède le décès, au taux plein de
  l'inaptitude quel que soit son âge (R. 353-6), sans coefficient de minoration ni
  d'anticipation dans les autres régimes ; la saisie, qui refusait un décès avant le
  départ, l'accepte.
- >-
  2026-10-09 — action 138, étape 4 : le partage entre le conjoint survivant et les
  précédents conjoints, au prorata des mariages en mois (L. 353-3, R. 353-4), avec le
  minimum et le maximum (circulaire n° 105/90, § 3) ; les précédents conjoints non
  remariés seuls avant juillet 2004 (paramètre ex_conjoints) ; le ménage du survivant
  ne compte au plafond que formé à la date d'effet.
- >-
  2026-10-09 — action 138, étape 4 : le droit d'avant 2004. La version avant_1982 est
  coupée en trois : avant_1973, à soixante-cinq ans, soixante pour l'inapte (décret
  n° 72-1098) ; avant_juillet_1974, à cinquante-cinq ans, sans cumul — la réversion
  complète la retraite personnelle — ; avant_1982, le cumul dans la moitié du total.
  Jusqu'en juillet 2004, la réversion se cumule avec les retraites du survivant dans la
  limite de D. 355-1, que la limite forfaitaire du barème de la Cnav borne, et ces
  retraites sortent de ses ressources ; les majorations forfaitaires de 1982 et 1995
  s'écrivent à leur date ; la majoration pour enfant à charge (L. 353-5) naît dans sa
  fiche, et son approximation, ici, est retirée. La date d'effet est la plus proche que
  chaque version permet : le survivant de cinquante-cinq ans d'un assuré mort en 1970
  la reçoit au 1er janvier 1973.
effet: >-
  Tout conjoint, ou ex-conjoint, d'un assuré du régime général ou d'un régime aligné
  qui décède : 4,41 millions de bénéficiaires d'un droit dérivé tous régimes fin 2024
  (DREES, EACR). Le modèle la calcule pour le conjoint que la saisie déclare, minimum,
  maximum et majorations compris, sur la pension du défunt sans son minimum
  contributif et d'avant le maximum des pensions — celle qu'il eût obtenue s'il meurt
  avant son départ —, sous le plafond d'une personne seule ou du ménage qu'il déclare ;
  sa dépense, publiée, est sur la page Coût.
