  statut: supposee
  hypothese: >-
    le taux de 50 % est celui que la circulaire Cnav n° 120/82 dit porté à 52 % au
    1er décembre 1982 ; les conditions d'âge, de durée de mariage et de ressources
    sont prêtées à ce texte d'avant la codification de 1985, que l'index ne porte
    pas, telles que R. 353-1 les codifie en 1985
  fiabilite: moyenne
  bornes:
    liquidation.date_effet: [null, 1982-12-01]
  contenu:
    droit: 50 % de la pension principale dont bénéficiait ou eût bénéficié l'assuré
    beneficiaire: le conjoint survivant, et le conjoint divorcé non remarié
    conditions: >-
      cinquante-cinq ans ; deux ans de mariage à la date du décès, sauf enfant issu
      du mariage ; des ressources personnelles qui ne dépassent pas 2 080 fois le SMIC
      horaire
