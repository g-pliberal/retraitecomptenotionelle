schema_version: 1
id: recul_limite_age_enfants
intitule: >-
  La limite d'âge du fonctionnaire civil est reculée d'un an par enfant à sa charge
  quand il l'atteint, trois ans au plus ; d'un an pour qui était parent de trois enfants
  vivants à ses cinquante ans, s'il est apte, ce recul ne se cumulant avec le premier que
  si un enfant à charge est invalide à 80 % au moins ou ouvre droit à l'allocation aux
  adultes handicapés ; d'un an par enfant mort pour la France. Le recul est de droit,
  que l'employeur ne peut refuser ; depuis le 14 juin 2023, avec les prolongations, il ne
  mène pas au-delà de soixante-dix ans.
domaine: enfants
regimes: [fonction_publique_etat, pensions_civiles_1853, cnracl]
etape: preparer_la_chronologie
face: droit
etat: manquante
lit:
- la limite d'âge de l'emploi (fiche `limite_age_fonction_publique`)
- les enfants de l'assuré, leurs naissances, et ceux qui sont à sa charge — au sens des
  prestations familiales ou de l'allocation aux adultes handicapés — quand il atteint
  la limite
- le nombre d'enfants vivants à ses cinquante ans, et l'invalidité d'un enfant à charge
ecrit:
- la limite d'âge reculée, que la radiation des cadres suit
dates_qui_decident:
- age_atteint
