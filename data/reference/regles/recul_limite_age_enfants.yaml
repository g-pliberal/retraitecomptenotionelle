  a_relire:
  - >-
    La rédaction de l'article 4 de la loi du 18 août 1936 avant le 26 décembre 1986, et
    l'article 18 de la loi du 27 février 1948, l'article 16 de la loi du 14 septembre 1948
    et la loi du 25 mars 1952, que le décret n° 53-711 maintient « relatives au recul de la
    limite d'âge » : d'où vient le recul pour enfant mort pour la France, avant L. 556-4 ?
  - >-
    Le militaire n'a pas ce recul : la loi de 1936 nomme les « fonctionnaires et employés
    civils », et L. 4139-16 du code de la défense, lu, n'en porte aucun (fiche
    `limite_age_militaires`).
