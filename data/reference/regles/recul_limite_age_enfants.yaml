historique:
- >-
  2026-10-10 — née avec l'action 151, étape 2, avec la fiche `limite_age_fonction_publique`
  qu'elle recule.
effet: >-
  Aucun aujourd'hui, le modèle n'appliquant pas la limite d'âge qu'elle recule : il garde
  tout fonctionnaire en activité jusqu'au départ saisi. Dès que la limite s'appliquera, le
  parent d'enfants encore à charge à soixante-sept ans pourra rester jusqu'à trois ans de
  plus — soixante-dix ans au plus depuis 2023.
