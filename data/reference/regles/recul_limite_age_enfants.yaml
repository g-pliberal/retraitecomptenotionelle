- id: loi_de_1986
  statut: lue
  textes:
  - {id: LEGIARTI000006451372, article: "loi du 18 août 1936, article 4", en_vigueur: 1986-12-26}
  nee_de: LEGIARTI000006451372
  bornes:
    age_atteint: [1986-12-26, 2022-03-01]
  contenu:
    droit: >-
      « Les limites d'âge sont reculées d'une année par enfant à charge, sans que la
      prolongation d'activité puisse être supérieure à trois ans. Les enfants pris en
      compte [...] sont ceux qui sont définis par les lois et règlements régissant
      l'attribution des prestations familiales, ainsi que ceux qui ouvrent droit au
      versement de l'allocation aux adultes handicapés. Les limites d'âge seront également
      reculées d'une année pour tout fonctionnaire et employé civil qui, au moment où il
      atteignait sa cinquantième année, était parent d'au moins trois enfants vivants, à la
      condition qu'il soit en état de continuer à exercer son emploi. Toutefois, cet
      avantage ne peut se cumuler avec celui prévu à l'alinéa précédent que si l'un des
      enfants à charge est atteint d'une invalidité égale ou supérieure à 80 p. 100 ou ouvre
      droit au versement de l'allocation aux adultes handicapés »
    plafonds: >-
      le recul par enfant à charge ne peut « retarder la limite d'âge au-delà de
      soixante-treize ans pour les fonctionnaires et employés civils classés dans la
      catégorie A et au-delà de soixante-huit ans pour les fonctionnaires et employés civils
      de la catégorie B », celui du parent de trois enfants au-delà « de soixante et onze ans
      et soixante-six ans » : la catégorie A est la sédentaire, la B l'active, au sens de
      l'article 1er
  exemples: aucun trouvé
