code:
  interrupteurs:
    duree_proratisation_par_generation: true
  moteur: >-
    `duree_proratisation_par_generation` : le DÉNOMINATEUR de la proratisation est lu
    dans `legislation/duree_proratisation.csv` à l'ANNÉE DE NAISSANCE, et non dans la
    durée requise pour le taux plein. Ce sont deux paramètres distincts : la loi du 22
    juillet 1993 a fait monter la durée requise de 150 à 160 trimestres pour les générations
    1934-1943, et n'a touché à la durée maximale prise en compte par la proratisation
    (article R. 351-6) que pour les générations 1944-1948. Un assuré né en 1945 se voit
    donc opposer 160 trimestres pour le taux et 154 pour la proratisation.


    Le renvoi est réservé aux régimes qui suivent la règle du CODE DE LA SÉCURITÉ SOCIALE
    — le régime général et les régimes alignés. La fonction publique et les régimes spéciaux
    ont leur propre durée de proratisation, calendaire et non générationnelle (article
    L. 13 du code des pensions) ; elle n'est pas modélisée, et leur durée requise continue
    d'y faire office.


    Quoi qu'il arrive, la durée de proratisation retenue ne dépasse jamais la durée requise
    : les périodes anciennes, dont la durée maximale est plus courte que 150 trimestres,
    gardent la leur.


    Le NUMÉRATEUR, la durée du régime, se somme année par année sous le plafond de
    l'année (`compter.Durees.plafond`, `cumulPlafonne` en JavaScript) : l'année de la
    date d'effet n'y compte que les trimestres civils qui précèdent celui de l'effet,
    périodes assimilées comprises, même sans ligne de carrière cette année-là (R. 351-1 ;
    circulaire Cnav n° 2004/29, point 2121). La durée que R. 173-4-3 compare est la même
    (`liquider.duree_du_regime_aligne`).


    Sauf l'année où le non-salarié agricole cesse son activité, qui compte ses quatre
    trimestres dans la durée de son régime comme dans celle du taux
    (`Carriere.annee_entiere_agricole`, `anneeEntiereAgricole` en JavaScript ;
    L. 731-10-1 du code rural) : au régime au 1er janvier (une ligne agricole cotisée
    l'année d'avant), sans autre activité cotisée cette année-là (R. 731-83) ; celle de
    la date d'effet depuis le 16 octobre 2026 (`Carriere.annee_de_cessation_agricole`),
    toute autre depuis le 18. Ce qui se compte entre deux dates, la surcote d'abord, n'en
    lit que les trimestres écoulés (`Carriere.trimestres_ecoules`), la circulaire
    n° 2004/37 (point 131) en gardant les bornes. Ses cotisations et ses points le sont
    aussi depuis le 17 octobre 2026, au revenu de ses mois porté à douze
    (`Carriere.part_cotisee_ligne`) : voir les fiches retraite_proportionnelle_msa,
    assiette_minimale_agricole et pension_non_salaries_agricoles_2026.


    L'année où il s'installe après le 1er janvier ne compte, à l'inverse, aucun
    trimestre, ni dans la durée de son régime ni dans celle du taux : il n'y doit rien
    (R. 731-57, L. 731-10-1), et n'y porte ni points ni revenu
    (`Carriere.statut_pris_apres_le_1er_janvier`, `statutPrisApresLe1erJanvier` en
    JavaScript, depuis le 18 octobre 2026). C'est la ligne agricole d'une année que ses
    lignes agricoles ne remplissent pas, sans ligne agricole l'année d'avant et avec une
    l'année d'après, depuis les cotisations de 1985, les premières que fixe le décret
    n° 84-936.


    Le statut du 1er janvier, depuis le 18 octobre 2026 (`Carriere._statuts_au_1er_janvier`,
    `statutsAu1erJanvier` en JavaScript) : l'année où il passe de collaborateur à chef,
    ou de chef à collaborateur, se cotise tout entière dans le statut de ce jour, celui
    de l'année d'avant ou, quand elle en a eu deux, celui qu'il y a pris ; le statut pris
    en cours d'année n'y compte rien, ni trimestres, ni points, ni revenu, comme
    l'installation, et l'année est de ce statut pour les minima (`Carriere.qualite_agricole`).
    Depuis les cotisations de 1985 : avant, comme quand le statut du 1er janvier ne se lit
    pas, l'année où il cesse se partage entre ses statuts au prorata de leurs mois.


    Sauf l'année du décès du chef d'exploitation, depuis le 19 octobre 2026 : ses
    cotisations sont « calculées au prorata de la fraction de l'année considérée comprise
    entre le 1er janvier et la date du décès » (L. 731-10-1), et la carrière arrêtée au
    décès, que lit la pension qu'il « eût obtenue » (`Carriere.au_deces`), la garde à ses
    mois, comme celle de R. 731-83 : mort le 15 août 2024, le chef compte deux trimestres
    en 2024, ceux d'avant le 1er juillet, et non quatre. Depuis les cotisations de 2009
    (`COTISATIONS_AU_PRORATA_DU_DECES_DEPUIS`), L. 731-10-1 étant en vigueur depuis le
    19 décembre 2008 ; ni le collaborateur, dont le décès n'est pas celui du chef, ni le
    défunt d'avant 2009 ne sont touchés. Le conjoint survivant peut opter pour l'année
    entière des cotisations d'assurance vieillesse (D. 731-57-1), ce que le modèle ne lit
    pas ; les trimestres d'une année au prorata restent la question de R. 731-83.
