- id: decret_de_2004
  statut: lue
  nee_de: LEGIARTI000006749348
  textes:
  - id: LEGIARTI000006749348
    article: R. 351-6 du code de la sécurité sociale, rédaction du décret n° 2004-144 (article 2)
    en_vigueur: 2004-02-15
    publie_le: 2004-02-14
    citation: >-
      « I. - La durée maximum d'assurance dans le régime général prise en compte pour le
      calcul de la pension de vieillesse est celle prévue au troisième alinéa de
      l'article L. 351-1. Si l'assuré a accompli une durée d'assurance inférieure à cette
      durée maximum, la pension est réduite au prorata. Les dispositions ci-dessus
      s'appliquent aux pensions prenant effet après le 31 décembre 2007 et aux assurés
      nés après 1947 quelle que soit la date d'effet de leur pension. II. - Pour les
      pensions prenant effet après le 31 décembre 2003 et avant le 1er janvier 2008, la
      durée maximum d'assurance est fixée à : 150 trimestres pour les assurés nés avant
      1944 ; 152 trimestres pour les assurés nés en 1944 ; 154 trimestres pour les
      assurés nés en 1945 ; 156 trimestres pour les assurés nés en 1946 ; 158 trimestres
      pour les assurés nés en 1947. »
    lu_le: 2026-11-21
  - id: JORFARTI000002078759
    article: décret n° 2007-614 du 25 avril 2007, article 1er, I
    en_vigueur: 2007-04-27
    citation: >-
      « au dernier alinéa du I, les mots : « aux pensions prenant effet après le 31
      décembre 2007 et » sont supprimés ; au premier alinéa du II, les mots : « et avant
      le 1er janvier 2008 » sont supprimés »
    lu_le: 2026-11-21
  - id: LEGIARTI000006749349
    article: R. 351-6 du code de la sécurité sociale, rédaction du 27 avril 2007
    en_vigueur: 2007-04-27
    citation: >-
      « Les dispositions ci-dessus s'appliquent aux assurés nés après 1947 quelle que
      soit la date d'effet de leur pension. II.-Pour les pensions prenant effet après le
      31 décembre 2003, la durée maximum d'assurance est fixée à : 150 trimestres pour les
      assurés nés avant 1944 ; [...] 158 trimestres pour les assurés nés en 1947. »
    lu_le: 2026-11-21
  - id: LEGIARTI000006742622
    article: L. 351-1 du code de la sécurité sociale, rédaction de la loi n° 2003-775
    en_vigueur: 2003-08-22
    citation: >-
      « Si l'assuré a accompli dans le régime général une durée d'assurance inférieure à
      la limite prévue au deuxième alinéa, la pension servie par ce régime est d'abord
      calculée sur la base de cette durée, puis réduite compte tenu de la durée réelle
      d'assurance. »
    lu_le: 2026-11-21
  - id: LEGIARTI000023035688
    article: L. 351-1 du code de la sécurité sociale, rédaction de la loi n° 2010-1330
    en_vigueur: 2010-11-11
    citation: >-
      le même troisième alinéa, mot pour mot
    lu_le: 2026-11-21
  bornes:
    liquidation.date_effet: [2004-01-01, 2026-01-01]
  contenu:
    droit: >-
      la durée maximum est, pour les nés avant 1948, celle de la table du II de R. 351-6
      (150 avant 1944, puis 152, 154, 156, 158), et pour les nés après 1947 la durée
      requise pour le taux plein de leur génération (la limite du troisième alinéa de L.
      351-1), à la date d'effet ; elle ne dépasse jamais cette durée requise
    conditions: >-
      la version commence le 1er janvier 2004 : la rédaction du 15 février 2004 vise les
      « pensions prenant effet après le 31 décembre 2003 ». La rédaction de 2004 bornait
      la table aux pensions d'avant 2008 et renvoyait ensuite à la durée requise ; le
      décret n° 2007-614 a levé la borne avant qu'aucune pension n'en prenne effet : la
      version ne se coupe pas au 27 avril 2007. Le né en 1948 a 160 trimestres, sa durée
      requise : la ligne 1948 de la table en est la jonction
