schema_version: 1
id: taux_plein_et_proratisation
intitule: >-
  Pension = salaire annuel moyen × taux × durée dans le régime / durée requise ;
  durée de proratisation propre aux générations 1944-1948.
etat: conforme
etape: liquider_chaque_regime
effet: Toute pension du régime général et des régimes alignés.
sources:
  lu_le: 2026-10-16
  prochaine_relecture: 2027-06-30
  lectures:
  - type: service_public
    reference: fiches F21552 et F36464
    date: 2026-09-01
  - type: legifrance
    reference: >-
      code de la sécurité sociale, R. 351-1, rédaction du 21 décembre 1985
      (LEGIARTI000006749339), toujours en vigueur : « Les droits à l'assurance vieillesse
      sont déterminés en tenant compte : 1°) des cotisations versées au titre de la
      législation sur les assurances sociales et arrêtées au dernier jour du trimestre
      civil précédant la date prévue pour l'entrée en jouissance de la pension [...] ; 2°)
      de l'âge atteint par l'intéressé à cette dernière date ; 3°) du nombre de trimestres
      d'assurance valables pour le calcul de la pension ». Lu dans l'index LEGI du dépôt
    date: 2026-10-16
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 2004/29 du 30 juin 2004, point 2121 : la durée d'assurance « au
      sens de l'article L.351-1 3ème alinéa » — celle qui proratise — « est arrêtée au
      dernier jour du trimestre civil précédant la date d'effet de la pension », et
      « comprend [...] les trimestres assimilés à des trimestres d'assurance » ;
      circulaires n° 51/98 (point 1321) et 2002/71 (point 132) : l'arrêt du compte de
      R. 351-1 « limite[...] la validation des périodes d'assurance au dernier jour du
      trimestre civil précédant la date d'effet de la pension » ; n° 2004/8 (points 3231
      et 3232) : de même au régime général, aux salariés agricoles, aux artisans, aux
      commerçants et aux professions libérales, quand le régime des non-salariés agricoles
      prend « en compte [...] les 4 trimestres de l'année de cessation d'activité ». Lues
      par la recherche de la base de la Cnav
    url: https://legislation.lassuranceretraite.fr/references-reglementaires?file_leaf_ref=CR_CN_2004029_30062004.aspx
    date: 2026-10-16
  - type: legifrance
    reference: >-
      L'année de cessation de l'exploitant agricole. Code rural, L. 731-10-1
      (LEGIARTI000019950453, en vigueur depuis le 19 décembre 2008) : « En cas de
      cessation d'activité au cours d'une année civile, le chef d'exploitation ou
      d'entreprise agricole est tenu au paiement des cotisations [...] au titre de
      l'année civile entière », la situation étant « appréciée au premier jour de
      l'année civile » ; au prorata du décès, et, par R. 731-83 (LEGIARTI000006597265),
      de « la fraction de l'année [...] comprise entre le 1er janvier et le premier jour
      du mois civil suivant la date de cessation » pour qui prend une autre activité.
      R. 732-48 (LEGIARTI000053328383, depuis 2026) : « quatre trimestres » pour « toute
      année civile antérieure à l'année 2016 au cours de laquelle l'assuré s'est
      acquitté de l'ensemble des cotisations dont il était redevable » ; D. 732-48-1
      (LEGIARTI000053352415) de même, de 2016 à 2025, pour le collaborateur et l'aide
      familial. Lus dans l'index LEGI du dépôt
    date: 2026-10-16
  - type: circulaire_cnav
    reference: >-
      Cnav, exposé « Durée d'assurance pour le taux plein » (circulaire n° 2026/22 du
      23 juillet 2026 parmi ses références) : « Si l'assuré a été affilié en dernier
      lieu au régime des non salariés agricoles, les 4 trimestres de l'année de
      cessation d'activité validés par ce régime sont retenus même s'il s'agit de
      l'année d'arrêt du compte » (circulaire n° 83/83, lettre Cnav du 20 juin 2011) ;
      circulaire n° 2004/37, point 131 : ces règles « influent sur le nombre de
      trimestres retenus pour déterminer le taux de la pension mais ne remettent pas
      en cause les bornes de la période de référence » de la surcote. Réponse du
      ministre de l'agriculture à la question écrite n° 10883 (JO du 3 février 2026,
      p. 928) : les exploitants doivent les cotisations de l'année où ils cessent,
      « y compris lorsque celle-ci survient en cours d'année », et valident ainsi « 4
      trimestres supplémentaires au titre de leur retraite ». Lus par
      la recherche de la base de la Cnav et sur le site de l'Assemblée nationale
    url: https://legislation.lassuranceretraite.fr/expose?file_leaf_ref=retraite_personnelle_taux_duree_assurance_pour_taux_plein_ex.aspx
    date: 2026-10-16
