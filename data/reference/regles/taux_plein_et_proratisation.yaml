    citation: >-
      « La durée maximum d'assurance dans le régime général prise en compte pour le
      calcul de la pension de vieillesse est de 150 trimestres. Si l'assuré a accompli
      moins de 150 trimestres dans ce régime, la pension est égale à autant de 150e de la
