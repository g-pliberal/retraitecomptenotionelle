  - {id: LEGIARTI000024795153, article: "code de l'aviation civile, R. 426-11", en_vigueur: 2012-01-01}
  - {id: LEGIARTI000044496243, article: "code de l'aviation civile, R. 426-11", en_vigueur: 2021-12-16}
  - {id: LEGIARTI000048325100, article: "code des transports, R. 6527-21", en_vigueur: 2023-11-01}
  - {id: LEGIARTI000036880164, article: "code de l'aviation civile, R. 426-16-1", en_vigueur: 2018-05-07}
