  bornes:
    liquidation.date_effet: [null, null]
  contenu:
    droit: >-
      la pension de chaque régime prend effet à la date que l'assuré demande, au plus
      tôt quand il remplit les conditions de ce régime : l'âge de L. 161-17-2 au régime
      général et dans les régimes alignés ; à la fonction publique, la radiation des
      cadres et l'âge, légal ou anticipé, de L. 24 et L. 25 — « la liquidation de la
      pension ne peut intervenir [...] avant l'âge mentionné à l'article L. 161-17-2 du
      code de la sécurité sociale, ou avant l'âge minoré ou anticipé » (L. 25, 1°) —,
      le militaire liquidant dès qu'il a ses services ; dans chaque régime spécial,
      l'âge de son décret. Une pension différée d'un fonctionnaire radié avant l'âge
      est liquidée « conformément [aux] règles [...] en vigueur au moment de sa mise
      en paiement », son traitement revalorisé de la radiation à la mise en paiement
      (L. 25, dernier alinéa ; fiche pension_differee_fonction_publique)
    complementaires: >-
      l'Agirc-Arrco et l'Ircantec servent sans abattement « à l'âge auquel [l'assuré]
      a obtenu la pension d'assurance vieillesse du régime général [...] à taux plein »
      (ANI du 17 novembre 2017, article 84, 3) ou « normalement [...] à l'âge prévu au
      1° de l'article L. 351-8 » (arrêté du 30 décembre 1970, article 16) ; elles
      peuvent être demandées « au plus tôt dix ans » avant cet âge, sous un coefficient
      de 0,43 à dix ans (fiches coefficients_anticipation_agirc_arrco et
      coefficient_anticipation_ircantec). Les complémentaires des indépendants et des
      libéraux suivent leur régime de base, et ne l'ouvrent pas ; la CARPV et la CAVEC
      se demandent à leur âge, dès soixante ans, sans la base : « les adhérents
      remplissant les conditions de l'article 33 peuvent demander à bénéficier de leur
      pension de retraite complémentaire dès leur soixantième anniversaire » (CARPV,
      statuts approuvés par l'arrêté du 18 octobre 2021, article 34, en vigueur le
      1er janvier 2022 : « Les modifications des statuts prévues par le présent arrêté
      entrent en vigueur le 1er janvier 2022 », article 2, JORFARTI000044220741 ;
      règlement de 2026, article 2 ; avant 2022, présumé : voir les approximations) ;
      « entre 60 et 65
      ans, avec application d'un abattement définitif de 1,25 % par trimestre
      manquant » (CAVEC, statuts de 2008, article 3.13 ; de 2018, partie 2, article
      12 ; règlement de 2026, article 1.1.3) ; ni ces textes, ni L. 643-3, ni L. 644-1
      ne les lient à la liquidation de la base, qui s'ouvre « à partir de l'âge prévu
      au premier alinéa de l'article L. 351-1 » (L. 643-3, I). La CAVOM, la CARPIMKO
      et la CPRN ont chacune leur âge, que leurs statuts ne lient pas non plus à la
      base. La CAVOM : « La liquidation de la retraite, conditionnée à la cessation de
      toute activité professionnelle ressortissant de la caisse et au paiement à la
      caisse de toutes les cotisations et majorations exigibles, peut intervenir : 1° À
      partir de 62 ans » ; « Pour les générations antérieures, les âges d'ouverture des
      droits à retraite et de bénéfice du taux plein évoluent selon le tableau
      ci-dessous : GÉNÉRATION ÂGE D'OUVERTURE DES DROITS ÂGE DU TAUX PLEIN Jusqu'à
      1955 60 ans 65 ans 1956 60 ans et 6 mois 65 ans et 6 mois 1957 61 ans 66 ans 1958
      61 ans et 6 mois 66 ans et 6 mois 1959 et suivantes 62 ans 67 ans » (statuts,
      articles 14 et 23, arrêté du 30 décembre 2015, publié le 31, sans date : le 1er
      janvier 2016) ; « 1° L'âge d'ouverture des droits à pensions est fixé à : a) 62
      ans pour les affiliés relevant du a du 2° de l'article L. 643-4 du code de la
      sécurité sociale ; b) 64 ans à compter de la génération 1968. Pour les affiliés
      nés avant le 1er janvier 1968, cet âge est fixé à : - 60 ans pour les affiliés
      nés avant le 1er janvier 1956 ; [...] - 62 ans pour les affiliés nés entre le 1er
      janvier 1959 et le 31 décembre 1964 inclus ; - 62 ans et 6 mois ans pour les
      affiliés nés en 1965 ; - 63 ans pour les affiliés nés en 1966 ; - 63 ans et 6
      mois pour les affiliés nés en 1967 » (article 14, arrêté du 12 décembre 2024,
      « entrent en vigueur au 1er janvier 2025 » ; règlement de 2026, article 1er, I,
      mot pour mot). La CARPIMKO : « Par dérogation aux dispositions de l'article 11,
      les conditions de liquidation des assurés des générations 1960 et antérieures
      sont les suivantes : GÉNÉRATION 1955 ET ANTÉRIEURE 1956 1957 1958 1959 1960 [...]
      Age prévu à l'article 11.2 (a) 60 ans 60 ans 4 mois 60 ans 8 mois 61 ans 61 ans 4
      mois 61 ans 8 mois » (statuts, article 12 quater, arrêté du 31 juillet 2015,
      publié le 2 octobre, sans date : le 3 octobre 2015) ; « Âge minimal pour liquider
      sa retraite 60 ans 60 ans 4 mois 60 ans 8 mois 61 ans 61 ans 4 mois 61 ans 8 mois
      62 ans », jusqu'aux nés le 31 août 1961 (arrêté du 27 décembre 2023, publié le
      9 janvier 2024 ; règlement de 2026, article 6) ; « Pour bénéficier de la retraite
      complémentaire, les affiliés doivent avoir versé toutes les cotisations exigibles
      et avoir l'âge prévu par les dispositions des articles 3, 4 et 6 » (règlement de
      2026, article 2). La CPRN, de 2014 à 2023 : « Pour les affiliés nés avant le 1er
      janvier 1954 : ― l'âge légal d'ouverture des droits est fixé à 60 ans [...] Pour
      les affiliés nés à compter du 1er janvier 1954 : ― l'âge légal d'ouverture des
      droits est celui visé à l'article L. 161-17-2 du code de la sécurité sociale
      différé de vingt-quatre mois » (statuts, article 15, arrêté du 16 décembre 2013,
      « Le présent arrêté prend effet au 1er janvier 2014 » ; article 18 des statuts de
      2017, mêmes mots) ; depuis le 1er janvier 2024 : « L'âge de l'ouverture du droit
      à pension de retraite est celui mentionné à l'article L. 161-17-2 du code de la
      sécurité sociale » (statuts, article 18, arrêté du 29 novembre 2023 ; règlement
      de 2026, article 4), l'âge de la base. Chacune se demande à son âge, avant la
      base ou après. La CAVP, elle, s'ouvre à l'âge de la base : « dès l'âge de 60
      ans » (statuts approuvés par l'arrêté du 11 mai 2009, partie III, article 15),
      quand la base s'ouvrait aussi à soixante ans, puis « dès l'âge d'ouverture du
      droit à pension de retraite tel qu'il est fixé à l'article L. 161-17-2 du code de
      la sécurité sociale. A titre transitoire, pour les affiliés nés avant le 1er
      janvier 1956, l'âge d'ouverture du droit à pension de retraite est fixé selon le
      calendrier figurant à l'article D. 161-2-1-9 du code de la sécurité sociale »
      (article 15, arrêté du 23 juin 2011 ; règlement de 2026, article 12) ; elle suit
      sa base. La CARPV, la CAVEC, la CAVOM, la CARPIMKO et la CPRN forment chacune
      une unité à elle (departs.py, SANS_LEUR_BASE). La CRPNPAC, complémentaire du
      personnel navigant, aussi, ses deux tranches : « Une pension de retraite est
      servie à l'affilié qui demande la liquidation de ses droits à pension [...] dès
      lors qu'il réunit cumulativement à la date d'effet de la pension les conditions
      suivantes : 1° Avoir atteint l'âge de cinquante ans ; 2° Justifier de vingt
      annuités » (code de l'aviation civile, R. 426-11, I, rédactions de 2012 et de
      2021) ; R. 6527-21 du code des transports, depuis le 1er novembre 2023, pose les
      mêmes conditions, 1° et 2°, mais d'autres mots : « dans les conditions prévues par
      les articles R. 6527-22, R. 6527-27, R. 6527-49 et R. 6527-50 », et R. 6527-28 et
      R. 6527-23 là où R. 426-11 dit R. 426-13 et R. 426-12. Avant 2012, R. 426-11-1
      (de 1995 à 2011) fixe non l'âge où la caisse s'ouvre, mais le droit « à pension à
      taux plein » (« Le droit à pension à taux plein d'un affilié est ouvert aux
      conditions suivantes : Avoir atteint l'âge de cinquante ans ; [...] ») ; l'âge de
      la caisse est dans R. 426-15-1 : cinquante ans, et dès quarante-cinq ans par
      anticipation, de 1984 à 2011, que le modèle refuse (fiche
      crpn_pension_des_navigants, approximations). La date d'effet est celle de la
      demande : « l'entrée en jouissance d'une pension pour laquelle un droit est ouvert
      prend effet le premier jour du mois suivant la réception de la demande » (R. 426-15-4,
      LEGIARTI000006845227, du 1er juillet 1995 au 1er novembre 2023) ; le modèle date
      la pension du premier jour du mois qui suit l'âge (fiche date_effet_mois_suivant),
      la demande étant présumée faite le mois de l'âge. Aucune de ces
      rédactions, ni celles de R. 426-11 de 1984, 1995 et 2010, ne nomme le régime
      général ; R. 426-16-1 (rédaction du 7 mai 2018 au 1er novembre 2023) majore même
      la pension : « Pour la période de jouissance comprise entre l'âge auquel l'affilié
      aura atteint le nombre d'annuités nécessaires pour l'ouverture du droit à pension,
      et ce au plus tôt à l'âge mentionné au 1° du A du II de l'article R. 426-11, et
      l'âge mentionné à l'article L. 161-17-2 du code de la sécurité sociale, la pension
      mensuelle est assortie d'une majoration ». Le
      régime général du navigant attend cet âge : « L'assurance vieillesse garantit
      une pension de retraite à l'assuré qui en demande la liquidation à partir de
      l'âge mentionné à l'article L. 161-17-2 » (L. 351-1), « soixante-deux ans pour
      les assurés nés à compter du 1er janvier 1955 » (L. 161-17-2, rédaction de
      2011)
    ensemble: >-
      liquident ensemble, à une seule date, les régimes que la loi réunit : les régimes
      alignés (fiche liquidation_unique_regimes_alignes), les trois régimes du code des
      pensions (fiche interpenetration_fonction_publique), un régime et celui qui lui a
      succédé
    parametres:
      depart_tous_regimes: false
  exemples: [ircantec_minoration_age_avant_l_age_legal]
approximations:
- ecart: >-
    la date à laquelle l'assuré demande chaque pension est présumée quand il ne la
    dit pas (depart_de_chaque_regime) — au départ déclaré, à l'ouverture du régime
    qui n'ouvre pas encore, à la sortie de l'armée pour la pension militaire. Il
    peut la dire, régime par régime (demande_<régime>) : une date plus tardive
    remplace la présumée — pour éviter une décote qui tient à l'âge, toucher une
    surcote accordée à l'âge seul —, et une unité prend la plus tardive des dates
    de ses régimes ; une date plus précoce ne l'avance pas. Qui demande une pension
    avant son départ — l'agent d'un régime spécial parti tôt, le fonctionnaire de
    catégorie active passé au privé — se représente en déclarant son départ à cette
    date, et l'activité qui suit comme une activité après le départ (fiches
    cumul_emploi_retraite_et_retraite_progressive et droits_apres_la_premiere_pension)
  effet: non mesuré
- ecart: >-
    une complémentaire des salariés est présumée demandée avec son régime de base :
    l'anticipation de dix ans au plus que ses textes permettent, sous un abattement
    qui peut atteindre 57 %, n'est prise que si le régime de base lui-même est pris
    à cette date. Demandée plus tard que lui, elle se liquide à sa date ; plus tôt,
    elle le suit
  effet: >-
    mesuré par un exemple de l'Ircantec (ircantec_minoration_age_avant_l_age_legal,
    écart connu) : né en décembre 1964, parti à 61 ans et 9 mois avec 160 trimestres,
    l'assuré reçoit de la caisse ses points au coefficient 0,7625 dès septembre 2026 ;
    le modèle les lui sert un an plus tard, à l'âge légal, à 0,90
- ecart: >-
    le minimum contributif d'un départ s'écrête sur les pensions que les départs
    précédents servent, menées au mois de sa date d'effet (R. 173-7) ; il n'est pas
    révisé quand une pension commence après lui (R. 173-8), et la condition d'avoir
    liquidé toutes ses pensions (L. 351-10-1) est tenue pour remplie
  effet: non mesuré
- ecart: >-
    les montants du scénario 1 sont ceux du départ déclaré : une pension servie avant
    lui y est menée par la revalorisation de son régime, une pension qui ne commence
    qu'après y est ramenée par les prix. La réversion ouverte avant qu'une pension ne
    commence lit celle-ci à son montant du départ déclaré
  effet: non mesuré
- ecart: >-
    la complémentaire de la CARPV est présumée se demander sans la base avant le
    1er janvier 2022, comme les statuts de 2021 le disent depuis. Avant, les statuts ne
    sont publiés en entier qu'au Bulletin officiel — l'arrêté du 5 juillet 1999 en
    approuve les « art. 3 à 40 du titre II » (JORFARTI000001562289 : « sera publié
    intégralement au Bulletin officiel no 99/33 », JORFARTI000001368893), celui du
    28 août 2006 les « art. 21, 23 et 24 du titre II » (JORFARTI000001494755) —, non
    lus. Les modifications que le Journal officiel publie, lues le 5 novembre 2026, ne
    disent pas si la complémentaire se liquide sans la base : l'arrêté du 11 janvier
    2011 (JORFARTI000023448554) ne récrit de l'article 21 que l'alinéa de l'inapte, et
    ne demande d'avoir « liquidé ses pensions de vieillesse personnelles auprès de la
    totalité des régimes légaux ou rendus légalement obligatoires, de base et
    complémentaires » qu'à qui veut cumuler entièrement sa retraite et une activité
    (article 23, c) ; ceux du 16 avril 2014 (JORFARTI000028939421), du 18 février 2015
    (JORFARTI000030285511) et du 2 novembre 2015 (JORFARTI000031549970) ne parlent ni
    de la base, ni de la liquidation de la retraite. Rien de ce qui est lu ne contredit
    la présomption ; rien ne la fonde
  effet: >-
    trois cas de tests/test_ouverture_des_liberaux.py en dépendent — le vétérinaire né
    le 10 février 1955 (CARPV au 1er mars 2015), le 10 février 1961 (1er mars 2021) et
    le 10 octobre 1961 (1er novembre 2021) —, et tout vétérinaire parti avant 2022
    avant l'âge de sa base : si la complémentaire attendait la base, elle lui serait
    servie à cet âge, sous un coefficient plus haut
- ecart: >-
    la complémentaire de la CAVOM, de la CARPIMKO et de la CPRN est servie à son âge,
    sans la base, à toute date ; les statuts lus le 5 novembre 2026 ne le fondent
    qu'à partir de leur entrée en vigueur. La CAVOM, avant le 1er janvier 2016 : le
    modèle lui garde ses 60 ans (table `cavom`), sans texte lu ; l'arrêté du 7 octobre
    2014 (JORFARTI000029830483) ne parle ni de liquidation ni d'âge, et ceux d'avant
    n'ont à l'index qu'un titre ou une notice. La CARPIMKO, avant le 3 octobre
    2015 : le modèle la sert à l'âge de la base ; les statuts d'alors, publiés au
    Bulletin officiel (arrêté du 20 novembre 1996), ne sont pas lus ; depuis ce jour,
    il prend sa table (`carpimko_2016`), qu'il ne prenait qu'au 1er janvier 2016
    jusqu'au 14 novembre 2026 (action 130, ligne 16 de la file). La CPRN, avant
    le 1er janvier 2014 : servie à l'âge de la base, sans texte lu ; les statuts de
    2005 ne sont publiés qu'au Bulletin officiel no 2005/01 (JORFARTI000001075201), et
    l'arrêté du 16 décembre 2013 en cite l'article 14 : « La demande ne peut être
    antérieure ni au soixante-cinquième anniversaire du notaire, ni à la fin de son
    exercice », sans l'article 15 qu'il récrit. Ni la CAVOM ni la CPRN ne disent
    rien de la carrière longue : le modèle leur ouvre l'âge que la durée ouvre à la
    base, comme avant ; la CARPIMKO l'ouvre depuis 2024 « pour les affiliés qui
    bénéficient de ce départ anticipé au titre du régime de base » (règlement de
    2026, article 3, 4)
  effet: >-
    non mesuré ; l'officier ministériel né avant 1956 parti avant 2016 avant l'âge de
    sa base touche sa complémentaire dès 60 ans ; le notaire né en 1953 parti en 2013
    entre 60 ans et 61 ans et 2 mois n'a rien avant l'âge de sa base, quand les
    statuts de 2005 lui fermaient peut-être la complémentaire jusqu'à 65 ans
- ecart: >-
    en carrière longue, la complémentaire de la CAVP et celle de la CARPIMKO sont servies
    avec la base, à l'âge que la durée lui ouvre, quand leurs statuts ne l'ouvraient pas
    avant 2024. La CAVP : l'article 15 de 2011 (arrêté du 23 juin 2011,
    JORFARTI000024270214) n'a que l'âge de L. 161-17-2 et l'inaptitude ; « L'affilié qui
    bénéficie d'une liquidation anticipée au régime de base, dans les conditions prévues
    aux II, III et IV de l'article L. 643-3 en bénéficie dans les mêmes conditions et
    modalités au régime complémentaire fonctionnant par répartition » n'y entre que par
    l'arrêté du 19 décembre 2023 (JORFARTI000048880592, publié le 9 janvier 2024, sans
    date : le 10 janvier). La CARPIMKO : ses articles 11, 12 et 12 quater de 2015
    (JORFARTI000031255547) n'en disent rien ; « 4) Dès l'âge prévu au III de l'article
    L. 643-3 du code de la sécurité sociale pour les affiliés qui bénéficient de ce départ
    anticipé au titre du régime de base » n'entre à l'article 11 que par l'arrêté du
    27 décembre 2023 (JORFARTI000048880643, le 10 janvier 2024). Le défaut précède le
    5 novembre 2026 : la complémentaire suivait déjà la base
  effet: >-
    mesuré dans les deux moteurs le 5 novembre 2026 (relecture R-N2, refaite par N-bis) :
    né le 10 mars 1957, entré à dix-huit ans, parti à soixante ans le 1er avril 2017, le
    pharmacien reçoit en un seul départ, motif `carriere_longue`, sa CAVP à 0,75, quand
    elle ne s'ouvre qu'à soixante-deux ans ; l'auxiliaire médical, sa CARPIMKO sans
    abattement, quand elle ne s'ouvre qu'à soixante ans et huit mois. Erreur du modèle,
    non corrigée : candidat, que la session d'orchestration porte au propriétaire
- ecart: >-
    la CARPIMKO ne dit plus, depuis 2024, l'âge minimal des nés après le 31 août 1961 :
    l'arrêté du 27 décembre 2023 supprime les deux premiers alinéas de l'article 12 (« Le
    bénéfice de la retraite peut être accordé par anticipation à partir de 62 ans et
    avant 67 ans pour les assurés nés à compter du 1er janvier 1961 ») ; l'article 3 du
    règlement de 2026 ouvre le taux plein « à partir de l'âge prévu à l'article
    L. 161-17-2 » à qui a la durée de la base, et l'article 4 minore « dans la limite du
    nombre de trimestres les séparant de l'âge du taux plein sans condition ». Le modèle
    lit l'âge de L. 161-17-2 (table `carpimko_2016`, âge vide pour 1961) ; le texte ne le
    tranche pas
  effet: non mesuré
- version: [chaque_regime_a_sa_date]
  textes: >-
    code de la sécurité sociale, L. 643-3, IV (LEGIARTI000047453031 ; LEGIARTI000053280388),
    L. 643-4, 2° (LEGIARTI000047453026), D. 643-14 (LEGIARTI000047634694), D. 351-1-14
    (LEGIARTI000047634688 ; LEGIARTI000053355951), L. 643-5 (LEGIARTI000006743795),
    L. 351-7 (LEGIARTI000006742675)
  ecart: >-
    Le modèle refuse la liquidation de l'inapte des professions libérales à soixante-deux
    ans, base de la CNAVPL comprise, quand le texte, lu avec D. 643-14, ouvre sa pension de
    base à cet âge (aucune autre fiche ne le déclare pour la base : inaptitude_au_travail
    ne dit des professions libérales que leur décote gardée). Pour les pensions prenant effet depuis le 1er septembre 2023,
    L. 643-4 liquide sans coefficient de réduction « les pensions de retraite : [...] 2°
    Des assurés ayant atteint l'âge prévu au IV de l'article L. 643-3 et relevant de l'une
    des catégories suivantes : a) Reconnus inaptes au travail dans les conditions prévues
    à l'article L. 643-5 », et L. 643-3, IV (inchangé mot pour mot dans la rédaction du 31
    décembre 2025) abaisse l'âge : « IV.-La condition d'âge prévue au premier alinéa du I
    du présent article est abaissée, dans des conditions fixées par décret, pour les
    assurés relevant des 2° et 3° de l'article L. 643-4. » Le décret : « L'âge prévu au IV
    de l'article L. 643-3 est celui prévu à l'article D. 351-1-14 » (D. 643-14), et D.
    351-1-14 : « L'âge prévu au premier alinéa de l'article L. 351-1 est abaissé, en
    application de l'article L. 351-1-5, à soixante-deux ans pour les assurés reconnus
    inaptes au travail dans les conditions prévues à l'article L. 351-7 et pour les assurés
    dont l'incapacité permanente est supérieure ou égale au pourcentage prévu pour
    l'application de l'article L. 821-2 » (mêmes mots dans les deux rédactions, du 1er
    septembre 2023 et du 1er janvier 2026). Ce que le texte ne dit pas en toutes lettres :
    D. 351-1-14 nomme l'inapte de L. 351-7, quand L. 643-4, 2°, a, nomme celui de L. 643-5,
    deux définitions en d'autres termes (L. 351-7 : « Peut être reconnu inapte au travail,
    l'assuré qui n'est pas en mesure de poursuivre l'exercice de son emploi sans nuire
    gravement à sa santé [...] » ; L. 643-5 : « L'inaptitude au travail s'apprécie en
    déterminant si, à la date de la demande ou à une date postérieure, le requérant,
    compte tenu de son âge, de son état de santé, de ses capacités physiques et mentales,
    de ses aptitudes ou de sa formation professionnelle, n'est plus en mesure d'exercer
    [...] »). Lue ainsi, avec D. 643-14, la seule lecture qui donne un âge au IV pour
    l'inapte du 2°, a, la base s'ouvre à soixante-deux ans ; aucun autre texte lu n'en
    donne un à l'inapte de L. 643-5. La relecture R-E2 n'y voit pas de doute ; ce que le
    texte dit en toutes lettres s'arrête à D. 351-1-14
  effet: >-
    non mesuré dans la population ; l'inapte de la CARCDSF né en 1965 est refusé à 62 ans
    (`non_ouverte`, âge opposé 62,75), le salarié inapte né la même année partant, lui, à
    62 ans au motif `inaptitude` (essais de la file E, relus par R-E2 le 5 novembre 2026,
    dans les deux moteurs) : la liquidation entière est refusée, la pension de base de la
    CNAVPL avec la complémentaire ; le refus tient à l'ouverture, commune à toute la
    personne (fiche carcdsf_minoration_age_seul). Erreur du modèle, posée au propriétaire,
    non corrigée
presomptions:
  depart_de_chaque_regime: >-
    la date d'effet de chaque pension que l'assuré ne dit pas
sources:
  lu_le: 2026-09-29
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Le 3 novembre 2026 (file L, action 130) : la base des libéraux s'ouvrait à soixante
    ans, au plus bas des âges de ses régimes en points, la CARPV, la CAVEC et les
    prestations des biologistes comprises ; une complémentaire n'ouvre plus la base, et
    la CARPV et la CAVEC se servent à part. Restent présumées suivre leur base, sans
    lecture de leurs statuts sur ce point : la CAVOM, la CARPIMKO, la CAVP, la CARCDSF
    et la CPRN, qui ont leurs âges propres, et les autres sections, ouvertes à l'âge
    légal. La CRPNPAC, complémentaire en annuités ouverte à cinquante ans, ouvre encore
    le régime général du personnel navigant (né en 1964, parti à 55 ans, servi) : à
    instruire au code de l'aviation civile. Instruite le 5 novembre 2026 (file N) : la
    CRPNPAC se sert à son âge, le régime général et l'Agirc-Arrco à l'âge de
    L. 161-17-2 (note 130/2026-11-05-crpnpac-et-regime-general.md). Restent : la
    condition de vingt annuités de R. 426-11, I, 2°, que le modèle n'oppose pas, abaissée
    de 2012 à 2019 par le décret n° 2011-1500, article 26, I (« à 17 annuités » en 2014,
    « à 19,5 annuités » en 2019 : fiche crpn_pension_des_navigants) ; et l'âge de la
    CRPNPAC avant 2012, lu le 5 novembre 2026 (relecture R-N) : cinquante ans et, par
    anticipation, quarante-cinq (R. 426-15-1 de 1984 et de 1995), que le modèle refuse
    (fiche crpn_pension_des_navigants). Les notes 130/2026-11-05-relecture-de-n-crpnpac.md
    et 130/2026-11-05-retouches-de-la-relecture-r-n.md disent le détail. Instruites le
    5 novembre 2026 (file N de la vague 9) : la CAVOM, la CARPIMKO et la CPRN se
    servent à leur âge, sans la base ; la CAVP s'ouvre à l'âge de la base, sauf en
    carrière longue avant 2024 (approximations ; notes
    130/2026-11-05-complementaire-avant-la-base-des-liberaux.md et 130/2026-11-05-n-bis.md).
    Reste présumée suivre sa base, sans lecture de ses statuts sur ce point : la
    CARCDSF.
  - >-
    Le 5 novembre 2026 (file N-bis, action 130) : les statuts de la CAVOM d'avant le
    1er janvier 2016, de la CARPIMKO d'avant le 3 octobre 2015 (arrêté du 20 novembre
    1996) et de la CPRN d'avant le 1er janvier 2014 (Bulletin officiel n° 2005/01),
    publiés au seul Bulletin officiel, ou auprès des caisses, pour lever les présomptions
    de la CAVOM servie dès 60 ans et de la CARPIMKO et de la CPRN servies à l'âge de la
    base (approximations).
  - >-
    Le 5 novembre 2026 (file L-bis, action 130) : les statuts de la CARPV d'avant le
    1er janvier 2022, au Bulletin officiel (n° 99/33 pour l'arrêté du 5 juillet 1999 ;
    celui du ministère de la santé de 2006 pour l'arrêté du 28 août 2006), ou auprès de
    la caisse, pour lever la présomption de la CARPV demandée sans la base.
  - >-
    Ouverte le 29 septembre 2026, avec le domaine des départs multiples et de la vie
    après le départ (docs/architecture.md, § 11), à la demande du propriétaire. Aucun
    exemple chiffré publié d'un polypensionné liquidant à deux dates n'a été trouvé ;
    en chercher un (Cnav, SRE, CNRACL, info-retraite) avant de la dire conforme.
  - >-
    Les régimes spéciaux dont le modèle calcule la pension ont chacun leur pension à
    jouissance différée, que leurs décrets écrivent : le modèle leur donne l'âge que
    leur fiche porte, et leurs textes restent à relire sur ce point.
  lectures:
  - type: legifrance
    reference: >-
      L. 161-17-2 CSS, ses versions dans l'index LEGI du dépôt, dont la dernière
      (LEGIARTI000053280889, du 31 décembre 2025) : aucune rédaction postérieure
    date: 2026-09-29
  - type: legifrance
    reference: >-
      L. 25 CPCMR, rédaction du 1er septembre 2023 (LEGIARTI000047452796) : les âges
      avant lesquels la liquidation « ne peut intervenir », du civil, de l'officier et
      du non-officier ; « les règles de liquidation de la pension sont celles en vigueur
      au moment de sa mise en paiement » ; la revalorisation du traitement de la
      radiation à la mise en paiement
    date: 2026-09-29
  - type: legifrance
    reference: >-
      arrêté du 30 décembre 1970 relatif à l'Ircantec, article 16, rédaction du 1er
      juillet 2011 (LEGIARTI000024266924) : liquidation normale à l'âge de L. 351-8,
      1°, anticipation « au plus tôt dix ans avant », coefficient 0,43 puis marches de
      0,0175, 0,0125 et 0,01 par trimestre, non appliqué au taux plein du régime
      général
    date: 2026-09-29
  - type: autre
    reference: >-
      accord national interprofessionnel du 17 novembre 2017, article 84, lu par la
      fiche coefficients_anticipation_agirc_arrco le 27 septembre 2026 : « au plus tôt
      10 ans avant cet âge », sans coefficient « à l'âge auquel il a obtenu la pension
      d'assurance vieillesse du régime général ou du régime des assurances sociales
      agricoles à taux plein »
    url: https://www.agirc-arrco.fr/storage/2024/09/201809dc_ANI_du_17_novembre_2017.pdf
    date: 2026-09-29
  - type: autre
    reference: >-
      Ircantec, « Les conditions de départ à la retraite » : « vous pouvez bénéficier de
      votre pension Ircantec au plus tôt à l'âge de 57 ans », au coefficient de l'âge
      seul avant l'âge légal de la génération (« situation 1 », 76,25 % à 61 ans et 9
      mois pour un assuré né en décembre 1964), au meilleur des deux coefficients
      au-delà ; premier exemple chiffré d'une complémentaire servie avant le régime
      de base
    url: https://www.ircantec.retraites.fr/actif/preparer-ma-retraite/conditions-depart-retraite
    date: 2026-10-13
  - type: legifrance
    reference: >-
      code de l'aviation civile, R. 426-11 dans ses cinq rédactions (LEGIARTI000006845205
      de 1984, LEGIARTI000006845206 de 1995, LEGIARTI000023049284 de 2010,
      LEGIARTI000024795153 de 2012, LEGIARTI000044496243 de 2021), R. 426-11-1
      (LEGIARTI000006845207, 1995-2011), R. 426-16-1 (LEGIARTI000036880164, 2018) ; code
      des transports, R. 6527-21 (LEGIARTI000048325100, 2023) ; code de la sécurité
      sociale, L. 351-1 (LEGIARTI000023035688), L. 161-17-2 (LEGIARTI000025014605 et
      LEGIARTI000053280889), D. 351-1-1 (LEGIARTI000026139949 : « à cinquante-huit ans
      » au plus tôt pour les nés à compter de 1960 « ayant débuté leur activité avant
      l'âge de seize ans »), L. 351-1-3 (LEGIARTI000028498841 : « une incapacité
      permanente d'au moins 50 % »), dans l'index LEGI du dépôt, à jour au 2 novembre
      2026 : la CRPNPAC s'ouvre à cinquante ans sans condition sur le régime général
    date: 2026-11-05
  - type: legifrance
    reference: >-
      Rouverts le 5 novembre 2026 (action 130, Retouches 3), index LEGI du dépôt à jour au 2
      novembre 2026, pour la relecture R-N : R. 426-16-1, rédaction du 7 mai 2018
      (LEGIARTI000036880164, jusqu'au 1er novembre 2023) citée à la lettre ; R. 6527-21
      (LEGIARTI000048325100) ; R. 426-15-1 (LEGIARTI000006845221, LEGIARTI000006845222) ;
      R. 426-15-4 (LEGIARTI000006845227) ; décret n° 2011-1500, article 26, I
      (LEGIARTI000024779267) ; D. 351-1-1, ses rédactions depuis 2023 : du 1er septembre
      2023 (LEGIARTI000047634571, pensions prenant effet à compter de cette date), du 1er
      janvier 2026 (LEGIARTI000053356023, décret n° 2025-1410), du 1er septembre 2026
      (LEGIARTI000054059621, décret n° 2026-345), qui disent toutes, au I, « 4° A
      soixante-trois ans pour les assurés qui ont débuté leur activité avant l'âge de
      vingt-et-un ans » : le navigant entré à vingt-deux ans n'a la carrière longue à
      aucune date
    date: 2026-11-05
  - type: legifrance
    reference: >-
      Rouverts le 5 novembre 2026 (action 130, Retouches 3), index LEGI du dépôt à jour au 2
      novembre 2026, pour la relecture R-E2 : L. 643-3, IV (LEGIARTI000047453031 ;
      LEGIARTI000053280388), L. 643-4, 2° (LEGIARTI000047453026), D. 643-14
      (LEGIARTI000047634694), D. 351-1-14 (LEGIARTI000047634688 ; LEGIARTI000053355951),
      L. 643-5 (LEGIARTI000006743795), L. 351-7 (LEGIARTI000006742675) : l'inapte des
      professions libérales à soixante-deux ans (approximations)
    date: 2026-11-05
  - type: jorf
    reference: >-
      Lus le 5 novembre 2026 (action 130, file N de la vague 9), index JORF du dépôt à
      jour au 3 novembre 2026 : les statuts de la CAVOM (JORFARTI000031740853,
      JORFARTI000050823056, règlement JORFARTI000054435969), de la CARPIMKO
      (JORFARTI000031255547, JORFARTI000048880643, règlement JORFARTI000054435915), de
      la CPRN (JORFARTI000028387445, JORFARTI000034975971, JORFARTI000048679350,
      règlement JORFARTI000054435995) et de la CAVP (JORFARTI000020694605,
      JORFARTI000024270214, règlement JORFARTI000054436087), et les articles des
      arrêtés qui datent leur effet : chacune de ces complémentaires à son âge, sans
      condition de la base (contenu.complementaires)
    date: 2026-11-05
  - type: jorf
    reference: >-
      Lus le 5 novembre 2026 (file N-bis), relevés par la relecture R-N2 : pour la CAVOM,
      l'arrêté du 26 décembre 2018 (JORFARTI000037883374), statuts généraux, et celui du
      28 août 2020 (JORFARTI000042311285), qui insère à l'article 14 « , sous réserve des
      dérogations prévues à l'article 15, » et récrit l'article 15, le cumul : « sous
      réserve que la pension du régime de base soit liquidée », une condition du cumul
      d'une activité, non de la liquidation de qui cesse toute activité ; pour la
      CARPIMKO, l'arrêté du 23 mai 2019 (JORFARTI000038529117 : article 12, « b. A partir
      de cinquante-cinq ans, sans abattement, pour les affiliés qui remplissent les
      conditions pour bénéficier de la retraite anticipée des assurés handicapés dans le
      régime de base ») et celui du 14 novembre 2025 (JORFARTI000052604992, les
      cotisations et les points) ; pour la CAVP, l'arrêté du 19 décembre 2023
      (JORFARTI000048880592), qui récrit l'article 15 sans changer l'âge et y ajoute la
      liquidation anticipée (approximations). Aucun ne lie la complémentaire à la base
    date: 2026-11-05
code:
  python: >-
    droit/departs.py : departs, departs_et_demandes, _au_trimestre_civil,
    DemandeExaminee, liquider_les_departs ; carriere.py : Carriere.demandes_de_pension ;
    droit/liquidation.py : Demande, Etat ; droit/ouvrir.py : ouvrir ;
    droit/liquider.py : liquider_chaque_regime ; droit/completer.py : completer ;
    scenarios/actuel.py : resultat_des_departs ; echeancier.py : Echeancier._partir ;
    revalorisation.py : mener_au_mois, faire_vivre
  javascript: >-
    moteur/js/droit/departs.js : departs, departsEtDemandes, auTrimestreCivil,
    DemandeExaminee, liquiderLesDeparts ; moteur/js/carriere.js : Carriere.demandesDePension ;
    moteur/js/saisie.js : PREFIXE_DEMANDE ; moteur/js/droit/liquidation.js : Demande,
    Etat ; moteur/js/droit/ouvrir.js : ouvrir ; moteur/js/droit/liquider.js :
    liquiderChaqueRegime ; moteur/js/droit/completer.js : completer ;
    moteur/js/scenario-actuel.js : resultatDesDeparts ; moteur/js/echeancier.js :
    Echeancier._partir ; moteur/js/revalorisation.js : menerAuMois, faireVivre ;
    moteur/js/pages.js : departsEchelonnes, demandesNonSuivies, datesDesPensions
  parametres: >-
    contenu.parametres de chaque version : depart_tous_regimes
  tests: >-
    tests/test_departs.py ; tests/test_ouverture_des_navigants.py ;
    tests/test_complementaires_liberales_a_leur_age.py ; les témoins departs_*, demande_* et metiers_militaire_* des
    simulations, et simuler_demande_de_pension des pages ;
    tests/test_liquidation.py, qui compare les journaux des deux moteurs
  moteur: >-
    Une demande nomme les régimes qu'elle liquide (Demande.regimes) ; l'état porte les
    pensions que des départs précédents servent déjà (Etat.servies), que completer
    compte à l'écrêtement du minimum contributif (servies).
historique:
- >-
  2026-09-29 — née avec le troisième domaine, les départs multiples et la vie après le
  départ, ouvert à la demande du propriétaire (« je souhaite qu'on puisse traiter tous
  les cas où cela peut se produire ; il faut que l'on colle le plus possible à la
  réalité »).
- >-
  2026-09-29 — appliquée, approchée : un départ par unité de régimes, chacun liquidé à
  sa date sur la carrière arrêtée à cette date et voyant servies les pensions des
  précédents, dans les deux moteurs ; la page dit quand chaque pension commence.
- >-
  2026-09-30 — la date de chaque pension se dit, régime par régime, au formulaire ou
  par l'adresse : une date plus tardive que la présumée la remplace, une plus précoce
  ne l'avance pas, et la page dit pourquoi ; le départ qu'elle date est un acte de la
  personne, non une présomption.
- >-
  2026-11-13 — corrigée (action 130, décision du propriétaire du même jour, ligne 3 de
  la file) : l'âge où s'ouvre une unité que sa date sépare du départ déclaré se lisait
  dans les règles en vigueur à ce départ ; il se lit dans celles de chaque mois qui le
  suit, jusqu'au premier où l'assuré a l'âge qu'elles lui opposent, dans les deux
  moteurs. Le notaire né le 10 mars 1961, parti à 62 ans le 1er avril 2023, reçoit sa
  CPRN le 1er janvier 2024, où les statuts de 2024 la lui ouvrent (article 18, arrêté
  du 29 novembre 2023), et non le 1er avril 2025, à 64 ans ; né en mars 1960, le 1er
  janvier 2024 et non le 1er avril (fiche `cprn_ages_decote_enfants`).
effet: >-
  Tout polypensionné dont les régimes n'ouvrent pas au même âge : le fonctionnaire de
  catégorie active ou le militaire qui a aussi travaillé dans le privé, l'agent d'un
  régime spécial, le marin. Jusqu'au 29 septembre 2026, le modèle liquidait tout à la
  date du départ, à l'âge du régime le plus précoce : une aide-soignante née en 1965,
  dix ans dans le privé puis vingt-sept à l'hôpital, partie à cinquante-sept ans,
  recevait dès cet âge 2 001 € par an de régime général, taux de 37,5 %, que le droit
  ne lui ouvre qu'à soixante-deux ans et neuf mois ; un militaire de dix-sept ans de
  services passé au privé jusqu'à soixante-quatre ans voyait sa pension militaire
  commencer à soixante-quatre ans au lieu de trente-cinq.
