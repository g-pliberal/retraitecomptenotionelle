schema_version: 1
id: prolongation_activite_categorie_active
intitule: >-
  Le fonctionnaire d'un corps dont la limite d'âge est inférieure à celle des sédentaires
  est maintenu en activité, sur sa demande et sous réserve de son aptitude physique,
  jusqu'à la limite des sédentaires — soixante-cinq ans en 2010, celle de sa génération
  depuis juillet 2011, soixante-sept ans pour les nés à compter de 1955 —, après les
  reculs et la prolongation pour carrière incomplète ; le congé de longue maladie ou de
  longue durée y met fin, et la période compte dans la pension, surcote comprise.
domaine: age
regimes: [fonction_publique_etat, cnracl]
etape: preparer_la_chronologie
face: droit
etat: manquante
lit:
- la limite d'âge de l'emploi actif, reculée et prolongée le cas échéant (fiches
  `limite_age_fonction_publique`, `recul_limite_age_enfants` et
  `prolongation_activite_carriere_incomplete`)
- la limite des sédentaires de la génération de l'assuré
ecrit:
- la date où le maintien finit, que la radiation des cadres suit
dates_qui_decident:
- age_atteint
versions:
- id: avant_2010
  statut: supposee
  hypothese: >-
    aucun maintien de droit commun du fonctionnaire actif jusqu'à la limite des
    sédentaires avant l'article 1-3 de la loi n° 84-834 ; seul l'article 2 du décret n°
    48-1907, non lu, permettait aux actifs dont la limite est inférieure à soixante-cinq
    ans de « continuer à bénéficier, sur leur demande » d'une disposition que le décret n°
    53-711 ne décrit pas
  fiabilite: faible, l'article 2 du décret n° 48-1907 n'est pas lu
  textes:
  - {id: LEGIARTI000006501737, article: "décret n° 53-711 du 9 août 1953, article 1er", en_vigueur: 1953-08-10}
  nee_de: LEGIARTI000006501737
  bornes:
    age_atteint: [null, 2010-01-01]
  contenu:
    droit: >-
      « les fonctionnaires occupant des emplois classés dans la catégorie B et dont la
      limite d'âge fixée en application de l'alinéa 1er ci-dessus est inférieure à
      soixante-cinq ans, pourront continuer à bénéficier, sur leur demande, des
      dispositions de l'article 2 du décret n° 48-1907 du 18 décembre 1948 » (décret n°
      53-711, article 1er)
  exemples: aucun trouvé
- id: loi_de_2009
  statut: lue
  textes:
  - {id: LEGIARTI000019959717, article: "loi n° 84-834, article 1-3", en_vigueur: 2010-01-01}
  nee_de: LEGIARTI000019959717
  bornes:
    age_atteint: [2010-01-01, 2011-07-01]
  contenu:
    droit: >-
      « Sous réserve des droits au recul des limites d'âge prévus par l'article 4 de la loi
      du 18 août 1936 [...], les fonctionnaires [...] appartenant à des corps ou des cadres
      d'emplois dont la limite d'âge est inférieure à soixante-cinq ans sont, sur leur
      demande, lorsqu'ils atteignent cette limite d'âge, maintenus en activité jusqu'à l'âge
      de soixante-cinq ans [...] sous réserve de leur aptitude physique » ; le congé de
      longue maladie, le congé de longue durée, le temps partiel thérapeutique et le
      reclassement ne s'appliquent plus ; « Lorsque le maintien en activité prend fin, le
      fonctionnaire est radié des cadres et admis à la retraite » ; les périodes de maintien
      « sont prises en compte dans la constitution et la liquidation des droits à pension
      des fonctionnaires et peuvent ouvrir droit à la surcote »
  exemples: aucun trouvé
- id: loi_de_2010
  statut: lue
  textes:
  - {id: LEGIARTI000023031998, article: "loi n° 84-834, article 1-3", en_vigueur: 2011-07-01}
  nee_de: LEGIARTI000023031998
  bornes:
    age_atteint: [2011-07-01, 2022-03-01]
  contenu:
    droit: >-
      le même maintien, « jusqu'à un âge égal à la limite d'âge prévue au même premier
      alinéa », celle des sédentaires de l'article 1er de la loi n° 84-834, qui monte de
      soixante-cinq à soixante-sept ans selon la génération (fiche
      `limite_age_fonction_publique`, version `loi_de_2010`)
  exemples: aucun trouvé
- id: code_general_2022
  statut: lue
  textes:
  - {id: LEGIARTI000044425134, article: "L. 556-7 CGFP", en_vigueur: 2022-03-01}
  nee_de: LEGIARTI000044425134
  bornes:
    age_atteint: [2022-03-01, 2023-06-14]
  contenu:
    droit: >-
      « Le fonctionnaire appartenant à un corps ou à un cadre d'emplois dont la limite d'âge
      est inférieure à celle fixée au 1° de l'article L. 556-1 est maintenu en activité
      jusqu'à l'âge égal à la limite d'âge, sur sa demande lorsqu'il atteint cette limite
      d'âge, prévue au même 1° sous réserve de son aptitude physique. Cette disposition
      intervient, le cas échéant, sous réserve des possibilités de recul de la limite d'âge
      prévues aux articles L. 556-2, L. 556-3 et L. 556-5 » ; mêmes effets qu'en 2010
  exemples: aucun trouvé
- id: reforme_2023
  statut: lue
  textes:
  - {id: LEGIARTI000047452899, article: "L. 556-7 CGFP", en_vigueur: 2023-06-14}
  nee_de: LEGIARTI000047452899
  bornes:
    age_atteint: [2023-06-14, null]
  contenu:
    droit: >-
      le fonctionnaire actif « bénéficie, à sa demande et sous réserve de son aptitude
      physique, d'une prolongation d'activité jusqu'à l'âge fixé au même 1° », soixante-sept
      ans, sous réserve des reculs de L. 556-2, L. 556-3 et L. 556-5 ; « Les périodes de
      prolongation d'activité [...] peuvent ouvrir droit à la surcote » (L. 556-7). Le
      maintien jusqu'à soixante-dix ans de L. 556-1 ne lui est pas ouvert, réservé à
      « celui occupant un emploi qui ne relève pas de la catégorie active »
    application: >-
      selon service-public, demande six mois avant la limite, avec un certificat médical
      d'aptitude ; sans réponse dans les trois mois, l'administration est « implicitement
      considérée comme ayant donné son accord »
  exemples: aucun trouvé
sources:
  lu_le: 2026-10-10
  prochaine_relecture: 2027-10-10
  a_relire:
  - >-
    L'article 2 du décret n° 48-1907 du 18 décembre 1948, que l'index LEGI ne porte pas, et
    le décret n° 2009-1744 du 30 décembre 2009 (JORFTEXT000021572398), qui applique
    l'article 1-3.
  - >-
    Les reculs passent-ils soixante-sept ans pour l'actif ? L. 556-7 fait jouer les reculs
    et la prolongation pour carrière incomplète « sous réserve », puis prolonge « jusqu'à
    l'âge fixé au même 1° » ; le plafond de soixante-dix ans de L. 556-1 vise le
    maintien, que l'actif n'a pas, et service-public ne le nomme pas pour l'actif.
  lectures:
  - type: legifrance
    reference: >-
      loi n° 84-834, article 1-3, rédactions du 1er janvier 2010 et du 1er juillet 2011
      (LEGIARTI000019959717, LEGIARTI000023031998) ; L. 556-7 CGFP, rédactions du 1er mars
      2022 et du 14 juin 2023 (LEGIARTI000044425134, LEGIARTI000047452899). Lus dans
      l'index LEGI du dépôt
    date: 2026-10-10
  - type: service_public
    reference: >-
      fiche F12395, catégorie active : « Maintien jusqu'à 67 ans », demande six mois avant
      la limite, accord implicite faute de réponse en trois mois, impossible en congé de
      longue maladie ou de longue durée ou en temps partiel thérapeutique
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F12395
    date: 2026-01-01
historique:
- >-
  2026-10-10 — née avec l'action 151, étape 2, avec la fiche `limite_age_fonction_publique`.
effet: >-
  Aucun aujourd'hui, le modèle n'appliquant aucune limite d'âge : un policier, une
  aide-soignante, un sapeur-pompier professionnel se simulent en activité jusqu'au départ
  saisi. La limite appliquée, cette prolongation est ce qui leur permet de servir de leur
  limite — cinquante-sept à soixante-deux ans — jusqu'à soixante-sept ans.
textes_a_rattacher:
- reference: >-
    décret n° 2009-1744 du 30 décembre 2009 pris pour l'application de l'article 1-3 de la
    loi n° 84-834 (JORFTEXT000021572398)
