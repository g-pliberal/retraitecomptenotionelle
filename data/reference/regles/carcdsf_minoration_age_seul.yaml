    entier d'exercice libéral suivant le dernier jour du trimestre civil incluant l'âge »,
    aux affiliés « qui poursuivent leur activité libérale » : le trimestre civil où tombe l'âge
    compte au modèle quand l'âge tombe le premier jour d'un trimestre civil, et les
    trimestres sans exercice libéral y comptent (essai du 5 novembre 2026, dans les deux
    moteurs).
  effet: >-
    né le 1er janvier 1948, taux plein à 65 ans le 1er janvier 2013, liquidé le 1er
    janvier 2015 : le texte, sept trimestres civils entiers (avril 2013 à décembre 2014),
    1,07 ; le modèle, 1,08. Le même, sans activité de 2010 à 2014 : le texte, 1 ; le
    modèle, 1,08, et jusqu'à 20 points (25 depuis 2024). Né le 1er janvier 1958, liquidé
    le 1er janvier 2028 : le texte, onze trimestres à 1,25 %, 1,1375 ; le modèle, 1,15
- version: [statuts_de_2024, reglement_de_2026]
