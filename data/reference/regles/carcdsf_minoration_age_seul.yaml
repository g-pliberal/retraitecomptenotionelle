- id: reglement_de_2026
  statut: lue
  textes:
  - id: JORFARTI000054435749
    article: >-
      règlement du régime d'assurance vieillesse complémentaire des chirurgiens-dentistes
      et des sages-femmes, annexe I de l'arrêté du 10 juillet 2026, articles 1er, 3, 5, 9,
      18 et 24
    en_vigueur: 2026-07-18
    publie_le: 2026-07-17
    citation: >-
      « Tout affilié qui justifie avoir exercé et cotisé en tant que libéral pendant au
      moins une année au présent régime peut prétendre à la liquidation de ses droits à
      retraite, sous réserve d'avoir atteint l'âge minimum prévu à l'article L. 161-17-2
      du code de la sécurité sociale. » (article 1er) ; « La liquidation de la pension
      de retraite est effectuée : « I. - Dans les conditions générales d'ouverture du
      droit : « a) A taux plein sans application de coefficients de minoration, à partir
      de l'âge prévu au 1° de l'article L. 351-8 du code de la sécurité sociale ; « b)
      Les affiliés qui liquident leur pension avant l'âge prévu au a du présent I se
      voient appliquer un coefficient de minoration égal à 1,25 % par trimestre manquant
      entre la date d'effet de la liquidation pour un départ à l'âge du taux plein et la
      date de prise d'effet de la pension dans la limite de 15 %. « Le taux de la
      minoration applicable à la pension est définitif ; « c) A taux majoré : « Les
      affiliés qui poursuivent leur activité libérale au-delà de l'âge prévu au a du
      présent I, et qui n'ont pas fait liquider leurs droits à retraite dans le régime
      complémentaire, bénéficient d'une majoration de leur pension, sous réserve de
      respecter les dispositions du deuxième alinéa de l'article 2. « Cette majoration
      est égale à 1 % par trimestre civil entier d'exercice libéral suivant le dernier
      jour du trimestre civil incluant l'âge mentionné au deuxième alinéa du présent c
      et accompli avant le 1 er janvier 2024, dans la limite de 20 %. « Cette majoration
      est égale à 1,25 % par trimestre civil entier d'exercice libéral suivant le
      dernier jour du trimestre civil incluant l'âge mentionné au deuxième alinéa du
      présent c et accompli à compter du 1 er janvier 2024, dans la limite de 25 %. «
      II. - Dans les conditions particulières d'ouverture du droit : « La possibilité
      d'un départ anticipé à la retraite sans qu'il soit fait application du taux de
      minoration prévu au b du I est ouverte : « - avant l'âge prévu au a du I du
      présent article, aux affiliées chirurgiens-dentistes ou sages-femmes, au titre de
      l'incidence sur leur vie professionnelle de la maternité, notamment de la
      grossesse et de l'accouchement, à raison d'une année d'anticipation par enfant mis
      au monde, dans la limite de 5 années maximum ; « - à l'âge prévu au IV de
      l'article L. 643-3 du code de la sécurité sociale pour les affiliés relevant du 2°
      de l'article L. 643-4 du même code ; « - dès l'âge mentionné à l'article L.
      161-17-2 du code de la sécurité sociale aux parents élevant ou ayant élevé un
      enfant handicapé, et ayant droit ou ayant eu droit à ce titre à l'allocation
      d'éducation de l'enfant handicapé et à son complément ou à la prestation de
      compensation du handicap. » (article 3) ; « Le montant de la retraite
      complémentaire est majoré de 10 % au profit des allocataires ayant eu au moins
      trois enfants. » (article 5) ; « Le conjoint survivant d'un affilié qui, au moment
      de son décès, était allocataire ou remplissait les conditions requises pour
      l'ouverture d'un droit à retraite reçoit à 65 ans ou à partir de 60 ans en cas
      d'inaptitude au travail, une retraite de réversion du régime complémentaire. « Le
      conjoint survivant peut, à partir de l'âge de 60 ans, demander la liquidation de
      sa retraite de réversion par anticipation, avec application d'un coefficient de
      minoration de 1,25 % par trimestre manquant entre la date d'entrée en jouissance
      de la pension de réversion à l'âge de 65 ans et la date de prise d'effet de la
      pension de réversion. » (article 9) ; « Le conjoint survivant de l'affilié
      retraité a droit à une retraite de réversion égale à 60 % de la retraite
      complémentaire versée ou qui aurait été versée au titulaire, dans les conditions
      prévues aux articles 1 à 4 du présent règlement. » (article 18) ; « Leur paiement
      s'effectue mensuellement et à terme échu, à partir du premier jour du trimestre
      civil qui suit la date de demande de liquidation de la retraite jusqu'au dernier
      jour du trimestre civil au cours duquel le décès de l'allocataire intervient. »
      (article 24)
