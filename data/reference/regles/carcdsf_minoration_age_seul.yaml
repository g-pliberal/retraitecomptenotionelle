      taux_plein_anticipe_maximum_annees: 5
      age_sans_coefficient_de_l_inapte: age_legal_par_generation
      categories_sans_coefficient: [taux_plein_anciens_deportes_internes]
    droit: >-
      liquidation dès l'âge de L. 161-17-2 ; taux plein à cet âge majoré de cinq ans ;
      avant, 5 % par année d'anticipation pour les nés avant le 1er juillet 1951, depuis la
      date d'effet d'un départ à 65 ans ; le tableau annexé pour les nés du 1er juillet
      1951 au 31 décembre 1955 ; 1,50 % par trimestre manquant pour les nés depuis 1956 ;
      au-delà, 1 % par trimestre civil entier d'exercice libéral suivant le trimestre civil
      de l'âge du taux plein, 20 % au plus ; la durée d'assurance n'entre nulle part ; 10 %
      de plus pour trois enfants
    conditions: >-
      sans minoration dès l'âge de L. 161-17-2, l'inapte, le grand invalide de guerre,
      l'ancien déporté ou interné (19, I, a) ; l'affiliée, une année plus tôt que le taux
      plein par enfant mis au monde, cinq au plus (19, II)
