- id: statuts_de_2007
  statut: lue
  textes:
  - id: JORFARTI000001859980
    article: >-
      statuts du régime complémentaire de la Caisse autonome de retraite des
      chirurgiens-dentistes, annexe de l'arrêté du 1er octobre 2007, articles 18, 20 et 23
    en_vigueur: 2007-10-11
    publie_le: 2007-10-10
    citation: >-
      « L'ouverture du droit à la retraite est accordée, dans les conditions fixées aux
      articles suivants des présents statuts, au chirurgien-dentiste qui justifie avoir
      exercé et cotisé en tant que libéral pendant au moins une année au présent régime.
      » (article 18) ; « La liquidation de la pension de retraite est effectuée : I. -
      Dans les conditions générales d'ouverture du droit : a) A taux plein sans
      application de coefficients de minoration : - à partir de 65 ans ; - à partir de
      60 ans pour les adhérents : - reconnus atteints d'inaptitude à l'exercice de la
      profession dûment constatée selon les modalités prévues à l'article 22 ; -
      titulaires de la carte de grands invalides de guerre visés aux articles L. 36 et
      L. 37 du code des pensions militaires d'invalidité et des victimes de la guerre ;
      - titulaires de la carte d'ancien déporté, ancien interné de la Résistance ou
      ancien interné politique visés à l'article L. 643-2 du code de la sécurité
      sociale. b) Avec application d'un coefficient de minoration, fonction de l'âge à
      la date à laquelle la pension prend effet pour les assurés âgés entre 60 et 65
      ans, dans les conditions suivantes : - 25 % pour un départ en retraite au cours de
      la 61e année ; - 20 % pour un départ en retraite au cours de la 62e année ; - 15 %
      pour un départ en retraite au cours de la 63e année ; - 10 % pour un départ en
      retraite au cours de la 64e année ; - 5 % pour un départ en retraite au cours de
      la 65e année. Le taux de la minoration applicable à la pension est définitif. II.
      - Dans les conditions particulières d'ouverture du droit : Bénéficient de la
      possibilité d'un départ anticipé entre 60 et moins de 65 ans sans qu'il soit fait
      application du taux de minoration prévu au b du I : a) Les anciens prisonniers de
      guerre et anciens combattants qui remplissent les conditions d'âge et de durée de
      service prévues par la loi n° 73-1051 du 21 novembre 1973, selon les modalités
      fixées aux articles L. 643-4 d et D. 351-2 du code de la sécurité sociale. b) Les
      adhérentes chirurgiens-dentistes ayant élevé un ou plusieurs enfants pendant au
      moins neuf ans avant leur seizième anniversaire, à leur charge effective ou à
      celle de leur conjoint : - à partir de 64 ans pour un enfant ; - à partir de 63
      ans pour deux enfants ; - à partir de 62 ans pour trois enfants ; - à partir de 61
      ans pour quatre enfants ; - à partir de 60 ans pour cinq enfants ou plus. »
      (article 20) ; « Le montant de la retraite complémentaire est majoré de 10 % au
      profit des allocataires ayant eu au moins trois enfants. » (article 23)
  - id: JORFARTI000001289079
    article: >-
      arrêté du 1er octobre 2007, article 1er ; ses articles 2 et 3 abrogent le règlement
      de 1955 et chargent le directeur de la sécurité sociale de l'exécution : aucun ne
      fixe de date, et les statuts entrent en vigueur le lendemain de la publication
    en_vigueur: 2007-10-11
    publie_le: 2007-10-10
    citation: >-
      « Sont approuvés, tels qu'ils sont annexés au présent arrêté, les statuts du
      régime complémentaire de la Caisse autonome de retraite des chirurgiens-dentistes.
      »
  - id: JORFARTI000002063756
    article: même annexe, articles 39 et 48, la réversion
    en_vigueur: 2007-10-11
    publie_le: 2007-10-10
    citation: >-
      « Le conjoint survivant d'un chirurgien-dentiste qui, au moment de son décès,
      était allocataire ou remplissait les conditions requises pour l'ouverture d'un
      droit à retraite reçoit à 65 ans ou à partir de 60 ans en cas d'inaptitude au
      travail, une retraite de réversion du régime complémentaire. Le conjoint survivant
      peut, à partir de l'âge de 60 ans, demander la liquidation de sa retraite de
      réversion par anticipation selon les dispositions prévues à l'article 20 des
      présents statuts. » (article 39) ; « Le conjoint survivant du chirurgien-dentiste
      retraité a droit à une retraite de réversion égale à 60 % de la retraite
      complémentaire versée au chirurgien-dentiste, dans les conditions prévues aux
      articles 18 à 25 des présents statuts. » (article 48)
  nee_de: JORFARTI000001859980
  bornes:
    liquidation.date_effet: [2007-10-11, 2011-07-01]
  contenu:
    parametres:
      abattement_points: cavom
      age_ouverture: 60
      age_taux_plein: 65
      taux_plein_anticipe_par_enfant_annees: 1
      taux_plein_anticipe_maximum_annees: 5
      age_sans_coefficient_de_l_inapte: 60
      categories_sans_coefficient: [taux_plein_anciens_deportes_internes, taux_plein_anciens_combattants_prisonniers]
    droit: >-
      taux plein à 65 ans ; liquidation dès 60 ans, minorée de 25 % « au cours de la 61e
      année », de 60 à 61 ans, puis de cinq points de moins par année d'âge, 5 % au cours
      de la 65e ; aucune majoration au-delà de 65 ans ; la durée d'assurance n'entre
      nulle part ; 10 % de plus pour trois enfants
    conditions: >-
      sans minoration dès 60 ans, l'inapte, le grand invalide de guerre, l'ancien déporté
      ou interné (20, I, a) ; entre 60 et 65 ans, l'ancien prisonnier ou combattant de la
      loi n° 73-1051, et l'adhérente qui a élevé des enfants neuf ans au moins avant leurs
      seize ans, de 64 ans pour un enfant à 60 ans pour cinq (20, II). Les statuts ne
      nomment que les chirurgiens-dentistes : les sages-femmes, entrées en 2009, n'y sont
      pas nommées, et l'arrêté du 28 décembre 2010 n'en change que le titre
  exemples: aucun trouvé
- id: statuts_de_2011
  statut: lue
  textes:
  - id: JORFARTI000023909792
    article: >-
      statuts du régime d'assurance vieillesse complémentaire de la section professionnelle
      des chirurgiens-dentistes et des sages-femmes, annexe de l'arrêté du 13 avril 2011,
      articles 17, 19 et 22, et son tableau
    en_vigueur: 2011-07-01
    publie_le: 2011-04-27
    citation: >-
      « Tout adhérent qui justifie avoir exercé et cotisé en tant que libéral pendant au
      moins une année au présent régime peut prétendre à la liquidation de ses droits à
      retraite, sous réserve d'avoir atteint l'âge minimum prévu à l'article L. 161-17-2
      du code de la sécurité sociale. » (article 17) ; « La liquidation de la pension de
      retraite est effectuée : I. ― Dans les conditions générales d'ouverture du droit :
      a) A taux plein sans application de coefficients de minoration : ― à partir de
      l'âge prévu à l'article L. 161-17-2 du code de la sécurité sociale majoré de cinq
      ans ; ― à partir de l'âge prévu à l'article L. 161-17-2 du même code pour les
      adhérents : ― reconnus atteints d'inaptitude à l'exercice de la profession dûment
      constatée selon les modalités prévues à l'article 21 ; ― titulaires de la carte de
      grands invalides de guerre visés aux articles L. 36 et L. 37 du code des pensions
      militaires d'invalidité et des victimes de la guerre ; ― titulaires de la carte
      d'ancien déporté, ancien interné de la résistance ou ancien interné politique
      visés à l'article L. 643-2 du code de la sécurité sociale. b) Les adhérents qui
      liquident leur pension avant l'âge du taux plein prévu à l'article L. 161-17-2 du
      code de la sécurité sociale majoré de cinq ans, se voient appliquer un coefficient
      de minoration, fonction de l'âge atteint à la date d'entrée en jouissance de la
      pension : ― pour les assurés nés antérieurement au 1er juillet 1951, le
      coefficient de minoration est égal à 5 % par année d'anticipation entre la date
      d'effet de la pension pour un départ en retraite à l'âge de 65 ans et la date de
      prise d'effet de la pension ; ― pour les assurés nés entre le 1er juillet 1951 et
      le 31 décembre 1955 inclus, le coefficient de minoration est fonction de la
      génération à laquelle appartient l'assuré et du nombre de trimestres qui sépare la
      date d'effet de la liquidation pour un départ à l'âge du taux plein, de la date de
      prise d'effet de la pension. Le tableau joint en annexe indique les coefficients
      de minoration applicables aux générations visées ci-dessus ; ― pour les assurés
      nés à compter du 1er janvier 1956, le coefficient de minoration est égal à 1,50 %
      par trimestre manquant entre la date d'effet de la liquidation pour un départ à
      l'âge du taux plein et la date de prise d'effet de la pension. Le taux de la
      minoration applicable à la pension est définitif. c) A taux majoré : Les adhérents
      qui poursuivent leur activité libérale au-delà de l'âge prévu à l'article L.
      161-17-2 du code de la sécurité sociale majoré de cinq ans, et qui n'ont pas fait
      liquider leurs droits à retraite dans le régime complémentaire, bénéficient d'une
      majoration de leur pension. Cette majoration est égale à 1 % par trimestre civil
      entier d'exercice libéral suivant le dernier jour du trimestre civil incluant
      l'âge mentionné à l'alinéa précédent, dans la limite de 20 %. II. ― Dans les
      conditions particulières d'ouverture du droit : La possibilité d'un départ
      anticipé avant l'âge prévu à l'article L. 161-17-2 du code de la sécurité sociale
      majoré de cinq ans, sans qu'il soit fait application du taux de minoration prévu
      au b du I, est ouverte aux adhérentes chirurgiens-dentistes ou sages-femmes, au
      titre de l'incidence sur leur vie professionnelle de la maternité, notamment de la
      grossesse et de l'accouchement, à raison d'une année d'anticipation par enfant mis
      au monde, dans la limite de cinq années maximum. » (article 19) ; « Le montant de
      la retraite complémentaire est majoré de 10 % au profit des allocataires ayant eu
      au moins trois enfants. » (article 22) ; le tableau : « Vous pouvez consulter le
      tableau dans le JOn° 98 du 27/04/2011 texte numéro 14 »
  - id: JORFARTI000023909788
    article: arrêté du 13 avril 2011, article 3
    en_vigueur: 2011-07-01
    publie_le: 2011-04-27
    citation: >-
      « Les dispositions du présent arrêté entrent en vigueur à compter du 1er juillet
      2011. »
  - id: JORFARTI000023909786
    article: arrêté du 13 avril 2011, article 2
    en_vigueur: 2011-07-01
    publie_le: 2011-04-27
    citation: >-
      « L'arrêté du 1er octobre 2007 portant approbation des statuts du régime
      complémentaire d'assurance vieillesse de la caisse autonome de retraite des
      chirurgiens-dentistes est abrogé. »
