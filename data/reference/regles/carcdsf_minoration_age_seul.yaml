- version: [statuts_de_2017, statuts_de_2024, reglement_de_2026]
  textes: statuts de 2017 et de 2024, article 61 ; règlement de 2026, article 24
  ecart: >-
    Le modèle fait partir la pension au premier jour du mois qui suit l'âge (fiche
    `date_effet_mois_suivant`), quand le texte la sert « à partir du premier jour du
    trimestre civil qui suit la date de demande de liquidation de la retraite ». La
    demande n'est pas une donnée du modèle, et les statuts de 2007 et de 2011 ne sont
    relus que pour l'âge.
  effet: non mesuré ; le trimestre de minoration ou de majoration qui sépare les deux dates
