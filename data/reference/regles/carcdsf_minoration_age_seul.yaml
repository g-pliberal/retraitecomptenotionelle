  ecart: >-
    Le modèle liquide toute l'année 2024 par la règle de 2024, quand les statuts de 2017
    restent en vigueur jusqu'au 9 janvier : une pension qui prend effet le 1er janvier 2024
    reçoit la minoration de 2024, 15 % au plus, et non celle de 2017, 1,50 % par trimestre
    pour les nés depuis 1955, sans limite. Ce que la caisse a servi à ces pensions n'est
    pas lu (essai du 5 novembre 2026, dans les deux moteurs).
  effet: >-
