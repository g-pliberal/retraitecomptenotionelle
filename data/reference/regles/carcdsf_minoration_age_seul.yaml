- version: [statuts_de_2007, statuts_de_2011, statuts_de_2011_modifies_en_2012, statuts_de_2017, statuts_de_2024, reglement_de_2026]
  textes: >-
    statuts de 2007, articles 39 et 48 ; de 2011, articles 32 et 41 (51 depuis 2017) ;
    règlement de 2026, articles 9, 18 et 19
  ecart: >-
    Le modèle ne sert aucune réversion de la CARCDSF : la ligne vaut zéro, motif
    `non_portee`, comme pour la CAVEC, la CARPV et la CAVAMAC. Le texte sert au conjoint
    survivant, à 65 ans, ou à 60 ans s'il est inapte, 60 % de la retraite complémentaire,
    par anticipation dès 60 ans avec une minoration (par l'âge en 2007, 1,25 % par
    trimestre manquant depuis 2011), et la majoration de 10 % pour trois enfants.
  effet: >-
    dentiste né le 1er juin 1950, liquidé à 65 ans, mort en juin 2020, conjointe née en
    1952 : base 6 912,27 €, montant 0 dans les deux moteurs ; le texte, 60 %, 4 147,36 €
