  textes:
  - id: JORFARTI000048880707
    article: arrêté du 27 décembre 2023, annexe, I, 4° et 8°
    en_vigueur: 2024-01-10
    publie_le: 2024-01-09
    citation: >-
      « 4° L'article 35 est remplacé par les dispositions suivantes : « Art. 35. - La
      liquidation de la pension de retraite est effectuée : « I. - Dans les conditions
      générales d'ouverture du droit : « a) A taux plein sans application de
      coefficients de minoration, à partir de l'âge prévu au 1° de l'article L. 351-8 du
      code de la sécurité sociale ; « b) Les affiliés qui liquident leur pension avant
      l'âge prévu au a du présent I. se voient appliquer un coefficient de minoration
      égal à 1,25 % par trimestre manquant entre la date d'effet de la liquidation pour
      un départ à l'âge du taux plein et la date de prise d'effet de la pension dans la
      limite de 15 %. « Le taux de la minoration applicable à la pension est définitif ;
      « c) A taux majoré : « Les affiliés qui poursuivent leur activité libérale au-delà
      de l'âge prévu au a du présent I, et qui n'ont pas fait liquider leurs droits à
      retraite dans le régime complémentaire, bénéficient d'une majoration de leur
      pension, sous réserve de respecter les dispositions du deuxième alinéa de
      l'article 34. « Cette majoration est égale à 1 % par trimestre civil entier
      d'exercice libéral suivant le dernier jour du trimestre civil incluant l'âge
      mentionné au deuxième alinéa du présent c et accompli avant le 1er janvier 2024,
      dans la limite de 20 %. « Cette majoration est égale à 1,25 % par trimestre civil
      entier d'exercice libéral suivant le dernier jour du trimestre civil incluant
      l'âge mentionné au deuxième alinéa du présent c et accompli à compter du 1er
      janvier 2024, dans la limite de 25 %. « II. - Dans les conditions particulières
      d'ouverture du droit : « La possibilité d'un départ anticipé à la retraite sans
      qu'il soit fait application du taux de minoration prévu au b du I est ouverte : «
      - avant l'âge prévu au a du I du présent article, aux affiliées
      chirurgiens-dentistes ou sages-femmes, au titre de l'incidence sur leur vie
      professionnelle de la maternité, notamment de la grossesse et de l'accouchement, à
      raison d'une année d'anticipation par enfant mis au monde, dans la limite de 5
      années maximum ; « - à l'âge prévu au IV de l'article L. 643-3 du code de la
      sécurité sociale pour les affiliés relevant du 2° de l'article L. 643-4 du même
      code ; « - dès l'âge mentionné à l'article L. 161-17-2 du code de la sécurité
      sociale aux parents élevant ou ayant élevé un enfant handicapé, et ayant droit ou
      ayant eu droit à ce titre à l'allocation d'éducation de l'enfant handicapé et à
      son complément ou à la prestation de compensation du handicap. « III. - La
      liquidation anticipée de la retraite prévue aux paragraphes I et II comporte la
      faculté de racheter des points dans les conditions prévues aux articles : « - 29 à
      31 pour les chirurgiens-dentistes ; « - 29 et 31 pour les sages-femmes. » ; » ; «
      8° A l'article 61, les trois derniers alinéas sont remplacés par un alinéa ainsi
      rédigé : « Leur paiement s'effectue mensuellement et à terme échu, à partir du
      premier jour du trimestre civil qui suit la date de demande de liquidation de la
      retraite jusqu'au dernier jour du trimestre civil au cours duquel le décès de
      l'allocataire intervient. » »
