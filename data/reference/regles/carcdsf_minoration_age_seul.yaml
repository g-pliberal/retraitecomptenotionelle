- id: statuts_d_avant_octobre_2007
  statut: supposee
  hypothese: >-
    les pensions qui prennent effet avant le 11 octobre 2007 relèvent du règlement
    approuvé par l'arrêté du 6 janvier 1955, que l'arrêté du 1er octobre 2007 abroge
    (article 2, JORFARTI000002267801 : « L'arrêté du 6 janvier 1955 portant approbation
    du règlement de la section professionnelle des chirurgiens-dentistes relatif au
    régime d'assurance vieillesse complémentaire des chirurgiens-dentistes est abrogé
    […] »), et
    de ses modifications, dont l'index JORF du dépôt n'a que des notices : celle du 29
    juin 1984, « L'ART. 15 DES STATUTS EST MODIFIE. » (JORFTEXT000000496869) ;
    celle du 27 février 1985, dont les modifications « PRENNENT EFFET A COMPTER DU
    01-01-1986. »
    (JORFTEXT000000859641) ; celle du 30 novembre 1992 (JORFTEXT000000359654) ; celle du
    21 mars 1997, qui touche le régime complémentaire « (ART. 1 A 28) »
    (JORFTEXT000000565552) et « sera publié intégralement au Bulletin officiel no 97-20
    »
    (JORFARTI000002188059). Leur texte n'est pas lu. Le modèle y sert la décote du
    régime de base des professions libérales, que la durée d'assurance annule, et ni
    la majoration de 10 % pour trois enfants ni l'anticipation des mères : aucun texte
    lu ne fonde cette règle, que la fiche garde faute de mieux
  fiabilite: >-
    faible : l'âge du taux plein, l'âge d'ouverture et le barème, que nul texte lu ne
    date avant le 11 octobre 2007
