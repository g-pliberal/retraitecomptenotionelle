    avril 2011, texte 14 ; JO n° 168 du 21 juillet 2012, texte 3), que l'index ne porte
    pas : le modèle sert 1,25 % par trimestre manquant (`ages_regimes.csv`,
    `carcdsf_2011`, lignes au niveau `estimee`). Pour les nés avant juillet 1951, « 5 % par
