      modifications apportées aux statuts de la section professionnelle des
      chirurgiens-dentistes et des sages-femmes relatifs au régime d'assurance
      vieillesse complémentaire des chirurgiens-dentistes et des sages-femmes. »
  - id: LEGIARTI000025014605
    article: >-
      code de la sécurité sociale, article L. 161-17-2, rédaction du 23 décembre 2011 au
      31 août 2023
    en_vigueur: 2011-12-23
    citation: >-
      « L'âge d'ouverture du droit à une pension de retraite mentionné au premier alinéa
