historique:
- >-
  2026-11-14 — corrigée (action 130, décision du propriétaire du 13 novembre, ligne 21
  de la file) : le modèle liquidait par sa période de 2004 à 2007, qui porte la décote
  du régime de base, les pensions qui prennent effet du 11 octobre au 31 décembre 2007,
  quand les statuts de 2007 sont en vigueur depuis le 11 octobre, lendemain de la
  publication de l'arrêté du 1er octobre 2007, sans disposition transitoire : ni la
  minoration par l'âge dès que la durée était réunie, ni la majoration de 10 % pour
  trois enfants, ni le taux plein avancé de la mère n'étaient servis. La période de
  2008 de `carcdsf_complementaire.yaml` liquide désormais les pensions qui prennent
  effet depuis le 11 octobre 2007 (`date_effet`), dans les deux moteurs : le dentiste
  né le 1er août 1945, au travail dès 20 ans, pension au 1er novembre 2007 à 62 ans
  et 3 mois, « au cours de la 63e année », reçoit le coefficient 0,85 de l'article 20
  au lieu de 1 (6 399,74 € par an au lieu de 7 529,11 €, en euros de 2026) ; né le
  1er août 1947, à 60 ans et 3 mois, 0,75 ; la mère de trois enfants née le 1er août
  1945, sans minoration, reçoit les 10 % de l'article 23 (752,91 €) au lieu de rien.
