effet: >-
  La fiche lisait 62 et 67 ans et la décote du régime de base, que la durée annule
  : un dentiste parti à 64 ans avec sa durée ne perdait rien de sa complémentaire,
  là où la caisse lui retire 15 % depuis 2024 et 18 % de 2017 à 2023. Depuis le
  23 septembre 2026, `abattement_points: cavom` de 2008 à 2010, table `carcdsf_2011`,
  `decote_annulee_par_la_duree: false`, `decote_trimestres_maximum: 12`, majoration
  `par_age_seul` et `taux_plein_anticipe_par_enfant_annees`, dans les deux moteurs
  ; tenu par tests/test_sections_sante.py. Lue au droit le 5 novembre 2026 (action
  130) : sept versions, les statuts de 2007 en vigueur le 11 octobre 2007, présumés
  avant, ceux de 2011 le 1er juillet 2011, leurs bornes le 22 juillet 2012, les âges
  écrits le 25 décembre 2017, l'article 35 récrit le 10 janvier 2024, le règlement le
  18 juillet 2026 ; ni l'inapte et les catégories sans minoration, ni la réversion ne
  sont servis, ni les statuts de 2007 avant 2008, ni ceux de 2011 au premier semestre ;
  la majoration se compte au temps, non à l'exercice libéral par trimestre civil, et à
  1,25 % les trimestres d'avant 2024.
sources:
  lu_le: 2026-11-05
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Lire le règlement de 1955 et ses modifications, dont celle de 1997 au Bulletin
    officiel (no 97-20), et les statuts de la CARSAF des sages-femmes d'avant 2009 ; dire
    sous quelle règle la caisse a liquidé les sages-femmes de 2009 au 30 juin 2011.
  - >-
    Retrouver le tableau des nés du 1er juillet 1951 à 1954, publié en image (JO n° 98 du
    27 avril 2011, texte 14 ; JO n° 168 du 21 juillet 2012, texte 3).
  - >-
    Poser au propriétaire les écarts de la fiche, et ce que le texte ne tranche pas : la
    pension du 1er janvier 2024 ; l'inapte à 62 ans depuis 2024, que l'article 3, II, du
    règlement ouvre « à l'âge prévu au IV de l'article L. 643-3 » quand l'article 1er
    demande l'âge de L. 161-17-2 ; si les deux plafonds de la majoration (20 et 25 %) se
    cumulent ; si les statuts de 2011 comptent les trimestres d'exercice antérieurs au 1er
    juillet 2011.
  lectures:
  - type: jorf
    reference: >-
      Index JORF du dépôt, à jour du 5 novembre 2026 : les statuts de 2007, de 2011 et leurs
      arrêtés ; les arrêtés du 28 décembre 2010, du 9 juillet 2012, du 30 juillet 2013, du
      22 décembre 2017, du 27 décembre 2023, du 10 juillet 2026 et du 21 septembre 2026,
      lus en entier ; le décret n° 2026-418, articles 5 et 30 ; les notices de 1962 à 1997,
      qui ne donnent que des titres et des numéros d'articles.
    date: 2026-11-05
  - type: legifrance
    reference: >-
      Index LEGI du dépôt, à jour du 4 novembre 2026 : L. 161-17-2, rédactions du 23
      décembre 2011, du 1er septembre 2023 et du 31 décembre 2025 ; L. 351-8, 1°, rédactions
      du 1er septembre 2023 et du 28 février 2025 ; L. 643-3, IV, rédactions du 1er
      septembre 2023 et du 31 décembre 2025 ; L. 643-4, rédaction du 1er septembre 2023 ;
      D. 643-14 ; D. 351-1-14, rédactions du 1er septembre 2023 et du 1er janvier 2026. Le
      décret n° 50-28 n'y est que jusqu'en 2009, et le code civil n'y est pas.
    date: 2026-11-05
  - type: autre
    reference: >-
      CARCDSF, page « A quel âge demander ses droits » : taux plein à 67 ans, «
      1,25 % par trimestre manquant pour atteindre votre 67eme anniversaire », majoration
      de « 1,25 % par trimestre civil cotisé dans la limite de 25 », dix pour cent
      pour trois enfants, une année d'anticipation par enfant pour les femmes, «
      si vous avez eu 2 enfants, vous pouvez bénéficier du taux plein pour ce régime
      dès 65 ans » ; page « Montant des cotisations » 2026 (forfait de 3 210,60
      €, 11,35 % de 0,65 à 5 plafonds), conforme à la fiche.
