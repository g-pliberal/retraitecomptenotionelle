effet: >-
  La fiche lisait 62 et 67 ans et la décote du régime de base, que la durée annule
  : un dentiste parti à 64 ans avec sa durée ne perdait rien de sa complémentaire,
  là où la caisse lui retire 15 % depuis 2024 et 18 % de 2017 à 2023. Depuis le
  23 septembre 2026, `abattement_points: cavom` de 2008 à 2010, table `carcdsf_2011`,
  `decote_annulee_par_la_duree: false`, `decote_trimestres_maximum: 12`, majoration
  `par_age_seul` et `taux_plein_anticipe_par_enfant_annees`, dans les deux moteurs
  ; tenu par tests/test_sections_sante.py. Lue au droit le 5 novembre 2026 (action
  130) : sept versions, les statuts de 2007 en vigueur le 11 octobre 2007, présumés
  avant, ceux de 2011 le 1er juillet 2011, leurs bornes le 22 juillet 2012, les âges
  écrits le 25 décembre 2017, l'article 35 récrit le 10 janvier 2024, le règlement le
  18 juillet 2026 ; ni le grand invalide de guerre et le parent d'un enfant
  handicapé ne sont servis sans minoration, ni les statuts de 2017 du 1er au 9 janvier 2024 ;
  la majoration se compte à 1,25 % les trimestres d'avant 2024.
  Corrigée le 14 novembre 2026 (décision du propriétaire du 13 novembre, ligne 4 de la
  file de l'action 130) : jusque-là, le modèle ne servait aucune réversion de la CARCDSF,
  motif `non_portee` ; il en sert depuis 60 % au conjoint de 65 ans, dans les deux
  moteurs (fiche `reversion_carcdsf`, qui en déclare les limites).
  Les statuts de 2007, que le modèle ne servait qu'aux pensions de 2008, le sont
  depuis le 14 novembre 2026 à celles qui prennent effet depuis le 11 octobre 2007
  (historique). Ceux de 2011, que le modèle servait dès le 1er janvier 2011, ne le
  sont plus, depuis le même jour, qu'aux pensions qui prennent effet depuis le
  1er juillet 2011 (historique).
  L'inapte, l'ancien déporté ou interné et l'ancien combattant ou prisonnier de
  guerre, que le modèle minorait comme l'assuré valide, sont servis sans minoration
  depuis le 14 novembre 2026, aux âges et sous les textes qui les nomment (historique).
  La majoration, que le modèle comptait au temps écoulé depuis l'âge, que l'affilié
  exerce ou non, se compte depuis le 14 novembre 2026 par trimestre civil entier
  d'exercice qui suit le trimestre civil de l'âge (historique).
  Les trimestres d'avant 2024, que le modèle majorait de 1,25 % comme les suivants, et
  depuis l'âge des statuts de 2017 pour les nés avant 1955, le sont de 1 % depuis le
  14 novembre 2026, et depuis 67 ans pour tous (historique).
