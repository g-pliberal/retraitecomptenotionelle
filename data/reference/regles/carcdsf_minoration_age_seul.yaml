schema_version: 1
id: carcdsf_minoration_age_seul
intitule: >-
  Régime complémentaire de la CARCDSF : du 11 octobre 2007 au 30 juin 2011, taux plein
  à 65 ans, liquidation dès 60 ans avec 5 % de minoration par année d'âge manquante ;
  du 1er juillet 2011 au 9 janvier 2024, taux plein à l'âge de L. 161-17-2 majoré de
  cinq ans (écrit génération par génération depuis le 25 décembre 2017), liquidation
  dès l'âge de L. 161-17-2, minoration de 5 % par année d'anticipation pour les nés
  avant juillet 1951, d'un tableau publié en image pour les nés de juillet 1951 à 1954,
  de 1,50 % par trimestre manquant pour les nés depuis 1955, et majoration de 1 % par
  trimestre civil entier d'exercice libéral au-delà, 20 % au plus ; depuis le 10
  janvier 2024, taux plein à l'âge du 1° de L. 351-8, 67 ans, minoration de 1,25 % par
  trimestre manquant dans la limite de 15 %, majoration de 1 % par trimestre accompli
  avant 2024 et de 1,25 % depuis. La durée d'assurance n'entre nulle part. Sans
  minoration : l'inapte et les catégories que chaque texte nomme ; l'affiliée, une
  année plus tôt par enfant, cinq au plus. Majoration de 10 % pour trois enfants.
  Avant le 11 octobre 2007, la règle que le modèle sert est supposée.
domaine: decote_surcote
regimes: [carcdsf_complementaire]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  l'âge du chirurgien-dentiste ou de la sage-femme à la date d'effet de sa pension, que
  le règlement de 2026 fixe « à partir du premier jour du trimestre civil qui suit la
  date de demande de liquidation de la retraite » (article 24), et sa génération, qui
  donne de 2011 à 2023 l'âge de L. 161-17-2, l'âge du taux plein et le barème de la
  minoration
- >-
  les catégories servies sans minoration : de 2007 à 2023, l'inapte, le grand invalide
  de guerre, l'ancien déporté ou interné, et en 2007 l'ancien prisonnier ou combattant ;
  depuis le 25 décembre 2017, le parent d'un enfant handicapé ouvrant droit à
  l'allocation d'éducation de l'enfant handicapé et à son complément ou à la prestation
  de compensation du handicap ; depuis le 10 janvier 2024, les assurés du 2° de L. 643-4,
  à l'âge du IV de L. 643-3
- >-
  le nombre d'enfants : celui que l'affiliée a élevés neuf ans au moins avant leurs seize
  ans (2007), puis mis au monde (depuis 2011), qui avance son taux plein d'une année
  chacun, cinq au plus ; trois enfants au moins, qui majorent la pension de 10 %
- >-
  depuis le 1er juillet 2011, les trimestres civils entiers d'exercice libéral qui suivent
  le trimestre civil où tombe l'âge du taux plein, et, depuis 2024, leur date, avant ou
  depuis le 1er janvier 2024
- la date d'effet de la pension, qui choisit la rédaction des statuts ou du règlement
ecrit:
- >-
  le coefficient de minoration qui réduit les points de la pension complémentaire, que
  `abattement_points` rend à `liquider_chaque_regime`, la majoration au-delà du taux
  plein, que rend `surcote_points`, et la majoration de 10 % pour trois enfants, que
  rend `completer`
dates_qui_decident:
- liquidation.date_effet
