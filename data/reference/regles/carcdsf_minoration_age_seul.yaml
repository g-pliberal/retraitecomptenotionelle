    en_vigueur: 2012-07-22
    publie_le: 2012-07-21
    citation: >-
      « I.-L'article 19 des statuts relatifs au régime d'assurance vieillesse
      complémentaire des chirurgiens-dentistes et des sages-femmes est ainsi modifié : ―
      au troisième alinéa du b, les mots : « 31 décembre 1955 inclus » sont remplacés
      par les mots : « 31 décembre 1954 inclus » ; ― au quatrième alinéa du b, les mots
      : « 1er janvier 1956 » sont remplacés par les mots : « 1er janvier 1955 ». II.-Le
      tableau annexé à ces mêmes statuts est remplacé par le tableau suivant : Annexe
      Coefficients applicables en cas de départ en retraite avant l'âge du taux plein
      selon l'échéancier de la réforme des retraites Vous pouvez consulter le tableau
      dans le JO n° 168 du 21/07/2012 texte numéro 3 »
  - id: JORFARTI000026208361
    article: >-
      arrêté du 9 juillet 2012, article 1er ; son article 2 charge le directeur de la
