  20 ans, pension au 1er janvier 2025 à 70 ans : sept trimestres à 1 % et quatre à
  1,25 %, 1,12 au lieu de 1,1375 (17 595,30 € par an au lieu de 17 870,23 €, en euros
  de 2026) ; né le 1er janvier 1953, pension au 1er avril 2024 : quinze trimestres à
  1 % depuis avril 2020 et un à 1,25 %, 1,1625 au lieu de 1,25 (18 280,73 € au lieu de
  19 656,70 €) ; né le 1er janvier 1954, pension au 1er avril 2024 : 1,1225 au lieu de
  1,175 (17 446,14 € au lieu de 18 262,10 €) ; né le 1er janvier 1950, pension au
  1er juillet 2024 : 20 % et deux trimestres à 1,25 %, 1,225 au lieu de 1,25
  (20 020,03 € au lieu de 20 428,60 €). L'écart figurait aux approximations depuis le
  5 novembre 2026 ; il n'y reste que le cumul des deux limites, que le texte ne tranche
  pas.
code:
  interrupteurs:
    abattement_points: cavom
    decote_annulee_par_la_duree: false
    surcote_points: par_age_seul
    surcote_trimestres_civils_d_exercice: true
  moteur: >-
    `abattement_points: cavom`, le barème par année d'âge manquante que la fiche `cavom_ages_minoration`
    décrit ; `decote_annulee_par_la_duree: false` : la durée d'assurance n'annule pas
    la minoration ; `surcote_points: par_age_seul`, la majoration par l'âge seul que la
    fiche `surcote_par_age_seul` décrit. `surcote_trimestres_civils_d_exercice` : ne
    compter que les trimestres civils ENTIERS d'exercice au régime qui suivent le
    trimestre civil où tombe l'âge, jusqu'à la date d'effet, et non le temps écoulé —
    « par trimestre civil entier d'exercice libéral suivant le dernier jour du trimestre
    civil incluant l'âge » (statuts de 2011, article 19, I, c). Sans ce renvoi, le temps
    écoulé suffit, comme dans les autres sections.
  python: >-
    droit/liquider.py : abattement_points, abattement_ircec, abattement_regime_de_base,
    decote_opposable, trimestres_de_decote, taux_plein_anticipe, inapte_sans_coefficient,
    categorie_sans_coefficient, surcote_points, trimestres_civils_d_exercice,
    _ABATTEMENTS_IRCEC, _ABATTEMENTS_PAR_ANNEE_AGE_SEUL ; droit/categories.py :
    remplit_l_une_de ; droit/ouvrir.py :
    age_taux_plein ; scenarios/actuel.py : AgesRegimes ; droit/completer.py : completer,
    _taux_majoration_enfants
  javascript: >-
    moteur/js/droit/liquider.js : abattementPoints, abattementIrcec,
    abattementRegimeDeBase, decoteOpposable, trimestresDeDecote, tauxPleinAnticipe,
    inapteSansCoefficient, categorieSansCoefficient, surcotePoints,
    trimestresCivilsDExercice ;
    moteur/js/droit/categories.js : remplitLUneDe ; moteur/js/droit/ouvrir.js : ageTauxPlein ; moteur/js/regimes.js :
    AgesRegimes ; moteur/js/droit/completer.js : completer, tauxMajorationEnfants
  parametres: >-
    contenu.parametres de chaque version : abattement_points, age_ouverture,
    age_sans_coefficient_de_l_inapte, categories_sans_coefficient,
    age_ouverture_par_generation, age_table, age_taux_plein, age_taux_plein_par_generation,
