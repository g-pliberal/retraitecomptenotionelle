schema_version: 1
id: sam_indemnites_de_maternite
intitule: >-
  Les indemnités journalières de maternité au salaire annuel moyen du régime général :
  comptées pour 125 % de leur montant quand le congé débute depuis le 1er janvier 2012 ;
  pour les congés d'avant, un forfait tiré du salaire médian, porté à l'année de la
  naissance, quand la pension prend effet depuis le 1er septembre 2023.
domaine: salaire_de_reference
regimes: [regime_general, msa_salaries]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- le sexe de l'assuré, les naissances de ses enfants, déclarées ou présumées
- les années où il a cotisé comme salarié au régime général ou au régime agricole
- le salaire médian de l'année qui précède la naissance, fixé par arrêté
ecrit:
- le salaire porté au compte de l'année du congé, ou de la naissance
dates_qui_decident:
- liquidation.date_effet
versions:
- id: aucune_avant_2012
  statut: lue
  textes:
  - id: JORFARTI000023022348
    reference: loi n° 2010-1330 du 9 novembre 2010, article 118, VI
    lu_le: 2026-11-20
  bornes:
    liquidation.date_effet: [null, 2012-01-01]
  contenu:
    droit: >-
      rien : aucun congé débutant depuis le 1er janvier 2012 ne précède une pension qui
      prend effet avant cette date ; la carte de justesse marque pourtant cette période
      avec les deux autres
    parametres:
      regimes: [regime_general, msa_salaries]
      forfait: null
  exemples: aucun trouvé
  exemples_cherches: >-
    le 20 novembre 2026, dans la circulaire Cnav 2025/11 du 28 mars 2025 et dans
    les exemples officiels du dépôt (tests/temoins/exemples_officiels.yaml) :
    les exemples de la circulaire sont écrits sous la rédaction du 22 février
    2025, aucun ne porte une pension de cette version
- id: cent_vingt_cinq_pour_cent_2012
  statut: lue
  textes:
  - id: LEGIARTI000023868111
    article: R. 351-29 CSS
    en_vigueur: 2011-04-18
    citation: >-
      « Les indemnités journalières mentionnées au 2° de l'article L. 330-1 sont
      assimilées à un salaire au sens du présent alinéa et prises en compte à hauteur
      de 125 % de leur montant »
    lu_le: 2026-11-20
  - id: JORFARTI000023022348
    reference: loi n° 2010-1330 du 9 novembre 2010, article 118, VI
    citation: >-
      « L'article 98 est applicable aux indemnités journalières d'assurance maternité
      versées dans le cadre des congés de maternité débutant à compter du 1er janvier
      2012 »
    lu_le: 2026-11-20
  bornes:
    liquidation.date_effet: [2012-01-01, 2023-09-01]
  contenu:
    droit: >-
      125 % des indemnités journalières des congés de maternité débutant depuis le 1er
      janvier 2012, ajoutés au salaire de l'année, dans la limite du plafond
    parametres:
      regimes: [regime_general, msa_salaries]
      forfait: null
  exemples: aucun trouvé
  exemples_cherches: >-
    le 20 novembre 2026, dans la circulaire Cnav 2025/11 du 28 mars 2025 et dans
    les exemples officiels du dépôt (tests/temoins/exemples_officiels.yaml) :
    les exemples de la circulaire sont écrits sous la rédaction du 22 février
    2025, aucun ne porte une pension de cette version
- id: forfait_des_conges_d_avant_2012
  statut: lue
  textes:
  - id: LEGIARTI000048031614
    article: R. 351-29 CSS
    en_vigueur: 2023-09-01
    citation: >-
      « ces dispositions sont applicables aux pensions prenant effet à compter du 1er
      septembre 2023 » ; « Le montant forfaitaire [...] est égal à une fraction du
      salaire médian de l'année précédant la naissance. Cette fraction est égale à : 1°
      140/365 pour les deux premières naissances ; 2° 228/365 pour les naissances
      au-delà de la deuxième ; 3° 298/365 pour les naissances multiples de jumeaux ; 4°
      403/365 pour les naissances multiples de plus de deux enfants ; Le montant
      forfaitaire est pris en compte au titre de l'année civile de la naissance »
    lu_le: 2026-11-20
  - id: LEGIARTI000047453380
    reference: >-
      loi n° 2010-1330 du 9 novembre 2010, article 118, VI, second alinéa, né de la loi
      n° 2023-270, article 22
    citation: >-
      « Il est également applicable aux indemnités journalières d'assurance maternité
      versées dans le cadre des congés de maternité ayant débuté avant le 1er janvier
      2012. Ces indemnités sont évaluées sur une base forfaitaire, selon des modalités
      fixées par décret en tenant compte du montant dont peut bénéficier un salarié
      rémunéré au niveau du salaire médian l'année précédant le congé de maternité. »
    lu_le: 2026-11-20
  - id: JORFARTI000049496475
    reference: >-
      arrêté du 29 avril 2024 fixant les valeurs du salaire médian prévu à l'article R.
      351-29 du code de la sécurité sociale, article 1er
    citation: >-
      « Les valeurs du salaire net médian mentionné au IV de l'article R. 351-29 du
      code de la sécurité sociale sont fixées conformément au tableau ci-dessous »
    lu_le: 2026-11-20
  - reference: >-
      circulaire Cnav 2025/11 du 28 mars 2025 (circulaire_cnav_2025_11_28032025.pdf), §
      1, 2.1, 2.3, 2.4 et 4, annexes 1 et 2 : les salariés du régime général et du
      régime agricole, non les indépendants (D. 634-1) ; une naissance de 2012 dont le
      congé a débuté en 2011 ; l'arrondi à l'euro ; le total borné au plafond depuis
      2005, les indemnités écrêtées les premières, et libre de le passer avant ; aucun
      trimestre validé ; les pensions prenant effet à compter du 1er septembre 2023
    lu_le: 2026-11-20
  - id: LEGIARTI000006742545
    article: L. 331-3 CSS
    citation: >-
      « Pendant une période qui débute six semaines avant la date présumée de
      l'accouchement » ; « Lorsque des naissances multiples sont prévues, cette période
      commence douze semaines avant la date présumée de l'accouchement, vingt-quatre
      semaines en cas de naissance de plus de deux enfants »
    lu_le: 2026-11-20
  - id: LEGIARTI000006742550
    article: L. 331-4 CSS
    citation: >-
      « portée à huit semaines avant la date présumée de l'accouchement [...] lorsque
      l'assurée elle-même ou le ménage assume déjà la charge d'au moins deux enfants
      [...] ou lorsque l'assurée a déjà mis au monde au moins deux enfants nés viables »
    lu_le: 2026-11-20
  bornes:
    liquidation.date_effet: [2023-09-01, 2025-02-22]
  contenu:
    droit: >-
      en plus des 125 %, un forfait pour chaque congé de maternité débuté avant 2012, porté
      au compte de l'année de la naissance : une fraction du salaire médian de l'année
      précédente, arrondie à l'euro, pour la mère qui justifie, « au cours des douze mois
      précédant la naissance », d'une affiliation cotisée de salariée. Le total du salaire
      et du forfait est borné au plafond pour les années depuis 2005 ; le forfait ne valide
      aucun trimestre
