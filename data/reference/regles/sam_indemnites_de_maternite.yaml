approximations:
- version: [cent_vingt_cinq_pour_cent_2012, forfait_des_conges_d_avant_2012,
            forfait_a_l_annee_civile_2025]
  ecart: >-
    les 125 % des indemnités d'un congé débuté depuis 2012 ne sont pas ajoutés : le
    simulateur ne demande pas le montant des indemnités versées, et le salaire que la
    saisie donne à l'année du congé est pris tel quel, comme celui d'une année entière
  effet: non mesuré
- version: [forfait_des_conges_d_avant_2012, forfait_a_l_annee_civile_2025]
  ecart: >-
    le forfait s'ajoute au salaire que la saisie donne à l'année de la naissance, qu'une
    carrière saisie sans relevé ne réduit pas des semaines du congé : l'année y est
    comptée plus haut qu'au compte ; un relevé porte le salaire réellement cotisé
  effet: non mesuré
- version: [forfait_des_conges_d_avant_2012, forfait_a_l_annee_civile_2025]
  ecart: >-
    le début du congé est présumé à sa date légale avant l'accouchement (six, huit,
    douze ou vingt-quatre semaines), une naissance dite à l'année tombant au 1er
    janvier ; ni l'adoption,
    ni le père après le décès de la mère, ni les allocations des salariées dispensées
    de travail, qui ne sont comptés qu'à la demande ; deux pensions séparées du régime
    général et du régime agricole portent chacune le forfait d'une année cotisée aux
    deux
  effet: non mesuré
- version: [forfait_des_conges_d_avant_2012]
  ecart: >-
    la condition d'affiliation se lit à l'année civile, de la naissance ou d'avant, comme
    la rédaction du 22 février 2025 et la circulaire Cnav 2025/11, quand la rédaction de
    2023 demande les douze mois qui précèdent la naissance : le simulateur ne connaît que
    des années. La mère qui n'a cotisé qu'après la naissance, la même année, reçoit ici
    le forfait
  effet: >-
    un cas de la grille indépendante, grille_sam_maternite_forfait_2023_p14 : 19 866,42
    euros de salaire annuel moyen au lieu de 19 591,10
sources:
  lu_le: 2026-11-20
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Les 125 % des congés débutés depuis 2012 : la donnée manque, le montant des
    indemnités versées. La demander à la saisie, la lire au relevé, ou la reconstituer
    du salaire — le choix est soumis au propriétaire (20 novembre 2026).
  lectures:
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav 2025/11 du 28 mars 2025, entière, et l'exposé « Revenu annuel
      moyen » de la base de législation de la Cnav (« Indemnités journalières maternité
      ou adoption »), par son API
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2025_11_28032025.pdf
    date: 2026-11-20
  - type: legifrance
    reference: >-
      R. 351-29 CSS, rédactions du 18 avril 2011 (LEGIARTI000023868111), du 1er
      septembre 2023 (LEGIARTI000048031614), du 22 février 2025 (LEGIARTI000051226243)
      et du 1er janvier 2026 (LEGIARTI000053335651), dans l'index LEGI du dépôt ; loi
      n° 2010-1330, article 118, VI (JORFARTI000023022348), dans l'index du JORF, et sa
      rédaction du 1er septembre 2023 (LEGIARTI000047453380) ; arrêté du 29 avril 2024
      (JORFTEXT000049496470) ; décret n° 2025-155, article 3 (JORFARTI000051223569) ; L.
      331-3 et L. 331-4 CSS
    date: 2026-11-20
