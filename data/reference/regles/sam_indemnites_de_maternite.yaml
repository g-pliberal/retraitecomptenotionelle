  javascript: >-
    moteur/js/droit/liquider.js : salaireDeReference, forfaitsDeMaternite,
    retenirAvecLesIndemnites, materniteAuCompte ; moteur/js/regimes.js : FichesDatees
  parametres: >-
    contenu.parametres de chaque version : regimes, forfait
  tests: [tests/test_sam_indemnites_de_maternite.py]
  moteur: >-
    Le paquet du site porte ses versions.
historique:
- >-
  2026-11-20 — le forfait des congés d'avant 2012 écrit, pour les pensions prenant effet
  depuis le 1er septembre 2023 : l'arrêté du salaire médian et la circulaire Cnav
  2025/11 lus, quatre de ses exemples rejoués. Les 125 % des congés depuis 2012
  restent à écrire, faute du montant des indemnités.
- >-
  2026-11-20 — née de la fiche salaire_annuel_moyen, qui en faisait une simplification
  de toutes ses versions (action 194).
exemples: [cnav_2025_11_maternite_jumeaux_1990, cnav_2025_11_maternite_premiere_naissance_2002,
  cnav_2025_11_maternite_troisieme_naissance_2007, cnav_2025_11_maternite_deuxieme_naissance_2003]
effet: >-
  Les mères salariées. Depuis septembre 2023, celle dont l'année d'une naissance
  d'avant 2012 compte parmi ses meilleures années y reçoit le forfait : 5 964 euros
  pour une première naissance de 1998, 11 477 pour une troisième de 2007. Pour un congé
  depuis 2012, le simulateur prend le salaire saisi de l'année, sans les 125 % des
  indemnités.
