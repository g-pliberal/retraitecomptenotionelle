schema_version: 1
id: age_reference_decote_sncf_ratp
intitule: >-
  L'âge où s'annule la décote de l'agent de la SNCF et de la RATP : aucune décote sous les
  règlements d'avant le 1er juillet 2008, ni à qui réunit les conditions d'ouverture du
  droit avant le 1er juillet 2010 ; puis l'âge minimum d'ouverture majoré de cinq ans,
  diminué de seize trimestres la première année, de deux de moins chaque 1er juillet
  jusqu'en 2013, d'un ensuite, de rien depuis le 1er juillet 2024 ; à qui les réunit
  depuis le 1er janvier 2025, cinquante-sept ans pour l'agent de conduite de la SNCF et le
  roulant de la RATP, soixante-deux ans pour les autres agents de la SNCF et le tableau A
  de la RATP, soixante-sept ans pour les autres agents de la RATP.
domaine: decote_surcote
regimes: [ratp, sncf]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  l'âge d'ouverture du droit de l'agent, que la table d'âges de la période lit à sa
  génération (`age_table`)
- >-
  le mois où l'agent réunit les conditions d'ouverture du droit, qui donne la diminution
  de l'année et sépare les règles d'avant et d'après le 1er janvier 2025
- la date d'effet de sa pension, qui sépare les règlements d'avant le 1er juillet 2008
ecrit:
- >-
  l'âge d'annulation de la décote, d'où se comptent les trimestres de minoration par
  l'âge (1° du I de l'article 13 du décret n° 2008-639, 1° du I de l'article 24 du décret
  n° 2008-637), que la fiche `decote_regimes_speciaux` applique
dates_qui_decident:
- liquidation.date_effet
- ouverture_du_droit
versions:
- id: reglements_d_avant_2008
  statut: supposee
  hypothese: >-
    les pensions qui prennent effet avant le 1er juillet 2008 relèvent des règlements de
    retraite des deux entreprises, que les index du dépôt ne portent pas — du décret
    n° 2005-1639 du 26 décembre 2005, qui publiait celui de la RATP, l'index JORF n'a que
    l'en-tête — : la fiche ne leur prête pas de décote, que les décrets du 30 juin 2008
    créent en abrogeant ce décret, et, pour la SNCF, la loi du 21 juillet 1909 et le
    décret-loi du 19 avril 1934
  fiabilite: moyenne, les règlements n'étant pas lus
  textes:
  - {id: JORFTEXT000019107455, article: "décret n° 2008-639, visas et abrogations", en_vigueur: 2008-07-01, publie_le: 2008-07-01}
  - {id: JORFTEXT000019103570, article: "décret n° 2008-637, visas et abrogations", en_vigueur: 2008-07-01, publie_le: 2008-07-01}
  bornes:
