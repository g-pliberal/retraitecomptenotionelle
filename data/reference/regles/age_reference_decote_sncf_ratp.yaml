approximations:
- version: [age_minimum_majore_de_cinq_ans, age_fixe_depuis_2025]
  ecart: >-
    l'âge de référence est celui de l'agent de conduite de la SNCF et du roulant (tableau B)
    de la RATP, que le modèle présume (`age_table`) : celui des autres agents de la SNCF,
    leur âge d'ouverture majoré de cinq ans jusqu'en 2024 puis soixante-deux ans, et ceux du
    tableau A et des autres agents de la RATP, jusqu'à soixante-deux et soixante-sept ans,
    ne sont pas servis
  effet: non mesuré
- version: [age_fixe_depuis_2025]
  regime: sncf
  ecart: >-
    l'agent de conduite né en 1973 ou 1974 a cinquante-sept ans d'âge de référence, celui
    du texte, quand les tableaux de la CPRPSNCF lui donnent cinquante-six ans et neuf mois :
    au plus un trimestre de décote de plus que la caisse, s'il part avant cinquante-sept ans
    sans la durée
  effet: non mesuré
effet: >-
  Les deux fiches faisaient monter l'âge de référence avec l'âge d'ouverture, cinq
  ans au-dessus : 57,25 ans pour les liquidations de 2025, jusqu'à 59 ans à compter
  de 2034. Un agent de conduite né en 1980 parti à cinquante-quatre ans se voyait
  opposer vingt trimestres de décote au lieu de douze, un taux de 56,25 % au lieu
  de 63,75 %, et une pension de 23 711 € au lieu de 26 872 € ; le même à la RATP,
  à l'identique. Corrigé à cinquante-sept ans sur les périodes de 2025 et après.
  Le cas type « Agent de conduite SNCF » passe, dans les deux dernières générations
  de la page Cas types, de −17 % à −25 % et de −26 % à −34 % : sa pension actuelle
  remonte, l'écart de la proposition se creuse. Les soixante-deux à soixante-quatre
  ans des générations 1963 à 1970 que les deux fiches donnaient pour l'âge d'annulation
  sont ceux de la SURCOTE (IV de l'article 37-1 pour la SNCF, 3° du II de l'article
  51-1 pour la RATP). Approchée depuis le 2 novembre 2026 : l'âge de référence est celui
  de l'agent de conduite et du roulant, que le modèle présume.
sources:
  lu_le: 2026-11-02
  prochaine_relecture: 2027-11-02
  lectures_divergentes:
  - >-
    Âge d'annulation de l'agent de la SNCF qui a réuni les conditions avant le 1er janvier
    2025 et part après : le 1° du I de l'article 13, dans la rédaction du décret n° 2023-967,
    fixe cinquante-sept et soixante-deux ans pour toute pension prenant effet depuis cette
    date, et le I bis de l'article 35 ne lui garde que l'âge d'ouverture et la durée
    d'avant ; la CPRPSNCF, dans ses tableaux par génération, lui garde l'âge d'avant,
    diminué l'année où il a atteint son âge d'ouverture — cinquante-six ans et deux mois
    pour l'agent de conduite né en 1971. La fiche suit la caisse, comme
    `age_reference_decote_ieg` ; à la RATP, le 2° du VII de l'article 51-1 l'écrit.
  - >-
    Âge d'annulation de l'agent de conduite né en 1973 ou 1974 et de l'agent du cas général
    né de 1967 à 1971 : les tableaux de la CPRPSNCF du 20 octobre 2023 donnent cinquante-six
    ans et neuf mois, et soixante et un ans et six ou neuf mois, quand le 1° du I de
    l'article 13 écrit cinquante-sept et soixante-deux ans pour les pensions de 2025 et
    après, et la diminution de l'article 35, pour qui a atteint cinquante-sept ans en 2024,
    soixante et un ans et neuf mois au plus bas. Aucune rédaction lue ne les abaisse : la
    fiche suit le texte, et l'écart du modèle à la caisse est déclaré.
  a_relire:
  - >-
    Les âges d'annulation que les tableaux de la CPRPSNCF donnent à l'agent de conduite né
    en 1973 ou 1974 et à l'agent du cas général né de 1967 à 1971 : demander à la caisse le
    texte qui les fonde.
  - >-
    RATP, 2° du VII de l'article 51-1 : de 2025 à 2033, l'âge de référence « applicable
    avant » se lit-il avec l'âge d'ouverture d'avant le décret n° 2023-690, cinquante-deux
    ans au tableau B, d'où cinquante-sept, ou avec celui que le 1° du II lui substitue,
    jusqu'à cinquante-trois ans et neuf mois pour 1979, d'où cinquante-huit ans et neuf
    mois, avant de retomber à cinquante-sept ans en 2034 ? La CRP RATP ne publie pas sa
    lecture ; la fiche, comme le modèle, retient cinquante-sept ans, le seul âge qui ne
    retombe pas.
  - >-
    L'âge de référence des autres agents de la SNCF, et du tableau A et des autres agents
    de la RATP : à servir quand la saisie distinguera l'agent sédentaire.
