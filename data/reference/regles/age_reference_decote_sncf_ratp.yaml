      article 24, I, 1°, mot pour mot) ; « L'âge auquel le coefficient de minoration
      s'annule correspond, pour la période comprise entre le 1er juillet 2010 et le 30 juin
      2011 inclus, à l'âge de référence mentionné au 1° du I de l'article 13 diminué de
      seize trimestres. Pour les périodes postérieures au 30 juin 2011, cette diminution est
      réduite de deux trimestres au 1er juillet de chaque année jusqu'au 30 juin 2013 inclus
      puis d'un trimestre au 1er juillet de chaque année jusqu'au 30 juin 2024 inclus »
      (SNCF, article 35, II ; RATP, article 51, II, qui renvoie au 1° du I de l'article 24)
    conditions: >-
