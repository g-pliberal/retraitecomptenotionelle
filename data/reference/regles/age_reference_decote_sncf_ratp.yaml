      majoration_de_l_age_minimum: null
    droit: >-
      une pension de 75 % du traitement des six derniers mois après trente-sept annuités et
      demie, sans coefficient de minoration
    conditions: >-
      le modèle n'a pas de décote sur sa période d'avant 2009, et la CPRPSNCF écrit « Pas de
      décote » pour toute génération qui atteint son âge d'ouverture avant le 1er juillet
      2010
