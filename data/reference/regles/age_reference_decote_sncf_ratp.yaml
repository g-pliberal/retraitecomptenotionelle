code:
  moteur: >-
    L'âge de référence se lit à la génération dans la table d'âges que la période
    nomme (`age_table`, colonne `age_taux_plein` de `legislation/ages_regimes.csv`) :
    `sncf_conduite_2023` et `ratp_roulant_2023` portent cinquante-sept ans à compter de
    la génération 1972, et la période de 2025 et après le même âge en repli
    (`age_taux_plein`). `age_taux_plein` le rend à `decote_opposable`, qui en fait l'âge
    d'annulation, diminué pendant la montée en charge des trimestres de son barème. Le
    modèle n'a de table que pour l'agent de conduite et le personnel roulant : les
    autres agents, à soixante-deux ans, n'y sont pas.
  python: >-
    droit/ouvrir.py : age_taux_plein ; droit/liquider.py : decote_opposable,
    millesime_du_bareme ; scenarios/actuel.py : AgesRegimes, AgesRegimes.ages,
    DecoteRegimesSpeciaux
  javascript: >-
    moteur/js/droit/ouvrir.js : ageTauxPlein ; moteur/js/droit/liquider.js :
    decoteOpposable, millesimeDuBareme ; moteur/js/regimes.js : AgesRegimes, AgesRegimes.ages
  parametres: >-
    contenu.parametres de chaque version : majoration_de_l_age_minimum,
    diminution_en_trimestres, ages_de_reference ; regimes/ratp.yaml, regimes/sncf.yaml :
    age_table, age_taux_plein, bareme_decote, decote_par_trimestre ;
    legislation/ages_regimes.csv : ratp_roulant_2011, ratp_roulant_2023,
    sncf_conduite_2011, sncf_conduite_2023, age_ouverture, age_taux_plein ;
    legislation/decote_regimes_speciaux.csv : annee, trimestres_avant_limite
  tests:
  - tests/test_sncf_ratp.py
  - >-
    tests/test_simulateur.py, test_la_decote_des_regimes_speciaux_arrive_quatre_ans_apres,
    cinquante-sept ans en 2025 comme en 2034 ; aucun témoin ne liquide une pension que
    cet âge change, et aucun cas n'y confronte le portage
