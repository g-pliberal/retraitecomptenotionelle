historique:
- >-
  2026-11-02 — lue au droit (action 130) : quatre versions, sur la date d'effet et le mois
  où le droit s'ouvre — aucune décote sous les règlements d'avant juillet 2008, ni à qui
  réunit les conditions avant juillet 2010 ; l'âge minimum majoré de cinq ans, diminué de
  seize trimestres à rien de 2010 à 2024 ; cinquante-sept ans pour l'agent de conduite et
  le roulant depuis 2025. Approchée : l'agent présumé agent de conduite ou roulant.
