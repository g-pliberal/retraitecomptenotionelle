schema_version: 1
id: limite_age_opera
intitule: >-
  La cessation des fonctions du personnel de l'Opéra national de Paris engagé pour une
  durée indéterminée est prononcée à l'initiative du théâtre à la limite d'âge de sa
  catégorie : depuis le 1er juillet 2008, quarante-deux ans pour les artistes
  chorégraphiques, soixante pour les artistes du chœur, soixante-deux pour les musiciens,
  soixante-cinq pour les autres, relevés depuis le 13 août 2011 jusqu'à soixante-sept ans
  pour les nés depuis 1962 ; le maintien en activité pour carrière incomplète, dix
  trimestres au plus. Depuis le 14 mars 2002, seul l'artiste du ballet pouvait être mis à
  la retraite, à quarante-deux ans.
domaine: age
regimes: [opera_de_paris]
etape: preparer_la_chronologie
face: droit
etat: approchee
lit:
- le statut de personnel de l'Opéra national de Paris, quand il route le régime spécial ;
  la saisie ne dit pas la catégorie, et le modèle traite tout agent comme des « autres
  catégories de personnel » ; ses services au régime, pour la prolongation
ecrit:
- la date de la cessation des fonctions par limite d'âge, d'où part la pension du régime
  spécial (`droit/limite_age.py`)
dates_qui_decident:
- age_atteint
versions:
- id: avant_2002
  statut: supposee
  hypothese: >-
    aucune limite opposée à l'agent avant le décret n° 2002-347 : le décret n° 68-382
    n'ouvre que le droit à pension, à un âge par catégorie (article 6), et l'index ne porte
    aucune autre règle de mise à la retraite
  fiabilite: faible
  textes:
  - {id: LEGIARTI000006765538, article: "décret n° 68-382, article 6", en_vigueur: 1995-09-01}
  bornes:
    age_atteint: [null, 2002-03-14]
  contenu:
    parametres:
      exceptions: []
    droit: >-
      aucune limite au modèle
  exemples: aucun trouvé
- id: decret_de_2002
  statut: lue
  textes:
  - {id: LEGIARTI000006765539, article: "décret n° 68-382, article 6, IV et V", en_vigueur: 2002-03-14}
  nee_de: LEGIARTI000006765539
  bornes:
    age_atteint: [2002-03-14, 2008-07-01]
  contenu:
    parametres:
      exceptions: []
    droit: >-
      « IV. Les artistes du ballet peuvent être mis à la retraite à l'initiative du théâtre
      à quarante-deux ans d'âge. La mise à la retraite peut, par décision du théâtre et avec
      accord de l'intéressé, être retardée jusqu'au 31 juillet suivant sa date
      anniversaire » ; à titre transitoire, quarante-cinq ans pour l'artiste masculin du
      ballet qui avait trente-neuf ans ou plus le 14 mars 2002, six ans de délai pour celui
      qui en avait plus de trente-six (V) ; aucune limite pour les autres catégories de
      personnel
    transition: >-
      l'artiste du ballet, que la saisie ne distingue pas, n'a pas de limite au modèle : tout
      agent y est des autres catégories
  exemples: aucun trouvé
- id: decret_de_2008
  statut: lue
  textes:
  - {id: LEGIARTI000018231995, article: "décret n° 2008-240, article 2", en_vigueur: 2008-07-01}
  - {id: LEGIARTI000018231999, article: "décret n° 2008-240, article 3", en_vigueur: 2008-07-01}
  nee_de: LEGIARTI000018231995
  bornes:
    age_atteint: [2008-07-01, 2011-08-13]
  contenu:
    parametres:
      limites: {sedentaire: 65}
      exceptions: [carriere_incomplete]
    droit: >-
      « La cessation des fonctions des personnels de l'Opéra national de Paris engagés pour
      une durée indéterminée est prononcée à l'initiative du théâtre lorsqu'ils atteignent
      l'âge de : ― 42 ans pour les artistes chorégraphiques [...] ; ― 60 ans pour les
      artistes du chœur ; ― 62 ans pour les musiciens, les chefs de chant et les pianistes
      accompagnateurs ; ― 65 ans pour les autres catégories de personnel. Toutefois, et
      notamment si la durée des services liquidables est inférieure à celle définie à
      l'article 14 du décret du 5 avril 1968 susvisé, les personnels mentionnés ci-dessus
      peuvent être maintenus en activité dans la limite de dix trimestres sous réserve de
      leur aptitude au poste et lorsque l'intérêt du service n'y fait pas obstacle »
      (article 2) ; « Le présent décret entre en vigueur au 1er juillet 2008 » (article 3)
    transition: >-
      l'article 2 vaut du 1er juillet 2008, comme tout le décret, et non du 10 mars, où LEGI
      le date de sa publication ; l'article 6 du décret n° 68-382 perd son IV le même jour
  exemples: aucun trouvé
- id: decret_de_2011
  statut: lue
  textes:
  - {id: LEGIARTI000024468609, article: "décret n° 2008-240, article 2", en_vigueur: 2011-08-13}
  nee_de: LEGIARTI000024468609
  bornes:
    age_atteint: [2011-08-13, null]
  contenu:
    parametres:
      limites_avant: {sedentaire: 65}
      ecart_de_reference: 65
      marche:
      - {depuis: "1957-01-01", mois: 4}
      - {depuis: "1958-01-01", mois: 8}
      - {depuis: "1959-01-01", mois: 12}
      - {depuis: "1960-01-01", mois: 16}
      - {depuis: "1961-01-01", mois: 20}
      - {depuis: "1962-01-01", mois: 24}
      exceptions: [carriere_incomplete]
    droit: >-
      « 67 ans pour les autres catégories de personnel », sous le même maintien de dix
      trimestres (I) ; « L'âge de cessation d'activité de soixante-sept ans [...] s'applique
      aux personnels mentionnés au 5° du I de l'article 6 du décret du 5 avril 1968 susvisé
      nés à compter du 1er janvier 1962. Pour les personnels de même catégorie nés
      antérieurement à cette date, cet âge est fixé : a) A soixante-cinq ans pour les
      personnels nés avant le 1er janvier 1957 ; b) A soixante-cinq ans et quatre mois pour
      les personnels nés en 1957 ; c) A soixante-cinq ans et huit mois pour les personnels
      nés en 1958 ; d) A soixante-six ans pour les personnels nés en 1959 ; e) A soixante-six
      ans et quatre mois pour les personnels nés en 1960 ; f) A soixante-six ans et huit
      mois pour les personnels nés en 1961 » (II, A) ; pour les personnels du 3° du I de
      l'article 6 et des 2°, 4° et 5° du I de l'article 52, la même marche décalée de cinq
      générations, soixante-sept ans pour les nés depuis 1967 (II, B)
    transition: >-
      la marche se compte par la date de naissance (`ecart_de_reference` égal à l'ancienne
      limite) ; celle du II, A, la saisie ne disant pas qui relève du II, B
  exemples: aucun trouvé
presomptions:
  exceptions_a_la_limite_d_age: >-
    le maintien en activité de dix trimestres au plus, présumé accordé autant que le départ
    saisi le demande et que les services liquidables n'atteignent pas la durée du taux
    maximum, l'aptitude au poste et l'intérêt du service présumés ; tout agent est des
    « autres catégories de personnel », la saisie ne disant ni le danseur, ni le choriste,
    ni le musicien
sources:
  lu_le: 2026-10-17
  prochaine_relecture: 2027-10-17
  a_relire:
  - >-
    La catégorie de l'agent, que la saisie ne porte pas : le danseur, cessant à quarante-deux
    ans, le choriste, à soixante, le musicien, à soixante-deux, sont traités comme les autres
    catégories ; les personnels du II, B, comme ceux du II, A.
  - >-
    Avant le 1er juillet 2008, la seule mise à la retraite lue est celle de l'artiste du
    ballet (décret n° 68-382, article 6, IV et V, depuis le 14 mars 2002) ; celle des autres
    catégories, s'il y en avait une — dans la convention collective ou le règlement du
    théâtre —, n'est pas dans l'index : le modèle n'y oppose aucune limite.
