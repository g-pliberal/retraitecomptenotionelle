historique:
- >-
  2026-10-16 — née et appliquée, action 151, étape 6 : l'agent de l'Opéra national de Paris
  dont le départ saisi passe sa limite cesse ses fonctions à la limite, prolongée pour
  carrière incomplète, et sa pension du régime spécial en part, comme la décision du
  propriétaire du 14 octobre 2026 le dit du fonctionnaire.
- >-
  2026-10-17 — action 151, étape 9 : la limite vaut du 1er juillet 2008, où l'article 3 du
  décret n° 2008-240 fait entrer le décret en vigueur, et non du 10 mars ; la mise à la
  retraite de l'artiste du ballet, depuis le 14 mars 2002, est lue, et aucune autre limite
  ne l'est avant.
effet: >-
  Tout agent de l'Opéra national de Paris, affilié au régime spécial, dont le départ saisi
  passe soixante-cinq ans depuis le 1er juillet 2008 — soixante-sept pour les nés depuis
  1962, prolongés de dix trimestres au plus pour carrière incomplète — cesse ses fonctions
  à cette limite, et sa pension du régime spécial en part. Approchée : la catégorie n'est
  pas distinguée, et aucune limite n'est opposée avant le 1er juillet 2008, l'artiste du
  ballet, mis à la retraite à quarante-deux ans depuis 2002, n'étant pas saisi.
