- id: loi_du_20_janvier_2014
  statut: lue
  textes:
  - {id: JORFARTI000028493878, reference: "loi n° 2014-40 du 20 janvier 2014, article 44", en_vigueur: 2016-01-01}
  - {id: LEGIARTI000028498063, article: L. 161-22-2, en_vigueur: 2016-01-01}
  - {id: LEGIARTI000047456834, article: L. 161-22-2, en_vigueur: 2023-09-01}
  - {id: LEGIARTI000031986254, article: R. 161-19-1, en_vigueur: 2016-02-08}
  - {id: LEGIARTI000047960988, article: R. 161-19-1, en_vigueur: 2023-09-01}
  nee_de: JORFARTI000028493878
  bornes:
    liquidation.date_effet: [2016-01-01, null]
  contenu:
    droit: >-
      « IV. ― L'article L. 351-9 du même code est abrogé. V. ― Le présent article
      s'applique aux assurés dont l'ensemble des pensions prend effet à compter du 1er
      janvier 2016 » (loi n° 2014-40, article 44). La Cnav : « le paiement de la retraite
      en un versement forfaitaire unique ne peut concerner que l'assuré dont la 1re
      retraite prend effet avant 2016 », et le seuil se revalorise encore (183,01 € au 1er
      janvier 2026). À la place, l'assuré d'un seul régime de base qui a huit trimestres
      au plus reçoit, à sa demande, ses cotisations revalorisées (L. 161-22-2, R.
      161-19-1)
    beneficiaire: >-
      l'assuré dont une pension de base a pris effet avant le 1er janvier 2016 et dont la
      pension de vieillesse est inférieure au seuil
    parametres:
      existe: true
      regimes: [regime_general]
      multiple: 15
      premiere_retraite_avant: "2016-01-01"
      seuils: [["2015-10-01", 156.24], ["2017-10-01", 157.48], ["2019-01-01", 157.95],
        ["2020-01-01", 158.42], ["2021-01-01", 159.05], ["2022-01-01", 160.79],
        ["2022-07-01", 167.22], ["2023-01-01", 168.55], ["2024-01-01", 177.48],
        ["2025-01-01", 181.38], ["2026-01-01", 183.01]]
      fiabilite: haute
  exemples: aucun trouvé
approximations:
- version: [decret_du_24_fevrier_1975, code_de_la_securite_sociale, loi_du_20_janvier_2014]
  ecart: >-
    Le montant annuel de la pension reste celui de la pension que le versement remplace,
    comme pour le capital du RAFP : les comparaisons annuelles, le total et le taux de
    remplacement le lisent, et « faire vivre » le mène encore à l'échéance ; le versement
    est dit dans la formule et dans le champ capital, et la majoration exceptionnelle de
    2023 ne le lit pas, comme la circulaire Cnav n° 2023-21 l'exclut.
  effet: >-
    non mesuré ; les seules pensions sous le seuil, 156,24 € par an en 2015 : quelques
    trimestres au régime général
- version: [decret_du_24_fevrier_1975, code_de_la_securite_sociale, loi_du_20_janvier_2014]
  ecart: >-
    Le versement « était payé seulement sur accord de l'assuré » (circulaire Cnav n°
    62/93, que l'exposé « Modalités de paiement » cite), qui pouvait attendre ; et il «
    met obstacle à l'ouverture de nouveaux droits » par une activité postérieure (R.
    351-26) : le modèle le verse sans demander, et ne ferme pas les droits d'après. Les
    avantages complémentaires que le seuil compte se réduisent à la majoration pour
    enfants : la majoration pour conjoint à charge n'est pas modélisée.
  effet: non mesuré
- version: [loi_du_20_janvier_2014]
  ecart: >-
    La première retraite se lit sur les départs que le modèle liquide : une pension de
    base prise avant 2016 dans un départ précédent. Une retraite progressive ouverte avant
    2016, une pension étrangère ou une pension qu'aucun départ ne liquide ne la font pas
    ; le remboursement des cotisations de L. 161-22-2, qui se demande, n'est pas servi :
    le modèle sert la pension.
  effet: non mesuré ; les départs échelonnés de part et d'autre du 1er janvier 2016
sources:
  lu_le: 2026-10-08
  prochaine_relecture: 2027-04-30
  lectures_divergentes:
  - >-
    TRAJECTOiRE (R/fonctionsCalculsPensions.R:3296-3306, au commit 0963b57) garde le
    versement de la Cnav et des salariés agricoles après 2016, pour tous les assurés : «
    Il a temporairement été décidé de conserver le dispositif de VFU pour l'ensemble des
    assurés ». La loi n° 2014-40 et la Cnav le réservent à qui a pris une retraite avant
    2016 : l'écart est le sien, au registre.
  a_relire:
  - >-
    Lire la loi n° 75-3 du 3 janvier 1975 et le décret n° 75-109 au Journal officiel en
    images, pour dater l'entrée en vigueur et dire la rente d'avant 1974.
  - >-
    Lire les versements forfaitaires des régimes alignés et spéciaux que l'index LEGI
    nomme : salariés agricoles (décret n° 50-1225, article 59, puis le code rural),
    mines (décret n° 46-2769, article 179), marins (code des transports, L. 5552-19),
    Banque de France, Comédie-Française, Saint-Pierre-et-Miquelon, Mayotte, et celui des
    artisans et des commerçants.
  lectures:
  - type: legifrance
    reference: >-
      L. 351-9 (LEGIARTI000006742677, 1985-12-21 → 2016-01-01), R. 351-26
      (LEGIARTI000006749367, LEGIARTI000025749165), décret n° 45-0179, article 72
      (LEGIARTI000006760609, 1975-02-26 → 1985-12-21), L. 161-22-2 (LEGIARTI000028498063,
      LEGIARTI000047456834), R. 161-19-1 (LEGIARTI000031986254, LEGIARTI000047960988), lus
      dans l'index LEGI le 8 octobre 2026
    date: 2016-01-01
  - type: jorf
    reference: >-
      loi n° 2014-40 du 20 janvier 2014, article 44 (JORFARTI000028493878) : L. 161-22-2,
      L. 173-1-3, L. 351-9 abrogé pour les assurés dont l'ensemble des pensions prend effet
      depuis le 1er janvier 2016
    date: 2014-01-21
  - type: circulaire_cnav
    reference: >-
      barème « Montant minimum permettant le paiement mensuel de la retraite personnelle »
      (retraite_personnelle_montant_minimum_pour_paiement_mensuel_bar), lu par l'API de la
      base de législation de la Cnav le 8 octobre 2026 : 71 dates, de 175 F au 1er juillet
      1974 (« Décret 75/109 du 24/02/75 Art. 11 ») à 183,01 € au 1er janvier 2026, chacune
      avec son arrêté ou sa circulaire ; « En dessous de ces montants, la retraite est
      remplacée par un versement forfaitaire unique égal à 15 fois son montant annuel »
    url: https://legislation.lassuranceretraite.fr/#/bareme?file_leaf_ref=retraite_personnelle_montant_minimum_pour_paiement_mensuel_bar.aspx
    date: 2025-12-22
  - type: circulaire_cnav
    reference: >-
      exposés « Montant de la retraite personnelle » (« le paiement de la retraite en un
      versement forfaitaire unique ne peut concerner que l'assuré dont la 1re retraite
      prend effet avant 2016 ») et « Modalités de paiement » (le versement « déterminé au
      point de départ de la retraite », « payé seulement sur accord de l'assuré », «
      effectué à la date à laquelle l'assuré aurait perçu la 1re mensualité » ; le
      remboursement des cotisations de qui réunit moins de neuf trimestres), lus par l'API
      le 8 octobre 2026
    url: https://legislation.lassuranceretraite.fr/
    date: 2026-03-06
