schema_version: 1
id: versement_forfaitaire_unique
intitule: >-
  La pension de vieillesse du régime général dont le montant annuel, avantages
  complémentaires compris, est inférieur à un seuil — 175 F au 1er juillet 1974,
  revalorisés comme les pensions — n'est pas servie : un versement forfaitaire unique,
  égal à quinze fois ce montant, la remplace (L. 351-9, R. 351-26). La loi du 20 janvier
  2014 abroge L. 351-9 pour l'assuré dont toutes les pensions prennent effet depuis le
  1er janvier 2016 : le versement ne reste qu'à qui a pris sa première retraite avant.
domaine: minima
regimes:
- regime_general
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- la pension du régime général à l'étape qui complète, minimum contributif compris, et sa
  part de la majoration pour enfants, l'avantage complémentaire que le modèle connaît
- la nature de la demande, la retraite progressive n'étant pas remplacée
- la date d'effet des pensions de base que des départs précédents servent déjà
- liquidation.date_effet
ecrit:
- le versement forfaitaire unique qui remplace la pension (PensionRegime.capital), et la
  formule qui le dit ; le montant annuel reste celui de la pension remplacée
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/completer.py, `verser_en_capital`, et son jumeau) lit :
# `existe` ; `regimes`, ceux dont la pension est remplacée ; `multiple`, les
# annuités que le versement vaut ; `seuils`, le seuil annuel en euros, à chaque
# date du barème de la Cnav — les francs convertis au taux de 6,55957, à quatre
# décimales —, celui de la date d'effet étant le dernier qui ne la passe pas ;
# `premiere_retraite_avant`, la date avant laquelle une pension de base doit
# avoir pris effet pour que le versement vaille encore ; `fiabilite`, que le
# résultat prend quand le versement remplace la pension.
versions:
- id: avant_le_1er_juillet_1974
  statut: supposee
  hypothese: >-
    la loi n° 75-3 du 3 janvier 1975 et le décret n° 75-109 du 24 février 1975, qui
    instituent le versement, n'ont pas d'article lisible dans l'index JORF, et le décret
    n° 45-0179, article 72, n'est dans l'index LEGI que dans sa rédaction de 1975 ; le
    barème de la Cnav ne commence qu'au 1er juillet 1974. Avant, les petites carrières
    recevaient une rente, que le modèle ne distingue pas de la pension : aucun versement
    unique
  fiabilite: faible
  bornes:
    liquidation.date_effet: [null, 1974-07-01]
  contenu:
    droit: aucun versement forfaitaire lu
    parametres:
      existe: false
  exemples: aucun trouvé
