historique:
- >-
  2026-10-08 — écrite à l'étape 17 de l'action 138, sur le point de Destinie 2 au
  registre (chantier 138.17) et l'écart de TRAJECTOiRE, que la loi n° 2014-40 tranche.
reformes:
- touraine_2014
effet: >-
  L'assuré du régime général dont la pension annuelle, majoration pour enfants comprise,
  passe sous le seuil — 26,68 € en 1974, 156,24 € en 2015, 183,01 € en 2026 pour la
  suite transitoire — reçoit quinze annuités en une fois : une carrière de quelques
  trimestres, ou de bas salaires sans le minimum contributif.
