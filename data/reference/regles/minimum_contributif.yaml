historique:
- >-
  2026-09-23 — la surcote ajoutée au minimum depuis avril 2009, et non le minimum
  surcoté ; le plafond de 2024 celui de janvier.
- >-
  2026-10-04 — datée, à l'étape 138.15 : les montants de chaque revalorisation depuis
  1983, au lieu de six ancres reliées par les prix ; huit versions, de l'absence de
  minimum avant avril 1983 à l'AVPF de 2023 ; la proratisation tous régimes des
  polypensionnés, que le relevé n'avait pas vue.
- >-
  2026-10-05 — confrontée à TRAJECTOiRE (action 142, étape 4) : la pension au minimum
  contributif concorde, à dix centimes par an près.
- >-
  2026-10-14 — la pension minimum d'avant le 1er avril 1983, à l'étape 138.6 : la
  pension au taux de soixante-cinq ans portée au montant de l'AVTS, entière à soixante
  trimestres, en soixantièmes en dessous, lue de 1976 à 1983, présumée de 1945 à 1976 ;
  avant, le modèle ne servait aucun minimum.
- >-
  2026-10-14 — les autres régimes : les salariés agricoles lus (décret n° 50-1225,
  article 55-5) ; les artisans et les commerçants portés au minimum de base au titre de
  leurs périodes d'après 1972, le cumul avec l'avantage d'avant 1973 borné au minimum
  entier (décret n° 73-937, article 7) ; deux pensions portées au minimum se cumulent.
exemples:
- cnav_2005_30_minimum_majore_monopensionne
- sp_a15703_minimum_contributif_2026
effet: >-
  Petites pensions au taux plein. Le majoré de 2004 sortait 7,9 % trop haut et celui de
  2019 4,7 %, faute des montants servis ; le majoré et l'écrêtement étaient servis à
  toute date depuis 1983, le seuil de 120 trimestres opposé avant avril 2009 ; un
  polypensionné au-delà de la durée requise recevait son minimum au prorata de la durée
  de proratisation et non de sa durée tous régimes ; l'AVPF n'entrait pas dans la
  majoration depuis septembre 2023.
referents:
  trajectoire:
    equivalent: >-
      calculeMinimum et ecreteMico (R/fonctionsCalculsPensions.R), mico.csv,
      revaloMico.csv, reglePourMicoMajore.csv
    confrontation: >-
      le 5 octobre 2026, TRAJECTOiRE exécuté à part (tests/test_trajectoire.py) : la
      pension de base portée au minimum contributif concorde, à dix centimes par an
      près — le bas salaire de Destinie parti en février 2018 (8 322,13 € au dépôt,
      8 322,18 € chez TRAJECTOiRE), le cas type 2 bis du COR né en 1955 et en 1963 ; le
      complément
      diffère avec le salaire annuel moyen, dont TRAJECTOiRE a la chaîne de coefficients
      fausse (registre)
  openfisca_france_pension:
    equivalent: >-
      regime_general_cnav_pension_minimale et regime_general_cnav_pension_brute
    confrontation: >-
      le 16 octobre 2026 (action 153, étape 2 ; tests/test_oracle_minima.py) : cinq
      salariés entrés tard, liquidés de 2009 à 2014, portés au même minimum au centime,
      la majoration servie aux seuls 120 trimestres cotisés et plus ; il ne proratise
      pas le minimum sur la durée corrigée après l'âge du taux plein : l'écart est le
      sien (registre)
