  contenu:
    droit: >-
      le minimum majoré pour toute pension au taux plein, sans distinguer les périodes
      cotisées, réduit au prorata de la durée d'assurance au régime sur la durée de
      proratisation ; au-delà de la durée requise tous régimes, au prorata de la durée du
      régime sur la durée tous régimes ; la limitation du cumul abrogée (article 26 II de
      la loi du 21 août 2003, circulaire Cnav 2004/13)
