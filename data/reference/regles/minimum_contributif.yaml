      somme supérieure au montant de la pension minimale la plus élevée susceptible d'être
      servie dans le régime le plus favorable »
    lu_le: 2026-10-04
  - reference: >-
      Cnav, exposé « Minimum avant 2012 », partie « Du 01/04/1983 au 31/12/2003 » : la
      limite « était le minimum entier le plus élevé susceptible d'être servi par le
      régime le plus favorable » ; pour des attributions simultanées et un minimum
      identique, « le régime de la plus longue durée d'assurance […] payait sa retraite
      portée au minimum ; les autres régimes calculaient un complément différentiel
      proportionnel à leur durée d'assurance » (R. 173-11) ; pour les retraites attribuées
      depuis le 01/12/1984
    lu_le: 2026-10-04
