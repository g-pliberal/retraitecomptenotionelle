      « 6 511,06 Euros par an au 1er janvier 2004 » ; « de façon à atteindre 6 706,39
      Euros par an au 1er janvier 2004 »
    lu_le: 2026-10-04
  - reference: >-
      lettre ministérielle du 25 mars 2004, point 2 : les caisses « sont autorisées, à
      titre transitoire, à appliquer à l'ensemble des pensions prenant effet en 2004 le
      montant afférent aux périodes cotisées » ; pour les pluriactifs au-delà de 160
      trimestres, « le produit du montant du minimum pour une carrière complète dans ce
      régime par le rapport entre la durée d'assurance dans ce régime et la durée totale
