schema_version: 1
id: minimum_contributif
intitule: >-
  La pension de base au taux plein est portée à un minimum, réduit au prorata de la durée
  d'assurance dans le régime, ou de la durée tous régimes quand celle-ci dépasse la durée
  requise ; depuis 2004, ce minimum est majoré au titre des périodes cotisées — de
  toutes les périodes jusqu'en juin 2005, des seules périodes cotisées ensuite, à partir
  de 120 trimestres cotisés depuis avril 2009, l'AVPF et l'AVA comprises dans la limite
  de 24 trimestres depuis septembre 2023 ; jusqu'en 2003, le cumul de plusieurs pensions
  portées au minimum est limité au minimum entier ; depuis 2012, le complément est écrêté
  sur l'ensemble des pensions ; la surcote s'y ajoute depuis avril 2009.
domaine: minima
regimes: [regime_general, msa_salaries, cancava, organic, rsi, cavimac]
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- la pension de chaque régime qui porte le minimum, sa durée d'assurance, sa durée cotisée,
  sa durée de proratisation et sa durée requise, et le taux plein qui ouvre le droit
- la durée d'assurance et la durée cotisée des autres régimes de base, et les trimestres
  cotisés tous régimes, à quatre par an au plus
- les trimestres d'assurance vieillesse des parents au foyer et des aidants, année par
  année
- les montants du minimum, du majoré et du plafond en vigueur à la date d'effet
  (legislation/minimum_contributif.csv)
- les pensions déjà servies et les pensions étrangères, pour l'écrêtement
ecrit:
- le complément de chaque régime porté au minimum, majoration des périodes cotisées
  comprise, après la limitation du cumul ou l'écrêtement que sa date d'effet demande
dates_qui_decident:
- liquidation.date_effet
