approximations:
- ecart: >-
    la durée tous régimes est la somme des durées d'assurance que le modèle compte à
    chaque régime de base ou intégré, majorations pour enfants comprises, et non la durée
    que chaque régime communique ; la durée cotisée tous régimes, de même ; les périodes
    reconnues équivalentes, que la Cnav en exclut, n'y sont pas distinguées
  effet: non mesuré
- ecart: >-
    la limitation du cumul d'avant 2004 ne compare que les régimes qui portent le minimum
    contributif (régime général et régimes alignés) ; le minimum garanti de la fonction
    publique, qu'elle comprenait, n'y entre pas, et les attributions successives sont
    traitées comme simultanées
  effet: non mesuré
- ecart: >-
    les trimestres d'AVPF et d'AVA se comptent ligne par ligne, chaque année après les
    trimestres cotisés de l'année et dans la limite de quatre, dans l'ordre des années ;
    ceux que la fonction publique valide au même titre (D. 351-2-2, III) ne sont pas
    distingués
  effet: non mesuré
- ecart: >-
    au-delà du dernier montant publié, le minimum et le majoré se revalorisent chaque
    année sur le SMIC annuel du modèle, et non sur son évolution d'un 1er janvier à
    l'autre ; le plafond de même, et non à chaque relèvement du SMIC
  effet: non mesuré
- ecart: >-
    avant le 1er avril 1983, la pension d'un artisan ou d'un commerçant porte en un seul
    calcul les années d'avant 1973 et celles d'après (étape 138.18) : la part que le
    minimum de base relève (décret n° 73-937, article 7) se lit au prorata des trimestres
    d'après 1972, et non sur la pension de ces seules périodes ; le décret n° 73-937
    renvoie au « II de l'article 70-2 » du décret n° 45-0179, rédaction d'avant 1976
    que les index n'ont pas, présumé dire la règle de l'article 70-5 ; avant le
    5 mars 1976, la règle est présumée
  effet: non mesuré
- ecart: >-
    avant le 1er juillet 1974 au régime général, la coordination des régimes de salariés
    et de non-salariés (décret n° 58-436, article 4) portait la fraction de chaque régime
    au minimum « réduit au prorata de la durée des périodes accomplies sous ledit régime
    par rapport à la durée totale », quand l'assuré réunissait quinze ans tous régimes ;
    le modèle proratise chaque régime sur soixante trimestres
  effet: non mesuré
- ecart: >-
    la condition de subsidiarité (L. 351-10-1), depuis 2012, se présume remplie : toutes les
    pensions auxquelles l'assuré peut prétendre sont demandées
  effet: non mesuré
