- id: pension_minimum_de_1976
  statut: lue
  textes:
  - id: LEGIARTI000006760665
    reference: >-
      décret n° 45-0179, article 70-5, 2. (rédaction du 12 mai 1976, décret n° 76-404) :
      « Seuls peuvent bénéficier de l'intégralité du minimum de base prévu à l'article
      L. 345 du code de la sécurité sociale les titulaires d'une pension de vieillesse
      substituée à une pension d'invalidité et les titulaires de pensions correspondant à
      une durée d'assurance d'au moins quinze années (soit 60 trimestres) accomplies dans
      le régime général de la sécurité sociale. Lorsque cette durée est inférieure à
      quinze années, le minimum de base est réduit à autant de soixantièmes que l'assuré
      justifie de trimestres d'assurance. Au minimum de base entier ou réduit
      s'ajoutent, le cas échéant : […] Une bonification de 10 p. 100 du montant du
      minimum de base […] ; La majoration pour conjoint à charge »
    en_vigueur: 1976-05-12
    lu_le: 2026-10-14
  - id: LEGIARTI000006760669
    reference: décret n° 45-0179, article 70-7 (rédaction du 23 juillet 1982), le même texte
    en_vigueur: 1982-07-23
    lu_le: 2026-10-14
  - id: LEGIARTI000006774013
    reference: >-
      décret n° 50-1225 du 21 septembre 1950, article 55-5, II (rédaction du 30 juin
      1976), et article 55-7 (15 décembre 1982, LEGIARTI000006774018), le texte du régime
      général aux salariés agricoles : « titulaires de pensions correspondant à une durée
      d'assurance d'au moins quinze années (soit 60 trimestres) accomplies dans le régime
      des assurances sociales agricoles. Lorsque cette durée est inférieure à quinze
      années, le minimum de base est réduit à autant de soixantièmes que l'assuré
      justifie de trimestres d'assurance »
    en_vigueur: 1976-06-30
    lu_le: 2026-10-14
  - id: LEGIARTI000006765827
    reference: >-
      décret n° 73-937 du 2 octobre 1973, article 7 (rédaction du 5 mars 1976), aux
      artisans et aux commerçants : « Le minimum de base prévu à l'article L. 345 du Code
      de la sécurité sociale est attribué, au titre des périodes d'assurance postérieures
      au 31 décembre 1972, dans les conditions fixées par le II de l'article 70-2 du
      décret du 29 décembre 1945 susvisé. Toutefois, lorsque l'assuré justifie également
      de périodes d'assurance ou d'activité professionnelle non-salariée antérieures au
      1er janvier 1973 valables au titre du régime d'assurance vieillesse en vigueur au
      31 décembre 1972, l'application dudit article L. 345 ne peut avoir pour effet de
      porter à un montant supérieur à celui du minimum de base entier le montant cumulé
      de la pension allouée au titre des périodes d'assurance postérieures au 31 décembre
      1972 et de l'avantage de vieillesse alloué au titre des périodes d'assurance et
      d'activité non-salariée antérieures au 1er janvier 1973 »
    en_vigueur: 1976-03-05
    lu_le: 2026-10-14
  - id: LEGIARTI000006773767
    reference: >-
      décret n° 51-727 du 6 juin 1951, article 1er bis, paragraphe 2 (rédaction du 26 août
      1977) : « Le montant de la pension de retraite d'un assuré âgé de plus de soixante-
      cinq ans ou de moins de soixante-cinq ans mais inapte au travail ne peut être
      inférieur à celui visé à l'article L. 345 du Code de la sécurité sociale »
    en_vigueur: 1977-08-26
    lu_le: 2026-10-14
  - id: LEGIARTI000006762489
    reference: >-
      décret n° 81-1166 du 30 décembre 1981, article 1er : « Sont portés à 10.100 F par an
      à compter du 1er janvier 1982 : Le montant de l'allocation aux vieux travailleurs
      salariés […] ; Le montant de la pension minimum de vieillesse visée aux articles
      L. 345, L. 350 et L. 379 du code de la sécurité sociale » ; de même les décrets
      n° 82-561 (LEGIARTI000006762758, 10 900 F) et n° 82-1142 (LEGIARTI000006763160,
      11 300 F)
    en_vigueur: 1982-01-01
    lu_le: 2026-10-14
  - id: LEGIARTI000006764238
    reference: >-
      décret n° 83-551 du 30 juin 1983, article 4 : les « pensions de vieillesse portées,
      avec une date d'effet antérieure au 1er avril 1983, au montant minimum de base prévu
      aux articles L. 345 et L. 379 », qui suivent l'AVTS après la réforme
    en_vigueur: 1983-07-01
    lu_le: 2026-10-14
  - reference: >-
      Cnav, exposé « Minimum avant 2012 », partie « Avant le 01/04/1983 » : « Le minimum
      contributif est applicable depuis le 01/04/1983. Avant cette date, la retraite était
      comparée au montant de l'allocation aux vieux travailleurs salariés (AVTS) si elle
      était attribuée au taux plein »
    lu_le: 2026-10-04
  bornes:
    liquidation.date_effet: [1976-05-12, 1983-04-01]
  contenu:
    droit: >-
      pas de minimum contributif : la pension au taux de soixante-cinq ans — à soixante-
      cinq ans, ou avant au titre de l'inaptitude ou d'une catégorie — est portée au
      minimum de base de L. 345, que les décrets fixent au montant de l'allocation aux
      vieux travailleurs salariés (pension_minimum_avant_1983.csv) : entier à soixante
      trimestres d'assurance dans le régime ou à l'ex-invalide, en soixantièmes en
      dessous ; la bonification pour trois enfants s'y ajoute, au taux de 10 %, comme à
      la pension, et la majoration pour conjoint à charge. Au régime des salariés
      agricoles, le même minimum, entier à soixante trimestres dans ce régime (décret
      n° 50-1225, article 55-5), lu depuis le 30 juin 1976. Aux artisans et aux
      commerçants, le minimum en soixantièmes des seuls trimestres d'après 1972, qui
      relève la part de la pension qui leur revient ; s'il y a des périodes d'avant 1973,
      le cumul des deux avantages n'est pas porté au-delà du minimum entier (décret
      n° 73-937, article 7). Chaque régime proratise sur ses propres trimestres : deux
      pensions portées au minimum se cumulent sans autre borne, aucun texte lu n'en
      posant
