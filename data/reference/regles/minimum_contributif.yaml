      dans le régime général, le cas échéant rapportée à la durée d'assurance accomplie
      tant dans le régime général que dans un ou plusieurs autres régimes obligatoires,
      lorsque celle-ci dépasse la limite visée au deuxième alinéa de l'article L. 351-1 » ;
      « Ce montant minimum est majoré au titre des périodes ayant donné lieu à cotisations
      à la charge de l'assuré »
    lu_le: 2026-10-04
  - id: LEGIARTI000006736531
    article: D. 351-2-1 CSS
    en_vigueur: 2003-12-30
