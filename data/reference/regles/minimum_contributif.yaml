    rente des moins de quinze ans d'assurance n'était peut-être pas portée au minimum.
  - >-
    Avant le 1er avril 1983 : le décret n° 50-1225 avant le 30 juin 1976, le décret
    n° 73-937 avant le 5 mars 1976 et l'article 70-2 du décret n° 45-0179 auquel il
    renvoie, au fac-similé ; la règle de la coordination de 1958 avant juillet 1974 ; et
    ce qui s'ajoutait au minimum, la rente des assurances sociales au 31 décembre 1940 et
    celle des retraites ouvrières et paysannes, que le modèle ne connaît pas.
  - Relire les montants à chaque revalorisation de janvier (circulaire Cnav « Revalorisation
    du Smic ») et le plafond à chaque relèvement du SMIC.
  - >-
