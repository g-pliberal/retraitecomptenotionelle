schema_version: 1
id: marins_salaire_de_reference
intitule: >-
  Salaire de référence des marins : forfait de la catégorie des trois dernières années,
  ou catégorie moyenne des trente-six derniers mois, ou de fonctions supérieures tenues
  cinq ans, compté pour moitié au-delà de huit fois le traitement de l'indice 100 ;
  services décomptés au semestre.
domaine: salaire_de_reference
regimes: [marins]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  les catégories dans lesquelles le marin a été classé, mois par mois, les trente-six
  derniers mois avant la liquidation, et celles de fonctions supérieures qu'il a tenues
  cinq ans au moins (R. 11)
- les salaires forfaitaires de ces catégories, que fixent les arrêtés annuels
- le traitement brut de l'indice 100 de la fonction publique (R. 11, 3°)
- la durée de ses services, que le décompte final arrondit au semestre (R. 12)
- la date d'effet de sa pension
ecrit:
- >-
  le salaire annuel sur lequel la pension des marins se calcule, à 2 % par annuité de
  service (R. 13)
- le nombre d'annuités liquidées, au semestre (R. 12)
dates_qui_decident:
- liquidation.date_effet
versions:
- id: loi_du_12_avril_1941
  statut: supposee
  hypothese: >-
    les pensions qui prennent effet avant le 31 mars 1968 relèvent de la loi du 12 avril
    1941, que le décret n° 68-292 du 21 mars 1968 abroge en la codifiant, et que les index
    du dépôt ne portent pas ; la loi n° 48-1469 du 22 septembre 1948 renvoie déjà au
    « salaire forfaitaire correspondant, en application des articles 12 et 55 modifiés de
    la loi du 12 avril 1941, aux fonctions occupées par l'intéressé avant la cessation de
    ses services » (article 13) : la fiche présume la règle que le code de 1968 reprend
  fiabilite: moyenne, le forfait des fonctions étant lu dans la loi de 1948, la catégorie moyenne, l'abattement et le semestre non
  textes:
  - {id: LEGIARTI000006757996, article: "loi n° 48-1469 du 22 septembre 1948, article 13, qui porte l'allocation minima des agents du service général à 0,75 % du salaire forfaitaire de leurs fonctions par annuité", en_vigueur: 1948-01-01}
  - {id: JORFTEXT000000335854, article: "décret n° 68-292 du 21 mars 1968 portant codification des textes législatifs et réglementaires déterminant le régime des pensions de retraite des marins : « création d'un code des pensions de retraite des marins, abroge la loi du 12-04-1941 » (analyse du Journal officiel)", en_vigueur: 1968-03-31, publie_le: 1968-03-31}
  bornes:
