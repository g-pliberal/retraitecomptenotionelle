historique:
- >-
  2026-11-02 — lue au droit (action 130) : trois versions sur la date d'effet — la loi du
  12 avril 1941, présumée codifiée à droit constant ; le code de 1968, R. 11 et R. 12 ;
  depuis le 9 avril 1999, R. 31 pour les contrats à temps partiel simultanés. Le 3° de
  R. 11, l'abattement au-delà de huit fois l'indice 100, est lu, et déclaré : le modèle ne
  l'applique pas.
- >-
  2026-11-03 — l'abattement de R. 11, 3° écrit dans les deux moteurs (action 130, file
  M1) : le traitement de l'indice 100 est celui de l'indice brut 100, que l'article 7 du
  décret n° 85-1148 constitue de celui d'un indice majoré — 150 en 1985, 208 depuis 2024 —,
  et non de l'indice majoré 100, que l'approximation du 2 novembre avait pris sans source :
  le plafond vaut 98 298,14 € en 2026, et non 47 258,72 €. Aucune catégorie ne l'a atteint
  de 2008 à 2026, sur les grilles publiées ; de 1985 à 2007, sur la seule grille que le
  modèle estime ; avant le 5 novembre 1985, le traitement n'est pas lu, et déclaré. Après
  la relecture R-M1 du même jour : l'affirmation restreinte ainsi, le choix de l'article 7
  contre le barème A et l'arrondi du barème B déclarés, l'écart de la grille estimée
  mesuré en 1995 et en 2006.
- >-
  2026-11-03 — la limite de la grille d'avant 2008 déclarée (action 130, file M1, note
  `130/2026-11-03-limite-de-la-grille-des-marins.md`) : ce que l'index en garde et ce
  qu'il n'en dit pas, l'effet possible sur les pensions et les comptes des carrières
  d'avant 2008, le plafond sous la grille relevée de l'écart de 1995 ; une question au
  propriétaire. « Sous 75,1 % du plafond (2005) » se lit « au plus 75,1 % » : la vingtième
  de 2005 y est à 75,11 %. Aucune règle de calcul ne change.
code:
  moteur: >-
    La période des marins liquide le dernier salaire (`salaire_reference`) :
    `salaire_de_reference` prend l'assiette de la dernière ligne que le régime reçoit
    l'année du départ, annualisée. `assiette_de_reference` la lit, pour un régime à
    grille (`assiette_grille`), au forfait de la catégorie dont le montant est le plus
    proche du revenu annualisé de l'année (`SalairesForfaitaires.forfait`), proratisé
    sur ses mois : la catégorie de la dernière année, rangée par le revenu, et non la
    catégorie moyenne des trente-six derniers mois, ni celle de fonctions supérieures
    tenues cinq ans. Hors des années que la grille publie, la plus proche est portée
    par le salaire moyen, de fiabilité estimée. Au-delà de huit fois le traitement de
    l'indice 100 à la date d'effet (`plafond_du_salaire_de_reference`, que la période
    arme de `plafond_en_traitements_de_l_indice_100`), la portion du salaire ne compte
    que pour moitié (`abattre_au_dela_du_plafond`, `part_au_dela_du_plafond`) : le
    traitement de l'indice majoré que l'article 7 du décret n° 85-1148 fait correspondre
    à l'indice 100 ce jour-là (`MinimumGaranti.traitement_de_l_indice_100`), au point du
    1er janvier de l'année, le dernier connu au-delà de la série ; rien avant le
    5 novembre 1985. Le détail du montant le dit. Les services se comptent au trimestre,
    non au semestre.
  python: >-
    droit/liquider.py : salaire_de_reference, assiette_de_reference,
    plafond_du_salaire_de_reference, abattre_au_dela_du_plafond ;
    donnees/regimes.py : SalairesForfaitaires, SalairesForfaitaires.forfait ;
    scenarios/actuel.py : MinimumGaranti.traitement_de_l_indice_100
  javascript: >-
    moteur/js/droit/liquider.js : salaireDeReference, assietteDeReference,
    plafondDuSalaireDeReference, abattreAuDelaDuPlafond ;
    moteur/js/regimes.js : SalairesForfaitaires, SalairesForfaitaires.forfait,
    MinimumGaranti.traitementDeLIndice100
  parametres: >-
    contenu.parametres de chaque version : assiette, assiette_grille, mois_de_reference,
    annees_de_fonctions_superieures, plafond_en_traitements_de_l_indice_100,
    part_au_dela_du_plafond, mois_du_decompte_des_services, contrats_simultanes ;
    regimes/marins.yaml : salaire_reference, assiette, assiette_grille,
    plafond_en_traitements_de_l_indice_100, part_au_dela_du_plafond ;
    regimes/salaires_forfaitaires.csv : marins, annee, categorie, montant_annuel ;
    legislation/indice_100_fonction_publique.csv : date_effet, indice_majore ;
    legislation/point_indice_fonction_publique.csv : annee, valeur
  tests:
  - >-
    tests/test_marins.py, qui confronte chaque version à la période des marins, tient les
    écarts déclarés, relit chaque rédaction de l'article 7 au LEGI, et pose à la main le
    plafond et l'abattement
  - >-
    tests/js/moteur.test.js, « le salaire des marins ne compte que pour moitié au-delà du
    plafond de R. 11 », qui pose les mêmes valeurs au portage
  - tests/test_simulateur.py
  - >-
    tests/test_cumul_activites.py, tests/test_liquidation.py et tests/test_web.py,
    qui confrontent les deux moteurs sur des carrières qui le portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    neuf témoins changent sans le forfait à la liquidation — statut_marin et ses
    générations 1925 à 1968, marin_avant_cinquante_cinq et metiers_maximum — ; un
    dixième, marin_au_dela_du_plafond, sans l'abattement
