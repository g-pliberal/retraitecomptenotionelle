schema_version: 1
id: marins_salaire_de_reference
intitule: >-
  Salaire de référence des marins : forfait de la catégorie moyenne des trente-six
  derniers mois, ou de fonctions supérieures tenues cinq ans ; services décomptés
  au semestre.
regimes: [marins]
etat: approchee
effet: >-
  Le modèle prend la catégorie de la DERNIÈRE année, rangée par le revenu, et compte
  les services au trimestre ; la caisse prend la catégorie moyenne de trente-six
  mois et arrondit au semestre (R. 12 : quatorze ans huit mois et vingt-sept jours
  font quatorze ans et demi). L'écart tient à une catégorie et à un trimestre au
  plus. La grille elle-même est exacte : les vingt montants de 2026 publiés par
  l'ENIM sont ceux du dépôt, au centime, comme les trois montants de 2024 que cite
  son exemple.
sources:
  lu_le: 2026-09-22
  prochaine_relecture: 2027-04-30
  a_relire:
  - >-
    Un parcours ne porte pas de catégorie : la moyenne des trente-six mois et la
    règle des cinq ans demanderaient d'en saisir une.
  lectures:
  - type: legifrance
    reference: >-
      code des pensions de retraite des marins, R. 11, R. 12 et R. 31, versions
      en vigueur lues dans l'index LEGI
    date: 2026-09-22
  - type: autre
    reference: >-
      ENIM, pages « Le mode de calcul » et « Les salaires forfaitaires » (grille
      au 1er avril 2026)
    url: https://www.enim.eu/employeur/salaires-forfaitaires
    date: 2026-09-22
textes_a_rattacher:
- reference: >-
    code des pensions de retraite des marins, R. 11 (LEGIARTI000006791987), R. 12
    (LEGIARTI000006791988) et R. 31
code:
  moteur: >-
    La période des marins liquide le dernier salaire (`salaire_reference`) :
    `salaire_de_reference` prend l'assiette de la dernière ligne que le régime reçoit
    l'année du départ, annualisée. `assiette_de_reference` la lit, pour un régime à
    grille (`assiette_grille`), au forfait de la catégorie dont le montant est le plus
    proche du revenu annualisé de l'année (`SalairesForfaitaires.forfait`), proratisé
    sur ses mois : la catégorie de la dernière année, rangée par le revenu, et non la
    catégorie moyenne des trente-six derniers mois, ni celle de fonctions supérieures
    tenues cinq ans. Hors des années que la grille publie, la plus proche est portée
    par le salaire moyen, de fiabilité estimée. Les services se comptent au trimestre,
    non au semestre.
  python: >-
    droit/liquider.py : salaire_de_reference, assiette_de_reference ;
    donnees/regimes.py : SalairesForfaitaires, SalairesForfaitaires.forfait
  javascript: >-
    moteur/js/droit/liquider.js : salaireDeReference, assietteDeReference ;
    moteur/js/regimes.js : SalairesForfaitaires, SalairesForfaitaires.forfait
  parametres: >-
    regimes/marins.yaml : salaire_reference, assiette, assiette_grille ;
    regimes/salaires_forfaitaires.csv : marins, annee, categorie, montant_annuel
  tests:
  - tests/test_simulateur.py
  - >-
    tests/test_cumul_activites.py, tests/test_liquidation.py et tests/test_web.py,
    qui confrontent les deux moteurs sur des carrières qui le portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    neuf témoins changent sans le forfait à la liquidation — statut_marin et ses
    générations 1925 à 1968, marin_avant_cinquante_cinq et metiers_maximum
