  contenu:
    parametres:
      assiette: forfaitaire
      assiette_grille: marins
      mois_de_reference: 36
      annees_de_fonctions_superieures: 5
      plafond_en_traitements_de_l_indice_100: 8
      part_au_dela_du_plafond: 0.5
      mois_du_decompte_des_services: 6
      contrats_simultanes: moyenne_des_indices_ponderee_par_la_duree_du_travail
    droit: >-
      R. 11 et R. 12, inchangés depuis 1968 ; « Pour la détermination de la catégorie
      moyenne visée au 1° de l'article R. 11 ou de la catégorie visée au 2° du même article,
      lorsque le marin a été classé, pendant une période d'exécution simultanée de plusieurs
      contrats de travail à temps partiel, dans des catégories différentes au titre de
      chacun de ces contrats, il est procédé, avant d'effectuer les calculs prévus à
      l'article R. 11 (1° et 2°), à la détermination de la catégorie moyenne de cette
      période » : l'indice de chaque catégorie pondéré par la durée du travail du contrat,
      rapportée à la durée légale ou conventionnelle (R. 31)
    conditions: >-
      depuis le 9 septembre 2005, la pension inférieure au minimum de L. 351-9 du code de la
      sécurité sociale est remplacée par le versement forfaitaire unique (L. 14), qui ne
      touche pas le salaire de référence ; depuis le 1er décembre 2010, le code des
      transports reprend L. 14 et L. 42 : la pension est égale, par annuité, à un
      pourcentage du salaire forfaitaire de L. 5553-5, « correspondant, sous réserve d'un
      abattement au-delà d'un plafond, à la catégorie dans laquelle se trouvait le marin
      pendant une période déterminée », pourcentage, abattement, plafond et période fixés
      par décret en Conseil d'Etat (L. 5552-19) — ceux de R. 11 et R. 13 ; depuis le
      1er janvier 2018, les salaires forfaitaires sont révisés au 1er avril de chaque année
      par le coefficient de L. 161-25 du code de la sécurité sociale (L. 5553-5). Ni R. 11,
      ni R. 12, ni R. 31 n'ont de rédaction depuis (index LEGI à jour de l'incrément du
      2 novembre 2026). Le traitement de l'indice 100 de R. 11, 3° : celui de l'indice
      majoré 158 à 199 jusqu'au 30 juin 2008 (décret n° 85-1148, article 7), puis, « se
      référant au traitement de l'indice 100 ou de l'indice brut 100 », de l'indice majoré
      201, 203 dès le 1er juillet 2009, 208 dès le 1er janvier 2024
      (`legislation/indice_100_fonction_publique.csv`) : 8 × 208 × 59,0734 = 98 298,14 € en
      2026, quand la vingtième catégorie est à 76 867,05 €
  exemples: [enim_bonification_deux_enfants]
approximations:
- version: [loi_du_12_avril_1941, code_de_1968, contrats_simultanes]
  textes: R. 11, 1° et 2°
  ecart: >-
    le modèle liquide le forfait de la catégorie de la DERNIÈRE année, rangée par le revenu
    annualisé (la catégorie dont le forfait en est le plus proche), proratisé sur ses mois,
    et non la catégorie des trois dernières années ou leur catégorie moyenne de trente-six
    mois (1°), ni celle de fonctions supérieures tenues cinq ans au moins (2°) : une
    carrière saisie porte un revenu, pas une fonction à bord
  effet: >-
    nul pour le marin resté dans la même catégorie ses trois dernières années, sans
    fonctions supérieures tenues cinq ans ; le salaire d'une catégorie entière pour celui
    qui finit sa carrière plus bas qu'il ne l'a tenue ; non mesuré
- version: [loi_du_12_avril_1941, code_de_1968]
  textes: R. 11, 3° ; décret n° 85-1148, article 7, depuis le 5 novembre 1985
  ecart: >-
    avant le 5 novembre 1985, le traitement de l'indice 100 n'est pas lu : les décrets de
    rémunération qui le fixaient (n° 68-566 du 21 juin 1968, n° 70-393 du 12 mai 1970,
    n° 74-652 du 19 juillet 1974 et leurs modifications) ne sont, dans les index JORF et
    LEGI du dépôt, qu'en analyses, et Légifrance refuse l'outil de la session. Le modèle
    n'abat pas les pensions qui prennent effet avant ; avant le 31 mars 1968, l'abattement
    n'est que présumé (loi du 12 avril 1941)
  effet: >-
    nul tant que ce traitement valait au moins celui de l'indice majoré 103 : de 1968 à 1984,
    la vingtième catégorie de la grille du modèle, celle de 2008 ramenée par le salaire
    moyen, ne passe huit fois le traitement de l'indice 100 que s'il était celui d'un indice
    majoré inférieur à 76,5 en 1968, à 102,8 en 1980, le plus haut de ces seuils, au point
    de leur année ; il valait celui de l'indice majoré 150 au
    5 novembre 1985, et le barème du décret n° 82-1105 que le dépôt tient
    (`grilles/bareme/indices.csv`) donne l'indice majoré 150 à l'indice brut 100 en 1983 et
    1984 — une lecture du barème, pas de l'article qui fixait le traitement de l'indice 100
- version: [code_de_1968, contrats_simultanes]
  textes: décret n° 85-1148, articles 3 et 5 ; R. 11, 3°
  ecart: >-
    le traitement de l'indice 100 se prend au point du 1er janvier de l'année
    (`legislation/point_indice_fonction_publique.csv`), et non au point du jour : un
    relèvement en cours d'année, comme celui du 1er juillet 2023, ne relève le plafond
    qu'au 1er janvier suivant ; au-delà de 2027, dernière valeur de la série, le point reste
    le dernier connu, faute de décret qui le relève. Le traitement est l'indice fois le
    point, sans l'arrondi au centime du barème B (article 5 : « Les traitements et soldes
    annuels correspondant aux indices majorés figurent au barème B ») : 208 × 59,0734 =
    12 287,2672 €, quand le barème B du décret n° 2023-519 (JORFARTI000047749261) écrit
    12 287,27 € ; le plafond de 2026 vaut 98 298,14 € au lieu de 98 298,16 €
  effet: >-
    nul de 2008 à 2026, prouvé sur les grilles publiées, que le dépôt lit : aucun forfait
    n'approche le plafond, la vingtième catégorie restant sous 79 % de lui ; de 1985 à 2007,
    les arrêtés ne sont pas lus (approximation des arrêtés annuels, ci-dessous) : sur la
    grille que le modèle estime, la vingtième catégorie atteint au plus 75,1 % du plafond (2005),
    et il faudrait que la grille réelle fût plus haute d'un tiers pour qu'il morde — très
    probable, non démontré ; le plafond du modèle est plus bas que celui du droit après un
    relèvement du point en cours d'année. En projection, sous le point gardé et la grille
    portée par le salaire moyen, la vingtième catégorie le passe en 2037
- version: [code_de_1968, contrats_simultanes]
  textes: décret n° 85-1148, article 7 ; décret n° 82-1105, barème A
  ecart: >-
    la série suit la lettre de l'article 7, que R. 11, 3° vise, et non le barème A du décret
    n° 82-1105 que le dépôt tient (`grilles/bareme/indices.csv`), qui donne l'indice majoré
    de l'indice brut 100 : de 152 dès le 1er janvier 1985, le décret n° 86-166 ayant remplacé
    le barème « à compter du 1er janvier 1985 », quand l'article 7 dit 150 jusqu'au 7 février
    1986 ; de 169 en mai et juin 2001, quand le premier alinéa de l'article 7, que le décret
    n° 2001-370 ne touche pas (JORFARTI000002487322), dit encore 164. La date du 7 février
    1986 est celle de la base LEGI : le texte qui modifie l'article 7 ce jour-là n'est dans
    aucun index du dépôt
  effet: >-
    le plafond de la série est plus bas que celui du barème de 8 × 2 × 38,5544 = 616,87 € en
    1985 et de 8 × 2 × 40,2892 = 644,63 € en 1986, de décembre 1985 à février 1986, et de
    8 × 5 × 51,2015 = 2 048,06 € en mai et juin 2001, au point du modèle ; aucune catégorie
    n'en approche
- version: [loi_du_12_avril_1941, code_de_1968, contrats_simultanes]
  textes: R. 12
  ecart: >-
    le modèle compte les services au trimestre ; le décompte final les arrondit au
    semestre, la fraction de trois mois ou plus comptant pour six mois, l'autre négligée
  effet: un trimestre de moins que le droit au plus, quand la fraction de semestre fait trois à cinq mois ; non mesuré
- version: [contrats_simultanes]
  textes: R. 31
  ecart: >-
    la catégorie moyenne des contrats à temps partiel simultanés n'est pas portée : le
    modèle ne connaît pas de catégorie
  effet: non mesuré
- version: [loi_du_12_avril_1941, code_de_1968, contrats_simultanes]
  textes: les arrêtés annuels de majoration des salaires forfaitaires
  ecart: >-
    avant 2008, les montants des arrêtés ne sont pas lus (décrets de 1956 à 1961, arrêtés
    de 1991 à 2006 : visas et titres seuls dans l'index) : la grille de 2008 est ramenée
    par le salaire moyen, de fiabilité estimée. Ce que l'index en garde : l'arrêté du
    29 décembre 1994 modifie les forfaits « pour compter du 1er janvier 1995, conformément
    au tableau ci-joint » (article 1er, JORFARTI000001974748), tableau qu'il ne porte pas, et
    l'arrêté du 31 janvier 1995 en corrige un montant, « Pour le salaire forfaitaire par
    mois de la 13e catégorie, au lieu de: << 14 773,03 >>, lire: << 14 733,03 >>. »
    (JORFARTI000002373607), soit 14 733,03 × 12 = 176 796,36 F par an, sans en écrire
    l'unité — le franc des textes réglementaires, que le décret n° 2001-1203 fait lire en
    euros « à compter du 1er janvier 2002 », au taux de « 6,55957 F pour un euro »
    (JORFTEXT000000580421) ; l'arrêté du 2 janvier 2006 modifie les forfaits « pour compter
    du 1er janvier 2006 » (article 1, JORFARTI000001105232), et son rectificatif écrit, dans la « 2e sous-colonne » du tableau, « en ce qui concerne la
    10e catégorie, au lieu de : « 25 243,53 », lire : « 25 243,83 » » (JORFARTI000001490715),
    sans nommer la sous-colonne : un forfait annuel par sa grandeur, une déduction — la
    10e catégorie vaut « 25 980,90 » « Par an » et « 72,17 » « Par jour » au 1er janvier 2008
    (arrêté du 31 décembre 2007, JORFARTI000017964781). Ce qu'il ne dit pas : la vingtième
    catégorie d'aucune année d'avant 2008, l'écart des autres années, la structure de la
    grille d'avant 2008 — le nombre de ses catégories, leurs rapports —, ni la grille du
    1er juillet 1995, que l'arrêté du 30 juin 1995 « portant majoration » renvoie au Journal
    officiel imprimé (« Vous pouvez consulter le tableau dans le JO no 0164 du 16/07/95 Page
    10596 », JORFARTI000001014119)
  effet: >-
    mesuré sur les deux seuls montants que l'index garde, la grille estimée est trop basse :
    la 13e catégorie du 1er janvier 1995, « 14 733,03 » F par mois (arrêté du 31 janvier
    1995, JORFARTI000002373607), 26 952,43 € par an, quand le modèle prend 23 530,15 € — le
    réel 14,5 % plus haut ; la 10e catégorie de 2006, « 25 243,83 » € (rectificatif du
    21 janvier 2006, JORFARTI000001490715), quand le modèle prend 24 709,23 € — 2,2 % plus
    haut ; ailleurs non mesuré, et la convention du forfait le plus proche du revenu en
    amortit l'effet sur la pension tant que le revenu du marin tombe dans la grille, à une
    catégorie près. L'effet possible sur les carrières d'avant 2008 : le forfait de chaque
    année d'avant 2008 fait l'assiette des cotisations du marin — ce que son compte reçoit
    aux scénarios en comptes notionnels — et le salaire de référence d'une pension qui prend
    effet avant 2008. Au-delà de la vingtième catégorie, l'écart ne s'amortit plus : le
    modèle prend 42 547,27 € en 1995 ; la vingtième réelle, si elle suit l'écart de la
    treizième et la structure de 2008 (la vingtième y vaut 1,8082 fois la treizième, comme
    en 2026), vaudrait 48 735,45 € — un salaire de référence et une pension plus bas que le
    droit de 12,7 % au plus pour le marin des plus hautes catégories qui part en 1995, de
    2,1 % en 2006 si l'écart de la dixième vaut pour lui. Sur le plafond de R. 11, 3°, la
    vingtième réelle de 1995 ainsi estimée serait à 80,5 % de celui du 1er janvier 1995
    (8 × 158 × 314,22 F = 397 174,08 F, 60 548,80 €) ; la grille du modèle relevée tout
    entière de l'écart de 1995, le plus grand des deux, laisserait la vingtième sous 86,1 %
    du plafond de 1985 à 2007 (2005), et l'abattement ne mordrait toujours pas ; les seuils
    d'avant 1985 de l'approximation de R. 11, 3° monteraient de 76,5 et 102,8 à 87,6 et
    117,7
effet: >-
  Le modèle prend la catégorie de la DERNIÈRE année, rangée par le revenu, et compte
  les services au trimestre ; la caisse prend la catégorie moyenne de trente-six
  mois et arrondit au semestre (R. 12 : quatorze ans huit mois et vingt-sept jours
  font quatorze ans et demi). La grille lue, depuis 2008, est exacte : les vingt montants de
  2026 publiés par l'ENIM sont ceux du dépôt, au centime, comme les trois montants de
  2024 que cite son exemple ; celle d'avant 2008, estimée, est sous les deux montants réels
  que l'index garde (approximation des arrêtés annuels). L'abattement de R. 11, 3°,
  au-delà de huit fois le traitement de l'indice 100, est appliqué depuis le 3 novembre 2026 : ce traitement est
  celui de l'indice brut 100, l'indice majoré 208 depuis 2024 (article 7 du décret
  n° 85-1148), et non de l'indice majoré 100 ; le plafond, 98 298,14 € en 2026, aucune
  catégorie ne l'a atteint de 2008 à 2026, sur les grilles publiées ; de 1985 à 2007, rien
  de ce que le modèle calcule n'est abattu, mais sur une grille qu'il estime, et que les
  montants de 1995 et de 2006 montrent trop basse ; en projection, la vingtième catégorie
  le passe en 2037.
sources:
  lu_le: 2026-11-03
  prochaine_relecture: 2027-11-03
  a_relire:
  - >-
    Un parcours ne porte pas de catégorie : la moyenne des trente-six mois et la
    règle des cinq ans demanderaient d'en saisir une.
  - >-
    Le traitement de l'indice 100 avant le 5 novembre 1985 : les décrets de rémunération
    n° 68-566 du 21 juin 1968, n° 70-393 du 12 mai 1970, n° 74-652 du 19 juillet 1974 et
    ceux qui les modifient, au Journal officiel imprimé (fac-similés de Légifrance), que
    les index du dépôt ne portent qu'en analyses. Tant qu'ils ne sont pas lus, le modèle
    n'abat pas les pensions d'avant cette date.
  - >-
    La grille des salaires forfaitaires d'avant 2008 : les tableaux des arrêtés annuels, au
    Journal officiel imprimé (fac-similés de Légifrance), que l'index ne porte pas — la
    vingtième catégorie de quelques années (1986, 1995, 2000, 2005) suffirait à prouver que
    le plafond de R. 11, 3° n'a pas été atteint, la grille entière à corriger l'estimation,
    que les montants réels de 1995 et de 2006 montrent trop basse. Au propriétaire de dire
    s'il faut les chercher.
