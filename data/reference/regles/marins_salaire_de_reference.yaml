  contenu:
    parametres:
      assiette: forfaitaire
      assiette_grille: marins
      mois_de_reference: 36
      annees_de_fonctions_superieures: 5
      plafond_en_traitements_de_l_indice_100: 8
      part_au_dela_du_plafond: 0.5
      mois_du_decompte_des_services: 6
    droit: celui de la version code_de_1968, présumé
  exemples: aucun trouvé
- id: code_de_1968
  statut: lue
  textes:
  - {id: LEGIARTI000006791987, article: "code des pensions de retraite des marins, R. 11", en_vigueur: 1968-03-31, publie_le: 1968-03-31}
  - {id: LEGIARTI000006791988, article: "même code, R. 12", en_vigueur: 1968-03-31, publie_le: 1968-03-31}
  - {id: LEGIARTI000006791907, article: "même code, L. 14", en_vigueur: 1968-03-31, publie_le: 1968-03-31}
  - {id: LEGIARTI000006791949, article: "même code, L. 42", en_vigueur: 1968-03-31, publie_le: 1968-03-31}
  nee_de: LEGIARTI000006791987
  bornes:
    liquidation.date_effet: [1968-03-31, 1999-04-09]
  contenu:
    parametres:
      assiette: forfaitaire
      assiette_grille: marins
      mois_de_reference: 36
      annees_de_fonctions_superieures: 5
      plafond_en_traitements_de_l_indice_100: 8
      part_au_dela_du_plafond: 0.5
      mois_du_decompte_des_services: 6
    droit: >-
      « La pension d'ancienneté proportionnelle ou spéciale est calculée d'après le salaire
      forfaitaire correspondant, en application de l'article L. 42, à la catégorie dans
      laquelle l'intéressé s'est trouvé classé dans les trois dernières années précédant la
      liquidation de sa pension. Toutefois : 1° Si l'intéressé n'a pas cotisé d'une manière
      continue pendant les trente-six derniers mois au taux de cette catégorie, la pension
      est calculée sur la base du salaire d'une catégorie moyenne déterminée en multipliant
      les indices des catégories dans lesquelles l'intéressé s'est trouvé successivement
      placé au cours de cette période, par le nombre de mois de cotisation dans chacune
      d'elles et en divisant par trente-six le total obtenu […] ; 2° Si au cours de sa
      carrière l'intéressé a occupé pendant cinq ans au moins des fonctions supérieures à
      celles de sa dernière activité, et sauf dans le cas où cette situation a été la
      conséquence d'une mesure disciplinaire, la pension est calculée sur la base du salaire
      de la catégorie correspondant auxdites fonctions ; 3° Lorsque le salaire ainsi défini
      excède huit fois le montant du traitement brut correspondant à l'indice 100 dans la
      fonction publique, la portion dépassant cette limite n'est comptée que pour moitié »
      (R. 11) ; « Dans le décompte final des services entrant en compte pour la pension, la
      fraction de semestre égale ou supérieure à trois mois est comptée pour six mois ; la
      fraction de semestre inférieure à trois mois est négligée » (R. 12)
    conditions: >-
      le quotient de la catégorie moyenne s'arrondit à l'entier supérieur à cinq dixièmes, et
      « toute période inférieure à trente jours est considérée comme ayant été accomplie dans
      la catégorie la plus avantageuse » du mois (R. 11, 1°) ; le salaire forfaitaire est
      fixé « en tenant compte des fonctions remplies par les intéressés et du salaire moyen
      correspondant à ces fonctions », les marins « classés par catégorie », et révisé quand
      les salaires montent de plus de 5 % (L. 42) ; « Le montant des pensions d'ancienneté,
      proportionnelles ou spéciales est fixé par voie réglementaire sur la base du salaire
      forfaitaire défini à l'article L. 42 » (L. 14)
  exemples: aucun trouvé
- id: contrats_simultanes
  statut: lue
  textes:
  - {id: LEGIARTI000006792028, article: "code des pensions de retraite des marins, R. 31, rédaction du décret n° 99-265", en_vigueur: 1999-04-09, publie_le: 1999-04-09}
  - {id: JORFARTI000002485617, article: "décret n° 99-265 du 1er avril 1999 modifiant le code des pensions de retraite des marins, qui y insère un titre V « dispositions relatives aux salariés à temps partiel »", en_vigueur: 1999-04-09, publie_le: 1999-04-09}
  - {id: LEGIARTI000006791987, article: "même code, R. 11", en_vigueur: 1968-03-31}
  - {id: LEGIARTI000006791988, article: "même code, R. 12", en_vigueur: 1968-03-31}
  - {id: LEGIARTI000006791907, article: "même code, L. 14, jusqu'au 8 septembre 2005", en_vigueur: 1968-03-31}
  - {id: LEGIARTI000006791908, article: "même article, qui y ajoute le versement forfaitaire unique, jusqu'au 30 novembre 2010", en_vigueur: 2005-09-09}
  - {id: LEGIARTI000006791949, article: "même code, L. 42, jusqu'au 30 novembre 2010", en_vigueur: 1968-03-31}
  - {id: LEGIARTI000023079221, article: "code des transports, L. 5552-19, rédaction de l'ordonnance n° 2010-1307 du 28 octobre 2010, qui reprend L. 14 : le salaire forfaitaire « correspondant, sous réserve d'un abattement au-delà d'un plafond, à la catégorie dans laquelle se trouvait le marin pendant une période déterminée »", en_vigueur: 2010-12-01}
  nee_de: LEGIARTI000006792028
  bornes:
    liquidation.date_effet: [1999-04-09, null]
  contenu:
    parametres:
      assiette: forfaitaire
      assiette_grille: marins
      mois_de_reference: 36
      annees_de_fonctions_superieures: 5
      plafond_en_traitements_de_l_indice_100: 8
      part_au_dela_du_plafond: 0.5
      mois_du_decompte_des_services: 6
      contrats_simultanes: moyenne_des_indices_ponderee_par_la_duree_du_travail
    droit: >-
      R. 11 et R. 12, inchangés depuis 1968 ; « Pour la détermination de la catégorie
      moyenne visée au 1° de l'article R. 11 ou de la catégorie visée au 2° du même article,
      lorsque le marin a été classé, pendant une période d'exécution simultanée de plusieurs
      contrats de travail à temps partiel, dans des catégories différentes au titre de
      chacun de ces contrats, il est procédé, avant d'effectuer les calculs prévus à
      l'article R. 11 (1° et 2°), à la détermination de la catégorie moyenne de cette
      période » : l'indice de chaque catégorie pondéré par la durée du travail du contrat,
      rapportée à la durée légale ou conventionnelle (R. 31)
    conditions: >-
      depuis le 9 septembre 2005, la pension inférieure au minimum de L. 351-9 du code de la
      sécurité sociale est remplacée par le versement forfaitaire unique (L. 14), qui ne
      touche pas le salaire de référence ; depuis le 1er décembre 2010, le code des
      transports reprend L. 14 et L. 42 : la pension est égale, par annuité, à un
      pourcentage du salaire forfaitaire de L. 5553-5, « correspondant, sous réserve d'un
      abattement au-delà d'un plafond, à la catégorie dans laquelle se trouvait le marin
      pendant une période déterminée », pourcentage, abattement, plafond et période fixés
      par décret en Conseil d'Etat (L. 5552-19) — ceux de R. 11 et R. 13 ; depuis le
      1er janvier 2018, les salaires forfaitaires sont révisés au 1er avril de chaque année
      par le coefficient de L. 161-25 du code de la sécurité sociale (L. 5553-5). Ni R. 11,
      ni R. 12, ni R. 31 n'ont de rédaction depuis (index LEGI à jour de l'incrément du
      2 novembre 2026)
  exemples: [enim_bonification_deux_enfants]
approximations:
- version: [loi_du_12_avril_1941, code_de_1968, contrats_simultanes]
  textes: R. 11, 1° et 2°
  ecart: >-
    le modèle liquide le forfait de la catégorie de la DERNIÈRE année, rangée par le revenu
    annualisé (la catégorie dont le forfait en est le plus proche), proratisé sur ses mois,
    et non la catégorie des trois dernières années ou leur catégorie moyenne de trente-six
    mois (1°), ni celle de fonctions supérieures tenues cinq ans au moins (2°) : une
    carrière saisie porte un revenu, pas une fonction à bord
  effet: >-
    nul pour le marin resté dans la même catégorie ses trois dernières années, sans
    fonctions supérieures tenues cinq ans ; le salaire d'une catégorie entière pour celui
    qui finit sa carrière plus bas qu'il ne l'a tenue ; non mesuré
- version: [loi_du_12_avril_1941, code_de_1968, contrats_simultanes]
  textes: R. 11, 3° ; code des transports, L. 5552-19, depuis le 1er décembre 2010
  ecart: >-
    l'abattement n'est pas appliqué : la portion du salaire forfaitaire qui excède huit
    fois le traitement brut de l'indice 100 ne compte que pour moitié, et le modèle la
    liquide entière. Lu au traitement annuel de l'indice 100 majoré (cent fois la valeur
    du point, `legislation/point_indice_fonction_publique.csv`), le plafond vaut
    47 258,72 € en 2026
  effet: >-
    en 2026, les catégories 15 à 20, de 49 285,81 € à 76 867,05 €, dépassent le plafond :
    le salaire de référence est surestimé de 2,1 % à 19,3 % ; depuis 2008, les catégories
    17 à 20, puis 16 à 20 dès 2013, et 15 à 20 dès 2024, la vingtième de 13,7 % en 2008 à
    19,3 % en 2026 ; à confirmer auprès de l'ENIM, qui ne l'écrit pas sur ses pages
- version: [loi_du_12_avril_1941, code_de_1968, contrats_simultanes]
  textes: R. 12
  ecart: >-
    le modèle compte les services au trimestre ; le décompte final les arrondit au
    semestre, la fraction de trois mois ou plus comptant pour six mois, l'autre négligée
  effet: un trimestre de moins que le droit au plus, quand la fraction de semestre fait trois à cinq mois ; non mesuré
- version: [contrats_simultanes]
  textes: R. 31
  ecart: >-
    la catégorie moyenne des contrats à temps partiel simultanés n'est pas portée : le
    modèle ne connaît pas de catégorie
  effet: non mesuré
- version: [loi_du_12_avril_1941, code_de_1968, contrats_simultanes]
  textes: les arrêtés annuels de majoration des salaires forfaitaires
  ecart: >-
    avant 2008, les montants des arrêtés ne sont pas lus (décrets de 1956 à 1961, arrêtés
    de 1991 à 2006 : visas et titres seuls dans l'index) : la grille de 2008 est ramenée
    par le salaire moyen, de fiabilité estimée
  effet: non mesuré
effet: >-
  Le modèle prend la catégorie de la DERNIÈRE année, rangée par le revenu, et compte
  les services au trimestre ; la caisse prend la catégorie moyenne de trente-six
  mois et arrondit au semestre (R. 12 : quatorze ans huit mois et vingt-sept jours
  font quatorze ans et demi). La grille elle-même est exacte : les vingt montants de
  2026 publiés par l'ENIM sont ceux du dépôt, au centime, comme les trois montants de
  2024 que cite son exemple. Lue au droit le 2 novembre 2026 : l'abattement de R. 11,
  3°, au-delà de huit fois le traitement de l'indice 100, n'est pas appliqué, et
  surestime jusqu'à 19,3 % le salaire de référence des plus hautes catégories.
sources:
