  a_relire:
  - >-
    Un parcours ne porte pas de catégorie : la moyenne des trente-six mois et la
    règle des cinq ans demanderaient d'en saisir une.
  - >-
    L'abattement de R. 11, 3° : « Lorsque le salaire ainsi défini excède huit fois le
    montant du traitement brut correspondant à l'indice 100 dans la fonction publique, la
    portion dépassant cette limite n'est comptée que pour moitié », que L. 5552-19 reprend
    depuis 2010 (« sous réserve d'un abattement au-delà d'un plafond »). Le modèle ne
    l'applique pas. Demander à l'ENIM comment elle le lit — l'indice 100 majoré, 5 907,34 €
    par an depuis le 1er juillet 2023, ou un autre —, et l'écrire dans une étape du modèle,
    les deux moteurs ensemble : en 2026, les catégories 15 à 20.
