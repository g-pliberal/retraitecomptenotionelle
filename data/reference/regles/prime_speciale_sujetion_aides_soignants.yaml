  tests: [tests/test_primes_soumises_a_retenue.py, tests/test_trajectoire.py,
          tests/test_cycle_de_vie_references.py]
referents:
  trajectoire:
    equivalent: >-
      primesDansCotiseBase « IS » (R/fonctionsCalculsDivers.R, calculeCotisBase) : le
      script des cas types range la prime, au taux du COR (TxIS, de 2 à 10 % de 2004 à
      2008), avec le traitement que la pension liquide, et calcule la retenue
      supplémentaire sur les autres primes (partIS × primes)
    confrontation: >-
      cas type 9 du COR : la pension du dépôt passe la sienne de 4 % ; son revenu net
      est plus bas de ce que sa retenue prend aux autres primes (ECARTS_REMPLACEMENT_NET,
      tests/test_cycle_de_vie_references.py)
historique:
- >-
  2026-10-10 — née de l'étape 17 de l'action 138, douzième partie, avec le statut
  aide_soignant : le dépôt rangeait l'aide-soignant au statut hospitalier actif, sans la
  prime ni son supplément.
effet: >-
  L'aide-soignant parti depuis 2008 : un supplément de 10 % de son traitement, et une
  retenue de 1,5 % de sa prime de plus.
