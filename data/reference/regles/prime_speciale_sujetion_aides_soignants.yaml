      sauf radiation pour invalidité ; à taux complet pour l'agent du corps au 31
      décembre 2003 qui réunit quinze ans de services effectifs à son départ
    parametres:
      existe: true
      statuts: [aide_soignant]
      regime: cnracl
      nature: supplement
      plafond: 0.10
      prorata: services_du_statut_depuis_2004
      condition: durees_et_age_de_l_emploi
      classement: active
      services_comptes: [aide_soignant, fonctionnaire_hospitalier_actif]
      annees_dans_l_emploi: 0
      annees_de_services: 17
      age_anticipe: false
