    url: https://www.cnracl.retraites.fr/employeur/droits-et-demande-de-pension/calcul-de-la-pension/supplements-et-accessoires-de-pension
    date: 2025-12-10
code:
  python: >-
    donnees/primes.py : PrimesSoumises ; droit/primes.py : prime_de_la_pension ;
    droit/liquider.py : liquider_chaque_regime ; droit/completer.py : completer ;
    moteur/compte.py ; remuneration.py : bloc_droit_en_vigueur
  javascript: >-
    moteur/js/primes.js ; moteur/js/droit/primes.js ; moteur/js/droit/liquider.js ;
    moteur/js/droit/completer.js ; moteur/js/compte.js ; moteur/js/remuneration.js
  parametres: >-
    legislation/primes_soumises_a_retenue.yaml, et les versions de cette fiche
