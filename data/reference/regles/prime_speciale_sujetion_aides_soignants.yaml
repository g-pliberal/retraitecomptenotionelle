  exemples: aucun trouvé
approximations:
- version: [loi_de_financement_pour_2004, loi_du_9_novembre_2010]
  ecart: >-
    Le supplément est la prime, au taux de la date d'effet, sur le traitement liquidé :
    la formule de la CNRACL ne la multiplie par aucun pourcentage de la pension, que le
    texte ne nomme pas non plus (« liquidé sur la base de la moyenne des montants
    mensuels ») ; TRAJECTOiRE et le COR rangent la prime dans le traitement, sous le
    pourcentage et la décote. Le supplément s'ajoute après le minimum garanti et les
    majorations, comme celui du complément de traitement indiciaire.
  effet: >-
    l'aide-soignante du cas type 9 du COR : 4 % de pension de plus que TRAJECTOiRE
    (tests/test_trajectoire.py)
- version: [loi_de_financement_pour_2004, loi_du_9_novembre_2010]
  ecart: >-
    La durée de dix-sept ans vaut pour toute pension prise depuis le 1er juillet 2011,
    sans la montée en charge que la CNRACL écrit (quinze ans et quatre mois au second
    semestre 2011, dix-sept ans en 2015) ; les services hospitaliers sont ceux des deux
    statuts hospitaliers actifs, le statut territorial ou hospitalier sédentaire ne
    disant pas le versant ; seule la radiation pour invalidité imputable au service
    dispense de la durée. Le supplément, que la loi verse « à partir de l'âge », court
    dès la date d'effet : la pension prise plus tôt, une carrière longue, le compte trop
    tôt, et la valorisation des droits acquis, qui liquide à l'âge de la bascule, le
    compte, le droit étant acquis par les années de services.
  effet: non mesuré ; les départs anticipés avant l'âge de la catégorie active
sources:
  lu_le: 2026-10-10
  prochaine_relecture: 2027-04-30
  a_relire:
  - >-
    Trouver un exemple chiffré de la CNRACL (titre de pension) qui dise si le supplément
    est la prime seule, comme sa documentation l'écrit, ou la prime sous le pourcentage
    de la pension.
  - >-
    L'âge du supplément depuis la loi du 14 avril 2023 : le texte dit cinquante-sept
    ans, la page de la CNRACL « l'âge légal de la retraite d'un agent de catégorie
    active ».
  lectures:
  - type: legifrance
    reference: >-
      loi n° 2003-1199 du 18 décembre 2003, article 37, ses deux rédactions
      (LEGIARTI000006758879, LEGIARTI000023096769) ; décret n° 2004-240, article 2
      (LEGIARTI000006229484) ; décret n° 2003-1306, article 18-1, ses trois rédactions
      (LEGIARTI000006400881 à LEGIARTI000044810809) ; décret n° 91-613, article 5
      (LEGIARTI000006775966) ; décret n° 2007-173, articles 3 et 5
    date: 2026-01-22
  - type: autre
    reference: >-
      CNRACL, documentation juridique, « Supplément de pension des aides-soignants, des
      auxiliaires de puériculture, des accompagnants éducatifs et sociaux et des aides
      médico-psychologiques de la fonction publique hospitalière » (publié le 2 février
      2022) : la formule, la progressivité, le coefficient de proratisation, la table
      des durées de 2011 à 2015
    url: https://www.juris-cnracl.retraites.fr/pension-normale/les-accessoires-de-pension/supplement-de-pension-des-aides-soignants-des-auxiliaires-de-puericulture-des-accompagnants
    date: 2022-02-02
  - type: autre
    reference: >-
      CNRACL, documentation juridique, « Les Aides-soignants » (cotisations
      supplémentaires, publié le 9 janvier 2013) : l'assiette, 20 à 100 % de la prime
      de 2004 à 2008, retenue de 1,5 % et contribution de 3,5 %
    url: https://www.juris-cnracl.retraites.fr/cotisations/taux-de-cotisations/cotisations-supplementaires/les-aides-soignants
    date: 2013-01-09
  - type: autre
    reference: >-
      CNRACL, « Suppléments et accessoires de pension » (employeur, mis à jour le 10
