  statut: lue
  textes:
  - {id: LEGIARTI000006758879, article: 37, en_vigueur: 2003-12-19}
  nee_de: LEGIARTI000006758879
  bornes:
    liquidation.date_effet: [null, 2004-01-01]
  contenu:
    droit: aucun ; la prime n'est ni soumise à retenue ni comptée dans la pension
    parametres:
      existe: false
  exemples: aucun trouvé
- id: loi_de_financement_pour_2004
  statut: lue
  textes:
  - {id: LEGIARTI000006758879, article: 37, en_vigueur: 2003-12-19}
  - {id: LEGIARTI000006229484, article: 2, en_vigueur: 2004-01-01}
  - {id: LEGIARTI000006400881, article: 18-1, en_vigueur: 2004-01-01}
  nee_de: LEGIARTI000006758879
  bornes:
    liquidation.date_effet: [2004-01-01, 2011-07-01]
  contenu:
    droit: >-
      « la prise en compte de la prime spéciale de sujétion, dans la limite de 10 % de
      leur traitement indiciaire, pour le calcul de la pension de retraite ainsi que
      pour les retenues pour pension » ; le supplément « est liquidé sur la base de la
      moyenne des montants mensuels de la prime spéciale de sujétion perçue pendant les
      six derniers mois d'activité » (décret n° 2003-1306, article 18-1), « pour 20 %
      de son montant en 2004, 40 % en 2005, 60 % en 2006, 80 % en 2007 et 100 % à partir
      de l'année 2008 » (décret n° 2004-240, article 2), « calculé à due proportion des
      années de services accomplis dans le corps des aides-soignants »
    conditions: >-
      « à partir de l'âge de cinquante-cinq ans et à condition d'avoir accompli quinze
      ans de services effectifs dans la fonction publique hospitalière », sauf
      radiation pour invalidité ; à taux complet pour l'agent du corps au 31 décembre
      2003 qui réunit quinze ans de services effectifs à son départ
    parametres:
      existe: true
      statuts: [aide_soignant]
      regime: cnracl
      nature: supplement
      plafond: 0.10
      prorata: services_du_statut_depuis_2004
      condition: durees_et_age_de_l_emploi
      classement: active
      services_comptes: [aide_soignant, fonctionnaire_hospitalier_actif]
      annees_dans_l_emploi: 0
      annees_de_services: 15
      age_anticipe: false
      fiabilite: moyenne
  exemples: aucun trouvé
- id: loi_du_9_novembre_2010
  statut: lue
  textes:
