  - {id: LEGIARTI000023414181, article: 18-1, en_vigueur: 2011-01-01}
  - {id: LEGIARTI000044810809, article: 18-1, en_vigueur: 2022-01-01}
  nee_de: LEGIARTI000023096769
  bornes:
    liquidation.date_effet: [2011-07-01, null]
  contenu:
    droit: >-
      le même supplément, aux auxiliaires de puériculture du corps depuis le 1er
