schema_version: 1
id: prime_speciale_sujetion_aides_soignants
intitule: >-
  La prime spéciale de sujétion des aides-soignants de la fonction publique
  hospitalière, depuis 2004 : dans la limite de 10 % du traitement, soumise à la
  retenue ordinaire et à une retenue supplémentaire de 1,5 %, et un supplément de
  pension égal à la prime des six derniers mois, intégrée de 2004 à 2008, proratisé
  sur les services d'aide-soignant de qui est entré dans le corps depuis 2004.
domaine: salaire_de_reference
regimes:
- cnracl
etape: liquider_chaque_regime
face: droit
etat: transcrite
lit:
- le statut aide_soignant de la dernière ligne de services, et sa part de primes,
  l'assiette du RAFP
- le taux de la prime et la part comptée, année par année
  (legislation/primes_soumises_a_retenue.yaml)
- les années servies dans le statut, et dans la fonction publique hospitalière
- la radiation pour invalidité et son imputabilité
- liquidation.date_effet
ecrit:
- le supplément de pension, que l'étape qui complète ajoute après le minimum garanti et
  les majorations
- la retenue et la contribution supplémentaires, à la fiche de paie et au compte
  (droit en vigueur)
dates_qui_decident:
- liquidation.date_effet
# Les paramètres que le moteur lit (droit/primes.py, `prime_de_la_pension`, et son
# jumeau) ; la condition est celle des emplois classés (droit/compter.py,
# `condition_d_un_emploi`) : les années de services de la fonction publique
# hospitalière (`annees_de_services`, sur `services_comptes`), sans l'âge, qui diffère
# le versement sans le retirer (`age_anticipe` à faux).
versions:
