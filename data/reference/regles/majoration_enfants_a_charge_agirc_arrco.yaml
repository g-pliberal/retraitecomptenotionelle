schema_version: 1
id: majoration_enfants_a_charge_agirc_arrco
intitule: >-
  Le participant qui a un enfant à charge à la date d'effet de sa retraite complémentaire
  voit son allocation majorée de 5 % par enfant à charge, tant qu'il le reste ; elle ne se
  cumule pas avec la majoration pour enfants nés ou élevés, et la plus élevée des deux est
  servie : à l'Arrco depuis le 1er janvier 1999, à l'Agirc depuis le 1er janvier 2012, à
  l'Agirc-Arrco depuis 2019.
domaine: enfants
regimes: [arrco, arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles, arrco_cultes, agirc,
  agirc_entreprises_nouvelles, agirc_arrco]
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- les naissances des enfants que la personne déclare (celles que la chronologie présume, aux
  trente ans de l'assuré, ne font jamais un enfant de moins de dix-huit ans au départ)
- l'allocation de chaque régime de la complémentaire, et le coefficient d'anticipation qui
  l'a réduite (droit/liquider.py, Pensions.anticipations)
- la majoration pour enfants nés ou élevés, plafond compris (fiche majoration_enfants_agirc_arrco)
- liquidation.date_effet
ecrit:
- la majoration pour enfants de la complémentaire, portée à celle des enfants à charge quand
  elle passe celle des enfants nés ou élevés, et ce qu'elle redevient, date par date, quand
  ils cessent d'être à charge — ce que la revalorisation sert à chaque échéance, et que la
  réversion ne reprend pas, seules les majorations pour enfants nés ou élevés étant
  réversibles (accord du 17 novembre 2017, article 109)
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/completer.py, `majoration_pour_enfants_a_charge`, et son jumeau)
# lit : `existe` ; `taux_par_enfant` ; `age`, celui où l'enfant cesse d'être à
# charge ; `assiette`, `allocation` (l'allocation servie) ou `droits_bruts` (les
# droits de l'ensemble de la carrière, sans le coefficient d'anticipation) ;
# `allocations`, les régimes dont l'allocation se compare, chacune, à sa
# majoration pour enfants nés ou élevés. Une assiette que le moteur ne connaît
# pas l'arrête.
versions:
- id: avant_le_regime_unique_de_l_arrco
  statut: supposee
  hypothese: >-
    l'accord du 25 avril 1996 crée la majoration pour enfants à charge de l'Arrco « à
    compter du 1er janvier 1999 », avec le régime unique (article 12) ; les règlements des
    caisses de l'Arrco d'avant lui, que l'accord national interprofessionnel ne cite que
    pour les enfants nés ou élevés (article 94, 1), ne sont pas lus, et l'Agirc ne la sert
    qu'à compter de 2012 (accord du 18 mars 2011, article 8)
  fiabilite: moyenne
  bornes:
    liquidation.date_effet: [null, 1999-01-01]
  contenu:
    droit: aucune majoration pour enfants à charge lue
    parametres:
      existe: false
  exemples: aucun trouvé
- id: accord_du_25_avril_1996
  statut: lue
  textes:
  - {reference: "accord du 25 avril 1996 relatif aux régimes complémentaires (Arrco), articles 11 à 13", en_vigueur: 1999-01-01}
  bornes:
    liquidation.date_effet: [1999-01-01, 2012-01-01]
  contenu:
    droit: >-
      « A compter du 1er janvier 1999, les participants bénéficient pour chaque enfant à
      charge (au sens défini par le Conseil d'administration de l'ARRCO) à la date de
      liquidation de l'allocation et aussi longtemps que l'enfant reste à charge, d'une
      majoration de leur allocation égale à 5 % » (article 12) ; « Les participants ne
      pourront cumuler simultanément le bénéfice des majorations prévues aux articles 11 et
      12 ci-dessus » (article 13), l'article 11 servant 5 % au participant qui a élevé trois
      enfants, sur la partie de carrière postérieure au 31 décembre 1998
    beneficiaire: le participant de l'Arrco qui a un enfant à charge à la date d'effet
    parametres:
      existe: true
      taux_par_enfant: 0.05
      age: 18
      assiette: allocation
      allocations:
      - regimes: [arrco, arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles, arrco_cultes]
  exemples: aucun trouvé
- id: accord_du_18_mars_2011
  statut: lue
  textes:
  - {reference: "accord du 18 mars 2011 relatif aux retraites complémentaires Agirc et Arrco, articles 7 et 8", en_vigueur: 2012-01-01}
  - {reference: "accord du 8 décembre 1961, annexe A, article 17, 1) et 3)", en_vigueur: 2012-01-01}
  - {reference: "convention collective nationale du 14 mars 1947, annexe I, article 6 bis, 1) et 3)", en_vigueur: 2012-01-01}
  bornes:
    liquidation.date_effet: [2012-01-01, 2019-01-01]
  contenu:
    droit: >-
      « Le participant ayant un (ou des) enfant(s) à charge (au sens défini par la
      Commission paritaire) à la date d'effet de la retraite peut […] bénéficier, tant que
      l'enfant reste à charge, d'une majoration de son allocation, égale à 5 % des droits
      bruts de l'ensemble de la carrière par enfant à charge » ; « Le participant
      remplissant les conditions visées aux points 1 et 2 ne peut pas bénéficier
      simultanément des 2 types de majorations ; c'est la majoration la plus élevée qui lui
      est accordée » (annexe A, article 17, et annexe I, article 6 bis, dans les mêmes
      termes) ; l'Agirc la sert « pour toute liquidation d'allocations prenant effet à
      compter du 1er janvier 2012 » (accord du 18 mars 2011, article 8)
    beneficiaire: le participant de l'Arrco ou de l'Agirc qui a un enfant à charge à la date d'effet
    parametres:
      existe: true
      taux_par_enfant: 0.05
      age: 18
      assiette: droits_bruts
      allocations:
      - regimes: [arrco, arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles, arrco_cultes]
      - regimes: [agirc, agirc_entreprises_nouvelles]
  exemples: aucun trouvé
- id: accord_du_17_novembre_2017
  statut: lue
  textes:
  - {reference: "accord national interprofessionnel du 17 novembre 2017, articles 93, 95 et 96, étendu par l'arrêté du 24 avril 2018 (JORFTEXT000036847920)", en_vigueur: 2019-01-01}
  - {reference: "circulaire Agirc-Arrco n° 2020-02-DRJ du 20 janvier 2020, fiche 4, II.1, II.2.3 et II.3", en_vigueur: 2019-01-01}
  bornes:
    liquidation.date_effet: [2019-01-01, null]
  contenu:
    droit: >-
      « Le participant ayant un (ou des) enfant(s) à charge à la date d'effet de la retraite
      peut […] bénéficier, tant que le ou les enfants restent à charge, d'une majoration de
      son allocation, égale à 5 % des droits bruts de l'ensemble de la carrière par enfant à
      charge » (article 95), l'enfant à charge étant celui « âgé de moins de 18 ans », « de
      18 ans à 25 ans s'il est étudiant, apprenti ou demandeur d'emploi non indemnisé », ou
      invalide avant ses vingt et un ans (article 93, II) ; « En cas de concurrence, la
      majoration la plus élevée est accordée. Le participant qui cesse de bénéficier de la
      majoration pour enfant à charge bénéficie, s'il remplit les conditions, de la
      majoration pour enfants nés ou élevés » (article 96). Elle se calcule « sans tenir
      compte des coefficients d'anticipation éventuellement appliqués », n'est « pas
      plafonnée », et « Lorsque les deux majorations sont d'un même montant, la majoration
      pour enfants nés ou élevés est servie du fait de son caractère pérenne » (circulaire
      n° 2020-02-DRJ, fiche 4)
    beneficiaire: le participant de l'Agirc-Arrco qui a un enfant à charge à la date d'effet
    parametres:
      existe: true
      taux_par_enfant: 0.05
      age: 18
      assiette: droits_bruts
      allocations:
      - regimes: [agirc_arrco, arrco, arrco_tranche_2, arrco_tranche_2_entreprises_nouvelles,
          arrco_cultes, agirc, agirc_entreprises_nouvelles]
  exemples: aucun trouvé
approximations:
- version: [accord_du_25_avril_1996, accord_du_18_mars_2011, accord_du_17_novembre_2017]
  ecart: >-
    Le modèle ne tient pour à charge que l'enfant de moins de dix-huit ans : la saisie ne
    dit pas si l'enfant de dix-huit à vingt-cinq ans est étudiant, apprenti ou demandeur
    d'emploi non indemnisé, ni s'il est devenu invalide avant vingt et un ans, ni s'il
    cesse d'être à charge et le redevient.
  effet: >-
    sous-estime la majoration du participant dont un enfant de dix-huit à vingt-cinq ans
    étudie au départ, et sa durée
- version: [accord_du_18_mars_2011, accord_du_17_novembre_2017]
  ecart: >-
    La majoration pour enfants nés ou élevés à laquelle le modèle compare est celle de la
    fiche majoration_enfants_agirc_arrco, calculée sur l'allocation, coefficient
    d'anticipation compris, quand la circulaire n° 2020-02-DRJ calcule l'une et l'autre «
    sans tenir compte des coefficients d'anticipation ».
  effet: >-
    sous un coefficient d'anticipation, la majoration pour enfants nés ou élevés est
    sous-estimée, et l'enfant à charge l'emporte plus souvent qu'il ne le devrait ; la
    majoration servie reste entre les deux
- version: [accord_du_25_avril_1996]
  ecart: >-
    L'accord de 1996 ne met en concurrence l'enfant à charge qu'avec la majoration de son
    article 11, sur les points d'après 1998 : celle que les règlements des anciennes caisses
    servaient aux points d'avant 1999 s'y ajoutait peut-être. Le modèle compare à toute la
    majoration pour enfants nés ou élevés.
  effet: non mesuré ; les parents de trois enfants partis de 1999 à 2011 avec un enfant à charge
sources:
  lu_le: 2026-10-08
  prochaine_relecture: 2027-06-30
  a_relire:
  - >-
    Lire la définition de l'enfant à charge que le conseil d'administration de l'Arrco et
    la commission paritaire de l'Agirc donnaient avant 2019, et les règlements des caisses
    de l'Arrco d'avant le régime unique, que l'index ne porte pas.
  lectures:
  - type: autre
    reference: >-
      accord national interprofessionnel du 17 novembre 2017, applicable au 1er janvier
      2019, articles 93 (l'enfant à charge), 94, 95 (5 % des droits bruts par enfant à
      charge) et 96 (la plus élevée des deux majorations)
    url: https://www.agirc-arrco.fr/storage/2024/09/201809dc_ANI_du_17_novembre_2017.pdf
    date: 2026-10-08
  - type: autre
    reference: >-
      circulaire Agirc-Arrco n° 2020-02-DRJ, fiche 4 : la définition de l'enfant à charge,
      la majoration « sans tenir compte des coefficients d'anticipation », « pas
      plafonnée », supprimée « au fur et à mesure que le ou les enfant(s) cessent d'être à
      charge », et, à montant égal, la majoration pour enfants nés ou élevés servie « du
      fait de son caractère pérenne »
    url: >-
      https://www.agirc-arrco.fr/wp-content/uploads/2021/10/2020-02-DRJ_Regime_Agirc-Arrco_Reglementation_applicable_aux_individus.pdf
    date: 2026-10-08
  - type: autre
    reference: >-
      accord du 8 décembre 1961, annexe A, article 17 (allocations prenant effet à compter
      du 1er janvier 2012), et convention collective nationale du 14 mars 1947, annexe I,
      article 6 bis, dans les mêmes termes
    url: https://www.agirc-arrco.fr/storage/2021/11/Accord_8dec1961-1.pdf
    date: 2026-10-08
  - type: autre
    reference: >-
      recueil des accords paritaires de l'Agirc et de l'Arrco : accord du 25 avril 1996,
      articles 11 à 13 (l'Arrco, à compter du 1er janvier 1999) ; accord du 18 mars 2011,
      articles 7 et 8 (l'Agirc, à compter du 1er janvier 2012)
    url: https://www.agirc-arrco.fr/storage/2021/11/liste_accords_paritaires_Agirc_Arrco.pdf
    date: 2026-10-08
code:
  python: >-
    droit/completer.py : majoration_pour_enfants_a_charge, enfants_a_charge, completer ;
    droit/commun.py : parts_de_la_majoration, fusionner_les_charges ; revalorisation.py :
    faire_vivre ; droit/liquider.py : Pensions.anticipations
  javascript: >-
    moteur/js/droit/completer.js : majorationPourEnfantsACharge, enfantsACharge ;
    moteur/js/droit/commun.js : partsDeLaMajoration, fusionnerLesCharges ;
    moteur/js/revalorisation.js : faireVivre
  parametres: les versions de cette fiche (contenu.parametres), que le paquet du site porte
  tests: [tests/test_majoration_enfants_a_charge.py]
referents:
  openfisca_france_pension:
    equivalent: >-
      regimes/regimes_complementaires_prives.py:87-102 (la plus avantageuse des deux),
      :222-233 (Arrco) et :360-371 (Agirc, depuis 2012), au commit 1c45423 : le nombre
      d'enfants à charge au départ en entrée, sans fin de la charge
    confrontation: aucune exécutée
  til_pension:
    equivalent: >-
      til_pension/regime.py:246 et :272, au commit c4e0d50 : le plus fort des points des
      enfants nés ou élevés et de ceux des enfants à charge, au départ
    confrontation: aucune exécutée
historique:
- >-
  2026-10-08 — écrite à l'étape 17 de l'action 138, sur les points d'OpenFisca-France-Pension
  et de Til-Pension au registre (chantier 138.17) et la ligne a_relire de la fiche
  majoration_enfants_agirc_arrco.
effet: >-
  Le salarié du privé qui part avec un enfant de moins de dix-huit ans voit sa complémentaire
  majorée de 5 % par enfant, au lieu de la majoration pour enfants nés ou élevés quand elle
  est plus forte, jusqu'aux dix-huit ans de l'enfant ; à l'Arrco depuis 1999, à l'Agirc depuis
  2012.
