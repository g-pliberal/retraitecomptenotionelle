historique:
- >-
  2026-10-10 — née avec l'action 151, étape 2, avec la fiche `limite_age_fonction_publique`.
effet: >-
  Aucun aujourd'hui, le modèle n'appliquant aucune limite d'âge. La limite appliquée, ce
  maintien est ce qui permet à un sédentaire parti depuis le 14 juin 2023 de servir de
  soixante-sept à soixante-dix ans, et soixante-dix ans est l'âge au-delà duquel le droit
  ne garde plus aucun fonctionnaire civil, hors les corps de la fiche
  `maintiens_en_fonctions_de_certains_corps`.
