schema_version: 1
id: maintien_en_fonctions_jusqu_a_70_ans
intitule: >-
  Depuis le 14 juin 2023, le fonctionnaire civil d'un emploi qui ne relève pas de la
  catégorie active, et dont la limite d'âge est soixante-sept ans ou davantage, peut, sur
  autorisation, être maintenu en fonctions sans radiation des cadres jusqu'à soixante-dix
  ans ; le refus est motivé. Ce maintien, les prolongations et les reculs ne le mènent
  pas, ensemble, au-delà de soixante-dix ans. L'agent contractuel a le même maintien.
domaine: age
regimes: [fonction_publique_etat, cnracl]
etape: preparer_la_chronologie
face: droit
etat: manquante
lit:
- l'emploi de l'assuré à sa limite d'âge, sédentaire ou de la catégorie active, et sa
  limite (fiche `limite_age_fonction_publique`)
- l'autorisation de l'employeur, que la saisie ne porte pas
ecrit:
- la date où le maintien finit, soixante-dix ans au plus, que la radiation des cadres suit
dates_qui_decident:
- age_atteint
versions:
