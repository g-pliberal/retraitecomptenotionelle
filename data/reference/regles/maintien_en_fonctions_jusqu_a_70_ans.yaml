  statut: lue
  textes:
  - {id: LEGIARTI000044425146, article: "L. 556-1 CGFP", en_vigueur: 2022-03-01}
  - {id: LEGIARTI000006362689, article: "L. 10 CPCMR", en_vigueur: 1964-12-01}
  nee_de: LEGIARTI000006362689
  bornes:
    age_atteint: [null, 2023-06-14]
  contenu:
    droit: >-
      aucun maintien de droit commun au-delà de la limite d'âge et de ses reculs et
      prolongations : « Le fonctionnaire ne peut être maintenu en fonctions au-delà de
      l'âge limite de l'activité dans l'emploi qu'il occupe, sous réserve des exceptions
      prévues par les dispositions en vigueur » (L. 556-1, rédaction de 2022) ; les seules
      exceptions sont celles de corps particuliers (fiche
      `maintiens_en_fonctions_de_certains_corps`)
  exemples: aucun trouvé
- id: reforme_2023
  statut: lue
  textes:
  - {id: LEGIARTI000047452904, article: "L. 556-1 CGFP", en_vigueur: 2023-06-14}
  - {id: LEGIARTI000044425124, article: "L. 556-11 CGFP", en_vigueur: 2023-06-14}
  - reference: >-
      loi n° 2023-270 du 14 avril 2023, article 10, VIII, 1° et 5°, et XXX, A
      (JORFARTI000047445097)
    publie_le: 2023-04-15
    en_vigueur: 2023-06-14
  nee_de: LEGIARTI000047452904
  bornes:
    age_atteint: [2023-06-14, null]
  contenu:
    droit: >-
      « Toutefois, le fonctionnaire occupant un emploi qui ne relève pas de la catégorie
      active et auquel s'applique la limite d'âge mentionnée au 1° du présent article ou
      une limite d'âge qui lui est égale ou supérieure peut, sur autorisation, être
      maintenu en fonctions sans radiation des cadres préalable, jusqu'à l'âge de
      soixante-dix ans. Le refus d'autorisation est motivé. Le bénéfice cumulé de ce
      maintien en fonctions, des prolongations d'activité et des reculs de limite d'âge
      prévus aux articles L. 556-2 à L. 556-5 ne peut conduire le fonctionnaire à être
      maintenu en fonctions au delà de soixante-dix ans » (L. 556-1) ; l'agent contractuel,
      de même, sous les reculs de L. 556-12 (L. 556-11)
    transition: >-
      « Les VIII, X, XIV et XV entrent en vigueur deux mois après la promulgation de la
      présente loi » ; ceux que le code de justice administrative ou la loi n° 86-1304
      maintenaient déjà en activité gardent leur régime (article 10, XXX, A)
    application: >-
      selon service-public, aptitude physique exigée, demande écrite six mois au moins
      avant le soixante-septième anniversaire, réponse de l'employeur trois mois au moins
      avant
  exemples: aucun trouvé
