reformes: []
effet: >-
  Un libéral de la Cipav au-delà de trois plafonds achetait trop peu de points depuis
  2024 : la fiche coupait la seconde tranche à trois. Lue au droit le 6 novembre 2026
  (action 130) : cinq versions sur l'année du revenu, les classes d'avant 2023,
  laissées à leur fiche, les exercices 2023, 2024 et 2025 de leurs décrets, et 2026,
  supposé, que nul décret lu ne chiffre ; les deux tranches et leurs taux rendus par
  les deux moteurs au centime ; aucune erreur ; le rendement au lieu du coût du point
  (28,57 € par an de trop dans le cas posé) et les taux de 2026 déclarés, au
  propriétaire.
