schema_version: 1
id: cipav_seconde_tranche
intitule: >-
  Complémentaire de la Cipav depuis 2023 : deux tranches du revenu d'activité de
  L. 131-6, la première jusqu'au plafond de l'année, la seconde d'un plafond à trois en
  2023, à trois et demi en 2024, à quatre depuis 2025 (article 2 du décret n° 79-262,
  rédaction du décret n° 2022-1746) ; 9 % et 22 % en 2023 et 2024, 11 % et 21 % en
  2025, aux décrets de chaque année ; des points au coût d'acquisition de l'année,
  arrondis à la décimale ; pour 2026, aucun décret lu ne fixe ni les taux ni le coût
  du point ; avant 2023, des classes, hors de cette fiche.
domaine: cotisations
regimes: [cipav_complementaire]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- >-
  l'année du revenu, qui choisit la rédaction de l'article 2 du décret n° 79-262, la
  borne haute de la seconde tranche et le décret qui fixe les taux de l'année, et le
  plafond de la Sécurité sociale de cette année, « en vigueur au 1er janvier de l'année
  au titre de laquelle la cotisation est due »
- >-
  le revenu d'activité de l'article L. 131-6, celui de l'année, que le modèle prend
  pour le revenu définitif (article L. 131-6-2 : la cotisation provisionnelle, puis
  régularisée)
ecrit:
- >-
  la cotisation de chaque tranche de l'année, que `acquerir` cumule, revalorisée par
  les prix jusqu'à la liquidation, et que `liquider_chaque_regime` sert au rendement
  de l'année de liquidation ; le compte notionnel la reçoit
  (`ConstructeurCompte._cotisation_ligne`), et la fiche de paie l'affiche
dates_qui_decident:
- revenu.annee
