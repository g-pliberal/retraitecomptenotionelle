approximations:
- version: [exercice_2023, exercice_2024, exercice_2025, depuis_2026]
  textes: >-
    décret n° 79-262, article 2, III (rédactions de 2023 et du 1er juillet 2026) ;
    décrets n° 2023-1351, 2024-1214 et 2025-1076 (valeur d'achat du point) ; statuts,
    article 3.3, III (arrêté du 20 mars 2023)
  ecart: >-
    Le texte achète des points : la cotisation de l'année divisée par le coût
    d'acquisition du point au 1er janvier (45,30 € en 2023, 47,40 € en 2024 et 2025),
    arrondie à la décimale, servis à la valeur de service de la liquidation, que le
    conseil d'administration fixe (article 5-2 depuis le 1er juillet 2026) et que le
    Journal officiel ne publie pas. Le modèle ne compte pas de points : il revalorise
    la cotisation par les prix jusqu'à la liquidation et la sert au rendement de
    l'année de liquidation, 6,10 % depuis 2023 (`rendements_points.csv`). Les deux
    s'accordent quand le coût du point suit les prix ; ils divergent quand il est
    gelé, comme de 2024 à 2025. Cas posé : 150 000 € de revenu en 2025, cotisation
    26 790,00 € ; liquidation en 2026. Le modèle : 26 790,00 × 1,0175 (ses prix de
    2025 à 2026) × 0,061 = 1 662,79 € par an. Le texte : 26 790,00 / 47,40 = 565,19,
    arrondi à 565,2 points, à la valeur de service que le rendement du modèle suppose,
    0,061 × 47,40 = 2,8914 € : 565,2 × 2,8914 = 1 634,22 €. Le modèle sert 28,57 € par
    an de trop pour cet exercice, 1,75 % : le coût du point de 2026 n'étant fixé par
    aucun texte lu, l'écart tient à cette supposition.
  effet: >-
    +28,57 € de pension annuelle pour l'exercice 2025 d'un revenu de 150 000 €, liquidé
    en 2026, si la valeur de service de 2026 est 2,8914 € et le coût du point 47,40 € ;
    calcul posé à la main, les prix du modèle lus par `coefficient_prix` (essai du 6
    novembre 2026).
- version: [depuis_2026]
  textes: >-
    décret n° 79-262, article 2, I : « fixé chaque année par décret » ; décret n°
    2025-1076, article 14, qui ne nomme pas la Cipav
  ecart: >-
    Nul décret lu ne fixe les taux ni le coût du point de 2026 ; le modèle reconduit
    11 % et 21 %. Ce n'est pas une erreur prouvée : aucun texte ne dit d'autres taux. Ce
    que la reconduction engage, si 2026 reprenait les taux de 2023 et 2024, 9 % et 22 %
    : à 40 000 € de revenu, 0,11 × 40 000 = 4 400,00 € contre 0,09 × 40 000 = 3 600,00
    €, 800,00 € de cotisation, 800,00 / 47,40 = 16,88 points, 48,80 € de pension par an
    à 2,8914 € ; à 150 000 €, 0,11 × 48 060 + 0,21 × 101 940 = 26 694,00 € contre 0,09
    × 48 060 + 0,22 × 101 940 = 26 752,20 €, 58,20 € de moins, 1,23 point, 3,55 € par
    an. Au propriétaire : le décret qui fixe les paramètres de la Cipav pour 2026.
  effet: >-
    au plus 48,80 € de pension annuelle par exercice 2026 dans les cas posés (40 000 €
    de revenu), si les taux de 2026 étaient ceux de 2023 et 2024 ; 0 € si la
    reconduction vaut. Plafond de 2026 : 4 005 × 12 = 48 060 € (arrêté du 22 décembre
    2025, JORFARTI000053143455).
- version: [exercice_2023, exercice_2024, exercice_2025, depuis_2026]
  textes: >-
    statuts, article 3.3, III (arrêté du 20 mars 2023) ; décret n° 79-262, article 2,
    III, rédaction du 1er juillet 2026
  ecart: >-
    Les points sont arrondis « à la décimale la plus proche » ; le modèle, qui n'en
    compte pas, ne l'arrondit pas : au plus 0,05 point par exercice, 0,05 × 2,8914 =
    0,14 € de pension annuelle.
  effet: au plus 0,14 € de pension annuelle par exercice, dans un sens ou dans l'autre
- version: [exercice_2023, exercice_2024, exercice_2025, depuis_2026]
  textes: >-
    décret n° 79-262, article 2, I (L. 131-6-2) ; décret n° 2023-1351, article 4
    (JORFARTI000048729104) : « Le revenu forfaitaire mentionné au dernier alinéa du I de
    l'article 2 du décret n° 79-262 du 21 mars 1979 susvisé est égal à 19 % du plafond
    annuel de la sécurité sociale en vigueur au 1er janvier de l'année au titre de
    laquelle la cotisation est due. »
  ecart: >-
    La cotisation est d'abord provisionnelle, sur le revenu d'une année passée ou, au
    début de l'activité, sur un revenu forfaitaire de 19 % du plafond, puis régularisée
    sur le revenu de l'année (article L. 131-6-2) ; les deux premières années suivent la
    même règle (statuts, article 3.4 de 2023 ; décret, rédaction de 2026). Le modèle
    prend d'emblée le revenu de l'année, la cotisation régularisée.
  effet: aucun sur la cotisation définitive, ni sur les points, qui ne s'attribuent qu'à elle
