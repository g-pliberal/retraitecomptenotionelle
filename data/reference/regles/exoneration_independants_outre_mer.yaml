approximations:
- ecart: >-
    Avant 1986, sous le décret n° 75-1098, dont l'index n'a pas le texte, la règle de
    la métropole tient lieu : l'artisan des DOM sous le montant de l'époque cotise sur
    l'assiette minimale.
  effet: non mesuré ; un trimestre par an au plus, les années que le décret régissait
- ecart: >-
    De 2001 à 2016, la cotisation se calculait sur le revenu de l'avant-dernière
    année (L. 756-5) : la table compare au montant le revenu de l'année même, que le
    modèle porte au compte (limite « indépendants des DOM »).
  effet: non mesuré
- ecart: >-
    Depuis 2018, L. 756-5, II, vise toutes les personnes de L. 631-1, le libéral non
    réglementé de la sécurité sociale des indépendants compris, que le statut
    `liberal_non_reglemente` ne distingue pas de celui de la CNAVPL, que le texte ne
    vise pas : la table ne nomme que l'artisan, le commerçant et le gérant d'un débit
    de tabac. Ni Saint-Pierre-et-Miquelon (D. 756-6), ni Saint-Barthélemy et
    Saint-Martin, que le modèle ne distingue pas de la Guadeloupe.
  effet: non mesuré
- ecart: >-
    Le reste de la règle des DOM : les droits de l'assuré qui ne paie pas toute la
    cotisation appelée, validés sur le double de ce qu'il a versé ; l'exonération du
    créateur, ses deux premières années sur un revenu forfaitaire depuis 2017 ;
    l'abattement dégressif depuis 2017 ; le RCO et le NRCO réduits de 2010 à 2012
    (limite « indépendants des DOM », docs/limites/3-systeme-actuel.md).
  effet: non mesuré
code:
  moteur: >-
    `_ligne_annuelle` exonère l'année de l'artisan, du commerçant ou du gérant d'un
    débit de tabac qui cotise, hors du micro-entrepreneur, quand elle porte un
    département d'outre-mer (`outre_mer`) et que son revenu, positif, ne dépasse pas
    le montant que `exoneration_outre_mer` lit pour son statut et l'année dans
    `legislation/exoneration_independants_outre_mer.csv` (`ExonerationOutreMer.exonere`,
    `exonereOutreMer`) : l'assiette minimale tombe, ses trimestres se valident sur son
    seul revenu, aucun, et l'année ne verse pas de cotisation
    (`cotisations_versees`), si bien que rien n'en va au salaire annuel moyen, aux
    points ni au compte notionnel.
  python: >-
    carriere.py : _ligne_annuelle ; donnees/chargement.py : ExonerationOutreMer.exonere,
    charger_exonerations_outre_mer, exoneration_outre_mer
  javascript: >-
    moteur/js/carriere.js : ligneAnnuelle, exonereOutreMer
  parametres: >-
    legislation/exoneration_independants_outre_mer.csv : statuts, debut, fin, euros
  tests:
  - tests/test_outre_mer.py
  - >-
    tests/test_cnav_baremes.py, où l'assiette minimale moitié moindre des tables des
    DOM, de 2009 à 2016, est celle de la cotisation appelée
