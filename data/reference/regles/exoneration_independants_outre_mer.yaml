schema_version: 1
id: exoneration_independants_outre_mer
intitule: >-
  Exonération de toute cotisation de l'artisan et du commerçant des départements
  d'outre-mer dont le revenu de l'année ne dépasse pas le montant qu'un décret fixe :
  2 500 F jusqu'en 2001, 390 € depuis 2002 (L. 756-3, L. 756-5, II, D. 756-7,
  D. 756-6). L'année ne lui ouvre aucun droit : ni trimestre, ni salaire porté au
  compte, ni point. L'abattement de moitié que L. 756-4 fait sur sa retraite de base
  de 2000 à 2016, que la caisse tient pour une exonération génératrice de droits, ne
  change pas les siens.
regimes: [cancava, organic, regime_general, rsi]
etat: approchee
etape: acquerir_les_droits
effet: >-
  Un artisan de La Réunion qui déclare 300 € en 2010 validait un trimestre sur
  l'assiette minimale, 200 SMIC horaires (1 772 €), portée à son compte ; il n'en
  valide aucun, et rien ne va à son compte. Une artisane de La Réunion née en 1955, à
  15 000 € par an de 1985 à 2014 puis à 300 € en 2015, partie à soixante-deux ans :
  7 508,18 € par an au lieu de 7 597,79 €. La règle ne joue que pour les carrières qui
  portent le département, du relevé ou de la chronologie : la saisie du site ne le
  porte pas (feuille de route, action 177, étape 7).
sources:
  lu_le: 2026-10-31
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Le décret n° 75-1098 du 25 novembre 1975, que D. 756-7 codifie en 1985 : le
    montant de l'exonération avant 1986, et l'abattement de ses articles 3 et 11, que
    D. 756-3 et D. 756-9 nomment. L'index du JORF n'en a que le sommaire, et LEGI
    aucun article ; le texte est au Journal officiel du 27 novembre 1975.
  - >-
    Ce que la caisse porte au compte de l'indépendant des DOM depuis 2017 :
    l'abattement dégressif de L. 756-4 et les deux premières années du créateur, sur
    un revenu forfaitaire et exonérées sous 110 % du plafond (L. 756-2, L. 756-3,
    D. 756-4), ouvrent-ils des droits sur le revenu entier, comme l'abattement
    d'avant 2017 ? L'exposé de la caisse ne le dit pas, ni les circulaires lues ;
    une circulaire de la Cnav ou de l'Urssaf le dirait.
  lectures:
  - type: legifrance
    reference: >-
      L. 756-3 (LEGIARTI000006744202, LEGIARTI000026798306, LEGIARTI000031323786,
      LEGIARTI000033712466), L. 756-4 (LEGIARTI000006744204 à LEGIARTI000037063454),
      L. 756-5 (LEGIARTI000006744205 à LEGIARTI000036392025), D. 756-1 à D. 756-9,
      L. 751-1 et L. 631-1, toutes leurs versions de l'index LEGI à jour du 30
      octobre 2026 : « sont exonérées du versement de toute cotisation lorsque leur
      revenu professionnel ne dépasse pas un certain montant fixé par décret »
      (L. 756-3), puis « de toute cotisation d'assurance vieillesse » (L. 756-5, II) ;
      un revenu « égal ou inférieur à 2.500 F », puis à « 390 euros » (D. 756-7,
      D. 756-6) ; « Les prestations prévues à l'article L. 634-2 sont calculées
      compte tenu du revenu professionnel effectivement pris en considération pour
      le calcul de la cotisation » (D. 756-8). Lues le 31
    date: 2026-10-31
  - type: jorf
    reference: >-
      décret n° 75-1098 du 25 novembre 1975 relatif à l'assurance vieillesse des
      travailleurs non salariés des professions artisanales, industrielles et
      commerciales des départements de la Guadeloupe, de la Guyane, de la Martinique
      et de la Réunion (JORFTEXT000000500873) : l'index n'en a que le sommaire,
      « ART. 1: APPLICATION DU DECRET 7376 DU 23-01-1973 [...] ART. 3 A 10:
      COTISATIONS ». Index JORF à jour du 31 octobre 2026, lu le 31
    date: 2026-10-31
  - type: autre
    reference: >-
      Cnav, exposé « Validation des périodes de cotisations » (version du 13 novembre
      2025), § « Spécificités départements d'outre-mer » : « Seules les cotisations
      versées ouvrent des droits à retraite », « avant 2001 : si le revenu est
      inférieur à 2500 francs, l'assuré est totalement exonéré des cotisations
      retraite. Il ne bénéficie d'aucun droit à retraite » ; l'abattement « DOM 50
      % », dont « La part exonérée lui ouvre des droits à hauteur de ce qu'il a versé
      » ; et ses deux exemples (version du 2 juin 2023), dont « L'assuré règle 857,50
      €, ses droits sont validés sur la base de : 857,5 x 2 = 1715 € »
    url: https://legislation.lassuranceretraite.fr/
    date: 2026-10-31
  - type: circulaire_cnav
    reference: >-
      circulaires Cnav 2024/23 du 16 juillet 2024, 2025/23 du 10 novembre 2025 et
      2026/12 du 7 avril 2026 : « les exonérations Acre et DOM n'ont aucune
      incidence sur la détermination des droits à la retraite de base et
      complémentaire des micro-entrepreneurs » ; 2022/32 du 5 décembre 2022 :
      l'assiette minimale de 2022, 4 758 €, sans exception pour les DOM
    date: 2026-10-31
