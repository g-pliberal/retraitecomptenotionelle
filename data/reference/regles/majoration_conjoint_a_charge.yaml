effet: >-
  Le retraité du régime général parti avant 2011, dont le conjoint sans pension a eu
  soixante-cinq ans avant 2011, reçoit 609,80 € par an au plus, proratisés par sa durée
  depuis 1975, que le modèle ne lui servait pas.
