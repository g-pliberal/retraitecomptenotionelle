approximations:
- version: [loi_du_23_aout_1948, decret_du_24_fevrier_1975, decret_du_12_janvier_2007]
  ecart: >-
    Le modèle ne la sert qu'au conjoint dont la saisie dit les ressources, et les lit comme
    ses avantages de vieillesse ou d'invalidité, qu'il retranche de la majoration (le
    complément différentiel) : des ressources d'une autre nature ne la réduisent pas en
    droit tant qu'avec elle elles restent sous le plafond de l'allocation aux vieux
    travailleurs salariés, que le modèle ne lit pas. Sans ressources dites, il ne la sert
    pas.
  effet: >-
    sous-estime la majoration du conjoint dont les ressources ne sont pas une pension ;
    rien pour qui ne dit pas celles de son conjoint
- version: [loi_du_23_aout_1948, decret_du_24_fevrier_1975, decret_du_12_janvier_2007]
  ecart: >-
    Le conjoint inapte au travail l'ouvrait dès soixante ans : la saisie ne porte pas son
    inaptitude. Le modèle ne sait pas non plus le décès ou le divorce du conjoint, qui
    l'arrêtent, et la sert, une fois ouverte, jusqu'au décès du titulaire.
  effet: non mesuré ; les seuls retraités partis avant 2011 qui déclarent leur conjoint
- version: [loi_du_23_aout_1948, decret_du_24_fevrier_1975, decret_du_12_janvier_2007]
  ecart: >-
    Seul le régime général la sert : les salariés agricoles, les artisans et les
    commerçants, dont les textes l'ont reprise, n'en ont pas dans le modèle, ni le
    titulaire de l'allocation aux vieux travailleurs salariés.
  effet: non mesuré
