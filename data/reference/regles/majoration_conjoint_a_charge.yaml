schema_version: 1
id: majoration_conjoint_a_charge
intitule: >-
  La pension du régime général est majorée quand le conjoint à charge du titulaire a
  soixante-cinq ans et ne bénéficie d'aucun avantage de vieillesse ou d'invalidité
  (L. 351-13) : un montant fixé par décret, 4 000 F par an depuis le 1er juillet 1976,
  609,80 € depuis 2002, que la durée d'assurance proratise depuis le 1er mars 1975 ;
  supprimée à compter du 1er janvier 2011, elle reste servie à qui l'avait au
  31 décembre 2010.
domaine: minima
regimes: [regime_general]
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- le conjoint que la personne déclare, sa naissance, son mariage et ses ressources (la
  saisie, `conjoint`, `mariage`, `ressources_conjoint`)
- la durée d'assurance du régime général, et celle qui proratise sa pension
- la substitution de la pension de vieillesse à une pension d'invalidité
- liquidation.date_effet
ecrit:
- la majoration de la pension du régime général, à la date d'effet et à chaque date où
  elle change, nominale, que la revalorisation sert à chaque échéance
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/completer.py, `majoration_pour_conjoint_a_charge`, et son jumeau)
# lit : `existe` ; `regimes`, ceux dont la pension est majorée ; `age`, celui où le
# conjoint ouvre le droit ; `prorata`, `aucun`, un nombre de trimestres, ou
# `duree_requise` — la durée qui proratise la pension du régime général ;
# `droits_ouverts_avant`, la date avant laquelle le droit doit s'ouvrir ; `montants`,
# le barème annuel en euros à chaque date de service, que le moteur sert nominal —
# celui d'une date est le dernier qui ne la passe pas. Un prorata que le moteur ne
# connaît pas l'arrête.
