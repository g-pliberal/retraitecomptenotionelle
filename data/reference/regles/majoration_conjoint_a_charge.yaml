      « La majoration prévue au premier alinéa est supprimée à compter du 1er janvier 2011.
      Toutefois, elle est maintenue pour les pensionnés qui en bénéficiaient au 31
      décembre 2010, tant qu'ils en remplissent les conditions d'attribution » (L. 351-13)
