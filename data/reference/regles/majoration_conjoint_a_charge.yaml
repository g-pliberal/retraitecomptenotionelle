  nee_de: LEGIARTI000006760674
  bornes:
    liquidation.date_effet: [1975-03-01, 2007-01-13]
  contenu:
    droit: >-
      « La majoration pour conjoint à charge est attribuée lorsque le conjoint du
      titulaire : 1 - A atteint l'âge de soixante-cinq ans ou soixante ans en cas
      d'inaptitude au travail ; 2 - Ne bénéficie pas d'une pension, allocation ou rente
      acquise au titre de l'assurance vieillesse ou de l'assurance invalidité […] ; 3 - Ne
      dispose pas de ressources personnelles qui excéderaient, si elles étaient augmentées
      du montant intégral de la majoration, le chiffre limite de ressources fixé pour
      l'attribution de l'allocation aux vieux travailleurs salariés aux personnes seules
      […]. Lorsque le montant des avantages énumérés au 2 ci-dessus est inférieur à la
      majoration pour conjoint à charge, il est servi un complément différentiel »
      (article 72-2, puis R. 351-31) ; « accordée pour son montant intégral aux titulaires
      d'une pension de vieillesse substituée à une pension d'invalidité et aux titulaires
      d'une pension correspondant à une durée d'assurance d'au moins trente-sept ans et
      demi (soit 150 trimestres) », réduite sinon « à autant de 150° que la pension
      rémunère de trimestres d'assurance » (article 72-3, puis R. 351-32) ; due dès
      l'entrée en jouissance de la pension si les conditions sont remplies, sinon du mois
      qui suit celui où elles le sont (R. 351-33) ; 4 000 F par an depuis le 1er juillet
      1976 (décret n° 76-559), 609,80 € depuis 2002
    beneficiaire: >-
      le titulaire d'une pension de vieillesse du régime général dont le conjoint à
      charge a soixante-cinq ans
