    se lirait au cinquième échelon, soixante-cinq ans, sauf décision contraire.
  - >-
    Les territoriaux et les hospitaliers avant 1985 : l'article 2 du décret n° 65-773 dans
    sa rédaction de 1965, et le code des communes.
  - >-
    Les limites de la catégorie active avant 2010, statut par statut — cinquante-cinq,
    cinquante-sept, cinquante-huit, cinquante-neuf, soixante ou soixante-deux ans —, pour
    les statuts actifs du simulateur : policier, aide-soignant, sapeur-pompier
    professionnel, actifs et super-actifs de l'État, des collectivités et des hôpitaux.
  - >-
    Les agents contractuels (L. 556-11 à L. 556-13 CGFP ; loi n° 84-834, article 6-1,
    LEGIARTI000025494907), les ouvriers de l'État (décret n° 2004-1057) et les régimes
    spéciaux (IEG, SNCF, RATP, Banque de France) ont leur propre limite d'âge, que le
    modèle n'applique pas davantage : une fiche chacun, à l'étape qui les modélisera.
