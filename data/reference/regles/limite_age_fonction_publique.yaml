      surveillance de l'administration pénitentiaire (L. 556-9) ; cinquante-neuf ans pour
      les ingénieurs du contrôle de la navigation aérienne, « sans possibilité de report »
      (L. 556-10) ; pour les autres, celle de leur statut particulier. Après quinze ans dans
      un emploi actif, le fonctionnaire intégré dans un corps sédentaire « conserve, sur sa
      demande et à titre individuel, le bénéfice de la limite d'âge de cet emploi » (L.
