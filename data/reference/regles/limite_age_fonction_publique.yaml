schema_version: 1
id: limite_age_fonction_publique
intitule: >-
  Le fonctionnaire civil — de l'État, territorial ou hospitalier — ne peut être maintenu
  en fonctions au-delà de la limite d'âge de son emploi, sauf les exceptions que la loi
  prévoit : il est radié des cadres d'office quand il l'atteint, sa pension est due du
  jour où il cesse son activité, et les services accomplis au-delà ne comptent dans sa
  pension que dans les cas que la loi prévoit. Soixante-sept ans pour l'emploi
  sédentaire depuis la génération 1955, soixante-cinq de 1986 aux générations nées avant
  juillet 1951 ; pour l'emploi de la catégorie active, un âge au plus égal, que son
  statut fixe — cinquante-sept ans pour le surveillant pénitentiaire et la plupart des
  policiers, cinquante-neuf pour l'ingénieur du contrôle de la navigation aérienne,
  soixante-deux pour les autres emplois actifs.
domaine: age
regimes: [fonction_publique_etat, pensions_civiles_1853, cnracl]
etape: preparer_la_chronologie
face: droit
etat: manquante
lit:
- la date de naissance de l'assuré, et sa génération
- l'emploi de chaque période de la fonction publique — sédentaire, de la catégorie active
  ou super-active —, et son corps quand le corps fixe la limite
- les reculs et les prolongations que les fiches d'exception accordent, sous le plafond
  de la fiche `plafond_limite_age_fonction_publique`
ecrit:
- la date de la radiation des cadres par limite d'âge, qui clôt les services du
  fonctionnaire et date sa pension (L. 90 CPCMR, fiche `date_effet_mois_suivant`)
- les services accomplis au-delà, comptés ou non dans la pension
dates_qui_decident:
- age_atteint
- assure.generation
