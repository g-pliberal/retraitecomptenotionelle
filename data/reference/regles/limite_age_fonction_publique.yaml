  contenu:
    droit: >-
      « La limite d'âge est abaissée, pour les fonctionnaires et employés civils des
      services de l'Etat de la catégorie A et de la catégorie B » : catégorie A, la
      sédentaire, soixante-dix ans aux trois premiers échelons, soixante-sept au quatrième,
      soixante-cinq au cinquième ; catégorie B, l'active, soixante-sept, soixante-cinq,
