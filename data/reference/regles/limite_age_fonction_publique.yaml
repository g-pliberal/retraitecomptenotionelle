    droit: >-
      « Le fonctionnaire ne peut être maintenu en fonctions au-delà de l'âge limite de
      l'activité dans l'emploi qu'il occupe, sous réserve des exceptions prévues par les
      dispositions en vigueur. Cette limite d'âge est fixée à : 1° Soixante-sept ans pour
