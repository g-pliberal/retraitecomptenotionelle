historique:
- >-
  2026-10-10 — née avec l'action 151, étape 2. L'étape 1 avait porté le départ jusqu'à
  119 ans, et le modèle, qui n'applique aucune limite d'âge, gardait en activité un
  fonctionnaire jusqu'à cet âge. La veille a lu la limite d'âge de 1936 à 2026, et les
  exceptions qui la reculent, chacune dans sa fiche. Ce que le simulateur fait au-delà,
  le propriétaire en décide (étape 3).
effet: >-
  Tout fonctionnaire civil dont le départ saisi passe sa limite d'âge : le modèle le garde
  en activité jusqu'au départ, traitement, services et surcote compris, jusqu'à 119 ans
  depuis l'étape 1 de l'action 151. Un sédentaire de l'État né en 1990 et entré à 22 ans
  touche, au scénario 1, 5 219 € brut par mois s'il part à 70 ans, le plus tard que le
  droit le garde, 10 775 € à 90 ans et 18 987 € à 119 ans ; un policier de la même
  génération, dont la limite est 57 ans et 67 avec la prolongation de L. 556-7, se simule
  en activité jusqu'à 119 ans. Mesuré le 10 octobre 2026, en euros constants du
  simulateur.
