schema_version: 1
id: priorite_majorations_enfants
intitule: >-
  Un seul régime accorde les trimestres des enfants. Le régime spécial qui prévoit
  une majoration ou une bonification pour enfants les accorde en priorité s'il peut
  servir une pension à l'assurée selon ses propres règles — la durée de services
  qu'il exige à la radiation — et si le droit y est ouvert pour ses enfants, même
  quand le régime général accorderait plus. Sinon le régime général, prioritaire
  parmi les régimes alignés ; sans lui, le régime de la dernière affiliation et,
  entre affiliations simultanées, celui qui servirait la pension la plus élevée.
  Le droit à la bonification pour un enfant né avant 2004 vaut pour tout enfant
  jusqu'en 2003, pour l'enfant né en service de 2004 à 2010, pour l'enfant né avant
  la radiation depuis 2011 ; la majoration pour un enfant né depuis 2004 suppose
  d'avoir accouché après le recrutement.
sorte: priorite
fiches:
- fiche: enfants_fonction_publique
  role: >-
    la bonification et la majoration de la fonction publique et des régimes spéciaux,
    que le régime spécial accorde en priorité, enfant par enfant, s'il peut servir
    une pension selon ses propres règles et si l'enfant y ouvre le droit
- fiche: majoration_duree_assurance_enfants
  role: >-
    la majoration du régime général et des régimes alignés, que le régime général
    accorde en priorité parmi eux, et pour l'enfant qui n'ouvre pas droit dans le
    régime spécial
rang: 1
domaine: enfants
regimes:
- regime_general
- msa_salaries
- organic
- cancava
- rsi
- cnavpl
- fonction_publique_etat
- cnracl
- fspoeie
- fonctionnaires_pacifique
- pensions_civiles_1853
- banque_de_france
- chemins_fer_secondaires
- comedie_francaise
- ieg
- marins
- mines
- opera_de_paris
- port_strasbourg
- ratp
- seita
- sncf
etat: approchee
etape: compter_les_durees
lit:
- enfant.naissance
- recrutement
- radiation
- liquidation.date_effet
- les régimes de la carrière, et la durée de services de chaque régime spécial à la
  radiation
ecrit:
- le régime qui accorde les trimestres de chaque enfant
dates_qui_decident:
- liquidation.date_effet
# Les versions suivent les rédactions de la règle de priorité, lues dans l'index
# LEGI : l'article 16 du décret n° 75-109 en 1975 et en 1982, puis R. 173-15. Le
# moteur applique à toutes la règle de 1982, que R. 173-15 reprend : elle n'a pas
# de paramètre, et ses versions ne sont pas lues par le code.
versions:
- id: avant_1974
  statut: supposee
  hypothese: >-
    la loi n° 71-1132 ne règle que le régime général et les salariés agricoles, que
    la circulaire Cnav n° 2/72 départage (§ II B 3° : « la majoration est accordée
    par le seul régime français général ») ; on prête aux autres affiliations la règle
    de 1982
  fiabilite: moyenne
  bornes:
    liquidation.date_effet: [null, 1974-07-01]
  contenu:
    droit: >-
      entre le régime général et les salariés agricoles, le régime général seul
  exemples: aucun trouvé
- id: decret_1975
  statut: lue
  textes:
  - {id: LEGIARTI000006762040, article: "décret n° 75-109, article 16", en_vigueur: 1975-02-26}
  - {id: LEGIARTI000006762047, article: "décret n° 75-109, article 20", en_vigueur: 1975-02-26}
  nee_de: LEGIARTI000006762040
  bornes:
    liquidation.date_effet: [1974-07-01, 1982-07-23]
  contenu:
    droit: >-
      le régime général en priorité parmi les régimes alignés ; sans lui, le régime de
      la dernière affiliation, et entre affiliations simultanées celui qui servirait
      la pension la plus élevée ; pour un même enfant, pas de cumul avec un avantage
      de même nature d'un autre régime de base
    conditions: >-
      la circulaire Cnav n° 31/75 (§ 35) en tire que le régime général n'accorde rien
      quand un régime spécial est en cause, sauf si l'assurée prouve qu'il ne lui
      valide rien à ce titre
  exemples: aucun trouvé
- id: decret_1982
  statut: lue
  textes:
  - {id: LEGIARTI000006762041, article: "décret n° 75-109, article 16", en_vigueur: 1982-07-23}
  nee_de: LEGIARTI000006762041
  bornes:
    liquidation.date_effet: [1982-07-23, 1985-12-21]
  contenu:
    droit: >-
      le régime spécial qui prévoit une majoration l'accorde en priorité « si celui-ci
      est susceptible d'accorder en vertu de ses propres règles une pension » ; les
      règles de 1975 sinon, et aussi quand la pension statutaire est liquidée avant
      la naissance, ou quand le régime spécial sert une pension proportionnelle au
      titre de la coordination
  exemples: aucun trouvé
- id: r173_15_1985
  statut: lue
  textes:
  - {id: LEGIARTI000006747882, article: R. 173-15, en_vigueur: 1985-12-21}
  nee_de: LEGIARTI000006747882
  bornes:
    liquidation.date_effet: [1985-12-21, 2001-09-18]
  contenu:
    droit: la règle de 1982, codifiée mot pour mot
  exemples: aucun trouvé
- id: r173_15_2001
  statut: lue
  textes:
  - {id: LEGIARTI000006747883, article: R. 173-15, en_vigueur: 2001-09-18}
  nee_de: LEGIARTI000006747883
  bornes:
    liquidation.date_effet: [2001-09-18, 2008-08-24]
  contenu:
    droit: >-
      la même règle, et une exception : la CRPCEN n'accorde pas la majoration à la
      clerc ou employée de notaire qui justifie ailleurs d'une plus longue affiliation
  exemples: aucun trouvé
- id: r173_15_2008
  statut: lue
  textes:
  - {id: LEGIARTI000019375554, article: R. 173-15, en_vigueur: 2008-08-24}
  nee_de: LEGIARTI000019375554
  bornes:
    liquidation.date_effet: [2008-08-24, 2011-05-30]
  contenu:
    droit: >-
      la même règle ; l'exception de la CRPCEN ne vaut plus que pour qui y compte moins
      de quinze ans
  exemples: aucun trouvé
- id: r173_15_2011
  statut: lue
  textes:
  - {id: LEGIARTI000024083898, article: R. 173-15, en_vigueur: 2011-05-30}
  - {id: LEGIARTI000030059086, article: R. 173-15, en_vigueur: 2015-01-01}
  - {id: LEGIARTI000034595998, article: R. 173-15, en_vigueur: 2017-05-06}
  nee_de: LEGIARTI000024083898
  bornes:
    liquidation.date_effet: [2011-05-30, null]
  contenu:
    droit: >-
      les majorations de L. 351-4 : le régime général en priorité parmi les régimes
      alignés, élargis aux professions libérales et aux cultes ; le régime spécial qui
      prévoit une majoration au titre de l'accouchement, de la grossesse, de l'adoption
      ou de l'éducation en priorité, s'il peut servir une pension selon ses propres
      règles ; l'enfant handicapé au dernier régime spécial ; depuis 2015, la majoration
      de L. 351-4-2 suit les deux premiers alinéas
    conditions: >-
      enfant par enfant : le régime général est compétent « si un ou plusieurs enfants
      n'ouvrent pas droit à majoration » dans le régime spécial (circulaire Cnav 2017-01,
      fiches 6.2a et 6.2b, point 3)
  exemples: aucun trouvé
approximations:
- version: [avant_1974, decret_1975]
  ecart: >-
    le moteur applique la règle de 1982 : le régime spécial n'a la priorité que s'il
    peut servir une pension selon ses propres règles, et le régime général accorde
    l'enfant qui n'y ouvre pas droit ; le texte de 1975 interdit le cumul pour un même
    enfant, et la circulaire n° 31/75 écarte le régime général dès qu'un régime spécial
    est en cause
  effet: >-
    les mères passées par un régime spécial sans y avoir droit à pension, parties de
    juillet 1974 à juillet 1982, si le régime général ne leur accordait rien ; non
    mesuré
- version: [r173_15_2001, r173_15_2008, r173_15_2011]
  ecart: >-
    l'exception de la CRPCEN n'est pas portée : sa fiche de régime ne déclare pas de
    bonification, et le régime général accorde donc les enfants de ses affiliées
  effet: >-
    aucun quand la clerc de notaire a plus longtemps cotisé ailleurs ; non mesuré dans
    les autres cas
effet: >-
  Toute mère passée par un régime spécial et par un régime aligné. Jusqu'au 24 septembre
  2026, le modèle donnait les trimestres au régime qui en accordait le plus : une
  fonctionnaire de l'État passée au privé recevait les seize trimestres du régime
  général pour deux enfants nés avant 2004, au lieu des huit de sa bonification.
  tests/test_priorite_enfants.py, et cinq témoins de parcours rejouent la règle
  dans les deux moteurs.
presomptions:
  naissance_des_enfants: >-
    la naissance de l'enfant, avant ou après 2004, le recrutement et la radiation, qui ouvre le droit dans le régime spécial
  radiation_au_1er_janvier_suivant: >-
    la date à laquelle se lit la durée de services qui ouvre une pension
sources:
  lu_le: 2026-09-24
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Mûrie le 27 septembre 2026 avec le domaine des enfants (docs/architecture.md, §
    11) : elle relie désormais les deux fiches que la carte découpe, et ses versions
    sont les rédactions de l'article 16 du décret n° 75-109 et de R. 173-15, lues
    dans l'index LEGI le même jour.
  - >-
    Aucun exemple chiffré publié n'a été trouvé. Quatre approximations sont assumées.
    Le modèle date la radiation au 1er janvier qui suit la dernière année de services
    et fait naître les enfants aux trente ans de leur mère. Il applique à tous les
    régimes spéciaux les conditions de la fonction publique (L. 12 bis, R. 13),
    comme il leur applique déjà sa table. Il ne lit la règle des militaires — quinze
    ans pour qui s'est engagé avant le 1er janvier 2014 (L. 6 ; loi n° 2014-40,
    article 42, II) — que pour une carrière d'État seulement militaire, depuis le
    24 septembre 2026, et date le premier engagement au 1er janvier de sa première
    année. Hors du modèle : l'exception de la CRPCEN, dont la fiche ne déclare pas
    de bonification ; la pension statutaire liquidée avant la naissance ; l'enfant
    handicapé, qui va au dernier régime spécial. Avant 1985, R. 173-15 n'est pas
    dans l'index, et le modèle applique la même règle. Le rétablissement au régime
    général de qui n'a pas la durée est fait depuis le 24 septembre 2026 (`retablissement_fonction_publique`)
    : la mère rétablie reçoit les trimestres de ses enfants du régime général.
  lectures:
  - type: legifrance
    reference: >-
      décret n° 75-109, article 16, dans ses deux rédactions (LEGIARTI000006762040,
      1975 ; LEGIARTI000006762041, 1982), et R. 173-15 CSS dans ses six rédactions,
      de LEGIARTI000006747882 (1985) à LEGIARTI000034595998 (2017), lus dans l'index
      LEGI : la priorité du régime spécial naît en 1982, l'exception de la CRPCEN en
      2001, les majorations de 2010 et l'enfant handicapé en 2011
    date: 2026-09-27
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 31/75 du 5 mars 1975, § 35 : « si un régime spécial est en
      cause, la majoration ne sera pas accordée par le régime général », sauf preuve
      que l'assurée « ne bénéficie d'aucune validation à ce titre » ; circulaire Cnav
      n° 2/72, § II B 3° : entre le régime général et les salariés agricoles, « la
      majoration est accordée par le seul régime français général »
    date: 2026-09-27
  - type: legifrance
    reference: >-
      R. 173-15 CSS, lu dans l'index LEGI : la majoration « est accordée en priorité
      par le régime spécial si celui-ci est susceptible d'accorder en vertu de ses
      propres règles une pension à l'intéressé » ; même phrase dans la version de
      1985
    date: 2026-09-24
  - type: legifrance
    reference: >-
      durées de services de chaque régime spécial, lues dans l'index LEGI : quinze
      ans, puis deux pour les fonctionnaires radiés depuis 2011 et un an pour les
      agents de la SNCF, de la RATP, des IEG et de l'Opéra partis depuis le 1er
      juillet 2008 ; aucune à la Banque de France depuis le 9 mai 2012 ; voir l'en-tête
      de services_ouvrant_pension.csv
    date: 2026-09-24
  - type: autre
    reference: >-
      CNRACL, juris-cnracl, « Règles de coordination avec les autres régimes » :
      la CNRACL accorde en priorité dès qu'elle peut servir une pension et que le
      droit est ouvert ; « l'agent ne peut pas renoncer à une bonification ou une
      majoration de durée d'assurance servie par la CNRACL pour qu'elle le soit
      par un autre régime » (TA Amiens, 2 juin 2017, n° 1501559)
    date: 2026-09-24
    url: >-
      https://www.juris-cnracl.retraites.fr/pension-normale/les-trimestres-liquidables/regles-de-coordination-avec-les-autres-regimes
  - type: autre
    reference: >-
      CNRACL, juris-cnracl, « Bonification pour enfants » (enfants nés avant la
      radiation des cadres ; interruption d'activité possible hors de la fonction
      publique depuis le décret n° 2010-1741) et « Femmes fonctionnaires qui ont
      accouché après le 01/01/2004 et après leur recrutement »
    date: 2026-09-24
    url: >-
      https://www.juris-cnracl.retraites.fr/pension-normale/les-trimestres-liquidables/les-bonifications/bonification-pour-enfants
  - type: autre
    reference: >-
      COR, fiches CPRPF (SNCF) et CRP RATP de juillet 2024 : quinze ans de services
      exigés des agents partis avant le 1er juillet 2008 ; en deçà, à la RATP, une
      pension de coordination calculée selon les règles du régime général
    date: 2026-09-24
    url: >-
      https://www.cor-retraites.fr/sites/default/files/2024-07/Fiche_RATP_vf.pdf
textes_a_rattacher:
- reference: >-
    L. 4 (LEGIARTI000006362667, LEGIARTI000023096809) et R. 4-1 (LEGIARTI000023388607)
    du code des pensions ; décret n° 2003-1306, article 7 ; décret n° 2004-1056,
    article 3
- reference: >-
    décret n° 2008-639, article 3 ; décret n° 2008-637, article 6 ; décret n° 46-1541,
    annexe 3 ; décret n° 2007-262, annexe, article 7 ; décret n° 68-382, article
    6 ; décret n° 68-960, article 6 ; décret n° 62-766, articles 110 et 112 ; code
    des transports, L. 5552-11
code:
  python: >-
    droit/compter.py : majoration_pour_enfants, droit_regime_special, bonification_ouverte,
    dernieres_annees, choisir
  javascript: >-
    moteur/js/droit/compter.js : majorationPourEnfants, droitRegimeSpecial, bonificationOuverte,
    dernieresAnnees, choisir
  parametres: >-
    legislation/services_ouvrant_pension.csv, la durée de services qui ouvre une pension
    dans chaque régime spécial ; la priorité elle-même n'a pas de paramètre
  tests: [tests/test_priorite_enfants.py]
historique:
- >-
  2026-09-24 — le régime spécial accorde en priorité, et non le régime qui accorde le
  plus (R. 173-15).
- >-
  2026-09-27 — la priorité se lit enfant par enfant (circulaire Cnav 2017-01, fiches
  6.2a et 6.2b), puis la relation mûrit avec le domaine des enfants : elle relie les
  deux fiches découpées, et ses versions sont les rédactions de 1975, 1982, 1985, 2001,
  2008 et 2011, lues dans l'index LEGI.
