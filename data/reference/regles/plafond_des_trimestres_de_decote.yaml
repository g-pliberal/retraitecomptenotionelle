schema_version: 1
id: plafond_des_trimestres_de_decote
intitule: >-
  Le plafond de vingt trimestres de décote est écrit dans trois textes et absent
  des deux autres ; il ne mord sur aucune liquidation que le droit ouvre, parce
  que l'écart entre l'âge d'ouverture et l'âge d'annulation vaut au plus vingt trimestres.
regimes: [cnavpl, cnbf, cnracl, fonction_publique_etat, fspoeie, msa_non_salaries,
  regime_general]
etat: conforme
effet: >-
  Aucun. Le modèle applique un plafond de vingt trimestres par défaut (`decote_trimestres_maximum`),
  et il ne mord sur AUCUNE des 2 483 liquidations ouvertes qu'un balayage de la
  grille produit — treize cas types, six générations, tous les trimestres de cinquante
  à soixante-huit ans. La raison est mesurable dans les tables : l'écart entre l'âge
  d'ouverture et l'âge d'annulation vaut exactement vingt trimestres pour les générations
  1930 à 1961, puis dix-huit, quinze, treize et douze ensuite. Le décompte par l'âge
  est donc borné par construction sur toute liquidation ouverte. Deux tests le tiennent.
sources:
  lu_le: 2026-09-22
  prochaine_relecture: 2027-06-30
  lectures:
  - type: legifrance
    reference: >-
      R. 643-7 CSS, LEGIARTI000047633290 : « Le coefficient de minoration est égal
      à 1,25 % par trimestre manquant dans la limite de vingt trimestres. » R. 723-38
      CSS et le I de L. 14 du code des pensions portent la même limite.
    date: 2026-09-22
  - type: legifrance
    reference: >-
      R. 351-27 2° CSS, LEGIARTI000054589995, version du 1er août 2026 : « Pour
      chaque trimestre ainsi retenu, le coefficient de minoration à appliquer au
      “ taux plein ” est 1,25 %. » Aucune limite de trimestres n'y figure, et R.
      732-61 du code rural n'en porte pas davantage. R. 351-27-1, qui plafonne,
      ne vise que les assurés de L. 161-17-4.
    date: 2026-09-22
textes_a_rattacher:
- reference: R. 643-7 CSS (professions libérales), version du 1er septembre 2023
- reference: R. 723-38 CSS (avocats)
- reference: L. 14 I du code des pensions civiles et militaires
- reference: 'R. 351-27 2° CSS et R. 732-61 du code rural : aucun plafond'
code:
  moteur: >-
    `trimestres_de_decote` compte les trimestres de décote — le moindre de ceux qui
    manquent à la durée et de ceux qui séparent le départ de l'âge d'annulation, ou ceux
    de l'âge seul avant 1983 — et les borne au plafond de la période de régime,
    `decote_trimestres_maximum`. Le catalogue (`CatalogueRegimes._construire`) le met à
    vingt dans toute période qui n'en écrit pas d'autre, à rien dans celle qui l'écrit
    nul : le régime général et les non-salariés agricoles, dont le texte n'en a pas, le
    reçoivent comme les libéraux, les avocats et les fonctionnaires, dont le texte
    l'écrit.
  python: >-
    droit/liquider.py : trimestres_de_decote ; donnees/regimes.py :
    CatalogueRegimes._construire, PeriodeRegime
  javascript: >-
    moteur/js/droit/liquider.js : trimestresDeDecote
  parametres: >-
    aucun : le plafond de vingt trimestres est la valeur que le catalogue des régimes
    donne à `decote_trimestres_maximum` dans toute période qui n'en écrit pas d'autre
  tests:
  - >-
    tests/test_simulateur.py, test_la_decote_est_plafonnee_a_vingt_trimestres et
    test_l_age_d_annulation_de_la_decote_d_un_actif_est_sa_limite_d_age
  - tests/test_parents_trois_enfants.py
  - >-
    tests/test_retraite_progressive.py, où la décote de la pension provisoire ne dépasse
    pas 25 %
  - >-
    tests/test_cout_age_depart.py, qui balaie la grille et veut le plafond sans effet
    sur toute liquidation ouverte
  - >-
    tests/test_cumul_activites.py, tests/test_etranger.py et
    tests/test_oracle_categorie_active.py, qui confrontent les deux moteurs sur des
    carrières qui le portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    huit témoins changent sans le plafond, tous au scénario 1 : les quatre parents de
    trois enfants de la fonction publique partis avant 2012 (parents_trois_enfants_pere,
    parents_trois_enfants_nouveau_calcul, parents_trois_enfants_active_nouveau_calcul,
    parents_trois_enfants_ancien_calcul_decote), la complémentaire de la CPRN d'un
    notaire parti à l'âge légal en 2022 (cumul_notaire_cprn_2022), les départs non
    ouverts à cinquante-deux et cinquante-sept ans (liquidation_52, liquidation_57) et,
    dans son seul détail, etranger_portugal_carriere_longue
