schema_version: 1
id: decompte_des_services_regimes_speciaux
intitule: >-
  Les services des régimes spéciaux réformés en 2007 et 2008 s'additionnent, et ne
  s'arrondissent qu'une fois, au décompte final des trimestres liquidables : la fraction
  de trimestre d'au moins quarante-cinq jours fait un trimestre, la fraction plus courte
  se néglige (SNCF, décret n° 2008-639, article 12 ; RATP, décret n° 2008-637, article
  23 ; IEG, annexe 3 du statut national, article 9 ; CRPCEN, décret n° 90-1215, article
  85 ; Opéra, décret n° 68-382, article 14 ; Comédie-Française, décret n° 68-960, article
  12 ; Banque de France, décret n° 2007-262, annexe, article 31). La durée d'assurance
  que la décote et la surcote lisent « totalise la durée des services », sans arrondi
  écrit ; les trimestres qui manquent à la décote s'arrondissent à l'entier supérieur,
  ceux de la surcote sont des « trimestres entiers ».
domaine: duree
regimes:
- sncf
- ratp
- ieg
- crpcen
- opera_de_paris
- comedie_francaise
- banque_de_france
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- les mois de chaque année de services dans ces régimes, à trente jours le mois
- les trimestres que les autres régimes valident la même année
- liquidation.date_effet
ecrit:
- les jours d'assurance et de services de chaque régime spécial, année par année, et
  l'écart que leurs fractions font à la durée tous régimes que ces régimes lisent
- les trimestres liquidables de ces régimes, la durée que leur décote et leur surcote
  lisent
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (moteur/js/droit/compter.js, `compter`, `decompteDesServices` ;
# moteur/js/droit/liquider.js, `liquiderChaqueRegime`) lit les mêmes paramètres
# que la fiche de la fonction publique : `existe`, `regimes`, `unite_jours`,
# `seuil_jours`, `duree_au_jour`, `minimum_garanti`, `fiabilite` ; et
# `decote_ecartee_au_maximum`, que la fonction publique tient de la
# jurisprudence (Conseil d'État, 2 février 2010, n° 311495) et qu'aucun texte
# ni aucun arrêt ne donne à ces régimes : faux ici. Une version ne porte que
# les régimes dont le règlement l'écrit à sa date.
