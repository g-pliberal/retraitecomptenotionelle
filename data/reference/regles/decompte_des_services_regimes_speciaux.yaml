  contenu:
    droit: >-
      « La durée des services et des bonifications admissibles en liquidation
      s'exprime en trimestres. Dans le décompte final des trimestres liquidables, la
      fraction de trimestre égale ou supérieure à quarante-cinq jours est comptée pour
      un trimestre. La fraction de trimestre inférieure à quarante-cinq jours est
      négligée » (SNCF, article 12, dans les rédactions du 1er juillet 2008 et du 2
      janvier 2022) ; la même règle à la RATP (article 23 : « est prise en compte pour
      un trimestre »), aux IEG (annexe 3, article 9, depuis la rédaction du 30 juin
      2008), à la CRPCEN (article 85, I : « la durée des périodes de versement de
      cotisations [...] s'additionne et s'exprime en trimestres »), à l'Opéra (article
      14, I) et à la Comédie-Française (article 12, I) ; la Banque de France la garde
      (annexe, article 31, II). « La durée d'assurance totalise la durée des services
      » (SNCF, article 13, III), et « Une année civile ne peut compter pour plus de
      quatre trimestres » ; « Le nombre de trimestres correspondant est arrondi à
      l'entier supérieur » (article 13, I, 2°, pour la décote) ; « Sont pris en compte
      pour ce calcul les trimestres entiers cotisés » (article 13, II, pour la
      surcote, depuis le 1er janvier 2009).
    parametres:
      existe: true
      regimes: [sncf, ratp, ieg, crpcen, opera_de_paris, comedie_francaise,
                banque_de_france]
      unite_jours: 90
