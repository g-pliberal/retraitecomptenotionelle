textes_sans_effet:
- id: LEGIARTI000047909408
  article: décret n° 2007-262, article 1er
  en_vigueur: 2023-09-01
  motif: >-
    ferme le régime aux agents recrutés à compter du 1er septembre 2023 (« Ce règlement
    s'applique aux agents titulaires recrutés avant le 1er septembre 2023 ») et règle sa
    gestion par la Caisse des dépôts ; il ne touche pas au décompte des services, que
    l'article 31 de l'annexe porte
approximations:
- version: [reglement_banque_de_france_de_2007, reforme_de_2008]
  ecart: >-
    Le modèle connaît la carrière au mois, et compte le mois pour trente jours : la
    fraction d'un mois se néglige, celle de deux mois fait le trimestre, alors que le
    service compte au jour.
  effet: >-
    au plus un trimestre liquidable et un trimestre de décote, quand une fraction de
    mois tombe de part et d'autre du seuil ; non mesuré
- version: [reglement_banque_de_france_de_2007, reforme_de_2008]
  ecart: >-
    La durée d'assurance de la décote « totalise la durée des services » sans écrire
    d'arrondi : le modèle la lit au jour, comme celle de la fonction publique (L. 14,
    I). Si la caisse l'arrondissait aux quarante-cinq jours, comme les services
    liquidables, les trimestres manquants changeraient d'au plus un.
  effet: >-
    au plus un trimestre de décote ; les deux lectures donnent le même nombre dans
    les exemples du test ; non mesuré ailleurs
- version: [reglement_banque_de_france_de_2007, reforme_de_2008]
  ecart: >-
    Les périodes à temps partiel sont comptées en entier dans les services liquidés,
    alors que les règlements (sauf la CRPCEN) ne les retiennent que pour leur
    quotité, sauf surcotisation : chantier à part.
  effet: tout agent qui a travaillé à temps partiel ; non mesuré ici
sources:
  lu_le: 2026-11-21
  prochaine_relecture: 2027-05-21
  a_relire:
  - >-
    Lire les règlements d'avant 2008 de la SNCF et de la RATP, absents de l'index LEGI,
    et la pratique des caisses sur l'arrondi des annuités d'avant la réforme.
  - >-
    Chercher si une caisse (CPRP SNCF, CRP RATP, CNIEG) arrondit la durée d'assurance
    de la décote aux quarante-cinq jours, ou la lit au jour.
  lectures:
  - type: legifrance
    reference: >-
      décret n° 2008-639 (SNCF), articles 12 (LEGIARTI000019108311,
      LEGIARTI000045021328) et 13 (LEGIARTI000019108313, LEGIARTI000020085562,
      LEGIARTI000054622824) ; décret n° 2008-637 (RATP), articles 23
      (LEGIARTI000050710693) et 24 (LEGIARTI000047914227) ; annexe 3 du statut des
      IEG, articles 2, 9 et 10 (LEGIARTI000019226006, LEGIARTI000052046924) ; décret
      n° 90-1215 (CRPCEN), articles 85 et 85-1 (LEGIARTI000047909839,
      LEGIARTI000047909834) ; décret n° 68-382 (Opéra), article 14
      (LEGIARTI000029135161) ; décret n° 68-960 (Comédie-Française), article 12
      (LEGIARTI000029134341) ; décret n° 2007-262 (Banque de France), article 1er et
      annexe, article 31 (LEGIARTI000006260745, LEGIARTI000006778516,
      LEGIARTI000047909725), lus dans l'index LEGI du dépôt, à jour au 16 novembre 2026
    date: 2026-11-21
code:
  javascript: >-
    moteur/js/droit/compter.js : compter, decompteDesServices, Durees ;
    moteur/js/droit/liquider.js : liquiderChaqueRegime, trimestresDeDecote,
    coefficientSurcoteRegimesSpeciaux
  parametres: >-
    contenu.parametres de chaque version : existe, regimes, unite_jours, seuil_jours,
    duree_au_jour, decote_ecartee_au_maximum, minimum_garanti, fiabilite
  tests: [tests/test_duree_des_regimes_speciaux.py]
  moteur: >-
    Durees en porte le décompte (decompteSpecial, jours, ecartAuJourSpecial) ; le
    paquet du site porte ses versions.
historique:
- >-
  2026-11-21 — écrite après la relecture au texte des régimes spéciaux : le modèle
  comptait les trimestres civils entiers de l'année d'entrée et de celle du départ,
  chacune à part, et perdait un trimestre quand leurs fractions additionnées
  atteignaient quarante-cinq jours.
reformes:
- banque_de_france_2007
- regimes_speciaux_2008
effet: >-
  Les agents dont l'année d'entrée et celle du départ sont entamées : un trimestre
  liquidable de plus, et un trimestre de décote de moins ou de surcote de plus, quand
  les deux fractions additionnées atteignent quarante-cinq jours ; +0,8 % à +2,1 % de
  pension dans les exemples du test.
