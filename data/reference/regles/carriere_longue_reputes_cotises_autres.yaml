schema_version: 1
id: carriere_longue_reputes_cotises_autres
intitule: >-
  Trimestres réputés cotisés : chômage, maladie et accidents du travail, maternité,
  invalidité (deux), service national, compte professionnel de prévention, AVPF
  (quatre), dans des limites propres à chacun.
etat: conforme
effet: >-
  PORTÉ LE 22 SEPTEMBRE 2026. Les six enveloppes sont en table, motif par motif,
  dans `periodes_non_travaillees.csv`, et le moteur les consomme dans l'ordre de
  la carrière. Ce que cela change : une seule année de chômage indemnisé suffisait
  à fermer un départ que le droit ouvre, et trois ans de maternité le fermaient
  tout autant alors que le 4° ne leur oppose aucune limite. Deux motifs partagent
  leur enveloppe, parce que le 2° vise l'incapacité temporaire et non l'un ou l'autre
  : maladie et accident du travail tiennent ensemble dans quatre trimestres.
sources:
  lu_le: 2026-09-22
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    RESTE HORS DU MODÈLE, et c'est écrit dans `docs/limites.md` : le 6° du I — majoration
    de durée d'assurance du compte professionnel de prévention, que le modèle ne
    calcule pas — et la part du 7° qui vise les fonctionnaires affiliés à un régime
    spécial, qu'il ne distingue pas. RESTE À TRANCHER, ET C'EST UNE LECTURE QUI
    MANQUE : l'article D. 351-1-3, version LEGIARTI000053356007, pose la condition
    de DÉBUT D'ACTIVITÉ sur une « durée d'assurance d'au moins cinq trimestres »,
    là où le modèle ne compte que les trimestres COTISÉS de ces années-là. Le texte
    est plus large que le modèle ; la doctrine Cnav ne l'est peut-être pas, et le
    site legislation.cnav.fr n'est pas joignable depuis une session du dépôt. La
    condition reste donc telle quelle, plus dure que la lettre du décret, en attendant
    la circulaire. LES TROIS EXEMPLES du point 1.2 de la circulaire 2026-29, lus
    le 21 septembre 2026, ne se rejouent toujours pas : ils arbitrent, année par
    année, entre des périodes assimilées de nature différente et retiennent la combinaison
    la plus favorable, quand une carrière du modèle ne porte qu'un motif par année.
  lectures:
  - type: circulaire_cnav
    reference: 2026-29 du 4 septembre 2026, points 1.2.3.1 à 1.2.3.7
    date: 2026-09-04
  - type: legifrance
    reference: >-
      D. 351-1-2 CSS, LEGIARTI000053356011, version du 1er janvier 2026, lue en
      entier dans l'index LEGI du dépôt : « sont réputées avoir donné lieu à cotisations
      : 1° Les périodes de service national […] dans la limite de quatre trimestres
      ; 2° Les périodes comptées comme périodes d'assurance en application des 1°
      et 5° au titre de l'incapacité temporaire de l'article R. 351-12, dans la
      limite de quatre trimestres ; 3° Les périodes comptées […] en application
      des b et c du 4° et du 10° de l'article R. 351-12, dans la limite de quatre
      trimestres ; 4° Les périodes comptées […] en application du 2° de l'article
      R. 351-12 ; 5° […] du 3° de l'article R. 351-12, dans la limite de deux trimestres
      ; […] 7° Les périodes validées en application des articles L. 381-1 et L.
      381-2 […] dans la limite de quatre trimestres. »
    date: 2026-09-22
  - type: legifrance
    reference: >-
      R. 351-12 CSS, LEGIARTI000054425288, lu pour la correspondance des renvois
      : 1° maladie indemnisée, 2° maternité, 3° invalidité, 4° b et c chômage indemnisé
      et d chômage NON indemnisé, 5° accident du travail, 10° activité partielle.
    date: 2026-09-22
textes_a_rattacher:
- reference: D. 351-1-1 CSS
- reference: D. 351-1-2 CSS
- reference: D. 351-1-2-1 CSS
- reference: R. 351-12 CSS
