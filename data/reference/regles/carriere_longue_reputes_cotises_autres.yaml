schema_version: 1
id: carriere_longue_reputes_cotises_autres
intitule: >-
  Trimestres réputés cotisés pour la carrière longue (D. 351-1-2), selon la rédaction
  en vigueur à la date d'effet de la pension : depuis 2004, le service national et
  l'incapacité temporaire, quatre trimestres chacun ; depuis novembre 2012, deux de
  chômage indemnisé, et six de maladie, de maternité et d'accident du travail ;
  depuis avril 2014, quatre de chômage, la maternité sans limite, deux d'invalidité ;
  depuis septembre 2023, quatre d'assurance vieillesse des parents au foyer.
domaine: depart_anticipe
regimes: [regime_general]
etape: ouvrir_le_droit
face: droit
etat: conforme
lit:
- >-
  chaque année non cotisée de la carrière, jusqu'à la liquidation, et la nature que
  son motif a au sens de l'article (`reputes_cotises_nature` de
  `legislation/periodes_non_travaillees.csv`)
- les trimestres que chacune de ces années valide, quatre au plus
- liquidation.date_effet
ecrit:
- >-
  les trimestres que la carrière longue ajoute à la durée cotisée, chaque nature dans
  sa limite, comptée sur toute la carrière
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1) : chaque
# rédaction vaut pour les pensions prenant effet à compter de la date que son décret
# fixe. Le moteur (scenarios/actuel.py, `CarriereLongue.cotises_reputes`, et son
# jumeau) lit `limites` : chacune nomme ses natures et ses trimestres sur toute la
# carrière, `null` quand elle n'en a pas ; une période dont la nature est dans
# plusieurs limites les consomme toutes, et une nature qu'aucune limite ne nomme
# n'est pas réputée cotisée. Les natures sont celles de la colonne
# `reputes_cotises_nature` de `legislation/periodes_non_travaillees.csv` :
# service_national, incapacite_temporaire (maladie, accident du travail),
# maternite, chomage (b et c du 4° de R. 351-12), invalidite, avpf.
versions:
- id: avant_la_carriere_longue
  statut: supposee
  hypothese: >-
    l'article naît du décret n° 2003-1036 du 30 octobre 2003, dont les dispositions
    « sont applicables aux pensions prenant effet postérieurement au 31-12-2003 » :
    avant, aucun départ pour carrière longue, rien n'est réputé cotisé
  fiabilite: haute
  bornes:
    liquidation.date_effet: [null, 2004-01-01]
  contenu:
    droit: aucune période réputée cotisée
    parametres:
      limites: []
      fiabilite: haute
  exemples: aucun trouvé
- id: service_national_et_incapacite_temporaire
  statut: lue
  textes:
  - id: LEGIARTI000006736522
    article: D. 351-1-2 CSS, rédaction du décret n° 2003-1036 du 30 octobre 2003
    en_vigueur: 2003-10-31
    lu_le: 2026-10-19
  nee_de: LEGIARTI000006736522
  bornes:
    liquidation.date_effet: [2004-01-01, 2012-11-01]
  contenu:
    droit: >-
      « sont réputées avoir donné lieu à cotisations : 1° Les périodes de service
      national, à raison d'un trimestre par période d'au moins quatre-vingt-dix jours,
      consécutifs ou non ; 2° Les périodes comptées comme périodes d'assurance en
      application des 1°, 2° et 5° au titre de l'incapacité temporaire de l'article
      R. 351-12 ; […] Les périodes mentionnées au 1° et au 2° du présent article sont
      retenues respectivement dans la limite de quatre trimestres et sans que le nombre
      de trimestres ayant donné lieu à cotisations ou réputés tels puisse excéder quatre
      pour une même année civile. »
    a_dire: >-
      les 1°, 2° et 5° de R. 351-12 (rédaction LEGIARTI000006750030) sont la maladie,
      la maternité et l'accident du travail indemnisé : « l'ensemble de ces périodes
      est retenu dans la limite de quatre trimestres sur la totalité de la carrière »
      (circulaire Cnav 2003-46 du 18 novembre 2003, point 11232), « soit 8 trimestres
      réputés cotisés au maximum » avec le service national (point 1123) ; ni le
      chômage, ni l'invalidité
    parametres:
      limites:
      - {natures: [service_national], trimestres: 4}
      - {natures: [incapacite_temporaire, maternite], trimestres: 4}
      fiabilite: haute
  exemples: aucun trouvé
- id: deux_trimestres_de_chomage
  statut: lue
  textes:
  - id: LEGIARTI000026139944
    article: D. 351-1-2 CSS, rédaction du décret n° 2012-847 du 2 juillet 2012
    en_vigueur: 2012-11-01
    lu_le: 2026-10-19
  nee_de: LEGIARTI000026139944
  bornes:
    liquidation.date_effet: [2012-11-01, 2014-04-01]
  contenu:
    droit: >-
      « 2° Les périodes comptées comme périodes d'assurance en application des 1°, 2°
      et 5° au titre de l'incapacité temporaire de l'article R. 351-12, dans la limite
      totale de six trimestres, sans que le nombre total de périodes validées en
      application des 1° et 5° de l'article R. 351-12 ne puisse excéder quatre
      trimestres ; 3° Les périodes comptées comme périodes d'assurance en application
      des b et c du 4° de l'article R. 351-12, dans la limite de deux trimestres. » ; le
      service national garde ses quatre trimestres
    a_dire: >-
      « Les articles 1er à 4 du présent décret sont applicables aux pensions prenant
      effet à compter du 1er novembre 2012 » (décret n° 2012-847, article 14) ; la
      circulaire Cnav 2012-60 du 4 septembre 2012 (point 32) examine « en priorité
      […] les trimestres assimilés maladie et accident du travail dans la limite de 4
      sur toute la carrière », puis complète « par des périodes assimilées maternité,
      dans la limite de 6 trimestres » : le total ne dépend pas de cet ordre, et le
      moteur consomme les limites dans l'ordre de la carrière ; la circulaire Cnav
      2014-26 borne la rédaction aux retraites prenant effet « au plus tard au
      1er mars 2014 inclus »
    parametres:
      limites:
      - {natures: [service_national], trimestres: 4}
      - {natures: [incapacite_temporaire], trimestres: 4}
      - {natures: [incapacite_temporaire, maternite], trimestres: 6}
      - {natures: [chomage], trimestres: 2}
      fiabilite: haute
  exemples: aucun trouvé
- id: quatre_de_chomage_et_la_maternite
  statut: lue
  textes:
  - id: LEGIARTI000028751938
    article: D. 351-1-2 CSS, rédaction du décret n° 2014-350 du 19 mars 2014
    en_vigueur: 2014-04-01
    lu_le: 2026-10-19
  - id: LEGIARTI000043506391
    article: D. 351-1-2 CSS, rédaction du décret n° 2021-593 du 14 mai 2021
    en_vigueur: 2021-05-16
    lu_le: 2026-10-19
    change: >-
      le 3° vise aussi le 10° de R. 351-12, l'activité partielle, « au titre des
      périodes d'activité partielle courant à compter du 1er mars 2020 pour les
      pensions de vieillesse prenant effet à compter du 12 mars 2020 » (article 3 du
      décret) : le modèle n'a pas de motif d'activité partielle, et ses limites ne
      bougent pas
  nee_de: LEGIARTI000028751938
  bornes:
    liquidation.date_effet: [2014-04-01, 2023-09-01]
  contenu:
    droit: >-
      « 2° Les périodes comptées comme périodes d'assurance en application des 1° et 5°
      au titre de l'incapacité temporaire de l'article R. 351-12, dans la limite de
      quatre trimestres ; 3° […] des b et c du 4° de l'article R. 351-12, dans la
      limite de quatre trimestres ; 4° […] du 2° de l'article R. 351-12 ; 5° […] du 3°
      de l'article R. 351-12, dans la limite de deux trimestres ; 6° Les trimestres de
      majoration de durée d'assurance acquis au titre de l'article L. 351-6-1. »
    a_dire: >-
      « applicables aux pensions prenant effet à compter du 1er avril 2014 » (décret
      n° 2014-350, article 5) ; « 4 trimestres assimilés au titre du chômage indemnisé ;
      toutes les périodes assimilées maternité ; 2 périodes assimilées au titre de la
      perception d'une pension d'invalidité » (circulaire Cnav 2014-26 du 1er avril 2014,
      point 2.1) ; le 6°, le compte de prévention, que le modèle ne calcule pas
    parametres:
      limites:
      - {natures: [service_national], trimestres: 4}
      - {natures: [incapacite_temporaire], trimestres: 4}
      - {natures: [chomage], trimestres: 4}
      - {natures: [maternite], trimestres: null}
      - {natures: [invalidite], trimestres: 2}
      fiabilite: haute
  exemples: aucun trouvé
- id: l_assurance_des_parents_au_foyer
  statut: lue
  textes:
  - id: LEGIARTI000047634564
    article: D. 351-1-2 CSS, rédaction du décret n° 2023-436 du 3 juin 2023
    en_vigueur: 2023-09-01
    lu_le: 2026-10-19
  - id: LEGIARTI000053356011
