effet: >-
  Les départs pour carrière longue d'une carrière qui porte des périodes assimilées.
  Le modèle lisait la rédaction de 2026 à toute date d'effet : avant novembre 2012,
  il comptait quatre trimestres de chômage indemnisé, deux d'invalidité et quatre
  d'AVPF que le droit ne réputait pas cotisés, et séparait de la maladie la maternité
  qui en partageait la limite. L'ouvrier né en 1950 entré à seize ans et demi, qui a
  connu trois années de chômage indemnisé, partait à cinquante-neuf ans en février
  2009 ; il attend l'âge légal.
sources:
  lu_le: 2026-10-20
  prochaine_relecture: 2027-04-19
  a_relire:
  - >-
    RESTE HORS DU MODÈLE : le 6° du I — majoration de durée d'assurance du compte
    professionnel de prévention, que le modèle ne calcule pas — ; la part du 7° qui vise
    les fonctionnaires affiliés à un régime spécial, qu'il ne distingue pas ;
    l'activité partielle (10° de R. 351-12, depuis la rédaction de 2021), qui n'a pas
    de motif ; et la rédaction propre aux artisans et aux commerçants, que le VI de
    D. 634-1 pose depuis le décret n° 2012-847 (« Les 2° et 3° du I de l'article
    D. 351-1-2 sont remplacés […] »), qu'aucune session n'a lue en entier.
  - >-
    TRANCHÉ LE 20 OCTOBRE 2026 : l'article D. 351-1-3 pose la condition de DÉBUT
    D'ACTIVITÉ sur une « durée d'assurance d'au moins cinq trimestres », et la Cnav y
    compte « les périodes de cotisations à l'assurance vieillesse obligatoire ou volontaire
    […] ainsi que les périodes assimilées » (circulaire n° 2003-46, point 113 ; n° 2023-14
    et n° 2026-29, point 1.1.4). Le modèle, qui n'y comptait que les trimestres cotisés,
    les compte désormais tous (fiche carriere_longue) ; cette fiche-ci, qui ne dit que la
    durée cotisée, n'en change pas.
  - >-
    LES EXEMPLES ne se rejouent pas : ceux de la circulaire 2012-60 (point 32, deux
    assurées mères de trois et de cinq enfants) et les trois du point 1.2 de la
    circulaire 2026-29 mêlent, dans une même année, des trimestres cotisés et des
    périodes assimilées de nature différente, et retiennent la combinaison la plus
    favorable, quand une carrière du modèle ne porte qu'un motif par année.
  - >-
    JURISPRUDENCE À CONFRONTER : la Cour de cassation juge la limite de quatre trimestres
    du service national (1° de D. 351-1-2) incompatible avec l'article 14 de la
    Convention européenne des droits de l'homme et l'article 1er de son premier
    protocole pour l'objecteur de conscience, dont le service civil durait deux fois le
    service militaire : trois trimestres de plus réputés cotisés pour un service civil du
    1er décembre 1975 au 31 décembre 1977 (deuxième chambre civile, 20 septembre 2018,
    n° 17-21.576, publié au bulletin ; déjà le 9 novembre 2017, n° 16-23.784). La
    circulaire Cnav n° 2026-29 du 4 septembre 2026 ne fait aucune exception : les périodes
    assimilées du service national (6° de R. 351-12) sont réputées cotisées « dans limite
    de quatre trimestres sur l'ensemble de la carrière » — la coquille est dans le texte —,
    et se comptent de date à date « quelle que soit leur nature » (point 1.2.3.1, comme au
    point 11231 de la circulaire n° 2003-46). La doctrine publiée de la caisse n'a donc pas
    repris les deux arrêts ; le modèle, qui ne connaît pas le service civil, s'en tient à
    la circulaire.
  lectures:
  - type: legifrance
    reference: >-
      D. 351-1-2 CSS, ses six rédactions dans l'index LEGI du dépôt, à jour du
      18 octobre 2026 : LEGIARTI000006736522 (31 octobre 2003), LEGIARTI000026139944
      (1er novembre 2012), LEGIARTI000028751938 (1er avril 2014), LEGIARTI000043506391
      (16 mai 2021), LEGIARTI000047634564 (1er septembre 2023), LEGIARTI000053356011
      (1er janvier 2026), comparées clause par clause
    date: 2026-10-19
  - type: legifrance
    reference: >-
      R. 351-12 CSS, LEGIARTI000006750030 (2004 à 2011) pour les renvois des deux
      premières rédactions — 1° maladie, 2° accouchement, 3° invalidité, 5° accident
      du travail — et LEGIARTI000054425288 pour les suivantes : 4° b et c chômage
      indemnisé, d chômage NON indemnisé, 10° activité partielle
    date: 2026-10-19
  - type: jorf
    reference: >-
      les dates d'application des décrets, lues dans l'index JORF du dépôt : n°
      2003-1036, pensions prenant effet « postérieurement au 31-12-2003 » ; n° 2012-847,
      article 14 ; n° 2014-350, article 5 ; n° 2023-436, article 9
    date: 2026-10-19
  - type: circulaire_cnav
    reference: >-
      2003-46 du 18 novembre 2003, points 1123 à 11233 ; 2012-60 du 4 septembre 2012,
      point 3 ; 2014-26 du 1er avril 2014, points 1 à 3 ; 2023-14 du 10 juillet 2023,
      points 1.2.4 et 1.2.5 ; 2026-29 du 4 septembre 2026, points 1.2.3.1 à 1.2.3.7 ; lues
      sur legislation.lassuranceretraite.fr
    date: 2026-10-19
  - type: circulaire_cnav
    reference: >-
      2003-46 du 18 novembre 2003, point 113, et 2026-29 du 4 septembre 2026, points
      1.1.4 et 1.2.3.1, relus le 20 octobre 2026 : le début d'activité compte les
      périodes assimilées ; celles du service national, comptées de date à date « quelle
      que soit leur nature », sont réputées cotisées dans la limite de quatre trimestres,
      sans exception pour l'objecteur
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2026_29_04092026.pdf
    date: 2026-09-04
textes_a_rattacher:
- reference: D. 351-1-1 CSS
- reference: D. 351-1-2-1 CSS
- reference: D. 634-1 CSS, VI
code:
  python: >-
    scenarios/actuel.py : CarriereLongue, CarriereLongue.cotises_reputes,
    CarriereLongue._reputes_assimiles, CarriereLongue.fiches
  javascript: >-
    moteur/js/regimes.js : CarriereLongue, CarriereLongue.cotisesReputes,
    CarriereLongue.reputesAssimiles
  parametres: >-
    contenu.parametres de chaque version : limites, fiabilite
  tests: [tests/test_simulateur.py]
  moteur: >-
    CarriereLongue lit cette fiche (FICHE_DES_REPUTES) ; le champ reputes_cotises_nature
    de la carrière (carriere.py, donnees/chargement.py, moteur/js/carriere.js) dit la
    nature des périodes réputées cotisées. Le paquet du site porte ses versions
    (versions_des_fiches).
historique:
- >-
  2026-09-22 — portée : les six enveloppes de la rédaction de 2026 en table, motif par
  motif, dans `periodes_non_travaillees.csv`, consommées dans l'ordre de la carrière.
  Une seule année de chômage indemnisé suffisait à fermer un départ que le droit
  ouvre, et trois ans de maternité le fermaient tout autant.
- >-
  2026-10-19 — datée (action 138, étape 14) : les limites passent de la table des
  motifs aux versions de la fiche, une par rédaction qui les change, lues à la date
  d'effet ; la table ne garde que la nature de chaque motif.
