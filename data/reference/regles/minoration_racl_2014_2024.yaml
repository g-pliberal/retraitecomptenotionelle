schema_version: 1
id: minoration_racl_2014_2024
intitule: >-
  Minoration du RACL, du 1er janvier 2014 à l'arrêté du 13 mai 2025 : 5 % par année
  manquante jusqu'à l'âge du taux plein pour les adhérents nés à compter de 1955, 6 % par
  année d'anticipation avant soixante-cinq ans pour ceux nés avant 1953, un tableau pour
  1953 et 1954 ; la durée d'assurance n'ouvre pas le taux plein, que seuls l'âge,
  l'inaptitude et la qualité d'ancien déporté ou interné ouvrent. Le régime rejoint ensuite
  la règle des deux autres régimes de l'IRCEC.
etat: approchee
etape: liquider_chaque_regime
effet: >-
  Les auteurs et compositeurs lyriques partis avant l'âge du taux plein, de 2014 à mai 2025.
  Nés à compter de 1955, le moteur suit l'article 21 : 5 % par année manquante jusqu'à
  soixante-sept ans, une année entamée comptant entière comme dans le tableau de l'annexe,
  et la durée d'assurance n'en dispense pas ; 25 % à soixante-deux ans. Trois écarts. Nés
  avant 1953, le texte retire 6 % par année d'anticipation avant soixante-cinq ans, le
  moteur 5 % par année avant l'âge d'annulation de la décote de leur génération : parti à
  soixante-quatre ans en 2014, un adhérent né en 1950 perd 6 %, et le moteur lui retire 5 % ;
  parti à soixante-deux ans en 2014, un adhérent né en 1952 perd 18 %, et le moteur lui
  retire 20 %. Nés en 1953 et 1954, le tableau de l'annexe n'est pas porté : non mesuré. Et
  le moteur passe à la règle de 2025 au 1er janvier, quand l'arrêté du 13 mai 2025, publié
  le 15, n'a pas de date d'effet propre : les pensions de janvier à mai 2025 relevaient
  encore de celle-ci ; non mesuré. Reste un doute : pour les générations 1955 et suivantes,
  la colonne « 1955 ET APRÈS » de l'annexe de 2013 chiffre 2,5 % par année les deux
  premières, 20 % à cinq ans, contre 25 % à l'article ; si la caisse l'a suivie jusqu'à son
  abrogation en mai 2024, le moteur retire cinq points de trop à soixante-deux ans.
sources:
  lu_le: 2026-09-27
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Trancher, pour les liquidations du RACL de 2014 à mai 2024 des générations 1955 et
    suivantes, entre l'article 21, « 5 % par année manquante », et la colonne « 1955 ET
    APRÈS » de l'annexe, 2,5 % par année les deux premières, par ce que l'IRCEC publie déjà
    : un guide ou une page d'avant 2024, un rapport, un exemple chiffré. Ses guides de
    2021, 2023 et 2025 ne publient pas le taux du RACL, et l'Internet Archive n'a pas
    répondu le 27 septembre 2026. Sans solliciter la caisse (docs/architecture.md, § 3.5).
  - >-
    Après la phase 7 : servir 6 % par année d'anticipation avant soixante-cinq ans aux
    générations nées avant 1953, et le tableau de l'annexe de 2013 aux générations 1953 et
    1954 ; passer à la règle de 2025 à la publication de l'arrêté du 13 mai 2025, et non au
    1er janvier.
  - >-
    Après la phase 7 : dans la note de la période 2014-2024 d'ircec_racl, l'annexe ne porte
    pas « 2,5 % la première année » mais 2,5 % pour chacune des deux premières (« 2,50 % »
    d'un à quatre trimestres, « 5 % » de cinq à huit) ; et docs/limites.md, où la note
    renvoie, ne décrit pas les générations nées avant 1955.
  lectures:
  - type: jorf
    reference: >-
      arrêté du 21 novembre 2013 (JORFTEXT000028253994), annexe II, article 21 du règlement
      du RACL (JORFARTI000028254004) ; article 2 (JORFARTI000028254000) : « Le présent
      arrêté entre en vigueur le 1er janvier 2014 ». Taux plein « à partir de l'âge prévu à
      l'article L. 161-17-2 du code de la sécurité sociale augmenté de cinq ans », ou dès cet
      âge pour l'adhérent « reconnu inapte au travail par le régime général des travailleurs
      salariés » et pour les anciens déportés ou internés ; sinon minoration « à partir de
      l'âge prévu à l'article L. 161-17-2 » : « pour les adhérents nés antérieurement au 1er
      janvier 1953, le coefficient de minoration est égal à 6 % par année d'anticipation
      entre la date d'effet de la pension pour un départ en retraite à l'âge de 65 ans et à
      la date de prise d'effet de la pension » ; pour 1953 et 1954, « Le tableau joint en
      annexe » ; « pour les adhérents nés à compter du 1er janvier 1955, le coefficient de
      minoration est égal à 5 % par année manquante entre la date d'effet de la liquidation
      pour un départ à l'âge du taux plein et la date de prise d'effet de la pension ».
      L'annexe, par trimestre d'anticipation : colonne « 1952 ET AVANT », 6 % d'un à quatre
      trimestres jusqu'à 30 % de dix-sept à vingt ; colonne « 1955 ET APRÈS », 2,50 %, 5 %,
      10 %, 15 % et 20 %. C'est la lecture de la fiche minoration_ircec (22 septembre 2026),
      vérifiée mot pour mot. L'arrêté n'est pas dans l'index LEGI. Lu dans l'index JORF du
      dépôt
    date: 2026-09-27
  - type: jorf
    reference: >-
      arrêté du 17 avril 2024 (JORFTEXT000049490787), annexe III (JORFARTI000049490796),
      Journal officiel du 2 mai 2024, sans date d'effet propre. À l'article 21 du RACL, « à
      l'article L. 161-17-2 du code de la sécurité sociale augmenté de cinq ans » devient
      « au 1° de l'article L. 351-8 du code de la sécurité sociale » ; « Les deuxième et
      troisième alinéas du b sont supprimés », ainsi que les mots « Pour les adhérents nés à
      compter du 1er janvier 1955, le coefficient de minoration est égal à », ce qui laisse
      des « coefficients de minoration » « fixés à » 5 % par année manquante ; « L'annexe
      intitulée : « Coefficients d'application en cas de départ en retraite avant l'âge du
      taux plein » est abrogée ». Lu dans l'index JORF du dépôt
    date: 2026-09-27
  - type: jorf
    reference: >-
      arrêté du 13 mai 2025 (JORFTEXT000051592833), annexe (JORFARTI000051592840), Journal
      officiel du 15 mai 2025, sans date d'effet propre : l'article 21 du RACL reçoit « 2,5 %
      par année pour chacune des deux premières années manquantes », le taux plein « à partir
      de l'âge prévu à l'article L. 161-17-2 du code de la sécurité sociale, dès lors que la
      pension du régime de base des travailleurs salariés est liquidée à taux plein », et
      les coefficients du régime de base « si cela est plus favorable à l'adhérent ». La
      règle de la fiche s'arrête là. Lu dans l'index JORF du dépôt
    date: 2026-09-27
  - type: autre
    reference: >-
      IRCEC, Guide de la retraite des artistes-auteurs 2021, pages du RACL : « La pension
      RACL se liquide à compter de l'âge du taux plein (voir tableau page 28), ce qui peut
      entraîner une différence entre l'âge de liquidation au régime général et au RACL » ;
      taux plein dès l'âge d'ouverture « en cas d'inaptitude au travail reconnue par le
      régime général des travailleurs salariés et pour les anciens combattants » ; « Le
      coefficient de minoration est définitif », sans taux ; soixante-sept ans pour les
      générations 1955 et suivantes. Le RAAP, lui, publie sa fourchette : « La minoration
      définitive peut être comprise entre 2,5 % et 20 % ». Même texte dans le guide 2023
      (https://www.ircec.fr/wp-content/uploads/2023/02/guideircec2023_rgaa.pdf)
    url: https://www.ircec.fr/wp-content/uploads/2021/02/guide-ircec-2021.pdf
    date: 2026-09-27
  - type: autre
    reference: >-
      IRCEC, Guide de la retraite 2025, déposé en mars 2025 selon son adresse, avant
      l'arrêté du 13 mai 2025 : « La pension RACL se liquide à compter de l'âge du taux plein
      (voir tableau page 27), ce qui peut entraîner une différence entre l'âge de liquidation
      au régime général et au RACL » ; « Le coefficient de minoration est définitif », sans
      taux ; soixante-sept ans pour les générations 1962 et suivantes
    url: https://www.ircec.fr/wp-content/uploads/2025/03/guide-ircec-2025-accessible.pdf
    date: 2026-09-27
