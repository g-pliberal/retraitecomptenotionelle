approximations:
- version: [soixante_pour_cent_et_participation, convention_unedic_agirc_arrco]
  ecart: >-
    Le compte porte 60 % de la cotisation qu'une année travaillée porterait sur le salaire
    entier, comme le disent les textes jusqu'en 2018. Depuis 2019, la convention assied
    les cotisations « sur 60 % du salaire journalier de référence », sans dire si les
    tranches se découpent sur le salaire entier ou sur ses 60 % : le compte garde la
    première lecture, celle des conventions d'avant, que la convention dit prolonger
    (« dans une logique de stabilité des contributions au moment du passage au régime
    unifié ») et que les montants versés confirment, 3 322 M€ en 2018 et 3 387 M€ en 2019
    (`macro/transferts_retraite.csv`) — la seconde aurait fait tomber la part des cadres.
    La garantie minimale de points, dont l'Unédic payait un
    taux que l'Agirc fixait chaque année et que la convention de 2006 range dans la base
    de 60 %, est portée à 60 % du forfait. La participation n'est pas réduite quand elle
    ferait tomber l'allocation sous son minimum, et les annexes VIII et X, à 0,93 %, ne
    sont pas distinguées. L'avenant n° 10 du 24 juillet 1992, agréé le 17 août 1992, ne
    date pas le précompte de 1,2 % : il est pris au 1er août 1992 ; celui de 3 %, au 1er
    janvier 2003, la date que l'avenant n° 5 donne au taux des contributions.
  effet: non mesuré
- version: [remboursement_des_pensions]
  ecart: >-
    Avant 1990 à l'Arrco et 1996 à l'Agirc, l'Unédic remboursait des pensions au lieu de
    cotiser : le compte y porte la règle d'après, à rebours, comme le propriétaire l'a
    tranché le 2 octobre 2026.
  effet: non mesuré
- version: [soixante_pour_cent_et_participation, convention_unedic_agirc_arrco]
  ecart: >-
    Pour la solidarité, l'État verse « 70 % des cotisations aux régimes complémentaires
    relatives aux périodes de préretraite ou de chômage » depuis 1999 et a remboursé celles
    d'avant (Sénat, rapport n° 382, 2000-2001) ; la convention du 23 mars 2000, annexe 2 du
    titre VII du guide, que Common Crawl n'a capturée dans aucune de neuf collections de
    2016 à 2019, n'est pas lue, ni celle du 5 juillet 2021 qui la remplace. Ce que l'État
    versait était une somme globale — 441 M€ pour 2001, indexée sur les prix —, puis des
    sommes qui suivent les allocataires, de 256 M€ pour 2020 à 202 M€ pour 2023. Le compte
    en porte, par allocataire, 70 % de la cotisation au taux que l'État finance, taux
    d'appel compris et sans garantie minimale, pour toute année de solidarité depuis 1984 ;
    l'Ircantec, sans taux de solidarité, en reçoit 70 % de la cotisation d'une année
    travaillée.
  effet: non mesuré
sources:
