  nee_de: LEGIARTI000023023951
  bornes:
    liquidation.date_effet: [2011-01-01, null]
  contenu:
    droit: >-
      « le fonctionnaire civil et le militaire ayant accompli quinze années de services
      civils ou militaires effectifs avant le 1er janvier 2012 et parent à cette date
      de trois enfants vivants, ou décédés par faits de guerre, conserve la
      possibilité de liquider sa pension par anticipation à condition d'avoir, pour
      chaque enfant, interrompu ou réduit son activité » (article 44, III), quand le
      3° de L. 24 ne vise plus, depuis le 1er juillet 2011, que le parent d'un enfant
      invalide. Pour la durée (article 5, VI, de la loi n° 2003-775) et la décote
      (article 66, II et III), « l'année prise en compte est celle au cours de laquelle
      ils atteignent l'âge prévu au dernier alinéa du I de l'article 5 de la loi n°
      2003-775 […] ou, le cas échéant, l'âge prévu au I de l'article 22 de la présente
      loi » — soixante ans, ou cinquante-sept et cinquante-deux ans aux catégories
      active et super-active ; « Si cet âge est atteint après 2019, le coefficient de
      minoration applicable est celui prévu au I de l'article L. 14 » ; « Lorsque la
      durée de services et bonifications correspondant à cette année n'est pas fixée,
      la durée exigée est celle correspondant à la dernière génération pour laquelle
      elle a été fixée » (article 44, IV). La CNRACL et le FSPOEIE de même (décret n°
      2003-1306, article 65-2 ; décret n° 2004-1056, article 50-2, décret n° 2010-1741).
    conditions: >-
      L'ancien calcul, l'année des conditions réunies, demeure : « 1° Aux demandes
      présentées avant le 1er janvier 2011, sous réserve d'une radiation des cadres
      prenant effet au plus tard le 1er juillet 2011 ; 2° Aux pensions des
      fonctionnaires civils et des militaires qui, au plus tard le 1er janvier 2011,
      sont à moins de cinq années ou ont atteint l'âge d'ouverture des droits à pension
      applicable avant l'entrée en vigueur de la présente loi », qui « conservent le
      bénéfice des dispositions de l'article L. 17 […] dans leur rédaction antérieure
      » : le minimum garanti sans condition de durée ni d'âge.
    beneficiaire: >-
      l'un ou l'autre parent, après une interruption ou une réduction d'activité pour
      chaque enfant ; la mère, par présomption
    parametres:
      existe: true
      regimes: [fonction_publique_etat, cnracl, fspoeie]
      beneficiaire: mere
