      conditions_reunies_avant: 2012-01-01
      calcul: loi_du_9_novembre_2010
      ancien_calcul_jusqu_a: 2011-07-01
      ancien_calcul_a_moins_de: 5
      ancien_calcul_au: 2011-01-01
      ages_avant_la_loi: {sedentaire: 60, active: 55, super_active: 50}
      ages_de_l_annee_retenue: {sedentaire: 60, active: 57, super_active: 52}
      fiabilite: moyenne
