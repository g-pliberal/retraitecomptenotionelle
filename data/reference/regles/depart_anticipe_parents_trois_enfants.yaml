schema_version: 1
id: depart_anticipe_parents_trois_enfants
intitule: >-
  Le fonctionnaire parent de trois enfants qui a quinze ans de services liquide sa
  pension à tout âge (L. 24, I, 3°, du code des pensions), à la durée requise et au
  barème de décote de l'année où il réunit ces conditions (loi n° 2003-775, article
  66, II et III). Depuis la loi du 9 novembre 2010, seul le garde celui qui les réunit
  avant le 1er janvier 2012, et il prend la durée et la décote de l'année de ses soixante
  ans, ou de l'âge de sa catégorie active, sauf s'il était au 1er janvier 2011 à moins
  de cinq ans de son âge d'ouverture, ou avait demandé sa pension avant cette date
  pour partir au plus tard le 1er juillet 2011 (article 44, III et IV).
domaine: depart_anticipe
regimes:
- fonction_publique_etat
- cnracl
- fspoeie
etape: ouvrir_le_droit
face: droit
etat: approchee
lit:
- le sexe de l'assurée, qui présume l'interruption d'activité
- la naissance de chaque enfant, déclarée ou présumée
- les années servies dans les statuts que les trois régimes du code des pensions
  pensionnent, jusqu'à la liquidation (Carriere.date_de_service)
- le classement de l'emploi, sédentaire, actif ou super-actif, et la pension militaire
  (droit/ouvrir.py, derogation_active, droit_militaire)
- l'année de naissance
- liquidation.date_effet
ecrit:
- l'âge où le droit s'ouvre, celui des conditions réunies, s'il précède l'âge légal
  ou celui de la catégorie active
- l'année à laquelle se lisent la durée requise et le barème de décote
- le minimum garanti d'avant la loi du 9 novembre 2010, à qui garde l'ancien calcul
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/ouvrir.py, `depart_parent_trois_enfants`, et son jumeau) lit :
# `regimes`, ceux qui servent ce départ ; `beneficiaire`, `mere` seul connu —
# l'interruption d'activité présumée de la mère seule — ; `enfants` et
# `services_requis_annees`, les deux conditions ; `conditions_reunies_avant`, la
# date avant laquelle elles doivent l'être, ou rien ; `calcul`, l'année de la
# durée et de la décote : `annee_des_conditions`, ou `loi_du_9_novembre_2010`,
# qui lit alors `ancien_calcul_jusqu_a` (IV, 1° : la date d'effet au plus tard),
# `ancien_calcul_a_moins_de` et `ancien_calcul_au` (IV, 2° : à moins de tant
# d'années de l'âge d'ouverture, à cette date), `ages_avant_la_loi` (cet âge,
# par classement) et `ages_de_l_annee_retenue` (l'âge dont l'année est retenue,
# par classement : le dernier alinéa du I de l'article 5 de la loi n° 2003-775,
# puis le I de l'article 22 de la loi n° 2010-1330). Un bénéficiaire, un calcul
# ou un classement que le moteur ne connaît pas l'arrête.
