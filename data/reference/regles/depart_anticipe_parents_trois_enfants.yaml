approximations:
- version: [loi_du_30_decembre_2004, loi_du_9_novembre_2010]
  ecart: >-
    L'interruption ou la réduction d'activité pour chaque enfant est présumée de la
    mère, que son congé de maternité, ou l'absence de cotisation à la naissance,
    suffit à lui donner (R. 37) ; le père, qui ne la remplit que par un congé parental,
    une disponibilité ou un temps partiel, n'y a jamais droit.
  effet: non mesuré ; les pères qui ont pris deux mois de congé parental pour chacun
- ecart: >-
    Les enfants comptent à leur naissance, tous vivants ; ceux que L. 18, II, assimile
    — adoptés, du conjoint, recueillis et élevés neuf ans — et le départ du parent d'un
    enfant invalide à 80 % ne sont pas saisis.
  effet: non mesuré
- ecart: >-
    Le militaire n'en reçoit rien : sa pension s'ouvre à sa durée de services, et le
    départ de l'officier parent de trois enfants (L. 24, II, 1° bis, puis l'article 44,
    III) n'est pas servi ; l'âge de l'article L. 4139-16 du code de la défense, qui
    décide de son ancien calcul, n'est pas lu.
  effet: non mesuré ; les officiers partis avant vingt-cinq, puis vingt-sept ans de services
- version: [loi_du_9_novembre_2010]
  ecart: >-
    Le classement qui décide de l'âge — soixante ans, cinquante-cinq ou cinquante — est
    celui que l'agent remplit à sa liquidation (dix-sept ans de services actifs, vingt-sept
    en super-active), non celui qu'il remplissait au 1er janvier 2011 ; et la date de la
    demande n'est pas saisie : la pension qui prend effet au plus tard le 1er juillet 2011
    la présume faite avant 2011.
  effet: non mesuré
- ecart: >-
    Les quinze ans se comptent à l'année, sur les années servies dans les statuts des
    trois régimes du code des pensions, comme la coordination les compte.
  effet: non mesuré
presomptions:
  interruption_d_activite_par_la_mere: >-
    la condition d'interruption ou de réduction d'activité pour chaque enfant, depuis
    la loi du 30 décembre 2004
  naissance_des_enfants: >-
    la naissance de chaque enfant dont la date n'est pas déclarée, qui date le troisième
    et le compare au 1er janvier 2012
  demande_de_pension_avant_2011: >-
    la demande présentée avant le 1er janvier 2011, qui garde l'ancien calcul à la
    pension prenant effet au plus tard le 1er juillet 2011
sources:
  lu_le: 2026-10-08
  prochaine_relecture: 2027-04-30
  lectures_divergentes:
  - >-
    Destinie 2 (src/Legislation.cpp, au commit 4c1d34b) lit la durée et la décote du
    nouveau calcul à l'année où la mère atteint l'âge d'ouverture de sa génération —
    soixante ans et quatre mois à soixante-deux ans —, quand l'article 44, IV, et
    l'article 65-2 du décret de la CNRACL disent l'âge du dernier alinéa du I de
    l'article 5 de la loi n° 2003-775, soixante ans, qui est aussi l'âge dont l'année
    fixe la durée des fonctionnaires (VI du même article) ; la note du SE-UNSA du
    12 novembre 2010 écrit « un âge d'ouverture des droits correspondant à la date de
    naissance ». Le modèle suit le texte. Les deux lectures ne diffèrent que de l'âge
    d'annulation de la décote, de un à quatre trimestres, pour les nés de 1956 à 1959.
  - >-
    Destinie 2 ne sert aucune décote à la mère qui garde l'ancien calcul (« jamais de
    décote pour les mères de trois enfants ») ; l'article 66, III, lui oppose celle de
    l'année des conditions, nulle jusqu'en 2005, de 0,125 % à 0,75 % par trimestre de
    2006 à 2011.
  a_relire:
  - >-
    Chercher un exemple chiffré publié par le service des retraites de l'État ou la
    CNRACL — la circulaire d'application de l'article 44, ou une page d'information —,
    pour le rejouer.
  - >-
    Les régimes spéciaux qui ont eu leur départ des parents de trois enfants, éteint
    par leurs décrets de 2008 à 2011 avec leurs propres transitions (clercs de notaires,
    décret n° 2011-1112 ; Comédie-Française, décret n° 2011-1134 ; SNCF, RATP, IEG,
    Banque de France, Opéra), restent à lire.
  lectures:
  - type: legifrance
    reference: >-
      L. 24 du code des pensions, ses sept rédactions de 1982 à 2012 (LEGIARTI000006362725
      à LEGIARTI000023033603) ; R. 37, ses douze rédactions depuis 2005
      (LEGIARTI000006362957 à LEGIARTI000054175249)
    date: 2026-06-01
  - type: legifrance
    reference: >-
      loi n° 2010-1330 du 9 novembre 2010, article 44 (LEGIARTI000023023951, en vigueur)
      et article 22 (LEGIARTI000025014563) ; loi n° 2003-775, article 5, ses rédactions
      de 2010, 2014 et 2017 (le dernier alinéa de son I : « l'espérance de vie à l'âge de
      soixante ans »), et article 66 (LEGIARTI000006758610)
    date: 2017-01-01
  - type: legifrance
    reference: >-
      décret n° 65-773, article 21 (LEGIARTI000006368228 à LEGIARTI000006368234) ;
      décret n° 2003-1306, articles 25 et 65-2 (LEGIARTI000023395017) ; décret n°
      2004-1056, articles 21 et 50-2 (LEGIARTI000023395028)
    date: 2011-01-01
  - type: jorf
    reference: >-
      décret n° 2010-1741 du 30 décembre 2010 (JORFTEXT000023334792), articles 1er à 4 :
      R. 37 étendu à la réduction d'activité, articles 65-2 et 50-2 insérés
    date: 2010-12-31
  - type: autre
    reference: >-
      réponse ministérielle à la question écrite n° 97363 (13e législature), JO du 5
      juillet 2011, p. 7181 : « Un agent qui souhaite partir de manière anticipée se
      verra appliquer les mêmes règles que les agents de sa génération » ; à qui a
      demandé sa pension avant 2011 pour partir au plus tard le 1er juillet 2011, « Les
      règles appliquées sont celles de l'année où ils ont réuni les deux conditions
      d'ancienneté (quinze ans) et de parentalité (trois enfants), avec attribution
      éventuelle du minimum garanti de pension » ; de même à qui était, au 1er janvier
      2011, à moins de cinq ans de son âge d'ouverture, « sans limitation de durée »
    url: https://www.assemblee-nationale.fr/dyn/13/questions/QANR5L13QE97363
    date: 2011-07-05
  - type: autre
    reference: >-
      service-public, « Un fonctionnaire ayant 3 enfants peut-il encore partir à la
      retraite tôt ? », reprise par justice.fr, mise à jour du 23 janvier 2026 : les
      conditions réunies « au plus tard le 31 décembre 2011 », la demande « à tout
      moment » ; deux mois d'interruption, ou quatre, cinq ou sept mois à 50, 60 ou 70 %
    url: https://www.justice.fr/fiche/fonctionnaire-ayant-3-enfants-encore-partir-retraite-tot
    date: 2026-01-23
