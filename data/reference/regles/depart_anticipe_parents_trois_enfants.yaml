historique:
- >-
  2026-10-08 — née de l'étape 17 de l'action 138, sur le point de Destinie 2 au registre
  (chantier 138.17) : le modèle ne servait ce départ à personne, et opposait à la mère
  de trois enfants partie avant soixante ans un droit « non ouvert ».
reformes:
- fillon_2003
- woerth_2010
effet: >-
  La mère de trois enfants fonctionnaire qui avait quinze ans de services avant 2012 :
  son droit s'ouvre à la date où elle réunit les conditions, à tout âge. Née avant 1956
  (1961 en catégorie active), ou partie au plus tard en juillet 2011, elle garde la durée
  et la décote de cette année-là — 150 trimestres et aucune décote si c'est avant 2004
  — et le minimum garanti d'avant 2011 ; née depuis, elle a la durée de la génération
