schema_version: 1
id: age_surcote_sncf_ratp
intitule: >-
  La surcote de la SNCF et de la RATP ne compte que les trimestres cotisés et effectués
  après le 1er juillet 2008 au-delà d'un âge propre : soixante ans jusqu'au 20 mars 2011 ;
  puis l'âge légal de soixante-deux ans, abaissé à soixante ans pour les nés avant 1957 et
  relevé de quatre mois par génération ; pour les pensions de 2025 et après, de trois mois
  par génération à compter de 1963, jusqu'à soixante-quatre ans à compter de 1970.
domaine: decote_surcote
regimes: [ratp, sncf]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- la génération de l'agent
- la date d'effet de sa pension, qui sépare les règles de 2008, de 2011 et de 2025
ecrit:
- >-
  l'âge au-delà duquel les trimestres cotisés et effectués après le 1er juillet 2008
  comptent en surcote (II de l'article 13 du décret n° 2008-639, II de l'article 24 du
  décret n° 2008-637), que `trimestres_de_surcote_regimes_speciaux` compte
dates_qui_decident:
- liquidation.date_effet
versions:
- id: reglements_d_avant_2008
  statut: supposee
  hypothese: >-
    les pensions qui prennent effet avant le 1er juillet 2008 relèvent des règlements de
    retraite des deux entreprises, que les index du dépôt ne portent pas : la fiche ne leur
    prête pas de surcote, que les décrets du 30 juin 2008 créent, et qui ne compte que des
    trimestres « effectués après le 1er juillet 2008 »
  fiabilite: haute, la surcote des deux décrets ne pouvant rien compter avant cette date
  textes:
  - {id: LEGIARTI000019108313, article: "décret n° 2008-639 (SNCF), article 13, II", en_vigueur: 2008-07-01, publie_le: 2008-07-01}
  - {id: LEGIARTI000019104847, article: "décret n° 2008-637 (RATP), article 24, II", en_vigueur: 2008-07-01, publie_le: 2008-07-01}
  bornes:
    liquidation.date_effet: [null, 2008-07-01]
  contenu:
    parametres:
      ages_de_surcote: null
    droit: aucun coefficient de majoration
    conditions: >-
      le modèle n'a pas de surcote sur sa période d'avant 2009
  exemples: aucun trouvé
- id: soixante_ans
  statut: lue
  textes:
  - {id: LEGIARTI000019108313, article: "décret n° 2008-639 (SNCF), article 13, II", en_vigueur: 2008-07-01, publie_le: 2008-07-01}
  - {id: LEGIARTI000020085562, article: "même article", en_vigueur: 2009-01-01}
  - {id: LEGIARTI000019104847, article: "décret n° 2008-637 (RATP), article 24, II", en_vigueur: 2008-07-01, publie_le: 2008-07-01}
  - {id: LEGIARTI000020085589, article: "même article", en_vigueur: 2009-01-01}
  nee_de: LEGIARTI000019108313
  bornes:
    liquidation.date_effet: [2008-07-01, 2011-03-21]
  contenu:
    parametres:
      ages_de_surcote: {1900: 60}
    droit: >-
      « Lorsque la durée d'assurance, définie au III ci-après, est supérieure au nombre de
      trimestres nécessaires pour obtenir le pourcentage maximum de la pension mentionné à
      l'article 12, sans être inférieure à cent soixante trimestres, et que l'agent a
      atteint l'âge de soixante ans, un coefficient de majoration s'applique » ; « Le nombre
      de trimestres pris en compte pour ce calcul est égal, à la date de liquidation de la
      pension, au nombre de trimestres d'assurance au sens du III ci-après, cotisés et
      effectués après le 1er juillet 2008, au-delà de l'âge de soixante ans et en sus du
      nombre de trimestres mentionné à l'alinéa précédent » (SNCF, article 13, II ; RATP,
      article 24, II, mot pour mot à « l'assuré » près)
    conditions: >-
      le taux est « celui prévu pour les fonctionnaires de l'Etat en application du III de
      l'article L. 14 du code des pensions civiles et militaires de retraite », par
      trimestre « dans la limite de vingt trimestres » ; depuis la rédaction du 1er janvier
      2009, seuls comptent les trimestres entiers cotisés
  exemples: aucun trouvé
