  nee_de: JORFARTI000023728746
  bornes:
    liquidation.date_effet: [2011-03-21, 2025-01-01]
  contenu:
    parametres:
      ages_de_surcote: {1900: 60, 1957: 60.33, 1958: 60.67, 1959: 61, 1960: 61.33, 1961: 61.67, 1962: 62}
    droit: >-
      la surcote court au-delà de « l'âge mentionné au premier alinéa de l'article
      L. 161-17-2 du code de la sécurité sociale » (SNCF, article 13, II), soixante-deux
      ans ; « L'âge de soixante-deux ans mentionné au II de l'article 13 s'applique aux
      agents nés à compter du 1er janvier 1962. Pour les agents nés antérieurement à cette
      date, cet âge est abaissé : ― à soixante ans pour les agents nés avant le 1er janvier
      1957 ; ― à soixante ans et quatre mois pour les agents nés en 1957 ; [...] ― à
      soixante et un ans et huit mois pour les agents nés en 1961 » (SNCF, article 37-1,
      IV) ; à la RATP, au-delà de « l'âge mentionné au 4° de l'article 6 » (article 24, II),
      soixante-deux ans, abaissé de même (article 51-1, II, 3°), « L'âge de soixante ans
      mentionné au II de l'article 24 » évoluant ainsi (article 51-1, III, 3°)
    conditions: >-
      l'index LEGI date du 1er janvier 2017 l'article 37-1 de la SNCF, dans sa rédaction de
      2011 que celle du décret n° 2014-712 remplace avant ce jour, mais l'article 18 du
      décret n° 2011-291 ne reporte que son V : son IV vaut dès le 21 mars 2011, comme le
      calendrier de la RATP ; aucun agent ne pouvait d'ailleurs atteindre avant 2017 un âge
      que le IV relève, soixante ans et quatre mois pour les nés en 1957. Depuis le
      1er janvier 2017, la limite de vingt trimestres tombe, et les bonifications et
      majorations de durée autres que pour enfants et handicap ne comptent plus. La
      CPRPSNCF écrit soixante ans pour le cas général né de 1953 à 1956, soixante ans et
      quatre mois pour 1957, soixante-deux ans pour 1962
