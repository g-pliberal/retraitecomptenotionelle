  nee_de: LEGIARTI000048240186
  bornes:
    liquidation.date_effet: [2025-01-01, null]
  contenu:
    parametres:
      ages_de_surcote: {1900: 60, 1957: 60.33, 1958: 60.67, 1959: 61, 1960: 61.33, 1961: 61.67, 1962: 62, 1963: 62.25, 1964: 62.5, 1965: 62.75, 1966: 63, 1967: 63.25, 1968: 63.5, 1969: 63.75, 1970: 64}
    droit: >-
      « L'âge de soixante-quatre ans déterminé en application du II de l'article 13
      s'applique aux agents nés à compter du 1er janvier 1970 », abaissé à soixante-deux ans
      pour les nés en 1962, soixante-deux ans et trois mois pour 1963, et de trois mois de
      plus par génération jusqu'à soixante-trois ans et neuf mois pour 1969 (SNCF,
      article 37-1, IV) ; « L'âge d'ouverture du droit à pension de soixante-quatre ans
      mentionné au 4° du II de l'article 6 s'applique aux agents nés à compter du
      1er janvier 1970 », le même calendrier (RATP, article 51-1, II, 3°)
    conditions: >-
      la suspension de 2026 n'y est pas reprise : aucun des deux décrets n'a été modifié
      depuis le 30 décembre 2025 sur ce point (index LEGI à jour de l'incrément du
      2 novembre 2026). Le IV de l'article 13 et celui de l'article 24 ouvrent en outre la
      surcote, à l'assuré qui a au moins un trimestre de majoration de durée pour enfant ou
      de bonification, sur la durée cotisée l'année qui précède l'âge légal — à la SNCF,
      celui de L. 161-17-2, à la RATP, celui du 4° du II de l'article 6 — quand cet âge est
      d'au moins soixante-trois ans : la CPRPSNCF l'écrit « surcote anticipée à 63 ans »,
      pour les nés à compter du 1er janvier 1966. La CPRPSNCF écrit soixante-quatre ans à
      compter de 1970
  exemples: aucun trouvé
approximations:
- version: [soixante_ans]
  ecart: >-
    les pensions du second semestre de 2008, que le modèle liquide sous sa période d'avant
    la réforme, n'ont pas de surcote : au plus deux trimestres, ceux d'après le 1er juillet
    2008, à 0,75 %
  effet: non mesuré
- version: [soixante_quatre_ans]
  ecart: >-
    la surcote que le IV de l'article 13 (SNCF) et le IV de l'article 24 (RATP) ouvrent,
    l'année qui précède l'âge légal quand il est d'au moins soixante-trois ans, à l'assuré
    qui a au moins un trimestre de majoration de durée pour enfant ou de bonification,
    n'est pas servie : au plus quatre trimestres, 5 % de pension
  effet: non mesuré
effet: >-
  Le modèle comptait la surcote depuis l'âge d'ouverture de la fiche — cinquante-quatre
  ans pour un agent de conduite né en 1980. Le défaut ne se voyait pas tant que
  la durée requise opposée était de 172 trimestres ; la table propre de la SNCF
  l'a fait paraître sur le témoin de l'agent né en 1975 parti à soixante-quatre
  ans avec 172 trimestres pour 170 requis, qui recevait deux trimestres de surcote
  qu'il n'a pas accomplis au-delà de soixante-quatre ans. Corrigé par `legislation/age_surcote_regimes_speciaux.csv`
  et le drapeau `age_surcote_regimes_speciaux` des deux fiches, sur toutes leurs
  périodes à surcote. Approchée depuis le 2 novembre 2026 : ni le second semestre de
  2008, ni la surcote des parents de 2025 ne sont servis.
sources:
  lu_le: 2026-11-02
  prochaine_relecture: 2027-11-02
  a_relire:
  - >-
    Le taux de la surcote : la période de 2009 à 2017 de `regimes/sncf.yaml` porte 0,75 %
    par trimestre, celle de 2009 à 2016 de `regimes/ratp.yaml` 1,25 %, sous la même phrase
    des deux décrets, « celui prévu pour les fonctionnaires de l'Etat en application du
    III de l'article L. 14 », que la rédaction du 19 décembre 2008 de L. 14
    (LEGIARTI000019959691) fixe à « 1,25 % par trimestre supplémentaire, dans la limite
    de vingt trimestres ». Et cette limite, que les deux décrets gardent jusqu'au
    31 décembre 2016, `trimestres_de_surcote_regimes_speciaux` ne la porte pas. À lire
    dans la fiche `surcote_regimes_speciaux`, pour une étape du modèle.
  lectures:
  - type: legifrance
    reference: >-
      décret n° 2008-639, article 37-1, IV en vigueur : « L'âge de soixante-quatre
      ans déterminé en application du II de l'article 13 s'applique aux agents nés
      à compter du 1er janvier 1970 », abaissé à soixante ans pour les nés avant
      1957, puis de quatre mois, puis de trois mois par génération
    date: 2026-09-22
  - type: legifrance
    reference: >-
      décret n° 2008-637, article 51-1, II, 3° en vigueur : même calendrier pour
      l'âge de soixante-quatre ans du 4° du II de l'article 6, auquel renvoie le
      II de l'article 24
    date: 2026-09-22
  - type: autre
    reference: >-
      CPRPSNCF, « Réforme des retraites 2023 » : « Pour les agents nés à partir
      de 1970, l'âge à partir duquel la surcote sera possible est fixé à 64 ans
      »
    url: https://www.cprpf.fr/2023/10/24/reforme-des-retraites-2023/
    date: 2026-09-22
  - type: legifrance
    reference: >-
      décret n° 2008-639, articles 13 et 37-1, leurs onze et quatre rédactions, et décret
      n° 2008-637, articles 6, 24 et 51-1, leurs huit, sept et quatre rédactions, dans
      l'index LEGI du dépôt à jour de l'incrément du 2 novembre 2026, confrontées d'une
      rédaction à la suivante : l'âge de la surcote change au 21 mars 2011 et pour les
      pensions de 2025 ; la rédaction de 2011 de l'article 37-1 (LEGIARTI000023732614),
      que l'index date du 1er janvier 2017 au 29 juin 2014, n'est jamais entrée en vigueur
      sous cette identité
    date: 2026-11-02
  - type: jorf
    reference: >-
      au Journal officiel par l'index JORF du dépôt : décret n° 2011-291 du 18 mars 2011,
      articles 10, 14 et 18, et décret n° 2011-292 du 18 mars 2011, articles 1er, 8, 11 et
      13 — leurs dispositions reportées au 1er janvier 2017 ne touchent pas l'âge de la
      surcote — ; décret n° 2023-967 du 20 octobre 2023, article 2, et décret n° 2023-690
      du 28 juillet 2023, article 3, III : pensions prenant effet à compter du 1er janvier
      2025
    date: 2026-11-02
  - type: autre
    reference: >-
      CPRPSNCF, « Paramètres applicables selon votre génération », agents de conduite et
      cas général, version intégrant le décret du 20 octobre 2023 : l'âge de la surcote par
      génération, soixante ans jusqu'à 1956, soixante ans et quatre mois pour 1957, jusqu'à
      soixante-trois ans et neuf mois pour 1969 et soixante-quatre ans à compter de 1970
    url: https://www.cprpf.fr/app/uploads/2023/10/tableau-age-de-la-retraite-CG-20-10-2023.pdf
    date: 2023-10-20
historique:
- >-
  2026-11-02 — lue au droit (action 130) : quatre versions sur la date d'effet — aucune
  surcote sous les règlements d'avant juillet 2008 ; soixante ans ; à compter du 21 mars
  2011, l'âge légal de soixante-deux ans abaissé par génération, soixante ans pour les nés
  avant 1957 ; pour les pensions de 2025, jusqu'à soixante-quatre ans pour 1970.
  Approchée : le second semestre de 2008 et la surcote des parents de 2025.
reformes:
- regimes_speciaux_2008
- woerth_2010
- reforme_2023
code:
  interrupteurs:
    age_surcote_regimes_speciaux: true
  moteur: >-
    `age_surcote_regimes_speciaux` : la surcote ne se compte qu'au-delà de l'âge lu dans
    `legislation/age_surcote_regimes_speciaux.csv` à l'ANNÉE DE NAISSANCE — l'âge légal
    décalé de cinq générations que les décrets de la SNCF (article 37-1, IV) et de la
    RATP (article 51-1, II, 3°) écrivent, soixante-quatre ans à compter de la génération
    1970 —, et non au-delà de l'âge d'ouverture de la période.
  python: >-
    droit/ouvrir.py : age_surcote ; droit/liquider.py : liquider_chaque_regime,
    trimestres_de_surcote_regimes_speciaux ; scenarios/actuel.py :
    AgesSurcoteRegimesSpeciaux
  javascript: >-
    moteur/js/droit/ouvrir.js : ageSurcote ; moteur/js/droit/liquider.js :
    liquiderChaqueRegime, trimestresDeSurcoteRegimesSpeciaux ; moteur/js/regimes.js :
    AgesSurcoteRegimesSpeciaux
  parametres: >-
    contenu.parametres de chaque version : ages_de_surcote ; regimes/ratp.yaml,
    regimes/sncf.yaml : age_surcote_regimes_speciaux, surcote_par_trimestre ;
    legislation/age_surcote_regimes_speciaux.csv : age
  tests: [tests/test_sncf_ratp.py, tests/test_simulateur.py, tests/js/moteur.test.js,
    tests/temoins/simulations.json]
