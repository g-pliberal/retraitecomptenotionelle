  statut: lue
  textes:
  - {id: LEGIARTI000048240186, article: "décret n° 2008-639 (SNCF), article 37-1, IV, rédaction du décret n° 2023-967, pensions prenant effet à compter du 1er janvier 2025", en_vigueur: 2023-10-22, publie_le: 2023-10-21}
