  - {id: LEGIARTI000030058926, article: "même annexe, mêmes articles", en_vigueur: 2015-01-01}
  - {id: LEGIARTI000031800065, article: "même annexe, mêmes articles", en_vigueur: 2016-01-01}
  - {id: LEGIARTI000029150204, article: "même annexe, mêmes articles", en_vigueur: 2017-01-01}
  - {id: LEGIARTI000034764555, article: "même annexe, mêmes articles", en_vigueur: 2018-01-01}
  - {id: LEGIARTI000036755043, article: "même annexe, mêmes articles", en_vigueur: 2018-03-31}
  - {id: LEGIARTI000038189976, article: "même annexe, mêmes articles", en_vigueur: 2019-03-02}
  - {id: LEGIARTI000042597001, article: "même annexe, mêmes articles", en_vigueur: 2020-12-03}
  - {id: LEGIARTI000047908882, article: "même annexe, mêmes articles", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047909955, article: "même annexe, article 45, I ter et II, rédaction du décret n° 2023-692", en_vigueur: 2025-01-01, publie_le: 2023-07-30}
  - {id: LEGIARTI000052046924, article: "même annexe, article 45, I ter et II", en_vigueur: 2025-08-06}
  nee_de: LEGIARTI000019226006
  bornes:
    ouverture_du_droit: [2010-07-01, 2025-01-01]
  contenu:
    parametres:
      majoration_de_l_age_minimum: 5
      diminution_en_trimestres: {"2010-07": 16, "2011-07": 14, "2012-07": 12, "2013-07": 11, "2014-07": 10, "2015-07": 9, "2016-07": 8, "2017-07": 7, "2018-07": 6, "2019-07": 5, "2020-07": 4, "2021-07": 3, "2022-07": 2, "2023-07": 1, "2024-07": 0}
    droit: >-
      les trimestres de décote se comptent par « la durée qui sépare l'âge auquel la
      pension est liquidée d'un âge de référence correspondant à l'âge minimum d'ouverture
      du droit à pension applicable à l'assuré majoré de cinq ans » (article 10, I, 1°) ;
      « L'âge auquel le coefficient de minoration s'annule correspond, pour la période
      comprise entre le 1er juillet 2010 et le 30 juin 2011 inclus, à l'âge de référence
      mentionné au 1° du I de l'article 10 ci-dessus diminué de seize trimestres. Pour les
      périodes postérieures au 30 juin 2011, cette diminution est réduite de deux
      trimestres au 1er juillet de chaque année jusqu'au 30 juin 2013 inclus puis d'un
      trimestre au 1er juillet de chaque année jusqu'au 30 juin 2024 inclus »
      (article 45, II)
    conditions: >-
      la diminution se lit au mois où l'agent réunit les conditions de l'article 16, comme
      le taux de la minoration ; la CNIEG l'écrit « Age minimum + 4 trimestres » pour qui
      les réunit du 1er juillet 2010 au 30 juin 2011, jusqu'à « Age minimum + 20
      trimestres » du 1er juillet au 31 décembre 2024 ; l'âge minimum suit la génération
      depuis le 21 mars 2011 (`age_ouverture_ieg_actifs`) ; les treize rédactions qui
      suivent celle de 2008, jusqu'à celle du 1er septembre 2023, gardent les deux phrases
      mot pour mot. Depuis le 1er janvier 2025, le II ne réserve plus la diminution
      qu'aux « pensions prenant effet avant le 1er janvier 2025 », mais la CNIEG garde
      ces paramètres à qui a ouvert son droit plus tôt, « quelle que soit la date d'effet
      de la retraite IEG (cf art. 45 - I ter de l'annexe III) » (circulaire n° 2024/15,
      § 3) : la version les sert jusqu'au bout, comme la caisse
  exemples:
  - cnieg_decote_madame_d
  - cnieg_2024_15_monsieur_a
- id: age_minimum_majore_de_trois_ans
  statut: lue
  textes:
  - {id: LEGIARTI000047909955, article: "statut national, annexe 3, articles 10, I, 1°, et 45, II, rédaction du décret n° 2023-692", en_vigueur: 2025-01-01, publie_le: 2023-07-30}
  - {id: LEGIARTI000052046924, article: "même annexe, mêmes articles", en_vigueur: 2025-08-06}
  nee_de: LEGIARTI000047909955
  bornes:
    ouverture_du_droit: [2025-01-01, null]
  contenu:
    parametres:
      majoration_de_l_age_minimum: 3
      age_des_actifs_nes_avant_1975: 62
    droit: >-
      l'âge de référence est « l'âge minimum d'ouverture du droit à pension applicable à
      l'assuré majoré de trois ans ou, lorsque celui-ci relève du 7° de l'article 16, de
      cinq ans » (article 10, I, 1°) ; « Pour les pensions prenant effet à compter du 1er
      janvier 2025, l'âge auquel le coefficient de minoration s'annule est égal à : -
      soixante-deux ans pour les agents mentionnés au 2° du I de l'article 16 nés avant le
      1er janvier 1975 », de soixante-trois à soixante-six ans pour les agents de quatorze
      à cinq ans de services actifs nés avant 1974 à 1971, « soixante-sept ans pour les
      agents mentionnés au 1° du I de l'article 16 nés avant le 1er janvier 1970 »
      (article 45, II)
    conditions: >-
      l'actif né à compter de 1975 ouvre son droit à cinquante-neuf ans, et sa décote
      s'annule à soixante-deux ; la CNIEG écrit « Age minimum + 3 ans (sauf exceptions) »,
      « de façon à maintenir un âge d'annulation de la décote au plus tard à 67 ans » ; la
      diminution d'avant 2025 n'a plus cours ; la rédaction du 6 août 2025 ne change que
      l'article 1er
  exemples: aucun trouvé
approximations:
- version: [age_minimum_majore_de_cinq_ans, age_minimum_majore_de_trois_ans]
  ecart: >-
    l'âge de référence est celui de l'agent en services actifs, que le modèle présume
    (`age_ouverture_ieg_actifs`) : celui du sédentaire, cinq ans au-dessus, puis
    soixante-sept ans pour les nés avant 1970 depuis 2025, celui de l'agent de cinq à
    quatorze ans de services actifs, de soixante-trois à soixante-six ans depuis 2025, et
    la majoration de cinq ans de l'agent inapte du 7° de l'article 16 ne sont pas servis
  effet: non mesuré
effet: >-
  La fiche portait l'âge d'ouverture majoré de CINQ ans — 63,75 ans pour les liquidations
  de 2025-2026, 64 ans ensuite —, règle d'avant la réforme de 2023. Un agent liquidant
  à soixante-deux ans se voyait opposer sept trimestres de décote de trop, soit
  8,75 % de pension. Corrigé à soixante-deux ans. Sur le cas type des IEG, l'écart
  au système actuel passe de −23 % à −32 % pour la génération 1970 et de −38 % à
  −45 % pour celle de 2000 : le cas type des IEG devient, en tête de la page Cas
  types, la carrière la moins bien traitée par la proposition, à la place du militaire
  non officier. Et qui a ouvert son droit avant le 1er janvier 2025 garde, pour la
  CNIEG, les paramètres d'avant la réforme « quelle que soit la date d'effet de la
  retraite IEG », sur le I ter de l'article 45, quand le II du même article écrit
  soixante-deux ans pour toute pension de 2025 et après : lecture divergente, que la
  fiche `decote_regimes_speciaux` inscrit, et la hiérarchie retient la caisse. Le moteur
  retranchait la diminution de soixante-deux ans : un agent actif né en janvier 1965,
  dont le droit s'ouvre en mai 2021, parti à soixante ans en janvier 2025, perdait quatre
  trimestres de décote au lieu de deux. Il lit désormais l'âge dans la période en
  vigueur l'année où le droit s'ouvre (`age_taux_plein_a_l_ouverture`) : les agents nés
  de 1964 à 1966 partis en 2025 et après avant leur âge d'annulation perdent un à trois
  trimestres de décote de moins ; sur les témoins, celui né en 1965 parti à soixante ans
  gagne 3,2 % de pension, dont 2,6 points pour l'âge d'annulation. Les générations 1968
  et suivantes, qui ouvrent leur droit en 2025 ou après, gardent soixante-deux ans.
  Approchée depuis le 29 octobre 2026 : l'âge de référence est celui de l'agent en
  services actifs, que le modèle présume.
sources:
  lu_le: 2026-10-29
  prochaine_relecture: 2027-10-29
  lectures_divergentes:
  - >-
    Âge d'annulation des pensions de 2025 et après dont le droit s'est ouvert plus tôt : le
    II de l'article 45 (rédaction du 1er janvier 2025) réserve la diminution aux « pensions
    prenant effet avant le 1er janvier 2025 » et donne soixante-deux ans à l'actif pour les
    suivantes ; la CNIEG garde à qui a ouvert son droit avant 2025 les paramètres d'avant la
    réforme, « quelle que soit la date d'effet », sur le I ter, qui ne nomme que l'âge
    d'ouverture et la durée. La fiche suit la caisse, comme `decote_regimes_speciaux`.
  a_relire:
  - >-
    Le 7° de l'article 16 des IEG garde les cinq ans, et la fiche ne distingue pas
    cette population. La question posée ici pour la SNCF et la RATP a été menée
    le 22 septembre 2026 : voir `age_reference_decote_sncf_ratp`.
  - >-
    L'âge de référence du sédentaire et des agents de cinq à quatorze ans de services
    actifs, que le II de l'article 45 écrit depuis 2025 : à servir quand la saisie dira les
    années de services actifs de l'agent.
