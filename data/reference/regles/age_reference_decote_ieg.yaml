    date: 2026-10-29
historique:
- >-
  2026-10-29 — lue au droit (action 130) : trois versions sur le mois où le droit s'ouvre —
  aucune décote avant le 1er juillet 2010 ; l'âge minimum majoré de cinq ans, diminué de
  seize trimestres à rien de 2010 à 2024 ; l'âge minimum majoré de trois ans depuis 2025,
  soixante-deux ans pour l'actif. Approchée : l'agent est présumé en services actifs.
reformes:
- regimes_speciaux_2008
- reforme_2023
code:
  interrupteurs:
    age_taux_plein_a_l_ouverture: true
  moteur: >-
    `age_taux_plein_a_l_ouverture` : sur la période de 2025 des IEG, l'âge d'annulation se
    lit dans la période en vigueur l'année où l'agent réunit les conditions. Qui les réunit
    avant le 1er janvier 2025 garde l'âge de référence de la période de 2017 à 2024,
    l'âge d'ouverture majoré de cinq ans (`ieg_actif_2011` dans `legislation/ages_regimes.csv`),
    dont le barème des régimes spéciaux retranche la diminution de l'année ; qui les
    réunit ensuite a soixante-deux ans (`ieg_actif_2023`), sans diminution.
  python: >-
    droit/ouvrir.py : age_taux_plein, mois_ouverture_des_droits ; droit/liquider.py :
    decote_opposable, millesime_du_bareme ; scenarios/actuel.py : AgesRegimes,
    DecoteRegimesSpeciaux
  javascript: >-
    moteur/js/droit/ouvrir.js : ageTauxPlein, moisOuvertureDesDroits ;
    moteur/js/droit/liquider.js : decoteOpposable, millesimeDuBareme ;
    moteur/js/regimes.js : AgesRegimes
  parametres: >-
    contenu.parametres de chaque version : majoration_de_l_age_minimum,
    diminution_en_trimestres, age_des_actifs_nes_avant_1975 ; regimes/ieg.yaml :
    age_taux_plein, age_table, age_taux_plein_a_l_ouverture, bareme_decote ;
    legislation/ages_regimes.csv : ieg_actif_2011, ieg_actif_2023 ;
    legislation/decote_regimes_speciaux.csv : annee, trimestres_avant_limite
  tests: [tests/test_ieg.py, tests/test_simulateur.py, tests/test_oracle.py, tests/js/moteur.test.js,
    tests/temoins/simulations.json]
