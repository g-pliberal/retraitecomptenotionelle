    date: 2026-09-22
  - type: autre
    reference: >-
      CNIEG, réglementation, « Âge d'annulation de la décote » : « à compter du
      1er janvier 2025 […] âge minimum + 3 ans (sauf exceptions) », de façon à maintenir
      cet âge au plus tard à soixante-sept ans
    url: >-
      https://www.cnieg.fr/accueil/reglementation/particulier/droit-retraite/calcul/decote/age-annulation-decote.html
    date: 2026-09-22
  - type: legifrance
    reference: >-
      même annexe, même rédaction (LEGIARTI000052046924), article 45, II : « Pour les
      pensions prenant effet à compter du 1er janvier 2025, l'âge auquel le coefficient de
      minoration s'annule est égal à : - soixante-deux ans pour les agents mentionnés au 2°
      du I de l'article 16 nés avant le 1er janvier 1975 » ; I ter : l'âge d'ouverture et
      la durée des « assurés remplissant les conditions de liquidation de la pension avant
      le 1er janvier 2025 sont égaux à ceux applicables avant l'entrée en vigueur du décret
      n° 2023-692 ». Lu dans l'index LEGI du dépôt
    date: 2026-09-27
