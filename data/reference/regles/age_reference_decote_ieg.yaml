    reference: >-
      CNIEG, circulaire n° 2024/15 du 30 octobre 2024, « La décote », § 3 : « les assurés
      dont la date d'ouverture de droit est fixée jusqu'au 31 décembre 2024 bénéficient du
      maintien des paramètres en vigueur avant la réforme, quelle que soit la date d'effet
      de la retraite IEG (cf art. 45 - I ter de l'annexe III) » ; § 3.1, pour eux, l'âge
      d'annulation « Age minimum d'ouverture du droit + 4 trimestres » la première année,
      jusqu'à « + 20 trimestres » du 1er juillet au 31 décembre 2024
    url: >-
      https://www.cnieg.fr/files/live/sites/portail/files/documents/Juridique/circulaire2024/J_Circulaire2024_15_Decote.pdf
    date: 2026-09-27
  - type: legifrance
    reference: >-
      annexe 3 du statut national, ses vingt et une rédactions dans l'index LEGI du dépôt à
