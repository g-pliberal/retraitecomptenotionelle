schema_version: 1
id: age_reference_decote_ieg
intitule: >-
  L'âge où s'annule la décote de l'agent des IEG : aucune décote à qui réunit les
  conditions d'ouverture du droit avant le 1er juillet 2010 ; puis l'âge minimum
  d'ouverture majoré de cinq ans, diminué de seize trimestres la première année, de deux
  de moins chaque 1er juillet jusqu'en 2013, d'un ensuite, de rien depuis le 1er juillet
  2024 ; à qui les réunit depuis le 1er janvier 2025, l'âge minimum majoré de trois ans,
  et soixante-deux ans pour l'agent en services actifs né avant 1975 ; à qui a ouvert son
  droit plus tôt, la CNIEG garde l'âge d'avant, quelle que soit la date d'effet.
domaine: decote_surcote
regimes: [ieg]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- l'âge d'ouverture du droit de l'agent (`age_ouverture_ieg_actifs`)
- >-
  le mois où l'agent réunit les conditions d'ouverture du droit, qui donne la diminution
  de l'année et sépare les règles d'avant et d'après le 1er janvier 2025
- sa génération
ecrit:
- >-
  l'âge d'annulation de la décote, d'où se comptent les trimestres de minoration par
  l'âge (1° du I de l'article 10), que la fiche `decote_regimes_speciaux` applique
dates_qui_decident:
- ouverture_du_droit
versions:
- id: sans_decote
  statut: lue
  textes:
  - {id: LEGIARTI000006632496, article: "statut national, annexe 3, article 3, § 3, rédaction de 1946", en_vigueur: 1946-06-01}
  - {id: LEGIARTI000019226006, article: "même annexe, article 45, II, rédaction du décret n° 2008-627", en_vigueur: 2008-06-30, publie_le: 2008-06-29}
  - {id: LEGIARTI000020085612, article: "même annexe, article 45, II", en_vigueur: 2009-01-01}
  nee_de: LEGIARTI000006632496
  bornes:
    ouverture_du_droit: [null, 2010-07-01]
  contenu:
    parametres:
      majoration_de_l_age_minimum: null
    droit: >-
      l'annexe de 1946 ne connaît pas de décote : la pension est le produit des annuités
      par « 2 % du salaire ou traitement annuel », jusqu'à 75 % (article 3, § 3) ; la
      réforme de 2008 crée le coefficient de minoration, mais il « n'est applicable qu'aux
      personnes remplissant les conditions définies à l'article 16 à compter du 1er juillet
      2010 » (article 45, II)
    conditions: >-
      les rédactions suivantes gardent cette phrase mot pour mot, jusqu'à celle du 6 août
      2025
  exemples: aucun trouvé
- id: age_minimum_majore_de_cinq_ans
  statut: lue
  textes:
