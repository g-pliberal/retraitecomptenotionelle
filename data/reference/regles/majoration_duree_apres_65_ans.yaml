code:
  interrupteurs:
    duree_majoree_apres_taux_plein: true
    duree_majoree_tous_regimes: true
  moteur: >-
    `duree_majoree_apres_taux_plein`, sur les périodes du régime général et des salariés
    agricoles depuis 1983, majore la durée du régime de 2,5 % par trimestre entier écoulé
    du mois qui suit l'âge d'annulation de la décote à la date d'effet
    (`liquider.trimestres_d_ajournement`), arrondie au trimestre supérieur et bornée à la
    durée de proratisation, pour qui ne l'atteint pas (`liquider.duree_majoree_apres_taux_plein`,
    `dureeMajoreeApresTauxPlein` dans le portage) ; `duree_majoree_tous_regimes`, depuis
    2004, en ouvre le droit sur la durée de tous les régimes de base, trimestres superposés
    compris, et borne la part d'un régime aligné liquidé à part (R. 173-4-2). La durée
    majorée entre au prorata de la pension et à celui du minimum contributif ; qui avait
    passé soixante-cinq ans au 1er avril 1983 a la plus forte des deux pensions, 50 % sur la
    durée majorée ou le taux acquis sur la durée non majorée
    (`liquider.taux_acquis_au_31_mars_1983`). Le contexte qui neutralise la décote et la
    surcote neutralise aussi la majoration.
