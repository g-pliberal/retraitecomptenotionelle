schema_version: 1
id: majoration_duree_apres_65_ans
intitule: >-
  Depuis le 1er avril 1983, au régime général et chez les salariés agricoles, l'assuré
  qui liquide après l'âge du taux plein sans la durée voit la durée du régime majorée de
  2,5 % par trimestre écoulé depuis cet âge, arrondie au trimestre supérieur, sans
  dépasser la durée de proratisation : soixante-cinq ans jusqu'en 2011, l'âge du 1° de
  L. 351-8 ensuite ; la durée du seul régime jusqu'en 2003, celle de tous les régimes
  depuis 2004, la majoration se partageant alors entre régimes alignés.
etat: approchee
etape: liquider_chaque_regime
effet: >-
  Les assurés du régime général et des salariés agricoles qui liquident après l'âge du
  taux plein sans la durée : parti deux ans après soixante-sept ans, un assuré a sept
  trimestres d'ajournement, 17,5 % de durée en plus, au prorata de sa pension comme à
  celui du minimum contributif, qui retient « la durée d'assurance corrigée lorsqu'elle
  entre en compte » (circulaire Cnav n° 8/89, point 3). Le moteur la porte depuis le 28
  septembre 2026 (`liquider.duree_majoree_apres_taux_plein`) ; aucun témoin ne partait si
  tard sans la durée, et deux témoins nés pour elle la montrent, sous la règle de 1983
  (132 trimestres, 150) et sous celle de 2004 (124, 146). Les exemples de la Cnav sont
  rendus : né en mars 1917 avec 60 trimestres, « arrondi à 68 », dont la pension passe
  celle du taux acquis au 31 mars 1983 (circulaire n° 22/83) ; 80 trimestres, 21
  d'ajournement, 122 (circulaire n° 8/89) ; les cinq partages de la circulaire n°
  2004/20. Restent approchés : les artisans et commerçants liquidés à part des salariés,
  que D. 634-5 majore depuis 1990 sur leurs seuls trimestres d'après 1972, et que le
  moteur ne majore pas ; le décompte, qui part du mois suivant l'âge, exact pour qui
  n'est pas né un premier ; le troisième exemple de la circulaire n° 22/83, que le
  maximum des pensions décide sur un salaire moyen de 1,7 plafond, qu'aucune carrière
  plafonnée n'atteint ; l'égalité des décimales entre régimes, que R. 173-4-2 tranche et
  que le moteur arrondit au plus proche ; et les soixante-cinq ans que R. 351-7 garde aux
  assurés du 1° bis, du 2° et du 6° de L. 351-8, pour qui le moteur compte depuis l'âge
  d'annulation qu'il leur applique.
sources:
  lu_le: 2026-09-28
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Artisans et commerçants : porter D. 634-5 aux périodes de la CANCAVA, de l'ORGANIC et
    du RSI liquidées à part du régime général — la majoration « applicable aux trimestres
    d'assurance postérieurs au 31 décembre 1972 », dans la limite de 150 trimestres avec
    ceux d'avant 1973 —, et lire le texte qui les majorait de 1984 à 1989, que l'index ne
    porte pas : l'article 2 du décret n° 73-937, qui leur rend applicable « l'article
    70-6 » du décret de 1945, le vise dans sa rédaction d'avant 1982, la date d'entrée en
    jouissance.
  - >-
    Chercher un exemple publié d'une pension prise après soixante-sept ans, circulaire
    Cnav ou fiche de l'Assurance retraite.
  lectures:
  - type: legifrance
    reference: >-
      code de la sécurité sociale, R. 351-7, rédaction en vigueur depuis le 1er janvier
      2026 (LEGIARTI000053335592) : « L'assuré bénéficie, en application de l'article L.
      351-6, d'une majoration de sa durée d'assurance dans le régime général de sécurité
      sociale égale à 2,5 % pour chaque trimestre accompli postérieurement à l'âge fixé au
      1° de l'article L. 351-8 ou à l'âge de soixante-cinq ans s'il remplit les conditions
      prévues au 1° bis, 2° ou 6° de ce même article L. 351-8 : 1° Au titre des périodes
      antérieures au 1er janvier 2004 ; 2° Au titre des périodes accomplies dans ce régime
      et, le cas échéant, dans un ou plusieurs autres régimes obligatoires postérieurement
      au 31 décembre 2003 », le total « arrondi, s'il y a lieu, au chiffre immédiatement
      supérieur ». Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      décret n° 45-0179 du 29 décembre 1945, article 70-6, rédaction du 23 juillet 1982 au
      21 décembre 1985 (LEGIARTI000006760668) : « L'assuré âgé de plus de soixante-cinq ans
      et qui ne justifie pas de 150 trimestres d'assurance dans le régime général de la
      sécurité sociale bénéficie, en application de l'article L. 342-3 du code de la
      sécurité sociale, d'une majoration de sa durée d'assurance dans ce régime égale à 2,5
      p. 100 par trimestre postérieur à son soixante-cinquième anniversaire sans que cette
      majoration puisse avoir pour effet de porter au-delà de 150 trimestres sa durée
      d'assurance. Le nombre total de trimestres d'assurance obtenu en application de
      l'alinéa précédent est éventuellement arrondi au chiffre immédiatement supérieur,
      sans pouvoir excéder 150. » Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      code de la sécurité sociale, R. 351-7, rédaction du 21 décembre 1985 au 15 février
      2004 (LEGIARTI000006749350) : la même phrase, « en application de l'article L.
      351-6 » ; rédaction du 15 février 2004 au 3 juin 2011 (LEGIARTI000006749351) :
      « L'assuré âgé d'au moins soixante-cinq ans bénéficie, en application de l'article L.
      351-6, d'une majoration de sa durée d'assurance dans le régime général de sécurité
      sociale égale à 2,5 % par trimestre postérieur à son soixante-cinquième anniversaire :
      1° Au titre des périodes antérieures au 1er janvier 2004 ; 2° Au titre des périodes
      accomplies dans ce régime et, le cas échéant, dans un ou plusieurs autres régimes
      obligatoires postérieurement au 31 décembre 2003 », sans porter la durée « au-delà
      de la limite prévue au troisième alinéa de l'article L. 351-1 ». Lu dans l'index LEGI
      du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      salariés agricoles : décret n° 50-1225 du 21 septembre 1950, article 55-6, rédaction
      du 15 décembre 1982 au 22 avril 2005 (LEGIARTI000006774017) : la même règle, « dans
      le régime des assurances sociales agricoles », en application de l'article 1er bis
      (par. 9) du décret n° 51-727. Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 22/83 du 16 février 1983, point 312 : « L'assuré qui demande sa
      pension après 65 ans alors qu'il ne totalise pas 150 trimestres d'assurance au seul
      régime général, bénéficie d'une majoration de sa durée d'assurance, justifiée à la
      date d'entrée en jouissance de sa pension, de 2,50 % par trimestre postérieur au 65ème
      anniversaire » ; « L'attribution de cette majoration est indépendante du fait d'avoir
      exercé ou non une activité professionnelle entre le 65ème anniversaire et le point de
      départ de la pension » ; ses exemples, 136 trimestres à soixante-six ans et trois mois
      (« ramené à 150 trimestres »), 92 à soixante-sept ans et trois mois (« 112,70 arrondi
      à 113 trimestres ») ; et le premier cas du point 313, 60 trimestres « arrondi à 68 »
    url: >-
      https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_2283_16021983.aspx
    date: 2026-09-27
  - type: legifrance
    reference: >-
      code de la sécurité sociale, R. 351-7, rédactions du 3 juin 2011 au 1er septembre
      2023 (LEGIARTI000024113035) et du 1er septembre 2023 au 1er janvier 2026
      (LEGIARTI000047633307) : la majoration « pour chaque trimestre accompli
      postérieurement à l'âge fixé au 1° de l'article L. 351-8 ou à l'âge de
      soixante-cinq ans » pour les assurés du 1° bis, du 1° ter (puis du 2°) de cet article
      et du III ou IV de l'article 20 de la loi n° 2010-1330 ; celle de 2023 ne dit plus que
      la majoration ne peut porter la durée totale au-delà de la limite, que L. 351-6 fixe
      toujours. Lu dans l'index LEGI du dépôt
    date: 2026-09-28
  - type: legifrance
    reference: >-
      code de la sécurité sociale, L. 351-6, rédaction du 21 décembre 1985
      (LEGIARTI000006742630) : « Les assurés, ayant dépassé l'âge fixé en application du 1°
      de l'article L. 351-8 bénéficient d'une majoration de leur durée d'assurance qui est
      fonction du nombre d'années supplémentaires par rapport à cet âge » ; rédaction du
      22 août 2003 (LEGIARTI000006742631), « applicable[s] aux périodes accomplies à
      compter du 1er janvier 2004 » : « tant qu'ils n'ont pas accompli dans le régime
      général et, le cas échéant, dans un ou plusieurs autres régimes obligatoires, une
      durée totale d'assurance au moins égale à la limite prévue au troisième alinéa de
      l'article L. 351-1 ». Lu dans l'index LEGI du dépôt
    date: 2026-09-28
  - type: legifrance
    reference: >-
      code de la sécurité sociale, R. 173-4-2, rédactions du 15 février 2004
      (LEGIARTI000006747868) et du 6 mai 2017 (LEGIARTI000034595977), devenu R. 173-3-3 le
      1er janvier 2026 (LEGIARTI000053327917), qui y ajoute les non-salariés agricoles :
      pour l'assuré qui a relevé du régime général, des salariés agricoles et des
      commerçants et artisans depuis 1973, ou de deux d'entre eux, la majoration de chacun
      « ne peut excéder le produit » de « la différence entre la limite […] et la durée
      totale d'assurance de l'assuré, avant majoration, dans ces régimes » et du
      « rapport entre la durée d'assurance accomplie dans ce régime, avant majoration, et
      la durée totale », arrondi à l'entier le plus proche. Lu dans l'index LEGI du dépôt
    date: 2026-09-28
  - type: legifrance
    reference: >-
      salariés agricoles, après l'article 55-6 : décret n° 50-1225, article 36, rédaction du
      21 février 1990 au 22 avril 2005 (LEGIARTI000006773956), puis code rural, R. 742-19
      (LEGIARTI000006597798) : « Pour l'application des articles R. 351-6, R. 351-7 […] du
      code de la sécurité sociale aux salariés agricoles ». Artisans et commerçants :
      D. 634-5, rédaction du 1er janvier 1990 (LEGIARTI000006737998), la majoration de R.
      351-7 « applicable aux trimestres d'assurance postérieurs au 31 décembre 1972 ».
      Lu dans l'index LEGI du dépôt
    date: 2026-09-28
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 8/89 du 18 janvier 1989 : « Les trimestres d'ajournement se
      décomptent : du 1er jour du mois qui suit le 65ème anniversaire (ou à partir du jour
      anniversaire pour les assurés nés le 1er jour d'un mois), jusqu'à la date fixée pour
      le point de départ de la retraite » (point 12) ; l'exemple du point 14, 80 trimestres,
      21 trimestres d'ajournement, 122 ; la comparaison des deux pensions du point 21,
      « une pension au taux de 50 % avec la durée d'assurance au régime général corrigée,
      et une pension au taux supérieur à 50 % […] avec la durée d'assurance au régime
      général non corrigée » ; et le minimum contributif du point 3, sur « la durée
      d'assurance retenue par le régime général pour le calcul de la pension c'est-à-dire
      y compris, la durée d'assurance corrigée »
    url: >-
      https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_889_18011989.aspx
    date: 2026-09-28
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 2004/20 du 13 avril 2004 : les deux conditions (point 11), le
      décompte (point 12), l'arrondi (point 13), les pensions d'avant 2004 (point 31), la
      limite tous régimes, « les trimestres d'assurance de chaque régime se totalisent même
      s'ils se superposent » (point 3215), la répartition entre régimes alignés (point 4)
      et ses cinq exemples (point 45), dont un régime spécial qui ne partage rien
      (« 152 > 150 --> mais pas de répartition entre régime général et régime spécial »)
    url: >-
      https://legislation.lassuranceretraite.fr/#/references-reglementaires?file_leaf_ref=CR_CN_2004020_13042004.aspx
    date: 2026-09-28
  - type: autre
    reference: >-
      base de législation de l'Assurance retraite, exposé « Majoration de durée d'assurance
      pour âge » et son barème (« Ajournement après l'âge du taux plein », coefficients de
      1,025 à 2,5) : « Cette majoration est de 2,50 % par trimestre écoulé entre : le 1er
      jour du mois qui suit l'âge auquel l'assuré a droit au taux plein […] et le point de
      départ de la retraite »
    url: >-
      https://legislation.lassuranceretraite.fr/#/expose?file_leaf_ref=mda_mda_age_mda_age_ex.aspx
    date: 2026-09-28
