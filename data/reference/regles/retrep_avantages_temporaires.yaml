schema_version: 1
id: retrep_avantages_temporaires
intitule: >-
  Le maître de l'enseignement privé sous contrat qui cesse son activité aux âges du
  maître titulaire public, sans avoir droit à sa pension du régime général à taux
  plein, touche de l'État des « avantages temporaires de retraite » : une pension du
  régime général et une pension complémentaire liquidées comme s'il avait l'âge du
  taux plein, sur ses seuls services d'enseignement, minorées depuis 2006 comme la
  pension d'un enseignant public, et servies jusqu'à sa pension réelle du régime
  général à taux plein.
domaine: depart_anticipe
regimes: [retrep]
etape: liquider_chaque_regime
face: droit
etat: pas_encore_modelisee
lit:
- la date de naissance du maître, et l'âge légal et l'âge anticipé de catégorie active de sa génération
- ses services d'enseignement sous contrat ou agrément, et ceux accomplis sur l'échelle des instituteurs
- sa durée d'assurance au régime général et ses droits à la complémentaire au titre de ces services
- la durée requise d'un enseignant public de la même génération, pour la minoration depuis 2006
ecrit:
- l'avantage temporaire de retraite de base et l'avantage complémentaire, de la cessation d'activité au taux plein du régime général
- la date à laquelle l'État cesse de les servir
dates_qui_decident:
- liquidation.date_effet
versions:
- id: avant_le_regime
  statut: supposee
  hypothese: >-
    avant le décret n° 80-7, le maître du privé sous contrat est un salarié du régime
    général et de la complémentaire comme un autre, qui ne peut liquider qu'aux
    conditions de ces régimes : aucun avantage temporaire n'existe
  fiabilite: >-
    haute : l'arrêté du 24 mars 1987 désigne l'organisme qui paie « les avantages de
    retraite institués par le décret n° 80-7 »
  bornes:
    liquidation.date_effet: [null, 1980-01-10]
  contenu:
    droit: aucun avantage temporaire ; la pension du régime général et de la complémentaire à leurs conditions propres
  exemples: aucun trouvé
