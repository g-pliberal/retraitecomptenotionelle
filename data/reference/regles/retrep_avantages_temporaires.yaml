textes_a_rattacher:
- reference: >-
    R. 914-133 à R. 914-136 du code de l'éducation : avantages temporaires et rente
    viagère d'invalidité du maître dont le contrat est résilié pour invalidité, calculés
    en anticipant les trimestres à échoir jusqu'au taux plein, au moins 50 % du
    traitement à 60 % d'invalidité
  change: un départ pour invalidité, avec rente, que les versions ne décrivent pas
- reference: >-
    R. 914-138 à R. 914-140 : le régime additionnel se liquide aussi à la date d'un
    avantage temporaire de retraite, sur une fraction des avantages perçus
  change: la date d'effet de la pension du régime additionnel, déjà calculé par le dépôt
historique:
- >-
  2026-10-04 — née avec l'action 145 : un régime que l'inventaire ne nommait pas,
  documenté de ses quatre textes successifs sans être modélisé.
effet: >-
  Tous les maîtres et documentalistes du privé sous contrat qui partent aux âges des
  enseignants publics : ceux qui avaient quinze ans d'échelle d'instituteur partaient à
  cinquante-cinq ans jusqu'en 2011, quand le modèle les fait attendre l'âge du régime
  général. Ni l'effectif ni la dépense ne sont dans les sources lues.
