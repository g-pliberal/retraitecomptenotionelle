  nee_de: LEGIARTI000006253463
  bornes:
    liquidation.date_effet: [2006-07-29, 2008-12-29]
  contenu:
    age: >-
      soixante ans, ou cinquante-cinq ans pour quinze années sur l'échelle des
      instituteurs ; sans condition d'âge pour l'incapacité permanente et les cas des
      3° et 4° du I de L. 24 du code des pensions ; soixante ans abaissé pour les
      maîtres handicapés comme pour les fonctionnaires (article 4)
    calcul: >-
      un avantage de base liquidé selon les règles du régime général pour les assurés
      qui ont l'âge du 1° de L. 351-8, et un avantage complémentaire pour les assurés
      de soixante-cinq ans, sur la durée et les droits acquis au titre des services de
      l'article 3 et des majorations de durée de L. 351-4, L. 351-4-1 et L. 351-5
      (article 5)
    minoration: >-
      quand la durée d'assurance tous régimes est inférieure à celle qu'il faudrait à
      « un enseignant titulaire du public né la même année » pour le pourcentage maximum
      (L. 13 du code des pensions et II de l'article 66 de la loi n° 2003-775), un
      coefficient de minoration calculé selon le I de L. 14 et le III de l'article 66
      (article 6, I) ; la durée cotisée après soixante ans, depuis 2004, au-delà de la
      durée requise, ouvre une majoration (article 6, II)
    duree: >-
      les avantages cessent au taux plein du régime général s'ils n'étaient pas
      minorés ; sinon à l'âge où la minoration de la pension du régime général
      (R. 351-27) serait la plus proche de celle de l'avantage, le taux immédiatement
      inférieur en cas d'égalité (article 8)
    limite_d_age: >-
      soixante-cinq ans pour les maîtres « à soixante ans », soixante ans pour les
      maîtres « à cinquante-cinq ans », prolongeables d'année scolaire en année scolaire
      jusqu'à soixante-cinq ans (article 9) ; maintien en activité au-delà, dans la
      limite de dix trimestres et de la durée maximale du régime général (article 10)
    cumul: >-
      non cumulables avec l'allocation de chômage ou une pension civile ou militaire
      (article 11) ; cumul avec une rémunération publique selon L. 84, L. 85 et L. 86-1
      du code des pensions, intégral pour l'incapacité permanente (article 12)
  exemples: aucun trouvé
