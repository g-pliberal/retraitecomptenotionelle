  nee_de: LEGIARTI000006441913
  bornes:
    liquidation.date_effet: [1980-01-10, 2006-07-29]
  contenu:
    beneficiaire: >-
      le maître contractuel ou agréé à titre définitif (décret du 10 mars 1964), qui
      justifie de quinze années de services — condition non opposable en cas
      d'incapacité permanente constatée par la commission de réforme
    droit: >-
      « cesser leur activité et bénéficier d'avantages de retraite dès leur cessation
      d'activité, lorsqu'en raison de leur âge ils n'ont pas droit à des pensions de
      vieillesse […] liquidées aux taux normalement applicables à l'âge de soixante-cinq
      ans » (article 1er)
    age: >-
      soixante ans ; cinquante-cinq ans pour qui justifie de quinze années de services
      sur l'échelle indiciaire des instituteurs titulaires publics (article 2). Mise en
      place : les maîtres « à cinquante-cinq ans » y sont admis à 61 ans en 1980, 59 en
      1981, 57 en 1982 ; les maîtres « à soixante ans » à 63, 62 puis 61 ans (articles 13
      et 14)
    services: >-
      services dans les établissements privés validés au régime général, services
      d'enseignant public non pris en compte par le code des pensions, services
      militaires, scolarité en centre de formation pédagogique privé à partir de dix-huit
      ans, périodes d'indemnité de soins aux tuberculeux dans la limite de neuf ans ;
      au prorata en cas de temps incomplet (article 4)
    calcul: >-
      un avantage « liquidé selon les règles suivies par le régime général pour les
      assurés âgés de soixante-cinq ans », sur la seule durée d'assurance au titre des
      services de l'article 4, des années d'activité professionnelle qui ont ouvert le
      contrat, des bonifications de deux ans par enfant pour les femmes, des périodes de
      maladie, maternité, invalidité (article 5) ; et un avantage complémentaire liquidé
      selon les règles de l'institution complémentaire pour un assuré de soixante-cinq
      ans, sur les seuls droits acquis au titre de ces services (article 8)
    duree: >-
      servis « aussi longtemps qu'ils ne remplissent pas » les conditions du taux du
      régime général à soixante-cinq ans, et de même pour la complémentaire (articles 5
      et 8)
    reversion: >-
      aux veuves et ex-conjointes non remariées jusqu'à cinquante-cinq ans, aux
      conditions de ressources et de mariage du régime général ; aux veufs infirmes ; la
      réversion complémentaire jusqu'à cinquante ans pour les veuves, soixante-cinq pour
      certains veufs (articles 8-1 à 8-3)
    cumul: >-
      non cumulables avec la garantie de ressources, une rémunération publique
      (L. 84 du code des pensions) ou une pension personnelle du régime général ou d'une
      complémentaire (article 11)
    financement: >-
      « La charge financière en résultant est intégralement supportée par l'État »
      (articles 7 et 9) ; liquidation et paiement par l'Association pour la prévoyance
      collective depuis le 1er juin 1987 (arrêté du 24 mars 1987)
  exemples: aucun trouvé
- id: decret_2006
  statut: lue
  textes:
  - {id: LEGIARTI000006253463, article: "décret n° 2006-933, article 1er", en_vigueur: 2006-07-29}
