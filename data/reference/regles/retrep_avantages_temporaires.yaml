    liquidation.date_effet: [2011-10-20, 2023-09-01]
  contenu:
    age: >-
      l'âge de L. 161-17-2 du code de la sécurité sociale avec quinze années de
      services, ou, pour les durées de services sur l'échelle des instituteurs de
      l'article 35 de la loi n° 2010-1330, l'âge anticipé du 1° du I de L. 24 du code
      des pensions — l'âge de la catégorie active ; sans condition d'âge pour
      l'incapacité permanente, les cas des 3° et 4° du I de L. 24 et de l'article 44,
      III de la loi n° 2010-1330 (R. 914-123)
    calcul: >-
      les avantages se liquident selon les règles du régime général et de la
      complémentaire pour un assuré aux âges des 1° et 1° ter de L. 351-8 — l'âge
      d'annulation de la décote et son abaissement pour les parents de trois enfants —,
      sur les seuls services d'enseignement (R. 914-124)
    loi: >-
      depuis le 30 décembre 2011, la loi elle-même : avantages « dont la charge
      financière est intégralement supportée par l'État », « destinés à permettre à ces
      personnels de cesser leur activité dans les mêmes conditions que les maîtres
      titulaires de l'enseignement public », liquidés sur les services augmentés des
      majorations de L. 351-4, L. 351-4-1 et L. 351-5 et des majorations pour enfants
      des complémentaires, avec « un coefficient de minoration ou de majoration […]
      dans les mêmes conditions que pour les maîtres titulaires » (L. 914-1-1)
    limite_d_age: >-
      la limite d'âge de la loi n° 84-834 pour les maîtres à l'âge légal, cette limite
      minorée de cinq ans pour les maîtres à l'âge anticipé (R. 914-128)
  exemples: aucun trouvé
