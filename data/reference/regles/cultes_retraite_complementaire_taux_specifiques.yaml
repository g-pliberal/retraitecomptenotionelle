schema_version: 1
id: cultes_retraite_complementaire_taux_specifiques
intitule: >-
  Au lieu du « taux de base » de 10,02 %, la CAVIMAC appelle la cotisation de
  retraite complémentaire obligatoire des cultes, sur le même forfait, à l'un de
  huit « taux spécifiques », de 11,13 à 21,31 %, pour les collectivités qui les
  appliquent ; rien de publié ne dit lesquelles, depuis quand, ni quelle part de
  chaque taux ouvre des points.
domaine: cotisations
regimes: [arrco_cultes]
etape: acquerir_les_droits
face: droit
etat: a_verifier
lit:
- le taux de retraite complémentaire que la collectivité du ministre applique, année par année — le taux de base ou l'un des huit taux spécifiques
ecrit:
- les points de l'Arrco, puis de l'Agirc-Arrco, que la cotisation au taux spécifique achète au-delà de celle au taux de base
dates_qui_decident:
- periode.debut
# Les versions coupent la période de cotisation aux circulaires lues : le dépôt
# n'en a lu aucune d'avant 2020, et la première qui énumère les huit taux, la n°
# 2021/04, les dit « inchangés ».
versions:
- id: avant_les_circulaires_lues
  statut: supposee
  hypothese: >-
    le taux de base seul, celui de la tranche 1 de l'Arrco, puis de l'Agirc-Arrco depuis
    2019 (fiche cultes_retraite_complementaire), la retraite complémentaire des cultes
    naissant le 1er janvier 2006 : aucune circulaire de la CAVIMAC d'avant celle de
    janvier 2020 n'est lue, et la page des montants de 2019, que le site ne sert plus,
    porterait les taux de 2018 et de 2019
  fiabilite: faible
  bornes:
    periode.debut: [null, 2020-01-01]
  contenu:
    droit: le taux de base seul, présumé
  exemples: aucun trouvé
- id: un_taux_publie
  statut: lue
  textes:
  - reference: >-
      CAVIMAC, circulaires n° 2020/01 du 17 janvier 2020 et n° 2021/01 du 15
      janvier 2021, hors JORF, images numérisées : avant les huit taux, un seul
    citation: >-
      « Taux contractuel de référence » « 10, 02 % » ; « Part collective (60%) » ;
      « Part personnelle (40 %) »
    lu_le: 2026-10-13
    empreinte: >-
      sha256:c6bffbf68ced8681401e4491b83c4affab9e65b71d1174c0879aaad24050b6af (n° 2020/01),
      sha256:c6073e2197e5b868e34252bed4a5b826edc45002bea99b18c2d22ec787c0134b (n° 2021/01)
  bornes:
    periode.debut: [2020-01-01, 2021-10-01]
  contenu:
    droit: >-
      les circulaires n'appellent la cotisation qu'à un taux, le « taux contractuel de
      référence » de 10,02 %, pour 60 % à la charge de la collectivité et 40 % à celle du
      ministre, sur le forfait de 1 539 € en 2020, de 1 555 € en 2021
    conditions: >-
      la circulaire n° 2021/04, la première qui énumère les huit taux spécifiques, les dit
      « inchangés » : ils pouvaient exister avant, sans que les circulaires lues les
      publient
  exemples: aucun trouvé
- id: huit_taux_specifiques
  statut: lue
  textes:
  - reference: >-
      CAVIMAC, circulaire n° 2021/04 du 15 octobre 2021, cotisations « à compter
      de l'échéance du 15 novembre 2021 (au titre du mois d'octobre 2021) », hors
      JORF : la première qui énumère les huit taux spécifiques
    citation: >-
      « Les taux de cotisation demeurent, eux, inchangés » ; « Tous cultes - taux
      spécifique n° 1 1 589 11,13% » […] « Tous cultes - taux spécifique n° 8
      1 589 21,31% »
    lu_le: 2026-10-13
    empreinte: sha256:0c191c0d44bc6d1987bd55eb6be30b1da4bb54a732f14a90bedc304f1346a456
  - reference: >-
      CAVIMAC, circulaire n° 2026/03 du 27 mai 2026, cotisations « à compter du
      1er juin 2026 », hors JORF : la dernière
    citation: >-
      « Tous cultes - taux spécifique n° 1 1 867 11,13% 208 » ; « n° 2 1 867
      12,00% 224 » ; « n° 3 1 867 13,06% 244 » ; « n° 4 1 867 14,30% 267 » ;
      « n° 5 1 867 15,27% 285 » ; « n° 6 1 867 17,21% 321 » ; « n° 7 1 867
      18,83% 352 » ; « n° 8 1 867 21,31% 398 »
    lu_le: 2026-10-13
    empreinte: sha256:7cb68acf8170f440047f8c531ec8547da8b628a3e61a761e15f5b1580567b35e
  bornes:
    periode.debut: [2021-10-01, null]
  contenu:
    droit: >-
      à côté du taux de base de 10,02 % — 6,01 % pour la collectivité, 4,01 % pour le
      ministre —, huit « taux spécifiques » sur le même forfait, de 11,13 % (n° 1) à 21,31
      % (n° 8), les mêmes de la circulaire n° 2021/04 à la n° 2026/03, sans part ni
      définition
    conditions: >-
      rien de publié ne dit quelles collectivités les appliquent, depuis quand, ni quelle
      part de chaque taux ouvre des points
  exemples: aucun trouvé
effet: >-
  Le ministre dont la collectivité applique un taux spécifique cotise de 11 à
  113 % de plus qu'au taux de base, et le modèle ne lui compte que les points du
  taux de base. Si l'excédent achète des points comme un taux supérieur de
  l'accord Agirc-Arrco (article 35) — la contribution d'équilibre générale de
  2,15 % retranchée, le reste appelé à 127 % —, il en a de 1,14 à 2,43 fois plus
  depuis 2019, et avant si ces taux existaient déjà ; c'est une hypothèse, que
  rien de publié ne confirme. Le simulateur ne demande pas le taux de la
  collectivité.
sources:
  lu_le: 2026-10-13
  prochaine_relecture: 2027-10-13
  a_relire:
  - >-
    Ce que chaque taux spécifique achète — sa part génératrice de points, son
    taux de calcul des points ou d'équivalence —, ce qu'il était sous l'Arrco,
    avant 2019, et quelles collectivités l'appliquent, depuis quand. Ni les
    circulaires de la CAVIMAC, ni ses rapports d'activité de 2016 à 2025, ni
    l'accord Agirc-Arrco et ses circulaires lues ne le disent : la règle tient
    sans doute aux conventions de partenariat de la CAVIMAC avec les
    institutions de l'Arrco, que rien ne publie. La demander au service du
    recouvrement de la CAVIMAC, ou à Malakoff Humanis Agirc-Arrco, seule
    compétente pour les cultes depuis le 1er janvier 2025.
  - >-
    La page de la CAVIMAC « Nouveaux montants des cotisations au 1er janvier
    2019 », que les moteurs de recherche indexent encore et que le site ne sert
    plus (404 le 13 octobre 2026), porterait les taux de 2018 et de 2019 :
    l'archive du web, que le réseau de la session refuse, la garde peut-être.
  lectures:
  - type: autre
    reference: >-
      CAVIMAC, circulaires n° 2020/01 du 17 janvier 2020 et n° 2021/01 du 15
      janvier 2021, deux images numérisées, lues page à page : la « Cotisation
      mensuelle de retraite complémentaire » n'y a qu'une ligne, « Taux
      contractuel de référence 10,02 % », « Part collective (60%) », « Part
      personnelle (40 %) », sur le forfait de 1 539 € puis de 1 555 € ; copies
      datées dans data/brut/cultes_rco
    url: https://www.cavimac.fr/publications
    date: 2021-01-15
  - type: autre
    reference: >-
      CAVIMAC, les onze circulaires de cotisations lisibles, de la n° 2021/04 du
      15 octobre 2021 à la n° 2026/03 du 27 mai 2026 : chacune énumère sous
      « RCO » le taux de base, 10,02 %, ses parts collective et personnelle,
      6,01 et 4,01 %, puis les huit taux spécifiques, les mêmes de la première à
      la dernière, sans part ni définition ; « Les taux de cotisation demeurent,
      eux, inchangés »
    url: https://www.cavimac.fr/publications
    date: 2026-05-27
  - type: autre
    reference: >-
      Agirc-Arrco, accord national interprofessionnel du 17 novembre 2017,
      article 35, 2 (« Accords spécifiques » : les taux supérieurs nés d'une
      obligation antérieure au 2 janvier 1993 continuent de s'appliquer, sauf
      contribution de maintien des droits, taux d'équivalence ou démission), et
      circulaire 2019-1-DRJ du 9 janvier 2019, fiches 3 et 4 : aucune ne nomme
      les cultes, dont l'obligation date de 2006 ; copies datées dans
      data/brut/cultes_rco
    url: https://www.agirc-arrco.fr/
    date: 2019-01-09
  - type: autre
    reference: >-
      CAVIMAC, rapports d'activité de 2016 à 2025, triptyque retraite de 2024,
      pages de l'espace partenaires, de la retraite complémentaire et de la
      déclaration sociale nominative : rien sur les taux spécifiques
    url: https://www.cavimac.fr/publications
    date: 2026-10-13
code:
  moteur: >-
    le modèle n'applique que le taux de base : ces fonctions achètent les points de l'Arrco,
    puis de l'Agirc-Arrco, au taux de la fiche de régime, sur le forfait du SMIC, et
    prélèvent la contribution d'équilibre sur le même forfait ; un taux spécifique y
    entrera quand on saura ce qu'il achète
  python: >-
    droit/acquerir.py : acquerir ; contributions_equilibre.py : _forfait
  javascript: >-
    moteur/js/droit/acquerir.js : acquerir ; moteur/js/contributions-equilibre.js : forfait
  parametres: >-
    regimes/arrco_cultes.yaml : taux_cotisation_retraite, part_salariale,
    assiette_forfaitaire, assiette_repere_smic, points_de
  tests: [tests/test_simulateur.py, tests/js/moteur.test.js, tests/temoins/simulations.json]
historique:
- >-
  2026-10-13 — née avec l'action 119 : les huit taux spécifiques que la fiche
  `cultes_retraite_complementaire` laissait à relire, lus dans toutes les
  circulaires de cotisations que la CAVIMAC publie, et que rien de publié ne
  définit.
- >-
  2026-10-19 — action 130 : les circulaires lues, coupées en trois versions de la période
  de cotisation ; les conventions de la CAVIMAC avec l'Arrco, non publiées, passent aux
  textes à relire. Le modèle n'en change pas.
textes_a_relire:
- reference: >-
    les conventions de partenariat de la CAVIMAC avec les institutions de
    l'Arrco, depuis 2006, non publiées ; l'espace partenaires de la CAVIMAC en
    compte « cinq »
  question: ce que chaque taux spécifique achète, et à quelles collectivités il s'applique
