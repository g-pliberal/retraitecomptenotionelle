effet: >-
  Aucune des trois fiches ne la portait avant le 23 septembre 2026 : 10 % de
  complémentaire en moins pour tout parent de trois enfants. Lue au droit le 6
  novembre 2026 (action 130) : cinq versions sur la date d'effet ; la CAVEC conforme
  depuis le 7 juillet 2025, la Cipav et la CAVAMAC au décret et aux règlements de
  2026 ; une erreur prouvée, la CAVAMAC de juillet à décembre 2011 (1 332,33 € par an
  au cas posé) ; un point non tranché, la Cipav avant 2000 (403,40 €) ; des manques,
  les statuts de la CAVAMAC d'avant 2011, les 5 % par enfant handicapé de la CAVAMAC,
  la réversion de la CAVEC à examiner.
