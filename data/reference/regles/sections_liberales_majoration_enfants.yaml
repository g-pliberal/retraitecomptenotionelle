approximations:
- version: [cavamac_depuis_juillet_2011]
  regime: cavamac_complementaire
  textes: >-
    arrêté du 23 juin 2011, article 2 (JORFARTI000024270156) et annexe, article 18
    (JORFARTI000024270173)
  ecart: >-
    Erreur prouvée, déclarée et non corrigée : les statuts de 2011 entrent en vigueur le
    1er juillet 2011 et abrogent ceux de 1967, sans disposition transitoire (ni « 2011
    » ni « 2012 » dans les 29 983 caractères de l'annexe) ; une pension qui prend effet
    du 1er juillet au 1er décembre 2011 se liquide à leur article 18. Le modèle ne
    déclare `majoration_enfants` qu'à la période de 2012 (« servis à partir de 2012,
    première année pleine », `cavamac_complementaire.yaml`) : il ne sert rien à ces six
    dates d'effet. La lecture contraire, que la majoration n'atteindrait que les
    pensions de 2012, ne tient à aucun texte. Essai du 6 novembre 2026, une mère de
    trois enfants née le 10 mars 1946, agent général au double du salaire moyen depuis
    22 ans, en euros de 2026 : partie à 65 ans et 3 mois, pension au 1er juillet 2011,
    13 323,31 € de CAVAMAC, aucune majoration ; le texte en donne 0,10 × 13 323,31 =
    1 332,33 € ; partie à 65 ans et 9 mois, pension au 1er janvier 2012, le modèle
    sert 1 382,64 €, 10 % de 13 826,36 €.
  effet: >-
    −10 % de la pension de la CAVAMAC, par an, pour un parent de trois enfants dont la
    pension prend effet de juillet à décembre 2011 : 1 332,33 € au cas posé
- version: [aucune_avant_2000, cipav_depuis_2000]
  regime: cavamac_complementaire
  textes: >-
    arrêté du 22 décembre 1967 et ses modifications de 1972, 1975 et 1983, au seul
    fac-similé du Journal officiel
  ecart: >-
    Manque : les statuts de la CAVAMAC d'avant le 1er juillet 2011 ne sont pas lus ;
    le modèle n'y sert aucune majoration. Des textes de la CAVAMAC que l'index porte
    avant le 23 juin 2011, aucun ne nomme l'enfant (le décret n° 97-1056, les arrêtés
    du 17 décembre 2007 et du 26 janvier 2011, ces deux derniers pour la base et les
    statuts généraux) ; les arrêtés de 1967, 1972, 1975 et 1983 n'y ont que leur
    titre, au fac-similé
    (`docs/feuille_de_route/138/2026-11-05-la-file-des-fac-similes.md`).
  effet: >-
    non mesuré : jusqu'à 10 % de la pension de la CAVAMAC si les statuts de 1967
    majoraient comme ceux de 2011
- version: [aucune_avant_2000]
  regime: cipav_complementaire
  textes: >-
    décret n° 99-913, article 6 (LEGIARTI000006780306) ; statuts de la Cipav d'avant
    2026, au seul Bulletin officiel
  ecart: >-
    Point non tranché. Première lecture, celle du modèle : la bonification ne commence
    qu'en 2000, à la date où le décret n° 99-913 l'atteste. Seconde lecture : ce décret
    renvoie à une bonification « prévue par les statuts de ce régime », qui existait
    donc avant lui, à une date et sous une forme que seuls les statuts disent. Essai du
    6 novembre 2026, une mère de trois enfants née le 10 mars 1934, libérale de la Cipav
    au double du salaire moyen depuis 22 ans, en euros de 2026 : partie à 65 ans et 8
    mois, pension au 1er décembre 1999, 4 033,95 €, aucune majoration ; à la seconde
    lecture, 0,10 × 4 033,95 = 403,40 € ; partie à 65 ans et 9 mois, au 1er janvier
    2000, le modèle sert 418,15 €, 10 % de 4 181,48 €.
  effet: >-
    0 € à la première lecture ; −10 % de la pension de la Cipav à la seconde, 403,40 €
    par an au cas posé, pour les pensions d'avant 2000
- version: [cipav_depuis_2000, cavamac_depuis_juillet_2011, cavec_depuis_juillet_2025]
  regime: cipav_complementaire
  textes: >-
    décret n° 99-913, article 6 ; décret n° 79-262, article 5-2 (LEGIARTI000054168515)
  ecart: >-
    La forme de la bonification de la Cipav, de 2000 au 30 juin 2026, est supposée
    celle que l'article 5-2 écrit en 2026 : 10 % de la pension dès trois enfants ; les
    statuts qui la fixaient sont au seul Bulletin officiel. Le décret n° 99-913 ne la
    donne aux anciens affiliés de la caisse des géomètres que sur leurs « droits acquis
    au titre des périodes d'activité postérieures au 1er janvier 2000 » ; le modèle,
    qui ne les distingue pas, majore tous leurs points.
  effet: non mesuré
- version: [cavamac_depuis_juillet_2011, cavec_depuis_juillet_2025, au_decret_et_aux_reglements_de_2026]
  regime: cavamac_complementaire
  textes: >-
    statuts de 2011, article 19 (JORFARTI000024270173) ; règlement de 2026, article 8
    (JORFARTI000054436046)
  ecart: >-
    Manque : « Le nombre des points de retraite acquis dans le présent régime est majoré
    de 5 % au profit de l'adhérent qui, à la date de demande de liquidation de sa
    pension de retraite complémentaire, déclare fiscalement à sa charge un enfant
    ouvrant droit [...] à l'allocation d'éducation de l'enfant handicapé », par enfant
    (article 19, puis article 8 du règlement) ; la saisie ne connaît pas l'enfant
    handicapé à charge, le modèle ne le sert pas.
  effet: >-
    −5 % de la pension de la CAVAMAC par enfant handicapé à charge : 0,05 × 13 323,31 =
    666,17 € par an au cas posé de 2011
- version: [cavamac_depuis_juillet_2011, cavec_depuis_juillet_2025, au_decret_et_aux_reglements_de_2026]
  textes: >-
    statuts de la CAVAMAC, article 18, et règlement de 2026, article 7 ; décret n°
    79-262, article 5-2 ; statuts de la CAVEC, article 20 (L. 351-12)
  ecart: >-
    Le modèle compte les enfants de l'assuré (`nombre_enfants`) sans distinguer les
    enfants élevés neuf ans avant leurs seize ans, que les trois textes comptent aussi,
    ni le parent privé ou retiré de l'autorité parentale, que la Cipav et la CAVEC (par
    L. 351-12) excluent.
  effet: non mesuré
- version: [cavec_depuis_juillet_2025, au_decret_et_aux_reglements_de_2026]
  regime: cavec_complementaire
  textes: >-
    statuts de la CAVEC, article 20 (JORFARTI000051849616) ; règlement de 2026, article
    1.3.1 (JORFARTI000054435943)
  ecart: >-
    À examiner, hors de cette fiche : la CAVEC majore aussi de 10 % « la pension de
    réversion » ; que la réversion de la CAVEC reprenne ou non la part de la majoration
    (`echeancier`, `parts_de_la_majoration`) relève des fiches de la réversion, que
    cette lecture n'a pas ouvertes.
  effet: non mesuré
