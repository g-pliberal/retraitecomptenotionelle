schema_version: 1
id: sections_liberales_majoration_enfants
intitule: >-
  Majoration de 10 % pour trois enfants dans trois complémentaires libérales : la
  CAVAMAC depuis ses statuts du 1er juillet 2011 (article 18, puis article 7 du
  règlement de 2026), « au profit de l'adhérent ayant eu au moins trois enfants » ou
  les ayant élevés neuf ans ; la Cipav, dont le décret n° 99-913 atteste la
  bonification au 1er janvier 2000 et que l'article 5-2 du décret n° 79-262 écrit au
  1er juillet 2026 ; la CAVEC depuis l'arrêté du 4 juillet 2025 (article 20, puis
  article 1.3.1 du règlement de 2026).
domaine: enfants
regimes: [cavamac_complementaire, cavec_complementaire, cipav_complementaire]
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- >-
  la date d'effet de la pension de la complémentaire, qui choisit la version, et la
  période de liquidation de chaque section (`periode_de_liquidation`)
- >-
  le nombre d'enfants de l'assuré (`Carriere.nombre_enfants`), trois au moins
- >-
  la pension de chaque section, minorée ou majorée par l'âge, sur laquelle les 10 %
  se calculent
ecrit:
- >-
  la part de la majoration pour enfants de chaque section, `majoration_enfants` des
  avantages appliqués, 10 % de la pension, que `completer` ajoute
dates_qui_decident:
- liquidation.date_effet
versions:
- id: aucune_avant_2000
  statut: supposee
  hypothese: >-
    aucune des trois sections ne majore pour enfants une pension qui prend effet avant
    le 1er janvier 2000 : la CAVEC, dont les statuts de 2008 ne le font pas, ne le
    faisait pas avant ; la CAVAMAC, dont les statuts de 1967, approuvés par l'arrêté du
    22 décembre 1967 et modifiés en 1972, 1975 et 1983, ne sont qu'au fac-similé du
    Journal officiel, que l'index ne lit pas ; la Cipav, dont les statuts d'avant 2026
    sont au seul Bulletin officiel
  fiabilite: >-
    faible : aucun des statuts en vigueur avant 2000 n'est lu ; le décret n° 99-913
    laisse penser que la Cipav majorait déjà (approximations)
  textes:
