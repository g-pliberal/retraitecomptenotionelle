    citation: >-
      « I. - Le montant de la pension est égal au produit du nombre de points acquis
      diminué, le cas échéant, du coefficient de réduction par la valeur de service du
      point. Il est majoré de 10 % au profit du demandeur ayant eu au moins trois
      enfants. Le demandeur ne peut bénéficier de cette majoration s'il a été privé de
      l'exercice de l'autorité parentale ou s'est vu retirer l'autorité parentale dans
      les conditions mentionnées au dernier alinéa de l'article L. 351-12 du code de la
      sécurité sociale. Cette majoration bénéficie également au demandeur qui a élevé au
      moins trois enfants pendant 9 ans jusqu'à leur 16e anniversaire. »
