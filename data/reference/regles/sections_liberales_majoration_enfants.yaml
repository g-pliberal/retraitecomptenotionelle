schema_version: 1
id: sections_liberales_majoration_enfants
intitule: >-
  Majoration de 10 % pour trois enfants dans trois complémentaires libérales : la
  CAVAMAC depuis ses statuts de 2011 (article 18), la Cipav depuis l'intégration
  des géomètres au 1er janvier 2000 au moins, « au profit du demandeur ayant eu
  au moins trois enfants » ou les ayant élevés neuf ans, la CAVEC depuis l'arrêté
  du 4 juillet 2025.
etat: approchee
effet: >-
  Aucune des trois fiches ne la portait : 10 % de complémentaire en moins pour tout
  parent de trois enfants. Depuis le 23 septembre 2026, `majoration_enfants` à la
  CAVAMAC depuis 2012, à la Cipav depuis 2000, à la CAVEC depuis 2026 ; tenu par
  tests/test_sections_liberales.py. Approximation : la maille est l'année, la forme
  de la bonification de la Cipav est supposée celle d'aujourd'hui depuis 2000, et
  la majoration de 5 % de la CAVAMAC par enfant ouvrant droit à l'allocation d'éducation
  de l'enfant handicapé n'est pas portée.
sources:
  lu_le: 2026-09-23
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Lire les statuts de la Cipav d'avant 2026 pour dater la forme de sa bonification.
  lectures:
  - type: jorf
    reference: >-
      Les cinq textes lus dans l'index JORF du dépôt. Pour la Cipav, le décret de
      1999 atteste la bonification sans en donner la forme, que seul le décret n°
      2026-418 écrit.
    date: 2026-09-23
  - type: autre
    reference: >-
      Guide 2026 de la CNAVPL, partie 2, pour la CAVAMAC et la Cipav ; page « Le
      calcul de votre retraite » de la CAVEC, « une augmentation de 10 % de la pension
      est accordée aux parents d'au moins 3 enfants », là où le guide de la CNAVPL,
      édité en mars 2026, écrit encore de la CAVEC que « le régime ne prévoit pas
      de majoration ».
    url: >-
      https://www.cavec.fr/votre-retraite/votre-retraite/preparer-votre-retraite/le-calcul-de-votre-retraite/
    date: 2026-09-23
textes_a_rattacher:
- reference: >-
    statuts du régime complémentaire de la CAVAMAC, article 18, approuvés par l'arrêté
    du 23 juin 2011 (JORFARTI000024270173)
- reference: >-
    décret n° 99-913 du 21 octobre 1999, article 6 (JORFTEXT000000561136) ; décret
    n° 79-262 du 21 mars 1979, article 5-2, dans la rédaction de l'article 20 du
    décret n° 2026-418 (JORFARTI000054153655)
- reference: >-
    statuts de la CAVEC, article 20, dans la rédaction de l'arrêté du 4 juillet
    2025 (JORFARTI000051849616), puis article 1.3.1 du règlement approuvé le 10
    juillet 2026
reformes:
- cipav_geometres_2000
- cavamac_statuts_2011
- cavec_majoration_enfants_2025
