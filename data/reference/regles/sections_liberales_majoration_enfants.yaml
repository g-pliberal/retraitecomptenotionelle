code:
  moteur: >-
    Les périodes de la complémentaire de la CAVAMAC depuis 2012, de la Cipav depuis
    2000, et de la CAVEC pour les pensions prenant effet depuis le 7 juillet 2025
    (`date_effet`), déclarent `majoration_enfants`, que `completer` sert au barème
    commun de `_taux_majoration_enfants`, 10 % dès trois enfants, sur la pension de
    chacune, minorée ou majorée par l'âge, à la période de liquidation
    (`periode_de_liquidation`). Le nombre d'enfants seul l'ouvre : ni l'éducation de
    neuf ans, ni les 5 % de la CAVAMAC par enfant handicapé ne sont portés.
  python: >-
    droit/completer.py : completer, _taux_majoration_enfants ; droit/commun.py :
    periode_de_liquidation
  javascript: >-
    moteur/js/droit/completer.js : completer, tauxMajorationEnfants
  parametres: >-
    contenu.parametres de chaque version : taux_a_trois_enfants ;
    regimes/cavamac_complementaire.yaml, regimes/cavec_complementaire.yaml,
    regimes/cipav_complementaire.yaml : avantages_non_contributifs, date_effet
  tests:
