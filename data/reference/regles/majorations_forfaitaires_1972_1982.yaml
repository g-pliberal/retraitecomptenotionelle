approximations:
- ecart: >-
    la durée que la condition lit est celle que la liquidation du régime retient ; la
    pension liquidée dans le cadre d'une coordination, avec les salariés agricoles ou
    une convention internationale, qui n'est majorée que si les règles de coordination
    « n'avaient pas permis la rémunération des années d'assurance accomplies au-delà »
    de la durée maximum, l'est sur la durée du seul régime
  effet: non mesuré
- ecart: >-
    l'ancien invalide dont la pension de vieillesse a remplacé une pension d'invalidité
    des deuxième et troisième groupes, à qui les circulaires refusent les majorations de
    1976, 1977, et celles de 5,5 % et 1,5 % de 1982, est majoré comme les autres
  effet: non mesuré
- ecart: >-
    les majorations de 1976 et de 1977 ne relèvent pas les pensions des salariés
    agricoles, que leurs lois ne nomment pas, ni celles des assurés d'Alsace-Moselle
    relevant du code local, que la loi n° 75-1279 vise à son article 7 et que le modèle
    ne distingue pas
  effet: non mesuré
sources:
  lu_le: 2026-10-09
  prochaine_relecture: 2027-10-31
  a_relire:
  - >-
    Ouverte le 9 octobre 2026, à l'étape 4 de l'action 138 : lue dans l'index LEGI et
    dans les circulaires de la Cnav. Les circulaires donnent les taux de la pension au
    maximum ainsi majorée — 40 % du salaire annuel moyen portés à 42 %, 44,1 % et
    46,30 %, 42,66 % portés à 47,04 %, 45,33 % à 47,82 %, 48 % à 48,72 % —, que
    tests/test_reversion.py rejoue ; aucun exemple chiffré d'une carrière n'a été
    trouvé.
  - >-
    Lire les textes qui ont appliqué les majorations de 1976 et de 1977 aux salariés
    agricoles, s'il en est, et le décret n° 76-405 du 10 mai 1976 pour l'Alsace-Moselle.
  lectures:
  - type: legifrance
    reference: >-
      loi n° 71-1132 du 31 décembre 1971, articles 8, 10 et 11 (LEGIARTI000006756027,
      029, 030) ; loi n° 75-1279 du 30 décembre 1975, articles 3, 4 et 7
      (LEGIARTI000006755694, 695, 697) ; loi n° 77-657 du 28 juin 1977, article 1er
      (LEGIARTI000006755703) ; loi n° 82-599 du 13 juillet 1982, articles 1er et 2
      (LEGIARTI000006756135, 136), dans l'index LEGI du dépôt
    date: 2026-10-09
  - type: circulaire_cnav
    reference: >-
      circulaires Cnav n° 15/76 du 22 janvier 1976, n° 64/77 du 11 juillet 1977 et
      n° 79/82 du 24 août 1982 (A, règles générales ; B, ex-invalides ; C, droits
      dérivés : « Les pensions de réversion accordées aux conjoints survivants
      d'assurés qui auraient pu bénéficier de ces majorations doivent être revalorisées
      dans les mêmes conditions »), lues le 9 octobre 2026 par l'API de la base de
      législation de la Cnav
    date: 1982-08-24
  - type: circulaire_cnav
    reference: >-
      exposé « Montant - retraite de réversion », « Avant le 01/12/1982 - Majorations
      forfaitaires » : le tableau des quatre dates, des durées et des taux ; « Elles
      s'appliquaient aux retraites de réversion, dès lors que l'assuré décédé aurait pu
      en bénéficier »
    date: 2025-10-24
    url: https://legislation.lassuranceretraite.fr/#/expose?file_leaf_ref=retraite_reversion_montant_montant_ex.aspx
