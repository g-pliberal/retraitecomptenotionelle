code:
  python: >-
    revalorisation.py : majorations_forfaitaires, PensionServie.coefficient ;
    droit/liquider.py : PensionRegime.sur_la_duree_maximum ; echeancier.py :
    Echeancier._pensions_au_deces ; droit/reversion.py : reversion,
    _majorations_ulterieures
  javascript: >-
    moteur/js/revalorisation.js : majorationsForfaitaires, PensionServie.coefficient ;
    moteur/js/droit/liquider.js ; moteur/js/echeancier.js ; moteur/js/droit/reversion.js
  parametres: contenu.parametres de chaque version
  tests: >-
    tests/test_reversion.py ; les témoins retraite_majoree_en_1982 et
    reversion_majorations_avant_1983 des simulations
historique:
- >-
  2026-10-09 — née et lue par le moteur, à l'étape 4 de l'action 138 : la note du 9
  octobre (« Ce qui reste », point 4) la déclarait absente.
effet: >-
  Les retraités du régime général partis avant 1975 sur la durée maximum de leur date :
  jusqu'à 22,7 % de plus pour une pension d'avant 1972, depuis décembre 1982 ; et la
  réversion de leur conjoint.
