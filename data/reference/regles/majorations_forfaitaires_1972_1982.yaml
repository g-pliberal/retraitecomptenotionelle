      - {date: "1972-01-01", taux: 0.05, duree_maximum: true, regimes: [regime_general, msa_salaries]}
      - {date: "1976-07-01", taux: 0.05, duree_maximum: true, regimes: [regime_general]}
      - {date: "1977-10-01", taux: 0.05, duree_maximum: true, regimes: [regime_general]}
