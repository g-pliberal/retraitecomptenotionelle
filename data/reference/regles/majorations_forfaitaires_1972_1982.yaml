      (LEGIARTI000006756135, 136), dans l'index LEGI du dépôt
    date: 2026-10-09
  - type: circulaire_cnav
    reference: >-
      circulaires Cnav n° 15/76 du 22 janvier 1976, n° 64/77 du 11 juillet 1977 et
      n° 79/82 du 24 août 1982 (A, règles générales ; B, ex-invalides ; C, droits
      dérivés : « Les pensions de réversion accordées aux conjoints survivants
      d'assurés qui auraient pu bénéficier de ces majorations doivent être revalorisées
      dans les mêmes conditions »), lues le 9 octobre 2026 par l'API de la base de
      législation de la Cnav
    date: 1982-08-24
  - type: circulaire_cnav
    reference: >-
      exposé « Montant - retraite de réversion », « Avant le 01/12/1982 - Majorations
      forfaitaires » : le tableau des quatre dates, des durées et des taux ; « Elles
      s'appliquaient aux retraites de réversion, dès lors que l'assuré décédé aurait pu
      en bénéficier »
    date: 2025-10-24
    url: https://legislation.lassuranceretraite.fr/#/expose?file_leaf_ref=retraite_reversion_montant_montant_ex.aspx
  - type: legifrance
    reference: >-
      décret n° 76-405 du 10 mai 1976, visas et articles 1er à 5 (LEGITEXT000006062483,
      LEGIARTI000006762088 à LEGIARTI000006762092) : la retraite anticipée des
      travailleurs manuels et des mères de famille de l'ex-régime local (articles 1er à 3,
      5), et « Les taux de majoration forfaitaire fixés par l'article 9 du décret n° 76-404
      du 10 mai 1976 sont applicables aux pensions de vieillesse accordées aux assurés
      remplissant les conditions prévues à l'article 1er ci-dessus, dont l'entrée en
      jouissance est antérieure au 1er juillet 1976 et qui ont été réduites en
      application de l'article L. 367 » (article 4) ; loi n° 75-1279, article 4
      (LEGIARTI000006755695), article 5, et article 7 (LEGIARTI000006755697) ; L. 357-1 et
      L. 357-2 CSS (LEGIARTI000006742686, LEGIARTI000006742687) ; l'article 1er bis du
      décret n° 51-727 dans sa rédaction du 26 août 1977 (LEGIARTI000006773767) et les
      articles du décret n° 50-1225, qui ne portent pas les majorations de 1976 et de
      1977 ; dans l'index LEGI du dépôt mis à jour au 23 octobre 2026
    date: 2026-10-24
  - type: jorf
    reference: >-
      dans l'index JORF du dépôt mis à jour au 24 octobre 2026, qui n'en garde que la
      notice : le décret n° 76-727 du 28 juillet 1976 « relatif aux conditions d'accès à
      la retraite de certains travailleurs manuels au regard du régime des assurances
      sociales agricoles » (JORFTEXT000000306384), dont la « majoration des pensions de
      vieillesse dues au titre des parag. 1, 2 et 2 bis » du décret n° 51-727 ; le décret
      n° 76-1177 du 17 décembre 1976 (JORFTEXT000000862032), qui « fixe les taux de
      majoration forfaitaire » des pensions des travailleurs manuels salariés agricoles ;
      le décret n° 77-966 du 19 août 1977 « rendant applicables, au régime des
      assurances sociales agricoles, les dispositions de la loi » n° 77-657
      (JORFTEXT000000875615) ; le décret n° 76-404 (JORFTEXT000000855584) ; pour
      l'ex-régime local, de 1972 à 1983, les seuls décrets n° 76-405, n° 78-319 (la
      pension des femmes à soixante ans) et n° 82-629 (les ordonnances de 1982)
    date: 1977-08-26
  - type: circulaire_cnav
    reference: >-
      circulaire Cnav n° 2/72 du 31 janvier 1972, IV, B, et circulaires n° 15/76, n° 64/77
      et n° 79/82, B, relues le 24 octobre 2026 par l'API de la base de législation de la
      Cnav : « La majoration forfaitaire de 5 % s'applique uniquement à la pension de
      vieillesse résultant des cotisations. En conséquence, pour les ex-invalides, une
      nouvelle comparaison devrait, en principe, être faite entre cette pension de
      vieillesse majorée et la pension d'invalidité afin de servir le montant le plus
      élevé » ; « tous les ex-invalides des 2ème et 3ème groupes perçoivent une pension
      de vieillesse de substitution égale à 50 % de leur salaire annuel moyen et que de
      ce fait la majoration ne leur est pas due » ; en 1982, pour les pensions d'avant
      1973, « il a été décidé d'en faire bénéficier tous les ex-invalides (quel que soit
      leur groupe) » ; « en cas de réclamation, les redressements nécessaires devront
      être effectués lorsque l'assuré y aura intérêt »
    date: 1982-08-24
