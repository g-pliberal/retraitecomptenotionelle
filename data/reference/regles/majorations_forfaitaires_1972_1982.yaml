schema_version: 1
id: majorations_forfaitaires_1972_1982
intitule: >-
  Les pensions de vieillesse du régime général qui ont pris effet avant 1975 sont
  majorées forfaitairement : de 5 % au 1er janvier 1972, au 1er juillet 1976 et au 1er
  octobre 1977, celles d'avant 1973 liquidées sur la durée d'assurance maximum de leur
  date — 120 trimestres avant 1972, 128 en 1972 — ; au 1er décembre 1982, de 6 % celles
  d'avant 1972, de 4 % celles de 1972, de 5,5 % celles de 1973 liquidées sur 136
  trimestres et de 1,5 % celles de 1974 liquidées sur 144. Celles des salariés agricoles
  le sont en 1972 et en 1982. La réversion du conjoint de l'assuré qui aurait pu en
  bénéficier les suit.
domaine: revalorisation
regimes: [regime_general, msa_salaries]
etape: faire_vivre
face: droit
etat: transcrite
lit:
- la date d'effet de la pension et son régime
- la durée d'assurance que sa liquidation a retenue, et la durée maximum que sa date
  prenait en compte
ecrit:
- le coefficient qui mène la pension jusqu'à l'échéance, chaque majoration comprise à
  partir de sa date, et la bonification pour enfants avec elle
- les majorations que la réversion reçoit après l'année de ses montants
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la PENSION PERSONNELLE ;
# chacune dit les majorations qui la relèvent après cette date, leur jour, leur
# taux, les régimes que leur loi nomme, et si elles ne valent que pour la
# pension liquidée sur la durée maximum de sa date (`duree_maximum`).
