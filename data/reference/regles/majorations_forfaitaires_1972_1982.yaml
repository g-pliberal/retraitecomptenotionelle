approximations:
- ecart: >-
    la durée que la condition lit est celle que la liquidation du régime retient ; la
    pension liquidée dans le cadre d'une coordination, avec les salariés agricoles ou
    une convention internationale, qui n'est majorée que si les règles de coordination
    « n'avaient pas permis la rémunération des années d'assurance accomplies au-delà »
    de la durée maximum, l'est sur la durée du seul régime
  effet: non mesuré
- ecart: >-
    les majorations ne relèvent que « la pension de vieillesse résultant des
    cotisations », que la caisse devait « en principe » comparer à la pension
    d'invalidité de l'ex-invalide « afin de servir le montant le plus élevé » : la
    pension substituée ne peut être inférieure à la pension d'invalidité (ordonnance de
    1945, article 62). Les circulaires en tirent que l'ex-invalide des deuxième et
    troisième groupes, dont la pension substituée vaut 50 % de son salaire annuel moyen,
    plus que la pension majorée sur la durée maximum de sa date — 46,30 % au plus avant
    1972, 47,04 % en 1972, 47,82 % en 1973, 48,72 % en 1974 —, n'a pas les majorations de
    1972, 1976 et 1977, ni celles de 5,5 % et de 1,5 % de 1982 ; et elles donnent les 6 % et
    les 4 % de 1982 à tous les ex-invalides, quel que soit leur groupe. Le modèle majore
    la pension de vieillesse de l'ex-invalide comme celle de tout autre, ce que dit la
    loi, sans la comparer : il ne sert pas le plancher de la pension substituée (fiche
    pension_d_invalidite_substituee) et ne connaît ni le groupe ni le montant de la
    pension d'invalidité
  effet: >-
    l'ex-invalide des deuxième et troisième groupes parti avant 1975, servi à 50 % de
    son salaire annuel moyen, que le modèle sert à sa pension majorée, plus basse ; non
    mesuré
- ecart: >-
    les majorations de 1976 et de 1977 ne relèvent pas les pensions des salariés
    agricoles : leurs lois ne les nomment pas, et les décrets qui les leur ont étendues
    ne sont lus que dans leur notice — le décret n° 76-727 du 28 juillet 1976, qui porte
    « majoration des pensions de vieillesse dues au titre des parag. 1, 2 et 2 bis » de
    l'article 1er bis du décret n° 51-727, et le décret n° 77-966 du 19 août 1977,
    « rendant applicables, au régime des assurances sociales agricoles, les dispositions
    de la loi » n° 77-657 — : leur date d'effet, leurs conditions et les fractions de
    pension qu'ils majorent restent à lire au Journal officiel
  effet: >-
    5 % au 1er juillet 1976, puis 5 % au 1er octobre 1977, de la pension du salarié
    agricole partie avant 1973 sur la durée maximum de sa date, et de la réversion de son
    conjoint, si ces décrets les leur donnent comme au régime général ; non mesuré
- ecart: >-
    l'assuré du code local d'Alsace-Moselle n'est pas distingué. La loi n° 75-1279 lui
    est applicable (article 7), et le décret n° 76-405 qui l'adapte ne touche pas à la
    majoration de son article 3 : ses articles 1er à 3 et 5 règlent la retraite
    anticipée des travailleurs manuels et des mères de famille, son article 4 la
    majoration de l'article 5 de la loi. La loi n° 77-657 ne le nomme pas, et l'index du
    Journal officiel ne porte, de 1977 à 1983, aucun décret qui la lui étende. La
    pension du code local, « une somme de base et [...] des majorations proportionnelles
    aux cotisations ou au salaire » (L. 357-1, L. 357-2), sans durée maximum, est hors du
    champ du modèle (inventaire, regime_local_alsace_moselle) ; sa pension du régime
    général est majorée comme toute autre
  effet: nul sur ce que le modèle calcule, qui ne sert pas la pension du code local
sources:
  lu_le: 2026-10-24
  prochaine_relecture: 2027-10-31
  a_relire:
  - >-
    Ouverte le 9 octobre 2026, à l'étape 4 de l'action 138 : lue dans l'index LEGI et
    dans les circulaires de la Cnav. Les circulaires donnent les taux de la pension au
    maximum ainsi majorée — 40 % du salaire annuel moyen portés à 42 %, 44,1 % et
    46,30 %, 42,66 % portés à 47,04 %, 45,33 % à 47,82 %, 48 % à 48,72 % —, que
    tests/test_reversion.py rejoue ; aucun exemple chiffré d'une carrière n'a été
    trouvé.
  - >-
    Au propriétaire, que seul son poste ouvre le fac-similé du Journal officiel : lire
    le décret n° 76-727 du 28 juillet 1976 (Journal officiel du 4 août 1976,
    JORFTEXT000000306384) et le décret n° 77-966 du 19 août 1977 (Journal officiel du 26
    août 1977, JORFTEXT000000875615), qui étendent aux salariés agricoles les
    majorations de 1976 et de 1977 : leur date d'effet, la durée maximum qu'ils
    exigent, la date d'entrée en jouissance qu'ils visent, les fractions de pension
    coordonnées. Lus, msa_salaries entre dans les majorations de 1976 et de 1977 des
    versions avant_1972 et en_1972, et l'écart des salariés agricoles tombe. L'index
    LEGI n'en porte rien : l'article 1er bis du décret n° 51-727 dans sa rédaction du 26
    août 1977 (LEGIARTI000006773767) et le décret n° 50-1225 ne contiennent pas ces
    majorations, qui sont restées des articles autonomes des deux décrets.
  - >-
    L'article 5 de la loi n° 75-1279 majore, d'un taux selon l'âge de liquidation que
    fixe l'article 9 du décret n° 76-404 (l'index n'en garde que la notice), les pensions
    des travailleurs manuels et des mères de famille liquidées avant le 1er juillet 1976
    à un taux réduit ; d'après leurs notices, les décrets n° 76-727 et n° 76-1177 du 17
    décembre 1976 la rendent applicable aux salariés agricoles et en fixent les taux.
    Aucune fiche ne la porte (fiche voisine : taux_plein_travailleurs_manuels).
