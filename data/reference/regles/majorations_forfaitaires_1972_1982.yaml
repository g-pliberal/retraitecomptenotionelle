    lu_le: 2026-10-09
  - id: LEGIARTI000006756135
    article: loi n° 82-599 du 13 juillet 1982, article 1er
    en_vigueur: 1982-12-01
    citation: >-
      « Les pensions de vieillesse dues aux assurés du régime général au titre des
      articles L. 331 et L. 332 du code de la sécurité sociale ainsi que les pensions
      de vieillesse des salariés des assurances sociales agricoles sont majorées
      forfaitairement de : 6 % quand elles ont pris effet avant le 1er janvier 1972 »
    lu_le: 2026-10-09
  nee_de: LEGIARTI000006756027
  bornes:
    liquidation.date_effet: [null, 1972-01-01]
  contenu:
    droit: >-
      5 % au 1er janvier 1972, au 1er juillet 1976 et au 1er octobre 1977 à la pension
      liquidée sur cent vingt trimestres, la première aux salariés agricoles aussi ; 6 %
