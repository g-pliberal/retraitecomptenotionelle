schema_version: 1
id: majoration_dix_pour_cent
intitule: >-
  Majoration de 10 % pour trois enfants au régime général, sur la retraite telle
  que calculée, et chez les non-salariés agricoles depuis le 1er juillet 1974 ;
  plafonnée en euros à l'Agirc-Arrco, dont les taux sont ceux de la ligne
  `majoration_enfants_agirc_arrco`.
regimes:
- agirc
- agirc_arrco
- agirc_entreprises_nouvelles
- arrco
- arrco_cultes
- arrco_tranche_2
- arrco_tranche_2_entreprises_nouvelles
- cancava
- msa_non_salaries
- msa_salaries
- organic
- regime_general
- rsi
etat: conforme
etape: completer_tous_regimes
effet: Parents de trois enfants.
sources:
  lu_le: 2026-09-21
  prochaine_relecture: 2026-11-30
  a_relire:
  - >-
    Relire le plafond Agirc-Arrco chaque novembre — c'est la seule pièce du dispositif
    qui ne soit tenue par aucun des trois témoins, ceux-ci mesurant le TAUX et son
    assiette, pas l'écrêtement en euros de la complémentaire.
  - >-
    DROIT EN PROJET, À SUIVRE JUSQU'À LA PROMULGATION : l'article 34 du projet de loi de
    financement pour 2027 (n° 3211, déposé le 1er octobre 2026) remplacerait, pour les
    pensions prenant effet à compter du 1er juillet 2027, la majoration proportionnelle
    de L. 351-12 par une majoration forfaitaire de tous les régimes de base (L. 173-1-6
    nouveau), fixée par décret et revalorisée comme les pensions ; dans la fonction
    publique, L. 18 réécrit, une majoration forfaitaire complémentaire selon le nombre
    d'enfants (L. 18 bis) et un plafond au traitement de L. 15 (L. 18 ter) ; la
    réversion majorée d'un forfait (L. 353-1). Le montant serait fixé « de manière à
    garantir un coût global du même ordre » que le dispositif actuel, selon l'exposé
    des motifs. Selon l'annexe 9 du projet, que cite le rapport n° 3345 (tome II), le
    forfait vaudrait de 105 à 110 € par mois pour une carrière complète au taux plein,
    proratisé en deçà, et le forfait complémentaire des régimes intégrés (L. 18 bis, et
    L. 5552-22, II, des marins), de 85 à 90 €, plus un forfait dès le quatrième enfant ;
    les complémentaires, l'Agirc-Arrco et l'Ircantec, gardent leur majoration
    proportionnelle. L'Assemblée a rejeté le projet en première lecture le 23 octobre
    2026 (T.A. n° 358), faute d'en avoir adopté la deuxième partie (LO 111-7-1) :
    l'article 34 n'y a pas été discuté, et le Sénat examinera le texte déposé. Rien
    n'entre au scénario 1 avant la loi promulguée, la décision du Conseil
    constitutionnel et le décret qui fixera les montants.
  lectures:
  - type: autre
    reference: >-
      Assemblée nationale, projet de loi de financement de la sécurité sociale pour 2027
      rejeté le 23 octobre 2026, T.A. n° 358 : « L'Assemblée nationale n'ayant pas
      adopté la deuxième partie du projet de loi, celui-ci est considéré comme rejeté en
      première lecture en application de l'article L.O. 111-7-1 » ; rapport n° 3345 de
      la commission des affaires sociales, tome II, commentaire de l'article 34 (annexe 9
      du projet : forfait de 105 à 110 € par mois, complémentaire de 85 à 90 €)
    url: https://www.assemblee-nationale.fr/dyn/17/textes/l17t0358_texte-adopte-seance
    date: 2026-10-23
  - type: autre
    reference: >-
      Assemblée nationale, projet de loi de financement de la sécurité sociale pour 2027,
      n° 3211, article 34 « Forfaitiser et harmoniser la majoration de pension pour
      enfants » et son exposé des motifs, texte déposé le 1er octobre 2026
    url: https://www.assemblee-nationale.fr/dyn/17/dossiers/PLFSS_2027
    date: 2026-10-01
  - type: autre
    reference: >-
      Cour de justice de l'Union européenne, 12 décembre 2019, WA c. INSS, C-450/18 : un
      complément de pension réservé aux mères est une discrimination directe fondée sur
      le sexe (directive 79/7/CEE) ; la majoration de L. 351-12, ouverte à « tout assuré
      de l'un ou de l'autre sexe », n'est pas en cause, et l'article 34 du projet garde un
      forfait identique pour les hommes et les femmes
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=celex%3A62018CJ0450
    date: 2019-12-12
  - type: autre
    reference: Agirc-Arrco, plafond de la majoration familiale (novembre 2025)
    date: 2025-11-01
  - type: circulaire_cnav
    reference: >-
      circulaire 2022-26 du 14 octobre 2022, Majoration pour enfants, point 3.2
      : l'assiette est la retraite majorée par la surcote, 10 % × (600 + 22,50)
      = 62,25
    date: 2022-10-14
  - type: service_public
    reference: fiche F16336, majoration de 10 % pour trois enfants au régime général
    date: 2026-08-14
  - type: legifrance
    reference: >-
      non-salariés agricoles : décret n° 55-753, article 37 (LEGIARTI000006763657 et
      LEGIARTI000006763658), « une bonification d'un dixième » à compter du 1er
      juillet 1974 ; D. 732-38 du code rural (LEGIARTI000006597504), du 22 avril 2005
      au 31 décembre 2025 ; L. 351-12 depuis, par le décret n° 2025-1409
    date: 2025-12-31
  - type: autre
    reference: >-
      MSA, guide « Comprendre sa retraite de non-salarié agricole » : « au moins 3
      enfants, le montant de votre retraite est majoré de 10 % » ; CLEISS, le régime
      des non-salariés agricoles (2026) : les majorations pour enfants « sur la durée
      d'assurance ou le montant de la retraite »
    date: 2026-10-05
    url: https://ain-rhone.msa.fr/lfp/documents/98785/2512733/Guide+-+Comprendre+sa+retraite+de+non+salari%C3%A9+agricole
textes_a_rattacher:
- reference: L. 351-12 CSS
- reference: accord national interprofessionnel Agirc-Arrco
exemples:
- cnav_2022_26_majoration_enfants_sur_surcote
- cnav_2022_26_majoration_enfants_au_taux_plein
- cnav_2022_26_majoration_enfants_sur_decote
code:
  moteur: >-
    `completer` majore, après les minima et la surcote parentale, chaque pension dont la
    période de la date d'effet déclare `majoration_enfants`, au taux de
    `_taux_majoration_enfants` : faute d'un barème propre à la période
    (`taux_majoration_enfants`), 10 % dès trois enfants hors de la fonction publique. Le
    régime général et les salariés agricoles la déclarent depuis 1945, les artisans et
    les commerçants depuis leur alignement de 1973, les non-salariés agricoles depuis
    1974 ; elle porte sur le montant que la pension sert alors, surcote et minimum
    compris. À l'Agirc-Arrco, chaque point a le taux de son année d'acquisition (fiche
    `majoration_enfants_agirc_arrco`), et la majoration de chaque régime qui oppose le
    plafond (`plafond_majoration_regime`) est bornée par `plafond_majoration` : le
    plafond de la période, publié l'année `plafond_majoration_annee` et suivi depuis au
    point du régime, aux générations nées depuis 1952 et aux pensions prenant effet
    depuis 2012 (`PREMIER_PLAFOND_MAJORATION`) ; `regime_du_plafond` oppose aux points
    de l'Arrco et de l'Agirc servis depuis 2019 celui du régime unifié.
  python: >-
    droit/completer.py : completer, _taux_majoration_enfants, plafond_majoration,
    regime_du_plafond, PREMIER_PLAFOND_MAJORATION
  javascript: >-
    moteur/js/droit/completer.js : completer, tauxMajorationEnfants, plafondMajoration,
    regimeDuPlafond, PREMIER_PLAFOND_MAJORATION
  parametres: >-
    regimes/cancava.yaml, regimes/msa_non_salaries.yaml, regimes/msa_salaries.yaml,
    regimes/organic.yaml, regimes/regime_general.yaml, regimes/rsi.yaml :
    avantages_non_contributifs ; regimes/agirc.yaml, regimes/agirc_arrco.yaml,
    regimes/agirc_entreprises_nouvelles.yaml, regimes/arrco.yaml,
    regimes/arrco_cultes.yaml, regimes/arrco_tranche_2.yaml,
    regimes/arrco_tranche_2_entreprises_nouvelles.yaml : plafond_majoration_enfants,
    plafond_majoration_annee, plafond_majoration_regime
  tests:
  - tests/test_destinie.py
  - tests/test_ircec_auteurs.py
  - tests/test_minima_agricoles.py
  - tests/test_oracle.py
  - tests/test_oracle_points_enfants_arrco.py
  - tests/test_revalorisation.py
  - tests/test_simulateur.py
  - tests/test_trajectoire.py
  - >-
    tests/test_exonerations_agirc_arrco.py, tests/test_majoration_exceptionnelle.py,
    tests/test_pension_minimum_avant_1983.py, tests/test_taux_plein_par_categorie.py et
    tests/test_versements_uniques.py, qui confrontent les deux moteurs sur des carrières
    qui la portent
  - >-
    tests/temoins/exemples_officiels.yaml, que tests/test_oracle.py rejoue :
    cnav_2022_26_majoration_enfants_au_taux_plein,
    cnav_2022_26_majoration_enfants_sur_decote et
    cnav_2022_26_majoration_enfants_sur_surcote
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    treize témoins changent sans la majoration du régime général et des régimes alignés
    — enfants, enfants_pere, enfants_regime_aligne, enfants_exploitante_agricole,
    enfants_carriere_incomplete, enfants_avant_1972, enfants_loi_boulin,
    taux_plein_mere_ouvriere, departs_prive_puis_categorie_active_trois_enfants,
    reversion_deces_avant_le_depart, auteur_dramatique_carriere_courte,
    ircantec_quatre_enfants et ircantec_sept_enfants —, dont six sans le plafond de
    l'Agirc-Arrco
