- id: avant_derniere_annee_1979
  statut: lue
  textes:
  - id: LEGIARTI000006766114
    article: "décret n° 78-351 du 14 mars 1978, article 12"
    en_vigueur: 1978-03-19
    lu_le: 2026-11-05
    citation: >-
      Le présent décret entrera en vigueur : Pour l'obligation de cotiser, le 1er
      janvier 1979 ; Pour l'entrée en jouissance des prestations, le 1er avril 1979.
  - id: LEGIARTI000006766103
    article: "décret n° 78-351 du 14 mars 1978, article 3"
    en_vigueur: 1978-03-19
    lu_le: 2026-11-03
    citation: >-
      I - Pour les assurés en activité autres que ceux visés aux II et III ci-après, la
      cotisation annuelle du régime d'assurance vieillesse complémentaire est assise sur
      les revenus professionnels non-salariés de l'avant-dernière année civile déclarés
      dans les conditions fixées à l'article 3 du décret du 22 janvier 1973 susvisé et
      dans la limite d'un plafond égal à trois fois celui visé à l'article L. 663-9 du
      code de la sécurité sociale en vigueur dans l'année où la cotisation est due. [...]
      II - Pour les assurés commençant l'exercice d'une activité artisanale ou assimilée,
      la cotisation annuelle d'assurance vieillesse complémentaire est assise : a) Pour
      l'année ou la fraction d'année de début d'exercice, sur un revenu correspondant au
      tiers du plafond visé au premier alinéa du I du présent article ; b) Pour l'année
      suivante, sur un revenu correspondant à la moitié dudit plafond. III - Pour les
      aides familiaux, la cotisation annuelle d'assurance vieillesse complémentaire est
      assise sur un revenu égal au tiers du plafond visé au premier alinéa du I du
      présent article.
  - id: LEGIARTI000006766105
    article: "décret n° 78-351 du 14 mars 1978, article 5"
    en_vigueur: 1978-03-19
    lu_le: 2026-11-03
    citation: >-
      I - Le taux de la cotisation annuelle d'assurance vieillesse complémentaire est
      fixé à 4,40 p. 100 du revenu visé aux articles 3 et 4. [...] IV - Les articles 12
      à 14, 16 et 18 du décret du 22 janvier 1973 susvisé sont applicables à la
      cotisation d'assurance vieillesse complémentaire.
  - id: LEGIARTI000006766107
    article: "décret n° 78-351 du 14 mars 1978, article 6"
    en_vigueur: 1978-03-19
    lu_le: 2026-11-03
    citation: >-
      I - Il est ouvert, au nom de chacun des assurés, un compte de points de retraite ;
      le nombre de points portés à ce compte chaque année est déterminé en divisant le
      montant des cotisations de l'assuré afférentes à l'exercice par un revenu de
      référence.
  nee_de: LEGIARTI000006766103
  bornes:
    revenu.annee: [1979-01-01, 1985-01-01]
  contenu:
    parametres:
      annees_de_decalage: 2
      diviseurs_du_plafond_au_debut: [3, 2]
      plafonds_de_l_assiette: 3
      taux_des_points: 0.044
    droit: >-
      la cotisation de l'exercice N, à 4,40 %, est assise sur le revenu de N − 2, dans la
      limite de trois plafonds de l'année N ; l'année de début d'exercice, sur un tiers
      du plafond, la suivante sur la moitié ; ses points sont la cotisation divisée par
      le revenu de référence de l'exercice. Aucun ajustement sur le revenu de l'année :
      l'article 5, IV, ne rend applicables que les articles 12 à 14, 16 et 18 du décret
      n° 73-76, non son article 9, qui ajuste la cotisation du régime de base
    conditions: >-
      le plafond du forfait est celui de la sécurité sociale, non l'assiette maximale
      de trois plafonds : la caisse calcule la cotisation complémentaire de l'aide
      familial, que le III assied dans les mêmes mots « sur un revenu égal au tiers du
      plafond visé au premier alinéa du I », « sur le tiers du plafond de la sécurité
      sociale » (exposé « Rachat aide familial »), et la rédaction de 2004 l'écrit
      (D. 635-7, « au tiers du plafond mentionné à l'article L. 241-3 ») ; « Toutefois,
      le montant de cette cotisation ne peut être inférieur à celui qui serait dû au
      titre d'un revenu égal au revenu minimum prévu à l'article 2 du décret du 22
      janvier 1973 » (article 3, I), 200 heures du Smic du 1er janvier, que le modèle
      oppose depuis le 5 novembre 2026, hors du forfait de début (le II) et de l'aide
      familial (le III), que le I ne vise pas ; le règlement peut,
      « sur demande motivée », asseoir la cotisation « sur un revenu inférieur »
      (article 4, II, LEGIARTI000006766104)
  exemples: aucun trouvé
