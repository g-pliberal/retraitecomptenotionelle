- id: regularisation_2009
  statut: lue
  textes:
  - id: JORFARTI000019996956
    article: "décret n° 2008-1427 du 22 décembre 2008, article 1er"
    en_vigueur: 2008-12-28
    publie_le: 2008-12-28
    lu_le: 2026-11-03
    citation: >-
      I. ― La première phrase de l'article D. 635-2 du code de la sécurité sociale est
      remplacée par les dispositions suivantes : « La cotisation annuelle au régime
      complémentaire obligatoire d'assurance vieillesse est calculée suivant les
      modalités prévues au cinquième alinéa de l'article L. 131-6. » II.-Les dispositions
      du présent article s'appliquent aux cotisations dues au titre des revenus des
      années 2009 et suivantes.
  - id: LEGIARTI000020032159
    article: "code de la sécurité sociale, D. 635-2"
    en_vigueur: 2008-12-29
    lu_le: 2026-11-03
    citation: >-
      La cotisation annuelle au régime complémentaire obligatoire d'assurance vieillesse
      est calculée suivant les modalités prévues au cinquième alinéa de l'article
      L. 131-6.
  - id: LEGIARTI000020169101
    article: "code de la sécurité sociale, L. 131-6"
    en_vigueur: 2009-01-01
    lu_le: 2026-11-03
    citation: >-
      Les cotisations sont établies sur une base annuelle. Elles sont calculées, à titre
      provisionnel, en pourcentage du revenu professionnel de l'avant-dernière année ou
      des revenus forfaitaires. Lorsque le revenu professionnel est définitivement connu,
      les cotisations font l'objet d'une régularisation.
  - id: LEGIARTI000017869802
    article: "code de la sécurité sociale, D. 635-7"
    en_vigueur: 2008-01-01
    lu_le: 2026-11-03
    citation: >-
      Pour les assurés commençant l'exercice d'une profession artisanale ou assimilée,
      la cotisation annuelle est assise : 1° Pour l'année ou la fraction d'année de début
      d'exercice, sur un revenu correspondant au tiers du plafond mentionné à l'article
      L. 241-3 ; 2° Pour l'année suivante, sur un revenu correspondant à la moitié dudit
      plafond.
  - id: LEGIARTI000020032165
    article: "code de la sécurité sociale, D. 635-10"
    en_vigueur: 2009-01-01
    lu_le: 2026-11-03
    citation: >-
      Pour les assurés commençant l'exercice de leur activité, la cotisation annuelle est
      calculée sur les revenus forfaitaires mentionnés au septième alinéa de l'article
      L. 131-6.
  nee_de: JORFARTI000019996956
  bornes:
    revenu.annee: [2009-01-01, 2012-01-01]
  contenu:
    parametres:
      annees_de_decalage_du_conjoint_a_l_option: 2
      plafonds_de_l_assiette: 4
      plafonds_de_l_assiette_des_commercants: 3
    droit: >-
      la cotisation est provisionnelle, puis régularisée sur le revenu de l'année :
      D. 635-2 la calcule « suivant les modalités prévues au cinquième alinéa de
      l'article L. 131-6 », « à titre provisionnel, en pourcentage du revenu
      professionnel de l'avant-dernière année ou des revenus forfaitaires », puis
      régularisée « lorsque le revenu professionnel est définitivement connu ». Le forfait
      du commerçant qui commence, les revenus forfaitaires de L. 131-6, calculés « à
      titre provisionnel » (D. 635-10), n'est que l'acompte, régularisé comme le reste.
      Celui de l'artisan, un tiers puis la moitié du plafond, que D. 635-7 dit
      « assise » sans le dire provisionnel, est lu de même : c'est une lecture, que ni
      un texte ni un document de la caisse lu ne dit en toutes lettres (approximation
      de cette fiche). La caisse des artisans voulait une régularisation « dans les
      mêmes conditions que celle applicable au régime légal de base », dont les forfaits
      de début sont provisionnels (L. 131-6), et la prise en compte de son montant
      « pour la détermination des points cotisés » (circulaire RSI n° 2008/031,
      § 3.1.2, écrite au conditionnel). Le conjoint collaborateur à l'option reste sur la fraction du revenu du
      chef de l'avant-dernière année, que D. 635-10-2 (LEGIARTI000006738041, jusqu'au
      1er janvier 2013) ne régularise pas
    conditions: >-
      le revenu minimum de D. 633-2 reste le minimum de la cotisation (D. 635-2), que le
      modèle oppose, à celui qui commence comme aux autres, sa cotisation régularisée
      n'ayant plus de forfait : 200 heures du Smic du 1er janvier (D. 633-2,
      LEGIARTI000006737879)
  exemples: aucun trouvé
- id: sans_forfait_2012
  statut: lue
  textes:
  - id: JORFARTI000025055800
    article: "décret n° 2011-2038 du 29 décembre 2011, article 3"
    en_vigueur: 2012-01-01
    publie_le: 2011-12-30
    lu_le: 2026-11-03
    citation: >-
      II. ― Sont supprimés : 1° A l'article D. 635-7 du même code, les sixième, septième
      et huitième alinéas ; 2° A l'article D. 635-10 du même code, la phrase : « Pour les
      assurés commençant l'exercice de leur activité, la cotisation annuelle est
      calculée sur les revenus forfaitaires mentionnés au septième alinéa de l'article
      L. 131-6. »
  - id: LEGIARTI000025091410
    article: "code de la sécurité sociale, D. 635-7"
    en_vigueur: 2012-01-01
    lu_le: 2026-11-03
    citation: >-
      Le taux de la cotisation annuelle d'assurance vieillesse complémentaire des
      artisans est fixé à : 1° 7,2 % pour la part du revenu professionnel n'excédant pas
      le plafond prévu au quatrième alinéa du présent article ; 2° 7,6 % pour la part du
      revenu professionnel excédant le seuil fixé au 1°, dans la limite de quatre fois le
      plafond annuel prévu à l'article L. 241-3. [...]
  - id: LEGIARTI000025013725
    article: "code de la sécurité sociale, L. 131-6-2"
    en_vigueur: 2011-12-23
    lu_le: 2026-11-03
    citation: >-
      Les cotisations sont dues annuellement. Elles sont calculées, à titre
      provisionnel, en pourcentage du revenu d'activité de l'avant-dernière année. Pour
      les deux premières années d'activité, les cotisations provisionnelles sont
      calculées sur un revenu forfaitaire fixé par décret [...]. Lorsque le revenu
      d'activité est définitivement connu, les cotisations font l'objet d'une
      régularisation.
  - id: LEGIARTI000025629861
    article: "code de la sécurité sociale, D. 635-2"
    en_vigueur: 2012-04-05
    lu_le: 2026-11-03
    citation: >-
      La cotisation annuelle au régime complémentaire obligatoire d'assurance vieillesse
      est calculée suivant les modalités prévues aux premier, deuxième et troisième
      alinéas de l'article L. 131-6-2. [...] Pour les travailleurs indépendants dont la
      durée d'affiliation est au moins égale à quatre-vingt-dix jours au cours de l'année
      au titre de laquelle la cotisation est due, ladite cotisation ne peut être calculée
      sur une assiette inférieure à celle mentionnée au dernier alinéa de l'article
      D. 633-2.
  - id: LEGIARTI000025628404
    article: "décret n° 2012-443 du 3 avril 2012, article 10"
    en_vigueur: 2012-04-05
    lu_le: 2026-11-05
    citation: >-
      II. ― Les cotisations définitives dues au titre de l'année 2012 par les
      travailleurs indépendants non agricoles qui cessent leur activité au cours de
      cette même année demeurent régies par les dispositions du code de la sécurité
      sociale qui leur sont applicables dans leur rédaction antérieure à la date de
      publication du présent décret, sauf si ces personnes reprennent leur activité
      avant le 1er janvier 2013.
  nee_de: JORFARTI000025055800
  bornes:
    revenu.annee: [2012-01-01, 2013-01-01]
  contenu:
    parametres:
      annees_de_decalage_du_conjoint_a_l_option: 2
      plafonds_de_l_assiette: 4
      plafonds_de_l_assiette_des_commercants: 3
    droit: >-
      plus de forfait propre à la complémentaire : sa cotisation suit L. 131-6-2,
      provisionnelle, sur le revenu forfaitaire de D. 131-1 les deux premières années
      (décret n° 2011-2038, article 1er), puis régularisée « lorsque le revenu d'activité
      est définitivement connu » ; sauf celle du conjoint collaborateur à l'option,
      encore sur la fraction du revenu du chef de l'avant-dernière année (D. 635-10-2)
    conditions: >-
      depuis le 5 avril 2012, dès quatre-vingt-dix jours d'affiliation dans l'année, la
      cotisation « ne peut être calculée sur une assiette inférieure » à celle du régime
      de base (D. 635-2, LEGIARTI000025629861), 5,25 % du plafond annuel du 1er janvier
      « sans application du deuxième alinéa de l'article D. 612-6 », son prorata
      (D. 633-2, LEGIARTI000025629830) : 1 909,53 € en 2012, au-dessus des 200 heures du
      Smic, 1 844 €, que l'article 4, V, du décret n° 2012-443 (LEGIARTI000025628392) leur
      oppose ; l'article 5 de ce décret modifie D. 635-2 (LEGIARTI000025628394), et son
      article 10, II, garde l'ancien droit à qui cesse en 2012 sans reprendre avant 2013
      (LEGIARTI000025628404)
