  - type: legifrance
    reference: >-
      décret n° 78-351, articles 3 à 6, rédactions de 1978 et du 1er janvier 1985
      (LEGIARTI000006766103 à LEGIARTI000006766108) ; D. 635-1, D. 635-2, D. 635-4,
      D. 635-6, D. 635-7, D. 635-10, D. 635-10-2, D. 633-6, D. 633-19-2, R. 242-16 et
      L. 131-6, toutes leurs rédactions de 1985 à 2016 dans l'index LEGI, à jour du
