schema_version: 1
id: assiette_rco_independants
intitule: >-
  La complémentaire obligatoire des artisans (1979-2012) et celle des industriels et
  commerçants (2004-2012) cotisent, jusqu'aux cotisations de 2008, sur le revenu
  professionnel de l'avant-dernière année, sans ajustement, dans la limite de trois
  plafonds, quatre depuis 1997 (trois pour les commerçants), de l'année où la cotisation
  est due ; depuis les revenus de 2009, sur celui de l'année, après régularisation.
  L'artisan qui commence cotise l'année de son début sur un tiers du plafond, la
  suivante sur la moitié, et le commerçant, de 2004 à 2008, sur dix-huit puis vingt-sept
  fois la base mensuelle des prestations familiales du 1er octobre de l'année
  précédente, définitifs jusqu'aux cotisations de 2008 ; de 2009 à 2011, ces forfaits ne
  sont plus qu'un acompte, régularisé sur le revenu de l'année (celui de l'artisan par
  une lecture, que D. 635-7, qui le dit « assise », ne confirme pas : voir les
  approximations). Hors du forfait
  définitif, la cotisation ne peut être
  inférieure à celle de 200 heures du Smic du 1er janvier jusqu'en 2011, puis, dès
  quatre-vingt-dix jours d'affiliation, de 5,25 % du plafond, au RCI encore, jusqu'en
  2015. Les points de l'exercice sont sa cotisation,
  divisée par le revenu de référence, sans la cotisation additionnelle de 0,10 % due de
  1985 à 1996. Le conjoint collaborateur cotise sur l'assiette de sa cotisation de base,
  sans régularisation : au forfait, le tiers du plafond de l'année ; à l'option, de 2007
  à 2012, la fraction du revenu du chef de l'avant-dernière année.
domaine: cotisations
regimes: [rco_artisans, nric, rci]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- >-
  le revenu de chaque année d'artisan ou de commerçant, et celui des deux années qui
  la précèdent dans la même affiliation
- >-
  pour le conjoint collaborateur, si sa ligne est au forfait, et le revenu de ses
  lignes à l'option deux ans plus tôt
- la part de l'année que la ligne couvre, au mois
- le plafond annuel de la sécurité sociale de l'année de la cotisation
- >-
  la base mensuelle de calcul des prestations familiales au 1er octobre de l'année
  précédente, pour le commerçant qui commence de 2004 à 2008
- >-
  l'assiette minimale du régime de base que porte la ligne, et la part de l'année
  qu'elle couvre, pour le minimum de la complémentaire jusqu'en 2015
ecrit:
- >-
  les points de l'exercice au RCO des artisans et au NRCO des commerçants (`acquerir`)
- >-
  jusqu'en 2015, ceux du minimum de la cotisation, au RCO, au NRCO et au RCI
  (`assiette_minimale`)
