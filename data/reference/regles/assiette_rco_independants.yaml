  effet: >-
    non mesuré ; l'indépendant qui cesse en 2012 sous 1 909,53 € : 65,53 € d'assiette de
    trop au RCO ou au NRCO, ou, affilié moins de quatre-vingt-dix jours, une assiette
    minimale de 1 844 € qui lui manque
- version: [rci_2013, rci_2015, rci_2016]
  ecart: >-
    le modèle n'exonère pas l'invalide : depuis 2013, D. 635-2 dit que « l'assuré
    titulaire d'une pension d'invalidité dans les régimes institués par l'article
    L. 635-5 est exonéré du paiement de toute cotisation d'assurance vieillesse
    complémentaire » (LEGIARTI000025263548, LEGIARTI000030034575, LEGIARTI000031799392,
    LEGIARTI000034721550), « dans le régime institués par l'article L. 632-1 » depuis le
