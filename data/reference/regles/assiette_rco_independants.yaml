- id: avant_derniere_annee_des_deux_regimes_2004
  statut: lue
  textes:
  - id: LEGIARTI000006738013
    article: "code de la sécurité sociale, D. 635-1"
    en_vigueur: 2004-08-24
    lu_le: 2026-11-03
    citation: >-
      La Caisse nationale de l'organisation autonome d'assurance vieillesse des
      professions artisanales et la Caisse nationale de l'organisation autonome
      d'assurance vieillesse des professions industrielles et commerciales assurent,
      chacune en ce qui la concerne, la gestion d'un régime complémentaire obligatoire
      d'assurance vieillesse.
  - id: LEGIARTI000006738016
    article: "code de la sécurité sociale, D. 635-2"
    en_vigueur: 2004-08-24
    lu_le: 2026-11-03
    citation: >-
      La cotisation annuelle au régime complémentaire obligatoire d'assurance vieillesse
      est assise sur les revenus de l'avant-dernière année tels que définis par l'article
      L. 131-6 et recouvrée dans les mêmes conditions que la cotisation d'assurance
      vieillesse de base, y compris les dispositions de l'article D. 633-9, sous réserve
      des dispositions des articles D. 635-7 et D. 635-10. Toutefois, le montant de cette
      cotisation ne peut être inférieur à celui qui serait dû au titre d'un revenu égal
      au revenu minimum prévu à l'article D. 633-2.
  - id: LEGIARTI000006738017
    article: "code de la sécurité sociale, D. 635-2"
    en_vigueur: 2008-01-01
    lu_le: 2026-11-03
    citation: >-
      La cotisation annuelle au régime complémentaire obligatoire d'assurance vieillesse
      est assise sur les revenus de l'avant-dernière année, tels que définis par
      l'article L. 131-6.
  - id: LEGIARTI000006738025
    article: "code de la sécurité sociale, D. 635-7"
    en_vigueur: 2004-08-24
    lu_le: 2026-11-03
    citation: >-
      Le taux de la cotisation annuelle d'assurance vieillesse complémentaire des
      artisans est fixé à 7 %. Ce taux s'applique sur le revenu professionnel dans une
      limite égale à quatre fois le plafond prévu à l'article L. 241-3. [...] Pour les
      assurés commençant l'exercice d'une profession artisanale ou assimilée, la
      cotisation annuelle est assise : 1° Pour l'année ou la fraction d'année de début
      d'exercice, sur un revenu correspondant au tiers du plafond mentionné à l'article
      L. 241-3 ; 2° Pour l'année suivante, sur un revenu correspondant à la moitié dudit
      plafond.
  - id: LEGIARTI000006738027
    article: "code de la sécurité sociale, D. 635-10"
    en_vigueur: 2004-08-24
    lu_le: 2026-11-03
    citation: >-
      Le taux de la cotisation annuelle d'assurance vieillesse complémentaire des
      industriels et commerçants est fixé pour l'année 2004 à 3,5 % pour le premier
      semestre et à 4,5 % pour le second semestre. Ce taux s'applique sur le revenu
      professionnel dans une limite égale à trois fois le plafond prévu à l'article
      L. 241-3. Pour les assurés commençant l'exercice de leur activité, la cotisation
      annuelle est calculée sur les revenus forfaitaires mentionnés au sixième alinéa de
      l'article L. 131-6.
  - id: LEGIARTI000006738028
    article: "code de la sécurité sociale, D. 635-10"
    en_vigueur: 2005-03-26
    lu_le: 2026-11-03
    citation: >-
      Le taux de la cotisation annuelle d'assurance vieillesse complémentaire des
      industriels et commerçants est fixé à 6,5 %. [...] Pour les assurés commençant
      l'exercice de leur activité, la cotisation annuelle est calculée sur les revenus
      forfaitaires mentionnés au sixième alinéa de l'article L. 131-6.
  - id: LEGIARTI000006740118
    article: "code de la sécurité sociale, L. 131-6"
    en_vigueur: 2003-12-20
    lu_le: 2026-11-03
    citation: >-
      Les cotisations sont calculées, chaque année, à titre provisionnel, en pourcentage
      du revenu professionnel de l'avant-dernière année ou des revenus forfaitaires.
      Lorsque le revenu professionnel est définitivement connu, les cotisations font
      l'objet d'une régularisation. [...] les cotisations mentionnées au premier alinéa
      dues au titre de la première année civile d'activité sont calculées à titre
      provisionnel sur une base forfaitaire qui ne peut excéder dix-huit fois la valeur
      de la base mensuelle de calcul des prestations familiales en vigueur au 1er
      octobre de l'année précédente ; celles dues au titre de la deuxième année civile
      d'activité sont calculées à titre provisionnel sur une base forfaitaire qui ne
      peut excéder vingt-sept fois cette valeur.
  - id: LEGIARTI000006738041
    article: "code de la sécurité sociale, D. 635-10-2"
    en_vigueur: 2006-12-13
    lu_le: 2026-11-03
    citation: >-
      La cotisation d'assurance vieillesse complémentaire du conjoint collaborateur est
      calculée sur le revenu retenu, dans les limites respectivement prévues à l'article
      D. 635-7 pour le conjoint d'artisan et à l'article D. 635-10 pour le conjoint
      d'industriel ou de commerçant, pour le calcul de sa cotisation d'assurance
      vieillesse de base. La cotisation d'assurance complémentaire ne fait toutefois pas
      l'objet de la régularisation à laquelle la cotisation d'assurance de base donne
      lieu le cas échéant.
  - id: LEGIARTI000006737951
    article: "code de la sécurité sociale, D. 633-19-2"
    en_vigueur: 2006-12-13
    lu_le: 2026-11-03
    citation: >-
      Le conjoint collaborateur peut demander que sa cotisation soit calculée : 1° Soit
      sur un revenu forfaitaire égal au tiers du plafond mentionné au premier alinéa de
      l'article L. 633-10 ; [...]
  nee_de: LEGIARTI000006738016
  bornes:
    revenu.annee: [2004-01-01, 2009-01-01]
  contenu:
    parametres:
      annees_de_decalage: 2
      diviseurs_du_plafond_au_debut: [3, 2]
      plafonds_de_l_assiette: 4
      plafonds_de_l_assiette_des_commercants: 3
    droit: >-
      l'artisan, et le commerçant au régime né le 1er janvier 2004 (loi n° 2003-775),
      cotisent sur le revenu de l'avant-dernière année ; l'artisan qui commence, sur un
      tiers puis la moitié du plafond de la sécurité sociale ; le commerçant qui
      commence, sur les revenus forfaitaires de L. 131-6 ; le conjoint collaborateur,
      depuis son affiliation de 2007, sur l'assiette de sa cotisation de base, sans
      régularisation
    conditions: >-
      les revenus de 2007 et de 2008 ne sont la base d'aucune cotisation définitive : la
      cotisation de 2008 est assise sur le revenu de 2006, celle de 2009 sur le revenu de
      2009 (décret n° 2008-1427, II)
  exemples: aucun trouvé
