    en_vigueur: 2014-01-01
    lu_le: 2026-11-05
    citation: >-
      La cotisation annuelle ne peut être calculée sur une assiette inférieure à 5,25 %
      de la valeur du plafond déterminée conformément au premier alinéa du présent
