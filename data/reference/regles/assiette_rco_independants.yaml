    l'artisan ou le commerçant (`dispenses_assiette_minimale.yaml` : `pensionne` ne vise
    que le libéral). Relevé par la relecture R-D2, déclaré, non corrigé (candidat)
  effet: >-
    non mesuré ; l'artisan ou le commerçant invalide qui garde une activité depuis
    2013 : le modèle lui donne les points du RCI de son revenu, et le minimum jusqu'en
    2015, que sa cotisation exonérée ne lui achète pas
- version: [avant_derniere_annee_1979, cotisation_additionnelle_1985, quatre_plafonds_1997,
    avant_derniere_annee_des_deux_regimes_2004, regularisation_2009, sans_forfait_2012,
    rci_2013, rci_2015]
  ecart: >-
    le modèle n'oppose pas le minimum de la cotisation à l'année cotisée au revenu nul :
    celui de la base, que celui de la complémentaire suit, tombe quand le revenu déclaré
    est nul (`carriere.py`, `cotise and revenu > 0 and not micro` ; `carriere.js`, de
    même) ; ni le décret n° 78-351 (article 3, I), ni D. 635-4, ni D. 635-2 n'en
    exceptent cette année. Relevé par la relecture R-D2, déclaré, non corrigé
    (candidat)
  effet: >-
    non mesuré ; l'artisan ou le commerçant cotisant qui déclare un revenu nul, de 1979
    à 2015 : les points du minimum lui manquent, 200 heures du Smic jusqu'en 2011, 5,25 %
    du plafond de 2012 à 2015
- version: [avant_derniere_annee_1979, cotisation_additionnelle_1985, quatre_plafonds_1997,
    avant_derniere_annee_des_deux_regimes_2004, regularisation_2009]
  ecart: >-
    le modèle prend pour début d'exercice toute année qu'aucune année d'activité de la
    même affiliation ne précède : le texte de la complémentaire ne dit pas la reprise
    d'activité, que R. 242-16 (LEGIARTI000006748778), règle des allocations familiales que
    D. 633-6 étend à la base, ne tient pour un début qu'au-delà de l'année qui suit la
    cessation ; il prend le forfait et le revenu de l'avant-dernière année à proportion
    des mois de l'exercice, comme ses bornes, quand le texte ne dit pas de prorata pour
    « l'année ou la fraction d'année de début d'exercice » de l'artisan (celui du
    commerçant, D. 635-10 ne le dit pas non plus : R. 242-16 le dit dû de la cotisation
    d'allocations familiales « à compter de la date à laquelle l'employeur ou le
    travailleur indépendant a débuté son activité ») ; il ne sert ni
    l'assiette inférieure « sur demande motivée » (article 4, II), ni l'arrondi de la
    cotisation à deux francs puis à l'euro
  effet: >-
    non mesuré ; l'artisan qui reprend une activité, ou dont l'activité commence ou finit
    en cours d'année
- version: [avant_derniere_annee_des_deux_regimes_2004]
  ecart: >-
    la deuxième année du commerçant qui commence, le modèle prend la base mensuelle
    des prestations familiales du 1er octobre de la première, l'année qui précède
    celle de la cotisation ; le texte se lit aussi de la base de la première année :
    L. 131-6 dit la deuxième « vingt-sept fois cette valeur », celle « en vigueur au
    1er octobre de l'année précédente » de la première (LEGIARTI000006740118), et
    R. 242-16, pour les allocations familiales et la base, « la base forfaitaire
    mentionnée au premier alinéa du présent article, majorée de 50 % »
    (LEGIARTI000006748778), puis « vingt-sept fois la valeur de la base mensuelle
    mentionnée au premier alinéa » (LEGIARTI000006748779). Aucun
    barème de la caisse lu ne le chiffre. Le modèle ne sert pas non plus l'acompte
    sur le revenu estimé que l'assuré peut demander (L. 131-6, LEGIARTI000006740118 ;
    circulaire DSS/5 B/5 C n° 2007-431, annexe II, 1, c), que la complémentaire,
    définitive, garderait
  effet: >-
    non mesuré ; la seule deuxième année, de 2005 à 2008 : vingt-sept fois la hausse
    de la base mensuelle sur un an, 159,57 € d'assiette en 2005, 210,06 € en 2006,
    175,50 € en 2007, 168,75 € en 2008, moins d'un point du NRCO (en 2006,
    210,06 × 6,5 % / 14,389 = 0,95 point)
- version: [avant_derniere_annee_des_deux_regimes_2004, regularisation_2009, sans_forfait_2012]
  ecart: >-
    le conjoint collaborateur à l'option cotise sur la fraction du revenu du chef de
    l'avant-dernière année, que le modèle, qui ne connaît pas le revenu du chef, lit
    sur la ligne du conjoint de cette année-là. Quand elle manque ou est au forfait —
    ses deux premières années, que D. 633-19-6 (LEGIARTI000006737955) assied sur « le
    revenu retenu pour le calcul des cotisations dues par le chef d'entreprise pour
    ces années », et le passage du forfait à l'option —, le modèle garde le revenu de
    l'année. Il ne sert pas non plus les forfaits de D. 635-7 du conjoint qui débute
    dans l'une des deux premières années de l'artisan (D. 635-10-2), ni le changement
    de fraction d'une année à l'autre, ni les acomptes calculés « sur la base des
    revenus de cette année estimés par l'assuré sur demande de celui-ci » (L. 131-6,
    LEGIARTI000006740121)
  effet: >-
    non mesuré ; les conjoints à l'option de 2007 à 2012, dans ces seuls cas : l'écart
    est la croissance du revenu du chef sur deux ans
effet: >-
  Les artisans de 1979 à 2012 et les commerçants de 2004 à 2012. Le 5 novembre 2026, le
  minimum de la cotisation : l'artisan, le commerçant ou le gérant de débit de tabac
  dont le revenu retenu est sous 200 heures du Smic jusqu'en 2011, sous 5,25 % du
  plafond de 2012 à 2015, cotise et acquiert ses points sur ce minimum ; aucun des 930
  témoins ne bouge, et le témoin `minimum_complementaire_artisan`, à 300 € par an de
  1979 à 2016, le couvre. Jusqu'au 3 novembre 2026,
  le modèle tirait les points de chaque exercice du revenu de l'année, et la cotisation
  additionnelle de 1985 à 1996 en achetait : de 5 à 11 % de RCO en trop, de 1 à 3 % de la
  pension, selon la carrière (`177/2026-11-03-etape-9-assiette-du-rco-des-artisans.md`).
  Les témoins des artisans et des commerçants perdent de 0,1 à 2,3 % de leur pension,
  sauf l'artisane qui commence sous le tiers du plafond, que le forfait relève :
  `dispense_rsa_releve_artisane`, née en 1962, à 3 000 € par an depuis 1990, a en 1990
  et 1991 les points d'un tiers puis de la moitié du plafond, 18 % de points du RCO de
  plus (1 470,04 au lieu de 1 242,32) ; au scénario 1, son droit propre monte de 6 %
  (1 420,54 € au lieu de 1 340,77 €) sans changer sa pension, que fait le minimum
  vieillesse (ASPA), différentiel ; aux scénarios 3 et 5, qui convertissent les droits
  acquis, sa pension monte de 5,8 % (1 554,90 € au lieu de 1 469,66 €). Le même jour,
  le conjoint collaborateur à l'option remis sur l'avant-dernière année de 2007 à 2012 :
  `conjoint_collaborateur_au_tiers`, conjointe de commerçant au tiers du revenu du chef
  depuis 1998, perd 21,35 points du NRCO (399,39 au lieu de 420,74) et 0,19 % de sa
  pension. Le 5 novembre 2026, le forfait de début lu au droit (action 177, file D3) :
  l'artisan qui commence de 2009 à 2011 cotise sur son revenu, par une lecture que les
  approximations déclarent (D. 635-7 le dit « assise »), et le commerçant qui
  commence de 2004 à 2008 sur dix-huit puis vingt-sept bases mensuelles ; deux témoins
  sur 931 bougent, deux artisans installés en 2010 et en mai 2011, au revenu bien
  au-dessus du forfait : `metiers_prive_puis_independant`, 2 437,35 points du RCO au
  lieu de 1 257,17, sa pension du scénario 1 de 46 148,69 à 46 702,03 € (+1,20 %),
  +1,32 % aux scénarios 3 et 5 ; `metier_change_en_cours_d_annee`, 1 346,42 points au
  lieu de 886,01, de 46 841,53 à 47 061,17 € (+0,47 %), +0,53 % aux scénarios 3 et 5.
  Les pages du coût bougent d'un milliard d'euros au plus, sur des totaux de plusieurs
  milliers (7 300 Md € devient 7 299 Md €).
