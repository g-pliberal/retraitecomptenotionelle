    date: 2026-11-03
  - type: jorf
    reference: >-
      décret n° 2008-1427 du 22 décembre 2008, article 1er (JORFARTI000019996956) ;
      décret n° 2011-2038 du 29 décembre 2011, sa notice et ses articles 1er à 4
      (JORFTEXT000025055789, JORFARTI000025055794 à JORFARTI000025055807), index du JORF à
      jour du 3 novembre 2026
    date: 2026-11-03
  - type: autre
    reference: >-
      base de législation de la Cnav, exposés « Points cotisés artisans avant 2013 »
      (version du 24 octobre 2025) : « Le nombre de points cotisés est égal à : Montant
      des cotisations RCO réglées sur l'année N ÷ Revenu de référence de l'année N » ;
      « Une cotisation additionnelle de 0,10 point a été prélevée entre 1985 et 1996 [...].
      Cette cotisation n'etait pas génératrice de droit » ; et « Rachat aide familial »
      (version du 14 octobre 2026) : « Les cotisations concernées sont : la retraite de
      base, l'invalidité-décès et, depuis le 01/01/1979, la retraite complémentaire. Les
      cotisations sont calculées sur le tiers du plafond de la sécurité sociale
