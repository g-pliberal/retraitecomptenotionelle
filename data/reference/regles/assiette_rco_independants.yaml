  statut: lue
  textes:
  - id: LEGIARTI000030034575
    article: "code de la sécurité sociale, D. 635-2"
    en_vigueur: 2015-01-01
    lu_le: 2026-11-05
    citation: >-
      Pour les travailleurs indépendants dont la durée d'affiliation est au moins égale à
      quatre-vingt-dix jours au cours de l'année au titre de laquelle la cotisation est
      due, ladite cotisation ne peut être calculée sur une assiette inférieure à 5,25 %
      de la valeur du plafond mentionné au premier alinéa de l'article L. 241-3. La
      valeur de ce plafond est déterminée conformément au premier alinéa de l'article
      D. 612-6.
  - id: LEGIARTI000025629812
    article: "code de la sécurité sociale, D. 612-6"
    en_vigueur: 2012-04-05
    lu_le: 2026-11-05
    citation: >-
      La valeur du plafond de la sécurité sociale mentionné à la présente section est la
      valeur annuelle de ce plafond, tel que prévu à l'article L. 241-3, en vigueur au
      1er janvier de l'année au titre de laquelle la cotisation annuelle est due. En cas
      de période d'affiliation inférieure à une année, cette valeur est réduite au
      prorata de la durée d'affiliation.
  - id: LEGIARTI000030034758
    article: "décret n° 2012-443 du 3 avril 2012, article 4"
    en_vigueur: 2015-01-01
    lu_le: 2026-11-05
    citation: >-
      V. ― Lorsque les assiettes minimales de cotisation mentionnées aux articles
      D. 633-2, D. 635-2 et D. 642-4 du code de la sécurité sociale deviennent
      inférieures à un montant égal, pour les assiettes minimales mentionnées à ces
      articles D. 633-2 et D. 642-4, à 300 fois la valeur du salaire minimum de
      croissance en vigueur le 1er janvier de l'année au titre de laquelle les
      cotisations sont dues et, pour l'assiette minimale mentionnée à cet article
      D. 635-2, à 200 fois cette valeur, le pourcentage de la valeur annuelle du plafond
      de la sécurité sociale servant à leur calcul est fixé à hauteur de la plus petite
      valeur, arrondie au demi-dixième immédiatement supérieur, à compter de laquelle
      ces assiettes sont au moins égales à ce montant.
  - id: LEGIARTI000029982292
    article: "décret n° 2014-1637 du 26 décembre 2014, article 31"
    en_vigueur: 2015-01-01
    lu_le: 2026-11-05
    citation: >-
      I. - Le présent décret s'applique aux cotisations et aux contributions de sécurité
      sociale dues au titre des périodes courant à compter du 1er janvier 2015.
