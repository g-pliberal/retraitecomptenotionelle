approximations:
- version: [avant_derniere_annee_1979, cotisation_additionnelle_1985, quatre_plafonds_1997,
    avant_derniere_annee_des_deux_regimes_2004, regularisation_2009, sans_forfait_2012]
  ecart: >-
    le modèle n'oppose pas le minimum de la cotisation, « celui qui serait dû au titre
    d'un revenu égal au revenu minimum » du régime de base (décret n° 78-351, article 3,
    I ; D. 635-4 ; D. 635-2 jusqu'au 5 avril 2012), puis l'assiette du régime de base dès
    quatre-vingt-dix jours d'affiliation (D. 635-2, LEGIARTI000025629861) : ses
    modalités — l'année incomplète, les rédactions de D. 633-2 — restent à lire
  effet: >-
    non mesuré ; l'artisan ou le commerçant dont le revenu de l'avant-dernière année
    est sous le revenu minimum du régime de base, deux cents heures de Smic jusqu'en
    2011
- version: [avant_derniere_annee_1979, cotisation_additionnelle_1985, quatre_plafonds_1997,
    avant_derniere_annee_des_deux_regimes_2004, regularisation_2009]
  ecart: >-
    le modèle prend pour début d'exercice toute année qu'aucune année d'activité de la
    même affiliation ne précède : le texte ne dit pas la reprise d'activité, que
    R. 242-16 (LEGIARTI000006748778) ne tient pour un début qu'au-delà de l'année qui
    suit la cessation ; il prend le forfait et le revenu de l'avant-dernière année à
    proportion des mois de l'exercice, comme ses bornes, quand le texte ne dit pas de
    prorata pour « l'année ou la fraction d'année de début d'exercice » ; il ne sert ni
    l'assiette inférieure « sur demande motivée » (article 4, II), ni l'arrondi de la
    cotisation à deux francs puis à l'euro
  effet: >-
    non mesuré ; l'artisan qui reprend une activité, ou dont l'activité commence ou finit
    en cours d'année
- version: [avant_derniere_annee_des_deux_regimes_2004, regularisation_2009]
  ecart: >-
    le commerçant qui commence cotise sur « les revenus forfaitaires mentionnés au
    sixième alinéa de l'article L. 131-6 » (D. 635-10), dix-huit puis vingt-sept fois la
    base mensuelle des allocations familiales (R. 242-16), que L. 131-6 dit calculées « à
    titre provisionnel » puis régularisées, sans que D. 635-2 régularise d'autre
    cotisation complémentaire avant 2009 : le modèle garde le revenu de ses deux
    premières années, ce que donnerait la régularisation, et n'a pas la base mensuelle
  effet: >-
    non mesuré ; le commerçant qui commence de 2004 à 2011, au revenu éloigné du forfait
effet: >-
  Les artisans de 1979 à 2012 et les commerçants de 2004 à 2012. Jusqu'au 3 novembre 2026,
  le modèle tirait les points de chaque exercice du revenu de l'année, et la cotisation
  additionnelle de 1985 à 1996 en achetait : de 5 à 11 % de RCO en trop, de 1 à 3 % de la
  pension, selon la carrière (`177/2026-11-03-etape-9-assiette-du-rco-des-artisans.md`).
  Les témoins des artisans et des commerçants perdent de 0,1 à 2,3 % de leur pension.
sources:
  lu_le: 2026-11-03
  prochaine_relecture: 2027-11-03
  a_relire:
  - >-
    Le minimum de la cotisation : les rédactions de D. 633-2 de 1985 à 2012, son prorata
    sur une année incomplète, la condition de quatre-vingt-dix jours et l'assiette du
    régime de base de 2012 à 2014 (D. 635-2, LEGIARTI000025629861, LEGIARTI000025263548),
    les 5,25 % du plafond de 2015 « déterminé conformément au premier alinéa de
    l'article D. 612-6 » (LEGIARTI000030034575), le micro-entrepreneur ; plus rien
    depuis 2016 (LEGIARTI000031799392).
  - >-
    Le règlement du RCO des artisans, approuvé le 15 décembre 1978, que l'index ne porte
    pas : la reprise d'activité, l'assiette inférieure sur demande motivée de
    l'article 4, II. Les annexes du 7 juillet 2009 (JORFARTI000021059798) et du 23 avril
    2009 (JORFARTI000020676129) ne touchent qu'à la cotisation à défaut de déclaration
    et aux cotisations arriérées.
  - >-
    Si le forfait de l'artisan qui commence de 2009 à 2011 (D. 635-7) était définitif,
    comme sa rédaction le laisse lire, ou régularisé comme la cotisation que D. 635-2
    calcule depuis 2009 ; et si celui du commerçant, de 2004 à 2011, l'était.
