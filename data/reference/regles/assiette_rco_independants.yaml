textes_sans_effet:
- id: LEGIARTI000046567204
  article: "décret n° 2012-443 du 3 avril 2012, article 4, rédaction du 18 novembre 2022"
  en_vigueur: 2022-11-18
  motif: >-
    le V, qui opposait 200 heures de Smic à l'assiette minimale de D. 635-2, en est
    ôté : il ne reste que « I à IV-A modifié les dispositions suivantes ». La phrase du
    minimum avait quitté D. 635-2 dès le 1er janvier 2016 (version rci_2016) : le V
    n'avait plus rien à opposer à la complémentaire
- id: LEGIARTI000041967058
  article: "code de la sécurité sociale, D. 635-4, rédaction du 25 mai 2020"
  en_vigueur: 2020-05-25
  motif: texte inchangé (le rachat dans la complémentaire, depuis le 24 août 2004)
- id: LEGIARTI000041966510
  article: "code de la sécurité sociale, D. 635-2, rédaction du 25 mai 2020"
  en_vigueur: 2020-05-25
  motif: >-
    l'article perd le calcul de la cotisation et ne garde que la phrase « L'assuré
    titulaire d'une pension d'invalidité dans le régime institués par l'article L. 632-1
    est exonéré du paiement de toute cotisation d'assurance vieillesse complémentaire » ;
    le RCI est hors de cette fiche depuis 2013, et son minimum depuis 2016
code:
  moteur: >-
    `assiette_annee_de_revenu`, une table du statut au décalage, et `assiette_de_debut`,
    du statut aux diviseurs du plafond : l'exercice ouvert depuis deux ans cotise sur le
    revenu des lignes de la même affiliation deux ans plus tôt (`revenu_de_l_annee`), à
    proportion de ses mois ; l'artisan, ses deux premières années, sur le plafond divisé
    par 3 puis par 2 (`annees_deja_exercees`), avant les bornes de l'exercice, jusqu'en
    2008 ; le commerçant, de 2004 à 2008, sur 18 puis 27 fois la base mensuelle des
    prestations familiales de l'année précédente
    (`assiette_de_debut_en_bases_mensuelles`, `base_mensuelle_prestations_familiales`
    de la macro) ; les
    points de 1985 à 1996, au taux de calcul de 4,40 % (`taux_calcul_points`). Le
    conjoint collaborateur à l'option, de 2007 à 2012, sur le revenu de ses lignes à
    l'option deux ans plus tôt (`revenu_a_l_option`), même après une année
    d'interruption ; au forfait (`forfait_conjoint`, que pose la ligne), sur celui de
    l'année. Le minimum, jusqu'en 2015, hors du forfait de début : `assiette_minimale`,
    qui lit les quatre dernières lignes de la série de l'assiette minimale, celles des
    régimes complémentaires, tant que la ligne porte une assiette minimale de base.
  python: >-
    droit/acquerir.py : acquerir, assiette_minimale, revenu_de_l_annee,
    revenu_a_l_option, annees_deja_exercees ; donnees/chargement.py :
    assiette_minimale ; donnees/macro.py : base_mensuelle_prestations_familiales ;
    carriere.py : AnneeCarriere, _ligne_annuelle
  javascript: >-
    moteur/js/droit/acquerir.js : acquerir, assietteMinimale, revenuDeLAnnee,
    revenuALOption, anneesDejaExercees ; moteur/js/macro.js : DonneesMacro ;
    moteur/js/carriere.js : AnneeCarriere,
    ligneAnnuelle, assietteMinimale, montantAssietteMinimale
  parametres: >-
    contenu.parametres de chaque version : annees_de_decalage,
    annees_de_decalage_du_conjoint_a_l_option, diviseurs_du_plafond_au_debut,
    multiples_de_la_base_mensuelle_au_debut, plafonds_de_l_assiette,
    plafonds_de_l_assiette_des_commercants, taux_des_points, taux_additionnel ;
    regimes/rco_artisans.yaml, regimes/nric.yaml : assiette_annee_de_revenu,
    assiette, taux_cotisation_retraite ; regimes/rco_artisans.yaml : assiette_de_debut,
    taux_calcul_points ; regimes/nric.yaml : assiette_de_debut_en_bases_mensuelles ;
    legislation/base_mensuelle_prestations_familiales.csv : valeur ;
    legislation/assiette_minimale_independants.csv : regimes,
    heures_smic, part_pass, jours_minimum
  tests: [tests/test_independants.py, tests/temoins/simulations.json]
historique:
- >-
  2026-11-03 — écrite (action 177, étape 9), sur la décision du propriétaire du même jour
  de corriger le modèle : l'avant-dernière année du RCO des artisans et du NRCO des
  commerçants, les forfaits de début de l'artisan, la cotisation additionnelle de 1985 à
  1996 sans points, le conjoint collaborateur sur l'assiette de sa cotisation de base.
  Approchée : le minimum de la cotisation, la reprise, le prorata, et le forfait du
  commerçant qui commence.
- >-
  2026-11-03 — corrigée (action 177, après la relecture R-M2) : le conjoint
  collaborateur à l'option, de 2007 à 2012, sur la fraction du revenu du chef de
  l'avant-dernière année, que D. 635-10-2 ne régularise pas, dans les deux moteurs ;
  approchés, ses deux premières années et le passage du forfait à l'option, et, déclaré,
  le doute sur le forfait de l'artisan qui commence de 2009 à 2011 ; l'effet du forfait
  qui relève l'artisane à très bas revenu, écrit ; le revenu minimum daté du 5 avril
  2012, et non de 2011.
- >-
  2026-11-05 — le minimum de la cotisation, écrit dans les deux moteurs (action 177,
  file D) : 200 heures du Smic du 1er janvier de 1979 à 2011, hors du forfait de début,
  puis 5,25 % du plafond, dès quatre-vingt-dix jours d'affiliation, de 2012 à 2015, au
  RCI aussi, que la fiche suit désormais jusqu'en 2015 (versions rci_2013, rci_2015,
  rci_2016). Restent approchés le forfait de début de 2004 à 2011 et la cessation de
  2012 (`177/2026-11-05-minimum-de-la-cotisation-complementaire.md`).
- >-
  2026-11-05 — les forfaits de début, lus au droit et écrits dans les deux moteurs
  (action 177, file D3) : le commerçant qui commence, de 2004 à 2008, sur dix-huit puis
  vingt-sept fois la base mensuelle des prestations familiales, définitifs (D. 635-10,
  R. 242-16, D. 635-2 ; circulaire DSS/5 B/5 C n° 2007-431) ; de 2009 à 2011, le
  forfait de l'artisan comme celui du commerçant régularisé sur le revenu de l'année
  (D. 635-2, L. 131-6 ; circulaire RSI n° 2008/031), que le minimum borne alors ;
  déclarée, la base mensuelle de la deuxième année
  (`177/2026-11-05-forfaits-de-debut-des-independants.md`).
- >-
  2026-11-05 — retouches de la relecture R-D2 (action 177, file D3) : l'effet du forfait
  de début face au minimum borné au mois, la seconde année comprise ; les articles qui
  fixent l'effet des bornes de 1979, 2012, 2015 et 2016 cités ; déclarés, l'invalide
  exonéré de complémentaire depuis 2013 et le minimum au revenu nul
  (`177/2026-11-05-retouches-de-la-relecture-r-d2.md`).
- >-
  2026-11-05 — retouches de la relecture R-D3 (action 177, file D3) : le doute sur le
  forfait de l'artisan qui commence de 2009 à 2011, rendu aux approximations avec D. 635-7
  mot pour mot (une lecture solide, non certaine, que ni un texte ni la caisse ne disent) ;
  R. 242-16, règle des allocations familiales étendue à la base par D. 633-6, ôté du
  forfait de la complémentaire, que L. 131-6 pose comme un plafond et que la caisse fait
  forfait ; le tableau de la circulaire n° 2008/017, celui du plafonnement des
  micro-entreprises ; le rectificatif du 28 août 2004 cité
  (`177/2026-11-05-retouches-de-la-relecture-r-d3.md`).
- >-
  2026-11-05 — la deuxième année du commerçant en 2004 (action 177, file D3), relevée par
  la relecture des retouches de R-D2 : le seuil de qui a commencé en 2003, 27 × 347,68 € /
  12 = 782,28 € sous 1 438 €, soit 1,84 mois, dit à l'effet de l'approximation du minimum
  et du forfait de début (`177/2026-11-05-retouches-de-la-relecture-r-d3.md`, ajout daté).
