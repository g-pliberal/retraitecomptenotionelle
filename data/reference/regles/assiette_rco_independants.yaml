  nee_de: LEGIARTI000006738016
  bornes:
    revenu.annee: [2004-01-01, 2009-01-01]
  contenu:
    parametres:
      annees_de_decalage: 2
      annees_de_decalage_du_conjoint_a_l_option: 2
      diviseurs_du_plafond_au_debut: [3, 2]
      multiples_de_la_base_mensuelle_au_debut: [18, 27]
      plafonds_de_l_assiette: 4
      plafonds_de_l_assiette_des_commercants: 3
    droit: >-
      l'artisan, et le commerçant, à son régime complémentaire obligatoire depuis 2004
      (D. 635-10, son taux « pour l'année 2004 »), cotisent sur le revenu de
      l'avant-dernière année ; l'artisan qui commence, sur un
      tiers puis la moitié du plafond de la sécurité sociale ; le commerçant, ou le
      gérant de débit de tabac, qui commence, sur les revenus forfaitaires de L. 131-6,
      dix-huit fois la base mensuelle de calcul des prestations familiales du 1er
      octobre de l'année précédente la première année civile, vingt-sept fois la
      deuxième, à proportion des mois de la première (L. 131-6 ne pose ces nombres
      que comme un plafond, « une base forfaitaire qui ne peut excéder » ; que le
      forfait de la complémentaire soit ce plafond, c'est la caisse qui le dit,
      circulaire RSI n° 2007/013, § 2.2 ; R. 242-16, qui les dit « égale à », est la
      règle de la cotisation d'allocations familiales, que D. 633-6 étend à la base
      vieillesse, non à la complémentaire : D. 635-10 ne la cite pas) ; ces
      forfaits sont définitifs, la complémentaire n'étant pas régularisée avant 2009
      (D. 635-2 ; circulaire DSS/5 B/5 C n° 2007-431, note 2 ; circulaire RSI
      n° 2008/017, à son volet du plafonnement des micro-entreprises : « les
      cotisations RCO, NRCO et ID ne sont pas régularisées ») ; le conjoint collaborateur,
      depuis son affiliation de 2007, sur l'assiette de sa cotisation de base, sans
      régularisation : au forfait, le tiers du plafond de l'année ; à l'option, une
      fraction du revenu du chef, sur cette fraction du revenu de l'avant-dernière
      année, que sa cotisation de base provisionnelle retient (D. 633-19-1, L. 633-10,
      L. 131-6)
    conditions: >-
      les revenus de 2007 et de 2008 ne sont la base d'aucune cotisation définitive : la
      cotisation de 2008 est assise sur le revenu de 2006, celle de 2009 sur le revenu de
      2009 (décret n° 2008-1427, II)
