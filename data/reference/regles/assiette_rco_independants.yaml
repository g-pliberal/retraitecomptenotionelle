  a_relire:
  - >-
    Un exemple de la caisse du minimum de la cotisation complémentaire, jusqu'en 2015 :
    aucun lu ; et si le RSI opposait le minimum au forfait de l'artisan ou du
    commerçant qui commence, de 2004 à 2008.
  - >-
    Un barème de la caisse des forfaits de début du commerçant de 2005 à 2008, qui dise
    de quelle année est la base mensuelle de la deuxième année ; un barème ou une
    circulaire de la caisse qui dise que le forfait de début de l'artisan est régularisé
    de 2009 à 2011, ou qu'il est définitif ; et un exemple chiffré de la régularisation
    de la complémentaire de celui qui commence de 2009 à 2011.
  - >-
    Le règlement du RCO des artisans, approuvé le 15 décembre 1978, que l'index ne porte
    pas : la reprise d'activité, l'assiette inférieure sur demande motivée de
    l'article 4, II. Les annexes du 7 juillet 2009 (JORFARTI000021059798) et du 23 avril
    2009 (JORFARTI000020676129) ne touchent qu'à la cotisation à défaut de déclaration
    et aux cotisations arriérées.
  - >-
    Un exemple de la caisse, ou une circulaire du RSI, de la complémentaire du conjoint
    collaborateur à l'option de 2007 à 2012 : aucun des 633 exposés de la base de la
    Cnav lus le 3 novembre 2026 ne la traite.
