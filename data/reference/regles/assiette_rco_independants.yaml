- id: avant_derniere_annee_des_deux_regimes_2004
  statut: lue
  textes:
  - id: LEGIARTI000006738013
    article: "code de la sécurité sociale, D. 635-1"
    en_vigueur: 2004-08-24
    lu_le: 2026-11-03
    citation: >-
      La Caisse nationale de l'organisation autonome d'assurance vieillesse des
      professions artisanales et la Caisse nationale de l'organisation autonome
      d'assurance vieillesse des professions industrielles et commerciales assurent,
      chacune en ce qui la concerne, la gestion d'un régime complémentaire obligatoire
      d'assurance vieillesse.
  - id: LEGIARTI000006738016
    article: "code de la sécurité sociale, D. 635-2"
    en_vigueur: 2004-08-24
    lu_le: 2026-11-03
    citation: >-
      La cotisation annuelle au régime complémentaire obligatoire d'assurance vieillesse
      est assise sur les revenus de l'avant-dernière année tels que définis par l'article
      L. 131-6 et recouvrée dans les mêmes conditions que la cotisation d'assurance
      vieillesse de base, y compris les dispositions de l'article D. 633-9, sous réserve
      des dispositions des articles D. 635-7 et D. 635-10. Toutefois, le montant de cette
      cotisation ne peut être inférieur à celui qui serait dû au titre d'un revenu égal
      au revenu minimum prévu à l'article D. 633-2.
  - id: LEGIARTI000006738017
    article: "code de la sécurité sociale, D. 635-2"
    en_vigueur: 2008-01-01
    lu_le: 2026-11-03
    citation: >-
      La cotisation annuelle au régime complémentaire obligatoire d'assurance vieillesse
      est assise sur les revenus de l'avant-dernière année, tels que définis par
      l'article L. 131-6.
  - id: LEGIARTI000006738025
    article: "code de la sécurité sociale, D. 635-7"
    en_vigueur: 2004-08-24
    lu_le: 2026-11-03
    citation: >-
      Le taux de la cotisation annuelle d'assurance vieillesse complémentaire des
      artisans est fixé à 7 %. Ce taux s'applique sur le revenu professionnel dans une
      limite égale à quatre fois le plafond prévu à l'article L. 241-3. [...] Pour les
      assurés commençant l'exercice d'une profession artisanale ou assimilée, la
      cotisation annuelle est assise : 1° Pour l'année ou la fraction d'année de début
      d'exercice, sur un revenu correspondant au tiers du plafond mentionné à l'article
      L. 241-3 ; 2° Pour l'année suivante, sur un revenu correspondant à la moitié dudit
      plafond.
  - id: LEGIARTI000006738027
    article: "code de la sécurité sociale, D. 635-10"
    en_vigueur: 2004-08-24
    lu_le: 2026-11-03
    citation: >-
      Le taux de la cotisation annuelle d'assurance vieillesse complémentaire des
      industriels et commerçants est fixé pour l'année 2004 à 3,5 % pour le premier
      semestre et à 4,5 % pour le second semestre. Ce taux s'applique sur le revenu
      professionnel dans une limite égale à trois fois le plafond prévu à l'article
      L. 241-3. Pour les assurés commençant l'exercice de leur activité, la cotisation
      annuelle est calculée sur les revenus forfaitaires mentionnés au sixième alinéa de
      l'article L. 131-6.
  - id: LEGIARTI000006738028
    article: "code de la sécurité sociale, D. 635-10"
    en_vigueur: 2005-03-26
    lu_le: 2026-11-03
    citation: >-
      Le taux de la cotisation annuelle d'assurance vieillesse complémentaire des
      industriels et commerçants est fixé à 6,5 %. [...] Pour les assurés commençant
      l'exercice de leur activité, la cotisation annuelle est calculée sur les revenus
      forfaitaires mentionnés au sixième alinéa de l'article L. 131-6.
  - id: LEGIARTI000006740118
    article: "code de la sécurité sociale, L. 131-6"
    en_vigueur: 2003-12-20
    lu_le: 2026-11-03
    citation: >-
      Les cotisations sont calculées, chaque année, à titre provisionnel, en pourcentage
      du revenu professionnel de l'avant-dernière année ou des revenus forfaitaires.
      Lorsque le revenu professionnel est définitivement connu, les cotisations font
      l'objet d'une régularisation. [...] les cotisations mentionnées au premier alinéa
      dues au titre de la première année civile d'activité sont calculées à titre
      provisionnel sur une base forfaitaire qui ne peut excéder dix-huit fois la valeur
      de la base mensuelle de calcul des prestations familiales en vigueur au 1er
      octobre de l'année précédente ; celles dues au titre de la deuxième année civile
      d'activité sont calculées à titre provisionnel sur une base forfaitaire qui ne
      peut excéder vingt-sept fois cette valeur.
  - id: LEGIARTI000006738041
    article: "code de la sécurité sociale, D. 635-10-2"
    en_vigueur: 2006-12-13
    lu_le: 2026-11-03
    citation: >-
      La cotisation d'assurance vieillesse complémentaire du conjoint collaborateur est
      calculée sur le revenu retenu, dans les limites respectivement prévues à l'article
      D. 635-7 pour le conjoint d'artisan et à l'article D. 635-10 pour le conjoint
      d'industriel ou de commerçant, pour le calcul de sa cotisation d'assurance
      vieillesse de base. La cotisation d'assurance complémentaire ne fait toutefois pas
      l'objet de la régularisation à laquelle la cotisation d'assurance de base donne
      lieu le cas échéant. [...] Par exception à la première phrase du premier alinéa,
      les cotisations des deux premières années civiles d'activité du conjoint
      collaborateur d'un artisan sont calculées dans les conditions ci-après lorsqu'il
      débute son activité au cours de l'une des deux premières années civiles d'activité
      de l'artisan et qu'il choisit l'une des options prévues aux 2° à 5° de l'article
      D. 633-19-2 : a) Si l'activité débute au cours de la première année civile
      d'activité de l'artisan, la cotisation de la première année est calculée sur le
      revenu prévu au 1° de l'article D. 635-7 et celle de la deuxième année sur celui
      prévu au 2° de ce même article ; [...]
  - id: LEGIARTI000006737951
    article: "code de la sécurité sociale, D. 633-19-2"
    en_vigueur: 2006-12-13
    lu_le: 2026-11-03
    citation: >-
      Le conjoint collaborateur peut demander que sa cotisation soit calculée : 1° Soit
      sur un revenu forfaitaire égal au tiers du plafond mentionné au premier alinéa de
      l'article L. 633-10 ; 2° Soit sur 33,33 % du revenu professionnel mentionné au 1°
      de l'article L. 633-10 ; 3° Soit sur 50 % du revenu professionnel mentionné au 1°
      de l'article L. 633-10 ; 4° Soit sur une fraction fixée au tiers du revenu
      professionnel mentionné au 2° de l'article L. 633-10 ; 5° Soit sur une fraction
      fixée à la moitié du revenu professionnel mentionné au 2° de l'article L. 633-10.
  - id: LEGIARTI000006737949
    article: "code de la sécurité sociale, D. 633-19-1"
    en_vigueur: 2006-12-13
    lu_le: 2026-11-03
    citation: >-
      Les cotisations du conjoint collaborateur du travailleur non salarié des
      professions artisanales, industrielles et commerciales sont définies et recouvrées
      dans les conditions prévues par la sous-section 1 de la présente section, sous
      réserve des dispositions de la présente sous-section.
  - id: LEGIARTI000006737955
    article: "code de la sécurité sociale, D. 633-19-6"
    en_vigueur: 2006-12-13
    lu_le: 2026-11-03
    citation: >-
      Par exception aux dispositions de l'article D. 633-6, les cotisations afférentes
      aux deux premières années civiles d'activité du conjoint collaborateur qui a choisi
      l'une des assiettes prévues aux 2° à 5° de l'article D. 633-19-2 sont calculées
      sur le revenu retenu pour le calcul des cotisations dues par le chef d'entreprise
      pour ces années, pris en compte à hauteur du pourcentage et selon les modalités
      correspondant à l'option effectuée.
  - id: LEGIARTI000006743702
    article: "code de la sécurité sociale, L. 633-10"
    en_vigueur: 2005-08-03
    lu_le: 2026-11-03
    citation: >-
      Les cotisations sont définies conformément aux dispositions de l'article L. 131-6
      et calculées dans la limite d'un plafond, dans des conditions déterminées par
      décret.
  - id: LEGIARTI000006740121
    article: "code de la sécurité sociale, L. 131-6"
    en_vigueur: 2007-03-06
    lu_le: 2026-11-03
    citation: >-
      Les cotisations sont établies sur une base annuelle. Elles sont calculées, à titre
      provisionnel, en pourcentage du revenu professionnel de l'avant-dernière année ou
      des revenus forfaitaires. Lorsque le revenu professionnel est définitivement connu,
      les cotisations font l'objet d'une régularisation. Le montant des acomptes
      provisionnels de cotisations sociales dus au titre d'une année civile peut être
      calculé sur la base des revenus de cette année estimés par l'assuré sur demande de
      celui-ci à l'organisme de recouvrement.
  - id: LEGIARTI000006748778
    article: "code de la sécurité sociale, R. 242-16"
    en_vigueur: 2002-04-26
    lu_le: 2026-11-05
    citation: >-
      L'employeur ou le travailleur indépendant est, au titre de la première année
      civile au cours de laquelle il exerce son activité professionnelle, redevable
      d'une cotisation calculée, à titre provisionnel, sur une base forfaitaire égale à
      dix-huit fois la valeur de la base mensuelle de calcul des prestations familiales
      en vigueur au 1er octobre de l'année précédente. Cette cotisation est due à
      compter de la date à laquelle l'employeur ou le travailleur indépendant a débuté
      son activité. Au titre de la deuxième année civile d'exercice de son activité
      professionnelle, l'employeur ou le travailleur indépendant est redevable d'une
      cotisation calculée, à titre provisionnel, sur la base forfaitaire mentionnée au
      premier alinéa du présent article, majorée de 50 %.
  - id: LEGIARTI000006748779
    article: "code de la sécurité sociale, R. 242-16"
    en_vigueur: 2008-01-01
    lu_le: 2026-11-05
    citation: >-
      Au titre de la deuxième année civile d'exercice de son activité professionnelle,
      l'employeur ou le travailleur indépendant est redevable d'une cotisation
      calculée, à titre provisionnel, sur une base forfaitaire égale à vingt-sept fois
      la valeur de la base mensuelle mentionnée au premier alinéa.
  - id: LEGIARTI000006737897
    article: "code de la sécurité sociale, D. 633-6"
    en_vigueur: 2004-05-08
    lu_le: 2026-11-05
    citation: >-
      Pour les assurés commençant à exercer une activité professionnelle non salariée
      les assujettissant soit au régime d'assurance vieillesse des professions
      artisanales, soit au régime d'assurance vieillesse des professions industrielles
      et commerciales, la cotisation provisionnelle dont ils sont redevables au titre de
      l'année ou de la fraction d'année de début d'exercice est calculée sur la base du
      revenu mentionné au premier alinéa de l'article R. 242-16 et la cotisation
      provisionnelle dont ils sont redevables au titre de l'année civile suivante sur
      la base de celui mentionné au deuxième alinéa dudit article.
