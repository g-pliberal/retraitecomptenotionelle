  exemples: aucun trouvé
- id: rci_2016
  statut: lue
  textes:
  - id: LEGIARTI000031799392
    article: "code de la sécurité sociale, D. 635-2"
    en_vigueur: 2016-01-01
    lu_le: 2026-11-05
    citation: >-
      La cotisation annuelle au régime complémentaire obligatoire d'assurance vieillesse
      est calculée suivant les modalités prévues aux premier, deuxième et troisième
      alinéas de l'article L. 131-6-2. Elle est recouvrée dans les conditions prévues aux
      articles R. 133-26 et R. 133-27 et sous les garanties de la cotisation vieillesse
      de base. Les dispositions de l'article D. 633-9 sont applicables au paiement de la
      cotisation provisionnelle du régime complémentaire obligatoire d'assurance
      vieillesse.
  - id: LEGIARTI000031791772
    article: "décret n° 2015-1856 du 30 décembre 2015, article 10"
    en_vigueur: 2016-01-01
    lu_le: 2026-11-05
    citation: >-
      I. - Le présent décret s'applique aux cotisations et aux contributions de sécurité
      sociale dues au titre de la période courant à compter du 1er janvier 2016.
  nee_de: LEGIARTI000031799392
  bornes:
    revenu.annee: [2016-01-01, null]
  contenu:
    parametres: {}
    droit: >-
      le RCI, hors de cette fiche : la phrase du minimum est supprimée
    conditions: aucune
  exemples: aucun trouvé
approximations:
- version: [avant_derniere_annee_des_deux_regimes_2004]
  ecart: >-
    le modèle n'oppose pas le minimum de la cotisation au forfait de celui qui
    commence : de 1979 à 2004, le texte ne l'oppose pas à celui de l'artisan, la
    phrase étant au I de l'article 3 du décret n° 78-351 et au premier alinéa de
    D. 635-4, qui visent les assurés « autres que ceux visés aux II et III » ; de 2004
    à 2008, D. 635-2 la pose « sous réserve des dispositions des articles D. 635-7 et
    D. 635-10 » (LEGIARTI000006738016), qui portent les forfaits de l'artisan et du
    commerçant, sans dire si elle s'y oppose. Depuis les revenus de 2009, la question
    tombe si le forfait n'est plus qu'un acompte, et la cotisation régularisée sur le
    revenu de l'année a alors le minimum de tous (version `regularisation_2009`) : le
    texte le dit du commerçant, le modèle le lit de l'artisan (approximation suivante)
  effet: >-
    non mesuré ; seulement quand le forfait, que le modèle prend à proportion des mois
    de l'exercice, passe sous le minimum, 200 heures du Smic du 1er janvier (1 438 € en
    2004, 1 688 € en 2008), ce qu'il fait sous un seuil, en mois, de 2004 à 2008 :
    l'artisan, la première année, sous 1,74 à 1,86 mois, s'il commence en décembre (en
    2008, un tiers de 33 276 € sur un mois, 924,33 € ; sur deux, 1 848,67 €, au-dessus),
    la seconde, à la moitié du plafond, sous 1,16 à 1,24 mois, s'il cesse en janvier ;
    le commerçant, la première année, sous 2,76 à 3,01 mois, s'il commence en novembre
    ou en décembre, ou en octobre 2008 (dix-huit fois 374,12 € sur trois mois,
    1 683,54 €), la seconde, sous 1,84 à 2,01 mois, s'il cesse en janvier (en 2004, pour
    qui a commencé en 2003, 27 × 347,68 € / 12 = 782,28 € sous 1 438 €, soit 1,84 mois ;
    sur deux, 1 564,56 €, au-dessus), ou en février 2008 (vingt-sept fois 374,12 € sur
    deux mois, 1 683,54 €)
- version: [regularisation_2009]
  ecart: >-
    le modèle tient le forfait de l'artisan qui commence, de 2009 à 2011, pour un acompte
    régularisé sur le revenu de l'année : une lecture solide, non certaine. D. 635-7, en
    une seule rédaction du 1er janvier 2008 au 1er janvier 2012 (LEGIARTI000017869802),
    dit toujours : « Pour les assurés commençant l'exercice d'une profession artisanale
    ou assimilée, la cotisation annuelle est assise : 1° Pour l'année ou la fraction
    d'année de début d'exercice, sur un revenu correspondant au tiers du plafond mentionné
    à l'article L. 241-3 ; 2° Pour l'année suivante, sur un revenu correspondant à la
    moitié dudit plafond. » — « assise », et non calculée « à titre provisionnel », comme
    l'est le forfait du commerçant (L. 131-6). Ce qui fonde la lecture : D. 635-2
    (LEGIARTI000020032159) calcule toute la cotisation « suivant les modalités prévues
    au cinquième alinéa de l'article L. 131-6 », qui dit les cotisations calculées « à
    titre provisionnel, en pourcentage du revenu professionnel de l'avant-dernière
    année ou des revenus forfaitaires », puis régularisées « lorsque le revenu
    professionnel est définitivement connu » ; la circulaire RSI n° 2008/031, § 3.1.2,
    dit : « Il a été décidé par la section des professions artisanales de mettre en place
    une régularisation des cotisations du RCO qui s'effectuerait dans les mêmes conditions
    que celle applicable au régime légal de base » ; le décret n° 2011-2038 est « relatif à
    l'assiette forfaitaire des cotisations de sécurité sociale de début d'activité dues,
    à titre provisionnel », mais il vaut de 2012, non de 2009 à 2011. Ce qui ne la
    tranche pas : la réserve de D. 635-2, « Sous réserve des dispositions des articles
    D. 635-7 et D. 635-10, elle est recouvrée dans les conditions prévues aux articles
    R. 133-26 et R. 133-27 », est déjà dans sa rédaction de 2008 (LEGIARTI000006738017),
    où le forfait est définitif, et ne dit pas ce qu'elle réserve ; la même circulaire,
    § 3.1.1, dit de l'artisan qui commence que « la cotisation annuelle reste assise »
    sur le tiers puis la moitié du plafond et que « seul le taux correspondant à la
    « première tranche » (7 % en 2008, 7,1 % en 2009, 7,2 % en 2010) devrait être
    appliqué », sans parler de régularisation, qu'elle n'écrit ailleurs qu'au
    conditionnel (« Cette régularisation serait applicable à compter de 2010 sur les
    revenu 2009 ») ; ni elle, ni les circulaires RSI n° 2008/017, n° 2009/017, n° 2009/035
    et n° 2009/044 ne disent le forfait de début de l'artisan régularisé. Celui du
    commerçant ne fait pas le même doute : L. 131-6 le dit « à titre provisionnel »
  effet: >-
    sur les deux témoins qui bougent depuis le 5 novembre 2026, deux artisans installés en
    2010 et en mai 2011 au revenu bien au-dessus du forfait : `metiers_prive_puis_independant`,
    2 437,35 points du RCO à la lecture retenue, 1 257,17 si le forfait était définitif, sa
    pension du scénario 1 de 46 148,69 à 46 702,03 € (+1,20 %) ; `metier_change_en_cours_d_annee`,
    1 346,42 points contre 886,01, de 46 841,53 à 47 061,17 € (+0,47 %) ; à l'inverse, l'artisan
    dont le revenu serait sous le forfait perdrait à la lecture retenue les points que le
    forfait définitif lui donnerait
- version: [avant_derniere_annee_des_deux_regimes_2004]
  ecart: >-
    le forfait du commerçant qui commence tient à la caisse plus qu'au texte. D. 635-10
    renvoie aux « revenus forfaitaires » de L. 131-6, qui ne pose que des plafonds : « une
    base forfaitaire qui ne peut excéder dix-huit fois la valeur de la base mensuelle de
    calcul des prestations familiales en vigueur au 1er octobre de l'année précédente »,
    puis « vingt-sept fois cette valeur » (LEGIARTI000006740118). R. 242-16, qui les dit
    « égale à » (LEGIARTI000006748778), est la règle de la cotisation d'allocations
    familiales (le décret n° 2000-841 qui en refait le forfait est « relatif au calcul des
    cotisations d'allocations familiales dues à titre personnel par les employeurs et
    travailleurs indépendants »), que D. 633-6 étend à la cotisation de base des
    professions artisanales, industrielles et commerciales ; ni D. 635-10 ni D. 635-7 ne
    la citent. Que le forfait de la complémentaire soit ce plafond, c'est la caisse qui le
    dit : circulaire RSI n° 2007/013, § 2.2, « Pour le groupe professionnel des
    commerçants, tous les risques, y compris régime complémentaire et invalidité-décès
    sont calculés sur la base de 18 puis 27 BMPF ». Le tableau de la circulaire n° 2008/017
    (« 18 BMAF » puis « 27 BMAF » au commerçant, « 1/3 PSS » puis « 1/2 PSS » à l'artisan) est
    celui du « Calcul des cotisations provisionnelles » des micro-entreprises, à son volet 1,
    « Plafonnement du montant des cotisations » : une pièce de la caisse sur ces forfaits,
    non un texte de la complémentaire
  effet: >-
    nul tant que la caisse a pris le plafond, comme ses circulaires le disent ; le texte
    seul laisserait un forfait plus bas
- version: [sans_forfait_2012]
  ecart: >-
    l'artisan ou le commerçant qui cesse en 2012, sans reprendre avant le 1er janvier
    2013, garde pour ses cotisations définitives de 2012 le droit d'avant le décret
    n° 2012-443 (article 10, II, LEGIARTI000025628404) : le minimum de 200 heures du
    Smic du 1er janvier, 1 844 €, sans condition de durée (D. 635-2,
    LEGIARTI000020032159). Le modèle lui oppose 5,25 % du plafond, 1 909,53 €, et les
