schema_version: 1
id: revalorisation_des_pensions
intitule: >-
  Revalorisation annuelle des pensions liquidées au 1er janvier : coefficient égal
  à l'évolution moyenne annuelle des prix hors tabac sur les douze derniers indices
  mensuels (L. 161-25), que L. 161-23-1 applique au régime général et aux deux régimes
  agricoles. Au 1er janvier 2026 : 1,009, soit 0,9 %. Pour un retraité, toutes celles
  reçues depuis sa date d'effet : au régime général, chaque coefficient depuis 1949,
  dont les dérogations de 2019 (0,3 %) et de 2020 (cinq coefficients selon la retraite
  totale de décembre 2019) ; dans la fonction publique, la péréquation jusqu'en
  2003, un décret par an de 2004 à 2008, puis L. 161-23-1 (L. 16 du code des pensions
  civiles et militaires).
regimes: [assurances_sociales, avts, cancava, cnracl, cssm_mayotte,
  fonction_publique_etat, fspoeie, msa_non_salaries, msa_salaries, organic,
  pensions_civiles_1853, regime_general, rsi]
etat: conforme
etape: faire_vivre
effet: >-
  N'entre pas dans la pension à la liquidation. Entre, depuis le 23 septembre 2026,
  dans la pension d'AUJOURD'HUI d'un retraité, que le simulateur affiche au lieu
  de sa pension de départ ramenée par les prix : chaque régime est revalorisé par
  son texte (src/retraite_notionnelle/revalorisation.py). Le cas type des tests
  — un non-cadre parti en janvier 2012 — touche en 2026 3,4 % de moins que sa pension
  de départ ramenée par les prix. Le COR, figure 3.14, est retrouvé à moins de trois
  centièmes de point pour le non-cadre en 2026, à 0,35 point pour le cadre (limites.md).
  Entre aussi dans les trajectoires de la page Coût, qui revalorisent les pensions
  servies sur la règle d'indexation du scénario — les PRIX par défaut. La LFSS 2026
  n'a pas dérogé à L. 161-25 pour 2026 : la recherche dans l'index LEGI ne trouve
  aucune version dérogatoire, et la circulaire Cnav applique la règle ordinaire.
sources:
  lu_le: 2026-09-23
  prochaine_relecture: 2027-01-31
  a_relire:
  - >-
    Chaque 1er janvier : relancer scripts/fetch/cnav_revalorisation_pensions.py
    et relire la circulaire de la Cnav ; surtout si une loi de financement déroge
    à L. 161-25 — un gel ou une sous-indexation ne se verrait pas dans la série
    des prix, et c'est ce qui a séparé, plusieurs fois depuis 2014, le montant servi
    de ce que les prix auraient donné. Reste à lire : la péréquation des pensions
    de l'État avant 2004 au-delà du point d'indice (tableaux d'assimilation), les
    revalorisations des régimes spéciaux avant 2009, un texte ou une circulaire
    du service des retraites de l'État qui dise si la revalorisation du jour du
    départ est servie depuis 2009 comme les décrets de 2004 à 2007 la servaient,
    et comment la tranche de 2020 a été appliquée aux pensions prenant effet le
    1er janvier 2020 dans la fonction publique.
  - >-
    DROIT EN PROJET, À SUIVRE JUSQU'À LA PROMULGATION : l'article 35 du projet de loi de
    financement pour 2027 (n° 3211) déroge, pour la seule année 2027, à L. 161-23-1. Le
    seuil se lit sur le montant mensuel total, au 31 décembre 2026, des pensions de
    droit direct et dérivé, base et complémentaires : jusqu'à 1 260 €, le coefficient
    légal ; au-delà, des coefficients fixés par décret, jamais inférieurs à un, par
    paliers de 1 265, 1 270, 1 275 et 1 281 €, puis de 2 000 à 2 034 €, chacun au plus
    égal à celui du palier inférieur ; sans décret publié au plus tard le 31 octobre
    2027, le coefficient vaut un au-delà de 1 260 € (hors lissage du b du II) ; les
    régimes en points reçoivent la règle par décret (IV). Seules les pensions de base,
    leurs majorations, accessoires et suppléments, minimum contributif compris, sont
    revalorisées ainsi, non l'Agirc-Arrco ni l'Ircantec, que le seuil compte pourtant ;
    la majoration pour tierce personne (L. 355-1) est hors du total. L'étude d'impact,
    que cite le rapport n° 3345 (tome II), envisage deux décrets : rien au-delà de
    1 260 € (4,0 milliards d'euros d'économie nette, dont 3,0 aux régimes de base) ;
    ou la moitié du coefficient de 1 260 à 2 000 €, rien au-delà (3,4 milliards, dont
    2,5). L'annexe du projet prévoit 2,1 % d'inflation hors tabac en 2026, 1,7 % en
    2027, et une revalorisation moyenne des pensions de 0,2 % en 2027, mesure comprise.
    L'Assemblée a rejeté le projet en première lecture le 23 octobre 2026 (T.A.
    n° 358), faute d'en avoir adopté la deuxième partie (LO 111-7-1) : l'article 35
    n'y a pas été discuté, et le Sénat examinera le texte déposé. Une revalorisation
    par seuils entrerait dans `revalorisation_pensions.csv` comme les tranches de 2020.
  lectures:
  - type: autre
    reference: >-
      Assemblée nationale, projet de loi de financement de la sécurité sociale pour 2027
      rejeté le 23 octobre 2026, T.A. n° 358, en application de l'article L.O. 111-7-1 ;
      rapport n° 3345 de la commission des affaires sociales, tome II, commentaire de
      l'article 35 (les deux décrets de l'étude d'impact) ; annexe du projet, hypothèses
      d'inflation et revalorisations moyennes de 2025 à 2030
    url: https://www.assemblee-nationale.fr/dyn/17/textes/l17t0358_texte-adopte-seance
    date: 2026-10-23
  - type: autre
    reference: >-
      Assemblée nationale, projet de loi de financement de la sécurité sociale pour 2027,
      n° 3211, article 35 « Dérogation exceptionnelle aux modalités de revalorisation des
      pensions de retraite pour 2027 » et son exposé des motifs (revalorisations
      moyennes de 5,3 % en 2024, 2,2 % en 2025, 0,9 % en 2026), texte déposé le
      1er octobre 2026
    url: https://www.assemblee-nationale.fr/dyn/17/dossiers/PLFSS_2027
    date: 2026-10-01
  - type: circulaire_cnav
    reference: >-
      2025/29 du 22 décembre 2025, « Revalorisation à compter du 1er janvier 2026
      » — coefficient 1,009, soit 0,9 %
    date: 2025-12-22
  - type: legifrance
    reference: >-
      L. 161-23-1, version en vigueur au 1er janvier 2026 (LEGIARTI000051289722),
      lue dans l'index LEGI du dépôt
    date: 2026-01-01
  - type: autre
    reference: >-
      Cnav, base de législation, barème « Coefficients de revalorisation des retraites
      », toutes les dates d'effet depuis le 1er janvier 1949 et les cinq tranches
      de 2020 (data/reference/legislation/revalorisation_pensions.csv)
    date: 2026-09-23
    url: https://legislation.lassuranceretraite.fr/
  - type: legifrance
    reference: >-
      L. 16 CPCMR dans ses trois rédactions, et les décrets de revalorisation des
      pensions de l'État de 2003 à 2007, lus dans les index LEGI et JORF du dépôt
      (revalorisation_pensions_fonction_publique.csv)
    date: 2026-09-23
  - type: autre
    reference: >-
      COR, rapport annuel de juin 2026, figure 3.14 et annexe méthodologique § 3.3
      : pouvoir d'achat de la pension nette des cas types non-cadre et cadre, générations
      1937 à 1952 (tests/temoins/cor_pouvoir_achat_retraite.json)
    date: 2026-09-23
    url: https://www.cor-retraites.fr/
textes_a_rattacher:
- reference: L. 161-25 CSS
- reference: L. 161-23-1 CSS (version du 1er janvier 2026, LEGIARTI000051289722)
- reference: >-
    instruction interministérielle n° DSS/3A/DB/6BRS/2025/174 du 15 décembre 2025
- reference: loi n° 2018-1203, art. 68 (JORFARTI000037847640)
- reference: loi n° 2019-1446, art. 81 (JORFARTI000039675431)
- reference: >-
    L. 16 CPCMR, trois rédactions (LEGIARTI000006362709, LEGIARTI000006362710, LEGIARTI000019959484)
- reference: >-
    décrets n° 2003-1304, 2005-166, 2006-316 et 2007-60 ; loi n° 2008-1330, art.
    6
code:
  moteur: >-
    `RevalorisationsPensions` lit les coefficients des pensions servies, date par date,
    et `generale` en fait le produit entre deux dates, celui de L. 161-23-1, les
    dérogations de 2019 et de 2020 lues sur la retraite totale de décembre 2019
    (`mensuel_superieur_a`, `mensuel_au_plus`). `PensionServie.coefficient` revalorise
    chaque pension, de son départ à l'échéance, par la règle de son régime : la valeur
    de son point pour un régime en points qui en publie une, la règle générale au-delà
    de la dernière ; pour la fonction publique, la péréquation par le point d'indice
    jusqu'en 2003, les décrets de 2004 à 2008, puis L. 161-23-1
    (`PensionServie._fonction_publique`) ; L. 161-23-1 depuis le départ pour un régime
    spécial ; depuis le 1er janvier de l'année du départ, majorations forfaitaires de
    1972 à 1982 comprises, pour les autres, que le texte rattache à L. 161-23-1
    (`REGIMES_REGLE_GENERALE`) ou non. `faire_vivre` mène ainsi la pension de départ
    jusqu'à l'année demandée, et `pension_aujourd_hui` sert au simulateur la pension
    d'aujourd'hui.
  python: >-
    revalorisation.py : RevalorisationsPensions, RevalorisationsPensions.generale,
    PensionServie, PensionServie.coefficient, PensionServie._fonction_publique,
    REGIMES_REGLE_GENERALE, REGIMES_FONCTION_PUBLIQUE, faire_vivre, pension_aujourd_hui
  javascript: >-
    moteur/js/revalorisation.js : RevalorisationsPensions,
    RevalorisationsPensions.generale, PensionServie, PensionServie.coefficient,
    PensionServie._fonctionPublique, REGIMES_REGLE_GENERALE, REGIMES_FONCTION_PUBLIQUE,
    faireVivre, pensionAujourdhui
  parametres: >-
    legislation/revalorisation_pensions.csv : date_effet, coefficient,
    mensuel_superieur_a, mensuel_au_plus ;
    legislation/revalorisation_pensions_fonction_publique.csv : date_effet, coefficient
  tests:
  - tests/test_revalorisation.py
  - tests/test_reversion.py
  - tests/test_departs.py
  - tests/test_invalidite.py
  - tests/test_liquidation.py
  - tests/test_minima_agricoles.py
  - tests/test_pension_maximale.py
  - tests/test_pension_minimum_avant_1983.py
  - >-
    tests/test_cumul_activites.py, tests/test_decompte_des_services.py,
    tests/test_etranger.py, tests/test_exonerations_agirc_arrco.py,
    tests/test_independants.py, tests/test_majoration_conjoint_a_charge.py,
    tests/test_majoration_enfants_a_charge.py, tests/test_majoration_exceptionnelle.py,
    tests/test_minima_agricoles.py, tests/test_minimum_pension_sncf.py,
    tests/test_pcv_sante.py, tests/test_pension_maximale.py,
    tests/test_pension_minimum_avant_1983.py, tests/test_pont.py,
    tests/test_revalorisation.py, tests/test_reversion.py,
    tests/test_taux_plein_par_categorie.py et tests/test_versements_uniques.py, qui
    confrontent les deux moteurs sur des carrières qui la portent
  - >-
    tests/temoins/simulations.json, que le portage rejoue (tests/js/moteur.test.js) :
    467 témoins changent sans elle : 452 dans leur pension d'aujourd'hui, 82 au scénario
    1, où un minimum, une majoration ou une réversion se revalorise depuis le départ, 45
    dans leurs réversions et 50 dans leur compte notionnel
