approximations:
- version: exercice_1952
  ecart: >-
    la cotisation annuelle que le modèle divise par deux est sa convention, 8,5 % du
    revenu borné au plafond (fiche du régime, période de 1974 à 1985), et non les
    cotisations de 1952, personnelle (article 20) et cadastrale (article 21), dont la loi
    n° 52-799 fixe le montant ; son texte n'est à l'index du Journal officiel que par sa
    notice (JORFTEXT000000512405)
  effet: celui de la convention, que la fiche du régime déclare ; non mesuré ici
- version: exercice_1952
  ecart: >-
    la cotisation « réclamée aux assujettis est arrondie à la dizaine de francs
    inférieure » (décret n° 52-1166, article 23, LEGIARTI000019272750, du 19 octobre 1952
    au 9 juillet 1975) ; le modèle n'arrondit pas
  effet: >-
    moins de dix anciens francs par an, soit 0,1 franc de 1960, 0,015 € : posé à la main,
    10 / 100 / 6,559 57
sources:
  lu_le: 2026-11-03
  prochaine_relecture: 2027-11-03
  a_relire:
  - >-
    Ce que l'article 45 ne dit pas, et que le modèle tient par convention. (1) La raison
    de la moitié : l'article ne la donne pas, et l'article 15 fait courir chaque
    exercice du 1er janvier au 31 décembre ; qu'elle tienne à ce que le régime ne couvre
    que le second semestre se déduit du 1er juillet 1952, date de sa création (décret
    n° 99-875, article 2), et du décret n° 55-753, article 18 (LEGIARTI000006763581) :
    « Les années d'activité postérieures au 1er juillet 1952 ne sont prises en
    considération que si elles ont donné lieu au payement des cotisations prévues à
    l'article 19 de la loi du 10 juillet 1952 modifiée ». C'est une déduction, non une
    lecture. (2) Que la « double cotisation professionnelle » de l'article 19, celle
    dont dépend la prise en compte des années, soit celle des articles 20 et 21 : le
    décret ne nomme pas d'autres cotisations parmi les recettes de la caisse (article
    5, 3°), et son article 22 appelle « cotisations professionnelles » celles de
    l'exploitant et des membres de sa famille ; la loi n'est pas lue. (3) Les points et
    la durée de cette demi-cotisation : le modèle compte les points de toute cotisation
    d'avant 1990 par son rendement, ceux de 1952 sur la moitié, et compte 1952 pour une
    année entière dans la durée et dans la moyenne P de la majoration des points de
    chef (fiche retraite_proportionnelle_msa) ; aucun texte lu ne dit l'une ou l'autre.
  - >-
    La loi n° 52-799 du 10 juillet 1952, articles 19 à 21, au fac-similé du Journal
    officiel du 11 juillet 1952 : le montant et l'assiette des cotisations de 1952, et ce
    qu'est la « double cotisation » de l'article 19. La rédaction d'origine des articles
    8 et 9 du décret n° 52-1166, que l'index n'a qu'à partir du 8 août 1953.
  lectures:
  - type: legifrance
    reference: >-
      décret n° 52-1166 du 18 octobre 1952 (LEGITEXT000006060625), articles 1er à 28 et
      44 à 46 dans leurs rédactions du 19 octobre 1952, dont les articles 5, 14, 15, 22,
      23 et 45 cités par les versions ; les articles 8, 9, 13, 18, 20, 29 et 30 n'y sont
      que dans des rédactions postérieures (1953 à 1974). Décret n° 99-875, article 2
      (LEGIARTI000006779656) ; décret n° 55-753, article 18 (LEGIARTI000006763581) ; loi
      n° 52-401 du 14 avril 1952, articles 17, 19 et 20 (LEGIARTI000006319214,
      LEGIARTI000006319216, LEGIARTI000006319218), qui créent le fonds national et
      renvoient ses ressources à « une loi spéciale avant le 15 juin 1952 ». Au Journal
      officiel, les notices de la loi n° 52-799 (JORFTEXT000000512405), du décret
      n° 52-1166 (JORFTEXT000000327336) et de l'arrêté du 23 juillet 1953 « TAUX DES
      COTISATIONS » (JORFTEXT000000435389), sans leur texte. Lu dans les index LEGI (à
      jour au 2 novembre 2026) et JORF (au 3 novembre 2026) du dépôt
    date: 2026-11-03
