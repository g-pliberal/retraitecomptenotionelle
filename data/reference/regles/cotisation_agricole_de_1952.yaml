schema_version: 1
id: cotisation_agricole_de_1952
intitule: >-
  Pour l'exercice 1952, les cotisations professionnelles des non-salariés agricoles,
  celles des articles 20 et 21 de la loi n° 52-799 du 10 juillet 1952, sont égales à la
  moitié des cotisations annuelles (décret n° 52-1166 du 18 octobre 1952, article 45).
domaine: cotisations
regimes: [msa_non_salaries]
etape: acquerir_les_droits
face: cotisation
etat: transcrite
lit:
- l'année de la ligne de carrière, qui est l'exercice au titre duquel la cotisation est due
- >-
  le revenu de l'année, borné au plafond, et le taux de cotisation de la fiche du régime
  (regimes/msa_non_salaries.yaml), qui en font la cotisation annuelle du modèle
ecrit:
- >-
  la cotisation de l'année au régime des non-salariés agricoles, que le scénario 1 change
  en points par le rendement, et que le compte des scénarios 2 à 6 reçoit
