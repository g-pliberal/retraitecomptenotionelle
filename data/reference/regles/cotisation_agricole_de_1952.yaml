historique:
- >-
  2026-11-03 — née avec l'action 131 : le modèle prélevait en 1952 la cotisation d'une
  année entière, au compte comme au scénario 1, que la relecture R-K-bis avait relevé ;
  la période de 1952 de la fiche du régime est coupée à part, au taux de 4,25 %.
effet: >-
  Les chefs d'exploitation et les membres de leur famille qui cotisaient en 1952 : leur
  cotisation de cette année est la moitié de celle d'une année, dans les six scénarios.
  Pour 100 € de revenu, 4,25 € au lieu de 8,50 €. Le témoin de chef né en 1925, parti en
  1989, chef de 1952 à 1972 : au scénario 1, 4 448,96 € par an au lieu de 4 462,11 €, en
  euros de son départ, soit 13,144 € de moins : 12,518 € de pension proportionnelle (la
  moitié de sa cotisation de 1952 revalorisée, 208,635 €, au rendement de 6 %) et
  0,626 € de majoration de ses points de 1952 à 1972 (46,13 € au lieu de 46,75 €,
  P = 17,76 au lieu de 18,00, 5 % dans les deux cas), le calcul posé à la main dans la
  note de l'action 131 du 3 novembre 2026 ; aux scénarios 2 à 6, 1 109,56 € au lieu de
  1 112,57 €. Le témoin de collaborateur né en 1925 : 12,52 € de moins au scénario 1,
  sans majoration. Le coût du compte rétroactif ne bouge qu'aux premières années de sa
  série, quand les retraités ont cotisé en 1952 : −0,85 % en 1959, presque rien en
  2024.
