schema_version: 1
id: decote_opera_de_paris
intitule: >-
  Décote des artistes du ballet, des musiciens de l'orchestre, des chefs de chant et des
  pianistes accompagnateurs de l'Opéra : le taux et le calendrier des autres régimes spéciaux,
  mais un âge d'annulation propre, leur âge minimum d'ouverture majoré de quatre trimestres
  pour qui réunit les conditions de juillet 2010 à juin 2011, de six l'année suivante et de
  huit ensuite.
etat: approchee
etape: liquider_chaque_regime
effet: >-
  Les artistes du ballet de l'Opéra national de Paris, seul emploi de l'Opéra que le
  modèle porte, qui ont quarante ans, leur âge d'ouverture, à compter du 1er juillet 2010.
  Le V de l'article 14 leur donne quarante et un ans d'âge d'annulation de juillet 2010 à
  juin 2011, quarante et un ans et demi l'année suivante, quarante-deux ans ensuite, l'âge
  de référence que le 1° du II fixe pour eux ; le taux est celui des autres régimes
  spéciaux, 0,125 % par trimestre la première année, un huitième de point de plus chaque
  1er juillet, 1,25 % depuis juillet 2019, dans la limite de vingt trimestres. Le moteur
  garde quarante-deux ans dès 2010 : il oppose quatre trimestres de trop, à 0,125 %, à qui
  a eu quarante ans au premier semestre 2011, et deux, à 0,25 %, au premier semestre 2012,
  soit un demi-point de pension au plus. Il lit le taux à l'année des quarante ans et sert
  au second semestre la marche d'avant : rien au second semestre 2010, où le droit
  retirait un demi-point au plus, puis un huitième de point de moins par trimestre
  jusqu'en 2019, un point de pension au plus, en faveur du danseur. Pour qui a quarante
  ans depuis le 1er janvier 2020, le moteur suit le texte.
sources:
  lu_le: 2026-09-27
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Après la phase 8 : donner au ballet l'âge d'annulation du V pour qui a quarante ans du 1er
    juillet 2010 au 30 juin 2012, quarante et un ans puis quarante et un ans et demi, et non
    quarante-deux ; lire le taux au mois où les conditions sont réunies, et non à l'année
    (voir `decote_regimes_speciaux`). Le `code.moteur` de cette fiche et le commentaire de
    `droit/liquider.py` disent « huit trimestres » qui « ne recule pas » : le V écrit quatre,
    six, puis huit.
  - >-
    Après la phase 8 : la note de la période 2009-2013 de `regimes/opera_de_paris.yaml`
    chiffre l'excès de 2011 à « un quart de point de pension » ; quatre trimestres à 0,125 %
    en font un demi.
  - >-
    Hors du modèle, qui ne porte que le ballet : les musiciens, chefs de chant et pianistes,
    âge de référence de soixante-deux ans ; les artistes des chœurs, qui ont depuis le décret
    n° 2011-953 un âge de référence de soixante ans et, nés avant 1972, un âge d'annulation
    par date de naissance (dernier alinéa du V).
  - >-
    Aucun exemple chiffré publié : la caisse (cropera.fr) ne publie ni le barème ni un
    exemple de la décote. La fiche reste `approchee` tant que l'âge de 2010-2012 et la lecture
    à l'année demeurent.
  lectures:
  - type: legifrance
    reference: >-
      décret n° 68-382, article 14, rédaction en vigueur depuis le 1er janvier 2017
      (LEGIARTI000029135161). II : « un coefficient de minoration égal à celui prévu pour les
      fonctionnaires de l'Etat en application du I de l'article L. 14 du code des pensions
      civiles et militaires de retraite s'applique au montant de la pension calculée en
      application du I ci-dessus dans la limite de vingt trimestres » ; 1° du II : « pour les
      artistes du ballet, l'âge de référence est fixé à 42 ans, pour les artistes des chœurs,
      il est fixé à 60 ans et, pour les musiciens de l'orchestre, les chefs de chant et les
      pianistes, il est fixé à 62 ans » ; V : « Toutefois, pour les artistes du ballet, les
      musiciens de l'orchestre, les chefs de chant et les pianistes accompagnateurs, l'âge
      auquel le coefficient de minoration s'annule correspond à l'âge minimum d'ouverture du
      droit à pension qui leur est applicable majoré de quatre trimestres pour la période du
      1er juillet 2010 au 30 juin 2011 inclus, six trimestres pour la période du 1er juillet
      2011 au 30 juin 2012 inclus et huit trimestres pour les périodes postérieures au 30 juin
      2012 ». Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      décret n° 68-382, article 14, rédaction du 1er juillet 2008 (LEGIARTI000018253858,
      jusqu'au 5 juillet 2008) : le coefficient « égal à celui prévu pour les fonctionnaires
      de l'Etat », « dans la limite de vingt trimestres », et l'âge de référence du ballet
      « fixé à 42 ans » y sont déjà ; le V y porte, au mot près, les deux paragraphes de la
      décote de la rédaction en vigueur, sans la phrase des chœurs : le coefficient « n'est
      applicable qu'aux personnes remplissant les conditions définies à l'article 6 à compter
      du 1er juillet 2010 », « à un dixième du taux prévu au premier alinéa du II ci-dessus »
      la première année. Les rédactions du 5 juillet 2008 et du 1er janvier 2009 le reprennent
      sans y rien changer. Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      décret n° 68-382, article 6 : « à quarante ans d'âge pour les artistes du ballet » du 1er
      janvier 2009 au 13 août 2011 (LEGIARTI000020056988), « 1° A quarante ans pour les artistes
      du ballet » dans la rédaction en vigueur depuis le 26 juin 2014 (LEGIARTI000029135150).
      Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: jorf
    reference: >-
      décret n° 2011-953 du 10 août 2011, article 6 (JORFARTI000024463215, JORF du 12 août
      2011) : il insère au II « , pour les artistes des chœurs, il est fixé à 60 ans » et
      complète le V : « Pour les artistes des chœurs nés avant le 1er janvier 1972, l'âge
      auquel le coefficient de minoration s'annule correspond à […] l'âge minimum d'ouverture
      du droit à pension qui leur est applicable majoré de six trimestres pour les assurés nés
      entre le 1er janvier 1962 et le 30 juin 1962 inclus, […] et douze trimestres pour les
      assurés nés à compter du 1er juillet 1966 ». Lu dans l'index JORF du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      code des pensions civiles et militaires de retraite, L. 14, I, en vigueur
      (LEGIARTI000048844775) : « un coefficient de minoration de 1,25 % par trimestre
      s'applique au montant de la pension […] dans la limite de vingt trimestres », comme dans
      les rédactions du 1er janvier 2004 et du 19 décembre 2008 (LEGIARTI000006362704,
      LEGIARTI000019959691). Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: autre
    reference: >-
      Caisse de retraites des personnels de l'Opéra national de Paris, « Conditions de départ
      en retraite » : « pour les artistes du ballet, l'âge d'ouverture du droit à la retraite
      est de 40 ans » ; ni cette page, ni la foire aux questions, ni la page des documents ne
      publient la décote
    url: >-
      http://www.cropera.fr/index.php?option=com_content&view=article&id=13:les-cas-particuliers&catid=5:une-pension-de-vieillesse&Itemid=18
    date: 2026-09-27
textes_a_rattacher:
- id: LEGIARTI000018253858
  reference: >-
    décret n° 68-382 du 5 avril 1968 (Opéra national de Paris), article 14, rédaction du 1er
    juillet 2008 : la décote naît, taux et plafond au II, âge de référence au 1°, calendrier
    et âge propre au ballet et aux musiciens au V
- id: LEGIARTI000029135208
  reference: décret n° 68-382, article 14, rédaction du 13 août 2011 (décret n° 2011-953)
  change: >-
    l'âge de référence des artistes des chœurs, soixante ans, et leur âge d'annulation par
    date de naissance ; rien pour le ballet ni pour les musiciens
- id: LEGIARTI000030058962
  reference: décret n° 68-382, article 14, rédaction du 1er janvier 2015
  change: >-
    les exemptions seules : l'incapacité permanente « au moins égale à 50 % », et non plus
    80 %, et les assurés « mis en inactivité suite à une invalidité »
- id: LEGIARTI000029135161
  reference: décret n° 68-382, article 14, rédaction en vigueur depuis le 1er janvier 2017
  change: >-
    une exemption de plus, « c) Aux assurés âgés d'au moins soixante-cinq ans » qui ont élevé
    ou aidé un enfant handicapé ; le barème est celui de 2011
textes_sans_effet:
- id: LEGIARTI000019138608
  reference: décret n° 68-382, article 14, rédaction du 5 juillet 2008
  motif: >-
    le II et les deux paragraphes de la décote du V, de « Le coefficient de minoration prévu
    au II ci-dessus n'est applicable » à « huit trimestres pour les périodes postérieures au
    30 juin 2012 », y sont ceux du 1er juillet 2008 au mot près
- id: LEGIARTI000020056984
  reference: décret n° 68-382, article 14, rédaction du 1er janvier 2009
  motif: >-
    le II et les deux paragraphes de la décote du V, de « Le coefficient de minoration prévu
    au II ci-dessus n'est applicable » à « huit trimestres pour les périodes postérieures au
    30 juin 2012 », y sont ceux du 1er juillet 2008 au mot près
- id: LEGIARTI000029135692
  reference: décret n° 68-382, article 14, rédaction du 26 juin 2014
  motif: >-
    le II et les paragraphes de la décote du V, phrase des chœurs comprise, y sont ceux du 13
    août 2011 au mot près
code:
  interrupteurs:
    bareme_decote: regimes_speciaux_age_fixe
  moteur: >-
    `bareme_decote: regimes_speciaux_age_fixe` prend le coefficient du barème des régimes
    spéciaux mais garde l'âge d'annulation écrit dans la période : c'est ce que le V de
    l'article 14 fait pour les catégories d'âge atypique, artistes du ballet et musiciens
    de l'orchestre, dont l'âge d'annulation est leur âge d'ouverture majoré de huit trimestres
    et ne recule pas avec la montée en charge.
