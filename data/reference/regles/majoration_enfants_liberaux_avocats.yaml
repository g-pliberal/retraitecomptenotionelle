schema_version: 1
id: majoration_enfants_liberaux_avocats
intitule: >-
  Majoration de 10 % pour trois enfants (L. 351-12) étendue au régime de base des
  professions libérales (L. 643-1-1) et à celui des avocats (L. 653-3) pour les
  pensions prenant effet à compter du 1er septembre 2023 ; au régime complémentaire
  des avocats depuis le 1er janvier 2024 (article 16-1 de son règlement).
etat: approchee
effet: >-
  Les fiches de la CNAVPL, de la CNBF et de sa complémentaire ne la portaient pas
  : 10 % de pension en moins pour tout parent de trois enfants liquidant depuis
  2023. Depuis le 23 septembre 2026, `majoration_enfants` sur leurs périodes de
  2024 et après ; tenu par tests/test_sections_juridiques.py. Approximation : la
  maille est l'année, les pensions prenant effet de septembre à décembre 2023 en
  sont privées.
sources:
  lu_le: 2026-09-23
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    La majoration de durée d'assurance pour enfants que les mêmes articles ouvrent
    (L. 351-4 à L. 351-4-2), et la surcote parentale, sont portées à la CNAVPL depuis
    le 23 septembre 2026 (ligne `cnavpl_majoration_duree_assurance`) ; elles ne
    le sont pas à la CNBF.
  lectures:
  - type: legifrance
    reference: >-
      L. 643-1-1 et L. 653-3, version du 1er septembre 2023, lus dans l'index LEGI
      du dépôt ; l'arrêté du 11 décembre 2023 dans l'index JORF.
    date: 2026-09-23
  - type: autre
    reference: >-
      CNBF, fiche pratique « Ma retraite CNBF : quel montant ? » (janvier 2024)
      : « le montant de votre pension (régime de base et complémentaire) est augmenté
      de 10 % », pour les pensions prenant effet « au 1er octobre 2023 ou postérieure
      pour le régime de base ; au 1er janvier 2024 ou postérieure pour le régime
      complémentaire ». CAVOM, page « La retraite » : « Taux de majoration = 10
      % si 3 enfants et plus à compter du 1er octobre 2023 ».
    url: >-
      https://www.cnbf.fr/medias/documents/?_sft_thematique-media=fiches-pratiques
    date: 2026-09-23
textes_a_rattacher:
- reference: >-
    loi n° 2023-270 du 14 avril 2023, article 21 ; code de la sécurité sociale,
    L. 643-1-1 (LEGIARTI000047453363) et L. 653-3 (LEGIARTI000047453367)
- reference: >-
    arrêté du 11 décembre 2023 (JORFTEXT000048567119), article 16-1 du règlement
    du régime complémentaire de la CNBF
reformes:
- majoration_enfants_liberaux_2023
- cnbf_complementaire_enfants_2024
