schema_version: 1
id: carmf_asv_minoration_enfants
intitule: >-
  Complémentaire de la CARMF et ASV des médecins : depuis le 1er janvier 2017, la
  pension s'ouvre sans minoration à l'âge du premier alinéa de L. 351-1, et se majore
  de 1,25 % par trimestre civil après 62 ans — après l'âge légal jusqu'au 29 mars
  2017 —, de 0,75 % après 65 ans, rien au-delà de 70 ans ; avant 2017, des statuts que
  le Journal officiel ne publie pas (le modèle : 0,75 à 60 ans jusqu'à 0,95 à 64 ans,
  par année d'âge, à la complémentaire de 2000 à 2016) ; 10 % pour trois enfants,
  depuis l'arrêté du 16 janvier 1964 à la complémentaire et sur les prestations
  liquidées depuis le 1er janvier 1981 à l'ASV, lus au règlement de 2026, qui sert
  la complémentaire au premier jour du trimestre civil qui suit les conditions.
domaine: decote_surcote
regimes: [carmf_complementaire, asv_conventionnes]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  l'âge du médecin à la date d'effet de sa pension, et sa génération, qui donne l'âge
  du premier alinéa de L. 351-1, celui de L. 161-17-2 ; depuis 2017, les trimestres
  civils qui séparent celui qui suit ses 62 ans — son âge légal jusqu'au 29 mars 2017
  — de la date d'effet, comptés à 0,75 % du premier jour du trimestre civil qui suit
  ses 65 ans, et nul au-delà de celui qui suit ses 70 ans
- >-
  le nombre d'enfants : au moins trois, « eu » ou élevés neuf ans avant leur seizième
  anniversaire
- >-
  la date d'effet de la pension, qui choisit la rédaction des statuts ou du règlement,
  et que l'article 24 du règlement de 2026 fixe « au premier jour du trimestre civil
  qui suit la réalisation de toutes les conditions d'ouverture des droits »
ecrit:
- >-
  le coefficient de majoration des points de la complémentaire et de l'ASV, que
  `surcote_points` (`par_age_seul`) rend à `liquider_chaque_regime`, et, de 2000 à
  2016, celui de minoration de la complémentaire (`abattement_points`) ; la majoration
  de 10 % pour trois enfants, que `completer` ajoute
dates_qui_decident:
- liquidation.date_effet
versions:
- id: statuts_d_avant_2017
  statut: supposee
  hypothese: >-
    les pensions qui prennent effet avant le 1er janvier 2017 relèvent des statuts du
    régime complémentaire approuvés par l'arrêté du 27 février 1974, de ceux de l'ASV
    approuvés par l'arrêté du 18 décembre 1972, et des arrêtés qui les modifient ;
    l'index JORF n'en porte que des titres, ou les mots que remplace l'arrêté du 28
    septembre 2011 ; l'article 12 ter de l'ASV, que l'arrêté du 1er décembre 2016
    abroge, ne s'y lit que par les mots « dès l'âge de 60 ans » de son premier alinéa
  fiabilite: >-
    faible : l'âge, le coefficient, la place de la durée, la date d'effet et le taux des
    enfants, que nul texte lu ne fixe avant le 1er janvier 2017
  textes:
  - id: JORFARTI000024612007
    article: >-
      annexe de l'arrêté du 28 septembre 2011, statuts du régime d'assurance vieillesse
      complémentaire, article 15, et du régime des prestations supplémentaires de
      vieillesse, article 12
    en_vigueur: 2011-10-01
