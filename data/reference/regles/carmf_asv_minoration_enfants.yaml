    2016 ; depuis 2017, `surcote_points: par_age_seul`, des trimestres d'âge entiers
    depuis `surcote_age_debut` jusqu'à l'âge du départ, au taux de
    `surcote_par_trimestre_apres_palier` après `surcote_palier_age`, jusqu'à
    `surcote_age_maximum`.
