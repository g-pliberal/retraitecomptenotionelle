approximations:
- version: [statuts_d_avant_2017]
  textes: >-
    les statuts du régime complémentaire (arrêté du 27 février 1974) et de l'ASV
    (arrêté du 18 décembre 1972), et les arrêtés qui les modifient dont l'index JORF n'a
    que le titre : 16 janvier 1964 (article 22, trois enfants), 7 et 25 mars 1977, 11 et
    12 mars 1981, 31 décembre 1982, 28 novembre 1985, 31 mars 1995, 23 mai 1997, 30
    juillet 1999, 12 mai 2000, 27 décembre 2000, 11 septembre 2001, 24 juin 2005, 28 août
    2006 ; au Bulletin officiel (question 22 du propriétaire) ; l'article 12 ter de
    l'ASV, que l'arrêté du 28 septembre 2011 nomme et celui du 1er décembre 2016 abroge
    (4°), avec le dernier alinéa de l'article 15 de l'ASV (5°, a) et l'article 41 de la
    complémentaire (arrêté du 30 novembre 2016, 4°, a)
  ecart: >-
    Le texte n'est pas lu : rien ne dit l'âge, le coefficient ni le taux des enfants
    d'avant 2017, que le modèle tient de pages de la caisse et non d'un texte. Deux
    lectures à l'ASV, qui ne se tranchent pas sans lui. Première, celle du modèle : la
    décote du régime de base, que la durée annule ; né le 10 mars 1949, parti à 64 ans
    le 1er avril 2013 avec sa durée, 15 533,26 € par an sans coefficient. Seconde :
    l'ASV porterait, comme la complémentaire, un coefficient par année d'âge, 0,95 à 64
    ans : 14 756,60 €, 776,66 € par an de moins. Ce que le texte ajoute, sans trancher.
    L'arrêté du 28 septembre 2011 récrit à l'ASV deux articles, le 12 (« ou de 60 ans »)
    et le 12 ter (« dès l'âge de 60 ans »), les deux membres de phrase qu'il récrit à
    l'article 15 de la complémentaire. L'arrêté du 1er décembre 2016 abroge l'article 12
    ter et remplace, au dernier alinéa de l'article 15 de l'ASV (la réversion), « au
    titre de l'article 12 ter » par « avant le 1er janvier 2017 » ; celui du 30 novembre
    2016 remplace, à l'article 41 de la complémentaire, « demandé la liquidation de ses
    droits par anticipation au titre de l'article 15 » par « liquidé ses droits par
    anticipation avant le 1er janvier 2017 au titre de l'article 15 ». Le texte penche
    donc vers la seconde lecture : l'ASV avait, avant 2017, un article à elle pour une
    liquidation dès 60 ans, que sa réversion visait comme celle de la complémentaire visait
    la liquidation par anticipation de l'article 15, ce que la seule décote du régime de
    base expliquerait mal. Il ne la prouve pas : l'article 12 ter et le dernier alinéa de
    l'article 15 ne sont pas publiés, « dès l'âge de 60 ans » dit un âge et non un
    coefficient, rien ne dit si l'article 12 ter visait tout médecin ou une catégorie
    (l'inapte ou l'ancien combattant, que l'article 12 de 2017 majore de 13 %), et rien ne
    donne la valeur du coefficient, ni qu'elle fût celle de la complémentaire. La lecture
    du modèle n'est pas intenable : le point reste non tranché.
  effet: >-
    776,66 € par an à l'ASV, né le 10 mars 1949, parti à 64 ans le 1er avril 2013, si la seconde lecture vaut ; 0 € si la première.
    Essai du 6 novembre 2026, dans les deux moteurs, requête du formulaire (médecin libéral, entré à 22 ans, deux salaires moyens, né le 10 du mois).
- version: [statuts_de_2017]
  textes: >-
    article 15 de la complémentaire et article 12 de l'ASV, annexés aux arrêtés des 30
    novembre et 1er décembre 2016 (« après cet âge »), et l'arrêté du 22 mars 2017 («
    après l'âge de 62 ans »), en vigueur le 30 mars 2017
  ecart: >-
    Du 1er janvier au 29 mars 2017, la majoration court de l'âge du premier alinéa de
    L. 351-1, l'âge légal de la génération ; le modèle, qui la faisait courir de 62 ans
    dès le 1er janvier 2017, la sert ainsi depuis le 14 novembre 2026
    (`surcote_depuis_l_age_legal`, périodes coupées au 30 mars 2017). Le texte ne
    tranche pas pour une pension prenant effet dans ces trois mois et liquidée après le
    29 mars, puisque « Ces coefficients sont déterminés définitivement lors de la
    liquidation des droits » (cette phrase dit que les coefficients ne se revoient pas,
    non quelle rédaction les fixe). La lecture du modèle est la plus forte des deux : la
    fiche choisit ses versions par la date d'effet, et l'arrêté du 22 mars 2017, sans
    date, n'entre en vigueur que le 30 mars, sans effet rétroactif écrit ; l'autre, 62
    ans pour qui est liquidé après le 29 mars, reste possible, d'où le point non
    tranché. Né le 10 mars 1952, 60 ans et 9 mois le 10 décembre 2012 (D. 161-2-1-9,
    3°), parti à 64 ans et 9 mois, la pension le 1er janvier 2017 : première lecture,
    la règle de la date d'effet, celle du modèle, 16 trimestres du 1er janvier 2013,
    20 %, 1,20 ; seconde, 11 trimestres du 1er avril 2014, 1,1375. Écart : 679,34 € par
    an à la complémentaire (13 043,35 € servis), 873,34 € à l'ASV (16 768,15 €), soit
    1 552,68 € par an, seuls les nés avant 1955 dont la pension prend effet du
    1er janvier au 1er mars 2017 étant touchés. Ce que la caisse a servi ce
    trimestre-là n'est pas lu.
  effet: >-
    0 € si la première lecture vaut ; 1 552,68 € par an de trop (679,34 € à la complémentaire, 873,34 € à l'ASV), né le 10 mars 1952, la pension le 1er janvier 2017, si la seconde vaut pour une pension liquidée après le 29 mars 2017.
    Essai du 14 novembre 2026, dans les deux moteurs, requête du formulaire (médecin libéral, entré à 22 ans, deux salaires moyens, né le 10 du mois).
- version: [statuts_de_2017, statuts_de_mars_2017]
  textes: >-
    l'article des statuts qui fixe la date d'effet, que le Journal officiel ne publie
    pas ; le guide de la caisse « Préparez votre retraite en temps choisi », juin 2026,
    p. 12 (exemple carmf_2026_temps_choisi_63_ans)
  ecart: >-
    Le modèle sert la pension au premier jour du mois qui suit l'âge. Le texte n'est pas
    lu ; la caisse, en juin 2026, sous ces statuts, sert à un médecin qui a 63 ans le 15
    mai 2028 ses pensions « à partir du 1er juillet 2028 », au trimestre civil comme
    l'article 24 du règlement de 2026. Les deux lectures se chiffrent comme sous le
    règlement : un ou deux mois de pension, et 1,25 point de majoration quand
    l'anniversaire tombe au premier mois d'un trimestre civil.
  effet: >-
    un ou deux mois de pension de trop, et 1,25 point de majoration de moins quand l'anniversaire tombe au premier mois d'un trimestre civil, si la première lecture vaut ; 0 € si la seconde.
    Essai du 6 novembre 2026, dans les deux moteurs, requête du formulaire (médecin libéral, entré à 22 ans, deux salaires moyens, né le 10 du mois).
- version: [reglement_de_2026]
  textes: >-
    règlement du régime complémentaire, article 24 ; règlement de l'ASV, articles 2, 7 et
    9 ; code de la sécurité sociale, L. 161-17-2, 3°, rédaction de la loi n° 2025-1403
    (LEGIARTI000053280889), pour l'âge légal des nés en 1964
  ecart: >-
    À la complémentaire, l'article 24 fixe la date d'effet « au premier jour du
    trimestre civil qui suit la réalisation de toutes les conditions d'ouverture des
    droits, sans pouvoir être antérieure à la date de la demande ». Le modèle ne
    connaît pas la demande : il tient la pension pour demandée à temps, et reporte la
    date qu'il présume — le premier du mois qui suit l'âge demandé — au premier jour du
    trimestre civil qui commence ce jour-là ou après (`effet_au_trimestre_civil`),
    depuis le 18 juillet 2026 ; la condition du formulaire reçu dans les douze mois
    n'est pas portée. La pension de base, que R. 643-6 du code de la sécurité sociale
    date de même, reste servie au premier du mois (fiche `cnavpl_allocation_avant_2004`).
    À l'ASV, le règlement ne dit pas la date d'effet de la pension du médecin —
    l'article 2 la nomme, l'article 7 n'étend que les règles des conjoints, l'article 9
    ne vise que le médecin débiteur — : point non tranché ; première lecture, celle du
    guide de la caisse, le trimestre civil ; seconde, celle du modèle, qui la sert au
    premier du mois, avec la base. Né le 10 mai 1964, entré à 22 ans, parti à 63 ans le
    10 mai 2027 : l'ASV servie le 1er juin, 15 850,88 € par an, un mois avant la
    complémentaire. Le rectificatif du 8 août 2026 est lu : il ne déplace qu'un
    intitulé de chapitre (textes sans effet).
  effet: >-
    à la complémentaire, aucun quand la demande est faite à temps ; à l'ASV, 0 € ou, si
    la première lecture vaut, 1 320,91 € (un mois de trop), ou 2 656,35 € puis
    189,74 € par an de moins. Essai du 6 novembre 2026, dans les deux moteurs, requête
    du formulaire (médecin libéral, entré à 22 ans, deux salaires moyens, né le 10 du
    mois).
- version: [statuts_d_avant_2017, statuts_de_2017, statuts_de_mars_2017]
  textes: >-
    l'article 22 du règlement, ajouté par l'arrêté du 16 janvier 1964, et l'article des
    statuts de l'ASV issu des arrêtés des 11 et 12 mars 1981, que l'index n'a qu'en
    titre
  ecart: >-
    Le taux et les conditions de la majoration pour trois enfants ne se lisent qu'au
    règlement de 2026 : 10 %, et les enfants élevés neuf ans avant leurs seize ans ;
    avant le 18 juillet 2026, le modèle sert les mêmes 10 % sans texte lu.
  effet: >-
    inconnu avant le 18 juillet 2026 : le modèle sert 10 % sans texte lu.
