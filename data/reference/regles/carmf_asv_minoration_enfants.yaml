- id: statuts_de_2017
  statut: lue
  textes:
  - id: JORFARTI000033521562
    article: >-
      annexe de l'arrêté du 30 novembre 2016, statuts du régime d'assurance vieillesse
      complémentaire, articles 15 et 41 (4°, a)
    en_vigueur: 2017-01-01
    publie_le: 2016-12-04
    citation: >-
      « A compter du 1er janvier 2017, pour bénéficier de l'ouverture des droits à la
      retraite complémentaire, le médecin doit simultanément : « 1. Etre âgé de l'âge
      prévu au premier alinéa de l'article L. 351-1 du code de la sécurité sociale. « Si
      le médecin demande à bénéficier de la retraite complémentaire après cet âge, il est
      fait application d'un coefficient de majoration de 1,25 % par trimestre séparant
      le premier jour du trimestre civil suivant celui où le médecin atteint cet âge de
      la date d'effet de la retraite. « Le coefficient de majoration est le cas échéant
      réduit à 0,75 % par trimestre à partir du premier jour du trimestre civil suivant
      celui où le médecin atteint l'âge de 65 ans, sans pouvoir s'appliquer au-delà du
      premier jour du trimestre civil suivant le soixante dixième anniversaire du
      médecin. [...] « Ces coefficients sont déterminés définitivement lors de la
      liquidation des droits. » [...] 4° L'article 41 est ainsi modifié : a) Au deuxième
      alinéa, les mots : « demandé la liquidation de ses droits par anticipation au
      titre de l'article 15 » sont remplacés par les mots : « liquidé ses droits par
      anticipation avant le 1er janvier 2017 au titre de l'article 15 »
  - id: JORFARTI000033521558
    article: arrêté du 30 novembre 2016, article 2
    en_vigueur: 2017-01-01
    publie_le: 2016-12-04
    citation: « Le présent arrêté entre en vigueur au 1er janvier 2017. »
  - id: JORFARTI000033538061
    article: >-
      annexe de l'arrêté du 1er décembre 2016, statuts du régime des prestations
      supplémentaires de vieillesse des médecins conventionnés, article 12, puis 4° (l'article
      12 ter abrogé) et 5°, a (l'article 15, dernier alinéa, la réversion)
    en_vigueur: 2017-01-01
    publie_le: 2016-12-06
    citation: >-
      « A compter du 1er janvier 2017, pour bénéficier des prestations supplémentaires
      de vieillesse prévues par les présents statuts, le médecin doit remplir les
      conditions suivantes : « 1° Etre âgé de l'âge prévu au 1er alinéa de l'article L.
      351-1 du code de la sécurité sociale, « Si le médecin demande à bénéficier des
      prestations supplémentaires de vieillesse après cet âge, il est fait application
      d'un coefficient de majoration de 1,25 % par trimestre séparant le premier jour du
      trimestre civil suivant celui où le médecin atteint cet âge de la date d'effet de
      la retraite. « Le coefficient de majoration est le cas échéant réduit à 0,75 % par
      trimestre à partir du premier jour du trimestre civil suivant celui où le médecin
      atteint l'âge de 65 ans sans pouvoir s'appliquer au-delà du premier jour du
      trimestre civil suivant le soixante dixième anniversaire du médecin. [...] 4°
      L'article 12 ter est abrogé ; 5° L'article 15 est ainsi modifié : a. Au dernier
      alinéa, les mots : « au titre de l'article 12 ter » sont remplacés par les mots : «
      avant le 1er janvier 2017 »
  - id: JORFARTI000033538057
    article: arrêté du 1er décembre 2016, article 2
    en_vigueur: 2017-01-01
    publie_le: 2016-12-06
    citation: « Le présent arrêté entre en vigueur au 1er janvier 2017. »
