exemples:
- carmf_report_62_65_ans
reformes:
- carmf_trois_enfants_1964
- asv_trois_enfants_1981
effet: >-
  De 2000 à 2016, la fiche disait l'âge seul sans que le moteur le lise : un médecin
  parti à 64 ans avec sa durée n'était pas minoré. Depuis le 23 septembre 2026,
  `abattement_points: cavom` sur ces périodes, et `majoration_enfants` depuis 1964 à la
  complémentaire, depuis 1981 à l'ASV. Lue au droit le 6 novembre 2026 (action 130) :
  quatre versions, les statuts d'avant 2017 non lus, ceux de 2017, de mars 2017, le
  règlement de 2026 ; la majoration de 1,25 % puis 0,75 % par trimestre et les 10 % de
  trois enfants rendus par le modèle ; une erreur déclarée, la date d'effet au
  trimestre civil de la complémentaire depuis le 18 juillet 2026 ; quatre points non
  tranchés, l'âge de l'ASV avant 2017, l'âge légal de janvier à mars 2017, la date
  d'effet d'avant 2026 et celle de l'ASV.
  Corrigé le 14 novembre 2026 (ligne 13 de la même file) : du 1er janvier au 29 mars
  2017, la majoration court de l'âge légal de la génération, « cet âge » des arrêtés
  des 30 novembre et 1er décembre 2016, et non de 62 ans, que l'arrêté du 22 mars 2017
  n'écrit que le 30 mars — née le 10 mars 1952, la pension le 1er janvier 2017 : 1,20
  au lieu de 1,1375, 679,34 € par an de plus à la complémentaire, 873,34 € à l'ASV
  (`surcote_depuis_l_age_legal`, `date_effet`, dans les deux moteurs).
  Corrigée le 14 novembre 2026 (action 130, décision du propriétaire du 13, ligne 12 de
  la file) : jusque-là, le modèle servait la complémentaire le premier du mois qui suit
  l'âge, avec la base, quand l'article 24 du règlement de 2026 la fixe « au premier jour
  du trimestre civil qui suit la réalisation de toutes les conditions d'ouverture des
  droits » — né le 10 mai 1964, entré à 22 ans, parti à 63 ans : servi dès le 1er juin
  2027 au lieu du 1er juillet, un mois de trop, 14 056,14 / 12 = 1 171,35 € ; né le 10
  mars 1964, parti à 63 ans et un mois : servi dès le 1er mai 2027 à 1,05 au lieu du
  1er juillet à 1,0625, deux mois de trop, 2 337,68 €, puis 14 026,06 / 1,05 × 1,0625 =
  14 193,04 € au lieu de 14 026,06 €, 166,98 € par an de moins. Depuis,
  `effet_au_trimestre_civil: [2026-07-18, null]` à la période de 2026 de la
  complémentaire, dans les deux moteurs : la date présumée, depuis le 18 juillet 2026,
  est reportée au premier jour du trimestre civil qui commence ce jour-là ou après, et
  la pension s'y liquide seule, après la base, aux conditions d'ouverture de celle-ci.
  L'ASV reste servie au premier du mois, son règlement ne la datant pas.
