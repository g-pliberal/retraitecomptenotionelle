- id: reglement_de_2026
  statut: lue
  textes:
  - id: JORFARTI000054435859
    article: >-
      annexe de l'arrêté du 10 juillet 2026, I, règlement du régime d'assurance
      vieillesse complémentaire, articles 2, 23 et 24, et III, règlement du régime de
      prestations complémentaires de vieillesse, articles 2 et 8
    en_vigueur: 2026-07-18
    publie_le: 2026-07-17
    citation: >-
      « Etre âgé de l'âge prévu au premier alinéa de l'article L. 351-1 du code de la
      sécurité sociale. « Si le médecin demande à bénéficier de la retraite
      complémentaire après l'âge de 62 ans, il est fait application d'un coefficient de
      majoration de 1,25 % par trimestre, séparant le premier jour du trimestre civil
      suivant celui où le médecin atteint cet âge de la date d'effet de la retraite. «
      Le coefficient de majoration est le cas échéant réduit à 0,75 % par trimestre à
      partir du premier jour du trimestre civil suivant celui où le médecin atteint l'âge
      de 65 ans, sans pouvoir s'appliquer au-delà du premier jour du trimestre civil
      suivant le soixante-dixième anniversaire du médecin. [...] « Le montant total de la
      pension est majoré de 10 % au profit des allocataires ayant eu au moins trois
      enfants. « Sont également considérés comme ouvrant droit à la majoration prévue à
      l'alinéa précédent, les enfants ayant été, pendant au moins neuf ans avant leur
      seizième anniversaire, élevés par le médecin et à sa charge effective. [...] « La
      date d'effet de l'allocation est fixée au premier jour du trimestre civil qui suit
      la réalisation de toutes les conditions d'ouverture des droits, sans pouvoir être
      antérieure à la date de la demande [...] « Si le médecin demande à bénéficier des
      prestations complémentaires de vieillesse après l'âge de 62 ans, il est fait
      application d'un coefficient de majoration de 1,25 % par trimestre séparant le
      premier jour du trimestre civil suivant celui où le médecin atteint cet âge de la
      date d'effet de la retraite. [...] « Le montant des prestations complémentaires
      liquidées avec une date d'effet postérieure au 31 décembre 1980 est majoré de 10 %
      au profit des allocataires ayant eu au moins trois enfants. »
