schema_version: 1
id: minimum_pension_sncf
intitule: >-
  Le minimum de pension de la SNCF (décret n° 2008-639, article 15, I et IV) : la
  pension d'ancienneté — vingt-cinq ans de services valables pour la retraite,
  vingt-sept depuis 2017, abaissés pour qui en comptait vingt-cinq avant 2022 — ne
  peut être inférieure à 3 379,38 € par trimestre au 1er décembre 2008, 1 215,64 € par
  mois au 1er octobre 2014, revalorisés comme les pensions de l'État ; depuis 2017,
  au taux plein seulement — la durée requise, ou l'âge d'annulation de la décote —,
  sauf à l'agent qui avait atteint avant cette date l'âge de liquidation de 2008.
domaine: minima
regimes:
- sncf
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- les années de services valables pour la retraite à la SNCF, et le mois où elles
  atteignent vingt-cinq ans
- l'âge de liquidation, l'âge d'ouverture de l'article 1er et l'âge d'annulation de la
  décote, que l'étape qui liquide calcule
- la durée d'assurance de l'article 13, III, et la durée requise de l'article 12
- la pension calculée, surcote comprise
- le minimum de pension de l'article 15, IV (minimum_pension_sncf.csv), revalorisé
  comme les pensions (revalorisation_pensions.csv), à la date d'effet
ecrit:
- le complément qui porte la pension d'ancienneté au minimum de pension
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1) : le
# règlement de retraites d'avant le 1er juillet 2008, que l'index ne porte pas, puis
# l'article 15 de 2008, puis celui que le décret n° 2011-291 applique aux pensions
# prenant effet à compter du 1er janvier 2017 (article 18, II). L'étape qui liquide
# dit si le minimum est ouvert (droit/liquider.py, minimum_de_pension_ouvert, et son
# jumeau) ; celle qui complète porte la pension à son montant (droit/completer.py,
# minimum_de_pension_sncf, et son jumeau).
versions:
- id: avant_2008
  statut: supposee
  hypothese: >-
    le règlement de retraites du personnel de la SNCF, qui réglait les pensions avant
    le 1er juillet 2008 et que l'index LEGI ne porte pas, n'a pas été lu, ni aucun
    montant de son minimum : le modèle n'en sert pas
  fiabilite: moyenne
  bornes:
    liquidation.date_effet: [null, 2008-07-01]
  contenu:
    droit: aucun minimum servi
    parametres:
      existe: false
      fiabilite: moyenne
  exemples: aucun trouvé
- id: anciennete_2008
  statut: lue
  textes:
  - {id: LEGIARTI000019108319, article: "décret n° 2008-639, article 15", en_vigueur: 2008-07-01}
  - {id: LEGIARTI000030598853, article: "décret n° 2008-639, article 15", en_vigueur: 2015-05-18}
  - {id: LEGIARTI000019108252, article: "décret n° 2008-639, article 1er", en_vigueur: 2008-07-01}
  - {id: LEGIARTI000019108259, article: "décret n° 2008-639, article 3", en_vigueur: 2008-07-01}
  - {id: LEGIARTI000023733100, article: "décret n° 2008-639, article 3", en_vigueur: 2011-03-21}
  - {id: LEGIARTI000032935184, article: "décret n° 2008-639, article 3", en_vigueur: 2016-07-24}
  - {id: LEGIARTI000023730143, article: "décret n° 2011-291, article 18", en_vigueur: 2011-03-21}
  nee_de: LEGIARTI000019108319
  bornes:
    liquidation.date_effet: [2008-07-01, 2017-01-01]
  contenu:
    droit: >-
      « Lorsqu'il est procédé à la liquidation de la pension d'ancienneté, le montant
      de celle-ci ne peut être inférieur à un montant minimal défini au IV
      ci-dessous » ; « Le montant du minimum de pension est égal à 3 367,02 € par
      trimestre à compter du 1er juillet 2008 et à 3 379,38 € par trimestre à compter
      du 1er décembre 2008 », puis « à 1 215,64 euros par mois à partir du 1er octobre
      2014 », « revalorisé dans les conditions définies à l'article 30 » (article 15,
      I et IV) : `minimum_pension_sncf.csv`
    beneficiaire: >-
      l'agent qui « a droit à une pension de retraite lorsqu'il a au moins vingt-cinq
      années de services valables pour la retraite et atteint l'âge » de l'article 1er
      (rédaction de 2008) ; celui qui ne peut y prétendre a « une pension de retraite
      proportionnelle » (article 3), sans minimum
    conditions: >-
      aucune autre : ni durée d'assurance ni âge du taux plein ; la pension calculée
      sur un grade à service discontinu a un autre minimum, « 90 % du traitement fixe
      [...] d'un agent en début de carrière » (article 15, I)
    parametres:
      existe: true
      services_requis_mois: 300
      taux_plein: false
      fiabilite: haute
  exemples: aucun trouvé
- id: taux_plein_2017
  statut: lue
  textes:
  - {id: LEGIARTI000023733127, article: "décret n° 2008-639, article 15", en_vigueur: 2017-01-01}
  - {id: LEGIARTI000045021306, article: "décret n° 2008-639, article 15", en_vigueur: 2022-01-02}
