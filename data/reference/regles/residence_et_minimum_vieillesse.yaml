  nee_de: LEGIARTI000006744832
  bornes:
    liquidation.date_effet: [2006-01-01, 2023-09-01]
  contenu:
    droit: >-
      « Toute personne justifiant d'une résidence stable et régulière sur le
      territoire métropolitain ou dans un département mentionné à l'article L. 751-1 et
      ayant atteint un âge minimum bénéficie d'une allocation de solidarité aux
      personnes âgées » (L. 815-1) ; « sont réputées avoir en France le lieu de leur
      séjour principal les personnes qui y séjournent pendant plus de six mois au cours
      de l'année civile de versement des prestations » (R. 115-6, puis R. 111-2) ; «
      L'Aspa est supprimée en cas de départ hors de France » (exposé de la Cnav «
      Condition de résidence - Aspa »). L'allocation de solidarité aux personnes âgées
      est une prestation de l'annexe X, « à partir du 1er janvier 2006 »
    parametres:
      residence_requise: true
      mois_de_residence_plus_de: 6
  exemples: aucun trouvé
