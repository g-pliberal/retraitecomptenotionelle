  statut: lue
  textes:
  - {id: LEGIARTI000047453234, article: "L. 815-1 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000054477905, article: "L. 815-1 CSS", en_vigueur: 2026-07-23}
