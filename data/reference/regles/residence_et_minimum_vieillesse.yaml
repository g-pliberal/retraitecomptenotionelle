    droit: >-
      la version residence_six_mois_2006, sa durée portée à neuf mois : « Un décret en
      Conseil d'Etat précise la condition de résidence mentionnée au présent article, sa
      durée ne pouvant être inférieure à neuf mois par année civile » (L. 815-1, rédaction
      de l'article 18 de la loi n° 2023-270, « aux pensions prenant effet à compter du
      1er septembre 2023 ») ; « plus de neuf mois au cours de l'année civile de versement
      de la prestation mentionnée à l'article L. 815-1 » (R. 111-2, décret n° 2023-752)
    parametres:
      residence_requise: true
      mois_de_residence_plus_de: 9
