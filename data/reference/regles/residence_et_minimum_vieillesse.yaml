sources:
  lu_le: 2026-10-01
  prochaine_relecture: 2027-04-30
  a_relire:
  - >-
    Ouverte le 1er octobre 2026 avec le domaine des carrières hors de France, à la
    demande du propriétaire. Le moteur ne la calcule pas encore : il lui faut la
    résidence de la personne (étape 2 du domaine).
  - >-
    À lire : les articles du code d'avant 2006 sur l'allocation supplémentaire (L. 815-2
    et suivants) et leur condition de résidence ; la condition de séjour régulier depuis
    dix ans de l'étranger non européen (L. 816-1), que le modèle ne peut pas lire faute de
    connaître la nationalité ; la tolérance de cent soixante jours que la caisse
    pratique (exposé « Condition de résidence - Aspa »).
  lectures:
  - type: legifrance
    reference: >-
      L. 815-1 CSS (2006, 2014, 2015, 2023, 2026), R. 115-6 (2007) et R. 111-2 (2016 à
      2025), dans l'index LEGI du dépôt mis à jour au 1er octobre 2026
    date: 2026-10-01
  - type: circulaire_cnav
    reference: >-
      base législative de la Cnav, exposés « Conditions d'attribution - Aspa » et «
      Condition de résidence - Aspa » : « Cette condition est remplie si l'intéressé
      séjourne pendant plus de 6 mois, au cours de l'année civile de versement de
      l'allocation » ; « L'Aspa est supprimée en cas de départ hors de France » ; l'article
      18 de la loi n° 2023-270 porte la durée à neuf mois, « Le site sera mis à jour lors
      de la publication des instructions réglementaires »
    url: https://legislation.lassuranceretraite.fr/#/expose?file_leaf_ref=aspa_condition_residence_ex.aspx
    date: 2026-10-01
  - type: autre
    reference: >-
      règlement (CE) n° 883/2004, article 70 et annexe X, France : les allocations
      supplémentaires du fonds de solidarité vieillesse, l'allocation spéciale et, à
      partir du 1er janvier 2006, l'allocation de solidarité aux personnes âgées, servies
      dans l'État de résidence seulement
    url: http://publications.europa.eu/resource/celex/02004R0883-20190731
    date: 2026-10-01
historique:
- >-
  2026-10-01 — née avec le cinquième domaine, les carrières hors de France, ouvert à la
  demande du propriétaire.
effet: >-
  Les retraités qui vivent hors de France : 1,28 million fin 2024 (DREES, enquête annuelle
  auprès des caisses). Le modèle leur sert l'ASPA comme à un résident, quand le droit la
  leur refuse ; la page Coût, elle, retire déjà de la garantie de la proposition les
  retraités qui résident à l'étranger.
