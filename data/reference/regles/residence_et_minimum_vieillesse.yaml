schema_version: 1
id: residence_et_minimum_vieillesse
intitule: >-
  L'allocation de solidarité aux personnes âgées n'est servie qu'à qui réside en France
  de façon stable et régulière — plus de six mois de l'année civile de son versement,
  plus de neuf mois depuis le 1er septembre 2023 — et elle est supprimée au départ hors
  de France : c'est une prestation spéciale à caractère non contributif, que les
  règlements européens ne servent que dans l'État de résidence.
domaine: minima
regimes: [regime_general, msa_salaries, cancava, organic, rsi]
etape: foyer_et_net
face: droit
etat: approchee
lit:
- la résidence de la personne, en France ou à l'étranger, à la date d'effet de l'allocation
  et à chaque échéance
- les mois qu'elle passe en France chaque année, quand elle les dit
ecrit:
- l'allocation de solidarité aux personnes âgées, nulle tant que la personne réside hors de
  France
dates_qui_decident:
- liquidation.date_effet
versions:
- id: allocation_supplementaire_avant_2006
  statut: lue
  textes:
  - {id: "http://data.europa.eu/eli/reg/2004/883/oj", article: "règlement (CE) n° 883/2004, article 70 et annexe X, France, a) et c)",
     publie_le: 2004-04-30, en_vigueur: 2010-05-01}
  bornes:
    liquidation.date_effet: [null, 2006-01-01]
  contenu:
    droit: >-
      avant l'allocation de solidarité aux personnes âgées, le minimum vieillesse
      complétait l'avantage de base par l'allocation supplémentaire du fonds de
      solidarité vieillesse, que les règlements rangent parmi les prestations
      servies « exclusivement dans l'État membre dans lequel [l'intéressé] réside »
      : « Allocations supplémentaires [...] du fonds de solidarité vieillesse par
      rapport aux droits acquis (loi du 30 juin 1956, codifiée au livre VIII du code de
      la sécurité sociale) » (annexe X, France)
    parametres:
      residence_requise: true
  exemples: aucun trouvé
- id: residence_six_mois_2006
  statut: lue
  textes:
  - {id: LEGIARTI000006744832, article: "L. 815-1 CSS", en_vigueur: 2006-01-01}
  - {id: LEGIARTI000028498876, article: "L. 815-1 CSS", en_vigueur: 2014-01-22}
  - {id: LEGIARTI000031323911, article: "L. 815-1 CSS", en_vigueur: 2015-10-16}
  - {id: LEGIARTI000006746841, article: "R. 115-6 CSS", en_vigueur: 2007-03-18}
  - {id: LEGIARTI000031795401, article: "R. 111-2 CSS", en_vigueur: 2016-01-01}
  - {id: LEGIARTI000034096402, article: "R. 111-2 CSS", en_vigueur: 2017-02-27}
  - {id: LEGIARTI000038701577, article: "R. 111-2 CSS", en_vigueur: 2019-11-01}
  - {id: "http://data.europa.eu/eli/reg/2004/883/oj", article: "règlement (CE) n° 883/2004, article 70 et annexe X, France, d)",
     en_vigueur: 2010-05-01}
  nee_de: LEGIARTI000006744832
  bornes:
    liquidation.date_effet: [2006-01-01, 2023-09-01]
  contenu:
    droit: >-
      « Toute personne justifiant d'une résidence stable et régulière sur le
      territoire métropolitain ou dans un département mentionné à l'article L. 751-1 et
      ayant atteint un âge minimum bénéficie d'une allocation de solidarité aux
      personnes âgées » (L. 815-1) ; « sont réputées avoir en France le lieu de leur
      séjour principal les personnes qui y séjournent pendant plus de six mois au cours
      de l'année civile de versement des prestations » (R. 115-6, puis R. 111-2) ; «
      L'Aspa est supprimée en cas de départ hors de France » (exposé de la Cnav «
      Condition de résidence - Aspa »). L'allocation de solidarité aux personnes âgées
      est une prestation de l'annexe X, « à partir du 1er janvier 2006 »
    parametres:
      residence_requise: true
      mois_de_residence_plus_de: 6
  exemples: aucun trouvé
