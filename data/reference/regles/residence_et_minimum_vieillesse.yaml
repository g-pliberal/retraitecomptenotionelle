approximations:
- ecart: >-
    la résidence se déclare une fois, à compter du départ et pour toute la retraite, et
    les mois passés en France de même, les mêmes chaque année : ni un retour en France,
    ni un départ plus tardif ; qui la déclare hors de France n'a l'allocation à aucune
    échéance, qui ne la déclare pas l'a à toutes celles où ses mois suffisent
  effet: non mesuré
- ecart: >-
    la condition se lit sur les seuls mois de séjour : ni le foyer permanent, que R.
    111-2 retient aussi, ni la tolérance de la caisse — moins de six mois mais au moins
    cent soixante jours, quand les deux années précédentes en comptent chacune plus de
    six, une fois (exposé de la Cnav « Condition de résidence - Aspa ») —, ni les
    circonstances qu'elle examine
  effet: >-
    une allocation refusée à qui la garde par la tolérance ou par son foyer ; non mesuré
- ecart: >-
    la condition de séjour régulier depuis dix ans de l'étranger qui n'est pas
    ressortissant de l'Union (L. 816-1) ne se lit pas, faute de connaître la nationalité
  effet: >-
    une allocation servie à qui ne l'aurait pas ; non mesuré
presomptions:
  residence_en_france: >-
    la résidence, que l'allocation lit : en France, quand l'assuré n'en déclare pas
    d'autre
sources:
  lu_le: 2026-10-01
  prochaine_relecture: 2027-04-30
  a_relire:
  - >-
    Ouverte le 1er octobre 2026 avec le domaine des carrières hors de France, à la
    demande du propriétaire. La chronologie porte depuis la deuxième étape du domaine
    l'État où la personne réside après son départ, quand ce n'est pas la France ;
    l'allocation le lit depuis la troisième.
  - >-
    À lire : les articles du code d'avant 2006 sur l'allocation supplémentaire (L. 815-2
    et suivants) et leur condition de résidence, que le modèle n'oppose qu'à qui déclare
    résider hors de France ; la condition de séjour régulier depuis dix ans de
    l'étranger non européen (L. 816-1), que le modèle ne peut pas lire faute de
    connaître la nationalité. La tolérance de cent soixante jours est lue, et déclarée
    en approximation.
  lectures:
  - type: legifrance
    reference: >-
      L. 815-1 CSS (2006, 2014, 2015, 2023, 2026), R. 115-6 (2007) et R. 111-2 (2016 à
      2025), dans l'index LEGI du dépôt mis à jour au 1er octobre 2026
    date: 2026-10-01
  - type: circulaire_cnav
    reference: >-
      base législative de la Cnav, exposés « Conditions d'attribution - Aspa » et «
      Condition de résidence - Aspa » : « Cette condition est remplie si l'intéressé
      séjourne pendant plus de 6 mois, au cours de l'année civile de versement de
      l'allocation » ; « Si l'assuré a séjourné plusieurs fois en France pendant la
      période contrôlée, toutes les périodes de résidence sont totalisées » ; la
      tolérance de 160 jours ; « L'Aspa est supprimée en cas de départ hors de France » ;
      l'article 18 de la loi n° 2023-270 porte la durée à neuf mois, « Le site sera mis
      à jour lors de la publication des instructions réglementaires »
    url: https://legislation.lassuranceretraite.fr/#/expose?file_leaf_ref=aspa_condition_residence_ex.aspx
    date: 2026-10-01
  - type: autre
    reference: >-
      règlement (CE) n° 883/2004, article 70 et annexe X, France : les allocations
      supplémentaires du fonds de solidarité vieillesse, l'allocation spéciale et, à
      partir du 1er janvier 2006, l'allocation de solidarité aux personnes âgées, servies
      dans l'État de résidence seulement
    url: http://publications.europa.eu/resource/celex/02004R0883-20190731
    date: 2026-10-01
code:
  python: >-
    droit/foyer.py : foyer_et_net, condition_de_residence ; ses appels :
    scenarios/actuel.py (resultat_des_departs, ScenarioActuel.simuler), echeancier.py,
    revalorisation.py (foyer_a_l_echeance, pension_aujourd_hui),
    scenarios/notionnel.py (la garantie de la proposition) ; carriere.py :
    Carriere.residence, Carriere.mois_en_france
  javascript: >-
    moteur/js/droit/foyer.js : foyerEtNet, conditionDeResidence ; ses appels :
    moteur/js/scenario-actuel.js, echeancier.js, revalorisation.js,
    scenario-notionnel.js ; carriere.js : residence, moisEnFrance
  parametres: >-
    contenu.parametres de chaque version : residence_requise,
    mois_de_residence_plus_de
  tests: >-
    tests/test_etranger.py, dans les deux moteurs
historique:
- >-
  2026-10-01 — née avec le cinquième domaine, les carrières hors de France, ouvert à la
  demande du propriétaire.
- >-
  2026-10-01 — modélisée, approchée, à la troisième étape du domaine : l'allocation
  n'est servie, à la liquidation et à chaque échéance, qu'à qui ne déclare pas résider
  hors de France.
- >-
  2026-10-01 — après la clôture du domaine, à la demande du propriétaire : la saisie
  demande les mois passés en France chaque année, et l'allocation, comme la garantie de
  la proposition, n'est servie qu'à qui y séjourne plus de six mois, plus de neuf
  depuis le 1er septembre 2023.
effet: >-
  Les retraités qui vivent hors de France : 1,28 million fin 2024 (DREES, enquête annuelle
  auprès des caisses). Le droit leur refuse l'ASPA, que le modèle servait comme à un
  résident : né en 1955, une petite carrière de vingt-six ans au cinquième du salaire
  moyen, parti à soixante-cinq ans en 2020, un assuré qui réside au Maroc touche 2 621 €
  par an, et non 10 838 € ; la page Coût, elle, retire déjà de la garantie de la
  proposition les retraités qui résident à l'étranger.
