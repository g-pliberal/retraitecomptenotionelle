schema_version: 1
id: carriere_longue_regimes_en_points
intitule: >-
  Le départ anticipé pour carrière longue est ouvert aux deux régimes de base en
  points, et le modèle le lit sur la même liste de périodes pour l'âge d'ouverture
  et pour l'âge du taux plein.
etat: conforme
effet: >-
  Le chef d'exploitation agricole des générations récentes part à soixante-trois
  ans au titre de la carrière longue, au lieu de soixante-quatre. La lire sur deux
  listes différentes faisait rendre au taux plein un âge antérieur à celui que l'ouverture
  accordait.
sources:
  lu_le: 2026-09-21
  prochaine_relecture: 2027-03-31
  lectures:
  - type: legifrance
    reference: >-
      L. 732-18-1 du code rural, LEGIARTI000047453049, version du 1er septembre
      2023 : « L'âge prévu à l'article L. 732-18 est abaissé pour les personnes
      ayant exercé une activité non salariée agricole qui ont commencé leur activité
      avant un des quatre âges, dont le plus élevé ne peut excéder vingt et un ans.
      »
    date: 2026-09-21
  - type: legifrance
    reference: >-
      L. 643-3 II CSS, LEGIARTI000053280388 : « L'âge prévu au premier alinéa du
      I est abaissé dans les conditions définies à l'article L. 351-1-1, les références
      au régime général mentionnées au même article L. 351-1-1 étant remplacées
      par celles au régime d'assurance vieillesse de base des professions libérales.
      »
    date: 2026-09-21
textes_a_rattacher:
- reference: L. 732-18-1 du code rural, version du 1er septembre 2023
- reference: L. 643-3 II CSS, renvoi à L. 351-1-1
