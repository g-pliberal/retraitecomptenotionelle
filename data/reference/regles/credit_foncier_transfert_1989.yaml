schema_version: 1
id: credit_foncier_transfert_1989
intitule: >-
  Au 1er janvier 1989, le régime spécial d'assurance invalidité et vieillesse du Crédit
  foncier de France prend fin : ses pensions en cours et les droits non liquidés
  deviennent des rentes du régime général, égales à la moitié du salaire plafond moyen
  de 1988 pour cent cinquante trimestres validés depuis le 1er juillet 1930 et en
  cent-cinquantièmes au-dessous ; ses pensions de retraite pour invalidité des moins de
  soixante ans deviennent des pensions d'invalidité de 30 ou 50 % de ce plafond ; la
  caisse de retraites du Crédit foncier, institution de retraite supplémentaire, sert
  le reste des droits.
domaine: coordination
regimes: [credit_foncier, regime_general]
etape: coordonner_les_affiliations
face: droit
etat: pas_encore_modelisee
lit:
- les périodes d'affiliation au régime spécial du 1er juillet 1930 au 31 décembre 1988, telles qu'il les a validées, et les périodes assimilées et majorations du régime général qui s'y rattachent
- "la situation au 31 décembre 1988 : pension de retraite, de retraite pour invalidité (et sa catégorie) ou de réversion en cours, âge"
ecrit:
- une rente du régime général, immédiate ou différée, ou une pension d'invalidité, et leur réversion
dates_qui_decident:
- liquidation.date_effet
# Le régime est hors champ (inventaire) : aucune version n'est lue par un moteur. Le
# gabarit est celui des transferts de la Compagnie générale des eaux (1991) et de la
# CCI de Roubaix (1998), dont le décret n° 89-157 est le premier.
versions:
- id: regime_special
  statut: supposee
  hypothese: >-
    de 1931 à 1988, le Crédit foncier sert ses propres pensions de retraite, de retraite
    pour invalidité et de réversion, sous le décret du 6 août 1931 « fixant le régime
    d'assurances des agents du Crédit foncier de France » et ses règlements, que l'index
    ne publie pas ; la caisse de retraites du Crédit foncier contribue au fonds spécial
    d'allocation vieillesse (240 847 F en 1984, décret n° 84-104, article 2)
  fiabilite: faible pour le montant, haute pour l'existence du régime
  bornes:
    liquidation.date_effet: [null, 1989-01-01]
  contenu:
    droit: une pension du régime spécial, dont les règles ne sont pas lues
    sante: >-
      les retraités relèvent pour la maladie d'un régime propre, organisé en application
      de l'article 72 de l'ordonnance n° 45-2454 (décret n° 48-1852 du 7 décembre 1948,
      entré en vigueur le 1er octobre 1948, et décret n° 49-582 du 22 avril 1949, connus
      par leur seule analyse)
  exemples: aucun trouvé
