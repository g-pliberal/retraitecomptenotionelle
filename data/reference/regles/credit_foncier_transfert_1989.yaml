  nee_de: LEGIARTI000006756499
  bornes:
    liquidation.date_effet: [1989-01-01, null]
  contenu:
    principe: >-
      « A compter du 1er janvier 1989, les salariés du Crédit foncier de France sont
      affiliés au régime général de sécurité sociale pour l'ensemble des risques » ;
      « Il est mis fin, à compter de la même date, au régime spécial d'assurance
      invalidité et vieillesse » ; ses obligations envers les bénéficiaires au 31
      décembre 1988 passent au régime général « dans la limite des règles propres à
      celui-ci », le Crédit foncier pourvoyant au reste par des couvertures
      complémentaires du titre III du livre VII (loi n° 89-18, article 13)
    rente_immediate: >-
      aux titulaires d'une pension de retraite au 31 décembre 1988 âgés d'au moins
      soixante ans : « Le montant de cette rente est égal à 50 p. 100 du salaire plafond
      moyen soumis à cotisation à l'assurance vieillesse du régime général en 1988 pour
      les personnes justifiant d'une durée d'assurance d'au moins 150 trimestres »,
      réduit à autant de cent-cinquantièmes que de trimestres (article 5, alinéas 1 et 2)
    duree: >-
      les périodes du 1er juillet 1930 au 31 décembre 1988 validées par le régime spécial,
      de date à date, le reste de jours arrondi au trimestre supérieur à partir de
      quarante-cinq ; les périodes assimilées des 2°, 3° et 6° de L. 351-3 et les
      majorations de L. 351-4 et L. 351-5, comme le régime général les aurait accordées,
      si nul autre régime ne les compte ; quatre trimestres par an et cent cinquante en
      tout au plus (article 5, alinéas 3 à 5)
    majorations: >-
      majorations de L. 351-10 (premier alinéa), L. 351-12 (enfants), L. 351-13 et
      L. 355-1 (deuxième alinéa), ces deux dernières si aucune pension ne les sert déjà
      (article 5, alinéa 6)
    invalidite: >-
      les titulaires d'une pension de retraite pour invalidité de moins de soixante ans
      reçoivent une pension d'invalidité du régime général « égal à 30 p. 100 du salaire
      plafond moyen » de 1988 en première catégorie, 50 % en deuxième et troisième
      (article 1er) ; les pensions d'invalidité de l'article 9 du décret du 6 août 1931
      sont reprises intégralement (article 2) ; la pension de vieillesse qui leur est
      substituée vaut la rente de l'article 5, revalorisée depuis 1989 (article 3)
    rente_differee: >-
      le régime général « garantit » une rente à jouissance différée, liquidée au
      1er janvier 1989, aux pensionnés de moins de soixante ans, servie le premier jour
      du mois qui suit leur soixantième anniversaire, et aux affiliés dont les droits
      n'étaient pas liquidés, servie aux conditions d'entrée en jouissance des pensions
      du régime général, et en même temps que la pension du régime général quand ils en
      ont une (article 7)
    coordination: >-
      les pensions servies au 31 décembre 1988 en application de D. 173-1 (les
      pensions de coordination des agents partis sans droit au régime spécial) sont
      reprises intégralement par le régime général (article 9)
    reversion: >-
      rente de réversion au taux du régime général, immédiate ou différée selon ses
      conditions, majorée selon L. 353-1 et L. 353-5 (articles 5, 6 et 8) ; pension
      d'invalidité de veuf ou de veuve avant cinquante-cinq ans (article 4) ; allocation
      de veuvage (article 10)
    service: >-
      la Cnav liquide les rentes, sert celles de ses propres pensionnés par l'organisme
      qui sert leur pension, le Crédit foncier avance les prestations jusqu'au 31
      décembre 1989 (articles 12 et 13 ; acomptes de l'arrêté du 18 août 1989 :
      32 millions de francs au 1er septembre 1989, 12 millions au 1er décembre 1989 et
      au 1er mars 1990)
    abrogation: >-
      le décret du 6 août 1931 et les décrets n° 48-1852 et n° 49-582 sont abrogés au
      1er janvier 1989 (article 14)
    complement: >-
      le reste des droits, que la rente ne couvre pas, est servi par la caisse des
      retraites du Crédit foncier de France (CRCFF), institution de retraite autorisée à
      fonctionner au 1er janvier 1989 « dans les conditions prévues au titre III du
      livre VIII », avec deux règlements, pour les agents entrés avant et après le
      1er janvier 1970 (arrêté du 16 juin 1989, connu par son analyse ; règlement
      intérieur modifié par l'arrêté du 4 février 1993, qui la dit du titre III du livre
      VII) ; en 2009, au titre de l'article 116 de la loi n° 2003-775, ses provisions
      passent à AXA France Vie, CARDIF et SOGECAP (décision de l'ACAM du 11 mars 2009) :
      une retraite d'entreprise, hors des régimes obligatoires, dont aucun règlement
      n'est lu et que le scénario 1 ne simule pas
  unites:
    rente: >-
      fraction du plafond annuel de 1988, revalorisée comme les pensions du régime
      général ; le plafond annuel de 1988 que le dépôt porte
      (`macro/plafond_securite_sociale.csv`) vaut 18 349 €, soit 120 362 F, et la rente
      pleine environ 60 180 F, à confirmer contre le « salaire plafond moyen » que la
      Cnav a retenu
  exemples: aucun trouvé
sources:
  lu_le: 2026-10-14
  prochaine_relecture: 2027-10-14
  a_relire:
  - >-
    Le « salaire plafond moyen soumis à cotisation à l'assurance vieillesse du régime
    général en 1988 » : la valeur que la Cnav a retenue (moyenne des plafonds mensuels de
    l'année), à lire dans sa circulaire d'application de 1989, avec le montant de la
    rente pleine.
  - >-
    Le gabarit des trois transferts : la rente pleine de la Compagnie générale des eaux,
    64 650 F en 1991, voisine de la moitié du plafond annuel de 1990 ; celle de la CCI
    de Roubaix, 62 150 F en 1998, nettement en deçà de la moitié du plafond de 1997 :
    vérifier si les décrets de 1991 et de 1998 reprennent, en francs, la règle de la
    moitié du plafond d'une année antérieure.
  - >-
    Le décret du 6 août 1931 et les règlements de la CRCFF (1989, 1993) : au fac-similé
    du Journal officiel, ou auprès des assureurs qui servent ses rentes depuis 2009.
  lectures:
  - type: legifrance
    reference: >-
      loi n° 89-18 du 13 janvier 1989, article 13 (LEGIARTI000006756499) ; décret
      n° 89-157 du 8 mars 1989 (JORFTEXT000000872102), articles 1er à 15
      (LEGIARTI000006774338 à LEGIARTI000006774352), par l'index LEGI du dépôt
    date: 2026-10-14
  - type: jorf
    reference: >-
      analyses de l'arrêté du 16 juin 1989 (JORFTEXT000000479489), de l'arrêté du 18 août
      1989 (JORFTEXT000000476369), de l'arrêté du 4 février 1993 (JORFARTI000001193713),
      de l'avis du 3 avril 2009 (JORFARTI000020478201), des décrets n° 48-1852
      (JORFTEXT000000496000) et n° 49-582 (JORFTEXT000000300199), par l'index JORF du
      dépôt
    date: 2026-10-14
historique:
- >-
  2026-10-14 — née avec l'action 145, étape 2 : la ligne d'inventaire du Crédit foncier
  disait que le dépôt n'avait « pas de source pour le barème d'avant » ; le décret de
  transfert, lu, donne la règle qui vaut depuis 1989 pour tous ses anciens agents.
effet: >-
  Les anciens agents du Crédit foncier entrés avant 1989, nés avant 1929 pour les
  pensionnés et jusqu'aux générations des années 1960 pour les droits non liquidés :
  leurs années d'avant 1989 valent une rente forfaitaire du régime général, la moitié du
  plafond de 1988 revalorisée pour une carrière de cent cinquante trimestres, et non une
  pension calculée sur leur salaire. Le modèle, qui n'a pas de statut pour eux, les
  simule au régime général sur toute leur carrière.
