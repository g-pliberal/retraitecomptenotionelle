      de cotisations forfaitaires », portées au minimum contributif, ou au maximum
      de la pension « Cavimac » (452,15 € par mois en 2026) à taux minoré ; depuis
      1998, « le calcul sera opéré en fonction de votre salaire annuel moyen calculé
      sur la base du SMIC [...] Ces salaires correspondent à une base SMIC pour
      tous les assurés cultuels »
    url: >-
