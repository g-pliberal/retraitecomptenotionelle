effet: >-
  Le salaire annuel moyen est fait du forfait de chaque année, dans les deux moteurs
  (`assiette_de_reference`) : le ministre déclaré à une fois et demie le salaire moyen
  recevait une pension de base 2,17 fois trop haute. Tenu par
  `test_le_salaire_de_reference_des_cultes_est_fait_du_forfait` et son pendant JavaScript.
  Le modèle appliquait les règles d'après 1998 à toute la carrière, et ne comptait pas les
  années d'avant 1979 : depuis le 3 octobre 2026, le salaire annuel moyen et la durée de
  cette fraction ne sont faits que des années d'après 1997, la fraction d'avant 1998 ayant
  ses règles et sa fiche, `cultes_fractions_de_pension`. Lue au droit le 3 novembre 2026, la
  base forfaitaire reste un peu basse dans le modèle : il la compte au SMIC du 1er janvier,
  jusqu'à 2,9 % de moins sur une année, et sans la garantie mensuelle de rémunération de
  2002 au 30 juin 2005, jusqu'à 11 % de moins sur ces années — deux approximations.
sources:
  lu_le: 2026-11-03
  prochaine_relecture: 2027-09-30
  a_relire:
  - >-
    La base de 2002 au 30 juin 2005 : la caisse la relevait-elle jusqu'à la garantie mensuelle
    de rémunération la plus élevée, ou l'y ajoutait-elle ? Et celle du premier semestre 1998,
    avant le décret du 17 juin 1998. Une circulaire de la caisse, de 1998 ou de 2004, le
    dirait.
  - >-
    Le salaire porté au compte du ministre du culte est-il la somme des bases de ses mois, au
    SMIC de chaque mois, comme le texte l'écrit ? Un relevé de carrière de la caisse le
    montrerait.
