    R. 721-29 et R. 721-30, puis R. 382-89 et R. 382-90 : la base « par mois », au « salaire
    minimum de croissance en vigueur »
  ecart: >-
    le modèle compte la base de toute l'année au SMIC horaire du 1er janvier
    (`macro/smic_horaire.csv`), quand elle suit chaque mois le SMIC en vigueur : de 1998 à
    2009, les six mois qui suivent son relèvement du 1er juillet (décrets annuels, « A compter
    du 1er juillet 1998 », lus dans l'index LEGI du dépôt) ; depuis, les relèvements en cours
    d'année, comme ceux du 1er juillet 2012 et du 1er juin 2026
  effet: >-
    la base d'une année de 1998 à 2007 trop basse de la moitié du relèvement de juillet,
    jusqu'à 2,9 %, en 2004 ; le salaire annuel moyen, qui en fait la moyenne avec d'autres
    années, de moins ; non mesuré sur la pension
