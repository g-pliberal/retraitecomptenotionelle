code:
  interrupteurs:
    assiette_forfaitaire: true
  moteur: >-
    `assiette_forfaitaire` : c'est la base forfaitaire du régime des cultes : les articles
    R. 382-89 et R. 382-90 l'égalent au SMIC mensuel, que l'assuré perçoive davantage,
    moins, ou rien du tout. Un ministre du culte n'a pas de salaire dont on prélèverait
    une fraction ; la congrégation et lui cotisent sur un forfait. Le moteur la compte au
    repère de la période de l'année, `assiette_repere_smic` heures de SMIC — 2 028 jusqu'en
    2001, 1 820 depuis —, au SMIC de chaque mois depuis 1998 (`smic_du_mois` : la moyenne des
    douze mois, du barème de janvier et des relèvements en cours d'année), au prorata des
    mois.
  python: >-
    droit/liquider.py : assiette_de_reference, salaire_de_reference ;
    donnees/regimes.py : PeriodeRegime.repere_assiette ; donnees/macro.py :
    DonneesMacro.smic_horaire_des_mois, smic_horaire_du_forfait ; moteur/compte.py :
    ConstructeurCompte._cotisation_ligne
  javascript: >-
    moteur/js/droit/liquider.js : assietteDeReference, salaireDeReference ;
    moteur/js/regimes.js : PeriodeRegime.repereAssiette ; moteur/js/macro.js :
    DonneesMacro.smicHoraireDesMois, smicHoraireDuForfait ; moteur/js/compte.js :
    ConstructeurCompte._cotisationLigne
  parametres: >-
    contenu.parametres de chaque version : assiette_forfaitaire, assiette_repere_smic,
    fractions_des_cultes, garantie_mensuelle_la_plus_elevee, regles_du_salaire_annuel_moyen,
    salaire_reference, salaire_reference_par_generation, smic_du_mois ;
    regimes/cavimac.yaml : assiette_forfaitaire, assiette_repere_smic, fractions_des_cultes,
    regles_du_salaire_annuel_moyen, salaire_reference, salaire_reference_par_generation,
    smic_du_mois, taux_cotisation_retraite, part_salariale ; macro/smic_horaire.csv :
    smic_horaire ; macro/smic_horaire_releves.csv : smic_horaire
  tests:
  - >-
    tests/test_cultes_au_droit.py, qui confronte chaque version aux périodes de la CAVIMAC
    et tient l'écart déclaré
  - >-
    tests/test_cultes_smic_du_mois.py et tests/js/cultes-smic-du-mois.test.js, la base au SMIC
    de chaque mois, six années posées à la main
  - tests/test_simulateur.py
  - tests/test_cultes.py
  - tests/js/moteur.test.js
  - tests/temoins/simulations.json
