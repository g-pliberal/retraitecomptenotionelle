    droit: >-
      la base de chaque mois est le SMIC horaire en vigueur fois la durée légale du travail
      mensuel, 151,67 heures — 1 820 heures par an —, « augmentée de la valeur de la garantie
      mensuelle de rémunération la plus élevée », celle que l'article 32 de la loi du 19
      janvier 2000 assure au salarié au SMIC passé aux trente-cinq heures, au plus le SMIC de
      cent soixante-neuf heures. Le décret du 23 février 2004 l'écrit « du 1er janvier 2002 »,
      rétroactivement : la rédaction en vigueur en 2002 et en 2003 portait encore 169 SMIC
      horaires par mois
    conditions: >-
      lu à la lettre, « augmentée de la valeur de la garantie » ajouterait la garantie
      entière à la base, près du double du SMIC mensuel ; la lecture qui tient relève la
      base jusqu'à la garantie, que l'article 32 borne au SMIC de cent soixante-neuf heures.
      Le résumé au Journal officiel du décret n° 2002-784 du 3 mai 2002 dit la même intention
      pour l'assurance volontaire : « maintenir le calcul des cotisations [...] par référence
      à une assiette équivalant à 169 fois le SMIC horaire pour un mois ». Ce que la caisse
      appliquait est à lire : cherché le 3 novembre 2026, sans document qui le dise (voir
      `sources.a_relire`) ; le modèle n'ajoute rien à la durée légale
