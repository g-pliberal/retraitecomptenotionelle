schema_version: 1
id: cultes_salaire_annuel_moyen
intitule: >-
  Pension de base du régime des cultes : depuis le 1er janvier 1998, la fraction des
  périodes d'après 1997 se calcule aux règles du régime général (L. 721-6, puis L. 382-27),
  sur un salaire annuel moyen fait de la base forfaitaire de chaque année, et non de ce que
  l'assuré perçoit (R. 721-39-2, puis R. 382-121) : 169 fois le SMIC horaire par mois
  jusqu'en 2001, puis le SMIC horaire fois la durée légale du travail mensuel, augmentée de
  2002 au 30 juin 2005 de la garantie mensuelle de rémunération la plus élevée. Les périodes
  antérieures au 1er janvier 1998 gardent leurs règles ; celles d'avant 1979 sont validées
  gratuitement.
domaine: salaire_de_reference
regimes: [cavimac]
etape: acquerir_les_droits
face: droit
etat: approchee
lit:
- >-
  la date d'effet de la pension : avant le 1er janvier 1998, la pension est forfaitaire, sans
  salaire annuel moyen
- >-
  les années de l'assuré au régime des cultes depuis le 1er janvier 1998, et leurs mois ;
  pour chaque mois, la base forfaitaire : 169 SMIC horaires jusqu'au 31 décembre 2001, puis
  le SMIC horaire en vigueur fois la durée légale du travail mensuel, augmentée de 2002 au
  30 juin 2005 de la garantie mensuelle de rémunération la plus élevée
- >-
  le nombre d'années que retient le salaire annuel moyen du régime général, à la génération,
  et les coefficients qui revalorisent les salaires portés au compte (fiche
  `salaire_annuel_moyen`)
ecrit:
- >-
  le salaire que chaque année d'après 1997 porte au compte de l'assuré, sa base forfaitaire,
  sur laquelle se prélèvent les cotisations, et dont le salaire annuel moyen de la fraction
  de la pension des périodes d'après 1997 fait la moyenne, revalorisée, que
  `salaire_de_reference` rend à la liquidation (fiche `salaire_annuel_moyen`)
dates_qui_decident:
- liquidation.date_effet
- periode.debut
