schema_version: 1
id: cultes_salaire_annuel_moyen
intitule: >-
  Pension de base du régime des cultes : aux règles du régime général (L. 382-27)
  pour les périodes d'après 1998, sur un salaire annuel moyen des vingt-cinq meilleures
  années fait des salaires qui ont porté cotisation — le forfait du SMIC mensuel
  de R. 382-89 et R. 382-90, « une base SMIC pour tous les assurés cultuels ». Les
  périodes antérieures au 1er janvier 1998 gardent leurs règles (L. 382-27, deuxième
  phrase) ; celles d'avant 1979 sont validées gratuitement.
etat: approchee
effet: >-
  Le salaire annuel moyen est désormais fait du forfait de chaque année, dans les
  deux moteurs (`_assiette_de_reference`) : le ministre déclaré à une fois et demie
  le salaire moyen recevait une pension de base 2,17 fois trop haute. Tenu par `test_le_salaire_de_reference_des_cultes_est_fait_du_forfait`
  et son pendant JavaScript. Reste une APPROXIMATION : le modèle applique les règles
  d'après 1998 à toute la carrière, et ne compte pas les années d'avant 1979.
sources:
  lu_le: 2026-09-23
  prochaine_relecture: 2027-09-30
  a_relire:
  - >-
    La fraction d'avant 1979, validée gratuitement ; celle de 1979 à 1997, portée
    au minimum contributif ou au maximum de la pension « Cavimac », dont il faut
    la série. Les deux demandent une pension par fractions que le moteur ne sait
    pas écrire.
  lectures:
  - type: legifrance
    reference: >-
      L. 382-27, R. 382-89 et R. 382-90 en vigueur, lus dans l'index LEGI du dépôt
    date: 2026-09-23
  - type: autre
    reference: >-
      CAVIMAC, « Demander ma retraite de base » : trois fractions — avant 1979,
      « trimestres validés à titre gratuit » ; de 1979 à 1997, « cotisés à partir
      de cotisations forfaitaires », portées au minimum contributif, ou au maximum
      de la pension « Cavimac » (452,15 € par mois en 2026) à taux minoré ; depuis
      1998, « le calcul sera opéré en fonction de votre salaire annuel moyen calculé
      sur la base du SMIC [...] Ces salaires correspondent à une base SMIC pour
      tous les assurés cultuels »
    url: >-
      https://www.cavimac.fr/assurance-retraite/assurance-retraite/demander-ma-retraite-de-base-0
    date: 2026-09-23
  - type: autre
    reference: >-
      réponse ministérielle à la question orale n° 0122S (Sénat, 16 janvier 2008)
      : les années antérieures à 1979 « n'ont donné lieu à aucune cotisation et
      ont été validées gratuitement »
    url: https://www.senat.fr/questions/base/2007/qSEQ07120122S.html
    date: 2026-09-23
textes_a_rattacher:
- reference: >-
    code de la sécurité sociale, L. 382-27 en vigueur (LEGIARTI000048697351) : pension
    « dans les conditions définies aux articles L. 351-1 à L. 351-1-3 [...] L. 351-8
    à L. 351-13 », et les périodes antérieures au 1er janvier 1998 « dans les conditions
    législatives et réglementaires en vigueur au 31 décembre 1997 »
- reference: >-
    code de la sécurité sociale, R. 382-89 et R. 382-90 (LEGIARTI000006749795, LEGIARTI000006749796)
    : la base forfaitaire, « valeur horaire du salaire minimum de croissance en
    vigueur, multipliée par le nombre légal d'heures de travail mensuel »
