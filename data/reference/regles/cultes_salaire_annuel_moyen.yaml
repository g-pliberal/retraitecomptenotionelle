effet: >-
  Le salaire annuel moyen est fait du forfait de chaque année, dans les deux moteurs
  (`assiette_de_reference`) : le ministre déclaré à une fois et demie le salaire moyen
  recevait une pension de base 2,17 fois trop haute. Tenu par
  `test_le_salaire_de_reference_des_cultes_est_fait_du_forfait` et son pendant JavaScript.
  Le modèle appliquait les règles d'après 1998 à toute la carrière, et ne comptait pas les
  années d'avant 1979 : depuis le 3 octobre 2026, le salaire annuel moyen et la durée de
  cette fraction ne sont faits que des années d'après 1997, la fraction d'avant 1998 ayant
  ses règles et sa fiche, `cultes_fractions_de_pension`. Depuis le 3 novembre 2026 (décision
  13 du propriétaire), la base se compte au SMIC de chaque mois, comme la caisse le fait
  (circulaire n° 2025/01) : elle gagne la moitié du relèvement de juillet de 1998 à 2009, au
  plus 2,9 %, en 2004, et les relèvements en cours d'année de 2008, 2011, 2012 et de 2021 à
  2026 ; tenu par `tests/test_cultes_smic_du_mois.py` et son pendant JavaScript. Elle reste
  sans la garantie mensuelle de rémunération de 2002 au 30 juin 2005, jusqu'à 11 % de moins
  sur ces années, faute d'un document qui dise comment la caisse la comptait — une
  approximation.
sources:
  lu_le: 2026-11-03
  prochaine_relecture: 2027-09-30
  a_relire:
  - >-
    La base de 2002 au 30 juin 2005 : la caisse la relevait-elle jusqu'à la garantie mensuelle
    de rémunération la plus élevée, ou l'y ajoutait-elle ? Et celle du premier semestre 1998,
    avant le décret du 17 juin 1998. Une circulaire de la caisse, de 1998 ou de 2004, le
    dirait.
  - >-
    Cherché le 3 novembre 2026, sans réponse : ni le décret n° 2004-181 (visas et articles),
    ni l'article 66 de la loi n° 2001-1246 qu'il vise, ni l'exposé « Cultes » de la base de
    la Cnav (24 octobre 2025), ni les circulaires de la CAVIMAC en ligne, qui commencent en
    2020, ne disent comment la caisse comptait la garantie de 2002 à 2005. Une circulaire de
    la caisse de 2002 à 2005, ou un relevé de carrière de ces années, le dirait.
  - >-
    Le salaire porté au compte du ministre du culte est-il la somme des bases de ses mois, au
    SMIC de chaque mois, comme le texte l'écrit et comme la caisse appelle ses cotisations
    (circulaire n° 2025/01) ? Un relevé de carrière de la caisse le montrerait.
