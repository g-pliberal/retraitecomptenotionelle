approximations:
- ecart: >-
    le seuil de la rente viagère, l'indice majoré 681 au 1er janvier 2004 revalorisé
    comme les pensions d'invalidité (L. 341-6 CSS), est pris à trois fois la référence
    du minimum garanti, revalorisée comme les pensions de retraite ; avant 2004, au
    traitement de l'indice 681 au point de l'année, quand le texte d'alors n'est pas lu
  effet: >-
    la part du traitement au-delà du seuil, que la rente ne compte que pour le tiers :
    les seuls traitements au-dessus de quarante-huit mille euros par an environ ; non
    mesuré
- ecart: >-
    le minimum garanti se compare à la pension et à la rente ensemble, quand il ne vise
    que la pension ; la majoration pour tierce personne (L. 30 bis), la rente portée à
    75 % du traitement après un attentat ou un acte de dévouement (L. 28), et la
    revalorisation des pensions d'invalidité depuis 2014 (L. 341-6 CSS) ne sont pas
    servies
  effet: non mesuré
- ecart: >-
    la radiation se déclare sans la limite d'âge qu'elle ne peut dépasser ; la
    liquidation « selon la réglementation la plus favorable » de qui remplit par
    ailleurs les conditions de droit commun (article 30 du décret de la CNRACL) n'est
    pas comparée, la retraite pour invalidité, sans décote et à ses planchers, l'étant
    presque toujours ; l'ouvrier de l'État n'a pas le plancher de la pension
    d'invalidité du régime général (article 19 du décret n° 2004-1056)
  effet: non mesuré
- ecart: >-
    le militaire radié par suite d'infirmités, et les régimes spéciaux, qui ont chacun
    leur pension de réforme, ne sont pas couverts ; la saisie refuse leur radiation
  effet: non mesuré
sources:
  lu_le: 2026-09-30
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouverte le 30 septembre 2026 avec le domaine de l'invalidité et de l'inaptitude
    (docs/architecture.md, § 11), à la demande du propriétaire, et lue par le moteur à
    sa troisième étape. Quatre exemples du Service des retraites de l'État la rejouent
    depuis la quatrième étape : le minimum garanti de l'invalidité en quinzièmes, le
    plancher de L. 30 de Monsieur G., et le total de Monsieur H., ramené au traitement
    par L. 30 ter. La page partage ce total en comptant le seuil de L. 28 sur la rente,
    et le taux d'invalidité deux fois, quand le texte le compte sur le traitement : ce
    partage ne se compare pas. La documentation de la CNRACL n'a pas répondu.
  - >-
    Non couverts : le militaire radié des cadres par suite d'infirmités (L. 24, II ;
    L. 14, II ; L. 35), qui a aussi sa pension militaire d'invalidité, d'un autre code ;
    le fonctionnaire qui ou dont le conjoint est atteint d'une infirmité incurable
    (L. 24, I, 4°), départ anticipé particulier ; l'allocation temporaire d'invalidité
    de l'agent maintenu en fonctions ; les régimes spéciaux, qui ont chacun leur pension
    de réforme. À lire : le barème indicatif des taux d'invalidité, le seuil de l'indice
    majoré 681 de la rente, et la rédaction de L. 30 ter de 2012 à 2014. Le seuil, le
    Service des retraites de l'État l'écrit à 4 109,91 € par mois « pour 2026 », la
    fiche F550 de service-public, vérifiée le 1er avril 2026, à 4 242,61 €, et le
    modèle le prend à 4 099,05 € : aucun des trois ne se retrouve depuis l'autre.
  lectures:
  - type: legifrance
    reference: >-
      L. 4 (1964, 2010), L. 14 (2004 à 2023), L. 17 (1975, 2004, 2010, 2023), L. 24
      (1982 à 2023), L. 27 (1964, 1991, 2014, 2019), L. 28 (1964 à 2022), L. 29 (1964,
      1991, 2014, 2019), L. 30 (1964, 2000, 2012, 2014), L. 30 bis et L. 30 ter (2012,
      2014), L. 31 (1964, 1980, 2022) CPCMR ; décret n° 2003-1306, articles 7, 20, 22,
      30, 31, 34, 36, 37 et 39 ; décret n° 2004-1056, articles 3 et 19 ; dans l'index
      LEGI du dépôt mis à jour au 30 septembre 2026
    date: 2026-09-30
  - type: legifrance
    reference: >-
      L. 28 (2022), L. 30 (2014), L. 30 bis et L. 30 ter (2014) CPCMR ; décret
      n° 2003-1306, articles 22 (2025), 30 (2024), 34 (2015), 36 et 39 (2014), 37
      (2022) ; décret n° 2004-569, article 6, dans ses trois rédactions (2004, 2011,
      2017) : le RAFP ne s'ouvre qu'à l'âge légal, sans exception pour l'invalidité
    date: 2026-09-30
  - type: autre
    reference: >-
      Service des retraites de l'État, « Le minimum garanti » : « Moins de 15 ans en cas
      de retraite pour invalidité : Par année de services : 1/15ème de 57,5 % du
      traitement indiciaire brut au 1er janvier 2004 de l'indice majoré 227 », et
      l'exemple de douze ans, 7 542,25 € par an au 1er janvier 2026 ; « Le calcul de la
      pension » des invalides : la rente viagère, son seuil de 4 109,91 € « pour 2026 »,
      la réduction à due proportion sous le traitement (Monsieur H.), et la pension au
      moins égale à 50 % du traitement à 60 % d'invalidité (Monsieur G.) ; L. 28 relu :
      « Si le montant de ce traitement [...] dépasse [...] la fraction dépassant cette
      limite n'est comptée que pour le tiers »
    url: https://retraitesdeletat.gouv.fr/invalidite/la-pension-de-retraite/le-calcul-de-la-pension
    date: 2026-10-01
  - type: service_public
    reference: >-
      fiche F550, « Retraite pour invalidité du fonctionnaire », vérifiée le 1er avril
      2026 : la rente compte pour un tiers la fraction du dernier traitement indiciaire
      brut qui dépasse 4 242,61 €, et le total de la pension et de la rente ne dépasse
      pas le dernier traitement, « le montant de chaque prestation est
      proportionnellement réduit »
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F550
    date: 2026-10-01
