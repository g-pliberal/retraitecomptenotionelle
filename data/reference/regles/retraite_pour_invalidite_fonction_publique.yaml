historique:
- >-
  2026-09-30 — née avec le quatrième domaine, l'invalidité et l'inaptitude, ouvert à la
  demande du propriétaire.
effet: >-
  Les fonctionnaires radiés des cadres pour invalidité, à tout âge. Le modèle ne les
  connaît pas : il les fait partir à l'âge légal, décotés, et leur refuse le minimum
  garanti de l'invalidité sous quinze ans de services.
