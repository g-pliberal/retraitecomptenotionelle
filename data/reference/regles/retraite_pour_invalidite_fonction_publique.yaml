code:
  python: >-
    droit/invalidite.py : radiation_du_regime, retraite_pour_invalidite,
    pension_du_fonctionnaire_invalide, rente_viagere_d_invalidite ; droit/departs.py :
    le départ à la radiation ; droit/ouvrir.py : age_ouverture ; droit/liquider.py : la
    décote, le minimum garanti ; droit/coordonner.py : droit_a_pension ;
    scenarios/actuel.py : MinimumGaranti.valeur_d_un_indice
  javascript: >-
    moteur/js/droit/invalidite.js, et les jumeaux de chacun de ces modules
  parametres: >-
    contenu.parametres de chaque version : decote, minimum_garanti,
    plancher_taux_invalidite, plancher_part_du_traitement, plafond_total ;
    revalorisation, pas encore lu
  tests: >-
    tests/test_invalidite.py ; les témoins invalidite_radiation_* des simulations, et la
    page simuler_radiation_invalidite, dans les deux moteurs
historique:
- >-
  2026-09-30 — née avec le quatrième domaine, l'invalidité et l'inaptitude, ouvert à la
  demande du propriétaire.
- >-
  2026-09-30 — lue par le moteur, à la troisième étape du domaine : la pension à la
  radiation, à tout âge, sans condition de durée ni décote, au minimum garanti de
  l'invalidité, au plancher de L. 30, avec la rente viagère de L. 28 sous le plafond
  de L. 30 ter.
- >-
  2026-10-01 — rejouée par quatre exemples du Service des retraites de l'État, à la
  quatrième étape du domaine.
effet: >-
  Les fonctionnaires radiés des cadres pour invalidité, à tout âge. Le modèle les fait
  partir à leur radiation, sans décote, à leurs planchers et avec leur rente ; il les
  faisait partir à l'âge légal, décotés, sans le minimum garanti de l'invalidité.
