  nee_de: LEGIARTI000006362746
  bornes:
    liquidation.date_effet: [1964-12-01, 2004-01-01]
  contenu:
    droit: >-
      « Le droit à la pension est acquis : [...] 2° Sans condition de durée de services
      aux fonctionnaires radiés des cadres pour invalidité résultant ou non de
      l'exercice des fonctions » (L. 4) ; « La jouissance de la pension civile est
      immédiate : [...] 2° Pour les fonctionnaires civils mis à la retraite pour
      invalidité » (L. 24) ; « Le fonctionnaire civil qui se trouve dans l'incapacité
      permanente de continuer ses fonctions en raison d'une invalidité ne résultant pas
      du service peut être radié des cadres par anticipation [...]. L'intéressé a droit
      à la pension rémunérant les services » (L. 29)
    plancher: >-
      « Lorsque le fonctionnaire est atteint d'une invalidité d'un taux au moins égal à
      60 %, le montant de la pension prévue aux articles L. 28 et L. 29 ne peut être
      inférieur à 50 % des émoluments de base » (L. 30) ; le minimum garanti de L. 17,
      servi à toute pension
    rente: >-
      au fonctionnaire dont l'invalidité résulte du service, « une rente viagère
      d'invalidité cumulable avec la pension rémunérant les services » (L. 28), égale à
      la fraction des émoluments de base « égale au pourcentage d'invalidité », la part
      au-delà d'un seuil ne comptant que pour le tiers ; pension et rente ne peuvent
      dépasser les émoluments de base
    parametres:
      jouissance: immediate
