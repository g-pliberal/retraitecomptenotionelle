schema_version: 1
id: retraite_pour_invalidite_fonction_publique
intitule: >-
  Le fonctionnaire dans l'incapacité permanente de continuer ses fonctions, qui n'a pu
  être reclassé, est radié des cadres pour invalidité et liquide sa pension à cette
  date, à tout âge et sans condition de durée de services (L. 4, L. 24, L. 29 du code
  des pensions ; articles 7, 30 et 39 du décret n° 2003-1306 pour la CNRACL) : sans
  décote depuis qu'elle existe, au minimum garanti sans condition de taux plein,
  portée à 50 % du traitement quand l'invalidité atteint 60 %, et augmentée d'une
  rente viagère d'invalidité quand elle est imputable au service (L. 27, L. 28).
domaine: age
regimes: [fonction_publique_etat, cnracl, fspoeie]
etape: liquider_chaque_regime
face: droit
etat: pas_encore_modelisee
lit:
- la radiation des cadres pour invalidité, sa date, son imputabilité au service et le
  taux d'invalidité
- les services et bonifications, et le traitement des six derniers mois
ecrit:
- un départ de la fonction publique à la date de la radiation, de motif « invalidite »
- la pension sans décote, le minimum garanti de l'invalidité, le plancher de L. 30 et la
  rente viagère d'invalidité
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le droit
# de l'invalide — jouissance immédiate, sans durée de services — ne change pas depuis
# le code de 1964 ; changent la décote dont il est exempté, le minimum garanti qu'on
# lui sert et la revalorisation.
