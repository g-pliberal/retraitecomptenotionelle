      le droit « sans condition de durée de services aux agents se trouvant dans
      l'impossibilité définitive et absolue d'assurer leur emploi » (article 3 du décret
      n° 2004-1056) ; la pension au moins égale à la pension d'invalidité du régime
      général quand l'invalidité n'est pas un accident du travail (article 19)
