  bornes:
    liquidation.date_effet: [2004-01-01, 2011-01-01]
  contenu:
    droit: >-
      la version code_1964 ; la liquidation intervient « lorsque le fonctionnaire est
      mis à la retraite pour invalidité et qu'il n'a pas pu être reclassé dans un emploi
      compatible avec son état de santé » (L. 24, I, 2°)
    decote: >-
      « Le coefficient de minoration n'est pas applicable aux fonctionnaires handicapés
      dont l'incapacité permanente est au moins égale à 80 % ou mis à la retraite pour
      invalidité » (L. 14, I ; article 20 du décret de la CNRACL, « après avis de la
      commission de réforme »)
    minimum_garanti: >-
      servi à toute pension, et « Lorsque la pension rémunère moins de quinze années de
      services effectifs, à un quinzième du montant défini à l'alinéa précédent pour
      cette durée de quinze ans, par année de services effectifs » (L. 17, c)
    ouvriers_de_l_etat: >-
      le droit « sans condition de durée de services aux agents se trouvant dans
      l'impossibilité définitive et absolue d'assurer leur emploi » (article 3 du décret
      n° 2004-1056) ; la pension au moins égale à la pension d'invalidité du régime
      général quand l'invalidité n'est pas un accident du travail (article 19)
    parametres:
      jouissance: immediate
