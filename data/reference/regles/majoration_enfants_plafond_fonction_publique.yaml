    lui prête la rédaction de 1982, que le décret n° 65-773 portait pour la CNRACL dès
    1965 et le décret n° 65-836 pour le FSPOEIE, lu depuis 1978 ; la version part du 1er
    janvier 1964, comme la période du code de 1964 dans les fiches des régimes
  fiabilite: faible
  textes:
  - {id: LEGIARTI000006368224, article: 19, en_vigueur: 1965-09-12}
  - {id: LEGIARTI000006368225, article: 19, en_vigueur: 1977-12-31}
  - {id: LEGIARTI000006766757, article: 11, en_vigueur: 1978-03-19}
  bornes:
