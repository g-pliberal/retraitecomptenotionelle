schema_version: 1
id: majoration_enfants_plafond_fonction_publique
intitule: >-
  La pension majorée pour enfants du code des pensions ne peut excéder le traitement ou
  la solde qui l'a liquidée (L. 18, V, et les décrets de la CNRACL et du FSPOEIE) : au-delà,
  la majoration cède, la pension reste entière. Depuis la décision du Conseil d'État du
  29 décembre 2020, la surcote n'entre plus dans la pension qu'on compare au traitement :
  elle est servie au-delà du plafond.
domaine: enfants
regimes:
- fonction_publique_etat
- cnracl
- fspoeie
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- la pension du régime à l'étape qui complète, minimum garanti, majoration des assurés
  handicapés et surcote parentale comprises
- le traitement ou la solde de L. 15 qui l'a liquidée, et la part que la surcote de L. 14,
  III, y ajoute (droit/liquider.py, EligiblePlafondEnfants)
- le taux de la majoration pour enfants, 10 % pour trois enfants et 5 % par enfant au-delà
- liquidation.date_effet
ecrit:
- la majoration pour enfants de la pension, bornée à ce qui la porte au traitement
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/completer.py, `majoration_sous_le_traitement`, et son jumeau)
# lit : `existe` ; `regimes`, ceux dont la pension est bornée ; `plafond`,
# `traitement` seul connu — le traitement ou la solde de L. 15 à la date
# d'effet ; `surcote`, `dans_le_plafond` (la pension surcotée se compare au
# traitement) ou `hors_du_plafond` (la pension se compare sans sa surcote, et
# la surcote est servie au-delà) ; `fiabilite`, que le résultat prend quand le
# plafond mord. Un plafond ou une surcote que le moteur ne connaît pas
# l'arrête.
versions:
