- id: loi_de_finances_pour_2012
  statut: lue
  textes:
  - {id: LEGIARTI000025048273, article: 163, en_vigueur: 2012-01-01}
  - {id: LEGIARTI000025076852, article: L. 18, en_vigueur: 2012-01-01}
  nee_de: LEGIARTI000025048273
  bornes:
    liquidation.date_effet: [2012-01-01, 2020-12-29]
  contenu:
    droit: >-
      « sans que le montant de la pension majorée puisse excéder le montant du traitement
      ou de la solde mentionné à l'article L. 15 et revalorisé dans les conditions prévues
      à l'article L. 16. En cas de dépassement, les montants de la pension et de la
      majoration sont réduits à due proportion » (L. 18, V, rédigé par la loi n°
      2011-1977, article 163, I, 1°, qui l'étend par décret à la CNRACL et au FSPOEIE, II).
      La surcote compte encore dans la pension qu'on compare au traitement : en 2017, la
      caisse refuse la majoration à qui la surcote porte à 104 % du traitement (Conseil
