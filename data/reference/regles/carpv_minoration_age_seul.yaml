approximations:
- version: [statuts_d_avant_2011, statuts_de_2011, statuts_de_2014, inapte_a_100_pour_cent_2015]
  textes: >-
    statuts du régime complémentaire, titre II, article 21 puis 13, au seul Bulletin
    officiel hors des alinéas que récrivent les arrêtés de 2011, 2014 et 2015
  ecart: >-
    Le modèle sert avant 2022 la règle de 2021 — 60 ans, 65 ans, 1,25 % par trimestre
    manquant —, dont nul texte lu ne donne le taux ni l'âge du taux plein : l'alinéa
    de 2011 ne dit que la minoration et la retraite à 60 ans, et rien n'est lu avant
    2011. L'arrêté de 2014 supprime deux alinéas de l'article, que nul texte publié ne
    donne : leur effet est inconnu.
  effet: non mesuré
- version: [statuts_de_2011, statuts_de_2014, inapte_a_100_pour_cent_2015, statuts_de_2021, reglement_de_2026]
  textes: >-
    arrêté du 11 janvier 2011, article 21, sixième alinéa ; arrêté du 16 avril 2014,
    II, a) et h) ; arrêté du 2 novembre 2015, I, 3° ; statuts de 2021, article 34 ;
    règlement de 2026, article 2
  ecart: >-
    Le modèle minore l'inapte comme les autres : la fiche `inaptitude_au_travail` ne
    nomme pas la CARPV parmi les régimes qui le servent au taux plein. Les statuts le
    servent à 60 ans sans minoration : du 20 janvier 2011 au 1er décembre 2015,
    l'invalide reconnu inapte « en application de l'article L. 643-4 » et titulaire de
    la rente d'invalidité à 100 % ; du 2 décembre 2015 au 31 décembre 2021, l'invalide
    reconnu inapte en application du même article et « reconnu inapte au taux
    fonctionnel ou professionnel de 100 % » ; depuis 2022, tout adhérent reconnu inapte
    à l'exercice de toute activité professionnelle rémunérée. Avant 2011, rien n'est
    lu. Ce que le texte ne tranche pas, de 2011 à 2021 : si l'inaptitude reconnue « en
    application de l'article L. 643-4 », qui liquide la base sans coefficient à l'âge
    du I de L. 643-3 (rédaction du 19 décembre 2008, LEGIARTI000019959512), peut
    l'être avant cet âge, 62 ans pour les générations nées depuis 1955.
  effet: >-
    non mesuré dans la population ; pour l'inapte, toute la minoration de son âge : 20
    trimestres × 1,25 % = 25 % de la pension complémentaire à 60 ans, 12 × 1,25 % = 15 %
    à 62 ans
- version: [statuts_d_avant_2011, statuts_de_2011, statuts_de_2014, inapte_a_100_pour_cent_2015, statuts_de_2021, reglement_de_2026]
  textes: >-
    statuts de 2021, articles 38, 40 et 41 ; règlement de 2026, articles 6, 8 et 9 ;
    avant 2022, nul texte lu de la réversion
  ecart: >-
    Le modèle ne sert aucune réversion de la CARPV : aucune fiche de réversion ne nomme
    `carpv_complementaire`, et la ligne vaut zéro, motif `non_portee`
    (`droit/reversion.py`, `moteur/js/droit/reversion.js`), dans les deux moteurs. Les
    statuts de 2021 et le règlement de 2026 servent au conjoint survivant âgé de
    soixante ans, marié deux ans au moins ou dont un enfant est issu du mariage, non
    remarié (articles 38 et 6), « 60 % des points acquis par le vétérinaire décédé »,
    100 % de ceux que la cotisation majorée a acquis (articles 40 et 8) ; la réversion
    « supporte le même coefficient de minoration », sauf « si le décès de l'adhérent se
    produit avant son soixante-cinquième anniversaire » : il la reçoit alors « sans
    minoration » (articles 41 et 9).
  effet: >-
    non mesuré dans la population ; pour le conjoint survivant, toute la réversion. Le
    vétérinaire né le 10 février 1964, au travail depuis ses 26 ans à deux fois le
    salaire moyen, parti à 62 ans le 1er mars 2026 au coefficient 0,85, mort en juin
    2027, avant 65 ans, laisse au conjoint né en 1962, marié en juin 1988, 60 % de sa
    pension sans le coefficient : 0,60 × 17 406,29 / 0,85 = 12 286,79 € par an, aux
    montants de 2026 ; le modèle sert 0 (essai du 3 novembre 2026, les deux moteurs au
    bit près)
