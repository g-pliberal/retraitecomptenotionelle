    decoteOpposable, trimestresDeDecote, surcotePoints ; moteur/js/droit/ouvrir.js :
    ageOuverture, ageTauxPlein ; moteur/js/droit/completer.js : completer,
    tauxMajorationEnfants
  parametres: >-
    contenu.parametres de chaque version : age_ouverture, age_taux_plein,
    decote_par_trimestre ; regimes/carpv_complementaire.yaml : age_ouverture,
    age_taux_plein, decote_par_trimestre, avantages_non_contributifs
  tests: [tests/test_sections_sante.py, tests/test_sections_liberales.py, tests/js/moteur.test.js]
