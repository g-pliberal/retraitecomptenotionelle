schema_version: 1
id: carpv_minoration_age_seul
intitule: >-
  Régime complémentaire de la CARPV : taux plein à 65 ans, anticipation dès 60 ans
  à « 1,25 % par trimestre manquant avant l'âge de soixante-cinq ans », que la durée
  n'annule pas ; l'inapte à 60 ans sans minoration. Statuts de 2021, en vigueur le
  1er janvier 2022, puis règlement de 2026 ; la même règle supposée avant 2022.
domaine: decote_surcote
regimes: [carpv_complementaire]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  l'âge du vétérinaire « à l'entrée en jouissance », au premier jour du mois qui suit
  sa demande, et les trimestres qui le séparent de soixante-cinq ans
- >-
  l'inaptitude : de 2011 à 2021, l'invalide reconnu inapte « en application de l'article
  L. 643-4 », titulaire de la rente d'invalidité à 100 % jusqu'au 1er décembre 2015,
  puis reconnu inapte au taux fonctionnel ou professionnel de 100 % ; depuis 2022,
  l'inaptitude à l'exercice de toute activité professionnelle rémunérée, que valide le
  médecin conseil et confirme la commission d'inaptitude
- la date d'effet de la pension, qui choisit la rédaction des statuts ou du règlement
ecrit:
- >-
  le coefficient d'anticipation qui réduit la pension complémentaire, de 0,75 à 60 ans
  à un à 65 ans, que `abattement_points` rend à `liquider_chaque_regime`
dates_qui_decident:
- liquidation.date_effet
versions:
