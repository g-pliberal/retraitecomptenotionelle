    dont nul texte n'est lu : l'index JORF du dépôt n'en porte que des titres, ainsi
    l'arrêté du 9 mars 1960 (JORFTEXT000000803770), « APPROBATION DE MODIFICATIONS
    APPORTEES AUX ART. 10, 16 ET 21 DU TITRE II DES STATUTS DE LA SECTION
    PROFESSIONNELLE DES VETERINAIRES RELATIFS AU REGIME COMPLEMENTAIRE D'ASSURANCE
    VIEILLESSE », celui du 16 septembre 1968 (JORFTEXT000000437434), qui vise les
    articles « 9, 17, 21, 23, 24, 32 & 34 » des statuts des régimes d'assurance
    vieillesse complémentaire et d'invalidité-décès, et celui du 8 juillet 1977
    (JORFTEXT000000489267), les articles « 21, 23, 23 BIS, 24, 36 », sans dire de quel
    régime ; celui du 30 décembre 1970 (JORFTEXT000000483025) vise l'article 21 des
    statuts du régime d'assurance invalidité-décès. La fiche présume la règle de 2021
  fiabilite: >-
    faible pour l'âge d'ouverture, l'âge du taux plein et le taux, que nul texte lu ne
    date avant 2011
  bornes:
