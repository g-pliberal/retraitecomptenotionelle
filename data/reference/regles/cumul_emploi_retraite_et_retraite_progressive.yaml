  contenu:
    droit: >-
      L. 161-22 de 2015 « est applicable aux assurés dont la première pension prend
      effet à compter du 1er janvier 2015 » : son premier alinéa vise tout régime de
      base, et sa loi réduit les pensions « à due concurrence du dépassement, dans des
      conditions fixées par décret ». Jusqu'au décret de la réduction, la pension « n'est
      pas due pour le mois civil » où le revenu dépasse le plafond, diminué des pensions
      (D. 161-2-16 de 2015) : elle reste suspendue
    non_salaries: >-
      la réduction des artisans et des commerçants vaut pour les activités « à compter
      du 1er janvier 2017 » (D. 634-11-2 de 2017), celle du libéral de même
      (D. 643-10-2 de 2017) ; d'ici là, la pension suspendue l'est le nombre de mois du
      dépassement, comme en 2010 (D. 634-11-5 et D. 643-10-2 de 2015)
