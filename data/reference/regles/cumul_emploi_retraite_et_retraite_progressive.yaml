historique:
- >-
  2026-09-29 — scindée avec l'ouverture du domaine des départs multiples : la
  retraite progressive passe à la fiche retraite_progressive, la nouvelle pension de
  2023 à la fiche seconde_pension, et l'extinction des droits après une première
  pension à la fiche droits_apres_la_premiere_pension. Cette fiche garde son nom,
  qui ne se renomme pas, et le seul cumul.
- >-
  2026-09-30 — lue dans ses rédactions depuis 1985 et découpée en six versions, avec
  ses décrets et les règles des non-salariés ; le cumul du fonctionnaire passe à la
  fiche cumul_emploi_retraite_fonction_publique.
- >-
  2026-09-30 — calculée : le modèle suit le retraité qui travaille, mois par mois
  (droit/cumul.py et son jumeau), et la fiche passe à l'état approchée. Les
  rédactions de 2004 à 2017 des décrets, lues le même jour, ajoutent la version
  premieres_pensions_de_2015 : la première pension de 2015 reste suspendue jusqu'au
  décret de la réduction, qui ne vaut que pour les activités exercées depuis le
  1er avril 2017 ; la version reduction_du_depassement_2015 commence donc à cette date.
- >-
  2026-10-24 — la pension de l'artisan, du commerçant et du libéral que le dépassement
  suspend ne l'est que le nombre de mois qu'il épuise (D. 634-11-5, D. 643-10-2), lue
  avec les circulaires RSI 2007/109 et 2010/013, dont deux exemples entrent au registre ;
  le seuil du libéral, annuel jusqu'en 2011 ; la durée de L. 351-1, que le cumul intégral
  exige aussi d'une carrière tout en points (action 138, étape 12).
effet: >-
  Le retraité qui travaille avant le taux plein : la salariée née en 1960, partie à
  62 ans en 2022 sans la durée requise, qui reprend un emploi au salaire de sa fin de
  carrière d'août 2022 à janvier 2024, perd 29 446 € de pension, sa pension du régime
  général réduite du dépassement du plafond et sa retraite Agirc-Arrco suspendue.
  Partie avec la durée, elle cumule entièrement et ne perd rien. L'artisane partie en
  2008 dont le revenu de 2010 dépasse de 4 700 € la moitié du plafond voit sa pension de
  1 000 € par mois suspendue cinq mois, et non les douze de son activité.
