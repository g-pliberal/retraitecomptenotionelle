  bornes:
    liquidation.date_effet: [1983-04-01, null]
    liquidation.premiere_pension_de_base: [null, 2015-01-01]
    periode.debut: [2009-01-01, null]
  contenu:
    droit: >-
      le plafond devient « 160 % du salaire minimum de croissance ou [...] le dernier
      salaire d'activité », revalorisé comme les pensions (D. 161-2-8), au moins 160 %
      du SMIC mensuel sur 1 820 heures par an (D. 161-2-9) ; au-delà, le service des
      pensions « est suspendu ». La pension « peut être entièrement cumulée » à qui a
      liquidé toutes ses pensions, « a) A partir de l'âge prévu au 1° de l'article
      L. 351-8 ; b) A partir de l'âge prévu au premier alinéa de l'article L. 351-1 »
      avec la durée requise ; le délai de six mois n'est pas « applicable aux assurés
      remplissant, lors de la reprise d'activité, les conditions » du cumul intégral
      (D. 161-2-15). La première pension d'avant 2015 garde cette rédaction, et la
      suspension, que les rédactions de 2015 ne visent pas
    non_salaries: >-
      l'artisan, le commerçant et le libéral cumulent entièrement aux mêmes conditions
      (L. 634-6, L. 643-6 de 2008), la durée « au moins égale à la limite » de L. 351-1
      comprise, et gardent sinon leur seuil et la suspension. Depuis 2010, celle de
      l'artisan et du commerçant vaut le nombre de mois du dépassement, « sans que ce
      nombre puisse être inférieur à un, ni supérieur au nombre de mois durant lesquels,
      au cours de l'année pour laquelle le dépassement est constaté, l'assuré a poursuivi
      ou repris une activité » (D. 634-11-5), borne que la lettre ministérielle du 8 mars
      2010 étend aux revenus de 2008 et de 2009 (circulaire RSI 2010/013) ; depuis le 17
      janvier 2011, celle du libéral de même, sans minimum (D. 643-10-2), sous le plafond
      « rapporté à la durée d'affiliation » de son activité (D. 643-10). La
      complémentaire suit : « Cette durée de 12 mois de suspension sera appliquée à la
      retraite complémentaire » (circulaire RSI 2010/013)
    parametres:
      plafond: dernier_salaire_ou_160_smic
      part_du_smic: 1.6
      depassement: suspension
      cumul_integral: true
      suspension_independants: nombre_de_mois
      suspension_liberaux: nombre_de_mois_depuis_2011
  exemples: [rsi_2010_013_suspension_d_un_mois, rsi_2010_013_suspension_bornee_aux_mois_d_activite]
