  - {id: LEGIARTI000047961681, article: "D. 161-2-15 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047961674, article: "D. 161-2-16 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000047961809, article: "D. 634-11-2 CSS", en_vigueur: 2023-09-01}
  - {id: LEGIARTI000030060076, article: "D. 643-10 CSS", en_vigueur: 2015-01-01}
  nee_de: JORFARTI000028493684
  bornes:
    liquidation.date_effet: [1983-04-01, null]
    liquidation.premiere_pension_de_base: [2015-01-01, 2027-01-01]
    periode.debut: [2009-01-01, null]
  contenu:
    droit: >-
      au-delà du plafond, « chacune des pensions servies par ces régimes est réduite à
      due concurrence du dépassement » ; « Le montant de la réduction de chacune des
      pensions [...] est égal au montant du dépassement », mois par mois, et la pension
      n'est pas servie quand la réduction la dépasse (D. 161-2-16) ; le dernier salaire
      est la moyenne mensuelle des revenus soumis à la CSG du mois de la cessation et
      des deux précédents (D. 161-2-7), le revenu de l'activité, son assiette de CSG
      (D. 161-2-10) ; chez le dernier employeur, la pension « n'est pas due » du mois de
      la reprise au mois de sa cessation, au plus six mois après la pension
      (D. 161-2-15), le plafond ne s'appliquant qu'à partir du septième mois
    non_salaries: >-
      l'artisan et le commerçant cumulent des revenus qui « ne doivent pas excéder la
      moitié du plafond » de la sécurité sociale, le plafond entier en zone de
      revitalisation rurale (L. 634-6, D. 634-11-2) ; le libéral, « le plafond prévu à
      l'article L. 241-3 » (L. 643-6, D. 643-10) ; au-delà, la pension de ce régime est
      réduite du dépassement
    parametres:
      plafond: dernier_salaire_ou_160_smic
      depassement: reduction
      cumul_integral: true
      seuil_independants_en_pass: 0.5
      seuil_liberaux_en_pass: 1.0
  exemples: aucun trouvé
- id: trois_regimes_selon_l_age_2027
  statut: lue
  textes:
  - {id: LEGIARTI000053279730, article: "L. 161-22 CSS", en_vigueur: 2025-12-31}
  nee_de: LEGIARTI000053279730
  bornes:
    liquidation.date_effet: [1983-04-01, null]
    liquidation.premiere_pension_de_base: [2027-01-01, null]
    periode.debut: [2009-01-01, null]
  contenu:
    droit: >-
      pour qui entre en jouissance de sa première pension de base à compter du 1er
      janvier 2027 : « 1° Lorsque l'âge de l'assuré est inférieur à l'âge mentionné à
      l'article L. 161-17-2, la pension servie est réduite à due concurrence des revenus
      professionnels et de remplacement ; 2° [de cet âge à celui du 1° de L. 351-8] [...]
