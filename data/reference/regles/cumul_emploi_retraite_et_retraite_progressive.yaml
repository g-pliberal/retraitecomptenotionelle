approximations:
- ecart: >-
    le seuil du 2° de L. 161-22 pour les premières pensions de 2027, qu'un décret fixe,
    n'a pas paru au 30 septembre 2026 : de l'âge légal à l'âge du taux plein
    automatique, la pension de 2027 est servie entière, et la page le dit ; avant
    l'âge légal, la réduction des revenus se répartit entre les pensions de base au
    prorata, le décret de l'imputation n'ayant pas paru non plus
  effet: non mesuré
- ecart: >-
    les pensions d'un mois sont celles de la fin de son année, revalorisation de
    l'année comprise, et le revenu de l'année se répartit également entre ses mois
    d'activité ; le dernier salaire est celui de la dernière année d'emploi, rapporté
    à ses mois et au temps plein, non celui des trois derniers mois ; au-delà de
    l'année courante, les pensions et le dernier salaire suivent les prix, comme la
    loi les revalorise, à la rencontre des revenus que la carrière projette
  effet: non mesuré
- ecart: >-
    chaque régime ne réduit que ses pensions, pour l'activité qui relève de lui : le
    salarié devenu artisan garde sa pension du régime général entière. La pension
    des régimes alignés, que le modèle liquide au régime général, suit aussi la règle
    de L. 634-6 pour l'ancien artisan ou commerçant qui le redevient ; le seuil des
    zones de revitalisation rurale, le plafond entier, n'est pas appliqué
  effet: non mesuré
- ecart: >-
    l'Agirc-Arrco suit sa règle d'aujourd'hui depuis 2009, et celle du régime de base
    avant, qu'aucun accord lu ne confirme ; sa règle des pensions de 2027, que son site
    annonce, n'est pas publiée, et le modèle lui prête le cumul entier du régime de
    base, à l'âge du taux plein automatique. Celles des indépendants, de l'Ircantec, de la
    RCO agricole et des sections libérales ont leur fiche
    (cumul_emploi_retraite_complementaire_des_independants, cumul_emploi_retraite_ircantec,
    cumul_emploi_retraite_rco_agricole, cumul_emploi_retraite_complementaires_des_liberaux).
    Les autres complémentaires — avocats, navigants, artistes-auteurs, prestations
    supplémentaires, RAFP — et les régimes dont la règle n'est pas lue — avocats
    (L. 723-11-1), exploitants agricoles (L. 732-39), outre-mer, élus — servent leur
    pension entière, et le résultat le dit ; pour la première pension de 2027, que L.
    161-22, III, A, applique à toute pension « de base ou complémentaire », ces autres
    complémentaires restent entières
  effet: non mesuré
- ecart: >-
    avant 2004, la reprise chez un autre employeur que le dernier est lue libre ; les
    activités que L. 161-22 laisse libres (artistiques, juridictionnelles…) ne se
    déclarent pas
  effet: non mesuré
- ecart: >-
    la caisse suspend la pension de l'artisan, du commerçant et du libéral après avoir
    constaté le dépassement de l'année, au mois qui suit sa notification, et la rétablit
    après le dernier mois de suspension (D. 634-11-5, circulaire RSI 2007/109, § 4.2.3) :
    le modèle, qui ne dit que l'année de l'activité, en suspend les derniers mois ; il
    réduit de même pendant ses mois la pension que la rédaction de 2017 réduit, du mois
    qui suit la notification, sur l'année civile entière quand l'activité en compte moins
    de douze
  effet: non mesuré
- ecart: >-
    la pension mensuelle nette que le dépassement divise est celle de la base que
    l'activité touche, brute de l'année moins la CSG au taux plein, la CRDS, la CASA et
    la cotisation maladie de son régime : le taux réduit ou l'exonération de la CSG, que
    le revenu fiscal décide, n'est pas suivi, ni la majoration pour enfants, l'allocation
    supplémentaire ou l'ASPA que la caisse y compte (circulaire RSI 2007/109, § 4.2.1)
  effet: non mesuré
- ecart: >-
    D. 634-11-5 de 2004 ne bornait pas la suspension, qui pouvait passer douze mois et
    s'additionner d'une année à l'autre ; la lettre ministérielle du 8 mars 2010 l'a
    bornée aux mois de l'activité de l'année pour les revenus de 2008 et de 2009, et a
    rétabli au 1er janvier 2010, sans rappel, les pensions suspendues plus longtemps pour
    les revenus de 2004 à 2007 (circulaire RSI 2010/013) : le modèle la borne aux mois de
    l'activité de l'année depuis 2004
  effet: non mesuré
- ecart: >-
    l'ancien régime des commerçants rapportait le seuil aux jours de l'activité, celui des
    artisans à ses mois (circulaire RSI 2010/013) : le modèle le rapporte aux mois pour
    tous
  effet: non mesuré
sources:
  lu_le: 2026-10-24
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Ouvert le 24 octobre 2026 (action 138, étape 12) : la suspension du libéral, que
    D. 643-10-2 compte en mois depuis 2011, n'a ni instruction de la CNAVPL ni exemple
    d'une section lus ; la date où la caisse suspend, après la notification du
    dépassement, que le modèle place à la fin de l'année de l'activité.
  - >-
    Le 29 septembre 2026, avec le domaine des départs multiples, L. 161-22 a été lu
    dans ses rédactions de 2025 et de 2027 ; le 30, dans celles de 1985 à 2023, avec
    ses décrets (D. 161-2-5 à D. 161-2-18, dans leurs rédactions de 2004, 2010, 2015
    et 2017) et les règles des indépendants et des libéraux depuis 1985. Restent à
    lire : les rédactions de L. 161-22 de 1988 à 1993, les règles des avocats
    (L. 723-11-1) et des exploitants agricoles (L. 732-39) — celles du RCI, de
    l'Ircantec, de la RCO agricole et des sections libérales, lues les 23 et 24 octobre
    2026, ont leur fiche —, les accords de l'Agirc-Arrco d'avant 2019, et le décret qui
    fixera le seuil de 2027.
  - >-
    Avant 2004, la rupture ne vise que « l'employeur » : la reprise chez un autre
    employeur est-elle libre de tout plafond ? Aucune circulaire lue ne le dit ; le
    texte le laisse entendre.
  - >-
    LE SEUIL DE 2027 EST ANNONCÉ, NON PUBLIÉ. Le jaune pensions annexé au PLF 2027
    (partie III) écrit qu'entre l'âge légal et l'âge d'annulation de la décote, pour
    les pensions liquidées à partir de 2027, « le cumul sera libre dans la limite d'un
    seuil annuel fixé à 7 000 euros par an », l'excédent écrêté de moitié. Aucun décret
    ne le fixe dans les index JORF et LEGI du dépôt, à jour au 13 octobre 2026 : le
    paramètre reste `non_publie`, et la pension de 2027 entière dans ce cas ; à reprendre
    dès que le décret paraît (action 159, étape 9).
  lectures:
  - type: autre
    reference: L'Assurance retraite, mesures de la LFSS 2026
    date: 2026-01-01
  - type: autre
    reference: >-
      Service des retraites de l'État, pages du cumul (règles des pensions de 2027)
      et de la retraite progressive ; FAQ de la DGAFP de 2025 ; calculette PECARI
      de l'ENSAP (plafond de 8 198,04 € au 1er janvier 2026)
    date: 2026-09-24
  - type: legifrance
    reference: >-
      L. 161-22 CSS, rédaction issue de la loi n° 2025-199 (LEGIARTI000051289735) :
      le cumul plafonné — reprise « procurant des revenus qui, ajoutés aux pensions
      [...], sont inférieurs à 160 % du salaire minimum de croissance ou au dernier
      salaire d'activité », la pension « réduite à due concurrence du dépassement »,
      six mois au plus tôt chez le dernier employeur — et le cumul intégral, sous
      réserve d'avoir liquidé toutes ses pensions, à l'âge du taux plein automatique
      ou à l'âge légal avec la durée
    date: 2026-09-29
  - type: legifrance
    reference: >-
      L. 161-22 CSS, rédaction de la loi n° 2025-1403 (LEGIARTI000053279730), pour les
      premières pensions prises à compter du 1er janvier 2027 : avant l'âge légal, la
      pension « réduite à due concurrence des revenus professionnels et de
      remplacement » ; de l'âge légal à l'âge du taux plein automatique, « à due
      concurrence de la moitié du dépassement » d'un seuil ; au-delà, « entièrement
      cumulée » ; les exceptions de L. 161-22-1-2
    date: 2026-09-29
  - type: legifrance
    reference: >-
      L. 161-22 CSS, rédactions de 1985, 1987, 1995, 2002, 2003, 2008, 2010, 2015, 2017,
      2022 et 2023, dans l'index LEGI ; les articles 19 et 20 de la loi n° 2014-40, dans
      l'index JORF ; D. 161-2-5 à D. 161-2-18, L. 634-6 et D. 634-11-2, L. 643-6 et
      D. 643-10 : la rupture de 1983, le plafond de 2004, le cumul libéralisé de 2009,
      la réduction du dépassement de 2015, et ses modalités
    date: 2026-09-30
  - type: legifrance
    reference: >-
      D. 161-2-15 et D. 161-2-16 CSS dans leurs rédactions de 2004, 2010, 2015 et 2017 :
      la suspension, puis la réduction pour les activités exercées depuis le 1er avril
      2017 ; D. 161-2-8, D. 161-2-9 (2004 et 2010) et D. 161-2-11 ; L. 634-6 (1985,
      2003, 2008, 2014), D. 634-11-2 (2004, 2015, 2017), L. 643-6 (2004, 2008) et
      D. 643-10 (2004), dans l'index LEGI ; l'article 20 de la loi n° 2014-40, sans
      date d'application propre
    date: 2026-09-30
  - type: service_public
    reference: >-
      fiche F13243, « Cumul emploi-retraite du salarié », vérifiée le 1er janvier 2026 :
      le plafond de 2 916,85 € brut par mois (160 % du SMIC), le dernier salaire des
      trois derniers mois, chaque pension de base réduite du dépassement, la reprise
      chez le dernier employeur, la nouvelle pension de 2 403 € au plus
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F13243
    date: 2026-09-30
  - type: autre
    reference: >-
      Agirc-Arrco, page « Cumul emploi-retraite » : le plafond le plus haut de 160 % du
      SMIC, du dernier salaire revalorisé et du salaire moyen revalorisé des dix
      dernières années ; au-delà, la retraite complémentaire suspendue ; des points
      sur la tranche 1 depuis le 1er janvier 2023 en cumul intégral
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/vivre-ma-retraite/cumul-emploi-retraite/
    date: 2026-09-30
  - type: autre
    reference: >-
      Ircantec, « Le dispositif du cumul emploi-retraite » et « Le dispositif de retraite
      progressive » : en cumul plafonné, « votre régime de base peut réduire votre
      pension. Mais l'Ircantec continue de vous verser la totalité », ce que le modèle
      fait ; la retraite progressive de l'Ircantec à soixante ans, avec 150 trimestres
      et la retraite progressive du régime général ou agricole, minorée à l'âge seul
      quand elle précède l'âge légal, les points de l'activité réduite attribués à la
      retraite définitive
    url: https://www.ircantec.retraites.fr/actif/dispositif-cumul-emploi-retraite
    date: 2026-10-13
  - type: legifrance
    reference: >-
      D. 634-11-5 CSS dans ses cinq rédactions (2004, 2010, 2015, 2017, 2020), D. 643-10-2
      (2011, 2015, 2017), D. 643-10 (2004 à 2015), D. 643-10-1 (2011, 2015), D. 634-11-2
      (2010) et L. 643-6 (2004 à 2023), dans l'index LEGI à jour au 23 octobre 2026 : la
      suspension pour le nombre de mois que le dépassement épuise, ses bornes, et le seuil
      du libéral, annuel jusqu'en 2011
    date: 2026-10-24
  - type: circulaire_cnav
    reference: >-
      circulaires RSI n° 2007/109 du 16 août 2007 (§ 4.2 : la pension « prise en compte
      pour son montant net », la suspension sans maximum), n° 2009/044 du 15 octobre 2009
      (la complémentaire suspendue le même nombre de mois que la base) et n° 2010/013 du
      18 mars 2010 (le nombre de mois borné à l'activité de l'année, la lettre
      ministérielle du 8 mars 2010, sept exemples), trouvées par l'API de recherche de la
      base de législation de l'Assurance retraite le 24 octobre 2026
    url: https://legislation.lassuranceretraite.fr/
    date: 2010-03-18
