- id: plafond_du_dernier_salaire_2004
  statut: lue
  textes:
  - {id: LEGIARTI000006741560, article: "L. 161-22 CSS", en_vigueur: 2003-08-22}
  - {id: LEGIARTI000006735313, article: "D. 161-2-7 CSS", en_vigueur: 2004-10-22}
  - {id: LEGIARTI000006735315, article: "D. 161-2-9 CSS", en_vigueur: 2004-10-22}
  bornes:
    liquidation.date_effet: [2004-01-01, null]
    periode.debut: [null, 2009-01-01]
  contenu:
    droit: >-
      pour les pensions prenant effet depuis le 1er janvier 2004, la reprise est
      permise si les revenus, « ajoutés aux pensions servies [...] ainsi que par les
      régimes complémentaires », restent « inférieurs au dernier salaire d'activité
      perçu avant la liquidation », chez le dernier employeur « au plus tôt six mois
      après la date d'entrée en jouissance de la pension » ; au-delà, « le service de
      ces pensions est suspendu »
    parametres:
      plafond: dernier_salaire
      depassement: suspension
  exemples: aucun trouvé
- id: cumul_liberalise_2009
  statut: lue
  textes:
  - {id: LEGIARTI000019959680, article: "L. 161-22 CSS", en_vigueur: 2008-12-19}
  - {id: LEGIARTI000022267321, article: "L. 161-22 CSS", en_vigueur: 2010-05-08}
  - {id: LEGIARTI000021640145, article: "D. 161-2-8 CSS", en_vigueur: 2010-01-01}
  - {id: LEGIARTI000021640140, article: "D. 161-2-9 CSS", en_vigueur: 2010-01-01}
  bornes:
    liquidation.date_effet: [1983-04-01, null]
    liquidation.premiere_pension_de_base: [null, 2015-01-01]
    periode.debut: [2009-01-01, null]
  contenu:
    droit: >-
      le plafond devient « 160 % du salaire minimum de croissance ou [...] le dernier
      salaire d'activité », revalorisé comme les pensions (D. 161-2-8), au moins 160 %
      du SMIC mensuel sur 1 820 heures par an (D. 161-2-9) ; au-delà, le service des
      pensions « est suspendu ». La pension « peut être entièrement cumulée » à qui a
      liquidé toutes ses pensions, « a) A partir de l'âge prévu au 1° de l'article
      L. 351-8 ; b) A partir de l'âge prévu au premier alinéa de l'article L. 351-1 »
      avec la durée requise
    parametres:
      plafond: dernier_salaire_ou_160_smic
      depassement: suspension
      cumul_integral: true
  exemples: aucun trouvé
- id: reduction_du_depassement_2015
  statut: lue
