schema_version: 1
id: cumul_emploi_retraite_et_retraite_progressive
intitule: >-
  Cumul emploi-retraite : le retraité qui reprend ou poursuit une activité garde sa
  pension, entière en cumul intégral, réduite de ce qui dépasse un plafond en cumul
  plafonné ; depuis les pensions de 2027, trois régimes selon l'âge. La retraite
  progressive, qui n'y est pas soumise, et la seconde pension ont leurs fiches
  (retraite_progressive, seconde_pension) ; le fonctionnaire, la sienne
  (cumul_emploi_retraite_fonction_publique).
domaine: cumul
regimes: [regime_general, msa_salaries, msa_non_salaries, cancava, organic, rsi, cnavpl,
  crpcen, ieg, mines, marins, opera_de_paris, comedie_francaise, banque_de_france, ratp,
  sncf, agirc_arrco, arrco, agirc]
etape: echeancier
face: droit
etat: approchee
lit:
- l'activité exercée après le départ, ses dates, son statut, son revenu, et l'employeur
  (le dernier, ou un autre)
- la date d'effet de la pension, et celle de la première pension de base
- le dernier salaire avant le départ, et le SMIC de l'année
- le taux plein de la pension de base, et la liquidation de toutes les pensions
ecrit:
- >-
  la pension servie pendant l'activité, régime par régime : entière, réduite du
  dépassement du plafond, ou suspendue
dates_qui_decident:
- liquidation.date_effet
- liquidation.premiere_pension_de_base
- periode.debut
versions:
