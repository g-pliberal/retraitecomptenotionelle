- id: trois_regimes_selon_l_age_2027
  statut: lue
  textes:
  - {id: LEGIARTI000053279730, article: "L. 161-22 CSS", en_vigueur: 2025-12-31}
  nee_de: LEGIARTI000053279730
  bornes:
    liquidation.date_effet: [1983-04-01, null]
    liquidation.premiere_pension_de_base: [2027-01-01, null]
    periode.debut: [2009-01-01, null]
  contenu:
    droit: >-
      pour qui entre en jouissance de sa première pension de base à compter du 1er
      janvier 2027 : « 1° Lorsque l'âge de l'assuré est inférieur à l'âge mentionné à
      l'article L. 161-17-2, la pension servie est réduite à due concurrence des revenus
      professionnels et de remplacement ; 2° [de cet âge à celui du 1° de L. 351-8] [...]
      réduite à due concurrence de la moitié du dépassement de ce seuil ; 3° [au-delà]
