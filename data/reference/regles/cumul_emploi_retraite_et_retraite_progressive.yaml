  - {id: LEGIARTI000006737985, article: "D. 634-11-2 CSS", en_vigueur: 2004-08-03}
  - {id: LEGIARTI000006743797, article: "L. 643-6 CSS", en_vigueur: 2004-01-01}
  - {id: LEGIARTI000006738158, article: "D. 643-10 CSS", en_vigueur: 2004-01-01}
  bornes:
    liquidation.date_effet: [2004-01-01, null]
    periode.debut: [null, 2009-01-01]
  contenu:
    droit: >-
      pour les pensions prenant effet depuis le 1er janvier 2004, la reprise est
      permise si les revenus, « ajoutés aux pensions servies [...] ainsi que par les
      régimes complémentaires », restent « inférieurs au dernier salaire d'activité
      perçu avant la liquidation », chez le dernier employeur « au plus tôt six mois
      après la date d'entrée en jouissance de la pension » ; au-delà, « le service de
      ces pensions est suspendu ». Le dernier salaire, moyenne mensuelle des revenus
      soumis à la CSG des trois derniers mois (D. 161-2-7), « ne peut être inférieur au
      montant mensuel du salaire minimum de croissance » sur 1 820 heures (D. 161-2-9) ;
      la reprise chez le dernier employeur dans les six mois rend la pension « pas
      due » du mois de la reprise au sixième mois (D. 161-2-15) ; au-delà du plafond,
      la pension « n'est pas due pour le mois civil » (D. 161-2-16)
    non_salaries: >-
      l'artisan et le commerçant cumulent des revenus qui « ne doivent pas excéder la
      moitié du plafond » de la sécurité sociale, « rapportée à la durée de cet
      exercice » (D. 634-11-2), le libéral le plafond entier (D. 643-10) ; au-delà, le
      service de la pension « est suspendu » (L. 634-6, L. 643-6)
    parametres:
      plafond: dernier_salaire_au_moins_le_smic
      part_du_smic: 1.0
      depassement: suspension
      seuil_independants_en_pass: 0.5
      seuil_liberaux_en_pass: 1.0
  exemples: aucun trouvé
