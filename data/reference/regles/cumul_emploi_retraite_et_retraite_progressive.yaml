  bornes:
    liquidation.date_effet: [1983-04-01, 2004-01-01]
    periode.debut: [null, 2009-01-01]
  contenu:
    droit: >-
      le service de la pension du régime général, des salariés agricoles ou d'un régime
      spécial « est subordonné à la rupture définitive de tout lien professionnel avec
      l'employeur ou, pour les assurés exerçant une activité non-salariée, à la
      cessation définitive de cette activité » ; les activités que l'article énumère
      (artistiques, juridictionnelles, jurys…) restent libres. Le modèle lit le dernier
      employeur : chez lui, la pension n'est pas servie tant que dure l'activité ;
      chez un autre, elle l'est entière
    non_salaries: >-
      la pension de l'artisan ou du commerçant prise depuis le 1er juillet 1984 « est
      suspendu[e] dès lors que l'assuré reprend, à quelque titre que ce soit, une
      activité professionnelle dans la ou les entreprises exploitées à la date de la
      cessation d'activité non-salariée » (L. 634-6)
    parametres:
      cumul: rupture_avec_le_dernier_employeur
  exemples: aucun trouvé
