schema_version: 1
id: abattement_rci
intitule: >-
  Abattement des points de la retraite complémentaire des indépendants liquidée avant
  le taux plein : 1 % par trimestre manquant jusqu'à douze, puis 1,25 %, jusqu'à 22 %
  à vingt trimestres (annexe 2 du règlement du RCI), sur le plus petit des deux
  décomptes, durée et âge, et sur toutes les catégories de points, celles du RCO des
  artisans et du NRIC des commerçants comprises.
etat: approchee
effet: >-
  Toute retraite du RCI liquidée avant le taux plein du régime de base. Jusqu'au 16
  octobre 2026, le modèle abattait les points de la décote du régime général, 1,25 %
  par trimestre : 0,9125 à sept trimestres manquants quand la caisse sert 0,93, 0,85
  au lieu de 0,88 à douze, 0,75 au lieu de 0,78 à vingt. Les périodes du RCI, et les
  dernières du RCO des artisans (2008-2012) et du NRIC (2005-2012), qui liquident
  leurs points après la fusion, renvoient depuis à cette fiche.
approximations:
- ecart: >-
    les dernières périodes du RCO des artisans (2008-2012) et du NRIC (2005-2012)
    liquident aussi les pensions de ces années-là, avant la fusion, et leur appliquent
    le barème de l'annexe 2 du règlement du RCI, que les règlements d'alors ne
    disent pas : celui du RCO (arrêté du 15 décembre 1978) avait depuis 1985 un «
    tableau des taux d'abattement » pour la liquidation à soixante ans (arrêté du 30
    novembre 1984), que le JORF ne publie qu'en analyse ; celui du NRIC (arrêté du
    17 décembre 2004) est annexé sans être publié. Les périodes plus anciennes gardent
    la décote du régime de base, aussi peu lue.
  effet: >-
    les seules liquidations de 2005 à 2012 au NRIC, de 2008 à 2012 au RCO, avant le
    taux plein ; aucune après 2012
exemples:
- cnav_2026_07_abattement_rci_1962
sources:
  lu_le: 2026-10-16
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Avant 2013 : les règlements du RCO des artisans (arrêté du 15 décembre 1978, et
    son tableau des taux d'abattement de l'arrêté du 30 novembre 1984) et du NRIC
    (arrêté du 17 décembre 2004) avaient-ils déjà ce barème ? L'index de la DILA ne
    porte que l'analyse du premier et le seul dispositif du second (lus le 16 octobre
    2026) : leurs textes sont au Bulletin officiel, que Légifrance ou Gallica
    rendraient, et que le propriétaire seul peut ouvrir.
  lectures:
  - type: legifrance
    reference: >-
      arrêté du 9 février 2012 portant approbation du règlement du RCI, article 12
      (LEGIARTI000054891893, 2013 ; LEGIARTI000054896398, 26 juin 2024) et annexe 2
      (LEGIARTI000054892591, 2013 ; LEGIARTI000054907665, 26 juin 2024), même table
      aux deux dates, lus dans l'index LEGI du dépôt à jour au 11 octobre 2026
    date: 2026-10-14
  - type: circulaire_cnav
    reference: >-
      circulaire 2026-07 du 5 mars 2026, point 4.1.2 : un exemple chiffré, et le
      plafond de 12 % des générations nées depuis 1969, que douze trimestres d'âge
      séparent du taux plein
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2026_07_05032026.pdf
    date: 2026-10-14
  - type: jorf
    reference: >-
      arrêté du 15 décembre 1978 (JORFTEXT000000288049), arrêté du 30 novembre 1984
      (JORFTEXT000000862877, « tableau des taux d'abattement applicable aux droits
      acquis pour la liquidation d'une pension à l'âge de 60 ans », analyse seule),
      arrêté du 17 décembre 2004 (JORFTEXT000000810229, règlement annexé non publié),
      lus dans l'index JORF du dépôt à jour au 11 octobre 2026
    date: 2026-10-16
textes_a_rattacher:
- reference: arrêté du 9 février 2012, article 12 et annexe 2
- reference: L. 635-1 CSS
code:
  interrupteurs:
    abattement_points: agirc_arrco
  moteur: >-
    `abattement_points: agirc_arrco` (`liquider.abattement_points`) : le coefficient
    de la table des trimestres manquants et celui de la table des âges, le plus
    avantageux retenu, ce qui revient à compter le plus petit des deux décomptes ; la
    table des âges ne descend pas sous 0,78, vingt trimestres séparant au plus l'âge
    légal de l'âge d'annulation de la décote.
