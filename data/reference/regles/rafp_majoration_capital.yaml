approximations:
- version: [deliberation_2005, deliberation_2015, fractionnement_2019, fractionnement_2020,
            conversion_2022, fractionnement_2024]
  ecart: >-
    entre deux âges entiers, le coefficient de majoration se prend au prorata exact des
    mois, sans arrondi : ni les délibérations, ni les notes de l'ERAFP n'en disent ; son
    simulateur l'arrondit au centième (1,30 pour 1,2967 à 68 ans et 4 mois)
  effet: >-
    au plus un demi-centième du coefficient, soit 0,5 % de la rente ; 0,26 % et 0,32 %
    aux deux exemples en écart connu
- version: deliberation_2005
  ecart: >-
    au-delà de soixante-quinze ans, le barème de 2005 se continuait, à des valeurs que
    le rapport annuel ne publie pas : le modèle s'arrête à 2,08
  effet: non mesuré ; aucune liquidation du modèle n'y tombe
- ecart: >-
    le capital est montré comme la rente annuelle dont il est l'équivalent, et dit dans
    le détail de la pension, sa première fraction comprise ; la régularisation des
    droits connus après la liquidation, qui fait d'un capital une rente au-delà de 5 125
    points, n'est pas portée
  effet: la forme de la prestation, non son montant annuel ; non mesuré
- version: [fractionnement_2020, conversion_2022, fractionnement_2024]
  ecart: >-
    la date d'admission à la retraite de base, qui décide du fractionnement, est le
    départ que la personne déclare
  effet: non mesuré
- version: fractionnement_2024
  textes:
  - {id: LEGIARTI000049421944, article: "décret n° 2004-569, article 9-1", en_vigueur: 2024-04-17}
  ecart: >-
    le capital de qui a versé la cotisation exceptionnelle unique du II de l'article 76
    bis de la loi du 21 août 2003, que l'article 9-1 fractionne toujours sous 5 125
    points, quinze mois de rente puis le solde au seizième mois, n'est pas distingué :
    le modèle ne porte pas cette cotisation (fiche rafp_cotisation_volontaire_outre_mer)
  effet: non mesuré
sources:
  lu_le: 2026-10-04
  prochaine_relecture: 2027-03-31
  lectures_divergentes:
  - >-
    Le tableau « Valeurs des coefficients de majoration » que l'ERAFP publie à part,
    sans date, écrit 1,80 à 75 ans et plus ; la délibération du 5 février 2015, les
    rapports annuels 2014 et 2015 et le simulateur de prestation, 1,81. Aucune
    délibération lue depuis ne touche le barème (celles des 16 février et 13 décembre
    2016, 16 décembre 2021, 15 décembre 2022, 8 février et 12 décembre 2024, 16 décembre
    2025 ne fixent que les valeurs du point) : le modèle suit la délibération.
  - >-
    Le simulateur arrondit au centième le coefficient qu'il interpole au mois, ce
    qu'aucun texte ne dit (exemples erafp_1958_effet_2026_11_8000_points et
    erafp_1963_effet_2026_11_5000_points, en écart connu) ; le SNES, en 2014, écrivait
    1,105 à 62 ans et 6 mois, sans arrondir. Le modèle garde le prorata exact.
  - >-
    Le simulateur prête à un fonctionnaire né en 1958 un âge légal de 64 ans, quand
    L. 161-17-2 lui en donne 62 (exemple erafp_1958_effet_2026_11_8000_points).
  - >-
    La page « Calcul et paiement » écrit, pour un capital fractionné d'avant avril 2024,
    « (4 810 x 1,08 x 0,05593 / 12) x 15 = 368,25 € » : la valeur de service écrite
    donne 363,18 €, et le résultat est calculé à celle de 2026, 0,05671 €. L'exemple
    n'est pas retenu ; celui de Christine, au rapport annuel 2022, tient la même règle.
  a_relire:
  - >-
    Demander à l'ERAFP si ses liquidations arrondissent au centième le coefficient de
    majoration interpolé au mois, comme son simulateur, et si le 1,80 de son tableau
    est une coquille de la délibération du 5 février 2015.
  - >-
    La délibération du 10 novembre 2005 n'est pas publiée : son barème est lu au
    rapport annuel 2012 de l'ERAFP. La demander, avec la délibération n° 3 du 28 mars
    2019, que celle du 8 février 2024 rappelle.
