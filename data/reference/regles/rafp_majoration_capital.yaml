historique:
- >-
  2026-09-22 — née : le modèle servait la valeur de service nue à tout âge, 22 % de
  moins à 67 ans ; elle sert le barème par âge entier et le capital dans le détail.
- >-
  2026-10-04 — dix saisies du simulateur de l'ERAFP : il interpole au mois, arrondit au
  centième et retient 1,81 à 75 ans ; le moteur attend la délibération.
- >-
  2026-10-05 — lues : les délibérations du 5 février 2015 (barème, 1,81), du 16
  décembre 2021 (conversion) et sur le fractionnement (2019, 2020, 2024), le barème de
  2005 au rapport annuel 2012. Le moteur date ses barèmes, calcule au mois sans
  arrondir et dit le capital fractionné ; les dix saisies deviennent des exemples, et
  neuf calculs que l'ERAFP publie aussi.
- >-
  2026-10-05 — le barème de 2005 a ses premiers exemples : les trois prestations-types
  du rapport annuel 2012, à 62 et 67 ans en 2013, concordent, sauf le capital de Jean,
  imprimé 4 030,38 € pour un produit de 4 030,88 € (écart connu, coquille du rapport) ;
  et le capital unique de la page « Calcul et paiement », 6 965,93 € à 64 ans en 2026.
effet: >-
  Tout fonctionnaire qui touche son RAFP hors d'un âge entier, ou avant mars 2015 :
  jusqu'à 5,4 % de plus qu'au barème par âge entier, à 74 ans et 11 mois (1,8017 pour
  1,71), 3,6 % à 68 ans et 11 mois (1,3258 pour 1,28) ; 8 % de plus à 62 ans avant
  mars 2015 (1,08 pour 1,00). À 75 ans, 1,81 au lieu de 1,80. Le capital d'avant 2022
  baisse de 9 % (24,62 pour 27,11 à 62 ans) ; celui de 4 900 à 5 124 points se dit en
  deux fois.
