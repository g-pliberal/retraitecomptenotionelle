schema_version: 1
id: rafp_majoration_capital
intitule: >-
  RAFP : la valeur de service modulée par l'âge à la date d'effet, selon le barème
  actuariel du conseil d'administration de l'ERAFP — âge pivot à 60 ans jusqu'en
  février 2015, à 62 ans depuis, 1,81 dès 75 ans —, calculé au mois ; sous 5 125
  points, la prestation versée en capital, au coefficient de conversion de l'âge, en
  une fois, ou en deux près du seuil depuis mai 2019.
domaine: points
regimes: [rafp]
# L'étape qui l'applique est liquider_chaque_regime, mais la fiche ne la dit
# pas encore : la couche comptes_notionnels neutralise cette étape par son
# sélecteur et garde le RAFP par son nom, « servis à l'identique », et une pile
# refuse deux décisions sur la même fiche (noyau/univers.py). La dire attend
# qu'une couche sache excepter une fiche de son sélecteur.
face: droit
etat: approchee
lit:
- la date de naissance de l'assuré, et la date d'effet de sa retraite additionnelle
- les points acquis au RAFP, et la valeur de service de l'année
- la date d'effet de la pension de base, que le départ déclaré donne
ecrit:
- le coefficient de majoration de la retraite additionnelle
- la forme de la prestation, rente ou capital, et le capital avec sa première fraction
dates_qui_decident:
- liquidation.date_effet
# Le décret renvoie les deux barèmes au conseil d'administration, dont les
# délibérations deviennent exécutoires faute d'opposition du commissaire du
# Gouvernement dans le mois (article 27) : aucune n'est au Journal officiel.
# Les versions coupent la date d'effet aux changements de l'un des trois —
# majoration, conversion, fractionnement.
versions:
