code:
  interrupteurs:
    surcote_points: rafp
  moteur: >-
    `surcote_points: rafp` : le barème de majoration de la date d'effet, celui de 2005
    avant le 1er mars 2015, celui de 2015 depuis, au prorata des mois entre deux âges
    entiers (majoration_rafp) ; sous 5 125 points, prestation_rafp dit le capital, au
    barème de conversion de la date d'effet, et son fractionnement
    (fractionnement_rafp), la date de la pension de base étant le départ déclaré
    (mois_apres_le_depart).
  python: >-
