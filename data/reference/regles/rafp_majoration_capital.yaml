schema_version: 1
id: rafp_majoration_capital
intitule: >-
  RAFP : valeur de service modulée par l'âge de liquidation (1,00 à 62 ans jusqu'à
  1,80 à 75) ; prestation versée en capital sous 5 125 points, au coefficient de
  conversion de l'âge.
etat: approchee
effet: >-
  Le modèle servait la valeur de service nue à tout âge : 22 % de moins à 67 ans.
  Il sert maintenant la majoration par âge entier, et sous le seuil écrit le capital
  dans le détail de la pension ; le montant annuel reste celui de la rente équivalente.
  Le capital fractionné entre 4 900 et 5 124 points n'est pas distingué.
sources:
  lu_le: 2026-09-22
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Le simulateur de l'ERAFP interpole la majoration au mois, le barème publié
    ne le dit pas : obtenir la délibération du conseil d'administration (art. 8
    et 9 du décret lui renvoient le barème et le seuil du capital fractionné)
    avant de toucher au moteur, et dire d'où vient le 1,81 à 75 ans.
  lectures:
  - type: legifrance
    reference: >-
      article 8 : la valeur de service « est modulée en fonction de l'âge de liquidation
      » ; article 9 : « servie sous forme de capital lorsque le nombre de points
      acquis est inférieur à 5 125 »
    date: 2026-09-22
  - type: autre
    reference: >-
      ERAFP, « Valeurs des coefficients de majoration » et coefficients de conversion
      en capital au 1er janvier 2022 ; page « calcul et paiement de votre prestation
      » : 4 448 × 1,08 × 0,05671 × 25,57 = 6 965,93 €
    url: >-
      https://www.rafp.fr/actif/activite/calcul-et-paiement-votre-prestation-rafp
    date: 2026-09-22
  - type: autre
    reference: >-
      ERAFP, « Valeurs des coefficients de majoration » (PDF relu le 4 octobre
      2026) : par âge entier, « ≤ 62 ans 1,00 » … « ≥ 75 ans 1,80 », sans mot
      d'une interpolation.
    url: >-
      https://www.rafp.fr/sites/default/files/file/valeurs_des_coefficients_de_majoration.pdf
    date: 2026-10-04
  - type: autre
    reference: >-
      Simulateur de prestation de l'ERAFP, dix saisies (naissance ; effet ;
      points → coefficient, prestation) : 15/06/1964 ; 01/04/2027 ; 6000 →
      1,03, rente 29,21 €/mois. 01/07/2028 → 1,08, 30,62 €. 01/07/2031 →
      1,22, 34,59 €. 01/07/2039 → 1,81, 51,32 €. 15/06/1966 ; 01/04/2029 ;
      3000 → « date d'effet non atteinte » (âge légal 63 ans 3 mois).
      01/01/2031 ; 3000 → 1,10, conversion 25,18, capital 4 712,26 €.
      15/06/1970 ; 01/06/2034 ; 5124 → non atteinte (64 ans). 01/07/2034 ;
      5125 → 1,08, rente 26,16 €. 15/06/1958 ; 01/11/2026 ; 8000 → 1,30,
      rente 49,15 €. 15/06/1963 ; 01/11/2026 ; 5000 → 1,05, « capital
      fractionné », première fraction 99,24 €. Valeur de service 0,05671 €.
      Le modèle aurait dit 1,00, 1,08, 1,22, 1,80, —, 1,08, —, 1,08, 1,28,
      1,04 ; la conversion en capital au mois concorde.
    url: >-
      https://www.rafp.fr/actif/futur-retraite/simulateur-prestation
    date: 2026-10-04
textes_a_rattacher:
- reference: décret n° 2004-569, article 8 (LEGIARTI000037483754)
- reference: décret n° 2004-569, article 9 (LEGIARTI000037483756)
code:
  interrupteurs:
    surcote_points: rafp
  moteur: >-
    `surcote_points: rafp` : le barème actuariel de l'ERAFP, un coefficient par âge entier
    à la date d'effet, de 1,00 à 62 ans à 1,80 à 75 (décret n° 2004-569, art. 8), sans
    taux par trimestre.
