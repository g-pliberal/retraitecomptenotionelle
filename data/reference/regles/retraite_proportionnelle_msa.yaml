schema_version: 1
id: retraite_proportionnelle_msa
intitule: >-
  Retraite proportionnelle des non-salariés agricoles : depuis 1990, des points par année
  selon le revenu retenu pour la cotisation, quinze jusqu'à 400 SMIC horaires, une pente
  jusqu'à trente à 800 SMIC, trente jusqu'à deux fois le minimum contributif, puis une
  pente jusqu'au maximum M au plafond, arrondis à l'entier le plus proche ; pour les
  pensions prenant effet depuis 2026, les points d'avant 2016 ne comptent plus que par la
  moyenne des meilleures années. Seize points par an au moins pour les pensions de 1994 à
  2025 ; le collaborateur et l'aide familial cotisent sur un forfait de 400 SMIC depuis
  2004 ; le chef à titre secondaire n'a, avant 2026, que cette retraite, sans la
  forfaitaire.
etat: approchee
etape: acquerir_les_droits
effet: >-
  Les chefs d'exploitation, pour leurs années depuis 1990. Le barème du moteur est celui
  que le décret n° 80-808, puis R. 732-70 et R. 732-71, écrivent depuis 1990, points
  arrondis à l'entier le plus proche — 23 au plancher de 600 SMIC —, à un écart près pour
  les pensions d'avant 2026. Il calcule le maximum M avec l'allocation aux vieux
  travailleurs salariés au 1er janvier de l'année, comme R. 732-70 l'écrit, au lieu de la
  retraite forfaitaire figée depuis 2014 (le 14 octobre 2026, étape 138.6) : 113 points au
  plafond en 2025, l'échelle « comprise entre 23 et 113 points » que publie la MSA, au
  lieu de 115. Pour les pensions prenant effet depuis le 1er janvier 2026, ces points ne
  comptent plus que par la réforme de L. 732-24 : ceux d'avant 2016 par la moyenne des
  meilleures années, multipliée par le nombre d'années — dans l'exemple de la MSA, 682
  points au lieu des 633 de la somme —, ceux de 2016 à 2027 dans le seul calcul
  provisoire des pensions de 2026 et 2027 ; le moteur le fait depuis le 28 septembre
  2026, voir la fiche pension_non_salaries_agricoles_2026. Depuis le 16 octobre 2026
  (étape 138.8) : le plancher de seize points de R. 732-73, pour les pensions de 1994 à
  2025 ; le collaborateur et l'aide familial cotisent sur 400 SMIC horaires depuis 2004
  (D. 731-123), 600 depuis 2026, et non sur leur revenu — seize points par an, quel que
  soit le revenu saisi —, et le revenu de leurs années depuis 2016, au 1° de L. 732-24, est
  ce forfait ; le chef à titre secondaire n'a, pour une pension d'avant 2026, que la
  retraite proportionnelle (L. 732-28), le forfait ne comptant pas ses années, sauf à qui
  était non-salarié agricole avant 1981 (R. 732-65). Le salarié de 1958, chef à côté
  depuis ses trente ans et parti en 2024, perd ainsi son forfait, qui faisait l'essentiel
  des 4 900 € que le modèle lui servait. Depuis le 17 octobre 2026 (action 131), l'année
  où l'exploitant cesse lui vaut les points d'une année : il la cotise entière (L.
  731-10-1), sur un revenu annuel (L. 731-15), que le moteur prend du revenu de ses mois
  porté à douze ; elle ne valait que ses mois, au barème lu sur leur seul revenu — sept
  douzièmes de 23 points, et non 30, pour le chef à 12 000 € par an parti le 1er août
  2024. Depuis le 18 octobre 2026, l'année où il s'installe après le 1er janvier ne lui
  vaut aucun point : il n'y doit rien (R. 731-57, L. 731-10-1 ; voir la fiche
  taux_plein_et_proratisation). Depuis le même jour, toute année où il cesse, et non la
  seule de son départ, lui vaut les points d'une année, dans le statut du 1er janvier :
  le statut pris en cours d'année, de collaborateur à chef ou l'inverse, n'y a aucun
  point, et le chef parti le 1er août 2024, collaborateur depuis avril, a les 30 points
  de son année de chef, et non 16,43 que ses deux lignes se partageaient.
sources:
  lu_le: 2026-10-18
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    L'année que R. 731-83 fait cotiser au prorata, jusqu'au premier jour du mois qui
    suit la cessation, qui quitte l'agriculture pour un autre métier : R. 732-70 et
    R. 732-71 en donnent les points « pour l'année au titre de laquelle [les cotisations]
    sont dues », en fonction des revenus professionnels, sans dire l'année au prorata.
    Le moteur les compte sur le revenu de ses mois, pour ses mois. La pratique de la MSA
    n'est pas lue (relu le 18 octobre 2026) : une source à demander à la caisse.
  - >-
    Le chef à titre secondaire des pensions prenant effet depuis 2026 : la loi n° 2025-199
    abroge L. 732-28, et le décret n° 2025-1409 R. 732-65 pour ces pensions ; la part a du
    2° de L. 732-24 compte « la durée d'activité accomplie dans le régime » avant 2016, et
    le modèle y garde les années de chef à titre secondaire. Chercher ce qu'en fait la MSA
    (circulaire de la réforme, ou sa page « 25 meilleures années »).
  - >-
    L. 732-28 ne vise que l'activité accessoire d'un salarié ; le modèle écarte du forfait
    toute année de chef à titre secondaire, comme la MSA, qui ne sert le forfait qu'à
    « l'activité non-salariée agricole exercée à titre exclusif ou principal ». Le décret
    qui définit le titre secondaire face à une autre activité non salariée reste à lire.
  - >-
    Le collaborateur d'avant 2004 : sa cotisation se prenait des revenus du chef (L.
    731-42, 2°, rédaction de 2000), et l'aide familial d'avant 1999 cotisait déjà au b du
    2° ; le conjoint participant aux travaux n'avait que la forfaitaire (L. 732-34). Le
    modèle, qui ne distingue pas ces qualités, garde le revenu saisi avant 2004.
  - >-
    R. 732-70 ne dit pas à quelle date lire l'AVTS : le modèle prend, depuis le 14 octobre
    2026, le montant en vigueur au 1er janvier de l'année (pension_minimum_avant_1983.csv,
    du barème de la Cnav), comme le minimum contributif de R. 732-71.
  - >-
    R. 732-71 ne dit pas à quelle date lire « l'intégralité du montant annuel minimal non
    majoré de pension garanti en application de l'article L. 351-10 » (MC) : le modèle
    prend, depuis le 4 octobre 2026, le montant en vigueur au 1er janvier de l'année,
    que le dépôt porte désormais à chaque date de revalorisation (fiche
    minimum_contributif). Lire l'instruction de la caisse centrale de la MSA qui le fixe.
  lectures:
  - type: legifrance
    reference: >-
      code de la sécurité sociale, R. 173-3-2, rédaction du 1er août 2026
      (LEGIARTI000054589934, décret n° 2026-699, pensions prenant effet à compter du 1er
      septembre 2026) : « Le nombre d'années retenu dans les régimes mentionnés à l'article
      L. 173-1-2 et le régime des personnes non salariées des professions agricoles pour
      déterminer le salaire moyen, le revenu moyen ou le nombre de points annuel moyen
      servant au calcul de la pension est égal à vingt-cinq » ; le II le répartit « au
      prorata des durées d'assurance », dans le régime agricole entre les périodes
      antérieures au 1er janvier 2016 et celles qui courent depuis, les nombres étant
      « arrondis à chaque étape à l'entier non nul le plus proche ». Lu dans l'index LEGI du
      dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      décret n° 80-808 du 14 octobre 1980, article 8-1 (LEGIARTI000006769212, du 21
      septembre 1990 au 18 septembre 1991 ; LEGIARTI000006769213, jusqu'au 25 août 2004 ;
      LEGIARTI000006769214, jusqu'au 22 avril 2005) : « A compter du 1er janvier 1990, le
      versement de la cotisation visée au b de l'article 1123 du code rural donne droit,
      pour l'année au titre de laquelle elle est due, à un nombre de points » ; le barème
      et l'arrondi sont ceux que R. 732-70 et R. 732-71 reprennent en 2005. Lu dans l'index
      LEGI du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      R. 732-70 (LEGIARTI000006597479, du 22 avril 2005 au 3 juin 2011 ;
      LEGIARTI000024113180, du 3 juin 2011 au 1er janvier 2026) : « Le nombre de points est
      compris entre un minimum fixé à 15 et un maximum M », « M = PM-AVTS/37,5 x VP », PM
      étant « le montant maximal de la pension de vieillesse du régime général de la
      sécurité sociale », liquidable « à soixante-cinq ans » puis « à l'âge prévu à
      l'article L. 732-25 », et AVTS « le montant de l'allocation aux vieux travailleurs
      salariés ». Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      R. 732-71 (LEGIARTI000006597480, du 22 avril 2005 au 28 octobre 2017 ;
      LEGIARTI000035918339, du 28 octobre 2017 au 1er janvier 2026) : 15 points « au plus
      égal à quatre cents fois le taux horaire du salaire minimum de croissance », « P = 15
      + 15 x (R-400 SMIC/400 SMIC) » jusqu'à huit cents fois, 30 jusqu'à « deux fois
      l'intégralité du montant annuel minimal non majoré de pension garanti », puis « P =
      30 + (M-30) x (R-2 MC/ PL-2 MC) » jusqu'à douze fois le plafond mensuel ; R est « le
      montant des revenus professionnels retenus en vue du calcul des cotisations » ; « Le
      nombre de points résultant de l'application des formules énoncées ci-dessus est
      arrondi au nombre entier le plus proche », et les grandeurs sont « ceux en vigueur au
      1er janvier de l'année considérée ». Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      R. 732-66 (LEGIARTI000006597474, du 22 avril 2005 au 8 septembre 2007 ;
      LEGIARTI000006597475, jusqu'au 28 octobre 2017 ; LEGIARTI000035918379, jusqu'au 1er
      janvier 2026) : la retraite proportionnelle est « le produit du nombre total de
      points acquis par l'assuré [...] par la valeur du point de retraite proportionnelle
      auquel est appliqué le rapport de trente-sept et demi sur » la durée de la
      génération, que R. 732-61 (LEGIARTI000035918397) fixe « à 37,5 années pour l'assuré
      né avant le 1er janvier 1944 », de 38 à 40 années de 1944 à 1948, puis à la durée
      du régime général. Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: jorf
    reference: >-
      décret n° 2025-1409 du 30 décembre 2025 (JORFTEXT000053227462, Journal officiel du 31
      décembre 2025), article 1, I, 6° : « Sont abrogés : [...] b) Les articles [...] R.
      732-69 à D. 732-77 » ; II : « Le b du 6° [...] s'appliquent aux pensions et aux
      allocations prenant effet à compter du 1er janvier 2026 » ; article 6
      (JORFARTI000053227599) : la section 3, « dans leur rédaction antérieure au présent
      décret, continuent de s'appliquer aux pensions [...] prenant effet entre le 1er
      janvier 2026 et le 31 décembre 2027 ». Lu dans l'index JORF du dépôt ; l'index LEGI
      clôt les deux articles au 1er janvier 2026, sans rédaction nouvelle
    date: 2026-09-27
  - type: jorf
    reference: >-
      loi n° 2025-199 du 28 février 2025, article 87, VIII, B (JORFARTI000051269910) : «
      Toutefois, pour les pensions prenant effet à compter du 1er janvier 2026, les
      pensions de retraite proportionnelle [...] dues au titre des périodes d'assurance
      antérieures à 2016 sont liquidées dans les conditions prévues au b du 2° du I du même
      article L. 732-24 » ; « au plus tard le 31 mars 2028, les pensions mentionnées au
      premier alinéa du présent B font l'objet d'un nouveau calcul », révisées s'il est
      supérieur. Lu dans l'index JORF du dépôt
    date: 2026-09-27
  - type: legifrance
    reference: >-
      R. 732-66 depuis 2026 (LEGIARTI000053336689, du 1er janvier au 9 mai 2026 ;
      LEGIARTI000054059787, rédaction du décret n° 2026-346 du 7 mai 2026) : la part
      d'avant 2016 est « le produit de la moyenne [...] du nombre de points annuels
      attribués à l'assuré en matière de retraite proportionnelle en application des
      articles R. 732-69 à R. 732-77 [...] dans leur rédaction antérieure au décret n°
      2025-1409 [...], du quart du nombre de trimestres mentionné au III et de la valeur du
      point », la moyenne portant sur les années « dont la prise en considération est la
      plus avantageuse pour l'assuré », « arrondi à l'entier le plus proche » ; L. 732-24,
      I (LEGIARTI000053280317) : « 1° Un montant calculé dans les conditions prévues à
      l'article L. 732-18 du présent code sur les bases des seuls revenus des années à
      compter du 1er janvier 2016 », L. 732-18 (LEGIARTI000051289367) y remplaçant le «
      salaire annuel de base » par le « revenu annuel moyen ». Lu dans l'index LEGI du dépôt
    date: 2026-09-27
  - type: jorf
    reference: >-
      décret n° 2025-1410 du 30 décembre 2025, article 13 (JORFARTI000053227751) : « le
      nombre de points acquis au titre des périodes d'assurance comprises entre 2026 et
      2027 [...] est déterminé dans les conditions fixées à l'article R. 732-71 du même
      code dans sa rédaction antérieure au décret n° 2025-1409 du 30 décembre 2025 » ; «
      La date prévue au B du VIII du même article 87 [...] est fixée au 31 mars 2028 ». Lu
      dans l'index JORF du dépôt
    date: 2026-09-27
  - type: autre
    reference: >-
      MSA, « Réforme de la retraite des exploitants : 25 meilleures années », mis à jour le
      27 avril 2026, question 7 : pour les chefs, « le nombre de points dépendait
      directement des revenus, sur une échelle comprise entre 23 et 113 points » ; page 3,
      un assuré de 1994 à 2015 : « TOTAL 22 ans 633 pts » à l'ancien calcul, puis « 403 pts
      / 13 ans = 31 pts » et « 31 pts x 22 ans = 682 pts » ; « pour les départs en retraite
      en 2026 et 2027, le calcul est hybride et provisoire »
    url: https://www.msa.fr/lfp/retraite/reforme-exploitants-25-meilleures-annees
    date: 2026-09-27
  - type: autre
    reference: >-
      MSA, « La retraite des non-salariés agricoles », mis à jour le 17 août 2026 : «
      Nombre de points X Valeur du point X (Durée d'assurance de 37,5 ans / Durée
      d'assurance fixée en fonction de l'année de naissance) » pour les pensions prenant
      effet jusqu'au 31 décembre 2025 ; « Pour les pensions prenant effet en 2026 ou en
      2027 », une part proportionnelle « déterminée par les meilleures années de points de
      retraite proportionnelle pour les années antérieures à 2016 et les points acquis à
      compter de 2016 »
    url: https://www.msa.fr/lfp/retraite/non-salaries-agricoles
    date: 2026-09-27
  - type: legifrance
    reference: >-
      code rural et de la pêche maritime, R. 732-73 (LEGIARTI000006597482, du 22 avril
      2005 au 1er janvier 2026) : « Pour le calcul des retraites proportionnelles prenant
      effet postérieurement au 31 décembre 1993, le nombre de points acquis chaque année
      par les intéressés en application des articles R. 732-69 à R. 732-72 ne peut être
      inférieur à seize » ; abrogé, avec R. 732-69 à D. 732-77 et R. 732-65, pour les
      pensions prenant effet depuis le 1er janvier 2026 (décret n° 2025-1409, article 1, I,
      6° b et II, JORFARTI000053227477). Lu dans les index LEGI et JORF du dépôt
    date: 2026-10-16
  - type: legifrance
    reference: >-
      code rural et de la pêche maritime, D. 731-123 (LEGIARTI000006597345, « Pour l'année
      2004 » ; LEGIARTI000019506723 ; LEGIARTI000026140073, du 4 juillet 2012 au 1er
      janvier 2026) : « Les cotisations prévues au b du 2° de l'article L. 731-42 au titre
      du collaborateur d'exploitation ou d'entreprise agricole au sens de l'article L.
      321-5 et de l'aide familial au sens du 2° de l'article L. 722-10 sont assises sur
      l'assiette minimale prévue à l'article D. 731-120 » ; D. 731-120, 3°
      (LEGIARTI000028393446) : « 400 fois le montant du salaire minimum de croissance [...]
      pour les cotisations mentionnées au 2° b) » ; depuis 2026 (LEGIARTI000053296672) : «
      L'assiette forfaitaire de la cotisation prévue au 2° de l'article L. 731-42 est
      égale à l'assiette minimale prévue à l'article D. 731-120 », 600 SMIC. L. 731-42,
      rédaction du 1er janvier 2004 (LEGIARTI000006585488) : au b du 2°, « l'assiette de
      ces cotisations est déterminée forfaitairement » ; rédaction de 2000
      (LEGIARTI000006585486) : la cotisation du conjoint collaborateur se calcule « en
      pourcentage des revenus professionnels du chef d'exploitation ». Lu dans l'index
      LEGI du dépôt
    date: 2026-10-16
  - type: legifrance
    reference: >-
      code rural et de la pêche maritime, L. 732-28 (LEGIARTI000006585555,
      LEGIARTI000006585556, jusqu'au 1er janvier 2026), et avant lui l'article 1121-1 de
      l'ancien code (LEGIARTI000006581013, depuis le 5 juillet 1980) : « Les personnes
      ayant exercé, concurremment avec une activité salariée, une activité agricole non
      salariée ne présentant qu'un caractère accessoire peuvent seulement prétendre à la
      pension de retraite proportionnelle » ; L. 731-42, 1° (LEGIARTI000023034860) : la
      cotisation de la forfaitaire est due « pour chaque personne non salariée [...] à
      l'exception des personnes mentionnées à l'article L. 732-28 » ; R. 732-65
      (LEGIARTI000006597473) : celles « qui ont exercé une activité non salariée agricole
      antérieurement au 1er janvier 1981, bénéficient, en plus de la retraite
      proportionnelle, d'une retraite forfaitaire », déjà au décret n° 80-808, article 12
      (LEGIARTI000006769225). Lu dans l'index LEGI du dépôt
    date: 2026-10-16
  - type: autre
    reference: >-
      MSA, « La retraite des non-salariés agricoles », lue le 16 octobre 2026 : la
      retraite forfaitaire est un « montant forfaitaire dépendant de l'activité
      non-salariée agricole exercée à titre exclusif ou principal »
    url: https://www.msa.fr/lfp/retraite/non-salaries-agricoles
    date: 2026-10-16
  - type: legifrance
    reference: >-
      code rural et de la pêche maritime, R. 732-70 (LEGIARTI000024113180) : la cotisation
      donne droit, « pour l'année au titre de laquelle [elle est] due, à un nombre de
      points qui est fonction du montant des revenus professionnels » ; L. 731-10-1
      (LEGIARTI000019950453) : « En cas de cessation d'activité au cours d'une année
      civile, le chef d'exploitation ou d'entreprise agricole est tenu au paiement des
      cotisations [...] au titre de l'année civile entière » ; L. 731-15
      (LEGIARTI000037988682, LEGIARTI000048683906) : les cotisations sont calculées « sur
      la moyenne des revenus professionnels [...] se rapportant aux trois années
      antérieures à celle au titre de laquelle les cotisations sont dues ». Lu dans
      l'index LEGI du dépôt
    date: 2026-10-17
  - type: autre
    reference: >-
      Assemblée nationale, question écrite n° 96453, réponse du ministre de l'agriculture
      publiée au Journal officiel le 26 juillet 2016 (page 6956) : l'annualité de L.
      731-10-1 rend l'exploitant « redevable de la totalité des cotisations » l'année de
      sa cessation, et sa remise en cause aurait des « effets négatifs [...] sur le calcul
      des droits à retraite » ; au décès, le conjoint survivant peut garder l'annualité
      des cotisations d'assurance vieillesse « afin de préserver les avantages prévus
      actuellement en matière de retraite »
    url: https://www.assemblee-nationale.fr/dyn/14/questions/QANR5L14QE96453
    date: 2026-10-17
