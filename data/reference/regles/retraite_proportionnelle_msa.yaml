schema_version: 1
id: retraite_proportionnelle_msa
intitule: >-
  Retraite proportionnelle des non-salariés agricoles : depuis 1990, des points par année
  selon le revenu retenu pour la cotisation, quinze jusqu'à 400 SMIC horaires, une pente
  jusqu'à trente à 800 SMIC, trente jusqu'à deux fois le minimum contributif, puis une
  pente jusqu'au maximum M au plafond, arrondis à l'entier le plus proche ; pour les
  pensions prenant effet depuis 2026, les points d'avant 2016 ne comptent plus que par la
  moyenne des meilleures années. Seize points par an au moins pour les pensions de 1994 à
  2025 ; le collaborateur et l'aide familial cotisent sur un forfait de 400 SMIC depuis
  2004 ; le chef à titre secondaire n'a, avant 2026, que cette retraite, sans la
  forfaitaire. Pour les pensions prises du 1er juillet 1986 au 31 décembre 2025, les
  points acquis comme chef de 1952 à 1972 se majorent d'un taux que fixe leur nombre
  annuel moyen (décret n° 86-1084, article 2, puis D. 732-77).
regimes: [msa_non_salaries]
etat: approchee
etape: acquerir_les_droits
effet: >-
  Les chefs d'exploitation, pour leurs années depuis 1990. Le barème du moteur est celui
  que le décret n° 80-808, puis R. 732-70 et R. 732-71, écrivent depuis 1990, points
  arrondis à l'entier le plus proche — 23 au plancher de 600 SMIC —, à un écart près pour
  les pensions d'avant 2026. Il calcule le maximum M avec l'allocation aux vieux
  travailleurs salariés au 1er janvier de l'année, comme R. 732-70 l'écrit, au lieu de la
  retraite forfaitaire figée depuis 2014 (le 14 octobre 2026, étape 138.6) : 113 points au
  plafond en 2025, l'échelle « comprise entre 23 et 113 points » que publie la MSA, au
  lieu de 115. Pour les pensions prenant effet depuis le 1er janvier 2026, ces points ne
  comptent plus que par la réforme de L. 732-24 : ceux d'avant 2016 par la moyenne des
  meilleures années, multipliée par le nombre d'années — dans l'exemple de la MSA, 682
  points au lieu des 633 de la somme —, ceux de 2016 à 2027 dans le seul calcul
  provisoire des pensions de 2026 et 2027 ; le moteur le fait depuis le 28 septembre
  2026, voir la fiche pension_non_salaries_agricoles_2026. Depuis le 16 octobre 2026
  (étape 138.8) : le plancher de seize points de R. 732-73, pour les pensions de 1994 à
  2025 ; le collaborateur et l'aide familial cotisent sur 400 SMIC horaires depuis 2004
  (D. 731-123), 600 depuis 2026, et non sur leur revenu — seize points par an, quel que
  soit le revenu saisi —, et le revenu de leurs années depuis 2016, au 1° de L. 732-24, est
  ce forfait ; le chef à titre secondaire n'a, pour une pension d'avant 2026, que la
  retraite proportionnelle (L. 732-28), le forfait ne comptant pas ses années, sauf à qui
  était non-salarié agricole avant 1981 (R. 732-65). Le salarié de 1958, chef à côté
  depuis ses trente ans et parti en 2024, perd ainsi son forfait, qui faisait l'essentiel
  des 4 900 € que le modèle lui servait. Depuis le 17 octobre 2026 (action 131), l'année
  où l'exploitant cesse lui vaut les points d'une année : il la cotise entière (L.
  731-10-1), sur un revenu annuel (L. 731-15), que le moteur prend du revenu de ses mois
  porté à douze ; elle ne valait que ses mois, au barème lu sur leur seul revenu — sept
  douzièmes de 23 points, et non 30, pour le chef à 12 000 € par an parti le 1er août
  2024. Depuis le 18 octobre 2026, l'année où il s'installe après le 1er janvier ne lui
  vaut aucun point : il n'y doit rien (R. 731-57, L. 731-10-1 ; voir la fiche
  taux_plein_et_proratisation). Depuis le même jour, toute année où il cesse, et non la
  seule de son départ, lui vaut les points d'une année, dans le statut du 1er janvier :
  le statut pris en cours d'année, de collaborateur à chef ou l'inverse, n'y a aucun
  point, et le chef parti le 1er août 2024, collaborateur depuis avril, a les 30 points
  de son année de chef, et non 16,43 que ses deux lignes se partageaient. Depuis le
  19 octobre 2026, l'année du décès du chef, qu'il cotise au prorata depuis 2009
  (L. 731-10-1), ne lui vaut que les points d'une année au prorata, comme celle de
  R. 731-83, dans la pension qu'il « eût obtenue » : mort le 15 août 2024 à 12 000 € par
  an, sa carrière arrêtée au 1er juillet, 9,5 points, et non 30. Depuis le 3 novembre
  2026 (action 131), les points de chef de 1952 à 1972 des pensions prises du 1er juillet
  1986 au 31 décembre 2025 se majorent : 5 % de 15 à 19,51 points annuels moyens,
  3,19 P - 57,23 % jusqu'à 27,34, 1,93 P - 22,74 % au-delà, 45 % au plus, rien sous
  quinze ; le moteur, qui n'a pas le barème d'avant 1990, compte ces points par le
  rendement de leurs cotisations, à la valeur de service de la fiche, comme pour les
  pensions prises depuis 2026, et majore du taux la pension qu'elles valent. Les trois
  témoins de chef nés en 1925, 1935 et 1945, partis en 1989, 1999 et 2009, y gagnent
  46,75 €, 47,76 € et 106,36 € par an, en euros de leur départ (5 %, 5 % et 16,00 %),
  +1,06 %, +0,62 % et +0,75 % de leur pension de base. La majoration de 17 % de
  D. 732-76 (du 22 avril 2005 au 1er janvier 2026), que la DILA rattache à l'article 2
  du décret n° 81-790, n'est pas appliquée : voir a_relire.
sources:
  lu_le: 2026-11-03
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    QUESTION AU PROPRIÉTAIRE (3 novembre 2026). D. 732-76 (LEGIARTI000006597490, du
    22 avril 2005 au 1er janvier 2026) majore « de 17 % » les mêmes points de chef de
    1952 à 1972 « lorsque le nombre annuel moyen de points acquis par les intéressés au
    cours de ladite période est au moins égal à seize », sans date de pension ; D. 732-77
    les majore de son barème, sans date non plus. Aucun texte lu ne dit si les deux se
    cumulent, ni comment (taux ajoutés ou majorations successives), ni si D. 732-76 ne
    valait que pour des pensions d'avant juillet 1986. Leurs sources ont coexisté : le
    décret n° 2005-368 abroge le même jour le décret n° 81-790, source de D. 732-76 selon
    les liens de la DILA (article 3, 65°), et le décret n° 86-1084 « à l'exception des
    articles 3 et 4 » (78°) ; le texte du décret n° 81-790 n'est qu'au fac-similé du
    Journal officiel du 20 août 1981 (notice JORFTEXT000000335107 : « relèvement
    exceptionnel des retraites proportionnelles [...] à compter du 01-07-1981 »).
    R. 732-67 renvoie aux deux pour les pensions prises depuis 2026. Le moteur
    n'applique que D. 732-77, que chaque lecture impose pour les pensions prises depuis
    le 1er juillet 1986 : s'il fallait aussi D. 732-76, la pension des chefs à seize
    points de moyenne ou plus serait sous-estimée. À lire : le décret n° 81-790 au
    fac-similé, et une circulaire ou un barème de la MSA qui applique les deux.
  - >-
    La moyenne P de D. 732-77, « le nombre annuel moyen de points acquis par l'assuré
    au cours de la période » : le texte ne dit pas sur combien d'années la compter. Le
    moteur la compte sur les années de chef de la période qui ont des points, comme pour
    les pensions prises depuis 2026, et, faute du barème d'avant 1990 (R. 732-69 dans sa
    rédaction de 2005 : en revenu cadastral, que le modèle n'a pas, « pour les années 1981
    et suivantes » ; pour les « années antérieures à 1981 », les décrets n° 65-346,
    67-570, 74-443 et 75-97, dont l'index de la DILA n'a que les notices des n° 67-570 et
    74-443), donne à chaque année les
    points que vaut le rendement estimé de sa cotisation à la valeur de service de la
    fiche, 4,589 € de 2025 ramenés aux prix du départ, au rapport de durée de R. 732-66
    depuis 1990 ; la période de 1986 à 1989 de la fiche du régime porte cette valeur pour
    ce seul compte. Le relevé de la MSA, qui porte les points de chaque année, ou le
    barème lu, la remplaceraient.
  - >-
    D. 732-77 ne dit pas le taux à 19,51 points tout juste, que son 1° (« compris entre
    15 et 19,51 ») et son 2° (« compris entre 19,51 et 27,34 ») comprennent tous deux : le
    moteur y donne 5 %, le 1° ; la formule du 2° y donnerait 5,0069 %. Sa codification
    place la formule « T % = 3,19 x P - 57,23 » au troisième alinéa, sous le 1°, et la
    seconde au cinquième, sous le 2° : le moteur suit sa source, l'article 2 du décret
    n° 86-1084 (« Dans le premier cas » et « Dans le second cas » du 2°), et R. 732-67,
    qui lit ainsi les deux alinéas pour les pensions de 2026 ; les bornes que le texte
    donne au 2° (« 5 à 30 % et de 30 à 45 % ») sont celles des deux formules à 19,51,
    27,34 et 35,10 points. Le plafond de 45 % est celui de ce 2°.
  - >-
    Les années pour lesquelles le décret n° 68-571 accordait des points supplémentaires,
    que l'article 2 du décret n° 86-1084 exclut de la majoration avec leurs points, pour
    les pensions prises jusqu'au 22 avril 2005 ; D. 732-77 ne le dit plus. Le modèle ne
    les connaît pas : le décret n° 68-571 n'est qu'au fac-similé.
  - >-
    Les points de 1952. La période de D. 732-77 et de l'article 2 du décret n° 86-1084
    s'ouvre le jour où naît le régime, « la date de création du régime d'assurance
    vieillesse des professions non salariées agricoles, à savoir le 1er juillet 1952 pour
    la métropole » (décret n° 99-875, article 2, LEGIARTI000006779656) : aucun point du
    régime ne la précède, et la borne n'en exclut aucun. Mais l'exercice 1952 n'a
    qu'une demi-année : « Pour l'exercice 1952, les cotisations professionnelles visées
    aux articles 20 et 21 de la loi du 10 juillet 1952 sont égales à la moitié des
    cotisations annuelles » (décret n° 52-1166, article 45, LEGIARTI000019272803). Aucun
    texte lu ne dit les points que valait cette demi-année — ils relèvent des décrets
    auxquels R. 732-69 renvoie pour les années antérieures à 1981, non lus, et la loi
    n° 52-799 n'est à l'index JORF que par sa notice —, ni si la moyenne P la compte
    pour une année ou pour une demie. Le modèle, par convention, compte 1952 comme les
    autres années : la cotisation de l'année entière, et une année dans P, ici comme
    dans le reste de la pension proportionnelle. Effet au plus, pour les seuls chefs de
    1952, si 1952 ne valait que la moitié de sa cotisation : T fois la pension que vaut
    cette moitié, 45 % au plus, et le déplacement de P qu'elle fait, qui peut faire
    passer un seuil du barème au chef de peu d'années. Pour le témoin de chef né en
    1925, parti en février 1989, chef de 1952 à 1972 : 46,75 € de majoration au modèle
    (P = 18,00, 5 %), 46,13 € à la moitié de la cotisation de 1952, comptée pour une
    année ou pour une demie (P = 17,76 ou 18,19), le taux restant de 5 % : 0,63 € par an
    au plus, en euros de son départ. Dans le reste de sa pension proportionnelle, cette
    moitié vaut 12,52 € par an.
  - >-
    L'arrondi, pour les pensions prises de juillet 1986 à 2025 : ni D. 732-77 ni
    l'article 2 du décret n° 86-1084 ne disent s'il faut arrondir le taux T, que leurs
    formules donnent à plusieurs décimales, ni le nombre de points majorés ; R. 732-67
    n'arrondit « aux entiers supérieurs » que les « nombres de points annuels » des
    pensions prises depuis 2026. Le modèle, par convention, n'arrondit ni l'un ni
    l'autre. Effet au plus : un taux arrondi au centième de point déplacerait la
    majoration de 0,005 % au plus de la pension que valent les années de la période, et
    au point entier de 0,5 % au plus — rien pour les témoins partis en 1989 et 1999, à
    5 %, 0,01 € pour celui de 2009, à 15,9985 % ; un total de points majorés arrondi à
    l'entier, d'un point au plus, une valeur de service (2,47 €, 2,98 € et 3,45 € pour
    les trois témoins, 4,589 € au plus en 2025) ; chaque année arrondie à l'entier
    supérieur, comme depuis 2026, d'un point au plus par année de chef de la période,
    soit 21, 17 et 7 points pour les trois témoins.
  - >-
    Les pensions prises avant le 1er juillet 1986 : l'article 3 du décret n° 86-1084
    (LEGIARTI000006769406, en vigueur) majore leur nombre total de points, de 2 % entre
    400 et 500 points à 280 points au plus au-delà de 1 000 ; le décret n° 81-790, au
    seul fac-similé, porte selon sa notice « relèvement exceptionnel des retraites
    proportionnelles » à compter du 1er juillet 1981. Le moteur n'applique ni l'un ni
    l'autre.
  - >-
    L'année que R. 731-83 fait cotiser au prorata, jusqu'au premier jour du mois qui
    suit la cessation, qui quitte l'agriculture pour un autre métier : R. 732-70 et
    R. 732-71 en donnent les points « pour l'année au titre de laquelle [les cotisations]
    sont dues », en fonction des revenus professionnels, sans dire l'année au prorata.
    Le moteur les compte sur le revenu de ses mois, pour ses mois. La pratique de la MSA
    n'est pas lue (relu le 18 octobre 2026) : une source à demander à la caisse. De même
    l'année du décès du chef, que L. 731-10-1 fait cotiser au prorata depuis 2009 : la
    réponse à la question écrite n° 96453 (2016) laisse au conjoint survivant l'option
    pour l'année entière « afin de préserver les avantages » de retraite, sans dire ce que
    le prorata en retire (relu le 19 octobre 2026).
  - >-
    Le chef à titre secondaire des pensions prenant effet depuis 2026 : la loi n° 2025-199
    abroge L. 732-28, et le décret n° 2025-1409 R. 732-65 pour ces pensions ; la part a du
    2° de L. 732-24 compte « la durée d'activité accomplie dans le régime » avant 2016, et
    le modèle y garde les années de chef à titre secondaire. Chercher ce qu'en fait la MSA
    (circulaire de la réforme, ou sa page « 25 meilleures années »).
  - >-
    L. 732-28 ne vise que l'activité accessoire d'un salarié ; le modèle écarte du forfait
    toute année de chef à titre secondaire, comme la MSA, qui ne sert le forfait qu'à
    « l'activité non-salariée agricole exercée à titre exclusif ou principal ». Le décret
    qui définit le titre secondaire face à une autre activité non salariée reste à lire.
  - >-
    Le collaborateur d'avant 2004 : sa cotisation se prenait des revenus du chef (L.
    731-42, 2°, rédaction de 2000), et l'aide familial d'avant 1999 cotisait déjà au b du
    2° ; le conjoint participant aux travaux n'avait que la forfaitaire (L. 732-34). Le
    modèle, qui ne distingue pas ces qualités, garde le revenu saisi avant 2004.
  - >-
    R. 732-70 ne dit pas à quelle date lire l'AVTS : le modèle prend, depuis le 14 octobre
    2026, le montant en vigueur au 1er janvier de l'année (pension_minimum_avant_1983.csv,
    du barème de la Cnav), comme le minimum contributif de R. 732-71.
  - >-
    R. 732-71 ne dit pas à quelle date lire « l'intégralité du montant annuel minimal non
    majoré de pension garanti en application de l'article L. 351-10 » (MC) : le modèle
    prend, depuis le 4 octobre 2026, le montant en vigueur au 1er janvier de l'année,
    que le dépôt porte désormais à chaque date de revalorisation (fiche
    minimum_contributif). Lire l'instruction de la caisse centrale de la MSA qui le fixe.
