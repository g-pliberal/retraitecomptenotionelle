schema_version: 1
id: majoration_retraite_proportionnelle
intitule: >-
  Les plans de revalorisation des retraites agricoles : de 1997 à 2008, la retraite
  proportionnelle du chef d'exploitation liquidée au taux plein, qui l'a été dix-sept
  ans et demi, est portée à un nombre minimal annuel moyen de points par année de chef,
  trente-sept et demie au plus — 26,933 de 1997 à 2000, servis au tiers en 1997 et aux
  deux tiers en 1998, minorés sous vingt-deux ans et demi ; 29,23 en 2001 ; depuis 2002,
  ce qui porte, avec la retraite forfaitaire, une carrière complète au minimum
  vieillesse d'une personne seule ; et, depuis 2002, le chef de moins de dix-sept ans
  et demi au différentiel du minimum d'un couple. Les années de conjoint et d'aide
  familial reçoivent, aux pensions prises depuis 1998, les points des décrets des
  pensions dues de 1998 à 2001 — 8,63, 11,44, 16, puis 19,2 —, puis le différentiel du
  minimum d'un couple, moins les seize points que chacune porte, au taux plein depuis
  2002. Les pensions de chef
  prises avant 1997 sont révisées de 1997 à 2008, sur la durée de chef que leurs points
  au compte, divisés par seize, reconstituent.
domaine: minima
regimes: [msa_non_salaries]
etape: completer_tous_regimes
face: droit
etat: approchee
lit:
- la retraite proportionnelle des non-salariés agricoles, sa valeur du point et son
  coefficient de durée, et la retraite forfaitaire d'une carrière complète
- la durée de chef d'exploitation à titre exclusif ou principal, la durée d'assurance
  non salariée agricole, et le taux plein
- la réversion du régime que l'assuré déclare, son début et son montant
- le minimum vieillesse d'une personne seule et celui d'un couple au 1er janvier de
  l'année de la date d'effet (legislation/minimum_vieillesse_avant_2007.csv,
  minimum_vieillesse.csv, minimum_vieillesse_couple.csv)
ecrit:
- les points de retraite proportionnelle que la majoration ajoute, en euros, à la
  pension de base des non-salariés agricoles
dates_qui_decident:
- liquidation.date_effet
versions:
