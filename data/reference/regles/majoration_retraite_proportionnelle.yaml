approximations:
- ecart: >-
    l'AVTS de la formule est la retraite forfaitaire d'une carrière complète du modèle,
    que D. 732-144 lui égale (« qui représente le montant de la pension de retraite
    forfaitaire annuelle due pour une durée d'assurance non salariée agricole au moins
    égale à trente-sept années et demie ») : la retraite forfaitaire et la
    proportionnelle d'une carrière complète de chef valent ainsi le minimum vieillesse,
    ce que la loi veut, quand le forfait du modèle, ramené sur les prix, s'écarte de
    l'AVTS de l'année — 2 557,92 € en 2002 contre 2 807,72 €
  effet: aucun sur la pension d'une carrière complète, qui vaut le minimum vieillesse
- ecart: >-
    le nombre annuel moyen de points n se lit sur la retraite proportionnelle entière,
    ramenée en points à la valeur de la liquidation, par année de la durée agricole,
    trente-sept et demie au plus — une carrière complète de chef a ainsi le minimum,
    quand le décret ne dit pas sur quelles années d'une carrière plus longue la
    moyenne se prend —, au plancher de seize points en moyenne et non année par
    année ; les points d'années de conjoint ou d'aide familial y comptent ; les années d'avant 1990, que le moteur valorise au rendement faute de
    barème, y entrent pour ce que vaut leur rendement. Depuis le 19 octobre 2026, la
    part forfaitaire retirée de la pension ne compte plus les années de chef à titre
    secondaire, que le forfait ne compte pas (L. 732-28) : elle les comptait, et n en
    était trop bas
  effet: >-
    non mesuré, faible quand toute la carrière agricole est de chef ; le salarié chef à
    titre secondaire de 1982 à 1985, puis à titre principal jusqu'en 2005 : n de 28,390
    au lieu de 24,771, 148,40 points de plans au lieu de 220,78, 494,93 € par an au
    lieu de 736,30 €
- ecart: >-
    les années d'aide familial, que D. 732-113 et D. 732-144 ajoutent à la durée de chef
    dans la limite de quatre, n'y entrent pas : le statut du modèle ne distingue pas
    l'aide familial du conjoint collaborateur ; ni les points du plan de 1994 aux années
    d'aide familial d'avant 1994 des chefs partis de 1994 à 2001 (D. 732-110), ni la
    majoration de la retraite forfaitaire de L. 732-54-3, servie aux pensions prises
    avant 1998
  effet: non mesuré
- ecart: >-
    depuis le 16 octobre 2026, les années de collaborateur (statut collaborateur_agricole)
    reçoivent B - 16 points, B = (MV2 - AVTS) / (37,5 x VP), aux pensions prises de 2002
    à 2008 au taux plein avec dix-sept ans et demi d'activité agricole (D. 732-141,
    D. 732-145, D. 732-146), et, depuis les pensions dues en 2002, aux pensions prises de
    1998 à 2001 qui en ont trente-deux et demi, vingt-sept et demi à quinze ans de
    conjoint sans autre ligne de carrière que les non-salariés agricoles, vingt-deux et
    demi depuis 2007, minorées sous trente-sept et demie (D. 732-118, D. 732-123,
    D. 732-131 ; décret n° 2002-297, articles 6 et 8). Toutes sont présumées régularisées
    et, avant 1999, non rachetées : ni le minimum de 8,63 points de qui est resté conjoint
    participant aux travaux en 1999 sans opter, ni le différentiel d'un rachat ne sont
    servis. L'aide familial y est servi comme un conjoint : ses années d'avant 1999 se
    minorent comme celles d'un conjoint, quand le décret ne les minore pas. Une année de
    conjoint d'avant 1999, sans points dans la loi, en porte seize dans le modèle
    (plancher de R. 732-73), plus quand le revenu saisi d'avant 2004 en ouvre
    davantage : le différentiel B - 16 la porte à B dans le premier cas, au-delà dans le
    second. Depuis le 18 octobre 2026, les pensions dues de 1998 à 2001 aussi, aux
    nombres de leurs décrets (décret n° 99-875, articles 1er à 4 ; décret n° 2000-261,
    article 5 ; décret n° 2001-170, article 5) : 8,63 points en 1998, 11,44 en 1999 pour
    un conjoint, 16 en 2000, que les seize de chaque année dépassent ou égalent — rien ne
    s'y ajoute, et le modèle sert 7,37 points de trop par année revalorisée en 1998, 4,56
    en 1999 —, puis seize et le différentiel de 3,2 en 2001, soit 3,2 de plus. Aux
    pensions prises en 2000, le décret retire seize points du total de 2000, le modèle
    une année ; il ne sert pas les 19,2 points de l'aide familial en 2000, qu'il ne
    distingue pas du conjoint. Ne sont pas servis : les années de chef des pensions prises de 1998 à
    2001 sous dix-sept ans et demi de chef (D. 732-119, 4°, D. 732-125) ; le droit de
    L. 732-54-8, I, deuxième alinéa, des conjoints qui ont opté en 1999 sans la durée du
    taux plein. Depuis le 19 octobre 2026, la réversion du régime que l'assuré déclare
    joue : voir l'écart qui la lit
  effet: >-
    une conjointe collaboratrice de quarante-deux ans partie en 2005 : 286 points de plus,
    environ 950 € par an jusqu'en 2008 ; une conjointe de trente et un ans partie en 2000,
    rien en 2000, 38 points en 2001 (118 € par an), puis de 97 à 147 points ; une de
    trente-cinq ans et demi partie en 1998, rien jusqu'en 2000, 80 points en 2001 (245 €
    par an), 207 en 2002 ; depuis 2009, la PMR les porte au moins à son montant réduit
- ecart: >-
    la minoration de 1997 à 2000 se proratise sur la fraction d'année manquante, quand
    le décret ne compte que des années
  effet: au plus quelques points
- ecart: >-
    depuis le 16 octobre 2026, une pension prise de 1997 à 2008 reçoit chaque année la
    règle des pensions dues cette année-là — les deux tiers en 1998, les points entiers
    en 1999, 29,23 sans minoration en 2001, A au minimum vieillesse de chaque année
    depuis 2002 —, puis garde les points de 2008, que la PMR de 2009 compte
    (D. 732-112) ; le nombre n reste celui de la liquidation, et le minimum C ne
    s'ouvre pas aux pensions prises avant 2002, que le décret n° 2002-297 ne nomme pas.
    Un recul de A d'une année sur l'autre retire des points, ce que les textes
    n'interdisent pas et que la caisse a peut-être évité ; la surcote ne porte pas sur
    la majoration, ni la majoration pour enfants
  effet: non mesuré, faible
- ecart: >-
    depuis le 17 octobre 2026, une pension de chef prise avant 1997 est révisée chaque
    année de 1997 à 2008 (pensions_prises_avant_1997 ; décret n° 97-163, article 2 ;
    décret n° 2002-297, article 5 ; D. 732-114 à D. 732-117), puis garde ses points de
    2008. Les points au compte sont la retraite proportionnelle de la liquidation, sa
    part forfaitaire retirée — celle des seules années que le forfait compte —, à la
    valeur du point de la liquidation, comme la PMR de 2009 les lit pour la durée de
    chef reconstituée (D. 732-110, III, fiche pension_majoree_reference) : ceux des années
    d'avant 1990, que le moteur valorise au rendement faute du barème des classes, y
    comptent pour ce que vaut leur rendement, et aucun plan n'y entre, le moteur ne
    servant pas celui de 1994. La minoration de quinze points par année de chef à titre
    secondaire sans cotisation à la retraite forfaitaire ne joue jamais : qui a
    trente-deux ans et demi d'activité agricole avant 1997 (vingt-deux et demi en 2007)
    était au régime avant 1981, et garde dans le moteur le forfait de ses années à titre
    secondaire (R. 732-65, liquider.trimestres_hors_forfait). Depuis le 19 octobre
    2026, A égal à 20 de qui peut bénéficier de la revalorisation de la majoration
    forfaitaire de sa réversion (décret n° 2000-261, article 1er ; D. 732-116) est
    servi : voir l'écart qui lit la réversion. Ne sont pas servis : les points du plan
    de 1994 et de D. 732-110 et D. 732-111 aux années d'aide familial des chefs, que le
    statut du modèle ne distingue pas
  effet: >-
    une carrière complète de chef à 30 % du salaire moyen, partie en 1995 : 112 € de
    plus en 1997, 1 159 € en 2001, 2 036 € en 2008, que la PMR de 2009 relaie ; à 60 %
    du salaire moyen, la durée reconstituée ramenée à la durée agricole, les points de
    2008 dépassent la PMR, et la pension de 2026 passe de 9 568 € à 9 767 €
- ecart: >-
    le minimum vieillesse de 2008, que minimum_vieillesse.csv ne porte pas, est celui de
    2007 revalorisé sur les prix
  effet: quelques euros par an, en 2008
- ecart: >-
    depuis le 19 octobre 2026, la réversion du régime que l'assuré déclare
    (reversion_agricole, présomption pas_de_reversion_agricole) joue aux plans. Déclarée
    non nulle, elle fait l'assuré titulaire d'une réversion ; nulle, ses ressources
    l'absorbent (L. 732-41), et il ne l'est pas. Titulaire à la date d'effet d'une
    pension prise de 1998 à 2001, il n'a pas les points des conjoints (L. 732-31, puis
    L. 732-54-2, I ; D. 732-118) ; quand elle vient après, ces points se plafonnent,
    depuis le 1er janvier qui suit, au niveau de l'année où elle a pris effet, que la
    règle de cette année redonne (L. 732-54-2, II ; D. 732-126 à D. 732-130, qui en
    disent les nombres de 1998 à 2001). Commencée avant 1995, elle se lit sous
    L. 732-46 : son titulaire, qui a sa propre pension, reçoit la majoration
    forfaitaire du IV (D. 732-97), et, à trente-deux ans et demi d'activité agricole
    (vingt-sept et demi à quinze ans de conjoint d'avant 1999 sans autre ligne de
    carrière que les non-salariés agricoles), son relèvement en priorité (L. 732-33,
    II, puis L. 732-54-4 ; D. 732-139) : sa pension prise avant 1997 garde vingt points
    depuis 2000, celle prise de 1997 à 2001, 26,933 depuis 2001 (D. 732-113,
    D. 732-116). Le conjoint survivant de moins de soixante ans au 1er janvier 1995 qui
    a demandé L. 732-41 (L. 732-46, V) n'est pas distingué. Ne sont pas servis, droits
    dérivés que le modèle, qui rend le droit propre et prend la réversion telle qu'elle
    est déclarée, ne calcule pas : la majoration forfaitaire et son relèvement (642,47
    points en 2002 pour trente-sept ans et demi), et la majoration de la réversion des
    pensions prises avant 2002 (décret n° 2002-297, article 12 ; D. 732-140) et depuis
    (décret n° 2002-298, article 5 ; D. 732-147), qui porte le droit propre et le droit
    dérivé au minimum vieillesse au prorata de la durée agricole. La réversion déclarée
    suit les pensions de base depuis son début, sans ces majorations, que la PMR de 2009
    retranche peut-être
  effet: >-
    la conjointe de trente et un ans partie en 2000, veuve avant : rien des plans, 575 €
    de moins par an en 2008 ; veuve en 2001, 38,40 points au lieu de 161,21 en 2008
    (137 € au lieu de 575 €). Le chef parti en 1995 à 30 % du salaire moyen, veuf
    depuis 1990 : 120,92 points de plans de 2000 à 2008 au lieu de 607,12 en 2008 (431 €
    au lieu de 2 164 €), sa pension de base de 2012, PMR comprise, 5 425 € au lieu de
    7 748 € ; celui parti en 1997, veuf depuis 1993 : 409,99 points au lieu de 753,16
    (980 € au lieu de 2 204 €). La majoration de la réversion, non servie, en rend
    l'essentiel en droit dérivé
