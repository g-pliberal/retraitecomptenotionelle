      minimum »
    lu_le: 2026-10-14
  bornes:
    liquidation.date_effet: [null, 1997-01-01]
  contenu:
    droit: >-
      aucun minimum de points à la liquidation : les pensions prises avant 1997 sont
      révisées à partir du 1er janvier 1997 (article 2 du décret : vingt points, puis
      23,9 en 1999, 26,96 en 2000, 29,23 en 2001 — le Journal officiel du 23 février 2001
