- id: plan_de_1997
  statut: lue
  textes:
  - id: JORFARTI000002386544
    article: décret n° 97-163 du 24 février 1997, article 1er
    en_vigueur: 1997-02-25
    citation: >-
      « Ont droit à la majoration les personnes qui justifient : 1o D'une part, d'une
      durée d'assurance [...] au moins égale à celle requise par l'article R. 351-45 du
      code de la sécurité sociale, lorsqu'elles sont âgées de moins de soixante-cinq ans
      [...] ; 2o D'autre part, d'une durée effectuée en qualité de chef d'exploitation
      [...] au moins égale à dix-sept années et demie » ; « la durée totale d'activité
      prise en compte ne peut excéder trente-sept années et demie » ; « P = d x (26,933 -
      n) » ; « chaque année de chef d'exploitation est retenue au minimum pour 16
      points » ; entre dix-sept ans et demi et vingt-deux ans et demi, « 15 % pour
      chacune des deux premières années manquantes ; 20 % pour chacune des troisième,
      quatrième et cinquième années suivantes »
    lu_le: 2026-10-14
  - id: JORFARTI000001027316
    article: décret n° 97-163 du 24 février 1997, article 3
    en_vigueur: 1997-02-25
    citation: >-
      « le nombre de points supplémentaires [...] ne peut être servi, au titre de
      l'année 1997, qu'à concurrence du tiers et, au titre de l'année 1998, qu'à
      concurrence des deux tiers »
    lu_le: 2026-10-14
  - id: JORFARTI000002386545
    article: décret n° 97-163 du 24 février 1997, article 2
    en_vigueur: 1997-02-25
    citation: >-
      « Le nombre de points retenu pour calculer les retraites proportionnelles servies à
      titre personnel et ayant pris effet avant le 1er janvier 1997 est, le cas échéant,
      révisé et porté à un minimum à compter du 1er janvier 1997 » ; à qui justifie
      « d'une durée d'activité non salariée agricole exercée à titre exclusif ou
      principal au moins égale à trente-deux années et demie » et « d'une durée
      reconstituée de chef d'exploitation [...] au moins égale à dix sept années et
      demie » : « la durée de chef d'exploitation est obtenue en divisant par 16 le
      nombre des points de retraite figurant au compte de l'intéressé » ; « Lorsque, au
      terme de cette reconstitution, l'intéressé totalise un nombre d'annuités de chef
      d'exploitation supérieur à sa durée de carrière non salariée agricole [...], ce
      nombre est ramené à la durée de carrière non salariée agricole » ; « P = (20 - n)
      x d » ; « d représente la durée d'activité de chef d'exploitation retenue [...],
      dans la limite de trente-sept années et demie » ; n, « le nombre de points retenu
      [...] par la durée reconstituée », ou, la durée ramenée, « divisé par la durée
      d'activité non salariée agricole » ; sous vingt-deux ans et demi de chef
      reconstitués (III) et sous trente-sept et demi d'activité agricole (IV), « 15 % pour
      chacune des deux premières années manquantes ; 20 % pour chacune des troisième,
      quatrième et cinquième années suivantes ; 10 % pour la sixième et dernière
      année » ; « Lorsque les assurés justifient de l'application simultanée de deux
      coefficients minorateurs, seul le coefficient de minoration le plus élevé est
      appliqué » (V)
    lu_le: 2026-10-17
  bornes:
    liquidation.date_effet: [1997-01-01, 1998-01-01]
  contenu:
    droit: >-
      26,933 points par année de chef, servis au tiers en 1997 ; sous vingt-deux ans et
      demi de chef, les points ajoutés minorés de 15 % pour chacune des deux premières
      années manquantes, de 20 % pour les trois suivantes. Aux pensions prises avant
      1997, révisées : vingt points par année de chef, servis au tiers, la durée de
      chef reconstituée des points au compte divisés par seize et ramenée au plus à la
      durée agricole, à trente-deux ans et demi d'activité agricole et dix-sept et demi
      de chef reconstitués, sans condition de taux plein ; sous vingt-deux ans et demi de
      chef reconstitués et sous trente-sept et demi d'activité agricole, deux
      coefficients de 15, 15, 20, 20, 20 et 10 %, dont seul le plus élevé s'applique
