effet: >-
  Les chefs partis avant 1997, de 1997 à 2008 : une carrière complète à faible revenu
  partie en 1995 reçoit 2 036 € de plus en 2008. Les conjoints collaborateurs partis de
  1998 à 2008, servis depuis 2002 au plus tôt :
  une conjointe de quarante-deux ans partie en 2005 reçoit 286 points de plus. Les chefs
  d'exploitation partis au taux plein de 1997 à 2008 avec une petite retraite
  proportionnelle : le moteur ne servait que le calcul contributif — un chef de
  quarante ans à faible revenu parti en 2002 touchait 4 485 € par an, quand le plan lui
  garantissait le minimum vieillesse, 6 833 €.
