      années suivantes ; « 40 % pour la sixième année. »
    lu_le: 2026-10-14
  - id: JORFARTI000001514279
    article: décret n° 2000-261 du 22 mars 2000, article 1er
    en_vigueur: 2000-03-23
    citation: >-
      « L'article 2 du décret du 24 février 1997 susvisé est modifié ainsi qu'il suit à
      compter du 1er janvier 2000 » : « Pour les pensions dues à compter du 1er janvier
      2000, la formule P = (23,9 - n) x d est remplacée par la formule P = (26,96 - n) x
      d. Toutefois, lorsqu'[...] la majoration cumulée de la pension de réversion est
      servie au lieu et place de la majoration cumulée de la retraite proportionnelle
      personnelle, il est fait application [...] de la formule P = (20 - n) x d. »
    lu_le: 2026-10-17
  - id: JORFARTI000001964318
    article: décret n° 2000-261 du 22 mars 2000, article 5
    en_vigueur: 2000-03-23
    citation: >-
      « Pour les pensions dues à compter du 1er janvier 2000, la durée minimum [...] est
      toutefois ramenée à vingt-sept années et demie pour les personnes ayant effectué au
      moins quinze années en qualité de conjoints [...] à condition qu'elles ne
      bénéficient pas d'un autre avantage de retraite » ; « La limite du 31 décembre 1999
      est toutefois substituée à la limite du 31 décembre 1998 lorsque la retraite a pris
      effet au cours de l'année 1999. » ; « Il n'est pas appliqué de coefficient de
      minoration supplémentaire au titre des années manquantes situées au-delà de la
      cinquième. » ; « accomplie en qualité d'aide familial ouvre droit [...] à 19,2
      points » ; « accomplie comme conjoint participant aux travaux de l'exploitation par
      des personnes dont la retraite a pris effet en 1998 ou 1999 ouvre droit à 16
      points » ; aux pensions prises depuis, « 8,63 points gratuits [...] pour les
      conjoints participant aux travaux de l'exploitation au 31 décembre 1998, qui ont
      conservé cette activité durant tout ou partie de l'année 1999 sans faire choix du
      statut de conjoint collaborateur » ; « 16 points gratuits de retraite
      proportionnelle dans les autres cas. Toutefois, [...] le nombre total de points
      attribuable est minoré de 16 pour les retraites prenant effet en 2000. »
    lu_le: 2026-10-18
  - id: JORFARTI000001577798
    article: décret n° 2000-261 du 22 mars 2000, article 2
    en_vigueur: 2000-03-23
    citation: >-
