    lu_le: 2026-10-19
  - id: LEGIARTI000006585603
    article: L. 732-46 code rural
    en_vigueur: 2000-06-22
    citation: >-
      « Les pensions de réversion ayant pris effet antérieurement au 1er janvier 1995 sont
      régies par les dispositions du présent article. » ; « IV. - Une majoration est
      applicable dans les conditions fixées par décret aux pensions servies au titre de
      l'assurance vieillesse aux conjoints survivants, bénéficiaires ou susceptibles de
      bénéficier d'un avantage personnel de vieillesse ou d'invalidité. » ; « V. - Par
      dérogation aux dispositions des I, II et III, les conjoints survivants âgés de moins
      de soixante ans au 1er janvier 1995 peuvent, dans les conditions fixées par décret,
      demander à bénéficier des dispositions de l'article L. 732-41 »
    lu_le: 2026-10-19
  bornes:
    liquidation.date_effet: [2000-01-01, 2001-01-01]
  contenu:
    droit: >-
      26,933 points ; la minoration ramenée à 15, 15, 10, 10 et 10 %. Aux pensions prises
      avant 1997, 26,96 points, les coefficients de 1999. Aux années de conjoint d'avant
      1999, d'avant 2000 quand la pension a pris effet en 1999, 16 points, ceux des
      pensions prises en 2000 diminués de seize (8,63 par année à qui est resté conjoint
      participant aux travaux en 1999 sans opter) ; 19,2 à celles d'aide familial ;
      vingt-sept ans et demi d'activité agricole suffisent à qui a quinze ans de conjoint
      sans autre pension, et aucun coefficient ne joue au-delà de la cinquième année
      manquante (décret n° 2000-261, article 5) : les seize points que le modèle donne à
      chacune les égalent. Le titulaire de la majoration forfaitaire d'une réversion
      d'avant 1995 qui a trente-deux ans et demi d'activité agricole (vingt-sept et demi
      à quinze ans de conjoint sans autre pension) en reçoit le relèvement en priorité,
