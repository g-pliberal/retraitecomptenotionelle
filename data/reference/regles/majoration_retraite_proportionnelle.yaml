    droit: >-
      29,23 points par année de chef, sans minoration. Aux pensions prises avant 1997,
      29,23 points aussi (le rectificatif) ; la minoration sous vingt-deux ans et demi de
      chef reconstitués tombe, celle sous trente-sept ans et demi d'activité agricole
      reste. Aux années de conjoint, seize points et le différentiel de 3,2 — 19,2 —, les
      années d'avant 1999 diminuées de l'écart entre l'année d'effet et 1999 et retenues
      dans la limite de trente-sept et demie moins l'écart avec 1998 ; le différentiel
      seul aux années de conjoint collaborateur depuis 1999, qui portent seize points
      cotisés ; minorés de 15, 15, 10, 10, 10 et 40 % par année manquante, sans coefficient
      au-delà de la cinquième à qui a vingt-sept ans et demi (décret n° 2001-170,
      article 5) : 3,2 points de plus par année que les seize du modèle. Qui peut
      bénéficier de la revalorisation de la majoration forfaitaire de sa réversion
      d'avant 1995 garde 26,933 points, et vingt aux pensions prises avant 1997 (décret
      n° 2001-170, article 3)
