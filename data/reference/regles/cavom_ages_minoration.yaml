schema_version: 1
id: cavom_ages_minoration
intitule: >-
  Régime complémentaire de la CAVOM : depuis le 1er janvier 2016, ouverture à 60 ans
  et taux plein à 65 ans pour les nés avant 1956, six mois de plus par génération
  jusqu'à 62 et 67 ans pour la génération 1959, puis, depuis le 1er janvier 2025,
  ouverture à 62 ans et 6 mois, 63 ans, 63 ans et 6 mois et 64 ans pour les
  générations 1965 à 1968 ; avant l'âge du taux plein, un coefficient d'anticipation
  de 5 % par année manquante, « non susceptible de fractionnement », que la durée
  d'assurance n'annule pas ; aucune surcote ; l'inapte sans coefficient dès 62 ans
  jusqu'au 31 décembre 2024, ouvert à 62 ans avec le coefficient depuis ; la pension
  au premier jour d'un trimestre civil ; avant 2016, la même règle présumée.
domaine: decote_surcote
regimes: [cavom_complementaire]
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- >-
  l'âge de l'officier ministériel à la date d'effet de sa pension, qui prend effet « au
  plus tôt au premier jour du trimestre civil qui suit » la demande, la cessation
  d'activité et le paiement des cotisations, et sa génération, qui donne l'âge
  d'ouverture et l'âge du taux plein
- >-
  l'inaptitude au travail : de 2016 à 2024, reconnue « dans les conditions prévues aux
  articles 27 à 33 des statuts de la CNAVPL », puis, depuis le 7 septembre 2020, « dans
  les statuts en vigueur », elle ouvre la pension sans coefficient dès 62 ans ; depuis
  le 1er janvier 2025, l'affilié du a du 2° de L. 643-4 ouvre ses droits à 62 ans, avec
  le coefficient
- la date d'effet de la pension, qui choisit la rédaction des statuts ou du règlement
ecrit:
- >-
  le coefficient d'anticipation qui réduit les points de la pension complémentaire, de
  0,75 à cinq ans du taux plein à un, que `abattement_points` rend à
  `liquider_chaque_regime`, et l'âge d'ouverture et l'âge du taux plein, que la table
  `cavom` de `ages_regimes.csv` rend à l'ouverture
- >-
  le coefficient ramené à un pour l'inapte de 62 ans dont la pension prend effet du
  1er janvier 2016 au 31 décembre 2024 (`age_sans_coefficient_de_l_inapte`)
dates_qui_decident:
- liquidation.date_effet
versions:
- id: statuts_d_avant_2016
  statut: supposee
  hypothese: >-
    les pensions qui prennent effet avant le 1er janvier 2016 relèvent des statuts
    approuvés par l'arrêté du 11 avril 1979, que l'arrêté du 30 décembre 2015 vise
    (JORFTEXT000031740849) et que l'index JORF du dépôt n'a pas, et de leurs
    modifications, publiées au seul Bulletin officiel : l'arrêté du 8 août 1996 approuve
    celles des « (art. 14, 16, 17, 27 et 28) » (JORFARTI000001603584), « publié
    intégralement au Bulletin officiel no 96-36 » (JORFARTI000001405558) ; celui du 6
    juin 2001 celles des « (art. 14 et 16 bis) » (JORFARTI000001451960), « publié
    intégralement au Bulletin officiel no 2001/29 » (JORFARTI000001066668). L'article 14
    est, en 2016, celui de la liquidation, de l'âge et des coefficients : sa rédaction
    d'avant n'est pas lue. La fiche présume la règle de 2016 aux générations nées avant
    1956, « Jusqu'à 1955 60 ans 65 ans » (article 23 de 2016), dont les mots « Les taux
    de décote sont ajustés en conséquence » disent qu'une décote existait déjà
  fiabilite: >-
    faible : l'âge d'ouverture, l'âge du taux plein et le coefficient, que nul texte lu
    ne date avant le 1er janvier 2016
