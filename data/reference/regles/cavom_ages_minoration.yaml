      conditionnée à la cessation de toute activité professionnelle ressortissant de la
      caisse et au paiement à la caisse de toutes les cotisations et majorations
      exigibles. « 1° L'âge d'ouverture des droits à pensions est fixé à : « a) 62 ans
      pour les affiliés relevant du a du 2° de l'article L. 643-4 du code de la sécurité
      sociale ; « b) 64 ans à compter de la génération 1968. « Pour les affiliés nés
      avant le 1er janvier 1968, cet âge est fixé à : « - 60 ans pour les affiliés nés
      avant le 1er janvier 1956 ; « - 60 ans et 6 mois pour les affiliés nés en 1956 ;
      « - 61 ans pour les affiliés nés en 1957 ; « - 61 ans et 6 mois pour les affiliés
      nés en 1958 ; « - 62 ans pour les affiliés nés entre le 1er janvier 1959 et le 31
      décembre 1964 inclus ; « - 62 ans et 6 mois ans pour les affiliés nés en 1965 ; «
      - 63 ans pour les affiliés nés en 1966 ; « - 63 ans et 6 mois pour les affiliés
      nés en 1967 ; « 2° Sont liquidées sans application de coefficients
      d'anticipation, les pensions de retraite des affiliés ayant atteint l'âge de 67
      ans à compter de la génération 1959. « Pour les affiliés nés avant le 1er janvier
      1959, cet âge est fixé à : « - 65 ans pour les affiliés nés avant le 1er janvier
      1956 ; « - 65 ans et 6 mois pour les affiliés nés en 1956 ; « - 66 ans pour les
      affiliés nés en 1957 ; « - 66 ans et 6 mois pour les affiliés nés en 1958. « 3° En
