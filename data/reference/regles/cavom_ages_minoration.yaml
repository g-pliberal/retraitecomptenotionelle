- id: statuts_de_2016
  statut: lue
  textes:
  - id: JORFARTI000031740853
    article: >-
      statuts du régime d'assurance vieillesse complémentaire, annexe de l'arrêté du 30
      décembre 2015, 5° (article 14) et 8° (article 23)
    en_vigueur: 2016-01-01
    publie_le: 2015-12-31
    citation: >-
      « 5° L'article 14 est remplacé par les dispositions suivantes : « I. - Liquidation
      de la retraite « La retraite est liquidée sur demande expresse de l'affilié formée
      par lettre recommandée. « La liquidation de la retraite, conditionnée à la
      cessation de toute activité professionnelle ressortissant de la caisse et au
      paiement à la caisse de toutes les cotisations et majorations exigibles, peut
      intervenir : « 1° À partir de 62 ans « En cas d'inaptitude au travail reconnue dans
      les conditions prévues aux articles 27 à 33 des statuts de la CNAVPL ; « Ou avec
      application des coefficients d'anticipation suivants : « 0,75 si la retraite est
      attribuée lorsque l'affilié est âgé de 62 ans ; « 0,80 si la retraite est attribuée
      lorsque l'affilié est âgé de 63 ans ; « 0,85 si la retraite est attribuée lorsque
      l'affilié est âgé de 64 ans ; « 0,90 si la retraite est attribuée lorsque l'affilié
      est âgé de 65 ans ; « 0,95 si la retraite est attribuée lorsque l'affilié est âgé
      de 66 ans ; « Ces coefficients, appliqués au nombre de points, n'étant pas
      susceptibles de fractionnement ; « 2° À partir de 67 ans sans application de
      coefficients d'anticipation. « II. - Prise d'effet et paiement de la retraite « La
      retraite prend effet au plus tôt au premier jour du trimestre civil qui suit le
      dernier des faits ci-après : « - la demande prévue au I ci-dessus ; « - la
      justification de la cessation d'activité ; « - le paiement des cotisations et
      majorations exigibles restant dues à la caisse. [...] 8° L'article 23 est remplacé
      par les dispositions suivantes : « Les âges de liquidation de la retraite de 62 ans
      et 67 ans s'appliquent aux adhérents nés à compter du 1er janvier 1959. Pour les
      générations antérieures, les âges d'ouverture des droits à retraite et de bénéfice
      du taux plein évoluent selon le tableau ci-dessous : GÉNÉRATION ÂGE D'OUVERTURE DES
      DROITS ÂGE DU TAUX PLEIN Jusqu'à 1955 60 ans 65 ans 1956 60 ans et 6 mois 65 ans et
      6 mois 1957 61 ans 66 ans 1958 61 ans et 6 mois 66 ans et 6 mois 1959 et suivantes
      62 ans 67 ans « Les taux de décote sont ajustés en conséquence. »
