code:
  interrupteurs:
    abattement_points: cavom
    decote_annulee_par_la_duree: false
  moteur: >-
    `abattement_points: cavom` : 5 % par année manquante, et seul l'âge ouvre le taux
    plein — la règle du RACL de 2014 à 2024 (`ircec_age_seul`) —, que le règlement de
    la CAVOM écrit « non susceptible de fractionnement » ; c'est aussi celle de la CARMF
    de 2000 à 2016 (« 0,75 à 60 ans […] 0,95 à 64 ans »), de la CARCDSF de 2008 à 2010
    (« 25 % pour un départ en retraite au cours de la 61e année […] 5 % […] au cours de
    la 65e année ») et de la CAVAMAC de 2011 à 2023 (« 5 % lorsque la liquidation […]
    intervient dans les douze mois précédant l'âge requis », 10 % du 13e au 24e mois,
    jusqu'à 25 %). `decote_annulee_par_la_duree: false` : la durée d'assurance n'annule
    pas la minoration. `age_sans_coefficient_de_l_inapte: 62` : le coefficient de
    l'affilié dont la carrière déclare l'inaptitude revient à un dès cet âge, pour une
    pension que la période liquide.
  python: >-
    droit/liquider.py : abattement_points, abattement_ircec, inapte_sans_coefficient,
    trimestres_de_decote,
    surcote_points, _ABATTEMENTS_IRCEC, _ABATTEMENTS_PAR_ANNEE_AGE_SEUL ;
    droit/ouvrir.py : age_ouverture, age_taux_plein ; scenarios/actuel.py : AgesRegimes
  javascript: >-
    moteur/js/droit/liquider.js : abattementPoints, abattementIrcec,
    inapteSansCoefficient, trimestresDeDecote,
    surcotePoints ; moteur/js/droit/ouvrir.js : ageOuverture, ageTauxPlein ;
    moteur/js/regimes.js : AgesRegimes
  parametres: >-
    contenu.parametres de chaque version : abattement_points, age_table,
    surcote_par_trimestre, age_sans_coefficient_de_l_inapte ;
    regimes/cavom_complementaire.yaml : age_ouverture, age_taux_plein,
    age_sans_coefficient_de_l_inapte ; legislation/ages_regimes.csv : cavom
  tests: [tests/test_sections_juridiques.py, tests/test_sections_liberales.py]
