approximations:
- version: [statuts_d_avant_2016]
  textes: >-
    statuts de 1979, article 14 dans ses rédactions de 1996 et de 2001, au seul Bulletin
    officiel (no 96-36, no 2001/29)
  ecart: >-
    Le modèle sert avant le 1er janvier 2016 la table et le coefficient de 2016 aux
    générations nées avant 1956 (ouverture à 60 ans, taux plein à 65 ans, 5 % par année
    manquante), que nul texte lu ne date ; ce que les statuts d'alors disaient n'est pas
    lu. Il n'y sert pas l'inapte sans coefficient, que seuls les statuts de 2016
    écrivent parmi les textes lus.
  effet: >-
    non mesuré ; né le 10 mars 1955, liquidé le 1er avril 2015 à 60 ans, le modèle sert
    0,75 (essai du 5 novembre 2026, dans les deux moteurs)
- version: [statuts_de_2016]
  textes: >-
    statuts de 2016, article 14, I, 1°, deuxième alinéa, « En cas d'inaptitude au
    travail reconnue dans les conditions prévues aux articles 27 à 33 des statuts de la
    CNAVPL », puis « dans les statuts en vigueur »
  ecart: >-
    Le modèle sert sans coefficient, dès 62 ans, l'affilié dont la carrière déclare
    l'inaptitude au travail (la case de l'inaptitude du formulaire), et lui seul : les
    articles 27 à 33 des statuts de la CNAVPL, qui disent comment elle est reconnue,
    ne sont pas lus, et le titulaire d'une pension d'invalidité ou d'une incapacité
    permanente, que le régime général répute inapte, ne l'est pas ici sans cette
    déclaration.
  effet: non mesuré
- version: [statuts_de_2016]
  textes: >-
    statuts de 2016, article 14, I, 1°, « À partir de 62 ans « En cas d'inaptitude au
    travail », et article 23, « Pour les générations antérieures, les âges d'ouverture
    des droits à retraite et de bénéfice du taux plein évoluent selon le tableau
    ci-dessous »
  ecart: >-
    Le texte ne tranche pas : pour les générations nées avant 1959, l'article 23 avance
    l'âge d'ouverture (60 ans jusqu'à la génération 1955, puis six mois de plus par
    génération) ; il ne dit pas si l'inapte, que le 1° sert sans coefficient « À partir
    de 62 ans », l'est aussi dès l'âge d'ouverture de sa génération. Le modèle lui oppose
    le coefficient avant 62 ans, et le sert sans coefficient depuis : né le 10 mars
    1955, inapte, liquidé le 1er avril 2016 à 61 ans, quatre années avant 65 ans, 0,80,
    12 830,11 € par an (essai du 5 novembre 2026, refait le 13, case de l'inaptitude
    cochée, dans les deux moteurs) ; si l'âge de l'inapte suit la table, le texte sert 1 :
    12 830,11 / 0,80 = 16 037,64 €, 3 207,53 € de plus par an ; s'il reste 62 ans, 0,80.
  effet: >-
    de 2016 à 2024, l'inapte né avant 1959 liquidé entre l'âge d'ouverture de sa
    génération et 62 ans : 20 points de la pension dans le cas essayé, si l'âge suit la
    table ; non mesuré dans la population
- version: [statuts_de_2016, statuts_de_2025, reglement_de_2026]
  textes: >-
    statuts de 2016, article 14, I, 1°, « 0,75 si la retraite est attribuée lorsque
    l'affilié est âgé de 62 ans » ; statuts de 2025, article 14, 3°, et règlement de
    2026, article 1er, I, 3°, « 5 % par année manquante entre l'âge auquel est demandée
    la liquidation de la retraite, qui ne peut être inférieur à l'âge fixé au 1°, et
    l'âge prévu au 2° »
  ecart: >-
    Le texte ne tranche pas quel âge compte : depuis 2025, « l'âge auquel est demandée
    la liquidation » peut être l'âge de la demande, qui précède la date d'effet, au
    premier jour du trimestre civil qui suit (II), ou l'âge auquel l'affilié demande que
    sa retraite soit liquidée, celui de la date d'effet ; en 2016, l'âge où la retraite
    « est attribuée », celui de la décision ou celui de l'effet. Le modèle compte l'âge
    à la date d'effet. Né le 10 février 1960, parti à 65 ans : le modèle sert la CAVOM
    dès le 1er mars 2025, 0,90, 20 317,08 € par an (essai du 5 novembre 2026, dans les
    deux moteurs). Au texte, l'affilié qui la demande le 15 janvier 2025, à 64 ans, 11
    mois et 5 jours, la reçoit au plus tôt le 1er avril 2025, à 65 ans, 1 mois et 22
    jours : à
    l'âge de l'effet, 1 an, 10 mois et 9 jours avant 67 ans, deux années, 0,90 ; à
    l'âge de la demande, 2 ans et 26 jours avant 67 ans, trois années si l'année entamée
    compte entière, comme le modèle la compte, 0,85, deux sinon, 0,90.
  effet: >-
    jusqu'à 5 points de la pension quand la demande précède un anniversaire que la date
    d'effet suit : 20 317,08 / 0,90 × 0,05 = 1 128,73 € par an dans le cas essayé ;
    non mesuré dans la population
- version: [statuts_de_2025, reglement_de_2026]
  textes: statuts de 2025, article 14, 1°, a ; règlement de 2026, article 1er, I, 1°, a
  ecart: >-
    Le modèle n'ouvre pas la pension de l'inapte à 62 ans quand son âge d'ouverture,
    pour sa génération, est plus tardif (générations 1965 à 1967, puis 64 ans depuis
    1968) : il refuse la liquidation (`non_ouverte`) et attend l'âge de la table.
  effet: >-
    inapte né le 10 mars 1965 : le texte ouvre la pension le 1er avril 2027 à 62 ans,
    avec le coefficient de cinq années manquantes, 0,75 ; le modèle refuse à 62 ans et
    sert 0,75 dès le 1er octobre 2027, à 62 ans et 6 mois : six mois de pension, 8 317,99
    € (16 635,98 € par an, que le modèle calcule à cette date), ne sont pas servis
    (essai du 5 novembre 2026, dans les deux moteurs) ; jusqu'à deux ans pour la
    génération 1968, ouverte à 64 ans, non essayé
- version: [statuts_de_2016, statuts_de_2025, reglement_de_2026]
  textes: >-
    statuts de 2016 et de 2025, article 14, II ; règlement de 2026, article 1er, II
  ecart: >-
    Le modèle fait prendre effet la pension au premier jour du mois qui suit l'âge
    (fiche date_effet_mois_suivant), quand la retraite de la CAVOM « prend effet au plus
    tôt au premier jour du trimestre civil qui suit » la demande, la cessation
    d'activité et le paiement des cotisations : sa pension commence deux mois trop tôt
    quand le modèle la fait prendre effet au deuxième mois d'un trimestre civil, un
    mois quand c'est au troisième — l'âge atteint au premier ou au deuxième mois d'un
    trimestre civil, ou, pour l'assuré né le 1er d'un mois, que le modèle sert dès le
    jour de son anniversaire, au deuxième ou au troisième.
  effet: >-
    un ou deux mois de pension : né le 10 mai 1959, à 62 ans le 10 mai 2021, le modèle
    sert la CAVOM dès le 1er juin 2021 (13 580,64 € par an, 0,75), le texte au 1er
    juillet 2021, au même coefficient : un mois de trop, 1 131,72 € (essai du 5
    novembre 2026, dans les deux moteurs) ; né le 1er mai 1959, dès le 1er mai 2021
    (13 546,16 € par an), le texte au 1er juillet : deux mois, 13 546,16 × 2 / 12 =
    2 257,69 € ; né le 1er mars 1959, dès le 1er mars (13 529,99 € par an), le texte
    au 1er avril : un mois, 1 127,50 € ; né le 1er avril 1959, dès le 1er avril, comme
    le texte (essais du 5 novembre 2026, dans les deux moteurs)
- version: [statuts_de_2016]
  textes: statuts de 2016, article 23, « Les taux de décote sont ajustés en conséquence »
  ecart: >-
    Pour les générations 1956 à 1958, le texte ne dit pas comment les coefficients de
    l'article 14, écrits pour 62 à 66 ans, sont « ajustés » à leurs âges ; le modèle
    leur oppose 5 % par année manquante jusqu'à l'âge du taux plein de la table,
    l'année entamée comptée entière : né le 10 mars 1956, liquidé le 1er avril 2017 à
    61 ans, 4,5 années avant 65 ans et 6 mois, 0,75. Le texte ne tranche pas.
  effet: non mesuré
- version: [statuts_de_2025, reglement_de_2026]
