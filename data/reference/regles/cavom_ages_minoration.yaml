- cavom_ages_2025
effet: >-
  La fiche lisait les tables du régime général et la décote du régime de base, que
  la durée annule : un officier ministériel parti à l'âge légal avec sa durée ne
  perdait rien de sa complémentaire, là où le règlement lui retire 5 % par année
  jusqu'à 67 ans — 15 % à 64 ans. Depuis le 23 septembre 2026, `age_table: cavom`
  et `abattement_points: cavom`, dans les deux moteurs ; tenu par tests/test_sections_juridiques.py.
  Lue au droit le 5 novembre 2026 (action 130) : quatre versions, les statuts de 2016
  en vigueur le 1er janvier 2016 (arrêté du 30 décembre 2015), présumés avant,
  l'article 14 récrit le 1er janvier 2025, le règlement de 2026 ; ni l'inapte de 2016
  à 2024, ni l'ouverture de l'inapte à 62 ans depuis 2025, ni la date d'effet au
  trimestre civil ne sont servis. Retouchée le même jour, après la relecture R-E3 :
  deux non-tranchés déclarés (l'âge de l'inapte né avant 1959, l'âge de la demande ou
  de l'effet), la condition de la date d'effet complétée pour l'assuré né le 1er, le
  cumul de 2020 et le 18° de 2016 dits.
  Corrigée le 13 novembre 2026 (action 130, décision du propriétaire du même jour) :
  jusque-là, le modèle opposait à l'inapte de 2016 à 2024 le coefficient de son âge,
  quand l'article 14, I, 1°, des statuts de 2016 le sert sans coefficient « À partir
  de 62 ans » — né le 10 mars 1959, inapte, liquidé le 1er avril 2021 à 62 ans : 0,75,
  13 564,47 € par an, au lieu de 1, 18 085,96 €, 4 521,49 € de moins ; né le 10 mars
  1957, le 1er avril 2019, 0,80 au lieu de 1 ; né le 10 mars 1955, le 1er avril 2017,
  0,85 au lieu de 1. Depuis, `age_sans_coefficient_de_l_inapte: 62` aux périodes qui
  liquident de 2016 à 2024, dans les deux moteurs. Restent non servies l'ouverture de
  l'inapte à 62 ans depuis 2025 et la date d'effet au trimestre civil.
