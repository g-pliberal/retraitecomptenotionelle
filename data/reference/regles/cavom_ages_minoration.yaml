schema_version: 1
id: cavom_ages_minoration
intitule: >-
  Régime complémentaire de la CAVOM : ouverture à 60 ans et taux plein à 65 ans
  pour les nés avant 1956, six mois de plus par génération jusqu'à 62 et 67 ans
  pour la génération 1959, puis ouverture à 62 ans et 6 mois, 63 ans, 63 ans et
  6 mois et 64 ans pour les générations 1965 à 1968 ; avant l'âge du taux plein,
  un coefficient d'anticipation de 5 % par année manquante, « non susceptible de
  fractionnement », que la durée d'assurance n'annule pas ; aucune surcote.
etat: approchee
effet: >-
  La fiche lisait les tables du régime général et la décote du régime de base, que
  la durée annule : un officier ministériel parti à l'âge légal avec sa durée ne
  perdait rien de sa complémentaire, là où le règlement lui retire 5 % par année
  jusqu'à 67 ans — 15 % à 64 ans. Depuis le 23 septembre 2026, `age_table: cavom`
  et `abattement_points: cavom`, dans les deux moteurs ; tenu par tests/test_sections_juridiques.py.
  Approximations : l'année entamée est comptée entière, comme l'IRCEC l'écrit pour
  la même règle, le texte ne le disant pas ; les versions des statuts antérieures
  à 2024 ne sont pas dans l'index, et la même table et le même coefficient y sont
  supposés — la table de 2024 porte elle-même les générations nées avant 1956.
sources:
  lu_le: 2026-09-23
  prochaine_relecture: 2027-03-31
  a_relire:
  - >-
    Retrouver une version des statuts antérieure à 2016 (arrêtés d'approbation hors
    index) pour dater la minoration et les âges d'avant la réforme de 2016 ; vérifier
    l'arrondi à l'année sur un exemple de la caisse.
  lectures:
  - type: jorf
    reference: >-
      Arrêté du 12 décembre 2024, annexe, II, 4° (JORFARTI000050823056), et arrêté
      du 10 juillet 2026, annexe I (JORFARTI000054435969), lus dans l'index JORF
      du dépôt : même table d'âges, même coefficient.
    date: 2026-09-23
  - type: autre
    reference: >-
      CAVOM, page « La retraite » (tables d'âges avant et depuis le 1er janvier
      2025, « une décote définitive de 5 % par année manquante [...] sans que celle-ci
      puisse être fractionnée », « aucune surcote n'est applicable ») et guide retraite
      et prévoyance 2026.
    url: https://www.cavom.net/vos-droits/votre-retraite/
    date: 2026-09-23
textes_a_rattacher:
- reference: >-
    statuts du régime complémentaire de la CAVOM, article 14, rédaction de l'arrêté
    du 12 décembre 2024 (JORFTEXT000050823047), en vigueur au 1er janvier 2025
- reference: >-
    règlement du régime complémentaire de la CAVOM, article 1er, I, approuvé par
    l'arrêté du 10 juillet 2026 (JORFTEXT000054435960)
reformes:
- cavom_ages_2025
code:
  interrupteurs:
    abattement_points: cavom
    decote_annulee_par_la_duree: false
  moteur: >-
    `abattement_points: cavom` : 5 % par année manquante, et seul l'âge ouvre le taux
    plein — la règle du RACL de 2014 à 2024 (`ircec_age_seul`) —, que le règlement de
    la CAVOM écrit « non susceptible de fractionnement » ; c'est aussi celle de la CARMF
    de 2000 à 2016 (« 0,75 à 60 ans […] 0,95 à 64 ans »), de la CARCDSF de 2008 à 2010
    (« 25 % pour un départ en retraite au cours de la 61e année […] 5 % […] au cours de
    la 65e année ») et de la CAVAMAC de 2011 à 2023 (« 5 % lorsque la liquidation […]
    intervient dans les douze mois précédant l'âge requis », 10 % du 13e au 24e mois,
    jusqu'à 25 %). `decote_annulee_par_la_duree: false` : la durée d'assurance n'annule
    pas la minoration.
