- id: loi_du_21_aout_2003
  statut: lue
  textes:
  - {id: LEGIARTI000006362924, article: R. 26, en_vigueur: 2004-01-01}
  - {id: LEGIARTI000006400878, article: 16, en_vigueur: 2004-01-01}
  - {id: LEGIARTI000029134964, article: 16, en_vigueur: 2014-06-26}
  - {id: LEGIARTI000047633108, article: 16, en_vigueur: 2023-09-01}
  - {id: LEGIARTI000054059126, article: 16, en_vigueur: 2026-05-09}
  - {id: LEGIARTI000006781482, article: 13, en_vigueur: 2004-01-01}
  - {id: LEGIARTI000029134285, article: 13, en_vigueur: 2014-06-26}
  - {id: LEGIARTI000047633193, article: 13, en_vigueur: 2023-09-01}
  - {id: LEGIARTI000054059133, article: 13, en_vigueur: 2026-05-09}
  - {id: LEGIARTI000048844775, article: L. 14, en_vigueur: 2023-12-31}
  - {id: LEGIARTI000054590030, article: 20, en_vigueur: 2026-08-01}
  - {id: LEGIARTI000048697797, article: L. 17, en_vigueur: 2023-12-28}
  - {id: "ECLI:FR:CESSR:2010:311495.20100202", en_vigueur: 2010-02-02}
  nee_de: LEGIARTI000006362924
  bornes:
    liquidation.date_effet: [2004-01-01, null]
  contenu:
    droit: >-
      « Dans le décompte final des trimestres liquidables, la fraction de trimestre égale
      ou supérieure à quarante-cinq jours est comptée pour un trimestre. La fraction de
      trimestre inférieure à quarante-cinq jours est négligée » (R. 26 ; décret n°
      2003-1306, article 16, II ; décret n° 2004-1056, article 13, III). La CNRACL : «
      Cette règle d'arrondi s'applique uniquement lors du décompte final des trimestres
      liquidables. Il n'y a donc pas lieu de procéder à des arrondis intermédiaires ». La
      durée d'assurance de L. 14, I, « totalise la durée des services et bonifications
      admissibles en liquidation » ; « La durée d'assurance dans la Fonction publique est
      calculée en trimestres et jours sans règle d'arrondi » (service des retraites de
      l'État) ; le nombre de trimestres manquants « est arrondi à l'entier supérieur »
      (L. 14, I ; décret n° 2003-1306, article 20, II). Le Conseil d'État juge que
      l'arrondi de R. 26 ne vaut pas pour la durée d'assurance de L. 14, mais que,
      lorsque la pension a atteint par lui le pourcentage maximum de L. 13, « les
      dispositions de l'article L. 14 ne sauraient avoir pour effet de lui appliquer la
      décote » (2 février 2010, n° 311495 : 155 trimestres, deux mois et vingt-deux
      jours, liquidés à 156 et 75 %). Le minimum garanti compte « les services effectifs
      retenus en liquidation du droit » avec la même règle d'arrondi (CNRACL), les
      bonifications exclues (L. 17).
    parametres:
      existe: true
      regimes: [fonction_publique_etat, cnracl, fspoeie]
      unite_jours: 90
      seuil_jours: 45
      duree_au_jour: true
      minimum_garanti: services_effectifs
      fiabilite: haute
  exemples: aucun trouvé
approximations:
- version: [code_de_1964, loi_du_21_aout_2003]
  ecart: >-
    Le modèle connaît la carrière au mois, et compte le mois pour trente jours : la
    fraction d'un mois se néglige, celle de deux mois fait le trimestre, alors que le
    service compte au jour — deux mois et vingt-deux jours ou un mois et seize jours ne
    sont pas un mois. Sur un relevé, la ligne de la fonction publique dit ses trimestres,
    fractions comprises, que le modèle ramène au jour (le trimestre pour quatre-vingt-dix
    jours).
  effet: >-
    au plus un trimestre liquidable et un trimestre de décote, quand la fraction de
    l'année d'entrée et celle du départ tombent de part et d'autre du seuil ; non mesuré
- version: [code_de_1964, loi_du_21_aout_2003]
  ecart: >-
    Les bonifications des emplois classés — le cinquième des policiers et des
    surveillants, des sapeurs-pompiers — se comptent en trimestres, arrondies à part
    (droit/compter.py, `trimestres_d_un_emploi`), avant d'être ajoutées au décompte
    final, quand le texte additionne services et bonifications au jour avant d'arrondir.
  effet: au plus un trimestre liquidable aux seuls agents des emplois classés ; non mesuré
- version: [loi_du_21_aout_2003]
  ecart: >-
    La durée tous régimes que lisent les autres régimes, le régime général d'abord,
    garde, pour l'année entamée dans la fonction publique, des trimestres entiers : le
    relevé arrondi au mois et demi, la carrière reconstituée aux trimestres civils
    écoulés. Seule la décote des trois régimes du code des pensions lit ces services au
    jour.
  effet: non mesuré ; au plus un trimestre de la durée tous régimes du régime général
- version: [code_de_1964]
  ecart: >-
    Le minimum garanti d'avant 2004 compte le décompte de la pension, bonifications
    comprises, comme son b le dit des pensions de moins de vingt-cinq ans ; son a, qui
    sert le minimum entier à vingt-cinq années de services EFFECTIFS, est lu sur le même
    décompte.
  effet: non mesuré ; les seules pensions d'avant 2004 portées au minimum par des bonifications
sources:
  lu_le: 2026-10-08
  prochaine_relecture: 2027-04-30
  lectures_divergentes:
  - >-
    TRAJECTOiRE (DREES, au commit 0963b57) garde les services en tiers de trimestre sans
    les arrondir, proratise sur eux (171,33/172) et ne fait aucune décote pour une
    fraction de trimestre manquante : le dépôt applique R. 26 au décompte final et
    arrondit les trimestres manquants à l'entier supérieur (tests/test_trajectoire.py,
    ARRONDI_SERVICES).
  a_relire:
  - >-
    Lire l'article 14 du décret n° 65-773 d'avant le 19 novembre 1985, que l'index LEGI
    ne porte pas : la version de 1964 le suppose identique pour la CNRACL.
  - >-
    Chercher comment le régime général compte, dans la durée tous régimes, les services
    d'une année entamée dans la fonction publique : trimestres entiers de l'année, ou
    total arrondi.
  lectures:
  - type: legifrance
    reference: >-
      R. 26 du code des pensions, rédactions du 1er décembre 1964 (LEGIARTI000006362923)
      et du 1er janvier 2004 (LEGIARTI000006362924) ; R. 26 bis ; L. 14 et L. 17, lus
      dans l'index LEGI du dépôt
    date: 2026-01-22
  - type: legifrance
    reference: >-
      décret n° 2003-1306, articles 16 (quatre rédactions, de LEGIARTI000006400878 à
      LEGIARTI000054059126) et 20 (LEGIARTI000054590030) ; décret n° 2004-1056, article
      13 (quatre rédactions) ; décret n° 65-773, article 14 (LEGIARTI000006368207) ;
      décret n° 65-836, article 7 (LEGIARTI000006766751), lus dans l'index LEGI
    date: 2026-08-01
  - type: autre
    reference: >-
      Conseil d'État, 9e et 10e sous-sections réunies, 2 février 2010, n° 311495,
      mentionné aux tables du recueil Lebon : un technicien supérieur de l'équipement
      liquidé au 1er septembre 2006 avec 155 trimestres, deux mois et vingt-deux jours,
      soit 156 trimestres et 75 %, que le ministre minorait de 1,25 %
    url: https://www.legifrance.gouv.fr/ceta/id/CETATEXT000021785214
    date: 2010-02-02
  - type: autre
    reference: >-
      CNRACL, documentation juridique, « Trimestres liquidables » (publiée le 22
      septembre 2016), son exemple : « Services liquidables : 20 ans 6 mois et 13 jours
      ; Bonifications : 1 an 1 mois et 2 jours [...] En liquidation du droit : 86
      trimestres 1 mois et 15 jours soit 86 trimestres et 45 jours donc 87 trimestres » ;
      « Conditions d'application du coefficient de minoration » (22 juin 2023), qui
      écarte la décote de qui « totalise en liquidation le nombre de trimestres
      nécessaires pour bénéficier du taux maximal de pension du fait de l'application
      de la règle d'arrondi » ; « Les modalités de calcul » du minimum garanti (2 mai
      2012) : « les services effectifs retenus en liquidation du droit et [...] la
      règle d'arrondi prévue à l'article 16-II »
    url: https://www.juris-cnracl.retraites.fr/pension-normale/calcul-de-la-pension/trimestres-liquidables
    date: 2023-06-22
  - type: autre
    reference: >-
      Service des retraites de l'État, pages « La formule de calcul » (« décomptée en
      années, mois et jours et arrêtée en trimestres » ; 29 années à temps plein et 10 à
      80 % font 148 trimestres), « La durée d'assurance » (« calculée en trimestres et
      jours sans règle d'arrondi ») et « La décote » (« Le nombre de trimestres obtenu
      est arrondi à l'entier supérieur »)
    url: https://retraitesdeletat.gouv.fr/actif/le-calcul-de-ma-retraite/la-formule-de-calcul
    date: 2026-10-08
textes_a_rattacher:
- reference: >-
    décret n° 65-773, article 14, rédaction d'avant le 19 novembre 1985, que l'index LEGI
    ne porte pas
  change: la date à laquelle la CNRACL compte ses annuités au semestre
code:
  python: >-
    droit/compter.py : compter, jours_de_la_ligne, arrondir_les_services, Durees
    (jours, decompte, ecart_au_jour, services_liquidables, services_effectifs) ;
    droit/liquider.py : liquider_chaque_regime, trimestres_de_decote ; carriere.py :
    AnneeCarriere.jours_de_services ; saisie.py : releve_analyse
  javascript: >-
    moteur/js/droit/compter.js ; moteur/js/droit/liquider.js ; moteur/js/carriere.js ;
    moteur/js/saisie.js
  parametres: les versions de cette fiche (contenu.parametres), que le paquet du site porte
  tests: [tests/test_decompte_des_services.py, tests/test_trajectoire.py]
referents:
  trajectoire:
    equivalent: >-
      services en tiers de trimestre, la durée validée de la caisse sans arrondi
      (bases.duree_validee), au commit 0963b57
    confrontation: >-
      tests/test_trajectoire.py : les décotes et les proratisations que l'arrondi
      sépare, déclarées contre TRAJECTOiRE (ARRONDI_SERVICES)
historique:
- >-
  2026-10-08 — écrite à l'étape 17 de l'action 138, sur l'écart que la confrontation à
  TRAJECTOiRE laissait ouvert : le modèle arrondissait les services année par année ;
  le texte n'arrondit qu'au décompte final, et pas la durée d'assurance.
reformes:
- fillon_2003
effet: >-
  Les fonctionnaires dont l'année d'entrée et celle du départ sont entamées : la fraction
  qu'elles laissent fait un trimestre de plus au décompte final quand elle atteint
  quarante-cinq jours — 0,45 % de pension à 166 trimestres requis, et la décote de 1,25 %
  qu'un tiers de trimestre manquant faisait, que l'arrondi efface quand il atteint la
  durée requise.
