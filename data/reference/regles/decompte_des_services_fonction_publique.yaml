schema_version: 1
id: decompte_des_services_fonction_publique
intitule: >-
  Les services du code des pensions se comptent au jour, en mois de trente jours, et ne
  s'arrondissent qu'une fois, au décompte final des trimestres liquidables : depuis 2004,
  la fraction de trimestre d'au moins quarante-cinq jours fait un trimestre, la fraction
  plus courte se néglige (R. 26 ; décret n° 2003-1306, article 16 ; décret n° 2004-1056,
  article 13), et de 1964 à 2003, la fraction de semestre d'au moins trois mois faisait
  six mois. La durée d'assurance que la décote lit ne s'arrondit pas ; les trimestres qui
  lui manquent s'arrondissent à l'entier supérieur (L. 14, I) ; la pension que l'arrondi
  porte au pourcentage maximum ne subit pas de décote (Conseil d'État, 2 février 2010, n°
  311495). Le minimum garanti compte les services effectifs, arrondis de même, sans les
  bonifications (L. 17).
domaine: duree
regimes:
- fonction_publique_etat
- cnracl
- fspoeie
etape: liquider_chaque_regime
face: droit
etat: approchee
lit:
- les mois de chaque année de services dans la fonction publique, ou, sur un relevé, ses
  trimestres, fractions comprises, à quatre-vingt-dix jours le trimestre
- la quotité de l'année, et le budget des services que L. 9 ouvre par enfant
- les trimestres que les autres régimes valident la même année
- la durée requise, et les bonifications qui ne tiennent à aucune année
- liquidation.date_effet
ecrit:
- les jours d'assurance et de services de chaque régime du code des pensions, année par
  année, et l'écart que leurs fractions font à la durée tous régimes (Durees.au_jour)
- les trimestres liquidables de ces régimes, la durée que leur décote lit et les services
  que leur minimum garanti compte
dates_qui_decident:
- liquidation.date_effet
# Les versions forment un partage de la date d'effet de la pension (§ 4.1). Le
# moteur (droit/compter.py, `compter` et `jours_de_la_ligne` ; droit/liquider.py,
# `liquider_chaque_regime` ; et leurs jumeaux) lit : `existe` ; `regimes`, ceux
# qui comptent au jour ; `unite_jours` et `seuil_jours`, l'unité du décompte
# final et la fraction qui en fait une, en jours de l'année de trois cent
# soixante ; `duree_au_jour`, si la durée d'assurance de la décote se compte au
# jour, sans arrondi, ses trimestres manquants arrondis à l'entier supérieur et
# la décote écartée quand l'arrondi atteint le pourcentage maximum ;
# `minimum_garanti`, ce que le minimum compte : `services_effectifs`, arrondis
# au décompte final, sans bonification, ou `liquidation`, le décompte de la
# pension, bonifications comprises ; `fiabilite`. Une valeur que le moteur ne
# connaît pas l'arrête.
