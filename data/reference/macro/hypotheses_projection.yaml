# Hypothèses de projection macroéconomique au-delà de la dernière année observée
# ------------------------------------------------------------------------------
# source_id: cor_rapport_annuel
#
# Au-delà de 2025, aucune série n'est observée. Geler la dernière valeur connue
# serait une hypothèse implicite et fausse : elle figerait l'inflation à 1,0 %
# et la productivité à 0,3 %, valeurs conjoncturelles qui écraseraient tout le
# calcul sur quarante ans. On explicite donc les hypothèses.
#
# LE JEU DE SCÉNARIOS EST CELUI DU COR, DANS SA NOMENCLATURE ACTUELLE
# -------------------------------------------------------------------
# Un scénario de référence et deux variantes de productivité, telles que le
# Conseil d'orientation des retraites les retient depuis son rapport de juin
# 2025 : « les membres du COR ont décidé de ne plus retenir de variante de
# productivité à 1,3 %, prenant note du ralentissement structurel de la
# productivité. Les hypothèses de croissance annuelle de la productivité du
# travail retenues sont maintenant de 0,4 %, 0,7 % et 1,0 % » (rapport annuel,
# juin 2025, partie 1). Le rapport de juin 2026 reconduit exactement ce jeu :
# référence à 0,7 %, variantes à 0,4 % et 1,0 %.
#
# Ce fichier retenait auparavant 0,7 / 1,0 / 1,3 % en appelant « central » le
# 1,0 % et « défavorable » le 0,7 % : c'était la nomenclature d'avant 2024, et
# elle nommait « défavorable » ce qui est devenu la référence. La variante de
# stagnation à 0,3 %, ajoutée ici faute de plancher assez bas chez le COR, a
# disparu avec l'arrivée du 0,4 % qui la rend redondante.
#
# TROIS ÉCARTS ASSUMÉS AVEC LE COR, QU'IL FAUT CONNAÎTRE POUR LIRE LES CHIFFRES
# -----------------------------------------------------------------------------
# 1. Le COR raisonne en productivité HORAIRE ; le modèle, en productivité par
#    tête, la seule que l'INSEE publie en série longue et que `productivite.csv`
#    certifie de 1950 à 2025. Les deux ne coïncident qu'à durée du travail
#    constante.
# 2. Le COR atteint sa cible PROGRESSIVEMENT — 0,7 % à partir de 2040, chômage
#    à 7 % en 2040 ; le modèle applique le taux dès 2026, sans trajectoire de
#    convergence. Le raccord est donc brutal : 1,77 % de croissance du salaire
#    moyen observée en 2025, 2,45 % l'année suivante dans le scénario de
#    référence.
# 3. Le COR projette l'emploi et la population active ; ici l'emploi suit, par
#    défaut, la trajectoire de son scénario de référence (`trajectoires_emploi`
#    ci-dessous), lue dans `emploi_projete.csv`, et reste constant au-delà de
#    2070, où le COR s'arrête. Jusqu'au 20 septembre 2026 il était supposé
#    CONSTANT, ce que la trajectoire `constant` conserve comme variante.
#
# L'INFLATION N'EST PAS UNE CIBLE DE BANQUE CENTRALE
# ---------------------------------------------------
# 1,75 % est la convention de long terme que le COR reconduit de rapport en
# rapport, et non la cible de la BCE, qui est de 2 % symétrique depuis la revue
# stratégique de juillet 2021. Les documents publics de juin 2025 et de juin
# 2026 ne restatent pas explicitement ce 1,75 % : il est ici conservé faute
# d'une valeur publiée qui le remplace, et c'est le paramètre le moins solide
# du fichier. Il pèse peu sur les comparaisons — toutes les règles d'indexation
# du modèle sont nominales et l'affichage est en euros constants — mais il pèse
# sur les montants affichés.
#
# Convention : croissance nominale du salaire moyen = productivité réelle
# + inflation. À long terme le partage de la valeur ajoutée est supposé stable,
# donc les salaires réels progressent au rythme de la productivité.
#
# Convention pour la MASSE SALARIALE : masse salariale = salaire moyen × emploi
# salarié. Les taux `masse_salariale_nominale` ci-dessous sont ceux du salaire
# moyen, À EMPLOI CONSTANT ; le modèle les COMPOSE ensuite, année par année,
# avec la croissance de l'emploi de la trajectoire retenue :
#     (1 + salaire moyen) × (1 + emploi de l'année) − 1.
# Sous la trajectoire `constant`, la composition ne change rien. Sous
# `cor_2026`, la masse salariale progresse plus vite que le salaire moyen
# jusqu'en 2040 (+4,7 % d'emploi cumulé) et moins vite ensuite (−6,0 % en
# 2070) : c'est le scénario de référence du COR de juin 2026, population
# active de la DG Trésor sur les projections de population 2026 de l'INSEE
# (fécondité 1,45, solde migratoire +150 000) et chômage ramené à 7 % en 2040.
# Sur 1950-2025 l'emploi salarié a été multiplié par 2,14, soit près d'un
# point de croissance annuelle : ni l'une ni l'autre trajectoire ne le
# reconduit.
#
# Le PIB nominal suit la même convention que la masse salariale : au-delà de
# 2025, il croît au rythme du salaire moyen nominal composé avec l'emploi.
# Supposer autre chose reviendrait à projeter une déformation du partage de la
# valeur ajoutée, ce qu'aucun des scénarios retenus ne fait.
#
# QUI LIT QUOI. Le salaire moyen, l'inflation et la productivité sont lus par
# tous les systèmes. La masse salariale et le PIB ne sont lus que par
# l'INDEXATION DES COMPTES NOTIONNELS, donc par les systèmes 2 à 6 : le
# système 1, droit en vigueur, revalorise sur les prix et ne lit ni l'une ni
# l'autre. La trajectoire d'emploi ne déplace donc que les systèmes réformés,
# et c'est voulu : elle est l'hypothèse du programme, pas celle du droit
# constant — voir docs/limites.md, « Ce que l'emploi projeté déplace ».

annee_derniere_observation: 2025
annee_fin_projection: 2100

scenario_par_defaut: cor_reference

scenarios:

  cor_reference:
    libelle: COR référence — productivité 0,7 % par an
    inflation: 0.0175
    productivite_reelle: 0.007
    salaire_moyen_nominal: 0.0245
    masse_salariale_nominale: 0.0245   # à emploi constant, composé ensuite
    pib_nominal: 0.0245               # partage de la valeur ajoutée stable

  cor_productivite_basse:
    libelle: COR variante basse — productivité 0,4 % par an
    inflation: 0.0175
    productivite_reelle: 0.004
    salaire_moyen_nominal: 0.0215
    masse_salariale_nominale: 0.0215   # à emploi constant, composé ensuite
    pib_nominal: 0.0215               # partage de la valeur ajoutée stable

  cor_productivite_haute:
    libelle: COR variante haute — productivité 1,0 % par an
    inflation: 0.0175
    productivite_reelle: 0.010
    salaire_moyen_nominal: 0.0275
    masse_salariale_nominale: 0.0275   # à emploi constant, composé ensuite
    pib_nominal: 0.0275               # partage de la valeur ajoutée stable

# LES HYPOTHÈSES D'UNE AUTRE INSTITUTION, POUR SE CONFRONTER À SES RÉSULTATS
# --------------------------------------------------------------------------
# Ce ne sont pas des variantes du COR : aucun compte publié ne leur correspond
# (`comptes_retraite_variantes.csv`), le site ne les propose pas, et la page
# Coût ne s'y calcule pas. Elles servent à refaire, sous les conventions d'un
# autre, un résultat qu'il publie : `Parametres(scenario_projection=...)` les
# nomme comme un scénario.
#
# L'OCDE projette ses carrières types de *Pensions at a Glance* sous des
# prix à +2 % l'an et des salaires réels à +1,25 %, « ce qui implique une
# croissance nominale des salaires de 3,275 % » — le produit, et non la somme
# que les scénarios du COR ci-dessus retiennent (Pensions at a Glance 2025,
# p. 160-161, et Pensions at a Glance Asia/Pacific 2024, « Methodology and
# assumptions » ; registre des modèles, `modeles_ocde`). L'emploi n'y entre
# pas : la masse salariale et le PIB suivent le salaire moyen, et la
# trajectoire d'emploi retenue les compose comme ailleurs.
jeux_de_reference:

  ocde_2025:
    libelle: OCDE, Pensions at a Glance 2025 — prix +2 %, salaires réels +1,25 %
    inflation: 0.02
    productivite_reelle: 0.0125
    salaire_moyen_nominal: 0.03275
    masse_salariale_nominale: 0.03275
    pib_nominal: 0.03275

# L'emploi au-delà de la dernière observation. La trajectoire par défaut est
# celle du scénario de référence du COR de juin 2026 ; `constant` est la
# convention d'avant, gardée pour mesurer ce que la trajectoire déplace.
# Chaque trajectoire nomme le fichier de `data/reference/macro/` qui la porte,
# colonne `croissance_emploi` ; sans fichier, l'emploi est constant.
trajectoire_emploi_par_defaut: cor_2026

trajectoires_emploi:

  constant:
    libelle: Emploi constant après la dernière observation

  cor_2026:
    libelle: Emploi du scénario de référence du COR — juin 2026
    fichier: emploi_projete.csv

# LES VARIANTES DE CHÔMAGE SONT UNE AUTRE DIMENSION, ET LE COR LES SÉPARE
# ------------------------------------------------------------------------
# On croit volontiers qu'une croissance plus forte apporte moins de chômage.
# Le COR ne le suppose pas : ses trois variantes de productivité tiennent
# TOUTES le chômage à 7 % à partir de 2040, et il fait varier le chômage dans
# une figure à part — la 2.21 du rapport de juin 2026, contre la 2.22 pour la
# productivité. Les deux dimensions se croisent, elles ne se déduisent pas
# l'une de l'autre.
#
# Ces variantes ne déplacent PAS les hypothèses ci-dessus : elles ne changent
# ni le salaire moyen, ni l'inflation, ni la productivité. Ce qu'elles
# changent est le COMPTE DU SYSTÈME — la dépense et le solde en part de PIB —,
# que le COR publie variante par variante et que
# `comptes_retraite_variantes.csv` porte. `etiquette_cor` est le libellé sous
# lequel la figure les écrit ; c'est la clé du rapprochement, et elle est ici
# pour que personne n'ait à la deviner dans un script.

variantes_chomage:

  cor_chomage_bas:
    libelle: COR variante — chômage ramené à 5 % en 2040
    etiquette_cor: var c5%
    taux_cible: 0.05

  cor_chomage_haut:
    libelle: COR variante — chômage porté à 10 % en 2040
    etiquette_cor: var c10%
    taux_cible: 0.10

# Le plafond de la Sécurité sociale suit la croissance du salaire moyen, ce qui
# est la règle en vigueur (article L. 241-3 du code de la sécurité sociale).
plafond_suit_salaire_moyen: true

# LES CONVENTIONS DU COR POUR LE SCÉNARIO 1 (action 147, étape 4)
# ----------------------------------------------------------------
# Deux hypothèses de projection que le COR pose sur le droit en vigueur, et
# que le modèle suivait mal : ce ne sont pas des règles de droit, mais ce que
# le COR SUPPOSE des décisions à venir. Elles servent à rapprocher la
# projection du système actuel de la sienne (docs/limites.md, § 5 ter).

# Le rendement de l'Agirc-Arrco. Source : rapport annuel du COR de juin 2026,
# partie 1, chapitre 2, encadré « Le pilotage de l'Agirc-Arrco » (p. 61) :
# « En 2026, [la valeur de service] est indexée sur l'inflation hors tabac
# estimée par l'Insee pour l'année en cours, diminuée d'un coefficient de
# soutenabilité de 0,4 point. La valeur d'achat du point, pour sa part,
# progresse chaque année au 1er janvier en fonction de l'évolution du salaire
# moyen du secteur privé de l'année précédente. Sur la période 2027-2037, la
# valeur de service évoluerait comme le salaire moyen, minoré de 1,16 %,
# tandis que la valeur d'achat continuerait de suivre le salaire moyen. À
# compter de 2038 [...] la valeur de service et la valeur d'achat du point
# évolueraient conventionnellement selon la même hypothèse, c'est-à-dire
# comme l'évolution du salaire moyen du secteur privé minoré de 0,86 % ».
#
# Chaque ligne vaut de son année `depuis` à la suivante. `suit` nomme l'indice
# (prix : l'IPC du modèle, que l'inflation hors tabac ne distingue pas ;
# salaire_moyen : le salaire moyen par tête de l'ensemble de l'économie, que
# le secteur privé ne distingue pas), `ecart` le point que le COR en retranche
# (additif : 1,16 % est 1,16 point), `decalage` l'année de l'indice : 0 pour la
# valeur de service, relevée au 1er novembre sur l'année en cours ; 1 pour la
# valeur d'achat, relevée au 1er janvier sur l'année précédente. Une année
# déjà publiée dans regimes/valeurs_point.csv l'emporte : la convention ne
# prolonge que ce qui n'est pas publié (scenarios/actuel.py, ValeursPoint).
conventions_points:
  agirc_arrco:
    valeur_service:
      - {depuis: 2026, suit: prix, ecart: -0.004, decalage: 0}
      - {depuis: 2027, suit: salaire_moyen, ecart: -0.0116, decalage: 0}
      - {depuis: 2038, suit: salaire_moyen, ecart: -0.0086, decalage: 0}
    valeur_achat:
      - {depuis: 2027, suit: salaire_moyen, ecart: 0.0, decalage: 1}
      - {depuis: 2038, suit: salaire_moyen, ecart: -0.0086, decalage: 1}
#
# Une autre convention du COR sur l'Agirc-Arrco, du passé autant que de
# l'avenir, n'est pas ici : ses cas types cotisent au TAUX MOYEN des
# entreprises (« pour l'Agirc-Arrco, les cotisations sont supposées prélevées
# au taux moyen », notes des figures 3.3 et 3.4), et non au taux minimal des
# fiches. La série est regimes/taux_moyens_agirc_arrco.csv, celle du modèle
# Trajectoire de la DREES ; sous les mêmes conventions, le chargeur des fiches
# en redate les périodes (donnees/regimes.py, dater_les_taux_moyens ; action
# 147, étape 10).

# Le traitement indiciaire des fonctionnaires. Source : annexe méthodologique
# en ligne du rapport de juin 2026, § « Le profil par âge des rémunérations et
# la part des primes », note 40 : « En 2026 et 2027, le traitement indiciaire
# moyen évolue de 0,1 % en euros courants [...]. De 2028 à 2032, [...] la
# progression du traitement indiciaire moyen est limitée à +0,1 % par an en
# euros constants. Entre 2033 et 2037, le rythme d'évolution du traitement
# indiciaire moyen est raccordé en cinq ans à celui de l'ensemble de
# l'économie puis évolue ensuite au même rythme. La part des primes augmente
# en conséquence jusqu'en 2037 puis devient stable. »
#
# Le modèle en tire le traitement indiciaire RELATIF au salaire moyen, 1 en
# `annee_base` : chaque année, la croissance que la note donne au traitement,
# rapportée à celle du salaire moyen. `nominal` et `reel` sont des taux
# annuels, en euros courants et en euros constants ; `raccord` va, en autant
# d'années qu'il en compte, du taux réel au salaire moyen, par parts égales.
# Les cas types de fonctionnaires (castypes.py) gardent leur rémunération
# totale, et voient leur part des primes monter d'autant : 1 - (1 - part) × le
# traitement relatif. La note 40 fait aussi décrocher, puis converger, le
# salaire total des fonctionnaires (« le SMPT total [...] évolue comme
# l'inflation » en 2026 et 2027) : le modèle ne le suit pas.
#
# `passe` est le décrochage déjà fait (action 147, étape 9). Source : classeur
# des données de la partie 1 du rapport de juin 2026 (« Données_RA2026_P1 »,
# feuille « Fig 1.14 », Direction du budget pour le COR) : le traitement
# indiciaire moyen des fonctionnaires des trois versants (« TI
# fonctionnaires ») et le revenu moyen d'activité de l'ensemble de l'économie
# (« RMPT »), en réel, base 100 en 2025, de 2019 à 2024. Leur rapport est le
# traitement relatif de l'année : 1,041 en 2019, 1,092 en 2020, où le revenu
# moyen plonge avec l'activité partielle et le salaire moyen du modèle avec
# lui. La part des primes de l'État y monte de 23,1 % à 27,9 % (figure 1.15).
# Avant 2019, que la figure ne couvre pas, le premier rapport est reconduit :
# le point d'indice a perdu le tiers de sa valeur sur le salaire moyen depuis
# 2000, et le décrochage d'avant est sous-estimé d'autant.
# L'entrée tardive dans la fonction publique de l'État (action 147, étape 11).
# Deux sources. L'annexe méthodologique en ligne du rapport de juin 2026
# (§ 2.1, cas types de fonctionnaires de l'État), d'après l'EIC 2013 de la
# DREES et les comptes individuels retraite du SRE : « les fonctionnaires
# entrent dans la vie active en moyenne un à trois ans avant d'entrer dans le
# régime de la FPE ». Le rapport de juin 2026, partie 2, chapitre 1, note 69 :
# « La durée retenue pour le coefficient de proratisation serait en baisse
# d'environ 6 ans entre les générations qui partent actuellement à la
# retraite et la génération 2000. »
#
# Le cas type de fonctionnaire sédentaire (castypes.py) commence sa carrière
# au même âge, mais sous le statut que nomme son champ
# `affiliation_avant_entree` — contractuel de la fonction publique — pendant
# `annees` années : deux pour la génération 1962, qui part en ce moment, huit
# pour la génération 2000, et de l'une à l'autre en ligne droite ; avant la
# première et après la seconde, la valeur du bord. Il part à l'âge que le droit
# ouvre à sa carrière d'un seul statut (pilote.py) : seule sa pension se
# partage, entre l'État d'un côté, le régime général et l'Ircantec de l'autre.
entree_fonction_publique:
  - {generation: 1962, annees: 2}
  - {generation: 2000, annees: 8}

traitement_indiciaire:
  annee_base: 2025
  nominal: {depuis: 2026, jusqu_a: 2027, taux: 0.001}
  reel: {depuis: 2028, jusqu_a: 2032, taux: 0.001}
  raccord: {depuis: 2033, jusqu_a: 2037}
  passe:
    annees: [2019, 2020, 2021, 2022, 2023, 2024]
    traitement: [104.9859, 105.8025, 104.1480, 101.1954, 101.1904, 99.6608]
    revenu_moyen: [100.8719, 96.9277, 100.1965, 100.2078, 99.2465, 99.6146]
