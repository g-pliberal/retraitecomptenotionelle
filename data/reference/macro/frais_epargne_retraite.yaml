# Frais des plans d'épargne retraite individuels (PER assurantiels)
# -----------------------------------------------------------------
# source_id: opef_rapport_annuel
#
# À QUOI CES FRAIS SERVENT. Le pilier de capitalisation obligatoire de la
# proposition est logé dans l'enveloppe qui existe déjà — le PER, articles
# L. 224-1 et suivants du code monétaire et financier. Une enveloppe a un prix,
# et une simulation qui l'oublierait surestimerait la rente : trois postes la
# grèvent, et ce sont ceux que l'Observatoire des produits d'épargne financière
# mesure chaque année sur les remises de l'ACPR.
#
# QUELS FRAIS, ET POURQUOI CEUX-LÀ. Le pilier est placé en titres sans risque,
# c'est-à-dire sur l'équivalent d'un fonds en euros. Ce sont donc les lignes
# « support en euros » qui s'appliquent, et non celles des unités de compte ou
# de la gestion pilotée, plus chères. Les frais d'arbitrage (0,07 % en 2025) ne
# figurent pas : il n'y a pas d'arbitrage dans une allocation qui suit une règle
# d'horizon, et aucun versement n'est arbitré d'un support à l'autre.
#
# CE QUE CES VALEURS NE SONT PAS. Ce sont les frais du PER TEL QU'IL EST VENDU
# AUJOURD'HUI, à des souscripteurs volontaires, contrat par contrat. Un pilier
# obligatoire n'aurait ni la même collecte, ni les mêmes coûts d'acquisition —
# la commission du réseau qui place le contrat est l'essentiel du frais sur
# versement, et elle n'a pas d'objet quand la cotisation est obligatoire. Les
# retenir tels quels est donc une borne HAUTE, assumée comme telle : elle dit ce
# que la proposition coûterait si rien ne bougeait dans la tarification. La page
# Méthode le dit, et le paramètre se change en un endroit.
#
# CE QUE LE RAPPORT LUI-MÊME AJOUTE, lu le 20 septembre 2026 (tableaux T5 à
# T7, pages 35 à 38 du rapport 2026) :
#
# - Le frais sur versement du PER est le double de celui de l'assurance-vie
#   (1,09 % contre 0,55 %) et six fois celui du contrat de capitalisation
#   (0,19 %) — les mêmes assureurs, les mêmes fonds en euros. L'OPEF l'explique
#   par des FRAIS FIXES de construction de l'offre et de gestion des contrats,
#   qui pèsent plus lourd sur des primes petites : 62 % des montants versés en
#   assurance-vie viennent de versements de plus de 50 000 €, contre 12 % sur
#   le PER. Une cotisation prélevée sur chaque paie, pour toute une population,
#   n'a pas cette structure de coût.
# - Le frais de gestion du fonds en euros varie peu d'un produit à l'autre :
#   0,76 % sur le PER, 0,67 % en assurance-vie, 0,70 % en capitalisation. C'est
#   le prix d'un fonds en euros géré par un assureur, garantie en capital et
#   participation aux bénéfices comprises — pas celui d'une échelle de titres
#   d'État portés à l'échéance, qui est ce que le modèle simule.
# - La moyenne des frais sur arrérages est NON PONDÉRÉE et ne porte que sur
#   les organismes qui les facturent : 9 sur 20 pour le PER individuel en
#   2025. Les onze autres ne prélèvent rien sur la rente. La valeur ci-dessous
#   est donc la moyenne de ceux qui facturent, pas celle du marché ; l'OPEF
#   rappelle que le taux de 3 % vient d'une contrainte réglementaire abrogée en
#   1993 et que ces frais couvrent des coûts en partie fixes (paiement,
#   déclarations fiscales et sociales, options de réversion).
#
# CE QUE COÛTE UN RÉGIME OBLIGATOIRE, pour situer la borne haute (sources dans
# data/sources.yaml et docs/limites.md §5 ante) : la prime de pension
# suédoise, capitalisation obligatoire de 2,5 % du salaire, coûte 0,11 % des
# encours de frais de fonds après remise et 0,024 % d'administration (2026) ;
# le Fonds de réserve pour les retraites porte des coûts fixes de 8,6 points de
# base de l'actif net, et des charges totales de 84 M€ pour 20,4 Md€ d'actif
# net en 2024, soit 0,41 %, mandats de gestion active compris ; l'ERAFP
# provisionne « des frais futurs de gestion d'au moins 0,2 % des encours ».
# Aucune de ces enveloppes ne prélève de frais sur versement, ni sur arrérages.
#
# SENSIBILITÉ, mesurée sur le modèle le 20 septembre 2026 pour une carrière
# entière cotisée après la bascule (né en 2004, 22-64 ans, non-cadre) : sans
# aucun frais la rente serait supérieure de 22 % ; avec 0,20 % de gestion et
# les deux autres postes inchangés, de 13 % ; sans frais sur versement seul,
# de 1 %. Le frais de gestion est le poste qui compte, parce qu'il s'applique
# chaque année à tout l'encours. docs/limites.md §5 ante donne le tableau.
#
# NIVEAU DE FIABILITÉ. `haute`, et non `certifiee` : les trois valeurs ont été
# SAISIES depuis la reprise du rapport par la presse spécialisée, puis
# CONFRONTÉES au document du producteur le 20 septembre 2026 par
# scripts/fetch/opef_frais_per.py (tableau T7, valeurs 2024 et 2025 identiques
# à la saisie). La confrontation prouve la saisie ; elle ne la remplace pas
# par une lecture automatique tenue par scripts/verifier_donnees.py, seul
# habilité à apposer `certifiee`, et le document n'est pas encore sur le
# miroir du dépôt : la règle du manifeste plafonne donc à `haute`.

source_id: opef_rapport_annuel
annee_reference: 2025
publication: Rapport annuel 2026 de l'Observatoire des produits d'épargne financière
fiabilite: haute
confronte_au_document_le: "2026-09-20"

# Tous en fraction de l'assiette indiquée.
frais:

  versement:
    valeur: 0.0109
    assiette: chaque versement
    libelle: Frais sur versement, support en euros
    note: >-
      Moyenne pondérée des PER individuels assurantiels en 2025, en repli de 7
      points de base sur 2024 (1,16 %). L'assurance-vie, à barème comparable,
      est à 0,55 % et le contrat de capitalisation à 0,19 % : l'écart tient au
      mode de commercialisation et à la taille des primes, non au produit.

  gestion:
    valeur: 0.0076
    assiette: encours, par an
    libelle: Frais de gestion annuels sur encours, support en euros
    note: >-
      Moyenne pondérée 2025, en repli d'un point de base. Les unités de compte
      sont à 0,91 % en moyenne, la gestion pilotée à 0,92 % : le pilier étant
      placé en titres sans risque, c'est la ligne « euros » qui s'applique.
      C'est le poste qui pèse : il s'applique chaque année à tout l'encours.

  arrerages:
    valeur: 0.0220
    assiette: chaque arrérage de rente
    libelle: Frais sur arrérages de la rente viagère
    note: >-
      Moyenne 2025, en hausse d'un point de base. C'est le prélèvement de
      l'assureur sur chaque versement de rente ; il réduit la rente servie
      d'autant, et non le capital qui la constitue. Moyenne NON PONDÉRÉE des 9
      organismes qui facturent ces frais, sur 20 déclarants : les onze autres
      ne prélèvent rien sur la rente.

# CE QUE VALENT CES MOYENNES, ET CE QU'ON SAIT DES MÉDIANES
# ----------------------------------------------------------
# Rien de ce bloc n'entre dans le calcul : il dit ce que les trois valeurs
# ci-dessus représentent, et ce que d'autres mesures du même marché donnent.
# Lu le 20 septembre 2026 sur les deux documents cités.
#
# Les frais sur versement et de gestion de l'OPEF sont des MOYENNES PONDÉRÉES
# de tout le marché des PER individuels assurantiels remis à l'ACPR : par les
# primes pour le versement, par l'encours moyen pour la gestion. Ce sont donc
# les vraies moyennes du marché, un euro versé ou placé pesant un euro. Aucune
# source publique n'en donne la médiane : ni l'OPEF, ni le CCSF, dont le
# rapport de 2021 (Sémaphore Conseil, 34 PER assurance, tarifs affichés dans
# les notices, moyennes arithmétiques non pondérées) donne le minimum, le
# maximum, la moyenne et la moyenne par catégorie de distributeur.
#
# Les frais sur arrérages de l'OPEF sont une MOYENNE NON PONDÉRÉE DES SEULS
# ORGANISMES QUI FACTURENT. Sur tous les déclarants, les autres prélevant zéro,
# la moyenne non pondérée est la publiée fois la part des facturants, et la
# médiane est nulle dès qu'ils sont moins de la moitié.
distributions:
  source_marche: opef_rapport_annuel
  source_panel: ccsf_rapport_per_2021
  versement:
    opef_2025_moyenne_ponderee_primes: 0.0109
    opef_mediane: non publiée
    ccsf_2021_panel_34_contrats:
      moyenne: 0.0318
      minimum: 0.0
      maximum: 0.05
      note: >-
        Frais MAXIMUM affichés dans les notices, avant négociation et
        promotion : les courtiers en ligne du panel sont à 0 %, les banques à
        réseau et mutuelles proches de 3 %, les CGP et sociétés d'assurance à
        4,5 et 4,8 %. Les CGP indiquent que les frais réellement pratiqués
        sont bien plus faibles. La moyenne pondérée par les primes de l'OPEF
        (1,09 % en 2025, 1,20 % en 2023) est la mesure de ce qui est payé.
  gestion:
    opef_2025_moyenne_ponderee_encours: 0.0076
    opef_mediane: non publiée
    ccsf_2021_panel_34_contrats:
      moyenne: 0.0087
      minimum: 0.006
      maximum: 0.02
      note: >-
        Le maximum de 2 % est un fonds en euros « nouvelle génération » d'un
        seul contrat ; hors lui, le maximum est 1 %. Par catégorie : 0,66 %
        (mutuelles) à 0,93 % (CGP). Frais en général non négociables. La
        dispersion est étroite : la médiane ne peut pas s'écarter beaucoup de
        la moyenne, entre 0,75 et 0,90 %.
  arrerages:
    opef_2025_moyenne_facturants: 0.0220
    opef_2025_organismes_facturant: 9
    opef_2025_organismes_declarants: 20
    opef_2025_moyenne_tous_declarants: 0.0099
    opef_2025_mediane_declarants: 0.0
    opef_2025_assurance_vie: {moyenne_facturants: 0.0279, facturant: 14, declarants: 21, moyenne_tous: 0.0186}
    opef_2025_capitalisation: {moyenne_facturants: 0.0294, facturant: 5, declarants: 18, moyenne_tous: 0.0082, mediane: 0.0}
    ccsf_2021_panel_30_contrats_proportionnels:
      moyenne_zeros_compris: 0.0118
      minimum: 0.0
      maximum: 0.03
      contrats_a_zero: 11
      par_categorie:
        banques_a_reseau: 0.0060
        courtiers_cgp: 0.0064
        courtiers_en_ligne: 0.0125
        societes_d_assurance: 0.0150
        mutuelles_d_assurance: 0.0230
      note: >-
        Moyenne arithmétique des tarifs affichés, ZÉROS COMPRIS : onze
        contrats sur trente ne prélèvent rien. La médiane n'est pas publiée ;
        avec onze zéros sur trente, elle est strictement positive.
  # UN FRAIS QUE LE MODÈLE NE COMPTE PAS. Le CCSF relève que « 22 contrats
  # affichent également des frais sur encours de rentes, avec un minimum de
  # 0,60 % et un maximum de 1 % par an ». C'est un prélèvement annuel sur la
  # réserve qui porte la rente, distinct des frais sur arrérages, et l'OPEF ne
  # le mesure pas. Sur la table du modèle, à taux technique nul, un tel frais
  # équivaut à une rente réduite de 9 % (0,60 %) à 15 % (1 %), quelle que soit
  # la génération : il pèse quatre à sept fois les 2,20 % d'arrérages. Le
  # modèle ne le retient pas, comme il ne retient pas la table de mortalité
  # prudente d'un assureur : sa rente est celle d'un régime qui convertit au
  # diviseur du compte notionnel. docs/limites.md §5 ante le chiffre.
  encours_de_rentes_non_modelise:
    ccsf_2021_contrats_facturant: 22
    ccsf_2021_contrats_panel: 34
    minimum_annuel: 0.006
    maximum_annuel: 0.010
    effet_sur_la_rente_au_diviseur_du_modele: de -9 % à -15 %
