# Ce que chaque section de la prose du dépôt AFFIRME — et donc ce qu'un test
# peut en exiger. Lu par `scripts/verifier_prose.py` ; voir son en-tête pour la
# mécanique, et `docs/fraicheur.md` pour la raison d'être.
#
# Quatre régimes, et un seul est contraignant :
#
#   etat        la section décrit ce qui est vrai AUJOURD'HUI. Tout chiffre y
#               est ancré sur une sonde qui le recalcule, et un chiffre nu y
#               est refusé.
#   recit       la section raconte ce qui s'est passé un jour. Ses chiffres
#               sont justes à leur date, gelés, et les rafraîchir serait
#               réécrire l'histoire.
#   produit     la section est écrite par un script, qui a déjà son test.
#   a_declarer  personne n'a encore tranché. Le cliquet les compte.
#
# Le cliquet, en bas, est ce qui fait avancer le dépôt sans qu'on y pense : il
# ne peut que décroître. Une section nouvelle dans un fichier `a_declarer` le
# fait monter, et le test échoue jusqu'à ce qu'on ait dit ce qu'elle engage.

fichiers:

  # ------------------------------------------------------------------------
  # Le document le plus lu : c'est par lui qu'on commence.
  # ------------------------------------------------------------------------
  README.md:
    defaut: a_declarer
    # Le tableau des règles d'indexation est écrit par
    # `scripts/construire_tableaux_md.py` depuis le modèle, et un test refuse
    # une copie périmée : ses cellules n'ont pas à porter une ancre chacune.
    # Le site le calculait déjà à chaque rendu ; les deux copies de la prose,
    # recopiées à la main, donnaient le PIB nominal à 1 068,6 % pour 1 068,3.
    blocs_produits:
      - indexation
      # Et le tableau des générations, qui mesure ce que la correction de la
      # ligne de référence déplace : cinq simulations du scénario rétroactif
      # sous deux règles d'indexation. Il était lui aussi recopié, et il avait
      # vieilli d'un point sur la génération 1920 — le modèle a bougé depuis.
      - generations
      # La sortie de l'exemple du §3 — une fonctionnaire d'État née en 1975 —,
      # que le modèle imprime et que la prose recopiait : elle annonçait une
      # rente de 1 569 € quand le modèle en sert 1 515.
      - exemple_fonctionnaire
      # Et celle de l'agent de conduite de l'introduction, qui donnait au
      # scénario 4 une pension de 7 481 € quand le modèle en sert 7 159.
      - exemple_sncf
    # « Le site a d'abord exécuté le Python lui-même, par Pyodide » ouvre un
    # paragraphe qui raconte l'époque d'avant le portage : ses 13,5 Mo et ses
    # 263 Ko sont ceux de ce temps-là, au milieu d'une section d'état.
    paragraphes_recit:
      - "Le site a d'abord exécuté le Python lui-même"
      # Deux paragraphes du §5 racontent comment le contrôle externe s'est
      # dégradé, puis comment le défaut qu'on croyait en cause a été corrigé :
      # leurs 18,3, 19,3, 19,5 et 19,4 % sont les étapes de septembre 2026. Le
      # paragraphe qui les suit dit ce que la trajectoire vaut aujourd'hui.
      - "Le contrôle externe s'est dégradé deux fois"
      - "**Ce défaut-là est corrigé"
      # Et la correction de l'indexation des pensions liquidées, le
      # 19 septembre 2026 : ses +0,12 et −0,88 % sont l'avant et l'après.
      - "**Et les pensions LIQUIDÉES"
    sections:
      # L'introduction : les paramètres de la proposition sont ceux du modèle,
      # et le partage des 23 points se lit sur la fiche de paie de deux
      # salariés d'exemple. Elle annonçait +182 € par mois au salaire moyen
      # quand la fiche en donne 203 : la CSG rendue était arrivée depuis.
      "Retraite à comptes notionnels — modèle français rétroactif": etat
      # Le tableau des exigences : des comptes de fichiers, des paramètres de
      # droit lus dans leur table, et ce que le régime unique retient. Il
      # annonçait 36 réformes pour 89, un âge de fusion de 64/67 ans quand le
      # régime unique ouvre à 65 et donne le taux plein à 67,5, un taux du
      # régime général de 16,35 % en 1991 pour 15,8, et 469 témoins pour 494.
      "Ce que le modèle fait": etat
      # Les sources, et comment on les rafraîchit : des périodes de séries,
      # des comptes de valeurs certifiées. Les âges des espérances de vie sont
      # les libellés des séries, et le 6,6651 € une conversion de francs.
      "Les données": etat
      Ouvrir le simulateur: etat
      # Le corps de la section : ce que le premier chargement transfère, ce que
      # `index.html` charge, et le poids du portage.
      "👉 [g-pliberal.github.io/retraitecomptenotionelle](https://g-pliberal.github.io/retraitecomptenotionelle/)": etat
      Tests: etat
      # Ce que le dépôt EST : comment on l'ouvre, comment on l'appelle en
      # Python, comment ses répertoires sont rangés, ce que ses options
      # exposent, sous quelle licence. Rien n'y raconte : ces sections se
      # lisent pour agir, et une seule ligne périmée s'y voit tout de suite.
      # Les six résultats et les sections de données restent à arbitrer : ce
      # sont des mesures, et chacune demande sa sonde.
      "Ouvrir le site en local": etat
      "En Python, hors du site": etat
      "En bibliothèque": etat
      "Six résultats à connaître avant de lire les chiffres": etat
      "Organisation": etat
      "Principales options": etat
      "Licence": etat
      # Les deux premiers résultats : tout chiffre y est une MESURE du modèle
      # — un écart de pension, un rendement cumulé, un taux du régime unique —
      # que la sonde `mesure` recalcule. Ils étaient recopiés d'une exécution,
      # et le 22 septembre 2026 aucune carrière ne rendait plus ceux du §1 ter
      # et du §1 quater ; le taux du régime unique avait vieilli d'un dixième.
      "1. La règle d'indexation domine tout le reste": etat
      "1 bis. Le minimum n'est pas la seule statistique : médiane et moyenne": etat
      "1 ter. La règle que la théorie désigne : la masse salariale": etat
      "1 quater. Le lissage pluriannuel, qui n'est pas une règle": etat
      "2. La fusion augmente les cotisations des indépendants": etat
      # Les taux de la contribution employeur lisent leur cellule, et ce que
      # l'exemple affiche est la mesure de l'exemple. La part salariale du
      # régime général y était donnée à 40,87 %, que plus aucune fiche ne
      # porte, et la série publique à « neuf régimes », quand elle en a huit.
      "3. La part patronale pèse plus lourd que la part salariale": etat
      # Le coût, passé et projeté : tout y est une mesure du coût agrégé, que
      # la sonde recalcule en dix-sept secondes. Le jour où ces sections ont
      # été ancrées, le README donnait la garantie vieillesse à 40 milliards
      # en 2026 pour 17,8, le système actuel à 19,3 % du PIB en 2070 pour
      # 18,4, et le COR à 14,2 % pour les 15,3 que porte son dernier rapport ;
      # il affirmait surtout que le scénario 3 n'économise rien en 2026, quand
      # il y cesse de servir la réversion.
      "4. Ce que la retraite a coûté depuis 1959": etat
      "5. Une réforme prospective ne fait rien économiser tout de suite, et beaucoup ensuite": etat
      # Le solde et le coefficient d'équilibre. Récrite le jour de son
      # ancrage : elle décrivait encore la recette du scénario 6 comme un
      # rapport de taux légaux multiplié par 0,63, quand la convention par
      # défaut applique les 18 % à l'assiette ; elle donnait à ce scénario
      # 103 % du PIB de dette en 2070 pour 84, et au fonctionnaire d'État un
      # gain net de 32,9 % pour 37,6. Les taux d'affectation de la CSG, qui
      # ne sont dans aucune donnée, n'y sont plus recopiés : `restitution.py`
      # les porte avec leurs articles.
      "6. Un coût n'est pas un solde, et le coefficient d'équilibre le dit": etat

  # ------------------------------------------------------------------------
  # La feuille de route est un journal : ses actions décrivent ce qu'on VOULAIT
  # faire le jour où on l'a écrit, et ses bilans ce qu'on a mesuré ce jour-là.
  # Seul le préambule parle du dépôt d'aujourd'hui.
  # ------------------------------------------------------------------------
  docs/feuille_de_route.md:
    defaut: recit
    sections:
      # Le seul morceau qui parle du dépôt d'aujourd'hui : le coût transversal
      # d'un changement du modèle, en lignes de code des deux côtés.
      "Feuille de route — les actions qui font le plus progresser le modèle": etat

  # ------------------------------------------------------------------------
  # Produit par un script, et déjà tenu par test_le_document_des_regimes_suit_l_inventaire.
  # ------------------------------------------------------------------------
  docs/regimes.md:
    defaut: produit

  # ------------------------------------------------------------------------
  # Le chiffrage budgétaire : une prose DATÉE autour de tableaux que
  # `scripts/chiffrage_plf.py` recalcule. Le régime est donc `recit` — le
  # document raconte ce que ces chiffres voulaient dire le 22 septembre 2026,
  # et le rafraîchir serait réécrire un avis rendu — mais aucun chiffre n'y est
  # pour autant un souvenir : tous sont dans des blocs produits, que
  # `test_le_chiffrage_plf_n_est_pas_perime` refuse de laisser vieillir. C'est
  # le partage que `blocs_produits` sert ailleurs, appliqué à un document
  # entier.
  # ------------------------------------------------------------------------
  docs/chiffrage_plf.md:
    defaut: recit
    blocs_produits:
      - fait_central
      - arbitrages
      - annuel_retroactif
      - horizon_retroactif
      - annuel_prospectif
      - horizon_prospectif
      - prelevements
      - agregats

  # ------------------------------------------------------------------------
  # Le reste s'arbitre section par section, et ce qui reste se ressemble : des
  # sections au présent dont chaque chiffre est une mesure du modèle — un
  # écart en pourcentage, un montant, une part de PIB — et qui demandent donc
  # une sonde par chiffre, ou un test nommé qui le tienne déjà. Le §1 de
  # `limites.md` en porte deux cents à lui seul.
  # ------------------------------------------------------------------------
  # Ce document-ci décrit la mécanique elle-même : il se soumet à ce qu'il
  # demande aux autres, et tous ses chiffres sont ancrés.
  docs/fraicheur.md:
    defaut: etat
    sections:
      # Cette section cite les chiffres périmés qu'on a trouvés : les ancrer
      # serait les corriger, et le constat n'aurait plus de sens.
      Le constat: recit

  docs/limites.md:
    defaut: a_declarer
    # Des procès-verbaux enclavés dans des sections d'état : un défaut trouvé,
    # corrigé, et ce qu'il valait ce jour-là. Leurs chiffres sont l'avant et
    # l'après — la tranche de la Cipav écrite d'un seul côté, le régime
    # agricole qui opposait 172 trimestres en 1980, le balayage des témoins
    # passé de 138 à 250 cas, la part déplafonnée qu'OpenFisca servait dès le
    # 1er janvier 2004.
    paragraphes_recit:
      - "UN PIÈGE DÉCOUVERT EN CHEMIN"
      - "Le nombre n'est pas à lui seul un verdict"
      - "**Les témoins ne le voyaient pas, et c'est le second enseignement.**"
      - "**Un : la confrontation vérifie une copie, pas une lecture.**"
      # Trois procès-verbaux de la confrontation aux exemples des caisses :
      # ce qu'elle a trouvé, les six exemples du 21 septembre, la circulaire
      # annulée.
      - "**Ce que la confrontation a trouvé, dans l'ordre.**"
      - "**Six exemples de plus, le 21 septembre 2026"
      - "**Une circulaire annulée ne certifie plus rien.**"
    sections:
      # Sections d'état ancrées le 22 septembre 2026 : la règle d'indexation,
      # dont le cumul du triple lock lit le modèle ; les régimes qui manquent ;
      # le rendement unique de la CARPIMKO, dont les deux rendements lisent
      # leur table ; les taux employeur du public, dont la RATP, portée « à
      # près de 32 % » quand ses deux taux se lisent séparément ; la part de
      # l'État en 2008 que le CEPII retrouve.
      "2. La règle d'indexation domine le scénario rétroactif": etat
      "Les régimes qui manquent encore, et ce qui bloque chacun": etat
      "Un rendement unique là où il faudrait une série": etat
      "Le simulateur doit être juste à tout âge : où il ne l'est pas encore": etat
      "Ce que vaut une série qu'on ne peut pas certifier": etat
      "La part patronale du public, et ce qu'on n'en sait pas": etat
      "Ce que la comparaison valide": etat
      # La comparaison à la littérature : les résultats publiés sont des
      # citations datées, qui ne peuvent pas devenir fausses ; ceux du dépôt
      # sont mesurés sur la carrière que la section décrit. Ils avaient bougé
      # de beaucoup — le scénario 4 d'un fonctionnaire d'État à +35 % pour
      # +4,5, le prospectif du privé à −21 % pour −37 — et la phrase « la
      # moitié de l'écart est de la rétroactivité » n'était plus vraie : c'en
      # est l'essentiel.
      # Ce que le scénario 1 approche, et les régimes incomplets : les
      # barèmes modélisés se lisent dans leur fiche ; ceux qui ne le sont pas
      # sont cités à leur date — le barème 2026 de la CNBF, la RCO d'avant
      # 2011. Le régime de base des libéraux plafonnait « à 550 points » pour
      # 557 ; la sur-revalorisation de « 12,1 % sur 1970-2018 », qu'aucune
      # mesure ne rend, n'est plus chiffrée.
      # Ce que le modèle ne sert pas : les âges et les durées de la catégorie
      # active et des militaires lisent leur table ; ce qui n'est pas modélisé
      # — les corps à 32 ans de services, le malus de l'Agirc-Arrco éteint en
      # 2023, le C du XXIV — est cité tel que le texte l'écrit.
      "Ce qui reste hors du modèle, et pourquoi": etat
      # Les exemples publiés : les valeurs du tableau sont celles des caisses,
      # et `test_les_exemples_publies_par_les_caisses_sont_reproduits` les
      # rejoue. Il y en avait trente, pas « vingt-huit ».
      "Ce que disent les exemples publiés par les caisses": etat
      "3. Le scénario « système actuel » est une approximation": etat
      "4. Régimes incomplets, et de combien": etat
      "5 quater. Comparaison à la littérature : pourquoi les écarts d'ici sont plus grands": etat
      "Ce que la littérature trouve": etat
      "Ce n'est pas une contradiction : c'est la somme de quatre choix": etat
      # Elle raconte une correction datée : ×1,69 et ×2,42 sont les pentes que
      # le modèle appliquait AVANT le 19 septembre 2026, ×1,30 et ×1,86 celles
      # que l'INSEE observe en 2024. Les rafraîchir effacerait ce qui a été
      # corrigé, et le constat n'aurait plus de sens.
      "Le profil de carrière, et les trois choses qu'il suppose": recit
      # Deux sections datées du 20 septembre 2026 : elles disent ce que la
      # décision « moitié aux salaires, moitié à la dette » a déplacé, avec les
      # chiffres mesurés ce jour-là. Les rafraîchir effacerait ce qui a été
      # décidé, et le constat n'aurait plus de sens. La section de la fiche de
      # paie était déjà à déclarer ; son titre change, son régime pas.
      "5 ante quater. Le partage « moitié aux salaires, moitié à la dette » : ce qu'il affirme et ce que rien ne vérifie": recit
      # Même chose, le 20 septembre 2026 : elle raconte une déduction que le
      # COR démentait — une assiette qu'on faisait fondre de 42,5 à 39,3 % du
      # PIB faute d'avoir lu le taux qu'il projette — et chiffre ce que la
      # lecture a rendu. Les deux jeux de nombres sont l'AVANT et l'APRÈS ;
      # les rafraîchir effacerait la correction. Ce que l'assiette projetée
      # vaut aujourd'hui, `test_l_assiette_projetee_garde_sa_part_de_pib` le
      # tient, et il tomberait si elle repartait à la dérive.
      "L'assiette projetée : une déduction que le COR démentait, et un demi-point de PIB": recit
      # Elle décrit ce que la convention EPR fait, et chiffre ce que l'autre
      # donnerait : des valeurs du rapport de juin 2026, sous une convention
      # que le dépôt ne calcule pas. Les ancrer supposerait une sonde qui
      # recalcule un solde EEC dont rien d'autre ne se sert ; le contrôle
      # `convention_comptable_est_une_hypothese` tient déjà les trois nombres
      # que la PAGE affiche, et c'est là qu'ils comptent.
      "La convention comptable : le déficit affiché est d'APRÈS bouclage": recit
      # Elle dit ce que le compte est — brut — et ce qu'une de ses recettes
      # doit à sa dépense, avec les valeurs de 2024. Ses nombres sont des
      # BORNES, calculées au taux plein sur la masse entière : les ancrer
      # supposerait une sonde qui refasse ce calcul de borne, alors que le
      # contrôle `compte_en_brut_et_recette_circulaire` tient déjà les mêmes
      # trois nombres là où ils sont affichés, sur la page Coût.
      "Le compte est en brut, et une part de sa recette sort de sa dépense": recit
      # Elle porte les trois transmissions du tableau supplémentaire du
      # SEC 2010, qui sont des valeurs publiées et datées : 2015, 2018, 2021.
      # Les « rafraîchir » n'aurait pas de sens, le producteur ne transmettant
      # que tous les trois ans ; et c'est justement leur ÉCART qui est le
      # propos de la section. Le contrôle
      # `le_compte_est_un_flux_et_le_stock_existe` tient les mêmes nombres là
      # où la page les affiche, et il verra la quatrième transmission arriver.
      "Le stock : ce que le dépôt en montre, et ce qu'il ne calcule pas": recit
      # Elle dit ce que le troisième chiffre du simulateur suppose, le jour où
      # a été posé. Ses nombres sont ceux de ce jour-là — le coefficient d'un
      # départ en 2054, les deux montants qui montrent pourquoi une marge ne
      # se convertit pas en euros — et ils illustrent un raisonnement plutôt
      # qu'ils ne mesurent l'état du dépôt : les rafraîchir déplacerait
      # l'exemple sans rien apprendre. Ce que ce chiffre vaut
      # AUJOURD'HUI, le site le recalcule à chaque rendu, et `tests/test_cout.py`
      # tient les propriétés que la section affirme — le sens de la
      # pondération par la survie, la fenêtre qui s'arrête à l'horizon du COR,
      # les trois leviers qui comblent le même trou.
      "Le troisième chiffre du simulateur : ce qu'il dit, et les quatre choses qu'il suppose": recit
      # --------------------------------------------------------------------
      # Les sections d'état que ce document porte déjà sans un chiffre nu :
      # ce que le modèle est, ce que la réforme agricole de 2026 empêche, ce
      # que la comparaison à la littérature ne valide pas, et de quoi le
      # dépôt se reproduit. Elles disent ce qui est vrai aujourd'hui, et le
      # contrôle refusera désormais qu'un chiffre y entre sans sa sonde.
      "Limites — à lire avant d'utiliser un chiffre": etat
      # Le recensement des paramètres du scénario 1 : vingt-six chiffres, tous
      # des paramètres de DROIT, et tous recopiés à la main d'une table
      # certifiée faute d'une sonde qui sache y descendre. Ils lisent
      # maintenant leur cellule — la durée requise de 1934, le taux de décote,
      # l'âge légal de 1969, les quatre barèmes de la surcote. Deux seuls ne
      # viennent pas d'un fichier, l'assiette de l'AVPF et l'âge majoré de la
      # surcote de 2007 : ce sont des constantes du moteur, et un test nommé
      # les tient.
      "Paramètres du scénario 1, et ce qu'ils valent": etat
      "Écarts avec le droit positif dans le scénario 1": etat
      "La réforme agricole de 2026 n'est pas modélisée, et il faut le dire": etat
      "La réforme agricole de 2026 est en vigueur, et elle n'est pas calculable": etat
      "Ce qu'elle ne valide pas, et qui reste assumé": etat
      "Les limites de la comparaison elle-même": etat
      "6. Reproductibilité": etat
      # --------------------------------------------------------------------
      # Quarante-six corrections datées, arbitrées le 21 septembre 2026. Le
      # critère est celui que ce document s'applique à lui-même : une section
      # est `recit` quand elle raconte un AVANT et un APRÈS — ce que le modèle
      # faisait, ce qu'une lecture a trouvé, ce qui a changé ce jour-là. Ses
      # chiffres sont les deux bouts d'une correction ; les rafraîchir
      # effacerait ce qui a été corrigé, et le constat n'aurait plus de sens.
      #
      # Ce qui reste `a_declarer` ici n'y est pas par oubli : ce sont les
      # sections au PRÉSENT — le §1 et son état de certification, le tableau
      # des régimes incomplets, les réserves des §5 et suivants —, qui disent
      # ce que les chiffres valent AUJOURD'HUI. Chacune demande une sonde par
      # chiffre, c'est-à-dire un travail et non une déclaration.
      # --------------------------------------------------------------------
      # Les écarts au droit positif, la règle d'indexation, et les arbitrages
      # du §3 : chacun porte l'écart qu'il a déplacé le jour dit, et la
      # confrontation à OpenFisca porte ce que chaque oracle a trouvé.
      "Ce qui vient d'être refermé": recit
      "Le mois, là où le droit le date": recit
      "Les DEUX règles d'indexation, et celle qui manquait": recit
      "La pension civile : deux erreurs chez nous, une transcription chez lui": recit
      "L'Arrco de 1999 à 2018 : rien à corriger, et c'est le résultat": recit
      "L'Agirc des cadres, 1983-2012 : trois écarts, tous chez lui": recit
      "L'Ircantec : deux corrections chez nous, deux transcriptions chez lui": recit
      "Les régimes alignés : la MSA passe, et les indépendants depuis qu'ils ne sont plus coupés en deux": recit
      "La cotisation déplafonnée est portée au compte": recit
      "Trois valeurs de 2026 disponibles et non intégrées": recit
      "Ce qui n'est pas de la répartition est sorti de la comparaison": recit
      "La marche à l'année de bascule est voulue, et voici ce qu'elle vaut": recit
      # Le §4, la campagne sur les régimes, passe par passe : ce que chaque
      # lecture de source a trouvé, et la fiche qu'elle a corrigée. C'est le
      # journal de chantier du dépôt, et le plus gros morceau du document.
      "Une seconde passe, et trois choses qu'elle a corrigées": recit
      "Une troisième passe, par le *Journal officiel*, et la carte change": recit
      "La source que deux passes avaient manquée : le décret annuel": recit
      "Le lecteur de PDF empilait les pages": recit
      "Ce que la chronologie de la CARMF a fini par dire": recit
      "La troisième passe : une forme de plus, et un dentiste": recit
      "Le catalogue et le routage ne se parlaient pas": recit
      "Les deux dernières sections que le décret annuel débloquait": recit
      "Les deux dernières sections, et le mur qui n'était pas celui qu'on croyait": recit
      "Ce que le lecteur de PDF du dépôt ne lit pas, et ce que cela avait coûté": recit
      "Cent points par trimestre, et la pension que le moteur inventait": recit
      "La retenue de 8,9 % datait de 1990, et la loi la fait partir de 1989": recit
      "La clause du grand-père : six régimes fermés l'étaient pour tout le monde": recit
      "Le compte notionnel recevait une moyenne de période, et le droit changeait le taux chaque année": recit
      "La lecture des taux de cotisation, et les quatre choses qu'elle a trouvées": recit
      # La correction datée de l'une de ces quatre choses : le décret de 1979
      # que la série ignore ne rend pas ses années fausses, et trois lectures
      # le montrent. Ses chiffres sont ceux des sources lues ce jour-là — les
      # colonnes du tableau T2-2 de la Cnav, les versions de LEGI.
      "Ils ne sont pas trop bas : ce décret ne touche pas la vieillesse": recit
