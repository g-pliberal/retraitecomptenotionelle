  # tableau et les deux de l'entête recomptent maintenant depuis les fichiers
  # de données ; les deux sections qui n'affirment plus que cela passent en
  # état. Le §2 reste à arbitrer pour une seule phrase : les 87 % du total
  # chiffré que les lignes lues font, part qu'aucune sonde ne recalcule et
  # qu'aucun test ne tient.
