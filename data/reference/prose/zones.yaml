      - "Écart maximal de la ligne reconstituée depuis l'écran, mesuré le"
      - "| Étape | 4 déc. | 5 déc. | 6 déc. | Retenu |"
      # Les trois nombres écrits à la main que le profil lu a remplacés.
      - "**Ce que ça a remplacé, et ce que ça a coûté.**"
      # L'écart de 37 % que le périmètre mal lu fabriquait, avant sa correction.
      - "Alimenter un compte notionnel avec ces deux grandeurs revient à comparer un"
      # Deux lectures de décrets du 15 septembre 2026, que ne porte aucune table :
      # la contribution d'équilibre de l'État aux mines, à la RATP et à
      # l'Opéra, et les 1,6 % déplafonnés de l'exploitant minier.
      - "**Ces taux sont ceux de l'employeur, non ceux de l'équilibre.**"
      - "**Une réserve propre aux mines.**"
      # L'échelle de maturités que l'adossement a remplacée en septembre 2026,
      # et ce que la bascule a mesuré sur les témoins ce jour-là.
      - "**Ce que cette règle a remplacé, et pourquoi.**"
      - "La première est qu'elle **ne déplaçait rien**"
    # Même tableau, même script : la méthodologie en portait la seconde copie.
    blocs_produits:
      - indexation
