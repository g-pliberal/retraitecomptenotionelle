# Ce que chaque section de la prose du dépôt AFFIRME — et donc ce qu'un test
# peut en exiger. Lu par `scripts/verifier_prose.py` ; voir son en-tête pour la
# mécanique, et `docs/fraicheur.md` pour la raison d'être.
#
# Quatre régimes, et un seul est contraignant :
#
#   etat        la section décrit ce qui est vrai AUJOURD'HUI. Tout chiffre y
#               est ancré sur une sonde qui le recalcule, et un chiffre nu y
#               est refusé.
#   recit       la section raconte ce qui s'est passé un jour. Ses chiffres
#               sont justes à leur date, gelés, et les rafraîchir serait
#               réécrire l'histoire.
#   produit     la section est écrite par un script, qui a déjà son test.
#   a_declarer  personne n'a encore tranché. Le cliquet les compte.
#
# Le cliquet, en bas, est ce qui fait avancer le dépôt sans qu'on y pense : il
# ne peut que décroître. Une section nouvelle dans un fichier `a_declarer` le
# fait monter, et le test échoue jusqu'à ce qu'on ait dit ce qu'elle engage.

fichiers:

  # ------------------------------------------------------------------------
  # Le document le plus lu : c'est par lui qu'on commence.
  # ------------------------------------------------------------------------
  README.md:
    defaut: a_declarer
    # « Le site a d'abord exécuté le Python lui-même, par Pyodide » ouvre un
    # paragraphe qui raconte l'époque d'avant le portage : ses 13,5 Mo et ses
    # 263 Ko sont ceux de ce temps-là, au milieu d'une section d'état.
    paragraphes_recit:
      - "Le site a d'abord exécuté le Python lui-même"
    sections:
      Ouvrir le simulateur: etat
      # Le corps de la section : ce que le premier chargement transfère, ce que
      # `index.html` charge, et le poids du portage.
      "👉 [g-pliberal.github.io/retraitecomptenotionelle](https://g-pliberal.github.io/retraitecomptenotionelle/)": etat
      Tests: etat

  # ------------------------------------------------------------------------
  # La feuille de route est un journal : ses actions décrivent ce qu'on VOULAIT
  # faire le jour où on l'a écrit, et ses bilans ce qu'on a mesuré ce jour-là.
  # Seul le préambule parle du dépôt d'aujourd'hui.
  # ------------------------------------------------------------------------
  docs/feuille_de_route.md:
    defaut: recit
    sections:
      # Le seul morceau qui parle du dépôt d'aujourd'hui : le coût transversal
      # d'un changement du modèle, en lignes de code des deux côtés.
      "Feuille de route — les actions qui font le plus progresser le modèle": etat

  # ------------------------------------------------------------------------
  # Produit par un script, et déjà tenu par test_le_document_des_regimes_suit_l_inventaire.
  # ------------------------------------------------------------------------
  docs/regimes.md:
    defaut: produit

  # ------------------------------------------------------------------------
  # Le reste attend l'arbitrage, section par section. `limites.md` est le plus
  # gros morceau et le plus mélangé : cinquante sections au passé — des
  # corrections faites — et trois au présent (§1, §4, §5), qui disent ce que
  # les chiffres du dépôt valent aujourd'hui.
  # ------------------------------------------------------------------------
  # Ce document-ci décrit la mécanique elle-même : il se soumet à ce qu'il
  # demande aux autres, et tous ses chiffres sont ancrés.
  docs/fraicheur.md:
    defaut: etat
    sections:
      # Cette section cite les chiffres périmés qu'on a trouvés : les ancrer
      # serait les corriger, et le constat n'aurait plus de sens.
      Le constat: recit

  docs/limites.md:
    defaut: a_declarer
    sections:
      # Elle raconte une correction datée : ×1,69 et ×2,42 sont les pentes que
      # le modèle appliquait AVANT le 19 septembre 2026, ×1,30 et ×1,86 celles
      # que l'INSEE observe en 2024. Les rafraîchir effacerait ce qui a été
      # corrigé, et le constat n'aurait plus de sens.
      "Le profil de carrière, et les trois choses qu'il suppose": recit
      # Deux sections datées du 20 septembre 2026 : elles disent ce que la
      # décision « moitié aux salaires, moitié à la dette » a déplacé, avec les
      # chiffres mesurés ce jour-là. Les rafraîchir effacerait ce qui a été
      # décidé, et le constat n'aurait plus de sens. La section de la fiche de
      # paie était déjà à déclarer ; son titre change, son régime pas.
      "5 ante quater. Le partage « moitié aux salaires, moitié à la dette » : ce qu'il affirme et ce que rien ne vérifie": recit
      # Même chose, le 20 septembre 2026 : elle raconte une déduction que le
      # COR démentait — une assiette qu'on faisait fondre de 42,5 à 39,3 % du
      # PIB faute d'avoir lu le taux qu'il projette — et chiffre ce que la
      # lecture a rendu. Les deux jeux de nombres sont l'AVANT et l'APRÈS ;
      # les rafraîchir effacerait la correction. Ce que l'assiette projetée
      # vaut aujourd'hui, `test_l_assiette_projetee_garde_sa_part_de_pib` le
      # tient, et il tomberait si elle repartait à la dérive.
      "L'assiette projetée : une déduction que le COR démentait, et un demi-point de PIB": recit
      # Elle décrit ce que la convention EPR fait, et chiffre ce que l'autre
      # donnerait : des valeurs du rapport de juin 2026, sous une convention
      # que le dépôt ne calcule pas. Les ancrer supposerait une sonde qui
      # recalcule un solde EEC dont rien d'autre ne se sert ; le contrôle
      # `convention_comptable_est_une_hypothese` tient déjà les trois nombres
      # que la PAGE affiche, et c'est là qu'ils comptent.
      "La convention comptable : le déficit affiché est d'APRÈS bouclage": recit
      # Elle dit ce que le troisième chiffre du simulateur suppose, le jour où
      # a été posé. Ses nombres sont ceux de ce jour-là — le coefficient d'un
      # départ en 2054, les deux montants qui montrent pourquoi une marge ne
      # se convertit pas en euros — et ils illustrent un raisonnement plutôt
      # qu'ils ne mesurent l'état du dépôt : les rafraîchir déplacerait
      # l'exemple sans rien apprendre. Ce que ce chiffre vaut
      # AUJOURD'HUI, le site le recalcule à chaque rendu, et `tests/test_cout.py`
      # tient les propriétés que la section affirme — le sens de la
      # pondération par la survie, la fenêtre qui s'arrête à l'horizon du COR,
      # les trois leviers qui comblent le même trou.
      "Le troisième chiffre du simulateur : ce qu'il dit, et les quatre choses qu'il suppose": recit
  docs/methodologie.md:
    defaut: a_declarer
  # Un JOURNAL DE CHANTIER : le §4 et ses six suites racontent, chacune, ce
  # qu'une session a mesuré le jour où elle l'a mesuré. Leurs chiffres sont
  # justes à leur date et gelés — les rafraîchir réécrirait l'histoire, et
  # ferait disparaître l'intérêt du document, qui est de montrer un total
  # passant de 5,3 à 95,2 milliards à mesure qu'on apprend où regarder.
  #
  # Trois sections échappent à ce régime : elles décrivent l'inventaire tel
  # qu'il est aujourd'hui, et leurs comptes se périment donc pour de bon. Le
  # tableau du §2 l'a fait le jour où trois dispositifs de plus ont été
  # trouvés. Elles restent à arbitrer : il leur faut une sonde qui recompte
  # depuis `avantages_non_contributifs.yaml`, pas une relecture.
  docs/avantages_non_contributifs.md:
    defaut: recit
    sections:
      Les avantages non contributifs du scénario 1: a_declarer
      "2. L'état du modèle : quatre mots, et ils ne se valent pas": a_declarer
      3. La liste: a_declarer
  docs/veille_droit.md:
    defaut: a_declarer
  # Le fichier entier reste à arbitrer, et le passer en `etat` a été essayé :
  # il porte trois tailles — celles du moteur d'Impeccable, de Chromium et d'un
  # plafond de caractères — dont deux désignent des logiciels installés HORS du
  # dépôt. Aucune sonde ne les atteint depuis un clone, et les ancrer
  # demanderait de mesurer ce qu'on n'a pas. Les deux sections ci-dessous sont
  # déclarées parce qu'elles, on sait ce qu'elles engagent.
  docs/outillage_interface.md:
    defaut: a_declarer
    sections:
      # Elle raconte la demi-journée où l'on a cru qu'un site public bloquait le
      # dépôt, quand c'était son propre navigateur qui ne faisait confiance à
      # personne. La date est le sujet de la section.
      "Le navigateur ne voit rien hors de `localhost`, et il le dit mal": recit
      "Ce qu'un navigateur ne débloque pas": recit
  docs/integration-partiliberalfrancais.md:
    defaut: a_declarer
  # Un parcours de présentation. Ses chiffres ne sont plus ceux d'une matinée
  # : `tests/test_parcours.py` rejoue ses adresses, rend ses pages, et refuse
  # tout montant, tout pourcentage et tout compte que le site n'affiche pas.
  # La zone reste `recit` parce que les sondes de `verifier_prose.py` mesurent
  # le dépôt — des lignes, des poids, des entrées de fichier — et ne savent
  # pas rendre une page ; c'est le test qui tient ce document, et lui seul.
  docs/parcours_presentation.md:
    defaut: recit
  # Une revue de littérature datée : ses chiffres sont ceux des sources à
  # leur date de lecture, et la page Risque fait foi pour ceux du modèle.
  docs/risque_de_defaut.md:
    defaut: recit
  CLAUDE.md:
    defaut: a_declarer

cliquet:
  # Nombre de sections dont personne n'a encore dit ce qu'elles affirment.
  # Il ne peut que décroître : `--inventaire` les liste.
  sections_a_declarer: 192
  # Nombre de chiffres qui portent une ancre « a_verifier » : une dette avouée,
  # que seule une sonde qui les recalcule peut éteindre.
  chiffres_a_verifier: 2
