  # Ce que le modèle calcule, et pourquoi ainsi : tout y est au présent, et une
  # méthodologie périmée décrit un autre modèle que celui qui tourne. Le régime
  # visé est donc `etat` de bout en bout, et ce qui l'empêche n'est jamais le
  # temps de la phrase mais le chiffre qu'elle porte : les sections ci-dessous
  # sont celles qui n'en portent aucun, ou dont les chiffres sont ancrés. Le
  # reste attend une sonde par chiffre — c'est le travail de l'action 41, et il
  # se fait section par section.
  docs/methodologie.md:
    defaut: etat
    # Cinq procès-verbaux enclavés dans des sections d'état : ce que coûtait
    # la conversion des points devinée, l'unification Arrco de 1999, la table
    # d'OpenFisca reprise d'abord, et ce que rendait la loi de mortalité
    # calibrée sur elle-même — et la mesure des décimales affichées. Leurs
    # chiffres sont ceux du jour de la correction.
    paragraphes_recit:
      - "Les deviner coûtait cher, et de deux façons."
      - "**L'unification Arrco du 1<sup>er</sup> janvier 1999"
      - "La source est la circulaire annuelle de revalorisation de la Cnav"
      - "**La cible de cet ajustement est la table RACCORDÉE, pas la loi seule**"
