# Ce que chaque document de la prose du dépôt AFFIRME — et donc ce qu'un test
# peut en exiger. Lu par `scripts/verifier_prose.py` ; voir son en-tête pour la
# mécanique, `docs/fraicheur.md` pour la règle, et la note de décision
# `docs/decisions/0002-fraicheur-de-la-prose.md` pour la raison d'être.
#
# Un régime par document (`defaut`), et un seul est contraignant :
#
#   etat        le document décrit ce qui est vrai AUJOURD'HUI. Tout chiffre
#               y est ancré sur une sonde qui le recalcule, et un chiffre nu
#               y est refusé.
#   recit       le document raconte ce qui s'est passé un jour. Ses chiffres
#               sont justes à leur date, gelés, et les rafraîchir serait
#               réécrire l'histoire ; scripts/conservation.py le garde.
#   produit     le document est écrit par un script, qui a déjà son test.
#   tenu        le document dit ce qui est vrai aujourd'hui, mais aucune sonde
#               ne sait le recalculer — ce qu'une page du site affiche : le
#               test que `test` nomme le confronte à ce qu'il décrit, et lui
#               seul le tient. Ni ancré, ni gelé ; `verifier_prose.py` refuse
#               un test absent, ou qui ne nomme pas le document, que
#               scripts/conservation.py gèle alors comme un récit.
#
# Ce qui s'écarte du régime de son document se déclare ici, un à un : une
# section (`sections`), un paragraphe qui raconte au milieu d'un état
# (`paragraphes_recit`), un bloc qu'un script écrit (`blocs_produits`).
# `a_declarer` est le régime de ce que rien ne déclare. Le cliquet, en bas, en
# compte les sections, et ne peut que décroître ; un test refuse de toute
# façon un document que ce fichier ne nomme pas.

fichiers:

  # ------------------------------------------------------------------------
  # Le document le plus lu : c'est par lui qu'on commence.
  # ------------------------------------------------------------------------
  README.md:
    defaut: etat
    # Le tableau des règles d'indexation est écrit par
    # `scripts/construire_tableaux_md.py` depuis le modèle, et un test refuse
    # une copie périmée : ses cellules n'ont pas à porter une ancre chacune.
    # Le site le calculait déjà à chaque rendu ; les deux copies de la prose,
    # recopiées à la main, donnaient le PIB nominal à 1 068,6 % pour 1 068,3.
    blocs_produits:
      - indexation
      # Et le tableau des générations, qui mesure ce que la correction de la
      # ligne de référence déplace : cinq simulations du scénario rétroactif
      # sous deux règles d'indexation. Il était lui aussi recopié, et il avait
      # vieilli d'un point sur la génération 1920 — le modèle a bougé depuis.
      - generations
      # La sortie de l'exemple du §3 — une fonctionnaire d'État née en 1975 —,
      # que le modèle imprime et que la prose recopiait : elle annonçait une
      # rente de 1 569 € quand le modèle en sert 1 515.
      - exemple_fonctionnaire
      # Et celle de l'agent de conduite de l'introduction, qui donnait au
      # scénario 4 une pension de 7 481 € quand le modèle en sert 7 159.
      - exemple_sncf
    # « Le site a d'abord exécuté le Python lui-même, par Pyodide » ouvre un
    # paragraphe qui raconte l'époque d'avant le portage : ses 13,5 Mo et ses
    # 263 Ko sont ceux de ce temps-là, au milieu d'une section d'état.
    paragraphes_recit:
      - "Le site a d'abord exécuté le Python lui-même"
      # Deux paragraphes du §5 racontent comment le contrôle externe s'est
      # dégradé, puis comment le défaut qu'on croyait en cause a été corrigé :
      # leurs 18,3, 19,3, 19,5 et 19,4 % sont les étapes de septembre 2026. Le
      # paragraphe qui les suit dit ce que la trajectoire vaut aujourd'hui.
      - "Le contrôle externe s'est dégradé deux fois"
      - "**Ce défaut-là est corrigé"
      # Et la correction de l'indexation des pensions liquidées, le
      # 19 septembre 2026 : ses +0,12 et −0,88 % sont l'avant et l'après.
      - "**Et les pensions LIQUIDÉES"

  # ------------------------------------------------------------------------
  # L'état de l'architecture, tiré de la note 0001 par la phase 0 : ce qui
  # reste vrai tant qu'aucune décision ne le change. Ses sections ont été
  # arbitrées une à une à son entrée, et toutes décrivent l'état, sauf la
  # liste des versions, qui raconte. Les chiffres datés de la note y sont
  # devenus des ancres — l'inventaire des régimes, l'âge présumé aux
  # naissances, le prélèvement sur les pensions — ou des renvois à la note,
  # qui les garde à leur date : le temps de calcul, les comptes de rédactions,
  # le recensement des autres modèles. La note elle-même, gelée, est sous
  # `docs/decisions/`, hors du contrôle. La liste des versions, close à la
  # 5.37 : depuis l'action 149, chaque version a son fichier sous
  # `docs/architecture/versions/`, un récit hors du contrôle, comme les notes,
  # que `scripts/conservation.py` gèle dès qu'il est écrit.
  # ------------------------------------------------------------------------
  docs/architecture.md:
    defaut: etat
    sections:
      Les versions: recit

  # ------------------------------------------------------------------------
  # La feuille de route est un journal : ses actions décrivent ce qu'on VOULAIT
  # faire le jour où on l'a écrit, et ses bilans ce qu'on a mesuré ce jour-là.
  # Seul le préambule parle du dépôt d'aujourd'hui. Ses notes, une par fichier
  # depuis l'action 148, sous docs/feuille_de_route/<action>/, sont des récits
  # hors du contrôle, comme les notes de décision : vivantes tant que leur
  # action est ouverte, gelées sous docs/archives/ quand elle se clôt.
  # ------------------------------------------------------------------------
  docs/feuille_de_route.md:
    defaut: recit
    sections:
      # Le seul morceau qui parle du dépôt d'aujourd'hui : le coût transversal
      # d'un changement du modèle, en lignes de code des deux côtés.
      "Feuille de route — les actions qui font le plus progresser le modèle": etat

  # L'archive de la feuille de route : ses actions closes et son journal,
  # déplacés tels quels à la phase 1 (docs/architecture.md, § 9.3). Un récit.
  docs/archives/feuille_de_route.md:
    defaut: recit

  # ------------------------------------------------------------------------
  # Produit par un script, et déjà tenu par test_le_document_des_regimes_suit_l_inventaire.
  # ------------------------------------------------------------------------
  docs/regimes.md:
    defaut: produit

  # ------------------------------------------------------------------------
  # Le tableau de bord (docs/architecture.md, § 9.1), écrit en entier par
  # `scripts/tableau_de_bord.py` depuis les registres, et tenu par
  # test_le_tableau_de_bord_n_est_pas_perime. Le coût du travail, qui se lit
  # sur l'historique git et changerait à chaque commit, n'y entre pas.
  # ------------------------------------------------------------------------
  docs/etat.md:
    defaut: produit

  # ------------------------------------------------------------------------
  # Le chiffrage budgétaire : une prose DATÉE autour de tableaux que
  # `scripts/chiffrage_plf.py` recalcule. Le régime est donc `recit` — le
  # document raconte ce que ces chiffres voulaient dire le 22 septembre 2026,
  # et le rafraîchir serait réécrire un avis rendu — mais aucun chiffre n'y est
  # pour autant un souvenir : tous sont dans des blocs produits, que
  # `test_le_chiffrage_plf_n_est_pas_perime` refuse de laisser vieillir. C'est
  # le partage que `blocs_produits` sert ailleurs, appliqué à un document
  # entier.
  # ------------------------------------------------------------------------
  docs/chiffrage_plf.md:
    defaut: recit
    blocs_produits:
      - fait_central
      - arbitrages
      - annuel_retroactif
      - horizon_retroactif
      - annuel_prospectif
      - horizon_prospectif
      - prelevements
      - agregats

  # ------------------------------------------------------------------------
  # Les autres documents : chacun son régime, et ses exceptions.
  # ------------------------------------------------------------------------
  # Ce document-ci décrit la mécanique elle-même : il se soumet à ce qu'il
  # demande aux autres, et tous ses chiffres sont ancrés.
  docs/fraicheur.md:
    defaut: etat

  # Les limites tiennent en parties, une par fichier sous docs/limites/
  # (action 135, étape 5 du contexte) ; le sommaire garde l'introduction.
