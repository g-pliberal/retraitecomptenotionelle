# Une couche qui écarte une réforme (note de décision 0009, « Un scénario qui
# garde une loi passée est une couche » ; docs/architecture.md, § 4.8). Dans
# chaque fiche que la réforme a réécrite, elle garde la version d'avant, depuis
# la date d'effet de la réforme. Posée sur `sans_la_suspension_de_2026`, elle
# fait le droit contrefactuel `au_31_aout_2023`
# (src/retraite_notionnelle/donnees/droits_contrefactuels.py). Chaque fiche qui
# déclare la réforme (champ `reformes`) y est gardée dans sa version d'avant,
# ou déclarée hors de la couche (`garder`), avec sa raison :
# tests/test_couches_du_droit.py.
schema_version: 1
id: sans_la_reforme_de_2023
nom: Le droit sans la loi du 14 avril 2023, pour les pensions prenant effet à compter du 1er septembre 2023
ecarte: [reforme_2023]
depuis:
  date: liquidation.date_effet
  valeur: 2023-09-01
operations:
- operation: garder
  vise: age_annulation_decote
  motif: >-
    l'âge du taux plein est de soixante-sept ans sous les trois états du droit (tests/test_droits_contrefactuels.py) ; sa version d'avant la réforme entre dans la couche à l'étape 3, quand il devient un renvoi à l'âge légal
- operation: remplacer_une_version
  vise: age_legal_par_generation
  motif: la version en vigueur la veille de la réforme vaut sans fin, et celles qui commencent à sa date ou après sont ôtées
- operation: garder
  vise: age_ouverture_ieg_actifs
  motif: >-
    le droit contrefactuel ne l'écarte pas : il ne change que l'âge légal, la durée requise et la carrière longue (droit_contrefactuel, moteur/js/config.js) ; à décider à l'étape qui range cette fiche en versions
