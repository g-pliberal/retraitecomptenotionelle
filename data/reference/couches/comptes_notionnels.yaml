# La proposition rétroactive (docs/architecture.md, § 4.8) : une autre loi,
# appliquée depuis l'origine, « comme si la règle avait toujours existé ».
# Posée au-dessus d'une transition, elle n'agit qu'à compter de sa date : c'est
# la proposition prospective.
#
# Ce qu'elle neutralise, elle le neutralise par l'étape que la fiche dit
# appliquer, ou par son nom quand le texte de la proposition la nomme. Une
# fiche du droit réel qui ne dit pas encore son étape n'est atteinte que par
# son nom : la carte la montre alors sans décision.
