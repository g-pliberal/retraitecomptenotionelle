  # ---- L'Urssaf : les règles publicodes ----------------------------------

  - id: modele_ti
    nom: modele-ti
    auteur: Urssaf (mon-entreprise)
    nature: calculateur
    publication: ouvert
    code: https://github.com/betagouv/mon-entreprise
    documentation:
      - https://www.npmjs.com/package/modele-ti
    licence: MIT
    usage: copier
    confronte: [scenario_1]
    couvre: >-
      Les règles publicodes des travailleurs indépendants : trimestres
      validés, cotisations, points de la CNAVPL, du RCI et de la Cipav et
      valeurs du point de 2023 à 2026, la réforme de l'assiette de 2025
      comprise ; 140 blocs de références pour quelque 218 règles.
    version: "0.1.0"
    confrontation: >-
      Un calcul rejoué : le simulateur en ligne de l'Urssaf le charge, et une
      grille de revenus de 2024 à 2026 y rend les points de la CNAVPL et les
      cotisations de la Cipav du dépôt au dixième près.
    ecarts:
      - constat: >-
          Chez nous, l'assiette minimale de 2025 (450 SMIC horaires) ne
          validait que deux trimestres : une division en virgule flottante
          rendait 2,999….
        tranche: l'erreur était la nôtre, corrigée, et tenue par tests/test_sections_liberales.py
        preuve: data/sources_a_explorer.yaml (mon_entreprise_cipav)
      - constat: >-
          Il appelle la cotisation minimale à revenu nul, dont les
          bénéficiaires du RSA sont dispensés.
        tranche: le droit dispense, et ni lui ni le dépôt ne savent qui touche le RSA ; écart déclaré
        preuve: docs/archives/limites.md (« Les dernières sections libérales »)
    fait_mieux:
      - quoi: >-
          Chaque règle porte ses `références`, et l'application en tire une
          page par valeur, qui explique le calcul. Le site du dépôt ne donne,
          sous « Le détail du calcul » (`pages.js:6155`), que des lignes et un
          JSON, sans fiche ni article, et 3 % des lignes du relevé citent leur
          fiche.
        preuve: >-
          ses blocs `références` (140 pour quelque 218 règles) ; publi.codes :
          « L'explications auto-générée des résultats de calculs permet de
          vous conformer à l'obligation de transparence des algorithmes
          publics »
        etat: a_reprendre
        chantier: "136.4"
    sas: [mon_entreprise_cipav]
    lu_le: 2026-10-01
    lu_dans:
      - https://registry.npmjs.org/modele-ti
      - https://github.com/betagouv/mon-entreprise
      - data/sources_a_explorer.yaml
    note: >-
      Paquet npm 0.1.0 du 16 juillet 2026, sous MIT, dans le répertoire
      `modele-ti` du dépôt de mon-entreprise ; il n'a pas de dépôt à lui. Le
      dépôt est en avance sur le paquet : le 2 septembre 2026, un commit
      corrige les points acquis, inversés entre le RCI et la Cipav. L'API de
      mon-entreprise l'expose (`/api/v1/modeles/ti/evaluate`), sans
      authentification, cinq requêtes par seconde.
      Comparé au dépôt le 1er octobre 2026 au commit `6bb0f26` de
      mon-entreprise. L'ACRE y abat la cotisation de base
      (`cotisations.publicodes:400-409`), donc le revenu cotisé qui valide les
      trimestres (`retraite-base.publicodes:74-79`), quand service-public
      (F11677) dit que le créateur « acquiert des trimestres […] en fonction
      de son revenu » : à trancher par L. 131-6-4.

  - id: modele_social
    nom: modele-social
    auteur: Urssaf (mon-entreprise)
    nature: calculateur
    publication: ouvert
    code: https://github.com/betagouv/mon-entreprise
    documentation:
      - https://www.npmjs.com/package/modele-social
    licence: MIT
    usage: copier
    confronte: [scenario_1]
    couvre: >-
      Les règles publicodes du système social : les cotisations de tous les
      statuts, vieillesse comprise ; les trimestres des salariés, des
      indépendants et des auto-entrepreneurs ; les points Agirc-Arrco, du
      RCI, de la CNAVPL et de la Cipav.
    version: "11.1.0"
    confrontation: >-
      Des paramètres à comparer : ses taux de cotisation vieillesse et ses
      valeurs de point, datés, lisibles par machine, à ceux que le dépôt lit
      au texte.
    ecarts:
      - constat: >-
          Le paquet porte encore les paramètres d'avant 2025 : 8,23 % et
          525 points pour la CNAVPL, 9 et 22 % pour la Cipav ; modele-ti, dans
          le même dépôt, compte 557 points.
        tranche: la réforme de l'assiette de 2025, que modele-ti suit ; le paquet est en retard
        preuve: data/sources_a_explorer.yaml (mon_entreprise_cipav)
      - constat: >-
          Il valide les trimestres du micro-entrepreneur sur son revenu
          abattu, aux coefficients 0,29, 0,50 et 0,66, quand le revenu cotisé,
          CA × 12,3 % × 43,45 % / 17,87 %, donne 0,299, 0,515 et 0,665 :
          12 100 € de ventes « valide 2 trimestres », le revenu abattu
          (3 509 €) un seul.
        tranche: >-
          service-public.fr (F23369, vérifié le 1er avril 2026) ; l'erreur est
          la sienne, et aussi celle du dépôt
          (`regimes/micro_entrepreneurs.yaml`)
        preuve: >-
          `règles/protection-sociale.publicodes:77-105` et
          `règles/entreprise/imposition.publicodes:327-353`, au commit
          `6bb0f26`
      - constat: >-
          Il fixe à 2 860 € le seuil de la Cipav pour 2026
          (`protection-sociale.publicodes:88`).
        tranche: >-
          la Cipav, qui écrit « 2 792 € en 2026 » (fiche pratique « AE
          2026 ») ; l'écart est le sien
        preuve: >-
          `règles/protection-sociale.publicodes:88`, au commit `6bb0f26`
    fait_mieux:
      - quoi: >-
          Il saisit le micro-entrepreneur par son chiffre d'affaires et son
          activité, abattus de 71, 50 ou 34 %, et suit celui de la Cipav par
          tranches. Le dépôt demande à l'utilisateur de reconstituer son
          revenu, sans les variantes de l'abattement
          (`regimes/micro_entrepreneurs.yaml:20-28`), n'a aucun chemin Cipav,
          et « chiffre d'affaires » est absent de `pages.js` et de
          `saisie.js` ; le revenu qui valide les trimestres se prend au taux
          du versement et à sa part de base, comme le fait service-public, non
          au revenu abattu (voir les écarts).
        preuve: >-
          `règles/entreprise/imposition.publicodes:327-353` et
          `règles/protection-sociale.publicodes:77-105`, au commit `6bb0f26`
        etat: a_reprendre
        chantier: "138.12"
      - quoi: >-
          Il porte le seuil d'affiliation des artistes-auteurs au RAAP (900
          SMIC horaires de N−1), le taux réduit sur option et la conversion
          des BNC (× 1,15). Le dépôt prélève la cotisation sous le seuil
          (`ircec_raap.yaml:283-288`) et ignore les BNC ; le 1,15 reste à lire
          dans L. 382-3.
        preuve: >-
          `artiste-auteur.publicodes:67-75, 198-231`, au commit `6bb0f26`
        etat: a_reprendre
        chantier: "138.12"
      - quoi: >-
          Il dispense des cotisations minimales le bénéficiaire du RSA ou de
          la prime d'activité ; le dépôt sert à tous les trois trimestres de
          l'assiette minimale (écart déclaré, voir modele_ti).
        preuve: >-
          `situation-personnelle.publicodes:4-8`, au commit `6bb0f26`
        etat: a_reprendre
        chantier: "138.12"
      - quoi: >-
          Chaque règle porte ses `références`, et l'application en tire une
          page par valeur ; le site du dépôt ne cite ni fiche ni article sous
          « Le détail du calcul » (`pages.js:6155`).
        preuve: >-
          ses blocs `références` ; publi.codes : « L'explications auto-générée
          des résultats de calculs permet de vous conformer à l'obligation de
          transparence des algorithmes publics »
        etat: a_reprendre
        chantier: "136.4"
    sas: [mon_entreprise_bibliotheque, mon_entreprise_depot]
    lu_le: 2026-10-01
    lu_dans:
      - https://registry.npmjs.org/modele-social
      - https://github.com/betagouv/mon-entreprise
      - data/sources_a_explorer.yaml
    note: >-
      Paquet npm 11.1.0 du 16 juillet 2026, sous MIT, dans le répertoire
      `modele-social` ; l'API de mon-entreprise l'expose
      (`/api/v1/evaluate`).
      Au commit `6bb0f26` de mon-entreprise, comparé au dépôt le 1er octobre
      2026, `CNAVPL.publicodes:48` et `protection-sociale.publicodes:458`
      portent toujours 8,23 % et 525 points.

