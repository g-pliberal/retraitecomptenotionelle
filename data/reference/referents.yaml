          compter du 1er septembre 2023 ». Décret n° 2023-754
          (JORFTEXT000047956498) : « La majoration exceptionnelle
          des petites pensions [...] est due à compter du 1er
          septembre 2023 pour les pensions ayant pris effet avant
          cette date ». Son article 3 (JORFARTI000047956556), lu
          dans l'index le 8 octobre 2026 : 1 200 € par an, 120
          trimestres cotisés, un plafond de 10 170,86 € par an ; la
          circulaire Cnav n° 2023-21 : la surcote hors de la
          comparaison, chaque montant tronqué au centime. Les 100 €
          de TRAJECTOiRE sont la majoration entière, et la loi
          majore toute pension au taux plein, portée ou non au
          minimum contributif. Reprise le 8 octobre 2026 : fiche
          majoration_exceptionnelle_2023, servie par « faire vivre »
          dans les deux moteurs.
        etat: repris
        chantier: "138.17"
      - quoi: >-
          Il sert aux exploitants la pension majorée de référence et
          le complément différentiel de la RCO, et les relève aussi
          pour les pensions déjà liquidées. Le dépôt ne sert ni l'un
          ni l'autre (config.py:394 n'est qu'un drapeau ; aucun
          code).
        preuve: >-
          R/fonctionsCalculsPensions.R:2994-2999 (PMR) et 3670-3718
          (complementDiffRCO, appliqué à la chronique des pensions
          servies) ; docs/6-calcul-des-pensions.qmd:1410-1414, au
          commit 0963b57
        verification: >-
          L. 732-63 du code rural (LEGIARTI000053280353, version du
          1er janvier 2026) ; loi n° 2023-270, art. 18, VI : pour
          les pensions d'avant le 1er septembre 2023, « les montants
          du salaire minimum de croissance et des éléments de calcul
          du complément différentiel [...] sont ceux en vigueur au
          1er septembre 2023 » ; D. 732-111 (LEGIARTI000047961256)
          pour leur PMR. TRAJECTOiRE ne compare au seuil que les
          pensions de la MSA, non le total tous régimes, et ignore
          les années de chef à titre secondaire que L. 732-63 compte
          depuis 2026. Repris le 8 octobre 2026, pour les pensions
          déjà liquidées, le seul relèvement de septembre 2023 : le
          taux plein ouvre les points gratuits et le complément à
          qui n'avait pas la durée requise (fiche
          relevement_des_exploitants_2023). Restent la PMR de 2009
          et le complément de 2015 des pensions d'avant, les 85 % de
          novembre 2021, et le complément revu quand les pensions
          changent.
        etat: a_reprendre
        chantier: "138.8"
      - quoi: >-
          Il applique les coefficients temporaires de l'Agirc-Arrco
          aux liquidations depuis 2019 des générations 1957 et
          suivantes : 10 % de minoration pendant trois ans au plus
          et jusqu'à 67 ans, 5 % au taux réduit de CSG, aucune pour
          les exonérés, invalides et inaptes ; 10, 20 ou 30 % de
          majoration pendant un an après deux, trois ou quatre ans
          de report. Le dépôt les écarte (docs/limites.md:278-284)
          parce que « le modèle ne calcule qu'une pension annuelle
          unique », objection que l'échéancier, qui distingue le
          départ de l'échéance, affaiblit.
        preuve: >-
          R/fonctionsCalculsPensions.R:3212-3255
          (calculeModulationTemporaire) et 3450-3516
          (applicationModulationTemporaire), étape 6.0/24 de
          data/etapes.rda, au commit 0963b57
        verification: >-
          Service-public.fr, actualité A15237 : coefficient supprimé
          pour les retraites prenant effet depuis le 1er décembre
          2023, et levé le 1er avril 2024 pour les autres ;
          coefficients_anticipation_agirc_arrco.yaml:139 cite
          l'avenant n° 17 qui l'écarte. TRAJECTOiRE n'a pas cette
          fin (écart).
        etat: a_trancher
        raison: >-
          Le dépôt l'a écarté par choix (limites.md:278-284) ; le
          servir demande un événement de fin dans l'échéancier,
          sorte que le vocabulaire réserve (echeancier.py:18-23).
      - quoi: >-
          Il verse en capital les petites complémentaires : à
          l'Agirc-Arrco jusqu'à 100 points (pension annuelle ×
          coefficient de l'âge), à l'Ircantec sous 300 points
          (points × salaire de référence). Le dépôt sert une rente à
          tout nombre de points (aucun versement unique dans src/,
          moteur/js/ ni data/reference/regles/).
        preuve: >-
          inst/extdata/trajectoire/vfuSeuilPt.csv, vfuCoefAA.csv,
          vfuCoefIrcantec.csv ;
          R/fonctionsCalculsPensions.R:3261-3350 (calculeVfu), au
          commit 0963b57
        verification: >-
          Arrêté du 30 décembre 1970, art. 25 (LEGIARTI000019511940,
          en vigueur depuis le 25 septembre 2008) : « Lorsque le
          nombre de points est inférieur à 300, il n'est pas versé
          d'allocation ; l'intéressé reçoit lors de la liquidation
          un versement unique égal au produit du total des points de
          retraite par le salaire de référence de l'année précédant
          la date de la liquidation » ; Agirc-Arrco, page «
          Conditions de versement de la retraite », et circulaire
          2025-21-SG-DRJ (coefficients de versement unique de 2026)
          : capital jusqu'à l'équivalent de 100 points. Ses
          coefficients par âge sont anciens.
        etat: repris
        chantier: "138.17"
      - quoi: >-
          Ses cas types servent la bonification du cinquième au
          super-actif (quatre trimestres par cinq ans de services,
          vingt au plus) et la majoration de durée d'assurance d'un
          an pour dix ans à l'hospitalier de catégorie active, sur
          le taux et non sur la proratisation. Le dépôt ne sert
          aucune bonification de service (config.py:379-383 ;
          docs/limites.md:116-117) et n'a pas cette majoration.
        preuve: >-
          R/fonctionsCalculsDivers.R:1412-1435 (bonifDeterministes)
          et inst/scripts/casTypesCOR.R:304-317 (policier,
          aide-soignante), au commit 0963b57
        verification: >-
          Décret n° 2003-1306, art. 15, 2° (LEGIARTI000054590023) :
          bonification du cinquième des sapeurs-pompiers « sous
          réserve d'avoir accompli dix-sept années en cette qualité
          et vingt-sept années de service », cinq ans au plus —
          conditions que TRAJECTOiRE omet ; loi n° 2003-775, art. 78
          (LEGIARTI000047453001) : pour l'hospitalier qui remplit
          les conditions de la catégorie active, « la durée
          d'assurance fait l'objet d'une majoration [...] fixée à un
          an par période de dix années de services effectifs », pour
          le I de L. 14 ; L. 12 quater CPCMR (LEGIARTI000048805987,
          depuis le 31 décembre 2023) : quatre trimestres par dix
          ans aux actifs de la défense et de l'INI. Repris le 7
          octobre 2026 (fiches bonification_cinquieme_police_penitentiaire,
          bonification_cinquieme_sapeurs_pompiers,
          majoration_duree_hospitaliers_actifs) : vingt et quinze
          trimestres aux cas types 8 et 9, des deux côtés. TRAJECTOiRE
          sert la bonification en majoration du taux, bornée à cinq
          points et multipliée par le coefficient de proratisation
          (majoreBonifFonc, R/fonctionsCalculsPensions.R:2747-2778),
          quand la loi la fait entrer aux services liquidés, sous 75
          % : l'écart est le sien. L. 12 quater reste à servir, sans
          statut qui le porte.
        etat: repris
        chantier: "138.17"
      - quoi: >-
          Sa microsimulation range chaque retraité dans l'un des
          quatre taux de CSG d'après sa pension, prise pour seule
          ressource, abattement de 10 % compris, contre les seuils
          de revenu fiscal de l'année, et retire la cotisation
          maladie de 1 % des complémentaires. Le dépôt retient le
          taux plein pour tous (prelevements_remuneration.yaml:705)
          et omet ce 1 % par choix (:718-722).
        preuve: >-
          R/fonctionsCalculsPensions.R:3421-3446 (determineCategCSG)
          ; R/fonctionsCalculsDivers.R:867-930 (calculePensionNette)
          ; inst/extdata/trajectoire/borneCSG.csv, au commit 0963b57
        verification: >-
          L. 136-8 CSS (LEGIARTI000054336623) : 0, 3,8, 6,6 ou 8,3 %
          selon le revenu fiscal de référence du foyer. Méthode : la
          pension seule et une part sont une approximation, plus
          proche du réel que le taux plein pour les petites
          pensions. Ses seuils s'arrêtent en 2022 et se prolongent.
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il projette l'âge de départ que le COR publie : âge
          conjoncturel de 63,1 ans en 2025 et de 64,6 ans à partir
          des années 2040 ; par génération, environ 64,6 ans à
          partir des générations des années 1970. Le dépôt n'a que
          l'âge observé
          (data/reference/macro/age_conjoncturel_depart.csv), que
          src/ ne lit pas : rien ne borne les âges du pilote en
          projection.
        preuve: >-
          COR, rapport annuel de juin 2026, figure 2.5 (p. 76, «
          Source : Drees, modèles Ancêtre et Trajectoire ») et
          figure 4.5 (p. 216, « modèle Ancètre pour le constaté,
          calculs SG-COR à partir des évolutions du modèle
          Trajectoire pour le projeté »)
        verification: >-
          Méthode : projection publiée, suspension de 2025 comprise
          (version interne de TRAJECTOiRE). C'est le second point
          d'ANCETRE au registre, qui revient à TRAJECTOiRE.
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il chiffre une réforme sur une population : 750 000
          carrières de l'EIC prolongées, calées sur les cotisants
          par régime et le chômage du COR, salaires bruités, tous
          niveaux de revenu, avec masses de cotisations et de
          prestations par caisse. La page Coût pondère treize cas
          types par des effectifs de caisse, jusqu'à 2,5 fois le
          salaire moyen, à taux d'emploi et de couverture constants
          (cout.py:52-74).
        preuve: >-
          docs/en-bref.qmd (étapes et sources) ;
          R/fonctionsImputations.R (prolongerCarriere,
          imputerSalaires) ; R/fonctionsAgregation.R (massesCotis,
          massesPrestaEffectifs, sousPopGenQuanti), au commit
          0963b57
        verification: >-
          Méthode : une population représentative rend la dispersion
          des carrières et des revenus que des cas types effacent ;
          le RA 2026 en tire ses effectifs de retraités et le coût
          de la suspension, « 1,8 milliard d'euros en moyenne en
          année pleine jusqu'en 2032 » (synthèse, note 1, p. 9 du
          PDF). Les données (EIC, EIR) sont au CASD.
        etat: a_reprendre
        chantier: "138.14"
      - quoi: >-
          Il modélise les départs : probabilité de liquider à chaque
          trimestre entre l'âge d'ouverture et 70 ans selon la
          distance au taux plein, la caisse, le sexe (logistique
          estimée sur l'EIR), non-recours à la carrière longue,
          transitions de fin de carrière selon la distance à l'âge
          d'ouverture (effet horizon). Le dépôt raisonne à
          comportement inchangé, aux âges déclarés
          (docs/limites.md:2005-2010).
        preuve: >-
          docs/en-bref.qmd (« Comportements de départ ») ;
          docs/4-comportements-de-depart.qmd ;
          R/fonctionsImport.R:1657 (estimeModeleDepart) ;
          R/fonctionsCalculsPensions.R:717-1098 (non-recours à la
          carrière longue), au commit 0963b57
        verification: >-
          Méthode : un compte notionnel qui récompense le report
          déplace les départs ; la proposition le chiffre à
          comportement figé. L'estimation demande l'EIR.
        etat: a_trancher
        raison: >-
          Le comportement inchangé est un choix écrit
          (limites.md:2005-2010), et un modèle de départ demande des
          microdonnées.
      - quoi: >-
          Il retire du salaire annuel moyen, depuis 2004, les années
          sans trimestre cotisé ; le dépôt les garde. Même moteur
          que calcul_pension, où le point est détaillé.
        preuve: R/fonctionsCalculsPensions.R:2081, au commit 0963b57
        verification: >-
          R. 351-29 CSS (LEGIARTI000006750042) ; voir
          calcul_pension.
        etat: repris
        chantier: "138.16"
    bilan: >-
      Ce qu'il fait de mieux tient à la population et aux chroniques :
      une microsimulation qui chiffre coût et redistribution, des
      départs modélisés, des indicateurs de cycle de vie ; et, au
      scénario 1, des règles que le dépôt n'a pas, de la majoration
      exceptionnelle de 2023 aux versements uniques des complémentaires,
      aux bonifications de service et aux minima des exploitants. Sa
      version publique est à jour de la loi du 14 avril 2023 et de ses
      décrets d'août 2023, non de la loi du 30 décembre 2025 ; ses
      valeurs sont réelles jusqu'en 2024 et projetées ensuite, son
      coefficient de solidarité et son VFU de la Cnav ne s'éteignent
      jamais. Exécuté sur les cas types du COR, il confirme les durées,
      la carrière longue et le minimum contributif du dépôt, lui montre
      la valeur de service du jour, et montre ses propres torts : la
      chaîne du salaire annuel moyen, les années partagées, l'AVPF et le
      chômage de ses cas types, les emplois super-actifs.
    manifeste: [cor_pouvoir_achat_retraite, drees_trajectoire_taux_moyens]
    sas: [drees_trajectoire]
    lu_le: 2026-10-05
    lu_dans:
      - https://git.drees.fr/drees_code_public/modeles/trajectoire
      - https://drees_code_public.pages.drees.fr/modeles/trajectoire/premiers-pas.html
      - https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def.pdf
    note: >-
      Version 1.1.2 du 4 avril 2025, ouverte en 2024. Le rapport du COR de
      juin 2026 calcule ses cas types « à l'aide d'un module du modèle
      Trajectoire de la Drees, disponible en open source » ; il chiffre aussi
      la suspension de 2025, que la version publique ne contient pas : la
      version interne est en avance. Une copie personnelle est sur GitHub
      (`awarnery/trajectoire`).
      Comparé au dépôt le 1er octobre 2026 au commit `0963b57`, exécuté le 5
      octobre au même commit (son fichier DESCRIPTION dit 1.1.1). La comparaison
      y trouve aussi, sans texte qui les tranche, le versement forfaitaire
      unique de la Cnav gardé après 2016 (« Il a temporairement été décidé de
      conserver le dispositif de VFU pour l'ensemble des assurés »,
      § 6.25.3.1.1), un `txRemplacementBrutSmpt` qui divise une pension brute
      par une rémunération nette (`casTypesCOR.R:433`), et un `txPrestation`
      divisé par la durée relative à l'individu
      (`fonctionsCalculsPensions.R:4795`), puis multiplié par elle dans
      l'agrégat (`fonctionsAgregation.R:187-193`).

  - id: calcul_pension
    nom: calcul_pension (paquet R calculPension)
    auteur: DREES
    nature: cas_types
    publication: ouvert
    code: https://gitlab.com/DREES_code/public/outils/calcul_pension
    licence: EUPL-1.2
    usage: executer_a_part
    confronte: [scenario_1]
    couvre: >-
      Les droits directs de cas types, sur plusieurs régimes obligatoires
      mais pas tous, avec des simplifications que son README assume ; pas
      annuel pour la carrière, mensuel pour les dates. Un dossier refait les
      cas types du COR.
    depend_de: [baremes_ipp]
    confrontation: >-
      Une version figée et légère du moteur de TRAJECTOiRE : ses cas types du
      COR, et des carrières simples décrites des deux côtés.
    ecarts:
      - constat: >-
          Sa pension nette (`calculePensionNette`,
          `R/fonctionsCalculsDivers.R:1745-1764`) prélève sur la pension la
          CSG et la CRDS des salaires, abattement de 1,75 % compris.
        tranche: >-
          L. 136-8 (LEGIARTI000054336623) : la CSG des pensions est de 0, 3,8,
          6,6 ou 8,3 % selon le revenu fiscal de référence ; l'écart est le
          sien
        preuve: >-
          `R/fonctionsCalculsDivers.R:1745-1764`, au commit `ec5a871`
      - constat: >-
          Sa revalorisation de 2020 (`revaloSpeciale2020`,
          `R/fonctionsCalculsDivers.R:3094-3109`) ignore la zone de lissage de
          2 000 à 2 014 €.
        tranche: >-
          la loi n° 2019-1446 du 24 décembre 2019, art. 81, et la circulaire
          Cnav 2020/9, que le dépôt porte : 1 % jusqu'à 2 000 €, puis 0,8, 0,6
          et 0,4 % jusqu'à 2 014 €, 0,3 % au-delà ; l'écart est le sien
        preuve: >-
          data/reference/legislation/revalorisation_pensions.csv (l. 120-124)
      - constat: >-
          Sa législation s'arrête avant la réforme de 2023 : âge
          d'ouverture de 62 ans pour toute génération depuis 1955,
          169 trimestres pour 1964 (ageDuree de
          inst/extdata/parametres.Rds).
        tranche: >-
          La loi du 30 décembre 2025, que le dépôt certifie : 62 ans
          et 9 mois et 170 trimestres pour 1964 ; l'écart est celui
          d'un dépôt que la DREES ne met plus à jour.
        preuve: >-
          data/reference/legislation/age_ouverture_requis.csv (l.
          139), duree_assurance_requise.csv (l. 129)
      - constat: >-
          Les écarts de TRAJECTOiRE y sont déjà : VFU de la Cnav
          sans fin en 2016 (R/fonctionsCalculsPensions.R:2790),
          coefficients temporaires sans fin (:2712, 2738), arrondi
          inférieur du partage des années du SAM (:1653).
        tranche: >-
          Loi n° 2014-40, art. 44 ; service-public.fr A15237 ; R.
          173-4-3 CSS (voir trajectoire).
        preuve: JORFARTI000028493878 ; R. 173-4-3, LEGIARTI000038790394
    fait_mieux:
      - quoi: >-
          Il sert aux exploitants agricoles la pension majorée de référence,
          proratisée et écrêtée au niveau de l'ASPA, et le complément
          différentiel de la RCO, qui relève au seuil le total tous régimes
          (`dureeValidee>=70 & aTauxPlein`). Le dépôt les décrit sans qu'aucun
          code les serve (`avantages_non_contributifs.yaml:460-480`) ; ses
          paramètres s'arrêtant en janvier 2023, la règle se relit dans
          L. 732-54-1 à -4 et L. 732-63 du code rural et dans la circulaire de
          la MSA.
        preuve: >-
          `R/fonctionsCalculsPensions.R:2483-2488, 2541-2546` et
          `complementDiffRCO` (`:3117-3146`), au commit `ec5a871`
        etat: repris
        chantier: "138.8"
      - quoi: >-
          Il retire du salaire annuel moyen les années sans
          trimestre cotisé, pour les liquidations depuis 2004. Le
          dépôt garde toute année où le revenu est positif
          (liquider.py:1707-1775, avec carriere.py:165-166) : une
          année de petit job, sous le seuil d'un trimestre, entre
          dans la moyenne de qui a moins de vingt-cinq années, ou
          moins que sa part d'années de polypensionné. La fiche
          salaire_annuel_moyen, « conforme », ne le dit pas.
        preuve: >-
          R/fonctionsCalculsPensions.R:1555-1557 (« Les années sans
          trimestres cotisées ne sont pas comptabilisées dans le SAM
          pour les liquidations après 2004 ») et 1636, au commit
          ec5a871
        verification: >-
          R. 351-29 CSS, rédaction du 15 février 2004
          (LEGIARTI000006750042) : le salaire « correspondant aux
          cotisations permettant la validation d'au moins un
          trimestre d'assurance selon les règles définies par
          l'article R. 351-9 » ; la rédaction de 1993
          (LEGIARTI000006750041) ne le disait pas. COR, 28 janvier
          2009, document n° 11, p. 3 : « les salaires dont le
          montant est insuffisant pour valider un trimestre
          d'assurance sont exclus du SAM [...] pour les pensions qui
          prennent effet à compter du 1er janvier 2004 ». Sa
          trimestrialisation des salaires de la MSA et du RSI avant
          2017 (:1628) n'a pas été vérifiée.
        etat: repris
        chantier: "138.16"
      - quoi: >-
          Il porte déjà, figées en janvier 2023, les règles de
          TRAJECTOiRE que le dépôt n'a pas : coefficients
          temporaires de l'Agirc-Arrco, versements uniques de
          l'Agirc-Arrco et de l'Ircantec, bonification du cinquième
          et majoration d'un dixième des cas types de la fonction
          publique, indicateurs de cycle de vie.
        preuve: >-
          R/fonctionsCalculsPensions.R:2701-2749
          (calculeModulationTemporaire), 2750-2790 (calculeVfu),
          3189 (calculIndicateursRetraite) ;
          R/fonctionsCalculsDivers.R:1951-1976 (bonifDeterministes),
          au commit ec5a871
        verification: >-
          Les mêmes textes que pour trajectoire ; même famille, une
          seule confirmation.
        etat: a_reprendre
        chantier: "138.17"
    bilan: >-
      C'est le moteur de TRAJECTOiRE figé en janvier 2023 et, selon la
      DREES, la réécriture en R de CALIPER : il fait mieux que le dépôt
      sur les minima des exploitants et sur le salaire annuel moyen
      depuis 2004, et porte les règles de TRAJECTOiRE. Sa législation
      est celle de la loi du 20 janvier 2014, ses paramètres s'arrêtent
      en 2022 ; ses écarts sont ceux de TRAJECTOiRE, plus la CSG des
      salaires prélevée sur les pensions.
    sas: [drees_calcul_pension]
    lu_le: 2026-10-04
    lu_dans:
      - https://gitlab.com/DREES_code/public/outils/calcul_pension
      - https://git.drees.fr/drees_code_public/outils/calcul_pension
      - https://www.cor-retraites.fr/sites/default/files/2019-06/doc-1071.pdf
    note: >-
      Cloné le 1er octobre 2026 : version 0.1, dernier commit de sa branche
      principale du 20 janvier 2023, licence EUPL 1.2 dans `LICENSE`,
      paramètres téléchargés des barèmes de l'IPP. Son README : « Les
      fonctions du paquet sont utilisées telles quelles dans le modèle de
      microsimulation Trajectoire », et le groupe de gitlab.com ajoute que le
      dépôt n'est plus mis à jour.
      Ce dernier commit est `ec5a871`.

  - id: caliper
    nom: CALIPER (CALcul Interrégimes des PEnsions de Retraite)
    auteur: DREES
    nature: calculateur
    publication: documente
    documentation:
      - https://drees.solidarites-sante.gouv.fr/sources-outils-et-enquetes/loutil-caliper-calcul-interregimes-des-pensions-de-retraite
      - https://drees.solidarites-sante.gouv.fr/etudes-et-statistiques/publications/les-dossiers-de-la-drees/dossiers-solidarite-et-sante/article/caliper-un-outil-de-simulation-pour-le-calcul-interregimes-des-pensions-de
    licence: sans objet
    usage: resultats_publies
    confronte: [scenario_1]
    couvre: >-
      Les droits directs de dix régimes, six de base et quatre
      complémentaires — Cnav, MSA salariés, artisans, commerçants, fonction
      publique de l'État, CNRACL, Arrco, Agirc, Ircantec, RAFP —, la SNCF
      ensuite, majorations pour enfants comprises, sur des carrières réelles
      de l'EIC et de l'EIR ou sur des cas types ; ni la réversion ni le
      minimum vieillesse, qui demandent le ménage. Écrit en SAS.
    confrontation: >-
      Des résultats publiés à retrouver : la réforme de 1993, de 2003 et de
      2008 sur les pensions de base de la génération 1938 ; et sa validation
      sur l'EIR 2004, une précision à viser — la pension retrouvée à un euro
      par mois près pour 95,5 % des retraités de la Cnav, 98,5 % de l'État,
      98,3 % de la CNRACL, 93,6 % de l'Arrco, 87,15 % de l'Agirc, 41,1 % des
      indépendants.
    fait_mieux:
      - quoi: >-
          Il a été validé sur des pensions réelles, celles de l'EIR 2004 :
          « 95,5 % des pensions de la CNAV sont estimées correctement […]
          l'écart […] n'excède pas un euro mensuel en 2004 ». Le dépôt se
          confronte à des exemples officiels et à un oracle, à aucune pension
          réelle ; l'EIR ne se lit qu'au CASD.
        preuve: >-
          Dossier solidarité et santé n° 37 (mars 2013),
          http://gesd.free.fr/caliper.pdf
        etat: a_reprendre
        chantier: "138.14"
      - quoi: >-
          Il calcule le SAM tel que la Cnav le calculait avant 1995
          : la somme des meilleurs salaires rapportée aux trimestres
          validés de ces années, fois quatre, et non au nombre
          d'années. Le dépôt annualise à toute date
          (liquider.py:1784-1785, 1846) : une pension liquidée de
          1973 à 1994 dont les meilleures années valident moins de
          quatre trimestres sort sous-estimée.
        preuve: >-
          DT 111, tableau 3 (p. 15, « calcul trimestrialisé /
          annualisé »), p. 54 (« À partir du 1er juillet 1995, les
          meilleurs salaires retenus n'ont plus été corrigés du
          nombre de trimestres validés au cours de ces meilleures
          années ») et tableau 4 (p. 61)
        verification: >-
          COR, 28 janvier 2009, document n° 11, p. 3 : « Jusqu'en
          1994, le calcul du SAM s'effectue en rapportant la somme
          des salaires annuels retenus au nombre de trimestres
          correspondant aux années considérées, et en multipliant ce
          rapport par quatre » (circulaire Cnav 1/73 du 3 janvier
          1973) ; « depuis 1995, le salaire annuel moyen est égal à
          la somme des salaires annuels retenus divisée par le
          nombre d'années correspondant » (circulaire Cnav 95/94 du
          29 décembre 1994). La date exacte, 1er janvier ou 1er
          juillet 1995, se lit dans la circulaire.
        etat: repris
        chantier: "138.16"
      - quoi: >-
          Il exclut du SAM, depuis 2004, les années qui ne valident
          aucun trimestre ; le dépôt les garde. Le point est
          détaillé sous calcul_pension, qui le code.
        preuve: >-
          DT 111, p. 56-57 (« Depuis la réforme de 2003, les années
          qui ne permettent pas de valider de trimestres ne sont pas
          [...] prises en compte dans le calcul du salaire de
          référence »)
        verification: R. 351-29 CSS (LEGIARTI000006750042).
        etat: repris
        chantier: "138.16"
    bilan: >-
      Son code est désormais calcul_pension : CALIPER ne compte plus que
      pour une confirmation avec lui et TRAJECTOiRE. Sa documentation de
      2011 apprend encore au dépôt le SAM trimestrialisé d'avant 1995 et
      l'exclusion des années sans trimestre depuis 2004, et lui donne
      une précision à viser, celle d'une validation sur des pensions
      réelles ; elle décrit la législation de 2010.
    sas: [drees_caliper]
    lu_le: 2026-10-04
    lu_dans:
      - http://gesd.free.fr/caliper.pdf
      - https://drees.solidarites-sante.gouv.fr/sources-outils-et-enquetes/loutil-caliper-calcul-interregimes-des-pensions-de-retraite
      - https://www.drees.solidarites-sante.gouv.fr/sites/default/files/2020-10/dt111.pdf
      - https://www.cor-retraites.fr/sites/default/files/2019-06/doc-1071.pdf
    note: >-
      Lu dans le Dossier solidarité et santé n° 37 de mars 2013 (Duc et
      Lermechin), servi par un miroir : le 1er octobre 2026, le site de
      la DREES ferme la connexion sans répondre, comme le 22 septembre.
      Selon l'INSEE, TRAJECTOiRE est né de CALIPER, de PROMESS et d'un
      module de carrières ; depuis 2014, la DREES calcule par lui les
      cas types du COR. Le 4 octobre 2026, la page de la DREES répond à
      nouveau : l'outil « a été réécrit en R », et son code est celui de
      `calcul_pension`. CALIPER ne compte donc que pour une confirmation
      avec `calcul_pension` et TRAJECTOiRE.

  - id: promess
    nom: PROMESS
    auteur: DREES
    nature: projection
    publication: non_public
    documentation:
      - https://www.insee.fr/fr/information/4497060
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%208_TRAJECTOIRE_DREES.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [cout]
    couvre: >-
      Les fins de carrière, après 54 ans, et les âges de départ, par groupes
      (2010) ; refondu dans TRAJECTOiRE.
    confrontation: >-
      Aucune à part : ses comportements de départ vivent dans TRAJECTOiRE.
    fait_mieux:
      - quoi: >-
          Il modélise les fins de carrière après 54 ans et l'effet
          horizon : une probabilité de cesser tout emploi pour
          chacun des six âges qui précèdent l'âge d'ouverture,
          décalée quand cet âge recule, et une sortie plus fréquente
          après 55 ans de qui a déjà sa durée. Le dépôt raisonne à
          comportement inchangé, aux âges déclarés
          (docs/limites.md:2005-2010).
        preuve: >-
          COR, 4 mai 2011, document n° 6 : « une probabilité
          spécifique pour chacun des 6 âges précédant l'âge
          d'ouverture des droits [...] répliquée autant de fois
          qu'il y a d'année de report de l'âge d'ouverture des
          droits » (renvoi au DT 102, encadré 2, p. 17-19)
        verification: >-
          Méthode : effet horizon « atténué », entre maintien en
          emploi et décalage total ; ses paramètres datent de 2010,
          et TRAJECTOiRE le reprend depuis 50 ans
          (docs/en-bref.qmd).
        etat: a_trancher
        raison: >-
          Le comportement inchangé est un choix écrit du dépôt ;
          PROMESS est fermé et ancien, et son successeur est
          TRAJECTOiRE.
    bilan: >-
      Fermé, de 2010, refondu dans TRAJECTOiRE : seul l'effet horizon de
      ses fins de carrière se confronte au dépôt, qui raisonne à
      comportement inchangé. Rien d'autre de ses publications ne vaut
      contre le dépôt d'aujourd'hui.
    lu_le: 2026-10-04
    lu_dans:
      - https://www.insee.fr/fr/information/4497060
      - https://drees.solidarites-sante.gouv.fr/sites/default/files/2020-10/dt102.pdf
      - https://www.cor-retraites.fr/sites/default/files/2019-06/doc-1510.pdf

  - id: ancetre
    nom: ANCETRE
    auteur: DREES
    nature: microsimulation_statique
    publication: non_public
    documentation:
      - https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_03_SI_Drees.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [cout]
    couvre: >-
      Un pseudo-EIR de chaque année, calé sur l'EACR : effectifs, pensions
      moyennes et âges de départ tous régimes ; la version 2022 part de l'EIR
      2020 et de l'EACR 2022.
    confrontation: >-
      Des résultats publiés, déjà au dépôt : l'âge conjoncturel de départ tous
      régimes, qui contrôle les âges du pilote.
    fait_mieux:
      - quoi: >-
          Il décrit des personnes, non des caisses : un pseudo-EIR
          calé « par la méthode du calage sur marges » sur l'EACR,
          qui donne la pension par régime principal, fin 2024 : 1
          610 € par mois au régime général, 2 570 € aux civils de
          l'État. La page Coût pondère des effectifs de caisse
          (limite n° 1 de `cout.py`) ; ce tableau contrôlerait le
          niveau de 2024 de ses cas types.
        preuve: >-
          rapport annuel du COR de juin 2026, tableau 3.2 (p. 161, «
          Sources : Drees, EACR, modèle Ancètre ») ; le document n°
          3 du COR du 19 décembre 2024, cité jusqu'ici, ne porte pas
          ces montants
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il donne la répartition tous régimes, sans doublon, des
          retraités par taux de CSG : en 2024, droits directs, 3 815
          436 exonérés, 2 320 138 au taux réduit, 3 742 249 au taux
          médian, 7 420 422 au taux plein (22,1, 13,4, 21,6 et 42,9
          %), et les droits dérivés. La page Coût écrit que « le
          dépôt ne sait pas dire combien le sont »
          (pages.js:10836-10839) et retire 9,1 % à tous.
        preuve: >-
          EACR, feuille A-Prelev_sociaux, lignes de source « Ancetre
          2024 », année 2024 ; copiées dans legiretraite,
          inst/extdata/drees/eacr/a-prelevements-sociaux.parquet, au
          commit 98d2cbb
        verification: >-
          Méthode : comptage tous régimes, au taux que les caisses
          appliquent ; c'est la donnée du point de legiretraite, qui
          la redistribue (une confirmation). Des effectifs, non des
          masses : elle borne le taux effectif sans le donner.
        etat: a_reprendre
        chantier: "138.2"
    bilan: >-
      Il donne ce qu'aucune caisse ne donne seule — des retraités sans
      doublon, leur pension par régime principal, leur répartition par
      taux de CSG — que la page Coût n'a pas. Mais les deux points du
      registre citent un document qui ne les contient pas, et la
      projection de l'âge de départ est celle de TRAJECTOiRE.
    manifeste: [drees_age_conjoncturel]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_03_SI_Drees.pdf
      - scripts/fetch/drees_age_depart_csp.py

  - id: legiretraite
    nom: legiretraite (paquet R)
    auteur: DREES, bureau des retraites
    nature: parametres
    publication: ouvert
    code: https://git.drees.fr/drees_code_public/outils/legiretraite
    licence: EUPL-1.2, déclarée dans DESCRIPTION et le README, sans fichier de licence
    usage: executer_a_part
    confronte: [scenario_1]
    couvre: >-
      Par génération, caisse et catégorie : l'âge d'ouverture (droit commun,
      État et CNRACL sédentaires, actifs et super-actifs, exploitants,
      CNAVPL, Ircantec, Agirc-Arrco, régimes spéciaux), l'âge d'annulation de
      la décote, l'âge maximum, les durées requise et de proratisation ; les
      revalorisations par caisse ; les tables de l'EACR 2026.
    confrontation: >-
      Des paramètres à comparer : ses âges d'ouverture suivent déjà la loi du
      30 décembre 2025 (62 ans et 9 mois pour 1964, 63 ans à partir d'avril
      1965).
    ecarts:
      - constat: >-
          Son fichier `dureeRequise.csv`, sans date d'effet, donne 171
          trimestres à la génération 1964 et 172 à 1965, les valeurs de la loi
          de 2023, quand ses âges suivent la loi du 30 décembre 2025.
        tranche: >-
          L. 161-17-3 dans sa rédaction de 2025, que le dépôt certifie à la
          base LEGI : 170 pour 1964, 170 puis 171 pour 1965 ; l'écart est le
          sien
        preuve: data/reference/legislation/duree_assurance_requise.csv
      - constat: >-
          Le retard de `dureeRequise.csv` sur la loi du 30 décembre 2025 ne
          touche pas que le droit commun : l'actif de la fonction publique y a
          171 trimestres pour 1969 et 172 pour 1970, et de même le
          super-actif, l'exploitant, l'invalide et l'Agirc-Arrco ;
          `dureeProratisation.csv` aussi.
        tranche: >-
          la loi du 30 décembre 2025, comme pour le droit commun ; l'écart est
          le sien
        preuve: >-
          `inst/extdata/dureeRequise.csv:136-143` et
          `inst/extdata/dureeProratisation.csv`, au commit `98d2cbb`
      - constat: >-
          Son `aod.csv` ouvre les droits de l'actif à 58 ans dès la génération
          de janvier 1970, et ceux du super-actif à 53 ans dès janvier 1975
          (`inst/extdata/aod.csv:31, 33, 85, 87`).
        tranche: >-
          le décret n° 2023-435, art. 13 (LEGIARTI000054059137), lu dans
          l'index LEGI du dépôt : « cinquante-sept ans et neuf mois pour ceux
          nés entre le 1er janvier 1968 et le 31 mars 1970 ; […]
          cinquante-huit ans pour ceux nés entre le 1er avril 1970 et le 31
          décembre 1970 » ; le dépôt a raison, l'écart est le sien
        preuve: data/reference/legislation/categorie_active.csv
    fait_mieux:
      - quoi: >-
          Il embarque les tables de l'EACR, dont la répartition des
          retraités de droit direct par taux de CSG en 2024, donnée
          d'ANCETRE (source « Ancetre 2024 ») que le paquet
          redistribue : 22,1 % d'exonérés, 13,4 % au taux réduit,
          21,6 % au taux médian, 42,9 % au taux plein. Le dépôt
          n'utilise pas cette table (`pages.js:10839`) et retire 9,1
          % à tous.
        preuve: >-
          `inst/extdata/drees/eacr/a-prelevements-sociaux.parquet`,
          au commit `98d2cbb`
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il embarque, prêtes à lire, les autres tables de l'EACR du
          26 mai 2026 : E, les minima (bénéficiaires du minimum
          contributif, du minimum garanti, de la PMR) ; H, les
          conditions de liquidation (taux plein, décote, surcote,
          par motif, en flux et en stock) ; B, les liquidants par
          âge, durée et motif ; C, les droits directs par âge ; et
          les coefficients Agirc-Arrco de 2019 à 2023 (solidarité à
          10 et 5 %, majorants, exemptés). Le dépôt ne lit de l'EACR
          que la feuille A-Cadrage et l'âge conjoncturel
          (scripts/fetch/drees_eacr.py:6-35).
        preuve: >-
          inst/extdata/drees/eacr/{e-minima,h-conditions-liquidation,b-liquidants,c-droits-directs,coefficients-agirc-arrco}.parquet
          et millesime.csv, au commit 98d2cbb
        verification: >-
          Méthode : comptages exhaustifs des caisses, cibles de
          contrôle pour la page Coût (part des liquidants au
          minimum, décotés, surcotés) et pour les coefficients
          temporaires ; ils se lisent aussi à la source, classeur «
          62 EACR diffusée » du 26 mai 2026 sur data.drees.
        etat: a_reprendre
        chantier: "138.3"
    bilan: >-
      Ses paramètres de législation ne valent pas mieux que les séries
      certifiées du dépôt, et les trois écarts du registre tiennent au
      même commit (dureeRequise.csv:136-137, aod.csv:31, 33, 85, 87).
      Ses âges sont à jour de la loi du 30 décembre 2025, ses durées en
      sont restées à la loi de 2023, ses revalorisations vont jusqu'en
      janvier 2026. Son apport est l'EACR de mai 2026 mise en tables,
      que le dépôt ne lit qu'en partie.
    sas: [drees_legiretraite]
    lu_le: 2026-10-04
    lu_dans:
      - https://git.drees.fr/drees_code_public/outils/legiretraite
    note: >-
      Créé le 7 septembre 2026, version 0.1.6 du 18 septembre, pas encore sur
      le CRAN. Il sert l'âge d'ouverture de TRAJECTOiRE ; ses tests citent un
      commit de TRAJECTOiRE de janvier 2026 absent du dépôt public, et une
      page syndicale comme source des valeurs de 2026.
      Comparé au dépôt le 1er octobre 2026 au commit `98d2cbb`, du 18
      septembre.

  - id: edifis
    nom: EDIFIS
    auteur: DREES
    nature: cas_types
    publication: ouvert
    code: https://git.drees.fr/drees_code_public/outils/edifis
    licence: GPL-3.0
    usage: executer_a_part
    confronte: [scenario_1]
    couvre: >-
      Le revenu disponible de ménages types d'actifs, sans pension : les
      barèmes 2015 à 2025, dont les cotisations vieillesse salariales et
      patronales, plafonnée et déplafonnée, et l'Agirc-Arrco des tranches 1
      et 2 et de la CET.
    confrontation: >-
      Des paramètres à comparer : les taux de cotisation vieillesse, d'une
      source indépendante des barèmes de l'IPP.
    ecarts:
      - constat: >-
          Le supplément par quart de part du seuil du taux réduit de
          CSG reprend celui de l'exonération (feuille « Barème »
          2025, lignes 283 et 285 : 142,58 € par mois chacun).
        tranche: >-
          L. 136-8, III : 2 971 € par demi-part pour l'exonération,
          3 884 € pour le taux réduit (montants de base) ; F2971
          (2026) : quart de part de 1 742 € et 2 278 €. Paramètre
          importé (`R/bareme.R:98`) que le calcul ne lit pas : sans
          effet sur ses résultats.
        preuve: >-
          LEGIARTI000051287395 ;
          https://www.service-public.gouv.fr/particuliers/vosdroits/F2971
    fait_mieux:
      - quoi: >-
          Son coût du travail compte la formation, l'apprentissage, la
          construction et le versement mobilité, 4,13 % de plus. Le dépôt les
          exclut (`docs/limites.md`, § 5 ante bis, réserve 6) ; or, à coût
          fixe, ces taxes sur le brut absorbent environ 3 % de l'écart de brut
          entre systèmes, et le « aucune ne bouge » du dépôt est inexact.
        preuve: la feuille « Barème » de 2025, ligne 264, au commit `95ef983`
        etat: a_reprendre
        chantier: "138.12"
      - quoi: >-
          Ses barèmes de 2015 à 2025 portent les taux de vieillesse
          de chaque année. Le dépôt applique au régime général des
          moyennes par période
          (`regimes/regime_general.yaml:429-430, 461-462`, « moyenne
          OpenFisca sur la période ») : 15,33 % plafonnés et 2,10 %
          déplafonnés de 2011 à 2022 quand ils valaient 15,45 % et
          2,30 % dès 2017 ; 2,41 % depuis 2023 au lieu de 2,30 %
          (2023), 2,42 % (2024-2025), 2,51 % (2026). Le compte
          notionnel porte ces taux (`moteur/compte.py:222-223,
          867`).
        preuve: >-
          lignes « Assurance vieillesse » : salarié 0,30/6,85 % et
          employeur 1,80/8,50 % en 2015 ; 0,35/6,90 et 1,85/8,55 en
          2016 ; 0,40/6,90 et 1,90/8,55 de 2017 à 2023 ; 0,40/6,90
          et 2,02/8,55 en 2024-2025 (lignes 237-238, 251-252 en
          2025), au commit 95ef983
        verification: >-
          D. 242-4 : LEGIARTI000029924557 (2015, 2016, dès 2017),
          LEGIARTI000048852488 (2,02 % dès 2024),
          LEGIARTI000053302465 (2,11 % en 2026) ; ses valeurs sont
          celles du code. Le dépôt les portait déjà, année par année et
          certifiés sur D. 242-4, depuis le 14 septembre 2026
          (regimes/taux_cotisation_annuels.csv, que le chargeur des
          fiches substitue aux moyennes de période) : le relevé a lu
          les moyennes de la fiche, qui ne servent plus qu'au contrôle
          de vraisemblance. Vérifié le
          5 octobre 2026 : 15,45 % et 2,30 % de 2017 à 2023, 2,42 %
          en 2024 et 2025, 2,51 % en 2026, au scénario 1 comme au
          compte notionnel.
        etat: repris
        chantier: "138.16"
      - quoi: >-
          Il calcule le revenu disponible d'un ménage type d'actifs
          selon le salaire : impôt sur le revenu (barème, décote,
          quotient familial), RSA, prime d'activité, aides au
          logement, prestations familiales, AAH, ASS. Le dépôt
          s'arrête au salaire net (`remuneration.py:1-11`) et ne
          calcule aucun impôt sur le revenu.
        preuve: >-
          `R/cas-type.R:70-1548` (fonction `IR` l. 754), feuille «
          Barème » 2025, sections I et II.A, au commit 95ef983
        verification: >-
          méthode : ce que la proposition rend au salaire
          (`docs/limites.md:2521-2530`) passe au revenu disponible
          par ces barèmes ; c'est l'effet retour côté actifs.
        etat: a_trancher
        chantier: "138.13"
        raison: >-
          hors du champ choisi : le dépôt décrit une carrière, non
          un ménage (`docs/limites.md:2012-2018`) ; à décider avec
          138.5.
    bilan: >-
      Rien sur les pensions. Il apporte un barème de cotisations année
      par année, qui montre que le dépôt applique au régime général des
      moyennes par période, et un coût du travail complet, déjà au
      registre.
    sas: [drees_edifis]
    lu_le: 2026-10-04
    lu_dans:
      - https://git.drees.fr/drees_code_public/outils/edifis
    note: >-
      Dernier commit le 11 février 2026, en R et Shiny ; une copie plus
      ancienne est sur gitlab.com (`DREES_code/public/outils/edifis`, 2022).
      Comparé au dépôt le 1er octobre 2026 au commit `95ef983`. Le quart de
      part du plafond du taux réduit (feuille « Barème », ligne 285) y reprend
      celui de l'exonération, au lieu de 2 237 € par an : la source qui le
      tranche reste à citer.

  # ---- Le COR -------------------------------------------------------------

  - id: maquette_globale_cor
    nom: Maquette globale de projection du COR
    auteur: secrétariat général du COR
    nature: projection
    publication: non_public
    documentation:
      - https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def.pdf
      - https://www.cor-retraites.fr/sites/default/files/2023-04/Doc_07_Organisation_Projections.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [cout]
    couvre: >-
      L'agrégation des projections d'une trentaine de régimes, chacun par son
      propre modèle, avec leurs liens financiers ; le nombre de retraités
      vient de TRAJECTOiRE, la part de la réversion de Destinie.
    depend_de: [prisme, pablo, canopee, misraa, trajectoire, destinie_2]
    confrontation: >-
      Des résultats publiés, déjà au dépôt : les dépenses, les ressources et
      le solde du système en part de PIB, que la page Coût confronte.
    ecarts:
      - constat: >-
          Dans le classeur Données_RA2026_P2, la feuille du tableau
          2.11 porte des notes périmées : « Sources : projections
          COR - juin 2025 », et une lecture « baisse de 3,7 % dès
          2025 […] sur les 15 prochaines années ». Le PDF de 2026
          donne une baisse de 1,4 % sur 5 ans, et dit tour à tour «
          dès 2026 » et « à partir du 1er janvier 2025 ».
        tranche: >-
          Les valeurs du classeur sont celles du tableau du PDF (p.
          128), daté juin 2026 ; seules les notes sont restées de
          2025. Un script qui daterait le millésime par ces notes se
          tromperait.
        preuve: >-
          Données_RA2026_P2.xlsx, feuille « Tab 2.11 », lignes 12 et
          15 ; RA_2026_def.pdf, p. 128
    fait_mieux:
      - quoi: >-
          Il décompose la dépense en effectifs et pension relative, par groupe
          de régimes : de 2025 à 2070, les retraités de droit direct passent
          de 17,4 à 22,1 millions, les cotisants de 30,6 à 28,9 millions, la
          pension relative de 54,6 à 45,3 %, stable à la Cnav (24,2 %), de
          18,5 à 10,7 % à l'Agirc-Arrco, de 74,7 à 47,0 % à la fonction
          publique de l'État. La page Coût n'a rien de tel (`cout.py` ;
          `cor_comptes_retraite.py:153-157` ne lit pas ces figures), et c'est
          la pension relative qui localiserait l'écart qu'elle déclare en
          2070, 18,24 % du PIB contre 15,3 % : 18,24 × 45,3 / 54,6 = 15,1 %.
        preuve: >-
          rapport annuel du COR de juin 2026, figures 2.3, 2.6 et 2.7, tableau
          2.1
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il chiffre ce qui équilibrerait le système d'ici 2030 ou 2070 :
          abaisser les pensions de 1,4 à 8,6 % (« pension gap »), relever le
          prélèvement de 0,4 à 2,8 points (« tax gap »), ou, par l'âge seul,
          partir à 67,6 ans en 2070. Le dépôt a le solde moyen, le coefficient
          pondéré par la survie et le manque en points d'assiette
          (`cout.py:1303-1420`), sous EPR et EEC (`equilibre.py:629-662`),
          mais écarte le levier de l'âge (`cout.py:1357`).
        preuve: >-
          rapport annuel du COR de juin 2026, tableau 2.11 et figure 2.24
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il publie, par cas type et génération, le taux de
          rendement interne net (« calcul SG-COR ») : 1,98 % pour le
          non-cadre de la génération 1940, 0,88 % pour 1970, 0,80 %
          pour 1980 et 0,83 % pour 2000. Les taux de remplacement et
          la durée de retraite du même rapport viennent de
          TRAJECTOiRE. Le dépôt n'en lit que la figure 3.14
          (`data/sources.yaml:507-529`), et le TRI y est une
          affirmation `hors_modele` (`affirmations.yaml:2224-2229`).
        preuve: >-
          rapport annuel du COR de juin 2026, figure 3.7 (p. 142) ;
          figures 3.3 et 3.6, « Source : Drees, modèle Trajectoire »
        verification: >-
          Repris le 7 octobre 2026 (action 138, étape 9) : les figures
          3.6, 3.7 et 3.A en témoin (tests/temoins/cor_cycle_de_vie.json).
          Sous ses conventions — les deux sexes réunis, le décès à 60 ans
          plus l'espérance de vie à 60 ans, la pension nette —, le dépôt
          retrouve le rendement du cas type n° 2 des générations 1955 à
          1970 à 0,3 point près, et l'écart du cadre au non-cadre de la
          génération 2000 à 0,2 point ; l'espérance de vie à 60 ans des
          générations 1960 à 2000, à 0,02 an près. L'affirmation du site
          reste `hors_modele` tant qu'aucune page n'affiche le calcul.
        etat: repris
        chantier: "138.9"
      - quoi: >-
          Il projette l'ASPA du FSV, 0,15 % du PIB en 2023 et 0,11 %
          en 2070, et une dépense du FSV qui passerait en 2070 de
          0,50 à 0,70 % si l'ASPA suivait le SMIC. Le dépôt ne
          projette pas l'ASPA du scénario 1, à laquelle comparer la
          garantie.
        preuve: >-
          classeur par régime du COR (complément du rapport de 2024,
          version 2 de février 2025), feuille FSV : dépenses de 0,68
          % du PIB en 2023 et de 0,52 % en 2070, dont la prise en
          charge de l'ASPA fait 22,6 puis 21,2 % ; bloc «
          Sensibilité aux hypothèses d'indexation de l'Aspa » (0,70
          contre 0,50 % en 2070 à 1,3 % de productivité). Le texte
          du rapport ne porte pas ces chiffres.
        etat: a_reprendre
        chantier: "138.5"
      - quoi: >-
          Il projette la dépense par groupe de régimes (fig. 2.6, p.
          80). En 2025 puis 2070 : LURA 6,00 puis 8,07 % du PIB, FPE
          2,15 puis 1,26, CNRACL 0,97 puis 1,13, complémentaires
          4,03 puis 4,40, régimes spéciaux 0,64 puis 0,22,
          non-salariés 0,33 puis 0,21. Il projette aussi le solde
          par groupe (fig. 2.12, 2.15). La page Coût n'a ni cette
          ventilation ni de masses par régime. Elle pèse ses cas
          types par des têtes de caisse (`castypes.py:299-337`), qui
          comptent deux fois le polypensionné
          (`limites.md:2688-2694`). Ainsi l'Ircantec donne 2,1
          millions de têtes (9 % des poids en 2024) à une carrière
          complète, `contractuel_public` (`castypes.py:285-291`),
          alors que sa pension relative est de 4,5 % (classeur,
          2023). Ventiler la trajectoire du dépôt par groupe dirait
          d'où viennent les trois points d'écart de 2070 (18,24 %
          contre 15,3 %). Peser par les masses supprimerait le
          double compte.
        preuve: >-
          RA 2026, données P2, fig. 2.6 « hors transferts internes »
          ; classeur par régime 2024, feuille IRCANTEC, blocs «
          Pension relative » et « Effectifs de retraités de droit
          direct »
        verification: >-
          Méthode. Le COR agrège des masses régime par régime en
          neutralisant leurs liens financiers (annexe méthodologique
          2026, § 1.1 ; doc. 7 du 20 avril 2023, § 2.1). Une masse
          se pèse en euros, et le dépôt écrit lui-même qu'un
          effectif de caisse n'est pas un effectif de personnes.
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il publie la situation sur le marché du travail par âge
          fin, de 50 à 69 ans (fig. 4.3, p. 215, enquête Emploi
          2023-2025). À 60 ans, 62,2 % sont en emploi pour 86,9 % de
          non-retraités, soit 72 % des non-retraités en emploi. À 61
          ans, 50,4 % pour 75,8 %, soit 66 %. Le reste est surtout
          inactif en mauvaise santé (14 %) ou au chômage (4 %). Le
          dépôt suppose que tous les reportés travaillent
          (`config.py:863`, part_reportes_en_emploi = 1.0). Il le
          déclare comme un plafond (`limites.md:1732-1745`), et ce
          paramètre décide de l'essentiel de ce que l'âge légal fait
          au solde : −0,46 point à 100 %, −0,63 à 50 %.
        preuve: >-
          RA 2026, données P4, figure 4.3 (« Sources : Insee,
          Enquête Emploi »), lignes 60 et 61 ans
        verification: >-
          Donnée de l'enquête Emploi de l'INSEE, publiée par le COR.
          C'est un stock, non l'effet d'un report : à 60 ans, des
          non-retraités qui l'étaient déjà sans réforme. Repris le 7
          octobre 2026 par l'effet que mesurent les évaluations du
          recul de l'âge légal de 2010 : la moitié des reportés en
          emploi (IPP, rapport n° 61, 2025), la part par défaut
          (`config.py`, `docs/limites/4-regimes-incomplets.md`).
        etat: repris
        chantier: "138.3"
      - quoi: >-
          Il chiffre la sensibilité de la dépense aux hypothèses
          démographiques. En 2070, contre 15,30 % du PIB au scénario
          central : 14,34 % en fécondité haute et 16,34 % en basse ;
          14,30 % en espérance de vie basse et 16,35 % en haute ;
          14,16 % en solde migratoire haut et 16,40 % en bas (fig.
          2.18 à 2.20, p. 113-115). Il publie aussi les soldes
          correspondants. La page Coût ne porte que le scénario
          central de l'INSEE (`limites.md:2815-2817`). Elle a déjà
          les variantes de productivité et de chômage
          (`data/reference/macro/hypotheses_projection.yaml:94-165`).
        preuve: >-
          RA 2026, données P2, fig. 2.18, 2.19, 2.20 (lignes « Var
          fécondité haute/basse », « Var mortalité haute/basse », «
          Var smi haut/bas »)
        verification: >-
          Méthode : l'INSEE publie ces variantes avec ses
          projections de 2026, et le COR les fait passer dans tous
          les régimes. La plage est d'un point de PIB de chaque
          côté, du même ordre que l'écart de la page au COR.
        etat: a_reprendre
        chantier: "138.7"
      - quoi: >-
          Il projette les rémunérations publiques sur les hypothèses
          de la Direction du budget. Le traitement indiciaire perd
          2,6 % en réel de 2025 à 2037 et gagne 22,6 % sur toute la
          période, contre +35,7 % pour le revenu moyen d'activité.
          La part des primes passe de 26,8 % (2023) à 33,7 % (2037)
          à l'État, de 26,6 à 32,8 % à la FPT, de 25,2 à 31,3 % à la
          FPH (p. 55-56, tab. 1.3, fig. 1.14-1.15). Le dépôt garde
          une part de primes fixe par cas type (`castypes.py:176,
          186, 205`), qui ne sert que d'assiette au RAFP
          (`carriere.py:114-115`) : le traitement de ses
          fonctionnaires suit le salaire moyen. La variante du COR
          sur ces hypothèses déplace la dépense de 2070 de 0,15
          point (15,45 % contre 15,30 %, fig. 2.23, p. 120).
        preuve: >-
          RA 2026, p. 55 (« une baisse de 2,6 % du traitement
          indiciaire […] entre 2025 et 2037 ») ; données P1, fig.
          1.15 ; données P2, fig. 2.23
        verification: >-
          Hypothèses officielles de l'exercice (« Source :
          hypothèses Direction du budget pour COR, juin 2026 »),
          reprises par Pablo et Canopée. C'est une convention, pas
          une loi, mais la seule publiée.
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il publie les effets macroéconomiques des leviers (tab.
          2.10, p. 125). Un an d'âge d'ouverture des droits ajoute,
          à vingt ans, 0,1 à 0,8 % de PIB, 200 000 à 240 000 emplois
          et 0,3 à 0,65 point de solde public. Une hausse des
          cotisations retire 15 000 à 80 000 emplois. Le dépôt est
          comptable de bout en bout et l'assume
          (`limites.md:2968-2972`), alors que la proposition relève
          l'âge légal à 65 ans.
        preuve: >-
          RA 2026, tableau 2.10 (« SG COR d'après les simulations de
          la DG Trésor (Mésange et modèle comptable), I-MIP (modèle
          CepreHANK) et OFCE (modèle EmeRaude) »)
        verification: >-
          Méthode : trois modèles indépendants, présentés en
          fourchette. C'est plus proche du réel qu'un emploi figé,
          mais chaque multiplicateur reste une hypothèse de modèle.
        etat: a_trancher
        raison: >-
          Le dépôt écarte le bouclage macroéconomique et l'assume.
          En tirer une bande de ces multiplicateurs, sans modèle
          macroéconomique, est un choix du programme.
      - quoi: >-
          Il projette ce que le FSV verse aux régimes de base pour
          les périodes de chômage : 61,9 % de ses dépenses en 2023
          (0,68 % du PIB) et 59,2 % en 2070 (« Pec cot chômage RB
          »). C'est un versement fait par un tiers. Pourtant, pour
          une année de chômage, le compte notionnel ne porte que ce
          que l'Unédic verse aux complémentaires
          (`moteur/compte.py:574-577`).
        preuve: >-
          classeur par régime du COR (complément du RA 2024),
          feuille FSV, bloc « Structure des dépenses »
        verification: >-
          Comptes du FSV projetés par la DSS (doc. 7 du 20 avril
          2023, note 3). La version en vigueur de L. 135-2 n'est pas
          lisible dans l'index LEGI (dates incohérentes) : à relire.
        etat: a_trancher
        raison: >-
          Le principe de l'action 141 (le compte porte ce qu'un
          tiers a versé) s'arrête aux complémentaires. Y faire
          entrer la prise en charge du FSV au régime de base est un
          choix du programme, à chiffrer.
      - quoi: >-
          Il tient le stock : les réserves des régimes en
          répartition valent 223,9 Md€ fin 2025, 7,5 % du PIB, dont
          91 % aux complémentaires et 52 % à l'Agirc-Arrco (p. 100,
          tab. 2.3). La dette de la page Coût part de zéro et ne les
          porte pas (`cout.py:1531-1535`).
        preuve: RA 2026, p. 100 et tableau 2.3 (p. 102)
        verification: >-
          Valeur de marché déclarée par les régimes. Le choix de
          partir de zéro est écrit et motivé : ne pas mêler deux
          périmètres.
        etat: a_trancher
        raison: >-
          Partir des réserves, et de la dette de la CADES, ferait du
          stock un patrimoine net. Le dépôt a choisi de ne porter
          que ce que les soldes à venir ajoutent.
    bilan: >-
      La maquette globale décompose ce que la page Coût agrège : la
      dépense par groupe de régimes, les effectifs et la pension
      relative, les variantes démographiques, les leviers et leurs
      effets macroéconomiques, les réserves. Elle localiserait l'écart
      de 2070 (18,24 % contre 15,3 %), et son enquête Emploi donne la
      part des reportés en emploi que le dépôt fixe à un.
    manifeste: [cor_comptes_systeme_retraite, cor_cycle_de_vie]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def.pdf
      - https://www.cor-retraites.fr/sites/default/files/2026-06/Données_RA2026_P2.xlsx
      - https://www.cor-retraites.fr/sites/default/files/2026-07/Données_RA2026_P1.xlsx
      - https://www.cor-retraites.fr/sites/default/files/2026-06/Données_RA2026_P3_2.xlsx
      - https://www.cor-retraites.fr/sites/default/files/2026-06/Données_RA2026_P4_0.xlsx
      - https://www.cor-retraites.fr/sites/default/files/2026-06/Annexe_méthodo_en_ligne_2026.pdf
      - https://www.cor-retraites.fr/sites/default/files/2025-02/Données_régimes_publi_V2.xlsx
      - https://www.cor-retraites.fr/sites/default/files/2023-04/Doc_07_Organisation_Projections.pdf
      - https://www.cor-retraites.fr/sites/default/files/2024-12/RA_2024_finale_impression.pdf

  - id: maquette_sg_cor
    nom: Maquette simplifiée du secrétariat général du COR
    auteur: secrétariat général du COR
    nature: projection
    publication: documente
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition]
    couvre: >-
      Un système en répartition stylisé, soumis à des chocs, calculé en
      annuités, en points et en comptes notionnels (séance du 5 juillet 2017).
    confrontation: >-
      Des résultats publiés à retrouver : l'équilibre d'un régime notionnel
      revalorisé sur la masse salariale, la cohérence du coefficient de
      conversion avec la revalorisation des pensions, des déficits
      transitoires « de l'ordre de 10 % de la masse des cotisations » sur un
      choc démographique.
    fait_mieux:
      - quoi: >-
          Il soumet un système stylisé à quatre chocs, en annuités, en points
          et en comptes notionnels : sur un choc démographique, les comptes
          notionnels laissent des déficits « de l'ordre de 10% de la masse des
          cotisations, contre près de 90% » en annuités, pendant « environ 40
          ans ». Le dépôt ne le cite qu'en prose (`data/sources.yaml:691-720`)
          et ne rejoue aucun de ces chocs sur son moteur notionnel.
        preuve: >-
          `doc-4018.pdf`, séance du COR du 5 juillet 2017
        etat: a_reprendre
        chantier: "138.11"
    bilan: >-
      Rien de nouveau au-delà des chocs stylisés, déjà au registre
      (138.11). Ses autres conclusions confirment des choix du dépôt
      (`limites.md:2958-2962`) : l'équilibre par construction quand on
      indexe sur la masse salariale, et un coefficient qui doit
      anticiper la croissance quand les pensions suivent les prix.
    manifeste: [cor_retour_septieme_rapport]
    lu_le: 2026-10-04
    lu_dans:
      - data/sources.yaml
      - https://www.cor-retraites.fr/sites/default/files/2019-06/doc-4018.pdf

  - id: simulateur_cor
    nom: Simulateur du COR
    auteur: secrétariat général du COR
    nature: projection
    publication: documente
    documentation:
      - https://www.cor-retraites.fr/simulateur/
    licence: sans objet
    usage: resultats_publies
    confronte: [cout]
    couvre: >-
      Un simulateur pédagogique à trois leviers — âge, cotisations, niveau
      des pensions — sur les projections agrégées du COR.
    depend_de: [maquette_globale_cor]
    confrontation: >-
      Aucune tant qu'il est fermé : « Le simulateur est temporairement fermé
      pour révision des scénarios économiques », et sa documentation
      technique répond 404.
    fait_mieux:
      - quoi: >-
          Il boucle la projection par une équation, « S = B x
          [ T – ( NR / NC ) x ( P + dP ) ] » : un an d'âge retire G retraités
          et ajoute 0,5 G cotisants, facteur « conventionnel », pour 0,6 à 0,9
          point de PIB. Le dépôt a B et T ; NR, NC et P viendront de la
          décomposition de la dépense (voir maquette_globale_cor).
        preuve: >-
          sa documentation de 2016, copiée dans `brunoscherrer/retraites` au
          commit `f3c2d92`
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Sa documentation fixe à 0,5 la part des retraités retardés
          qui deviennent cotisants, parce qu'« une partie des
          nouveaux retraités ne sont plus en emploi au moment où ils
          liquident leurs droits ». Elle en publie la sensibilité :
          des facteurs de 0,25 ou 0,75 déplacent l'effet d'un an
          d'âge d'environ 0,1 point de PIB (en 2018 : 0,8 / 0,9 /
          0,9 point). Le dépôt prend 1 par défaut (`config.py:863`),
          un plafond qu'il déclare (`limites.md:1732-1745`) et ne
          mesure qu'à 100, 50 et 0 %.
        preuve: >-
          documentation technique du simulateur du COR, juillet
          2016, p. 3 (« Le facteur 0,5 est choisi
          conventionnellement… ») et son tableau de sensibilité
        verification: >-
          C'est une convention du COR, pas une mesure. Elle est plus
          proche du réel qu'un facteur de un, que l'enquête Emploi
          dément : 66 à 72 % des non-retraités sont en emploi à
          60-61 ans (voir maquette_globale_cor). Reprise le 7
          octobre 2026 : la part par défaut est 0,5, qu'une mesure
          fonde désormais, celle de l'IPP sur l'EIC (rapport n° 61,
          2025).
        etat: repris
        chantier: "138.3"
    bilan: >-
      Fermé, le simulateur ne se confronte que par sa documentation de
      2016. Celle-ci apporte l'équation de bouclage (déjà au registre)
      et le facteur de 0,5 avec sa sensibilité : c'est le premier repère
      pour remplacer le plafond de un du dépôt.
    sas: [cor_simulateur]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.cor-retraites.fr/simulateur/
    note: >-
      Ses reprises, toutes sur ses projections : `brunoscherrer/retraites`
      (ci-dessous), et, sans licence, `nosretraites/roc-retraites`,
      `ChallengesRedac/simulateurRetraite`, `Brohuld/Simulateur-Retraites`,
      `V0latix/retraite_simu`, `GuillaumeAB/simulateur-retraites-france`.
      Sa documentation de 2016 se lit encore dans la copie qu'en garde
      `brunoscherrer/retraites` (commit `f3c2d92`), relue le 1er octobre 2026.

  # ---- Les caisses ------------------------------------------------------------

  - id: prisme
    nom: PRISME (Projection des Retraites, Simulations, Modélisation et Évaluations)
    auteur: Cnav, direction statistiques, prospective et recherche
    nature: microsimulation_dynamique
    publication: non_public
    documentation:
      - https://www.statistiques-recherche.lassuranceretraite.fr/la-microsimulation-avec-prisme/
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%209_%20DSPR_CNAV.pdf
      - https://www.statistiques-recherche.lassuranceretraite.fr/app/uploads/2009/11/simulations-effets-passage-calcul-pensions-rg-a-systeme-en-comptes-notionnels_evolution.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [cout, proposition]
    couvre: >-
      Le régime général au pas trimestriel jusqu'en 2070, sur un vingtième
      des assurés tiré des fichiers de gestion ; étendu aux régimes alignés
      en 2017, puis en 2019 à l'Agirc-Arrco, l'Ircantec, la MSA, l'État, la
      CNRACL, les IEG, la SNCF, la RATP et les libéraux. Écrit en SAS. En
      2009, sa bascule en comptes notionnels : la seule étude française qui
      fasse la même opération que le dépôt, paramètres publiés.
    confrontation: >-
      Des résultats publiés à retrouver : en 2009, des masses de prestations
      inférieures de 7 % en 2050, l'effet d'une table par génération, la part
      des droits non contributifs dans les comptes ; aujourd'hui, les
      chiffrages des PLFSS (2026, annexe 9) et du COR.
    ecarts:
      - constat: >-
          Sa bascule de 2009 calcule les coefficients de conversion
          sur des tables transversales, alors que ses assurés
          meurent selon des tables longitudinales : « Les pensions
          sont par conséquent plus élevées que celles qui
          permettraient d'épuiser le capital notionnel » (p. 6 du
          PDF).
        tranche: >-
          La Cnav le reconnaît elle-même. Le dépôt lit une table de
          génération (`limites.md:2952-2955`).
        preuve: Cnav, novembre 2009, p. 6 ; docs/limites.md:2952-2955
    fait_mieux:
      - quoi: >-
          Il a chiffré la mesure d'âge du PLFRSS 2023 : 3,3, 5,3 et 7,5 Md€ en
          2024, 2025 et 2026. Le dépôt n'a aucun témoin du droit sans la
          réforme de 2023 qui permette de retrouver ces montants (« PLFRSS
          2023 », cherché en vain).
        preuve: >-
          étude d'impact du PLFRSS 2023 : « Source : Cnav - Modèle PRISME
          2022 »
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il différencie le non-recours à l'ASPA « selon la situation
          conjugale, le sexe, le montant de l'allocation ainsi que l'âge ». Le
          dépôt suppose un recours uniforme de 50 %, mesuré sur les personnes
          seules (`config.py:866`) ; celui des couples se lit dans le dossier
          de la DREES n° 97.
        preuve: COR, document n° 9 de mars 2020 (Prisme, Cnav)
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il chiffre, dispositif par dispositif, la part de la
          solidarité dans les masses de droits propres de tous les
          régimes : 26 % en 2016 et 25 % en 2070. Détail : chômage
          5,9 %, maladie-maternité 1,5 %, invalidité 0,6 %,
          carrières longues 2,3 %, taux pleins dérogatoires 1,4 %,
          départs catégoriels 3,4 %, majoration pour trois enfants
          3,3 %, MDA 2,3 %, AVPF 1,3 %, minima 3,3 %. Il les ventile
          aussi par décile, par sexe (40 % de la pension des femmes
          de la génération 1950, 19 % des hommes) et par type de
          départ. Pour le total de ses avantages, le dépôt n'a que
          le « de l'ordre d'un cinquième » du COR de 2010
          (`avantages_non_contributifs.yaml:81-88`, « le seul
          contrôle externe du total »). Ses masses de cas types sont
          des planchers qu'il chiffre lui-même à 3 % de la dépense
          (`avantages.py:36-40`).
        preuve: >-
          COR, doc. n° 9 du 5 mars 2020, annexe Cnav (Beaufort,
          Mattmuller, Mayo), p. 25-40 du PDF : « la solidarité
          représenterait aujourd'hui environ 26 % des masses de
          prestations de droits propres versées »
        verification: >-
          Méthode : chaque pension est recalculée sans le
          dispositif, à date de départ inchangée, puis recalée sur
          le total (p. 28-29). Recoupé par la DREES : 22,7 % au sens
          large en 2016 (Cheloudko 2019, É&R n° 1116, cité p. 32).
          Législation de 2019, antérieure à la réforme de 2023.
        etat: a_reprendre
        chantier: "138.19"
      - quoi: >-
          Sa bascule de 2009 en comptes notionnels intègre au
          coefficient de conversion le décès des actifs avant la
          retraite : « L'effet correcteur dû au décès prématuré d'un
          certain nombre d'actifs augmente les coefficients de
          conversion d'environ 7% pour les premiers liquidants (en
          2012) et d'environ 4% pour les pensions délivrées en 2050.
          » C'est le gain d'héritage que le dépôt n'a pas, et le
          seul chiffrage français.
        preuve: Cnav, Albert et Oliveau, novembre 2009, p. 6 du PDF
        verification: >-
          Méthode : c'est le même mécanisme qu'en Suède (SFB
          62:9-17) et en Norvège, déjà au registre en a_trancher
          (+9,6 % et +8,9 % pour la génération 1960).
        etat: a_trancher
        raison: >-
          Le gain d'héritage est un choix du programme que le README
          ne fait pas (étape 13 de l'action 138). Ce chiffre
          français complète les chiffres étrangers.
      - quoi: >-
          Il applique aux retraités de la Cnav des quotients de
          mortalité estimés sur ses fichiers (2013-2014), par type
          de pension (normale, inapte, invalide), et ceux de l'INSEE
          aux autres. Les retraités pour inaptitude vivent au moins
          quatre ans de moins (Cadr@ge n° 40). La page Coût fait
          vivre chaque cas type comme la population générale
          (`cout.py:2151-2152`). C'est le même point que misraa.
        preuve: doc. n° 9, p. 14 du PDF
        verification: >-
          Méthode, sur données de gestion ; la reprise est décrite à
          misraa.
        etat: a_reprendre
        chantier: "138.7"
      - quoi: >-
          Il projette le rapport de la durée de retraite à la durée
          de vie (« proche de 28 % » pour les générations que touche
          la réforme de 2023) et la pension moyenne à la liquidation
          par sexe et génération. Le COR lui emprunte sa «
          décomposition de la durée de vie » (doc. 7 du 20 avril
          2023, p. 6). Le dépôt ne calcule aucune durée de retraite
          (aucune occurrence dans `src/`).
        preuve: >-
          étude d'impact du PLFRSS 2023, art. 7, IV.2.d, p. 40 («
          Source : Cnav - Modèle PRISME 2022 »)
        verification: >-
          Méthode ; c'est l'un des indicateurs du COR, et l'action
          143 en a besoin. Repris le 7 octobre 2026 (action 138, étape
          9) pour les cas types : la durée de retraite et sa part dans
          la vie, génération par génération (`cycle_de_vie.py`) ; la
          moyenne d'une population attend l'étape 14.
        etat: repris
        chantier: "138.9"
      - quoi: >-
          Il fait partir chacun par 48 équations logistiques au pas
          mensuel (estimées sur 2011-2016), selon la carrière, le
          taux, la carrière longue et l'inaptitude. Il valide sur un
          échantillon test : 18,6 % de départs à 60 ans en carrière
          longue simulés pour 18,7 % observés. Il simule aussi le
          cumul emploi-retraite et le compte de prévention. Le dépôt
          fait partir chaque cas type au taux plein de sa génération
          (`castypes.py:84`) et suppose la couverture constante
          (`limites.md:2847-2851`).
        preuve: doc. n° 9, p. 18-21 et 24 du PDF
        verification: >-
          Méthode, sur données de gestion. Mais les modules de
          départ donnent des dépenses « assez proches », le système
          étant « actuariellement neutre à la marge » (DG Trésor, DT
          2016/04, p. 29).
        etat: a_reprendre
        chantier: "138.14"
    bilan: >-
      Prisme fait mieux sur ce qu'une population seule permet de voir :
      la part et la distribution des droits non contributifs, la
      mortalité par type de pension, les départs et le non-recours. Ses
      chiffrages publiés (réforme de 2023, solidarité de 26 %, gain
      d'héritage de 2009) se confrontent dès maintenant.
    manifeste: [cnav_comptes_notionnels_2009, cor_septieme_rapport]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.statistiques-recherche.lassuranceretraite.fr/la-microsimulation-avec-prisme/
      - data/sources.yaml
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%209_%20DSPR_CNAV.pdf
      - https://www.assemblee-nationale.fr/dyn/16/textes/l16b0760_etude-impact.pdf
      - https://www.statistiques-recherche.lassuranceretraite.fr/app/uploads/2009/11/simulations-effets-passage-calcul-pensions-rg-a-systeme-en-comptes-notionnels_evolution.pdf

  - id: moteur_cnav
    nom: Moteur de calcul des retraites de l'Assurance retraite
    auteur: Cnav
    nature: calculateur
    publication: non_public
    documentation:
      - https://www.lassuranceretraite.fr/portail-info/hors-menu/footer/traitements-algorithmiques.html
    licence: sans objet
    usage: resultats_publies
    confronte: [scenario_1]
    couvre: >-
      Le moteur qui liquide les retraites du régime général. Onze fiches de
      « traitements algorithmiques » (mars 2026), dont huit sur la retraite :
      le montant de la retraite personnelle, la majoration de durée
      d'assurance, le minimum contributif et sa majoration, le cumul
      emploi-retraite ; leurs étapes, sans formules.
    confrontation: >-
      Comparer ses étapes, fiche par fiche, à celles du moteur du dépôt ; ses
      résultats sont les exemples officiels de la Cnav, déjà au banc.
    ecarts:
      - constat: >-
          Deux fiches décrivent « une majoration de durée
          d'assurance associée au minimum contributif, destinée à
          garantir un niveau minimal de la retraite » : « calcul et
          proratisation de la majoration de durée d'assurance » et «
          détermination de l'ouverture du droit à majoration de
          durée d'assurance ».
        tranche: >-
          La majoration de durée d'assurance est un droit pour
          enfant (L. 351-4). Ce que majore le minimum contributif,
          c'est son montant, « au titre des périodes ayant donné
          lieu à cotisations » (L. 351-10, LEGIARTI000048697787).
          L'intitulé confond deux dispositifs ; c'est une erreur de
          rédaction, et rien n'en découle pour le calcul.
        preuve: fiches 03/2026 citées ; index LEGI, L. 351-10 et L. 351-4
    fait_mieux:
      - quoi: >-
          À chaque date de revalorisation, il applique le coefficient au
          « montant mensuel théorique » de la seconde pension, le compare au
          « plafond réglementaire » de la date, et retient le plus petit,
          comme le veulent L. 161-23-1 et D. 161-2-22-1. Le dépôt ne la
          revalorise pas (`data/reference/regles/seconde_pension.yaml:121` :
          « “faire vivre” ne la revalorise pas »).
        preuve: >-
          fiche « CER Revalorisation du montant » de ses traitements
          algorithmiques (mars 2026)
        etat: a_reprendre
        chantier: "138.12"
    bilan: >-
      Les fiches décrivent des étapes sans formules ; le dépôt les
      couvre toutes (coordination internationale, LURA, minimum
      contributif, cumul et seconde pension), à la revalorisation près,
      déjà au registre. Ce qui se confronte reste les exemples officiels
      de la Cnav, déjà au banc.
    lu_le: 2026-10-04
    lu_dans:
      - https://www.lassuranceretraite.fr/portail-info/hors-menu/footer/traitements-algorithmiques.html
    note: >-
      La circulaire Cnav 2022-23 dit la décision fondée sur le code de la
      sécurité sociale, et non sur un traitement algorithmique.

  - id: rgcu_mvc
    nom: RGCU et moteur de valorisation des carrières
    auteur: DSS, avec la Cnav et l'Agirc-Arrco
    nature: calculateur
    publication: non_public
    documentation:
      - https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_08_RGCU%20-DSS.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [scenario_1]
    couvre: >-
      Les durées d'assurance de tous les régimes — par trimestre, par an, par
      régime, au total — et le salaire annuel moyen, calculés à la demande
      sur le répertoire de gestion des carrières uniques.
    confrontation: >-
      Aucune directe : « les droits ne sont pas stockés suite à un calcul ».
      Ses règles de comptage sont celles que le dépôt applique à la
      liquidation unique.
    fait_mieux:
      - quoi: >-
          Son modèle de données porte des éléments de carrière que
          la carrière du dépôt ne saisit pas : rachats, versements
          volontaires, stages de formation, périodes de guerre,
          apprentissage, handicap, choix de majoration de durée
          d'assurance. Le dépôt connaît le service militaire et les
          périodes assimilées (`carriere.py:61-73`), mais ne rachète
          ni ne surcotise (`limites.md:129-135`).
        preuve: >-
          doc. n° 8 du COR, p. 9 du PDF (« Source : arrêté du 20
          juillet 2018 »)
        verification: >-
          Arrêté du 20 juillet 2018 fixant les modalités
          d'alimentation du RGCU. La liste rejoint l'étape 12
          (rachat de trimestres).
        etat: a_reprendre
        chantier: "138.12"
    bilan: >-
      Le RGCU et son moteur calculent durées et salaire annuel moyen à
      la demande, sans rien stocker ni publier (« les droits ne sont pas
      stockés suite à un calcul ») : aucune sortie ne se confronte, et
      ses règles sont celles que le dépôt applique déjà. Il annonce des
      extractions complètes pour le CASD « à une date qui reste à
      préciser » (p. 23), utiles un jour à l'étape 14.
    lu_le: 2026-10-04
    lu_dans:
      - https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_08_RGCU%20-DSS.pdf
    note: >-
      Le manifeste porte déjà la documentation du répertoire
      (`info_retraite_referentiel`), pas les sorties de son moteur.

  - id: pablo
    nom: Pablo
    auteur: Service des retraites de l'État (DGFiP)
    nature: microsimulation_dynamique
    publication: non_public
    documentation:
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%2010_Pablo_SRE.pdf
      - https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_06_SI_SRE.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [cout]
    couvre: >-
      Les fonctionnaires civils et militaires de l'État, droits directs et
      réversion, sur le compte individuel de retraite ; en SAS, opérationnel
      depuis 2017.
    confrontation: >-
      Des résultats publiés à retrouver : les projections du COR pour l'État,
      les engagements du compte général de l'État, les effets de la réforme
      de 2023 que le jaune « pensions » du PLF 2026 en tire, et les
      engagements de l'État des comptes nationaux.
    fait_mieux:
      - quoi: >-
          Microsimulé sur le compte individuel de retraite, il chiffre le
          biais de l'individu moyen : 1 845 Md€ d'engagements, contre
          1 535 Md€ selon le modèle agrégé Ariane, un écart qui tient pour
          140 Md€ aux pensions moyennes, pour 79 à la structure et pour 45 à
          la mortalité du régime. Le dépôt calcule sur 13 cas types, des
          individus moyens, sans mesurer ce biais, que le tableau 3.2
          d'Ancetre permettrait d'approcher.
        preuve: COR, document n° 10 de mars 2020 (Pablo, SRE)
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il calcule chaque année, pour le compte général de l'État,
          l'engagement de retraite des fonctionnaires civils et
          militaires, par unités de crédit projetées et avec la
          mortalité du régime : 1 573 Md€ fin 2024 au taux réel de
          1,38 % (OAT€i 2047), de 1 541 à 2 037 Md€ entre 1,5 % et 0
          %, dont 878 pour les retraités et 695 pour les actifs. Le
          dépôt calcule un engagement acquis pour tout le système,
          au prorata de la carrière (`cout.py:3460-3527`, `3551`).
          Son seul contrôle externe est le tableau 29 d'Eurostat
          (`cout.py:3481-3482`) ; il n'en a aucun par régime.
        preuve: >-
          annexe « pensions » au PLF 2026, partie I, tableau 7 («
          Source : Paragraphe 25.1.1.2 de l'annexe au CGE 2024 ») ;
          doc. n° 6 de 2024 : « la traduction comptable de long
          terme dans le compte général de l'État grâce à son modèle
          de micro-simulation Pablo »
        verification: >-
          Norme comptable n° 13 de l'État (méthode d'IAS 19). Pablo
          est « certifié par la Cour des comptes en décembre 2017 »
          (doc. n° 10, p. 14). La convention d'acquisition est la
          même que celle du dépôt ; seul le taux diffère, et la
          grille de sensibilité du dépôt (`cout.py:3456`) permet de
          se placer à 1,38 %.
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il fait mourir les fonctionnaires de l'État selon 23
          tables relationnelles (Hannerz) : 60 000 décès de moins
          qu'avec l'INSEE d'ici 2029, 2,2 Md€ de pensions de plus en
          2034, 45 Md€ d'engagements. La page Coût fait vivre ses
          fonctionnaires comme la population générale
          (`cout.py:2151-2152`), alors qu'elle connaît leur
          espérance de vie pour le diviseur (`limites.md:439`).
          C'est le même point que misraa.
        preuve: doc. n° 10, p. 8 et 13 du PDF
        verification: Méthode, sur les données du SRE.
        etat: a_reprendre
        chantier: "138.7"
      - quoi: >-
          Il chiffre la réforme de 2023 au régime de l'État par
          rapport à un droit sans réforme : dépenses −0,4 % en 2025
          et −2 % en 2033 ; recettes +0,2 % en 2025 et +1,5 % vers
          2035. Le dépôt n'a pas d'univers sans la réforme : même
          lacune que pour Prisme.
        preuve: >-
          annexe « pensions » au PLF 2026, partie V, p. 218 («
          L'effet de cette réforme a été simulé via l'outil de
          micro-simulation Pablo »)
        verification: Chiffrage officiel, à retrouver comme témoin.
        etat: a_reprendre
        chantier: "138.3"
    bilan: >-
      Pablo fait mieux par sa population exhaustive et sa mortalité
      propre, dont il mesure le biais de l'individu moyen, et par un
      engagement par régime publié chaque année. Cet engagement est le
      contrôle par régime qui manque au dépôt ; le dépôt a déjà repris
      la décomposition du taux de l'État de la Cour des comptes du 22
      septembre 2026 (`contribution_etat_retraite_seule.csv`).
    lu_le: 2026-10-04
    lu_dans:
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%2010_Pablo_SRE.pdf
      - https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_06_SI_SRE.pdf
      - https://questions.assemblee-nationale.fr/dyn/contenu/visualisation/1090002/file/12-Jaune2026_Pensions.pdf

  - id: oscar
    nom: Oscar
    auteur: Service des retraites de l'État
    nature: cas_types
    publication: non_public
    documentation:
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%2010_Pablo_SRE.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [scenario_1]
    couvre: >-
      Des cas types sur les grilles indiciaires de l'État et sur les
      carrières de Pablo, construit en R pour le système universel de 2020
      (points, primes).
    confrontation: >-
      Aucune : son usage actuel n'est pas connu.
    fait_mieux:
      - quoi: >-
          Il calcule chaque cas type sur une plage d'âges de
          liquidation (« par exemple 62-70 ans »), à partir de
          grilles indiciaires par génération. Le site du dépôt
          montre une pension à un seul âge.
        preuve: doc. n° 10, p. 17 du PDF
        verification: Méthode ; c'est la même que celle des cas types du COR.
        etat: a_reprendre
        chantier: "138.10"
      - quoi: >-
          Son moteur du système actuel a été « testé avec succès sur
          le flux de liquidation réel 2018 » du SRE. Le dépôt n'est
          validé que sur des exemples officiels, jamais sur un flux
          de pensions réelles.
        preuve: doc. n° 10, p. 18 du PDF
        verification: >-
          Méthode de validation. Elle demande les données du SRE, ou
          au moins ses agrégats publiés : l'annexe « pensions » au
          PLF et les cubes de data.economie.gouv.fr cités au doc. n°
          6 de 2024.
        etat: a_reprendre
        chantier: "138.14"
    bilan: >-
      Oscar est l'outil en R du SRE pour les cas types et le système en
      points de 2020. Le dépôt a déjà son pas mensuel, son calcul du
      RAFP et un moteur commun aux cas types et à la population ; il ne
      lui manque que la plage d'âges (138.10) et la validation sur un
      flux réel (138.14). Son usage depuis 2020 n'est pas publié et
      aucun résultat ne se confronte.
    lu_le: 2026-10-04
    lu_dans:
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%2010_Pablo_SRE.pdf

  - id: ariane
    nom: Ariane
    auteur: Direction du Budget
    nature: projection
    publication: non_public
    documentation:
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%2010_Pablo_SRE.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [cout]
    couvre: >-
      Une méso-simulation de la fonction publique de l'État par agrégats de
      générations, auditée par la Cour des comptes en 2009, que Pablo a
      remplacée.
    confrontation: >-
      Aucune : il est là pour que la liste soit complète.
    bilan: >-
      Rien. Ariane était une méso-simulation par génération en quatre
