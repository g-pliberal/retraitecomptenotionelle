  - id: caliper
    nom: CALIPER (CALcul Interrégimes des PEnsions de Retraite)
    auteur: DREES
    nature: calculateur
    publication: documente
    documentation:
      - https://drees.solidarites-sante.gouv.fr/sources-outils-et-enquetes/loutil-caliper-calcul-interregimes-des-pensions-de-retraite
      - https://drees.solidarites-sante.gouv.fr/etudes-et-statistiques/publications/les-dossiers-de-la-drees/dossiers-solidarite-et-sante/article/caliper-un-outil-de-simulation-pour-le-calcul-interregimes-des-pensions-de
    licence: sans objet
    usage: resultats_publies
    confronte: [scenario_1]
    couvre: >-
      Les droits directs de dix régimes, six de base et quatre
      complémentaires — Cnav, MSA salariés, artisans, commerçants, fonction
      publique de l'État, CNRACL, Arrco, Agirc, Ircantec, RAFP —, la SNCF
      ensuite, majorations pour enfants comprises, sur des carrières réelles
      de l'EIC et de l'EIR ou sur des cas types ; ni la réversion ni le
      minimum vieillesse, qui demandent le ménage. Écrit en SAS.
    confrontation: >-
      Des résultats publiés à retrouver : la réforme de 1993, de 2003 et de
      2008 sur les pensions de base de la génération 1938 ; et sa validation
      sur l'EIR 2004, une précision à viser — la pension retrouvée à un euro
      par mois près pour 95,5 % des retraités de la Cnav, 98,5 % de l'État,
      98,3 % de la CNRACL, 93,6 % de l'Arrco, 87,15 % de l'Agirc, 41,1 % des
      indépendants.
    sas: [drees_caliper]
    lu_le: 2026-10-01
    lu_dans:
      - http://gesd.free.fr/caliper.pdf
    note: >-
      Lu dans le Dossier solidarité et santé n° 37 de mars 2013 (Duc et
      Lermechin), servi par un miroir : le 1er octobre 2026, le site de la
      DREES ferme la connexion sans répondre, comme le 22 septembre. Selon
      l'INSEE, TRAJECTOiRE est né de CALIPER, de PROMESS et d'un module de
      carrières ; depuis 2014, la DREES calcule par lui les cas types du COR.

