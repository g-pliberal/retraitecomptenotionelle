      Les règles publicodes du système social : les cotisations de tous les
      statuts, vieillesse comprise ; les trimestres des salariés, des
      indépendants et des auto-entrepreneurs ; les points Agirc-Arrco, du
      RCI, de la CNAVPL et de la Cipav.
    version: "11.1.0"
