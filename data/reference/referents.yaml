          5,54% 9,90% » en 2026, jusqu'à 6,75 % en 2036 (il n'a que
          2026) ; décret n° 2025-1228 (« A Mayotte … 9,33 euros ») ;
          arrêté du 22 mai 2026 (9,56 €)
        etat: a_reprendre
        chantier: "138.18"
      - quoi: >-
          Il porte la taxe sur les salaires (4,25, 8,50 et 13,60 %)
          et l'employeur qui la doit (non assujetti à la TVA). Le
          dépôt n'a ni barème ni profil : la suppression que la
          proposition en fait n'atteint aucune fiche
          (docs/limites.md:2519-2533, qui demande « un cinquième
          profil … et le barème de la taxe »).
        preuve: salarié/salarié.publicodes:507-545, au commit 05cb5be
        verification: >-
          CGI, art. 231 (LEGIARTI000054370158) : mêmes taux ; seuils
          2026 9 229 et 18 423 € (il garde ceux de 2025, voir
          écarts)
        etat: a_reprendre
        chantier: "138.12"
      - quoi: >-
          Il compte le versement mobilité au taux de la commune, la
          taxe d'apprentissage, la formation, la PEEC, le dialogue
          social, le forfait social. Le dépôt les exclut
          (prelevements_remuneration.yaml:97-112 ;
          docs/limites.md:2493-2502) ; même point qu'EDIFIS, la
          commune en plus.
        preuve: >-
          salarié/cotisations.publicodes:740, 878, 1130, 1214, 1228,
          1245-1260, au commit 05cb5be
        verification: >-
          méthode : prélèvements assis sur le brut ; à coût fixé,
          ils absorbent une part de l'écart de brut (registre,
          EDIFIS)
        etat: a_reprendre
        chantier: "138.12"
      - quoi: >-
          Il applique outre-mer la Lodeom au lieu de la réduction
          générale. Le dépôt donne la réduction générale à tout
          salarié du privé, Antilles, Guyane et Réunion compris
          (prelevements_remuneration.yaml:176-238).
        preuve: >-
          salarié/exonérations/lodeom.publicodes (726 lignes), au
          commit 05cb5be
        verification: >-
          L. 752-3-2 (LEGIARTI000053285063, dès le 1er juillet 2026)
          : non cumulable « avec une autre exonération totale ou
          partielle de cotisations patronales »
        etat: a_reprendre
        chantier: "138.18"
      - quoi: >-
          Il calcule le précompte de l'artiste-auteur : plafonnée
          moins 0,75 point et déplafonnée nulle (prises en charge
          par l'État), CSG abattue sur les seuls traitements et
          salaires, formation 0,35 %, RAAP, RACD, RACL. Le dépôt
          n'affiche aucun net à l'auteur (remuneration.py:1339-1341,
          1359-1377) et ignore la prise en charge.
        preuve: >-
          artiste-auteur.publicodes:121-178 et 180-310, au commit
          05cb5be
        verification: >-
          décret n° 2019-422, art. 3 (LEGIARTI000038458028) : État
          payant « l'intégralité de la cotisation vieillesse assise
          sur la totalité » et « 0,75 point » de la plafonnée, qui «
          ouvre les mêmes droits »
        etat: a_reprendre
        chantier: "138.12"
    bilan: >-
      Côté salarié et micro-entrepreneur, il est à jour de 2026 et fait
      mieux sur ce qui entoure la retraite : chiffre d'affaires,
      Mayotte, taxe sur les salaires, coût complet, Lodeom, précompte
      des auteurs, PRCI. Sa branche indépendante (d'avant 2025) et ses
      trimestres d'apprenti sont faux : modele-ti ou le dépôt y font
      foi.
    sas: [mon_entreprise_bibliotheque, mon_entreprise_depot]
    lu_le: 2026-10-04
    lu_dans:
      - https://registry.npmjs.org/modele-social
      - https://github.com/betagouv/mon-entreprise
      - data/sources_a_explorer.yaml
      - https://entreprendre.service-public.gouv.fr/vosdroits/F23369
      - https://www.audiens.org/solutions/entreprises-la-retraite-complementaire-agirc-arcco-au-1er-janvier-2019.html
    note: >-
      Paquet npm 11.1.0 du 16 juillet 2026, sous MIT, dans le répertoire
      `modele-social` ; l'API de mon-entreprise l'expose
      (`/api/v1/evaluate`). Au commit `6bb0f26` de mon-entreprise,
      comparé au dépôt le 1er octobre 2026, `CNAVPL.publicodes:48` et
      `protection-sociale.publicodes:458` portent toujours 8,23 % et 525
      points. Au 4 octobre 2026 (commit `05cb5be`), ses salariés et ses
      micro-entrepreneurs sont à jour de 2026, mais sa branche
      `dirigeant . indépendant` est d'avant 2025 : modele-ti, dans le
      même dépôt, fait foi pour les indépendants.

  - id: modele_as
    nom: modele-as
    auteur: Urssaf (mon-entreprise)
    nature: calculateur
    publication: ouvert
