    confrontation: >-
      Des résultats publiés à retrouver : les projections de l'Ircantec.
    fait_mieux:
      - quoi: >-
          Il projette les droits directs servis par l'Ircantec, de
          2,04 millions en 2023 à 5,47 millions en 2070. Ce sont des
          droits, non des personnes ni des carrières : surtout des
          polypensionnés à petite pension (pension relative de 4,5 %
          en 2023 et de 3,3 % en 2070, départ moyen à 66,6 puis 65,5
          ans). Les prendre pour poids du cas type
          `contractuel_public`, carrière complète au régime général
          et à l'Ircantec, multiplierait par 2,7 le double compte
          que `docs/limites.md:2688-2694` déclare : la reprise pèse
          par la masse. La dépense de la page Coût garde les poids
          de 2024 (`donnees/effectifs.py:39-41`).
        preuve: >-
          classeur par régime du COR (2024), bloc « Effectifs de
          retraités de droit direct » ; COR, document n° 7 de
          décembre 2024
        etat: a_reprendre
        chantier: "138.3"
