  # ---- La statistique publique : la DREES ---------------------------------
  # Une seule lignée : CALIPER (2013, en SAS) est devenu le module de calcul
  # de TRAJECTOiRE, publié en R sous le nom de calcul_pension, puis fondu
  # dans le paquet trajectoire ; legiretraite lui fournit ses âges. Elle calcule
  # les cas types du COR. Un accord entre eux ne compte qu'une fois.

  - id: trajectoire
    nom: TRAJECTOiRE
    auteur: DREES, bureau des retraites
    nature: microsimulation_dynamique
    publication: ouvert
    code: https://git.drees.fr/drees_code_public/modeles/trajectoire
    documentation:
      - https://drees_code_public.pages.drees.fr/modeles/trajectoire/
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%208_TRAJECTOIRE_DREES.pdf
    licence: EUPL-1.2
    usage: executer_a_part
    confronte: [scenario_1, cout]
    couvre: >-
      Tous les régimes, ramenés à huit grands — fonction publique de l'État,
      territoriale et hospitalière, salariés agricoles, régime général,
      régimes spéciaux « modélisés comme la SNCF », indépendants, libéraux
      « modélisés comme la médecine », exploitants —, avec l'Agirc-Arrco,
      l'Ircantec, le RAFP et les complémentaires des indépendants et de la
      MSA. Droits directs seulement, ni réversion ni ASPA ; générations 1942
      et suivantes ; la réforme de 2023, sans la loi du 30 décembre 2025.
    depend_de: [baremes_ipp, calcul_pension, caliper]
    confrontation: >-
      Un calcul rejoué, à part, sans les données du CASD : le mode cas types
      s'en passe, et `lancerCasTypesCor()` refait les treize cas types du COR,
      dont le dépôt lit déjà des résultats.
    ecarts:
      - constat: >-
          Sans la loi du 30 décembre 2025, il ouvre les droits de la
          génération 1964 à 63 ans et lui demande 171 trimestres
          (`inst/extdata/trajectoire/ageDuree.csv:144-148, 515-516`).
        tranche: >-
          la loi du 30 décembre 2025, que le dépôt certifie : 62 ans et 9
          mois, 170 trimestres ; l'écart est celui de la version publique
        preuve: >-
          data/reference/legislation/age_ouverture_requis.csv (l. 139) et
          duree_assurance_requise.csv (l. 129)
    fait_mieux:
      - quoi: >-
          Il calcule, par cas type et génération, les taux de récupération, de
          remplacement sur le cycle de vie et d'annuité, la durée de retraite
          rapportée à la carrière, le TRI, la pension nette rapportée à
          l'ASPA, et le remplacement net en euros courants, constants et en
          SMPT, de l'âge d'ouverture à l'annulation de la décote, sous quatre
          productivités. Le dépôt n'a que le taux de remplacement
          (`simulateur.py:277-298`) ; lui fait mourir chacun à round(e60+60),
          moyenne des sexes (`casTypesCOR.R:87-94`), là où le dépôt a ses
          courbes de survie.
        preuve: >-
          `R/fonctionsCalculsPensions.R:4783-4791`,
          `R/fonctionsAgregation.R:124-143`,
          `inst/templates/rapport_casTypesCOR.Rmd:28-35` et
          `inst/scripts/casTypesCOR.R:56, 84, 430-433`, au commit `0963b57`
        etat: a_reprendre
        chantier: "138.9"
      - quoi: >-
          Il refait les treize cas types du COR sans les données du CASD. Le
          dépôt n'en lit que des résultats publiés ; exécuté à part (EUPL),
          sorties seules, il en donnerait des témoins, pour les générations
          nées avant 1964 ou après 1968.
        preuve: >-
          `R/lancerCasTypesCor.R`, au commit `0963b57`
        etat: a_reprendre
        chantier: "138.4"
      - quoi: >-
          Il lit les variantes de fécondité et d'espérance de vie de l'INSEE ;
          le dépôt ne reprend que le scénario central
          (`data/sources.yaml:464-465`).
        preuve: >-
          `R/fonctionsImport.R:116-127, 205-212`, au commit `0963b57`
        etat: a_reprendre
        chantier: "138.7"
      - quoi: >-
          Il impute aux cas types du COR le taux de CSG de la convention du
          COR : réduit pour le 2 bis, médian pour les 2 à 5 et 8 à 10, normal
          pour les 1, 6, 7 et 11. C'est une convention, non le calcul du
          foyer, mais elle servirait à la page Carrières types, où le dépôt
          retire 9,1 % à tous (`prelevements_remuneration.yaml:705`).
        preuve: >-
          `R/fonctionsCalculsPensions.R:3421-3445` et
          `inst/scripts/casTypesCOR.R:107-114`, au commit `0963b57`
        etat: a_reprendre
        chantier: "138.2"
    manifeste: [cor_pouvoir_achat_retraite]
    sas: [drees_trajectoire]
    lu_le: 2026-10-01
    lu_dans:
      - https://git.drees.fr/drees_code_public/modeles/trajectoire
      - https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def.pdf
    note: >-
      Version 1.1.2 du 4 avril 2025, ouverte en 2024. Le rapport du COR de
      juin 2026 calcule ses cas types « à l'aide d'un module du modèle
      Trajectoire de la Drees, disponible en open source » ; il chiffre aussi
      la suspension de 2025, que la version publique ne contient pas : la
      version interne est en avance. Une copie personnelle est sur GitHub
      (`awarnery/trajectoire`).
      Comparé au dépôt le 1er octobre 2026 au commit `0963b57`. La comparaison
      y trouve aussi, sans texte qui les tranche, le versement forfaitaire
      unique de la Cnav gardé après 2016 (« Il a temporairement été décidé de
      conserver le dispositif de VFU pour l'ensemble des assurés »,
      § 6.25.3.1.1), un `txRemplacementBrutSmpt` qui divise une pension brute
      par une rémunération nette (`casTypesCOR.R:433`), et un `txPrestation`
      divisé par la durée relative à l'individu
      (`fonctionsCalculsPensions.R:4795`), puis multiplié par elle dans
      l'agrégat (`fonctionsAgregation.R:187-193`).

  - id: calcul_pension
    nom: calcul_pension (paquet R calculPension)
    auteur: DREES
    nature: cas_types
    publication: ouvert
    code: https://gitlab.com/DREES_code/public/outils/calcul_pension
    licence: EUPL-1.2
    usage: executer_a_part
