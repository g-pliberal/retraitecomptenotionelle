  - id: pensionsmodellen
    nom: Pensionsmodellen
    auteur: Pensionsmyndigheten
    pays: Suède
    nature: projection
    publication: ouvert
    code: https://www.pensionsmyndigheten.se/statistik-och-rapporter/pensionsmodellen/pensionsmodellen
    documentation:
      - https://www.pensionsmyndigheten.se/content/dam/pensionsmyndigheten/blanketter---broschyrer---faktablad/statistik/pensionsmodellen/anv%C3%A4ndarmanual_pensionsmodellen_eng.pdf
    licence: >-
      « Du får sprida och modifiera verktyget, men inte använda det i
      kommersiellt syfte utan Pensionsmyndighetens tillstånd »
    usage: selon_conditions
    confronte: [proposition]
    couvre: >-
      Tout le système suédois, en classeurs Excel et VBA, sur 25 à 90 ans :
      les cotisations, le temps de rotation, la dette de pension, l'indice
      d'équilibre (balanstal) et le diviseur.
    confrontation: >-
      Un calcul à rejouer : l'indice d'équilibre et le temps de rotation sur
      75 ans, les trajectoires du frein contre le mécanisme d'équilibre de la
      proposition.
    fait_mieux:
      - quoi: >-
          Il projette le bilan du système suédois, durée de rotation
          (`x_Y_turnover_duration`) et indice d'équilibre
          (`x_Y_balance_ratio`). Le dépôt calcule un rapport de flux,
          ressources sur dépenses de l'année (`cout.py:114-121`), jamais
          appliqué.
        preuve: son manuel, version 1.5.4 (2015)
        etat: a_trancher
        raison: >-
          Le bilan ne sert qu'à un équilibrage appliqué, un choix du programme
          que le propriétaire tranche (voir balanstal_suede).
      - quoi: >-
          Il projette sur « 498 status groups », croisés par âge, sexe et
          origine, quand la page Coût du dépôt pondère 13 cas types
          (`castypes.py:127`). Une population par états demanderait, en
          France, l'EIC, qui ne se lit qu'au CASD.
        preuve: >-
          son manuel, version 1.5.4 (2015) : « 498 status groups »
        etat: a_reprendre
        chantier: "138.14"
    sas: [suede_pensionsmodellen]
    lu_le: 2026-10-01
    lu_dans:
      - https://www.pensionsmyndigheten.se/statistik-och-rapporter/pensionsmodellen/pensionsmodellen
    note: >-
      Version 2.2 du 10 octobre 2024, une archive de 2,87 Go.
      Le manuel lu le 1er octobre 2026 est la version 1.5.4, de 2015,
      antérieure à la loi SFS 2015:676.

  - id: typfallsmodellen
    nom: Typfallsmodellen
    auteur: Pensionsmyndigheten
    pays: Suède
    nature: cas_types
    publication: ouvert
    code: https://static.pensionsmyndigheten.se/statistik/typfallsmodellen/typfallsmodellen.xlsb
    documentation:
      - https://www.pensionsmyndigheten.se/statistik-och-rapporter/pensionsmodellen/typfallsmodellen
      - https://static.pensionsmyndigheten.se/statistik/typfallsmodellen/anvandarmanual-typfallsmodellen.pdf
    licence: >-
      « Verktyget får spridas och modifieras men inte användas i kommersiellt
      syfte utan Pensionsmyndighetens tillstånd »
    usage: selon_conditions
    confronte: [proposition]
    couvre: >-
      La pension d'une carrière entière — pension de revenu, garantie,
      pension professionnelle, impôt —, avec les diviseurs projetés par
      génération (procédure VBA `Calculate_Deltal`).
    confrontation: >-
      Un calcul à rejouer : le diviseur projeté d'une génération, et la
      pension d'un cas type à carrière identique.
    fait_mieux:
      - quoi: >-
          Il impute chaque année au compte les gains d'héritage, les comptes
          des morts redistribués aux survivants de la génération, sur des
          facteurs « desamma för kvinnor och män » (SFB 62:9-17). Le compte
          d'un mort « revient à la collectivité » au dépôt
          (`capitalisation.py:5-6`), rien n'en revient au compte
          (`compte.py:847-905`), et le README est muet ; sur la mortalité du
          dépôt, la pension de la génération 1960 gagnerait 9,6 %, celle de
          1980 6,3 %.
        preuve: >-
          `Pensionssystemet.bas:1027`, « arv = (arvsf1 - 1) * pbh_ing », dans
          le portage `mathiasboos/Typfallsmodellen` au commit `bb46d93`
        etat: a_trancher
        raison: >-
          Redistribuer aux survivants le compte des morts est un choix du
          programme, que le README ne fait pas et que le propriétaire tranche,
          entre la forme suédoise (le compte multiplié chaque année par 1/p_x
          unisexe de la génération) et la forme norvégienne (un facteur dans
          le diviseur, voir delingstall_norvege).
      - quoi: >-
          Il déduit du compte les frais de gestion, 0,0319 % en 2025
          (SFB 62:22-25). Le dépôt n'en déduit aucun (`compte.py:847-905`).
        preuve: >-
          `Pensionssystemet.bas:1031`, « kost = … * (kostf - 1) », au commit
          `bb46d93` du portage
        etat: a_trancher
        raison: >-
          Déduire des frais du compte, environ × (1 − 0,0003) par an, est un
          choix du programme, que le propriétaire tranche.
      - quoi: >-
          Il rend la pension par étage, avant et après impôt, en part du
          dernier salaire, et le revenu autour du départ. Le dépôt n'a que le
          taux de remplacement (`simulateur.py:277-298`).
        preuve: son manuel PID289138, version 2.2
        etat: a_reprendre
        chantier: "138.9"
    sas: [suede_typfallsmodellen]
    lu_le: 2026-10-01
    lu_dans:
      - https://www.pensionsmyndigheten.se/statistik-och-rapporter/pensionsmodellen/typfallsmodellen
    note: >-
      Version 4.8 du 27 avril 2026. Un portage non officiel en TypeScript,
      sans licence, en recopie le VBA (`mathiasboos/Typfallsmodellen`,
      septembre 2026).
      Comparé au dépôt le 1er octobre 2026 sur le manuel PID289138 v2.2 et sur
      le portage `mathiasboos/Typfallsmodellen` au commit `bb46d93`.

  - id: delningstal_suede
    nom: Le diviseur suédois (delningstal)
    auteur: Riksdag, gouvernement et Pensionsmyndigheten
    pays: Suède
    nature: methode
    publication: documente
    documentation:
      - https://data.riksdagen.se/dokument/sfs-2010-110.text
      - https://lagen.nu/1998:1340
      - https://www.pensionsmyndigheten.se/om-pensionsmyndigheten/allmanna-handlingar/lagar-och-regler
    licence: textes officiels
    usage: copier
    confronte: [proposition]
    couvre: >-
      Un diviseur unisexe : la valeur actuelle des mensualités sur
      l'espérance de vie moyenne égale le capital, au facteur annuel de 1,016
      (code de la sécurité sociale, chapitre 62, § 34 à 37) ; la mortalité
      officielle des cinq dernières années ; un douzième par mois de report.
      Les tables de 2026 (PFS 2026:2) donnent 17,34 à 65 ans pour la
      génération 1960.
    confrontation: >-
      Un calcul à refaire : la grille de 62 à 110 ans de PFS 2026:2 depuis
      les tables de mortalité, puis le diviseur du dépôt sous les mêmes
      conventions — taux, unisexe, mois.
    fait_mieux:
      - quoi: >-
          La pension servie y est revalorisée moins la norme du diviseur,
          1,016, la même qui actualise le diviseur (62:36). Le dépôt faisait
          entrer ν (`taux_anticipe_conversion`, `config.py:637`) dans le
          diviseur (`moteur/conversion.py:228-234`) mais revalorisait la
          pension servie au taux plein (`revalorisation.py:921`,
          `moteur/js/revalorisation.js:715`), contre la promesse « à espérance
          de coût inchangée » de `conversion.py:19-21` ; l'étape 138.1 retire
          ν de la revalorisation servie, sans effet au défaut, où ν est nul.
        preuve: >-
          SFB 62:43 : « kvoten … dividerats med talet 1,016 » ; et
          Pensionssystemets årsredovisning 2025, note 6 : « Omräkningen av
          inkomstpension sker med kvoten mellan det nya och gamla
          inkomstindexet dividerat med 1,016 »
        etat: repris
        chantier: "138.1"
      - quoi: >-
          Sa grille de 2026 (PFS 2026:2 : 19,13 à 62 ans, 17,34 à 65, 1,93 à
          100) se recalcule au centième sur la table unisexe de SCB 2020-2024,
          en mensualités à échoir, survie linéaire dans l'année et facteur
          1,016. La fiche du diviseur du dépôt n'a aucun exemple officiel
          (`coefficient_de_conversion.yaml:48`) ; celui-ci en ferait un test.
        preuve: PFS 2026:2, recalculée sur la table `LivslangdFemarigA` de SCB
        etat: a_reprendre
        chantier: "138.11"
    sas: [suede_lagar_och_regler]
    lu_le: 2026-10-01
    lu_dans:
      - https://data.riksdagen.se/dokument/sfs-2010-110.text
      - https://www.pensionsmyndigheten.se/om-pensionsmyndigheten/allmanna-handlingar/lagar-och-regler

  - id: balanstal_suede
    nom: L'indice d'équilibre suédois (balanstal)
    auteur: Riksdag et Pensionsmyndigheten
    pays: Suède
    nature: methode
    publication: documente
    documentation:
      - https://www.pensionsmyndigheten.se/statistik/publikationer/orange-rapport-2025/orange-rapport-2025.pdf
      - https://data.riksdagen.se/dokument/sfs-2002-780.text
    licence: textes officiels
    usage: copier
    confronte: [proposition]
    couvre: >-
      L'indice d'équilibre — cotisations fois temps de rotation, plus les
      fonds AP2 à AP4, sur la dette de pension —, le frein sous 1, son
      lissage par un tiers, et depuis la loi 2026:1301 un accélérateur
      au-dessus de 1,15, appliqué pour la première fois à 2027. L'indice
      valait 1,1472 au rapport orange de 2025.
    confrontation: >-
      Un calcul à refaire : retrouver 1,1472 et le temps de rotation, puis
      opposer le mécanisme d'équilibre de la proposition à la règle suédoise,
      désormais symétrique.
    fait_mieux:
      - quoi: >-
          L'indice d'équilibre se calcule sur un stock — cotisations fois
          durée de rotation, plus les fonds, sur la dette de pension — et
          s'applique : sous 1, il freine l'indexation des comptes et des
          pensions jusqu'au rattrapage ; au-delà de 1,15, il distribue. Le
          dépôt calcule un rapport de flux, ressources sur dépenses de l'année
          (`cout.py:114-121`), jamais appliqué (`limites.md:1898-1913`) ; il a
          le passif (`EngagementAcquis`, `cout.py:3455`), pas l'actif de
          cotisation, la durée de rotation ni les réserves.
        preuve: >-
          SFB 58:10-25 c (dont la loi 2026:1301), 62:19 et 62:43 ; rapport
          orange de 2025, tableau 1.1 et annexe B (BT = 1,1472 pour 2027)
        etat: a_trancher
        raison: >-
          Moduler l'indexation des comptes et des pensions par un équilibrage
          automatique est un choix du programme, que le propriétaire tranche ;
          le calcul seul — durée de rotation, stock des droits, réserves du
          COR, une couche qui module l'indexation avec deux ans de retard —
          serait de taille L.
      - quoi: >-
          De 1999 à 2016, l'indice de revenu suédois lissait sur trois ans la
          seule croissance réelle, multipliée par l'inflation de l'année. Le
          lissage du dépôt porte sur le nominal (`indexation.py:104-111`), et
          il en avoue la dérive (`config.py:506-511`) : sur la masse salariale
          lissée sur cinq ans, de 1940 à 2025, le lissage du seul réel la
          ramènerait de +21,3 % à −2,5 %.
        preuve: >-
          rapport orange de 2014, annexe A.1.1 : « to permit more rapid
          adjustment … to changes in the inflation rate »
        etat: a_reprendre
        chantier: "138.11"
    sas: [suede_orange_rapport_2025]
    lu_le: 2026-10-01
    lu_dans:
      - https://www.pensionsmyndigheten.se/statistik/publikationer/orange-rapport-2025/orange-rapport-2025.pdf
    note: >-
