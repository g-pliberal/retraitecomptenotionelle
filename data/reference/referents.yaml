  - id: moteur_cnav
    nom: Moteur de calcul des retraites de l'Assurance retraite
    auteur: Cnav
    nature: calculateur
    publication: non_public
    documentation:
      - https://www.lassuranceretraite.fr/portail-info/hors-menu/footer/traitements-algorithmiques.html
    licence: sans objet
    usage: resultats_publies
    confronte: [scenario_1]
    couvre: >-
      Le moteur qui liquide les retraites du régime général. Onze fiches de
      « traitements algorithmiques » (mars 2026), dont huit sur la retraite :
      le montant de la retraite personnelle, la majoration de durée
      d'assurance, le minimum contributif et sa majoration, le cumul
      emploi-retraite ; leurs étapes, sans formules.
    confrontation: >-
      Comparer ses étapes, fiche par fiche, à celles du moteur du dépôt ; ses
      résultats sont les exemples officiels de la Cnav, déjà au banc.
    fait_mieux:
      - quoi: >-
          À chaque date de revalorisation, il applique le coefficient au
          « montant mensuel théorique » de la seconde pension, le compare au
          « plafond réglementaire » de la date, et retient le plus petit,
          comme le veulent L. 161-23-1 et D. 161-2-22-1. Le dépôt ne la
          revalorise pas (`data/reference/regles/seconde_pension.yaml:121` :
          « “faire vivre” ne la revalorise pas »).
        preuve: >-
          fiche « CER Revalorisation du montant » de ses traitements
          algorithmiques (mars 2026)
        etat: a_reprendre
        chantier: "138.12"
    lu_le: 2026-10-01
    lu_dans:
      - https://www.lassuranceretraite.fr/portail-info/hors-menu/footer/traitements-algorithmiques.html
    note: >-
      La circulaire Cnav 2022-23 dit la décision fondée sur le code de la
      sécurité sociale, et non sur un traitement algorithmique.

