  - id: projections_grece
    nom: Projections de l'Autorité actuarielle nationale
    auteur: Autorité actuarielle nationale, sur le modèle de l'OIT
    pays: Grèce
    nature: projection
    publication: non_public
    documentation:
      - https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition]
    couvre: >-
      Les complémentaires grecques en comptes notionnels : rendement égal à
      la croissance des salaires cotisés, rentes actualisées à 1,3 %, aucune
      indexation en cas de déficit.
    confrontation: >-
      Une règle d'équilibre à opposer à celle de la proposition : la
      suspension de l'indexation.
    fait_mieux:
      - quoi: >-
          Taux technique et revalorisation y sont couplés :
          Δt = min[(1+g_{t−2})/(1+r) − 1, CPI], avec r = 1,3 %, la formule de
          la RGS. Le dépôt n'ôtait pas ν (`config.py:633-637`) de la
          revalorisation servie (`revalorisation.py:921`) : à ν = 1,5 %, la
          pension gagnait 21 % sans contrepartie ; l'étape 138.1 l'en retire.
        preuve: fiche grecque de l'Ageing Report 2024, p. 16-17 et 52
        etat: repris
        chantier: "138.1"
      - quoi: >-
          L'indexation y est suspendue en cas de déficit. Le dépôt calcule le
          coefficient d'équilibre sans règle qui l'applique.
        preuve: fiche grecque de l'Ageing Report 2024, p. 16-17 et 52
        etat: a_trancher
        raison: >-
          Suspendre l'indexation en déficit est une règle d'équilibre, un
          choix du programme que le propriétaire tranche.
    lu_le: 2026-10-01
    lu_dans:
      - https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en

