  - id: diviseur_pologne
    nom: Le diviseur polonais
    auteur: loi sur les pensions du FUS (article 26) et GUS
    pays: Pologne
    nature: methode
    publication: documente
    documentation:
      - https://stat.gov.pl/sygnalne/komunikaty-i-obwieszczenia/lista-komunikatow-i-obwieszczen/komunikat-w-sprawie-tablicy-sredniego-dalszego-trwania-zycia-kobiet-i-mezczyzn,285,14.html
      - https://arslege.pl/wysokosc-emerytury/k63/a22756/
    licence: textes officiels
    usage: copier
    confronte: [proposition]
    couvre: >-
      Le capital divisé par l'espérance de vie restante unisexe, en mois,
      sans actualisation ; la table du GUS, publiée avant le 31 mars, vaut
      du 1er avril au 31 mars suivant.
    confrontation: >-
      Une variante à opposer au diviseur du dépôt : l'espérance de vie pure,
      sans taux technique.
    fait_mieux:
      - quoi: >-
          Son capital initial comble les trous : la pension hypothétique au
          1er janvier 1999 est multipliée par l'espérance de vie à 62 ans,
          avec un prorata sur les 24 % de base ; un salaire introuvable vaut
          le salaire minimum, au prorata ; le capital se revalorise comme le
          compte, jamais en baisse. Le dépôt a la même structure
          (`scenarios/notionnel.py:658-735`), mais une année sans montant y
          vaut zéro, et les points du relevé sont « lus, et jetés »
          (`web/releve_lu.py:634, 648-654`).
        preuve: >-
          Dz.U. 2025 poz. 1749, art. 173, art. 174 ust. 8 et art. 15 ust. 2a
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          L'année du départ, la revalorisation y est trimestrielle. Le dépôt
          compte l'année entière quel que soit le mois
          (`moteur/indexation.py:213-235`), soit de +½ an à −0,4 an de
          croissance ; un prorata de (m−1)/12 suffirait.
        preuve: Dz.U. 2025 poz. 1749, art. 25a
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          Le GUS publie chaque année la table qui fait le diviseur, 222,7 mois
          à 65 ans en 2026 : un exemple officiel, sans actualisation, que la
          fiche du diviseur du dépôt n'a pas
          (`coefficient_de_conversion.yaml:48`).
        preuve: communiqué du GUS du 25 mars 2026
        etat: a_reprendre
        chantier: "138.11"
    sas: [pologne_gus_esperance]
    lu_le: 2026-10-01
    lu_dans:
      - https://arslege.pl/wysokosc-emerytury/k63/a22756/
    note: >-
      Les valeurs de 2026 (268,9 mois à 60 ans, 222,7 à 65 ans) n'ont été lues
      que sur un site secondaire.
      Le 1er octobre 2026, ces 222,7 mois à 65 ans ont été lus à la source, au
      communiqué du GUS du 25 mars 2026.

