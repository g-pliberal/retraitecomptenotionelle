  # ---- L'Urssaf : les règles publicodes ----------------------------------

  - id: modele_ti
    nom: modele-ti
    auteur: Urssaf (mon-entreprise)
    nature: calculateur
    publication: ouvert
    code: https://github.com/betagouv/mon-entreprise
    documentation:
      - https://www.npmjs.com/package/modele-ti
    licence: MIT
    usage: copier
    confronte: [scenario_1]
    couvre: >-
      Les règles publicodes des travailleurs indépendants : trimestres
      validés, cotisations, points de la CNAVPL, du RCI et de la Cipav et
      valeurs du point de 2023 à 2026, la réforme de l'assiette de 2025
      comprise ; 140 blocs de références pour quelque 218 règles.
    version: "0.1.0"
    confrontation: >-
      Un calcul rejoué : le simulateur en ligne de l'Urssaf le charge, et une
      grille de revenus de 2024 à 2026 y rend les points de la CNAVPL et les
      cotisations de la Cipav du dépôt au dixième près.
    ecarts:
      - constat: >-
          Chez nous, l'assiette minimale de 2025 (450 SMIC horaires) ne
          validait que deux trimestres : une division en virgule flottante
          rendait 2,999….
        tranche: l'erreur était la nôtre, corrigée, et tenue par tests/test_sections_liberales.py
        preuve: data/sources_a_explorer.yaml (mon_entreprise_cipav)
      - constat: >-
          Il appelle la cotisation minimale à revenu nul, dont les
          bénéficiaires du RSA sont dispensés.
        tranche: le droit dispense, et ni lui ni le dépôt ne savent qui touche le RSA ; écart déclaré
        preuve: docs/archives/limites.md (« Les dernières sections libérales »)
    sas: [mon_entreprise_cipav]
    lu_le: 2026-10-01
    lu_dans:
      - https://registry.npmjs.org/modele-ti
      - https://github.com/betagouv/mon-entreprise
      - data/sources_a_explorer.yaml
    note: >-
      Paquet npm 0.1.0 du 16 juillet 2026, sous MIT, dans le répertoire
      `modele-ti` du dépôt de mon-entreprise ; il n'a pas de dépôt à lui. Le
      dépôt est en avance sur le paquet : le 2 septembre 2026, un commit
      corrige les points acquis, inversés entre le RCI et la Cipav. L'API de
      mon-entreprise l'expose (`/api/v1/modeles/ti/evaluate`), sans
      authentification, cinq requêtes par seconde.

  - id: modele_social
    nom: modele-social
    auteur: Urssaf (mon-entreprise)
