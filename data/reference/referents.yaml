  - id: destinie_2
    nom: Destinie 2
    auteur: INSEE
    nature: microsimulation_dynamique
    publication: ouvert
    code: https://github.com/InseeFr/Destinie-2
    documentation:
      - https://www.insee.fr/fr/information/3606338
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%205_Destinie_INSEE.pdf
    licence: GPL-3.0 ou ultérieure ; paramètres sous ODbL et DbCL
    usage: executer_a_part
    confronte: [scenario_1, cout]
    couvre: >-
      Des pensions entières, ménage compris : régime général, service des
      retraites de l'État, CNRACL, indépendants, Agirc-Arrco ; droits
      directs, réversion, ASPA. La législation se choisit par année ; ses
      derniers seuils sont de 2023, sans la loi du 30 décembre 2025.
    confrontation: >-
      Un calcul rejoué : l'exécuter à part sur des carrières que le dépôt
      décrit aussi, et confronter ses pensions, sa réversion et ses
      majorations pour enfants, que trois fiches attendent (`reversion`,
      `majoration_duree_assurance_enfants`, `enfants_fonction_publique`). Le
      seul modèle public avec la réversion et l'ASPA, et des législations
      passées qu'on choisit.
    ecarts:
      - constat: >-
          Il lève au régime général la condition d'âge de 55 ans de la
          réversion pour le survivant qui a deux enfants à charge
          (`src/Retraite.cpp:224-229`).
        tranche: >-
          R. 353-1, que la fiche du dépôt lit sans cette exception ; l'écart
          est le sien
        preuve: data/reference/regles/reversion.yaml
      - constat: >-
          Tout couple simulé y est marié (`src/Separations.cpp:189-190` ;
          `CONCUBINAGE`, `src/Constantes.h:30`, n'est jamais affecté), ce qui
          ouvre la réversion aux concubins.
        tranche: >-
          la réversion ne s'ouvre qu'au conjoint marié, comme le lit la fiche
          du dépôt ; l'écart est le sien
        preuve: >-
          data/reference/regles/reversion.yaml (« ni le PACS ni le concubinage
          n'ouvrent la réversion »)
      - constat: >-
          La majoration de la réversion pour enfant à charge lui manque ; il
          ne majore que le survivant de trois enfants
          (`src/Reversion.cpp:98-106`).
        tranche: >-
          L. 353-5 du code de la sécurité sociale ; l'omission est la sienne
        preuve: >-
          `src/Reversion.cpp`, au commit `4c1d34b`
      - constat: >-
          Quand un seul membre du couple a 65 ans, il sert l'ASPA jusqu'au
          barème du couple (`src/Retraite.cpp:12-30`).
        tranche: >-
          service-public.fr (F16871, lu le 1er octobre 2026) : « Lorsqu'un
          seul membre de votre couple reçoit l'Aspa, le montant maximum versé
          est de 1 043,59 € par mois », sous un plafond du couple de
          1 620,18 € ; l'écart est le sien
        preuve: https://www.service-public.fr/particuliers/vosdroits/F16871
      - constat: >-
          Sans la loi du 30 décembre 2025, il ouvre les droits de la
          génération 1964 à 63 ans et lui demande 171 trimestres
          (`src/Legislation.cpp:57-59`).
        tranche: >-
          la loi du 30 décembre 2025, que le dépôt certifie : 62 ans et 9
          mois, 170 trimestres ; l'écart est le sien
        preuve: >-
          data/reference/legislation/age_ouverture_requis.csv (l. 139) et
          duree_assurance_requise.csv (l. 129)
      - constat: >-
          Il projette l'ASPA de 2025 à 12 493,58 € par an.
        tranche: >-
          le montant servi en 2025, 12 411,36 €, que le dépôt porte ; l'écart
          est le sien
        preuve: data/reference/legislation/minimum_vieillesse.csv (l. 79)
    fait_mieux:
      - quoi: >-
          Il calcule la réversion du régime général entière : minimum
          proratisé sous quinze ans et maximum, majoration de 10 % du
          survivant de trois enfants, réversion d'un assuré mort avant son
          départ, plafond de ressources du ménage, majoration de 11,1 % sous
          plafond, partage entre ex-conjoints au prorata des mariages,
          remariage ; son minimum de 2024, revalorisé de 2,2 %, donne celui de
          2025 que lit le dépôt. Le dépôt la déclare absente
          (`data/reference/regles/reversion.yaml:444-470`,
          `droit/reversion.py:19-24`, `docs/limites.md:73-86`) ; Destinie,
          exécuté à part, en serait le témoin, sorties seules.
        preuve: >-
          `src/Reversion.cpp:23-49, 76-106`, `src/Retraite.cpp:235-268,
          300-334, 347-357, 365-380` et `src/Retraite.h:274`, au commit
          `4c1d34b`
        etat: a_reprendre
        chantier: "138.4"
      - quoi: >-
          Il sert l'ASPA au ménage, sur ses ressources, celles du conjoint
          comprises. Le dépôt applique le barème d'une personne seule
          (`droit/foyer.py:5-6`, `docs/limites.md:395-399`) ; le barème du
          couple n'y sert qu'à l'accueil
          (`minimum_vieillesse_couple.csv:5-8`).
        preuve: >-
          `src/Retraite.cpp:12-30` (« MinVieil2[t]-revenu_men »), au commit
          `4c1d34b`
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il importe les variantes démographiques de l'INSEE — fécondité,
          espérance de vie, migrations, « central, bas, haut » —, en 64 jeux.
          Le dépôt ne reprend que le scénario central
          (`data/sources.yaml:431-432, 464-465`), sur des projections de 2026,
          plus récentes que les siennes (2021).
        preuve: >-
          `R/Outils.R:399` (`import_scenario_demo_insee`) et
          `data/fec_*_vie_*_mig_*.rda`, au commit `4c1d34b`
        etat: a_reprendre
        chantier: "138.7"
      - quoi: >-
          Il lit les quotients de mortalité projetés de l'INSEE par sexe, âge
          et année, et s'en sert tels quels. Le dépôt les réduit à e60 et e65
          pour caler un Gompertz-Makeham (`donnees/mortalite.py:8-14`) ;
          l'écart, à la queue au-delà de 85 ans, n'est pas mesuré.
        preuve: >-
          `src/Mortalite.cpp:27`, au commit `4c1d34b`
        etat: a_reprendre
        chantier: "138.7"
      - quoi: >-
          Il calcule un taux de rendement interne des cotisations ; le dépôt
          n'en a aucun (« rendement interne », cherché en vain dans `src/`).
        preuve: >-
          `src/CotisationsTRI.h`, au commit `4c1d34b`
        etat: a_reprendre
        chantier: "138.9"
    sas: [insee_destinie_2]
    lu_le: 2026-10-01
    lu_dans:
      - https://github.com/InseeFr/Destinie-2
      - https://www.insee.fr/fr/information/3606338
    note: >-
      La confirmation la plus indépendante du registre : ses paramètres sont
      les siens (sa feuille de documentation cite la Cnav, le COR,
      l'Agirc-Arrco, TAXIPP et l'IPP). Actualisé le 15 octobre 2025, en C++ et
      R. L'échantillon fourni n'est qu'un test, « sans aucune
      représentativité ». C'est lui qui projette la France pour l'Ageing
      Report de 2024, et les engagements de retraite des comptes nationaux
      hors fonction publique de l'État.
      Comparé au dépôt le 1er octobre 2026 au commit `4c1d34b`. Il plafonne la
      majoration pour enfants de la fonction publique même avec surcote, ce
      que le SRE excepte (`src/DroitsRetr.cpp:879`) : à trancher, la fiche du
      dépôt cherchant encore le texte.

