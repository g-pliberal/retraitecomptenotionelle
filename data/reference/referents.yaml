    confronte: [proposition, cout]
    couvre: >-
      Un pilier notionnel par répartition au choix du taux (PIB, PIB par
      tête, salaire, masse salariale), les facteurs de rente, la transition
      par capital initial, la dette implicite ; en Excel et VBA.
    confrontation: >-
      Une méthode à refaire, celle du « Calculus for PROST 15 » : le capital
      initial de la transition et la dette implicite, à opposer à ceux du
      dépôt.
    fait_mieux:
      - quoi: >-
          Il valorise les droits acquis au diviseur de la génération de
          l'assuré, AF(P_AGE, P_YEAR) avec P_YEAR = T + P_AGE − a (éq. 112).
          Le dépôt prend celui de l'âge de référence l'année de la bascule
          (`scenarios/notionnel.py:719-724`, jumeau
          `scenario-notionnel.js:383-388`), exact pour qui a 65 ans à la
          bascule seulement : −9,0 % sur la part figée de qui a 40 ans en
          2026, −11,8 % à 30 ans.
        preuve: « Calculus for PROST 15 » (Banque mondiale, 2019), éq. 112
        etat: a_trancher
        raison: >-
          Convertir les droits acquis au diviseur de la génération de
          l'assuré, plutôt qu'à celui de l'année de bascule, change la part
          figée de tous les actifs (scénarios 3 et 5, page Coût) : le
          propriétaire tranche, le choix actuel du dépôt étant celui de la
          Pologne (voir diviseur_pologne).
      - quoi: >-
          Il impute les salaires manquants par leur moyenne revalorisée. Dans
          le dépôt, une année sans montant vaut zéro (`web/releve_lu.py:634,
          648-654`).
        preuve: « Calculus for PROST 15 », éq. 116
        etat: a_reprendre
        chantier: "138.11"
    sas: [banque_mondiale_prost]
    lu_le: 2026-10-01
    lu_dans:
      - https://documents1.worldbank.org/curated/en/099061024110535659/pdf/P1777231d8367c0111800816452e83c58d7.pdf
    note: >-
      L'outil n'est pas téléchargeable : la Banque mondiale le remet sur clé
      USB en formation (« World Bank property »).

  - id: modeles_ocde
    nom: Les modèles de pension de l'OCDE
    auteur: OCDE (à l'origine APEX, d'Axia Economics)
    pays: international
    nature: cas_types
    publication: documente
    documentation:
      - https://doi.org/10.1787/e40274c1-en
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition]
    couvre: >-
      Les taux de remplacement et le patrimoine retraite par pays, pays
      notionnels compris, sous des hypothèses publiées : inflation 2 %,
      salaires réels +1,25 %, actualisation 1,5 %, mortalité de l'ONU par
      génération.
    confrontation: >-
      Des résultats publiés à retrouver : le taux de remplacement d'une
      carrière complète, sous ses hypothèses.
    fait_mieux:
      - quoi: >-
          Il calcule le patrimoine retraite, valeur actuelle des pensions à
          1,5 % sur une mortalité de cohorte ; le dépôt n'en a pas (absent,
          cherché en vain).
        preuve: Pensions at a Glance 2025, p. 160-161
        etat: a_reprendre
        chantier: "138.9"
      - quoi: >-
          Il publie, pour la France et une carrière de 22 à 65 ans, des taux
          de remplacement bruts de 56,6, 56,6 et 47,4 % à 0,5, 1 et 2 salaires
          moyens, un taux net de 70,0 %, un patrimoine retraite de 11,5 années
          de salaire pour les hommes et de 13,1 pour les femmes. Le dépôt n'a
          ni jeu macroéconomique « OCDE » (prix +2 %, salaires réels +1,25 %)
          ni témoin qui s'y confronte.
        preuve: Pensions at a Glance 2025, tableaux 4.1, 4.4, 4.6 et 5.4
        etat: a_reprendre
        chantier: "138.9"
    lu_le: 2026-10-01
    lu_dans:
      - https://doi.org/10.1787/e40274c1-en

  - id: ageing_report
    nom: Ageing Report et ses fiches pays
    auteur: Commission européenne et Comité de politique économique (AWG)
    pays: international
    nature: projection
    publication: documente
    documentation:
      - https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en
    licence: sans objet
    usage: resultats_publies
    confronte: [cout, proposition]
    couvre: >-
      Les projections de chaque État par son propre modèle, revues par les
      pairs ; la fiche de chaque pays décrit son modèle. La France y est
      projetée avec Destinie.
    depend_de: [destinie_2]
    confrontation: >-
      Des résultats publiés à retrouver : la dépense de pensions de la
      France jusqu'en 2070, et celle des pays notionnels.
    fait_mieux:
      - quoi: >-
          Il décompose la dépense en dépendance, couverture, prestation et
          marché du travail ; le dépôt n'a rien de tel, et suppose la
          couverture constante (`cout.py:58`).
        preuve: Ageing Report 2024, encadré I.1.1 et tableau I.1.10
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Pour la France, il projette 14,4 % du PIB en 2022 et 13,6 % en
          2070 : dépendance +6,0 points, couverture −2,2, prestation −3,4, un
          ratio de prestation qui passe de 47 à 37 %. Le dépôt ne s'y
          confronte pas ; il y faudrait la décomposition par scénario, puis
          l'Ageing Report sous les hypothèses macroéconomiques de l'AWG.
        preuve: fiche France de l'Ageing Report 2024, tableaux 7, 9 et 10
        etat: a_reprendre
        chantier: "138.3"
    sas: [ageing_report_2024]
    lu_le: 2026-10-01
    lu_dans:
      - https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en
    note: L'Ageing Report de 2027 n'est pas encore publié.

