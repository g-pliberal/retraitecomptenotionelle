  - id: canopee
    nom: Canopée
    auteur: Caisse des dépôts, pour la CNRACL
    nature: microsimulation_dynamique
    publication: non_public
    documentation:
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%2011_CANOPEE_CNRACL.pdf
      - https://politiques-sociales.caissedesdepots.fr/cahiers/qps-les-cahiers-ndeg9
      - https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_07_SI_CNRACL.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [cout]
    couvre: >-
      Les fonctionnaires territoriaux et hospitaliers, sur leurs grilles :
      droits directs, réversion, invalidité, jusqu'en 2090 ; créé en 2019.
    confrontation: >-
      Des résultats publiés à retrouver : les projections de la CNRACL pour
      le COR.
    ecarts:
      - constat: >-
          La description de 2020 suit les grilles de 2015, sans le
          protocole PPCR (« celles prévalant en 2015 »), et fait
          liquider tout le monde au taux plein, sans décote ni
          surcote (p. 16 et 26 du PDF).
        tranche: >-
          PPCR s'applique depuis 2016 (Pablo a dû l'introduire par
          calage : doc. n° 10, p. 11). La Caisse des dépôts
          annonçait les deux corrections ; la note de 2024 ne dit
          pas si elles sont faites. Sans effet sur ce que lit le
          dépôt : le classeur de 2024 est postérieur.
        preuve: doc. n° 11, p. 16 et 26 ; doc. n° 10, p. 11
    fait_mieux:
      - quoi: >-
          Il projette les retraités de droit direct de la CNRACL, de
          1,34 million en 2023 à 2,13 millions en 2070. La dépense de la page
          Coût garde les poids de 2024 (`donnees/effectifs.py:39-41`), alors
          que sa recette lit déjà les cotisants projetés du même classeur.
        preuve: >-
          classeur par régime du COR (2024), bloc « Effectifs de retraités de
          droit direct » ; COR, document n° 7 de décembre 2024
        verification: >-
          Relu le 7 octobre 2026 : l'action 147 l'a fait à son étape 9. La
          grille prolonge la CNRACL par les retraités que le COR lui
          projette (`retraites_projetes.csv`,
          `EffectifsRetraites.CAISSES_PROJETEES`), et non plus par sa part de
          2024.
        etat: repris
        chantier: "147.9"
      - quoi: >-
          Il sépare, à la CNRACL et grade par grade, les départs
          actifs, sédentaires, pour invalidité et en carrière
          longue. En 2018, 47 % des nouveaux retraités de la FPH
          partaient en catégorie active, 7 % à la FPT. À long terme,
          les sédentaires feraient « trois-quarts des départs » et
          l'invalidité 10 %. Dans le classeur du COR, l'âge moyen de
          départ à la CNRACL passe de 61,5 ans en 2023 à 64,3 ans en
          2070. Le dépôt donne tout l'effectif de la CNRACL (1,39
          million en 2024, 6 % des poids) au seul cas type de
          catégorie active, parti à 57 ans (`castypes.py:182-198`,
          pondération `castypes.py:299-337`). Il prête ainsi à toute
          la caisse le départ que le notionnel pénalise le plus.
        preuve: >-
          doc. n° 11, p. 6 du PDF (« En 2018, 47 % des nouveaux
          liquidants de droit direct vieillesse à la FPH ont
          bénéficié d'un départ anticipé au titre de la catégorie
          active […] FPT (7 %) ») et p. 22 ; classeur par régime
          2024, feuille CNRACL, bloc « Âge moyen de départ à la
          retraite »
        verification: >-
          Données de gestion de la CNRACL (recueil statistique 2018,
          cité au doc. n° 11) et projection de la caisse pour le
          COR. Un âge moyen de 61,5 ans contredit un départ unique à
          57 ans.
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il fait mourir les fonctionnaires territoriaux et
          hospitaliers selon des tables adaptées par sexe,
          invalidité et catégorie hiérarchique (QRS n° 19, Soulat
          2017), parce qu'ils « décèdent en moyenne plus tardivement
          que la moyenne nationale ». C'est le même point que
          misraa.
        preuve: doc. n° 11, p. 19 du PDF
        verification: Méthode, sur les données de la CNRACL.
        etat: a_reprendre
        chantier: "138.7"
    bilan: >-
      Canopée fait mieux par la composition de la CNRACL : actifs ou
      sédentaires, invalidité, grades, mortalité propre. Ses chiffres
      publiés montrent que le dépôt pèse toute la caisse sur un départ à
      57 ans quand l'âge moyen y est de 61,5 ans, une erreur de
      pondération qui grossit les économies des scénarios notionnels.
    lu_le: 2026-10-04
    lu_dans:
      - https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_07_SI_CNRACL.pdf
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%2011_CANOPEE_CNRACL.pdf
      - https://www.cor-retraites.fr/sites/default/files/2025-02/Données_régimes_publi_V2.xlsx
    note: >-
      La Caisse des dépôts tient aussi une prévision de la CNRACL à cinq ans,
      refondue en 2023-2024, et une maquette pour le FSPOEIE, que le jaune
      « pensions » du PLF 2026 cite.

  - id: mistral
    nom: Mistral
    auteur: Caisse des dépôts, pour l'Ircantec
    nature: projection
    publication: non_public
    documentation:
      - https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_07_SI_CNRACL.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [cout]
    couvre: >-
      La solvabilité et la trajectoire de l'Ircantec à long terme (2016), avec
