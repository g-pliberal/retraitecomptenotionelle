        preuve: data/sources_a_explorer.yaml (mon_entreprise_cipav)
      - constat: >-
          Il valide les trimestres du micro-entrepreneur sur son revenu
          abattu, aux coefficients 0,29, 0,50 et 0,66, quand le revenu cotisé,
          CA × 12,3 % × 43,45 % / 17,87 %, donne 0,299, 0,515 et 0,665 :
          12 100 € de ventes « valide 2 trimestres », le revenu abattu
          (3 509 €) un seul.
        tranche: >-
          service-public.fr (F23369, vérifié le 1er avril 2026) ; l'erreur est
          la sienne, et aussi celle du dépôt
          (`regimes/micro_entrepreneurs.yaml`)
        preuve: >-
          `règles/protection-sociale.publicodes:77-105` et
          `règles/entreprise/imposition.publicodes:327-353`, au commit
          `6bb0f26`
      - constat: >-
          Il fixe à 2 860 € le seuil de la Cipav pour 2026
          (`protection-sociale.publicodes:88`).
        tranche: >-
          la Cipav, qui écrit « 2 792 € en 2026 » (fiche pratique « AE
          2026 ») ; l'écart est le sien
        preuve: >-
          `règles/protection-sociale.publicodes:88`, au commit `6bb0f26`
      - constat: >-
          Sa branche `dirigeant . indépendant` est d'avant 2025 :
          assiette = revenu professionnel
          (dirigeant/indépendant/indépendant.publicodes:47-58),
          vieillesse 17,75 % et 0,60 %
          (cotisations-et-contributions.publicodes:291-317), RCI 7
          et 8 % au PRCI (318-359), outre CNAVPL et Cipav déjà au
          registre.
        tranche: >-
          D. 633-3 (17,15 % + 0,72 %), D. 635-7 (8,1 et 9,1 %,
          tranche 1 au PASS), D. 136-5 (abattement de 26 %) ;
          modele-ti, même dépôt, suit 2025
        preuve: >-
          LEGIARTI000049904636, LEGIARTI000049904623,
          LEGIARTI000049899286
      - constat: >-
          Seuils de la taxe sur les salaires de 2025 : 9 147 et 18
          258 € (salarié.publicodes:517-535).
        tranche: >-
          CGI 231 en vigueur : 9 229 et 18 423 € pour 2026
        preuve: LEGIARTI000054370158
      - constat: >-
          Trimestres de l'apprenti validés sur sa cotisation
          salariale après exonération
