        preuve: doc. n° 7 du 19 décembre 2024, p. 7 du PDF
        verification: >-
          C'est un pilotage propre au régime ; la note ne publie pas
          les indicateurs.
        etat: ecarte
        raison: >-
          Le dépôt ne projette ni les régimes un à un ni leurs
          réserves. La solvabilité d'un régime complémentaire sort
          du champ de la page Coût.
    bilan: >-
      Mistral, l'outil de la Caisse des dépôts pour l'Ircantec (avec
      Prévir pour l'emploi des contractuels), n'est connu que par une
      ligne de la note de 2024 et par ses projections dans le classeur
      du COR. Il ne fait mieux que par ces projections, qui sont à lire
      comme des droits de polypensionnés.
    lu_le: 2026-10-04
    lu_dans:
