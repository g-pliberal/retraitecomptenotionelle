  - id: misraa
    nom: MisrAA
    auteur: Agirc-Arrco, direction technique
    nature: microsimulation_dynamique
    publication: non_public
    documentation:
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%2012_Mod%C3%A8le%20Agirc-Arrco.pdf
      - https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_05_SI_Agirc-Arrco.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [cout]
    couvre: >-
      Les points, durées et trimestres des affiliés de l'Agirc-Arrco, et ceux
      qu'ils obtiennent dans les autres régimes, sur un vingt-cinquième
      d'entre eux ; il remplace les modèles de l'Agirc et de l'Arrco.
    confrontation: >-
      Des résultats publiés à retrouver : les projections de l'Agirc-Arrco
      pour le COR.
    fait_mieux:
      - quoi: >-
          Il projette l'Agirc-Arrco sous une convention de la
          Fédération Agirc-Arrco, « après consultation des
          partenaires sociaux », que le COR reprend : sur 2027-2037,
          la valeur de service suivrait le salaire moyen minoré de
          1,16 %, puis de 0,86 % dès 2038 ; sa révision ajoute 0,3
          point de PIB à la dépense de 2070. Sous cette convention,
          la part de l'Agirc-Arrco dans le taux de remplacement net
          du non-cadre, rapporté au dernier salaire, passe de 24,6 %
          (génération 1940) à 16,4 % (génération 2000), selon
          TRAJECTOiRE ; la part complémentaire de sa pension, de 32
          à 24 %. Le dépôt gèle le rendement après 2026
          (`regimes/rendements_points.csv:51`, 5,61 % de 2027 à
          2100) et fait suivre les prix à la valeur de service
          (`droit/liquider.py:1535-1545`).
        preuve: >-
          rapport annuel du COR de juin 2026, p. 10 (note 2), p. 64,
          p. 107 et figure 3.3 (« Source : Drees, modèle Trajectoire
          ») ; fiche Agirc-Arrco du COR (2024)
        etat: a_trancher
        raison: >-
          La trajectoire « n'engage donc aucunement les partenaires
          sociaux », dit la fiche, mais c'est la seule publiée, et
          elle porte sur un quart de la dépense : en faire une
          variante « convention COR » de la page Coût, déclarée dans
          `limites.md`, est un choix que le propriétaire tranche.
      - quoi: >-
          Il pose qu'ignorer la mortalité différentielle « est
          susceptible de sous-estimer les dépenses » : les anciens
          cadres vivent plus longtemps et ont plus de droits. Il
          prévoyait en 2020 des tables par niveau de points au-delà
          du plafond, et établit depuis ses propres tables sur ses
          données individuelles. La page Coût fait vivre tous les
          cas types comme la population générale
          (`cout.py:2151-2152`) : la pension du cadre (2,2 salaires
          moyens) et celle du SMIC ont la même survie. Le dépôt a
          pourtant les tables de l'INSEE par vingtile de niveau de
          vie, qu'il n'utilise que pour le diviseur
          (`config.py:611-628`) et la garantie (`cout.py:2376`).
        preuve: >-
          doc. n° 12, p. 11 du PDF (« Le fait d'ignorer cette
          différence d'espérance de vie entre ces deux
          sous-populations, est susceptible de sous-estimer les
          dépenses d'allocations du régime ») ; doc. n° 5 de 2024,
          p. 8 du PDF (« Elles permettent entre autres, d'établir
          les tables de mortalité »)
        verification: >-
          Méthode : à nombre de décès égal, leur répartition entre
          fortes et faibles pensions change la masse (même doc.). Le
          biais est chiffré par Pablo (45 Md€ d'engagements, 2,2 Md€
          de pensions en 2034) et traité par Prisme et Canopée. Les
          tables par vingtile (Insee Résultats 2025) sont déjà au
          dépôt (`limites.md:438`).
        etat: a_reprendre
        chantier: "138.7"
    bilan: >-
      MisrAA fait mieux par la mortalité différentielle, qui manque aux
      masses du Coût, et par la seule trajectoire publiée de la valeur
      du point (déjà en a_trancher). Le point existant est à corriger
      sur l'auteur de la convention, la nature des 24,6 et 16,4 %, et
      les lignes du dépôt citées.
    lu_le: 2026-10-04
    lu_dans:
      - https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_05_SI_Agirc-Arrco.pdf
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%2012_Mod%C3%A8le%20Agirc-Arrco.pdf

  # ---- Les ministères -------------------------------------------------------

  - id: osiris
    nom: Osiris
    auteur: Direction de la sécurité sociale (DSS)
    nature: cas_types
    publication: non_public
    documentation:
      - http://gesd.free.fr/caliper.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [scenario_1]
    couvre: >-
      Une maquette de cas types — « COR 1 », « COR 2 », le SMIC… — des
      générations 1975 à 2003, « conçue pour s'appliquer exclusivement à des
      analyses sur cas-types ».
    confrontation: >-
      Des résultats publiés à retrouver : les cas types de l'étude d'impact
      de 2020 (« Source : DSS/SDEPF/6C – maquette Osiris »).
    ecarts:
      - constat: >-
          Ses résultats « sans réforme » de 2020 font partir les
          générations 1975 à 2003 dès 62 ou 63 ans. Exemple : 80 %
          du SMIC, génération 1980, taux de remplacement net de 65 %
          à 63 ans (tableau 11, p. 128).
        tranche: >-
          L'âge d'ouverture est de 64 ans pour les assurés nés à
          compter du 1er janvier 1969 (L. 161-17-2,
          LEGIARTI000053280889, en vigueur depuis le 31 décembre
          2025, pensions prenant effet depuis le 1er septembre
          2026). Ces résultats sont périmés et ne sont plus des
          témoins du scénario 1.
        preuve: >-
          étude d'impact de 2020, p. 128 et 207 ; index LEGI, L.
          161-17-2
    fait_mieux:
      - quoi: >-
          Ses cas types comprennent une carrière heurtée : un
          non-cadre du tiers inférieur des salaires perd son emploi
          à 42 ans, touche l'ARE deux ans puis l'ASS deux ans, reste
          un an et demi au chômage non indemnisé, puis est inactif
          jusqu'au départ. Aucun des 13 cas types du dépôt ne
          connaît le chômage (`avantages.py:38`), alors que le
          chômage est le premier poste de solidarité (5,9 % des
          masses, Cnav 2019) et que le droit l'applique désormais
          (action 141).
        preuve: >-
          étude d'impact de 2020, p. 202 du PDF (définition) et p.
          207 (tableau 51), « Source : DSS/SDEPF/6C – maquette
          Osiris »
        verification: >-
          Méthode : c'est une carrière type proche de celles du COR.
        etat: a_reprendre
        chantier: "138.19"
      - quoi: >-
          Il présente chaque cas type à six âges de départ (62 à 67
          ans) pour les générations 1975, 1980, 1990 et 2003.
        preuve: étude d'impact de 2020, p. 207 du PDF (tableau 51)
        verification: Méthode.
        etat: a_reprendre
        chantier: "138.10"
    bilan: >-
      Osiris, maquette interne de la DSS, ne publie que ses cas types de
      2020, calculés sous un droit périmé. Il n'en reste que la forme de
      deux de ses cas types : une carrière heurtée par le chômage, que
      la grille du dépôt n'a pas, et une plage d'âges.
    lu_le: 2026-10-04
    lu_dans:
      - http://gesd.free.fr/caliper.pdf
      - https://www.assemblee-nationale.fr/dyn/15/textes/l15b2623_etude-impact.pdf
    note: >-
      Son usage actuel n'est pas connu. La DSS tient aussi une maquette
      comptable, qui agrège les comptes des régimes.

  - id: aphrodite
    nom: Aphrodite
    auteur: Direction générale du Trésor
    nature: microsimulation_dynamique
    publication: non_public
    documentation:
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%206_Aphrodite_DG-Tr%C3%A9sor.pdf
      - https://www.tresor.economie.gouv.fr/Articles/482ec69f-5251-4129-98b2-f4dfaccfb81e/files/5ad8638a-a272-4e14-8823-54a245de9606
    licence: sans objet
    usage: resultats_publies
    confronte: [cout]
    couvre: >-
      Les pensions de la Cnav, de l'Agirc, de l'Arrco, de l'État, auquel tous
      les fonctionnaires sont assimilés, et des non-salariés, sur les
      biographies de Destinie jusqu'à 55 ans ; en R. Il succède à Margaret
      (1989), Mars (2003) et Vénus (2007).
    confrontation: >-
      Des résultats publiés à retrouver, ceux de ses documents de travail ;
      son usage après 2020 n'est pas connu.
    ecarts:
      - constat: >-
          Ses résultats publiés reposent sur la législation de 2016
          et le scénario B du COR de 2015 (productivité 1,5 %) :
          dépenses de droit direct de 12,4 % du PIB en 2015 à 11,3 %
          en 2060. Son cas d'usage crédite l'accord Agirc-Arrco de
          2015 de 0,3 point de PIB, dont environ 100 000 actifs de
          plus en 2025 grâce aux coefficients de solidarité.
        tranche: >-
          Le coefficient de solidarité est supprimé pour les
          retraites prenant effet depuis le 1er décembre 2023, et
          pour toutes depuis le 1er avril 2024 (RA 2026, p. 136). Le
          COR projette aujourd'hui une productivité de 0,7 %. Ces
          résultats sont périmés.
        preuve: doc. n° 6, p. 10-11 ; DT 2016/04, p. 34 ; RA 2026, p. 136
    fait_mieux:
      - quoi: >-
          Il simule les fins de carrière après 55 ans (emploi,
          chômage, inactivité, maladie) par des logits emboîtés
          estimés sur l'EIC 2009, et peut y ajouter un effet
          horizon. Avec un décalage de deux ans, le taux d'emploi
          gagne 2 points entre 57 et 66 ans en 2040, et passe de 44
          à 48 % à 62 ans. Dans son échantillon, 22 % des femmes et
          12 % des hommes du privé sont déjà inactifs à 55 ans. Le
          dépôt suppose en emploi tous ceux que l'âge légal fait
          attendre (`config.py:863`).
        preuve: >-
          doc. n° 6, p. 4-7, et annexe p. 12-15 du PDF (tableaux 1
          et 2, graphique 6)
        verification: >-
          Méthode, sur données administratives. L'effet horizon y
          est « conventionnel » (note 9), pas estimé : les valeurs à
          retenir sont plutôt celles de l'enquête Emploi
          (maquette_globale_cor) et de la convention du COR
          (simulateur_cor). Repris le 7 octobre 2026, sans ses
          logits, par la part que mesurent les évaluations du recul
          de 2010 : la moitié (IPP, rapport n° 61, 2025).
        etat: repris
        chantier: "138.3"
      - quoi: >-
          Il calcule la réversion sur quatre mariages successifs,
          avec les conditions de ressources, de non-remariage et de
          durée de mariage. Il traite le partage entre ex-conjoints
          et calcule une pension fictive pour l'assuré mort avant
          d'avoir liquidé. Le dépôt laisse dehors le partage, le
          remariage et la réversion d'un assuré mort avant son
          départ (`limites.md:79-82`).
        preuve: doc. n° 6, p. 9-10 du PDF
        verification: >-
          L. 353-3 (LEGIARTI000006742651, en vigueur depuis le 22
          août 2003) : partage « au prorata de la durée respective
          de chaque mariage ». L'étape 4 de l'action 138 le prévoit
          déjà.
        etat: a_reprendre
        chantier: "138.4"
      - quoi: >-
          Il se boucle avec Mésange : réforme simulée, effets sur
          l'emploi, les salaires et les prix, réinjectés jusqu'à
          convergence. Le dépôt est comptable
          (`limites.md:2968-2972`) ; voir le tableau 2.10 du COR, au
          point de maquette_globale_cor.
        preuve: DT 2016/04, § 4.4, p. 44-45 du PDF
        verification: >-
          Méthode ; les multiplicateurs publiés par le COR en 2026
          en viennent en partie (DG Trésor, Mésange).
        etat: a_trancher
        raison: >-
          C'est le même choix que pour le tableau 2.10 : le bouclage
          est déclaré hors du dépôt, et le propriétaire tranche.
      - quoi: >-
          Il projette au choix sous les projections de l'INSEE ou
          sous les scénarios démographiques de l'Ageing Working
          Group. Le dépôt n'a que le scénario central de l'INSEE
          (`limites.md:2815-2817`).
        preuve: doc. n° 6, p. 4 du PDF
        verification: >-
          Méthode ; variantes publiées par l'INSEE et la Commission
          européenne.
        etat: a_reprendre
        chantier: "138.7"
    bilan: >-
      Aphrodite fait mieux par ses fins de carrière et sa réversion
      complète (ex-conjoints, décès avant le départ), deux points déjà
      prévus par les étapes 3 et 4, et par son bouclage avec Mésange.
      Ses résultats chiffrés, de 2016, ne se confrontent plus ; son
      usage après 2020 n'est pas publié.
    lu_le: 2026-10-04
    lu_dans:
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%206_Aphrodite_DG-Tr%C3%A9sor.pdf
      - https://www.tresor.economie.gouv.fr/Articles/482ec69f-5251-4129-98b2-f4dfaccfb81e/files/5ad8638a-a272-4e14-8823-54a245de9606
    note: >-
      Il partage les biographies de Destinie, pas ses règles. Pour l'Ageing
      Report de 2024, la France a projeté avec Destinie, non avec lui.

  - id: saphir
    nom: Saphir
    auteur: Direction générale du Trésor
    nature: microsimulation_statique
    publication: ouvert
    code: https://github.com/DGTresor/Saphir
    licence: >-
      CeCILL 2.1 (code) ; Licence Ouverte 2.0 (paramètres des programmes
      6, 7a et 7b)
    usage: executer_a_part
    confronte: [scenario_1]
    couvre: >-
      Le droit socio-fiscal de 2017 sur l'ERFS : la CSG, la CRDS et la CASA
      des pensions, le minimum vieillesse ; les pensions y sont des
      entrées. En SAS.
    confrontation: >-
      Des paramètres de 2017 à comparer, pour le foyer et le net ; il ne vaut
      que pour cette année-là.
    ecarts:
      - constat: >-
          Il retranche une seule fois 0,9 SMIC mensuel (1,5 pour un
          couple) de revenus d'activité annuels, au lieu de quatre
          fois. Pour un couple, il l'applique aux revenus de chaque
          conjoint, et seulement si la personne de référence est
          éligible (12-Prestations_20ans.sas:577-585 ;
          7a-Legislation_sociale.sas:1510-1511).
        tranche: >-
          R. 815-29 fixe l'abattement par trimestre, sur les revenus
          professionnels du foyer pour un couple ; F16871 donne pour
          douze mois quatre fois le montant trimestriel. Ines
          multiplie par quatre (R/14_minima_pa.R:170-177, circulaire
          Cnav de 2015). Saphir a tort.
        preuve: >-
          LEGIARTI000029968931 ; service-public F16871 (2026 : 6
          562,91 € et 10 938,20 € sur douze mois)
    fait_mieux:
      - quoi: >-
          Il fixe le régime de CSG des pensions — exonération, taux
          réduit, taux plein — selon le revenu fiscal de référence
          et les parts, au barème de 2017 : 10 996 € plus 2 936 €
          par demi-part, 14 375 € plus 3 838 €. Trois cas seulement,
          le taux médian n'existant que depuis 2019, et la CASA au
          seul taux plein. Le dépôt retire 9,1 % à tous
          (`prelevements_remuneration.yaml:705`).
        preuve: >-
          `Programmes/9a-Calcul_CSG_CRDS_cotis_2017.sas:45-49`, sur
          les seuils de `7a-Legislation_sociale.sas:118-129`, au
          commit `7bc72c9` (le programme 6 n'y applique que les
          seuils de 2015, pour remonter au revenu brut)
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il sert l'ASPA de 2017 sous le plafond du couple et borne
          le membre seul éligible au montant d'une personne seule.
          Les ressources sont celles du foyer : revenus d'activité
          abattus, chômage, pensions, rentes, pensions alimentaires,
          revenus du patrimoine. L'ASPA reste hors des prélèvements.
          Le dépôt applique le barème d'une personne seule aux
          seules pensions (droit/foyer.py:125-128).
        preuve: >-
          Programmes/12-Prestations_20ans.sas:560-605 ;
          7a-Legislation_sociale.sas:1495-1511 ; commit 7bc72c9
        verification: >-
          D. 815-1, a et b (LEGIARTI000036760292) ; R. 815-22
          (LEGIARTI000047770487). Son abattement est faux (écart
          ci-dessous). Il ne vaut que pour 2017 et confirme Ines.
        etat: repris
        chantier: "138.2"
      - quoi: >-
          Il calcule l'impôt des pensions de 2016 et 2017 :
          abattement de 10 % (au moins 379 €, au plus 3 711 € pour
          l'impôt 2016, relevés pour 2017), abattement des personnes
          âgées ou invalides, fractions imposables des rentes à
          titre onéreux. Le dépôt n'en calcule aucun.
        preuve: >-
          Programmes/7b-Legislation_IR.sas:346-358, 396-399 ; commit
          7bc72c9
        verification: >-
          CGI art. 158, 5 a (plafond par foyer, plancher par
          pensionné). Juste pour 2016 et 2017 seulement.
        etat: a_reprendre
        chantier: "138.5"
    bilan: >-
      Saphir ne fait rien qu'Ines ne fasse à jour. Il confirme, pour
      2017 seulement, le régime de CSG à trois cas selon le RFR et les
      parts, l'ASPA du couple et l'impôt des pensions. Ses paramètres se
      recopient, mais ils sont figés en 2017, et son abattement de
      l'ASPA est faux.
    sas: [dgtresor_saphir]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/DGTresor/Saphir
    note: >-
      Un seul commit, le 5 septembre 2018 ; le README prévient qu'il n'engage
      pas « la position de l'administration ».
      Ce commit est `7bc72c9`.

