      valeurs de point, datés, lisibles par machine, à ceux que le dépôt lit
      au texte.
    ecarts:
      - constat: >-
          Le paquet porte encore les paramètres d'avant 2025 : 8,23 % et
          525 points pour la CNAVPL, 9 et 22 % pour la Cipav ; modele-ti, dans
          le même dépôt, compte 557 points.
