  - id: coefficienti_italie
    nom: Les coefficients de transformation italiens
    auteur: loi n° 335 de 1995, ministère du Travail et ministère de l'Économie
    pays: Italie
    nature: methode
    publication: documente
    documentation:
      - https://www.lavoro.gov.it/documenti-e-norme/normativa/decreto-direttoriale-20112024-coefficienti-trasformazione.pdf
      - https://www.rgs.mef.gov.it/_Documenti/VERSIONE-I/Attivit--i/Spesa-soci/Attivita_di_previsione_RGS/2026/Ltdmlpdspess-2026.pdf
    licence: textes officiels
    usage: copier
    confronte: [proposition]
    couvre: >-
      Le coefficient, inverse d'un diviseur qui moyenne les deux sexes et
      intègre la réversion, au taux d'actualisation de 1,5 %, révisé tous les
      deux ans sur la mortalité de l'Istat ; le décret du 20 novembre 2024
      donne 19,049 à 65 ans, soit 5,250 %.
    confrontation: >-
      Un calcul à refaire : la table de 2025-2026 au millième, puis une
      variante du diviseur du dépôt qui intègre la réversion.
    fait_mieux:
      - quoi: >-
          Son diviseur tarife la réversion : Δx = [Σs (a_x,s + A_x,s)]/2 − k,
          avec η = 0,6 et δ = 0,9 pour les hommes, 0,7 pour les femmes ; à 65
          ans, 17,590 pour l'assuré et 1,460 pour le survivant donnent 19,049,
          une réversion qui coûte 7,7 % de la pension directe (13,3 % pour un
          homme). Le diviseur du dépôt n'a pas de terme A_x
          (`moteur/conversion.py:228-234`), et la convention `"servie"` du
          coût (`cout.py:669-670`) ajoute la réversion actuelle sans la
          charger : elle la sert gratuitement.
        preuve: >-
          Nota tecnica du décret du 20 novembre 2024, tableau C.2 ; RGS,
          rapport n° 27, appendice 1, B.1
        etat: a_trancher
        raison: >-
          Tarifer la réversion dans le diviseur, par un terme A_x sous la
          convention `"servie"`, nourri de données de l'INSEE et de la DREES,
          est un choix du programme que le propriétaire tranche.
      - quoi: >-
          Le tableau C.2 de la Nota tecnica publie le diviseur à 65 ans,
          19,049, et ses deux termes, 17,590 et 1,460 : un exemple officiel,
          que la fiche du diviseur du dépôt n'a pas
          (`coefficient_de_conversion.yaml:48`).
        preuve: lavoro.gov.it, « nota-tecnica-decreto-ct-2025 », tableau C.2
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          La loi revalorise les comptes sur la moyenne du PIB nominal des cinq
          années qui précèdent, avec un plancher « salvo recupero ». Le
          `--lissage 5` du dépôt prend les années t−4 à t et omet le plancher
          (`moteur/indexation.py:102-111`, `config.py:31-35, 86-89`).
        preuve: >-
          L. 335/1995, art. 1, c. 6-11 ; ministère du Travail, 28 octobre
          2025 : « nei cinque anni precedenti il 2025 »
        etat: a_reprendre
        chantier: "138.11"
    sas: [italie_coefficienti_2024]
    lu_le: 2026-10-01
    lu_dans:
      - https://www.lavoro.gov.it/documenti-e-norme/normativa/decreto-direttoriale-20112024-coefficienti-trasformazione.pdf
    note: >-
      La comparaison du 1er octobre 2026 relève que son taux de 1,5 % se
      justifie hors récessions, « escludendo i bienni 2008-2009 e 2012-2013
      […] e il biennio 2020-2021 » (Nota tecnica, p. 2).

