          de récupération, d'annuité et de remplacement sur le cycle
          de vie, la durée de retraite rapportée à la carrière et le
          rendement interne (`cycle_de_vie.py`), sous ses conventions
          — un âge de décès par génération — ou sous la survie de
          génération du dépôt. Sa durée relative se retrouve
          exactement sur ses cas types du COR ; son taux d'annuité, à
          l'allure près ; son taux de cotisation, aux conventions près
          (taux moyens de l'Arrco, contributions d'équilibre). Ce
          qu'il calcule à plusieurs âges et en net est au point
          suivant.
        etat: repris
        chantier: "138.9"
