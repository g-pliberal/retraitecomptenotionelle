  # ---- La statistique publique : la DREES ---------------------------------
  # Une seule lignée : CALIPER (2013, en SAS) est devenu le module de calcul
  # de TRAJECTOiRE, publié en R sous le nom de calcul_pension, puis fondu
  # dans le paquet trajectoire ; legiretraite lui fournit ses âges. Elle calcule
  # les cas types du COR. Un accord entre eux ne compte qu'une fois.

  - id: trajectoire
    nom: TRAJECTOiRE
    auteur: DREES, bureau des retraites
    nature: microsimulation_dynamique
    publication: ouvert
    code: https://git.drees.fr/drees_code_public/modeles/trajectoire
    documentation:
      - https://drees_code_public.pages.drees.fr/modeles/trajectoire/
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%208_TRAJECTOIRE_DREES.pdf
    licence: EUPL-1.2
    usage: executer_a_part
    confronte: [scenario_1, cout]
    couvre: >-
      Tous les régimes, ramenés à huit grands — fonction publique de l'État,
      territoriale et hospitalière, salariés agricoles, régime général,
      régimes spéciaux « modélisés comme la SNCF », indépendants, libéraux
      « modélisés comme la médecine », exploitants —, avec l'Agirc-Arrco,
      l'Ircantec, le RAFP et les complémentaires des indépendants et de la
      MSA. Droits directs seulement, ni réversion ni ASPA ; générations 1942
      et suivantes ; la réforme de 2023, sans la loi du 30 décembre 2025.
    depend_de: [baremes_ipp, calcul_pension, caliper]
    confrontation: >-
      Un calcul rejoué, à part, sans les données du CASD : le mode cas types
      s'en passe, et `lancerCasTypesCor()` refait les treize cas types du COR,
      dont le dépôt lit déjà des résultats.
    manifeste: [cor_pouvoir_achat_retraite]
    sas: [drees_trajectoire]
    lu_le: 2026-10-01
    lu_dans:
      - https://git.drees.fr/drees_code_public/modeles/trajectoire
      - https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def.pdf
    note: >-
      Version 1.1.2 du 4 avril 2025, ouverte en 2024. Le rapport du COR de
      juin 2026 calcule ses cas types « à l'aide d'un module du modèle
      Trajectoire de la Drees, disponible en open source » ; il chiffre aussi
      la suspension de 2025, que la version publique ne contient pas : la
      version interne est en avance. Une copie personnelle est sur GitHub
      (`awarnery/trajectoire`).

  - id: calcul_pension
    nom: calcul_pension (paquet R calculPension)
    auteur: DREES
    nature: cas_types
    publication: ouvert
    code: https://gitlab.com/DREES_code/public/outils/calcul_pension
    licence: EUPL-1.2
    usage: executer_a_part
    confronte: [scenario_1]
    couvre: >-
      Les droits directs de cas types, sur plusieurs régimes obligatoires
      mais pas tous, avec des simplifications que son README assume ; pas
      annuel pour la carrière, mensuel pour les dates. Un dossier refait les
      cas types du COR.
    depend_de: [baremes_ipp]
    confrontation: >-
      Une version figée et légère du moteur de TRAJECTOiRE : ses cas types du
      COR, et des carrières simples décrites des deux côtés.
    sas: [drees_calcul_pension]
    lu_le: 2026-10-01
    lu_dans:
      - https://gitlab.com/DREES_code/public/outils/calcul_pension
      - https://git.drees.fr/drees_code_public/outils/calcul_pension
    note: >-
      Cloné le 1er octobre 2026 : version 0.1, dernier commit de sa branche
      principale du 20 janvier 2023, licence EUPL 1.2 dans `LICENSE`,
      paramètres téléchargés des barèmes de l'IPP. Son README : « Les
      fonctions du paquet sont utilisées telles quelles dans le modèle de
      microsimulation Trajectoire », et le groupe de gitlab.com ajoute que le
