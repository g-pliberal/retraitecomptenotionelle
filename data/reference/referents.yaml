  - id: catala
    nom: Catala (catala-examples)
    auteur: équipe Catala (Inria)
    nature: calculateur
    publication: ouvert
    code: https://github.com/CatalaLang/catala-examples
    licence: Apache-2.0
    usage: copier
    confronte: [scenario_1]
    couvre: >-
      La transcription littérale des articles, pour les aides au logement :
      l'âge d'ouverture (L. 161-17-2, D. 161-2-1-9), l'âge du taux plein
      (L. 351-8), l'inaptitude (L. 351-1-5, D. 351-1-14), l'ASPA (L. 815-9,
      D. 815-1 et D. 815-2, montants jusqu'au 1er janvier 2020).
    confrontation: >-
      Des règles à comparer, article par article, avec leur texte recopié à
      côté.
    ecarts:
      - constat: >-
          Pour la génération 1967, le code dit 62 ans et 9 mois, quand le
          texte qu'il recopie juste au-dessus dit 63 ans et 9 mois ; et ce
          texte n'est plus le droit, sans la loi du 30 décembre 2025.
        tranche: >-
          L. 161-17-2 dans sa rédaction de 2025 : 63 ans et 6 mois, que le
          modèle applique ; l'écart est le sien, toujours présent le
          1er octobre 2026
        preuve: docs/architecture.md (§ 3.4)
      - constat: >-
          Son calendrier d'âges précède la LFSS pour 2026 : L.
          161-17-2 recopié en version LEGIARTI000051289659 (64 ans
          dès 1968), D. 161-2-1-9 de 2023 : 63 ans pour 1964, 63 ans
          et 3 mois pour 1965, 64 ans pour 1968
          (code_sécurité_sociale.catala_fr:108-125, 313-474).
        tranche: >-
          L. 161-17-2 en vigueur (pensions dès le 1er septembre
          2026) : 62 ans 9 mois du 1er janvier 1963 au 31 mars 1965,
          63 ans d'avril à décembre 1965, 63 ans 3 mois en 1966, 63
          ans 6 mois en 1967, 63 ans 9 mois en 1968, 64 ans dès 1969
        preuve: LEGIARTI000053280889
      - constat: >-
          Son SMIC s'arrête au 1er novembre 2024, et 8,98 € à
          Mayotte vaut dès « |2024-01-01| », en conflit avec 8,80 €
          de janvier à octobre 2024 (smic/Smic.catala_fr:431-490).
        tranche: >-
          décret n° 2024-951 : 8,98 € « A compter du 1er novembre
          2024 » ; puis 12,02 € et 9,33 € (décret n° 2025-1228),
          12,31 € et 9,56 € (arrêté du 22 mai 2026)
        preuve: >-
          JORFARTI000050392696 ; JORFARTI000053042543 ;
          JORFARTI000054126607
    fait_mieux:
      - quoi: >-
          Chaque règle y est écrite sous l'alinéa qu'elle transcrit, recopié à
          côté : le code se relit contre son texte. Le site du dépôt ne cite
          ni fiche ni article sous « Le détail du calcul » (`pages.js:6155`),
          et 3 % des lignes du relevé citent leur fiche.
        preuve: >-
          `aides_logement/code_sécurité_sociale.catala_fr:460-468`, au commit
          `2694b17` : l'alinéa, puis sa transcription
        etat: a_reprendre
        chantier: "136.4"
      - quoi: >-
          Il recopie, décret par décret, le SMIC de Mayotte de 2019
          à novembre 2024 (7,57 € à 8,98 €) ; modele-social le
          prolonge à juin 2026. Le dépôt n'en a aucun et valide les
          trimestres de la caisse de Mayotte au SMIC national
          (cssm_mayotte.yaml:39-42).
        preuve: smic/Smic.catala_fr:53-65 à 478-490, au commit 2694b17
        verification: >-
          décret n° 2024-951, art. 1 (JORFARTI000050392696) : « A
          Mayotte, son montant est fixé à 8,98 euros » ; le SMIG
          mahorais valide les trimestres (décrets n° 87-175 art. 3
          et n° 2003-589 art. 8, cités par cssm_mayotte.yaml)
        etat: a_reprendre
        chantier: "138.18"
      - quoi: >-
          Il calcule les aides au logement de tout ménage, retraité
          compris, avec ses tests.
        preuve: aides_logement/ et aides_logement/tests/, au commit 2694b17
        verification: hors retraite
        etat: ecarte
        raison: >-
          loyer, zone et foyer, que le simulateur ne demande pas ;
          l'effet retour (138.5) se borne à l'ASPA, la CSG et
          l'impôt
    bilan: >-
      Sa seule avance reste la traçabilité, chaque règle sous l'alinéa
      qu'elle transcrit. Ses règles de retraite, d'avant la LFSS pour
      2026 et fautives pour 1967, ne valent rien comme référence ; seul
      son SMIC de Mayotte sert au dépôt.
    sas: [catala_examples]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/CatalaLang/catala-examples
    note: >-
      Dernier commit le 18 septembre 2026. `CatalaLang/french-law` (Apache
      2.0) en tire des bibliothèques. Le répertoire `impot_revenu` du même
      dépôt est sous une autre licence : voir ir_catala.
      Comparé au dépôt le 1er octobre 2026 au commit `2694b17`.

  - id: ir_catala
    nom: ir-catala
    auteur: DGFiP
    nature: calculateur
    publication: ouvert
    code: https://gitlab.adullact.net/dgfip/impots-nationaux-revenu-patrimoine-particuliers/ir-catala
    licence: CeCILL 2.1
    usage: executer_a_part
    confronte: [scenario_1]
    couvre: >-
      L'impôt sur le revenu en Catala, dont l'abattement des pensions
      (article 158, 5 a, du code général des impôts) ; une « preuve de
      concept ».
    confrontation: >-
      Une règle à comparer, le jour où le dépôt calculera l'impôt du
      retraité.
    ecarts:
      - constat: >-
          Abattement des pensions à 4 123 € et 422 €
          (archives_cgi.catala_fr:341-370).
        tranche: >-
          CGI 158, 5 a, en vigueur : 4 439 € et 454 €
        preuve: LEGIARTI000054373673
    fait_mieux:
      - quoi: >-
          Il calcule l'abattement de 10 % des pensions (CGI, art.
          158, 5 a), une brique du revenu fiscal de référence qui
          fixe le taux de CSG : plancher par pensionné, plafond par
          foyer. Le dépôt en a le barème
          (`prelevements_remuneration.yaml:755-759`), pas le revenu
          fiscal, et retire 9,1 % à tous (`docs/limites.md`, § 5
          ante ter). Ses montants sont de 2022 (4 123 € et 422 €) ;
          le CGI en vigueur dit 4 439 € et 454 €
          (LEGIARTI000054373673).
        preuve: >-
          `sources/archives_cgi.catala_fr:341-370`, au commit
          `7f5fe83`
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il calcule le quotient familial avec les demi-parts des
          retraités : plus de 74 ans titulaires de la carte du
          combattant, veuves de guerre, invalides. Le dépôt ne
          calcule pas l'impôt
          (prelevements_remuneration.yaml:150-151).
        preuve: sources/cgi_revenus.catala_fr:5119-5240, au commit 7f5fe83
        verification: >-
          CGI 195, version LEGIARTI000046860994, en vigueur dans
          l'index du 27 septembre 2026 : « f. Sont âgés de plus de
          74 ans et titulaires de la carte du combattant »
        etat: a_reprendre
        chantier: "138.5"
    bilan: >-
      Une brique pour 138.2 et 138.5 : l'abattement des pensions et le
      quotient familial des retraités, transcrits du CGI. Montants de
      2022, preuve de concept arrêtée depuis octobre 2024.
    sas: [dgfip_ir_catala]
    lu_le: 2026-10-04
    lu_dans:
      - https://gitlab.adullact.net/dgfip/impots-nationaux-revenu-patrimoine-particuliers/ir-catala
    note: >-
      Dernier commit le 2 octobre 2024 ; le même contenu est dans
      `catala-examples/impot_revenu`, sous CeCILL 2.1 aussi : une seule
      source pour les deux.
      Le projet a déménagé sous
      `dgfip/impots-nationaux-revenu-patrimoine-particuliers/ir-catala` :
      l'ancienne adresse y renvoie (HTTP 301), et `git ls-remote` y lit, le
      1er octobre 2026, le commit `7f5fe83`.

  # ---- La recherche ------------------------------------------------------------

  - id: euromod
    nom: EUROMOD (France)
    auteur: Centre commun de recherche de la Commission européenne
    nature: microsimulation_statique
    publication: ouvert
    code: https://github.com/ec-jrc/JRC-EUROMOD-software-source-code
    documentation:
      - https://euromod-web.jrc.ec.europa.eu/download-euromod
      - https://euromod-web.jrc.ec.europa.eu/sites/default/files/2026-02/Y16_CR_FR.pdf
      - https://euromod-web.jrc.ec.europa.eu/sites/default/files/2026-09/EUROMOD_RELEASES_J2.54%2B.zip
    licence: EUPL-1.2 (logiciel) ; CC BY 4.0 (règles)
    usage: executer_a_part
    confronte: [scenario_1]
    couvre: >-
      Pour la France, la CSG, la CRDS et la CASA des pensions, l'ASPA en
      partie ; les pensions contributives ne sont pas simulées, faute
      d'historique de carrière.
    confrontation: >-
      Des règles du foyer et du net à comparer ; ses règles, sous CC BY 4.0,
      se recopient en citant.
    ecarts:
      - constat: >-
          Son rapport pays décrit pour 2022 à 2025 le critère d'un «
          impôt inférieur à 61 € », abrogé en 2015, et se dément
          deux paragraphes plus bas ; ses règles appliquent le
          revenu fiscal de référence depuis FR_2015.
        tranche: >-
          L. 136-8, dont le taux ne dépend plus que du revenu fiscal
          de référence et des parts ; l'écart est celui du rapport,
          non de ses règles
        preuve: rapport pays Y16_CR_FR, p. 94
      - constat: >-
          Il prend les ressources de l'ASPA nettes imposables.
        tranche: >-
          R. 815-22 du code de la sécurité sociale ; l'écart est le sien
        preuve: rapport pays Y16_CR_FR
      - constat: >-
          Il sert le plafond du couple, 1 620,18 € par mois, quand
          un seul membre a 65 ans (FR.xml:1518454-1518469 ; rapport,
          tableau 2.35, note 1).
        tranche: >-
          D. 815-1, a : quand « seul un des conjoints » en
          bénéficie, le montant maximum est celui d'une personne
          seule ; F16871 2026 : 1 043,59 € pour un couple à un seul
          bénéficiaire. EUROMOD a tort, Ines a raison
          (R/14_minima_pa.R:262-263).
        preuve: LEGIARTI000036760292 ; service-public F16871
      - constat: >-
          Il refuse l'ASPA à qui a un revenu d'activité
          (ils_earns#1=0, FR.xml:1518417 et 1518456) ; le rapport la
          dit réservée aux retraités « not working » (§ 2.5.11.1).
        tranche: >-
          L. 815-1 ne pose aucune condition de cessation d'activité.
          R. 815-29 compte les revenus professionnels après
          abattement. EUROMOD a tort.
        preuve: LEGIARTI000054477905 ; LEGIARTI000029968931
      - constat: >-
          Il prélève la CRDS sur toutes les pensions, même exonérées
          de CSG (tscdf_fr, « Base fully taxed »,
          FR.xml:1522462-1522487). Il n'exonère pas non plus la
          pension des allocataires de l'ASPA. Son rapport dit
          pourtant les petites pensions exonérées « from CSG and
          CRDS » (p. 94).
        tranche: >-
          Ordonnance n° 96-50, art. 14, I : la CRDS suit les
          conditions des articles L. 136-1-1 à L. 136-4, donc les
          exclusions de L. 136-1-2, II 1°. F2971 : « Si vous ne
          payez pas de CSG (taux zéro), vous êtes exonéré de CRDS et
          de Casa ». EUROMOD a tort.
        preuve: >-
          LEGIARTI000038834962 ; LEGIARTI000051289679 ;
          service-public F2971
      - constat: >-
          Il plafonne l'abattement de 10 % des pensions par personne
          (TAX_UNIT tu_individual_fr, FR.xml:1497573 et 1497599).
        tranche: >-
          CGI art. 158, 5 a : « Ce plafond s'applique au montant
          total des pensions et retraites perçues par l'ensemble des
          membres du foyer fiscal ». Ines plafonne au foyer
          (R/07_impot_revenus.R:271-275).
        preuve: LEGIARTI000054373673
      - constat: >-
          Le rapport (février 2026, tableau 1.1, p. 8) donne 63 ans
          à la génération 1964 et 63 ans et 3 mois à 1965, d'après
          la réforme de 2023 seule. Son code n'en dépend pas
          (RetAge_min = 62,75 en 2026).
        tranche: >-
          La LFSS pour 2026 suspend la réforme : 62 ans et 9 mois
          pour 1964 et pour les nés de janvier à mars 1965, 63 ans
          ensuite (age_ouverture_requis.csv:138-141, certifiée). Le
          rapport est périmé.
        preuve: data/reference/legislation/age_ouverture_requis.csv:138-141
    fait_mieux:
      - quoi: >-
          Il fixe le taux de CSG des pensions (0, 3,8, 6,6 ou 8,3 %)
          et la CASA, due aux deux derniers taux, selon le revenu
          fiscal et les parts. Il prend les seuils de 2026 et leurs
          majorations par demi-part : 13 048 € plus 3 484 €, 17 057
          € plus 4 555 €, 26 472 € plus 7 066 €. Ses règles, sous CC
          BY 4.0, se recopient en citant. Le dépôt retire 9,1 % à
          tous (prelevements_remuneration.yaml:705) ; son barème n'a
          que les seuils d'une part
          (prelevements_remuneration.yaml:755-759).
        preuve: >-
          FR.xml (J2.54+), FR_2026 : seuils l. 1498890-1498955
          (tinty_fr, $tscxc_thres1 à 6) ; taux et CASA vers l.
          1500847 (tscxc_fr, « Amount of CSG - pensions ») ;
          rapport, p. 94-95, tableaux 2.66 à 2.68 pour 2022-2025
        verification: >-
          service-public F2971, vérifiée le 1er juin 2026 : mêmes
          seuils pour une part et par demi-part. L. 136-8, III à III
          ter (LEGIARTI000054336623) ; L. 137-41, II 1° pour la
          CASA. Il prend le revenu imposable de l'année au lieu du
          RFR de N-2, sans le lissage par N-3 (rapport, § 2.6.4.1),
          et sa CRDS n'est pas graduée (écart ci-dessous) : recopier
          les seuils, pas l'assiette.
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          L'ASPA reste hors de l'assiette de la CSG, de la CRDS et
          de la CASA. En mode net, le site lui retire 9,1 %
          (contexte.py:668-670 ; pages.js:3678-3687).
        preuve: >-
          FR.xml (J2.54+), FR_2026 : il_tscxc_pen = poa00, pdi00,
          psu, ypp (IlDef_fr) et il_crds_base_full (l.
          1522462-1522500), sans bsaoa_s ; rapport, § 2.5.11.4 : «
          Not taxable […] and not subjected to CRDS »
        verification: >-
          L. 136-1-2, I et II 1° (LEGIARTI000051289679) ;
          retraitesdeletat.gouv.fr, « Les prélèvements sociaux et
          les exonérations » : ASPA et ASI exonérées.
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il calcule l'impôt des pensions de 2026 : abattement de 10
          % (au moins 454 €, au plus 4 439 €), abattement des 65 ans
          et plus ou invalides (2 822 € sous 17 670 € de revenu, 1
          411 € jusqu'à 28 430 €), CSG déductible de 3,8, 4,2 ou 5,9
          %, quotient familial. Le dépôt n'en calcule aucun
          (pages.js:2094-2096).
        preuve: >-
          FR.xml (J2.54+), FR_2026, tinty_fr : l. 1497532-1497599
          (abattement des pensions), l. 1498656-1498669 (454 € et 4
          439 €), abattement spécial et CSG déductible dans la même
          politique
        verification: >-
          CGI art. 158, 5 a (LEGIARTI000054373673, depuis le 1er
          juillet 2026) : 10 %, 4 439 € par foyer, au moins 454 €.
          Mais il applique le plafond par personne (écart
          ci-dessous).
        etat: a_reprendre
        chantier: "138.5"
    bilan: >-
      EUROMOD fait mieux que le dépôt sur le net des pensions : CSG et
      CASA graduées par RFR et parts au barème exact de 2026, recopiable
      sous CC BY 4.0, et l'ASPA hors des prélèvements. Il fait mieux
      aussi sur l'impôt des pensions. Il ne simule aucune pension, faute
      d'historique de carrière ; il sert l'ASPA plus mal que la loi et
      prélève la CRDS sur toutes les pensions : on lui reprend ses
      seuils, pas ses assiettes. Son outil de ménages types (HHoT) peut
      confronter à part le net d'un couple de retraités une fois 138.2
      fait.
    sas: [jrc_euromod]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/ec-jrc/JRC-EUROMOD-software-source-code
      - https://euromod-web.jrc.ec.europa.eu/sites/default/files/2026-02/Y16_CR_FR.pdf
      - https://euromod-web.jrc.ec.europa.eu/sites/default/files/2026-09/EUROMOD_RELEASES_J2.54%2B.zip
    note: >-
      Logiciel 3.8.9 ; les données EU-SILC demandent un projet approuvé
      par Eurostat. Les règles pays ne sont pas dans le dépôt du
      logiciel : elles sont dans le paquet du modèle (J2.54+,
      téléchargeable sans inscription, CC BY 4.0),
      `XMLParam/Countries/FR/FR.xml`, systèmes FR_2006 à FR_2026, avec
      l'impôt des pensions ; l'ASPA n'y est servie qu'aux allocataires
      observés dans EU-SILC.

  - id: retraites_scherrer
    nom: retraites (simulateur du COR réécrit)
    auteur: B. Scherrer et M. Baudin
    nature: projection
    publication: ouvert
    code: https://github.com/brunoscherrer/retraites
    licence: GPL-3.0
    usage: executer_a_part
    confronte: [cout]
    couvre: >-
      Le simulateur du COR reproduit en Python, avec un solveur des leviers
      qui ramènent l'équilibre ; projections du COR de 2019.
    depend_de: [simulateur_cor]
    confrontation: >-
      Des projections à comparer, à hypothèses du COR égales ; elles datent
      de 2019.
    fait_mieux:
      - quoi: >-
          Il pilote le système par n'importe quel levier, l'âge compris, avec
          le niveau de vie relatif des retraités et la part de la vie passée
          en retraite. La page Coût chiffre le coefficient, les points
          d'assiette et la dette à l'année du départ (`cout.py:1329-1469`),
          pas l'âge (`cout.py:1357`) ; ses projections étant celles de 2019,
          c'est à la figure 2.24 du rapport du COR de 2026 qu'il faudrait
          confronter ces leviers (67,6 ans, −7,4 points de pension relative,
          +5,6 points de prélèvement en 2070).
        preuve: >-
          `SimulateurRetraites.py:290-900, 1309`, au commit `f3c2d92`
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il propage par Monte-Carlo l'incertitude de trois entrées
          (âge de départ, élasticité du report, chômage). Il en
          ordonne le poids, année par année, par les indices de
          Sobol : l'élasticité ne pèse rien, l'âge et le chômage
          pèsent autant. La page Coût du dépôt ne montre que des
          variantes prises une à une
          (`comptes_retraite_variantes.csv`), et pas l'incertitude
          démographique (`docs/limites.md:2812-2818`).
        preuve: >-
          `retraites/ModelePensionProbabiliste.py:4-120` (OpenTURNS)
          et `doc/Incertitudes/modele-pension-sensibilite.ipynb` («
          Indices de Sobol' en fonction de l'année »), au commit
          `f3c2d92`
        verification: >-
          Méthode. Le chiffre central n'en devient pas plus juste.
          La page dirait en revanche quels paramètres font l'écart
          (part des reportés en emploi, mortalité, productivité), au
          lieu d'une variante à la fois. Sans OpenTURNS, puisque le
          dépôt n'admet que PyYAML, un tirage en Python pur suffit.
        etat: a_reprendre
        chantier: "138.19"
      - quoi: >-
          Il calcule la part de la vie passée en retraite, (60 + e60
          − âge)/(60 + e60), et l'âge qui la tient constante : 29,05
          % en 2020 et 32,25 % en 2070 au COR de 2019. Le dépôt n'a
          ni durée de retraite ni part de vie en retraite (cherchées
          en vain dans `pages.js` et dans `src/`).
        preuve: >-
          `doc/pilotage-vie-en-retraite.ipynb` et
          `SimulateurRetraites.py:1837`, au commit `f3c2d92`
        verification: >-
          Méthode : c'est l'indicateur de durée de retraite du COR.
          Le point rejoint celui de trajectoire au 138.9. Ses
          espérances de vie datent de 2019 : il faudrait prendre les
          tables du dépôt. La part de la vie en retraite est reprise
          le 7 octobre 2026 (action 138, étape 9), sur ces tables ;
          reste l'âge qui la tient constante.
        etat: a_reprendre
        chantier: "138.9"
    bilan: >-
      Il reste le seul à piloter le système par l'âge et par la part de
      vie en retraite, et il ajoute une analyse de sensibilité (Sobol)
      que la page Coût n'a pas. Tout le reste date du COR de 2019.
    sas: [scherrer_retraites]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/brunoscherrer/retraites
    note: >-
      Paquet PyPI `retraites` 0.1.1 ; dernier commit le 30 septembre 2020.
      Ce dernier commit est `f3c2d92`.

  - id: retraites_cor2026
    nom: retraites-cor2026
    auteur: A. Corral (mémoire)
    nature: projection
    publication: ouvert
    code: https://github.com/AxelCorral/retraites-cor2026
    licence: MIT
    usage: copier
    confronte: [cout]
    couvre: >-
      Un modèle comptable agrégé sur les séries du COR de 2026.
    depend_de: [maquette_globale_cor]
    confrontation: >-
      Des projections à comparer, à séries du COR égales.
    ecarts:
      - constat: >-
          Sa pension relative ignore l'effet de noria
          (`maquette.py:146-149`) : 40,4 % en 2070, contre 45,3 % au COR, un
          écart qu'il attribue à tort à l'Agirc-Arrco
          (`config/hypotheses.yaml:53-55`) ; et son « Tableau 2.10 » est la
          figure 2.24 du rapport.
        tranche: >-
          le rapport du COR de juin 2026, 45,3 % en 2070 ; l'écart est le sien
        preuve: >-
          `maquette.py:146-149`, au commit `b75b211`
      - constat: >-
          Ses hypothèses économiques, dites du COR de 2025, portent
          une productivité haute de 1,6 % et un chômage de 4,5 %
          (`config/hypotheses.yaml:41, 59-63`). Le code ne les lit
          pas : `src/maquette.py:187` et `src/figures.py:158, 471`
          ne lisent que la référence.
        tranche: >-
          Depuis juin 2025, et encore en juin 2026, le COR retient
          une productivité de 0,4, 0,7 et 1,0 % et un chômage de 7 %
          en 2040 (variantes à 5 et 10 %). L'écart est le sien ; ces
          valeurs ne sont pas à copier.
        preuve: >-
          Citations du COR dans
          `data/reference/macro/hypotheses_projection.yaml:12-19,
          136-159`
    fait_mieux:
      - quoi: >-
          Il porte les variantes démographiques de l'INSEE de 2026 : fécondité
          de 1,20 ou 1,70, solde migratoire de +70 000 ou +230 000. Le dépôt
          n'a que le scénario central (`population_par_age.csv`) ; le COR
          chiffre la fécondité et l'espérance de vie à ±1 point de PIB de
          dépenses en 2070, et c'est l'épreuve d'un diviseur indexé sur la
          longévité.
        preuve: >-
          `config/hypotheses.yaml:26-31, 86-95`, au commit `b75b211`
        etat: a_reprendre
        chantier: "138.7"
    bilan: >-
      Les variantes démographiques restent son seul apport. Le reste est
      une maquette moins fine que la page Coût, avec deux paramètres
      faux, inutilisés, et l'erreur de noria déjà au registre.
    sas: [corral_retraites_cor2026]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/AxelCorral/retraites-cor2026
    note: >-
      Comparé au dépôt le 1er octobre 2026 au commit `b75b211`, du 16 juin
      2026.

  # ---- La société civile et la presse --------------------------------------
  # Des lectures du droit faites par d'autres, chacune indépendante : elles
  # confirment ou contredisent un paramètre, jamais plus qu'elles ne couvrent.

  - id: retraites_2027
    nom: Retraites 2027
    auteur: A. Tilloy
    nature: cas_types
    publication: ouvert
    code: https://github.com/AntoineTilloy/retraites-2027
    documentation:
      - https://antoinetilloy.github.io/retraites-2027/
    licence: MIT
    usage: copier
    confronte: [scenario_1, cout]
    couvre: >-
      La pension nette de la CSG, de la CRDS, de la CASA, de la cotisation
      maladie et de l'impôt, sur trois cas types, et le chiffrage de trois
      leviers budgétaires.
    confrontation: >-
      Des prélèvements à comparer : ses seuils de CSG citent l'instruction de
      la DSS du 11 décembre 2025, et rejoignent ceux d'OpenFisca-France.
    ecarts:
      - constat: >-
          Il dit 29 % des retraités au taux plein de CSG, d'après la CFDT
          (`app.js:200`).
        tranche: >-
          la DREES : 42,9 % au taux plein fin 2023, tous régimes, et 22,1 %
          d'exonérés (EACR, table A-Prelev_sociaux) ; l'écart est le sien
        preuve: >-
          la table de l'EACR que legiretraite embarque
          (`inst/extdata/drees/eacr/a-prelevements-sociaux.parquet`)
      - constat: >-
          Son barème 2027, « barème revenus 2025 (LF 2026) indexé de
          2 % » (`params.js:58`), porte une deuxième borne de 30 091
          € (`params.js:62`, `outils/simulation-plafond.py:20`). Sa
          référence 2026, obtenue en divisant par 1,02
          (`app.js:19-20`), tombe à 29 501 €.
        tranche: >-
          CGI art. 197 (LEGIARTI000053542636, en vigueur depuis le
          21 février 2026) : 29 579 €, soit 30 171 € une fois indexé
          de 2 %. C'est une erreur de calcul, la sienne, et elle
          tranche la note du registre.
        preuve: CGI art. 197, LEGIARTI000053542636 (index LEGI)
    fait_mieux:
      - quoi: >-
          Il calcule la pension nette par foyer : la CSG selon le revenu
          fiscal de référence, les exonérations de CRDS et de CASA, le 1 %
          maladie de la complémentaire, l'impôt avec ses abattements ; ses
          seuils de CSG sont ceux du dépôt, son abattement des plus de 65 ans
          conforme au BOFiP. Le dépôt retire 9,1 % à tous
          (`prelevements_remuneration.yaml:705`) ; c'est un second code, sous
          MIT, à confronter au net par foyer, non une action de plus.
        preuve: >-
          `app.js:21-77`, au commit `431dd9f`
        etat: a_reprendre
        chantier: "138.2"
    bilan: >-
      Son seul avantage reste le net par foyer (138.2), qui est déjà au
      registre. Rien d'autre ne fait mieux que le dépôt, et sa borne
      d'impôt contient une erreur de calcul.
    sas: [tilloy_retraites_2027]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/AntoineTilloy/retraites-2027
    note: >-
      Dernier commit le 20 septembre 2026, en JavaScript.
      Comparé au dépôt le 1er octobre 2026 à ce commit, `431dd9f`. Son
      deuxième seuil d'impôt, 30 091 € (`params.js:62`), s'écarte des 30 171 €
      que donnent 29 579 € revalorisés de 2 % : un calcul, qu'aucun texte lu
      ne tranche encore.

  - id: simulateur_aurain
    nom: Simulateur de dépense publique, volet retraites
    auteur: S. Aurain
    nature: calculateur
    publication: ouvert
    code: https://github.com/ManZanau/retraites-simulateur
    licence: MIT
    usage: copier
    confronte: [scenario_1, cout]
    couvre: >-
      L'âge d'ouverture et la durée requise par génération sous trois états
      du droit — 2023, la suspension de 2025, après 2028 — ; la CSG, l'impôt
      et l'ASPA ; les distributions de l'EIR et de l'EACR.
    confrontation: >-
      Des paramètres à comparer : il dit avoir vérifié ses durées « contre le
      texte consolidé sur Legifrance » le 9 septembre 2026, et elles
      rejoignent celles du dépôt (170, puis 171 à partir d'avril 1965, 172).
    ecarts:
      - constat: >-
          Il écrit que la loi pour 2026 « fixe le terme de la
          suspension au 2028-01-01 sans préciser les modalités de
          sortie ». Il exige donc tout chiffrage d'après 2028 en
          fourchette de trois modes : retour progressif, rattrapage,
          gel (`parametres/baselines_retraites.yaml:140, 243-252`,
          `docs/hypotheses.md:80-86`).
        tranche: >-
          L. 161-17-2 (LEGIARTI000053280889) et L. 161-17-3
          (LEGIARTI000053280903), en vigueur depuis le 31 décembre
          2025, fixent sans terme l'âge et la durée de chaque
          génération, jusqu'à 64 ans (1969) et 172 trimestres
          (1966). L'article 105 (JORFARTI000053227007) ne cite 2028
          que pour une durée particulière, au 2° du C qu'il modifie.
          Son « retour progressif » est donc le droit, et les deux
          autres modes sont des lois à venir. Le dépôt applique le
          texte.
        preuve: >-
          Index LEGI et JORF : L. 161-17-2 sans occurrence de 2028 ;
          art. 105 de la loi n° 2025-1403
    fait_mieux:
      - quoi: >-
          Il source la part des reportés restés en emploi : « 62 à 75 % […]
          Défaut retenu : 65 % ». Le dépôt la met à 1,0, un plafond, en
          écrivant qu'« une valeur retenue devra y avoir été lue »
          (`config.py:833-852`) ; l'INSEE (Analyses n° 30, 2017) donne 0,63
          chez les hommes et 0,73 chez les femmes.
        preuve: >-
          `docs/hypotheses.md:191-212`, au commit `59b7985`
        verification: >-
          Les 0,63 et 0,73 de l'INSEE se vérifient (Insee Analyses
          n° 30, figure 3 : 17 points d'emploi pour 27 de retraite
          chez les hommes, 16 pour 22 chez les femmes), sur un champ
          qui écarte les invalides, les allocataires de l'AAH et qui
          a fini ses études avant 18 ans. Sur l'EIC, l'IPP trouve la
          moitié (rapport n° 61, 2025, § 5.2.1) ; sur les données de
          la Cnav, Rabaté et Rochut 37 % (COR, 19 octobre 2016,
          document n° 11). Reprise le 7 octobre 2026 à 0,5.
        etat: repris
        chantier: "138.3"
      - quoi: >-
          Il chiffre l'effet retour d'une baisse des pensions : moins de CSG
          et d'impôt, plus d'ASPA. Le coût des scénarios 2 à 5 ignore l'ASPA
          que déclencheraient leurs petites pensions (`cout.py:603`), et les
          impôts affectés y restent fixes (`cout.py:97`) ; l'IPP (Perspectives
          budgétaires 2027, juin 2026) confirme l'ordre de grandeur, un gain
          public « inférieur d'environ 20 % à 25 % » à l'économie des régimes,
          mais son calage de l'ASPA est grossier.
        preuve: >-
          `modeles/fiscal.py:357-391`, au commit `59b7985`
        etat: a_reprendre
        chantier: "138.5"
      - quoi: >-
          Son interface résout un problème budgétaire à l'envers,
          par dichotomie, compare deux jeux d'hypothèses (A/B) et
          imprime un rapport avec ses repères budgétaires. Le site
          du dépôt a un solveur individuel — dans la saisie par la
          pension, le revenu « c'est lui que la page cherche »
          (`pages.js:1583-1592`) — et une feuille d'impression
          (`style.css:1940-1946`), mais ni solveur budgétaire, ni
          comparaison A/B, ni rapport.
        preuve: >-
          `app/retraites.html:784-789, 1523-1548, 1939-1943,
          2025-2028`, au commit `59b7985`
        etat: a_reprendre
        chantier: "138.10"
      - quoi: >-
          Il compare, au trimestre de naissance, la loi de 2023 sans
          suspension (B0) au droit en vigueur (B1), et donne le gain
          de la suspension génération par génération. C'est le point
          d'outil_quand_partir, à la maille exacte du texte. Le
          dépôt n'a aucun univers contrefactuel.
        preuve: >-
          `modeles/baseline.py:183-221`,
          `parametres/baselines_retraites.yaml:90-235`, au commit
          `59b7985`
        verification: >-
          Ses bornes B1 sont celles de L. 161-17-2
          (LEGIARTI000053280889) et de L. 161-17-3
          (LEGIARTI000053280903), et celles du dépôt
          (`age_ouverture_requis.csv:139-145`,
          `duree_assurance_requise.csv`). Ses bornes B0 (63 ans et
          171 trimestres à 1964) sont celles des versions du 1er
          septembre 2023.
        etat: a_reprendre
        chantier: "138.10"
      - quoi: >-
          Il porte les seuils de CSG à 1, 2, 2,5 et 3 parts, avec le
          supplément par demi-part (3 484, 4 555 et 7 066 €), et la
          règle de lissage sur deux ans. Il calcule l'impôt du foyer
          retraité : décote, plafond du quotient, abattement de 10 %
          par foyer (4 439 €, minimum 454 €), seuil de 61 €. Le
          dépôt n'a les seuils que pour une part et ne calcule pas
          l'impôt (`prelevements_remuneration.yaml:688-697,
          754-758`).
        preuve: >-
          `parametres/parametres_fiscaux_2026.yaml:44-216`,
          `docs/hypotheses.md:49-78`, `modeles/fiscal.py:197-312`,
          au commit `59b7985`
        verification: >-
          L. 136-8 (LEGIARTI000054336623) : le III 2° garde 3,8 % si
          le revenu de l'avant-dernière OU de l'antépénultième année
          reste sous le seuil, et le III bis n'a pas cette clause.
          Sa règle de lissage est donc celle du texte. CGI art. 197
          (LEGIARTI000053542636) : son barème est le bon. Le point
          rejoint retraites_2027 au 138.2. En passant : le dépôt
          cite la version de L. 136-8 du 31 décembre 2025
          (LEGIARTI000053278668,
          `prelevements_remuneration.yaml:767`), remplacée le 27
          juin 2026 ; le changement ne touche pas les pensions.
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il donne l'incidence d'une mesure par décile de pension
          (onglet « Qui paie »).
        preuve: >-
          `modeles/reforme.py:146-205`, `README.md` (§ Onglets), au
          commit `59b7985`
        verification: >-
          Sa méthode applique un barème à la distribution des
          pensions servies. Elle ne se transpose pas à une réforme
          qui change le calcul carrière par carrière.
        etat: ecarte
        raison: Il faudrait la population de carrières déjà prévue au 138.14.
    bilan: >-
      Il apporte deux hypothèses sourcées pour la page Coût (part des
      reportés en emploi, effet retour), une interface budgétaire que le
      site n'a pas, et le contrefactuel de la suspension au trimestre
      près. Sa lecture d'une sortie de suspension en 2028 n'est pas dans
      la loi.
    sas: [aurain_retraites_simulateur]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/ManZanau/retraites-simulateur
    note: >-
      Dernier commit le 16 septembre 2026, en Python et JavaScript.
      Comparé au dépôt le 1er octobre 2026 à ce commit, `59b7985`.

  - id: outil_quand_partir
    nom: « Quand pourrai-je partir à la retraite ? »
    auteur: auteur du dépôt `ataieb3342/lfi-site`
    nature: calculateur
    publication: ouvert
    code: https://github.com/ataieb3342/lfi-site
    licence: aucune
    usage: lire_et_citer
    confronte: [scenario_1]
    couvre: >-
      L'âge d'ouverture et la durée requise selon trois états du droit, la
      loi du 30 décembre 2025 comprise
      (`src/lib/boite-a-outils/retraite/outil.js`).
    confrontation: >-
      Des paramètres à comparer, génération par génération.
    ecarts:
      - constat: >-
          Il ouvre les droits de toute la génération 1961 à 62 ans et 3 mois,
          avec 169 trimestres (`outil.js`, l. 48 et 86-90), contre sa propre
          règle de la majorité des mois.
        tranche: >-
          le droit que le dépôt certifie : nés de janvier à août 1961, 62 ans
          et 168 trimestres ; l'écart est le sien
        preuve: data/reference/legislation/age_ouverture_requis.csv (l. 135)
      - constat: >-
          Il oppose l'âge de départ à l'espérance de vie sans
          incapacité À LA NAISSANCE (64,1 et 63,7 ans), « l'âge
          jusqu'auquel une personne née aujourd'hui peut espérer
          vivre sans être limitée » (`outil.js:103-106, 288-305`).
        tranche: >-
          DREES, Études et Résultats n° 1363 (janvier 2026) : à 65
          ans, une femme peut espérer vivre encore 11,8 ans sans
          incapacité, un homme 10,5. L'indicateur à la naissance
          compte les incapacités de toute la vie ; c'est celui à 65
          ans qui porte sur les années d'après la vie active. La
          comparaison est fausse, et c'est la sienne.
        preuve: >-
          https://drees.solidarites-sante.gouv.fr/sites/default/files/2026-01/ER1363_esperance_de_vie_sans_incapacit%C3%A9_0.pdf
          (page 1)
    fait_mieux:
      - quoi: >-
          Il donne, pour une génération, son âge et sa durée sous trois états
          du droit, la loi du 30 décembre 2025 comprise, et l'écart en mois.
          Le dépôt n'a aucun univers contrefactuel ; deux univers en couches,
          le droit au 31 août 2023 et la loi de 2023 sans suspension, y
          suffiraient.
        preuve: >-
          `src/lib/boite-a-outils/retraite/outil.js:41-102`, au commit
          `94616bc`
        etat: a_reprendre
