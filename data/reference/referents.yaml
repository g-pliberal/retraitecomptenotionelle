  - id: prost
    nom: PROST (Pension Reform Options Simulation Toolkit)
    auteur: Banque mondiale
    pays: international
    nature: projection
    publication: non_public
    documentation:
      - https://documents1.worldbank.org/curated/en/099061024110535659/pdf/P1777231d8367c0111800816452e83c58d7.pdf
    licence: sans objet
