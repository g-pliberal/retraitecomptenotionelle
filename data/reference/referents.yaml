          Insee Analyses n° 109 (avril 2025),
          https://www.insee.fr/fr/statistiques/8563753 : « partant
          de 12,5 % en 2023 pour atteindre 11,8 % à l'horizon 2070 »
          (indexation sur les prix, productivité 1,3 %) ; DT 2025-08
          ; scripts absents du code public
        verification: >-
          méthode : un correcteur appliqué à une population est ce
          qu'un système piloté ferait ; témoin d'ordre de grandeur,
          à scénarios du COR près (le dépôt : 0,4/0,7/1,0 %).
        etat: a_trancher
        chantier: "138.13"
        raison: >-
          appliquer une règle de pilotage est un choix du programme
          ; l'étude chiffre ce qu'elle déplacerait.
      - quoi: >-
          Il simule une population (naissances, unions, séparations,
          migrations, décès calés sur l'Insee ; carrières projetées)
          et sort chaque année, par régime et sexe, les agrégats du
          COR : cotisants, retraités directs et réversataires, flux
          et âges de liquidation, pension moyenne, bénéficiaires et
          masses des minima et du minimum vieillesse, décès, niveau
          de vie des ménages. Le dépôt pèse douze cas types
          (`cout.py:39-49`).
        preuve: >-
          `src/Indicateurs_annee_COR.h:22-120`,
          `src/Indicateurs_gen.h:20-50`, `R/niveau_vie.R`,
          `src/Destinie.cpp:271-372`, au commit 4c1d34b
        verification: >-
          méthode : une population rend effectifs et dispersion que
          des cas types ignorent ; mais l'échantillon fourni est «
          sans aucune représentativité »
          (`documentation/conseils_pratiques.txt`, point 5) et le
          représentatif n'est pas public.
        etat: a_reprendre
        chantier: "138.14"
      - quoi: >-
          Il acquiert les points de l'Arrco et de l'Agirc aux taux
          contractuels moyens des entreprises (ParamRetrComp : 5,42 %
          à l'Arrco de 1970 à 1990, 13,9 % à l'Agirc vers 1980, 6,61 %
          depuis 2015, à l'Agirc-Arrco unifiée aussi), quand le dépôt
          prête à chaque salarié le taux contractuel minimal de l'accord
          (4 %, 8 %, 6,2 % ; fiches `arrco` et `agirc`). Exécuté : 15 à
          26 % de points de plus chez lui pour les mêmes salaires, à la
          même valeur du point.
        preuve: >-
          tests/temoins/destinie_2.json (parametres_destinie :
          TauxARRCO_1, TauxAGIRC_B, TauxAGIRC_ARRCO_1) ;
          tests/test_destinie.py
        verification: >-
          data/reference/regimes/arrco.yaml et agirc.yaml : le taux
          contractuel minimal de chaque période, que l'accord impose à
          toute entreprise ; un taux supérieur n'engage que celle qui
          l'a souscrit.
        etat: a_trancher
        chantier: "138.13"
        raison: >-
          une convention de cas type, non l'erreur de l'un ou de
          l'autre : le taux minimal est le seul opposable à tout
          salarié, le taux moyen décrit mieux la carrière moyenne. La
          page Coût suit le taux moyen depuis le 5 octobre 2026, comme
          les cas types du COR (taux_moyens_agirc_arrco.csv, de
          TRAJECTOiRE ; action 147, étape 10) ; le simulateur
          individuel garde le minimal : au propriétaire de le changer,
          ou de montrer les deux.
    bilan: >-
      Au-delà de la réversion et de l'ASPA du ménage, il fait mieux par
      ses séries annuelles longues (minimum contributif depuis 1984,
      minimum vieillesse depuis 1970, AVPF à 169 heures), là où le dépôt
      projette des ancres ou déduit, et par quatre règles du scénario 1
      qui nous manquent (AVPF dans le minimum depuis 2023, départ des
      fonctionnaires parents de trois enfants, versement forfaitaire
      unique, plafond de L. 18). Il a tort sur onze points, outre la loi
      du 30 décembre 2025 : CSG à 6,6 %, coefficient de solidarité après
      avril 2024, ressources et taux historique de la réversion,
      Ircantec, complémentaire des indépendants. Exécuté le 5 octobre
      2026, il confirme le minimum contributif daté que le dépôt vient de
      reprendre et la réversion entière qui lui manque encore, et ajoute
      cinq torts que le code ne montrait pas : coefficients des salaires
      décalés d'un an, surcote
      avant l'âge pour les nés de fin d'année, revalorisation moyenne de
      2020, base et plafond de la réversion majorée, valeur du point de
      2024 projetée. Les taux contractuels moyens sont une convention à
      trancher.
    sas: [insee_destinie_2]
    lu_le: 2026-10-05
    lu_dans:
      - https://github.com/InseeFr/Destinie-2
      - https://www.insee.fr/fr/information/3606338
      - https://www.insee.fr/fr/statistiques/8563753
      - tests/temoins/destinie_2.json
    note: >-
      La confirmation la plus indépendante du registre : ses paramètres sont
      les siens (sa feuille de documentation cite la Cnav, le COR,
      l'Agirc-Arrco, TAXIPP et l'IPP). Actualisé le 15 octobre 2025, en C++ et
      R. L'échantillon fourni n'est qu'un test, « sans aucune
      représentativité ». C'est lui qui projette la France pour l'Ageing
      Report de 2024, et les engagements de retraite des comptes nationaux
      hors fonction publique de l'État.
      Comparé au dépôt le 1er octobre 2026 au commit `4c1d34b`. Il plafonne la
      majoration pour enfants de la fonction publique même avec surcote, ce
      que le SRE excepte (`src/DroitsRetr.cpp:879`) : à trancher, la fiche du
      dépôt cherchant encore le texte.

  - id: destinie_1
    nom: Destinie 1
    auteur: INSEE
    nature: microsimulation_dynamique
