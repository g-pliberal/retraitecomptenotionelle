  - id: delingstall_norvege
    nom: Le diviseur norvégien (delingstall)
    auteur: ministère du Travail et NAV
    pays: Norvège
    nature: methode
    publication: documente
    documentation:
      - https://lovdata.no/dokument/SF/forskrift/2009-12-22-1810/KAPITTEL_4
      - https://lovdata.no/nav/folketrygdloven/kap20
      - https://www.nav.no/redirects/delingstal
    licence: non lue
    usage: selon_conditions
    confronte: [proposition]
    couvre: >-
      Le gain de survie normalisé et une actualisation de 0,9925 par an
      (salaires moins 0,75 %), sur la mortalité des dix années avant 61 ans ;
      fixé avant le 1er juillet de l'année des 61 ans ; le capital indexé sur
      les salaires, les pensions servies sur la moyenne des salaires et des
      prix. Tables de NAV du 26 juin 2026 : 20,41 à 62 ans pour la génération
      1965.
    confrontation: >-
      Un calcul à refaire : le diviseur de 1965 depuis les tables de
      mortalité de SSB ; et une variante du diviseur du dépôt qui inclut le
      gain de survie.
    fait_mieux:
      - quoi: >-
          Son diviseur rapporte la survie à l'âge de départ à la survie
          moyenne de 27 à 66 ans, si bien que la mortalité d'avant 62 ans y
          entre comme un gain d'héritage, « uavhengig av opptjeningsprofil ».
          Le diviseur du dépôt n'en a pas (`moteur/conversion.py:229-234`) ;
          sur sa mortalité, la pension serait multipliée par 1,089 pour la
          génération 1960 partie à 65 ans, par 1,058 pour 1980, par 1,044 pour
          2000.
        preuve: >-
          forskrift 2009-12-22-1810, chapitre 4 ; Innst. O. nr. 67
          (2008–2009), § 5 : « effekten av endringer i dødelighet før 62 år
          inkluderes i delingstallene »
        etat: a_trancher
        raison: >-
          Le gain d'héritage est un choix du programme, que le README ne fait
          pas et que le propriétaire tranche ; pris dans le diviseur, il se
          calculerait sur la table de génération du dépôt (taille S).
    sas: [norvege_delingstall]
    lu_le: 2026-10-01
    lu_dans:
      - https://lovdata.no/dokument/SF/forskrift/2009-12-22-1810/KAPITTEL_4
      - https://www.nav.no/redirects/delingstal
    note: >-
      Le code ouvert de NAV (`navikt/pensjonssimulator`, MIT) n'orchestre que
      des appels : le moteur de règles, `pensjon-regler`, n'est pas public.
      La comparaison du 1er octobre 2026 y relève une incohérence assumée : un
      préfinancement de 0,75 % (§ 20-13), des pensions servies à la moyenne
      des salaires et des prix (§ 20-18), qui ne s'accordent que si les
      salaires réels croissent de 1,5 % par an.

