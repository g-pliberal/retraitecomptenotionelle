  - id: simulateur_sud_education
    nom: Simulateur de SUD éducation
    auteur: SUD éducation
    nature: calculateur
    publication: ouvert
    code: https://github.com/Brndan/simulateur-retraites
    licence: MIT
    usage: copier
    confronte: [scenario_1]
    couvre: >-
      La pension des enseignants au droit de 2020, comparée au système
      universel du rapport Delevoye.
    confrontation: >-
      Un calcul à rejouer au droit de 2020, que le scénario 1 sait appliquer.
    ecarts:
      - constat: >-
          Sa pension de fonctionnaire multiplie 75 % du dernier
          traitement par une décote sans borne ni critère d'âge, 1 −
          1,25 % × (requis − acquis), et par un prorata non plafonné
          (`static/js/retraites.js:179-185`).
        tranche: >-
          L. 13 CPCMR (LEGIARTI000053280906) fixe le maximum à 75 %.
          L. 14 (LEGIARTI000048844775) : 1,25 % par trimestre « dans
          la limite de vingt trimestres », sur le plus petit des
          décomptes par l'âge et par la durée. L'écart est le sien.
        preuve: Index LEGI
      - constat: >-
          Il sert aux fonctionnaires le minimum contributif du
          régime général, 695,59 € au prorata
          (`static/js/retraites.js:47, 207-225`).
        tranche: >-
          L. 17 CPCMR (LEGIARTI000048697797) : le fonctionnaire a
          droit au minimum garanti, sous ses propres conditions.
        preuve: Index LEGI
      - constat: >-
          Il liquide les contractuels à 75 % de la moyenne de leurs
          25 meilleures années, « avec intégration des primes »
          (`static/js/retraites.js:46, 186-201`).
        tranche: >-
          Le contractuel relève du régime général (50 % du salaire
          annuel moyen plafonné, au prorata : R. 351-29,
          LEGIARTI000053335651) et de l'Ircantec, en points. Le
          dépôt calcule les deux. L'hypothèse est la sienne et n'a
          pas de source.
        preuve: Index LEGI ; `data/reference/regimes/ircantec.yaml`
      - constat: >-
          Saisir des années de direction d'une école de quatre
          classes arrête le calcul : la ligne 125 lit
          `anneesDirection24`, une variable jamais déclarée
          (`static/js/retraites.js:108, 123-125`).
        tranche: >-
          Le code lui-même : la variable déclarée est
          `anneesDirection4`, donc lire l'autre lève une
          ReferenceError.
        preuve: >-
          `static/js/retraites.js:108, 125`, au commit `eec62c9`
      - constat: >-
          Ses durées requises sont celles de la loi de 2014
          (`:150-164`) et son point est celui de février 2017, 4,686
          € (`:51`).
        tranche: >-
          L. 161-17-3 (LEGIARTI000053280903) : 168 puis 169
          trimestres en 1961, 169 en 1962, 170 de 1963 au 31 mars
          1965. Valeur du point : 59,0734 € par an. Tout cela est
          périmé.
        preuve: Index LEGI ; `point_indice_fonction_publique.csv`
    fait_mieux:
      - quoi: >-
          Il saisit l'enseignant par son corps et son échelon. Le dépôt n'a
          aucun champ d'indice ; ses grilles et son point (4,686 €) étant de
          2020, ce qui se reprend est un champ « indice majoré », multiplié
          par la valeur du point.
        preuve: >-
          `static/js/retraites.js:12-67`, au commit `eec62c9`
        etat: a_reprendre
        chantier: "138.10"
      - quoi: >-
          Il compare le droit de 2020 au système universel à points
          du rapport Delevoye, primes comprises.
        preuve: >-
          `static/js/retraites.js:50-57, 229-367`, au commit
          `eec62c9`
        verification: Voir le même point chez devcrafting_retraites.
        etat: a_trancher
        raison: >-
          C'est un choix du programme : le projet de 2019-2020 n'est
          pas du droit.
    bilan: >-
      La saisie par indice reste son seul apport. Son calcul de 2020
      cumule cinq erreurs ou retards, que les textes en vigueur
      tranchent tous en faveur du dépôt.
    sas: [sud_education_simulateur]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/Brndan/simulateur-retraites
    note: >-
      Dernier commit le 5 septembre 2020.
      Comparé au dépôt le 1er octobre 2026 à ce commit, `eec62c9`. La
      comparaison y trouve, sans citer le texte qui tranche, un prorata non
      plafonné à 1 et une décote sans borne (l. 177-181), et le minimum
      contributif appliqué aux fonctionnaires (l. 205-214).

  - id: devcrafting_retraites
    nom: devcrafting/retraites
    auteur: devcrafting
    nature: calculateur
    publication: ouvert
    code: https://github.com/devcrafting/retraites
    licence: aucune
    usage: lire_et_citer
    confronte: [scenario_1]
    couvre: >-
      Le régime général, les indépendants et la Cipav au droit de 2020,
      comparés au système universel ; en F#.
    confrontation: >-
      Un calcul à relire au droit de 2020.
    ecarts:
      - constat: >-
          Son prorata, trimestres validés sur requis, n'est pas
          plafonné (`CurrentRegimeGeneralDeBase.fs:9-14`).
        tranche: >-
          R. 351-6 (LEGIARTI000053335582) : la pension n'est réduite
          au prorata qu'en deçà de la durée maximum.
        preuve: Index LEGI
      - constat: >-
          Au-delà de la durée, les trimestres manquants deviennent
          négatifs : la décote se change en surcote de 0,625 point
          par trimestre en sus, à tout âge. La décote, elle, ignore
          l'âge du taux plein
          (`CurrentRegimeGeneralDeBase.fs:11-13`).
        tranche: >-
          L. 351-1-2 (LEGIARTI000025014540) : la surcote ne paie que
          les trimestres cotisés après l'âge légal ET au-delà de la
          durée. R. 351-27 (LEGIARTI000054589995) : la décote
          retient le plus petit des deux décomptes.
        preuve: Index LEGI
      - constat: >-
          Ses coefficients Agirc-Arrco dépassent 1 pour des
          trimestres en sus (`CurrentSalaries.fs:22-23`), et il
          ignore le coefficient de solidarité, en vigueur à sa date.
        tranche: >-
          ANI du 17 novembre 2017 (coefficients de solidarité et
          majorants, de 2019 à 2023), supprimés par l'avenant n° 17
          (JORFARTI000049224707). Le dépôt les porte
          (`agirc_arrco.yaml:99-107`).
        preuve: >-
          `data/reference/regimes/agirc_arrco.yaml:99-107`
      - constat: >-
          Sa seconde tranche du RCI part du plafond de la sécurité
          sociale, pas du plafond du régime, et va jusqu'à quatre
          plafonds au-dessus de lui (`CurrentSsi.fs:17-19`). Entre
          37 846 et 41 136 €, le revenu ne cotise donc pas.
        tranche: >-
          D. 635-7 (LEGIARTI000034624601) : 8 % sur la part qui
          excède le seuil du 1°, dans la limite de quatre plafonds.
        preuve: Index LEGI
      - constat: >-
          Sa durée requise est celle de la loi de 2014
          (`Domain.fs:65-70`) : 169 trimestres à 1964-1966.
        tranche: >-
          L. 161-17-3 (LEGIARTI000053280903) : 170 trimestres à
          1964, 172 dès 1966. Périmé.
        preuve: Index LEGI
      - constat: >-
          Son salaire moyen est la moyenne brute des 25 dernières
          années d'un profil linéaire, sans revalorisation
          (`CurrentRegimeGeneralDeBase.fs:7-8`).
        tranche: >-
          L. 351-11 (LEGIARTI000031688444) revalorise les salaires
          selon L. 161-23-1. Le calcul n'est juste que si les
          salaires saisis sont déjà revalorisés, ce que le modèle ne
          dit pas.
        preuve: Index LEGI
    fait_mieux:
      - quoi: >-
          Il arrête la première tranche du RCI (7 %) à un plafond
          propre au régime (37 846 €), et non au plafond de la
          sécurité sociale. Le dépôt coupe au plafond de chaque
          année de 2013 à 2024 (`rci.yaml:29-47, 55-73`) et sait
          qu'il a tort (`regles/rci_seuil_premiere_tranche.yaml`,
          état manquante).
        preuve: >-
          `CurrentSsi.fs:14-17`, au commit `2312ebd`
        verification: >-
          D. 635-7, LEGIARTI000025263581, 000034624601 et
          000041966498 : « Au titre de l'exercice 2013, le montant
          du plafond mentionné au 1° est fixé au plafond annuel […]
          », puis revalorisé chaque année. Le COR donne 42 946 € en
          2024. Pour 2025, un dépliant de l'Assurance retraite (réf.
          252070, février 2025) donne encore 7 et 8 % et un plafond
          RCI de 43 891 €, contre la version de 2024 du texte
          (LEGIARTI000049904623) : à relire avant de couper 2025.
        etat: a_reprendre
        chantier: "138.18"
      - quoi: >-
          Son taux de remplacement net retire 10,1 % à l'Agirc-Arrco
          et 9,1 % à la base. Le dépôt omet par convention le 1 %
          maladie de la complémentaire
          (`prelevements_remuneration.yaml:718-723`).
        preuve: >-
          `CurrentSalaries.fs:46`, au commit `2312ebd` (sa pension
          nette mensuelle, elle, retire 9,1 % partout :
          `Domain.fs:30`)
        verification: >-
          D. 242-8 (LEGIARTI000037456300) : 1 % sur les avantages de
          L. 131-2 autres que ceux du régime général. Le point
          rejoint ceux d'ines et de retraites_2027.
        etat: repris
        chantier: "138.2"
      - quoi: >-
          Au-dessus du plafond, il prélève sur l'artisan 0,60 %, son
          taux propre. Le dépôt crédite le compte des 2,30 puis 2,51
          % du régime général : c'est une convention déclarée
          (`docs/limites.md:2481-2486`). Sous le plafond, les deux
          totaux se valent (17,75 % en 2020).
        preuve: >-
          `CurrentSsi.fs:9-12`, au commit `2312ebd`
        verification: >-
          Barèmes IPP au commit fe2cdff,
          `ret_ac/tous_independants/tout_salaire.yaml` : 0,60 % de
          2017 à 2024, 0,72 % depuis 2025 ;
          `ret_ac/artisans/sous_pss.yaml` : 17,15 % depuis 2016. La
          convention surcrédite donc le compte de l'artisan
          d'environ 1,8 point au-delà du plafond.
        etat: a_reprendre
        chantier: "138.18"
      - quoi: >-
          Il calcule le système universel à points du projet de 2019
          pour les salariés et les indépendants : achat à 10 €,
          service à 0,55 €, âge d'équilibre à 64 ans à 5 % par an,
          25,31 % générateurs de droits et 2,81 % déplafonnés,
          minimum à 85 % du SMIC net. Le dépôt n'a aucun univers de
          ce genre (« Delevoye » et « système universel » absents).
        preuve: >-
          `Reformed.fs:1-76`, au commit `2312ebd`
        verification: >-
          Paramètres du rapport Delevoye cités par le modèle
          (`readme.md:5-8`), cohérents avec SUD éducation
          (`retraites.js:50-57`).
        etat: a_trancher
        raison: >-
          C'est un choix du programme. Le projet a été retiré, mais
          c'est la seule autre réforme systémique chiffrée ; une
          couche « points » se poserait sur le droit réel.
    bilan: >-
      Modèle jouet de 2020, mais j'y trouve trois avantages vérifiés :
      le plafond propre du RCI, que le dépôt sait lui manquer, le 1 %
      maladie de la complémentaire, et le taux propre des artisans
      au-dessus du plafond. Ses erreurs sur le prorata, la surcote et la
      durée sont tranchées par les textes.
    sas: [devcrafting_retraites]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/devcrafting/retraites
    note: >-
      Dernier commit le 21 janvier 2020.
      Comparé au dépôt le 1er octobre 2026 à ce commit, `2312ebd`. La
      comparaison y trouve, sans citer le texte qui tranche, un salaire annuel
      moyen non revalorisé, un prorata non plafonné et une décote négative
      changée en surcote (`CurrentRegimeGeneralDeBase.fs:7-14`).

  - id: calcul_verification_pension
    nom: calcul-verification-pension-retraite
    auteur: jean-ricky-fr
    nature: calculateur
    publication: ouvert
    code: https://gitlab.com/jean-ricky-fr/calcul-verification-pension-retraite
    licence: aucune
    usage: lire_et_citer
    confronte: [scenario_1]
    couvre: >-
      Un tableur de calcul des pensions de l'Assurance retraite et de la MSA
      (« uniquement »).
    confrontation: >-
      Un calcul à relire, pour le régime général.
    ecarts:
      - constat: >-
          Il réserve aux mères la majoration de pension de 10 %.
        tranche: >-
          L. 351-12, qui vise « tout assuré de l'un ou l'autre sexe » ;
          l'écart est le sien
        preuve: la cellule `Pension!F33` du classeur, au commit `5344b10`
      - constat: >-
          Il retient 24 meilleures années pour la mère d'un enfant
          et 23 au-delà, quelle que soit la date de départ, et pour
          les seules mères (nom défini `nA_RAM_M`, cellules
          `Pension!F30` et `H30`).
        tranche: >-
          R. 173-3-2 (LEGIARTI000054589934) : seulement pour les
          pensions prenant effet à compter du 1er septembre 2026
          (décret n° 2026-699, art. 6), et pour quiconque bénéficie
          de la majoration ou de la bonification, le père compris.
          Le dépôt applique cette date
          (`droit/liquider.py:1863-1875`).
        preuve: Index LEGI
      - constat: >-
          Il compte les trimestres jusqu'à l'âge du taux plein en
          jours divisés par 91, arrondis à l'entier inférieur
          (`Pension!K27`) : un départ un mois avant 67 ans n'a donc
          pas de décote.
        tranche: >-
          R. 351-27 (LEGIARTI000054589995) : ce nombre est « arrondi
          au chiffre immédiatement supérieur ». Le dépôt arrondit
          au-dessus (`droit/liquider.py:2135-2152`).
        preuve: Index LEGI
    fait_mieux:
      - quoi: >-
          Il valide les trimestres d'avant 1972 par un seuil trimestriel en
          montant : 362,5 F en 1968, 437,5 F en 1971. Le dépôt écrit
          qu'« Avant 1972, aucun seuil de montant n'existait »
          (`donnees/macro.py:287-294`), à tort : R. 351-9
          (LEGIARTI000053335598) compte de 1949 à 1971 « autant de trimestres
          […] que le salaire annuel […] représente de fois le montant
          trimestriel de l'allocation aux vieux travailleurs salariés », dont
          la série reste à certifier au Journal officiel.
        preuve: la feuille Carriere du classeur, au commit `5344b10`
        etat: repris
        chantier: "138.6"
      - quoi: >-
          Il recalcule les trimestres d'un relevé réel depuis ses montants, et
          le contrôle ainsi. Dans le dépôt, le relevé « fait foi »
          (`carriere.py:418-442`) : rien ne signale une année sous-validée.
        preuve: la feuille Carriere du classeur, au commit `5344b10`
        etat: a_reprendre
        chantier: "138.10"
    bilan: >-
      Ses deux avantages déjà au registre tiennent toujours, et le JO
      confirme une valeur de son seuil d'avant 1972. Rien d'autre : son
      calcul s'arrête à la base, et je lui trouve deux erreurs de plus.
    sas: [calcul_verification_pension]
    lu_le: 2026-10-04
    lu_dans:
      - https://gitlab.com/jean-ricky-fr/calcul-verification-pension-retraite
    note: >-
      Dernier commit le 28 février 2026.
      Comparé au dépôt le 1er octobre 2026 à ce commit, `5344b10`.

  - id: nosretraites_cas_types
    nom: Simulateur de cas types de Nos Retraites
    auteur: collectif Nos Retraites
    nature: cas_types
    publication: ouvert
    code: https://github.com/nosretraites/simulateur_cas_types
    licence: aucune
    usage: lire_et_citer
    confronte: [scenario_1]
    couvre: >-
      L'âge d'ouverture, l'âge et la durée du taux plein, la décote et la
      surcote par génération, au projet de réforme annoncé le 10 janvier
      2023, pas à la loi votée.
    confrontation: >-
      Peu : son droit est un projet ; il garde la lecture d'un moment.
    ecarts:
      - constat: >-
          Son droit « mac » met toute la génération 1961 à 62 ans et
          3 mois, avec 169 trimestres
          (`legalParametersByYearOfBirth.json`, clé 1961).
        tranche: >-
          L. 161-17-2 (LEGIARTI000053280889) et L. 161-17-3
          (LEGIARTI000053280903) : les nés de janvier à août 1961
          gardent 62 ans et 168 trimestres.
        preuve: Index LEGI
      - constat: >-
          Il donne à la mère fonctionnaire quatre trimestres par
          enfant né avant 2004, sans condition
          (`calculationUtils.js:55-60`).
        tranche: >-
          L. 12 b CPCMR (LEGIARTI000053280361) : la bonification
          n'est due qu'« à condition qu'ils aient interrompu ou
          réduit leur activité ».
        preuve: Index LEGI
      - constat: >-
          Ses deux états, le droit d'avant 2023 et le projet du 10
          janvier 2023, sont tous deux périmés : 63 ans et 171
          trimestres à 1964, et pas de carrière longue pour un début
          d'activité avant 21 ans (`calculationUtils.js:37-48`).
        tranche: >-
          La loi du 30 décembre 2025 donne 62 ans et 9 mois et 170
          trimestres à 1964. D. 351-1-1 (LEGIARTI000054059621) ouvre
          le départ à 63 ans pour un début avant 21 ans.
        preuve: Index LEGI
    fait_mieux:
      - quoi: >-
          Il donne, de 58 à 67 ans et sous deux états du droit, ce que vaut
          chaque âge — départ possible, taux plein, décote, surcote —, résumé
          en phrases. Le dépôt ne calcule qu'un âge à la fois
          (`pages.js:4029-4033`) ; une table des six pensions aux âges
          d'ouverture et du taux plein, à 65 et à 67 ans, se mettrait sous le
          résultat.
        preuve: >-
          `utils/calculationUtils.js:20`, au commit `5e4abf1`
        etat: a_reprendre
        chantier: "138.10"
    bilan: >-
      Rien de neuf au-delà de la table d'âges déjà au registre. Son
      droit est celui d'un moment, et les textes en vigueur le
      contredisent sur trois points.
    sas: [nosretraites_simulateur_cas_types]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/nosretraites/simulateur_cas_types
      - https://github.com/nosretraites/simulateur_cas_types_data
    note: >-
      Dernier commit le 22 janvier 2023 ; ses données sont dans
      `simulateur_cas_types_data`.
      Comparé au dépôt le 1er octobre 2026 au commit `5e4abf1`, ses données au
      commit `942e9f6`. La comparaison y trouve, sans citer le texte qui
      tranche, toute la génération 1961 à 62,25 ans dans le droit « mac », et
      la bonification des fonctionnaires pour enfants nés avant 2004 sans
      condition d'interruption.

  # ---- À l'étranger : les comptes notionnels --------------------------------
  # Ils confrontent l'arithmétique de la proposition : le diviseur, le
  # rendement, l'équilibre. Le droit de leur pays n'est pas le nôtre.

  - id: pensionsmodellen
    nom: Pensionsmodellen
    auteur: Pensionsmyndigheten
    pays: Suède
    nature: projection
    publication: ouvert
    code: https://www.pensionsmyndigheten.se/statistik-och-rapporter/pensionsmodellen/pensionsmodellen
    documentation:
      - https://www.pensionsmyndigheten.se/content/dam/pensionsmyndigheten/blanketter---broschyrer---faktablad/statistik/pensionsmodellen/anv%C3%A4ndarmanual_pensionsmodellen_eng.pdf
    licence: >-
      « Du får sprida och modifiera verktyget, men inte använda det i
      kommersiellt syfte utan Pensionsmyndighetens tillstånd »
    usage: selon_conditions
    confronte: [proposition]
    couvre: >-
      Tout le système suédois, en classeurs Excel et VBA, sur 25 à 90 ans :
      les cotisations, le temps de rotation, la dette de pension, l'indice
      d'équilibre (balanstal) et le diviseur.
    confrontation: >-
      Un calcul à rejouer : l'indice d'équilibre et le temps de rotation sur
      75 ans, les trajectoires du frein contre le mécanisme d'équilibre de la
      proposition.
    ecarts:
      - constat: >-
          Son manuel est celui de 2015, même dans l'archive de la
          v2.2. Il annonce l'âge minimal porté à 62 ans en 2015,
          puis à 63 « according to current forecasts » en 2019, et
          l'âge cible à 66 ans en 2019 (v1.5.4, p. 23).
        tranche: >-
          La loi : l'âge minimal vaut l'âge cible moins trois ans
          (SFB 56:3), et l'âge cible est de 67 ans depuis 2026 (SFB
          2:10 a-c ; loi 2022:879, appliquée dès le 1er janvier
          2026). Les données de la v2.2 datent de 2023-2024 ; le
          manuel, lui, est périmé.
        preuve: >-
          manuel PID123479 v1.5.4, p. 23 ; SFB consolidée jusqu'à
          SFS 2026:1658.
      - constat: >-
          La v2.2 ne distribue un excédent que pendant le rattrapage
          d'un frein. `x_Y_distributableSurplusIndexation` n'est
          calculé que si l'indice d'équilibre est sous l'indice de
          revenu ; hors frein, un indice au-dessus de un ne fait
          rien (mRuleSystem, l. 5161-5190 de l'extraction).
        tranche: >-
          La loi 2026:1301, en vigueur le 1er août 2026 et appliquée
          dès 2027, distribue hors de tout frein. Au-delà de 1,15,
          le facteur vaut 1 + (indice − 1,15)/3, sauf l'année d'un
          frein et la suivante (SFB 58:25 a-b, 62:19 a, 62:43). Le
          modèle, de 2024, ne la connaît pas : ne pas s'en servir
          pour chiffrer l'équilibrage symétrique.
        preuve: >-
          SFB 58:25 a-c et dispositions transitoires de la loi
          2026:1301 ; PensionSystem.xlsb v2.2.
    fait_mieux:
      - quoi: >-
          Il projette le bilan du système suédois, durée de rotation
          (`x_Y_turnover_duration`) et indice d'équilibre
          (`x_Y_balance_ratio`). Le dépôt calcule un rapport de
          flux, ressources sur dépenses de l'année
          (`cout.py:114-121`), jamais appliqué.
        preuve: >-
          module mRuleSystem de PensionSystem.xlsb (version 2.2), l.
          5073-5136 de l'extraction ; son manuel, version 1.5.4
          (2015)
        etat: a_trancher
        raison: >-
          Appliquer un équilibrage est un choix du programme. Le
          calcul, lui, se reprend comme indicateur (point de
          `balanstal_suede`, étape 138.19) : Pensionsmyndigheten
          publie l'indice chaque année, même quand il ne mord pas
          (1,1472 pour 2027, rapport orange 2025, p. 4).
      - quoi: >-
          Il projette sur « 498 status groups », croisés par âge, sexe et
          origine, quand la page Coût du dépôt pondère 13 cas types
          (`castypes.py:127`). Une population par états demanderait, en
          France, l'EIC, qui ne se lit qu'au CASD.
        preuve: >-
          son manuel, version 1.5.4 (2015) : « 498 status groups »
        etat: a_reprendre
        chantier: "138.14"
      - quoi: >-
          Il projette le fonds tampon (AP1 à AP4 et AP6), sa valeur
          de marché et son rendement, et le compte à l'actif du
          système (`x_Y_buffer_fund`, `x_Y_buffer_fund_return`). La
          page Coût laisse les réserves des régimes hors du calcul,
          « que le COR chiffre à part, le solde disant le flux et
          jamais le stock » (`cout.py:95-100`). Elle ne dit ni ce
          qu'elles rapportent, ni combien d'années de déficit elles
          couvrent.
        preuve: >-
          mRuleSystem (PensionSystem.xlsb v2.2), l. 5117-5122 de
          l'extraction : « x_Y_buffer_fund_return =
          x_Y_buffer_fund(yr − 1) × apvu + … ». Rapport orange 2025,
          tableau 1.1 : fonds de 2 234 Md SEK fin 2025, rendement de
          5,8 %. La fiche suédoise de l'Ageing Report 2024 le
          projette à 4 % l'an (tableau 16).
        verification: >-
          Méthode : la France a des réserves (FRR, Agirc-Arrco,
          régimes des libéraux), et le dépôt écrit que le COR les
          chiffre (`cout.py:98-100`). Un solde sans stock surestime
          le besoin de court terme d'un système qui a des réserves.
        etat: a_reprendre
        chantier: "138.19"
      - quoi: >-
          On y choisit le scénario démographique de SCB (« Du kan
          välja olika befolkningsscenarier »), en plus de la
          croissance, de l'inflation et du rendement. Le dépôt a les
          variantes économiques du COR
          (`hypotheses_projection.yaml:92-160`), pas les
          démographiques : il n'a que le scénario central de
          l'INSEE.
        preuve: >-
          page Pensionsmodellen du 20 mai 2026 ; la v2.2 porte les
          projections de SCB de 2023 et de 2024.
        verification: >-
          Méthode ; même chantier que les points de destinie_2,
          trajectoire et retraites_cor2026.
        etat: a_reprendre
        chantier: "138.7"
    bilan: >-
      Ce qu'il fait de mieux tient au bilan (durée de rotation, actif de
      cotisation, fonds tampon et son rendement), calculé sur une
      population par états. De quoi donner à la page Coût un indicateur
      de stock et ses réserves ; mais son manuel date de 2015 et son
      code ignore l'accélérateur de 2026.
    sas: [suede_pensionsmodellen]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.pensionsmyndigheten.se/statistik-och-rapporter/pensionsmodellen/pensionsmodellen
      - https://static.pensionsmyndigheten.se/statistik/pensionsmodellen/Pensionsmodellen_2.2.zip
      - https://www.pensionsmyndigheten.se/statistik/publikationer/orange-rapport-2025/orange-rapport-2025.pdf
    note: >-
      Version 2.2 du 10 octobre 2024, une archive de 2,87 Go.
      Le manuel lu le 1er octobre 2026 est la version 1.5.4, de 2015,
      antérieure à la loi SFS 2015:676.

  - id: typfallsmodellen
    nom: Typfallsmodellen
    auteur: Pensionsmyndigheten
    pays: Suède
    nature: cas_types
    publication: ouvert
    code: https://static.pensionsmyndigheten.se/statistik/typfallsmodellen/typfallsmodellen.xlsb
    documentation:
      - https://www.pensionsmyndigheten.se/statistik-och-rapporter/pensionsmodellen/typfallsmodellen
      - https://static.pensionsmyndigheten.se/statistik/typfallsmodellen/anvandarmanual-typfallsmodellen.pdf
    licence: >-
      « Verktyget får spridas och modifieras men inte användas i kommersiellt
      syfte utan Pensionsmyndighetens tillstånd »
    usage: selon_conditions
    confronte: [proposition]
    couvre: >-
      La pension d'une carrière entière — pension de revenu, garantie,
      pension professionnelle, impôt —, avec les diviseurs projetés par
      génération (procédure VBA `Calculate_Deltal`).
    confrontation: >-
      Un calcul à rejouer : le diviseur projeté d'une génération, et la
      pension d'un cas type à carrière identique.
    ecarts:
      - constat: >-
          Son diviseur projeté (`Calculate_Deltal`) fait une moyenne
          « sur cinq ans » qui compte deux fois l'année génération +
          âge cible − 3, soit quatre années distinctes en tout
          (`Mortality.bas:234-240`). Il fixe aussi l'âge cible une
          seule fois, avant la boucle des sexes : aux jeunes âges,
          les femmes lisent des années décalées
          (`Mortality.bas:213-228`, que le portage signale,
          `mortality.ts:132`).
        tranche: >-
          SFB 62:17 prend la statistique d'une « femårsperiod »,
          cinq années. L'effet est faible, et les diviseurs
          officiels n'en souffrent pas : PFS 2026:2 se refait au
          centième sur cinq années distinctes (voir
          delningstal_suede). Ne pas prendre ses diviseurs projetés
          pour exemple.
        preuve: >-
          `Mortality.bas:213-240` au commit bb46d93 ; SFB 62:17 ;
          recalcul de PFS 2026:2 du 4 octobre 2026.
    fait_mieux:
      - quoi: >-
          Il impute chaque année au compte les gains d'héritage, les
          comptes des morts redistribués aux survivants de la
          génération, sur des facteurs « desamma för kvinnor och män
          » (SFB 62:11). Jusqu'à cinq ans de l'âge cible, le facteur
          rapporte les comptes des morts à ceux des survivants de
          même âge (62:14-15), ensuite les décès projetés aux
          survivants (62:16-17) : 1/p_x n'en est que
          l'approximation. PFS 2026:1 donne les facteurs de 2026,
          1,000655 pour la génération 1980 et 1,003457 pour 1964, un
          exemple prêt. Le compte d'un mort « revient à la
          collectivité » au dépôt (`capitalisation.py:5-6`), rien
          n'en revient au compte (`compte.py:1004-1062`), et le
          README est muet ; sur la mortalité du dépôt, la pension de
          la génération 1960 gagnerait 9,6 %, celle de 1980 6,3 %.
        preuve: >-
          `Pensionssystemet.bas:1027`, « arv = (arvsf1 - 1) *
          pbh_ing », dans le portage `mathiasboos/Typfallsmodellen`
          au commit `bb46d93`
        etat: a_trancher
        raison: >-
          Redistribuer aux survivants le compte des morts est un
          choix du programme, que le README ne fait pas et que le
          propriétaire tranche, entre la forme suédoise (le compte
          multiplié chaque année par 1/p_x unisexe de la génération)
          et la forme norvégienne (un facteur dans le diviseur, voir
          delingstall_norvege).
      - quoi: >-
          Il déduit du compte les frais de gestion : 0,0319 % en
          2025, 0,0334 % en 2026 (SFB 62:22-25 ; PFS 2025:2 et
          2026:3). Le dépôt n'en déduit aucun
          (`compte.py:1004-1062`).
        preuve: >-
          `Pensionssystemet.bas:1031`, « kost = … * (kostf - 1) »,
          au commit `bb46d93` du portage
        etat: a_trancher
        raison: >-
          Déduire des frais du compte, environ × (1 − 0,0003) par
          an, est un choix du programme, que le propriétaire
          tranche.
      - quoi: >-
          Il rend la pension par étage, avant et après impôt, en part du
          dernier salaire, et le revenu autour du départ. Le dépôt n'a que le
          taux de remplacement (`simulateur.py:277-298`).
        preuve: son manuel PID289138, version 2.2
        etat: a_reprendre
        chantier: "138.9"
      - quoi: >-
          Il calcule l'uttag partiel, et les droits acquis après un
          premier uttag, portés chaque année à la pension. Le compte
          du dépôt s'arrête à la liquidation (`compte.py:1028`) :
          une cotisation versée ensuite ne crée rien. Le README le
          dit : « la proposition n'en a encore rien dit »
          (`README.md:404`).
        preuve: >-
          `Pensionssystemet.bas:1034` (« partiellt uttag
          (0<andel<1), månadsvis omräkning ») et `:1045` (« Andra
          uttaget och partiellt ELLER prätt »), au commit bb46d93.
        verification: >-
          SFB 56:2 (uttag limité à trois quarts, la moitié ou un
          quart). SFB 62:46-47 : la pension est recalculée chaque
          année comme un retrait suivi d'un nouvel uttag, droits
          nouveaux compris. La Norvège sert de même de 20 à 100 %
          entre 62 et 75 ans, sans condition de revenu (Andreassen
          et al., IJM 2020).
        etat: a_trancher
        raison: >-
          Le cumul et le départ partiel sous la proposition sont un
          choix du programme, qu'il n'a pas fait. S'il le fait,
          l'arithmétique suédoise dit comment : recalcul annuel au
          diviseur de l'âge atteint.
      - quoi: >-
          Il porte au compte les années d'enfant (« barnår », trois
          méthodes, la plus favorable retenue), payées par une
          cotisation de l'État. Il fait de même pour les études, le
          service militaire et les indemnités de maladie, parentales
          ou de chômage. La proposition retire l'AVPF
          (`comptes_notionnels.yaml:69-71` ; « Ni majorations
          enfants, ni MDA, ni AVPF », `README.md:408`). Or la CNAF
          la paie par une cotisation, que `equilibre.py:38-49` nomme
          ainsi, et le même compte porte ce que l'Unédic et l'État
          versent pour un chômage (`compte.py:575-578, 951-1001`,
          action 141).
        preuve: >-
          `Pensionssystemet.bas:1271-1294` (fonction `pgb_barn` : «
          Metod 1: Individuell jämförelse », « Metod 2: Generell
          jämförelse », « Metod 3: Enhetligt belopp ») ;
          `packages/engine/src/model/mcalc.ts:207-240`.
        verification: >-
          SFB 60:21-54 (barnår) et 59:13 (prestations sociales
          comptées comme revenu) ; loi 1998:676 sur la cotisation de
          l'État. En France, L. 381-1 en vigueur
          (LEGIARTI000047453431) : « une cotisation à la charge
          exclusive des organismes débiteurs des prestations
          familiales et calculée sur des assiettes forfaitaires ».
        etat: a_trancher
        raison: >-
          Le README retire l'AVPF en toutes lettres. Mais la règle
          de l'action 141, porter au compte ce qu'un tiers a versé,
          la ferait entrer, avec la recette de la CNAF que la page
          Coût retire aujourd'hui. L'asymétrie est au propriétaire.
      - quoi: >-
          Sa garantie se retire à 48 % au-delà de 1,26 base de prix
          : chaque couronne de pension au-dessus du seuil en laisse
          52 öre. La garantie vieillesse de la proposition est
          différentielle à 100 % jusqu'à 800 €
          (`garantie_vieillesse.yaml:3-6`, `config.py:814`) : sous
          le plancher, cotiser ne rapporte rien.
        preuve: >-
          `packages/engine/src/bidrag/garantipension.ts` (« 0.87 *
          pbb - 0.48 * (inkomst - 1.26 * pbb) ») ; manuel v2.2, § 2.
        verification: >-
          SFB 67:21-24 (loi 2022:1031) : « minskat med 48 procent av
          den del av beräkningsunderlaget som överstiger 1,26
          prisbasbelopp ».
        etat: a_trancher
        raison: >-
          La proposition écrit une garantie qui « remplace l'ASPA »,
          que le dépôt lit différentielle. Un retrait partiel est un
          autre choix, plus coûteux, qui garde un rendement aux
          cotisations des petites pensions.
      - quoi: >-
          La transition suédoise réelle a recalculé pour tous les
          droits notionnels de 1960 à 1998, au taux nouveau de 18,5
          % sur les revenus enregistrés, années d'enfant comprises.
          Elle a ensuite panaché par génération, un vingtième par
          année de naissance de 1938 à 1953. Le dépôt a le
          rétroactif aux taux historiques (scénarios 2, 4 et 6,
          `config.py:536`) et le prospectif aux droits figés (3 et
          5, `valorisation_des_droits_acquis.yaml:3-6`), sans
          panachage. Son taux uniforme (`config.py:548`) ne sert à
          aucun scénario.
        preuve: >-
          `packages/engine/src/pension/contributions.ts:68-75` («
          share = (1 / 20) * (cohort - 1935 + 1) ») et `atp.ts:6-7`,
          au commit bb46d93.
        verification: >-
          Loi 1998:675, art. 28 et 31 (« För åren 1960-1994 skall
          pensionsrätt för inkomstpension utgöra 18,5 procent av
          pensionsunderlaget ») ; SFB 61:10 et 63:16 (un vingtième
          par année).
        etat: a_trancher
        raison: >-
          Le chemin de la bascule est un choix du programme (étape
          13, le diviseur des droits acquis). La Suède en a pris un
          troisième, réel, entre les scénarios 2 et 3.
      - quoi: >-
          Sa prime pension liquidée suit le rendement de ses fonds :
          la pension de l'année vaut celle de l'an passé × rendement
          ÷ 1,0165, le taux avancé dans le diviseur. La rente du
          pilier capitalisé du dépôt est nivelée à taux technique
          nul et « que rien ne revalorise »
          (`revalorisation.py:955-968`, `config.py:1173-1180`). Sa
          réserve ne rapporte rien à son titulaire, et les prix
          seuls la déprécient.
        preuve: >-
          `packages/engine/src/model/drawdown.ts:286-310` (« The
          forskottsranta built into the divisor, unwound year by
          year ») et `:540-552` (le solde × le rendement, plus les
          gains d'héritage), au commit bb46d93.
        verification: >-
          SFB 64:2 (« pensionernas storlek är beroende av
          värdeutvecklingen på de fonderade medlen ») et 64:10. Pour
          un contrat français : « La rente viagère est revalorisée
          tous les ans en fonction des résultats des placements
          réalisés par l'assureur » (lafinancepourtous.com, IEFP). À
          taux technique nul, toute la participation aux bénéfices
          revalorise la rente.
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          Il lit des risques de décès projetés par année de 1980 à
          2120, par sexe et par âge. Le dépôt réduit la mortalité
          projetée à une loi de Gompertz-Makeham calée sur e60 et
          e65 (`mortalite.py:1-30`).
        preuve: >-
          `packages/data/mortality.json` (firstYear 1980, lastYear
          2120, source « mortality!A:D ») ;
          `packages/engine/src/pension/mortality.ts:30-60`.
        verification: >-
          Méthode ; même chantier que destinie_2 (les quotients
          projetés âge par âge). Repris le 7 octobre 2026 (action 138,
          étape 7) : les quotients projetés de l'INSEE, de 2026 à 2125.
        etat: repris
        chantier: "138.7"
    bilan: >-
      Au-delà des gains d'héritage et des frais déjà au registre, il
      montre des choix que la proposition n'a pas faits : droits après
      le départ, années d'enfant, garantie à retrait partiel, transition
      par génération. Il sert aussi une rente capitalisée qui garde son
      rendement, ce que le dépôt devrait reprendre ; son diviseur
      projeté porte deux coquilles de moyenne, sans effet sur les tables
      officielles.
    sas: [suede_typfallsmodellen]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.pensionsmyndigheten.se/statistik-och-rapporter/pensionsmodellen/typfallsmodellen
      - https://github.com/mathiasboos/Typfallsmodellen
      - https://data.riksdagen.se/dokument/sfs-2010-110.text
      - https://data.riksdagen.se/dokument/sfs-1998-675.text
      - https://www.lafinancepourtous.com/pratique/retraite/epargne-retraite/la-rente-viagere/
    note: >-
      Version 4.8 du 27 avril 2026. Un portage non officiel en TypeScript,
      sans licence, en recopie le VBA (`mathiasboos/Typfallsmodellen`,
      septembre 2026).
      Comparé au dépôt le 1er octobre 2026 sur le manuel PID289138 v2.2 et sur
      le portage `mathiasboos/Typfallsmodellen` au commit `bb46d93`.

  - id: delningstal_suede
    nom: Le diviseur suédois (delningstal)
    auteur: Riksdag, gouvernement et Pensionsmyndigheten
    pays: Suède
    nature: methode
    publication: documente
    documentation:
      - https://data.riksdagen.se/dokument/sfs-2010-110.text
      - https://lagen.nu/1998:1340
      - https://www.pensionsmyndigheten.se/om-pensionsmyndigheten/allmanna-handlingar/lagar-och-regler
    licence: textes officiels
    usage: copier
    confronte: [proposition]
    couvre: >-
      Un diviseur unisexe : la valeur actuelle des mensualités sur
      l'espérance de vie moyenne égale le capital, au facteur annuel de 1,016
      (code de la sécurité sociale, chapitre 62, § 34 à 37) ; la mortalité
      officielle des cinq dernières années ; un douzième par mois de report.
      Les tables de 2026 (PFS 2026:2) donnent 17,34 à 65 ans pour la
      génération 1960.
    confrontation: >-
      Un calcul à refaire : la grille de 62 à 110 ans de PFS 2026:2 depuis
      les tables de mortalité, puis le diviseur du dépôt sous les mêmes
      conventions — taux, unisexe, mois.
    ecarts:
      - constat: >-
          Son diviseur lit la mortalité du moment, cinq années
          observées (62:17, 62:36). Il se recalcule une fois à l'âge
          cible (62:44-45), puis reste figé : « Efter 66 års ålder
          sker inte någon ytterligare omräkning av delningstalen ».
        tranche: >-
          La longévité des générations dépasse celle du moment, et
          Pensionsmyndigheten le chiffre : en 2025, la hausse de
          l'espérance de vie des retraités a accru la dette de 51,9
          Md SEK, « en påfrestning på balanstalet ». La table de
          génération du dépôt (`config.py:661`,
          `mortalite.py:648-666`) est plus proche du réel ; ne pas
          reprendre la table du moment.
        preuve: >-
          rapport orange 2025, tableau 2.1 et note 9 (« Värdet av
          förändringen i livslängd », −51 850 Mkr), annexe A.8 ;
          `limites.md:2952-2957`.
    fait_mieux:
      - quoi: >-
          La pension servie y est revalorisée moins la norme du diviseur,
          1,016, la même qui actualise le diviseur (62:36). Le dépôt faisait
          entrer ν (`taux_anticipe_conversion`, `config.py:637`) dans le
          diviseur (`moteur/conversion.py:228-234`) mais revalorisait la
          pension servie au taux plein (`revalorisation.py:921`,
          `moteur/js/revalorisation.js:715`), contre la promesse « à espérance
          de coût inchangée » de `conversion.py:19-21` ; l'étape 138.1 retire
          ν de la revalorisation servie, sans effet au défaut, où ν est nul.
        preuve: >-
          SFB 62:43 : « kvoten … dividerats med talet 1,016 » ; et
          Pensionssystemets årsredovisning 2025, note 6 : « Omräkningen av
          inkomstpension sker med kvoten mellan det nya och gamla
          inkomstindexet dividerat med 1,016 »
        etat: repris
        chantier: "138.1"
      - quoi: >-
          Sa grille de 2026 (PFS 2026:2 : 19,13 à 62 ans, 17,34 à 65, 1,93 à
          100) se recalcule au centième sur la table unisexe de SCB 2020-2024,
          en mensualités à échoir, survie linéaire dans l'année et facteur
          1,016. La fiche du diviseur du dépôt n'a aucun exemple officiel
          (`coefficient_de_conversion.yaml:48`) ; celui-ci en ferait un test.
        preuve: PFS 2026:2, recalculée sur la table `LivslangdFemarigA` de SCB
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          Son diviseur est la valeur des mensualités, versées
          d'avance (« en kommande månadsutbetalning », 62:36). Celui
          du dépôt est une rente continue, l'espérance de vie
          complète (`conversion.py:233-235`), à mi-chemin du terme à
          échoir et du terme échu. Or la pension française se paie à
          terme échu : son diviseur exact serait plus court de 1/24
          d'année, et la pension plus haute d'environ 0,25 %.
        preuve: >-
          SFB 62:36 ; rapport orange 2025, annexe A.8, formule A.8.1
          (somme sur X = 0 à 11 mois, 1,016^(−X/12)).
        verification: >-
          R. 355-2 en vigueur (LEGIARTI000053335726) : « payables
          mensuellement et à terme échu ». Écart refait sur la table
          suédoise : 17,34 contre 17,30 à 65 ans.
        etat: a_trancher
        raison: >-
          Le README définit le diviseur comme « l'espérance de vie
          restante », que le dépôt calcule exactement. Prendre la
          valeur des mensualités réellement payées est un autre
          choix, qui pèse 0,25 %.
    bilan: >-
      Il apporte un exemple officiel que le dépôt n'a pas et qui se
      refait au centième, et une définition du diviseur en mensualités.
      Sur la mortalité, le dépôt est plus exact, et Pensionsmyndigheten
      chiffre elle-même ce que lui coûte la table du moment.
    sas: [suede_lagar_och_regler]
    lu_le: 2026-10-04
    lu_dans:
      - https://data.riksdagen.se/dokument/sfs-2010-110.text
      - https://www.pensionsmyndigheten.se/om-pensionsmyndigheten/allmanna-handlingar/lagar-och-regler
      - https://api.scb.se/OV0104/v1/doris/sv/ssd/BE/BE0101/BE0101I/LivslangdFemarigA
      - https://www.pensionsmyndigheten.se/statistik/publikationer/orange-rapport-2025/orange-rapport-2025.pdf

  - id: balanstal_suede
    nom: L'indice d'équilibre suédois (balanstal)
    auteur: Riksdag et Pensionsmyndigheten
    pays: Suède
    nature: methode
    publication: documente
    documentation:
      - https://www.pensionsmyndigheten.se/statistik/publikationer/orange-rapport-2025/orange-rapport-2025.pdf
      - https://data.riksdagen.se/dokument/sfs-2002-780.text
    licence: textes officiels
    usage: copier
    confronte: [proposition]
    couvre: >-
      L'indice d'équilibre — cotisations fois temps de rotation, plus les
      fonds AP2 à AP4, sur la dette de pension —, le frein sous 1, son
      lissage par un tiers, et depuis la loi 2026:1301 un accélérateur
      au-dessus de 1,15, appliqué pour la première fois à 2027. L'indice
      valait 1,1472 au rapport orange de 2025.
    confrontation: >-
      Un calcul à refaire : retrouver 1,1472 et le temps de rotation, puis
      opposer le mécanisme d'équilibre de la proposition à la règle suédoise,
      désormais symétrique.
    fait_mieux:
      - quoi: >-
          L'indice d'équilibre se calcule sur un stock — cotisations fois
          durée de rotation, plus les fonds, sur la dette de pension — et
          s'applique : sous 1, il freine l'indexation des comptes et des
          pensions jusqu'au rattrapage ; au-delà de 1,15, il distribue. Le
          dépôt calcule un rapport de flux, ressources sur dépenses de l'année
          (`cout.py:114-121`), jamais appliqué (`limites.md:1898-1913`) ; il a
          le passif (`EngagementAcquis`, `cout.py:3455`), pas l'actif de
          cotisation, la durée de rotation ni les réserves.
        preuve: >-
          SFB 58:10-25 c (dont la loi 2026:1301), 62:19 et 62:43 ; rapport
          orange de 2025, tableau 1.1 et annexe B (BT = 1,1472 pour 2027)
        etat: a_trancher
        raison: >-
          Moduler l'indexation des comptes et des pensions par un équilibrage
          automatique est un choix du programme, que le propriétaire tranche ;
          le calcul seul — durée de rotation, stock des droits, réserves du
          COR, une couche qui module l'indexation avec deux ans de retard —
          serait de taille L.
      - quoi: >-
          De 1999 à 2016, l'indice de revenu suédois lissait sur trois ans la
          seule croissance réelle, multipliée par l'inflation de l'année. Le
          lissage du dépôt porte sur le nominal (`indexation.py:104-111`), et
          il en avoue la dérive (`config.py:506-511`) : sur la masse salariale
          lissée sur cinq ans, de 1940 à 2025, le lissage du seul réel la
          ramènerait de +21,3 % à −2,5 %.
        preuve: >-
          rapport orange de 2014, annexe A.1.1 : « to permit more rapid
          adjustment … to changes in the inflation rate »
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          Calculer l'indice d'équilibre comme indicateur, sans
          l'appliquer. Au numérateur, l'actif de cotisation
          (cotisations × durée de rotation, environ 31 ans : un euro
          cotisé en moyenne à 45 ans est servi à 76) plus les
          réserves ; au dénominateur, la dette (comptes des actifs,
          pensions servies × diviseur économique). La page Coût n'a
          que le coefficient de flux de l'année (`cout.py:103-121`)
          et un engagement acquis au prorata temporis, choisi commun
          aux six systèmes (`cout.py:3559-3568`). Ni durée de
          rotation ni actif de cotisation dans `src/` ou
          `moteur/js/`.
        preuve: >-
          SFB 58:14-20 ; rapport orange 2025, p. 3-4 et tableau 1.1
          (actif de cotisation 11 370 Md SEK, fonds 2 234, dette 11
          859) ; formule codée dans Pensionsmodellen v2.2,
          mRuleSystem, l. 5073-5136 de l'extraction.
        verification: >-
          Méthode : la loi suédoise en fait la mesure de solvabilité
          d'un compte notionnel, publiée chaque année même quand
          elle ne mord pas. Un rapport de flux prend un calendrier
          pour un déséquilibre. En Norvège, « stort omfang av
          tidliguttak øker pensjonsutgiftene på kort sikt »
          (Fredriksen et Stølen, Økonomiske analyser 6/2014), sans
          rien coûter en valeur actuelle. Sa limite est écrite : il
          suppose stable la population active (rapport orange 2025,
          note 3).
        etat: a_reprendre
        chantier: "138.19"
      - quoi: >-
          Un compte suédois ne reçoit que des indices publiés. Celui
          de l'année t mesure le revenu moyen de t−2 à t−1 (58:12)
          et s'applique à la fin de t−1 (62:18-20). Au départ, la
          pension se calcule sur ce solde (62:30) ; la croissance de
          l'année du départ n'arrive qu'à la pension servie, en
          janvier suivant, divisée par 1,016 (62:42-43). Le dépôt
          arrête le compte à la fin de l'année de liquidation et lui
          donne la croissance de cette année-là
          (`indexation.py:213-235`, `compte.py:1028, 1042`),
          qu'aucune caisse ne connaîtrait au départ. Sur ses propres
          séries, la pension d'une carrière cotisée avant l'année du
          départ en sort plus haute de 7,9 % pour un départ en 2021,
          de 7,8 % en 2022 et de 5,6 % en 2023, et plus basse de 4,0
          % en 2020. La pension servie de la page Coût garde cette
          année d'avance.
        preuve: >-
          SFB 58:12, 62:18-20, 62:30, 62:42-43 ; Typfallsmodellen,
          `Pensionssystemet.bas:1042` au commit bb46d93 (« pension =
          pbh_ing * andel / deltal », sur le solde d'ouverture de
          l'année).
        verification: >-
          Méthode : un compte réel ne se revalorise que d'un indice
          connu, et le rétroactif « comme si la règle avait toujours
          existé » doit en suivre le calendrier. Taux de la masse
          salariale lus dans le dépôt : −4,02 % (2020), +7,87 %
          (2021), +7,84 % (2022), +5,62 % (2023). Ce point complète
          celui de la Pologne sur le prorata des mois, qui ne règle
          pas le décalage de mesure.
        etat: a_reprendre
        chantier: "138.11"
    bilan: >-
      Il apporte une mesure de solvabilité de stock, écrite dans la loi,
      que la page Coût peut calculer sans l'appliquer. Il apporte aussi
      un calendrier d'indexation sur des indices publiés, que le compte
      du dépôt devance d'un an ; l'équilibrage appliqué reste au
      propriétaire.
    sas: [suede_orange_rapport_2025]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.pensionsmyndigheten.se/statistik/publikationer/orange-rapport-2025/orange-rapport-2025.pdf
      - https://data.riksdagen.se/dokument/sfs-2010-110.text
    note: >-
      Ses simulations stochastiques de l'accélérateur ne sont pas publiées ;
      l'avis du 15 décembre 2025 en donne l'ordre de grandeur (sept
      simulations sur cent entrent dans le frein au seuil de 1,10).

  - id: sesim
    nom: SESIM
    auteur: ministère des Affaires sociales (Folkhälsomyndigheten)
    pays: Suède
    nature: microsimulation_dynamique
    publication: non_public
    documentation:
      - https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en
    licence: sans objet
    usage: resultats_publies
    confronte: [cout]
    couvre: >-
      Les projections suédoises de l'Ageing Report de 2024 (SESIM18, réécrit
      en R) ; né au ministère des Finances vers 1997.
    confrontation: >-
      Des résultats publiés à retrouver, ceux de la fiche suédoise.
    ecarts:
      - constat: >-
          La fiche décrit l'accélérateur comme une proposition au
          seuil de 1,1, « not enacted, and is not included in the
          pension calculations ». Elle projette le fonds au-delà de
          60 % du PIB à la fin des années 2060 (p. 24-25).
        tranche: >-
          La loi 2026:1301 l'a créé, au seuil de 1,15, appliqué dès
          2027 (SFB 58:25 a-c, 62:19 a, 62:43). La projection
          suédoise de l'Ageing Report 2024 est périmée sur ce point,
          et son fonds surestimé.
        preuve: >-
          SFB consolidée, dispositions transitoires de la loi
          2026:1301 ; fiche, p. 24-25.
      - constat: >-
          Sa base, l'échantillon LINDA tiré en 1999, s'arrête en
          2018 et n'est plus tenue : « LINDA is no longer updated »
          (§ 4.2, note 19).
        tranche: >-
          C'est un retard de données, non de droit : ses
          comportements sont estimés sur des années que le dépôt
          dépasse par ses séries publiées.
        preuve: fiche, § 4.2 et note 19.
    fait_mieux:
      - quoi: >-
          Il simule environ 320 000 personnes, dont le départ dépend de
          l'éducation, de l'âge, du sexe et du revenu, et dont les conjoints
          coordonnent leur départ. Le dépôt fixe l'âge par une règle
          (`castypes.py:58-88`), limite qu'il déclare ; le modèle est
          statistique, calé sur l'AWG, et sa transposition demanderait des
          microdonnées françaises.
        preuve: >-
          fiche suédoise de l'Ageing Report 2024, § 4 : « approximately
          320 000 individuals », « spouses tend to coordinate their
          retirement »
        etat: a_reprendre
        chantier: "138.14"
    bilan: >-
      Son seul avantage, la population simulée, est déjà au registre
      (138.14), et il est plus mince qu'il n'y paraît : départs non
      incitatifs, pas de pension partielle. Le reste de la fiche double
      des points déjà relevés ailleurs — la décomposition
      (ageing_report), le fonds à 4 % (pensionsmodellen), le frein codé
      mais inactif (balanstal_suede) — et ignore l'accélérateur de 2026.
    lu_le: 2026-10-04
    lu_dans:
      - https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en
      - https://economy-finance.ec.europa.eu/document/download/1a05f725-4231-411e-bcde-7d567ddd7689_en?filename=2024-ageing-report-country-fiche-Sweden.pdf

  - id: mosart
    nom: MOSART
    auteur: Statistics Norway (SSB)
    pays: Norvège
    nature: microsimulation_dynamique
    publication: non_public
    documentation:
      - https://www.ssb.no/befolkning/metoder-og-dokumentasjon/mosart-7.5.teknisk-dokumentasjon/_/attachment/inline/4d238e34-04c3-4dc3-a324-544e5a3a572e:e14fd155e59697117b6a359d5861dbab1e74a17e/NOT2025-04.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition, cout]
    couvre: >-
      La pension notionnelle norvégienne de 2011 — capital, diviseur,
      indexation —, et les projections du gouvernement et de l'Ageing
      Report ; version 7.5, en C#.
    confrontation: >-
      Des résultats publiés à retrouver, sa documentation technique de 2025
      à l'appui.
    fait_mieux:
      - quoi: >-
          Il projette des départs qui suivent l'espérance de vie.
          Chaque génération reporte son départ des deux tiers du
          gain, assez pour garder sa pension : c'est l'hypothèse
          principale de ses projections depuis 2011. Le dépôt fait
          partir chaque cas type à l'âge que le droit lui ouvre
          (`castypes.py:58-88` ; variantes « droit » et « absolu »
          seules, `pilote.py:43`), et la proposition à 65 ans
          (`config.py:842`), sans variante de comportement.
        preuve: >-
          IJM 2020, § 6.1 et 6.2 : « A postponement of 2/3 of the
          growth in life expectancy is therefore chosen as the main
          assumption in the projections ».
        verification: >-
          Méthode : une variante, non une meilleure estimation ;
          MOSART juge l'effet « too early to validate ». Elle borne
          ce que le coût d'un système notionnel doit au
          comportement, puisque le diviseur fait du départ un choix.
          Elle se pose sur les cas types, sans microdonnées.
        etat: a_reprendre
        chantier: "138.7"
      - quoi: >-
          Il rapporte les pensions de toute la retraite aux revenus
          de toute la carrière, par décile de revenu et par sexe,
          pour la génération 1963. Le dépôt n'a que le taux de
          remplacement au départ (`simulateur.py:278-298`).
        preuve: IJM 2020, § 8, figure 9.
        verification: >-
          Méthode : c'est l'indicateur de cycle de vie que l'étape
          138.9 prévoit (le taux de remplacement sur le cycle de vie
          de trajectoire), ici par niveau de revenu et par sexe. Il
          servirait aussi l'action 143. Repris le 7 octobre 2026
          (action 138, étape 9) : le taux d'annuité et le taux de
          remplacement sur le cycle de vie, par cas type, donc par
          niveau de revenu et par sexe ; la ventilation d'une
          génération par décile attend la population de l'étape 14.
        etat: repris
        chantier: "138.9"
      - quoi: >-
          Il se valide sur les pensions observées : la distribution
          simulée des pensions de 2017, partie de la population de
          1980, est confrontée à celle des déclarations fiscales. Le
          dépôt confronte des masses à la dépense publiée, jamais
          une distribution simulée à une distribution observée.
        preuve: >-
          IJM 2020, § 7, figure 5 : « it tracks very well the
          observed data ».
        verification: >-
          Méthode, reprise le 7 octobre 2026 sans le CASD : la
          distribution que l'EIR publie, par sexe, en tranches de
          cent euros et en quantiles, suffit à confronter une
          distribution simulée. `scripts/grille_large.py
          --distribution` y confronte les grilles de la page Coût,
          en 2020 : les treize cas types servent 1 792 € de moyenne
          pour 1 536, 8 % des pensions sous 900 € pour 30 % ; la
          grille élargie, 1 436 €, sert trop aux femmes (1 329 €
          pour 1 177) et trop peu aux hommes (1 558 € pour 1 957).
          La comparaison pension par pension reste au CASD (point
          de CALIPER).
        etat: repris
        chantier: "138.14"
      - quoi: >-
          Il boucle sur l'offre de travail et un modèle d'équilibre
          général : pour les finances publiques, l'effet de la
          réforme de 2011 sur l'emploi pèserait plus que la baisse
          des pensions.
        preuve: IJM 2020, § 6.2 et § 10.
        verification: Méthode.
        etat: ecarte
        raison: >-
          Hors champ : le dépôt est comptable par construction, et
          le dit (`limites.md:2968-2973`).
    bilan: >-
      Code fermé (C#, sur un serveur de SSB). Ce qu'il fait de mieux
      tient à sa population — départs simulés, validation sur les
      pensions déclarées, indicateurs par décile — et demande des
      microdonnées, sauf l'hypothèse des deux tiers, transposable aux
      cas types ; sur l'arithmétique du compte, il applique la loi
      norvégienne, que delingstall_norvege couvre.
    sas: [norvege_mosart]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.ssb.no/befolkning/metoder-og-dokumentasjon/mosart-7.5.teknisk-dokumentasjon/_/attachment/inline/4d238e34-04c3-4dc3-a324-544e5a3a572e:e14fd155e59697117b6a359d5861dbab1e74a17e/NOT2025-04.pdf
      - https://microsimulation.pub/articles/00214

  - id: delingstall_norvege
    nom: Le diviseur norvégien (delingstall)
    auteur: ministère du Travail et NAV
    pays: Norvège
    nature: methode
    publication: documente
    documentation:
      - https://lovdata.no/dokument/SF/forskrift/2009-12-22-1810/KAPITTEL_4
      - https://lovdata.no/nav/folketrygdloven/kap20
      - https://www.nav.no/redirects/delingstal
    licence: non lue
    usage: selon_conditions
    confronte: [proposition]
    couvre: >-
      Le gain de survie normalisé et une actualisation de 0,9925 par an
      (salaires moins 0,75 %), sur la mortalité des dix années avant 61 ans ;
      fixé avant le 1er juillet de l'année des 61 ans ; le capital indexé sur
      les salaires, les pensions servies sur la moyenne des salaires et des
      prix. Tables de NAV du 26 juin 2026 : 20,41 à 62 ans pour la génération
      1965.
    confrontation: >-
      Un calcul à refaire : le diviseur de 1965 depuis les tables de
      mortalité de SSB ; et une variante du diviseur du dépôt qui inclut le
      gain de survie.
    ecarts:
      - constat: >-
          Après 60 ans, son diviseur lit la mortalité moyenne
          observée des dix années qui précèdent les 61 ans de la
          génération (§ 4-3), puis se fige.
        tranche: >-
          Comme en Suède, la table du moment ignore les gains de
          longévité à venir. La table de génération du dépôt
          (`config.py:661`) est plus proche de la durée réellement
          servie ; ne pas reprendre la table du moment.
        preuve: forskrift 2009-12-22-1810, § 4-3 ; `limites.md:2952-2957`.
    fait_mieux:
      - quoi: >-
          Son diviseur rapporte la survie à l'âge de départ à la survie
          moyenne de 27 à 66 ans, si bien que la mortalité d'avant 62 ans y
          entre comme un gain d'héritage, « uavhengig av opptjeningsprofil ».
          Le diviseur du dépôt n'en a pas (`moteur/conversion.py:229-234`) ;
          sur sa mortalité, la pension serait multipliée par 1,089 pour la
          génération 1960 partie à 65 ans, par 1,058 pour 1980, par 1,044 pour
          2000.
        preuve: >-
          forskrift 2009-12-22-1810, chapitre 4 ; Innst. O. nr. 67
          (2008–2009), § 5 : « effekten av endringer i dødelighet før 62 år
          inkluderes i delingstallene »
        etat: a_trancher
        raison: >-
          Le gain d'héritage est un choix du programme, que le README ne fait
          pas et que le propriétaire tranche ; pris dans le diviseur, il se
          calculerait sur la table de génération du dépôt (taille S).
      - quoi: >-
          NAV publie chaque juin la grille entière de ses diviseurs,
          génération par génération et mois par mois de 62 à 75 ans
          (générations 1954-1965 ; 20,41 à 62 ans pour 1965), avec
          une prévision jusqu'à la génération 2040. Le dépôt ne
          publie aucune grille de ses diviseurs ; le site n'affiche
          que celui d'une simulation (`pages.js:6129`).
        preuve: >-
          Delingstall.xlsx, feuilles « Delingstall » et « Prognoser
          delingstall », publiées le 26 juin 2026.
        verification: >-
          Méthode : traçabilité. Une grille publiée laisse chacun
          vérifier un diviseur, et montre d'un millésime à l'autre
          ce que les tables de génération déplacent.
        etat: a_reprendre
        chantier: "138.11"
    bilan: >-
      Son diviseur porte le gain d'héritage, déjà au registre et vérifié
      au millième, et NAV publie ses grilles et leur prévision, ce que
      le dépôt ne fait pas. Sa mortalité du moment est moins exacte que
      la table de génération du dépôt.
    sas: [norvege_delingstall]
    lu_le: 2026-10-04
    lu_dans:
      - https://lovdata.no/dokument/SF/forskrift/2009-12-22-1810/KAPITTEL_4
      - https://www.nav.no/redirects/delingstal
    note: >-
      Le code ouvert de NAV (`navikt/pensjonssimulator`, MIT) n'orchestre que
      des appels : le moteur de règles, `pensjon-regler`, n'est pas public.
      La comparaison du 1er octobre 2026 y relève une incohérence assumée : un
      préfinancement de 0,75 % (§ 20-13), des pensions servies à la moyenne
      des salaires et des prix (§ 20-18), qui ne s'accordent que si les
      salaires réels croissent de 1,5 % par an.

  - id: modello_rgs
    nom: Modèle de prévision de la Ragioneria Generale dello Stato
    auteur: Ragioneria Generale dello Stato (ministère de l'Économie)
    pays: Italie
    nature: projection
    publication: non_public
    documentation:
      - https://www.rgs.mef.gov.it/_Documenti/VERSIONE-I/Attivit--i/Spesa-soci/Attivita_di_previsione_RGS/2026/Ltdmlpdspess-2026.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition, cout]
    couvre: >-
      La dépense de pensions à long terme et les taux de remplacement, le
      régime contributif compris ; tenu depuis 1999.
    confrontation: >-
      Des résultats publiés à retrouver, ceux du rapport n° 27 de juillet
      2026.
    fait_mieux:
      - quoi: >-
          Ses taux de remplacement nets comptent l'impôt ; le dépôt retire un
          forfait de 9,1 % (`prelevements_remuneration.yaml:705`). Le reste du
          modèle n'est pas public.
        preuve: rapport n° 27 de la RGS, juillet 2026, § 6.5
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il mesure ce que l'ajustement automatique du diviseur
          absorbe d'un choc de longévité : espérance de vie haute et
          basse, avec et sans révision des coefficients. La révision
          seule retire 0,6 à 0,7 point de PIB en fin de période. Le
          dépôt n'a qu'une mortalité projetée et aucune variante
          démographique : hypotheses_projection.yaml:92-160 ne varie
          que la productivité et le chômage.
        preuve: >-
          RGS n° 27, riquadro 5.1, p. 159 : « la differenza nel
          rapporto spesa/PIL si attesta attorno a 0,6-0,7 punti
          percentuali »
        verification: >-
          Méthode. Le diviseur de génération est le stabilisateur de
          la proposition ; le chiffrer sous deux longévités est la
          seule façon de montrer qu'il joue. L'INSEE publie des
          variantes d'espérance de vie.
        etat: a_reprendre
        chantier: "138.7"
      - quoi: >-
          Il décompose la dépense en pension moyenne sur
          productivité, fois pensions sur occupés. Ce second facteur
          se décompose en dépendance (70 ans et plus sur 20-69 ans),
          pensions sur population âgée et inverse du taux d'emploi.
          Il sépare pensions et pensionnés, et ventile par
          prestation, sexe et secteur. Le dépôt suppose la
          couverture constante (cout.py:58) et pèse des effectifs de
          caisse, non des personnes (cout.py:53).
        preuve: RGS n° 27, § 2.3, p. 63-64
        verification: >-
          Méthode, la même que l'Ageing Report (encadré I.1.1) : une
          seconde source pour le même chantier.
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Le départ anticipé du régime contributif (64 ans, 20 ans
          de cotisation) exige une pension d'au moins trois fois
          l'assegno sociale, soit 1 638,72 € par mois en 2026, et
          3,2 fois dès 2030. Un départ précoce ne bascule donc pas
          sur la solidarité. Les scénarios 2 à 5 gardent les âges du
          droit réel ; le scénario 6 impose 65 ans sans condition de
          montant (age_legal_de_la_proposition.yaml).
        preuve: >-
          RGS n° 27, § 6.3, p. 166, et note 202 (loi de budget pour
          2025 : 3,2 fois dès 2030)
        verification: >-
          Règle italienne en vigueur, décrite par la RGS. C'est un
          choix de conception, pas un calcul plus juste.
        etat: a_trancher
        raison: >-
          Subordonner un départ à un montant minimal de pension est
          une règle du programme ; elle toucherait la garantie
          vieillesse du scénario 6.
    bilan: >-
      Il fait mieux sur les sorties : taux nets après impôt, variantes
      de longévité qui isolent l'effet du diviseur, décomposition de la
      dépense. Le reste du modèle n'est pas public, et je n'y ai trouvé
      aucune erreur.
    sas: [italie_rgs_rapporto_27]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.rgs.mef.gov.it/_Documenti/VERSIONE-I/Attivit--i/Spesa-soci/Attivita_di_previsione_RGS/2026/Ltdmlpdspess-2026.pdf

  - id: coefficienti_italie
    nom: Les coefficients de transformation italiens
    auteur: loi n° 335 de 1995, ministère du Travail et ministère de l'Économie
    pays: Italie
    nature: methode
    publication: documente
    documentation:
      - https://www.lavoro.gov.it/documenti-e-norme/normativa/decreto-direttoriale-20112024-coefficienti-trasformazione.pdf
      - https://www.rgs.mef.gov.it/_Documenti/VERSIONE-I/Attivit--i/Spesa-soci/Attivita_di_previsione_RGS/2026/Ltdmlpdspess-2026.pdf
    licence: textes officiels
    usage: copier
    confronte: [proposition]
    couvre: >-
      Le coefficient, inverse d'un diviseur qui moyenne les deux sexes et
      intègre la réversion, au taux d'actualisation de 1,5 %, révisé tous les
      deux ans sur la mortalité de l'Istat ; le décret du 20 novembre 2024
      donne 19,049 à 65 ans, soit 5,250 %.
    confrontation: >-
      Un calcul à refaire : la table de 2025-2026 au millième, puis une
      variante du diviseur du dépôt qui intègre la réversion.
    ecarts:
      - constat: >-
          Le taux d'actualisation de 1,5 % (« prevedibile tasso di
          crescita reale di lungo periodo del PIL ») n'est confirmé
          qu'en écartant 2008-2009, 2012-2013 et 2020-2021. Sur
          1996-2023, la note technique elle-même trouve 0,7 % par
          an. Comme les pensions servies suivent les prix, le
          coefficient paie d'avance une croissance que le système
          n'a pas eue.
        tranche: >-
          La note technique tranche elle-même. Le dépôt, à ν = 0 et
          avec une pension revalorisée au taux du compte, ne paie
          rien d'avance (conversion.py:14-22 ;
          revalorisation.py:896-906) : c'est lui qui est cohérent.
          Le registre ne doit pas prendre 1,5 % pour une référence.
        preuve: >-
          Note technique du 19 novembre 2024, p. 2, note 4 : « per
          il quale si riscontra una variazione media annua pari a
          0,7% »
    fait_mieux:
      - quoi: >-
          Son diviseur tarife la réversion : Δx = [Σs (a_x,s + A_x,s)]/2 − k,
          avec η = 0,6 et δ = 0,9 pour les hommes, 0,7 pour les femmes ; à 65
          ans, 17,590 pour l'assuré et 1,460 pour le survivant donnent 19,049,
          une réversion qui coûte 7,7 % de la pension directe (13,3 % pour un
          homme). Le diviseur du dépôt n'a pas de terme A_x
          (`moteur/conversion.py:228-234`), et la convention `"servie"` du
          coût (`cout.py:669-670`) ajoute la réversion actuelle sans la
          charger : elle la sert gratuitement.
        preuve: >-
          Nota tecnica du décret du 20 novembre 2024, tableau C.2 ; RGS,
          rapport n° 27, appendice 1, B.1
        etat: a_trancher
        raison: >-
          Tarifer la réversion dans le diviseur, par un terme A_x sous la
          convention `"servie"`, nourri de données de l'INSEE et de la DREES,
          est un choix du programme que le propriétaire tranche.
      - quoi: >-
          Le tableau C.2 de la Nota tecnica publie le diviseur à 65 ans,
          19,049, et ses deux termes, 17,590 et 1,460 : un exemple officiel,
          que la fiche du diviseur du dépôt n'a pas
          (`coefficient_de_conversion.yaml:48`).
        preuve: lavoro.gov.it, « nota-tecnica-decreto-ct-2025 », tableau C.2
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          La loi revalorise les comptes sur la moyenne du PIB nominal des cinq
          années qui précèdent, avec un plancher « salvo recupero ». Le
          `--lissage 5` du dépôt prend les années t−4 à t et omet le plancher
          (`moteur/indexation.py:102-111`, `config.py:31-35, 86-89`).
        preuve: >-
          L. 335/1995, art. 1, c. 6-11 ; ministère du Travail, 28 octobre
          2025 : « nei cinque anni precedenti il 2025 »
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          Ses diviseurs lisent la mortalité âge par âge
          (probabilités de l'Istat pour 2023), et des probabilités
          prospectives pour le conjoint survivant. Le dépôt projette
          la mortalité par une loi de Gompertz-Makeham à trois
          paramètres, calée sur les espérances à 60 et 65 ans
          (donnees/mortalite.py:9-13, 29). Elle est juste là où le
          diviseur se joue, approchée ailleurs.
        preuve: >-
          Note technique du 19 novembre 2024, p. 2-3 et tableau A ;
          RGS n° 27, B.1, p. 196 : « anno 2023 per la stima della
          probabilità di morte »
        verification: >-
          Méthode : une table par âge rend la forme de la mortalité,
          que trois paramètres n'ont pas. C'est le premier volet du
          138.7, repris le 7 octobre 2026 : de 2026 à 2125, le diviseur
          lit les quotients projetés de l'INSEE âge par âge. Les
          probabilités du conjoint survivant tarifent une réversion
          dans le diviseur, que le dépôt ne fait pas : c'est un choix
          du programme, à l'étape 13.
        etat: repris
        chantier: "138.7"
      - quoi: >-
          Son diviseur corrige la fréquence des versements : k = 1/2
          − 6/(13n), soit 0,4615 pour douze mensualités d'avance et
          la treizième. Celui du dépôt somme la survie moyenne de
          chaque année (conversion.py:234-235), c'est-à-dire
          l'annuité moins un demi-an, sans paramètre. La pension
          française est payée par mois à terme échu ; l'annuité
          exacte vaut l'annuité moins 13/24 d'an. Le diviseur du
          dépôt est donc trop long de 0,04 an, soit 0,2 % de
          pension.
        preuve: >-
          Note technique, p. 3, note 6 ; RGS n° 27, B.1, p. 196-197
          : « k = 0,4615 (n = 12) »
        verification: >-
          R. 355-2 CSS en vigueur depuis le 1er janvier 2026
          (LEGIARTI000053335726) : « payables mensuellement et à
          terme échu ». L'écart est faible, mais k est nécessaire
          pour rejouer 19,049 au millième.
        etat: a_reprendre
        chantier: "138.11"
    bilan: >-
      Il fait mieux sur trois points : la réversion tarifée dans le
      diviseur (à trancher), le plancher à rattrapage, et un exemple
      officiel au millième. Sa mortalité par âge et sa correction de
      fréquence ne sont que des raffinements, et son taux de 1,5 % est
      plus généreux que la croissance qu'il constate lui-même.
    sas: [italie_coefficienti_2024]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.lavoro.gov.it/documenti-e-norme/normativa/decreto-direttoriale-20112024-coefficienti-trasformazione.pdf
      - https://www.lavoro.gov.it/temi-e-priorita-previdenza/focus/nota-tecnica-decreto-ct-2025
      - https://www.lavoro.gov.it/notizie/pagine/tasso-annuo-di-capitalizzazione-rivalutazione-montanti-contributivi-2025
    note: >-
      La comparaison du 1er octobre 2026 relève que son taux de 1,5 % se
      justifie hors récessions, « escludendo i bienni 2008-2009 e 2012-2013
      […] e il biennio 2020-2021 » (Nota tecnica, p. 2).

  - id: t_dymm
    nom: T-DYMM
    auteur: ministère de l'Économie, département du Trésor
    pays: Italie
    nature: microsimulation_dynamique
    publication: non_public
    documentation:
      - https://microsimulation.pub/articles/00303
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition]
    couvre: >-
      Les pensions italiennes, régime contributif compris, sur des données
      administratives appariées à l'enquête SILC ; sur LIAM2.
    confrontation: >-
      Des résultats publiés à retrouver.
    fait_mieux:
      - quoi: >-
          Le départ y est un choix : chaque année, tout éligible
          compare la valeur de partir et celle d'attendre (option
          value de Stock et Wise, paramètres estimés pour l'Italie
          par Belloni et Alessie, 2013), sur salaires et pensions
          nets, pondérés par la survie. Le dépôt prend l'âge déclaré
          et le dit (limites.md:2005-2010). La page Coût ne déplace
          que l'âge légal du scénario 6 (cout.py:1987-2003).
        preuve: >-
          § 3.3 : « The choice function introduced is based on an
          option value model (Stock and Wise, 1990) »
        verification: >-
          Méthode. Le dépôt écrit lui-même qu'un diviseur qui
          récompense l'attente déplace les départs
          (limites.md:2005-2010) ; un choix estimé est plus proche
          du réel qu'un âge fixe.
        etat: a_reprendre
        chantier: "138.14"
      - quoi: >-
          Il simule une population réelle et se valide sur elle.
          AD-SILC apparie IT-SILC 2004-2017, les carrières de l'INPS
          de 1922 à 2018 et les déclarations fiscales (238 431
          individus en 2015). Le module de pensions est confronté
          aux distributions de l'INPS. La page Coût, elle, pondère
          les cas types par les effectifs des caisses
          (cout.py:39-54).
        preuve: >-
          § 2 et § 4 : « particular attention should be paid to
          results stemming from the Pension module »
        verification: >-
          Méthode. L'équivalent français est l'EIC et l'EIR au CASD,
          que nomme le 138.14.
        etat: a_reprendre
        chantier: "138.14"
      - quoi: >-
          Il en tire la distribution des retraités : Gini, pauvreté
          relative, effet redistributif des transferts et de
          l'impôt, par un module socio-fiscal (IRPEF, minima
          sociaux). Le dépôt ne projette ni impôt ni distribution
          des niveaux de vie.
        preuve: >-
          § 4, figures 13-14 : « a redistributive effect of
          transfers three times higher than that of taxes by the end
          of the simulation »
        verification: >-
          Méthode ; il faut d'abord la population du point
          précédent.
        etat: a_reprendre
        chantier: "138.14"
    bilan: >-
      Tout ce qu'il fait de mieux demande des microdonnées : départs
      choisis, population réelle, validation, distribution. Il ne dit
      rien de l'arithmétique du compte, que l'article ne décrit pas, et
      son code n'est pas publié.
    lu_le: 2026-10-04
    lu_dans:
      - https://microsimulation.pub/articles/00303

  - id: fus23
    nom: Modèle FUS23
    auteur: ZUS, département des statistiques et prévisions actuarielles
    pays: Pologne
    nature: projection
    publication: non_public
    documentation:
      - https://bip.zus.pl/documents/493361/494125/Publikacja_Fundusz_Emerytalny_2026_2080.pdf/eb15d7cf-ebff-e6ea-dec9-f81654a28011
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition, cout]
    couvre: >-
      Le fonds de retraite polonais jusqu'en 2080, par cohortes ; en Excel et
      VBA.
    confrontation: >-
      Des résultats publiés à retrouver, ceux de la prévision d'octobre 2025.
    fait_mieux:
      - quoi: >-
          Il projette les retraités par cohorte d'âge et de sexe,
          sur les données de la ZUS, avec un modèle à décréments
          multiples (conversion, perte du droit, décès), en trois
          variantes. La page Coût ne projette pas de retraités :
          elle pèse des cas types (cout.py:39-54).
        preuve: >-
          p. 6 : « zastosowaliśmy model szkodowości wielorakiej
          (ang. multiple decrement model) » ; hypothèses p. 7-8
        verification: >-
          Méthode actuarielle classique, la même que celle de l'OIT
          ; plus proche du réel qu'une grille pondérée.
        etat: a_reprendre
        chantier: "138.14"
      - quoi: >-
          Il chiffre l'effet d'une mortalité de ±5 % sur recettes,
          dépenses et solde, et celui de ±1 point sur chaque
          hypothèse (salaire réel, chômage, prix, recouvrement,
          indexation). Le dépôt a les variantes de productivité et
          de chômage du COR, aucune de mortalité
          (hypotheses_projection.yaml:92-160).
        preuve: Annexe B, p. 55-57 (tableaux B.1 à B.3) ; annexe C, p. 58
        verification: >-
          Méthode : seule une variante de mortalité éprouve le
          diviseur.
        etat: a_reprendre
        chantier: "138.7"
      - quoi: >-
          En Pologne, l'État cotise pour le congé parental, la
          maternité et la garde d'enfant, et ces sommes entrent dans
          les recettes de cotisation du fonds. En Lettonie,
          l'assiette qui fait l'indice compte les cotisations
          versées par le budget. Le compte du dépôt neutralise
          l'AVPF (couches/comptes_notionnels.yaml:69-71, « ni AVPF
          »), alors que la CNAF la verse bel et bien. Depuis
          l'action 141, le même compte porte pourtant « ce qu'un
          tiers a versé aux régimes réels — l'Unédic, l'État »
          (compte.py:676-678). Deux phrases du dépôt sont inexactes
          : equilibre.py:319-322 dit le chômage indemnisé « la seule
          période non travaillée que quelqu'un paie », et
          cout.py:80-84 dit encore retirés les points des chômeurs,
          qu'equilibre.py:248-254 garde depuis le 23 septembre.
        preuve: >-
          FUS23, p. 17, note 3 : « przekazywanie z budżetu państwa
          składek za osoby: przebywające na urlopach wychowawczych,
          pobierające zasiłki macierzyńskie oraz sprawujące osobistą
          opiekę nad dziećmi » ; fiche lettone de l'Ageing Report
          2024, p. 6
        verification: >-
          L. 381-1 CSS en vigueur (LEGIARTI000047453431) : « une
          cotisation à la charge exclusive des organismes débiteurs
          des prestations familiales et calculée sur des assiettes
          forfaitaires ».
        etat: a_trancher
        raison: >-
          Le README écarte l'AVPF ; la règle de l'action 141 (porter
          ce qu'un tiers verse) la ferait entrer. Le propriétaire
          tranche. Les deux phrases inexactes de cout.py et
          d'equilibre.py sont à corriger dans tous les cas.
    bilan: >-
      Il fait mieux sur la projection : une population de retraités en
      décréments multiples, et des sensibilités par paramètre, mortalité
      comprise. Il rappelle aussi qu'un compte notionnel porte les
      cotisations que l'État verse pour les périodes de garde d'enfant,
      ce que le dépôt refuse à l'AVPF.
    lu_le: 2026-10-04
    lu_dans:
      - https://bip.zus.pl/documents/493361/494125/Publikacja_Fundusz_Emerytalny_2026_2080.pdf/eb15d7cf-ebff-e6ea-dec9-f81654a28011

  - id: diviseur_pologne
    nom: Le diviseur polonais
    auteur: loi sur les pensions du FUS (article 26) et GUS
    pays: Pologne
    nature: methode
    publication: documente
    documentation:
      - https://stat.gov.pl/sygnalne/komunikaty-i-obwieszczenia/lista-komunikatow-i-obwieszczen/komunikat-w-sprawie-tablicy-sredniego-dalszego-trwania-zycia-kobiet-i-mezczyzn,285,14.html
      - https://arslege.pl/wysokosc-emerytury/k63/a22756/
    licence: textes officiels
    usage: copier
    confronte: [proposition]
    couvre: >-
      Le capital divisé par l'espérance de vie restante unisexe, en mois,
      sans actualisation ; la table du GUS, publiée avant le 31 mars, vaut
      du 1er avril au 31 mars suivant.
    confrontation: >-
      Une variante à opposer au diviseur du dépôt : l'espérance de vie pure,
      sans taux technique.
    fait_mieux:
      - quoi: >-
          Son capital initial comble les trous : la pension hypothétique au
          1er janvier 1999 est multipliée par l'espérance de vie à 62 ans,
          avec un prorata sur les 24 % de base ; un salaire introuvable vaut
          le salaire minimum, au prorata ; le capital se revalorise comme le
          compte, jamais en baisse. Le dépôt a la même structure
          (`scenarios/notionnel.py:658-735`), mais une année sans montant y
          vaut zéro, et les points du relevé sont « lus, et jetés »
          (`web/releve_lu.py:634, 648-654`).
        preuve: >-
          Dz.U. 2025 poz. 1749, art. 173, art. 174 ust. 8 et art. 15 ust. 2a
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          L'année du départ, la revalorisation y est trimestrielle. Le dépôt
          compte l'année entière quel que soit le mois
          (`moteur/indexation.py:213-235`), soit de +½ an à −0,4 an de
          croissance ; un prorata de (m−1)/12 suffirait.
        preuve: Dz.U. 2025 poz. 1749, art. 25a
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          Le GUS publie chaque année la table qui fait le diviseur, 222,7 mois
          à 65 ans en 2026 : un exemple officiel, sans actualisation, que la
          fiche du diviseur du dépôt n'a pas
          (`coefficient_de_conversion.yaml:48`).
        preuve: communiqué du GUS du 25 mars 2026
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          Le compte ne baisse jamais, et sa revalorisation ne passe
          pas sous les prix : l'indice vaut les prix majorés de la
          croissance réelle de la somme des cotisations, et il « nie
          może być niższy » que l'indice des prix. La revalorisation
          trimestrielle de l'année du départ a le même plancher.
          L'Italie et la Lettonie plancher à un avec rattrapage. Le
          dépôt n'a par défaut aucun plancher (config.py:522-525).
          Son plancher éventuel est un taux constant, sans plancher
          réel ni rattrapage possibles (indexation.py:113-115), et
          le triple lock inversé peut être négatif par construction.
        preuve: >-
          Dz.U. 2025 poz. 1749, art. 25 ust. 3 et 6, art. 25a ust.
          4-5, art. 173 ust. 6a
        verification: Loi en vigueur, lue dans le texte consolidé.
        etat: a_trancher
        raison: >-
          Un plancher, aux prix comme en Pologne ou à un avec
          rattrapage comme en Italie et en Lettonie, est une règle
          de la proposition ; le README n'en fixe pas.
      - quoi: >-
          L'indice du 1er juin de l'année t se lit sur l'année t−1,
          déjà publiée : les prix et la somme des cotisations de
          l'année précédente. Le dépôt revalorise l'année t au taux
          de l'année t (indexation.py:138-140 et 229-234), y compris
          l'année du départ, que personne ne connaîtrait encore.
          L'Italie prend les cinq années qui précèdent, la Grèce la
          croissance de t−2 (fiche grecque, p. 17), PROST
          l'inflation de t−1 (éq. 119, p. 73).
        preuve: >-
          Dz.U. 2025 poz. 1749, art. 25 ust. 6-8 : « w roku
          kalendarzowym poprzedzającym termin waloryzacji »
        verification: >-
          Loi en vigueur. Méthode : une règle appliquée ne lit que
          des données déjà publiées.
        etat: a_trancher
        raison: >-
          Le README dit « chaque année » sans dire sur quelle année
          se lit le taux. Décaler d'un an change le capital d'une
          année de croissance : c'est au programme de choisir entre
          la règle idéale et une règle applicable.
    bilan: >-
      Il fait mieux sur l'arithmétique appliquée : capital initial sans
      trou, revalorisation trimestrielle l'année du départ, exemple
      officiel, plancher, taux lu sur une année publiée. Son diviseur
      sur table du moment est moins exact que celui du dépôt, et son
      art. 26 ust. 6 ne corrige que ce défaut-là.
    sas: [pologne_gus_esperance]
    lu_le: 2026-10-04
    lu_dans:
      - https://arslege.pl/wysokosc-emerytury/k63/a22756/
      - https://api.sejm.gov.pl/eli/acts/DU/2025/1749/text.pdf
      - https://stat.gov.pl/sygnalne/komunikaty-i-obwieszczenia/lista-komunikatow-i-obwieszczen/komunikat-w-sprawie-tablicy-sredniego-dalszego-trwania-zycia-kobiet-i-mezczyzn,285,14.html
    note: >-
      Les valeurs de 2026 (268,9 mois à 60 ans, 222,7 à 65 ans) n'ont été lues
      que sur un site secondaire.
      Le 1er octobre 2026, ces 222,7 mois à 65 ans ont été lus à la source, au
      communiqué du GUS du 25 mars 2026.

  - id: modele_lettonie
    nom: Modèle de projection des pensions lettonnes
    auteur: ministère du Bien-être, avec des consultants de la Banque mondiale
    pays: Lettonie
    nature: projection
    publication: non_public
    documentation:
      - https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition, cout]
    couvre: >-
      Le système notionnel letton, en projection agrégée, construit il y a
      plus de vingt ans.
    confrontation: >-
      Des résultats publiés à retrouver, ceux de la fiche lettonne de
      l'Ageing Report.
    ecarts:
      - constat: >-
          Sa fiche reconnaît deux défauts du modèle. Il ne prend pas
          en compte les transferts au compte notionnel depuis 2020,
          qui augmentent les recettes. Et ses auteurs ne sont « pas
          convaincus » que la part garantie des pensions y soit bien
          modélisée.
        tranche: >-
          La fiche elle-même : ses recettes et ses dépenses
          projetées se lisent avec ces réserves.
        preuve: >-
          Fiche lettone, § 4.3, p. 28 : « the model does not capture
          this » ; « we are not convinced that the model performs
          adequately »
    fait_mieux:
      - quoi: >-
          Il publie ce que la longévité coûte à un système notionnel
          de génération : +2 ans d'espérance de vie ne font que +0,1
          point de PIB en 2070, et une fécondité de −20 % +0,2
          point. La France à prestations définies prend +0,7 et +1,2
          point (fiche France, tableau 17, p. 38). Faute de variante
          démographique (hypotheses_projection.yaml:92-160), le
          dépôt ne peut pas montrer cet effet pour les scénarios 2 à
          6.
        preuve: >-
          Fiche lettone, § 3.5, tableau 16, p. 25 : « The higher
          life expectancy scenario increases the number of
          pensioners, but that is partly offset by smaller average
          pension amounts »
        verification: >-
          Méthode ; c'est un résultat publié à retrouver avec les
          variantes de l'INSEE.
        etat: a_reprendre
        chantier: "138.7"
    bilan: >-
      Ce qu'il fait de mieux est un résultat : la stabilité d'un
      notionnel de génération face à la longévité, que le dépôt devrait
      pouvoir retrouver. Le modèle lui-même, une projection agrégée par
      cellules, est fermé et reconnu imparfait par ses auteurs.
    lu_le: 2026-10-04
    lu_dans:
      - https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en
      - https://economy-finance.ec.europa.eu/document/download/51c6f5df-e7f1-4409-9fd6-877912a647fd_en?filename=2024-ageing-report-country-fiche-Latvia.pdf

  - id: diviseur_lettonie
    nom: Le diviseur letton (P = K / G)
    auteur: loi sur les pensions d'État (article 12), VSAA
    pays: Lettonie
    nature: methode
    publication: documente
    documentation:
      - https://likumi.lv/ta/id/38048-par-valsts-pensijam
      - https://www.vsaa.gov.lv/lv/media/5322/download?attachment=
    licence: textes officiels
    usage: copier
    confronte: [proposition]
    couvre: >-
      La pension, capital divisé par l'espérance de vie unisexe du bureau
      statistique ; le capital indexé sur la masse salariale cotisée. La
      table G du 1er janvier 2026 donne 17,76 à 65 ans.
    confrontation: >-
      Une variante à opposer au diviseur du dépôt, sans actualisation.
    ecarts:
      - constat: >-
          G est interpolé linéairement entre les âges quinquennaux :
          le pas vaut exactement 0,73 an de 60 à 65 ans, puis
          0,67-0,68 de 65 à 70. L'espérance de vie étant convexe en
          l'âge, G est un peu trop long aux âges intermédiaires.
        tranche: >-
          La table elle-même. Le diviseur du dépôt intègre la survie
          à l'âge exact (conversion.py:203-256) : il est le plus fin
          des deux. L'écart reste petit.
        preuve: >-
          Table G de la VSAA du 1er janvier 2026 (60 : 21,41 ; 61 :
          20,68 ; 62 : 19,95 ; 63 : 19,22 ; 64 : 18,49 ; 65 : 17,76)
    fait_mieux:
      - quoi: >-
          Son capital initial se passe d'archives : Ks = Vi × As × 0,2, où Vi
          est le salaire cotisé de 1996 à 2000, au moins 40 % de la moyenne
          nationale ; une carrière de trente ans sous la moyenne prend la
          moyenne, et l'indice a un plancher à 1, avec rattrapage. Le dépôt
          n'a aucune imputation de repli pour les années sans montant
          (`scenarios/notionnel.py:658-735`).
        preuve: >-
          « Par valsts pensijām », art. 12(4) et dispositions transitoires 13
          et 33
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          Le capital se revalorise sur la somme des salaires
          cotisés, et la fiche précise que cette assiette compte les
          revenus des non-salariés et les cotisations versées par le
          budget. La Pologne prend la somme des cotisations (art. 25
          ust. 6-8), la Grèce les gains cotisés de ses assurés
          (fiche grecque, p. 16). Le défaut du dépôt, la « masse
          salariale », lit les seuls salaires des comptes nationaux
          (D11, masse_salariale.csv), et le dépôt écrit que c'est «
          l'assiette des cotisations » (masse_salariale.csv:16 ;
          config.py:77-85). Or la caisse fusionnée couvre aussi les
          non-salariés. Sur les données certifiées du dépôt
          (assiette_activite.csv), de 1950 à 2024, les salaires sont
          multipliés par 216,3 et les salaires plus le revenu mixte
          par 137,4 : rapport 1,574, soit +0,61 point par an (+0,69
          de 1960 à 2000). La part du revenu mixte est tombée de
          43,5 % à 11,0 %. La salarisation gonfle donc le rendement
          de tous les comptes rétroactifs.
        preuve: >-
          Art. 12(1) ; fiche lettone, p. 6 : « The contribution wage
          sum consists of the total base (employed and self-employed
          income, pension contributions transfers from the state
          basic budget and the state special budget) on which
          contributions are made »
        verification: >-
          Lois polonaise (art. 25 ust. 6-8, lu) et lettone (art.
          12(1), lu) ; calcul fait sur assiette_activite.csv du
          dépôt (INSEE, D11 et B3G des ménages, certifiés).
        etat: a_trancher
        raison: >-
          Le README dit « la masse salariale ». La lire comme
          l'assiette de la caisse fusionnée (salaires et revenu
          mixte), à la manière de la Lettonie, de la Pologne et de
          la Grèce, ou garder D11, est un choix du programme. Dans
          tous les cas, la phrase « l'assiette des cotisations » est
          à corriger, et l'autre série est à offrir en variante
          (138.11).
      - quoi: >-
          Les cotisations versées après le départ entrent au compte
          : la pension est recalculée automatiquement, au plus tôt
          tous les douze mois, en ajoutant P = K/G sur le capital
          accumulé depuis. Les systèmes 2 à 6 du dépôt n'ont ni
          cumul ni seconde pension, « et la proposition n'a pas
          encore dit ce qu'elle fait de l'activité après lui »
          (limites.md:172-174).
        preuve: >-
          « Par valsts pensijām », art. 24(1), (1¹) et (2) ; fiche
          lettone, p. 5 : « the benefit is recalculated once a year
          »
        verification: >-
          Loi en vigueur, lue. Méthode : c'est la lecture directe de
          « seules les cotisations comptent ».
        etat: a_trancher
        raison: >-
          Le README ne dit rien de l'activité après le départ ; le
          propriétaire tranche.
      - quoi: >-
          La table G du 1er janvier 2026 (17,76 à 65 ans, 18,49 à
          64, 19,95 à 62) est un exemple officiel de diviseur
          unisexe de génération, sans actualisation. La fiche du
          dépôt n'en a aucun (coefficient_de_conversion.yaml:50).
        preuve: >-
          VSAA, « plānotie vecuma pensijas izmaksas laika periodi
          (gados) G no 2026. gada 1. janvāra » ; fiche lettone, p. 5
          : « projected cohort-specific unisex life expectancy at
          retirement »
        verification: >-
          Table officielle de l'organisme de paiement, établie sur
          les données du bureau statistique (art. 13).
        etat: a_reprendre
        chantier: "138.11"
    bilan: >-
      Ses règles éclairent surtout ce que le dépôt doit trancher :
      l'assiette qui fait le rendement, les cotisations d'après le
      départ, le plancher à rattrapage. Son diviseur est de génération
      comme celui du dépôt, mais interpolé plus grossièrement.
    sas: [lettonie_table_g]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.vsaa.gov.lv/lv/media/5322/download?attachment=
      - https://likumi.lv/ta/id/38048-par-valsts-pensijam

  - id: projections_grece
    nom: Projections de l'Autorité actuarielle nationale
    auteur: Autorité actuarielle nationale, sur le modèle de l'OIT
    pays: Grèce
    nature: projection
    publication: non_public
    documentation:
      - https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition]
    couvre: >-
      Les complémentaires grecques en comptes notionnels : rendement égal à
      la croissance des salaires cotisés, rentes actualisées à 1,3 %, aucune
      indexation en cas de déficit.
    confrontation: >-
      Une règle d'équilibre à opposer à celle de la proposition : la
      suspension de l'indexation.
    fait_mieux:
      - quoi: >-
          Taux technique et revalorisation y sont couplés : Δt =
          min[(1+g_{t−2})/(1+r) − 1, CPI_{t−1}], avec r = 1,3 %, la
          formule de la fiche grecque. Le dépôt n'ôtait pas ν
          (`config.py:633-637`) de la revalorisation servie
          (`revalorisation.py:921`) : à ν = 1,5 %, la pension
          gagnait 21 % sans contrepartie ; l'étape 138.1 l'en
          retire. La reprise ne prend ni le plafond aux prix ni le
          décalage de deux ans, deux choix du programme.
        preuve: fiche grecque de l'Ageing Report 2024, p. 8, 16 et 17
        etat: repris
        chantier: "138.1"
      - quoi: >-
          L'indexation y est suspendue en cas de déficit. Le dépôt calcule le
          coefficient d'équilibre sans règle qui l'applique.
        preuve: fiche grecque de l'Ageing Report 2024, p. 16-17 et 52
        etat: a_trancher
        raison: >-
          Suspendre l'indexation en déficit est une règle d'équilibre, un
          choix du programme que le propriétaire tranche.
      - quoi: >-
          Sa rente tarifie la réversion : « a whole life annuity is
          used, taking into account the transfer of pension rights
          to Assignees (survivors) », recalculée tous les trois ans.
          Le diviseur du dépôt n'a pas de terme de survie
          (conversion.py:229-235), et la convention « servie » du
          coût sert la réversion sans la charger (cout.py:280-289,
          674).
        preuve: Fiche grecque, p. 17
        verification: >-
          Même règle qu'en Italie (tableau C.2 : 1,460 des 19,049
          années de rente à 65 ans) : deux lois la confirment.
        etat: a_trancher
        raison: >-
          Tarifer la réversion dans le diviseur est le choix déjà
          soumis au propriétaire au point italien (138.13).
    bilan: >-
      Sa formule couple rente et revalorisation, et le dépôt l'a reprise
      ; ce qui reste chez lui relève de choix : suspension de
      l'indexation en déficit, réversion tarifée, plafond aux prix. Je
      n'y ai pas trouvé d'erreur.
    lu_le: 2026-10-04
    lu_dans:
      - https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en
      - https://economy-finance.ec.europa.eu/document/download/2704c5dc-e3ae-485e-9244-e32978a31b7e_en?filename=2024-ageing-report-country-fiche-Greece.pdf

  - id: fator_previdenciario
    nom: Le fator previdenciário
    auteur: loi n° 9.876 de 1999, IBGE
    pays: Brésil
    nature: methode
    publication: documente
    documentation:
      - https://www.planalto.gov.br/ccivil_03/leis/l9876.htm
      - https://ftp.ibge.gov.br/Tabuas_Completas_de_Mortalidade/
    licence: textes officiels
    usage: copier
    confronte: [proposition]
    couvre: >-
      Un facteur proche d'un diviseur : durée de cotisation fois 0,31 sur
      l'espérance de vie de l'IBGE, « média nacional única para ambos os
      sexos », avec un bonus.
    confrontation: >-
      Une variante à opposer au diviseur du dépôt : l'espérance de vie pure,
      sans rendement notionnel.
    ecarts:
      - constat: >-
          Le registre le traite comme une variante en usage du
          diviseur. Or la EC 103/2019 (13 novembre 2019) supprime la
          retraite à la durée de cotisation. Depuis, le fator ne
          calcule plus que la règle de transition de l'art. 17
          (péage de 50 %, pour qui avait plus de 28 ans de
          cotisation, femme, ou 33, homme) et les droits acquis.
        tranche: >-
          EC 103/2019, art. 17, parágrafo único, lu dans la note de
          la Chambre : « multiplicada pelo fator previdenciário »
          (p. 14) et « Extingue a aposentadoria por tempo de
          contribuição » (p. 6).
        preuve: >-
          Câmara dos Deputados, Resumo da EC 103/2019, R. Baars
          Paternostro, nota técnica
    bilan: >-
      Rien de mieux : Es se lit sur la table du moment de l'IBGE,
      unisexe, sans rendement, que le bonus (Id + Tc·a)/100 remplace ;
      le dépôt, lui, divise par une table de génération. Le facteur
      n'est plus qu'une règle de transition, et le registre devrait le
      dire.
    sas: [bresil_lei_9876]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.planalto.gov.br/ccivil_03/leis/l9876.htm
      - https://bd.camara.leg.br/bitstreams/2743e797-05ec-43df-a20c-96c9d708e01f/download

  - id: elinaikakerroin
    nom: Le coefficient d'espérance de vie finlandais (elinaikakerroin)
    auteur: Centre finlandais des pensions (ETK)
    pays: Finlande
    nature: methode
    publication: documente
    documentation:
      - https://www.etk.fi/suomen-elakejarjestelma/elaketurva/elinaikakerroin/elinaikakertoimen-laskentakaavat/
    licence: non lue
    usage: selon_conditions
    confronte: [proposition]
    couvre: >-
      Un mécanisme voisin : le rapport de la valeur en capital d'une pension à
      62 ans, 65 ans dès 2027, à celle de 2009, au taux de 2 % et sur la
      mortalité des cinq années précédentes ; 0,94643 pour la génération
      1964.
    confrontation: >-
      Un calcul à refaire : le coefficient de 1964, et l'effet d'un
      coefficient de cette forme sur la pension du dépôt.
    ecarts:
      - constat: >-
          Son coefficient lit la mortalité des cinq dernières années
          observées, et ne bouge plus une fois fixé à 62 ans.
        tranche: >-
          Même biais que les diviseurs suédois et norvégien. La
          table de génération du dépôt (`config.py:661`) est plus
          proche de la longévité réelle des générations ; ne pas
          reprendre la table du moment.
        preuve: >-
          etk.fi, « Elinaikakerroin ja sen määräytyminen » : «
          viiden viimeisen vuoden … kuolevuustilastojen », « eikä se
          muutu enää sen vahvistamisen jälkeen ».
    fait_mieux:
      - quoi: >-
          Le mémo de l'ETK publie un exemple complet, EAL2024 = 17,718722 et
          EAK = 0,94692, avec ses quotients ; la formule du dépôt
          (`moteur/conversion.py:229-234`) les redonne au millionième, au taux
          de 2 %. La fiche du diviseur n'a aucun exemple officiel
          (`coefficient_de_conversion.yaml:48`) : celui-ci en ferait un test.
        preuve: >-
          `eak2024.pdf`, mémo de l'ETK
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          L'ETK publie pour chaque génération l'âge qui compense le
          coefficient (« tavoite-eläkeikä ») : 66 ans et 3 mois pour
          la génération 1962, soit quinze mois de report. Le dépôt
          ne dit nulle part à quel âge une génération retrouverait,
          à cotisations égales, la pension d'une génération de
          référence.
        preuve: eak2024.pdf, p. 3 (TyEL 75 c §).
        verification: >-
          Méthode : le diviseur du dépôt le donne directement, c'est
          l'âge où le diviseur d'une génération égale celui de la
          génération de référence à 65 ans. Il servirait l'étape
          138.9 et l'action 143.
        etat: a_reprendre
        chantier: "138.9"
      - quoi: >-
          Depuis la réforme de 2017, l'âge minimal des générations
          1965 et suivantes suit l'espérance de vie. La règle tient
          (âge − 18) / e(âge) égal à (65 − 18) / e(65) de 2025, par
          mois entiers, deux mois par an au plus, la première fois
          pour 2027. La Suède indexe de même son âge cible : 65 ans
          plus les deux tiers du gain d'espérance de vie à 65 ans
          depuis 1994. La proposition fixe l'âge légal à 65 ans
          (`config.py:842`). La variante du dépôt qui indexe l'âge
          de référence vise un rapport fixe de 0,5 depuis 22 ans,
          par pas de trois mois, sans ancrage sur l'année de base ni
          plafond annuel, et ne touche pas l'âge de départ
          (`age_reference.py:137-151`, `config.py:606`).
        preuve: >-
          etk.fi, « Vanhuuseläkeiän määräytyminen » : formule de
          ra_v ; « Tarkistukset toteutetaan täysinä kuukausina,
          enintään 2 kuukaudella vuodessa ».
        verification: >-
          SFB 2:10 a-c (loi 2019:649). En Norvège, MOSART a servi à
          étudier la même règle (Fredriksen, Kruse et Stølen, «
          Dynamisk justering av aldersgrensene i pensjonssystemet »,
          Rapporter 2022/22).
        etat: a_trancher
        raison: >-
          L'âge de départ est un choix du programme (65 ans au
          README). Si le propriétaire le lie à l'espérance de vie,
          la règle finlandaise donne la forme — ancrée sur l'année
          de la bascule, par mois, bornée — plutôt que le rapport
          fixe de la variante actuelle.
    bilan: >-
      Sa formule est celle du dépôt, au millionième : un exemple
      officiel tout prêt. Il n'apporte en plus qu'un indicateur, l'âge
      qui compense la longévité, et une règle d'âge liée à l'espérance
      de vie, que la proposition n'a pas choisie.
    sas: [finlande_elinaikakerroin]
    lu_le: 2026-10-04
    lu_dans:
      - https://www.etk.fi/suomen-elakejarjestelma/elaketurva/elinaikakerroin/elinaikakertoimen-laskentakaavat/
      - https://www.etk.fi/wp-content/uploads/2023/11/eak2024.pdf
      - https://www.etk.fi/suomen-elakejarjestelma/elaketurva/elinaikakerroin/vanhuuselakeian-maaraytyminen/
    note: >-
      Les modèles de l'ETK (LTP, ELSI) ne sont pas publiés.

  # ---- Les organisations internationales -------------------------------------

  - id: prost
    nom: PROST (Pension Reform Options Simulation Toolkit)
    auteur: Banque mondiale
    pays: international
    nature: projection
    publication: non_public
    documentation:
      - https://documents1.worldbank.org/curated/en/099061024110535659/pdf/P1777231d8367c0111800816452e83c58d7.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition, cout]
    couvre: >-
      Un pilier notionnel par répartition au choix du taux (PIB, PIB par
      tête, salaire, masse salariale), les facteurs de rente, la transition
      par capital initial, la dette implicite ; en Excel et VBA.
    confrontation: >-
      Une méthode à refaire, celle du « Calculus for PROST 15 » : le capital
      initial de la transition et la dette implicite, à opposer à ceux du
      dépôt.
    fait_mieux:
      - quoi: >-
          Il valorise les droits acquis au diviseur de la génération de
          l'assuré, AF(P_AGE, P_YEAR) avec P_YEAR = T + P_AGE − a (éq. 112).
          Le dépôt prend celui de l'âge de référence l'année de la bascule
          (`scenarios/notionnel.py:719-724`, jumeau
          `scenario-notionnel.js:383-388`), exact pour qui a 65 ans à la
          bascule seulement : −9,0 % sur la part figée de qui a 40 ans en
          2026, −11,8 % à 30 ans.
        preuve: « Calculus for PROST 15 » (Banque mondiale, 2019), éq. 112
        etat: a_trancher
        raison: >-
          Convertir les droits acquis au diviseur de la génération de
          l'assuré, plutôt qu'à celui de l'année de bascule, change la part
          figée de tous les actifs (scénarios 3 et 5, page Coût) : le
          propriétaire tranche, le choix actuel du dépôt étant celui de la
          Pologne (voir diviseur_pologne).
      - quoi: >-
          Il impute les salaires manquants par leur moyenne revalorisée. Dans
          le dépôt, une année sans montant vaut zéro (`web/releve_lu.py:634,
          648-654`).
        preuve: « Calculus for PROST 15 », éq. 116
        etat: a_reprendre
        chantier: "138.11"
      - quoi: >-
          Il produit, par individu, le taux de remplacement initial
          (sur le salaire moyen et sur le dernier salaire), le taux
          de remplacement au décès, le taux de rendement interne
          réel et la valeur actuelle nette d'être couvert. Le dépôt
          ne rend que le taux au départ (simulateur.py:278-331). Il
          n'a de rendement interne que pour le pilier capitalisé
          (capitalisation.py:349), et aucun taux au décès, alors que
          c'est précisément ce que change la double indexation de la
          proposition (revalorisation.py:860-906).
        preuve: « Calculus for PROST 15 », § 5.5, éq. 161, p. 104
        verification: >-
          Méthode : ce sont les indicateurs standards de cycle de
          vie, chiffrables sur les cas types du dépôt. Repris le 7
          octobre 2026 (action 138, étape 9) : le rendement interne
          réel, la valeur actuelle nette et le taux de remplacement au
          décès des six systèmes (`cycle_de_vie.py`) ; le taux initial
          sur le salaire moyen se lit de la pension de départ et du
          salaire moyen de l'année.
        etat: repris
        chantier: "138.9"
    bilan: >-
      Il fait mieux sur la transition : diviseur de la génération de
      l'assuré pour les droits acquis (à trancher), imputation des
      salaires manquants, indicateurs individuels de cycle de vie. Le
      dépôt a déjà son équivalent de dette implicite (cout.py:3460-3527)
      ; l'outil reste non téléchargeable.
    sas: [banque_mondiale_prost]
    lu_le: 2026-10-04
    lu_dans:
      - https://documents1.worldbank.org/curated/en/099061024110535659/pdf/P1777231d8367c0111800816452e83c58d7.pdf
    note: >-
      L'outil n'est pas téléchargeable : la Banque mondiale le remet sur clé
      USB en formation (« World Bank property »).

  - id: modeles_ocde
    nom: Les modèles de pension de l'OCDE
    auteur: OCDE (à l'origine APEX, d'Axia Economics)
    pays: international
    nature: cas_types
    publication: documente
    documentation:
      - https://doi.org/10.1787/e40274c1-en
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition]
    couvre: >-
      Les taux de remplacement et le patrimoine retraite par pays, pays
      notionnels compris, sous des hypothèses publiées : inflation 2 %,
      salaires réels +1,25 %, actualisation 1,5 %, mortalité de l'ONU par
      génération.
    confrontation: >-
      Des résultats publiés à retrouver : le taux de remplacement d'une
      carrière complète, sous ses hypothèses.
    fait_mieux:
      - quoi: >-
          Il calcule le patrimoine retraite, valeur actuelle des pensions à
          1,5 % sur une mortalité de cohorte ; le dépôt n'en a pas (absent,
          cherché en vain).
        preuve: Pensions at a Glance 2025, p. 160-161
        verification: >-
          Repris le 7 octobre 2026 (action 138, étape 9) :
          `cycle_de_vie.py` le calcule sous ses conventions, sur la
          survie de génération du dépôt. Sous ses hypothèses (jeu
          `ocde_2025`), la valeur d'un euro de rente est la sienne à 3 %
          près pour un homme ; pour une femme, 3 à 8 % sous la sienne,
          la mortalité de l'ONU la faisant vivre plus longtemps que
          celle de l'INSEE (tests/test_cycle_de_vie_references.py).
        etat: repris
        chantier: "138.9"
      - quoi: >-
          Il publie, pour la France et une carrière de 22 à 65 ans, des taux
          de remplacement bruts de 56,6, 56,6 et 47,4 % à 0,5, 1 et 2 salaires
          moyens, un taux net de 70,0 %, un patrimoine retraite de 11,5 années
          de salaire pour les hommes et de 13,1 pour les femmes. Le dépôt n'a
          ni jeu macroéconomique « OCDE » (prix +2 %, salaires réels +1,25 %)
          ni témoin qui s'y confronte.
        preuve: Pensions at a Glance 2025, tableaux 4.1, 4.4, 4.6 et 5.4
        verification: >-
          Repris le 7 octobre 2026 (action 138, étape 9) : le jeu
          `ocde_2025` (`macro/hypotheses_projection.yaml`) et le témoin
          tests/temoins/ocde_pensions.json, lu par l'API SDMX. Le taux
          brut se retrouve à 5,5 points près : le régime général du
          dépôt sert 42,7 % au salaire moyen, et l'écart est celui de
          l'Agirc-Arrco, dont l'OCDE projette un quart de plus que la
          convention du COR que le dépôt suit.
        etat: repris
        chantier: "138.9"
      - quoi: >-
          Son taux de remplacement net compte l'impôt et les
          cotisations sur le salaire comme sur la pension : 70,0 %
          net contre 56,6 % brut au salaire moyen. Le net du dépôt
          ne retire que 9,1 % à la pension et fait le salaire net
          sans impôt (contexte.py:676-700).
        preuve: >-
          SDMX DSD_PAG@DF_PRR, NPRR100 = 70 (2024) ; Pensions at a
          Glance 2025, « Net pension replacement rates » : « higher
          effective tax and social contribution rates that people
          pay on their earnings than on their pensions »
        verification: >-
          Méthode : le revenu disponible est la mesure de l'OCDE
          comme de la RGS ; l'impôt sur le revenu dépend du foyer,
          et le 138.2 doit le dire.
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il publie les âges et les durées de la retraite. Âge de
          départ d'une carrière entrée à 22 ans : 64,3 ans pour un
          départ en 2024, 65 ans pour une entrée en 2024. Âge
          effectif de sortie du marché du travail en 2024 : 61,9 ans
          (hommes), 62,4 (femmes). Années de vie après la sortie :
          22,5 et 26,1. Le dépôt n'a ni indicateur de durée de
          retraite, ni témoin qui se confronte à ces âges.
        preuve: >-
          SDMX DSD_PAG@DF_PAG : CRPLF22, FRPLF22, ELMEA, EYLME
          (France)
        verification: >-
          Âges cohérents avec L. 161-17-2 et L. 161-17-3 dans leur
          rédaction issue de la LFSS pour 2026
          (JORFARTI000053227007). Repris le 7 octobre 2026 (action
          138, étape 9) : la durée de retraite des cas types, et les
          65 ans d'une carrière entrée à 22 ans en 2024, que le pilote
          du dépôt retrouve (tests/test_cycle_de_vie_references.py) ;
          l'âge effectif de sortie et les années qui le suivent sont
          des mesures de population, avec l'étape 14.
        etat: repris
        chantier: "138.9"
    bilan: >-
      Il fait mieux sur les indicateurs : patrimoine retraite, taux nets
      après impôt, durées de retraite, tous publiés pour la France et
      lisibles par l'API SDMX. Sur la France, il est à jour : la LFSS
      pour 2026 ne touche pas ses carrières types.
    manifeste: [ocde_pensions_at_a_glance]
    lu_le: 2026-10-04
    lu_dans:
      - https://doi.org/10.1787/e40274c1-en
      - https://sdmx.oecd.org/public/rest/data/OECD.ELS.SPD,DSD_PAG@DF_PRR,1.0/FRA..........?format=csvfilewithlabels

  - id: ageing_report
    nom: Ageing Report et ses fiches pays
    auteur: Commission européenne et Comité de politique économique (AWG)
    pays: international
    nature: projection
    publication: documente
    documentation:
      - https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en
    licence: sans objet
    usage: resultats_publies
    confronte: [cout, proposition]
    couvre: >-
      Les projections de chaque État par son propre modèle, revues par les
      pairs ; la fiche de chaque pays décrit son modèle. La France y est
      projetée avec Destinie.
    depend_de: [destinie_2]
    confrontation: >-
      Des résultats publiés à retrouver : la dépense de pensions de la
      France jusqu'en 2070, et celle des pays notionnels.
    ecarts:
      - constat: >-
          La fiche France projette la loi du 14 avril 2023 entière
          (§ 3.3 et tableau 14 : la réforme « should reduce the
          number of pensioners by 1.3% in 2040 »).
        tranche: >-
          La LFSS pour 2026 (loi n° 2025-1403, art. 105) décale le
          calendrier : 64 ans dès la génération 1969 au lieu de
          1968, 170 trimestres pour les assurés nés du 1er janvier
          1963 au 31 mars 1965, 172 dès 1966. Une confrontation
          devra attendre l'édition 2027, ou corriger l'effet de la
          réforme.
        preuve: >-
          JORFARTI000053227007 (LFSS 2026, art. 105) ; décrets n°
          2026-344 et 2026-345 du 7 mai 2026
    fait_mieux:
      - quoi: >-
          Il décompose la dépense en dépendance, couverture, prestation et
          marché du travail ; le dépôt n'a rien de tel, et suppose la
          couverture constante (`cout.py:58`).
        preuve: Ageing Report 2024, encadré I.1.1 et tableau I.1.10
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Pour la France, il projette 14,4 % du PIB en 2022 et 13,6 % en
          2070 : dépendance +6,0 points, couverture −2,2, prestation −3,4, un
          ratio de prestation qui passe de 47 à 37 %. Le dépôt ne s'y
          confronte pas ; il y faudrait la décomposition par scénario, puis
          l'Ageing Report sous les hypothèses macroéconomiques de l'AWG.
        preuve: fiche France de l'Ageing Report 2024, tableaux 7, 9 et 10
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il soumet la projection à des scénarios standard. Effets
          en 2070 pour la France : +2 ans d'espérance de vie, +0,7
          point de PIB ; fécondité −20 %, +1,2 ; migration ±33 %,
          −0,6 et +0,7 ; emploi des seniors +10 points, −0,5 ;
          productivité (PTF) convergeant vers 1,0 % ou 0,6 %, −0,4
          et +0,7. Le dépôt n'a que les variantes de productivité et
          de chômage du COR (hypotheses_projection.yaml:92-160),
          aucune de démographie.
        preuve: Fiche France, tableau 17, p. 38
        verification: Méthode commune de l'AWG ; les variantes INSEE existent.
        etat: a_reprendre
        chantier: "138.7"
      - quoi: >-
          Il décompose aussi le flux des pensions nouvelles :
          nombre, durée de cotisation, taux d'acquisition, salaire
          de référence, facteur de soutenabilité, mois servis la
          première année. Pour un système notionnel, le facteur de
          soutenabilité est l'effet du diviseur. Le dépôt n'a pas
          cette décomposition.
        preuve: Fiche France, tableau 14, p. 34
        verification: Méthode commune de l'AWG.
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il confronte sa projection précédente à l'observé et
          décompose l'erreur. Pour 2019-2021, la projection de 2021
          (14,8 / 16,2 / 15,3 % du PIB) est comparée à la dépense
          réelle (14,5 / 15,7 / 14,7 %), l'écart venant surtout des
          hypothèses. Il décompose aussi les révisions d'une édition
          à l'autre. Le dépôt a un contrôle externe, le COR
          (limites.md:2874-2881), mais ne rejoue jamais sa
          projection depuis une année passée.
        preuve: Fiche France, tableaux 18-20, p. 40-42
        verification: >-
          Méthode : une rétro-projection depuis une année ancienne,
          ancrée comme aujourd'hui sur la dernière année connue,
          mesurerait l'erreur propre du moteur du coût.
        etat: a_reprendre
        chantier: "138.19"
      - quoi: >-
          Il publie la dépense nette d'impôts et de cotisations des
          retraités (12,8 % du PIB en 2022, 12,1 % en 2070, contre
          14,4 et 13,6 en brut), les cotisations (11,1 %) et le
          solde (−3,3 %). La page Coût du dépôt est en brut.
        preuve: Fiche France, tableau 7, p. 23
        verification: >-
          Définition AWG : « Net pension expenditure excludes taxes
          on pensions and compulsory social security contributions
          paid by beneficiaries ».
        etat: a_reprendre
        chantier: "138.3"
    bilan: >-
      Il fait mieux sur l'analyse de la dépense : décomposition,
      scénarios standard, rétro-évaluation de ses propres projections,
      dépense nette. Sur la France, il est antérieur à la suspension de
      2025.
    sas: [ageing_report_2024]
    lu_le: 2026-10-04
    lu_dans:
      - https://economy-finance.ec.europa.eu/publications/2024-ageing-report-economic-and-budgetary-projections-eu-member-states-2022-2070_en
      - https://economy-finance.ec.europa.eu/document/download/e412927a-ea31-406d-bb6c-c925914123e9_en
    note: L'Ageing Report de 2027 n'est pas encore publié.

  - id: ilo_pensions
    nom: ILO/PENSIONS
    auteur: Organisation internationale du travail
    pays: international
    nature: projection
    publication: sur_demande
    code: https://qpss.ilo.org/APT
    licence: droits réservés (OIT, unité PFACTS)
    usage: resultats_publies
    confronte: [cout]
    couvre: >-
      Un outil actuariel de projection par cohortes, en ligne, sur compte.
    confrontation: >-
      Par sa méthode, que son guide technique de 2018 publie avec ses
      formules ; l'outil lui-même reste derrière un compte.
    fait_mieux:
      - quoi: >-
          Il projette des flux par cohorte, année par année, avec
          des probabilités de transition entre états (décès,
          retraite, retrait, entrées), une densité de cotisation, un
          taux de couverture et un facteur de recouvrement, sur la
          distribution des droits passés et des revenus ; la page
          Coût du dépôt pondère des cas types (`cout.py:53-62`).
        preuve: >-
          « The ILO Pension Model — A Technical Guide » (OIT, 2018),
          partie II, § 1.1, p. 9 et 12-14, lu sur
          researchrepository.ilo.org
        etat: a_reprendre
        chantier: "138.14"
      - quoi: >-
          Il calcule le taux de cotisation qui équilibre la
          répartition, décomposé en rapport de dépendance du système
          (pensionnés sur cotisants) fois rapport de remplacement du
          système (pension moyenne sur revenu assuré moyen). Il
          calcule aussi la prime moyenne générale sur une période,
          réserves comprises, et le taux qui tient un ratio de
          réserve cible. La page Coût du dépôt donne le solde, le
          coefficient d'équilibre (cout.py:108-118) et un taux de
          TVA requis (cout.py:2692-2715), mais aucun taux de
          cotisation d'équilibre.
        preuve: >-
          Guide technique, partie II, § 1.2, p. 19-21 : « C_t^PAYG =
          d_t · r_t », « Level contribution rate »
        verification: >-
          Méthode actuarielle standard. Le COR publie lui aussi le
          levier du taux de prélèvement, que le 138.3 nomme « tax
          gap ».
        etat: a_reprendre
        chantier: "138.19"
    bilan: >-
      Il fait mieux sur la projection actuarielle : une population par
      états et ses transitions, et les taux de cotisation d'équilibre.
      Il n'est pas ouvert, et son guide technique de 2018 suffit à en
      confronter la méthode.
    sas: [oit_ilo_pensions]
    lu_le: 2026-10-04
    lu_dans:
      - https://qpss.ilo.org/APT
      - https://researchrepository.ilo.org/view/pdfCoverPage?instCode=41ILO_INST&filePid=13100838450002676&download=true
    note: >-
      Le FMI n'a pas de modèle public : il évalue ceux des États (le
      Luxembourg, en décembre 2025, sur le modèle de l'OIT écrit en LIAM2).

  - id: og_core
    nom: OG-Core
    auteur: PSLmodels
    pays: international
    nature: projection
    publication: ouvert
    code: https://github.com/PSLmodels/OG-Core
    licence: CC0 1.0
    usage: copier
    confronte: [proposition, cout]
    couvre: >-
      Un modèle à générations imbriquées, en Python, avec un module de
      comptes notionnels à l'italienne : rendement au choix (taux d'intérêt,
      PIB courant, PIB de long terme), coefficient de conversion de forme
      italienne.
    confrontation: >-
      Un calcul à rejouer : les effets d'équilibre général d'une bascule en
      comptes notionnels, que le dépôt ne modélise pas.
    ecarts:
      - constat: >-
          La condition du travail ignore la pension notionnelle : le
          coin fiscal vaut 1 − tau_payroll − MTR
          (household.py:760-780). deriv_theta et deriv_NDC
          (pensions.py:568-649) ne sont appelés nulle part. La
          cotisation notionnelle y agit donc comme un pur impôt, à
          l'inverse du principe du compte et de sa propre docstring.
        tranche: >-
          Leur code au commit 10d3577 (grep : aucun appel hors de
          pensions.py). La note du registre (commit b690537) reste
          vraie.
        preuve: ogcore/household.py:760-780 ; ogcore/pensions.py:568-649
      - constat: >-
          tax.py:303-305 passe Y = 1 à pension_amount, avec le
          commentaire « TODO: replace '1' with Y ». Or, avec
          l'option « Curr GDP » qu'offre default_parameters.json,
          g_ndc et g_dir indexent Y[1:] (pensions.py:785-786 et
          812-813). Le « PIB courant » que le registre annonce ne
          peut donc pas tourner dans le calcul des impôts nets.
        tranche: >-
          Lecture de leur code : un entier ne s'indexe pas.
        preuve: ogcore/tax.py:303-305 ; ogcore/pensions.py:768-790
      - constat: >-
          Le coefficient de conversion prend la mortalité
          stationnaire de fin de période (p.rho[-1]) pour toutes les
          cohortes, et un âge de départ unique (issue #1014). Le
          long de la transition, aucune génération n'a son propre
          diviseur. Le terme de survie indR et la correction de
          fréquence k_ret valent zéro par défaut.
        tranche: >-
          Leur code. Le diviseur du dépôt, sur table de génération à
          l'âge et au mois exacts (conversion.py:203-256), est plus
          exact.
        preuve: >-
          ogcore/pensions.py:820-855 et 404-407 ;
          default_parameters.json (indR, k_ret = 0)
    bilan: >-
      Rien de mieux sur l'arithmétique : son diviseur est stationnaire,
      et la réversion et la fréquence de versement n'y sont que des
      paramètres nuls par défaut. Son seul apport possible, l'équilibre
      général, est hors du champ du dépôt, et faussé par une marge du
      travail qui traite la cotisation notionnelle en impôt.
    sas: [og_core]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/PSLmodels/OG-Core
    note: >-
      Version 0.20.3 sur PyPI au 1er octobre 2026. Le seul code ouvert
      établi qui calcule une pension notionnelle ; GitHub, GitLab, le CRAN et
      PyPI n'en portent pas d'autre, hors deux dépôts personnels.
      Comparé au dépôt le 1er octobre 2026 au commit `b690537`. La comparaison
      y trouve la dérivée notionnelle (`pensions.py:603`) absente de la
      condition du travail (`household.py:760-780`), et `tax.py:303` qui porte
      encore « TODO: replace "1" with Y ».
