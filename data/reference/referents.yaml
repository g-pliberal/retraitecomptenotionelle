  - id: ines
    nom: Ines
    auteur: INSEE, DREES et Cnaf
    nature: microsimulation_statique
    publication: ouvert
    code: https://gitlab.com/insee_drees_cnaf/ines-public
    documentation:
      - https://ines-public-e766af.gitlab.io/
      - https://www.insee.fr/fr/information/2021951
    licence: CeCILL 2.1 (programmes) ; ODbL et DbCL (paramètres)
    usage: executer_a_part
    confronte: [scenario_1, cout]
    couvre: >-
      L'ASPA et l'ASI (`R/14_minima_pa.R`), la CSG, la CRDS et la CASA des
      pensions selon le revenu fiscal (`R/12_cotisations.R`), l'impôt ; les
      pensions viennent des données de l'ERFS, qu'il ne simule pas.
      Législations 2016 à 2022 en SAS, 2023 et 2024 en R.
    confrontation: >-
      Des paramètres et des calculs du foyer à comparer : l'ASPA et les
      prélèvements des pensions, une seconde source indépendante de
      LexImpact.
    ecarts:
      - constat: >-
          Il fait payer la cotisation maladie de 1 % aux pensions exonérées de
          CSG : `case_when(exo_csg == 1 ~ coprmal, reduc_csg == 1 ~ 0, …)`
          (`R/12_cotisations.R:2016-2017`).
        tranche: >-
          D. 242-9, 1°, du code de la sécurité sociale ; l'écart est le sien
        preuve: >-
          `R/12_cotisations.R:2016-2017`, au commit `a55816c`
      - constat: >-
          L'exonération de CSG des pensions des allocataires de l'ASPA lui
          manque, « écart à la législation » qu'il déclare
          (`R/12_cotisations.R:2006-2010`).
        tranche: >-
          L. 136-1-2, II 1°, lu dans l'index LEGI du dépôt ; l'écart est le
          sien, et déclaré
        preuve: >-
          `R/12_cotisations.R:2006-2010`, au commit `a55816c`
      - constat: >-
          abat_aspa_celib et abat_aspa_couple valent 0 en janvier
          2026 (param_presta_mensuel.xlsx, Minima, l. 5-6). Avant,
          il suit les relèvements du SMIC en cours d'année : mai
          2022, août 2022, mai 2023, novembre 2024.
        tranche: >-
          R. 815-29, en vigueur, prend le SMIC « en vigueur au 1er
          janvier de l'année » ; F16871 (23 juin 2026) donne pour
          2026 un abattement de 1 640,72 € par trimestre pour une
          personne seule, de 2 734,55 € pour un couple. Ines a tort.
        preuve: LEGIARTI000029968931 ; service-public F16871
      - constat: >-
          retrCP_t5, la part complémentaire des anciens cadres du
          dernier quintile, vaut 64,9 pour 2020, contre 0,65 les
          autres années (param_prelev.xlsx, onglet Imput, l. 11). La
          pension brute et le 1 % de ces retraités en sortent faux
          pour la législation 2020.
        tranche: >-
          Faute de frappe : un pourcentage saisi pour une part. Le
          reste de la série (0,652 de 2019 à 2025) tranche.
        preuve: >-
          param_prelev.xlsx, Imput, l. 11, colonne valeur_INES_2020
          ; usage : R/12_cotisations.R:1962, 1981
    fait_mieux:
      - quoi: >-
          Il fixe le taux de CSG des pensions selon le revenu fiscal de
          référence et le nombre de parts ; le dépôt retire 9,1 % à tous
          (`prelevements_remuneration.yaml:705`).
        preuve: >-
          `R/12_cotisations.R:361-376`, au commit `a55816c`
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il prélève la cotisation maladie de 1 % sur les retraites
          complémentaires du privé (D. 242-8, LEGIARTI000037456300),
          dont il impute la part par catégorie et quantile ; le
          dépôt l'omet par convention
          (`prelevements_remuneration.yaml:718`). Son exonération
          est fausse (écart au registre) : la règle est D. 242-9
          (LEGIARTI000043870910), exonération sous le seuil du taux
          réduit en N−2 ou en N−3, et pour les allocataires de
          l'ASPA.
        preuve: >-
          `R/12_cotisations.R:1956-1998`, au commit `a55816c`
        etat: repris
        chantier: "138.2"
      - quoi: >-
          Il sert l'ASPA d'un couple sous le plafond du couple, sur des
          ressources qui comptent les revenus d'activité abattus et le
          patrimoine, et ne sert au membre seul éligible que le montant d'une
          personne seule. Le dépôt applique le barème d'une personne seule et
          ne compte que les pensions (`droit/foyer.py:125-128`).
        preuve: >-
          `R/14_minima_pa.R:165-177, 254-266`, au commit `a55816c`
        etat: repris
        chantier: "138.2"
      - quoi: >-
          L'ASPA reste hors de l'assiette de la CSG, de la CRDS et
          de la CASA : il calcule ces prélèvements sur les pensions
          seules, puis l'ASPA. En mode net, le site retire 9,1 % à
          toute la somme servie, ASPA comprise (contexte.py:668-670
          ; moteur/js/contexte.js:688-691 ;
          moteur/js/pages.js:3678-3687). La page dit « appliqué ici
          à tout le monde » (pages.js:2094-2096), sans dire que
          l'ASPA n'y est jamais soumise. Un allocataire sans autre
          ressource y perd 95 € par mois.
        preuve: >-
          R/12_cotisations.R:1939-2037 (assiette : zrsti, les
          pensions) ; l'ASPA vient ensuite, sans prélèvement
          (R/14_minima_pa.R:254-266, 450-474) ; commit a55816c
        verification: >-
          L. 136-1-2, I et II 1° (LEGIARTI000051289679) : l'assiette
          est le revenu de remplacement, et les pensions des
          titulaires d'un avantage non contributif en sont exclues.
          retraitesdeletat.gouv.fr, « Les prélèvements sociaux et
          les exonérations » : l'ASPA et l'ASI sont au nombre des
          prestations exonérées. Ines omet l'exonération de la
          pension de l'allocataire (écart au registre) : on ne lui
          prend que la règle sur l'ASPA elle-même.
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il calcule l'impôt sur le revenu des pensions : abattement
          de 10 %, avec un plancher par pensionné et un plafond par
          foyer ; abattement des personnes de 65 ans ou plus et des
          invalides ; CSG déductible de 3,8, 4,2 ou 5,9 % ; parts et
          demi-parts. Le dépôt n'en calcule aucun. Le site affiche
          le net « avant impôt sur le revenu » (pages.js:2094-2096),
          et la page Coût n'a pas d'effet retour par l'impôt (138.5
          prévoit de le borner par l'IPP). L'abattement de 10 % sert
          aussi au RFR que 138.2 doit estimer.
        preuve: >-
          R/07_impot_revenus.R:244-276 (abattement au plancher par
          personne, plafonné au foyer) et 1875-1888 (P0580 à P0610)
          ; param_prelev.xlsx, onglet IR (min_abatt_prb_indiv 450 €,
          max_abatt_prb_foyer 4 399 €, impôt 2025) et onglet cotis,
          l. 280, 287-289 (CSG déductible) ; commit a55816c
        verification: >-
          CGI art. 158, 5 a. Version du 1er janvier au 30 juin 2026
          (LEGIARTI000053542725) : 10 %, plafond de 4 399 € « au
          montant total des pensions […] de l'ensemble des membres
          du foyer fiscal », plancher de 450 €. Version en vigueur
          depuis le 1er juillet 2026 (LEGIARTI000054373673) : 4 439
          € et 454 €. Il est à jour pour 2024 et 2025, les années
          qu'il simule.
        etat: a_reprendre
        chantier: "138.5"
      - quoi: >-
          Il tient le barème de l'ASPA au mois depuis janvier 2021,
          1er juillet 2022 compris. De 2011 à 2020, il porte la
          moyenne de l'année, avec la revalorisation d'avril au
          prorata. Le dépôt ne porte qu'une valeur par an
          (_en_vigueur, scenarios/actuel.py:1571-1585). De 2009 à
          2018, il applique dès janvier le montant d'avril : en
          2012, 9 325,98 € au lieu de 8 907,34 € jusqu'en mars. 2008
          et 2013 n'ont pas de ligne et sont projetés sur les prix.
          Le 1er juillet 2022 est écarté
          (minimum_vieillesse.csv:33-35, 63-80).
        preuve: >-
          param_presta_mensuel.xlsx, onglet Minima, l. 2-4 (mv_mi,
          mv_plfi, mv_plfc), colonnes jan_2021 à janv_2026, dont
          juillet_2022 = 11 441,49 € ; 2012 = 9 221,32 € = (3 × 8
          907,34 + 9 × 9 325,98) / 12 ; commit a55816c
        verification: >-
          D. 815-1 (LEGIARTI000020562595) : montants « à compter du
          1er avril » 2009, 2010, 2011 et 2012. Loi n° 2022-1158,
          art. 9 (JORFARTI000046186749) : coefficient de 1,04 au 1er
          juillet 2022. Circulaire Cnav 2024-39 : 12 411,44 € par an
          en 2025, valeur d'Ines. Il cite comme source les barèmes
          de l'IPP (baremes_ipp), qui portent les dates exactes :
          une seule confirmation.
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il cale le recours à l'ASPA par type de ménage, par tirage
          sur les effectifs servis : personnes seules, couples à un
          et à deux allocataires (442 756, 107 923 et 12 164 en
          2024). Le dépôt sert l'ASPA à tout ayant droit au scénario
          1 (limites.md:395-399). Pour la garantie de la
          proposition, il retient un recours uniforme de 50 %,
          mesuré sur les seules personnes seules
          (config.py:868-877).
        preuve: >-
          R/14_minima_pa.R:327-475 (tirage_rec sur trois cibles) ;
          param_presta_mensuel.xlsx, Minima, l. 7-9 ; commit a55816c
        verification: >-
          méthode : les cibles sont des effectifs servis, sur le
          champ de l'ERFS. Le taux de recours qu'elles impliquent
          demande les ayants droit, donc une population : ce n'est
          plus proche du réel qu'avec des microdonnées.
        etat: a_reprendre
        chantier: "138.14"
      - quoi: >-
          Il sert l'ASI aux invalides avant l'âge de l'ASPA, seuls
          ou en couple. Il calcule au barème du couple l'ASPA d'un
          allocataire dont le conjoint touche l'ASI. Le dépôt ne
          porte pas l'ASI
          (regles/inaptitude_au_travail.yaml:209-212).
        preuve: >-
          R/14_minima_pa.R:270-316 (D.2 et E, circulaire Cnav
          2007/15, § 241) ; commit a55816c
        verification: >-
          D. 815-1, dernier alinéa (LEGIARTI000036760292) : le
          barème du couple s'applique à l'ASPA du demandeur dont le
          conjoint bénéficie de l'ASI (L. 815-24).
        etat: a_trancher
        raison: >-
          L'ASI complète une pension d'invalidité jusqu'à l'âge de
          l'ASPA. Le domaine de l'invalidité du dépôt sert la
          pension, pas ce minimum : au propriétaire de dire s'il
          entre au scénario 1.
      - quoi: >-
          Il impose les rentes viagères à titre onéreux sur une
          fraction fixée par l'âge : 70, 50, 40 ou 30 %. Le dépôt
          traite la rente du pilier capitalisé en rente à titre
          gratuit (prelevements_remuneration.yaml:724-730).
        preuve: >-
          R/07_impot_revenus.R:327-338 ; param_prelev.xlsx, IR,
          rvto_tx1-4 (depuis 1979)
        verification: >-
          méthode : c'est le droit des rentes volontaires, pas celui
          d'un pilier obligatoire.
        etat: ecarte
        raison: >-
          Le dépôt a tranché pour une rente issue d'une cotisation
          obligatoire, et l'écrit (limites.md, § 5 ante ter, point
          3).
    bilan: >-
      Ines fait mieux que le dépôt sur tout ce qui entoure la pension
      d'un retraité : le net selon le RFR et les parts, le 1 % des
      complémentaires, l'ASPA du couple sur les ressources du foyer et
      hors des prélèvements, l'impôt, le barème de l'ASPA daté. Il ne
      fait rien sur la pension elle-même ni sur la réversion, qui sont
      des données. Deux de ses paramètres sont faux : l'abattement de
      l'ASPA de 2026 et une part complémentaire de 2020.
    sas: [insee_ines]
    lu_le: 2026-10-04
    lu_dans:
      - https://gitlab.com/insee_drees_cnaf/ines-public
    note: >-
      Dernier commit le 16 juin 2026 (Ines 2024.1). Ses paramètres sont ceux
      de l'équipe, qui cite Légifrance, le BOFiP et les barèmes de l'IPP parmi
      ses sources. L'ERFS demande une habilitation ; les versions SAS sont
      sur Adullact (`ines-libre`).
      Comparé au dépôt le 1er octobre 2026 au commit `a55816c`, du 16 juin.

  # ---- La statistique publique : la DREES ---------------------------------
  # Une seule lignée : CALIPER (2013, en SAS) est devenu le module de calcul
  # de TRAJECTOiRE, publié en R sous le nom de calcul_pension, puis fondu
  # dans le paquet trajectoire ; legiretraite lui fournit ses âges. Elle calcule
  # les cas types du COR. Un accord entre eux ne compte qu'une fois.

  - id: trajectoire
    nom: TRAJECTOiRE
    auteur: DREES, bureau des retraites
    nature: microsimulation_dynamique
    publication: ouvert
    code: https://git.drees.fr/drees_code_public/modeles/trajectoire
    documentation:
      - https://drees_code_public.pages.drees.fr/modeles/trajectoire/
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%208_TRAJECTOIRE_DREES.pdf
    licence: EUPL-1.2
    usage: executer_a_part
    confronte: [scenario_1, cout]
    couvre: >-
      Tous les régimes, ramenés à huit grands — fonction publique de l'État,
      territoriale et hospitalière, salariés agricoles, régime général,
      régimes spéciaux « modélisés comme la SNCF », indépendants, libéraux
      « modélisés comme la médecine », exploitants —, avec l'Agirc-Arrco,
      l'Ircantec, le RAFP et les complémentaires des indépendants et de la
      MSA. Droits directs seulement, ni réversion ni ASPA ; générations 1942
      et suivantes ; la réforme de 2023, sans la loi du 30 décembre 2025.
    depend_de: [baremes_ipp, calcul_pension, caliper]
    version: "1.1.1 (paquet), commit 0963b57 (« trajectoire v1.1.2 »)"
    confrontation: >-
      Un calcul rejoué, fait le 5 octobre 2026 : exécuté à part dans R (la
      WSL Ubuntu du poste), sans les données du CASD, sous sa législation la
      plus récente (la loi du 14 avril 2023), sur soixante-quatre cas types
      du COR que son propre script construit (générations 1955, 1960, 1963,
      1964 et 1970, au premier âge du taux plein) et sur les onze droits
      directs de Destinie 2 (`scripts/fetch/trajectoire.py`,
      `trajectoire.R`) ; ses sorties et ses paramètres sont figés dans
      `tests/temoins/trajectoire.json`, et `tests/test_trajectoire.py` y
      confronte le scénario 1 sans R, chaque écart déclaré avec sa cause.
      Concordent : les durées, la majoration de durée d'assurance, la durée
      requise et l'âge d'ouverture hors suspension, la carrière longue, le
      taux plein, le minimum contributif à dix centimes par an près, les
      majorations de 10 %
      et le taux de celle de l'Arrco, le RAFP d'une carrière à primes
      constantes. Refaits : son salaire annuel moyen sur ses paramètres, et
      l'écart du dépôt, qui n'est que la chaîne des coefficients ; les
      points du dépôt, ceux de TRAJECTOiRE aux taux minimaux. Le reste est
      aux écarts et aux points ci-dessous.
    ecarts:
      - constat: >-
          Sans la loi du 30 décembre 2025, il ouvre les droits de la
          génération 1964 à 63 ans et lui demande 171 trimestres
          (`inst/extdata/trajectoire/ageDuree.csv:144-148, 515-516`).
          Exécuté : huit cas types de 1964 partent un trimestre plus tard
          qu'au dépôt, où la fonction publique compte déjà un trimestre de
          surcote ; l'emploi actif né en 1970 ouvre à 58 ans et 3 mois avec
          172 trimestres, à 57 ans et 9 mois et 170 au dépôt.
        tranche: >-
          la loi du 30 décembre 2025, que le dépôt certifie : 62 ans et 9
          mois, 170 trimestres ; l'écart est celui de la version publique
        preuve: >-
          data/reference/legislation/age_ouverture_requis.csv (l. 139) et
          duree_assurance_requise.csv (l. 129) ; categorie_active.csv ;
