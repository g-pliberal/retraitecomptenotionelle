# Le registre des autres modèles — docs/architecture.md, § 3.4
# ==============================================================
# Aucun modèle ne fait autorité sur la loi. Chacun confirme ou contredit, sur
# ce qu'il couvre, et un écart se tranche par la preuve (§ 3.3) : le texte tel
# que la caisse l'applique l'emporte sur l'exemple officiel, l'exemple sur les
# autres modèles, et tous sur le nôtre. Ce registre dit, pour chaque modèle,
# ce qu'il vaut comme confirmation et ce qu'il reste à en tirer.
#
# La note 0001 l'avait prévu ; il est né le 1er octobre 2026, à la demande du
# propriétaire : « une liste exhaustive ». Il recense donc aussi les modèles
# dont seuls la méthode ou des résultats sont publiés, pour qu'on sache ce qui
# existe et ce qui ne se lit pas ; et, à l'étranger, ceux des pays à comptes
# notionnels et des organisations internationales, qui confrontent
# l'arithmétique de la proposition. Les modèles des autres administrations
# étrangères sont recensés par le COR (séance du 5 mars 2020, document n° 4).
#
# Ce qui n'y est pas, et pourquoi. Les simulateurs officiels des caisses : ce
# sont des sources d'APPLICATION, au registre des sources, que le § 3.5 dit
# comment interroger. Les modèles qui ne confrontent rien du dépôt : la
# macroéconomie (Mésange, e-mod.fr de l'OFCE), la politique familiale (Myriade
# de la Cnaf), les systèmes à points de 2020 (le fork de Destinie 2 de Nos
# Retraites, `salaires_pensions` de B. Scherrer). Les copies du simulateur du
# COR, que sa ligne nomme. Et les dépôts personnels que personne n'a lus.
#
# OÙ VA LE RESTE
#   l'adresse à explorer, ce qu'elle a donné .. data/sources_a_explorer.yaml,
#                                               nommée par le champ `sas`
#   une valeur ou une sortie entrée au dépôt .. data/sources.yaml, nommée par
#                                               le champ `manifeste`
#   la correspondance avec une règle .......... le champ `referents` de sa
#                                               fiche, qui cite l'`id` d'ici
#   un écart au droit ......................... la fiche, puis `ecarts` ici
#
# CHAMPS
#   id ............. identifiant court, celui que les fiches citent
#   nom, auteur .... le modèle, et qui le tient ; `pays` hors de France
#   nature ......... voir ci-dessous
#   publication .... ouvert (le code se lit) | sur_demande (après inscription
#                    ou convention) | documente (méthode et résultats publiés,
#                    pas le code) | non_public (seuls son existence et des
#                    résultats le sont)
#   code ........... l'adresse du code, quand il est ouvert ou sur demande
#   documentation .. ses autres adresses : méthode, notice, résultats
#   licence ........ telle que LUE dans le fichier ou sur la page ; « aucune »
#                    quand le code n'en porte pas, « non lue » quand on n'a
#                    pas pu la lire, « sans objet » quand rien n'est publié
#   usage .......... ce que la licence permet au dépôt (§ 3.4) : copier ;
#                    executer_a_part (GPL, EUPL, AGPL, CeCILL : seules ses
#                    sorties entrent) ; lire_et_citer (sans licence) ;
#                    selon_conditions (une licence propre, à relire avant
#                    tout usage) ; resultats_publies (le code n'est pas
#                    publié : on cite sa méthode et ses résultats)
#   confronte ...... scenario_1 (le droit réel), cout (les masses de la page
#                    Coût), proposition (l'arithmétique des comptes
#                    notionnels — jamais leurs choix, que le README décide)
#   couvre ......... régimes, règles, années de droit
#   version ........ la version confrontée, quand elle l'a été ; celle qu'on
#                    a seulement lue est dans la note
#   depend_de ...... les lignes d'ici dont il tire règles ou paramètres : deux
#                    modèles qui partagent une source ne comptent que pour
#                    une confirmation
#   confrontation .. comment on le confronte : des paramètres à comparer, un
#                    calcul à rejouer, des résultats publiés à retrouver
#   ecarts ......... chacun avec son constat, ce qui l'a tranché, sa preuve
#   fait_mieux ..... ce qu'il fait mieux que le dépôt, lu chez lui (action
#                    138) : `quoi` (l'avantage, et où en est le dépôt),
#                    `preuve` (son fichier et sa ligne, ou sa page), `etat` —
#                    a_reprendre | repris, avec le `chantier` qui le reprend
#                    (« action.étape » de la feuille de route) ; a_trancher
#                    (un choix du programme, que le propriétaire tranche) |
#                    ecarte, avec sa `raison`. Un avantage qui ne tient pas à
#                    la vérification n'y entre pas : il va à `ecarts`.
#                    Depuis le relevé du 4 octobre 2026, un point dit aussi
#                    sa `verification` : ce qui établit qu'il a raison —
#                    l'article en vigueur, la circulaire, la page officielle
#                    —, ou, pour un point de méthode, pourquoi il est plus
#                    proche du réel ; un écart au dépôt n'est pas un avantage
#   bilan .......... ce que le modèle fait de mieux que le dépôt, en somme,
#                    ou pourquoi rien, et s'il est à jour ; chaque modèle a
#                    le sien depuis le relevé du 4 octobre 2026, et le récrit
#                    à chaque relecture (`lu_le`)
#   manifeste, sas . ses lignes dans data/sources.yaml et dans
#                    data/sources_a_explorer.yaml
#   lu_le, lu_dans . la dernière lecture, et où ces faits ont été lus ; une
#                    mémoire n'est pas une source
#   note ........... ce qui ne rentre dans aucun champ
#
# NATURE
#   calculateur ................ la pension, ou la cotisation, d'une carrière
#                                donnée
#   cas_types .................. les pensions de carrières types
#   microsimulation_dynamique .. fait vivre un échantillon, carrières et
#                                pensions, année après année
#   microsimulation_statique ... applique le droit d'une année à un
#                                échantillon de ménages
#   projection ................. des masses et des effectifs, sans individus
#                                ou par groupes
#   parametres ................. des barèmes, sans calcul
#   methode .................... une méthode publiée, sans code
#
# LES FAMILLES. Un accord à l'intérieur d'une famille ne vaut qu'une
# confirmation : l'IPP (ses barèmes, OpenFisca-France-Pension, TIL, PENSIPP,
# TRAJECTOiRE, et la moitié des paramètres de retraite d'OpenFisca-France) ;
# OpenFisca-France (LexImpact, TAXIPP, Mes Droits Sociaux) ; la DREES
# (CALIPER, calcul_pension, TRAJECTOiRE, legiretraite, les cas types du COR) ;
# l'Urssaf (modele-social, modele-ti, modele-as) ; le simulateur du COR et ses
# reprises. Restent hors de toute famille, au 1er octobre 2026 : Destinie 2,
# Ines, EDIFIS, EUROMOD, Catala, et les lectures de la société civile.

referents:

  # ---- L'IPP, OpenFisca, et ce qui s'y alimente --------------------------

  - id: baremes_ipp
    nom: Barèmes IPP
    auteur: Institut des politiques publiques (IPP)
    nature: parametres
    publication: ouvert
    code: https://gitlab.com/ipp/partage-public-ipp/baremes-ipp/baremes-ipp-yaml
    documentation:
      - https://baremes.ipp.eu/parameters/regimes-de-retraites/
      - https://baremes-ipp-doc.tax-benefit.org/
    licence: Licence Ouverte
    usage: copier
    confronte: [scenario_1]
    couvre: >-
      Les paramètres de la législation sociale et fiscale datés depuis 1945
      (1930 pour le régime général) : 155 fichiers sous `retraites/`, privé,
      public et indépendants. La loi du 30 décembre 2025 y est, à effet du
      1er septembre 2026.
    confrontation: >-
      Des paramètres à comparer, valeur par valeur et date par date, à ceux
      que le dépôt lit au Journal officiel ou chez la caisse ; un écart se
      tranche au texte. La durée requise par génération y rejoint déjà celle
      que le dépôt certifie à la base LEGI : 170 trimestres pour 1964, 170
      puis 171 pour 1965, 172 pour 1966.
    ecarts:
      - constat: >-
          Le taux de cotisation des chirurgiens-dentistes s'y arrête en 2019,
          quand la caisse l'a changé en 2023.
        tranche: la caisse ; les barèmes sont en retard
        preuve: docs/decisions/0001-architecture.md (§ 14.9)
      - constat: >-
          Ses seuils de CSG des pensions s'arrêtent au 1er janvier 2025 :
          aucun pour 2026.
        tranche: >-
          les seuils de 2026 que donne service-public.fr (F2971) : 13 048,
          17 057 et 26 472 €, plus 3 484, 4 555 et 7 066 € par demi-part ; les
          barèmes sont en retard
        preuve: >-
          le répertoire `csg/remplacement/seuils/` des prélèvements sociaux,
          au commit `fe2cdff`
      - constat: >-
          Sa cotisation maladie d'Alsace-Moselle y reste à 1,5 %.
        tranche: >-
          l'Urssaf : 1,30 % depuis avril 2022, sur les pensions comme sur les
          salaires ; les barèmes sont en retard
        preuve: >-
          `mmid_am/maladie_alsace_moselle.yaml`, au commit `fe2cdff`
      - constat: >-
          E1. Dans la table de l'arrêté du 24 janvier 1994, le
          coefficient des salaires de 1957 vaut 11,875
          (reval_s_49/arrete_24_01_1994_jo_27_01_1994.yaml:25-26),
          entre 24,59 pour 1956 et 20,153 pour 1958.
        tranche: >-
          Les tables de la Cnav fixent les rapports entre années
          voisines à 1,075 et 1,135. La bonne valeur est donc
          d'environ 22,87 : c'est une coquille, l'IPP a tort.
        preuve: >-
          barème Cnav
          revalorisation_coefficient_revalorisation_salaire_cotisation_04_2013_bar
          (33,167 ; 30,851 ; 27,176 pour 1956-1958) ;
          revalorisation_salaires.csv, table d'octobre 2017 (33,465
          ; 31,128 ; 27,42)
      - constat: >-
          E2. Le minimum contributif de 636,56 € est daté du 1er
          octobre 2019 (montant_mico.yaml:105), alors que l'IPP cite
          lui-même la circulaire Cnav 2019/4 du 9 janvier 2019.
        tranche: >-
          La bonne date est le 1er janvier 2019, comme dans la série
          de revalorisation de l'IPP lui-même (1,003 au 2019-01-01).
          L'IPP se trompe de neuf mois.
        preuve: >-
          barème Cnav retraite_personnelle_montant_minimum_bar : «
          01/01/2019 | 7 638,78 € | 636,56 € »
      - constat: >-
          E3. La décote de la fonction publique vaut 0,65 % par
          trimestre pour l'année 2010
          (secteur_public/pension_civile/decote.yaml:66-70).
        tranche: >-
          La loi dit 0,625 % ; le dépôt a raison
          (decote_fonction_publique.csv, 0,00625, certifiée).
        preuve: >-
          loi n° 2003-775, article 66 (LEGIARTI000006758610) : «
          2010 : 0,625 % »
      - constat: >-
          E4. La PMR est entièrement calculée par l'IPP de 2010 à
          2026 (independants/pmr_msa.yaml, notes) : indexée sur les
          prix jusqu'en 2020, en baisse en 2015 (8 075,55 €, lignes
          :15-16), datée du 1er janvier quand les pensions étaient
          revalorisées en avril ou en octobre. Elle vaut 10 170,84 €
          au 1er septembre 2023 (:33-34), et ses montants de 2024 à
          2026 sont datés de septembre. Il n'y a qu'une série depuis
          2023.
        tranche: >-
          Le décret D. 732-111 tranche. PMRmax vaut 8 557,38 € au
          1er janvier 2022. En 2023, il y a deux séries : 8 970,86 €
          au 1er janvier pour les pensions d'avant le 1er septembre,
          revalorisés comme les pensions ; 10 170,86 € au 1er
          septembre pour les suivantes, revalorisés comme le minimum
          contributif. Une revalorisation ne peut pas être négative.
          L'IPP a tort.
        preuve: >-
          LEGIARTI000035918254, LEGIARTI000044944271,
          LEGIARTI000047961256, LEGIARTI000053365711 ; article L.
          161-25 (LEGIARTI000031781092) : « Si ce coefficient est
          inférieur à un, il est porté à cette valeur »
      - constat: >-
          E5. Pour l'Agirc de 1947 à 1955, l'IPP reprend les
          coefficients de l'Arrco (0,95 à 64 ans … 0,75 à 60 ans) et
          met 1,05 dès 65 ans
          (agirc/coefficient_de_minoration.yaml:63-69, :98-104),
          sans citer de source.
        tranche: >-
          Le COR donne pour l'Agirc 1947-1955 : 0,93 à 64 ans … 0,72
          à 60 ans, 1,00 à 65 ans, puis de 1,05 à 66 ans jusqu'à
          1,25 à 70 ans. À confirmer dans le texte d'origine de la
          convention de 1947.
        preuve: COR, document n° 13 de la séance du 28 janvier 2009, p. 15
      - constat: >-
          E6. La fonction publique s'arrête en 2012-2014 : âges
          d'ouverture et limites d'âge (aod_a, aod_s, la_a, la_s :
          dernière législation au 1er janvier 2012), durées (trimtp,
          2014). On n'y trouve ni la réforme de 2023 ni la
          suspension de 2026, que l'IPP a pourtant portées au régime
          général.
        tranche: >-
          Loi n° 2023-270 et loi n° 2025-1403, article 105 : l'IPP
          est périmé. Le dépôt porte les deux (categorie_active.csv
          : 57,25 ans pour les actifs nés à la fin de 1966, 57,75
          ans pour 1969).
        preuve: categorie_active.csv ; duree_requise_fonction_publique.csv
      - constat: >-
          E7. Les coefficients de solidarité et majorants de
          l'Agirc-Arrco s'appliquent depuis 2019 sans date de fin
          (regimes_complementaires/coeff_temp.yaml).
        tranche: >-
          Le coefficient de solidarité est supprimé pour les
          retraites prenant effet à compter du 1er décembre 2023, et
          au 1er avril 2024 pour les autres (accord du 5 octobre
          2023). L'IPP est périmé ; le dépôt le dit
          (avantages_non_contributifs.yaml:1406-1420).
        preuve: service-public.fr, actualité A15237
      - constat: >-
          E8. Le nombre d'années du salaire annuel moyen s'arrête
          aux 25 années de la génération 1948 (sam.yaml, dernière
          législation en 2008).
        tranche: >-
          Pour les pensions qui partent dès le 1er septembre 2026,
          l'article R. 173-3-2 compte 24 années avec un enfant et 23
          avec deux. L'IPP est périmé ; le dépôt applique la règle
          (droit/liquider.py:1861-1874).
        preuve: R. 173-3-2 (LEGIARTI000054589934, en vigueur le 1er août 2026)
      - constat: >-
          E9. Plusieurs séries s'arrêtent avant 2026 : minimum
          contributif (1er septembre 2023), minimum de réversion
          (2021), plafond de la majoration de réversion et plafond
          de ressources (2025), salaire validant un trimestre
          (2025), AVPF (2021), RCI (2023), RAFP (2025), allocation
          supplémentaire et plafonds de l'AVTS (2022). La surcote
          parentale de 2023 et la carrière longue du régime général
          manquent.
        tranche: >-
          Les barèmes Cnav de 2026 donnent : minimum contributif 9
          075,50 € ; minimum de réversion 4 019,13 € ; plafond de la
          majoration 3 020,07 € par trimestre ; salaire validant 1
          803 € ; AVPF 2 031,38 € par mois. Le dépôt porte RCI 2026
          (21,726 et 1,347 €) et RAFP 2026 (1,4596 et 0,05671 €).
          L'IPP est en retard.
        preuve: >-
          API baremes de legislation.lassuranceretraite.fr ;
          valeurs_point.csv ; surcote_parentale.csv ;
          carriere_longue.csv
      - constat: >-
          E10. L'IPP date de 1972 (loi n° 71-1132) le passage aux
          dix meilleures années (sam.yaml, valeur au 1er janvier
          1972).
        tranche: >-
          C'est le décret n° 72-1229 qui opère ce passage, au 1er
          janvier 1973 ; la circulaire Cnav 2/72 n'en parle pas.
          L'IPP se trompe probablement d'un an ; à confirmer dans le
          texte du décret.
        preuve: >-
          notice JORFTEXT000000693828 : « ABROGATION DE L'ART. L343
          … ENTREE EN VIGUEUR : 01-01-1973 »
    fait_mieux:
      - quoi: >-
          Il porte les séries de l'AVTS (1962-2026, 4 023,51 € en 2025) et de
          l'allocation supplémentaire d'une personne seule (1956-2022). Le
          dépôt déflate sur les prix le montant de 2006
          (`scenarios/actuel.py:1570-1580`), projection qu'il dit
          « indicative » (`minimum_vieillesse.csv:40`), et met le forfait à la
          place de l'AVTS pour R. 732-70 (`droit/acquerir.py:100-109`) : fin
          1970, l'AVTS et l'allocation supplémentaire valent 457 € chez lui,
          environ 1 195 € au dépôt, et l'écart ne passe sous 3 % qu'en 1985.
          Chaque valeur reste à certifier au Journal officiel.
        preuve: >-
          `avts/montants_annuels.yaml` et
          `as/allocation_supplementaire/as_personne_seule.yaml`, sous
          `…/solidarite_insertion/minimum_vieillesse/`, au commit `fe2cdff`
        etat: a_reprendre
        chantier: "138.6"
      - quoi: >-
          Il porte la pension majorée de référence des exploitants
          agricoles de 2009 à 2026 ; le dépôt la décrit sans
          qu'aucun code la serve
          (`avantages_non_contributifs.yaml:425-451`). Mais ses
          valeurs de 2010 à 2026 sont des « Calculs IPP », indexées
          sur les prix, en baisse en 2015 et mal datées (écart au
          registre) : la série se reprend de D. 732-111 (7 596 et 6
          036 € au 1er janvier 2009, 8 557,38 € au 1er janvier 2022,
          8 970,86 € au 1er janvier 2023 et 10 170,86 € au 1er
          septembre 2023), non de lui.
        preuve: >-
          `parameters/retraites/independants/pmr_msa.yaml`, au
          commit `fe2cdff`
        etat: repris
        chantier: "138.8"
      - quoi: >-
          Il porte le salaire qui valide un trimestre outre-mer,
          plus bas qu'en métropole de 1948 à 1951 et de 1972 à 1995
          : en 1980, 1 897,5 F à La Réunion et 2 112 F aux Antilles
          et en Guyane, contre 2 586 F. Le dépôt n'a qu'un barème
          (`validation_trimestres.csv`).
        preuve: >-
          `salval/salaire_validant_trimestre/reunion.yaml` et
          `guadeloupe_guyane_martinique.yaml`, sous
          `parameters/retraites/secteur_prive/regime_general_cnav/`,
          au commit `fe2cdff`
        verification: >-
          R. 351-9 en vigueur (LEGIARTI000053335598) : pour l'assuré
          qui a travaillé dans un département de L. 751-1, « le
          montant du salaire minimum de croissance à retenir est
          celui qui est en vigueur dans ledit département » ; le
          barème de la Cnav (salaire_validant_un_trimestre) donne
          les mêmes montants
        etat: a_reprendre
        chantier: "138.6"
      - quoi: >-
          Avant 1973, le salaire de base du régime général était la
          moyenne des dix DERNIÈRES années, pas des dix meilleures.
          Le dépôt sert les dix meilleures dès 1945
          (regime_general.yaml:52, :101, et :127 pour 1972). Sa
          propre fiche cite pourtant une circulaire qui dit «
          dernières » (decote_avant_1983.yaml:303-312).
        preuve: >-
          retraites/secteur_prive/regime_general_cnav/sam.yaml:22 :
          « Précédemment, le salaire annuel moyen était établi sur
          les dix dernières années de carrière et non sur les dix
          meilleures » ; aussi retraites/independants/ram.yaml:28 ;
          commit fe2cdff
        verification: >-
          Circulaire ministérielle 20/SS du 6 février 1961, base de
          la Cnav (CR_MIN_20SS_06021961) : « calculé sur la moyenne
          des dix dernières années avant la liquidation ». Notice
          JORF du décret n° 72-1229 du 29 décembre 1972
          (JORFTEXT000000693828) : il réforme « L'ART. 74-VII
          (DETERMINATION DU SALAIRE SERVANT DE BASE…) », prononce
          l'« ABROGATION DE L'ART. L343 » et fixe l'« ENTREE EN
          VIGUEUR : 01-01-1973 ». Le changement date donc de 1973,
          pas de 1972 (écart E10).
        etat: repris
        chantier: "138.16"
      - quoi: >-
          Avant 1972, un trimestre se validait par un montant. De
          1949 à 1971, la rémunération annuelle était divisée par
          l'AVTS trimestrielle. Avant, d'autres seuils : 1 800 F de
          1946 à 1948, la retenue de 1936 à 1945, 60 cotisations
          journalières par trimestre de 1930 à 1935 (22 trimestres
          au plus). Le dépôt valide quatre trimestres par année
          travaillée, en écrivant qu'« aucun seuil de montant
          n'existait » (donnees/macro.py:269-305,
          validation_trimestres.csv:10-12).
        preuve: >-
          …/salval/salaire_validant_trimestre/metropole.yaml:3-42 :
          60 ; 15 ; 60 ; 1 800 ; 8 500 F en 1949 … 437,50 F en 1971.
          Note aux lignes :161-163 : « Un trimestre correspond à
          l'AVTS trimestrielle (jusqu'au 31/12/1962, ce montant est
          celui des villes de plus de 5 000 habitants) ». Commit
          fe2cdff.
        verification: >-
          Article R. 351-9 en vigueur (LEGIARTI000053335598) : «
          Pour la période comprise entre le 1er janvier 1949 et le
          31 décembre 1971, il y a lieu de retenir autant de
          trimestres … que le salaire annuel … représente de fois le
          montant trimestriel de l'allocation aux vieux travailleurs
          salariés au 1er janvier ». Décret n° 45-0179, article 71,
          § 2 (LEGIARTI000006760608) pour 1930-1948. Le barème de la
          Cnav donne les mêmes montants de 1949 à 1971. Les valeurs
          de 1936 à 1948 mêlent retenue et salaire (15 et 60 F chez
          l'IPP, 30 et 216 AF à la Cnav, 15 et 1 800 F au décret) :
          à relire au décret.
        etat: repris
        chantier: "138.6"
      - quoi: >-
          Avant 1973, la réversion du régime général s'ouvrait à 65
          ans, ou 60 en cas d'inaptitude. Le dépôt prête 55 ans à
          toute réversion d'avant 1982, par hypothèse
          (reversion.yaml:45-74, version avant_1982, statut
          supposee).
        preuve: >-
          …/regime_general_cnav/reversion.yaml:40-46 : 65 ans en
          1946, 55 ans en 1973, en citant le décret n° 72-1098 ;
          commit fe2cdff
        verification: >-
          Décret n° 72-1098, article 1 (LEGIARTI000006761979, en
          vigueur le 1er janvier 1973) : « L'article L. 351 du Code
          de la sécurité sociale est abrogé en tant qu'il fixe à
          soixante-cinq ans, et à soixante ans en cas d'inaptitude
          au travail, l'âge auquel le conjoint survivant a droit à
          une pension de réversion »
        etat: a_reprendre
        chantier: "138.4"
      - quoi: >-
          L'IPP a trois tables anciennes des coefficients de
          revalorisation des salaires portés au compte : arrêtés de
          1949, de 1952 et du 24 janvier 1994 (salaires de 1947 à
          1992). Le dépôt n'a que les tables de 2017 à 2026 ; avant,
          il recalcule depuis celle de 2017 et dit l'écart «
          invérifiable » (donnees/macro.py:404-470,
          limites.md:822-826). Mesuré sur une liquidation de 1994,
          ce recalcul s'écarte de la table de 1994 de −0,15 %
          (salaires de 1992-1993) à +0,83 % (salaires de 1947-1975).
          La table Cnav d'avril 2013 montre le même profil (+0,75 %)
          : ce n'est donc pas un effet d'arrondi.
        preuve: >-
          …/regime_general_cnav/reval_s_49/arrete_24_01_1994_jo_27_01_1994.yaml,
          arrete_23_06_1949_jo_29_06_1949.yaml,
          arrete_02_10_1952_jo_03_10_1952.yaml ; commit fe2cdff
        verification: >-
          Pour l'arrêté du 24 janvier 1994 (JORFTEXT000000363083),
          l'index ne garde que le dispositif ; la table est à lire
          au Journal officiel. Par ailleurs, la Cnav publie dans son
          API de barèmes les tables d'avril 2013 et d'octobre 2015
          (revalorisation_coefficient_revalorisation_salaire_cotisation_04_2013_bar
          et …_10_2015_bar), que limites.md:822 croit inaccessibles.
          Et toutes les autres : la page de ses coefficients d'avant
          avril 2013 porte quatre-vingt-six colonnes, de l'arrêté du
          14 mai 1946 à la circulaire 2012/35, lues le 5 octobre 2026
          (cnav_revalorisation_salaires_anciennes.py) ; la colonne de
          janvier 1994 y donne la table de l'arrêté du 24 janvier
          1994.
        etat: repris
        chantier: "138.16"
      - quoi: >-
          L'IPP a la série complète du minimum contributif : chaque
          revalorisation de 1984 à 2023, le minimum majoré de 2004 à
          2023, le plafond de 2012 à 2023. Le dépôt n'a que des
          ancres (minimum_contributif.csv) et les relie par les prix
          (scenarios/actuel.py:2745-2780). Trois défauts en
          résultent. Son ancre « 2007 » est en fait le montant du
          1er janvier 2008 (6 958,21 €, ligne 70), et il manque les
          ancres de 2004 et 2006. L'écart au montant réellement
          servi va de +1,1 % (2007) à +4,7 % (2019), et le majoré
          est trop haut de 4 à 8 % de 2004 à 2007. Enfin, le majoré
          est servi avant 2004, année de sa création, car aucune
          date ne borne la majoration (droit/completer.py:248-250,
          :266-272).
        preuve: >-
          …/regime_general_cnav/montant_mico.yaml : 50 dates,
          chacune avec sa circulaire Cnav ; majoré nul avant 2004
          (:357-369). Aussi
          plafond_mico/minimum_contributif_plafond_mensuel.yaml.
          Commit fe2cdff.
        verification: >-
          Barème Cnav retraite_personnelle_montant_minimum_bar :
          mêmes montants, du 1er avril 1983 (26 400 F) au 1er
          janvier 2026 (9 075,50 €), majoré « Depuis 2004 ». Article
          D. 351-2-1 : « 6 511,06 Euros par an au 1er janvier 2004 »
          (LEGIARTI000006736531), « 6 760,82 Euros par an au 1er
          janvier 2006 » (LEGIARTI000006736532), « 6 958,21 euros
          par an au 1er janvier 2008 » (LEGIARTI000017870194).
        etat: repris
        chantier: "138.15"
      - quoi: >-
          L'IPP a l'assiette publiée de l'AVPF de 1972 à 2021, en
          métropole et outre-mer (plus basse aux Antilles et à La
          Réunion jusqu'en 1995) : 169 heures de SMIC par mois, au
          SMIC du 1er juillet de l'année précédente, soit 1 715,35 €
          par mois en 2021. Le dépôt porte 1 820 heures du SMIC de
          l'année (carriere.py:510-516), une « assiette déduite du
          SMIC » (limites.md:52). Il compte ainsi 9 à 10 % de trop
          peu (18 655 € contre 20 584 € en 2021), et 12,5 % de trop
          peu avant 1982, quand la durée légale était de 40 heures.
        preuve: >-
          prestations_sociales/solidarite_insertion/minimum_vieillesse/avpf/salaire_forfaitaire/metropole.yaml:3-102,
          reunion.yaml, guadeloupe_guyane_martinique.yaml ; commit
          fe2cdff
        verification: >-
          Article R. 381-3 en vigueur (LEGIARTI000047961951) : «
          assiette forfaitaire égale, par mois, à 169 fois le
          salaire horaire minimum de croissance en vigueur au 1er
          juillet de l'année civile précédente ». Rédaction de
          1987-1994 (LEGIARTI000006750081) : le SMIC multiplié par
          52/12 de la durée hebdomadaire légale. Barème Cnav
          cotisation_salaire_avpf_bar : 1 715,35 € en 2021, 2 031,38
          € en 2026.
        etat: repris
        chantier: "138.16"
      - quoi: >-
          Pour les artisans et commerçants, le revenu annuel moyen
          passe de 10 à 25 années plus lentement que chez les
          salariés : 11 années pour les générations 1934-1935 … 24
          pour 1952, et 25 seulement dès 1953. Le dépôt applique à
          l'ORGANIC, à la CANCAVA et au RSI la table du régime
          général, qui atteint 25 dès 1948 (organic.yaml:159,
          cancava.yaml:160, rsi.yaml:37, via
          droit/liquider.py:1848-1876). Un commerçant né en 1948 a
          ainsi un revenu moyen calculé sur 25 ans au lieu de 20.
        preuve: >-
          retraites/independants/ram.yaml:59-192, qui cite les
          décrets 93-1022, 2004-144 et 2007-614 ; commit fe2cdff
        verification: >-
          Article R. 634-1-1 (LEGIARTI000006751727, du 27 avril 2007
          au 1er janvier 2026) : « Onze années pour l'assuré né en
          1934 ou 1935 ; … Vingt années pour l'assuré né en 1948 ; …
          Vingt-quatre années pour l'assuré né en 1952 »
        etat: repris
        chantier: "138.16"
      - quoi: >-
          L'IPP a la majoration pour conjoint à charge de 1948 à
          2002 et son plafond de ressources : 14 500 AF en 1948, 36
          190 AF en 1956 (la moitié de l'AVTS), 4 000 F en 1976,
          puis 609,80 €. Le dépôt la déclare absente au motif que «
          le modèle … n'a pas de conjoint »
          (avantages_non_contributifs.yaml:1384-1404). Or le moteur
          de réversion connaît désormais le conjoint et l'union
          (droit/reversion.py). Reprise le 8 octobre 2026 : fiche
          majoration_conjoint_a_charge, dans les deux moteurs, au
          barème de la Cnav, proratisée depuis 1975, ouverte aux
          soixante-cinq ans du conjoint avant 2011 et servie nominale à
          chaque échéance.
        preuve: >-
          prestations_sociales/solidarite_insertion/minimum_vieillesse/majconj/montant_majoration_conjoint_charge.yaml:3-66
          et plafond_conjoint_pour_maj_pac.yaml ; commit fe2cdff
        verification: >-
          Article L. 351-13 (LEGIARTI000023033932) : majoration
          supprimée au 1er janvier 2011, maintenue pour ceux qui la
          touchaient déjà. Décret n° 45-0179, article 72-2
          (LEGIARTI000006760610) : conjoint de 65 ans, sans avantage
          propre, sous le plafond de l'AVTS, avec un complément
          différentiel. Barème Cnav
          ancienne_prestation_mc_montant_bar : mêmes montants.
        etat: repris
        chantier: "138.17"
      - quoi: >-
          L'IPP a des coefficients d'anticipation et de majoration
          d'ajournement pour l'Agirc avant 1955 et l'Arrco avant
          1965. Chez l'Arrco, par exemple : 0,75 à 60 ans, et de
          1,05 à 1,25 au-delà de 65 ans. Le dépôt applique à toute
          date la table de l'accord de 2017
          (droit/liquider.py:2512-2523), sans aucune majoration
          d'ajournement (agirc.yaml:40), et n'a pas lu les textes de
          1947 et 1961
          (coefficients_anticipation_agirc_arrco.yaml:63-72).
        preuve: >-
          retraites/secteur_prive/regimes_complementaires/arrco/coefficient_de_minoration.yaml:68-74
          et suivantes ; agirc/coefficient_de_minoration.yaml:63-69
          et :98-132 ; aucune référence citée ; commit fe2cdff
        verification: >-
          COR, document n° 13 du 28 janvier 2009, p. 14-15 : « Il
          existait à l'origine des surcotes pour les liquidations
          après 65 ans. Ces surcotes ont été supprimées en 1955 à
          l'AGIRC et en 1965 à l'ARRCO (UNIRS) ». Les valeurs Arrco
          1957-1965 du COR (0,75 à 60 ans … 0,95 à 64 ans) sont
          celles de l'IPP ; les valeurs Agirc ne le sont pas (écart
          E5).
        etat: a_reprendre
        chantier: "138.16"
      - quoi: >-
          Pour 1948, l'IPP donne le bon salaire de référence de
          l'IGRANTE et de l'IPACTE : 0,37 F, soit 0,0564 €. Le dépôt
          porte 0,56 € (valeurs_point.csv:526 et :648), dix fois
          trop, valeur reprise d'OpenFisca-France-Pension
          (salaire_reference_igrante.yaml:35-36). Les points acquis
          en 1948 dans ces deux régimes ressortent donc dix fois
          trop peu nombreux.
        preuve: >-
          retraites/secteur_public/regimes_complementaires/ircantec/salaire_de_reference/salaire_reference_igrante.yaml:33-38
          (0,26 ; 0,37 ; 0,42 F de 1947 à 1949) et
          salaire_reference_ipacte.yaml:37-38 ; commit fe2cdff
        verification: >-
          Vérifié par la continuité de la série, au taux de 6,55957
          : 0,0396 € en 1947, 0,0564 € en 1948, 0,064 € en 1949.
          L'erreur vient de la conversion faite par
          OpenFisca-France-Pension, pas de l'original de l'IPP.
          Lu le 5 octobre 2026 au texte : annexe de l'arrêté du
          17 février 1960 (LEGIARTI000006381707), colonne « Salaire
          de référence », « 37 » [anciens francs] pour 1948, 26
          pour 1947, 42 pour 1949.
        etat: repris
        chantier: "138.16"
      - quoi: >-
          L'IPP a le minimum de réversion de 1964 à 2021 et le
          plafond de la majoration de 11,1 % de 2010 à 2025. Le
          dépôt n'applique ni l'un ni l'autre, et n'en garde que
          deux montants : 3 983,29 € (2025) et 2 400 € (2010, à
          revaloriser) (reversion.yaml:405-451).
        preuve: >-
          …/regime_general_cnav/reversion_minimum.yaml (80 dates, 3
          492,37 € en 2021 aux lignes :161-162) ;
          majoreversion_plafond.yaml:31-32 (2 993,14 € en 2025) ;
          commit fe2cdff
        verification: >-
          Barèmes Cnav retraite_reversion_montant_minimum_bar et
          retraite_reversion_plafond_ressource_majoration_retraite_reversion_bar
          : mêmes montants, plus ceux que l'IPP n'a pas (4 019,13 €
          et 3 020,07 € en 2026).
        etat: a_reprendre
        chantier: "138.4"
      - quoi: >-
          L'IPP a la valeur de service des points acquis avant 1973
          au régime de base des commerçants (1949-2019) et des
          artisans (1973-2019, puis rsi_vp jusqu'en 2021). Le dépôt
          remplace ces points par un rendement « estimé » de 9 %
          (rendements_points.csv:74-75). Ce n'est que la moitié du
          calcul : ni l'IPP ni le dépôt n'ont le nombre de points
          acquis par classe de cotisation.
        preuve: >-
          retraites/independants/pt_organic/…/valeur_point_acquis_par_cotisations.yaml:3-158,
          pt_cancava/…, rsi_vp/… ; commit fe2cdff
        verification: >-
          Barème Cnav
          ti_prestation_valeur_point_retraite_commercant_bar :
          valeur du point de 1988 à 2026 (10,7637 € pour les
          artisans, 14,84302 € pour les commerçants en 2026).
        etat: a_reprendre
        chantier: "138.18"
      - quoi: >-
          L'IPP a l'ASPA d'un couple de 2006 à 2026, les plafonds de
          ménage de l'AVTS et de l'allocation supplémentaire depuis
          1956, et l'abattement sur les revenus d'activité (0,9 et
          1,5 SMIC depuis 2015). Le dépôt n'a le couple qu'en 2026
          (minimum_vieillesse_couple.csv). Pour une personne seule,
          il lui manque 2008, 2013 et 2015. Il sert aussi 9 600 €
          sur toute l'année 2014 (minimum_vieillesse.csv:69), alors
          que ce montant ne vaut qu'à partir du 1er octobre (9
          503,89 € avant).
        preuve: >-
          prestations_sociales/solidarite_insertion/minimum_vieillesse/aspa/montant_maximum_annuel/couples.yaml
          et personnes_seules.yaml (9 503,89 au 2014-04-01, 9 600 au
          2014-10-01) ; aspa/abattement_forfaitaire/ ;
          as/plafond_ressources/ ; commit fe2cdff
        verification: >-
          Décret n° 2014-1215 du 20 octobre 2014
          (JORFTEXT000029616738) : revalorisation exceptionnelle de
          l'ASPA « au 1er octobre 2014 ». Décret n° 2014-1568 du 22
          décembre 2014 (JORFTEXT000029954019) : prise en compte des
          revenus d'activité.
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          L'IPP a le point de la CNRO (PRO BTP) de 1960 à 1998,
          l'institution Arrco des ouvriers du bâtiment. Son
          rendement dépassait celui de l'UNIRS de 1 à 3 points de
          1962 à 1975 (15,0 % contre 12,2 % en 1975). Le dépôt
          applique à tout salarié du privé d'avant 1999 le point de
          l'UNIRS, choix qu'il présente comme « une décision du
          dépôt » (en-tête de valeurs_point.csv).
        preuve: >-
          retraites/secteur_prive/regimes_complementaires/probtp/point.yaml:13-106
          et probtp/salaire_de_reference.yaml ; commit fe2cdff
        verification: >-
          Rendement calculé sur les deux séries de l'IPP : valeur de
          service divisée par le salaire de référence.
        etat: a_trancher
        raison: >-
          Il faudrait demander l'institution Arrco de l'assuré, une
          donnée que le dépôt ne recueille pas, pour une seule
          branche professionnelle.
      - quoi: >-
          L'IPP a l'histoire des prélèvements sur les pensions :
          cotisation maladie de 1 % à 2,8 % de 1980 à 1997 (2 % puis
          3,8 %, puis 1 % sur les complémentaires) ; CSG de 1,1 % en
          1991 jusqu'à 8,3 %, avec un taux réduit dès 1997 et un
          taux médian dès 2019. Le dépôt applique à toute année les
          9,1 % de 2026 (prelevements_remuneration.yaml:731-734,
          remuneration.py:549-562).
        preuve: >-
          prelevements_sociaux/cotisations_securite_sociale_regime_general/mmid_ret/avantages_de_retraite/
          ;
          prelevements_sociaux/contributions_sociales/csg/remplacement/pensions_retraite_invalidite/
          ; commit fe2cdff
        verification: >-
          Un taux de remplacement net au départ, par génération,
          demande les prélèvements de l'année du départ. Pour une
          pension servie aujourd'hui, les taux de 2026 suffisent.
          Le rendement interne net de l'étape 9 les attend aussi :
          il prélève toute la retraite aux taux de 2026
          (`cycle_de_vie.taux_de_prelevement`).
        etat: a_reprendre
        chantier: "138.9"
    bilan: >-
      L'IPP a raison contre le dépôt sur des règles anciennes ou mal
      reconstruites : les dix dernières années avant 1973, les
      trimestres d'avant 1972, la réversion à 65 ans, l'assiette de
      l'AVPF, le revenu moyen des artisans et commerçants, la série du
      minimum contributif et l'IGRANTE de 1948. Ailleurs il est
      identique au dépôt, en retard (fonction publique, plusieurs séries
      de 2021 à 2025) ou faux (dix écarts). Le barème de la Cnav,
      accessible par API, tranche presque tous les cas mieux que lui.
    manifeste: [ipp_taux_cotisation, ipp_points_independants, ipp_retraite_complementaire_liberaux]
    sas: [ipp_baremes_yaml]
    lu_le: 2026-10-04
    lu_dans:
      - https://gitlab.com/ipp/partage-public-ipp/baremes-ipp/baremes-ipp-yaml
      - docs/decisions/0001-architecture.md
    note: >-
      Dernier commit le 21 septembre 2026. Son `COVERAGE.md` dit qu'un tiers
      seulement des dates de valeur des retraites portent leur référence
      (« retraites | 116 | 2492 | 797 (32%) »). Le miroir de Framagit est
      figé depuis le 19 avril 2023 (« THIS PROJECT HAS MIGRATED ») : c'est
      pourtant lui que calcul_pension télécharge. Un dépôt voisin,
      `baremes-ipp-sources`, archive les sources hors Légifrance.
      Comparé au dépôt le 1er octobre 2026 au commit `fe2cdff`, du 21
      septembre.

  - id: openfisca_france
    nom: OpenFisca-France
    auteur: la communauté OpenFisca (LexImpact, beta.gouv, IPP…)
    nature: calculateur
    publication: ouvert
    code: https://github.com/openfisca/openfisca-france
    documentation:
      - https://openfisca.org/doc/
    licence: AGPL-3.0
    usage: executer_a_part
    confronte: [scenario_1]
    couvre: >-
      Le droit socio-fiscal, paramètres datés texte par texte. Les
      cotisations vieillesse du régime général, de l'Agirc-Arrco, de
      l'Ircantec, de la fonction publique, du RAFP et des indépendants ; la
      CSG des pensions à 3,8, 6,6 ou 8,3 % selon le revenu fiscal de
      référence, la CRDS et la CASA ; l'ASPA et l'ASI. Il ne calcule pas la
      pension, qu'il reçoit en entrée.
    depend_de: [baremes_ipp]
    confrontation: >-
      Des paramètres à comparer : le dépôt en reprend cinq séries, au niveau
      `haute`, jamais `certifiee`, et les recoupe contre l'INSEE, l'Urssaf ou
      la base LEGI (`scripts/verifier_donnees.py`). À venir : la CSG de la
      pension nette, par foyer.
    ecarts:
      - constat: >-
          Sa CSG des pensions ignore le lissage — le taux de 3,8 % reste dû si
          le revenu fiscal de référence de N−2 ou de N−3 ne dépasse pas le
          second seuil —, les seuils des DOM, qu'il ne porte qu'en note, et
          l'exonération des pensions des allocataires de l'ASPA.
        tranche: >-
          L. 136-8, III et III 2°, en vigueur depuis le 27 juin 2026
          (LEGIARTI000054336623), et L. 136-1-2, II 1°, lus dans l'index LEGI
          du dépôt ; l'écart est le sien
        preuve: >-
          `contributions_sociales/remplacement.py:285-308`, au commit
          `16b2e69`
      - constat: >-
          La cotisation maladie de 1 % des pensions complémentaires est
          paramétrée (`regimes_comp.yaml`, sous `mmid_ret/`), mais aucune
          variable ne la lit.
        tranche: D. 242-8 du code de la sécurité sociale ; l'écart est le sien
        preuve: >-
          `mmid_ret/…/regimes_comp.yaml`, au commit `16b2e69`
      - constat: >-
          La cotisation maladie d'Alsace-Moselle des salariés y reste à 1,5 %
          (`maladie_alsace_moselle.yaml:35-36`, appliquée par
          `travail_prive.py:831-841`).
        tranche: >-
          l'Urssaf : 1,30 % depuis avril 2022 ; l'écart est le sien
        preuve: >-
          `maladie_alsace_moselle.yaml:35-36`, au commit `16b2e69`
      - constat: >-
          Avant 2015, sa CSG et sa CRDS des pensions sont au taux
          plein pour tous (`remplacement.py:333-338, 399-404,
          461-466`, formules « à corriger », dit-il).
        tranche: >-
          L. 136-8, III, rédaction de 2010 à 2012
          (LEGIARTI000023263645) : 3,8 % pour les pensionnés dont
          l'impôt de l'année précédente est sous le seuil de
          recouvrement, exonération sous condition de revenu (L.
          136-2, III) ; l'écart est le sien. Le dépôt, à 9,1 % en
          toute année, ne fait pas mieux
        preuve: LEGIARTI000023263645, lu dans l'index LEGI du dépôt
      - constat: >-
          Sa condition de nationalité de l'ASPA omet les réfugiés,
          apatrides, bénéficiaires de la protection subsidiaire et
          anciens combattants, et l'attestation par les périodes
          d'assurance (`asi_aspa.py:180-182`).
        tranche: >-
          L. 816-1, 1° et 2° (LEGIARTI000042920144) ; l'écart est le
          sien
        preuve: LEGIARTI000042920144
    fait_mieux:
      - quoi: >-
          Il calcule la CSG, la CRDS et la CASA des pensions selon le revenu
          fiscal de référence de N−2 et le nombre de parts. Le dépôt retire
          9,1 % à tous (`remuneration.py:564`, `contexte.py:670`), l'ASPA
          comprise (`pages.js:3678-3684`) : une ASPA de 1 043,59 € s'y affiche
          à 948,62 € nets, quand le droit exonère les pensions de ses
          allocataires.
        preuve: >-
          `contributions_sociales/remplacement.py:285-308` (CSG), `:417-438`
          (CRDS) et `:477-496` (CASA), au commit `16b2e69`
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il sert l'ASPA d'un couple sous le plafond du couple (19 442,21 €),
          sur les ressources des trois derniers mois, salaires abattus de 0,9
          ou 1,5 SMIC, comme le veulent L. 815-9 et D. 815-2 ; seule l'option
          des douze mois de R. 815-29 lui manque. Le dépôt applique le barème
          d'une personne seule (`droit/foyer.py:125-128`), bien que la saisie
          porte `ressources_conjoint` et que `minimum_vieillesse_couple.csv`
          existe.
        preuve: >-
          `minima_sociaux/asi_aspa.py:330-385` (plafond) et `:16-104`
          (ressources), au commit `16b2e69`
        etat: repris
        chantier: "138.2"
      - quoi: >-
          Il calcule l'impôt sur le revenu des retraités :
          abattement de 10 % des pensions (454 € par pensionné au
          moins, 4 439 € par foyer au plus, revenus de 2025),
          abattement des contribuables de 65 ans ou invalides,
          parts, décote. Le dépôt ne calcule aucun impôt, ni dans la
          pension nette ni dans l'effet retour de la page Coût
          (aucune occurrence dans `src/`).
        preuve: >-
          `model/prelevements_obligatoires/impot_revenu/ir.py:445-497`
          (abattement des pensions), `:3615-3680` (`abat_spe`),
          `:3737` (`nbptr`) ;
          `parameters/impot_revenu/calcul_revenus_imposables/deductions/abatpen/*.yaml`,
          `abat_rni/contribuable_age_invalide.yaml`, au commit
          16b2e69
        verification: >-
          service-public.fr, F415, vérifiée le 15 avril 2026 : «
          abattement de 10 % [...] 454 € par pensionné [...] 4 439 €
          par foyer fiscal », égal à ses paramètres ; CGI, art. 157
          bis, pour l'abattement des personnes âgées (BOFiP
          2036-PGP, qu'il cite)
        etat: a_reprendre
        chantier: "138.5"
      - quoi: >-
          Il porte le minimum vieillesse d'avant l'ASPA : AVTS
          (1962-2022), allocation supplémentaire d'une personne
          seule (1956-2022) et d'un ménage (1982-2022), leurs
          plafonds, le complément exceptionnel, l'AVTS d'avant 1961
          par taille de commune. Le dépôt déflate sur les prix le
          montant de 2006 (`scenarios/actuel.py:1571-1581`),
          étiqueté `certifiee` : 1 195 € en 1970 au lieu de 442 €
          (+170 %), 2 387 € au lieu de 1 677 € en 1978 (+42 %), 5
          526 € au lieu de 5 293 € en 1990 (+4 %). Même série que
          `baremes_ipp`, dont il la tient.
        preuve: >-
          `parameters/prestations_sociales/solidarite_insertion/minimum_vieillesse/avts/`,
          `as/`, `avts_av_1961/`, au commit 16b2e69 ; paramètres
          sans formule avant 2006 (`asi_aspa.py:387`)
        verification: >-
          décret n° 90-265 (JORFARTI000002138946) : AVTS « portés à
          14800 F par an à compter du 1er janvier 1990 » ; décret n°
          90-266 (JORFARTI000001947321) : allocation supplémentaire
          « fixé à 19920 F à compter du 1er janvier 1990 » ; égaux
          aux siens. Leur somme de 2006, 7 323,48 €, est l'ancre
          certifiée du dépôt (D. 815-1).
        etat: repris
        chantier: "138.6"
      - quoi: >-
          Il porte la majoration pour conjoint à charge (4 000 F par
          an depuis 1976, 609,80 € depuis 2002) et le plafond de
          ressources du conjoint jusqu'en 2022. Le dépôt ne la sert
          pas à qui l'avait avant 2011 (aucune occurrence de L.
          351-13 dans `src/` ni `regles/`). Reprise le 8 octobre
          2026 : fiche majoration_conjoint_a_charge, dans les deux
          moteurs.
        preuve: >-
          `minimum_vieillesse/majconj/montant_majoration_conjoint_charge.yaml`
          et `plafond_conjoint_pour_maj_pac.yaml`, au commit 16b2e69
          ; paramètres sans formule
        verification: >-
          L. 351-13 en vigueur (LEGIARTI000023033932) : majoration «
          supprimée à compter du 1er janvier 2011 », « maintenue
          pour les pensionnés qui en bénéficiaient au 31 décembre
          2010 », réduite si la durée d'assurance est incomplète
        etat: repris
        chantier: "138.17"
      - quoi: >-
          Il oppose à l'ASPA et à l'ASI la condition de séjour de
          dix ans de l'étranger hors Espace économique européen et
          Suisse. Le dépôt ne la lit pas, faute de connaître la
          nationalité
          (`regles/residence_et_minimum_vieillesse.yaml:111-113`).
        preuve: >-
          `model/prestations/minima_sociaux/asi_aspa.py:168-182` et
          `aspa/duree_min_titre_sejour.yaml`, au commit 16b2e69
        verification: >-
          L. 816-1 en vigueur (LEGIARTI000042920144), 1° et 3° ; il
          omet le 2° (réfugiés, apatrides, protection subsidiaire,
          anciens combattants) et l'attestation par les périodes
          d'assurance de L. 351-2
        etat: a_trancher
        raison: >-
          Une question de nationalité à la saisie, que le
          propriétaire tranche ; dix ans d'assurance en France
          attestent la condition (L. 816-1, 1°), ce que le moteur
          pourrait présumer d'une carrière saisie.
      - quoi: >-
          Il calcule l'ASI, minimum des pensionnés d'invalidité
          avant l'âge de l'ASPA. Le dépôt ne la porte pas
          (`regles/inaptitude_au_travail.yaml:211`).
        preuve: >-
          `model/prestations/minima_sociaux/asi_aspa.py:202-303`, au
          commit 16b2e69
        verification: >-
          méthode ; allocation d'invalidité, servie avant la
          retraite
        etat: ecarte
        raison: >-
          Hors champ : une prestation d'invalidité, qui cesse à
          l'âge de l'ASPA ; le dépôt ne modélise l'invalidité que
          jusqu'à la pension substituée.
    bilan: >-
      Il fait mieux sur tout ce qui sépare la pension brute du revenu du
      retraité — CSG selon le revenu fiscal, ASPA du couple, impôt avec
      ses abattements — et sur les montants historiques du minimum
      vieillesse et des avantages d'avant 2011. Il ne calcule pas la
      pension ; ses séries de plafond, de SMIC et de point d'indice sont
      celles du dépôt, à l'euro, et sa CSG d'avant 2015 est fausse.
    manifeste:
      - openfisca_plafond
      - openfisca_point_indice
      - openfisca_contribution_employeur_public
      - openfisca_cotisations
      - openfisca_part_salariale
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/openfisca/openfisca-france
      - data/sources.yaml
      - https://www.service-public.gouv.fr/particuliers/vosdroits/F415
    note: >-
      Version 176.1.2 du 1er octobre 2026. Environ la moitié de ses fichiers
      de paramètres de retraite portent un `ipp_csv_id` : ils viennent des
      barèmes de l'IPP (CSG 25 sur 55, cotisations du régime général 86 sur
      179, Agirc-Arrco 26 sur 103, minimum vieillesse 24 sur 45). Ses seuils
      de CSG de 2026 sont ceux de l'instruction de la DSS du 11 décembre
      2025. Mes Droits Sociaux, le simulateur de la DSS, appelle un service
      OpenFisca (`/openfisca/calculate`) : c'est un simulateur officiel, pas
      une confirmation de plus.
      Comparé au dépôt le 1er octobre 2026 au commit `16b2e69`.

  - id: openfisca_france_pension
    nom: OpenFisca-France-Pension
    auteur: la communauté OpenFisca et l'IPP, d'après Til-Pension
    nature: calculateur
    publication: ouvert
    code: https://github.com/openfisca/openfisca-france-pension
    licence: AGPL-3.0
    usage: executer_a_part
    confronte: [scenario_1]
    couvre: >-
      Six régimes codés : le régime général, la fonction publique de l'État
      (hors services actifs), la CNRACL, l'Arrco, l'Agirc, l'Ircantec ; les
      paramètres des indépendants sans leur régime. L'âge d'ouverture de la
      loi de 2023 seule, sans celle du 30 décembre 2025 ; les derniers
      paramètres datent du 1er janvier 2024.
    version: "0.1.3"
    depend_de: [baremes_ipp, til_pension]
    confrontation: >-
      Un calcul rejoué : des carrières simples, à salaire nominal constant,
      calculées chez lui et figées en témoins (`tests/temoins/openfisca_*.json`),
      que `tests/test_oracle.py` rejoue contre le scénario 1. C'est la seule
      confrontation de moteur que le dépôt mène aujourd'hui ; ce qu'il reste à
      en tirer est l'action 136 de la feuille de route.
    ecarts:
      - constat: >-
          Ses coefficients de revalorisation des salaires portés au compte
          s'écartent de la table de la Cnav : de −3 à −5,5 % après 1990, faute
          de la revalorisation de 4 % du 1er juillet 2022, de −17 à +10 % sur
          1949-1962. Son salaire annuel moyen en reste en deçà.
        tranche: la circulaire de la Cnav, que le modèle lit
        preuve: docs/limites.md (« Ce que dit la confrontation à une seconde implémentation »)
      - constat: >-
          Sa décote de la pension civile porte 0,65 % pour l'année d'ouverture
          2010, là où la loi écrit 0,625 % ; son minimum garanti suit le point
          d'indice de l'année de liquidation, quand L. 17 fige la référence
          au 1er janvier 2004.
        tranche: la loi ; les deux écarts sont les siens
        preuve: tests/temoins/openfisca_fonction_publique.json
      - constat: >-
          Son Agirc ne suit ni le taux d'appel de 1989 ni le contractuel de
          1994, fait cotiser la tranche C par le salarié dès l'origine, et lit
          le prix d'achat au 1er janvier, un millésime en retard dès 2004.
        tranche: les accords de l'Agirc ; les écarts sont les siens, déclarés au témoin
        preuve: tests/temoins/openfisca_agirc.json
      - constat: >-
          Son Ircantec porte l'assiette de la tranche B à huit plafonds dès
          1992, quand le décret n° 2008-996 le fait au 25 septembre 2008.
        tranche: le décret ; l'écart est le sien
        preuve: tests/temoins/openfisca_ircantec.json
      - constat: >-
          Son régime unifié Agirc-Arrco ne s'exécute pas : le code demande un
          paramètre que les barèmes livrés ne définissent pas.
        tranche: un défaut du paquet publié, sans texte à lire
        preuve: data/sources.yaml (openfisca_regime_general_oracle)
      - constat: >-
          Chez nous, la durée de proratisation était confondue avec la durée
          requise, que R. 351-6 fixe plus bas avant la génération 1949.
        tranche: R. 351-6 ; l'erreur était la nôtre, corrigée
        preuve: data/sources.yaml (openfisca_regime_general_oracle)
      - constat: >-
          Chez nous, la décote de L. 14 se lisait à l'année de liquidation et
          non d'ouverture du droit, et la montée en charge 2004-2008 de la
          durée de services était ignorée.
        tranche: L. 14 et la loi de 2003 ; les erreurs étaient les nôtres, corrigées
        preuve: data/sources.yaml (openfisca_fonction_publique_oracle)
      - constat: >-
          Sa durée requise et son âge d'ouverture s'arrêtent à la
          loi de 2023 : 171 trimestres et 63 ans à la génération
          1964, 172 trimestres et 63 ans et 3 mois à 1965
          (`regime_general_cnav/trimtp.yaml:273-292`,
          `aod.yaml:290-341`). L'écart du registre qui lui prête 169
          trimestres à la génération 1965 est faux au commit 1c45423
          : il y porte 172 depuis le 1er septembre 2023 ; c'est la
          suspension qu'il ignore.
        tranche: >-
          L. 161-17-3 (LEGIARTI000053280903) et L. 161-17-2
          (LEGIARTI000053280889), rédaction de la loi n° 2025-1403
          du 30 décembre 2025 : 170 trimestres jusqu'aux nés du 31
          mars 1965, 171 d'avril à décembre 1965 ; le dépôt a raison
        preuve: >-
          `legislation/duree_assurance_requise.csv:129-131`,
          `age_ouverture_requis.csv:139-141`
      - constat: >-
          Depuis avril 2009, son minimum contributif multiplie le
          minimum par (1 + surcote)
          (`regimes/regime_general_cnav.py:959-962`).
        tranche: >-
          D. 351-2-1, dernier alinéa depuis le 1er avril 2009
          (LEGIARTI000020090091, en vigueur LEGIARTI000047961314) :
          la surcote « est calculée sur la base du montant de
          pension avant qu'il ne soit porté au montant minimum », et
          s'y ajoute ; le dépôt a raison depuis le 23 septembre 2026
        preuve: >-
          `droit/completer.py:68-98`, circulaire Cnav 2018-04 (621 +
          24,07 + 15,52 = 660,59 €)
      - constat: >-
          Sa majoration de durée au-delà de l'âge du taux plein
          prend le taux de décote de la génération, 1,25 % par
          trimestre dès 1953, et court dès l'âge d'annulation de la
          catégorie, 60 ans pour l'inapte
          (`regimes/regime_general_cnav.py:214-241, 243-270`).
        tranche: >-
          R. 351-7 en vigueur (LEGIARTI000053335592) : 2,5 % par
          trimestre au-delà de l'âge du 1° de L. 351-8, ou de 65 ans
          pour l'inapte ; le dépôt a raison
        preuve: >-
          `regles/majoration_duree_apres_65_ans.yaml:53-64`
      - constat: >-
          Il sert le taux plein à 60 ans à tout ancien combattant
          dès 1975 (`aad.yaml:246-262`) ; il fixe à 42 ans la durée
          des travailleurs manuels sans l'appliquer
          (`aad.yaml:282-286`, « TODO » à
          `regimes/regime_general_cnav.py:115, 136`).
        tranche: >-
          décret n° 74-191, art. 1er (LEGIARTI000006762031) : de 64
          ans pour six à dix-sept mois de captivité ou de services
          de guerre à 60 ans pour cinquante-quatre mois ; décret de
          1945, art. 70-2, rédaction de 1978 (LEGIARTI000006760658)
          : quarante et un ans, quarante-trois avant le 1er juillet
          1977. Les deux écarts sont les siens
        preuve: >-
          `regles/decote_avant_1983.yaml:137-147`
      - constat: >-
          Sa revalorisation des pensions de 2020 est uniforme, 0,3
          %, et sa série s'arrête en 2024
          (`regime_general_cnav/revalorisation_pension.yaml`).
        tranche: >-
          loi n° 2019-1446, art. 81 : l'inflation, 1 %, pour les
          pensions de 2 000 € par mois au plus, en tranches jusqu'à
          0,3 % ; décision n° 2019-795 DC (JORFARTI000039675440) :
          le seuil « soustrait 77 % des assurés à la revalorisation
          dérogatoire » ; le dépôt a raison, et porte 2025 et 2026
        preuve: >-
          `legislation/revalorisation_pensions.csv:120-124`
      - constat: >-
          De janvier 2004 à juin 2005, il proratise la majoration du
          minimum contributif sur la durée cotisée
          (`regimes/regime_general_cnav.py:988`).
        tranche: >-
          COR, séance du 25 mai 2011, document n° 1518, p. 3 :
          jusqu'au 30 juin 2005, « le minimum contributif majoré est
          calculé en fonction de la durée d'assurance validée sans
          distinction entre périodes cotisées et non cotisées ». Le
          dépôt fait la même erreur (`droit/completer.py:266-271`)
        preuve: >-
          https://www.cor-retraites.fr/sites/default/files/2019-06/doc-1518.pdf
      - constat: >-
          Ses points des indépendants ont des fautes de saisie : la
          valeur ORGANIC du 1er avril 2011 reprend celle de la
          CANCAVA, 8,8124 € au lieu d'environ 12,15 €
          (`pt_organic/…/valeur_point_acquis_par_cotisations.yaml:150-151`)
          ; la valeur de 2001 du point des artisans est en euros
          dans une série en francs
          (`pt_rc_art/valeur_points_acquis.yaml:77-78`) ; trous de
          2013 à 2015. Sans effet chez lui : aucune formule ne les
          lit.
        tranche: >-
          sa propre série : 11,90139 € en 2009 et 12,4048 € en 2012
          encadrent 2011 ; le dépôt a 0,2847 € pour 2001
        preuve: >-
          `regimes/valeurs_point.csv` (rco_artisans, 2001)
      - constat: >-
          Avant 1983, son minimum de pension lit
          `prestations_sociales.…avts_av_1961`
          (`regimes/regime_general_cnav.py:1017-1020`), que le
          paquet ne livre pas : `parameters/` n'a que
          `marche_travail`, `prelevements_sociaux` et `retraites`.
        tranche: un défaut du paquet publié, sans texte à lire
        preuve: >-
          `openfisca_france_pension/parameters/`, au commit 1c45423
      - constat: >-
          Il borne au salaire de référence la pension civile et sa
          majoration pour enfants ensemble, la surcote comprise, à
          toute date : la pension que la surcote porte au-delà du
          traitement y est ramenée, majoration ou non
          (`regimes/fonction_publique.py`, variable `pension`,
          `min_(pension_brute + majoration_pension, salaire_de_reference)`).
        tranche: >-
          L. 18, V, et la décision du Conseil d'État du 29 décembre
          2020, n° 428626 : la caisse ne retirait que la majoration à
          qui la surcote portait à 104 % du traitement (point 1), et
          laisse depuis la surcote hors du plafond ; l'écart est le
          sien.
        preuve: >-
          `openfisca_france_pension/regimes/fonction_publique.py`, au
          commit 1c45423 ; data/reference/regles/majoration_enfants_plafond_fonction_publique.yaml
    fait_mieux:
      - quoi: >-
          Il code le départ anticipé des fonctionnaires parents de trois
          enfants — trois enfants et quinze ans de services réunis avant 2012
          — et, selon les dates, la décote de l'année où les conditions l'ont
          été plutôt que celle de la génération. Le dépôt ne sert ces départs
          à personne (`docs/limites.md`), et aucune fiche ne porte la règle.
        preuve: >-
          `regimes/fonction_publique.py:309`
          (`decote_a_date_depart_anticipe_parent_trois_enfants`) et `:422`
          (`depart_anticipe_trois_enfants`), et
          `tests/formulas/fonction_publique/parent_trois_enfants.yml`, au
          commit `1c45423`
        etat: repris
        chantier: "138.17"
      - quoi: >-
          Sa quotité de travail réduit les services sans réduire la durée
          d'assurance. Au dépôt, `temps_partiel_fonction_publique` est
          `manquante`, et toute année compte à temps plein.
        preuve: >-
          `variables/fonction_publique.py:332-335` (CNRACL) et `:1193-1195`
          (État), au commit `1c45423`
        etat: a_reprendre
        chantier: "136.3"
      - quoi: >-
          Il calcule, et le plus souvent teste, la majoration de durée et la
          bonification pour enfants, la majoration de 10 %, les points enfants
          de l'Arrco, la catégorie active, la carrière longue de la fonction
          publique, les minima garanti et contributif, la minoration de
          l'Arrco, les périodes assimilées année par année et le salaire
          annuel moyen sur des salaires qui varient. L'oracle du dépôt ne lui
          confronte que 48 carrières continues à salaire nominal constant
          (`tests/test_oracle.py`).
        preuve: >-
          ses 140 tests de formules (`tests/formulas/`), au commit `1c45423`
        etat: a_reprendre
        chantier: "136.2"
      - quoi: >-
          Il rend, pour toute simulation, chaque variable calculée, sa valeur,
          et les variables et paramètres qu'elle a lus ; toute variable peut
          s'y donner en entrée, si bien que ses tests isolent chacun une
          formule. Le relevé du dépôt ne cite sa fiche que sur 733 de ses
          22 789 lignes (3 %).
        preuve: >-
          `openfisca test -v`, et `/trace` sur l'interface web
          d'openfisca-core
        etat: a_reprendre
        chantier: "136.4"
      - quoi: >-
          Il calcule une population d'un coup, en vecteurs, et sa
          documentation dit l'avoir essayé sur les données de Destinie et sur
          l'EIR 2012, au régime général et à l'Arrco ; ce code-là n'est pas
          publié. La page Coût du dépôt repose sur 13 cas types à 28
          générations, pondérés par les effectifs de leur caisse (`cout.py`) ;
          refaite sur 791 carrières ancrées sur l'EIR 2020, elle creuse
          l'écart passé de 4 à 8 points et réduit de moitié le déficit
          moyen de la proposition (`scripts/grille_large.py`, 5 octobre
          2026).
        preuve: >-
          `doc/Proposition.md:36, 141` (« Sont testés avec EIR 2012 Régime
          général et Arrco »), au commit `1c45423`
        etat: a_reprendre
        chantier: "136.6"
      - quoi: >-
          `openfisca serve` expose `/calculate`, `/trace`, `/variables`,
          `/parameters` et une description OpenAPI (`/spec`) ; le paquet se
          publie sur PyPI en versions numérotées, et son intégration continue
          refuse un changement fonctionnel sans numéro nouveau ni ligne au
          journal des changements. Aucun résultat du dépôt ne porte la version
          du modèle qui l'a calculé (`docs/architecture.md`, annexe C.9).
        preuve: >-
          l'interface web d'openfisca-core (`openfisca serve`) ; son
          intégration continue et son journal des changements, au commit
          `1c45423`
        etat: a_reprendre
        chantier: "136.5"
      - quoi: >-
          Il écrit chaque règle une fois, dans un moteur Python que d'autres
          appellent ; le dépôt l'écrit deux fois, en Python (`src/`) et en
          JavaScript (`moteur/js/`).
        preuve: >-
          ses formules (`openfisca_france_pension/`), servies par
          openfisca-core
        etat: ecarte
        raison: >-
          C'est le prix, décidé, d'un site qui calcule sans serveur, jusque
          sur un téléphone (`docs/architecture.md`, § 7.1).
      - quoi: >-
          Il date le minimum contributif texte par texte : montants
          de 1984 à 2023 à chaque revalorisation, majoration créée
          en 2004, condition des 120 trimestres cotisés pour les
          seules pensions d'avril 2009 et après, écrêtement en 2012
          seulement. Le dépôt n'a que six ancres par grandeur
          (`legislation/minimum_contributif.csv:70-87`) ; il date de
          2007 les montants que D. 351-2-1 fixe « au 1er janvier
          2008 », projette les autres années sur les prix et non sur
          la revalorisation des pensions
          (`scenarios/actuel.py:2746-2779`), exige 120 trimestres à
          toute date et sert majoration et écrêtement à toute
          liquidation depuis 1983 (`droit/completer.py:248-271,
          344`). Recalculé : minimum de 2004 trop haut de 1,7 %,
          majoré de 7,9 % ; +2,8 % en 2008, +3,9 % en 2018, +4,7 %
          en 2019 ; en 1984, un majoré de 4 587 € et un plafond
          d'écrêtement de 6 689 € qui n'existaient pas ; en 2023,
          les montants de septembre pour toute l'année (+13,4 % sur
          le majoré de janvier à août).
        preuve: >-
          `parameters/retraites/secteur_prive/regime_general_cnav/montant_mico.yaml`
          (1984-01-01 à 2023-09-01 ; l. 66-78 pour 2004-2008) et
          `plafond_mico/minimum_contributif_plafond_mensuel.yaml`
          (2012-2023) ; `regimes/regime_general_cnav.py:1005-1015`
          (1983 : minimum seul), `:967-1003` (2004 : majoration),
          `:941-943` (120 trimestres, « | liquidation_date <
          date(2009, 4, 1) »), `:736-792` (écrêtement, formule de
          2012 seule), au commit 1c45423
        verification: >-
          D. 351-2-1, rédactions LEGIARTI000006736531 (6 511,06 et 6
          706,39 € « au 1er janvier 2004 »), LEGIARTI000006736532 (6
          760,82 et 7 172,54 € au 1er janvier 2006) et
          LEGIARTI000017870194 (6 958,21 et 7 603,41 € « au 1er
          janvier 2008 ») : égaux aux siens ; « revalorisés aux
          mêmes dates et dans les mêmes conditions que celles
          prévues pour les pensions de vieillesse par l'article L.
          161-23-1 », et non sur les prix (même article, rédaction
          de 2004). D. 351-2-2 (120 trimestres) n'existe que depuis
          le 1er avril 2009 (LEGIARTI000020090096). L. 173-2
          n'écrête que « les pensions prenant effet à compter du 1er
          janvier 2012 » (LEGIARTI000023271329) ; de 1985 à 2003, il
          limitait seulement le cumul de plusieurs minima de base au
          plus élevé (LEGIARTI000006740908), règle qu'aucun des deux
          ne porte.
        etat: repris
        chantier: "138.15"
      - quoi: >-
          Il valide les trimestres d'avant 1972 au seuil de R. 351-9
          : de 1949 à 1971, le montant trimestriel de l'AVTS (8 500
          F en 1949, 437,5 F en 1971) ; de 1946 à 1948, 18 F ; les
          règles de 1930 à 1945. Le dépôt valide quatre trimestres à
          toute année travaillée avant 1972
          (`donnees/macro.py:269-296`,
          `legislation/validation_trimestres.csv:9-11`). Même
          constat que `calcul_verification_pension`.
        preuve: >-
          `regimes/regime_general_cnav.py:478-497` et
          `parameters/.../salval/salaire_validant_trimestre/metropole.yaml:76-115`,
          au commit 1c45423
        verification: >-
          R. 351-9, rédaction de 1985 (LEGIARTI000006749353) et en
          vigueur (LEGIARTI000053335598) : « autant de trimestres
          que le salaire annuel [...] représente de fois le montant
          trimestriel de l'allocation aux vieux travailleurs
          salariés au 1er janvier de l'année considérée [...]
          jusqu'au 31 décembre 1962, ce montant est celui des villes
          de plus de 5 000 habitants »
        etat: repris
        chantier: "138.6"
      - quoi: >-
          Depuis 2004, son salaire annuel moyen ne retient que les
          années dont le salaire valide au moins un trimestre. Le
          dépôt retient toute année qui porte un revenu
          (`droit/liquider.py:1706-1775`), et sa fiche
          `salaire_annuel_moyen`, conforme, n'en dit rien : une
          courte carrière au régime général avec une année de petit
          emploi voit son salaire moyen tiré vers le bas, cas
          fréquent chez les polypensionnés de la fonction publique.
        preuve: >-
          `regimes/regime_general_cnav.py:1079-1087` (condition «
          period.start.year < 2004 | salaire >= salaire validant »),
          au commit 1c45423
        verification: >-
          R. 351-29, rédaction du 15 février 2004
          (LEGIARTI000006750042) et en vigueur
          (LEGIARTI000053335651) : « le salaire annuel moyen
          correspondant aux cotisations permettant la validation
          d'au moins un trimestre d'assurance selon les règles
          définies par l'article R. 351-9 » ; absent de la rédaction
          de 1985 (LEGIARTI000006750038). CFDT Retraités et la
          presse spécialisée le redisent.
        etat: repris
        chantier: "138.16"
      - quoi: >-
          Il porte le minimum de réversion du régime général de 1964
          à 2021 (3 492,37 € par an en 2021). Le dépôt ne le sert
          pas (`droit/reversion.py:19-23`).
        preuve: >-
          `parameters/retraites/secteur_prive/regime_general_cnav/reversion_minimum.yaml`
          (barème IPP min_rev_RG), au commit 1c45423 ; paramètre
          sans formule, série arrêtée en 2021
        verification: >-
          D. 353-1 en vigueur (LEGIARTI000053356066) : « Le montant
          minimum de base annuel [...] est égal à 3 983,29 euros au
          1er janvier 2025 », entier à quinze ans d'assurance,
          réduit en soixantièmes en deçà ; sa valeur de 2021
          revalorisée jusqu'en 2025 donne 3 983,32 €.
        etat: a_reprendre
        chantier: "138.4"
      - quoi: >-
          Il porte, en entrée, les taux pleins par catégorie de L.
          351-8 : anciens déportés et internés (depuis 1965),
          anciens combattants et prisonniers de guerre (1974),
          travailleurs manuels et mères de famille ouvrières (1976).
          Le dépôt n'en porte aucun, avant 1983
          (`regles/decote_avant_1983.yaml:33-37`) ni après.
        preuve: >-
          `regimes/regime_general_cnav.py:102-200`
          (`raison_depart_taux_plein_anticipe`) et
          `parameters/.../regime_general_cnav/aad.yaml:201-286`, au
          commit 1c45423
        verification: >-
          L. 351-8, 3°, 4° et 5°, en vigueur (LEGIARTI000051289852)
          ; décret n° 74-191, art. 1er (LEGIARTI000006762031). Ses
          âges et durées sont faux en partie (écarts ci-dessous) :
          la règle se reprend des textes, pas de lui. Reprise le 8
          octobre 2026 : fiches taux_plein_anciens_deportes_internes,
          taux_plein_meres_de_famille_ouvrieres,
          taux_plein_travailleurs_manuels et
          taux_plein_anciens_combattants_prisonniers, dans les deux
          moteurs, sur trois faits que la saisie déclare (la carte, les
          mois de captivité et de services de guerre, le travail
          manuel) ; les paliers de D. 351-2, deux ans plus tard depuis
          2010 comme la Cnav, et ceux du décret du 7 juillet 2024
          (circulaire Cnav n° 2024-29).
        etat: repris
        chantier: "138.17"
      - quoi: >-
          Il borne la pension du régime général à la moitié du
          plafond, surcote en sus. Le dépôt n'a aucun maximum, avant
          1983 ni après (`regles/decote_avant_1983.yaml:33-34,
          57-60`).
        preuve: >-
          `regimes/regime_general_cnav.py:1022-1037`
          (`pension_maximale`) et le plafonnement de `pension_brute`
          (`:753-756`), au commit 1c45423
        verification: >-
          service-public.fr, F21552, vérifiée le 1er septembre 2026
          : « ne peut pas dépasser 50 % du plafond de la Sécurité
          sociale applicable l'année de votre départ », sauf surcote
          ; circulaire Cnav n° 22/83, que cite la fiche du dépôt. Ne
          mord guère qu'avant 1983, par l'ajournement et les taux
          acquis. Reprise le 8 octobre 2026 : fiche
          pension_maximale_regime_general, dans les deux moteurs, sur
          l'arrêté du 9 octobre 1986 (article 2) et le barème de la
          Cnav — 40 % du plafond jusqu'en 1971, 44, 46 et 48 % de 1972
          à 1974 —, la surcote appliquée à la pension ramenée au
          maximum (circulaire Cnav n° 2007-5) ; il mord aussi de 1973
          à 1990, le salaire annuel moyen passant le plafond.
        etat: repris
        chantier: "138.17"
      - quoi: >-
          Il sert la majoration de l'Agirc-Arrco pour enfants à
          charge, 5 % par enfant, quand elle passe celle des enfants
          nés ou élevés. Le dépôt ne la porte pas
          (`regles/majoration_enfants_agirc_arrco.yaml:22-25`).
          Reprise le 8 octobre 2026 : fiche
          majoration_enfants_a_charge_agirc_arrco, dans les deux
          moteurs, à l'Arrco depuis 1999 et à l'Agirc depuis 2012,
          sur les droits sans le coefficient d'anticipation, et
          jusqu'aux dix-huit ans de l'enfant, que la revalorisation
          suit à chaque échéance.
        preuve: >-
          `regimes/regimes_complementaires_prives.py:87-102` (le
          plus avantageux des deux), `:222-233` (Arrco) et
          `:360-371` (Agirc, depuis 2012), au commit 1c45423
        verification: >-
          article 95 de l'accord du 17 novembre 2017, que la fiche
          du dépôt cite pour dire qu'elle manque
        etat: repris
        chantier: "138.17"
      - quoi: >-
          Il porte la valeur de service des points d'avant 1973 des
          artisans (CANCAVA, 1973-2019) et des commerçants (ORGANIC,
          1949-2019). Le dépôt sert ces droits par un rendement
          estimé de 9 % (`regimes/rendements_points.csv:74-75`,
          `estimee`).
        preuve: >-
          `parameters/retraites/independants/pt_cancava/…/valeur_annuelle.yaml`
          et
          `pt_organic/…/valeur_point_acquis_par_cotisations.yaml`,
          au commit 1c45423 ; paramètres sans formule, et sans
          barème d'acquisition des points
        verification: >-
          Concordent avec les valeurs du point de la Sécurité
          sociale des indépendants qu'il cite (secu-independants.fr)
          et reprend dans `rsi_vp` : 9,1234 € (artisans) et 12,58032
          € (commerçants) en octobre 2015. L'acquisition (points par
          classe de cotisation) reste à lire ailleurs.
        etat: a_reprendre
        chantier: "138.18"
      - quoi: >-
          Il porte le seuil de validation des Antilles-Guyane et de
          La Réunion, plus bas qu'en métropole de 1948 à 1995 (en
          1980 : 2 112 F et 1 897,5 F contre 2 586 F). Le dépôt
          ignore les départements d'outre-mer (aucune occurrence
          dans `src/` ni `legislation/`). Même constat que
          `baremes_ipp`.
        preuve: >-
          `parameters/.../salval/salaire_validant_trimestre/guadeloupe_guyane_martinique.yaml`
          et `reunion.yaml`, choisis par
          `regime_general_cnav_salaire_validant_trimestre`
          (`regimes/regime_general_cnav.py:1145-1152`), au commit
          1c45423
        verification: >-
          R. 351-9 en vigueur (LEGIARTI000053335598) : pour l'assuré
          qui a travaillé dans un département de L. 751-1, « le
          montant du salaire minimum de croissance à retenir est
          celui qui est en vigueur dans ledit département »
        etat: a_reprendre
        chantier: "138.6"
    bilan: >-
      Ce qu'il fait de mieux tient à des paramètres datés texte par
      texte que le dépôt projette ou ignore — d'abord le minimum
      contributif, dont le dépôt sert la majoration et l'écrêtement
      avant leur création —, et à quelques règles qui manquent au dépôt
      (seuil de validation d'avant 1972, salaire moyen sur années
      validantes, minimum de réversion, catégories de L. 351-8). Il
      reste borné à cinq familles de régimes, arrêté à la loi de 2023,
      et faux sur le minimum surcoté, la majoration de durée et la
      revalorisation de 2020.
    manifeste:
      - openfisca_points
      - openfisca_regime_general_oracle
      - openfisca_fonction_publique_oracle
      - openfisca_arrco_oracle
      - openfisca_minimum_contributif
      - openfisca_parametres_generation
    sas: [openfisca_france_pension]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/openfisca/openfisca-france-pension
      - tests/temoins/openfisca_regime_general.json
      - tests/temoins/openfisca_fonction_publique.json
      - tests/temoins/openfisca_arrco.json
      - tests/temoins/openfisca_agirc.json
      - tests/temoins/openfisca_ircantec.json
      - data/sources.yaml
      - https://www.cor-retraites.fr/sites/default/files/2019-06/doc-1518.pdf
      - https://www.service-public.gouv.fr/particuliers/vosdroits/F21552
    note: >-
      Dernier commit le 13 mai 2026. « Les paramètres de la législation sont
      consommées directement depuis les barèmes IPP », dit sa documentation ;
      son prédécesseur est sur Framagit (`benjello/OpenFisca-France-Pension`,
      dernière activité en décembre 2024). Les témoins de l'Agirc et de
      l'Ircantec n'ont pas de ligne au manifeste : ils sortent de
      `scripts/fetch/openfisca_agirc.py` et `openfisca_ircantec.py`.
      Ce dernier commit est `1c45423`.

  - id: leximpact
    nom: LexImpact (simulateur socio-fiscal)
    auteur: LexImpact, Assemblée nationale
    nature: cas_types
    publication: ouvert
    code: https://git.leximpact.dev/leximpact/simulateur-socio-fiscal/openfisca/openfisca-france-reforms
    documentation:
      - https://socio-fiscal.leximpact.an.fr/accueil
      - https://leximpact.an.fr
    licence: AGPL-3.0 ou ultérieure
    usage: executer_a_part
    confronte: [scenario_1, cout]
    couvre: >-
      La CSG, la CRDS, la CASA et l'impôt des retraités sur seize cas types
      rangés par décile ; les mesures des PLF et PLFSS de 2022 à 2026, dont
      le forfait de 2 000 € de l'abattement de 10 % ; la revalorisation
      différenciée des pensions de base et complémentaires.
    depend_de: [openfisca_france]
    confrontation: >-
      Des résultats à retrouver, cas type par cas type : la pension nette de
      prélèvements, là où le modèle applique 9,1 % à tous.
    ecarts:
      - constat: >-
          Sa réforme `plf_plfss_2027` date du 1er janvier 2026 un
          barème de revalorisation des retraites à trois tranches,
          0,9 % sous 1 260 €, 1 % jusqu'à 2 034 €, 0 % au-delà
          (`parameters/inflateurs/inflateur_retraites.yaml:1-35`) ;
          sa docstring dit qu'elle ne porte « aucune mesure du
          texte, qui n'est pas connu » (`__init__.py:3`), quand le
          fichier code les articles 2 et 3 du PLF (`:114`,
          `:166-177`).
        tranche: >-
          circulaire Cnav 2025/29 du 22 décembre 2025 : 0,9 % pour
          toutes les pensions de base au 1er janvier 2026 ; l'écart
          est le sien, sans effet sur un calcul de 2027 dont la
          pension de 2026 est une entrée
        preuve: >-
          `legislation/revalorisation_pensions.csv`, ligne du 1er
          janvier 2026
    fait_mieux:
      - quoi: >-
          Il code les projets de loi pour 2027 dès leur dépôt : le
          sous-plafond de 3 000 € par foyer de l'abattement des
          pensions (PLF 2027, art. 3) ; la revalorisation
          différenciée n'y est qu'esquissée, à des taux marqués «
          temp », et l'article 35 du PLFSS n'y figure pas. Le
          journal de veille du dépôt nomme désormais les deux
          projets (`veille.yaml:4146-4155, 4695-4699`), sans les
          avoir lus au texte.
        preuve: >-
          `plf_plfss_2027/abattement_retraite.py:33` et
          `__init__.py:166-177`,
          `parameters/inflateurs/inflateur_retraites.yaml:14, 26`,
          dans openfisca-france-reforms au commit `6e2fabf`
        etat: a_reprendre
        chantier: "138.12"
      - quoi: >-
          Il décrit seize ménages de retraités rangés par décile de
          niveau de vie, chacun situé par sa part dans le décile :
          couples du 2e au 9e décile, célibataires du 4e au 6e,
          trois cas pour les trois taux de CSG, deux pour l'ASPA
          (une personne seule, un couple dont un seul a une
          pension), pension de base et complémentaire distinguées.
          Le dépôt n'a que des carrières individuelles
          (`castypes.py`), sans ménage ni foyer fiscal.
        preuve: >-
          `test_cases.json`, cas 004, 005, 006, 017, 025-028, 036,
          037, 044-046, 049-051, au commit 15fe1cc
        verification: >-
          méthode : des ménages calés sur la distribution des
          niveaux de vie sont les témoins naturels de la pension
          nette du foyer et de l'ASPA du couple ; leurs résultats se
          recalculent à part par OpenFisca-France
        etat: a_reprendre
        chantier: "138.2"
      - quoi: >-
          Il tient, avec l'Assemblée nationale, un baromètre de la
          parution des décrets d'application, loi par loi. La veille
          du dépôt lit les sommaires du Journal officiel et l'index
          de la DILA (`scripts/veille_droit.py`), sans suivre les
          décrets qu'une loi attend.
        preuve: >-
          https://leximpact.an.fr, outil « Baromètre de
          l'application des lois »
          (https://www.assemblee-nationale.fr/dyn/taux-application-lois
          : « Suivez l'état de la publication des décrets
          d'application »), lu le 4 octobre 2026
        verification: >-
          méthode : le décret qu'attend une loi, celle du 30
          décembre 2025 ou la LFSS pour 2027, se repère avant sa
          parution
        etat: a_reprendre
        chantier: "138.12"
      - quoi: >-
          Il chiffre l'effet budgétaire des mesures sur les ménages,
          pensions comprises, sur l'ERFS-FPR vieillie et calée. La
          page Coût ne simule ni l'impôt ni la CSG des retraités.
        preuve: >-
          README de `budget/leximpact-prepare-data` (API GitLab,
          branche master) : « Le socle de la simulation budgétaire
          est l'ERFS-FPR » ;
          `budget/leximpact-socio-fiscal-simu-etat`
        verification: méthode
        etat: ecarte
        raison: >-
          L'ERFS-FPR ne s'ouvre qu'aux habilités, sur serveur
          sécurisé ; le dépôt passe par les distributions publiées
          (138.3).
    bilan: >-
      Rien sur la pension elle-même : il hérite d'OpenFisca-France, déjà
      relu. Ses avantages propres sont des ménages types de retraités,
      la veille des projets et des décrets, et un chiffrage sur données
      que le dépôt ne peut pas reproduire ; son dépôt de réformes pour
      2027 est en chantier.
    sas: [leximpact_reformes]
    lu_le: 2026-10-04
    lu_dans:
      - https://git.leximpact.dev/leximpact/simulateur-socio-fiscal/openfisca/openfisca-france-reforms
      - https://socio-fiscal.leximpact.an.fr/accueil
      - https://git.leximpact.dev/leximpact/simulateur-socio-fiscal/leximpact-socio-fiscal-openfisca-json
      - https://leximpact.an.fr
    note: >-
      Le miroir GitHub est archivé depuis 2023 : tout vit sur git.leximpact.dev
      (l'interface, la chaîne budgétaire, l'explorateur de paramètres commun
      avec OpenFisca et l'IPP). Son baromètre de l'application des lois suit
      la parution des décrets d'application, ce qui sert la veille.
      Comparé au dépôt le 1er octobre 2026 au commit `6e2fabf`
      d'openfisca-france-reforms.

  - id: taxipp
    nom: TAXIPP
    auteur: Institut des politiques publiques (IPP)
    nature: microsimulation_statique
    publication: ouvert
    code: https://gitlab.com/ipp/partage-public-ipp/taxipp
    documentation:
      - https://ipp.gitlab.io/partage-public-ipp/taxipp/
    licence: AGPL-3.0, avec des termes additionnels (attribution, nom TAXIPP)
    usage: executer_a_part
    confronte: [cout]
    couvre: >-
      Les prélèvements et prestations sur données administratives (Fidéli,
      Félin, DADS, au CASD) ; les pensions y sont des entrées, la CSG, l'impôt
      et l'ASPA viennent d'OpenFisca-France.
    depend_de: [openfisca_france]
    confrontation: >-
      Des résultats publiés à retrouver : la note IPP n° 129 (septembre
      2026) chiffre l'abattement de 10 % à 5,4 Md€, la désindexation des
      pensions de base à 5,2 Md€, l'alignement de la CSG à 4,2 Md€, à
      opposer au chiffrage du dépôt (`docs/chiffrage_plf.md`).
    ecarts:
      - constat: >-
          Son taux de CSG des pensions vient d'un seul revenu fiscal
          de référence, sans le lissage sur N−3.
        tranche: >-
          L. 136-8, III 2°, en vigueur depuis le 27 juin 2026
          (LEGIARTI000054336623) ; l'écart est le sien
        preuve: >-
          `felin/input_data_builder/create_variables_individuelles.py:10-56`,
          dans openfisca-france-data au commit `1a96eeb`
      - constat: >-
          Le passage de la pension imposable à la pension brute oublie la
          cotisation maladie de 1 % des complémentaires.
        tranche: D. 242-8 du code de la sécurité sociale ; l'écart est le sien
        preuve: >-
          `openfisca_france_data/common.py:464-485`, dans
          openfisca-france-data au commit `1a96eeb`
    fait_mieux:
      - quoi: >-
          Il calcule un prélèvement effectif sur les pensions, tiré
          du revenu fiscal de référence réel de Félin. Sur la page
          Coût, le dépôt applique 9,1 % à la masse et ne donne la
          CSG « circulaire » qu'« au plus » (`pages.js:10775-10776,
          10836`), quand la CSG sur les retraites rapporte 23,7 Md€
          en 2023 (CCSS de mai 2024, tableau 3), soit 6,3 % des
          masses de la DREES que lit le dépôt, et non 8,3 %.
        preuve: >-
          `felin/input_data_builder/create_variables_individuelles.py:10-56`,
          dans openfisca-france-data au commit `1a96eeb` ; TAXIPP y
          injecte le revenu fiscal de Félin en N−1 et N−2
          (`simulation/scenarios/fideli_felin_dads/scenario.py:363-376`,
          au commit `28e2f0a`)
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il cale le recours à l'ASPA, année par année, sur le
          nombre d'allocataires que publie la DREES (722 510 fin
          2023), en tirant les recourants parmi les éligibles, et
          confronte nombre et masse d'ASPA aux agrégats officiels.
          Le dépôt retient 50 % pour la garantie
          (`config.py:868-877`), mesure de 2016 sur les seules
          personnes seules, et sert l'ASPA du scénario 1 à tous
          (`legislation/minimum_vieillesse.csv:25-26`).
        preuve: >-
          `simulation/utils/non_recours.py:70-81` (cibles 2016-2025)
          et
          `simulation/scenarios/fideli_felin_dads/tax_and_benefit_system.py:401-432`
          (`recourant_aspa`),
          `simulation/tests/test_agregats_automatise.py:39-152`, au
          commit 28e2f0a
        verification: >-
          DREES, minimum vieillesse, données 2023 : 723 020
          allocataires fin 2023, ASV et ASPA ; méthode : un taux de
          recours tiré du nombre observé rapporté aux éligibles est
          plus proche du réel qu'un taux de 2016 appliqué partout
        etat: a_reprendre
        chantier: "138.3"
      - quoi: >-
          Il mesure les effets redistributifs d'une mesure par
          décile, sur données fiscales et sociales appariées. Le
          dépôt n'a aucune distribution des niveaux de vie.
        preuve: >-
          `simulation/utils/redistribution_utils.py`,
          `documentation/donnees/`, au commit 28e2f0a
        verification: méthode
        etat: ecarte
        raison: >-
          Fidéli, Félin et les DADS ne se lisent qu'au CASD, sur
          habilitation (138.14).
    bilan: >-
      Microsimulation statique sur données administratives, il ne
      calcule pas la pension ; ce qu'il fait de mieux tient à ses
      données — un taux de CSG tiré du revenu fiscal réel, un recours à
      l'ASPA calé sur les allocataires observés. Le reste exige le CASD.
    sas: [ipp_taxipp]
    lu_le: 2026-10-04
    lu_dans:
      - https://gitlab.com/ipp/partage-public-ipp/taxipp
      - https://github.com/openfisca/openfisca-france-data
      - https://drees.solidarites-sante.gouv.fr/communique-de-presse-jeux-de-donnees/241216_DATA_minimum-vieillesse-donnees-2023
    note: >-
      Version 2.4.2 du 24 février 2026, sur openfisca-france 174.2.6. Le PDF
      de licence reproduit le texte de la GPL v3, quand le fichier dit l'AGPL :
      à relire avant tout usage. Sa version historique, TAXIPP 0.3, est en
      Stata, sans licence (`abozio/TAXIPP0-3`, 2013).
      Comparé au dépôt le 1er octobre 2026 au commit `28e2f0a`, avec
      openfisca-france-data au commit `1a96eeb`.

  - id: til_pension
    nom: TIL (TaxIPP-Life) et Til-Pension
    auteur: Institut des politiques publiques (IPP)
    nature: microsimulation_dynamique
    publication: ouvert
    code: https://github.com/TaxIPP-Life/Til-Pension
    licence: GPL-3.0
    usage: executer_a_part
    confronte: [scenario_1]
    couvre: >-
      Le régime général, les indépendants, la fonction publique, l'Agirc et
      l'Arrco, paramètres jusqu'en 2014 environ ; la microsimulation sur
      LIAM2 et OpenFisca, avec les données Patrimoine et de Destinie.
    depend_de: [baremes_ipp, openfisca_france]
    confrontation: >-
      À lire plutôt qu'à exécuter : abandonné en 2014-2018, il est l'ancêtre
      de l'architecture d'OpenFisca-France-Pension.
    ecarts:
      - constat: >-
          Il valide un trimestre pour 200 heures de SMIC dès 1945
          (param.xml:1153-1156).
        tranche: >-
          Avant 1972, un trimestre se validait par l'AVTS
          trimestrielle (1949-1971) ou par d'autres seuils (avant
          1949). Til-Pension a tort avant 1972.
        preuve: article R. 351-9 en vigueur (LEGIARTI000053335598)
      - constat: >-
          Sa législation s'arrête en 2014 : le SMIC de 2014 (9,53 €)
          vaut « jusqu'en 2100 » (param.xml, deb="2014-01-01"
          fin="2100-12-01"). Il note, sans le coder, qu'« Avant 1972
          : le SAM du RG était calculé sur les 10 dernières années »
          (param.xml:1-4).
        tranche: >-
          Il ne connaît ni la réforme de 2023, ni la suspension de
          2026, ni les barèmes postérieurs à 2014 : il est périmé.
        preuve: loi n° 2023-270 ; loi n° 2025-1403, article 105
    fait_mieux:
      - quoi: >-
          Il sert la majoration de l'Agirc et de l'Arrco pour
          enfants À CHARGE, 5 % des points par enfant, et retient la
          plus forte de celle-ci ou de la majoration pour enfants
          nés ou élevés (regime.py:234-272 ; taux dans
          param.xml:2563-2566, valable depuis 1962). Le dépôt ne
          sert que la seconde : « La majoration pour enfants à
          charge (article 95, 5 % par enfant) n'est pas modélisée »
          (majoration_enfants_agirc_arrco.yaml:22-25). Il connaît
          pourtant les dates de naissance des enfants
          (carriere.py:600). Reprise le 8 octobre 2026 : fiche
          majoration_enfants_a_charge_agirc_arrco, la majoration
          gardant ses étapes, et chaque échéance retirant la part
          des enfants qui ne sont plus à charge.
        preuve: >-
          til_pension/regime.py:246 (taux_pac) et :272 (return
          maximum(points_born, points_pac)), au commit c4e0d50
        verification: >-
          agirc-arrco.fr, page « Majorations pour enfants » : « 5 %
          par enfant » à charge (enfant de moins de 18 ans, de moins
          de 25 ans s'il est étudiant, apprenti ou demandeur
          d'emploi, ou invalide avant 21 ans), appliqués « sur la
          totalité des droits ». « Les majorations ne sont pas
          cumulables … c'est la majoration la plus élevée qui vous
          sera attribuée. » Source : ANI du 17 novembre 2017,
          article 95. Cette majoration est temporaire : il faudra
          que l'échéancier bascule sur l'autre quand l'enfant cesse
          d'être à charge.
        etat: repris
        chantier: "138.17"
      - quoi: >-
          Il prend pour l'AVPF l'assiette mensuelle publiée,
          multipliée par douze (trimesters_functions.py:42-52 ;
          param.xml:830-836 : 1 594 € par mois en 2014), et non 1
          820 heures de SMIC comme le dépôt (carriere.py:510-516).
          C'est le même point que pour les barèmes IPP, d'où vient
          sa série.
        preuve: >-
          til_pension/trimesters_functions.py:50-51 (sali_avpf =
          12*multiply(year_avpf, avpf)), au commit c4e0d50
        verification: >-
          article R. 381-3 (LEGIARTI000047961951) : 169 fois le SMIC
          du 1er juillet de l'année précédente, par mois
        etat: repris
        chantier: "138.16"
    bilan: >-
      Til-Pension couvre le régime général, le RSI, la fonction
      publique, l'Agirc et l'Arrco avec le droit de 2014. Il n'a ni
      réversion, ni régimes spéciaux, ni minimum garanti
      (Fonction_publique.py:204-205), et confie l'ASPA à OpenFisca
      (regime_prive.py:164) ; til-france ne calcule plus de pension dans
      sa dernière version. Son seul apport propre est la majoration de
      l'Agirc-Arrco pour enfants à charge ; pour l'AVPF, il confirme
      l'assiette des barèmes IPP.
    sas: [ipp_til_pension]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/TaxIPP-Life/Til-Pension
    note: >-
      Dernier commit de Til-Pension le 14 septembre 2014 ; `til-france`
      (2 octobre 2018), `Til`, `til-core` et `Til-BaseModel` sont dans la même
      organisation, sous GPL v3. L'IPP donne le projet pour terminé. LIAM2,
      sa plateforme, du Bureau fédéral du Plan belge, n'est plus maintenue.
      Comparé au dépôt le 1er octobre 2026 : Til-Pension au commit `c4e0d50`,
      til-france au commit `9b1260e`.

  - id: pensipp
    nom: PENSIPP
    auteur: IPP (A. Bozio, S. Rabaté, M. Tô, D. Blanchet), avec l'INSEE
    nature: microsimulation_dynamique
    publication: ouvert
    code: https://github.com/abozio/PENSIPP
    documentation:
      - https://www.ipp.eu/projet/pensipp-micro-simulation-dynamique-du-systeme-de-retraite-francais/
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%207_PENSIPP_IPP.pdf
    licence: aucune
    usage: lire_et_citer
    confronte: [scenario_1, proposition]
    couvre: >-
      Le régime général, la fonction publique et les complémentaires, droit
      de 1946 à 2011, millésime par millésime ; et des simulations de COMPTES
      NOTIONNELS (`Simulations/CN`, `OutilsCN.R`) et de points, pour la
      France.
    depend_de: [baremes_ipp, destinie_2]
    confrontation: >-
      Lire sa conversion en comptes notionnels de 2013 — revalorisation des
      cotisations, actualisation, traitement de l'AVPF — et la confronter à la
      proposition ; l'exécuter demande l'accord de l'IPP.
    ecarts:
      - constat: >-
          Son salaire de base est toujours la moyenne des meilleures
          années, avant 1973 compris (OutilsRetr.R:209-230).
        tranche: >-
          Jusqu'en 1972, c'étaient les dix dernières années
          (circulaire 20/SS de 1961 ; décret n° 72-1229). PENSIPP se
          trompe, comme le dépôt.
        preuve: >-
          notice JORFTEXT000000693828 ; base de la Cnav,
          CR_MIN_20SS_06021961
      - constat: >-
          Sa législation s'arrête en 2011-2012 (OutilsLeg.R, branche
          Leg >= 2011 ; dernier commit le 22 mai 2013).
        tranche: >-
          Il ne connaît ni la loi de 2014, ni celle de 2023, ni la
          suspension de 2026 : il est périmé.
        preuve: >-
          loi n° 2014-40 ; loi n° 2023-270 ; loi n° 2025-1403,
          article 105
    fait_mieux:
      - quoi: >-
          Il code quatre règles de départ : au taux plein ; à un âge
          fixé de l'extérieur ; dès qu'une pension cible est
          atteinte ; et l'arbitrage de Destinie. Dans ce dernier,
          l'assuré part quand sa pension dépasse son salaire du
          moment, ou un taux de remplacement cible qui croît de 1 %
          par an après 60 ans, sauf si attendre un an lui rapporte
          plus qu'un seuil β (OutilsRetr.R:809-890 ; paramètres dans
          SimulCN-variantes macro.R:91-93). Le dépôt fait partir au
          taux plein ou à l'âge saisi (pilote.py:6-12), et prévient
          que ses écarts sont « à comportement inchangé »
          (limites.md:2005-2010).
        preuve: OutilsRetr.R:861-889 (option « sw »), au commit fbaf3fa
        verification: >-
          Un comportement de départ rapprocherait du réel une
          réforme qui pénalise les départs précoces. Mais les
          paramètres de PENSIPP (k tiré d'une loi log-logistique, δk
          = 1 %, β = 200) ne sont calés nulle part dans son dépôt.
          Et ses propres simulations de comptes notionnels gardent
          l'âge de référence (SimDir(i,t,"exo",ageref),
          SimulCN-variantes macro.R:143) : l'option « sw » y est
          commentée (SimulRef-variantes macro.R:82).
        etat: a_trancher
        raison: >-
          Un comportement non calé déplacerait les chiffres de la
          page Coût sans source, alors que le programme affiche des
          effets à comportement inchangé.
      - quoi: >-
          Ses comptes notionnels peuvent créditer des périodes non
          cotisées, chaque crédit étant désactivable par une option
          : le chômage (cotisation sur le dernier salaire, entre le
          SMIC et 4 plafonds) ; l'AVPF (au SMIC) ; chaque naissance
          (deux ans de cotisation sur le meilleur des deux derniers
          salaires) ; 10 % de plus pour trois enfants ; un minimum
          en points (10 % des points sous le seuil du minimum
          vieillesse, dégressif jusqu'au SMIC) (OutilsCN.R:25-36,
          :137-205). Il chiffre aussi la masse de ces crédits
          (Simulations/CN/Dispositifs NC/ANC_CN.R). Le compte du
          dépôt n'en sert aucun, hors le chômage indemnisé, par
          choix du README (couches/comptes_notionnels.yaml:40-77).
        preuve: OutilsCN.R:157-195, au commit fbaf3fa
        verification: >-
          C'est une variante du programme, pas un rapprochement du
          réel : la chiffrer éclairerait le choix du README.
        etat: a_trancher
        raison: >-
          Le README exclut ces dispositifs du compte ; seul le
          propriétaire peut décider d'en chiffrer une variante.
      - quoi: >-
          La fonction UseLeg(Leg, g) applique à une génération le
          barème que prévoyait la législation d'une année donnée,
          par exemple « UseLeg(1992,1942) » (OutilsLeg.R:30-49,
          :69-140). Elle couvre la durée requise, le nombre d'années
          du salaire de base, la décote, la surcote et la fonction
          publique, de 1946 à 2011 : on peut calculer des droits
          contrefactuels à toute date. Le dépôt n'en prévoit que
          deux : le droit au 31 août 2023 et la loi de 2023 sans
          suspension (chantier 138.10).
        preuve: OutilsLeg.R:30-49, au commit fbaf3fa
        verification: >-
          Les barèmes IPP rangent déjà la durée, les âges et la
          proratisation par date de législation (durée requise :
          1983, 1994, 2009, 2011, 2015, 2023, 2026) : de quoi écrire
          les millésimes qui manquent au dépôt.
        etat: a_reprendre
        chantier: "138.10"
      - quoi: >-
          Son coefficient de conversion vaut
          S(40)/Σ(1+g)^(a−u)·S(u), calculé sur une table de
          mortalité du moment, hommes et femmes additionnés
          (OutilsCN.R:57-80). Le facteur S(40)/S(a) rend aux
          survivants les comptes des assurés morts entre 39 ans et
          le départ (l'indice 40 correspond à 39 ans) : c'est un
          gain d'héritage implicite. Le taux g est la croissance
          prévue moins la revalorisation des pensions. Le diviseur
          du dépôt est l'espérance de vie actualisée, conditionnelle
          à l'âge de départ, sur table de génération, avec ν = 0 par
          défaut (moteur/conversion.py:1-28, :203-245).
        preuve: OutilsCN.R:66-75, au commit fbaf3fa
        verification: >-
          Le gain d'héritage est un choix de programme, déjà posé au
          registre avec le diviseur norvégien. La table du moment
          est moins proche du réel qu'une table de génération.
        etat: a_trancher
        raison: >-
          C'est une variante de diviseur. La note du registre (« ni
          gain d'héritage explicite ») est juste à la lettre, mais
          il y en a un implicite.
    bilan: >-
      PENSIPP couvre le régime général, la fonction publique, l'Agirc,
      l'Arrco et les indépendants avec le droit de 1946 à 2011. Il ne
      calcule pas la réversion (variables rev_* seulement revalorisées,
      OutilsRetr.R:763-799) et laisse le minimum vieillesse en
      commentaire (:745, :795). Il ne fait mieux que le dépôt sur aucune
      règle en vigueur : ses apports sont des choix de programme
      (comportement de départ, crédits non cotisés dans le compte,
      diviseur avec gain d'héritage) et des contrefactuels par millésime
      de législation.
    sas: [ipp_pensipp]
    lu_le: 2026-10-04
    lu_dans:
      - https://github.com/abozio/PENSIPP
    note: >-
      Dernier commit le 22 mai 2013, aucun fichier de licence ; l'IPP donne
      le projet pour terminé. Ses paramètres viennent des barèmes de l'IPP et
      de Destinie. Un fork « allégé » qu'une recherche cite
      (`philippechataignon/pensipp`) ne répond plus.
      Comparé au dépôt le 1er octobre 2026 au commit `fbaf3fa`, du 22 mai
      2013. Son diviseur se rapporte à la survie à 39 ans
      (`OutilsPensIPP.R:244`) et part de l'âge a−1 (`OutilsCN.R:69-75`) : ni
      espérance conditionnelle à l'âge de départ, ni gain d'héritage
      explicite, une variante que le README du dépôt ne tranche pas.

  # ---- La statistique publique : l'INSEE ----------------------------------

  - id: destinie_2
    nom: Destinie 2
    auteur: INSEE
    nature: microsimulation_dynamique
    publication: ouvert
    code: https://github.com/InseeFr/Destinie-2
    documentation:
      - https://www.insee.fr/fr/information/3606338
      - https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%205_Destinie_INSEE.pdf
    licence: GPL-3.0 ou ultérieure ; paramètres sous ODbL et DbCL
    usage: executer_a_part
    confronte: [scenario_1, cout]
    couvre: >-
      Des pensions entières, ménage compris : régime général, service des
      retraites de l'État, CNRACL, indépendants, Agirc-Arrco ; droits
      directs, réversion, ASPA. La législation se choisit par année ; ses
      derniers seuils sont de 2023, sans la loi du 30 décembre 2025.
    version: "2.0, commit 4c1d34b"
    confrontation: >-
      Un calcul rejoué, fait le 5 octobre 2026 : exécuté à part dans R (la
      WSL Ubuntu du poste), sous sa législation la plus récente (`anLeg`
      2023), sur dix-huit carrières écrites des deux côtés
      (`scripts/fetch/destinie_2.py`, `destinie_2.R`) ; ses sorties sont
      figées dans `tests/temoins/destinie_2.json`, et `tests/test_destinie.py`
      y confronte le scénario 1 sans R, chaque écart déclaré avec sa cause.
      Concordent : les durées, la majoration de durée d'assurance de la mère
      et la bonification de la mère fonctionnaire, que les fiches
      `majoration_duree_assurance_enfants` et `enfants_fonction_publique`
      attendaient ; le taux plein à l'âge d'ouverture, sous la loi de 2023
      aussi ; le régime général à 0,2 % près, la pension civile à 0,6 % ;
      les majorations de 10 % ; la réversion de 54 %, de 50 % et de 60 %, sur
      les points de chacun. Le reste est aux écarts et aux points ci-dessous.
    ecarts:
      - constat: >-
          Il lève au régime général la condition d'âge de 55 ans de la
          réversion pour le survivant qui a deux enfants à charge
          (`src/Retraite.cpp:224-229`). Exécuté : la survivante de 48 ans
          touche 54 % dès le décès.
        tranche: >-
          R. 353-1, que la fiche du dépôt lit sans cette exception ; l'écart
          est le sien
        preuve: >-
          data/reference/regles/reversion.yaml ; tests/temoins/destinie_2.json,
          cas reversion_jeune_deux_enfants
      - constat: >-
          Tout couple simulé y est marié (`src/Separations.cpp:189-190` ;
          `CONCUBINAGE`, `src/Constantes.h:30`, n'est jamais affecté), ce qui
          ouvre la réversion aux concubins.
        tranche: >-
          la réversion ne s'ouvre qu'au conjoint marié, comme le lit la fiche
          du dépôt ; l'écart est le sien
        preuve: >-
          data/reference/regles/reversion.yaml (« ni le PACS ni le concubinage
          n'ouvrent la réversion »)
      - constat: >-
          La majoration de la réversion pour enfant à charge lui manque ; il
          ne majore que le survivant de trois enfants
          (`src/Reversion.cpp:98-106`).
        tranche: >-
          L. 353-5 du code de la sécurité sociale ; l'omission est la sienne
        preuve: >-
          `src/Reversion.cpp`, au commit `4c1d34b`
      - constat: >-
          Quand un seul membre du couple a 65 ans, il sert l'ASPA jusqu'au
          barème du couple (`src/Retraite.cpp:12-30`).
        tranche: >-
          service-public.fr (F16871, lu le 1er octobre 2026) : « Lorsqu'un
          seul membre de votre couple reçoit l'Aspa, le montant maximum versé
          est de 1 043,59 € par mois », sous un plafond du couple de
          1 620,18 € ; l'écart est le sien
        preuve: https://www.service-public.fr/particuliers/vosdroits/F16871
      - constat: >-
          Sans la loi du 30 décembre 2025, il ouvre les droits de la
          génération 1964 à 63 ans et lui demande 171 trimestres
          (`src/Legislation.cpp:57-59`).
        tranche: >-
          la loi du 30 décembre 2025, que le dépôt certifie : 62 ans et 9
          mois, 170 trimestres ; l'écart est le sien
        preuve: >-
          data/reference/legislation/age_ouverture_requis.csv (l. 139) et
          duree_assurance_requise.csv (l. 129)
      - constat: >-
          Il projette l'ASPA de 2025 à 12 493,58 € par an.
        tranche: >-
          le montant servi en 2025, 12 411,36 €, que le dépôt porte ; l'écart
          est le sien
        preuve: data/reference/legislation/minimum_vieillesse.csv (l. 79)
      - constat: >-
          Il réserve la majoration de durée d'assurance pour enfants
          et la surcote parentale aux mères, celle-ci dès 1964
          (`src/DroitsRetr.cpp:172`, `src/Legislation.cpp:246-250`).
        tranche: >-
          L. 351-1-2-1 vise « les assurés qui bénéficient d'au moins
          un trimestre de majoration […] au titre des articles L.
          351-4, L. 351-4-1 ou L. 351-5 », pères compris, quand
          l'âge légal atteint 63 ans ; le dépôt a raison.
        preuve: >-
          LEGIARTI000047449229 ;
          data/reference/regles/surcote_parentale.yaml:1-6
      - constat: >-
          Pour le polypensionné des régimes alignés d'avant la
          liquidation unique, il garde le même nombre d'années dans
          chaque régime : `max(1, arr(durée du régime / durée
          totale))` vaut toujours 1 (`src/DroitsRetr.cpp:516-519`).
        tranche: >-
          R. 173-4-3 : nombre d'années multiplié par la part de
          durée du régime, arrondi, au moins 1 ; le dépôt
          l'applique.
        preuve: data/reference/regles/salaire_annuel_moyen.yaml:9-16, 34-43
      - constat: >-
          Sous le plafond de la réversion du régime général, il
          compte les réversions de l'Agirc-Arrco, et deux fois la
          réversion du RG pour le survivant qui n'a pas liquidé
          (`src/Retraite.h:269-275`, `src/Retraite.cpp:347-354`) ;
          deux fois l'Arrco dans le test de la majoration de 11,1 %
          (`src/Retraite.cpp:368`). Exécuté : une survivante dont la
          pension approche le plafond voit sa réversion écrêtée de
          13 %, que le dépôt sert entière.
        tranche: >-
          R. 353-1 : les ressources « ne comprennent pas […] les
          avantages de réversion servis par les régimes légalement
          obligatoires complémentaires » ; un montant ne compte
          qu'une fois.
        preuve: >-
          LEGIARTI000038790257 ; tests/temoins/destinie_2.json, cas
          reversion_plafond
      - constat: >-
          Il revalorise les salaires portés au compte d'une année de
          trop : sa chaîne part du coefficient de l'année de la
          liquidation (`DroitsRetr::SalBase`, `revalcum =
          RevaloSPC[date]`), quand celle de la Cnav s'arrête au
          coefficient de l'année qui la précède. Exécuté : le salaire
          annuel moyen d'un départ de 2024 dépasse de 3,75 % celui de
          la colonne du 1er janvier 2024 ; de 0,13 % pour un départ de
          2018, quand les revalorisations successives se ressemblent.
        tranche: >-
          la colonne des coefficients que la Cnav publie pour les
          pensions prenant effet en 2024, que le dépôt sert à
          l'identique ; l'écart est le sien
        preuve: >-
          tests/temoins/cnav_revalorisation_salaires.json (colonne
          2024-01-01) ; tests/temoins/destinie_2.json, cas
          loi_2023_salaire_moyen
      - constat: >-
          Il compte la surcote de l'année civile où tombe l'âge
          d'ouverture sans regarder le mois de naissance
          (`DroitsRetr::DecoteSurcote`). Exécuté : né en octobre 1961,
          parti à 62 ans et 3 mois en février 2024 sans un jour de
          travail après cet âge, il reçoit trois trimestres de surcote,
          un taux de 51,875 %.
        tranche: >-
          L. 351-1-2 : la majoration vaut pour la durée d'assurance «
          accomplie après l'âge prévu au premier alinéa de l'article
          L. 351-1 » ; le dépôt n'en compte aucune ; l'écart est le sien
        preuve: >-
          LEGIARTI000025014540 ; tests/temoins/destinie_2.json, cas
          rg_ne_en_octobre
      - constat: >-
          Il revalorise toutes les pensions de 2020 d'un même taux
          moyen, 0,74 % au régime général et 0,58 % dans la fonction
          publique (ParamRetrBase, RevaloRG et RevaloFP).
        tranche: >-
          loi n° 2019-1446, art. 81, et circulaire Cnav 2020/9 : 1 %
          jusqu'à 2 000 € de retraites par mois, dégressif jusqu'à 0,3
          % ; le dépôt sert le taux de chaque pension ; l'écart est le
          sien
        preuve: >-
          data/reference/legislation/revalorisation_pensions.csv
          (2020) ; tests/temoins/destinie_2.json, cas
          reversion_fonctionnaire
      - constat: >-
          Il réverse au survivant de trois enfants 54 % de la pension
          du défunt revalorisée, moins sa majoration pour enfants
          non revalorisée (`src/Reversion.cpp`, `pension_rg -
          liq->majo_3enf_rg`) : la base excède de 0,6 % en cinq ans
          celle qui l'ôte. Qu'il oppose au plafond la réversion sans sa
          propre majoration de 10 %, que ce registre lui reprochait
          jusqu'au 7 octobre 2026, est ce que fait la caisse : la
          majoration pour enfants « est égale à 10 % du montant non
          majoré de la retraite de réversion », réduite pour ressources,
          et s'y ajoute (circulaire Cnav n° 2022-26, § 3.6) ; le dépôt
          fait de même depuis ce jour.
        tranche: >-
          la majoration du défunt n'entre pas dans la pension
          réversible, que la Cnav calcule « sans avantages
          complémentaires » (exposé « Retraite de l'assuré décédé ») ;
          l'écart, −0,6 % sur ce cas, est le sien
        preuve: >-
          tests/temoins/destinie_2.json, cas reversion_trois_enfants ;
          tests/test_destinie.py, ECARTS
      - constat: >-
          Il reverse la majoration pour enfants du défunt à l'Agirc-Arrco
          avec la retraite qu'elle majore, au taux de la réversion, 60 %.
        tranche: >-
          accord national interprofessionnel du 17 novembre 2017, article
          109 : « Les majorations pour enfants nés ou élevés applicables aux
          droits du participant décédé sont réversibles au taux de 100% » ;
          le dépôt la reverse en entier depuis le 5 octobre 2026 ; l'écart
          est le sien
        preuve: >-
          data/reference/regles/reversion_agirc_arrco.yaml ;
          tests/temoins/destinie_2.json, cas reversion_trois_enfants
      - constat: >-
          Sa valeur de service de l'Agirc-Arrco de 2024, 1,4463 €, est
          la projection des hypothèses du COR de 2023.
        tranche: >-
