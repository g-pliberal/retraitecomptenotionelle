  - id: legiretraite
    nom: legiretraite (paquet R)
    auteur: DREES, bureau des retraites
    nature: parametres
    publication: ouvert
    code: https://git.drees.fr/drees_code_public/outils/legiretraite
    licence: EUPL-1.2, déclarée dans DESCRIPTION et le README, sans fichier de licence
    usage: executer_a_part
    confronte: [scenario_1]
    couvre: >-
      Par génération, caisse et catégorie : l'âge d'ouverture (droit commun,
      État et CNRACL sédentaires, actifs et super-actifs, exploitants,
      CNAVPL, Ircantec, Agirc-Arrco, régimes spéciaux), l'âge d'annulation de
      la décote, l'âge maximum, les durées requise et de proratisation ; les
      revalorisations par caisse ; les tables de l'EACR 2026.
    confrontation: >-
      Des paramètres à comparer : ses âges d'ouverture suivent déjà la loi du
      30 décembre 2025 (62 ans et 9 mois pour 1964, 63 ans à partir d'avril
      1965).
    ecarts:
      - constat: >-
          Son fichier `dureeRequise.csv`, sans date d'effet, donne 171
          trimestres à la génération 1964 et 172 à 1965, les valeurs de la loi
          de 2023, quand ses âges suivent la loi du 30 décembre 2025.
        tranche: >-
          L. 161-17-3 dans sa rédaction de 2025, que le dépôt certifie à la
          base LEGI : 170 pour 1964, 170 puis 171 pour 1965 ; l'écart est le
          sien
        preuve: data/reference/legislation/duree_assurance_requise.csv
      - constat: >-
          Le retard de `dureeRequise.csv` sur la loi du 30 décembre 2025 ne
          touche pas que le droit commun : l'actif de la fonction publique y a
          171 trimestres pour 1969 et 172 pour 1970, et de même le
          super-actif, l'exploitant, l'invalide et l'Agirc-Arrco ;
          `dureeProratisation.csv` aussi.
        tranche: >-
          la loi du 30 décembre 2025, comme pour le droit commun ; l'écart est
          le sien
        preuve: >-
          `inst/extdata/dureeRequise.csv:136-143` et
          `inst/extdata/dureeProratisation.csv`, au commit `98d2cbb`
      - constat: >-
          Son `aod.csv` ouvre les droits de l'actif à 58 ans dès la génération
          de janvier 1970, et ceux du super-actif à 53 ans dès janvier 1975
          (`inst/extdata/aod.csv:31, 33, 85, 87`).
        tranche: >-
          le décret n° 2023-435, art. 13 (LEGIARTI000054059137), lu dans
          l'index LEGI du dépôt : « cinquante-sept ans et neuf mois pour ceux
          nés entre le 1er janvier 1968 et le 31 mars 1970 ; […]
          cinquante-huit ans pour ceux nés entre le 1er avril 1970 et le 31
          décembre 1970 » ; le dépôt a raison, l'écart est le sien
        preuve: data/reference/legislation/categorie_active.csv
    fait_mieux:
      - quoi: >-
          Il embarque les tables de l'EACR, dont la répartition des retraités
          de droit direct par taux de CSG, fin 2023 (source « Ancetre
          2024 ») : 22,1 % d'exonérés, 13,4 % au taux réduit, 21,6 % au taux
          médian, 42,9 % au taux plein. Le dépôt n'utilise pas cette table
          (`pages.js:10839`) et retire 9,1 % à tous.
        preuve: >-
          `inst/extdata/drees/eacr/a-prelevements-sociaux.parquet`, au commit
          `98d2cbb`
        etat: a_reprendre
        chantier: "138.3"
    sas: [drees_legiretraite]
    lu_le: 2026-10-01
    lu_dans:
      - https://git.drees.fr/drees_code_public/outils/legiretraite
    note: >-
      Créé le 7 septembre 2026, version 0.1.6 du 18 septembre, pas encore sur
      le CRAN. Il sert l'âge d'ouverture de TRAJECTOiRE ; ses tests citent un
      commit de TRAJECTOiRE de janvier 2026 absent du dépôt public, et une
      page syndicale comme source des valeurs de 2026.
      Comparé au dépôt le 1er octobre 2026 au commit `98d2cbb`, du 18
      septembre.

