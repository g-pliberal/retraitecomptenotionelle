  # ---- Les caisses -------------------------------------------------------

  - id: prisme
    nom: PRISME
    auteur: Cnav
    nature: microsimulation_dynamique
    publication: non_public
    documentation:
      - https://www.statistiques-recherche.lassuranceretraite.fr/app/uploads/2009/11/simulations-effets-passage-calcul-pensions-rg-a-systeme-en-comptes-notionnels_evolution.pdf
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition, cout]
    couvre: >-
      Le régime général, projeté ; en 2009, sa bascule en comptes
      notionnels, la seule étude française qui fasse la même opération que le
      dépôt, paramètres publiés.
    confrontation: >-
      Des résultats publiés à retrouver : masses de prestations inférieures
      de 7 % en 2050, l'effet d'une table de mortalité par génération, la
      part des droits non contributifs dans les comptes.
    manifeste: [cnav_comptes_notionnels_2009, cor_septieme_rapport]
    lu_le: 2026-10-01
    lu_dans: [data/sources.yaml]

  # ---- Le COR ------------------------------------------------------------

  - id: maquette_sg_cor
    nom: Maquette simplifiée du secrétariat général du COR
    auteur: COR
    nature: projection
    publication: documente
    licence: sans objet
    usage: resultats_publies
    confronte: [proposition]
    couvre: >-
      Un système en répartition stylisé, soumis à des chocs, calculé en
      annuités, en points et en comptes notionnels (séance du 5 juillet 2017).
    confrontation: >-
      Des résultats publiés à retrouver : l'équilibre d'un régime notionnel
      revalorisé sur la masse salariale, la cohérence du coefficient de
      conversion avec la revalorisation des pensions, des déficits
      transitoires « de l'ordre de 10 % de la masse des cotisations » sur un
      choc démographique.
    manifeste: [cor_retour_septieme_rapport]
    lu_le: 2026-10-01
    lu_dans: [data/sources.yaml]

  # ---- L'Urssaf : les règles publicodes ----------------------------------

  - id: modele_ti
    nom: modele-ti
    auteur: Urssaf (mon-entreprise)
    nature: calculateur
    publication: ouvert
    code: https://github.com/betagouv/mon-entreprise
    documentation: [https://www.npmjs.com/package/modele-ti]
    licence: MIT
    usage: copier
    confronte: [scenario_1]
    couvre: >-
      Les règles publicodes des travailleurs indépendants : cotisations,
      trimestres et points de la CNAVPL, de la Cipav et du RCI, la réforme
      de l'assiette de 2025 comprise ; environ une règle sur deux cite sa
      source.
    version: "0.1.0"
    confrontation: >-
      Un calcul rejoué : le simulateur en ligne de l'Urssaf le charge, et une
      grille de revenus de 2024 à 2026 y rend les points de la CNAVPL et les
      cotisations de la Cipav du dépôt au dixième près.
    ecarts:
      - constat: >-
          Chez nous, l'assiette minimale de 2025 (450 SMIC horaires) ne
          validait que deux trimestres : une division en virgule flottante
          rendait 2,999….
        tranche: l'erreur était la nôtre, corrigée, et tenue par tests/test_sections_liberales.py
        preuve: data/sources_a_explorer.yaml (mon_entreprise_cipav)
      - constat: >-
          Il appelle la cotisation minimale à revenu nul, dont les
          bénéficiaires du RSA sont dispensés.
        tranche: le droit dispense, et ni lui ni le dépôt ne savent qui touche le RSA ; écart déclaré
        preuve: docs/archives/limites.md (« Les dernières sections libérales »)
    sas: [mon_entreprise_cipav]
    lu_le: 2026-10-01
    lu_dans:
      - https://registry.npmjs.org/modele-ti
      - data/sources_a_explorer.yaml
    note: >-
      Paquet npm `modele-ti` 0.1.0 du 16 juillet 2026, licence MIT, dans le
      répertoire `modele-ti` du dépôt de mon-entreprise.

  - id: modele_social
    nom: modele-social
    auteur: Urssaf (mon-entreprise)
    nature: calculateur
    publication: ouvert
    code: https://github.com/betagouv/mon-entreprise
    documentation: [https://www.npmjs.com/package/modele-social]
    licence: MIT
    usage: copier
    confronte: [scenario_1]
    couvre: >-
      Les règles publicodes du système social français : les cotisations de
      tous les statuts, vieillesse comprise, datées.
    version: "11.1.0"
    confrontation: >-
      Des paramètres à comparer : ses taux de cotisation vieillesse, datés,
      lisibles par machine, aux taux que le dépôt lit au texte.
    ecarts:
      - constat: >-
          Le paquet porte encore les paramètres d'avant 2025 : 8,23 % et
          525 points pour la CNAVPL, 9 et 22 % pour la Cipav.
