# L'étape « faire vivre » (docs/architecture.md, § 7.4) : ce que devient une
# pension liquidée, jusqu'à une échéance. Chaque régime suit la règle de son
# texte : la valeur de service de son point, l'article L. 161-23-1 et ses
# tranches de 2020, la péréquation puis les décrets de la fonction publique,
# le taux des fonctionnaires pour les régimes spéciaux. La majoration pour
# enfants suit les régimes qui la portent, chaque part au coefficient du sien.
# Les petites pensions prises avant le 1er septembre 2023 reçoivent depuis la
# majoration exceptionnelle de la loi n° 2023-270 (article 18, V), et les
# exploitants au taux plein le relèvement de leur RCO (article 18, VI).
# Une revalorisation ne relance jamais la liquidation.
#
# L'échéancier l'applique à l'échéance qu'on lui demande, sur toutes les
# pensions du bénéficiaire, après les liquidations du jour.
#
# src/retraite_notionnelle/revalorisation.py (`faire_vivre`), et son jumeau
# moteur/js/revalorisation.js.

etape: faire_vivre
schema_version: 1
lit: [liquidation]
ecrit: revalorisation

objets:

  revalorisation:
    champs:
      schema_version: {porte: "la version de ce schéma", type: entier, obligatoire: true}
      personne: {porte: "la personne dont les pensions sont servies", type: identifiant, obligatoire: true}
      date: {porte: "l'échéance à laquelle les pensions sont menées", type: date, obligatoire: true}
      regimes: {porte: "le coefficient nominal de chaque pension de régime, du départ à l'échéance", type: liste, de: {objet: regime}, defaut: []}
      majoration: {porte: "le coefficient de la majoration pour enfants, chaque part à celui du régime qui la porte", type: nombre, obligatoire: true}
      mensuel_decembre_2019: {porte: "le montant total brut mensuel de décembre 2019, qui a choisi la tranche de 2020, quand la pension a traversé cette date", type: nombre, defaut: null}
      fiabilite: {porte: "le niveau des coefficients lus", type: texte, obligatoire: true}

  regime:
    champs:
      regime: {porte: "le régime", type: identifiant, obligatoire: true}
      coefficient: {porte: "le coefficient nominal qui mène sa pension du départ à l'échéance", type: nombre, obligatoire: true}
      regle: {porte: "la règle suivie, sous le nom que la page lui donne (point, regime_general, fonction_publique, regime_special, par_defaut)", type: texte, obligatoire: true}
      revision: {porte: "ce que la révision du minimum contributif retire, en euros de l'échéance, quand une pension étrangère commence après le départ (R. 173-8)", type: nombre, defaut: 0}
      plancher_non_majore: {porte: "ce que les majorations forfaitaires de 1972 à 1982, que le coefficient porte, ne donnent pas au plancher auquel la pension est portée — le minimum des pensions, l'AVTS, la pension d'invalidité de l'ex-invalide —, retiré, en euros de l'échéance : elles relèvent « le montant de base, avant comparaison au minimum » (fiche majorations_forfaitaires_1972_1982)", type: nombre, defaut: 0}
      majoration_exceptionnelle: {porte: "la majoration exceptionnelle des petites pensions due depuis le 1er septembre 2023, en euros de l'échéance (loi n° 2023-270, article 18, V)", type: nombre, defaut: 0}
      relevement_des_exploitants: {porte: "ce que le taux plein ouvre depuis le 1er septembre 2023 à la RCO d'un chef d'exploitation parti avant, points gratuits et complément différentiel, en euros de l'échéance (loi n° 2023-270, article 18, VI)", type: nombre, defaut: 0}
      plans_de_revalorisation: {porte: "ce que la révision des plans de revalorisation de 1997 à 2008 ajoute à la base d'un chef d'exploitation parti de 1997 à 2008, à la règle des pensions dues jusqu'en 2008, en euros de l'échéance (décrets n° 97-163, 2001-170, 2002-297, 2002-298)", type: nombre, defaut: 0}
      pension_majoree_de_2009: {porte: "la pension majorée de référence que la loi n° 2008-1330 ouvre le 1er janvier 2009 aux pensions agricoles prises avant, en euros de l'échéance (D. 732-109 à D. 732-115)", type: nombre, defaut: 0}
      majoration_conjoint_a_charge: {porte: "la majoration pour conjoint à charge que la pension porte à l'échéance, nominale, que le coefficient ne mène pas (L. 351-13)", type: nombre, defaut: 0}
      fiabilite: {porte: "le niveau de ce coefficient", type: texte, obligatoire: true}
