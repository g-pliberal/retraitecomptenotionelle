      décision, laissée au propriétaire, sur la retraite progressive et
      le cumul, que le code exclut aujourd'hui.
    etape: 2
  "23":
    titre: "Le profil des assurés cumulant emploi et retraite"
    page: 198
    sources: ["Insee, enquête Emploi", "EACR", "EIR 2020", "EIC 2021"]
    statut: a_tirer
    a_tirer: >-
      Le profil des cumulants — âge, catégorie, temps de travail
      (tableaux 1 à 3) — et la part des retraités de la génération 1950
      qui ont cumulé avant 67 ans, 21,4 % (tableaux 5 et 6), à
