  "15":
    titre: "L’âge moyen de départ à la retraite et son évolution"
    page: 138
    sources: ["EIR 2020", "EACR", "ANCETRE", "Insee"]
    statut: confronte
    au_depot: [drees_age_conjoncturel, drees_eir_generations, drees_panorama_retraites_2026_classeurs]
    a_tirer: >-
      Porté à l'étape 2 : l'âge conjoncturel de départ de 2023 et 2024
      (graphique 1), 62,95 ans fin 2024, « 62 ans et 11 mois », certifié
      dans `age_conjoncturel_depart.csv` en appoint du jeu du portail, qui
      s'arrête à 2022 ; le panorama révise de quelques centièmes des
      années anciennes, qu'il ne touche pas. L'âge moyen par génération
      (graphiques 5 et 6), confronté aux départs de la grille de la page
      Coût le 5 novembre 2026, à l'étape 5 (ci-dessous). L'âge conjoncturel
      par régime (graphique 2) et l'espérance de durée de retraite
      (graphique 7) sont confrontés le 6 novembre 2026 : le premier à l'âge
      où la cohorte de chaque cas type est retraitée en 2024, pesé de son
      poids (la grille n'a pas de taux de départ par âge, elle a les âges de
      ses cohortes) ; le second à l'espérance de vie à 60 ans que la formule
      de la source suppose, déduite de ses deux graphiques.
    etape: 4
    confrontation: >-
      Les cas types de la grille nés en 1950 et 1955 partent à 61,03 et
      62,09 ans, pour 60,46 et 61,59 dans le régime principal : une
      demi-année trop tard, de 0,5 et 0,1 an au régime général, de 2,4 et
      2,3 ans à la CNRACL, de deux ans et un an et demi à l'État civil, le
      fonctionnaire actif partant à 60 ans ; l'exploitant part quelques
      mois trop tôt. Écart déclaré : la grille n'est pas une population.
      L'âge conjoncturel de 2024 (graphique 2), à l'âge où la cohorte de
      chaque cas type est retraitée, pesé de son poids : 62,78 ans au régime
      général pour 63,6 (−0,82), 63,18 à l'État civil pour 63,18 (un accord),
      57 pour la CNIEG pour 60,2 (−3,2), 52 pour la SNCF pour 59,22 (−7,22 :
      le seul conducteur). L'espérance de vie à 60 ans que la formule du
      graphique 7 impliquerait (durée + âge de départ − 60), si l'âge de sa
      formule était celui du graphique 5 (hypothèse du test : la source ne le
      dit pas), est celle des tables du dépôt à 0,1 an pour les hommes (+0,03,
      +0,02, +0,03 et −0,05 aux générations 1930, 1950, 1955 et 1957), plus
      basse pour les femmes, de 0,06 à 0,33 an ; la durée de retraite que la
      grille donne à ses hommes
      est plus courte, de 1,13 an à 1950 et 0,92 à 1955, parce qu'ils
      partent plus tard (graphiques 5 et 6). Écarts déclarés, rien
      n'est corrigé (décision 11).
    confronte_par:
      - test_la_grille_fait_partir_ses_fonctionnaires_trop_tard
      - test_l_age_conjoncturel_de_la_grille_est_celui_de_ses_cas_types_au_premier_age_ou_leur_cohorte_est_retraitee
      - test_la_duree_de_retraite_du_depot_est_celle_de_la_drees_a_quelques_dixiemes_pres_et_la_grille_part_trop_tard
    solde: >-
      Soldée le 6 novembre 2026 (étape 7) : lus, les graphiques 3, 3 complémentaire et 4.
      Recoupés : l'âge conjoncturel du graphique 1 est 50 plus la somme, de 50 à 70 ans, des
      parts de non-retraités du graphique 3 (ensemble) et de son complément (femmes, hommes),
      pour les 63 valeurs de 2004 à 2024, à 0,0049 an ; le taux de retraités à 62-67 ans de 2023
      et 2024 est le même aux graphiques 3 et 4 et à la fiche 16, la table C de l'EACR en
      donnant 0,45 (62 ans) à 2,13 (67 ans) points de plus (champs différents, écart non
      expliqué). Deux défauts déclarés : le bloc « Ensemble » du complément diffère du graphique
      3 en 2023 (16 âges, jusqu'à 0,32 point ; l'âge qu'on en tire, 62,733, n'est pas le publié,
      62,75) ; le dépôt (`age_conjoncturel_depart.csv`) garde l'âge du portail de 2004 à 2022,
      que le panorama donne jusqu'à 0,10 an plus bas (femmes, 2013). Aucune erreur établie,
      trois écarts du dépôt à la source non expliqués, ni tranchés ni disculpés : le taux de
      retraités de la table C (0,45 à 2,13 points de plus ; les 5 % de résidents à l'étranger du
      folio 38 sont une moyenne tous âges : explication plausible, l'écart croissant avec l'âge,
      non démontrée), l'âge conjoncturel du portail (20 valeurs sur 63 diffèrent de plus de
      0,005 an, de 2004 à 2013 pour les femmes et l'ensemble ; la source ne dit pas laquelle des
      deux séries est révisée) et, à la fiche 16, six classes à un point. Le texte du folio 142
      écrit « 61 ans et 7 mois » pour la génération 1957, quand le graphique 5 donne 61,85 (61
      ans et 10 mois) et 61,59 pour 1955 : coquille ou autre édition, non tranché, à ne pas
      citer pour 1957.
    recoupe_par:
      - test_l_age_conjoncturel_de_la_fiche_15_est_50_plus_les_parts_de_non_retraites_du_graphique_3
      - test_le_bloc_ensemble_du_complement_du_graphique_3_differe_en_2023_et_le_depot_garde_le_millesime_du_portail
      - test_le_taux_de_retraites_par_age_est_le_meme_d_une_feuille_a_l_autre_et_proche_de_la_table_c
  "16":
    titre: "La diversité des âges de départ à la retraite"
    page: 145
    sources: ["EACR", "EIR 2020", "ANCETRE", "Insee"]
    statut: confronte
    au_depot: [drees_eacr_tables, drees_panorama_retraites_2026_classeurs]
    a_tirer: >-
      Recoupée à l'étape 2 (`tests/test_drees_panorama_2024.py`) : la
      répartition des nouveaux retraités de 2024 par âge (graphique 3), au
      régime général, aux deux MSA et à la CNRACL, les liquidants de la table
