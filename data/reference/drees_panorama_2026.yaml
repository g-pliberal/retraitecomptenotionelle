      27). La part dans la population (colonne F) repose sur l'estimation de l'INSEE au 1er
      janvier 2025, que le dépôt n'a pas (il a une projection) : 4,32 % publié, entre 4,29 et
      4,36 avec les deux populations du dépôt. Lus sans contrepartie au dépôt : le tableau 3
      (type de pension) et le tableau 4 (carrière), tous deux de fin 2020 (EIR 2020, titres en
      B2), non de 2024, non confrontés cellule par cellule ; hors champ : la carte 1, par
      département.
    recoupe_par:
