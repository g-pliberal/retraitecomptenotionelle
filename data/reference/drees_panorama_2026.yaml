      1, 2 et 4), que `test_controle_eacr.py` confronte à la grille. Portés à
      l'étape 6 : les nés en 1953 par âge de première liquidation, par sexe,
      et leur âge moyen, 61,3 ans (tableau 1), les générations 1930 à 1952
      (graphique 5), et les nés en 1953 par régime principal, leur âge et leur
      répartition (tableau 2), à `retraites_generations.csv`, aux référents.
      Les départs après 67 ans (encadré 2), chiffrés dans le seul PDF, sont
      cités au témoin des confrontations ; le tableau 1, le tableau 2 et
      l'encadré 2 sont confrontés à la grille (5 novembre 2026), puis, le 6
      novembre, le graphique 3 (nouveaux retraités de 2024 par âge, par
      régime) et le tableau 2 complémentaire (par sexe), qui lisent les
      cellules du classeur. Deux défauts de la source sont déclarés au
      témoin : le texte dit « environ 4 % » de moins de 60 ans quand le
      graphique 3 en donne 3,3 % et son complément 4,2, et la ligne des
      professions libérales du complément est celle de la SNCF.
    etape: 7
    confrontation: >-
      Les cas types de la grille nés en 1953 partent à 61,83 ans en moyenne,
      pour 61,3 au tableau 1 (EIR 2020) : leurs hommes à 61,93, pour 60,8 ;
      leurs femmes, un seul cas type, à 61,0, pour 61,6. 5,5 % des hommes de
      la grille partent avant 60 ans, pour 22 %, et personne à 67 ans ou plus,
      pour 1 %. Au tableau 2, le fonctionnaire de la grille part à l'âge des
      agents sédentaires : 62,29 ans à la CNRACL, pour 59,8, et 62,57 une fois
      neutralisés les départs avant l'âge d'ouverture, pour 62,0 ; à l'État
      civil, 61,97 pour 60,0, et 62,61 neutralisé pour 62,2. La grille ne
      compte pas les départs d'avant 60 ans des fonctionnaires, 34,2 % de
      ceux de l'État civil, 7,95 % dans la grille. L'encadré 2 (« environ 1 %
      » des départs à 68-70 ans, « environ 0,2 % » à 71-74 ans) n'a pas son
      pendant : la grille ne fait partir personne à 68 ans ou plus, ni la
      population (mesure de l'action 138, du 5 novembre 2026). Au graphique
      3, les nouveaux retraités de 2024 de la grille ne partent à aucun des
      âges de 61 et 66 ans (9,3 et 5,0 % publiés), deux fois et demie trop à 60
      et 65 ans, six fois trop peu après 66 ans, à 27,0 points de la
      répartition publiée tous régimes, 31,1 au régime général ; chaque autre
      régime n'a qu'un âge de départ en 2024. Au complément du tableau 2, par
      sexe, la grille part trop tard pour ses hommes au régime général (+0,97
      an), à l'État civil (+2,07), à la CNRACL (+1,29) et aux professions
      libérales (+1,30), trop tôt aux régimes spéciaux (−3,94), à la MSA
      non-salariés (−1,00) et pour sa seule femme (−1,40) ; la CNRACL pèse 2,6
      fois sa part publiée chez les hommes. L'écart se déclare, il ne se
      corrige pas : la grille du coût est laissée (décision 11).
    confronte_par:
      - test_la_grille_fait_partir_ses_nes_en_1953_a_trop_peu_d_ages_et_trop_tard
      - test_la_grille_part_a_l_age_des_agents_apres_neutralisation_et_non_a_celui_de_la_fonction_publique
      - test_la_grille_ne_fait_partir_personne_apres_67_ans_quand_l_eir_et_le_panorama_en_comptent
      - test_la_grille_met_chaque_regime_de_2024_a_un_ou_deux_ages_quand_la_source_les_etale
      - test_le_graphique_3_complementaire_repete_la_sncf_pour_la_cnavpl_et_la_source_dit_4_pour_cent_de_moins_de_60_ans
      - test_la_grille_part_a_l_age_des_hommes_de_chaque_regime_et_de_sa_seule_femme_et_les_pese_autrement
    solde: >-
      Soldée le 6 novembre 2026 (étape 7) : lus, les graphiques 1, 2, 4 et 5 complémentaire.
      Recoupés : le graphique 1 redonne, à l'identique, les taux de retraités du graphique 4 de
      la fiche 15 (62-67 ans, 2023 et 2024) et, pour 2024, les taux de nouveaux retraités du
      graphique 2 (50 à 70 ans) ; en 2023 les deux millésimes diffèrent à 19 âges (jusqu'à 0,60
      point à 62 ans), point non tranché ; le graphique 4 se somme, ses femmes de 50 à 56 ans
      font 0,48 comme leurs taux du graphique 1, et s'écarte du graphique 1 de 0,02 à 0,27 point
      à 60-61 ans (le champ du graphique 4 est la rente) ; le complément du graphique 5 retrouve
      le tableau 1 de la génération 1953 à un point près (six écarts d'un point sur seize comparaisons, huit classes regroupées et deux sexes : trois sur des classes regroupées, où une somme d'entiers arrondis peut s'écarter d'un point, trois sur une classe seule, que l'arrondi n'explique pas ; la source ne départage pas de deux millésimes). Non porté à `data/reference/` : la table B de
      l'EACR, que `test_controle_eacr.py` confronte à la grille, porte déjà les taux par âge.
    recoupe_par:
      - test_le_taux_de_retraites_par_age_est_le_meme_d_une_feuille_a_l_autre_et_proche_de_la_table_c
      - test_les_taux_de_nouveaux_retraites_avant_62_ans_par_type_de_regime_de_la_fiche_16_se_somment_et_ceux_de_50_a_56_ans_des_femmes_sont_ceux_du_graphique_1
      - test_le_graphique_5_complementaire_de_la_fiche_16_retrouve_le_tableau_1_de_la_generation_1953_a_un_point_pres
