    etape: 4
    confrontation: >-
      Le recours de 50 % de la garantie est celui des personnes seules,
      compté en têtes ; en euros, il serait de 62 %, le non-recours
      baissant avec le montant : le coût de la garantie est sous-estimé
      d'un cinquième, erreur du modèle pour l'étape 5.
    confronte_par:
      - test_le_recours_a_la_garantie_est_celui_des_tetes_et_non_des_euros
  "29":
    titre: "Les dispositifs d’épargne retraite supplémentaire"
    page: 240
    sources: ["Législation"]
    statut: confronte
    a_tirer: >-
      Les règles des produits d'épargne retraite — les trois
      compartiments du PER, la sortie en rente ou en capital, les
      prélèvements sur les cotisations et les rentes (tableau 1, encadrés
      1 et 2) —, confrontées à celles du pilier capitalisé de la
      proposition, « logé dans l'enveloppe du PER » (README), et de sa
      capitalisation volontaire.
    etape: 4
    confrontation: >-
      Le pilier sert tout en rente viagère, quand le compartiment 1 du
      PER laisse sortir en capital ; son régime fiscal n'est pas dit :
      écart déclaré.
    confronte_par:
      - test_le_pilier_sert_en_rente_ce_que_le_per_laisse_sortir_en_capital
  "30":
    titre: "Les masses financières relatives à la retraite supplémentaire"
    page: 250
    sources: ["Enquête Retraite supplémentaire 2005 à 2024"]
    statut: confronte
    a_tirer: >-
      Les masses de la retraite supplémentaire en 2024 — 21,4 milliards
      d'euros de cotisations, 8,9 milliards de prestations, les
      provisions, et sa part dans l'ensemble des retraites (graphiques 1
      à 5) —, confrontées aux flux que le pilier capitalisé et la
      capitalisation volontaire de la proposition feraient passer par le
      PER.
    etape: 4
    confrontation: >-
      Les 10 points capitalisés de la proposition font plus du tiers des
      prélèvements de retraite, six fois et demie les 5,4 % de la
      retraite supplémentaire en 2024 : comparaison déclarée.
    confronte_par:
      - test_le_pilier_ferait_de_la_capitalisation_le_tiers_des_cotisations
  "31":
    titre: "Les adhérents et le montant des cotisations de retraite supplémentaire"
    page: 260
    sources: ["Enquête Retraite supplémentaire 2024", "Insee, enquête Emploi"]
    statut: confronte
    a_tirer: >-
      Les 18,5 millions de contrats fin 2024, la part des personnes en
      emploi qui cotisent et les cotisations annuelles moyennes par
      dispositif (graphiques 1 à 7), confrontées à la convention de la
      proposition, une capitalisation volontaire de 5 % de l'assiette,
      entièrement à la charge de l'assuré.
    etape: 4
    confrontation: >-
      La capitalisation volontaire de 5 % vaut 2 045 euros au salaire
      moyen de 2024, les deux tiers des 3 160 euros d'un versement moyen
      à un contrat individuel : comparaison déclarée.
    confronte_par:
      - test_la_capitalisation_volontaire_vaut_les_deux_tiers_d_un_versement_au_per
  "32":
    titre: "Les bénéficiaires et le montant des prestations versées au titre de la retraite supplémentaire"
    page: 267
    sources: ["Enquête Retraite supplémentaire 2010 à 2024", "ANCETRE"]
    statut: confronte
    a_tirer: >-
      Les 2,7 millions de prestations de 2024, le montant moyen d'une
      rente viagère et ses tranches, la part des sorties en rente
      (graphiques 1 à 7), confrontés aux rentes que le pilier capitalisé
      de la proposition sert ; les frais des PER sont déjà au dépôt par
      l'OPEF (`opef_rapport_annuel`).
    etape: 4
    confrontation: >-
      La rente du pilier à maturité, 15,6 % du dernier revenu au salaire
      moyen, passe trois fois la rente moyenne de 2024, 4,5 % du salaire
      moyen : comparaison déclarée.
    confronte_par:
      - test_la_rente_du_pilier_a_maturite_passe_trois_fois_celle_d_aujourd_hui
  "33":
    titre: "Le PER d’entreprise collectif"
    page: 274
    sources: ["Dares, Acemo-Pipa et Acemo-TPE"]
    statut: hors_champ
    a_tirer: >-
      Le PER d'entreprise collectif, que 27 % des salariés du secteur
      marchand non agricole ont en 2023, mêle versements des salariés et
      abondement de l'employeur : la capitalisation volontaire de la
      proposition exclut tout cofinancement de l'employeur (README), et
      le modèle ne représente pas l'épargne salariale.
  "34":
    titre: "La retraite supplémentaire d’entreprise"
    page: 280
    sources: ["Dares, Acemo-Pipa 2023"]
    statut: hors_champ
    a_tirer: >-
      La retraite supplémentaire d'entreprise, contrats à prestations ou
      à cotisations définies que près de 7 % des entreprises de 10
      salariés ou plus proposent en 2022 : des régimes d'employeur, hors
      du modèle et de la proposition, dont la capitalisation volontaire
      est à la seule charge de l'assuré.
