      l'était). Recoupés : les effectifs par âge du tableau 1 (753 900 allocataires de 62 ans ou
      plus, 691 100 de 65 ans ou plus) et la répartition par sexe et situation conjugale du
      tableau 2 (77,04 % de personnes seules, 56,36 % de femmes) sont ceux du classeur de
