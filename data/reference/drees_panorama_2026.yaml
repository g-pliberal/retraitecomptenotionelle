  "27":
    titre: "Les allocataires du minimum vieillesse et les allocations versées"
    page: 226
    sources: ["EACR 2024", "Enquête sur les allocations du minimum vieillesse", "Caisse des dépôts", "FSV"]
    statut: confronte
    au_depot: [insee_allocataires_minimum_vieillesse, drees_panorama_retraites_2026_classeurs]
    a_tirer: >-
      Les 754 460 allocataires de l'ASV ou de l'Aspa fin 2024, que le classeur
      de l'INSEE redonne à 552 près (`allocataires_minimum_vieillesse.csv`),
      sont recoupés par `tests/test_recours_aspa.py` (action 138, étape 14).
      Portés à l'étape 6 : les allocataires de fin 2024 par régime de
      versement et par territoire, l'ASI comprise (tableau 1), à
      `minimum_vieillesse_regimes.csv`, et ceux de 1960 à 2024, avec leur part
      parmi les 60 et les 65 ans ou plus (graphique 1), à
      `minimum_vieillesse_effectifs.csv`. Les dépenses (4,6 milliards
      d'euros d'ASV et d'Aspa en 2024, 4,8 avec le premier étage) et les
      montants moyens (466 et 527 euros par mois), que le PDF chiffre et que
      le classeur ne porte pas, sont cités au témoin des confrontations et
      confrontés à la garantie de la page (5 novembre 2026). Les 70 660
      nouveaux allocataires, que le seul texte chiffre, sont recoupés le 6
      novembre par le tableau 5 de la fiche 28 (70 700) et par la chaîne des
      hausses du texte, et confrontés au stock et aux décès que donnent les
      tables du dépôt ; le texte de la fiche 28 écrit 77 700, que son tableau
      ne soutient pas. Le jeu `drees_minimum_vieillesse` du portail, qui
      porterait les entrants par âge et par caisse, n'est pas joint depuis
      le nuage (coupure de la connexion) : à ouvrir depuis un poste.
    etape: 7
    confrontation: >-
      La garantie vieillesse de la page, qui remplace l'ASPA, est calculée en
      2024 sur les pensions du système 4 (la distribution de l'EIR déplacée
      du facteur 0,7365), non sur les pensions servies (facteur 1) : 2,80
      millions de bénéficiaires (un recours de 50 % de 5,60 millions d'ayants
      droit), 13,93 milliards d'euros courants de 2024 (14,31 constants de
      2026). C'est 3,71 fois les 754 460 allocataires de l'ASV ou de l'Aspa
      fin 2024, 3,12 fois les 897 810 personnes avec leurs conjoints, et 3,03
      fois leurs 4,6 milliards de dépenses (courants de 2024, par
      inférence) ; à pensions servies, le même barème aux deux planchers de
      la page donne de 1,85 à 2,83 fois les allocataires et de 1,27 à 2,38
      fois les dépenses (estimation : 2,4 et 2,0). Ce n'est pas une erreur
      du modèle : la garantie n'est pas l'Aspa (800 euros par personne sur la
      seule pension, quand l'Aspa a son plafond, d'une personne seule ou d'un
      couple), et la fiche ne chiffre aucune garantie. Le coût de la garantie
      est brut des minima qu'elle remplace ; la page ne les déduit que dans
      un tableau à part : 13,93 − 7,50 (quatre minima) = 6,43 milliards
      (relecture R-J3, 5 novembre 2026). Les 70 660 entrées de 2024 sont
      un flux, que le dépôt ne calcule pas : avec un stock de 723 000 à 754
      000, elles impliquent 39 660 sorties (5,5 % du stock), quand les
      tables de mortalité du dépôt, appliquées au stock par âge et par
      sexe, donnent environ 21 000 décès (de 1,5 à 2,1 fois moins). Le stock
      de bénéficiaires de la garantie recule de 1,2 % en 2024 (le facteur
      des pensions passe de 0,7173 à 0,7365), quand celui de l'ASV et de
      l'Aspa avance de 4,3 % : la garantie n'est pas l'Aspa, rien n'est
      corrigé.
    confronte_par:
      - test_la_garantie_de_la_page_sert_plus_de_monde_et_coute_plus_que_l_aspa_et_l_asv
      - test_les_nouveaux_allocataires_du_minimum_vieillesse_sont_un_flux_que_le_depot_ne_calcule_pas
