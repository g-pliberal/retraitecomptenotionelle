  "08":
    titre: "Les bénéficiaires d’un minimum de pension"
    page: 78
    sources: ["EACR", "EIR 2020"]
    statut: confronte
    au_depot: [drees_eacr]
    a_tirer: >-
      Recoupée à l'étape 2 (`tests/test_drees_panorama_2024.py`) : la part des nouveaux retraités
      portés au minimum (graphique 1), 17,4 % au régime général et 35,6 %
      à la MSA salariés en 2024, celle de `minimum_contributif_liquidants.csv`
      de 2020 à 2024 ; de 2012 à 2019, le panorama la dit de 0,2 à 1,1
      point plus haute, un autre compte à éclaircir. Les parts de la
      génération 1953 (EIR 2020, tableaux 1 à 4) ne remplacent pas celles
      de l'édition 2018 que cite `scripts/part_minimum_contributif.py` : la
      SSI est au régime général dans l'EIR 2020, et rien n'y distingue plus
      les artisans ni les commerçants ; le graphique 1 donne ceux du RSI
      jusqu'en 2012 (39,3 % et 47,1 % en 2011). Ces parts, et l'encadré 2,
      la majoration exceptionnelle de 2023, confrontées au modèle le 5
      novembre 2026, à l'étape 5 (ci-dessous).
    etape: 4
    confrontation: >-
      La grille porte au minimum 24 % de ses nouveaux retraités de 2024 du
      régime général, pour 17,4 % ; aucun fonctionnaire, quand la CNRACL
      en compte 23,5 % ; tous ses exploitants, pour 18,4 %. Des nés en
      1953, 29 % au minimum de leur régime principal pour 21 %, aucune
      femme pour 30 %, un tiers des hommes pour 11 % ; ses bénéficiaires
      touchent 1 044 euros pour 750. Le coût ne leur sert pas la
      majoration exceptionnelle de 2023, que l'échéancier d'une carrière
      sert. Écarts déclarés : la grille n'est pas une population.
    confronte_par:
      - test_la_grille_porte_au_minimum_trop_de_nouveaux_retraites_et_aucun_fonctionnaire
      - test_la_grille_met_au_minimum_ses_hommes_nes_en_1953_et_aucune_femme
      - test_les_beneficiaires_du_minimum_de_la_grille_touchent_trop
  "09":
    titre: "Le niveau de vie des retraités"
    page: 88
    sources: ["ERFS 2023", "Insee, Histoire de vie et Patrimoine 2023-2024", "ANCETRE"]
    statut: confronte
    a_tirer: >-
      Le niveau de vie des ménages de retraités est hors du modèle, qui
      décrit une carrière et non un ménage ; seul l'encadré 3 sert : le
      patrimoine net moyen des ménages retraités début 2024, 388 900
      euros (enquête Histoire de vie et Patrimoine 2023-2024), à
      rapprocher de ce que l'action 47 tire du patrimoine des ménages
      pour la reprise de la garantie sur succession.
    etape: 4
    confrontation: >-
      La reprise de la garantie sur succession lit le patrimoine des
      retraités de 2018 (COR), un quart sous les 395 300 euros bruts de
      2024 : écart déclaré.
    confronte_par:
      - test_le_patrimoine_des_retraites_que_lit_la_garantie_date_de_2018
  "10":
    titre: "Les masses financières relatives aux pensions de retraite"
    page: 98
    sources: ["CPS"]
    statut: au_depot
    au_depot: [drees_comptes_protection_sociale]
    a_tirer: >-
      Recoupés à l'étape 2 (`tests/test_drees_panorama_2024.py`) : les 426,7 milliards d'euros de
      prestations du risque vieillesse-survie de 2024 (encadré 1), le poste
      E11-2 de `depenses_retraite.csv`. Les 395,3 milliards de pensions de
      retraite des régimes obligatoires (tableau 1) en sont une part dont
      le dépôt n'a pas les sous-postes ; leur répartition par régime
      verseur (graphique 2) groupe les caisses autrement que
      `depenses_retraite_regimes.csv` : ni l'une ni l'autre ne se
      recoupent. Les sous-postes de l'encadré 1, deux d'entre eux, sont au dépôt et recoupés à l'étape 7 (voir `solde`).
    etape: 7
    solde: >-
      Soldée le 6 novembre 2026 (étape 7). Lues ce jour : les six feuilles. Recoupés : les 359,7
      et 41,7 milliards de droit direct et de droit dérivé de l'encadré 1 aux sous-postes de
      `pensions_droits.csv` (401,4 ensemble), les 426,7 à `depenses_retraite.csv`, les « 93 % »
      du texte (395,3 / 426,7) ; le PIB de 1990 à 2022 à `pib_courant.csv` au million, celui de
      2023 et 2024 plus bas de 0,26 et 0,52 % (la source ne dit pas le millésime de son PIB ; sa
      note « données semi-définitives pour 2023 et provisoires pour 2024 » porte sur les CPS,
      non sur le PIB : un autre millésime des comptes nationaux est l'explication la plus
      simple, non démontrée ; écart déclaré, non tranché, et non un défaut de la source), le
      même PIB servant à la comparaison européenne (France 14,61 %) ; les évolutions du tableau
      2 comme celles de la série du graphique 1 (la cellule D7, « 5,0 », est du texte) ; les
      régimes verseurs (graphique 2) au total de la fiche. Les masses par régime verseur
      groupent les caisses autrement que `depenses_retraite_regimes.csv` (secteurs
      institutionnels) : ni l'une ni l'autre ne se recoupent. Non porté : les pensions de
      retraite du champ PRRO de 1990 à 2024 (graphique 1), qu'aucun calcul ne lit.
    recoupe_par:
      - test_les_pensions_de_droit_direct_et_de_droit_derive_de_l_encadre_1_sont_celles_du_depot
      - test_le_champ_des_pensions_de_retraite_fait_93_pour_cent_du_risque_vieillesse_survie
      - test_le_pib_du_panorama_est_celui_du_depot_jusqu_en_2022_et_s_en_ecarte_ensuite
      - test_la_part_du_pib_de_la_comparaison_europeenne_utilise_le_pib_du_panorama_et_les_regimes_verseurs_font_le_total
      - test_les_evolutions_du_tableau_2_sont_celles_de_la_serie_du_graphique_1
  "11":
    titre: "Les durées de carrière des retraités et la part des carrières complètes ou incomplètes"
    page: 106
    sources: ["EIR 2020", "Insee"]
