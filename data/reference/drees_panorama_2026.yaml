# Le panorama « Les retraités et les retraites » de la DREES, édition 2026,
# fiche par fiche : ce que le dépôt en a déjà, ce qu'il en tirera (action 178)
# ===========================================================================
# Le relevé des fiches, de leurs figures et de leurs sources est le témoin
# tests/temoins/drees_panorama_2026.json, que scripts/fetch/drees_panorama.py
# refait du PDF ; le document est au manifeste sous
# drees_panorama_retraites_2026, et ses classeurs sous
# drees_panorama_retraites_2026_classeurs, une archive dont le membre
# fiche_NN.xlsx est le « fichier Excel associé » à la fiche NN, à
# l'empreinte que son champ contenu lui donne. tests/test_drees_panorama.py
# refuse une fiche du relevé qui n'a pas ici son statut : rien du panorama
# n'échappe au chantier.
#
# CHAMPS
#   titre ..... celui du sommaire, tel que le relevé le lit
#   page ...... sa première page imprimée
#   sources ... les sources d'amont de ses figures, en abrégé
#   statut .... voir ci-dessous
#   au_depot .. les jeux du manifeste qui portent déjà sa donnée, ou la même
#               à un autre millésime
#   a_tirer ... ce que le dépôt en tirera, et où ; ou pourquoi rien
#   etape ..... l'étape de l'action 178 qui s'en charge
#   confrontation, confronte_par .. pour une fiche confrontée, ce que la
#               confrontation trouve, et ses tests, dans
#               tests/test_controle_drees_panorama.py
#
# STATUT
#   au_depot ...... sa donnée vient d'un fichier que le dépôt lit déjà, au
#                   même millésime : restent les totaux publiés, à recouper
#   a_tirer ....... elle apporte une donnée, ou une année, que le dépôt n'a
#                   pas : à porter à data/reference/ ou aux référents, avec le
#                   test qui la recoupe à sa source
#   a_confronter .. elle mesure ce que le modèle calcule ou suppose — un âge,
#                   un taux, une durée, une règle : à confronter par un test
#                   du niveau controle, l'écart corrigé ou déclaré
#   confronte ..... confrontée ainsi (étape 4) : l'écart est déclaré dans son
#                   test, et celui qui dit une erreur du modèle va à l'étape 5
#   hors_champ .... elle mesure ce que le modèle ne représente pas ; la
#                   raison le dit, et rien n'est à faire
#
# Classé le 2 novembre 2026, à l'étape 1. Une étape qui tire d'une fiche ce
# qu'elle apporte change son statut, et le dit dans sa note ; l'étape 2 l'a
# fait le 3 novembre 2026, l'étape 6, pour ses huit fiches, le même jour, et
# l'étape 3, pour les fiches 12 et 21 (docs/feuille_de_route/178/).

fiches:
  "01":
    titre: "Les effectifs de retraités de droit direct"
    page: 20
    sources: ["EACR", "EIR", "ANCETRE", "Insee"]
    statut: au_depot
    au_depot: [drees_eacr, drees_eacr_tables, drees_panorama_retraites_2026_classeurs]
    a_tirer: >-
      Recoupés à l'étape 2 (`tests/test_drees_panorama_2024.py`) : les
      retraités de droit direct tous régimes de 2004 à 2024 (tableau 1), 17
      298 000 fin 2024, à la ligne « Tous régimes » du cadrage
      (`effectifs_retraites.csv`), leurs femmes et leurs hommes à la table C,
      et sept régimes du tableau 2 à leur caisse ; les régimes spéciaux et les
      professions libérales, qui réunissent des caisses que le cadrage n'a pas
      toutes, ne se recoupent pas. Portés à l'étape 6
      (`tests/test_drees_panorama_series.py`) : les retraités de droit direct
      résidant en France ou à l'étranger, puis en France, et l'emploi
      intérieur, de 2004 à 2024 (graphique 1), d'où le rapport de 1,77
      personne en emploi par retraité, à `rapport_emploi_retraites.csv` ; la
      part des polypensionnés par génération et par sexe (graphique 3), à
      `retraites_generations.csv`, aux référents : la grille, qui ne compte
      aucun polyaffilié, s'y confrontera ; celle des générations 1954 à 1957,
      qu'Ancetre estime, au niveau `haute`. Restent, pour la clôture, les flux
      (graphique 2), la carte 1, le tableau 3 et la pyramide des âges
      (graphique 4).
    etape: 7
  "02":
    titre: "Les nouveaux retraités de droit direct"
    page: 29
    sources: ["EACR", "EIR", "ANCETRE"]
    statut: confronte
    au_depot: [drees_eacr, drees_eacr_tables]
    a_tirer: >-
      Recoupés à l'étape 2 (`tests/test_drees_panorama_2024.py`) : les 858 000 liquidants d'un droit
      direct de 2024 (tableau 1), le champ `nl_ddir` de la table C, et ceux
      du régime général, des deux MSA et de la CNRACL (tableau 2), la table
      B ; les 718 000 primo-liquidants, que l'EIR seul compte, n'ont pas
      d'équivalent à l'EACR. Reste l'encadré 1, les mois où chaque
      génération atteint l'âge d'ouverture des droits sous la loi de
      financement pour 2026, confronté à `age_ouverture_requis.csv`.
    etape: 5
    confrontation: >-
      L'encadré 1 se retrouve cellule par cellule : l'âge légal de chaque
      génération, de 1959 à 1970, est celui de `age_ouverture_requis.csv`,
      et le nombre de mois de naissance qui l'atteignent chaque année, de
      2022 à 2034, celui que donne la pension prise au premier jour du
      mois qui suit l'anniversaire (étape 5).
    confronte_par:
      - test_les_mois_de_depart_de_l_encadre_de_la_fiche_2_sont_ceux_de_l_age_legal
  "03":
    titre: "Les effectifs de retraités de droit dérivé"
    page: 35
    sources: ["EACR", "EIR", "ANCETRE", "Insee"]
    statut: au_depot
    au_depot: [drees_eacr, drees_panorama_retraites_2026_classeurs]
    a_tirer: >-
      Les 4,4 millions de bénéficiaires d'une pension de réversion fin 2024,
      dont 886 000 de réversion seule (tableaux 1 et 3), ne se recoupent pas :
      le dépôt ne garde de la réversion que sa masse (`droits_derives.csv`, le
      champ `ddert` du cadrage multiplié par son montant moyen), et le
      panorama ne donne pas ce montant ; constaté à l'étape 2. Portés à
      l'étape 6 : la part des femmes de 60 ans ou plus résidant en France qui
      touchent une réversion, avec ou sans droit direct, de 2004 à 2024
      (graphique 2), et celle des personnes qui en ont touché une, par groupe
      de générations et par âge (graphique 4, l'EIR de 2020), à
      `reversion_beneficiaires.csv`, aux référents, où la réversion du modèle
      pourra se confronter. Restent, pour la clôture, les flux (graphique 1),
      la pyramide des âges (graphique 3) et le complément du tableau 2.
    etape: 7
  "04":
    titre: "La revalorisation des pensions individuelles"
    page: 44
    sources: ["CNAV", "MSA", "SRE", "CNRACL", "Agirc-Arrco", "Ircantec", "RAFP", "Insee", "TRAJECTOiRE"]
    statut: confronte
    au_depot: [cnav_revalorisation_pensions, agirc_arrco_valeurs_point, erafp_parametres]
    a_tirer: >-
      La revalorisation annuelle des pensions de chaque régime depuis
      2014 (tableau 1) — 0,9 % au 1er janvier 2026 pour les régimes de
      base, que `revalorisation_pensions.csv` porte déjà (1,009), aucune
      à l'Agirc-Arrco en novembre 2025 faute d'accord —, confrontée aux
      séries du dépôt (étape 5) ; l'érosion des pensions selon l'année de
      naissance, cas types non-cadre et cadre de TRAJECTOiRE (graphique
      4), et le pouvoir d'achat des liquidants de 2000 (graphique 3),
      confrontés à l'indexation du scénario 1 et des comptes notionnels.
    etape: 4
    confrontation: >-
      L'érosion relativement aux prix (graphique 4) retrouvée à trois
      dixièmes de point, générations 1940 à 1950, par les séries du
      dépôt ; le pouvoir d'achat des liquidants de 2000 (graphique 3) y
      baisse de 0,2 à 1,1 point de plus en vingt-cinq ans, écart
      déclaré.
    confronte_par:
      - test_l_erosion_des_pensions_par_generation_est_celle_de_trajectoire
      - test_le_pouvoir_d_achat_des_liquidants_de_2000_baisse_un_peu_plus_au_modele
      - test_les_revalorisations_du_panorama_sont_celles_du_depot
  "05":
    titre: "Le niveau des pensions"
    page: 54
    sources: ["EACR", "EIR", "ANCETRE", "Insee"]
    statut: confronte
    au_depot: [drees_pension_nette, drees_eir_distribution, drees_eir_caracteristiques, drees_eacr_tables, drees_panorama_retraites_2026_classeurs]
    a_tirer: >-
      Porté à l'étape 2, sur l'accord du propriétaire du 3 novembre 2026 :
      la pension moyenne de 2023 et 2024, brute et nette, de droit direct
      et totale, de la feuille « F05_Tableau 1 compl_bis » (cellules I, L,
      O et R des lignes 27 et 28), certifiée dans
      `pensions_brutes_nettes.csv` en appoint du tableau 2.1-a, qui
      s'arrête à 2022 ; la feuille, sur le même champ (résidents en France
      ou à l'étranger), en redonne 2008 à 2022 à l'euro près. Le tableau 1
      imprimé (1 752 euros bruts et 1 626 nets fin 2024) ne compte que les
      résidents en France. Le taux effectif de la page Coût passe de 6,8 %
      (2022) à 6,9 % (2024, 1 − 1 727 / 1 855). Recoupé : la pension
      moyenne hors majoration de 2024, 1 647 euros, celle de la table C.
      Par régime (tableaux 2 et 4), confrontée à la grille de la page Coût
      le 5 novembre 2026, à l'étape 5 (ci-dessous).
    etape: 4
    confrontation: >-
      La grille sert à chaque régime de 21 à 66 % de plus que le tableau 2
      (938 euros au régime général pour 777, 853 à l'Agirc-Arrco pour
      542), sauf à l'État civil (−5 %) et à la CNRACL (−24 %) : elle
      compte des têtes de caisse à carrière complète, sans les petites
      pensions des polypensionnés ; tous régimes, 16 % de plus, et son
      évolution suit celle de la DREES à 1,1 point près en dix ans. Au
      régime général, sa seule femme y touche plus que ses hommes. Le
      tableau 4 est, valeur pour valeur, le tableau 3.2 du COR que
      `test_controle_ancetre.py` confronte déjà. Écarts déclarés.
    confronte_par:
      - test_la_grille_sert_trop_a_chaque_regime_sauf_aux_fonctionnaires
      - test_le_tableau_4_de_la_fiche_5_est_le_tableau_3_2_du_cor
  "06":
    titre: "Les écarts de pensions de droit direct entre générations"
    page: 65
    sources: ["EIR 2020", "ANCETRE", "EACR", "Insee, panel Tous salariés"]
    statut: confronte
    a_tirer: >-
      La pension moyenne par génération, de 1930 à 1957 (graphiques 1 et
      2, tableaux 1 et 2), l'écart entre femmes et hommes au fil des
      générations (graphique 3) et le taux de remplacement médian des
      anciens salariés à carrière complète par génération (graphique 4),
      confrontés aux indicateurs de cycle de vie du dépôt
      (`cycle_de_vie.py`) et aux cas types.
    etape: 4
    confrontation: >-
      Le taux de remplacement médian du privé (graphique 4) est celui du
      cas type au SMIC à deux points près ; le salaire moyen et le
      fonctionnaire sédentaire en sont sous la médiane, et l'écart entre
      femmes et hommes de la grille (graphique 3) n'est que le tiers ou
      la moitié du publié : écarts déclarés.
    confronte_par:
      - test_le_taux_de_remplacement_median_du_prive_est_celui_du_salarie_au_smic
      - test_l_ecart_entre_femmes_et_hommes_de_la_grille_est_bien_moindre
  "07":
    titre: "La pension des nouveaux retraités"
    page: 74
    sources: ["EACR", "EIR", "ANCETRE"]
    statut: confronte
    a_tirer: >-
      La pension des nouveaux retraités de 2024, 1 637 euros bruts en
      moyenne, par régime (tableau 1), et l'écart de 29 % entre femmes et
      hommes, confrontés aux pensions que la grille de la page Coût sert
      aux liquidants de 2024 ; le cadrage de l'EACR que le dépôt lit
      porte ces montants, qu'il ne retient pas.
    etape: 4
    confrontation: >-
      La grille sert 2 102 euros à ses nouveaux retraités de 2024, 28 %
      de plus que les 1 637 publiés, et n'y compte que 13,5 % de femmes
      : écart déclaré, pour l'étape 5.
    confronte_par:
      - test_la_grille_sert_trop_a_ses_nouveaux_retraites_de_2024
  "08":
    titre: "Les bénéficiaires d’un minimum de pension"
    page: 78
    sources: ["EACR", "EIR 2020"]
    statut: confronte
    au_depot: [drees_eacr]
    a_tirer: >-
      Recoupée à l'étape 2 (`tests/test_drees_panorama_2024.py`) : la part des nouveaux retraités
      portés au minimum (graphique 1), 17,4 % au régime général et 35,6 %
      à la MSA salariés en 2024, celle de `minimum_contributif_liquidants.csv`
      de 2020 à 2024 ; de 2012 à 2019, le panorama la dit de 0,2 à 1,1
      point plus haute, un autre compte à éclaircir. Les parts de la
      génération 1953 (EIR 2020, tableaux 1 à 4) ne remplacent pas celles
      de l'édition 2018 que cite `scripts/part_minimum_contributif.py` : la
      SSI est au régime général dans l'EIR 2020, et rien n'y distingue plus
      les artisans ni les commerçants ; le graphique 1 donne ceux du RSI
      jusqu'en 2012 (39,3 % et 47,1 % en 2011). Ces parts, et l'encadré 2,
      la majoration exceptionnelle de 2023, confrontées au modèle le 5
      novembre 2026, à l'étape 5 (ci-dessous).
    etape: 4
    confrontation: >-
      La grille porte au minimum 24 % de ses nouveaux retraités de 2024 du
      régime général, pour 17,4 % ; aucun fonctionnaire, quand la CNRACL
      en compte 23,5 % ; tous ses exploitants, pour 18,4 %. Des nés en
      1953, 29 % au minimum de leur régime principal pour 21 %, aucune
      femme pour 30 %, un tiers des hommes pour 11 % ; ses bénéficiaires
      touchent 1 044 euros pour 750. Le coût ne leur sert pas la
      majoration exceptionnelle de 2023, que l'échéancier d'une carrière
      sert. Écarts déclarés : la grille n'est pas une population.
    confronte_par:
      - test_la_grille_porte_au_minimum_trop_de_nouveaux_retraites_et_aucun_fonctionnaire
      - test_la_grille_met_au_minimum_ses_hommes_nes_en_1953_et_aucune_femme
      - test_les_beneficiaires_du_minimum_de_la_grille_touchent_trop
  "09":
    titre: "Le niveau de vie des retraités"
    page: 88
    sources: ["ERFS 2023", "Insee, Histoire de vie et Patrimoine 2023-2024", "ANCETRE"]
    statut: confronte
    a_tirer: >-
      Le niveau de vie des ménages de retraités est hors du modèle, qui
      décrit une carrière et non un ménage ; seul l'encadré 3 sert : le
      patrimoine net moyen des ménages retraités début 2024, 388 900
      euros (enquête Histoire de vie et Patrimoine 2023-2024), à
      rapprocher de ce que l'action 47 tire du patrimoine des ménages
      pour la reprise de la garantie sur succession.
    etape: 4
    confrontation: >-
      La reprise de la garantie sur succession lit le patrimoine des
      retraités de 2018 (COR), un quart sous les 395 300 euros bruts de
      2024 : écart déclaré.
    confronte_par:
      - test_le_patrimoine_des_retraites_que_lit_la_garantie_date_de_2018
  "10":
    titre: "Les masses financières relatives aux pensions de retraite"
    page: 98
    sources: ["CPS"]
    statut: au_depot
    au_depot: [drees_comptes_protection_sociale]
    a_tirer: >-
      Recoupés à l'étape 2 (`tests/test_drees_panorama_2024.py`) : les 426,7 milliards d'euros de
      prestations du risque vieillesse-survie de 2024 (encadré 1), le poste
      E11-2 de `depenses_retraite.csv`. Les 395,3 milliards de pensions de
      retraite des régimes obligatoires (tableau 1) en sont une part dont
      le dépôt n'a pas les sous-postes ; leur répartition par régime
      verseur (graphique 2) groupe les caisses autrement que
      `depenses_retraite_regimes.csv` : ni l'une ni l'autre ne se
      recoupent. Les sous-postes de l'encadré 1, s'ils viennent au dépôt,
      le permettraient.
    etape: 7
  "11":
    titre: "Les durées de carrière des retraités et la part des carrières complètes ou incomplètes"
    page: 106
    sources: ["EIR 2020", "Insee"]
    statut: confronte
    au_depot: [drees_eir_caracteristiques]
    a_tirer: >-
      Les durées cotisées et validées par sexe et par génération
      (graphiques 3 et 4), la part des carrières complètes (graphique 2),
      le coefficient de proratisation par régime de la génération 1953
      (tableau 1) et les effectifs en équivalent carrière complète
      (tableaux 2 et 3), confrontés aux carrières des cas types et de la
      grille.
    etape: 4
    confrontation: >-
      Les durées validées par génération du dépôt sont celles du
      graphique 3, trimestre pour trimestre ; la complétude de la
      grille, 0,973 pour 1953, passe de quatre points le coefficient de
      proratisation moyen, 0,93 : erreur du modèle, pour l'étape 5.
    confronte_par:
      - test_les_durees_validees_du_depot_sont_celles_du_panorama
      - test_la_completude_de_la_grille_passe_le_coefficient_de_proratisation
  "12":
    titre: "Les durées d’assurance validées par les actifs pour leur retraite"
    page: 113
    sources: ["EIC 2021", "EIC 2013"]
    statut: confronte
    au_depot: [drees_eic_droits_valides, drees_eic_natures_assimilees, drees_eic_duree_validee,
               drees_panorama_retraites_2026_classeurs]
    a_tirer: >-
      Porté à l'étape 3, de son classeur, à `durees_validees_actifs.csv`, à
      côté des séries de l'EIC de 2017 que le dépôt lit : les trimestres
      validés à 30 ans, l'âge de la première année complète et la part des
      affiliés qui n'en ont aucune, générations 1942 à 1990 (graphique 1) ;
      le rythme de validation par tranche d'âge et le cumul à 49 ans
      (graphique 2) ; la nature des trimestres de la génération 1966
      (graphique 3) ; le chômage validé, générations 1942 à 1998
      (graphique 4) ; les validations de l'année par âge, en 2020 et 2021
      (graphique 5). Le jeu du portail sur les trimestres validés à 30 ans,
      refait le 9 octobre 2026, porte toujours l'EIC de 2013, ses données
      du 26 novembre 2020 : il ne donne de plus que la génération 1942, que
      le classeur redonne. Reste, pour la clôture, les feuilles de l'édition
      précédente, de l'EIC de 2017 (« Graphique 1 (2) » à « 5 (2) »). Les
      débuts de carrière (graphique 1), confrontés à la grille de la page
      Coût le 5 novembre 2026, à l'étape 5 (ci-dessous).
    etape: 4
    confrontation: >-
      Les cas types de la grille nés en 1950 et 1954 valident leur première
      année complète à 21,4 ans, pour 19,1 et 19,5, et 38,3 trimestres à
      30 ans, pour 42,8 et 42,0 : leurs carrières commencent deux ans trop
      tard, celle du salarié au Smic à 18 ans, la plus précoce. Tous ont
      une année complète, quand 1,4 et 1,9 % des affiliés n'en ont aucune.
      Écart déclaré : la grille n'est pas une population.
    confronte_par:
      - test_la_grille_commence_ses_carrieres_trop_tard
  "13":
    titre: "Les régimes d’affiliation des assurés"
    page: 122
    sources: ["EIR 2020", "GIP Union Retraite, annuaire 2026"]
    statut: confronte
    a_tirer: >-
      La polyaffiliation par âge et par génération, début 2026
      (graphiques 1 à 3), et la répartition des affiliés de la génération
      1957 selon leurs régimes (tableau 1), de l'annuaire du GIP Union
      Retraite, confrontées à la répartition par régime de la grille de
      la page Coût.
    etape: 4
    confrontation: >-
      Aucun cas type de la grille n'a deux régimes de base, quand 54 %
      de la génération 1957 en ont plusieurs : écart déclaré, la limite
      des têtes de caisse.
    confronte_par:
      - test_la_grille_ne_compte_aucun_polyaffilie
  "14":
    titre: "Les règles de liquidation : âges et durées d’assurance"
    page: 128
    sources: ["Législation"]
    statut: confronte
    a_tirer: >-
      L'âge d'ouverture des droits, la durée requise, l'âge d'annulation
      de la décote et les conditions de la carrière longue par génération
      (tableaux 1 à 4), sous la loi de financement pour 2026, et la
      décote et la surcote (encadrés 1 et 2), confrontés aux tables de
      `data/reference/legislation/` (`age_ouverture_requis.csv`,
      `duree_assurance_requise.csv`, `carriere_longue.csv`) : une règle
      du scénario 1, sur Opus.
    etape: 5
    confrontation: >-
      Les âges légaux, du privé, des actifs et des super-actifs, les
      durées requises, les âges d'annulation de la décote et les âges de
      la carrière longue, avant et après la loi de financement pour 2026,
      sont ceux des tables du dépôt, mois de naissance par mois de
      naissance ; la décote et la surcote des encadrés aussi. Deux écarts
      de rédaction, que le texte tranche contre la DREES : 60 ans et 8
      mois pour les nés de décembre 1965 (D. 351-1-1, II, 4°, version du
      1er septembre 2026), et 2,375 %, non 2,5 %, pour la génération 1944
      (R. 351-27).
    confronte_par:
      - test_les_ages_legaux_du_panorama_sont_ceux_du_depot
      - test_les_durees_requises_du_panorama_sont_celles_du_depot
      - test_les_ages_d_annulation_de_la_decote_sont_ceux_du_depot
      - test_la_carriere_longue_du_panorama_est_celle_du_depot
      - test_la_decote_et_la_surcote_du_panorama_sont_celles_du_depot
  "15":
    titre: "L’âge moyen de départ à la retraite et son évolution"
    page: 138
    sources: ["EIR 2020", "EACR", "ANCETRE", "Insee"]
    statut: confronte
    au_depot: [drees_age_conjoncturel, drees_eir_generations, drees_panorama_retraites_2026_classeurs]
    a_tirer: >-
      Porté à l'étape 2 : l'âge conjoncturel de départ de 2023 et 2024
      (graphique 1), 62,95 ans fin 2024, « 62 ans et 11 mois », certifié
      dans `age_conjoncturel_depart.csv` en appoint du jeu du portail, qui
      s'arrête à 2022 ; le panorama révise de quelques centièmes des
