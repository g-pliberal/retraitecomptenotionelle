    page: 182
    sources: ["EIC 2021", "EIC 2013", "Insee, enquête Emploi"]
    statut: confronte
    au_depot: [drees_panorama_retraites_2026_classeurs]
    a_tirer: >-
      Porté à l'étape 3, de son classeur, à `fins_de_carriere.csv` : la
      situation à 59 ans par génération, de 1942 à 1962 — emploi, chômage,
      invalidité, absence (graphique 1) — ; celle de l'année qui précède la
      liquidation, de 1942 à 1954, et, en 1954, selon l'âge de départ et le
      travail après 50 ans (tableau 1) ; les trajectoires, les situations
      de 50 à 67 ans et les transitions de la génération 1954 (tableaux 2
      et 3, graphique 2). Confronté à l'étape 4 aux fins de carrière de la
      grille (tableau 1), puis le 5 novembre 2026, à l'étape 5 (graphique
      1, à 59 ans, et tableau 2, les trajectoires) ; reste à confronter
      les carrières inactives de la population de l'étape 14 de l'action
      138 quand elle remplacera la grille ; et, pour la clôture,
      l'encadré 2, de l'enquête Emploi : la part des 53-69 ans ni en
      emploi ni en retraite, de 2005 à 2024, et la composition de leur
      revenu en 2023.
    etape: 4
    confrontation: >-
      L'année qui précède leur liquidation, 88,7 % des nouveaux retraités
      de 2024 de la grille sont en emploi, quand 70,9 % des liquidants de
      la génération 1954 le sont ; aucun cas type ne finit au chômage,
      quand 10,4 % d'entre eux y sont : écart déclaré, celui des cas types
      de la grille. À 59 ans, dans le champ de la source (hors absents et
      retraités dès 50 ans), les cas types nés en 1954 sont en emploi pour
      88,5 %, pour 68,29 %, aucun au chômage, pour 7,55 % ; 90,8 % passent
      de l'emploi à la retraite sans année de non-emploi, pour 58,35 %, et
      aucun par une période de non-emploi intercalée, pour 19,27 %.
    confronte_par:
      - test_la_grille_ne_finit_aucune_carriere_au_chomage
      - test_la_grille_passe_de_l_emploi_a_la_retraite_sans_chomage
    solde: >-
      Soldée le 6 novembre 2026 (étape 7) : lues, les feuilles de l'encadré 2 (graphique et
      tableau), « Synthese » et les cinq feuilles « REVISIONS ». Au graphique 1, la valeur de
      l'édition 2025 plus la révision est celle de 2026 pour les 144 cellules, jusqu'à 1,34
      point ; les quatre autres feuilles de révisions, relues cellule par cellule le même jour
      (J5-bis) : 2025 + révision = 2026 pour 43 cellules du tableau 1, 48 du tableau 3, 432 du
      graphique 2 et neuf cellules du tableau 2 (trois lignes). Mais les tableaux 2 et 3 et le
      graphique 2 ne révisent pas une même donnée : l'édition 2025 y porte la génération 1950
      (EIC 2017 aux tableaux 2 et 3), l'édition 2026 la génération 1954 (EIC 2021), ce que «
      Synthese » dit (D3, E3, F3 : « 1954 dans Pano 2026, vs 1950 auparavant ») en imputant
      l'écart au changement de génération et, au graphique 2, au recul de l'âge d'ouverture des
      droits (jusqu'à 42,04 points) : à ne pas citer comme révision de la DREES ; seuls le
      graphique 1 et le tableau 1 (générations 1946 et 1950, la génération 1942 inchangée)
      comparent une même génération. Défauts de la source : la colonne « Total » des révisions
      du tableau 1 (R7:R15) et la ligne « Ensemble » de celles du tableau 2 écrivent 100 là où
      une révision vaut 0, une cellule #VALUE! (tableau 1, N20) et trois #REF! (tableau 2,
      H8:J8) ; « Synthese » minore ses maxima (2,8 pour 2,91, M11 ; 3 pour 3,93, N9). Le dépôt
      n'a que les chiffres de 2026 : ceux de 2025 ne se mêlent pas aux siens. L'encadré 2
      (personnes ni en emploi ni à la retraite de 53 à 69 ans, enquête Emploi) se somme et se
      décompose ; hors champ : aucun fichier du dépôt ne lit ces personnes.
    recoupe_par:
      - test_les_revisions_du_graphique_1_de_la_fiche_21_sont_la_difference_des_deux_editions
      - test_l_encadre_2_de_la_fiche_21_se_somme_et_se_decompose
