      toutes les règles de liquidation du régime, et l'ordre dans lequel la
      caisse les applique.
    statut: explore
    explore_le: "2026-09-24"
    note: >-
      La table des matières ouvre 33 liens — huit rubriques, vingt-cinq pages
      — et 86 pages une fois déroulée : constitution du droit (11), traitement
      de base (18), trimestres liquidables (16, dont dix sur les
      bonifications), calcul de la pension (10, dont six sur la durée
      requise), durée d'assurance, décote et surcote (14), minimum garanti
      (9), accessoires (7), cessation d'activité (1). Elles ont donné la durée
      de la carrière longue ouverte avant 60 ans, le décompte de la surcote et
      deux exemples de décote (docs/limites.md,
      tests/temoins/exemples_officiels.yaml) ; le reste est dans les notes des
      lignes `juris_cnracl_*`, hors le supplément des aides-soignants.

  - id: juris_cnracl_traitement_de_base
    url: https://www.juris-cnracl.retraites.fr/pension-normale/la-determination-du-traitement-de-base
    nature: regle
    acces: session
    regimes: [cnracl]
    a_en_tirer: >-
      Le traitement des six derniers mois : quel indice, quelle durée de
      détention exigée, ce qui entre dans l'assiette et ce qui n'y entre pas.
      Le modèle prend un salaire de fin de carrière ; voici la règle exacte.
    statut: epuise
    explore_le: "2026-09-24"
    note: >-
      Le traitement indiciaire brut de l'emploi, du grade et de l'échelon
      détenus six mois à la cessation des services, primes exclues, compté à
      temps plein (décret n° 2003-1306, article 17) ; trois pages de règles et
      treize cas particuliers. Faute du grade, le modèle prend le traitement
      de l'année du départ, hors primes. Un cas le touchait : pour qui est
      radié sans liquider aussitôt, l'article 26 revalorise le traitement
      jusqu'à la mise en paiement comme les pensions, et le modèle le portait
      au point d'indice, +6,3 % de 2011 à 2026 quand les pensions ont pris
      près de 25 %. Corrigé le même jour pour les trois régimes du code des
      pensions (L. 25, article 22 du décret n° 2004-1056) : tests/test_cnracl.py,
      docs/limites.md, ligne `pension_differee_fonction_publique` de la veille.

  - id: juris_cnracl_temps_partiel
    url: https://www.juris-cnracl.retraites.fr/pension-normale/les-trimestres-liquidables/modalites-de-prise-en-compte-des-services-temps-partiel-et-non-complet
    nature: regle
    acces: session
    regimes: [cnracl]
    a_en_tirer: >-
      Le temps partiel compte pour sa durée en DURÉE D'ASSURANCE et pour sa
