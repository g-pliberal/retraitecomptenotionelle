      statut vers un régime et ne défait jamais l'affiliation.
    statut: explore
    explore_le: "2026-09-24"
    note: >-
      Pas le rétablissement (« Gestion des carrières », et docs/limites.md),
      mais trois partages : les services militaires (option de L. 77, choix de
      l'agent entre deux régimes, dernier régime pour les interpénétrés, à
      pension unique) ; les trimestres des sapeurs-pompiers volontaires ; la
      priorité de R. 173-15, qui fait accorder les avantages pour enfants par
      la CNRACL dès qu'elle peut servir une pension, même quand le régime
      général donnerait plus (TA Amiens, 2 juin 2017). Le modèle retenait le
      régime qui accorde le plus (`_majoration_pour_enfants`), et une
      fonctionnaire passée par le privé y recevait les huit trimestres par
      enfant du régime général. Corrigé le même jour dans les deux moteurs,
      avec la durée de services qui ouvre une pension dans chaque régime
      spécial (`services_ouvrant_pension.csv`) : ligne de veille
      `priorite_majorations_enfants`. La pension unique des régimes
      interpénétrés — l'État, la CNRACL, le FSPOEIE — l'est aussi : ligne
      `interpenetration_fonction_publique`. Puis le rétablissement lui-même,
      lu dans les pages « Rétablissement » de « Gestion des carrières » : les
      années de l'agent parti sans droit passent au régime général, sur le
