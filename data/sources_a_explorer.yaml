# Sources repérées, à explorer — le vivier du manifeste
# =====================================================
# `data/sources.yaml` est le manifeste : il ne porte que des sources DONT UNE
# VALEUR EST ENTRÉE dans le dépôt. Ce fichier-ci porte l'amont : les sources
# repérées, dont on sait qu'elles contiennent quelque chose pour le modèle,
# et qu'aucune session n'a encore dépouillées. Une source ne reste pas ici :
# quand elle a rendu ce qu'elle avait, elle passe dans le manifeste — et sa
# ligne ici prend l'état `epuise` avec la date.
#
# Il est né le 22 septembre 2026 d'une liste de 188 adresses, remise en cinq
# lots. Le chantier qu'elle ouvre est l'action 89 de `docs/feuille_de_route.md`,
# et la manière de le mener est dans `docs/exploration_sources.md`.
#
# OÙ VA CE QU'ON EN TIRE
#   un exemple chiffré ....... tests/temoins/exemples_officiels.yaml, rejoué
#                              contre le scénario 1 par tests/test_oracle.py
#   une règle de droit ....... data/reference/legislation/veille.yaml
#   un barème, une valeur .... data/reference/regimes/, et la source passe au
#                              manifeste avec son `statut_integration`
#   un mur .................... docs/limites.md, et la fiche du régime
#   une réforme non coupée ... data/reference/legislation/reformes.yaml
#
# CHAMPS
#   id ............ identifiant court, unique dans le fichier
#   url ........... l'adresse telle qu'elle a été remise
#   nature ........ voir ci-dessous
#   acces ......... ce qu'une session obtient, MESURÉ le 22 septembre 2026
#   regimes ....... codes de data/reference/regimes/inventaire.yaml que la
#                   page concerne ; vide quand elle est interrégime
#   a_en_tirer .... ce qu'on va y chercher, en une phrase — pas « explorer »
#   statut ........ a_explorer | en_cours | explore | epuise | sans_suite
#   explore_le .... date du dépouillement, quand il a eu lieu
#   note .......... ce que la session a trouvé, ou ce qui l'a arrêtée
#
# NATURE
#   simulateur  un formulaire qui calcule. C'est la mine : chaque exécution
#               est un exemple chiffré produit par celui-là même qui applique
#               la règle, et vingt exécutions dessinent le barème entier.
#   regle       une page qui décrit une règle (âge, décote, minimum, cumul)
#   bareme      des taux, des plafonds, des valeurs de point
#   document    un PDF — circulaire, guide, règlement, statistiques
#   index       une page-liste d'où partent d'autres documents : à DÉROULER,
#               c'est là que se cachent les règlements et les circulaires
#   code        le code source d'un modèle public, lisible et exécutable
#
# ACCES — mesuré, pas supposé (188 adresses sondées le 22 septembre 2026 :
#         180 répondent 200 à une simple requête, huit demandent un geste)
#   session ............ joignable en `curl` depuis une session, 200
#   chaine_incomplete .. le serveur ne sert pas l'intermédiaire de son
#                        certificat ; un navigateur le rattrape tout seul,
#                        `curl` non. Recette dans docs/exploration_sources.md
#   navigateur ......... demande Chromium : Cloudflare, ou page construite en
#                        JavaScript. Playwright est installé (voir le doc)
#   git ................ la page HTML est refusée, `git clone` passe
#   refus .............. 403 : le site ou la politique de sortie refuse
#   ferme .............. hors de portée d'une session, et pour une raison qui
#                        ne se contourne pas (certificat expiré, FranceConnect)

sources:

  # ---- Union Retraite (GIP interrégimes) --------------------------------
  # Le seul endroit où le droit de TOUS les régimes est appliqué ensemble.
  # `tests/temoins/exemples_officiels.yaml` dit depuis sa première ligne
  # qu'« aucun simulateur officiel n'est automatisable » : c'est vrai de
  # « Mon estimation retraite », qui exige FranceConnect, et FAUX des
  # simulateurs anonymes que le même GIP publie, qu'aucune session n'avait
  # essayé d'atteindre — le certificat incomplet de *.info-retraite.fr
  # suffisait à les faire passer pour injoignables.

  - id: union_retraite_les_simulateurs
    url: https://les-simulateurs.info-retraite.fr
    nature: index
    acces: chaine_incomplete
    regimes: []
    a_en_tirer: >-
      La liste des simulateurs du GIP, et pour chacun s'il est anonyme ou
      derrière FranceConnect. Point d'entrée de tout le lot.
    statut: a_explorer

  - id: union_retraite_progressive
    url: https://parcours.info-retraite.fr/retraite-progressive
    nature: simulateur
    acces: chaine_incomplete
    regimes: []
    a_en_tirer: >-
      L'éligibilité à la retraite progressive, règle par règle et interrégime :
      âge, durée d'assurance, quotité de travail, et ce que la pension
      partielle vaut. Le dépôt ne modélise pas la retraite progressive ;
      c'est de quoi la chiffrer, ou dire dans limites.md ce qu'elle déplace.
    statut: a_explorer

  - id: union_retraite_expatriation
    url: https://parcours.info-retraite.fr/retraite_expatriation
    nature: simulateur
    acces: chaine_incomplete
    regimes: []
    a_en_tirer: >-
      Le traitement des périodes à l'étranger : conventions, totalisation,
      proratisation. `docs/limites.md` déclare les carrières internationales
      hors modèle ; ce parcours dit ce que ce mur laisse dehors.
    statut: a_explorer

  # ---- Cnav / Assurance retraite ----------------------------------------

  - id: cnav_legislation_portail
    url: https://legislation.lassuranceretraite.fr/#/
    nature: index
    acces: session
    regimes: [regime_general]
    a_en_tirer: >-
      Le corpus d'application du régime général : circulaires, lettres,
      questions-réponses. C'est la source d'APPLICATION qu'exige
      docs/veille_droit.md à côté du texte de Légifrance. Dérouler la
      recherche par thème et par date, pas seulement la page d'accueil.
    statut: a_explorer

  - id: cnav_circulaire_2026_07
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2026_07_05032026.pdf
    nature: document
    acces: session
    regimes: [regime_general]
    a_en_tirer: >-
      Circulaire du 5 mars 2026 : à lire pour ce qu'elle change au scénario 1,
      avec sa ligne dans veille.yaml et son exemple chiffré s'il y en a un.
    statut: a_explorer

  - id: cnav_circulaire_2026_04
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2026_04_05022026.pdf
    nature: document
    acces: session
    regimes: [regime_general]
    a_en_tirer: >-
      Circulaire du 5 février 2026, même traitement.
    statut: a_explorer

  - id: cnav_circulaire_2025_33
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2025_33_23122025.pdf
    nature: document
    acces: session
    regimes: [regime_general]
    a_en_tirer: >-
      Circulaire du 23 décembre 2025 : période où la loi du 30 décembre 2025 a
      déplacé les âges légaux, celle-là même qui avait pris le dépôt en défaut
      le 17 septembre 2026. Vérifier que les tables du dépôt la portent.
    statut: a_explorer

  - id: cnav_circulaire_2025_29
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2025_29_22122025.pdf
    nature: document
    acces: session
    regimes: [regime_general]
    a_en_tirer: >-
      Circulaire du 22 décembre 2025, même traitement.
    statut: a_explorer

  - id: cnav_prelevements_sociaux
    url: https://www.lassuranceretraite.fr/portail-info/portail-info/home/retraite/paiements-retraite/prelevements-sociaux-retraite.html
    nature: bareme
    acces: session
    regimes: [regime_general]
    a_en_tirer: >-
      CSG, CRDS, Casa sur les pensions : taux, seuils de revenu fiscal de
      référence, exonération et taux réduit. Le dépôt compare des pensions
      BRUTES ; ces taux sont ce qui manque pour dire un net de pension, comme
      l'action 39 l'a fait pour le salaire.
    statut: a_explorer

  - id: cnav_arrierees_artiste_auteur
    url: https://www.lassuranceretraite.fr/portail-info/hors-menu/annexe/salaries/montant-retraite/cotis-arrierees-artiste-auteur.html
    nature: bareme
    acces: session
    regimes: [regime_general, ircec_raap]
    a_en_tirer: >-
      Le barème de régularisation des cotisations arriérées des
      artistes-auteurs. Chiffres rares, et fiche IRCEC partielle à l'inventaire.
    statut: a_explorer

  # ---- Agirc-Arrco ------------------------------------------------------

  - id: agirc_arrco_calcru
    url: https://espace-personnel.agirc-arrco.fr/public/calcru
    nature: simulateur
    acces: ferme
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Le calculateur public de la retraite complémentaire — anonyme, sans
      FranceConnect, donc automatisable en principe.
    statut: a_explorer
    note: >-
      Le certificat du serveur était EXPIRÉ le 22 septembre 2026 (chaîne
      Sectigo complète, `Verify return code: 10`). Rien à contourner : ni
      `curl` ni Chromium ne doivent passer outre. À resonder, le défaut est
      chez l'émetteur et se répare de son côté.

  - id: agirc_arrco_calculette_fiscale
    url: https://www.agirc-arrco.fr/storage/2026-Calculette-determination-fiscale-clients-V3.html
    nature: simulateur
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Une page HTML autonome : le calcul est DANS le fichier, en JavaScript.
      Elle donne les taux de CSG, CRDS, Casa et l'assiette fiscale des
      pensions complémentaires, lisibles directement dans le source plutôt
      que déduits d'une prose. À lire ligne à ligne, c'est un barème exécutable.
    statut: a_explorer

  - id: agirc_arrco_points_obtenus
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/comprendre-ma-retraite/points-de-retraite-comment-sont-ils-obtenus/
    nature: regle
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Salaire de référence, taux d'appel, assiette : la règle d'acquisition
      telle que le régime l'énonce, à confronter aux valeurs de
      data/reference/regimes/valeurs_point.csv, qui viennent d'OpenFisca —
      source secondaire plafonnée au niveau `haute`.
    statut: a_explorer

  - id: agirc_arrco_points_carriere
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/comprendre-ma-retraite/points-de-retraite-et-evenements-de-la-carriere/
    nature: regle
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Les points attribués sans cotisation : chômage, maladie, invalidité,
      temps partiel. C'est exactement la frontière que docs/frontiere_contributive.md
      arbitre, et l'un des postes que l'action 81 a chiffrés à 17,9 milliards.
    statut: a_explorer

  - id: agirc_arrco_points_vie
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/comprendre-ma-retraite/points-de-retraite-et-evenements-de-la-vie/
    nature: regle
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Les points liés aux événements familiaux, et la majoration pour enfants :
      matière de l'action 43, qui montre ce que chaque système sert à une mère.
    statut: a_explorer

  - id: agirc_arrco_etranger
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/comprendre-ma-retraite/travailler-a-letranger/
    nature: regle
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Ce que devient la complémentaire pendant une expatriation, à croiser
      avec le parcours expatriation du GIP.
    statut: a_explorer

  - id: agirc_arrco_ouverture_droits
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/demander-ma-retraite/conditions-douverture-de-mes-droits/
    nature: regle
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Conditions d'ouverture et coefficient de solidarité (le « malus » de
      10 % pendant trois ans), supprimé pour les liquidations récentes :
      vérifier la date d'extinction que le dépôt applique.
    statut: a_explorer

  - id: agirc_arrco_majorations_enfants
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/demander-ma-retraite/majorations-pour-enfants/
    nature: bareme
    acces: session
    regimes: [agirc_arrco, agirc, arrco]
    a_en_tirer: >-
      Majoration de 10 % pour trois enfants, majoration pour enfant à charge,
      leur plafond, et leur histoire Agirc/Arrco avant 2012 — le dépôt doit
      dire laquelle il applique année par année.
    statut: a_explorer

  - id: agirc_arrco_retraite_progressive
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/demander-ma-retraite/retraite-progressive/
    nature: regle
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      La retraite progressive vue par la complémentaire, à joindre au parcours
      du GIP pour chiffrer ce que le dispositif vaut.
    statut: a_explorer

  - id: agirc_arrco_reversion
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/demander-ma-retraite/la-pension-de-reversion/
    nature: regle
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Taux de 60 %, âge, condition de non-remariage, absence de condition de
      ressources : la réversion complémentaire, que le dépôt ne modélise pas.
    statut: a_explorer

  - id: agirc_arrco_reversion_orphelin
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/demander-ma-retraite/la-pension-de-reversion-de-lorphelin/
    nature: regle
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      La réversion d'orphelin, propre à la complémentaire : 50 % des points,
      conditions d'âge. Un droit dont aucun régime de base n'a l'équivalent.
    statut: a_explorer

  - id: agirc_arrco_cumul_emploi_retraite
    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/vivre-ma-retraite/cumul-emploi-retraite/
    nature: regle
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Le cumul emploi-retraite et les droits nouveaux qu'il ouvre depuis 2023 :
      dispositif que la proposition notionnelle rend sans objet, et qu'il faut
      donc savoir décrire pour dire ce qu'elle simplifie.
    statut: a_explorer

  - id: agirc_arrco_circulaire_2025_16
    url: https://www.agirc-arrco.fr/storage/CirculaireAgircArrco2025-16sg-drj.pdf
    nature: document
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Une circulaire précise, à lire pour ce qu'elle fixe et pour ses exemples
      chiffrés, que test_oracle.py sait rejouer.
    statut: a_explorer

  - id: agirc_arrco_textes_de_reference
    url: https://www.agirc-arrco.fr/nous-connaitre/nos-etudes-et-publications/documentation-institutionnelle/textes-de-reference/
    nature: index
    acces: session
    regimes: [agirc_arrco, agirc, arrco]
    a_en_tirer: >-
      L'accord national interprofessionnel et ses avenants : le TEXTE du
      régime, là où la fiche grand public n'en est que le résumé.
    statut: a_explorer

  - id: agirc_arrco_circulaires
    url: https://www.agirc-arrco.fr/nous-connaitre/nos-etudes-et-publications/documentation-institutionnelle/circulaires-agirc-arrco/
    nature: index
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Toutes les circulaires, pas seulement la 2025-16 : à dérouler, année par
      année, pour dater les changements de paramètres.
    statut: a_explorer

  - id: agirc_arrco_parametres_statistiques
    url: https://www.agirc-arrco.fr/nous-connaitre/nos-etudes-et-publications/documentation-institutionnelle/parametres-et-donnees-statistiques/
    nature: bareme
    acces: session
    regimes: [agirc_arrco, agirc, arrco]
    a_en_tirer: >-
      Les paramètres publiés par le producteur : salaire de référence, valeur
      de service, taux d'appel, rendement — de quoi CERTIFIER valeurs_point.csv
      au lieu de la tenir d'OpenFisca. Et les effectifs, qui pèsent les cas
      types depuis l'action 1.
    statut: a_explorer

  - id: agirc_arrco_guides
    url: https://www.agirc-arrco.fr/nous-connaitre/nos-etudes-et-publications/documentation-pratique/guides-dinformation-retraite/
    nature: index
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Les guides d'information : c'est là que les exemples chiffrés complets
      se trouvent, carrière et résultat.
    statut: a_explorer

  # ---- Ircantec ---------------------------------------------------------

  - id: ircantec_points_mode_de_calcul
    url: https://baseircantec.retraites.fr/carriere/constitution-des-droits/determination-du-nombre-de-points-mode-de-calcul
    nature: regle
    acces: session
    regimes: [ircantec]
    a_en_tirer: >-
      La base documentaire de l'Ircantec — l'équivalent d'un règlement, autrement
      plus précis que la page grand public : assiettes A et B, taux théoriques,
      taux d'appel, salaire de référence.
    statut: a_explorer

  - id: ircantec_parametres
    url: https://www.ircantec.retraites.fr/employeur/parametres-utilises-ircantec
    nature: bareme
    acces: session
    regimes: [ircantec]
    a_en_tirer: >-
      Les paramètres de l'année et leur série : à confronter à valeurs_point.csv
      et aux taux de cotisation de la fiche du régime.
    statut: a_explorer

  - id: ircantec_valeur_point
    url: https://www.ircantec.retraites.fr/retraite/valeur-point
    nature: bareme
    acces: session
    regimes: [ircantec]
    a_en_tirer: >-
      La valeur de service, historisée par le producteur lui-même.
    statut: a_explorer

  - id: ircantec_prolongation_activite
    url: https://www.ircantec.retraites.fr/actif/acquisition-droits/prolongation-activite
    nature: regle
    acces: session
    regimes: [ircantec]
    a_en_tirer: >-
      Ce que la prolongation d'activité ajoute : la surcote propre à l'Ircantec,
      si elle existe, et le sort des points acquis après l'âge du taux plein.
    statut: a_explorer

  - id: ircantec_prelevements_sociaux
    url: https://www.ircantec.retraites.fr/guide-des-prelevements-sociaux
    nature: bareme
    acces: session
    regimes: [ircantec]
    a_en_tirer: >-
      Le guide des prélèvements sur les pensions : deuxième source sur les
      taux CSG/CRDS/Casa, à recouper avec la Cnav et l'Agirc-Arrco. Trois
      sources qui disent la même chose valent certification.
    statut: a_explorer

  # ---- RAFP (ERAFP) -----------------------------------------------------

  - id: rafp_simulateur_prestation
    url: https://www.rafp.fr/actif/futur-retraite/simulateur-prestation
    nature: simulateur
    acces: session
    regimes: [rafp]
    a_en_tirer: >-
      La prestation servie pour un nombre de points donné : rente ou capital
      selon le seuil, coefficient de majoration par âge. Plusieurs exécutions
      donnent la TABLE de conversion entière, que le dépôt applique aujourd'hui
      de mémoire d'arrêté.
    statut: a_explorer

  - id: rafp_calculette_points
    url: https://www.rafp.fr/actif/futur-retraite/calculette-points
    nature: simulateur
    acces: session
    regimes: [rafp]
    a_en_tirer: >-
      Les points acquis pour une assiette donnée : c'est le versant
      acquisition du même barème, et le moyen de vérifier l'assiette (20 % du
      traitement indiciaire, primes comprises) que le dépôt retient.
    statut: a_explorer

  - id: rafp_cotisations_points
    url: https://www.rafp.fr/actif/activite/calculer-vos-cotisations-et-vos-points-rafp
    nature: regle
    acces: session
    regimes: [rafp]
    a_en_tirer: >-
      L'assiette, le plafond de 20 %, le partage 5 %/5 % : la règle écrite
      derrière les deux calculettes.
    statut: a_explorer

  - id: rafp_retraite
    url: https://www.rafp.fr/retraite
    nature: regle
    acces: session
    regimes: [rafp]
    a_en_tirer: >-
      Liquidation, âge, seuil de versement en capital : la porte d'entrée des
      pages « retraite » du régime, à dérouler.
    statut: a_explorer

  - id: rafp_compte_epargne_temps
    url: https://www.rafp.fr/employeur/compte-epargne-temps
    nature: regle
    acces: session
    regimes: [rafp]
    a_en_tirer: >-
      La monétisation du compte épargne-temps en points RAFP : un canal
      d'acquisition que le dépôt ignore, à chiffrer ou à déclarer.
    statut: a_explorer

  # ---- Service des retraites de l'État -----------------------------------

  - id: sre_formule_de_calcul
    url: https://retraitesdeletat.gouv.fr/actif/le-calcul-de-ma-retraite/la-formule-de-calcul
    nature: regle
    acces: session
    regimes: [fonction_publique_etat]
    a_en_tirer: >-
      La formule que la caisse applique : 75 %, traitement des six derniers
      mois, durée des services. La fiche du régime est `partiel` à l'inventaire.
    statut: a_explorer

  - id: sre_decote
    url: https://retraitesdeletat.gouv.fr/actif/le-calcul-de-ma-retraite/la-decote
    nature: regle
    acces: session
    regimes: [fonction_publique_etat]
    a_en_tirer: >-
      Le barème de décote et son âge d'annulation, avec ses exemples chiffrés :
      matière directe pour exemples_officiels.yaml, à côté de la fiche F20349
      déjà rejouée.
    statut: a_explorer

  - id: sre_surcote
    url: https://retraitesdeletat.gouv.fr/actif/le-calcul-de-ma-retraite/la-surcote
    nature: regle
    acces: session
    regimes: [fonction_publique_etat]
    a_en_tirer: >-
      La surcote de la fonction publique, ses trimestres entiers, et la
      surcote parentale ouverte en 2024.
    statut: a_explorer

  - id: sre_duree_assurance
