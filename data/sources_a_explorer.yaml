  # ---- DREES : les modèles publics ---------------------------------------
  # Ce lot est d'une autre nature que les autres : ce n'est pas une règle à
  # lire, c'est un MODÈLE à confronter au nôtre, écrit par l'administration
  # qui chiffre les réformes.

  - id: drees_codes_sources_communique
    url: https://drees.solidarites-sante.gouv.fr/communique-de-presse/la-drees-met-disposition-de-nouveaux-codes-sources-et-des-nouvelles-bases-de
    nature: index
    acces: refus
    regimes: []
    a_en_tirer: >-
      L'inventaire de ce que la DREES a ouvert : modèles, bases, dépôts. Point
      d'entrée des trois lignes qui suivent, et de ce qu'elles ne disent pas.
    statut: explore
    explore_le: "2026-10-11"
    note: >-
      Le 22 septembre 2026 au soir, le serveur ferme la connexion sans rien
      répondre (« Empty reply from server »), à `curl` comme à Python, quand il
      répondait 200 le matin même. Un zéro n'est pas un refus : à resonder seul
      et lentement avant de conclure, l'accès reste `session`. Le 11 octobre,
      le site ne sert plus aucune session (voir `drees_caliper`) : l'accès
      passe à `refus`. Lu ce jour-là dans sa copie d'Internet Archive du
      13 janvier 2025 (web.archive.org/web/20250113161010/, suivi de
      l'adresse ; première copie le 23 décembre 2021). Paru le 23 décembre
      2021, c'est le « communiqué de 2021 » que l'action 137 cherchait. Il ne
      nomme pas CALIPER : il ouvre « le code source du moteur de calcul des
      droits (calculPension) du modèle Trajectoire » (`drees_calcul_pension`),
      pour simuler « sur des carrières types paramétrées par l'utilisateur »
      les pensions des régimes, sous EUPL, qui « engage les réutilisateurs à
      rendre également publics les utilisations et développements
      complémentaires » ; avec lui, les données de l'EACR, que le manifeste a
      déjà (`drees_eacr`), et deux modèles de la perte d'autonomie, LIVIA et
      Autonomix. Le registre des modèles, data/reference/referents.yaml, le
      disait déjà de `calcul_pension` : rien n'y change. Le même jour, la page
      s'ouvre dans le navigateur du propriétaire, sur un réseau mobile ; ses
      captures d'écran en montrent les listes de données et de codes ouverts,
      telles que la copie les donne.

  - id: drees_caliper
    url: https://drees.solidarites-sante.gouv.fr/sources-outils-et-enquetes/loutil-caliper-calcul-interregimes-des-pensions-de-retraite
    nature: code
    acces: refus
    regimes: []
    a_en_tirer: >-
      CALIPER calcule une pension INTERRÉGIMES, régime par régime : c'est le
      jumeau administratif du scénario 1. Sa documentation dit quelles règles
      il applique et lesquelles il simplifie — la liste des simplifications
      d'un modèle officiel est un étalon pour docs/limites.md.
    statut: epuise
    explore_le: "2026-10-11"
    note: >-
      Le 22 septembre 2026 au soir, le serveur ferme la connexion sans rien
      répondre (« Empty reply from server »), à `curl` comme à Python, quand il
      répondait 200 le matin même. Un zéro n'est pas un refus : à resonder seul
      et lentement avant de conclure, l'accès reste `session`. Le 4 octobre,
      `curl` reçoit une page de test anti-robot, et WebFetch lit la page :
      l'outil « a été réécrit en R », son code est celui de `calcul_pension`
      (`drees_calcul_pension`, plus bas). Ce que sa documentation a donné — le
      Dossier solidarité et santé n° 37, lu par un miroir, et le DT 111 — est
      au registre des modèles, data/reference/referents.yaml (`caliper`) : le
      SAM trimestrialisé d'avant 1995 et l'exclusion des années sans trimestre
      depuis 2004, repris (chantier 138.16) ; sa validation sur les pensions
      réelles de l'EIR 2004, à reprendre (138.14), avec des données qu'on ne
      lit qu'au CASD. La liste de ses simplifications n'a pas été confrontée à
      docs/limites/. Le 11 octobre, aucun client d'une session n'atteint plus
      le site, page d'accueil comprise : `curl` et Python, dont la connexion
      chiffrée va jusqu'au vrai serveur (certificat DigiCert, vérifié), en
      reçoivent une réponse vide ; Chromium, que le proxy de sortie
      intercepte, reçoit de ce proxy un 502 « upstream request failed », sa
      propre requête ayant échoué ; WebFetch, un 503. Par la même voie,
      Chromium lit l'INSEE : l'accès passe à `refus`. La copie d'Internet
      Archive du 10 juin 2026 (web.archive.org/web/20260610064930/, suivi de
      l'adresse) dit ce que la page disait le 4 octobre : « Paru le
      23/07/2020 », et « Cet outil a été réécrit en R et son code est ouvert
      sur le lien suivant » : celui de `calcul_pension`. Son communiqué de
      2021 est `drees_codes_sources_communique`, plus haut. Le même jour, la
      page s'ouvre dans le navigateur du propriétaire, sur un réseau mobile,
      et ses captures d'écran montrent la même phrase et les deux mêmes
      publications de référence (le Panorama de juin 2023 et le DT 111) : le
      refus vise le réseau de sortie des sessions dans le cloud, non le site.
      Une session locale, sur le poste du propriétaire, est l'autre voie. Elle
