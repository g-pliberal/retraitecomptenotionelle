      temps plein pour que la quotité non travaillée compte, quatre trimestres
      au plus : deux ans à 50 %, cinq à 80 %, dix à 90 %. Taux de D. 5 —
      retenue sur la quotité travaillée, plus 80 % de la retenue et du taux
      employeur sur l'autre —, 16,68 % à 80 % en 2026, sur le traitement à
      temps plein, NBI et CTI compris ; qui a demandé avant le 2 février 2024
      garde 11,10 % et 33,40 % (décret n° 2024-49). Exemples : 285,71 € et
      306,28 € de retenue sur 1 836,20 €. Le modèle ne surcotise pas
      (docs/limites.md) ; reste à rapprocher ce prix de celui d'un trimestre
      dans le compte notionnel, ce que la ligne venait chercher.

