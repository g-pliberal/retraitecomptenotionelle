    explore_le: "2026-09-24"
    note: >-
      La NBI versée depuis le 1er août 1990, cotisée, ouvre un supplément qui
      s'ajoute à la pension (décret n° 2003-1306, article 28) : moyenne
      annuelle des points de NBI, multipliée par la durée de perception et par
      le taux de l'année d'ouverture des droits. L'exemple d'une directrice de
      crèche — 15 points pendant 990 jours, dont une année à mi-temps — donne
      11 trimestres, un coefficient de 0,71 % et 37,46 € par an, aux valeurs
