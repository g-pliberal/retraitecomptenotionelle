      plein ». Les questions de cotisation reprennent le guide. Déroulée
      pour la retraite ; pas pour l'action sociale ni le recouvrement.
      RELUE LE MÊME JOUR : la réponse sur le RACL — « la pension RACL se
      liquide à compter de l'âge du taux plein, ce qui peut entraîner une
      différence entre l'âge de liquidation au régime général et au RACL » —
      décrit la règle d'AVANT l'arrêté du 13 mai 2025, qui a donné au RACL le
