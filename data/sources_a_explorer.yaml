    url: https://www.agirc-arrco.fr/particuliers/ma-retraite/demander-ma-retraite/majorations-pour-enfants/
    nature: bareme
    acces: session
    regimes: [agirc_arrco, agirc, arrco]
    a_en_tirer: >-
