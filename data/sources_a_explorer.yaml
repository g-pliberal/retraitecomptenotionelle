# Sources repérées, à explorer — le vivier du manifeste
# =====================================================
# `data/sources.yaml` est le manifeste : il ne porte que des sources DONT UNE
# VALEUR EST ENTRÉE dans le dépôt. Ce fichier-ci porte l'amont : les sources
# repérées, dont on sait qu'elles contiennent quelque chose pour le modèle,
# et qu'aucune session n'a encore dépouillées. Une source ne reste pas ici :
# quand elle a rendu ce qu'elle avait, elle passe dans le manifeste — et sa
# ligne ici prend l'état `epuise` avec la date.
#
# Il est né le 22 septembre 2026 d'une liste de 260 adresses, remise en huit
# lots. Le chantier qu'elle ouvre est l'action 89 de `docs/feuille_de_route.md`,
# et la manière de le mener est dans `docs/exploration_sources.md`.
#
# OÙ VA CE QU'ON EN TIRE
#   un exemple chiffré ....... tests/temoins/exemples_officiels.yaml, rejoué
#                              contre le scénario 1 par tests/test_oracle.py
#   une règle de droit ....... data/reference/legislation/veille.yaml
#   un barème, une valeur .... data/reference/regimes/, et la source passe au
#                              manifeste avec son `statut_integration`
#   un mur .................... docs/limites.md, et la fiche du régime
#   une réforme non coupée ... data/reference/legislation/reformes.yaml
#
# CHAMPS
#   id ............ identifiant court, unique dans le fichier
#   url ........... l'adresse telle qu'elle a été remise
#   nature ........ voir ci-dessous
#   acces ......... ce qu'une session obtient, MESURÉ le 22 septembre 2026
#   regimes ....... codes de data/reference/regimes/inventaire.yaml que la
#                   page concerne ; vide quand elle est interrégime
#   a_en_tirer .... ce qu'on va y chercher, en une phrase — pas « explorer »
#   statut ........ a_explorer | en_cours | explore | epuise | sans_suite
#   explore_le .... date du dépouillement, quand il a eu lieu
#   note .......... ce que la session a trouvé, ou ce qui l'a arrêtée
#   budget ........ pour un simulateur, le nombre de SAISIES que le dépôt
#                   s'accorde (docs/architecture.md, § 3.5) : dû dès qu'un
#                   exemple officiel le cite ; à la première, le quart des
#                   entrées que son formulaire offre, dix s'il est ouvert ;
#                   le propriétaire le change ici. Ce qui reste :
#                   `python scripts/simulateurs.py budget`
#   saisies_hors_exemples  les saisies faites qu'aucun exemple officiel ne
#                   porte encore — le modèle ou l'adaptateur manque — : le
#                   budget les décompte avec les autres
#
# NATURE
#   simulateur  un formulaire qui calcule. C'est la mine : chaque exécution
#               est un exemple chiffré produit par celui-là même qui applique
#               la règle, et vingt exécutions dessinent le barème entier.
#   regle       une page qui décrit une règle (âge, décote, minimum, cumul)
#   bareme      des taux, des plafonds, des valeurs de point
#   document    un PDF — circulaire, guide, règlement, statistiques
#   index       une page-liste d'où partent d'autres documents : à DÉROULER,
#               c'est là que se cachent les règlements et les circulaires
#   code        le code source d'un modèle public, lisible et exécutable
#
# ACCES — mesuré, pas supposé (260 adresses sondées le 22 septembre 2026 :
#         252 répondent 200 à une simple requête, huit demandent un geste).
#         Un 200 ne dit pas qu'on a lu la page : resondées le soir même par
#         scripts/fetch/sonder_sources.py, qui juge le TEXTE servi, les six
#         pages de l'ENIM (un pare-feu Incapsula) et trois de mon-entreprise
#         (des coquilles remplies en JavaScript) sont passées à `navigateur`.
#   session ............ joignable en `curl` depuis une session, 200
#   chaine_incomplete .. le serveur ne sert pas l'intermédiaire de son
#                        certificat ; un navigateur le rattrape tout seul,
#                        `curl` non. Recette dans docs/exploration_sources.md
#   navigateur ......... demande Chromium : Cloudflare, ou page construite en
#                        JavaScript. Playwright est installé (voir le doc)
#   git ................ la page HTML est refusée, `git clone` passe
#   refus .............. 403, ou une connexion fermée sans réponse : le site
#                        ou la politique de sortie refuse
#   ferme .............. hors de portée d'une session, et pour une raison qui
#                        ne se contourne pas (certificat expiré, FranceConnect)

sources:

  # ---- Union Retraite (GIP interrégimes) --------------------------------
  # Le seul endroit où le droit de TOUS les régimes est appliqué ensemble.
  # `tests/temoins/exemples_officiels.yaml` dit depuis sa première ligne
  # qu'« aucun simulateur officiel n'est automatisable » : c'est vrai de
  # « Mon estimation retraite », qui exige FranceConnect, et FAUX des
  # simulateurs anonymes que le même GIP publie, qu'aucune session n'avait
  # essayé d'atteindre — le certificat incomplet de *.info-retraite.fr
  # suffisait à les faire passer pour injoignables.

  - id: union_retraite_les_simulateurs
    url: https://les-simulateurs.info-retraite.fr
    nature: index
    acces: chaine_incomplete
    regimes: []
    a_en_tirer: >-
      La liste des simulateurs du GIP, et pour chacun s'il est anonyme ou
      derrière FranceConnect. Point d'entrée de tout le lot.
    statut: explore
    explore_le: "2026-10-04"
    note: >-
      Ce que `chaine_incomplete` coûte dépend du CLIENT, pas du lieu. Le
      serveur omet l'intermédiaire de son certificat ; un client qui va le
      chercher par l'extension AIA du certificat — tout navigateur, et le
      `curl` de Windows adossé à Schannel — le rattrape seul et répond 200,
      vérification entière (`ssl_verify=0`). Le `curl` d'une session s'arrête,
      lui, sur « unable to get local issuer certificate » : d'où la recette de
      `docs/exploration_sources.md`, qui ajoute le maillon au paquet de
      confiance. Mesuré le 22 septembre 2026. La page, lue le 4 octobre 2026,
      porte quatre simulateurs, tous anonymes : l'âge légal, la carrière
      longue, le handicap et la réversion, de simples formulaires sans
      captcha. Chacun a sa ligne ci-dessous, avec son budget ; « Mon
      estimation retraite », le seul qui chiffre une pension entière, est
      derrière FranceConnect.

  - id: union_retraite_age_depart
    url: https://les-simulateurs.info-retraite.fr/age-depart
    nature: simulateur
    acces: chaine_incomplete
    regimes: []
    a_en_tirer: >-
      L'âge légal et la durée requise que les caisses appliquent, génération
      par génération, de 1962 à « 1969 et après » : celles que la suspension
      de 2026 et la fin de son calendrier déplacent.
    statut: explore
    explore_le: "2026-10-04"
    budget: 2
    note: >-
      Deux saisies le 4 octobre 2026, par Claude, sur un lot que le propriétaire
      a approuvé (docs/architecture.md, § 3.5) : « 1969 et après » et « 1968 »,
      aux exemples officiels sous `ur_age_legal_`. 64 ans, puis 63 ans et 9
      mois, 172 trimestres dans les deux cas, le taux plein automatique à 67
      ans : le modèle concorde, et L. 161-17-2, relu le même jour sur
      Légifrance, dit la même chose. Le budget est épuisé ; 1964 et 1965 sont
      déjà tenus par les exemples de la circulaire Cnav 2026-07.

  - id: union_retraite_carriere_longue
    url: https://les-simulateurs.info-retraite.fr/carriere-longue
    nature: simulateur
    acces: chaine_incomplete
    regimes: []
    a_en_tirer: >-
      L'âge du départ anticipé et la durée exigée, par génération (1964 à 1970)
      et par borne de début d'activité (16, 18, 20 et 21 ans) : les portes de
      la carrière longue telles que la caisse les ouvre.
    statut: explore
    explore_le: "2026-10-04"
    budget: 7
    note: >-
      Cinq saisies le 1er octobre 2026, par le propriétaire
      (docs/architecture.md, § 3.5), aux exemples officiels sous `ur_racl_` :
      les quatre portes, les 172 trimestres de 1966, 1968 et 1969, et l'année
      1965 coupée en trois, qui a levé deux arrondis corrigés dans les deux
      moteurs. Le simulateur omet les quatre trimestres des nés d'octobre et de
      novembre 1965. Deux de plus le 4 octobre, par Claude : 1970, avant 16 et
      avant 18 ans, 58 et 60 ans avec 172 trimestres, comme le modèle. Le
      budget est épuisé.

  - id: union_retraite_handicap
    url: https://les-simulateurs.info-retraite.fr/situation-handicap
    nature: simulateur
    acces: chaine_incomplete
    regimes: []
    a_en_tirer: >-
      L'âge de la retraite anticipée des travailleurs handicapés, du privé ou
      fonctionnaires, générations 1961 à 1973 : la fiche
      `retraite_anticipee_handicap` confrontée à la caisse.
    statut: explore
    explore_le: "2026-10-04"
    budget: 24
    note: >-
      94 entrées : fonctionnaire territorial ou hospitalier ou régime spécial
      (oui ou non), treize années de naissance de 1961 à « 1973 ou plus
      tard », et l'âge de départ — 59 seul de 1961 à 1963, 58 et 59 en 1964,
      57 à 59 en 1965, 56 à 59 en 1966, 55 à 59 ensuite ; budget au quart.
      Vingt-quatre saisies le 4 octobre 2026, par Claude, en deux lots
      approuvés ; le budget est épuisé, et aucune n'est en exemple officiel :
      le modèle ne traite pas ce départ. Vingt-trois donnent la durée cotisée
      en situation de handicap de D. 351-1-5 dans sa version du 1er septembre
      2026 (décret n° 2026-345) — la durée de la génération, celle d'avant
      2023 pour les nés avant 1973, moins 60 à 100 trimestres de 55 à 59 ans :
      non, 1961, 59 ans : 68 ; 1963, 59 : 68 ; 1964, 58 : 79, 59 : 69 ; 1965,
      57 : 89 ; 1966, 56 : 99, 59 : 69 ; 1967, 55 : 110, 59 : 70 ; 1968, 56 :
      100 ; 1969, 55 : 110 ; 1970, 55 : 111, 57 : 91 ; 1971, 56 : 101 ; 1972,
      58 : 81 ; 1973 et après, 55 : 112, 56 : 102, 57 : 92, 58 : 82, 59 : 72 ;
      oui, 1966, 56 : 99 ; 1970, 57 : 91 ; 1973, 55 : 112. La vingt-quatrième,
      oui, 1961, 59 ans, demande « un total de 88 trimestres, dont 68
      cotisés » : la double condition d'avant le 1er septembre 2023 (durée
      validée moins 80), que l'article 25, II, du décret n° 2003-1306 en
      vigueur n'écrit plus ; des quatre saisies « oui », celle-là seule
      l'applique, les générations de 1962 à 1965 n'ont pas été saisies.
      La réponse ajoute un départ au taux plein dès 62 ans, sans durée.
      Le 5 octobre 2026, le modèle porte ce départ (action 142) : les
      vingt-quatre saisies sont des exemples officiels (`ur_handicap_*`),
      chacune à la seule date d'effet que sa génération et son âge
      permettent, et toutes concordent. La vingt-quatrième n'est pas un
      écart : parti à 59 ans, le fonctionnaire né en 1961 partait en 2020,
      sous la double condition de la version de 2015 (88 validés, 68
      cotisés), que l'article 25 écrivait alors.

  - id: union_retraite_reversion
    url: https://les-simulateurs.info-retraite.fr/reversion
    nature: simulateur
    acces: chaine_incomplete
    regimes: []
    a_en_tirer: >-
      Le droit à la réversion, régime par régime, selon l'âge, le mariage, les
      enfants et les ressources du survivant : les taux, les conditions et le
      plafond tels que les caisses les appliquent.
    statut: explore
    explore_le: "2026-10-04"
    budget: 10
    note: >-
      Quatre saisies le 1er octobre 2026, par le propriétaire
      (docs/architecture.md, § 3.5), aux exemples officiels sous
      `ur_reversion_` : les 54 % du régime général, les 60 % de l'Agirc-Arrco
      sans condition de ressources, l'âge de 55 ans et la condition de mariage
      de la fonction publique ; deux enfants à charge lèvent la condition d'âge
      de l'Agirc-Arrco, en écart connu. Six de plus le 4 octobre, par Claude ;
      le budget est épuisé. Le simulateur ne pose que les questions des
      régimes cochés, garde ses réponses dans `sessionStorage` (`demandeur`),
      d'une simulation à l'autre, et propose les ressources par tranches, au
      seuil de 2024 (6 058 € sur trois mois, 24 232 € sur douze) quand
      D. 353-1-1 et la circulaire Cnav 2025-33 donnent 6 250,40 € et
      25 001,60 € en 2026 : il refuse à tort entre les deux. La CNRACL, la MSA
      salariés, l'invalidité qui lève l'âge à l'Agirc-Arrco concordent ; le
      RAFP (50 %), la RCI (60 %) et l'Ircantec (50 %, servie à une veuve de
      52 ans, après une question de durée du mariage) ont leur réponse dans
      l'énoncé, faute de fiche. Restent l'exception des enfants à lire dans l'accord, le
      remariage, et les régimes que le modèle ne sert pas en réversion.

  - id: union_retraite_progressive
    url: https://parcours.info-retraite.fr/retraite-progressive
    nature: regle
    acces: chaine_incomplete
    regimes: []
    a_en_tirer: >-
      L'éligibilité à la retraite progressive, règle par règle et interrégime :
      âge, durée d'assurance, quotité de travail, et ce que la pension
      partielle vaut. Le dépôt ne modélise pas la retraite progressive ;
      c'est de quoi la chiffrer, ou dire dans limites.md ce qu'elle déplace.
    statut: explore
    explore_le: "2026-10-19"
    note: >-
      Un parcours d'information, qui ne calcule rien : ses quinze questions et
      vingt-cinq réponses sont dans la page (`_rawDataParcours`), lues sans
      une saisie, d'où `regle` plutôt que `simulateur`. Le modèle sert la
      retraite progressive depuis le 29 septembre 2026, et le parcours
      concorde avec sa fiche (`retraite_progressive`) : soixante ans depuis le
      1er septembre 2025, cent cinquante trimestres tous régimes, de 40 à 80 %
      du temps de travail, de 50 à 90 % pour un fonctionnaire, la fraction
      égale à ce qui manque à la quotité pour faire 100 % (80 % de temps, 20 %
      de retraite ; 65 %, 35 %). Il a fait relire deux règles que le modèle
      n'applique pas, déclarées dans la fiche et dans
      docs/limites/ecarts-au-droit-positif.md : la fraction d'un non-salarié
      servie au 1er janvier qui suit la demande (D. 161-2-24-2), et la
      retraite progressive que les décrets de la SNCF, de la RATP et de la
      Banque de France ouvrent à leurs agents depuis 2023. Détail : feuille de
      route, action 89, note du 19 octobre 2026 sur les parcours.

  - id: union_retraite_expatriation
    url: https://parcours.info-retraite.fr/retraite_expatriation
    nature: regle
    acces: chaine_incomplete
    regimes: []
    a_en_tirer: >-
      Le traitement des périodes à l'étranger : conventions, totalisation,
      proratisation. `docs/limites.md` déclare les carrières internationales
      hors modèle ; ce parcours dit ce que ce mur laisse dehors.
    statut: explore
    explore_le: "2026-10-19"
    note: >-
      Un parcours d'information, comme celui de la retraite progressive :
      cinquante questions et quatre-vingt-quinze réponses dans la page, lues
      sans une saisie, et dix-huit brochures de 2019 et 2020, dont les trois
      plus complètes sont lues (salariés, indépendants, clercs de notaire). Le
      modèle sert les carrières hors de France depuis le 1er octobre 2026, et
      son tableau des accords (data/reference/legislation/accords_internationaux.yaml)
      concorde avec le parcours : ses quarante-deux territoires conventionnés,
      ses dix-sept États pour les indépendants, ses sept accords qui totalisent
      un État tiers, et les types d'accords des brochures. Quatre exemples des
      brochures entrent au témoin et concordent (`ur_expatries_*`,
      tests/temoins/exemples_officiels.yaml). Deux pistes vont à la fiche
      `totalisation_des_periodes_etrangeres` : l'EEE ou la Suisse, que le
      parcours sépare, et le recalcul de la pension quand l'autre État
      liquide. Le volontariat international, que le parcours compte et dont
      le dépôt ne dit rien, est laissé à la session de D. 351-1-2. Le lexique
      omet l'Islande de l'EEE, que les brochures portaient. Détail : feuille
      de route, action 89, note du 19 octobre 2026 sur les parcours.

  # ---- Cnav / Assurance retraite ----------------------------------------

  - id: cnav_legislation_portail
    url: https://legislation.lassuranceretraite.fr/#/
    nature: index
    acces: session
    regimes: [regime_general]
    a_en_tirer: >-
      Le corpus d'application du régime général : circulaires, lettres,
      questions-réponses. C'est la source d'APPLICATION qu'exige
      docs/veille_droit.md à côté du texte de Légifrance. Dérouler la
      recherche par thème et par date, pas seulement la page d'accueil.
    statut: explore
    explore_le: 2026-10-14
    note: >-
      Lu le 14 octobre 2026 par son API (`/api/v1/baremes`, 397 barèmes
      en un JSON) : neuf récupérateurs de `scripts/fetch/` l'interrogent
      déjà, et 369 barèmes ne sont cités nulle part au dépôt. Ceux qui
      touchent le modèle sont nommés dans la note
      `docs/feuille_de_route/89/2026-10-14-cnav-service-public.md` — les
      taux de droit commun de 2014 à 2026, conformes à
      `taux_cotisation_annuels.csv`, les rachats de cotisations de 2013
      à 2026, les salaires forfaitaires des apprentis, des artistes, des
      journalistes. Reste à dérouler les exposés et les circulaires, par
      thème.

  - id: cnav_circulaire_2026_07
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2026_07_05032026.pdf
    nature: document
    acces: session
    regimes: [regime_general]
    a_en_tirer: >-
      Circulaire du 5 mars 2026 : à lire pour ce qu'elle change au scénario 1,
      avec sa ligne dans veille.yaml et son exemple chiffré s'il y en a un.
    statut: epuise
    explore_le: 2026-10-14
    note: >-
      Lue le 14 octobre 2026. Âges et durées par génération, annexes 1
      et 3 : identiques à `age_ouverture_requis.csv` et
      `duree_assurance_requise.csv`. Ses exemples du régime de base
      étaient au témoin ; celui du RCI y entre en écart connu
      (`cnav_2026_07_abattement_rci_1962`, fiche `abattement_rci`) : 7 %
      d'abattement pour sept trimestres manquants, l'annexe 2 du
      règlement, quand le modèle applique la décote du régime de base,
      0,9125. La durée de référence de la réversion d'un défunt né en
      1964 ou 1965 (point 4.5) est ajoutée à l'écart déclaré de
      `data/reference/regles/reversion.yaml`.

  - id: cnav_circulaire_2026_04
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2026_04_05022026.pdf
    nature: document
    acces: session
    regimes: [regime_general]
    a_en_tirer: >-
      Circulaire du 5 février 2026, même traitement.
    statut: epuise
    explore_le: 2026-10-14
    note: >-
      Lue le 14 octobre 2026 : le barème du versement pour la retraite
      est celui de l'arrêté du 21 octobre 2012, inchangé de 2013 à 2026,
      seules ses tranches de revenu suivant le plafond (36 045 et 48 060
      € en 2026) ; de 1 055 € le trimestre à 20 ans à 6 684 € à 62 ans,
      taux et durée, tranche haute. Le modèle ne rachète rien : la
      lecture va à la fiche
      `data/reference/regles/rachats_et_versements.yaml`.

  - id: cnav_circulaire_2025_33
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2025_33_23122025.pdf
    nature: document
    acces: session
    regimes: [regime_general]
    a_en_tirer: >-
      Circulaire du 23 décembre 2025 : période où la loi du 30 décembre 2025 a
      déplacé les âges légaux, celle-là même qui avait pris le dépôt en défaut
      le 17 septembre 2026. Vérifier que les tables du dépôt la portent.
    statut: epuise
    explore_le: 2026-10-14
    note: >-
      Lue le 14 octobre 2026 : déjà lue par le dépôt (fiches
      `minimum_contributif` et `avpf`, `assiette_avpf.csv`). Minimum
      contributif, majoré et plafond de 1 410,89 € par mois (16 930,68 €
      l'an), plafonds de la réversion, assiette de l'AVPF : tout
      concorde. Ses points 2.3 et 2.5 sont modifiés par la circulaire
      2026/16, que la fiche `minimum_contributif` a lue. Rien de plus à prendre
      (`data/reference/regles/minimum_contributif.yaml`).

  - id: cnav_circulaire_2025_29
    url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2025_29_22122025.pdf
    nature: document
    acces: session
    regimes: [regime_general]
    a_en_tirer: >-
      Circulaire du 22 décembre 2025, même traitement.
    statut: epuise
    explore_le: 2026-10-14
    note: >-
      Lue le 14 octobre 2026. Les coefficients de report des salaires de
      1942 à 2025 sont, au millième, la colonne du 1er janvier 2026 de
      `data/reference/legislation/revalorisation_salaires.csv` (ceux de
      1930 à 1941 n'y sont pas, sans assuré vivant). Versement
      forfaitaire unique, minimum et plafond de la réversion, majoration
      forfaitaire, ASPA, AVTS, majoration pour conjoint : concordent.
      Hors du modèle : l'allocation veuvage (719,58 €), la pension
      d'orphelin (108,57 €), la rente des retraites ouvrières et
      paysannes, dits aux limites ; les points de base des commerçants
      et des artisans d'avant 1973 restent au référent du chantier
      138.18.

  - id: cnav_prelevements_sociaux
    url: https://www.lassuranceretraite.fr/portail-info/portail-info/home/retraite/paiements-retraite/prelevements-sociaux-retraite.html
    nature: bareme
    acces: session
    regimes: [regime_general]
    a_en_tirer: >-
      CSG, CRDS, Casa sur les pensions : taux, seuils de revenu fiscal de
      référence, exonération et taux réduit. Le dépôt compare des pensions
      BRUTES ; ces taux sont ce qui manque pour dire un net de pension, comme
      l'action 39 l'a fait pour le salaire.
    statut: epuise
    explore_le: 2026-10-14
    note: >-
      Lue le 14 octobre 2026 : CSG à 3,80, 6,60 et 8,30 %, CRDS à 0,50
      %, CASA à 0,30 % aux deux derniers taux, les seuils renvoyant à
      service-public : c'est le barème de
      `data/reference/legislation/prelevements_remuneration.yaml`
      (`pensions`), déjà lu sur F2971.

  - id: cnav_arrierees_artiste_auteur
    url: https://www.lassuranceretraite.fr/portail-info/hors-menu/annexe/salaries/montant-retraite/cotis-arrierees-artiste-auteur.html
    nature: simulateur
    acces: session
    regimes: [regime_general, ircec_raap]
    a_en_tirer: >-
      Le barème de régularisation des cotisations arriérées des
      artistes-auteurs. Chiffres rares, et fiche IRCEC partielle à l'inventaire.
    statut: explore
    explore_le: 2026-10-14
    note: >-
      Lue le 14 octobre 2026 : non un barème mais un simulateur, qui
      calcule la régularisation par année (droits d'auteur, report,
      assiette, taux, coefficient de revalorisation, actualisation à 2,5
      %), de 1976 aux trois dernières années, cinq périodes de trois ans
      au plus. Son fichier de taux (`Simulateur AA/tauxVei.csv`) est la
      part salariale de la cotisation plafonnée, pondérée par mois, de
      1976 à 2017 : elle concorde avec `taux_cotisation_annuels.csv`
      sauf aux relèvements de l'année, que le dépôt date au 1er janvier
      — 1991, 7,60 % au lieu de 6,64 %. Aucune saisie : le lot est
      proposé au propriétaire dans la note du 14 octobre 2026.

  # ---- Agirc-Arrco ------------------------------------------------------

  - id: agirc_arrco_calcru
    url: https://espace-personnel.agirc-arrco.fr/public/calcru
    nature: simulateur
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Le calculateur public de la retraite complémentaire — anonyme, sans
      FranceConnect, donc automatisable en principe.
    statut: epuise
    explore_le: "2026-09-22"
    note: >-
      CE N'EST PAS UN SIMULATEUR DE PENSION, et c'est mieux que ça : `calcru`
      convertit des points Agirc et Arrco d'avant 2019 en points Agirc-Arrco.
      C'est donc l'oracle du COEFFICIENT DE FUSION, et il a levé une erreur du
      dépôt. `conversions_points.csv` portait 0,347798289 quand son propre
      commentaire prescrivait le rapport des valeurs de service au 31 décembre
      2018 — 0,4378 ÷ 1,2588 = 0,347791548. Le calculateur affiche ce
      quotient-là, et son exemple publié (1 000 points Agirc → 437,80 €) ne
      tombe juste qu'avec lui : l'ancienne valeur rendait 437,8085 €. Corrigé,
      et tenu désormais par
      `test_les_coefficients_de_fusion_se_recalculent_depuis_les_valeurs_de_point`,
      qui recalcule le quotient depuis deux valeurs de service certifiées —
      le garde-fou qui manquait, et sans lequel rien ne relisait ce nombre.
      Le reste de la page n'apprend rien : les valeurs de point 2018 et 2019
      qu'elle affiche sont déjà dans le dépôt, certifiées.
      LE CERTIFICAT A ÉTÉ RENOUVELÉ, et la ligne `ferme` est levée. Il était
      EXPIRÉ quand cette ligne a été écrite, le 22 septembre 2026 (chaîne
      Sectigo complète, `Verify return code: 10`) ; resondé le même jour, le
      serveur sert un certificat émis le 22 septembre 2026 et valable
      jusqu'au 8 avril 2027 (Sectigo Public Server Authentication CA OV R36).
      La vérification passe entière — `ssl_verify=0`, rien de désactivé —, et
      le site répond 200. Le défaut était bien chez l'émetteur, et il a été
      réparé de son côté dans la journée : le calculateur n'est plus hors de
      portée d'une session.

