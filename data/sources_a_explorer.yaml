      a fait tomber une convention le 22 septembre 2026. À confronter aux taux
      et aux parts que porte la fiche de la CNRACL.
    statut: epuise
    explore_le: "2026-09-22"
    note: >-
      Quarante-neuf périodes, du 19 septembre 1947 à 2026. Elle ne corrige
      RIEN — les soixante-dix-neuf années de contribution employeur et toute
      la série de retenue s'accordent avec le dépôt, au centième de point
      près —, et c'est justement ce qui la rend précieuse : la Caisse des
      dépôts GÈRE le régime, donc les quarante années qu'OpenFisca portait au
      niveau `haute` passent à `certifiee`. Récupérateur
      `scripts/fetch/juris_cnracl_taux.py`, certification
      `employeur_public_cnracl_gestionnaire` dans `scripts/verifier_donnees.py`,
      source au manifeste sous `juris_cnracl_taux`, contrôle dans
      `tests/test_juris_cnracl_taux.py`. Elle porte aussi une coquille — « Du
      01/01/20 au 31/12/2020 » — et dix années dont le taux a changé en cours
      de route, que la convention annuelle ne rend pas.

