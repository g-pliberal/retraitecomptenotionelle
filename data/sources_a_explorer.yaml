  # ---- CNRACL : la documentation juridique (septième lot) -----------------
  # `juris-cnracl.retraites.fr` est la base que la Caisse des dépôts tient pour
  # les employeurs territoriaux et hospitaliers : c'est le RÈGLEMENT du régime,
  # articles à l'appui, et non une page d'explication. `scripts/veille_droit.py`
  # la nomme déjà parmi les sources à consulter avant de toucher au scénario 1.

  - id: juris_cnracl_pension_normale
