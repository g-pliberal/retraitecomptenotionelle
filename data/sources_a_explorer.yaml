  - id: juris_cnracl_sp_cti
    url: https://www.juris-cnracl.retraites.fr/pension-normale/les-accessoires-de-pension/supplement-de-pension-au-titre-du-complement-de-traitement-indiciaire-sp-cti
    nature: bareme
    acces: session
    regimes: [cnracl]
    a_en_tirer: >-
