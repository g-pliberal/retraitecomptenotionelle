    statut: epuise
    explore_le: "2026-09-22"
    note: >-
      8 % entre le seuil de 900 SMIC horaires et trois plafonds ; option à 4 %
      sous 2 700 SMIC, droits divisés par deux ; 4 % sur les revenus déjà
      soumis au RACD ou au RACL ; prise en charge de moitié par la Sofia sous
      deux plafonds ; maintien de la classe de 2016 jusqu'en 2027 ; cotisation
      volontaire. La fiche `ircec_raap` de
      `data/reference/regimes/non_salaries.yaml` porte déjà tout cela, ou dit
      ne pas le modéliser ; le taux aménagé est noté dans `docs/limites.md`.
      RELUE LE MÊME JOUR, pour le taux aménagé : le décret (n° 62-420,
