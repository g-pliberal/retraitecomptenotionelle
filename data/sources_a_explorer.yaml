    statut: explore
    explore_le: "2026-09-24"
    note: >-
      L'ordre de la liquidation (décret n° 2003-1306) : traitement × 75 % ×
      trimestres / durée requise, services plafonnés à la durée, bonifications
      seules jusqu'à 80 % ; décote ou surcote ; majoration du fonctionnaire
      handicapé sous 75 % ; majoration pour enfants sous 100 % ; NBI,
      supplément des aides-soignants et SP-CTI sans plafond. Ses trois
      exemples — 171 trimestres ramenés à 169 ; 165 + 20 ramenés à 80 % ;
      171 + 5 à 77,21 % — illustrent la ligne `taux_maximum_fonction_publique`
      de la veille, qui dit n'en connaître aucun ; le deuxième écrit 169 + 20
      pour 165 + 20, sans effet sur les 80 %. Hors modèle : le plafond de
      vingt trimestres des bonifications actives et militaires.

