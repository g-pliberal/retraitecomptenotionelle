      modèle ne porte pas le temps partiel.
    statut: explore
    explore_le: "2026-09-24"
    note: >-
      Temps partiel, temps non complet et cessation progressive comptent
      pleinement dans la constitution du droit, et pour la durée travaillée
      dans la liquidation : un an à mi-temps et un an à temps plein font six
      trimestres liquidables. Trois exceptions : le mi-temps thérapeutique ;
      la surcotisation depuis 2004, quatre trimestres au plus, huit pour le
      fonctionnaire handicapé ; le temps partiel de droit pour un enfant né ou
      adopté depuis 2004, compté plein trois ans par enfant. C'est la ligne
      `temps_partiel_fonction_publique` de la veille, à l'état `manque`, faute
      de quotité dans la saisie (docs/limites.md) ; les deux exemples de la
      page attendent qu'elle y soit.

  - id: juris_cnracl_coordination
    url: https://www.juris-cnracl.retraites.fr/pension-normale/les-trimestres-liquidables/regles-de-coordination-avec-les-autres-regimes
    nature: regle
    acces: session
    regimes: [cnracl, regime_general, ircantec]
    a_en_tirer: >-
      Ce qui arrive aux services d'un agent qui part sans droit à pension :
