  # ---- Agirc-Arrco ------------------------------------------------------

  - id: agirc_arrco_calcru
    url: https://espace-personnel.agirc-arrco.fr/public/calcru
    nature: simulateur
    acces: session
    regimes: [agirc_arrco]
    a_en_tirer: >-
      Le calculateur public de la retraite complémentaire — anonyme, sans
      FranceConnect, donc automatisable en principe.
    statut: epuise
    explore_le: "2026-09-22"
    note: >-
      CE N'EST PAS UN SIMULATEUR DE PENSION, et c'est mieux que ça : `calcru`
      convertit des points Agirc et Arrco d'avant 2019 en points Agirc-Arrco.
      C'est donc l'oracle du COEFFICIENT DE FUSION, et il a levé une erreur du
      dépôt. `conversions_points.csv` portait 0,347798289 quand son propre
      commentaire prescrivait le rapport des valeurs de service au 31 décembre
      2018 — 0,4378 ÷ 1,2588 = 0,347791548. Le calculateur affiche ce
      quotient-là, et son exemple publié (1 000 points Agirc → 437,80 €) ne
      tombe juste qu'avec lui : l'ancienne valeur rendait 437,8085 €. Corrigé,
      et tenu désormais par
      `test_les_coefficients_de_fusion_se_recalculent_depuis_les_valeurs_de_point`,
      qui recalcule le quotient depuis deux valeurs de service certifiées —
      le garde-fou qui manquait, et sans lequel rien ne relisait ce nombre.
      Le reste de la page n'apprend rien : les valeurs de point 2018 et 2019
      qu'elle affiche sont déjà dans le dépôt, certifiées.
      LE CERTIFICAT A ÉTÉ RENOUVELÉ, et la ligne `ferme` est levée. Il était
      EXPIRÉ quand cette ligne a été écrite, le 22 septembre 2026 (chaîne
      Sectigo complète, `Verify return code: 10`) ; resondé le même jour, le
      serveur sert un certificat émis le 22 septembre 2026 et valable
      jusqu'au 8 avril 2027 (Sectigo Public Server Authentication CA OV R36).
      La vérification passe entière — `ssl_verify=0`, rien de désactivé —, et
      le site répond 200. Le défaut était bien chez l'émetteur, et il a été
      réparé de son côté dans la journée : le calculateur n'est plus hors de
      portée d'une session.

  - id: agirc_arrco_calculette_fiscale
    url: https://www.agirc-arrco.fr/storage/2026-Calculette-determination-fiscale-clients-V3.html
