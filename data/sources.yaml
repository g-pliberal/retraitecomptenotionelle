# Manifeste des sources institutionnelles
# ---------------------------------------
# Chaque jeu de données du dépôt référence une entrée de ce manifeste via son
# champ `source_id`. Le manifeste est la seule autorité sur « d'où vient ce
# chiffre ». Aucune donnée ne doit entrer dans data/reference/ sans y figurer.
#
# Champ `acces` :
#   api      -> récupérable automatiquement (voir scripts/fetch/)
#   fichier  -> fichier téléchargeable (xls/csv/pdf) à déposer dans data/brut/
#   document -> publication (rapport, JO, décret) à saisir manuellement
#
# Champ `blocage` (absent : la source est joignable depuis une session) :
#   refus      -> le site refuse les requêtes venant d'une session (403, page
#                 anti-robot, PDF réservé aux navigateurs) alors qu'un
#                 navigateur sur un poste ordinaire passe. Le document est à
#                 APPORTER : téléchargé ailleurs, déposé dans data/brut/ sous
#                 le nom que le site lui donne, et lu de là par le récupérateur
#                 (scripts/fetch/source_locale.py, option --fichier).
#   reseau     -> le site n'est pas joignable depuis l'environnement où le
#                 dépôt est construit ; limite de la machine, pas de la source
#   convention -> l'accès demande une clé, un compte ou une convention ; rien
#                 à apporter, la donnée n'entre pas dans le dépôt telle quelle
#   Le fichier est attendu sous le nom que l'adresse porte ; quand elle n'en
#   porte pas (`file-download/31546`), `fichier_local` le déclare. `document`
#   est l'adresse directe du fichier quand `url` est la page qui le présente
#   (le rapport de l'OPEF : `url` est sa page à la Banque de France,
#   `document` le PDF). `miroir`
#   est l'adresse d'un AUTRE hôte qui sert le même fichier et qu'une session
#   atteint — les annexes budgétaires sont déposées au Parlement, et
#   l'Assemblée nationale les sert —, et `sha256` l'empreinte du document :
#   `python scripts/fetch/source_locale.py --recuperer` télécharge chaque
#   miroir dans data/brut/ et refuse un fichier dont l'empreinte diffère.
#   Sans miroir public, le dépôt se fait le sien : le workflow
#   `documents-apportes.yml` (`source_locale.py --publier`, à la main ou
#   chaque mois) télécharge le `document` d'un jeu `refus` — requête simple,
#   puis Chromium ordinaire si le site veut un navigateur — et le dépose sur
#   la release `documents-apportes` du dépôt ; l'adresse de l'asset devient
#   alors le `miroir`, avec son `sha256`. Un jeu `refus` qui vise un fichier
#   porte donc soit un `miroir`, soit une adresse de document que `--publier`
#   sait traiter ; un test l'exige.
#   `python scripts/fetch/source_locale.py` imprime la liste et, pour chaque
#   entrée, le chemin où son fichier est attendu. Un test refuse toute autre
#   valeur, et refuse un blocage sans note qui dise ce qui a été essayé.
#
# Champ `statut_integration` :
#   certifie   -> data/reference/ est recontrôlé contre la source par
#                 scripts/verifier_donnees.py, qui appose le niveau `certifiee`
#   automatise -> data/reference/ est régénéré par un script
#   saisi      -> valeurs saisies à la main depuis la source, à certifier
#   controle   -> la source n'alimente aucune valeur : elle en CONTRÔLE une
#                 autre, et ce qu'elle démontre est dans sa note
#   a_faire    -> source identifiée, données pas encore intégrées
#   sans_objet -> la source est citée pour mémoire, sans donnée à en tirer
#
# Champ `idbank` : identifiant de série dans la Banque de données
# macroéconomiques de l'INSEE, interrogeable sans clé d'accès à l'adresse
# https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/<idbank>
#
# QUELLE SOURCE L'EMPORTE, QUAND DEUX SE DISPUTENT UNE VALEUR
# ============================================================
# Le manifeste dit d'où vient chaque chiffre ; ces quatre critères disent
# laquelle des sources disponibles il faut aller chercher. Ils s'appliquent
# dans l'ordre, et le premier qui départage tranche. Ce n'est pas un classement
# d'institutions : c'est un classement de NATURES de données. La même
# institution est primaire sur un terrain et secondaire sur l'autre.
#
# 1. LE PRODUCTEUR PRIME SUR LE REPRENEUR.
#    On remonte d'un cran chaque fois qu'on le peut : l'INSEE plutôt qu'un
#    rapport qui cite l'INSEE, la caisse plutôt que la synthèse qui la
#    transcrit. C'est le critère qui gouverne le niveau de fiabilité, et il est
#    déjà appliqué par scripts/verifier_donnees.py : `certifiee` suppose que la
#    source soit le producteur de la donnée. Une transcription tierce, même
#    sourcée et reprise automatiquement, plafonne à `haute`.
#    La raison n'est pas cosmétique : le critère dit ce qu'un lecteur saurait
#    vérifier lui-même en remontant d'un cran.
#
# 2. L'OBSERVÉ PRIME SUR LE PROJETÉ.
#    Une série mesurée bat une hypothèse, toujours, y compris quand
#    l'hypothèse est plus récente et mieux présentée. Une projection n'entre
#    dans data/reference/ que là où l'observation manque, et elle y entre au
#    niveau `estimee`, qui se propage jusqu'au résultat affiché.
#
# 3. LE MONTANT SERVI PRIME SUR LE MONTANT CALCULÉ.
#    Quand une caisse publie ce qu'elle a réellement payé, ce chiffre l'emporte
#    sur toute reconstitution, fût-elle fidèle au texte. Le minimum contributif
#    et le minimum garanti en vivent : la revalorisation légale à laquelle
#    leurs articles renvoient a été gelée puis sous-indexée, si bien que le
#    calcul dépasse de plusieurs points ce qui a été versé.
#
# 4. LE RECONTRÔLABLE PRIME SUR LE SAISI.
#    À qualité de source égale, on préfère ce qu'un script peut reconfronter
#    chaque année (`acces: api`) à ce qu'il faut ressaisir à la main
#    (`acces: document`). Une saisie est juste le jour où elle est faite ; une
#    récupération automatisée le reste.
#
# CE QUE LES QUATRE CRITÈRES DONNENT, EN CLAIR
# ---------------------------------------------
# L'INSEE pour ce qu'il MESURE — prix, salaires, productivité, comptes
# nationaux, espérances de vie, projections de population. Le COR pour ce qu'il
# DÉCIDE — les hypothèses de long terme, dont il est l'auteur et non le
# repreneur, et la description consolidée des régimes que personne d'autre ne
# publie. Jamais le COR comme intermédiaire vers une donnée INSEE : ses
# rapports tabulent commodément les projections démographiques de l'INSEE, les
# recopier de là ferait perdre un cran de fiabilité sans rien gagner.
#
# Le même raisonnement vaut ailleurs : OpenFisca est un repreneur remarquable
# et plafonne pourtant à `haute` ; Légifrance est le producteur du droit et
# porte donc des valeurs certifiées ; une caisse est primaire sur son propre
# barème et secondaire sur la macroéconomie.
#
# QUAND LES CRITÈRES NE TRANCHENT PAS
# ------------------------------------
# Il reste des valeurs dont personne n'est producteur : les hypothèses de
# projection, et les régimes anciens dont l'historique n'a jamais été publié
# ailleurs que dans une synthèse. Elles entrent quand même — un modèle qui
# refuserait de projeter ne calculerait rien — mais au niveau que leur nature
# impose, `estimee` ou `moyenne`, et en nommant le millésime de la publication
# d'où elles sortent. Le champ `note` de l'entrée sert à ça.

version_manifeste: "2026-09-15"

institutions:

  insee:
    nom: Institut national de la statistique et des études économiques
    role: >-
      Indice des prix à la consommation, salaire moyen par tête, productivité,
      comptes nationaux, tables de mortalité et projections démographiques.
    jeux:
      - id: insee_bdm_ipc
        titre: Indice annuel des prix à la consommation, ensemble, 1949-2025
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/000008965
        idbank: ["000008965", "001764363"]
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/ipc_annuel.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          Deux bases chaînées : base 100 en 1980 (publiée de 1949 à 1992) puis
          base 2015 (à partir de 1990), raccordées sur 1990. L'API Melodi
          (DS_IPC_PRINC) ne remonte pas avant les années 1990 ; la BDM, si.

      - id: insee_pcs
        titre: >-
          Nomenclature des professions et catégories socioprofessionnelles (PCS)
        url: https://www.insee.fr/fr/information/2406153
        acces: document
        statut_integration: saisi
        cible: data/reference/macro/cas_types_csp.yaml
        note: >-
          Le classement des six groupes socioprofessionnels — niveau 1 de la
          nomenclature —, sur lequel s'adosse la correspondance entre les cas
          types du dépôt et les catégories de `drees_age_depart_csp`. Aucune
          valeur n'en est tirée : la nomenclature dit dans quel groupe tombe
          une profession, et le fichier cible écrit cas type par cas type ce
          que le dépôt en conclut, avec la raison de chaque rattachement et de
          chaque mise hors champ. Un classement y compte plus que les autres,
          parce qu'on le suivrait mal de mémoire : les professions libérales
          sont dans le groupe 3, avec les cadres, et non dans le groupe 2 avec
          les artisans et les commerçants.

      - id: insee_ipc_long
        titre: Indice des prix à la consommation depuis 1901
        url: https://www.insee.fr/fr/information/2417794
        acces: fichier
        statut_integration: saisi
        cible: data/reference/macro/ipc_annuel.csv
        note: >-
          Seule source pour 1930-1949, que la BDM ne couvre pas. Tableau à
          télécharger et convertisseur franc/euro, à saisir à la main.

      - id: insee_ipc_melodi
        titre: Indice des prix à la consommation (jeu principal)
        url: https://api.insee.fr/melodi/data/DS_IPC_PRINC
        acces: api
        statut_integration: automatise
        cible: data/brut/insee_ipc_melodi.json
        note: Utilisé pour vérifier la partie récente de la série longue.

      - id: insee_bdm_smpt
        titre: Salaire moyen par tête, comptes nationaux annuels base 2020
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/011785411
        idbank: ["011785411", "011793486"]
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/salaire_moyen.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          Salaires et traitements bruts (D11, total des branches) rapportés à
          l'emploi salarié intérieur en personnes physiques — la définition du
          SMPT dans les comptes nationaux. Disponible depuis 1949.

      - id: insee_profil_salaire_age
        titre: Séries longues de salaires dans le secteur privé — par tranche d'âge
        url: https://api.insee.fr/melodi/data/DS_DERA_PRIVE_SERIES_LONGUES
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/profil_salaire_age.csv
        recuperation: scripts/fetch/insee_profil_salaire_age.py
        note: >-
          Salaire net mensuel en équivalent temps plein, à temps complet, en
          euros constants, par tranche d'âge : quatre tranches de 26 à 60 ans
          depuis 1962, les deux bords depuis 1996 seulement. C'est la seule
          source qui dise comment la prime à l'âge a évolué — 1,19 entre les
          51-60 ans et les 26-30 ans en 1962, 1,47 en 2000, 1,35 en 2024 —, et
          donc la seule où se lise l'effet de génération que le modèle
          appliquait uniformément. Elle est AGRÉGÉE et ne décrit donc pas une
          carrière : le modèle ne lui prend que l'évolution de cet écart, la
          forme venant d'insee_profil_salaire_categorie.

      - id: insee_profil_salaire_categorie
        titre: Salaires du secteur privé par âge et catégorie socioprofessionnelle
        url: https://api.insee.fr/melodi/data/DS_DERA_PRIVE_ANNUEL
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/profil_salaire_categorie.csv
        recuperation: scripts/fetch/insee_profil_salaire_age.py
        note: >-
          Le seul des trois jeux de salaires de Melodi à croiser l'âge et la
          catégorie socioprofessionnelle — ni la série longue du privé ni celle
          du public ne le font, vérifié. Il donne donc le profil
          INTRA-CATÉGORIE, qui est celui d'une carrière : ×1,28 de 26 à 55 ans
          pour un ouvrier, ×1,30 pour un employé, ×1,41 pour une profession
          intermédiaire, ×1,86 pour un cadre. Le modèle appliquait ×1,69 et
          ×2,42, sans source. Ne porte que l'année 2024 : sa forme est supposée
          stable dans le temps, ce que docs/limites.md dit.

      - id: insee_profil_salaire_public
        titre: Salaires de la fonction publique par âge, statut et versant
        url: https://api.insee.fr/melodi/data/DS_DERA_PUBLIC_ANNUEL
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/profil_salaire_statut_public.csv
        recuperation: scripts/fetch/insee_profil_salaire_age.py
        note: >-
          Le seul jeu de l'INSEE à croiser l'âge et le statut de la fonction
          publique — la série longue du public ne le fait pas, vérifié. Il ne
          porte que 2023. Les pentes observées de moins de 30 ans à 50-59 ans
          sont loin de celle du privé qu'on appliquait aux fonctionnaires :
          ×1,11 pour un catégorie C, ×1,22 pour un catégorie B, ×1,56 pour un
          catégorie A, contre ×1,30 servi. Les trois versants y figurent aussi,
          et ce sont eux que les affiliations lisent, aucune ne portant la
          catégorie : leur profil pondère déjà les catégories par leurs
          effectifs. Piège du codage : PM n'est pas « personnels militaires »
          mais « personnels médicaux », il n'existe que dans l'hospitalière, et
          il vaut 6 765 € nets par mois. Les militaires ne sont dans aucun de
          ces jeux.

      - id: eurostat_profil_salaire_secteur
        titre: Enquête européenne sur la structure des salaires — salaire par âge et activité
        url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/earn_ses22_20
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/profil_salaire_secteur.csv
        recuperation: scripts/fetch/eurostat_profil_salaire_secteur.py
        note: >-
          La seule source qui approche les régimes spéciaux : sa section D est
          le champ du statut des industries électriques et gazières, sa section
          H celle où sont la SNCF et la RATP. Aucune source française ne
          ventile le salaire par âge pour ces populations — le relevé des
          impasses est sous l'action correspondante de la feuille de route.
          Deux vagues, 2018 et 2022, et c'est ce qui permet de trier : le
          facteur de l'électricité-gaz vaut 1,41 puis 1,35, celui des
          transports 0,928 puis 0,931, mais celui des mines passe de 0,93 à
          1,19 et celui des spectacles de 0,83 à 1,08 — ces deux-là ne sont que
          du bruit et leurs régimes gardent le profil du privé. La source est
          AGRÉGÉE par secteur, donc impropre à décrire une carrière : le modèle
          n'en prend qu'un rapport de pentes, ce qui suppose ce rapport
          identique en intra-catégorie et en agrégé. C'est l'hypothèse la plus
          forte du profil salarial, et docs/limites.md la nomme.

      - id: insee_assiette_activite
        titre: Assiette des revenus d'activité — salaires bruts (D11) et revenu mixte (B3G)
        url: https://api.insee.fr/melodi/data/DD_CNA_TEE
        idbank: ["011785411"]
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/assiette_activite.csv
        recuperation: scripts/fetch/insee_revenu_mixte.py
        note: >-
          Les deux moitiés de ce sur quoi l'on prélève : les salaires et
          traitements bruts du total des branches, assiette des salariés, et le
          revenu mixte brut des ménages, assiette des non-salariés. La première
          vient de la banque de données macroéconomiques, la seconde du tableau
          économique d'ensemble exposé par Melodi — la BDM ne publie qu'un
          agrégat « excédent d'exploitation / revenu mixte » qui mêle le profit
          des sociétés au revenu des entrepreneurs individuels, et son jeu de
          comptes des secteurs institutionnels ne sert que cinq ratios. Rester
          chez le producteur a un prix mesurable : Eurostat rediffuse la même
          grandeur sous nasa_10_nf_tr, à 0,8 % près sur 2023. Sert à dire ce
          qu'un taux de cotisation rapporte réellement, et donc ce que le
          rapport de recettes du scénario 6 suppose.

      - id: insee_bdm_masse_salariale
        titre: Masse salariale (D11), comptes nationaux annuels base 2020
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/011785411
        idbank: ["011785411"]
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/masse_salariale.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          Le même agrégat que le numérateur du salaire moyen par tête, mais pris
          EN NIVEAU : salaires et traitements bruts du total des branches, en
          euros courants, disponibles depuis 1949. C'est l'assiette des
          cotisations, donc le taux de rendement qu'un système en répartition
          peut servir sans changer son taux de cotisation. L'écart avec le SMPT
          est exactement la croissance de l'emploi salarié.

      - id: insee_bdm_pib
        titre: Produit intérieur brut, prix courant, comptes nationaux base 2020
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/011779992
        idbank: ["011779992"]
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/pib_nominal.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          PIB approche produit, en euros courants, disponible depuis 1949.
          Assiette la plus large qu'un système de retraite puisse viser : elle
          capte le déplacement de la valeur ajoutée vers les revenus non
          salariaux, que la masse salariale subit. Sert la variante « à
          l'italienne » de l'indexation, dont le lissage sur cinq ans est
          appliqué par le moteur et non par la série.

      - id: insee_bdm_dette_publique
        titre: Dette des administrations publiques au sens de Maastricht, en point de PIB, base 2020
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/010777608
        idbank: ["010777608"]
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/dette_publique.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          Série TRIMESTRIELLE, dont seul le quatrième trimestre est lu : le
          stock au 31 décembre rapporté au PIB des quatre derniers trimestres
          est la dette annuelle, celle que la France notifie à la Commission
          européenne. Les séries annuelles de la BDM (CNA-2010-DETTE-APU,
          CNA-2014-DETTE-APU) sont restées dans leurs bases anciennes, et un
          rapport au PIB ne se lit que dans la base du PIB qu'on lui oppose,
          celle de pib_courant.csv. Toutes administrations publiques, brute,
          consolidée, depuis 1995. Ne sert à aucun calcul de pension : la page
          Coût la pose sous le stock que chaque système de retraite accumule.

      - id: insee_bdm_productivite
        titre: Productivité du travail par tête, comptes nationaux base 2020
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/011785223
        idbank: ["011785223", "011793334", "011793337"]
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/productivite.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          Valeur ajoutée en volume (prix chaînés de 2020) rapportée à l'emploi
          intérieur total en personnes physiques. L'idbank 011793337 donne la
          variante horaire, pour le paramètre indicateur_productivite.

      - id: insee_bdm_esperance_vie
        titre: Espérances de vie à la naissance et à 60 ans, 1946-2025
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/001686950
        idbank: ["001686946", "001686951", "001686950", "001686955"]
        acces: api
        statut_integration: certifie
        cible: data/reference/mortalite/esperances_vie.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          France métropolitaine, par sexe, annuel. L'INSEE ne publie pas
          l'espérance de vie à 65 ans, à aucune période : voir ocde_health_le.

      - id: insee_bdm_point_complementaire
        titre: Valeur de service du point Agirc, Arrco et Agirc-Arrco, 2001-
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/010593202
        idbank: ["000849395", "000822495", "010593202"]
        acces: api
        statut_integration: certifie
        cible: data/reference/regimes/valeurs_point.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          Séries mensuelles ; le dépôt retient l'observation de décembre, sa
          convention étant la valeur en vigueur au 31 décembre. L'INSEE n'est
          pas le producteur de ces barèmes — l'Agirc-Arrco l'est — donc ces
          valeurs ne priment pas sur la transcription d'OpenFisca, seule à
          couvrir l'avant-2001 : elles la recoupent, et les 42 années communes
          concordent sans exception. Elles la prolongent en revanche là où elle
          s'arrête, l'INSEE publiant encore après la dernière année d'OpenFisca.

      - id: insee_deces_mortalite
        titre: Décès et mortalité — séries longues
        url: https://api.insee.fr/melodi/data/DS_DECES_MORTALITE_SERIES
        acces: api
        statut_integration: automatise
        cible: data/brut/insee_mortalite_series.json

      - id: insee_tables_mortalite
        titre: Tables de mortalité du moment (TD/TV) et tables par génération
        url: https://www.insee.fr/fr/statistiques/5390366
        complement_url: https://www.insee.fr/fr/statistiques/fichier/2416631/
        acces: fichier
        statut_integration: a_faire
        cible: data/reference/mortalite/quotients_periode.csv
        note: >-
          Seule source de quotients par âge antérieurs à 1986, et seule à
          couvrir les grands âges. Diffusée en tableurs seulement : ni la BDM
          ni Melodi ne l'exposent. Pour 1986-2024, la table vient d'Eurostat
          (eurostat_mlifetable).

      - id: insee_projections_mortalite
        titre: >-
          Projections de population 2026 — hypothèses de mortalité jusqu'en 2125
        url: https://www.insee.fr/fr/statistiques/8990899
        acces: fichier
        statut_integration: automatise
        cible: data/reference/mortalite/esperances_vie.csv
        recuperation: scripts/fetch/insee_projections_mortalite.py
        millesime: 2026
        note: >-
          Quotients de mortalité par âge (0 à 120 ans) et par année (2023 à
          2125), pour les hypothèses d'espérance de vie centrale, basse et
          haute. Le dépôt reprend la centrale et en DÉRIVE e0, e60 et e65 de
          2026 à 2125 — dont e65, que l'INSEE ne publie jamais. Les années 2023
          à 2025 sont ignorées : elles sont observées, et l'observé prime sur le
          projeté même quand les deux viennent du même producteur. La somme des
          survies se fait sans le demi-an usuel, ce classeur indexant ses
          quotients par âge atteint dans l'année ; le récupérateur contrôle la
          convention contre l'espérance de vie à la naissance que l'INSEE
          publie pour 2070 (89,5 et 86,7 ans) et échoue si elle casse. Remplace
          l'exercice 2021-2070, dont six valeurs étaient saisies aux années
          rondes et une, 2080, dépassait l'horizon.
      - id: insee_projections_population
        titre: >-
          Projections de population 2026 — scénario central, résultats détaillés
        url: https://www.insee.fr/fr/statistiques/8990852
        acces: fichier
        statut_integration: certifie
        recuperation: scripts/fetch/insee_projections_population.py
        millesime: 2026
        cible: >-
          data/reference/macro/population_par_age.csv,
          data/reference/macro/population_active.csv
        note: >-
          Pyramide des âges au 1er janvier, par âge détaillé et par année, de
          1962 à 2070 — l'onglet `population` du classeur du scénario central.
          C'est la pièce que le dépôt déclarait manquante pour passer du droit
          individuel au coût collectif : sans elle, il fallait supposer toutes
          les générations de même taille. L'INSEE date lui-même la frontière en
          pied de tableau — « estimations de population jusqu'en 2023 ;
          projections de population 2026 à partir de 2024 » —, et le dépôt la
          reprend : `certifiee` jusqu'en 2023, `estimee` ensuite. Deux séries en
          sont tirées : les effectifs par âge à partir de 50 ans, qui comptent
          les retraités, et l'effectif des 20-64 ans, qui projette le
          dénominateur d'une part de PIB. Seize autres scénarios sont publiés ;
          seul le central est repris, comme pour les quotients de mortalité.

      - id: insee_mortalite_niveau_de_vie
        titre: >-
          Tables de mortalité par sexe, âge et niveau de vie, 2012-2016 et
          2020-2024 (Insee Résultats, mai 2025)
        url: https://www.insee.fr/fr/statistiques/8670202
        acces: fichier
        statut_integration: automatise
        cible: data/reference/mortalite/esperances_vie_niveau_de_vie.csv
        recuperation: scripts/fetch/insee_mortalite_niveau_de_vie.py
        millesime: 2025
        note: >-
          Le classeur `morta_niv.xlsx` de l'*Insee Première* n° 2085 : pour
          chaque sexe et chaque période, l'espérance de vie à chaque âge de
          l'ensemble et de chacun des VINGT VINGTILES de niveau de vie, et
          « pour information » le niveau de vie mensuel moyen de chaque
          vingtile. La seule mesure publique de la mortalité par revenu en
          France : à 65 ans en 2020-2024, 15,1 ans pour les 5 % d'hommes les
          plus modestes contre 22,1 pour les 5 % les plus aisés, 20,2 contre
          25,2 chez les femmes. Le dépôt en reprend e0, e60 et e65 telles
          quelles, l'année portée étant le milieu de la période. L'ensemble
          de l'étude vit un à trois dixièmes de moins que la population
          générale certifiée — champ et méthode de l'échantillon
          démographique permanent, document de travail 2025-24 —, ce que le
          récupérateur contrôle et que le modèle absorbe en calant chaque
          vingtile sur son rapport à l'ensemble. Sert à l'axe du revenu de
          l'action 14 : populations `niveau_de_vie_v01` à `_v20` du diviseur,
          rattachement d'un cas type par son niveau de salaire.

  cor:
    nom: Conseil d'orientation des retraites
    role: >-
      Projections du système de retraite, cas types, paramètres historiques
      par régime, taux de remplacement, rendements.
    jeux:
      - id: cor_rapport_annuel
        titre: Rapport annuel du COR — évolutions et perspectives des retraites
        url: https://www.cor-retraites.fr/documents-rapports
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/*.yaml
      - id: cor_pouvoir_achat_retraite
        titre: >-
          Évolutions nettes du pouvoir d'achat au cours de la retraite, cas
          types non-cadre et cadre, générations 1937 à 1952 (rapport annuel de
          juin 2026, figure 3.14)
        url: https://www.cor-retraites.fr/sites/default/files/2026-06/Donn%C3%A9es_RA2026_P3_2.xlsx
        acces: fichier
        statut_integration: controle
        cible: tests/temoins/cor_pouvoir_achat_retraite.json
        recuperation: scripts/fetch/cor_pouvoir_achat_retraite.py
        millesime: juin 2026
        note: >-
          Le calcul que le dépôt fait pour un retraité — sa pension de départ
          menée jusqu'à aujourd'hui par les textes de chaque régime —, fait par
          d'autres et publié avec ses conventions (annexe méthodologique en
          ligne, § 3.3) : pension nette d'un non-cadre (70 % Cnav, 30 % Arrco)
          et d'un cadre (36 % Cnav, 15 % Arrco, 49 % Agirc), partis en janvier
          à 60 ans en 1997, 2002, 2007 et 2012, déflatée des prix. Il
          n'alimente aucune valeur. Le dépôt retrouve le non-cadre à moins de
          trois centièmes de point en 2026 pour les quatre générations, et la
          génération 1952 année après année à un quart de point ; le cadre à
          0,16 point en 2025 et 0,35 en 2026, écart déclaré dans `limites.md`.

      - id: cor_projection_emploi
        titre: >-
          Rapport annuel du COR de juin 2026 — données de la partie 1 :
          population active, chômage et taux d'emploi projetés (figures 1.6,
          1.11 et 1.12)
        url: https://www.cor-retraites.fr/sites/default/files/2026-07/Données_RA2026_P1.xlsx
        acces: fichier
        statut_integration: saisi
        cible: data/reference/macro/emploi_projete.csv
        millesime: juin 2026
        note: >-
          Le classeur publié avec le rapport. Trois séries annuelles du
          scénario de référence, 2026-2070 : la croissance de la population
          active (DG Trésor, sur les projections de population 2026 de
          l'INSEE), le taux de chômage (7,7 % en 2025, 7,0 % en 2040 puis
          constant) et le taux d'emploi des 15-64 ans. Le dépôt en DÉRIVE la
          croissance de l'emploi, seule colonne que le modèle lise, et la
          recoupe sur les cotisants du rapport (30,6 millions en 2025, 28,9 en
          2070). Le rapport lui-même : RA_2026_def_1.pdf, partie 1 chapitre 1
          (pages 40-51) et partie 2 chapitre 2 (page 73).
      - id: cor_hypotheses_projection
        titre: >-
          Hypothèses économiques de long terme du COR — scénario de référence et
          variantes de productivité
        url: https://www.cor-retraites.fr/sites/default/files/2026-06/Intro%20RA.pdf
        acces: document
        statut_integration: saisi
        cible: data/reference/macro/hypotheses_projection.yaml
        millesime: juin 2026
        note: >-
          Le jeu de scénarios du dépôt transcrit celui du COR : référence à
          0,7 % de croissance annuelle de la productivité horaire du travail,
          variantes à 0,4 % et 1,0 %. Ce jeu apparaît dans le rapport de juin
          2025 — qui abandonne explicitement la variante à 1,3 % — et est
          reconduit à l'identique en juin 2026. Trois écarts assumés avec la
          source, détaillés dans le fichier cible : productivité par tête et
          non horaire, cible atteinte dès 2026 et non en 2040, emploi salarié
          supposé constant. L'inflation de long terme à 1,75 % est une
          convention reconduite des rapports antérieurs : les documents publics
          de juin 2025 et juin 2026 ne la restatent pas.
      - id: cor_regimes
        titre: >-
          Compléments du rapport annuel — projections détaillées par régime :
          effectifs, masses, ressources et structure de financement
        url: https://www.cor-retraites.fr/fiches/complements-rapport-annuel-2024-projections-detaillees-par-regime
        acces: api
        statut_integration: certifie
        recuperation: scripts/fetch/cor_regimes.py
        cible: >-
          data/reference/regimes/structure_financement.csv,
          data/reference/regimes/cotisants.csv,
          data/reference/macro/part_droits_derives.csv
        millesime: juin 2024
        note: >-
          Vingt-deux fiches, une par régime, et UN classeur qui porte leurs
          données : vingt-quatre feuilles, 53 232 valeurs, de 2010 à 2070.
          C'est la seule source publique qui donne, à la même maille et sous la
          même convention, les effectifs de retraités ET de cotisants, les
          masses, les ressources, les soldes et la STRUCTURE DE FINANCEMENT de
          chaque régime — ce dernier bloc étant le seul endroit où se lise ce
          qu'un régime doit à l'État et ce qu'il doit à ses cotisants. Le COR
          n'en est pas le producteur — ce sont les comptes des régimes, via la
          DSS — mais il est le seul à les mettre sous une convention commune :
          les valeurs entrent au niveau `haute`, jamais `certifiee`.
          MILLÉSIME : juin 2024, et c'est le SEUL publié. Vérifié le 19
          septembre 2026 : ni le rapport de 2025 ni celui de 2026 n'ont
          reconduit ces compléments — index des fiches, pages des deux
          rapports et sondage des chemins concordent. L'en-tête
          `Last-Modified` du serveur affiche avril 2026 et ne veut rien dire,
          c'est une remise en ligne ; le sommaire du classeur, lui, écrit
          « Complément du rapport annuel du COR - juin 2024 ». Le reste du
          dépôt tournant sur le COR 2026, mélanger les deux coudrait deux
          exercices de projection.
      - id: cor_comptes_systeme_retraite
        titre: >-
          Comptes du système de retraite — dépenses, ressources et solde, en
          part de PIB (classeurs de données du rapport annuel)
        url: https://www.cor-retraites.fr/rapports-du-cor/rapport-annuel-cor-juin-2026-evolutions-perspectives-retraites-france
        acces: api
        statut_integration: certifie
        recuperation: scripts/fetch/cor_comptes_retraite.py
        cible: >-
          data/reference/macro/comptes_retraite.csv,
          data/reference/macro/structure_ressources_retraite.csv,
          data/reference/macro/taux_prelevement_retraite.csv
        millesime: juin 2026
        note: >-
          Le seul compte français où DÉPENSES ET RESSOURCES de la retraite
          soient publiées ensemble, sur un même périmètre et sous une même
          convention. Il fallait le chercher ici parce que les Comptes de la
          protection sociale de la DREES, qui donnent la dépense depuis 1959,
          NE VENTILENT PAS LEURS RESSOURCES PAR RISQUE : une « recette du risque
          vieillesse » n'a pas de définition comptable, les cotisations d'un
          régime polyvalent n'étant affectées à aucun risque. Le critère 1 du
          manifeste s'applique en deux temps : le COR n'est pas producteur des
          comptes de chaque régime — ce sont ceux des rapports à la Commission
          des comptes de la Sécurité sociale — mais il est le seul à les
          CONSOLIDER, comme il est le seul à publier la description consolidée
          des régimes. Les valeurs entrent donc au niveau `haute`, jamais
          `certifiee`, et les années projetées au niveau `projetee`, la
          frontière étant celle que le COR marque lui-même colonne par colonne.
          Champ : régimes légalement obligatoires, FSV compris, RAFP exclu ;
          convention EPR, hors produits et charges financières. Le récupérateur
          ne connaît aucune adresse de fichier : il suit le lien du rapport
          annuel depuis la page d'accueil et cherche les figures par leur
          titre, un rapport changeant chaque année de numérotation de parties.
          TROISIÈME CIBLE depuis le 20 septembre 2026 : le TAUX DE PRÉLÈVEMENT
          en part des revenus d'activité, figure « Les déterminants de
          l'évolution des ressources du système de retraite ». C'est le seul
          endroit où le COR dise si ses ressources reculent en part de PIB
          parce que le taux baisse ou parce que l'assiette rétrécit — et c'est
          le taux qui baisse, de 32,14 % en 2025 à 30,05 % en 2070. Le dépôt
          supposait l'inverse, et la déduction lui coûtait un demi-point de PIB
          de recette en 2070. La même figure porte la contribution de l'État
          aux régimes équilibrés, qui n'est pas reprise faute d'un lecteur.
          La note de cette figure date aussi la base du dénominateur :
          « comptes nationaux de l'Insee base 2020 », celle de pib_courant.csv,
          ce que controle_base_comptable_retraite vérifie en euros.
      - id: cor_cas_types
        titre: Cas types du COR (carrières de référence)
        url: https://www.cor-retraites.fr/simulateurs
        acces: document
        statut_integration: saisi
        cible: data/reference/legislation/cas_types.yaml
      - id: cor_panorama_regimes
        titre: Panorama des régimes de retraite français (fiches thématiques)
        url: https://www.cor-retraites.fr/fiches-reperes
        acces: document
        statut_integration: saisi

      - id: cor_septieme_rapport
        titre: >-
          Septième rapport du COR — « Retraites : annuités, points ou comptes
          notionnels ? Options et modalités techniques », 27 janvier 2010
        url: https://www.cor-retraites.fr/sites/default/files/2019-06/doc-1775.pdf
        acces: document
        statut_integration: controle
        millesime: 27 janvier 2010
        note: >-
          Le rapport que l'article 75 de la LFSS 2009 a commandé au COR : la
          seule expertise publique française du passage des régimes de base aux
          comptes notionnels. Il n'alimente AUCUNE valeur du dépôt et n'en
          alimentera aucune — il date d'avant les réformes de 2010, 2014 et
          2023, et son contrefactuel « système actuel » est périmé.
          CE QU'IL CONTRÔLE, et c'est un chiffre que le dépôt fabrique par
          soustraction : les droits versés au titre de la solidarité — droits
          familiaux, chômage, maladie, invalidité, minimum contributif ou
          garanti — représentent « de l'ordre d'un cinquième des retraites tous
          régimes ». C'est l'ordre de grandeur de ce que le §6 de
          `methodologie.md` retire dans les scénarios notionnels, mesuré par
          quelqu'un d'autre. Voir aussi `docs/limites.md` §5 quater.
          IL DONNE AUSSI SON NOM À NOTRE TRANSITION : le rapport classe les
          modes de passage en immédiat, progressif par affiliation SUCCESSIVE,
          progressif par affiliation SIMULTANÉE. Les scénarios 3 et 5, qui
          figent les droits acquis à la bascule, sont une affiliation
          successive ; la CNAV, elle, simule une affiliation simultanée
          (cf. `cnav_comptes_notionnels_2009`).
          L'URL est celle du dossier de presse, seule pièce du rapport
          directement téléchargeable ; le rapport complet est en librairie à la
          Documentation française.

      - id: cor_retour_septieme_rapport
        titre: >-
          Séance plénière du 5 juillet 2017 — retour sur le 7e rapport : maquette
          simplifiée du SG-COR, fiches Suède et Italie
        url: https://www.cor-retraites.fr/reunions-du-cor/retour-sur-7e-rapport-cor-retraites-annuites-points-comptes-notionnels
        acces: document
        statut_integration: controle
        millesime: 5 juillet 2017
        note: >-
          Dix documents, dont trois comptent pour ce dépôt. Le document n° 4
          (`doc-4018.pdf`) est la MAQUETTE SIMPLIFIÉE du secrétariat général :
          un système en répartition stylisé, soumis à des chocs, calculé en
          annuités, en points et en comptes notionnels. Les documents n° 5, 6
          (`doc-4019`, `doc-4020`) décrivent la Suède, le n° 7 (`doc-4021`)
          l'Italie.
          CE QUE LA MAQUETTE CONTRÔLE : la règle d'indexation par défaut du
          dépôt. « Dans un régime en comptes notionnels, l'équilibre à chaque
          date est assuré par construction […] dans la mesure où le taux de
          revalorisation est ici supposé égal au taux de croissance de la masse
          salariale. » C'est mot pour mot la justification du §3 de
          `methodologie.md`, écrite par le COR et non par ce dépôt. Sa note de
          bas de page 5 en donne la limite, et elle vaut d'être connue : « Ce
          n'est pas le cas en Suède, où le taux de revalorisation est fixé en
          fonction du taux de croissance des salaires. »
          ELLE CONTRÔLE AUSSI LA COHÉRENCE DU COEFFICIENT DE CONVERSION : quand
          les pensions liquidées sont revalorisées sur les prix et le capital
          sur la masse salariale, le coefficient DOIT intégrer la croissance
          anticipée de la masse salariale. Le ν = 0 du §5 est l'autre branche de
          la même règle — pension revalorisée au taux qui l'actualise — et non
          une simplification.
          CHIFFRE À RETENIR pour l'action 11 de la feuille de route : sur un
          choc démographique permanent, les déficits transitoires du régime
          notionnel sont « de l'ordre de 10 % de la masse des cotisations,
          contre près de 90 % pour les régimes en points et en annuités », avec
          retour spontané à l'équilibre en une quarantaine d'années. Les fiches
          Suède et Italie sont la description que cette action cherche : le
          `balansindex` suédois et l'indexation italienne sur le PIB ne font pas
          la même chose.

