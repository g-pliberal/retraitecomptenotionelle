        miroir: https://www.assemblee-nationale.fr/dyn/dyn/contenu/visualisation/1088071/file/PAP2026_CS_CAS_Pensions_YD.pdf
        sha256: cafb245298406f6ef23c12dbb9ba4924bf7d4a9d2a4b38600ab98c5e1c10f87e
