        titre: Paramètres des régimes agricoles (RCO, points, AVA)
        url: https://www.msa.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/msa_non_salaries.yaml

  cnavpl:
    nom: Caisse nationale d'assurance vieillesse des professions libérales
    role: Régime de base des libéraux (en points) et sections professionnelles.
    jeux:
      - id: cnavpl_parametres
        titre: Valeurs du point du régime de base CNAVPL
        url: https://www.cnavpl.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/cnavpl.yaml

      - id: cnavpl_recueils
        titre: Recueils statistiques, 2021-2025
        url: https://www.cnavpl.fr/documents/
        acces: fichier
        statut_integration: certifie
        cible: data/reference/regimes/valeurs_point.csv
        recuperation: scripts/fetch/cnavpl_recueils.py
        note: >-
          Valeur de service du point du régime de base et taux de cotisation des
          deux tranches, publiés par la caisse elle-même. Aucune base ne les
          porte : le décret annuel fixe un coefficient de revalorisation et non
          un montant, si bien que ni le Journal officiel ni la législation
          consolidée n'en gardent trace. Le recueil est un annuaire d'une
          soixantaine de pages, lu avec scripts/fetch/lecture_pdf.py ; le
          récupérateur refuse d'écrire une série qui ne serait pas croissante.
          Les millésimes antérieurs à 2021 mettent la valeur dans un graphique.
          Le nombre maximal de points — 525 sur la tranche 1 et 25 sur la
          tranche 2 depuis 2015 — figure dans un tableau que le récupérateur ne
          relit pas de façon sûre : il est en commentaire de la fiche de régime.
          CE QUE LE RECUEIL PORTE D'AUTRE, ET QUI A DÉBLOQUÉ DEUX FICHES. Sa
          table de gestion technique donne, SECTION PAR SECTION, les cotisations
          du régime de base encaissées sur CHACUNE DES DEUX TRANCHES — 43 405 k€
          et 27 195 k€ pour les notaires en 2024 —, et sa table des effectifs le
          nombre de cotisants. Divisées par leurs taux, ces sommes donnent deux
          moments écrêtés de la distribution des revenus de la section, dont se
          déduit son REVENU MOYEN : la seule mesure disponible là où aucune
          caisse ne le publie. Voir docs/limites.md.
          CES TABLES NE SE LISENT PAS AVEC `lecture_pdf.py` : leurs chiffres
          sont composés dans une police sans table de correspondance, et
          sortaient en glyphes. Elles se lisent avec pypdf.

      - id: cnavpl_valeur_service
        titre: Valeur de service du point du régime de base depuis 2004, datée
        url: https://www.cnavpl.fr/preparer-sa-retraite/
        acces: page
        statut_integration: certifie
        cible: data/reference/regimes/valeurs_point.csv
        recuperation: scripts/fetch/cnavpl_valeur_service.py
        note: >-
          LA SÉRIE QUE LES RECUEILS METTAIENT EN GRAPHIQUE, LA CAISSE L'IMPRIME
          EN CLAIR. Sa page « Cotiser pour sa retraite » donne, sous
          « Historique », la valeur de service du point depuis le 1er janvier
          2004, chaque valeur avec sa date d'entrée en vigueur — deux en 2008,
          deux en 2022, aucune en 2018, dont la revalorisation est reportée au
          1er janvier 2019. Le récupérateur retient la valeur en vigueur au
          31 décembre, convention de `valeurs_point.csv`, et ne l'écrit qu'après
          l'avoir confrontée à D. 643-1 pour 2004 et 2005 (0,484 € et 0,493 €,
          les deux seules valeurs que le droit écrit) et aux recueils 2021 à
          2025, qui datent la leur du 1er janvier. Lue le 23 septembre 2026
          (action 89) ; avant, la valeur de 2021 était ramenée vers le passé par
          les prix, et les pensions liquidées de 1989 à 2019 en sortaient trop
          basses de 1,4 à 5 %. La même page porte les taux des deux tranches et
          les plafonds de points depuis 2004 — 450 et 100 jusqu'en 2014, 525 et
          25 de 2015 à 2024, 557 et 25 depuis 2025 — : ils concordent avec les
          fiches, qui les lisent dans D. 642-3 et D. 643-1.

      - id: carpv_bareme
        titre: >-
          Grille des classes de cotisation et valeur du point du régime
          complémentaire des vétérinaires (CARPV)
        url: https://www.carpv.fr/vos-retraites/comprendre-vos-cotisations-et-vos-appels-de-cotisations/
        acces: page
        statut_integration: saisi
        cible: data/reference/regimes/classes_cotisation.csv
        note: >-
          LA CAISSE PUBLIE SA GRILLE EN CLAIR, dans un tableau HTML : quatre
          classes, leurs bornes de revenus, leur cotisation ET le nombre de
          points qu'elles ouvrent — 10 234 € pour 17 points en classe B, puis
          12 642 pour 21, 15 050 pour 25, 16 856 pour 28. La page voisine donne
          la valeur de service, 39,54 € en 2026.
          CE QUE L'ARITHMÉTIQUE AJOUTE. Les quatre cotisations divisées par
          leurs points donnent toutes 602,00 € : c'est la valeur d'achat du
          point, que le décret annuel fixe pour cette section depuis 2016 sans
          que la caisse ait besoin de l'écrire. Le rendement s'en déduit sur les
          quatre lignes à la fois — 39,54 / 602 = 6,5681 % —, et les millésimes
          2016 à 2024 se reconstruisent en multipliant les points par le prix du
          point de l'année.
          LA CLASSE EST SUBIE : « les vétérinaires dont les revenus sont
          inférieurs à 76 995 € sont appelés en classe B ». Deux facultés
          restent hors du modèle, l'option pour la classe supérieure et les
          cinq classes d'allègement, qui ne s'obtiennent que sur demande.
          LES LIVRETS ANNUELS SE LISENT, ET ILS CORRIGENT LA FICHE. Déclarés
          illisibles parce que `scripts/fetch/lecture_pdf.py` en sortait des
          glyphes, ils s'ouvrent sans peine avec pypdf — et ils montrent que la
          grille de 2026 n'a pas toujours eu cette forme : jusqu'en 2025 la
          section ne comptait que TROIS classes, à 16, 20 et 24 points. Le
          rapport annuel 2024 annonce la réforme, « un point supplémentaire
          pour les classes B, C et D […] ainsi que la création d'une classe E à
          28 points », et donne les deux valeurs du point de 2023 et 2024 :
          « 570,26 € vs 539 € » pour l'achat, « 39,42 € vs 37,79 € » pour le
          service.
          CE QUI MANQUE ENCORE : les bornes de revenus d'avant 2024, et toute
          grille d'avant 2016 — le décret ne fixait alors qu'un taux d'appel.

      - id: cavom_guide
        titre: >-
          Guide retraite et prévoyance annuel de la CAVOM et tableau
          récapitulatif des paramètres de l'exercice
        url: https://www.cavom.net/vos-cotisations/vous-etes-professionnel-liberal/
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/rendements_points.csv
        note: >-
          TROIS GRANDEURS, ET ELLES SE VÉRIFIENT L'UNE PAR L'AUTRE. Le guide
          2026 donne la valeur d'achat du point (55,1390 €), la valeur de
          service (3,3745 €) et le rendement (« le taux de rendement du régime
          complémentaire est de 6,12 % ») : 3,3745 / 55,1390 = 6,1200 %. Il
          imprime aussi le nombre de points qu'ouvre le plafond, 871,62, et
          celui de la cotisation minimale, 20,70 — soit huit plafonds et 19 %
          d'un plafond, tous deux à 12,5 %, divisés par le prix du point. Le
          taux, l'assiette et le prix se referment l'un sur l'autre.
          CE QUI MANQUE : tout ce qui précède la réforme de 2016. Le régime
          prélevait alors par classes, et de cette grille ne subsistent que deux
          points — la classe spéciale, chiffrée par le décret annuel (284 € en
          2002, 694 € en 2015), et la sixième classe, 13 886 € en 2015 dès deux
          plafonds de revenus. Le guide ne remonte pas, et le tableau
          récapitulatif des paramètres est composé dans une police sans table de
          correspondance.

      - id: cavamac_parametres
        titre: >-
          Paramètres annuels des régimes RBL-RCO-RID de la CAVAMAC, fiche
          « Taux et assiette des cotisations RCO-RID », et délibérations du
          conseil d'administration sur la valeur du point
        url: https://www.cavamac.fr/documents-utiles-et-formulaires/
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/non_salaries.yaml
        note: >-
          CETTE CAISSE ÉTAIT DONNÉE POUR SANS ESPOIR : « aucun texte ne publie
          le prix du point », concluait une passe précédente, et l'arrêté du
          23 juin 2011 le confirmait en renvoyant la valeur au conseil
          d'administration. C'est vrai du Journal officiel. Ce ne l'est pas de
          la caisse, qui publie la décision du conseil dans ses ACTUALITÉS,
          chiffre à l'appui : « le coefficient de référence, correspondant au
          prix d'achat d'un point de retraite : fixé à 8,1806 €, maintenant
          ainsi le taux de rendement du régime à 5,04 % ». Trois exercices sont
          ainsi documentés — 7,597 € en 2023, 7,9246 € en 2024, 8,1806 € en
          2026 — et le rendement s'y vérifie à chaque fois.
          LE TABLEAU DE PARAMÈTRES ANNUELS donne le reste d'un coup : « le taux
          de cotisation statutaire est de 6,30 % au taux d'appel de 121,6 %,
          soit un taux de cotisation effectif de 7,66 % des commissions et
          rémunérations brutes limitées au plafond, dont 2,50 %
          (concours des compagnies mandantes) et 5,16 % (part à la charge de
          l'assuré) », plafond 625 777 €, valeur du point 0,4123 €.
          LA PAGE DE STATISTIQUES DÉBLOQUE L'ASSIETTE, et c'est elle qui rend
          la fiche possible : « la commission moyenne plafonnée augmente de
          5,0 %, passant de 275 525 € à 286 168 € » et « le revenu moyen
          déclaré en 2024 par les agents s'élève à 115 443 euros ». Deux
          grandeurs, même source, même page : leur rapport — 2,387 — est le
          facteur qui convertit un revenu en commissions.
          CE QUI MANQUE : la série des valeurs du point avant 2022, et l'année
          exacte où le taux d'appel est retombé de 129,5 % à 121,6 %. La fiche
          la place en 2026, année du tableau qui l'écrit ; le rapport
          statistique de 2025 note « la baisse du taux d'appel » sans la dater.

      - id: cprn_guide
        titre: >-
          Guide du nouvel affilié, rapport d'activité et pages de cotisations
          de la CPRN
        url: https://cprn.fr/je-suis-affilie/je-suis-actif/mes-cotisations/
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/non_salaries.yaml
        note: >-
          LE GUIDE PORTE LE TABLEAU QUI MANQUAIT : coût d'acquisition et valeur
          de service, pour les quatre étages du régime. Base T1 7,99 € et
          0,6599 € ; base T2 179,74 € et 0,6599 € ; SECTION B 279,12 € et
          17,7710 € ; SECTION C 17,69 € et 0,9422 €. Les deux premières lignes
          se recalculent depuis le barème — 8,73 % × 48 060 / 525 points =
          7,99 € —, ce qui authentifie les deux autres.
          LE RAPPORT D'ACTIVITÉ donne les revalorisations et les moyennes : point
          de service de la section B +1,0 % et coût d'achat +1,2 % pour 2026,
          « 1 point = 320,99 € pour un notaire dont le coefficient d'âge est de
          1,15 » — soit 279,12 × 1,15 —, des rendements qui « continuent de
          converger (respectivement 5,25 % et 5,4 % en 2025) », et une
          cotisation moyenne annuelle de 32 864 € pour 12 444 cotisants, tous
          régimes confondus.
          CE QUI RESTE DEHORS : les bornes de classes de la section B. Les
          statuts disent qui les fixe et comment — « déterminées par le conseil
          d'administration chaque année par référence à la moyenne des produits
          de base du notariat au titre des trois années précédentes » — mais
          personne ne les publie. C'est près de quatre dixièmes du
          complémentaire d'un notaire.

      - id: igas_crn
        titre: >-
          Contrôle des placements de la Caisse de retraite des notaires,
          rapport IGAS n° 2012-110P
        url: https://igas.gouv.fr/sites/igas/files/files-spip/pdf/RM_2012-110_P_CRN.pdf
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/rendements_points.csv
        note: >-
          UN RAPPORT D'INSPECTION DÉCRIT UN RÉGIME MIEUX QUE SA CAISSE, parce
          qu'il en explique les mécanismes au lieu d'en donner les tarifs.
          Trois choses en viennent, et de nulle part ailleurs.
          LA RÈGLE DES 900 POINTS, qui fixe le prix du point C : « cette valeur
          d'acquisition est calculée de façon à ajuster le nombre de points
          attribué à chaque notaire de façon à ce que la moyenne sur l'ensemble
          des notaires soit toujours égale à 900 points ». Avec le prix publié
          et le taux publié, elle donne les PRODUITS MOYENS d'un office —
          900 × 17,69 / 4,10 % = 388 317 € — et c'est ce chiffre qui permet de
          relier l'assiette du régime au revenu de l'assuré.
          LE RENDEMENT D'AVANT 2013 : « le taux de rendement instantané du
          régime passe de 3,47 % en 2009 à 4,12 % en 2012 », et l'avertissement
          qui va avec — le mécanisme est « procyclique », le rendement monte
          quand les produits des études baissent.
          LA NATURE DE LA SECTION B : créée en 1962, « EN PARTIE FACULTATIVE »,
          avec « une gestion individualisée proche de la capitalisation ».
          L'inscription était obligatoire, mais « LE CHOIX DE LA CLASSE
          ELLE-MÊME ÉTANT LAISSÉ À L'APPRÉCIATION DU NOTAIRE » — et « en
          l'absence d'indication, le cotisant est affilié en classe 1 ». Un
          régime dont la classe se choisissait n'entre pas dans ce dépôt ; sa
          fiche ne porte donc que la section proportionnelle.
          ET CE QUE CE CHOIX DONNAIT : le rapport publie la répartition des
          8 356 cotisants de 2011 entre les sept classes — 1 587 en classe 0,
          2 593 en classe 1 —, soit 23,8 points par an en moyenne, la classe
          2,4. La moitié de la profession cotisait au plancher ou presque.
          LES DEUX SÉRIES DE LA SECTION C, ENFIN, de 2004 à 2012 : coût
          d'acquisition du point de 12,95 € à 16,64 €, valeur de service de
          0,5816 € à 0,6848 €. Leur rapport recoupe le texte du rapport au
          millième près, et il montre un CREUX — 4,49 % en 2004, 3,47 % en
          2009, 4,12 % en 2012 — que la règle des 900 points explique.
          LE FICHIER EST CHIFFRÉ (AES-128, mot de passe vide) : il se lit avec
          pypdf, pas avec `scripts/fetch/lecture_pdf.py`.

