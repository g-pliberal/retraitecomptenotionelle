      - id: ircec_memos
        titre: >-
          Taux, seuils et valeurs du point des régimes de l'IRCEC (RAAP, RACD,
          RACL), mémos annuels
        url: https://www.ircec.fr/actualite/memo-des-valeurs-2026/
        acces: page
        urls_secondaires:
          - https://www.ircec.fr/wp-content/uploads/2016/11/cpircecrefraapdecret27012016.pdf
        statut_integration: saisi
        cible: data/reference/regimes/rendements_points.csv
        note: >-
          Rien de tout cela n'est dans le code : L. 382-12 renvoie les
          complémentaires des artistes-auteurs à L. 644-1, et leur barème au
          règlement de la caisse. La caisse, elle, le publie — et mieux que la
          plupart : un « mémo des valeurs » par an, en HTML, qui donne le taux,
          le seuil d'affiliation, le plafond, la valeur d'achat, la valeur de
          service ET LE RENDEMENT. Trois années ont été relevées : 2023
          (83,03 € d'achat, 9,05 € de service, rendement 10,9 %), 2024 (87,60,
          9,55, 10,9 %) et 2026 (90,30, 9,75, 10,8 %). Le mémo 2026 donne aussi
          le RACD (4,78 / 0,421, 8,8 %) et le RACL (10,304 / 0,618, 6 %), qui
          ne sont pas encore au catalogue.
          CE QUI MANQUE : les années antérieures à 2023.
          SUR LES CLASSES D'AVANT LA RÉFORME, le communiqué de presse de la
          caisse du 27 janvier 2016 dit ce que ses guides ne disent plus, et
          règle la question autrement qu'en la laissant ouverte : le système
          était « OPTIONNEL — l'adhérent choisissait un montant » —, et
          « déconnecté des revenus artistiques perçus ». Ce n'est donc pas la
          table qui manque : même publiée, elle ne servirait à rien, puisque le
          mécanisme de classes du dépôt range l'assuré d'après son REVENU. Au
          RAAP la classe était un choix, et aucun modèle ne devine le choix
          d'un assuré. La caisse ajoute l'ordre de grandeur de ce que
          l'approximation coûte : « jusqu'à présent, 80 % des adhérents
          cotisent sur la base » la plus basse.
          LE MÊME COMMUNIQUÉ PORTE LA MONTÉE EN CHARGE, que la fiche ignorait :
          « le taux sera de 5 % en 2017 sur les revenus perçus en 2016, 6 % en
          2018 sur les revenus perçus en 2017, 7 % en 2019 sur les revenus
          perçus en 2018 et 8 % en 2020 sur les revenus perçus en 2019 ». Le
          décret d'application est celui du 30 décembre 2015.

      - id: sections_liberales_relevees
        titre: >-
          Relevé des barèmes publiés par les sections de la CNAVPL, caisse par
          caisse
        url: https://www.cnavpl.fr/
        acces: page
        statut_integration: a_faire
        note: >-
          Neuf sections ont été relevées une par une sur leurs sites. Le mur
          n'est pas le taux — presque toutes le publient — mais le PRIX D'ACHAT
          DU POINT, sans lequel une cotisation ne devient pas une pension.
          CAVAMAC : 6,30 % créateur de droits, taux d'appel 121,6 % soit 7,66 %
          effectif, plus 2,50 % versés par les compagnies mandantes ; valeur de
          service 0,4082 € au 1er janvier 2025 ; prix d'achat absent.
          CARPIMKO : 8,70 % sur l'assiette comprise entre un demi et trois
          plafonds ; ni valeur de service ni prix d'achat.
          CAVP : régime MIXTE, une part en répartition forfaitaire de 7 657 €
          (taux d'appel 105,4 % en 2026) et une part en CAPITALISATION de 2 906
          à 17 436 € selon la classe ; aucune valeur de point. Sa notice PDF de
          dix-neuf mille caractères dit seulement que « les points acquis dans
          ce régime varient selon le montant des cotisations versées ».
          CAVOM : les taux publiés sont ceux de la base CNAVPL, pas du
          complémentaire.
          CAVEC, CARPV, CIPAV, CRN : non aboutis — pages sans barème
          lisible, ou site dont les liens ne s'exposent pas en HTML simple.
          (La CARCDSF, qui figurait ici, a depuis abouti : voir
          `carcdsf_notices`.)
          Ce qui distingue la CARMF et l'IRCEC n'est donc pas la transparence
          en général mais un fait précis : elles publient de quoi RECONSTITUER
          le prix du point.
          SECONDE PASSE, avec un lecteur de pages qui rend le texte là où une
          requête simple ne voyait rien. Aucune fiche de plus, mais trois
          constats. Le RENDEMENT est souvent publié là où le prix du point ne
          l'est pas — la CAVEC écrit que 1 000 € de cotisations génèrent 83 €
          de pension annuelle, soit 8,33 %, exactement ce que
          rendements_points.csv consomme : chercher le rendement D'ABORD.
          Plusieurs sections sont PAR CLASSES et non proportionnelles, ce qui
          n'est pas une donnée manquante mais une forme que le dépôt ne sait
          pas exprimer — CAVEC neuf classes, 1 841 points, point à 1,3850 € ;
          CAVP classes plus part capitalisée ; c'est la forme du RAAP d'avant
          2017. Et le chiffre qui manque à la CARPIMKO N'EXISTE PAS ENCORE :
          passée au 1er janvier 2026 à 8,70 % entièrement proportionnels,
          valeur de service 21,48 €, elle n'a pas publié son taux de conversion
          en points — la Fédération nationale des orthophonistes répond « dès
          que les textes définitifs seront publiés ». Donnée à attendre, et
          elle débloquera la plus grosse population libérale absente.
          Chiffré rapporté pour la prochaine passe : CARPIMKO 8,70 % et
          21,48 € ; CAVEC 8,33 %, 1,3850 €, 1 841 points ; CAVAMAC 0,4082 € au
          01/01/2025.
          Lire docs/limites.md avant de refaire le trajet.

      - id: carcdsf_notices
        titre: >-
          Notice d'affiliation et pages de cotisations de la CARCDSF
          (chirurgiens-dentistes et sages-femmes)
        url: https://www.carcdsf.fr/images/pdf/2025/Notice_CD-Affiliation-2025-CARCDSF.pdf
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/rendements_points.csv
        note: >-
          La notice donne la phrase qui manquait partout ailleurs : « Cotisation
          forfaitaire : 3 178,80 en 2025, ATTRIBUANT 6 POINTS », et la
          proportionnelle « calculée sur la base de 10,80 % des revenus […]
          compris entre 0,85 et 5 fois la valeur du plafond ». Le site donne
          l'état 2026 : forfait 3 210,60 €, taux 11,35 %, tranche élargie à
          0,65-5 plafonds par la réforme de l'assiette sociale, valeur de
          service 31,82 €. D'où 535,10 € le point et un rendement de 5,95 %.
          UN PIÈGE DE LECTURE : la notice est composée dans une police dont la
          table ToUnicode ne se lit pas, et sort en glyphes — mais la
          substitution est régulière, les chiffres passent en clair, et le
          texte se décode. C'est ainsi que « attribuant 6 points » a été
          obtenu, alors que les pages HTML de la caisse ne le disent nulle part
          et qu'une source tierce annonçait un tout autre barème (0,375 % et
          un point maximum), qui est un état ancien.
          SECONDE PASSE — LA SÉRIE, ET NON PLUS LA SEULE ANNÉE EN COURS. La
          page d'accueil de la caisse ne publie que le millésime courant, mais
          https://www.carcdsf.fr/mementos/mementos garde les MÉMENTOS DU
          CHIRURGIEN-DENTISTE de 2017 à 2025. Sept exercices s'en lisent d'un
          coup — forfait, points attribués, valeur de service, taux et bornes :
          2 690,40 € et 10,65 % en 2020 et 2021, 2 769 € en 2022, 2 959,80 € et
          10,80 % en 2023, 3 108 € en 2024, 3 178,80 € en 2025. Le millésime
          2017 est un PDF NUMÉRISÉ, sans texte : la série s'arrête là.
          LA NOTE 5 DU MÉMENTO 2020 vaut démonstration : « 18 181 € / 448,40 €
          = 40,54 points ». 448,40 € est le forfait divisé par six ; la part
          PROPORTIONNELLE achète donc au prix du forfait, ce que la fiche ne
          faisait jusqu'ici que supposer.
          Le rendement, recalculé exercice par exercice, ne quitte pas la bande
          5,92 – 5,97 % : le conseil le pilote. Avant 2020, ni forfait ni
          valeur de point ne sont publiés.

      - id: carmf_chronologie
        titre: >-
          La chronologie des chiffres de la CARMF — valeur du point et
          cotisations du régime complémentaire, 1949-2025
        url: https://www.carmf.fr/doc/publications/chronologie/2025/chronologie-2025.pdf
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/rendements_points.csv
        note: >-
          Cent pages de tableaux, et tout y était depuis le début : la valeur
          de service du point année par année depuis 1949, la cotisation
          maximale et les POINTS QU'ELLE OUVRE depuis 1983, les taux, les
          plafonds de revenu. Ce document avait été déclaré illisible ; il ne
          l'était pas, c'est le lecteur de PDF du dépôt qui empilait les pages
          et écrasait les interlignes — voir docs/limites.md.
          CE QU'IL A FALLU COMPRENDRE POUR S'EN SERVIR. De 1991 à 1997 la table
          porte DEUX valeurs de point par année, sans dire laquelle est
          laquelle. Le rapport des deux vaut 1,3333 à quatre millièmes près sur
          cinq des sept années, et les statuts du régime donnent la clé : les
          points acquis avant le 1er janvier 1991 sont affectés d'un
          coefficient de 1,33. La série basse est donc le point NOUVEAU, et
          c'est elle qui rejoint 1998 (68,91 €), 2004 (69,00 €) et 2026
          (77,14 €) ; la série haute est le point ancien, qui s'éteint.
          DEUX AUTRES PIÈGES. La valeur publiée est celle « à 65 ans » jusqu'en
          2016 et « à 62 ans » à partir de 2017 : la chute apparente de 78,55 à
          68,30 est un changement de référence, pas une baisse. Et le régime
          n'est « totalement proportionnel aux revenus » que depuis 1996, dit
          la caisse en note ; avant, une part forfaitaire coexistait, dont les
          points ne sont pas publiés.
          CE QUE CELA CORRIGE : le rendement passe de 14,35 % en 1983 à 4,48 %
          en 2026. La fiche portait le seul chiffre de 2026 sur toute la
          période, ce qui divisait par deux ou trois les droits d'avant 2000.
          SECONDE PASSE — LA PART FORFAITAIRE, QUI N'ÉTAIT PAS ILLISIBLE NON
          PLUS. La table « Cotisations forfaitaires » porte une colonne
          « Complémentaire » qui donne le montant de 1949 à 1995 : 16,01 €,
          puis 402,47 € en 1970, 2 405,65 € en 1990, 2 166 € en 1995. Elle est
          composée en TEXTE PIVOTÉ — toutes ses cellules partagent une même
          ordonnée, et le lecteur du dépôt la rend en une seule ligne de mille
          caractères. Elle se relit à condition de la vérifier sur elle-même :
          la table additionne ses propres colonnes, et 10,67 + 16,01 = 26,68
          désigne sans ambiguïté la part complémentaire de 1949.

      - id: carmf_chiffres_cles
        titre: Chiffres clés du régime complémentaire des médecins (CARMF)
        url: https://www.carmf.fr/page.php?page=cdrom/retr/retr-chiffre.htm
        acces: page
        statut_integration: saisi
        cible: data/reference/regimes/rendements_points.csv
        note: >-
          La CARMF publie ses paramètres en HTML, sur deux pages : les
          cotisations (11,8 % des revenus nets dans la limite de trois plafonds
          et demi, soit 19 849 € au maximum en 2026) et les points (11,52
          points au maximum par an pour le complémentaire, valeur de service
          77,14 € à 62 ans). Le rendement de 4,48 % se déduit de ces trois
          chiffres, et c'est lui que porte la fiche.
          CE QUI MANQUE : toute série historique. La caisse ne publie que
          l'année en cours ; le taux comme la valeur du point ont bougé, et la
          fiche applique les chiffres de 2026 à toute la période. C'est la
          limite la plus lourde des deux fiches libérales.

      - id: dila_legi_crpn
        titre: >-
          Cotisations et barème de la caisse de retraite du personnel navigant,
          code de l'aviation civile, articles R. 426-5 à R. 426-16-1-1
        url: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
        acces: api
        statut_integration: saisi
        cible: data/reference/regimes/regimes_speciaux.yaml
        note: >-
          Le seul régime du dépôt dont les paramètres ne sont pas dans le code
          de la sécurité sociale : ils sont dans le CODE DE L'AVIATION CIVILE,
          et deux dépouillements les ont manqués pour cette seule raison — le
          filtre exigeait une mention de la sécurité sociale. Cotisations :
          R. 426-6 et R. 426-7, 6 % et 12 % jusqu'en 2011, 7,668 % et 13,632 %
          ensuite ; taux d'appel R. 426-8. Barème : R. 426-16-1, 1,85 % et
          1,4 % de taux de pension par annuité selon la tranche ; bornes des
          tranches R. 426-16-1-1, quatre et huit plafonds de la Sécurité
          sociale. Assiette de cotisation plafonnée « à la limite supérieure de
          la deuxième tranche » (R. 426-5 a). Âge d'ouverture cinquante ans
          (R. 426-11).
          TROIS CHOSES QUE LE CODE NE DONNE PAS, et qui sont dans les notes des
          fiches : le taux d'appel de 1995 à 2011, dont la formule dépend de la
          valeur N du fonds de retraite ; l'indice de variation des salaires,
          fixé chaque année par le conseil d'administration (R. 426-5 b) ; et
          les bornes des tranches d'avant 2012, que ce même indice portait
          avant que le décret n° 2011-1500 ne les fixe en plafonds.
          Depuis le 1er novembre 2023, ces articles sont abrogés et le régime
          est passé au CODE DES TRANSPORTS (R. 6527-*) : les fiches s'arrêtent
          donc à l'état de 2023, qu'aucun texte postérieur n'a modifié au
          fond.

      - id: dila_legi_cultes
        titre: >-
          Assiette et taux du régime vieillesse des cultes (CAVIMAC),
          articles L. 382-25, L. 382-27, R. 382-89 et R. 382-90
        url: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
        acces: api
        statut_integration: saisi
        cible: data/reference/regimes/non_salaries.yaml
        note: >-
          Le seul régime de ce dépouillement que le code spécifie ENTIÈREMENT,
          et sans donner un seul chiffre propre. L'assiette : R. 382-89 et
          R. 382-90 égalent la base forfaitaire, pour l'assuré comme pour sa
          congrégation, à « la valeur horaire du salaire minimum de croissance
          en vigueur, multipliée par le nombre légal d'heures de travail
          mensuel ». Les taux : les mêmes articles les égalent à ceux du régime
          général, respectivement part salarié et part employeur. La pension :
          L. 382-27 la sert « dans les conditions définies aux articles
          L. 351-1 à L. 351-1-3 […] L. 351-8 à L. 351-13 », c'est-à-dire aux
          règles du régime général. La fiche ne porte donc aucune valeur qui
          lui soit propre, et un test interdit qu'elle dérive de celle du
          régime général.

      - id: dila_legi_rci
        titre: >-
          Taux de cotisation des complémentaires obligatoires des artisans
          (1985-2012) et des commerçants (2004-2012)
        url: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
        acces: api
        statut_integration: saisi
        cible: data/reference/regimes/non_salaries.yaml
        recuperation: scripts/fetch/dila_legi_rci.py
        note: >-
          Articles D. 635-6 puis D. 635-7 du code de la sécurité sociale pour
          les artisans, D. 635-10 pour les commerçants, et D. 635-4 pour
          l'assiette d'avant 2004 — trois fois le plafond. D. 635-7 traverse la
          fusion et porte aussi le RCI, de 2013 à aujourd'hui : c'est par lui
          que les deux tranches du régime unifié, et leur hausse à 8,1 % et
          9,1 %, entrent dans la fiche. Attention à la date : cet état entre en
          vigueur le 7 juillet 2024 mais ne s'applique qu'aux cotisations dues
          à compter du 1er janvier 2025, ce que le récupérateur lit dans la
          clause plutôt que dans la date de version. La base LEGI en
          garde chaque version datée ; c'est la publication officielle
          elle-même. Les taux sont saisis dans les fiches de régime au niveau
          `haute` : rien ne les recontrôle encore automatiquement, faute
          d'entrée dans `controle_vraisemblance_cotisations`, et c'est ce qui
          les sépare de `certifiee`. Le récupérateur lit l'index LEGI du
          dépôt, comme celui de la MSA. Le plus ancien état de
          l'article est du 21 décembre 1985 : les six premières années du
          régime des artisans, 1979-1984, ne sont couvertes par aucune version
          datée et restent à certifier.

      - id: dila_legi_msa
        titre: Valeur de service du point de la RCO agricole, 2005-2024
        url: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
        acces: api
        statut_integration: certifie
        cible: data/reference/regimes/valeurs_point.csv
        recuperation: scripts/fetch/dila_legi_msa.py
        note: >-
          Article D. 732-166 du code rural, dont la base LEGI garde les
          dix-neuf versions datées. C'est la publication officielle elle-même,
          non une transcription, d'où le niveau certifiee. Légifrance sert le
          même article mais refuse les requêtes automatisées (403) et son API
          demande une clé : le dump est le seul chemin reproductible.
          Le récupérateur lit l'index LEGI du dépôt — le dump global plus les
          incréments quotidiens — depuis le 17 septembre 2026. Le dump global
          seul, de juillet 2025, s'arrêtait à 2024 ; l'index porte le décret
          n° 2026-78 du 11 février 2026, 0,3919 € pour 2025, lu et certifié ce
          jour-là.

      - id: jorf_decrets_rco_artisans
        titre: >-
          Décrets fondateur et modificatifs du complémentaire des artisans,
          1978-1985
        url: https://echanges.dila.gouv.fr/OPENDATA/JORF/
        acces: api
        statut_integration: saisi
        cible: data/reference/regimes/non_salaries.yaml
        note: >-
          LEGI ne remonte pas avant la codification du 21 décembre 1985 : les
          six premières années du régime, 1979-1984, n'y ont aucun état daté.
          Le JORF, lui, porte les décrets eux-mêmes. Deux passes y ont établi
          la chaîne complète : le décret n° 78-351 du 14 mars 1978 institue le
          régime et date les cotisations du 1er janvier 1979 (art. 12) ; le
          décret n° 81-407 du 23 avril 1981 répartit les biens de
          l'organisation autonome et fixe le versement du complémentaire au
          régime de base, SANS toucher aux cotisations ; le décret n° 84-1064
          du 30 novembre 1984 ajoute la cotisation additionnelle de 0,10 % au
          1er janvier 1985 ; la codification de décembre 1985 fige 4,40 %
          + 0,10 %. Onze textes seulement, dans tout le dump, concernent ce
          régime avant 1987, et aucun entre 1979 et 1983.
          CE QUE LE JORF NE DONNE PAS : le texte intégral de l'article 5 du
          décret de 1978. Les textes de cette époque n'y sont que par leur
          NOTICE, en capitales et sans accents, qui énumère les intitulés
          d'articles — « ART. 5 : TAUX DES COTISATIONS » — sans leur valeur.
          Les 4,40 % de 1979-1984 sont donc une déduction : le taux figé à la
          codification, plus l'absence de tout texte modificatif entre les
          deux. Pas de récupérateur : la chaîne est un constat d'existence,
          non une série à rafraîchir.

      - id: jorf_salaires_forfaitaires_marins
        titre: Salaires forfaitaires des marins par catégorie, arrêtés annuels, 2008-2026
        url: https://echanges.dila.gouv.fr/OPENDATA/JORF/
        acces: api
        statut_integration: certifie
        cible: data/reference/regimes/salaires_forfaitaires.csv
        recuperation: scripts/fetch/jorf_salaires_forfaitaires_marins.py
        note: >-
          Les arrêtés « portant majoration des salaires forfaitaires servant de
          base au calcul des contributions des armateurs, des cotisations et des
          pensions des marins » publient chaque année les vingt montants de la
          grille. Le script les lit dans l'index JORF du dépôt et retient la
          grille en vigueur au 1er juillet ; avant 2008, les textes de l'index
          n'en portent que le titre ou le visa.

      - id: jorf_revalorisation_pensions_fonction_publique
        titre: Revalorisation des pensions civiles et militaires par décret, 2004-2008
        url: https://echanges.dila.gouv.fr/OPENDATA/JORF/
        acces: document
        statut_integration: certifie
        cible: data/reference/legislation/revalorisation_pensions_fonction_publique.csv
        note: >-
          Entre la fin de la péréquation (31 décembre 2003) et le renvoi de
          l'article L. 16 du code des pensions civiles et militaires à
          l'article L. 161-23-1 (19 décembre 2008), les pensions de l'État, de
          la CNRACL et des ouvriers de l'État ont été revalorisées par un
          décret par an : n° 2003-1304, 2005-166, 2006-316 et 2007-60, puis
          l'article 6 de la loi n° 2008-1330 pour les deux coefficients de
          2008. Six lignes, lues une à une dans l'index JORF du dépôt le
          23 septembre 2026 — d'où `certifiee`. Elles ne s'écartent du régime
          général qu'en 2004 : 1,5 % contre 1,7 %. Avant 2004, la péréquation
          est suivie par le point d'indice ; depuis 2009, ce sont les
          coefficients de `cnav_revalorisation_pensions`.

      - id: jorf_plafond_securite_sociale
        titre: Plafond de la Sécurité sociale, décrets de fixation, 1963-2025
        url: https://echanges.dila.gouv.fr/OPENDATA/JORF/
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/plafond_securite_sociale.csv
        recuperation: scripts/fetch/jorf_plafond_securite_sociale.py
        note: >-
          Le plafond n'est pas une statistique mais un décret : le chercher chez
          les diffuseurs de séries — l'INSEE ne le publie qu'à partir de 2001,
          l'Urssaf pas du tout — était chercher au mauvais endroit. Il est dans
          le JOURNAL OFFICIEL, dont la DILA ouvre une base distincte de LEGI,
          lue dans l'index JORF du dépôt (le dump global, 1,7 Go, reste la
          voie de contrôle avec `--dump`). La chaîne des décrets y est
          COMPLÈTE DEPUIS 1963 — un texte par année, aucun ne manque — et trente
          et une années d'avant 2002 en sont lues, qui passent de la
          transcription au producteur : 1963, 1965-1981, 1984, 1987, 1988,
          1990-1993, 1996-2001. Toutes identiques à l'euro près à ce que portait
          OpenFisca, ce qui corrobore la transcription autant que cela certifie
          ces trente et une-là.
          QUATRE ÉCRITURES POUR UNE MÊME GRANDEUR, et elles se suivent dans le
          temps : le TITRE seul avant 1982 — « PORTANT FIXATION POUR L'ANNEE
          1969 DU PLAFOND DES COTISATIONS DE SECURITE SOCIALE A 16 320 FRS » —,
          la NOTICE en capitales de 1982 à 1996, l'ARTICLE 1er en texte intégral
          de 1997 à 2002, l'ARRÊTÉ à deux valeurs depuis 2003. Le récupérateur
          lit les quatre et refait le taux que la notice annonce.
          LE PIÈGE : « POUR L'ANNEE 1969 » vaut pour l'année, « A COMPTER DU
          01-01-1982 » ne vaut que jusqu'au relèvement suivant, et le plafond
          est devenu SEMESTRIEL en 1982. Confondre les deux donne 1982 à −3,6 %.
          De même, janvier seul ne fait pas une année à moins que le texte ne
          déclare la couvrir : sinon il faut un second montant lu dans l'année.
          Le récupérateur ne reconduit jamais l'année précédente.
          CE QUI RESTE HORS DE PORTÉE tient à la rédaction, non à l'accès, et
          docs/limites.md le dit année par année : avant 1963 le décret ne nomme
          pas l'année qu'il commande ; 1982-1983 et 1989 n'écrivent pas leur
          montant ; 1985-1986 n'ont pas de notice ; 1994-1995 laissent leur
          tableau en image.

      - id: sncf_contribution_employeur
        titre: Contribution employeur de la SNCF, composantes T1 et T2, 2007-2022
        url: https://echanges.dila.gouv.fr/OPENDATA/
        acces: api
        statut_integration: certifie
        cible: data/reference/legislation/contribution_employeur_public.csv
        recuperation: scripts/fetch/sncf_contribution_employeur.py
        note: >-
          La seule grandeur du dépôt dont les deux termes sont dans deux textes
          de nature différente, et qui demande donc les DEUX bases de la DILA,
          lues dans les index du dépôt — les deux dumps, 2,8 Go et une heure,
          restant la voie de contrôle. L'article 2 du décret n° 2007-1056 du
          28 juin 2007
          définit le taux comme « la somme de deux composantes, ci-après
          désignées T1 et T2 ». T1 est arrêté chaque année et publié au JORF ;
          T2 est au IV du même article, que LEGI garde daté.
          LA CONVENTION DE DATE : chaque arrêté porte le taux T1 DÉFINITIF de
          l'année écoulée et le PROVISIONNEL de l'année qui vient. Le taux d'une
          année est le définitif — 23,87 % et non 23,25 % pour 2018, soit six
          dixièmes de point d'écart, et c'est le provisionnel qu'OpenFisca avait
          retenu. Les deux sont récupérés, seul le premier compose la somme.
          CE QUI LIMITE À CINQ ANNÉES : T1 est lu de 2007 à 2022, mais le décret
          ne chiffre T2 que jusqu'en 2011 et le fait ensuite évoluer par renvoi
          — « comme le rapport […] entre le montant des cotisations d'assurance
          vieillesse assis sur le montant maximum des rémunérations ». Un taux
          qui évolue par formule n'est écrit nulle part. La somme n'est donc
          rendue que là où ses deux termes sont lus.
          UN PIÈGE : l'arrêté fondateur du 6 mai 2008, seul à porter l'année
          2007, écrit « le taux définitif T1 » quand tous les autres écrivent
          « le taux T1 définitif ».

      - id: sre_minimum_garanti
        titre: Traitement de référence du minimum garanti, 2004 et année courante
        url: https://retraitesdeletat.gouv.fr/actif/le-calcul-de-ma-retraite/le-minimum-garanti
        acces: page
        statut_integration: certifie
        cible: data/reference/legislation/minimum_garanti_montants.csv
        recuperation: scripts/fetch/sre_minimum_garanti.py
        note: >-
          Le Service des retraites de l'État liquide et paie ces pensions : sa
          page du minimum garanti n'est pas une transcription du barème, c'est le
          barème opposé à l'assuré. Elle porte les deux bornes de la chaîne que
          l'article L. 17 décrit — l'ancre du 1er janvier 2004, « 997,96 € par
          mois ou 11 975,57 € par an », et le montant courant qui se date
          lui-même, « 16 396,19 € […] revalorisé au 01/01/2026 ».
          L'ancre de 2004 a désormais TROIS chemins indépendants : le produit
          227 × 52,7558 € que le vérificateur refait, la publication dont elle
          était transcrite, et cette page. Les trois donnent le même centime.
          CE QUE LA PAGE NE DONNE PAS : les années intermédiaires, qui restent
          transcrites. Une exécution par an en ajoute une.
          Une source scrutée peut changer de rédaction : le récupérateur lève
          PageIllisible plutôt que d'écrire une série muette, et contrôle que le
          mensuel annoncé soit bien l'annuel divisé par douze.

      - id: dila_legi_minimum_vieillesse
        titre: Montant de l'ASPA, code de la sécurité sociale D. 815-1, 2006-2020
        url: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
        acces: api
        statut_integration: certifie
        cible: data/reference/legislation/minimum_vieillesse.csv
        recuperation: scripts/fetch/dila_legi_minimum_vieillesse.py
        note: >-
          Ces montants venaient d'une saisie sur Légifrance — une lecture
          humaine, non un fichier confronté au producteur. L'article D. 815-1 les
          porte, datés, et la base garde ses versions : neuf ancres de 2006 à
          2020, dont cinq que le dépôt n'avait pas.
          LA LECTURE A CORRIGÉ UN CHIFFRE : le dépôt portait le montant MENSUEL
          maximal multiplié par douze — 708,95 × 12 = 8 507,40 € pour 2010 —,
          quand l'article fixe 8 507,49 € PAR AN, dont le mensuel arrondi se
          déduit. Neuf centimes, et le sens de la dérivation rétabli.
          CE QUE L'ARTICLE TAIT, et il en tait la moitié : il n'est pas réécrit à
          chaque revalorisation. Sa version d'octobre 2014 tient jusqu'en avril
          2018 sur un seul montant alors que l'allocation a monté en 2016 et en
          2017, et il s'arrête en 2020. Le b) de l'article porte le barème du
          COUPLE, que le modèle ne connaît pas : seul le a) est lu.

      - id: dila_kali
        titre: KALI — conventions collectives, essayée pour le taux d'appel de l'Agirc
        url: https://echanges.dila.gouv.fr/OPENDATA/KALI/
        acces: fichier
        statut_integration: sans_objet
        note: >-
          Troisième base de la DILA essayée par ce dépôt, et la plus légère :
          173 Mo, deux minutes, 7 632 textes retenus. Elle a été dépouillée pour
          le TAUX D'APPEL DE L'AGIRC, que la convention collective nationale du
          14 mars 1947 fixe par avenants. RÉSULTAT NÉGATIF, et la raison est
          instructive : cette convention n'est pas dans KALI. Ce n'est pas une
          convention de branche déposée mais un accord national
          interprofessionnel ; la base n'en garde que l'accord de 1986 sur ses
          « seuils d'accès ». 1 754 textes la citent, aucun n'est elle.
          À retenir avant d'y revenir : KALI porte les conventions de BRANCHE,
          pas les accords interprofessionnels que gèrent leurs signataires.

      - id: dila_opendata
        titre: Bases ouvertes de la DILA — JORF et LEGI
        url: https://echanges.dila.gouv.fr/OPENDATA/
        acces: fichier
        statut_integration: a_faire
        note: >-
          Dumps complets, 1,6 Go et 1,1 Go compressés, filtrables en flux sans
          écriture disque. Dépouillés cinq fois à la recherche des valeurs du
          point de la CNAVPL, de la MSA et de la CNBF, 43 Go au total. Les
          quatre premières passes filtraient sur le TEXTE et n'ont tiré de la
          RCO agricole que quatre valeurs éparses ; la cinquième, indexée sur le
          NUMÉRO d'article, les donne toutes — LEGI est organisée par version
          d'article, pas par thème. C'est elle qu'automatise dila_legi_msa.
          Ni la CNAVPL ni la CNBF n'y figurent en revanche, et ce n'est pas un
          défaut de la recherche : leur décret annuel fixe un coefficient de
          revalorisation, non un montant. Les 104 textes du JORF portant une
          valeur de point ne mentionnent pas une fois le mot « libérale ». Ces
          deux séries viennent donc des caisses — voir cnavpl_recueils et
          cnbf_baremes. Lire docs/limites.md §1 avant de refaire le trajet.

  ined:
    nom: Institut national d'études démographiques
    role: >-
      Tables de mortalité françaises reconstituées, 1806-1997, et leurs
      projections. Seule source ouverte à remonter avant Eurostat.
    jeux:
      - id: ined_vallin_mesle
        titre: Quotients de mortalité du moment par année d'âge, 1806-2102
        url: https://www.ined.fr/Xtradocs/cdrom_vallin_mesle/contenu.htm
        acces: fichier
        statut_integration: certifie
        cible: data/reference/mortalite/quotients_periode.csv
        recuperation: scripts/fetch/ined_vallin_mesle.py
        note: >-
          Vallin (Jacques) et Meslé (France), « Tables de mortalité françaises
          pour les XIXe et XXe siècles et projections pour le XXIe siècle »,
          INED, Données statistiques n° 4, 2001. L'INED sert librement le
          contenu du cédérom, sans inscription : le tableau II-B-1 donne les
          quotients du moment par année d'âge, de 0 à 104 ans. C'est ce que la
          Human Mortality Database aurait donné, sans la barrière d'inscription
          qui la mettait hors de portée d'un script.
          Le dépôt n'en reprend que 1899-1985 : à partir de 1986 la donnée
          observée vient d'Eurostat, son producteur. Les deux se recouvrent de
          1986 à 1997 et concordent à un demi-point de pourcentage près sur
          85 âges — c'est ce recoupement qui autorise à les aboucher.
          Diffusé en classeur Excel 97, lu par scripts/fetch/lecture_xls.py.

  eurostat:
    nom: Eurostat
    role: >-
      Contrôle de cohérence sur l'inflation harmonisée, espérance de vie à
      65 ans — que l'INSEE ne publie pas en série longue —, et droits à
      pension acquis à date, seule publication du STOCK que porte le système.
    jeux:
      - id: eurostat_hicp
        titre: HICP — annual data
        url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/prc_hicp_aind
        acces: api
        statut_integration: automatise
        cible: data/brut/eurostat_hicp.json
        note: >-
          Contrôle de vraisemblance seulement : l'IPCH et l'IPC national ne
          mesurent pas la même chose, aucune valeur n'est certifiée par ce biais.

      - id: eurostat_engagements_retraite
        titre: >-
          Droits à pension acquis à une date donnée dans le cadre de
          l'assurance sociale (nasa_10_pens1) — tableau supplémentaire sur les
          retraites du SEC 2010
        url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/nasa_10_pens1
        acces: api
        statut_integration: certifie
        recuperation: scripts/fetch/eurostat_engagements_retraite.py
        cible: data/reference/macro/engagements_retraite.csv
        note: >-
          LE STOCK, LÀ OÙ TOUT LE RESTE DU DÉPÔT EST UN FLUX. Le règlement
          (UE) n° 549/2013 fait transmettre, tous les trois ans, ce que chaque
          système de retraite DOIT DÉJÀ au titre des droits que les vivants
          ont acquis. Le poste retenu est `F63_LE`, les droits à pension dans
          le bilan de clôture : 368 % du PIB en 2015, 431 % en 2018, 397 % en
          2021 pour la France, presque tout par répartition. Eurostat n'en est
          pas le producteur — c'est l'INSEE qui transmet —, d'où le niveau
          `haute` et non `certifiee`, comme pour les comptes consolidés du
          COR. L'écart entre les trois transmissions est l'autre information :
          soixante-trois points de PIB en trois ans, puis trente-quatre dans
          l'autre sens, ne sont pas des droits qui apparaissent et
          disparaissent, mais un taux d'actualisation qui bouge. C'est pourquoi
          ce tableau est publié à part des comptes principaux, et pourquoi le
          dépôt le porte comme un ordre de grandeur et jamais comme une dette.

      - id: eurostat_mlexpec
        titre: Espérance de vie par âge et par sexe (demo_mlexpec)
        url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/demo_mlexpec
        acces: api
        statut_integration: automatise
        cible: data/brut/eurostat_esperance_vie.json
        recuperation: scripts/fetch/eurostat_mortalite.py
        note: >-
          Contrôle croisé de l'espérance de vie à 65 ans, dont la source
          retenue est l'OCDE (couverture plus longue). Les deux coïncident
          exactement sur leurs 78 valeurs communes.

      - id: eurostat_mlifetable
        titre: Table de mortalité par âge et par sexe (demo_mlifetable)
        url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/demo_mlifetable
        acces: api
        statut_integration: certifie
        cible: data/reference/mortalite/quotients_periode.csv
        recuperation: scripts/fetch/eurostat_mortalite.py
        note: >-
          Quotients de mortalité par âge, 1986-2024 : les vraies tables du
          moment, qui dispensent le modèle de sa calibration paramétrique aux
          âges et années couverts. Territoires FX (1986-2012) puis FR
          (1998-2024). Classes ouvertes (85 et plus, 95 et plus) écartées.

  ocde:
    nom: Organisation de coopération et de développement économiques
    role: >-
      Espérance de vie à 65 ans — la seule mesure dont le modèle a besoin et
      que l'INSEE ne publie pas en série longue.
    jeux:
      - id: ocde_health_le
        titre: Espérance de vie par âge et par sexe (DSD_HEALTH_STAT@DF_LE)
        url: https://sdmx.oecd.org/public/rest/data/OECD.ELS.HD,DSD_HEALTH_STAT@DF_LE,
        acces: api
        statut_integration: certifie
        cible: data/reference/mortalite/esperances_vie.csv
        recuperation: scripts/fetch/oecd_esperance_vie.py
        note: >-
          France, par sexe, 1960-2024, valeurs transmises par l'INSEE.
          Retenue plutôt qu'Eurostat parce qu'elle remonte vingt-six ans plus
          haut ; les deux sources coïncident sur leur période commune.

  openfisca:
    nom: OpenFisca-France (modèle socio-fiscal de l'administration française)
    role: >-
      Transcription machine, datée décret par décret, des paramètres du droit
      social français : plafond de la Sécurité sociale depuis 1930, taux de
      cotisation vieillesse depuis 1967.
    note: >-
      Source SECONDAIRE : transcription du Journal officiel, non producteur.
      Les valeurs qui en viennent plafonnent au niveau `haute` et ne sont
      jamais `certifiee`. Deux recoupements automatiques les corroborent, refaits
      à chaque exécution de scripts/verifier_donnees.py.
    jeux:
      - id: openfisca_plafond
        titre: Plafond annuel de la Sécurité sociale, 1930-2026
        url: https://github.com/openfisca/openfisca-france/blob/master/openfisca_france/parameters/prelevements_sociaux/pss/plafond_securite_sociale_annuel.yaml
        acces: api
        statut_integration: automatise
        cible: data/reference/macro/plafond_securite_sociale.csv
        recuperation: scripts/fetch/openfisca_plafond.py
        note: >-
          Renseigne les années 1931-2001, que ni l'INSEE ni l'Urssaf ne
          diffusent. Au-delà de 2001, l'INSEE l'emporte et OpenFisca sert de
          contrôle croisé.

      - id: openfisca_points
        titre: Valeurs d'achat et de service du point, 1947-2025
        url: https://github.com/openfisca/openfisca-france-pension/tree/master/openfisca_france_pension/parameters/retraites
        acces: api
        statut_integration: automatise
        cible: data/reference/regimes/valeurs_point.csv
        recuperation: scripts/fetch/openfisca_points.py
        note: >-
          Salaire de référence, valeur de service et taux d'appel de l'Agirc
          (1947), de l'Arrco (1949 via l'UNIRS, unifié en 1999), de l'Agirc-Arrco
          (2019), de l'Ircantec avec ses prédécesseurs IPACTE et IGRANTE, du
          RAFP (2005) et du RCI (2013). Ne couvre ni la CNAVPL, ni la MSA, ni
          la CNBF : ces régimes ne sont pas modélisés par OpenFisca.
          Recoupé à chaque exécution contre le rendement instantané que
          l'Agirc-Arrco publie pour l'année en cours : 5,61 % en 2025.

      - id: openfisca_regime_general_oracle
        titre: Moteur de calcul du régime général — contre-expertise du scénario 1
        url: https://github.com/openfisca/openfisca-france-pension
        acces: api
        statut_integration: automatise
        cible: tests/temoins/openfisca_regime_general.json
        recuperation: scripts/fetch/openfisca_regime_general.py
        note: >-
          Le seul jeu de cette liste dont on emprunte non pas les DONNÉES mais
          le MOTEUR. Le scénario « système actuel » est l'étalon du modèle et
          n'avait aucune contre-expertise : aucun simulateur officiel n'est
          automatisable — M@rel exige FranceConnect et le relevé de carrière
          réel — et relire deux fois le même code ne prouve rien.
          OpenFisca-France-Pension est une SECONDE IMPLÉMENTATION, écrite par
          d'autres à partir des mêmes textes. Dix profils à salaire nominal
          constant y sont calculés, et le témoin versionné qui en sort permet de
          rejouer la confrontation sans installer le paquet.
          Ce n'est pas une source officielle, et un désaccord ne désigne pas
          d'office le coupable : la première confrontation en a produit deux, un
          de chaque côté. Chez nous, la durée de proratisation confondue avec la
          durée requise (corrigé, `legislation/duree_proratisation.csv`). Chez
          lui, une table de durée requise antérieure à la réforme du 14 avril
          2023 — 169 trimestres à la génération 1965, là où l'article
          L. 161-17-3 en donne 172.
          Périmètre : régime général seul, liquidations antérieures à 2025. Son
          régime unifié Agirc-Arrco est inutilisable dans la version publiée
          (le code demande un paramètre que les barèmes livrés ne définissent
          pas) et ses barèmes s'arrêtent en 2024.

      - id: openfisca_fonction_publique_oracle
        titre: Moteur de calcul de la pension civile — contre-expertise du scénario 1
        url: https://github.com/openfisca/openfisca-france-pension
        acces: api
        statut_integration: automatise
        cible: tests/temoins/openfisca_fonction_publique.json
        recuperation: scripts/fetch/openfisca_fonction_publique.py
        note: >-
          Le même emprunt de MOTEUR, pour la fonction publique de l'État et la
          CNRACL : dix profils de sédentaires sans enfant ni prime, liquidés de
          2009 à 2020. La confrontation a trouvé deux erreurs chez nous — le
          barème de décote de l'article L. 14 lu à l'année de liquidation au
          lieu de l'année d'ouverture du droit, et la montée en charge
          2004-2008 de la durée de services ignorée — et une transcription
          chez lui, 0,65 % pour 2010 au lieu de 0,625 %. Son minimum garanti
          suit le point d'indice de l'année de liquidation, quand l'article
          L. 17 fige la référence en 2004 : l'écart est le sien.

      - id: openfisca_arrco_oracle
        titre: Moteur de calcul de l'Arrco 1999-2018 — contre-expertise du scénario 1
        url: https://github.com/openfisca/openfisca-france-pension
        acces: api
        statut_integration: automatise
        cible: tests/temoins/openfisca_arrco.json
        recuperation: scripts/fetch/openfisca_arrco.py
        note: >-
          Le même emprunt, pour l'Arrco des non-cadres : sept carrières qui
          commencent en 1999 au plus tôt — OpenFisca ne convertit pas les
          points d'avant l'unification — et liquident en 2018 au plus tard.
          Points au millième, valeur de service à la quatrième décimale, rien
          à corriger. Son coefficient d'anticipation ne se lit que par année
          entière, et son âge à la liquidation perd parfois un mois à la
          conversion des jours : le témoin choisit ses dates en conséquence.

      - id: openfisca_minimum_contributif
        titre: Montants du minimum contributif, 1984-2023
        url: https://github.com/openfisca/openfisca-france-pension/tree/master/openfisca_france_pension/parameters/retraites/secteur_prive/regime_general_cnav
        acces: api
        statut_integration: automatise
        cible: data/reference/legislation/minimum_contributif.csv
        recuperation: scripts/fetch/openfisca_minimum_contributif.py
        note: >-
          Le minimum, le minimum majoré et le plafond d'écrêtement, datés
          circulaire par circulaire. Contrôle de vraisemblance sur les seules
          lignes que la base LEGI ne certifie pas, à la dernière date d'effet
          de l'année de l'ancre — un contrôle et non une certification, les
          deux étant des transcriptions à quelques centimes l'une de l'autre.
          La série s'arrête en 2023 : les montants servis depuis restent
          transcrits à la main, sans recoupement.

      - id: openfisca_parametres_generation
        titre: Durée requise, âge d'annulation de la décote et durée de services de la fonction publique, par génération
        url: https://github.com/openfisca/openfisca-france-pension/tree/master/openfisca_france_pension/parameters/retraites
        acces: api
        statut_integration: automatise
        cible: data/reference/legislation/duree_assurance_requise.csv
        recuperation: scripts/fetch/openfisca_parametres_generation.py
        note: >-
          Trois tables que la base LEGI ne certifie pas entièrement : les
          générations 1943-1952 de la durée requise, l'âge d'annulation de la
          décote — calculé chez nous, transcrit chez lui — et la montée en
          charge 2004-2008 de la fonction publique
          (`legislation/duree_requise_fonction_publique.csv`). Versées au
          niveau `haute` sur les lignes non certifiées, et elles s'y sont
          toutes retrouvées.

      - id: openfisca_point_indice
        titre: Point d'indice de la fonction publique et barème du minimum garanti
        url: https://github.com/openfisca/openfisca-france/blob/master/openfisca_france/parameters/marche_travail/remuneration_dans_fonction_publique/indicefp/point_indice_en_euros.yaml
        acces: api
        statut_integration: automatise
        cible: data/reference/legislation/point_indice_fonction_publique.csv
        recuperation: scripts/fetch/openfisca_point_indice.py
        note: >-
          Deux séries pour un seul dispositif, le minimum garanti de l'article
          L. 17 : le traitement annuel d'un point d'indice majoré, daté décret
          par décret depuis 1960, et la montée en charge 2004-2013 du barème
          (`secteur_public/pension_civile/minimum_garanti` d'OpenFisca-France-
          Pension). L'ancre de l'article se recoupe d'elle-même : 227 points
          d'indice au 1er janvier 2004 valent 11 975,57 € par an, soit les
          997,96 € par mois que publie le Service des retraites de l'État.
          Le montant en euros, lui, ne vient pas d'ici — voir sre_minimum_garanti.

      - id: openfisca_contribution_employeur_public
        titre: Contribution employeur des régimes publics — État, CNRACL, SNCF
        url: https://github.com/openfisca/openfisca-france/tree/master/openfisca_france/parameters/prelevements_sociaux/cotisations_secteur_public
        acces: api
        statut_integration: automatise
        cible: data/reference/legislation/contribution_employeur_public.csv
        recuperation: scripts/fetch/contribution_employeur_public.py
        note: >-
          Trois des quatre séries du fichier. `retraite/taux_implicite` porte le
          taux employeur RECONSTITUÉ de l'État, 1995-2005, repris du tableau
          p. 26 de l'annexe « pensions » au PLF 2011 — le seul document qui
          chiffre ce que l'État consacrait à ses pensions avant qu'un taux
          existe. `cnracl/employeur/cnracl` porte le taux réellement appelé
          par la caisse territoriale et hospitalière depuis 1947, qui, elle,
          n'a jamais eu ce problème. `sncf/…/cotisations_employeur/t1` et `t2`
          portent les deux composantes de la contribution de l'entreprise,
          2007-2018 : T1 calée sur le coût des mêmes salariés au privé, T2
          finançant les droits spécifiques et le déséquilibre démographique.

      - id: openfisca_cotisations
        titre: Taux de cotisation vieillesse du régime général, 1967-2026, et des régimes publics et non salariés
        url: https://github.com/openfisca/openfisca-france/tree/master/openfisca_france/parameters/prelevements_sociaux/cotisations_securite_sociale_regime_general/cnav
        acces: api
        statut_integration: automatise
        cible: data/brut/openfisca_cotisations.json
        recuperation: scripts/fetch/openfisca_cotisations.py
        note: >-
          Deux usages. D'abord un contrôle de vraisemblance sur les taux saisis
          dans les fiches de régime, structurées par périodes législatives.
          Ensuite, depuis que le compte notionnel doit recevoir le taux de
          CHAQUE ANNÉE et non une moyenne de période, la source de
          `regimes/taux_cotisation_annuels.csv`, que `verifier_donnees.py
          --appliquer` écrit depuis ce fichier au niveau `haute` — une
          transcription, pas le producteur — et que le chargeur des fiches
          applique année par année au régime général, aux salariés agricoles,
          à la CANCAVA, à l'ORGANIC et au RSI. Les quatre composantes
          sont récupérées séparément — salarié et employeur, plafonnée et
          déplafonnée —, et le contrôle les confronte aux fiches DEUX PAR DEUX :
          `taux_cotisation_retraite` et `part_salariale` contre la plafonnée,
          `taux_cotisation_deplafonnee` et `part_salariale_deplafonnee` contre
          la déplafonnée. Comparer les sommes suffirait à laisser passer deux
          erreurs de sens contraire qui se compensent — et qui ne portent
          pourtant pas sur la même assiette.
          Le même fichier porte les COMPLÉMENTAIRES du privé depuis la tranche
          B3 : taux effectifs, taux contractuels, taux d'appel et répartition
          salarié/employeur de l'Agirc (1948-2018), de l'Arrco (1962-2018) et
          du régime unifié, tranche par tranche, dans les deux barèmes
          d'adhésion qu'OpenFisca distingue (entreprises adhérentes avant ou
          après 1981 pour l'Agirc, avant ou après 1997 pour l'Arrco). Les
          fiches portent le barème des ENTREPRISES EXISTANTES, une période par
          valeur de « contractuel × appel », au niveau `haute` ; le contrôle
          les confronte à cinq centièmes près, et la répartition à un
          centième. Le barème des entreprises nouvelles est porté par deux
          fiches parallèles (`agirc_entreprises_nouvelles`,
          `arrco_tranche_2_entreprises_nouvelles`), confrontées à leur propre
          variante.

      - id: openfisca_part_salariale
        titre: Répartition salarié / employeur des cotisations retraite
        url: https://github.com/openfisca/openfisca-france/tree/master/openfisca_france/parameters/prelevements_sociaux/regimes_complementaires_retraite_secteur_prive
        acces: api
        statut_integration: saisi
        cible: data/reference/regimes/*.yaml
        note: >-
          Le champ `part_salariale` des fiches, qui dit quelle fraction du taux
          l'assuré supporte lui-même. Sans lui, le modèle ne pouvait pas
          comparer la part salariale d'un fonctionnaire — sa retenue, seule
          grandeur que sa fiche porte — à celle d'un salarié du privé, dont la
          fiche porte un total. Sources par régime : `cnav/salarie` et
          `cnav/employeur` pour le régime général depuis 1967 ;
          `arrco|agirc/taux_effectifs_salaries_employeurs` et
          `agirc_arrco/salarie|employeur` pour les complémentaires ;
          `cotisations_secteur_public/ircantec/taux_cotisations_appeles` pour
          l'Ircantec. La part est une MOYENNE sur la période de fiche, saisie à
          la main et recoupée à chaque exécution de `verifier_donnees.py`.
          Avant 1967 rien n'est transcrit : la part du régime général y est
          celle mesurée sur 1968-1971, et celles des prédécesseurs de l'Arrco et
          de l'Ircantec la règle 40-60 de leur successeur.

  ipp:
    nom: Institut des politiques publiques (IPP)
    role: >-
      Barèmes socio-fiscaux : reconstitution, décret par décret, des taux de
      cotisation français depuis 1925 — dont ceux des régimes complémentaires
      des professions libérales, section par section.
    note: >-
      Source SECONDAIRE : transcription du Journal officiel et des publications
      de caisses, non productrice. Les valeurs qui en viennent plafonnent au
      niveau `haute`, comme celles d'OpenFisca, et ne sont jamais `certifiee`.
      ELLE N'EST PAS À JOUR PARTOUT : la colonne des chirurgiens-dentistes
      s'arrête en fait à 2019 et porte encore 10,65 % en 2026, quand la caisse
      écrit 10,80 % depuis 2023 et 11,35 % en 2026. Quand le barème et la
      caisse divergent, la caisse fait foi ; là où ils se recouvrent — 2020 à
      2022 pour la CARCDSF, 1983 à 2026 pour la CARMF — ils concordent, et
      c'est ce recouvrement qui autorise à se fier au reste.
    jeux:
      - id: jorf_statuts_sections_liberales
        titre: >-
          Arrêtés portant approbation des statuts des régimes complémentaires
          des sections professionnelles libérales, dans le dump JORF de la DILA
        url: https://echanges.dila.gouv.fr/OPENDATA/JORF/
        acces: fichier
        statut_integration: a_faire
        cible: docs/limites.md
        note: >-
          Les statuts de chaque régime complémentaire de section libérale sont
          approuvés PAR ARRÊTÉ, et le Journal officiel en publie l'annexe en
          entier. Le dump global — 1,67 Go, lu en flux — en rend 236 textes ;
          Légifrance, lui, refuse les requêtes (403).
          CE QU'IL DONNE : la RÈGLE d'acquisition des points. L'arrêté du 14
          novembre 2025 sur la CARPIMKO dit que ses affiliés ont acquis, de 1996
          à 2025, « 8 points au titre de la cotisation forfaitaire ; 22 points
          maximum au titre de la cotisation proportionnelle » — un barème écrit
          EN POINTS, la forme que le dépôt sait déjà exprimer, et qui rend le
          prix d'achat inutile sur ces trente exercices.
          CE QU'IL NE DONNERA JAMAIS : les valeurs annuelles. L'arrêté du 23
          juin 2011 sur la CAVAMAC l'écrit noir sur blanc — le prix d'achat du
          point est « fixé annuellement par le conseil d'administration ». Le
          chercher au Journal officiel est un trajet à ne pas refaire.

      - id: jorf_cotisations_liberales
        titre: >-
          Décrets annuels fixant les cotisations des régimes complémentaires
          des sections professionnelles libérales, 2001-2025
        url: https://echanges.dila.gouv.fr/OPENDATA/JORF/
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/non_salaries.yaml
        recuperation: scripts/fetch/jorf_cotisations_liberales.py
        note: >-
          LA SOURCE QUE DEUX PASSES AVAIENT MANQUÉE, parce qu'elles
          interrogeaient les caisses. Les caisses ne publient que l'année en
          cours et leurs statuts renvoient les montants au conseil
          d'administration : les deux constats sont vrais et ne concluent rien.
          UN DÉCRET PAR AN FIXE CES MONTANTS POUR LES NEUF SECTIONS À LA FOIS,
          et le Journal officiel le publie. « 5° Section professionnelle des
          auxiliaires médicaux : cotisation forfaitaire : 1 648 euros ; taux de
          la cotisation proportionnelle : 3 % ; limites de l'assiette : seuil :
          25 246 euros ; plafond : 176 313 euros. » Vingt-quatre décrets, 335
          valeurs, de 2001 à 2025.
          CE QU'IL DÉBLOQUE : la série de la CARPIMKO, dont la fiche est
          écrite ; la valeur d'achat du point de la CAVOM (2016-2025) et de la
          CARPV (2016-2025) ; le montant de la première classe de la CAVEC et
          de la Cipav, année par année ; la section C des notaires. Et il
          RECOUPE ce que les caisses publiaient : le forfait et le taux de la
          CARCDSF, le taux de la CARMF, la grille 2022 de la Cipav — tous
          identiques.
          IL A AUSSI CORRIGÉ UNE CAISSE CONTRE ELLE-MÊME. Le décret
          n° 2025-1076 du 10 novembre 2025 fixe pour la Cipav « 11 % » en
          première tranche et « 21 % » en seconde, quand la fiche pratique 2026
          de la caisse imprime encore 9 % et 22 % — les taux de 2023 — et les
          applique dans son exemple chiffré. Le décret fait foi.
          TROIS PIÈGES DE FORME, traités par le récupérateur : l'unité change de
          nom (« EUR », « € », « euros »), les puces changent de signe, et la
          numérotation des sections n'apparaît qu'en 2012. Le découpage se fait
          donc sur « Section professionnelle des … », qui est constant, et les
          champs sur leur intitulé, qui l'est aussi.
          UN JUMEAU À NE PAS CONFONDRE : un autre décret annuel, de même forme
          et avec les mêmes sections, fixe la cotisation forfaitaire du régime
          de BASE — en francs jusqu'en 2001. Le mot « complémentaire » est
          exigé dans le motif pour l'écarter.
          ET LA SECTION DES ARTISTES, que le récupérateur ne lit pas : les
          mêmes décrets — et ceux de 1984 à 2000, que l'index LEGI porte —
          fixent chaque année la classe de référence du régime commun aux
          artistes graphiques et plastiques et aux musiciens, le RAAP
          d'avant 2016 : classe spéciale de 876 F en 1984 à 448 € en 2015
          (classe A, son double, de 1995 à 2011). Trente et un montants,
          saisis à la main le 22 septembre 2026 dans
          `data/reference/regimes/classes_cotisation.csv`.

      - id: cavp_mementos
        titre: >-
          Mémentos annuels de la CAVP — cotisations des deux volets du
          complémentaire et formule de calcul de la retraite
        url: https://www.cavp.fr/media/documents/Publications/2024/CAVP-2024-MEMENTO-DEBUT-EXERCICE-PL.pdf
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/rendements_points.csv
        note: >-
          DEUX CHOSES QUE LE MÉMENTO RÈGLE D'UN COUP. La première : le volet en
          RÉPARTITION n'est pas par classes. Le tableau aligne les classes 3 à
          13 en colonnes, et la ligne « Part gérée par répartition » y porte le
          même montant partout — 6 880 € en 2024, quel que soit le revenu. Seul
          le volet CAPITALISÉ est par classes, et il n'est pas de la
          répartition.
          La seconde : la formule. « LE CALCUL D'UNE RETRAITE CAVP À TAUX PLEIN
          EN 2024 — RÉGIME COMPLÉMENTAIRE PAR RÉPARTITION : nombre d'années
          validées × 320,75 ». Le régime compte en ANNUITÉS, pas en points, et
          320,75 / 6 880 = 4,66 % : le rendement du dépôt reproduit la formule
          exactement, la cotisation étant constante.
          EN 2026 la cotisation passe à 7 657 € et l'annuité à 328,80 €, mais la
          hausse « intègre un TAUX D'APPEL DE 105,4 % qui ne produira aucun
          droit de retraite afin de garantir la soutenabilité financière du
          volet géré en répartition » (décret n° 2025-1076 du 10 novembre
          2025). Le rendement de ce qui est VERSÉ tombe donc à 4,29 %, et c'est
          celui-là qu'un compte notionnel doit porter.
          Le régime est institué par le décret n° 49-580 du 22 avril 1949, que
          les arrêtés d'approbation des statuts visent encore — trouvé dans le
          dump JORF, la caisse ne le citant nulle part.
          LA GRILLE DU VOLET CAPITALISÉ SE LIT, ELLE AUSSI. Déclarée illisible
          pour la même raison que les livrets de la CARPV, elle s'ouvre avec
          pypdf, et son arithmétique la résume en une ligne : la part
          capitalisée vaut (classe − 1) fois une cotisation de référence de
          1 453 € en 2026, soit 2 906 € en classe 3 et 17 436 € en classe 13,
          et la classe se lit sur un revenu de référence qui commence à
          85 369 € et monte par paliers de 17 662 €.
          CE QUI MANQUE N'EST DONC PAS LA GRILLE mais la CONVERSION : « à chaque
          âge de départ, le coefficient de conversion du capital en rente
          viagère tient compte de l'espérance de vie pour chaque génération,
          d'un rendement financier précompté et du choix ou non de la
          réversion », et ni ces coefficients ni le rendement du plan ne sont
          publiés. Un volet capitalisé ne se chiffre pas sans eux — et il
          n'entre de toute façon pas dans la comparaison, qui ne porte que sur
          la répartition.
          MANQUE AUSSI toute série : un seul millésime est publié.

      - id: cavec_guide_annuel
        titre: >-
          Guide annuel retraite et prévoyance de la CAVEC — grille des classes,
          points et valeur du point
        url: https://www.cavec.fr/wp-content/uploads/Guide-annuel-retraite-prevoyance.pdf
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/classes_cotisation.csv
        note: >-
          Le guide donne la grille entière du complémentaire — neuf classes, de
          898 € jusqu'à 14 919 € de revenus à 30 616 € au-delà de 181 208 € —
          ET, en regard de chacune, LE NOMBRE DE POINTS QU'ELLE OUVRE. Avec la
          valeur de service de 1,3850 € en 2026, le rendement se vérifie ligne
          à ligne : 498 points pour 8 282 € en classe D, soit 8,33 %, et les
          huit autres classes donnent le même à un dix-millième près. C'est
          aussi le chiffre que la caisse annonce.
          CE QUE LE JOURNAL OFFICIEL AJOUTE. Les statuts approuvés par l'arrêté
          du 4 juillet 2025 fixent une cible au conseil d'administration : « ces
          paramètres sont déterminés de sorte que le taux de rendement du régime
          d'assurance vieillesse complémentaire atteigne 8,25 % à échéance de
          l'année 2027 ». Un rendement futur écrit au Journal officiel : la
          fiche le porte à partir de cet exercice.
          UNE OPTION QUE LE MODÈLE NE PREND PAS : « vous pouvez opter pour la
          classe immédiatement supérieure à celle qui correspond à vos
          revenus ». Avantage facultatif, donc écarté — même règle que pour la
          classe C1 des avocats.
          CE QUI MANQUE : toute série. Un seul millésime est publié, et
          soixante-dix ans sont reportés depuis lui.

      - id: cipav_fiches_pratiques
        titre: >-
          Fiches pratiques annuelles de la Cipav — cotisations, classes,
          valeurs du point
        url: https://www.lacipav.fr/documents-utiles
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/classes_cotisation.csv
        note: >-
          La Cipav était rangée parmi les caisses « non abouties ». Elle publie
          en fait TOUT ce qu'un modèle en points demande.
          DEPUIS 2023 LE RÉGIME EST PROPORTIONNEL — « les cotisations de
          retraite complémentaire ne sont plus forfaitaires mais
          proportionnelles au revenu » : 9 % de zéro à un plafond, 22 % d'un à
          trois. Et les points s'achètent, l'exemple de la caisse faisant foi :
          « 3 600 € / 47,40 € (valeur d'achat du point en 2026) = 75,9 points ».
          Achat, service et rendement sont publiés ensemble : 42,43 € et 2,63 €
          en 2022, 45,30 € et 2,77 € pour 6,10 % en 2023, 47,40 € et 2,89 € en
          2026.
          AVANT 2023, HUIT CLASSES, et la fiche pratique 2022 en donne la
          grille entière : 1 527 € jusqu'à 26 580 € de revenus, puis 3 055 €,
          4 582 €, 7 637 €, 10 692 €, 16 802 €, 18 329 € et 19 857 € au-delà de
          123 300 €. La classe est DÉTERMINÉE par le revenu, non choisie — le
          même document présente juste à côté celle du régime invalidité-décès,
          qui l'est, et les distingue explicitement.
          CE QUI BLOQUAIT N'ÉTAIT PAS UNE DONNÉE MAIS UNE FORME, et la forme
          existe désormais : `classes_cotisation.csv` porte la grille, le
          drapeau `cotisation_par_classes` la lève dans la fiche, et les deux
          moteurs la lisent. La Cipav est au catalogue, et le statut
          `profession_liberale` y route.
          LA GRILLE EST INDEXÉE SUR LE PLAFOND, parce qu'elle est écrite en
          plafonds : ses sept bornes valent 0,646, 1,198, 1,406, 1,614, 2,019,
          2,508 et 2,997 plafonds de 2022, et ses huit montants 1, 2, 3, 5, 7,
          11, 12 et 13 fois une unité de 1 527 € qui vaut 3,71 % du plafond.
          Restent, au même mécanisme et avec des données qui existent : la
          CAVEC, la part répartie de la CAVP, le RAAP d'avant 2017.

      - id: ipp_taux_cotisation
        titre: >-
          Taux de cotisation retraite chez l'IPP, et l'ancrage de chaque marche
          au Journal officiel
        url: https://baremes.ipp.eu/parameters/prelevements-sociaux/
        acces: fichier
        statut_integration: controle
        cible: data/brut/ipp_taux_cotisation.json
        recuperation: scripts/fetch/ipp_taux_cotisation.py
        note: >-
          CETTE SOURCE NE CERTIFIE RIEN, ET C'EST SON OBJET. Deux séries du
          dépôt ne peuvent pas l'être : le régime général d'avant 1982, que la
          base LEGI ne date pas, et les complémentaires du privé, dont les taux
          ne sont dans aucun texte réglementaire. Elles viennent
          d'OpenFisca-France, qui transcrit lui-même les barèmes de l'Institut
          des politiques publiques. Confronter les deux vérifie une copie contre
          son original, non deux lectures indépendantes, et le contrôle le dit à
          chaque exécution.
          CE QU'ELLE AJOUTE. Les barèmes IPP portent deux colonnes que la
          transcription perd — `reference`, qui nomme le texte, et
          `official_journal_date`, qui donne sa publication. Le récupérateur
          cherche chaque texte dans l'index JORF du dépôt, au numéro et à la
          date annoncés : 35 des 36 marches de la CNAV y sont, seul le décret
          n° 70-680 du 30 juillet 1970 manque à l'index. La CHRONOLOGIE de la
          série devient donc vérifiable là où sa VALEUR ne l'est pas — et c'est
          la chronologie dont dépend la règle du 1er janvier.
          CE QU'ELLE DÉMONTRE SUR LES COMPLÉMENTAIRES. Pour l'Agirc et l'Arrco,
          l'IPP laisse lui-même la colonne du Journal officiel VIDE et cite
          « Convention AGIRC du 14/03/1947 », « Accords ARRCO du 12/11/86 »,
          « Lettre-circulaire ARRCO 82-28 ». Ces taux sont fixés par accord
          collectif, et le Journal officiel n'en publie que l'avis d'extension,
          qui renvoie au Bulletin officiel Conventions collectives sans jamais
          écrire le chiffre. La source amont dit donc elle-même qu'il n'y a pas
          de texte officiel à lire : la démonstration est mécanique et non
          affirmée.
          CE QU'ELLE A TROUVÉ. Un décret que la série IGNORAIT : le n° 79-650
          du 30 juillet 1979, qui a relevé « à titre exceptionnel » les taux du
          régime général du 1er août 1979 au 31 janvier 1981 — donc au
          1er janvier 1980 ET au 1er janvier 1981 — sans nommer de risque. Le
          dépôt en a conclu que ses taux de 1980 et 1981 étaient trop bas ; ils
          ne le sont pas. C'est le point exceptionnel du plan Barrot, porté par
          la seule cotisation MALADIE du salarié — 3,50 % puis 4,50 % au
          1er août 1979, ramenée à 4,50 % au 1er février 1981 —, et le recueil
          statistique de la Cnav (titre II, tableau T2-2, lu le 21 septembre
          2026) écrit que la vieillesse plafonnée vaut 12,90 % du 1er janvier
          1979 au 1er janvier 1984, sans marche entre-temps. Le décret est
          rangé, avec sa raison, parmi ceux qui n'ont pas d'effet sur la
          vieillesse. Et une erreur de recopie :
          OpenFisca servait 0,1 % de part salariale déplafonnée dès le
          1er janvier 2004 quand elle naît le 1er juillet.
          LA CORROBORATION DE 1981. La notice du décret n° 81-1013 du
          13 novembre 1981 est la seule du JORF ancien à porter les chiffres —
          « VIEILLESSE : 12,9 % (8,2 % POUR L'EMPLOYEUR, 4,7 % POUR LES
          SALARIES) » — et le récupérateur vérifie qu'ils sont ceux que la série
          porte. Ce n'est pas une certification : le décret dit ce qui vaut à
          partir du 14 novembre 1981, non ce qui valait avant.

      - id: ipp_points_independants
        titre: >-
          Prix d'achat et valeur de service du point des complémentaires
          artisans (1979-2012) et commerçants (2004-2012)
        url: https://baremes.ipp.eu/parameters/regimes-de-retraites/
        acces: fichier
        statut_integration: certifie
        cible: data/reference/regimes/valeurs_point.csv
        recuperation: scripts/fetch/ipp_points_independants.py
        note: >-
          Quatre paramètres — `salref_rc_art`, `pt_rc_art`, `salref_rc_com`,
          `pt_rc_com` — comblent un trou que le dépôt portait sans le voir :
          ces deux régimes se déclarent EN POINTS et n'avaient aucun prix de
          point. Le moteur retombait sur le rendement instantané, qui leur
          prêtait les 6,74 % du RCI d'aujourd'hui de 1979 à 2012. Le rendement
          réel du complémentaire des artisans valait 11,95 % en 1980.
          TROIS PIÈGES DE LECTURE, TRAITÉS PAR LE RÉCUPÉRATEUR. Les barèmes sont
          en francs jusqu'en 2001, et le fichier de référence tient ses valeurs
          en euros courants. Le libellé de la valeur de service des artisans au
          1er janvier 2001 est FAUX — « 0,2847 FRF » est un euro, comme le
          prouve la continuité avec 1,83 F en 2000 et 0,2845 € en 2002 —, et le
          script le corrige puis vérifie qu'aucune autre rupture ne subsiste.
          Enfin le barème est une suite de dates d'effet et non une série
          annuelle : c'est la dernière de l'année qui est retenue, comme le veut
          la règle du fichier de référence.
          CE QUE LA LECTURE A VALIDÉ. Le coefficient de reprise des points par
          le RCI, 0,2778, est le rapport de deux valeurs que ce barème porte :
          0,32284 pour l'artisan et 1,162 pour le commerçant, au 31 décembre
          2012. La circulaire RSI 2013/004 pose exactement ce quotient. Deux
          chemins indépendants, le même nombre à sept décimales.

      - id: ipp_retraite_complementaire_liberaux
        titre: >-
          Cotisation de sécurité sociale pour la retraite complémentaire des
          professions libérales, 1949-2026
        url: https://baremes.ipp.eu/parameters/prelevements-sociaux/prelevements_sociaux.professions_liberales.ret_comp_pl/csv
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/non_salaries.yaml
        note: >-
          Un CSV d'une colonne par section professionnelle, chaque ligne étant
          une DATE D'EFFET : une année absente veut dire que rien n'a changé.
          CE QU'IL A DÉBLOQUÉ. Le taux de la cotisation proportionnelle de la
          CARCDSF de son institution en 1997 — 8 %, décret 97-830 du 4
          septembre 1997 — à 2019, années que les mémentos de la caisse ne
          couvrent pas ; et la PART FORFAITAIRE du complémentaire de la CARMF
          de 1949 à 1995, sous l'intitulé « Part forfaitaire retraite
          complémentaire CARMF », identique chiffre pour chiffre à la colonne
          « Complémentaire » de la chronologie de la caisse.
          CE QU'IL A CORRIGÉ SANS QU'ON LE CHERCHE : il ne donne AUCUN taux
          proportionnel avant 1983 pour la CARMF ni avant 1997 pour la CARCDSF,
          et sa note de 1997 l'explique — la proportionnelle est instituée « en
          plus de la cotisation forfaitaire qui existait déjà ». Les deux
          fiches prêtaient à ces années un taux qui n'existait pas.
          CE QU'IL PORTE ENCORE, ET QUI N'EST PAS UTILISÉ : les taux du
          complémentaire des agents généraux d'assurance (CAVAMAC) de 1968 à
          2026, des auxiliaires médicaux (CARPIMKO) depuis 1996 et des notaires
          (CPRN) depuis 1949. Ces trois sections n'ont pas de fiche, faute non
          pas du taux mais du PRIX DU POINT — voir la note de `cnavpl`.

  cepii:
    nom: Centre d'études prospectives et d'informations internationales
    role: >-
      Modèle d'équilibre général à générations imbriquées OLGAMAP — la seule
      évaluation française des comptes notionnels qui boucle sur la
      macroéconomie.
    jeux:
      - id: cepii_lettre_297
        titre: >-
          Chojnicki & Magnani, « Les comptes notionnels à la rescousse de la
          répartition ? », La Lettre du CEPII n° 297, 7 avril 2010
        url: https://www.cepii.fr/CEPII/fr/publications/lettre/abstract.asp?NoDoc=2389
        acces: document
        statut_integration: controle
        millesime: 7 avril 2010
        note: >-
          Le pendant macroéconomique de `cnav_comptes_notionnels_2009` : là où
          la CNAV suit des individus, le CEPII fait tourner un régime unique en
          comptes notionnels dans un modèle d'équilibre général, taux unique
          d'environ 22 %, cotisations non plafonnées, transition de 2015 à 2030.
          Sa conclusion est une thèse et non une mesure : « ce n'est pas le
          système de comptes notionnels qui permet en soi de réduire les besoins
          de financement mais bien le choix des paramètres du système ».
          CE QU'IL CONTRÔLE, ET C'EST INATTENDU : la lettre chiffre la
          cotisation retraite implicite de la fonction publique en 2008 à
          « 7,85 % » de part salariale et « 55,7 % » de part patronale. La ligne
          `2008,fonction_publique_etat` de
          `data/reference/legislation/contribution_employeur_public.csv` porte
          0,5571, certifiée contre le Service des retraites de l'État. Deux
          chaînes de production sans rapport, le même chiffre à la décimale :
          c'est le recontrôle par un tiers d'une valeur qui pèse lourd dans les
          scénarios 4 et 5.
          CE QU'IL DONNE ET QUE LE DÉPÔT NE CALCULE PAS : l'ordre de grandeur
          agrégé. Son scénario A — capital revalorisé sur la masse salariale,
          pensions actualisées à 1,8 % — réduit le besoin de financement de
          0,7 point de PIB à l'horizon 2050. Son scénario C pousse le taux
          d'actualisation à ZÉRO, « ce qui revient simplement à déterminer la
          valeur de la pension en divisant la valeur capitalisée des cotisations
          individuelles par la durée anticipée de la période de retraite » —
          soit littéralement la formule du §5 de `methodologie.md` — et trouve
          3,2 points de PIB de moins qu'en A, avec un système excédentaire sur
          toute la période.
          LA RÉSERVE, QUI COMPTE : leur ν = 0 s'applique à des pensions indexées
          sur les PRIX, le nôtre à des pensions revalorisées au taux qui les
          actualise. Ce n'est pas le même objet, et l'écart va dans le sens
          d'une sévérité plus grande chez eux. Voir `docs/limites.md` §5 quater.

  banque_de_france:
    nom: Banque de France
    role: >-
      Comptes financiers et comptes distributionnels du patrimoine des ménages.
    jeux:
      - id: bdf_comptes_distributionnels
        titre: >-
          De nouvelles statistiques sur la distribution du patrimoine des
          ménages dans la comptabilité nationale (Bulletin de la Banque de
          France n° 250-6, février 2024)
        url: https://www.banque-france.fr/system/files/2024-02/BDF250-6_Comptes.pdf
        acces: document
        statut_integration: saisi
        cible: src/retraite_notionnelle/config.py
        note: >-
          Lu le 22 septembre 2026, pour la règle de l'assurance-vie de la
          reprise sur succession (action 47). Graphique 4, deuxième trimestre
          2023 : pour les 50 % de ménages les moins dotés, patrimoine net
          moyen 47 000 €, dont 57 % d'actifs financiers, 46 % de dépôts et
          10 % d'assurance-vie et d'épargne retraite. Saisi dans
          `Parametres.part_assurance_vie_patrimoine`, aucun script ne le
          revérifie. Le Bulletin ne ventile pas par âge.

  bce:
    nom: Banque centrale européenne
    role: >-
      Courbe des taux sans risque de la zone euro, et rendement de l'emprunt
      d'État français à dix ans : ce qui rémunère le pilier de capitalisation
      obligatoire de la proposition, et ce qui mesure l'écart entre la courbe
      retenue et celle que la France paie.
    jeux:
      - id: bce_courbe_taux_aaa
        titre: >-
          Courbe des taux zéro-coupon des souverains AAA de la zone euro
          (jeu YC, estimation de Svensson, composition continue)
        url: https://data-api.ecb.europa.eu/service/data/YC/B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/courbe_taux_sans_risque.csv
        recuperation: scripts/fetch/bce_courbe_taux.py
        note: >-
          Trente maturités, de 1 à 30 ans, à la date du relevé. La BCE estime
          et publie cette courbe : c'est le producteur, et non un repreneur.
          Elle donne le taux auquel un versement se place aujourd'hui pour une
          durée donnée ; les taux des versements futurs s'en déduisent par les
          FORWARDS implicites, sans hypothèse ajoutée. Le fichier de référence
          garde les courbes successives, une ligne par date et par maturité, et
          le modèle lit la plus récente.
          POURQUOI LA COURBE AAA ET NON L'OAT. La courbe « tous émetteurs »
          inclut la France et rend davantage — 51 points de base au 10 ans en
          septembre 2026, contre le rendement de l'OAT relevé en regard. Cet
          écart rémunère un risque de crédit ; un régime obligatoire qui promet
          une rente ne peut pas le compter comme un rendement acquis. La courbe
          AAA est donc retenue, et l'écart est chiffré dans la méthodologie.

      - id: bce_taux_oat_10_ans
        titre: >-
          Rendement de l'emprunt d'État français à dix ans, critère de
          convergence (jeu IRS)
        url: https://data-api.ecb.europa.eu/service/data/IRS/M.FR.L.L40.CI.0000.EUR.N.Z
        acces: api
        statut_integration: controle
        cible: data/brut/bce_courbe_taux.json
        recuperation: scripts/fetch/bce_courbe_taux.py
        note: >-
          Aucune valeur du modèle n'en sort : cette série CONTRÔLE la
          précédente, en chiffrant ce que coûterait — et ce que rapporterait —
          le choix de la dette française plutôt que de la courbe sans risque.

  opef:
    nom: >-
      Observatoire des produits d'épargne financière (CCSF, Banque de France)
    role: >-
      Frais réellement pratiqués sur les plans d'épargne retraite, mesurés sur
      les remises de l'ACPR : le prix de l'enveloppe dans laquelle la
      proposition loge son pilier capitalisé.
    jeux:
      - id: opef_rapport_annuel
        titre: >-
          Rapport annuel de l'Observatoire des produits d'épargne financière —
          frais des PER individuels, exercice 2025
        url: https://www.banque-france.fr/fr/publications-et-statistiques/publications/rapport-annuel-2026-de-lobservatoire-des-produits-depargne-financiere-opef
        document: https://www.banque-france.fr/system/files/2026-07/OPEF2026.pdf
        acces: document
        blocage: refus
        fichier_local: OPEF2026.pdf
        sha256: eca04bb11f03cfd4b17d3d388d9d5b71a198b71d44f281676147188db15c260e
        recuperation: scripts/fetch/opef_frais_per.py
        statut_integration: saisi
        cible: data/reference/macro/frais_epargne_retraite.yaml
        note: >-
          Trois valeurs, moyennes 2025 des PER individuels assurantiels sur le
          support en euros : 1,09 % sur chaque versement, 0,76 % par an sur
          l'encours, 2,20 % sur chaque arrérage de rente. Ce sont les seules
          lignes qui s'appliquent à un pilier placé en titres sans risque ; les
          unités de compte (0,91 %), la gestion pilotée (0,92 %) et l'arbitrage
          (0,07 %) n'ont pas d'objet ici.
          NIVEAU `haute`, ET NON `certifiee` : le rapport est un PDF que le
          serveur de la Banque de France refuse aux requêtes non navigateur, si
          bien que le dépôt ne sait pas le confronter automatiquement. Les
          valeurs sont saisies depuis sa reprise par la presse spécialisée
          (Meilleurtaux Placement, 4 juillet 2026, citant les données ACPR de
          l'OPEF), et la règle du manifeste plafonne à `haute` ce qui n'a pas
          été lu sur le document du producteur.
          CONFRONTÉ AU DOCUMENT le 20 septembre 2026 : le rapport a été obtenu
          par l'outil de lecture web de Claude Code, qui ne sort pas par le
          proxy de la session et que la Banque de France ne refuse pas — le
          seul chemin trouvé, curl et le runner GitHub Actions étant refusés
          (403 Akamai « Access Denied », page et PDF, requête simple et
          Chromium headless), et aucun autre site public ne reprenant
          l'édition 2026. Son empreinte est le `sha256` ci-dessus.
          scripts/fetch/opef_frais_per.py lit ses tableaux T5 à T7 avec pypdf
          (le lecteur du dépôt ne rend pas ses polices CFF) et, avec
          `--confronter`, compare le T7 au fichier cible : les trois valeurs
          2025 et les trois valeurs 2024 sont celles du document. Le jeu reste
          `saisi` et le niveau `haute` : la confrontation prouve la saisie,
          elle ne la remplace pas par une lecture tenue par
          scripts/verifier_donnees.py, et le document n'est pas sur le miroir
          du dépôt — à déposer une fois, à la main, sur la release
          documents-apportes sous le nom OPEF2026.pdf, avec cette empreinte ;
          `--recuperer` le rapportera ensuite dans toute session.
          CE QUE LE DOCUMENT AJOUTE À LA SAISIE : la moyenne des frais sur
          arrérages est non pondérée et ne porte que sur les 9 organismes (sur
          20) qui les facturent ; le frais sur versement du PER est le double
          de celui de l'assurance-vie (0,55 %) et six fois celui du contrat de
          capitalisation (0,19 %), écart que l'OPEF attribue à des frais fixes
          sur des primes petites ; le frais de gestion du fonds en euros est
          proche partout (0,67 % à 0,76 %). Le fichier cible porte ces trois
          lectures et leur portée pour un pilier obligatoire.
          CE QUE CES MOYENNES SONT : versement et gestion sont des moyennes
          PONDÉRÉES de tout le marché (par les primes, par l'encours moyen),
          donc les vraies moyennes de ce qui est payé ; les arrérages, une
          moyenne NON PONDÉRÉE des seuls facturants, dont on déduit 0,99 % sur
          les vingt déclarants et une médiane nulle. Aucune médiane n'est
          publiée pour les deux premiers.
          DEPUIS, L'UTILISATEUR L'A DÉPOSÉ DANS LE DÉPÔT LUI-MÊME, le 20 septembre
          2026, sous `data/brut/OPEF2026.pdf` — le seul fichier de ce répertoire
          que git suive, à cause de ce refus — ; toute session l'a, et le lecteur
          PDF du dépôt le rend désormais aussi (une police simple se lit par un
          octet quoi que déclare sa table).

      - id: ccsf_rapport_per_2021
        titre: >-
          Rapport du CCSF sur les nouveaux plans d'épargne retraite, juillet
          2021 (Corinne Dromer ; étude Sémaphore Conseil sur 36 contrats)
        url: https://www.ccsfin.fr/evenement/rapport-sur-les-nouveaux-plans-depargne-retraite-2021
        document: https://www.banque-france.fr/system/files/import/ccsf/medias/documents/rapport_per-2021.pdf
        acces: document
        statut_integration: controle
        millesime: tarifs affichés entre décembre 2020 et mai 2021
        note: >-
          Aucune valeur du modèle n'en sort. Il CONTRÔLE la portée des
          moyennes de l'OPEF (`opef_rapport_annuel`) par la seule autre mesure
          publique du même marché : 34 PER assurance, tarifs affichés dans les
          notices, moyennes arithmétiques non pondérées, minimum et maximum,
          moyennes par catégorie de distributeur (tableau T4, page 27 ;
          chapitre 2). Lu le 20 septembre 2026 sur le document.
          CE QU'IL DONNE : frais sur versement MAXIMUM affichés 3,18 % en
          moyenne (0 à 5 %, courtiers en ligne à 0, CGP et sociétés
          d'assurance à 4,5 et 4,8 %, « bien plus faibles » en pratique selon
          les CGP) ; gestion du fonds en euros 0,87 % (0,60 à 1 % hors un
          fonds à 2 %) ; arrérages 1,18 % ZÉROS COMPRIS sur 30 contrats à
          frais proportionnels, 0 à 3 %, onze contrats à zéro, de 0,60 %
          (banques à réseau) à 2,30 % (mutuelles) par catégorie.
          CE QU'IL RÉVÈLE, et que l'OPEF ne mesure pas : « 22 contrats
          affichent également des frais sur encours de rentes, avec un minimum
          de 0,60 % et un maximum de 1 % par an ». Un prélèvement annuel sur la
          réserve de la rente, que le modèle ne compte pas, et qui vaut 9 à
          15 % de rente au diviseur du modèle — quatre à sept fois les 2,20 %
          d'arrérages. Il ne publie aucune médiane.

  ici:
    nom: Investment Company Institute
    role: >-
      L'association des fonds américains : la seule série de frais sur
      trente ans, pondérée par les encours, sur un marché où seule la
      concurrence a joué.
    jeux:
      - id: ici_trends_fees_2025
        titre: Trends in the Expenses and Fees of Funds, 2025 (ICI Research Perspective, mars 2026)
        url: https://www.ici.org/files/2026/per32-01.pdf
        acces: document
        statut_integration: controle
        millesime: 1996-2025
        note: >-
          Aucune valeur du modèle n'en sort. Elle CONTRÔLE la trajectoire du
          frais de gestion du pilier (`Parametres.frais_gestion_paliers`) :
          « In 1996, equity mutual fund investors incurred expense ratios of
          1.04% […] By 2025, that average had fallen to 0.40% », pondéré par
          les encours, soit 62 % de baisse en vingt-neuf ans, 3,3 % par an ;
          dans les plans 401(k), de 0,76 % en 2000 à 0,26 % en 2024. C'est le
          rythme que les paliers du modèle suivent, par marches de dix ans.
          Lu sur le document le 20 septembre 2026.

  dwp:
    nom: Department for Work and Pensions (Royaume-Uni)
    role: >-
      L'enquête sur les frais des régimes à cotisations définies, avant et
      après le plafond de 0,75 % d'avril 2015 : ce qu'un plafond fait au
      stock, d'un coup.
    jeux:
      - id: dwp_pension_charges_survey_2020
        titre: Pension charges survey 2020, charges in defined contribution pension schemes
        url: https://www.gov.uk/government/publications/pension-charges-survey-2020-charges-in-defined-contribution-pension-schemes/pension-charges-survey-2020-charges-in-defined-contribution-pension-schemes
        acces: page
        statut_integration: controle
        millesime: 2015, 2016, 2020
        note: >-
          Aucune valeur du modèle n'en sort. Elle CONTRÔLE la convergence du
          stock (`Parametres.convergence_frais_stock`) et le niveau qu'un
          plafond impose : frais moyens des régimes soumis au plafond de 0,75 %
          de 0,49 % en 2015, 0,50 % en 2016 et 0,48 % en 2020 (0,29 % dans les
          régimes fiduciaires), « all members in the qualifying schemes […]
          are now below the cap » ; les régimes non soumis passent de 0,79 %
          à 0,53 %. Un plafond touche tout le stock d'un coup, et la baisse
          s'arrête là. Lu le 20 septembre 2026.

  superintendencia_pensiones:
    nom: Superintendencia de Pensiones (Chili)
    role: >-
      L'autorité du système chilien de capitalisation obligatoire, qui adjuge
      tous les deux ans les nouveaux entrants à la caisse la moins chère :
      la baisse la plus brutale observée, et sa réversibilité.
    jeux:
      - id: sp_licitacion_2025_2027
        titre: >-
          Adjudications de la cartera de nuevos afiliados, 2023-2025 et
          2025-2027 (communiqués)
        url: https://www.spensiones.cl/portal/institucional/594/w3-article-16290.html
        acces: page
        statut_integration: controle
        millesime: 2010-2025
        note: >-
          Aucune valeur du modèle n'en sort. Elle CONTRÔLE la forme des
          paliers : une adjudication est une marche, pas une pente. AFP Uno
          adjudicataire à 0,46 % de la rémunération imposable pour 2025-2027,
          après 0,49 % pour 2023-2025 (Modelo offrait 0,57 %) ; « la comisión
          más baja del sistema » était de 1,36 % avant la première
          adjudication de 2010, à 0,41 % au plus bas. Lu le 20 septembre 2026.
      - id: bcn_comisiones_afp_2018
        titre: >-
          Bibliothèque du Congrès national du Chili, « Comisiones, rentabilidad
          y dinámica de competencia de las AFP », 2018
        url: https://obtienearchivo.bcn.cl/obtienearchivo?id=repositorio/10221/26900/1/Comisiones__rentabilidad_y_dinamica_de_competencia_de_las_AFP.pdf
        acces: document
        statut_integration: controle
        millesime: 1990-2018
        note: >-
          Aucune valeur du modèle n'en sort. Elle CONTRÔLE deux choses. La
          suite des adjudications : Modelo à 1,14 % de juillet 2010 à juillet
          2012 puis 0,77 %, Planvital à 0,47 % d'août 2014 à juillet 2016
          puis 0,41 % jusqu'en juillet 2018 ; la commission moyenne pondérée
          du système tombe à 1,14 % en juillet 2018. Et la réversibilité : « en
          agosto de 2018 la comisión promedio ponderada ha vuelto a aumentar,
          a causa del incremento de la comisión de la AFP Planvital desde el
          0,47% hasta el 1,16% », dès qu'elle a cessé d'être adjudicataire. Le
          modèle ne fait jamais remonter un frais, et limites.md le dit. Lu
          sur le document le 20 septembre 2026.

  frr:
    nom: Fonds de réserve pour les retraites
    role: >-
      Le seul fonds public français qui gère une réserve de retraite de
      plusieurs dizaines de milliards : ce que coûte, en France, la gestion
      d'un capital de retraite hors réseau commercial.
    jeux:
      - id: frr_rapport_annuel_2024
        titre: Rapport annuel 2024 du FRR — coûts du Fonds et actif net
        url: https://www.fondsdereserve.fr/wp-content/uploads/2025/10/FRR-RA2024-FR-2.pdf
        acces: document
        statut_integration: controle
        millesime: 2024
        note: >-
          Aucune valeur du modèle n'en sort. Il CONTRÔLE la borne haute des
          frais du pilier capitalisé (`opef_rapport_annuel`) : « les charges
          de l'exercice 2024 sont de 84,10 M€ », pour « un actif net [de]
          20,4 Md€ en 2024 en valeur de marché », soit 0,41 % — mandats de
          gestion active et frais de surperformance compris ; l'enveloppe
          limitative (personnel, immobilier, informatique) « représente
          environ 8,6 points de base de l'actif net ». Lu sur le document le
          20 septembre 2026. Un fonds public gérant des actions et des
          mandats coûte donc la moitié des 0,76 % de gestion du fonds en
          euros du PER, et le modèle ne simule que des titres d'État portés à
          l'échéance.

  pensionsmyndigheten:
    nom: Pensionsmyndigheten (Agence suédoise des pensions)
    role: >-
      Gestionnaire de la prime de pension suédoise (premiepension), pilier
      capitalisé obligatoire de 2,5 % du salaire adossé au compte notionnel :
      le seul régime en place qui soit exactement le montage du scénario 6.
    jeux:
      - id: premiepension_avgifter
        titre: Frais et remises de la prime de pension (avgifter och rabatter)
        url: https://www.pensionsmyndigheten.se/forsta-din-pension/valj-och-byt-fonder/avgifter-och-rabatter-inom-premiepensionen
        acces: page
        statut_integration: controle
        millesime: 2026
        note: >-
          Aucune valeur du modèle n'en sort. Elle CONTRÔLE la borne haute des
          frais du pilier capitalisé (`opef_rapport_annuel`) par le seul
          pilier obligatoire comparable qui publie ses frais : « Den
          rabatterade kapitalviktade avgiften år 2026 är 0,11 procent » — le
          frais de fonds moyen pondéré par les encours, après la remise que
          la plateforme impose aux gérants, est de 0,11 % en 2026 ; les
          gérants rendent en moyenne les deux tiers de leurs frais, ce qui
          relève la pension de 15 % ; l'administration coûte 0,024 % des
          encours, plafonnée à 157 couronnes par an. Ni frais sur versement,
          ni frais sur arrérages. Lu le 20 septembre 2026. Le tiers du niveau
