      - id: drees_non_recours_minimum_vieillesse
        titre: >-
          Le non-recours au minimum vieillesse des personnes seules (Les
          dossiers de la DREES n° 97, Pauline Meinzel, 20 mai 2022)
        url: https://drees.solidarites-sante.gouv.fr/publications-communique-de-presse/les-dossiers-de-la-drees/le-non-recours-au-minimum-vieillesse-des
        acces: page
        statut_integration: saisi
        cible: src/retraite_notionnelle/web/pages.py
        note: >-
          Lu le 20 septembre 2026, pour la page Coût. Fin 2016, une personne
          seule éligible sur deux ne recourt pas au minimum vieillesse :
          321 200 personnes sous le plafond de ressources sans allocation, soit
          un taux de non-recours de 50 %. Les non-recourants toucheraient 205 €
          par mois en moyenne, contre 337 € servis aux allocataires, et le
          montant du non-recours est estimé à 790 millions d'euros, 59 % des
          sommes versées. La garantie vieillesse du scénario 6 étant
          individualisée et automatique, elle n'a pas de non-recours par
          construction : comparer son coût à celui de l'ASPA sans cette
          correction ferait passer pour une dépense nouvelle ce qui est, pour
