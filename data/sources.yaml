    jeux:
      - id: info_retraite_referentiel
        titre: Répertoire général des carrières uniques (RGCU) — documentation
        url: https://www.info-retraite.fr/
        acces: document
        statut_integration: a_faire
        note: >-
          Le RGCU n'est pas ouvert au public. L'import individuel se fait via
          le relevé de carrière que l'usager télécharge lui-même
          (voir scripts/import_releve_carriere.py).

  msa:
