          l'écart est la masse des bonifications que l'action 37 cherchait.
          DEUX : la subvention rapportée aux pensions servies, 2012-2023, pour
          la SNCF (0,60 à 0,64) et la RATP (0,58 à 0,62), les cotisations
          reçues de la RATP, et pour les marins la subvention 2026 contre
          la dépense de pensions — le taux d'ÉQUILIBRE que
          `contribution_employeur_public.csv` laisse dehors par convention.
          TROIS : le schéma de financement en vigueur depuis le 1er janvier
          2025 — la CNAV équilibre les régimes fermés (3° de l'article
          L. 134-3 CSS) et l'État la compense par crédits budgétaires (8° de
          l'article L. 241-3) —, que `structure_financement.csv`, sur le
          millésime COR de juin 2024, ne connaît pas. Aussi, un point par
          régime : cotisants, pensionnés, pension moyenne, âge moyen de
          départ, pour les mines, la SEITA, l'Opéra, la Comédie-Française et
          les gérants de débits de tabac. Le document de mission reprend les
          trois programmes mot pour mot.

  erafp:
    nom: Établissement de retraite additionnelle de la fonction publique
    role: >-
      RAFP — régime par points obligatoire assis sur les primes.
      Traité hors comptes notionnels (compartiment capitalisation).
    jeux:
      - id: erafp_parametres
        titre: Valeurs d'acquisition et de service du point RAFP, 2005-2026
        url: https://media.rafp.fr/s3fs-public/2024-02/RAFP-Evolution-valeurs-point.pdf
        acces: document
        statut_integration: automatise
        cible: data/reference/regimes/valeurs_point.csv
        recuperation: scripts/fetch/erafp_valeurs_point.py
        note: >-
          « La valeur d'acquisition et la valeur de service du point RAFP sont
          fixées chaque année par le conseil d'administration de l'ERAFP » : le
          document le dit lui-même, et c'est ce qui en fait le producteur. Ces
          valeurs venaient d'OpenFisca-France-Pension, transcription plafonnée
          à `haute` ; elles passent à `certifiee` et sortent de la couverture
          d'OpenFisca, comme celles de l'Ircantec et de l'Agirc-Arrco.
          DEUX TROUVAILLES. La transcription répétait en 2021 la valeur
          d'acquisition de 2020 — 1,2452 € au lieu de 1,2502 €, soit 0,4 % de
          points achetés en trop cette année-là. Et elle s'arrêtait à 2021 quand
          l'établissement publie jusqu'en 2026 : les années manquantes étaient
          prolongées par les prix, alors que la valeur de service a monté de
          5,7 % en 2023 et de 6,8 % en 2024.
          Le contrôle est celui du document : il publie en regard de chaque
          valeur son évolution, que le récupérateur recalcule et exige à deux
          dixièmes de point près. C'est ainsi que l'erreur de 2021 s'est vue.
          Une année à deux valeurs — 2016, dont la valeur de service change au
          1er avril — est rendue par la seconde, la règle du dépôt retenant la
          valeur en vigueur au 31 décembre.

      - id: erafp_pilotage_technique
        titre: Le pilotage technique du Régime — hypothèses de provisionnement
        url: https://www.rafp.fr/connaitre/pilotage-technique-du-regime
        acces: page
        statut_integration: controle
        millesime: 2026
        note: >-
          Aucune valeur du modèle n'en sort. Elle CONTRÔLE la borne haute des
          frais du pilier capitalisé (`opef_rapport_annuel`) : le seul régime
          français obligatoire en capitalisation provisionne ses engagements
          « en anticipant des frais futurs de gestion d'au moins 0,2 % des
          encours ». C'est une hypothèse de prudence de l'établissement, pas
          un coût constaté, et elle vaut le quart des 0,76 % du fonds en euros
          du PER. Lu le 20 septembre 2026.

  ircantec:
    nom: Ircantec
    role: Retraite complémentaire des agents non titulaires du public.
    jeux:
      - id: ircantec_points
        titre: Historique des valeurs du point Ircantec
        url: https://www.ircantec.retraites.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/complementaires_prive.yaml

      - id: ircantec_annexes_baremes
        titre: >-
          Annexes de barème de la base documentaire Ircantec — taux de
          cotisation (annexe 4-4), taux théoriques et salaire de référence
          (annexe 8-1)
        url: https://baseircantec.retraites.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/complementaires_prive.yaml
        note: >-
          La base documentaire que la Caisse des dépôts tient pour les
          gestionnaires du régime, à côté des deux CSV de
          `scripts/fetch/cdc_ircantec.py`. Ses annexes portent ce que les CSV
          n'ont pas : la part de l'AGENT et celle de l'EMPLOYEUR dans chaque
          taux, à chaque date d'effet depuis 1925, et les taux théoriques
          depuis 1935. Lues le 22 septembre 2026, elles ont soldé la
          convention de répartition que la fiche reportait sur toute la série
          — juste sur la tranche A, fausse sur la tranche B avant 2017. Elles
          donnent aussi le salaire de référence de 2023 et de 2024, que les
          CSV s'arrêtent avant de publier : à verser dans
          `valeurs_point.csv` par un récupérateur, ce qui suppose de lire le
          PDF (le dépôt sait le faire, `scripts/fetch/lecture_pdf.py`) et
          d'ajouter le recontrôle qui les certifie.

  regimes_speciaux:
    nom: Caisses des régimes spéciaux (CPRPSNCF, CRPRATP, CNIEG, ENIM, CRPCEN, Banque de France, Opéra, Comédie-Française…)
    role: Paramètres propres à chaque régime spécial, y compris régimes fermés.
    jeux:
      - id: rs_cprpsncf
        titre: Règlement du régime spécial SNCF
        url: https://www.cprpf.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/sncf.yaml
        note: >-
          LA CAISSE A CHANGÉ DE NOM DE DOMAINE, et c'est ce qui la faisait
          passer pour injoignable : `cprpsncf.fr` ne se résout plus, et le
          serveur le disait depuis le début — le certificat qu'il sert porte
          `cprpf.fr`. Joint le 22 septembre 2026. La fiche `sncf.yaml` est la
          première que l'action 94 désigne à relire : elle majore l'âge de
          référence de cinq ans comme le faisait celle des IEG, où la version
          en vigueur dit trois depuis 2025.
      - id: rs_crpratp
        titre: Règlement du régime spécial RATP
        url: https://www.crpratp.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/ratp.yaml
      - id: rs_cnieg
        titre: Régime des industries électriques et gazières
        url: https://www.cnieg.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/ieg.yaml
      - id: rs_enim
        titre: Établissement national des invalides de la marine
        url: https://www.enim.eu/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/marins.yaml

  urssaf:
    nom: Urssaf Caisse nationale
    role: >-
      Plafond de la Sécurité sociale, taux de cotisation en vigueur,
      séries historiques d'assiettes.
    jeux:
      - id: urssaf_pss
        titre: Plafond annuel de la Sécurité sociale — série historique
        url: https://www.urssaf.fr/accueil/outils-documentation/taux-baremes/plafonds-securite-sociale.html
        acces: fichier
        statut_integration: saisi
        cible: data/reference/macro/plafond_securite_sociale.csv
        note: >-
          Source primaire des plafonds anciens, mais non diffusée en accès
          machine : le portail open data de l'Urssaf ne publie aucun jeu
          « plafond ». En attendant, les valeurs de 1931 à 2001 viennent de la
          transcription OpenFisca (openfisca_plafond), au niveau `haute`.
      - id: urssaf_taux
        titre: Taux de cotisations du régime général
        url: https://www.urssaf.fr/accueil/outils-documentation/taux-baremes.html
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/taux_cotisation.csv
      - id: urssaf_masse_salariale
        titre: Masse salariale trimestrielle du secteur privé, France entière
        url: https://open.urssaf.fr/explore/dataset/masse-salariale-du-secteur-prive-france-entiere/
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/masse_salariale_privee.csv
        note: >-
          L'ASSIETTE DÉPLAFONNÉE, et c'est le producteur qui le dit : « la masse
          salariale correspond à l'assiette déplafonnée des cotisations
          sociales », champ secteur privé, régime général, France entière,
          depuis 1997. Série labellisée par l'Autorité de la statistique
          publique (avis du 14 avril 2020, JORF n° 0095 du 18 avril 2020).
          C'est elle qui permet de chiffrer ce que l'on cotise SANS RIEN
          ACQUÉRIR — la cotisation vieillesse déplafonnée de L. 241-3 CSS
          n'ouvre aucun droit et porte pourtant sur la totalité de la
          rémunération. Ne pas la confondre avec `salaires_bruts` de
          `assiette_activite.csv`, qui est l'ensemble de l'économie au sens des
          comptes nationaux : 726 Md€ ici contre environ 1 050 là en 2024.
          `scripts/fetch/urssaf_masse_salariale.py` pagine le jeu trimestriel
          et ne garde que les années complètes, dans l'estimation stabilisée à
          T+60 jours ; les années qu'un trimestre laisse à l'estimation précoce
          ne sont pas certifiées.
      - id: urssaf_open_data
        titre: Open data Urssaf — le reste du portail
        url: https://open.urssaf.fr/
        acces: api
        statut_integration: a_faire

  legifrance:
    nom: Légifrance / Journal officiel
    role: >-
      Texte des lois et décrets fondateurs et modificatifs (1930, 1941, 1945,
      1971, 1982, 1993, 2003, 2010, 2014, 2023…). Source primaire des
      paramètres législatifs historiques.
    jeux:
      - id: legifrance_textes
        titre: Textes fondateurs et réformes des retraites
        url: https://www.legifrance.gouv.fr/
        acces: document
        blocage: refus
        statut_integration: saisi
        cible: data/reference/legislation/reformes.yaml
        note: >-
          Le fichier cible a longtemps été déclaré sans exister : les
          réformes vivaient dans les notes des fiches. Il existe depuis la
          campagne « règles à travers l'histoire » : une entrée par réforme,
          avec sa date d'effet, son identifiant LEGI quand l'index le porte,
          les régimes qu'elle touche et les drapeaux qui l'absorbent ;
          `tests/test_donnees.py` impose que chaque fiche la coupe, l'absorbe
          ou la déclare non appliquée.
          Portent aussi les tables par génération de
          `data/reference/legislation/` qu'aucun numéro d'article ne rassemble :
          l'âge d'annulation de la décote (loi du 9 novembre 2010), le nombre
          d'années retenues au salaire annuel moyen (article R. 351-29), les
          trimestres accordés au titre des enfants (loi du 31 décembre 1971,
          loi du 3 janvier 1975, articles L. 12 b et L. 12 bis du code des
          pensions), et les générations 1934-1957 de la durée requise, fixées
          par des décrets de montée en charge non codifiés. Saisies depuis les textes, donc au
          niveau `haute` : Légifrance refuse les requêtes automatisées et son
          API demande une clé. Les trois autres tables — âge d'ouverture, durée
          requise des générations 1958 et suivantes, coefficient de minoration —
          ne sont plus ici : elles sont certifiées contre la base LEGI, voir
          dila_legi_parametres_retraite.

      - id: legifrance_frontiere_contributive
        titre: Les déplacements datés de la frontière contributive
        url: https://www.legifrance.gouv.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/legislation/frontiere_contributive.yaml
        note: >-
          Comme les pivots des fiches de régime, ce n'est pas une donnée
          chiffrée mais une carte : une entrée par déplacement de la frontière
          entre le cotisé et le gratuit, avec sa date, sa face — ce que l'assuré
          acquiert sans cotiser, ce qu'il verse sans acquérir, qui paie la
          charge — et l'identifiant de la VERSION d'article qui en fait foi.
          `scripts/frontiere_contributive.py --verifier` rouvre l'index LEGI et
          confronte chaque identifiant à ce que le dump porte : le bon article,
          la bonne date d'entrée en vigueur, ou de fin quand c'est la
          disparition d'une version qui fait l'événement. L'ossature vient de
          l'article L. 135-2, que le législateur a révisé trente-sept fois de
          1994 à 2025 et qui est la seule liste légale de ce qui n'est pas
          cotisé — abrogée au 1er janvier 2026, reprise par L. 222-2-1.
          Voir `docs/frontiere_contributive.md`.

      - id: legifrance_pivots
        titre: Articles pivots des fiches de régime, lus dans l'index LEGI
        url: https://www.legifrance.gouv.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/pivots.yaml
        note: >-
          Pour chaque régime calculé, les articles de code ou de décret dont
          les versions datées portent ses paramètres. Ce n'est pas une
          donnée chiffrée mais une carte : `scripts/calendrier_regimes.py`
          lit dans l'index LEGI du dépôt le calendrier des versions de chaque
          pivot — identifiant, début et fin de validité, chaîne jointive ou
          trouée — et le confronte aux périodes de la fiche. Les régimes sans
          texte dans LEGI (accords Agirc-Arrco, règlements de caisse, textes
          d'avant 1947) portent la raison à la place.

      - id: legifrance_inventaire_regimes
        titre: Inventaire des régimes de retraite obligatoires, actuels et disparus
        url: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000048031379
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/inventaire.yaml
        note: >-
          La liste de TOUS les régimes — ceux que le catalogue calcule et ceux
          qu'il ne calcule pas encore, ou jamais —, ancrée sur les textes qui
          les énumèrent : l'article R. 711-1 du code de la sécurité sociale
          pour les régimes spéciaux, D. 643-1 pour les sections des professions
          libérales, L. 921-1 et L. 921-4 pour les complémentaires obligatoires,
          le programme 195 des lois de finances pour les régimes fermés que
          l'État finance. Chaque ligne cite son texte fondateur avec, quand
          l'index DILA du dépôt le porte, son identifiant LEGI ou JORF ; les
          textes d'avant 1947 et les règlements hors JORF restent sans
          identifiant. Ce qui est d'outre-mer ou des assemblées y est « à
          modéliser » par décision, non par oubli. `tests/test_donnees.py`
          impose que l'inventaire et le catalogue coïncident sur les régimes
          calculés.

      - id: circulaire_rsi_conversion_rci
        titre: >-
          Circulaire RSI 2013/004 du 17 janvier 2013 — reprise des points par le
          régime complémentaire des indépendants
        url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_rsi_2013_004_17012013.pdf
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/conversions_points.csv
        note: >-
          Le coefficient de reprise des points d'artisan par le RCI, que le
          dépôt devait jusqu'ici deviner ou ignorer. La circulaire cite
          l'article 8 du règlement RCI et donne le calcul en toutes lettres :
          « le rapport entre, d'une part, la valeur la plus haute du point
          cotisé RCO artisan au 31 décembre 2012 (celle appliquée pour les
          points cotisés de la période postérieure au 31 décembre 1996) et,
          d'autre part, la valeur du point NRCO commerçant au 31 décembre
          2012 […] soit 0,32284 / 1,162 = 0,277831325 arrondi à 0,2778 ».
          DEUX CHOSES S'Y RÈGLENT D'UN COUP. Le coefficient lui-même ; et le
          choix de colonne du récupérateur des barèmes IPP, puisque la valeur
          que la circulaire retient est celle du millésime postérieur à 1996,
          exactement celle que `ipp_points_independants` verse comme valeur de
          service du régime. Les points du NRCO commerçant, eux, sont repris un
          pour un : leur valeur est le dénominateur du quotient.

      - id: legifrance_cnracl_montee_en_charge
        titre: Montée en charge de la contribution employeur CNRACL, 2025-2028
        url: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000051070354
        acces: document
        blocage: refus
        statut_integration: saisi
        cible: data/reference/legislation/contribution_employeur_public.csv
        recuperation: scripts/fetch/contribution_employeur_public.py
        note: >-
          Le décret n° 2025-86 du 30 janvier 2025 réécrit le premier alinéa du
          II de l'article 5 du décret n° 91-613 du 28 juin 1991 et PROGRAMME
          quatre marches de trois points : 34,65 % au 1er janvier 2025, puis
          37,65 %, 40,65 % et 43,65 %. La transcription d'OpenFisca ne porte que
          la première ; les trois autres étaient donc ignorées, et le modèle
          prolongeait le taux de 2025 au niveau `estimee` — c'est-à-dire qu'il
          ne voyait pas une hausse déjà publiée au Journal officiel.
          Saisies depuis le texte, ni transcrites par un tiers ni recoupées :
          niveau `moyenne`, comme le taux d'appel Agirc-Arrco. Elles sont
          portées par la constante COMPLEMENTS du récupérateur, qui refuse un
          complément recouvrant une année déjà transcrite — le décret programme
          l'avenir, il ne réécrit pas le passé.

      - id: dila_legi_minimum_contributif
        titre: Minimum contributif, minimum majoré et plafond d'écrêtement
        url: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
        acces: api
        statut_integration: certifie
        cible: data/reference/legislation/minimum_contributif.csv
        recuperation: scripts/fetch/dila_legi_minimum_contributif.py
        note: >-
          Articles D. 351-2-1 (les deux montants) et D. 173-21-0-0-1 (le
          plafond de l'article L. 173-2) du code de la sécurité sociale. Ce
          manifeste a longtemps tenu ces montants pour introuvables hors des
          circulaires CNAV : c'était la même erreur que pour la MSA, la donnée
          est dans la loi et il fallait chercher par le numéro d'article.
          Ce sont des ANCRES DATÉES, non des séries : le code n'est pas modifié
          chaque année, les montants sont revalorisés par l'effet de la loi —
          sur le SMIC depuis février 2014 pour le plafond, depuis la réforme du
          14 avril 2023 pour les deux minima. Le modèle fait cette
          revalorisation, et elle retombe sur les montants publiés par les
          caisses à 0,03 % près.

      - id: dila_legi_parametres_retraite
        titre: Âge d'ouverture, durée requise, coefficient de minoration,
          proratisation, assiette du trimestre et années du salaire de référence
        url: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
        acces: api
        statut_integration: certifie
        cible: data/reference/legislation/age_ouverture_requis.csv
        recuperation: scripts/fetch/dila_legi_parametres_retraite.py
        note: >-
          Articles D. 161-2-1-9 (âge d'ouverture des droits), L. 161-17-3
          (durée d'assurance requise) et R. 351-27 (coefficient de minoration)
          du code de la sécurité sociale, plus L. 351-1-1 et D. 351-1-1 pour
          les bornes de la carrière longue. Troisième usage de la recherche par
          NUMÉRO d'article dans le dump LEGI, après la RCO agricole et le
          minimum contributif, et le premier à porter sur des tableaux : ces
          articles énumèrent leurs valeurs génération par génération, en
          toutes lettres et en clauses de bornes (« nés avant le 1er juillet
          1951 », « à compter du 1er janvier 1968 »). Le récupérateur en
          reconstitue la table année de naissance par année de naissance, en
          appliquant les versions successives de l'article dans l'ordre
          chronologique — sans quoi la table de 2011 recouvrirait celle de
          2023 — et en attribuant une génération coupée en cours d'année à la
          valeur qui en couvre le plus de mois.
          La confrontation n'a corrigé AUCUNE des trente-cinq valeurs saisies à
          la main : elles étaient exactes. Ce qu'elle apporte n'est pas une
          correction mais une preuve, et cent trente-cinq générations que la
          saisie laissait implicites. Alimente aussi
          data/reference/legislation/duree_assurance_requise.csv et
          coefficient_minoration.csv.
          TROIS ARTICLES DE PLUS, POUR TROIS TABLES QU'ON N'ÉTAIT PAS ALLÉ
          CHERCHER. Le II de l'article R. 351-6 porte la durée maximale prise en
          compte par la PRORATISATION — « 152 trimestres pour les assurés nés en
          1944 » —, qui n'est pas la durée requise pour le taux plein et que le
          modèle a confondue avec elle. L'article R. 351-9 porte l'assiette d'un
          trimestre, en heures de SMIC : 200 depuis 1972, 150 depuis 2014. Sept
          valeurs de plus, toutes retrouvées identiques à la saisie. La ligne
          1948 de la proratisation reste hors certification : l'article s'arrête
          à 1947 et renvoie ensuite à la durée requise.
          L'article R. 351-29-1 porte la troisième : le nombre d'années retenues
          au salaire annuel moyen, génération par génération — « Vingt et une
          années pour l'assuré né en 1944 » —, avec sa cible au I, « les durées
          de vingt-cinq années […] applicables aux assurés nés après 1947 ».
          Seize valeurs, elles aussi identiques à la saisie.
          Lu dans l'index LEGI du dépôt, en une minute, comme toutes les
          passes LEGI depuis le 17 septembre 2026 ; `--dump` garde le dump.

      - id: dila_legi_smic
        titre: SMIC horaire, décrets de relèvement, 1997-2017
        url: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/smic_horaire.csv
        recuperation: scripts/fetch/dila_legi_smic.py
        note: >-
          Le SMIC n'est pas fixé par un article de code mais par un décret
          annuel — « A compter du 1er juillet 1997 […] le montant du salaire
          minimum de croissance est porté à 39,43 F de l'heure en métropole » —,
          et la base LEGI les garde. Il n'entre dans le modèle qu'à un endroit,
          mais cet endroit décide de la décote : un trimestre s'acquiert en
          ayant cotisé sur 150 fois le SMIC horaire depuis 2014, 200 fois avant.
          Vingt années passent de la transcription au Journal officiel, toutes
          identiques à la saisie. TROIS TROUS SONT MESURÉS PLUTÔT QUE COMBLÉS :
          l'avant-1997, que la base ne porte pas ; 2002, dont l'arrondi en euros
          (6,67 € et non la conversion 6,6651 €) vient d'un texte de conversion
          absent ; et l'après-2017, les décrets récents n'étant pas entrés dans
          la base des textes consolidés. Le récupérateur écarte une année dont
          le décret a plus de 365 jours, l'article L. 3231-5 imposant un
          relèvement au moins annuel.
          Attention à la date : celle du décret n'est pas celle de son effet, et
          Mayotte a ses propres décrets dans le même dump.

      - id: jorf_smic_releves
        titre: SMIC horaire, relèvements en cours d'année (arrêté du 22 mai 2026)
        url: https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000054126589
        acces: page
        statut_integration: saisi
        cible: data/reference/macro/smic_horaire_releves.csv
        note: >-
          Le barème du 1er janvier valide les trimestres de l'année ; un
          relèvement en cours d'année ne le change pas, mais il fixe le point
          de départ de la projection, un SMIC ne baissant pas. Ajouté le
          23 septembre 2026 pour le relèvement automatique du 1er juin 2026 —
          12,31 € de l'heure, 2,4 % au titre de l'article L. 3231-5 du code du
          travail —, que le modèle ignorait. Lu dans l'index JORF du dépôt :
          l'article 1 de l'arrêté (JORFARTI000054126607) porte le SMIC « à
          12,31 € l'heure » à compter du 1er juin 2026. L'index LEGI ne
          consolide pas les textes du SMIC postérieurs à 2017, et aucun script
          ne relit la ligne : niveau `haute`.

