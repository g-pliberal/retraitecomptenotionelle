        miroir: https://www.assemblee-nationale.fr/dyn/contenu/visualisation/1088020/file/PAP2026_BG_Regimes_sociaux_retraite_RB.pdf
        sha256: 3f673606e28fe9a530871be43208818953cdc8edd392eb2c0e11e15d2f537307
        recuperation: scripts/fetch/pap_plf_2026.py
        statut_integration: automatise
        cible: >-
          data/reference/regimes/pap_regimes_subventionnes.csv,
          data/reference/legislation/avantages_non_contributifs.yaml
        note: >-
          Lus le 20 septembre 2026, apportés par l'utilisateur ; mêmes
          conditions de saisie que le jaune. Trois choses que le dépôt n'avait
          nulle part. UN : le programme 198 publie, de 2012 à 2023, les
          années validées ET cotisées du flux de nouveaux pensionnés de la
