      - id: sre_jaune_pensions
        titre: >-
          Rapport sur les pensions de retraite de la fonction publique, annexe
          au projet de loi de finances (« jaune budgétaire »)
        url: https://www.budget.gouv.fr/documentation/file-download/31546
        acces: document
        blocage: refus
        fichier_local: 12-Jaune2026_Pensions.pdf
        miroir: https://questions.assemblee-nationale.fr/dyn/contenu/visualisation/1090002/file/12-Jaune2026_Pensions.pdf
        sha256: cbe526b93e2038aed8b04edcbbdca5c947b6260f6e24538900d4d36b2010bbf2
        recuperation: scripts/fetch/sre_jaune_pensions.py
        statut_integration: certifie
        cible: >-
          data/reference/legislation/bonifications_jaune.csv,
          data/reference/legislation/avantages_non_contributifs.yaml
        note: >-
          LE SEUL DOCUMENT PUBLIC QUI DÉNOMBRE LES BONIFICATIONS DE SERVICE, et
          il a fallu le chercher : le rapport annuel du Service des retraites de
          l'État, qu'on croyait les porter, est un rapport d'activité et n'en
          dit rien.

          Trois tableaux servent ici. Le A-7 donne, pour les pensions EN
          PAIEMENT en 2024 — un stock, donc —, le nombre de bénéficiaires et la
          durée moyenne en trimestres de six bonifications, séparément pour les
          pensions civiles et militaires de l'État et pour la CNRACL. Le 50
          donne, sur le FLUX des liquidants de 2023, la proportion de
          bénéficiaires, le gain en trimestres et surtout LE GAIN SUR LE MONTANT
          MENSUEL DE LA PENSION, en euros — la seule valorisation publiée de ces
          dispositifs. Le B-1 donne les caractéristiques du flux.

          LE FICHIER NE SE TÉLÉCHARGE PAS DEPUIS UNE SESSION : budget.gouv.fr
          refuse les adresses de sortie du proxy, page comme fichier, curl comme
          navigateur (voir `docs/outillage_interface.md`). Mais l'annexe est
          déposée au Parlement et l'Assemblée nationale sert le même fichier,
          octet pour octet : c'est le `miroir` ci-dessus, avec son empreinte.
          Les valeurs avaient été SAISIES à la lecture du document, apporté
          par l'utilisateur ; `scripts/fetch/sre_jaune_pensions.py` lit
          désormais les tableaux A-7, 50 et B-1 dans le document lui-même
          (le lecteur PDF du dépôt a dû apprendre ses flux d'objets et ses
          polices à un octet par code), et `--confronter` retrouve dans ces
          tableaux chacun des chiffres cités par les notes du fichier cible —
          trente-neuf sur trente-neuf au 20 septembre 2026. Elles restent
          `saisi` : la confrontation prouve la saisie, elle ne la remplace
          pas par une valeur lue, faute d'un champ structuré dans la cible.
          Elles portent leur numéro de tableau pour qu'un lecteur retrouve
          chacune.

          Millésime : le fichier s'appelle `Jaune2026_Pensions…` et ses données
          vont jusqu'aux pensions en paiement en 2024, ce qui en fait l'annexe
          au PLF 2026 ; l'en-tête courant de ses pages porte pourtant encore
          « PLF 2025 ». L'édition du PLF 2012, seule accessible en ligne hors de
          budget.gouv.fr, est sur data.gouv.fr sous « PLF2012-Jaune-Données » ;
          c'est elle qui avait servi d'abord, avec des chiffres de 2010.

      - id: sre_historique_taux
        titre: Historique des taux de cotisations appelés par le CAS « Pensions »
        url: https://retraitesdeletat.gouv.fr/files/files/Professionnels/CAS/Fiches/Historique%20taux%20cotisations.pdf
        acces: api
        statut_integration: certifie
        cible: data/reference/legislation/contribution_employeur_public.csv
        recuperation: scripts/fetch/contribution_employeur_public.py
        note: >-
          La fiche du SERVICE QUI APPELLE la cotisation : quatorze colonnes, une
          par situation d'emploi, du 1er janvier 2006 au 1er janvier 2026. Le
          modèle en retient la contribution employeur de l'État pour un agent
          civil — 49,90 % en 2006, 74,28 % de 2013 à 2024, 78,28 % en 2025,
          82,28 % en 2026 (décret n° 2025-1341 du 26 décembre 2025). Source
          primaire, donc certifiable ; le récupérateur la recoupe en outre
          contre la transcription OpenFisca des mêmes décrets. Les taux
          militaires (126,07 %) et ceux des employeurs d'accueil ne sont pas
          repris : le modèle ne distingue pas les corps.

      - id: sre_minimum_garanti
        titre: Montant du minimum garanti, article L. 17 du code des pensions
        url: https://retraitesdeletat.gouv.fr/actif/le-calcul-de-ma-retraite/le-minimum-garanti
        acces: document
        statut_integration: saisi
        cible: data/reference/legislation/minimum_garanti_montants.csv
        note: >-
          Le montant PLEIN du minimum garanti, celui d'une carrière de quarante
          ans de services : 997,96 € par mois au 1er janvier 2004, date à
          laquelle l'article gèle sa référence, puis 1 174,33 € en 2020,
          1 248,33 € en 2023, 1 325,01 € en 2024 et 1 354,16 € en 2025. Ces
          montants SERVIS priment sur toute projection, comme ceux du minimum
          contributif et pour la même raison : la revalorisation des pensions à
          laquelle renvoie l'article a été gelée en 2014 et sous-indexée
          depuis, si bien qu'une projection sur les prix dépasse de 4,6 % ce qui
          a été payé en 2024. Transcriptions de publications, non confrontées à
          un fichier du producteur : niveau `haute`.

  caisse_des_depots:
    nom: Caisse des dépôts (gestionnaire CNRACL, Ircantec, RAFP, FSPOEIE)
    role: Régimes de la fonction publique territoriale et hospitalière, régimes gérés.
    jeux:
      - id: cdc_cnracl
        titre: Paramètres et statistiques CNRACL
        url: https://www.cnracl.retraites.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/cnracl.yaml
      - id: cdc_ircantec_baremes
        titre: Barèmes de l'Ircantec — valeur du point, salaire de référence, taux d'appel
        url: https://politiques-sociales.caissedesdepots.fr/sites/default/files/IRC_BAR_02_ValPt_SalRef.csv
        complement_url: https://politiques-sociales.caissedesdepots.fr/sites/default/files/IRC_BAR_01_txcotis.csv
        acces: api
        statut_integration: certifie
        cible: data/reference/regimes/valeurs_point.csv
        recuperation: scripts/fetch/cdc_ircantec.py
        note: >-
          Deux CSV publiés par le gestionnaire du régime, couvrant 1971-2021.
          Source PRIMAIRE, donc certifiable : elle l'emporte sur la
          transcription OpenFisca, qui ne couvre plus que 2022 et les régimes
          prédécesseurs IPACTE et IGRANTE.

      - id: juris_cnracl_taux
        titre: >-
          CNRACL, documentation juridique — « Cotisations, historique des taux
          applicables » (retenue de l'agent et contribution de l'employeur,
          depuis le 19 septembre 1947)
        url: https://www.juris-cnracl.retraites.fr/cotisations/taux-de-cotisations/cotisations-historique-des-taux-applicables
        acces: api
        statut_integration: certifie
        cible: data/reference/legislation/contribution_employeur_public.csv
        recuperation: scripts/fetch/juris_cnracl_taux.py
        note: >-
          La base que la Caisse des dépôts tient pour les employeurs
          territoriaux et hospitaliers, et qu'elle destine à la gestion : elle
          GÈRE le régime, c'est donc une source primaire. Son tableau de
          quarante-neuf périodes a relevé au niveau `certifiee` les quarante
          années de contribution employeur qu'OpenFisca ne pouvait que
          transcrire ; les trois sources — le texte lu dans LEGI, ce tableau et
          la transcription tierce — s'accordent sur les soixante-dix-neuf
          années, au centième de point près. Elle porte aussi la RETENUE de
          l'agent, qui confirme la fiche du régime sans y rien changer, et dix
          années dont le taux a bougé en cours de route, que la convention
          annuelle du dépôt ne peut pas rendre.

      - id: cdc_open_data
        titre: Open data de la Caisse des dépôts — retraites
        url: https://opendata.caissedesdepots.fr/
        acces: api
        statut_integration: a_faire
        note: >-
          Quatre-vingt-sept jeux, tous des effectifs de cotisants et de
          retraités : aucun barème.

  dss:
    nom: Direction de la Sécurité sociale
    role: >-
      Comptes de la Sécurité sociale, taux de cotisation historiques,
      annexes PLFSS.
    jeux:
      - id: dss_comptes_secu
        titre: Rapports de la Commission des comptes de la Sécurité sociale
        url: https://www.securite-sociale.fr/accueil/rapports-et-statistiques
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/taux_cotisation.csv
      - id: dss_ccss_impots_retraite
        titre: >-
          Rapports à la Commission des comptes de la Sécurité sociale — les
          impôts de la retraite assis sur une rémunération (taxe sur les
          salaires et forfait social, section CNAV)
        url: https://www.securite-sociale.fr/home/la-secu-en-detail/comptes-statistiques-et-etudes-de-la-sécurité-sociale/rapports-a-la-commission-des-comptes-de-la-securite-sociale.html
        acces: api
        statut_integration: certifie
        recuperation: scripts/fetch/ccss_impots_retraite.py
        cible: data/reference/macro/impots_retraite_remuneration.csv
        millesime: rapports de mai 2020 à mai 2026
        note: >-
          Le poste « impôts et taxes affectés » du compte du COR est un
          agrégat, et la proposition du Parti libéral ne le reconduit pas.
          Rendre aux salaires la moitié de ce qu'elle n'encaisse plus suppose
          de savoir ce qui, dans ce poste, est PRÉLEVÉ SUR UNE RÉMUNÉRATION.
          Le droit en désigne deux : la taxe sur les salaires, dont l'article
          L. 131-8, 1° du code de la sécurité sociale verse 58,35 % à la
          branche vieillesse, et le forfait social, dont l'article L. 241-3,
          1° donne le produit entier à l'assurance vieillesse. Cette série
          porte ce que la CNAV encaisse de chacun, lu dans la fiche
          « contributions sociales et recettes fiscales brutes » du rapport,
          qui ventile ces recettes par affectataire. La lecture suit les
          SECTIONS du tableau : « taxe sur les salaires » y figure une fois
          par branche, et prendre la première ligne donnerait la part de la
          branche maladie. La série commence en 2019 parce que le fonds de
          solidarité vieillesse recevait jusque-là sa propre fraction de ces
          deux impôts ; depuis le 1er janvier 2019, l'article L. 135-3 ne lui
          laisse que de la CSG, et la section CNAV porte donc tout. Même
          règle de millésime que les transferts : un rapport n'est retenu que
          pour ses comptes arrêtés, et le premier qui arrête une année
          l'emporte.
      - id: dss_ccss_transferts_retraite
        titre: >-
          Rapports à la Commission des comptes de la Sécurité sociale — ce que
          la CNAF et l'Unédic versent à la retraite (fiches CNAF, Agirc-Arrco,
          Ircantec)
        url: https://www.securite-sociale.fr/home/la-secu-en-detail/comptes-statistiques-et-etudes-de-la-sécurité-sociale/rapports-a-la-commission-des-comptes-de-la-securite-sociale.html
        acces: api
        statut_integration: certifie
        recuperation: scripts/fetch/ccss_transferts_retraite.py
        cible: data/reference/macro/transferts_retraite.csv
        millesime: rapports de septembre 2013 à mai 2026
        note: >-
          La ventilation du poste « transferts d'organismes extérieurs » du
          compte du COR, lue du côté de celui qui PAIE. La fiche de la CNAF
          distingue la prise en charge de cotisations au titre de l'AVPF et les
          majorations de pension pour enfants ; les fiches de l'Agirc-Arrco
          (Agirc et Arrco séparément avant 2019) et de l'Ircantec portent les
          points des chômeurs que l'Unédic paie. Le critère 1 du manifeste
          désigne la CNAF et l'Unédic comme producteurs ; la DSS, qui
          consolide leurs comptes dans son rapport, est le repreneur le mieux
          placé, et les valeurs entrent au niveau `haute`. Le COR ventile le
          même poste pour la dernière année de chaque rapport depuis 2023 :
          son « dont Unédic » est EXACTEMENT la somme des deux lignes de la
          CCSS, son « dont CNAF » s'en écarte de quelques pour cent dans un
          sens ou dans l'autre, consolidé du côté des régimes qui reçoivent ;
          scripts/verifier_donnees.py confronte les deux. Un rapport n'est
          retenu que pour ses comptes ARRÊTÉS, les années antérieures à sa
          parution, et le premier qui arrête une année l'emporte ; les rapports de
          2007 à 2012 sont chiffrés et ceux de 2004 à 2006 compressent leurs
          objets, que le lecteur PDF du dépôt n'ouvre pas : la série commence
          en 2011. Le site présente une chaîne de certificats que le niveau
          de sécurité par défaut d'OpenSSL refuse ; le récupérateur abaisse ce
          niveau sans rien désactiver de la vérification.

  cour_des_comptes:
    nom: Cour des comptes
    role: Rapports sur les régimes de retraite, régimes spéciaux, équilibre financier.
    jeux:
      - id: cdc_rapports_retraites
        titre: Rapports publics thématiques sur les retraites
        url: https://www.ccomptes.fr/fr/recherche?search=retraites
        acces: document
        blocage: reseau
        statut_integration: saisi
        note: >-
          `ccomptes.fr` ferme la connexion avant toute réponse depuis une
          session du dépôt — `curl` rend « Recv failure: Connection reset by
          peer », vérifié le 22 septembre 2026 sur la racine comme sur la page
          de recherche. Ce n'est pas un refus poli qu'un navigateur
          contournerait : rien ne répond. Un POSTE ORDINAIRE, lui, le joint
          sans rien de particulier — 200 sur la page de recherche comme sur
          les PDF, le même jour : le blocage est du côté de l'environnement
          où le dépôt est construit, et tout rapport de la Cour s'apporte
          donc comme `cdc_successions_2024` l'a été. Les rapports déjà en
          table sont saisis depuis leur lecture ailleurs.

      - id: cdc_successions_2024
        titre: >-
          Les droits de succession, rapport public thématique de septembre 2024
        url: https://www.ccomptes.fr/fr/publications/les-droits-de-succession
        document: https://www.ccomptes.fr/sites/default/files/2024-09/20240925-Droits-de-succession%C2%A0_1.pdf
        acces: document
        blocage: reseau
        fichier_local: cdc_droits_succession_2024.pdf
        sha256: f32e42b18788f6ef760f4f2e6b30b27ee71cf73ac655cb6f861c274168f11384
        statut_integration: a_faire
        note: >-
          Le rapport donne la distribution des SUCCESSIONS DÉCLARÉES, actif net
          par tranche. C'est le recoupement d'ensemble que l'action 47 de la
          feuille de route attend pour la reprise de la garantie vieillesse :
          le dépôt calcule aujourd'hui la couverture d'une avance sur le
          patrimoine des MÉNAGES retraités, jamais sur ce que les successions
          portent réellement. LE DOCUMENT EST LÀ : 92 pages, apporté le
          22 septembre 2026 depuis un poste ordinaire, qui joint `ccomptes.fr`
          sans un mot — le blocage était bien la machine, pas la source. La
          Cour publie à côté les données de ses graphiques
          (`20240925-donnees-Droits-de-succession .zip`, dix-huit CSV, déposé
          sous `cdc_droits_succession_2024_donnees.zip`) : `T9`, `Source T10`
          et `Source T14` sont les tableaux à lire d'abord. Reste à écrire le
          lecteur, et le blocage reste `reseau` tant qu'une session ne joint
          pas l'hôte.

      - id: ccomptes_retraites_fpe_2026
        titre: >-
          Les retraites des fonctionnaires de l'État, communication à la
          commission des finances de l'Assemblée nationale (article 58-2 de la
          LOLF), 22 septembre 2026
        url: https://www.ccomptes.fr/fr/publications/les-retraites-des-fonctionnaires-de-letat
        document: https://www.ccomptes.fr/sites/default/files/2026-09/20260922-Retraites-fonctionnaires-de-l-Etat.pdf
        acces: document
        sha256: 3d0a439f5bdf86ad8a6fe8409123573fa16c89b274b9662482dd00c5178e41db
        statut_integration: controle
        note: >-
          Cent dix-huit pages, lues en entier le 23 septembre 2026 depuis une
          session de bureau, qui a joint `ccomptes.fr` sans difficulté ; les
          données de ses vingt-six graphiques sont publiées à côté
          (`Open-data-58-2-Retraites-FPE.zip`, empreinte 10d8ac5b…be9c). Le
          rapport n'alimente aucune valeur : il en CONTRÔLE, et il a fait
          corriger le scénario 1. (1) Son tableau n° 20 (annexe
          n° 3) donne la durée requise des emplois classés génération par
          génération ; il a démenti la lecture que le dépôt faisait du « a) »
          du XXIV de la loi de 2023, et c'est la seconde phrase du III de
          L. 13 qui manquait : un droit ouvert avant soixante ans se voit
          opposer la durée de la génération qui a soixante ans cette année-là
          (`duree_requise_avant_soixante_ans.csv`, neuf lignes rejouées dans
          `exemples_officiels.yaml`). (2) Il rappelle que la RAFP ne retient
          les primes que dans la limite de 20 % du traitement indiciaire —
          l'article 2 du décret n° 2004-569 depuis 2004 —, que l'action 119
          de la feuille de route a appliqué le même jour
          (`plafond_primes_traitement`). Ce qu'il CONFIRME :
          le minimum garanti de 2026 (1 366,35 € par mois), le point d'indice
          (4,923 € depuis juillet 2023), les taux de contribution employeur de
          l'État de 2006 à 2026, la retenue de 7,85 % en 2010, 9,54 % en 2015
          et 11,10 % depuis 2020, le minimum contributif majoré de 2026
          (903,9 €). Deux écarts expliqués sans correction : son graphique
          n° 23 donne 58,47 % pour l'État en 2009, moyenne de l'année, quand
          le dépôt porte le taux appelé au 1er janvier (60,14 %, ramené à
          40,14 % en décembre selon la note 3 du jaune pensions 2026, qui fait
          de même pour 2013 : 44,28 % en décembre, 71,78 % en moyenne, que la
          Cour ne reprend pas) ; et le plafond d'écrêtement du minimum
          contributif qu'il cite, 1 410,89 €, est celui du 1er janvier 2026,
          quand le dépôt porte celui du 1er juin (1 444,89 €, circulaire Cnav
          2026/16). Le reste du rapport — la décomposition du taux de
          contribution de l'État en 44,1 % (civils) et 51,2 % (militaires),
          l'espérance de vie à 65 ans par catégorie, la part des primes, les
          effectifs — est versé à l'action 120 de la feuille de route.

  progedo_adisp:
    nom: Progedo — Archives de données issues de la statistique publique (ADISP)
    role: >-
      Diffusion des fichiers individuels des enquêtes de la statistique
      publique aux chercheurs et aux enseignants.
    jeux:
      - id: adisp_histoire_de_vie_patrimoine
        titre: >-
          Enquête Histoire de vie et Patrimoine (INSEE), fichier standard
        url: https://data.progedo.fr/
        acces: fichier
        blocage: convention
        statut_integration: a_faire
        note: >-
          LE FICHIER QUI LÈVERAIT LA DERNIÈRE HYPOTHÈSE DE L'ACTION 47. Le
          patrimoine des retraités selon leur PENSION n'est publié nulle part :
          le dépôt cale une log-normale sur les deux moments que le COR publie
          pour les ménages retraités, et en tire la part d'une avance qu'une
          succession couvre. Le fichier individuel donnerait, par personne de
          65 ans et plus, la pension et le patrimoine net du ménage — donc la
          couverture par tranche de pension, et le poids des couples.
          Le catalogue répond depuis une session (200 le 22 septembre 2026),
          le fichier non : il se commande sur inscription, à des fins de
          recherche ou d'enseignement. Rien à déposer dans `data/brut/` — un
          fichier individuel d'enquête n'entre pas dans un dépôt public ; ce
          qui entrerait est la TABLE AGRÉGÉE qu'un script en tirerait, avec ce
          script. À vérifier au dictionnaire des variables que le montant
          individuel des pensions y figure.

  agirc_arrco:
    nom: Agirc-Arrco
    role: >-
      Retraite complémentaire des salariés du privé — valeurs d'achat et de
      service du point, taux d'appel, historique Agirc / Arrco / Ircantec.
    jeux:
      - id: agirc_arrco_points
        titre: Historique des valeurs du point Agirc, Arrco et Agirc-Arrco
        url: https://www.agirc-arrco.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/valeurs_point.csv
        note: >-
          Source primaire, publiée en circulaires et en pages web, jamais en
          série exploitable. La transcription machine est celle d'OpenFisca
          (openfisca_points), reprise au niveau `haute`.

      - id: agirc_arrco_valeurs_point
        titre: Valeurs de service et d'achat du point — régime unifié 2019-2026,
          Agirc 1947-2018, Arrco 1999-2018, UNIRS 1961-1998
        url: https://www.agirc-arrco.fr/storage/2024/10/Compilation_valeurs_de_point_novembre_2025.pdf
        acces: document
        statut_integration: automatise
        cible: data/reference/regimes/valeurs_point.csv
        recuperation: scripts/fetch/agirc_arrco_valeurs_point.py
        note: >-
          La fédération publie elle-même l'historique complet de ses deux
          barèmes : c'est le PRODUCTEUR de la donnée, là où le dépôt se
          contentait de la transcription d'OpenFisca, plafonnée à `haute`. Les
          valeurs de 2019 à 2025 passent donc à `certifiee`, et les lignes
          correspondantes sont retirées de la couverture d'OpenFisca comme de
          celle de l'INSEE — qui n'est pas davantage productrice de ces barèmes.
          Même règle que pour l'Ircantec, dont les barèmes viennent de la Caisse
          des dépôts qui la gère.
          La transcription était en outre en retard : elle s'arrête à 2025,
          quand la fédération publie déjà la valeur d'achat de 2026 (20,1877 €,
          gelée). Faute de ce barème, les cotisations de 2026 retombaient sur le
          rendement instantané, et la valeur de service était prolongée PAR LES
          PRIX — 1,46378 €, soit une revalorisation de +1,75 % que personne n'a
          décidée, là où la fédération publie un gel à 1,4386 € jusqu'au
          1er novembre 2026. Mesuré : −1,72 % sur la pension Agirc-Arrco et
          −0,59 % sur le total d'une liquidation en 2026.
          DEUX NIVEAUX. La valeur d'achat est publiée par année civile : celle
          de 2026 est arrêtée. La valeur de service l'est par date d'effet, au
          1er novembre, et la règle du dépôt retient celle du 31 décembre :
          celle de 2026 est donc reconduite au niveau `haute`, la décision de
          novembre pouvant encore la déplacer.
          PÉRIMÈTRE, ÉLARGI AUX TABLES D'AVANT LA FUSION. Cette note disait que
          les barèmes de l'Agirc et de l'Arrco d'avant 2019 « figurent dans le
          même document sous une présentation différente, et restent transcrits
          d'OpenFisca ». La présentation diffère en effet — une ligne par année,
          une ou deux valeurs de point selon que le barème a bougé en cours
          d'année, des francs jusqu'en 2001 et des anciens francs jusqu'en
          1959 — mais ce n'est pas une raison de préférer une transcription au
          producteur. Sont donc lues aussi : l'Agirc de 1947 à 2018, l'Arrco de
          1999 à 2018, et l'UNIRS de 1961 à 1998, la caisse dont le barème tient
          lieu de point Arrco avant l'unification. Ces 260 valeurs confirment la
          transcription à 5 · 10⁻⁵ € près, l'écart tenant à l'arrondi de la
          conversion en euros. Deux contrôles autorisent la lecture, tous deux
          fondés sur ce que le document publie en regard de chaque valeur : son
          évolution en pourcentage, recalculée depuis les valeurs lues et
          exigée à un dixième de point près — y compris au passage de l'ancien
          franc au nouveau, en 1960.
          Ce que la source ne donne pas : l'Arrco d'avant 1961, et la série
          reconstituée du salaire de référence Arrco depuis 1948, qui ne porte
          pas la valeur de service correspondante.

      - id: agirc_arrco_majorations_familiales
        titre: Majoration pour enfants nés ou élevés, par période d'acquisition des points
        url: https://www.legifrance.gouv.fr/conv_coll/id/KALIARTI000036731850/?idConteneur=KALICONT000046709421
        acces: document
        statut_integration: saisi
        cible: data/reference/legislation/majoration_enfants_points.csv
        note: >-
          Article 94 de l'accord national interprofessionnel du 17 novembre 2017,
          lu sur Légifrance le 23 septembre 2026, et le dépliant de la fédération
          « Décrypter la majoration pour enfants » (mars 2025), dont l'exemple
          chiffré est rejoué par un test. Le taux dépend de l'année d'ACQUISITION
          de chaque point et du régime qui l'a inscrit : 10 à 30 % pour l'Arrco
          d'avant 1999 si le règlement de la caisse la prévoyait, 5 % pour
          l'Arrco de 1999 à 2011, 8 à 24 % pour l'Agirc d'avant 2012, 10 %
          depuis. Le modèle servait 10 % à tous les points.

      - id: agirc_arrco_coefficients
        titre: Coefficients d'anticipation et plafond des majorations familiales
        url: https://www.agirc-arrco.fr/storage/2024/10/Coefficients-de-minorations-AA.pdf
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/complementaires_prive.yaml
        note: >-
          Le régime n'applique pas la décote du régime de base : il publie deux
          tables de coefficients d'anticipation — l'une indexée sur les
          trimestres manquants (0,99 à 0,78 de un à vingt), l'autre sur l'âge
          (1 à 0,43 pour dix ans) — et retient la plus avantageuse. Les deux
          descendent par paliers réguliers : un point de pourcentage par
          trimestre jusqu'à douze, un point et quart jusqu'à vingt, un point
          trois quarts au-delà. C'est cette régularité qui est portée dans le
          moteur, plutôt que quarante lignes de barème.
          Le plafond en euros de la majoration pour enfants — 2 367 € par an
          pour les pensions servies depuis le 1er novembre 2025, revalorisé
          comme la valeur de service du point, opposable aux seuls assurés nés
          à compter du 2 août 1951 — vient des mêmes publications.

  assemblee_nationale:
    nom: Assemblée nationale
    role: >-
      Réponses ministérielles aux questions écrites. Source de dernier recours,
      mais officielle, quand un montant n'est publié nulle part en série.
    jeux:
      - id: an_question_ecrite_mico
        titre: Question écrite n° 32630 — montants du minimum contributif en 2020
        url: https://www.assemblee-nationale.fr/dyn/15/questions/QANR5L15QE32630.pdf
        acces: document
        statut_integration: saisi
        cible: data/reference/legislation/minimum_contributif.csv
        note: >-
          « Le montant du minimum contributif s'élève en 2020 à 642,93 euros
          pour une carrière complète. Celui-ci est majoré à 702,55 euros
          lorsque l'intéressé justifie d'une durée d'assurance de plus de
          120 trimestres. […] le minimum contributif ne peut pas porter la
          somme des pensions au-dessus d'un certain montant, soit
          1 191,57 euros. »
          Ces trois montants sont ce que les caisses ont RÉELLEMENT SERVI cette
          année-là. Ils priment sur toute projection depuis les ancres du code :
          la réforme de 2023 ayant relevé le minimum majoré de plus de 30 %,
          ramener sa valeur en arrière surestimait 2020 de 7,6 %.

  union_retraite:
