        recuperation: scripts/fetch/drees_distribution_pensions.py
        cible: data/reference/macro/distribution_pensions.csv
        note: >-
          L'EIR apparie tous les quatre ans les fichiers de toutes les caisses
          sur un même échantillon d'individus : c'est la seule source française
          qui publie la RÉPARTITION des pensions individuelles, par tranches de
          cent euros, et non la seule moyenne d'un régime. Le classeur porte
          huit tableaux ; on lit le premier — pension mensuelle BRUTE de DROIT
          DIRECT —, le seul qui soit dans la même grandeur que la pension du
          modèle. Une réserve sans remède dans cette source : il comprend la
          majoration pour trois enfants, que les scénarios notionnels ne servent
          pas. Elle sert à chiffrer la garantie vieillesse du scénario 6, qui est
