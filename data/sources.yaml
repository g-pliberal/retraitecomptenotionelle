  cnav:
    nom: Caisse nationale d'assurance vieillesse
    role: Régime général — paramètres, barèmes, statistiques.
    jeux:
      - id: cnav_montants_minimum
        titre: Montants servis du minimum contributif et du plafond, 2024-2026
        url: https://www.legislation.lassuranceretraite.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/legislation/minimum_contributif.csv
        note: >-
          Montants mensuels en vigueur au 31 décembre de chaque année, tels que
          publiés et relayés : 733,03 € puis 747,69 € et 756,29 € pour le
          minimum, 876,13 € puis 893,39 € et 903,93 € pour le majoré, plafond
          d'écrêtement 1 394,86 € puis 1 444,89 €. Transcription, donc `haute`
          et jamais `certifiee` — mais préférée à une projection, parce qu'elle
          dit ce qui a été payé. Le montant de 2023 n'est pas repris ici : le
          code le porte déjà, au centime près.

      - id: cnav_baremes_rci
        titre: Prix et valeur du point RCI, 2024-2026, dans la base de législation
        url: https://legislation.lassuranceretraite.fr/#/bareme?file_leaf_ref=rci_valeur_point_bar.aspx
        acces: api
        statut_integration: automatise
        cible: data/reference/regimes/valeurs_point.csv
        recuperation: scripts/fetch/cnav_baremes_rci.py
        note: >-
          Deux barèmes, servis en HTML par l'API publique du site :
          rci_valeur_achat_point_bar et rci_valeur_point_bar. Ils prolongent
          la transcription d'OpenFisca, qui s'arrête en 2023 ; faute d'elles,
          le modèle achetait les points RCI au rendement de 2013 (6,74 %), soit
          9 % de trop en 2026. Transcription des décisions du CPSTI, donc
          `haute`. Les années 2013-2023 y concordent avec OpenFisca au millième.

      - id: cnav_revalorisation_salaires
        titre: Coefficients de revalorisation des salaires portés au compte, dix colonnes 2017-2026
        url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2025_29_22122025.pdf
        acces: document
        statut_integration: automatise
        cible: data/reference/legislation/revalorisation_salaires.csv
        recuperation: scripts/fetch/cnav_revalorisation_salaires.py
        note: >-
          Le salaire annuel moyen du régime général est la moyenne des N
          MEILLEURES années, et « meilleures » se juge sur des salaires
          REVALORISÉS : ces coefficients commandent donc à la fois le montant
          retenu et le CHOIX des années. La circulaire annuelle de revalorisation
          les publie en entier, une ligne par année de perception — c'est la
          caisse qui les applique qui les publie.
          Le modèle les approchait par « les salaires jusqu'en 1986, les prix
          depuis », ce qui SUR-revalorise les salaires anciens de 12,1 % sur
          1970-2018 et de 13,6 % sur 1980-2018.
          Le dépôt a d'abord repris la table cumulée d'OpenFisca-France-Pension,
          faute d'avoir cherché plus haut. Confrontée à la circulaire du
          9 janvier 2023, elle s'en écarte de −3 % à −5,5 % sur toutes les
          perceptions postérieures à 1990 — il lui manque la revalorisation
          exceptionnelle de 4 % du 1er juillet 2022 — et de −17 % à +10 %, sans
          régularité, sur les années 1949-1962. Une seconde implémentation est
          une contre-expertise, pas une source.
          DIX COLONNES sont conservées, d'octobre 2017 à janvier 2026. Le
          coefficient entre deux années se lit dans une colonne, par rapport de
          deux de ses valeurs, parce que l'arrêté annuel applique un coefficient
          unique à tous les salaires déjà portés au compte. Une colonne
          suffirait donc en théorie ; en pratique la caisse arrondit sa table à
          trois décimales et repart chaque année de la précédente, si bien que
          la reconstruction dérive avec la distance — 0,02 % à deux ans, 0,16 %
          à sept. Le modèle sert donc la colonne de l'année quand elle existe et
          ancre sinon sur la plus proche, ce qui divise la dérive par dix.
          Les colonnes dont la date d'effet n'est pas le 1er janvier — octobre
          2017, juillet 2022 — ne sont jamais servies telles quelles : le modèle
          raisonne à l'année. Elles restent des ancres, leur date s'annulant
          dans le rapport.
          Le récupérateur recoupe chaque colonne contre chacune des autres à
          chaque exécution et refuse d'écrire si l'une s'écarte de plus de 1 % ;
          il refuse aussi une circulaire qui se déclare annulée et remplacée —
          la 2020-5 l'est par la 2020-9. Les colonnes sont figées dans
          tests/temoins/cnav_revalorisation_salaires.json, et deux tests les
          opposent au modèle.
          Fiabilité `haute`, jamais `certifiee` : la circulaire est la
          publication de la caisse, non le Journal officiel — elle transcrit
          l'arrêté et l'instruction interministérielle qu'elle cite.
          Hors de la plage — perceptions antérieures à 1930, liquidations
          postérieures à la dernière colonne — le modèle ancre sur la borne
          connue et prolonge par son approximation. Avant 2017, aucune
          circulaire n'est accessible en ligne : la dérive de la reconstruction
          y est invérifiable.

      - id: cnav_revalorisation_pensions
        titre: Coefficients de revalorisation des pensions servies, date d'effet par date d'effet, 1949-2026
        url: https://legislation.lassuranceretraite.fr/#/bareme?file_leaf_ref=revalorisation_coefficient_revalorisation_retraite_bar.aspx
        acces: api
        statut_integration: automatise
        cible: data/reference/legislation/revalorisation_pensions.csv
        recuperation: scripts/fetch/cnav_revalorisation_pensions.py
        note: >-
          Ce qu'une pension DÉJÀ LIQUIDÉE a reçu depuis son départ : le barème
          « Coefficients de revalorisation des retraites » de la base de
          législation de la caisse, servi par la même API publique que
          `cnav_baremes_rci`, lu le 23 septembre 2026. Une ligne par date
          d'effet depuis le 1er janvier 1949, avec le texte qui l'a fixée. Les
          années sans revalorisation n'ont pas de ligne — 2014, 2016, 2018 —, et
          c'est exact ; 2020 en a cinq, selon le montant total brut mensuel des
          retraites de décembre 2019 (loi n° 2019-1446, art. 81, relue dans
          l'index JORF). Le simulateur en fait la pension d'AUJOURD'HUI d'un
          retraité, au lieu de sa pension de départ ramenée par les prix.
          Fiabilité `haute`, jamais `certifiee`, pour la raison de
          `cnav_revalorisation_salaires` : la caisse transcrit l'arrêté, la loi
          de financement ou l'instruction interministérielle. Là où le droit
          confond les deux coefficients, le barème recoupe la colonne des
          salaires portés au compte (tests/test_revalorisation.py).

      - id: cnav_baremes
        titre: Barèmes et paramètres du régime général (circulaires)
        url: https://legislation.lassuranceretraite.fr/
        acces: document
        statut_integration: saisi
        note: >-
          L'ADRESSE A CHANGÉ, et c'est ce qui faisait passer le site pour
          injoignable. `legislation.cnav.fr` ne se résout plus en DNS — ni
          depuis une session, ni depuis un poste ordinaire, vérifié le
          22 septembre 2026 : ce n'était pas un blocage réseau mais un nom
          d'hôte mort. La législation de la caisse est servie par
          `legislation.lassuranceretraite.fr`, que
          `scripts/fetch/cnav_revalorisation_salaires.py` interrogeait déjà
          pour les circulaires de revalorisation.
        cible: data/reference/regimes/regime_general.yaml
      - id: cnav_statistiques
        titre: Statistiques et open data CNAV
        url: https://www.statistiques-recherche.lassuranceretraite.fr/
        acces: fichier
        statut_integration: a_faire
        note: >-
          Même correction d'adresse que `cnav_baremes` :
          `statistiques-recherches.cnav.fr` ne se résout plus, et le site est
          servi par `statistiques-recherche.lassuranceretraite.fr` — au
          singulier —, que `cnav_comptes_notionnels_2009` citait déjà sans que
          personne fasse le rapprochement. Joint le 22 septembre 2026.

      - id: cnav_comptes_notionnels_2009
        titre: >-
          Albert & Oliveau, « Simulations des effets du passage du calcul des
          pensions au régime général à un système en comptes notionnels »
          (modèle PRISME), novembre 2009
        url: https://www.statistiques-recherche.lassuranceretraite.fr/app/uploads/2009/11/simulations-effets-passage-calcul-pensions-rg-a-systeme-en-comptes-notionnels_evolution.pdf
        acces: document
        statut_integration: controle
        millesime: novembre 2009
        note: >-
          LE SEUL TRAVAIL FRANÇAIS PUBLIÉ QUI FASSE LA MÊME OPÉRATION QUE CE
          DÉPÔT : convertir des carrières réelles en capital notionnel, et
          publier tous ses paramètres. Présenté au COR le 24 juin 2009, il a
          nourri le 7e rapport (`cor_septieme_rapport`). Montants en euros 2004,
          régime général seul. Il n'alimente aucune valeur d'ici.
          CE QU'IL CONTRÔLE, en trois points.
          1. LA TABLE DE MORTALITÉ. La CNAV calcule ses coefficients sur des
          tables TRANSVERSALES et écrit elle-même ce que cela coûte : la
          mortalité de PRISME suit des tables longitudinales plus favorables,
          « les pensions sont par conséquent plus élevées que celles qui
          permettraient d'épuiser le capital notionnel ». C'est exactement le
          biais que le §5 de `methodologie.md` évite en lisant une table de
          GÉNÉRATION, constaté par un praticien sur son propre calcul.
          2. LA TABLE UNISEXE. Elle l'est aussi (« hommes et femmes
          confondus »), comme le défaut du dépôt.
          3. LE POIDS DE CE QUE NOS NEUTRALISATIONS RETIRENT. La CNAV, elle,
          CONSERVE les droits non contributifs et les convertit en cotisations
          fictives ; son tableau 2.1 en donne la part dans le total porté au
          compte : hommes 16 % en 2020 et 13 % en 2050, femmes 36 % et 31 %
          (chômage 6 %, maladie 4 à 5 %, AVPF 9 à 10 % pour les femmes, MDA 5 à
          7 %, minimum contributif 3 % puis 1 % chez les hommes et 7 % puis 1 %
          chez les femmes, avantages complémentaires 3 %). C'est la mesure
          externe de ce que le §6 supprime, et de son asymétrie entre les sexes.
          SES ÉCARTS AVEC LE DÉPÔT, ASSUMÉS : taux constant de 16,65 % sous
          plafond et 1,7 % au-dessus là où le dépôt lit les taux réels de chaque
          régime ; capital indexé sur prix + 1,7 % et pension sur les prix, là
          où le dépôt revalorise l'un et l'autre au même taux ; transition par
          prorata des générations 1952 à 1961 et non par gel des droits acquis.
          SES RÉSULTATS, pour mémoire : masses de prestations inférieures de
          12,8 Md€ soit 7 % en 2050 (hommes −10,5 %, femmes −3,4 %), besoin de
          financement de 36 Md€ contre 49 Md€, et surtout — les hommes dont la
          pension baisse partent à 60 ans, ceux dont elle monte à 65. Le
          diviseur qui sanctionne le départ précoce, mesuré sur une population
          réelle.

  sre:
    nom: Service des retraites de l'État
    role: Fonction publique d'État — pensions civiles et militaires.
    jeux:
      - id: sre_rapport_annuel
