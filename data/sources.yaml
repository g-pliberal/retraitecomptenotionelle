  drees:
    nom: Direction de la recherche, des études, de l'évaluation et des statistiques
    role: >-
      Panorama « Les retraités et les retraites », EIR/EIC, modèle TRAJECTOiRE,
      effectifs et montants de pensions par régime.
    jeux:
      - id: drees_panorama_retraites
        titre: Les retraités et les retraites (édition annuelle)
        url: https://drees.solidarites-sante.gouv.fr/publications-communique-de-presse/panoramas-de-la-drees/les-retraites-et-les-retraites
        acces: document
        statut_integration: a_faire
        note: >-
          La synthèse annuelle. Elle n'est pas la source des effectifs : le
          critère 1 fait remonter d'un cran, jusqu'aux fichiers de l'EACR et de
          l'EIR que le panorama commente et que les deux entrées suivantes
          récupèrent.
      - id: drees_eacr
        titre: Enquête annuelle auprès des caisses de retraite (EACR), fichier diffusé
        url: https://data.drees.solidarites-sante.gouv.fr/explore/dataset/donnes_eacr/
        acces: api
        statut_integration: certifie
        recuperation: scripts/fetch/drees_eacr.py
        cible: data/reference/regimes/effectifs_retraites.csv
        note: >-
          Le dénombrement exhaustif des retraités, caisse par caisse et année par
          année depuis 2004 — vingt-huit caisses, la ligne « tous régimes »
          comprise. La feuille `A-Cadrage` du classeur porte, pour chaque couple
          (année, caisse), l'effectif des bénéficiaires et le montant moyen de
          leur pension. Le champ retenu est `ddir`, les bénéficiaires d'un droit
          DIRECT : les droits dérivés sont hors du modèle, qui décrit une
          carrière et non un ménage. La DREES empile les campagnes — l'effectif
          de 2014 est publié par l'EACR 2014 puis corrigé par l'EACR 2015 —, et
          c'est le millésime le plus récent qui est retenu ; les désaccords sont
          nuls pour la moitié des couples et de 2,5 % au pire. Cette série ne
          porte AUCUNE pension : elle pondère les cas types de la page « Coût ».
      - id: drees_eir_caracteristiques
        titre: Caractéristiques des retraités (échantillon interrégimes de retraités)
        url: https://data.drees.solidarites-sante.gouv.fr/explore/dataset/3013_donnees-statistiques-sur-les-caracteristiques-des-retraites/
        acces: api
        statut_integration: certifie
        recuperation: scripts/fetch/drees_caracteristiques_retraites.py
        cible: data/reference/macro/caracteristiques_retraites.csv
        note: >-
          Le même échantillon que la distribution, au même millésime, mais un
          autre classeur : les caractéristiques des retraités PAR SEXE. Deux
          d'entre elles chiffrent ce que le déplacement uniforme de la
          distribution cachait — la part de la durée validée qui n'a pas été
          cotisée, qu'un compte notionnel ne crédite pas (26,0 % chez les
          femmes contre 10,9 % chez les hommes en 2020), et la pension de
          droit direct avec et sans les majorations pour enfants, dont l'écart
          joue à l'envers. Le classeur porte en outre les effectifs par sexe,
          que le dépôt AJUSTAIT jusque-là sur les trois colonnes de la
          distribution faute de les lire quelque part. Sa feuille
          « Naissance-Résidence » est lue aussi, depuis le 23 septembre 2026,
          et écrite dans data/reference/macro/pensions_residence.csv : les
          effectifs, les pensions moyennes et les onze quantiles des retraités
          qui résident en France et de ceux qui résident à l'étranger. La
          garantie vieillesse, qui ne sert que les premiers, s'en sert pour
          retirer les seconds de la distribution.

      - id: drees_age_conjoncturel
        titre: Âge conjoncturel moyen de départ à la retraite, selon le sexe
        url: https://data.drees.solidarites-sante.gouv.fr/explore/dataset/retraite_graphique-1-age-conjoncturel-moyen-de-depart-a-la-retraite-selon-le-se0/
        acces: api
        statut_integration: certifie
        recuperation: scripts/fetch/drees_age_conjoncturel.py
        cible: data/reference/macro/age_conjoncturel_depart.csv
        note: >-
          La figure du panorama « Les retraités et les retraites », diffusée en
          open data : 2004 à 2022, par sexe. Ce n'est PAS l'âge moyen de ceux
          qui ont liquidé dans l'année — celui-là suit la taille des
          générations qui se présentent — mais un indicateur SYNTHÉTIQUE, les
          taux de liquidation par âge de l'année appliqués à une génération
          fictive, comme un indice conjoncturel de fécondité. Il ne dépend donc
          que des comportements et des règles de l'année, et c'est ce qui le
          rend comparable à une grille de cas types, qui n'a pas de pyramide
          des âges non plus. Cette série n'entre dans aucun calcul du site :
          elle MESURE la grille, et `scripts/age_conjoncturel.py` fait la
          mesure — écart moyen de 0,08 an sur dix-neuf années, ce que
          `docs/limites.md` § 5 ter supposait sans pouvoir le chiffrer. Le jeu
          est retrouvé par son TITRE et non par son identifiant : celui-ci
          porte le numéro de la figure dans l'édition (« Graphique-1 »), qu'une
          édition suivante renumérote.
      - id: drees_age_depart_csp
        titre: >-
          Âge de départ à la retraite et conditions de fin de carrière selon la
          catégorie socioprofessionnelle
        url: https://data.drees.solidarites-sante.gouv.fr/explore/dataset/departretraite_parcsp/
        acces: api
        statut_integration: automatise
        recuperation: scripts/fetch/drees_age_depart_csp.py
        cible: data/reference/macro/age_depart_csp.csv
        note: >-
          Le même indicateur que `drees_age_conjoncturel`, ventilé par groupe
          de la nomenclature des professions et catégories
          socioprofessionnelles : 2013 à 2020, six groupes plus la ligne
          « toutes CSP confondues ». C'est le grain qui dit LEQUEL des treize
          cas types part de travers, là où le tous régimes ne juge que leur
          somme. Ce n'est PAS la même source : le tous régimes vient des
          fichiers des caisses, celui-ci de l'enquête Emploi de l'INSEE — un
          sondage, dont la DREES avertit que les indicateurs par catégorie sont
          bruités et se lisent en moyenne pluriannuelle. D'où le niveau `haute`
          et non `certifiee`, et une comparaison faite sur la moyenne 2013-2020.
          Les deux se recoupent là où ils se recouvrent : 61,3 contre 61,23 en
          2013, 62,4 contre 62,42 en 2020, ce qu'un test tient. Quatre
          indicateurs du jeu ne sont pas repris — durées en emploi et hors
          emploi entre cinquante ans et le départ, proportion de retraités à
          soixante et un ans, part de personnes limitées la première année de
          retraite : aucune page ne les demande.
      - id: drees_eir_distribution
        titre: Distribution des pensions mensuelles (échantillon interrégimes de retraités)
        url: https://data.drees.solidarites-sante.gouv.fr/explore/dataset/4178_distribution-des-pensions-mensuelles/
