          corrigé que des arrondis — dont celui de 2002, que le décret de
          bascule fixe à 5 181,75 € quand la conversion des 33 990 F donne
          5 181,74 €.
          AVANT 1996, LA CHAÎNE EST INCOMPLÈTE et la série reste transcrite :
          deux relèvements manquent au dump, celui du 1er novembre 1991 et celui
          du 1er janvier 1994, tous deux pris par un décret qui en portait deux
          d'un coup. La série qu'on en tirerait serait plate là où le point a
          monté — fausse de 1,0 % en 1992 —, et c'est la confrontation à la
          transcription, année par année, qui l'a établi.

      - id: dila_legi_duree_requise
        titre: Durée d'assurance requise, générations 1953-1957
        url: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
        acces: api
        statut_integration: certifie
        cible: data/reference/legislation/duree_assurance_requise.csv
        recuperation: scripts/fetch/dila_legi_duree_requise.py
        note: >-
          L'article L. 161-17-3 ne porte la table qu'à compter de la génération
          1958 ; celles d'avant relèvent de décrets pris sous l'ancien article
          L. 351-1. Le dépôt les tenait pour hors de portée, « textes abrogés ou
          non codifiés que la base LEGI n'expose pas sous un numéro d'article
          unique ». Ils n'ont en effet pas de numéro utile — mais ils ont une
          phrase : « […] sont fixées à 166 trimestres pour les assurés nés en
          1955 ». Quatre décrets couvrent 1953 à 1957, et leurs cinq valeurs
          sont identiques à la saisie.
          UN PIÈGE : Saint-Pierre-et-Miquelon a son propre régime et sa loi du
          17 juillet 1987 écrit sa table dans les mêmes termes, avec d'autres
          valeurs — 152 trimestres pour la génération 1956 contre 166 au régime
          général. Elle est écartée sur le nom du territoire.
          Les générations 1934 à 1952 restent transcrites : leur montée en
          charge vient des lois de 1993 et de 2003, dont les tableaux ne sont
          pas des textes consolidés séparés.

      - id: dila_legi_cnracl
        titre: Contribution employeur de la CNRACL, 1984-1988 et 1993-2028
        url: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
        acces: api
        statut_integration: certifie
        cible: data/reference/legislation/contribution_employeur_public.csv
        recuperation: scripts/fetch/dila_legi_cnracl.py
        note: >-
          Article 5 II du décret n° 91-613 du 28 juin 1991, dont la base garde
          vingt versions datées : « Le taux de la contribution sur les
          traitements […] est fixé à 31,65 % ». Trente-six valeurs quittent la
          transcription d'OpenFisca, dont les trois marches de 2026, 2027 et
          2028 que le dépôt tenait pour une saisie non recoupée — elles sont au
          Journal officiel depuis janvier 2025. Pour un agent territorial, cette
          contribution vaut trois fois sa retenue : c'est elle qui décide de ce
          que les scénarios 4 et 5 lui portent au compte.
          TROIS DIFFICULTÉS DE LECTURE. Le même article fixe d'abord la retenue
          de l'agent, puis la contribution de l'employeur, puis une contribution
          supplémentaire : seul le II est lu. Une version porte plusieurs taux,
          chacun daté par ce qui le SUIT — « 30,40 % pour l'année 2014 ; b)
          30,45 % pour l'année 2015 » —, si bien que retenir la première date
          rencontrée décale toute la table d'un cran. Enfin le décret de
          relèvement paraît fin janvier avec effet au 1er janvier quand la
          version consolidée s'ouvre au 1er février : une version ouverte avant
          le 1er mars sans autre date vaut donc pour l'année entière.
          Les taux d'avant 1993 sont dans les décrets abrogés que celui de 1991
          a remplacés, et restent transcrits.
          L'AVANT-1993 EST DANS L'ARTICLE QU'ON MODIFIAIT. Un décret modificatif
          ne porte pas le taux, il porte un remplacement — « le taux de 13 p. 100
          est remplacé par le taux de 11,20 p. 100 » ; le taux est dans l'article
          3 du décret n° 47-1846 du 19 septembre 1947, dont la base garde quinze
          versions datées au jour. MAIS LA CONTIGUÏTÉ N'EST PAS LA COMPLÉTUDE :
          quand un décret manque à la base, la version qu'il aurait coupée court
          sans coupure et la chaîne paraît pleine. La base le démontre —
          le décret n° 83-36 du 24 janvier 1983 y figure et dit remplacer
          13 p. 100, quand la version qu'il modifie se lit 18 p. 100. D'où deux
          garde-fous : une version qu'un décret contredit est refusée, et une
          version de plus de quatre ans aussi. Il en reste 1984-1988.
          Les décrets modificatifs nomment celui de 1947 par sa DATE et non par
          son numéro : chercher le seul numéro perdait le contrôle même qui rend
          la lacune démontrable.

      - id: dila_legi_contribution_employeur
        titre: >-
          Contribution employeur de la RATP, des IEG, de la SNCF d'avant 2007,
          des mines, de l'Opéra et de la Comédie-Française
        url: https://echanges.dila.gouv.fr/OPENDATA/
        acces: api
        statut_integration: certifie
        cible: data/reference/legislation/contribution_employeur_public.csv
        recuperation: scripts/fetch/dila_legi_contribution_employeur.py
        note: >-
          Six régimes que docs/limites.md rangeait sous une seule ligne — « rien
          / tout, aucune série de taux employeur publiée sous une forme
          exploitable » — et dont le Journal officiel portait la contribution.
          163 valeurs, toutes au niveau certifiee, là où la part patronale était
          celle d'un salarié du privé de la même année.
          DEUX FORMES DE TEXTE. L'ARRÊTÉ ANNUEL, pour la RATP (2007-2025,
          article 2 du décret n° 2005-1637) et les IEG (2005-2020, article 3 du
          décret n° 2005-278) : ces deux régimes ont été adossés au régime
          général, l'employeur verse ce que les mêmes salariés y coûteraient, et
          un arrêté l'arrête chaque année. C'est la mécanique de la composante
          T1 de la SNCF, et la même convention de date — le taux DÉFINITIF de
          l'exercice, non le provisionnel appelé d'avance —, à quoi s'ajoute la
          règle du texte le plus récent : l'arrêté du 23 juin 2020 ramène le
          taux 2019 de la RATP de 19,20 % à 19,18 %.
          LA VERSION DATÉE D'UN ARTICLE, pour la SNCF d'avant 2007 (28,44 %,
          II de l'article 8 du décret n° 91-613, abrogé le 29 juin 2007), les
          mines (7,75 %, article 52 du décret n° 46-2769 puis article 90 du même
          décret depuis 1993), l'Opéra et la Comédie-Française (II des articles
          6 et 7 du décret n° 91-613). Là, la règle du dépôt s'applique : le
          taux en vigueur au 1er janvier, chaque taux daté par ce qui le suit,
          comme pour la CNRACL.
          OÙ CHAQUE SÉRIE S'ARRÊTE, ET POURQUOI. La RATP n'a pas de taux avant
          2007 : elle payait les pensions sans qu'un texte en fixe un. Les IEG
          s'arrêtent en 2020 parce que le texte cesse de chiffrer — l'arrêté du
          29 décembre 2021 remplace la fixation annuelle par une formule que la
          caisse applique sans la publier, même mur que la composante T2. La
          SNCF s'arrête à 2006 : 2007 appartient déjà à la somme T1 + T2, que
          son arrêté date « pour l'année 2007 ».
          CE QUE CES TAUX LAISSENT DEHORS. Ce que verse l'EMPLOYEUR, et rien
          d'autre : les droits spécifiques que l'État finance pour la RATP
          jusqu'à 45 000 agents, les 22 % des salaires qu'il verse aux mines,
          la subvention de l'Opéra n'y sont pas. Même convention que pour la
          SNCF, dont T1 + T2 laisse dehors la subvention d'équilibre.
          L'ASSIETTE EST CELLE DE LA RETENUE dans les six cas — « 15,60 %, soit
          7,75 % à la charge des employeurs et 7,85 % à la charge des
          salariés » —, ce qui rend leur somme lisible.
          IL LIT L'INDEX ET NON LE DUMP. Le dump global de la DILA n'a pas été
          régénéré depuis juillet 2025 ; l'arrêté RATP du 13 mars 2026, qui
          porte l'année 2025, n'est que dans les incréments dont l'index publié
          par le dépôt est tenu à jour. Lire le dump serait ici plus lent ET
          moins complet.
          CE QU'ON NE PEUT PAS AFFIRMER. Que la base garde toutes les versions :
          la version de l'Opéra court vingt ans sans coupure, et rien ne prouve
          qu'aucun décret n'a été perdu. Les deux bouts de chaque chaîne, eux,
          sont tenus par un texte — le décret n° 91-159 du 12 février 1991 porte
          déjà 8,80 %, celui du 27 février 1991 déjà 28,44 %, l'article 8 est
          explicitement abrogé en 2007 et l'article 52 explicitement repris par
          l'article 90 en 1993.

      - id: dila_legi_taux_cotisation
        titre: >-
          Taux de cotisation vieillesse du régime général et des salariés
          agricoles, lus dans les articles qui les fixent
        url: https://echanges.dila.gouv.fr/OPENDATA/
        acces: api
        statut_integration: certifie
        cible: data/reference/regimes/taux_cotisation_annuels.csv
        recuperation: scripts/fetch/dila_legi_taux_cotisation.py
        note: >-
          Le compte notionnel ne connaît que la cotisation : c'est, avec le
          salaire, la seule grandeur qui détermine le capital accumulé. Cette
          série venait d'OpenFisca-France, transcription tierce plafonnée à
          haute. Elle est désormais lue dans le droit : 368 valeurs certifiées,
          régime général de 1982 à 2026 et salariés agricoles de 1980 à 2026,
          quatre mesures chacune — taux plafonné, part salariale, taux
          déplafonné, sa part. 112 corrigeaient la transcription.
          DEUX ARTICLES PAR RÉGIME. Article 2 du décret n° 81-1013 du
          13 novembre 1981 puis article D. 242-4 du code de la sécurité sociale
          depuis la codification de décembre 1985 ; article 2 du décret
          n° 50-444 du 20 avril 1950 puis article D. 741-35 du code rural depuis
          la recodification d'avril 2005.
          TROIS ÉCRITURES. LA PHRASE, qui nomme les quatre composantes et
          annonce leur total — le récupérateur refait l'addition et signale
          l'écart, ce qui a trouvé la rédaction de 2005 de D. 741-35, qui annonce
          15,15 % pour des composantes qui font 15,25 %. LE TABLEAU, depuis le
          décret du 2 juillet 2012, qui date ses lignes lui-même et porte donc
          plusieurs années dans une seule version. LE RENVOI : depuis le
          1er janvier 2014, le II de D. 741-35 renvoie à D. 242-4, et c'est lui,
          non une convention du dépôt, qui aligne les salariés agricoles sur le
          régime général — avant cette date leur employeur payait un point de
          moins, 7,20 % contre 8,20 %.
          LA RÈGLE DE DATE EST CELLE DU DÉPÔT : le taux d'une année est celui du
          1er janvier. Une version qui prend effet le 30 juillet ne commande que
          l'année suivante.
          UN TAUX QUI N'EST PAS DANS L'ARTICLE. Le décret n° 87-453 du 29 juin
          1987 a relevé la part salariale de 0,2 point du 1er juillet 1987 au
          30 juin 1988 sans réécrire D. 242-4, que le décret du 22 juin 1988 n'a
          rattrapé qu'en pérennisant la hausse. Ce décret est déclaré, sa notice
          relue à chaque exécution, et la surcharge n'est appliquée que si la
          version qui pérennise porte le même taux.
          LE GARDE-FOU. Tout décret publié depuis 1982 dont le titre porte
          « taux » et « cotisation » avec le régime général ou les assurances
          sociales agricoles, et dont le texte parle de vieillesse, doit être
          expliqué : par une version de la chaîne, par la surcharge déclarée, ou
          par une ligne qui dit pourquoi il ne touche pas à ce taux. Un décret
          qui n'entre dans aucune case arrête la certification.
          OÙ LA SÉRIE S'ARRÊTE, ET POURQUOI. Avant 1982, l'article 3 du décret
          n° 67-803 est dans la base avec ses quatre composantes, mais avec UNE
          version, du 1er octobre 1967 au 14 novembre 1981, portant 12,9 % —
          l'état de 1979 quand le taux valait 8,5 % en 1967. Le récupérateur le
          lit et le refuse par une règle écrite : un article qui n'a qu'une
          version et couvre plus de dix ans n'a pas de chronologie. Les décrets
          modificatifs sont au JORF, mais la base n'en garde avant 1990 que la
          notice, et aucune n'écrit de taux.
          IL LIT L'INDEX ET NON LE DUMP, comme dila_legi_contribution_employeur :
          la version de D. 242-4 qui porte 2026, celle du décret n° 2025-1446
          du 31 décembre 2025, n'est que dans les incréments.

      - id: dila_legi_decote_fonction_publique
        titre: Décote de la fonction publique, montée en charge 2006-2019
        url: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
