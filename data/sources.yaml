          complémentaire, publiés par la caisse elle-même — seule source qui les
          porte, la législation consolidée n'en gardant aucune trace. Diffusés
          en PDF : le récupérateur les lit avec scripts/fetch/lecture_pdf.py et
          refuse d'écrire une série qui ne serait pas monotone, faute de quoi
          une erreur de lecture passerait inaperçue.

