# Pose le repère git `phase-7` (docs/architecture.md, § 12) sur le dernier
# commit de la phase 7 de l'architecture, 17b54f3, qui porte la note de sa
# fin et sa correction (feuille de route, action 130).
#
# Le jeton d'une session Claude Code n'a pas le droit d'écrire un tag :
# `git push origin phase-7` y répond HTTP 403. Celui d'un workflow, avec
# `contents: write`, l'a. D'où ce fichier, lancé une fois puis supprimé,
# comme `repere-phase-1.yml` à `repere-phase-6.yml` avant lui. Le
# propriétaire l'a demandé le 27 septembre 2026.
#
# Le repère est un tag léger : il ne porte aucune identité, donc aucune
# adresse. S'il existe déjà, le workflow le dit et n'y touche pas.

name: Repère phase-7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repere:
    runs-on: ubuntu-latest
    steps:
      - name: Poser phase-7 sur 17b54f3
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          commit=17b54f3cbf30854935b113b5db50a801cf310eff
          # Un tag absent fait rendre à gh le message d'erreur sur la sortie
          # standard : seul son code de retour dit que le tag n'existe pas.
          if actuel=$(gh api "repos/$DEPOT/git/ref/tags/phase-7" --jq .object.sha 2>/dev/null); then
            echo "phase-7 existe déjà, sur $actuel : rien n'est touché"
          else
            gh api "repos/$DEPOT/git/refs" -f ref=refs/tags/phase-7 -f sha="$commit" --jq .object.sha
            echo "phase-7 posé sur $commit"
          fi
