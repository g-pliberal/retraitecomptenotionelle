# Construit ou met à jour l'index plein texte des bases DILA (voir
# scripts/fetch/dila_index.py) et le dépose sur la release « index-dila ».
#
# Le jeton d'une session Claude Code n'a pas le droit d'écrire les releases ;
# celui d'un workflow, avec `contents: write`, l'a. D'où ce fichier : la
# publication se fait ici, jamais depuis un poste.
#
# - Lancement à la main (onglet Actions, « Run workflow ») : par défaut,
#   récupère l'index publié et lui applique les incréments parus depuis
#   (quelques minutes). Cocher « reconstruire » pour repartir du dump global
#   (une heure et demie pour le JORF, une heure pour LEGI), ce qui est aussi
#   ce qui se passe tant qu'aucun index n'est publié.
# - Chaque lundi à 4 h UTC : la mise à jour seule.
#
# KALI, la base des conventions collectives (action 184, étape 5), suit le
# même chemin : entière, elle se construit en quelques minutes, et sa mise à
# jour la reconstruit d'elle-même quand la DILA a renouvelé son dump.
#
# Pour LEGI, l'index publié, GitHub inscrit à la liste de contrôle des textes
# les rédactions nouvelles (`scripts/textes.py --inscrire`, action 184,
# étape 4) : `scripts/publier_inscription.sh` commite sur le dernier main ce
# que l'inscription écrit, sous l'identité noreply du robot, sans forcer. Une
# poussée faite avec le jeton d'un workflow ne lance pas `tests.yml` : la
# dernière étape le lance (`actions: write`), qui refait le tableau de bord
# et les chiffres ancrés, puis joue la suite complète sur ce commit.

name: Index DILA

on:
  workflow_dispatch:
    inputs:
      reconstruire:
        description: "Reconstruire depuis le dump global de la DILA (sinon : mise à jour de l'index publié)"
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write
  actions: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        base: [jorf, legi, kali]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Récupérer et mettre à jour, ou reconstruire
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.reconstruire }}" != "true" ] \
             && python scripts/fetch/dila_index.py ${{ matrix.base }} --recuperer; then
            python scripts/fetch/dila_index.py ${{ matrix.base }} --mettre-a-jour
          else
            python scripts/fetch/dila_index.py ${{ matrix.base }}
          fi
          python scripts/fetch/dila_cherche.py ${{ matrix.base }} --etat

      - name: Publier sur la release index-dila
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch/dila_index.py ${{ matrix.base }} --publier

      - name: Installer le paquet, que l'inscription lit
        if: matrix.base == 'legi'
        run: pip install -e .

      - name: Inscrire les rédactions nouvelles à la liste des textes
        id: inscrire
        if: matrix.base == 'legi'
        env:
          COURSE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/publier_inscription.sh python scripts/textes.py --inscrire

      - name: Faire juger ce commit par la suite complète
        if: steps.inscrire.outputs.inscrit == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tests.yml --ref "$GITHUB_REF_NAME"
