# Pose le repère git `phase-2` (docs/architecture.md, § 12) sur le dernier
# commit de la phase 2 de l'architecture, 82463d5, qui porte la note de sa
# fin (feuille de route, action 130).
#
# Le jeton d'une session Claude Code n'a pas le droit d'écrire un tag :
# `git push origin phase-2` y répond HTTP 403. Celui d'un workflow, avec
# `contents: write`, l'a. D'où ce fichier, lancé une fois puis supprimé,
# comme `repere-phase-0.yml` et `repere-phase-1.yml` avant lui. Le
# propriétaire l'a demandé le 26 septembre 2026.
#
# Le repère est un tag léger : il ne porte aucune identité, donc aucune
# adresse. S'il existe déjà, le workflow le dit et n'y touche pas.

name: Repère phase-2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repere:
    runs-on: ubuntu-latest
    steps:
      - name: Poser phase-2 sur 82463d5
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          commit=82463d55a97f6a1f965a7322a3c860c846faa598
          if gh api "repos/$DEPOT/git/ref/tags/phase-2" --jq .object.sha 2>/dev/null; then
            echo "phase-2 existe déjà : rien n'est touché"
          else
            gh api "repos/$DEPOT/git/refs" -f ref=refs/tags/phase-2 -f sha="$commit" --jq .object.sha
            echo "phase-2 posé sur $commit"
          fi
