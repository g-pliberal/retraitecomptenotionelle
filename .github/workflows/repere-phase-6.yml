# Pose le repère git `phase-6` (docs/architecture.md, § 12) sur le dernier
# commit de la phase 6 de l'architecture, 49a01da, qui porte la note de sa
# fin (feuille de route, action 130).
#
# Le jeton d'une session Claude Code n'a pas le droit d'écrire un tag :
# `git push origin phase-6` y répond HTTP 403. Celui d'un workflow, avec
# `contents: write`, l'a. D'où ce fichier, lancé une fois puis supprimé,
# comme `repere-phase-1.yml` à `repere-phase-5.yml` avant lui. Le
# propriétaire l'a demandé le 27 septembre 2026.
#
# Le repère est un tag léger : il ne porte aucune identité, donc aucune
# adresse. S'il existe déjà, le workflow le dit et n'y touche pas.

name: Repère phase-6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repere:
    runs-on: ubuntu-latest
    steps:
      - name: Poser phase-6 sur 49a01da
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          commit=49a01da8f30c1ad711d364a97022e25fa47ce682
          # Un tag absent fait rendre à gh le message d'erreur sur la sortie
          # standard : seul son code de retour dit que le tag n'existe pas.
          if actuel=$(gh api "repos/$DEPOT/git/ref/tags/phase-6" --jq .object.sha 2>/dev/null); then
            echo "phase-6 existe déjà, sur $actuel : rien n'est touché"
          else
            gh api "repos/$DEPOT/git/refs" -f ref=refs/tags/phase-6 -f sha="$commit" --jq .object.sha
            echo "phase-6 posé sur $commit"
          fi
