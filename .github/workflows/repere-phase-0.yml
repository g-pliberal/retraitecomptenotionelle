# Pose le repère git `phase-0` (docs/architecture.md, § 12) sur le dernier
# commit de la phase 0 de l'architecture, dae2819.
#
# Le jeton d'une session Claude Code n'a pas le droit d'écrire un tag :
# `git push origin phase-0` y répond HTTP 403. Celui d'un workflow, avec
# `contents: write`, l'a. D'où ce fichier, lancé une fois puis supprimé,
# comme `tags-reecrits.yml` avant lui (feuille de route, action 114).
#
# Le repère est un tag léger : il ne porte aucune identité, donc aucune
# adresse. S'il existe déjà, le workflow le dit et n'y touche pas.

name: Repère phase-0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repere:
    runs-on: ubuntu-latest
    steps:
      - name: Poser phase-0 sur dae2819
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          commit=dae2819305b78d6f80fa87408c93a20ff16a46bc
          if gh api "repos/$DEPOT/git/ref/tags/phase-0" --jq .object.sha 2>/dev/null; then
            echo "phase-0 existe déjà : rien n'est touché"
          else
            gh api "repos/$DEPOT/git/refs" -f ref=refs/tags/phase-0 -f sha="$commit" --jq .object.sha
            echo "phase-0 posé sur $commit"
          fi
