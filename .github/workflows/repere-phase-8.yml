# Pose le repère git `phase-8` (docs/architecture.md, § 12) sur le dernier
# commit de la phase 8 de l'architecture, 9799ba4, qui porte la note de sa
# fin (feuille de route, action 130).
#
# Le jeton d'une session Claude Code n'a pas le droit d'écrire un tag :
# `git push origin phase-8` y répond HTTP 403. Celui d'un workflow, avec
# `contents: write`, l'a. D'où ce fichier, lancé une fois puis supprimé,
# comme `repere-phase-1.yml` à `repere-phase-7.yml` avant lui. Le
# propriétaire l'a demandé le 27 septembre 2026.
#
# Le repère est un tag léger : il ne porte aucune identité, donc aucune
# adresse. S'il existe déjà, le workflow le dit et n'y touche pas.

name: Repère phase-8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repere:
    runs-on: ubuntu-latest
    steps:
      - name: Poser phase-8 sur 9799ba4
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        run: |
          commit=9799ba43a8ab1e7849d8bd4f0d53904fe998bb41
          # Un tag absent fait rendre à gh le message d'erreur sur la sortie
          # standard : seul son code de retour dit que le tag n'existe pas.
          if actuel=$(gh api "repos/$DEPOT/git/ref/tags/phase-8" --jq .object.sha 2>/dev/null); then
            echo "phase-8 existe déjà, sur $actuel : rien n'est touché"
          else
            gh api "repos/$DEPOT/git/refs" -f ref=refs/tags/phase-8 -f sha="$commit" --jq .object.sha
            echo "phase-8 posé sur $commit"
          fi
