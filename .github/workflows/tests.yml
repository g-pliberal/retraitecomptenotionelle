# La fabrique et la suite complète, à chaque envoi sur main (action 148,
# étape 1 ; docs/architecture.md, § 10 : « Tout tourne sur GitHub à chaque
# envoi sur `main` »).
#
# Le dépôt pousse directement sur main, sans pull request (CLAUDE.md). Les
# sessions ne régénèrent plus les fichiers fabriqués avant d'envoyer, ni ne
# lancent la suite complète : c'est ici que tout se refait, sur le DERNIER
# main — non sur le commit qui a lancé la course —, dans cet ordre :
#
# 1. `scripts/regenerer.py` refait le paquet, les mesures que l'accueil cite,
#    les témoins, le chiffrage, les tableaux, le tableau de bord et les
#    chiffres ancrés de la prose ;
# 2. la suite complète, `python -m pytest`, les joue, puis la garde des
#    présomptions rejoue les tests rapides sous d'autres présomptions ;
# 3. `scripts/publier_fabrique.sh` commite, sous l'identité noreply du robot,
#    le verdict (`.github/etat_suite.yaml`, que le hook SessionStart affiche à
#    l'ouverture de chaque session) et, si la suite est verte, les fichiers
#    refaits ; puis il pousse sans jamais forcer. Si main a bougé pendant la
#    course, il ne pousse rien : la course que ce nouvel envoi a lancée refait
#    tout. Une poussée du jeton du workflow ne relance pas de course ;
# 4. une suite verte sur main, son verdict poussé, met le site en ligne
#    (action 163) : l'arbre de ce commit, déployé sur GitHub Pages par le job
#    `en_ligne`. Un envoi de session n'a pas passé la suite, et une poussée du
#    jeton du workflow ne déclenche pas de construction de Pages. Pages doit
#    publier par « GitHub Actions » (Settings → Pages) ; sinon rien ne part.
#
# Les courses se suivent une à une (`concurrency`) : celle qui attend est
# remplacée par la plus récente, qui part de toute façon du dernier main.
#
# Il se lance aussi à la main, sur n'importe quelle branche (onglet Actions,
# « Run workflow ») : il y fabrique et pousse de même, sur cette branche.

name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: tests-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      en_ligne: ${{ steps.pages.outputs.actions }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Installer le paquet et ses outils de test
        run: pip install -e '.[dev]'

      - name: Fabriquer
        id: fabriquer
        continue-on-error: true
        run: python scripts/regenerer.py

      # `shell: bash` lance l'étape sous `bash -eo pipefail` : sans lui, GitHub
      # prend `bash -e`, l'issue du tube est celle de `tee`, toujours réussie,
      # et le verdict dit vert sur une suite rouge (le 7 octobre 2026, onze
      # courses rouges publiées vertes). `tests/test_outillage.py` le tient.
      - name: La suite complète
        id: suite
        if: steps.fabriquer.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: python -m pytest -rfE 2>&1 | tee "$RUNNER_TEMP/suite.txt"

      # La garde des présomptions (action 135, levier 2) : les tests rapides,
      # une vingtaine de secondes, rejoués sous d'autres présomptions que
      # celles du vocabulaire (`tests/conftest.py`). Un test qui écrit en dur
      # une valeur présumée — le jour de naissance, l'année des enfants ou du
      # mariage — y tombe dès sa naissance. Son verdict s'écrit à part dans
      # `.github/etat_suite.yaml` : il ne retient pas les fichiers fabriqués,
      # justes si la suite est verte, mais rend la course rouge.
      - name: La garde des présomptions
        id: garde
        if: steps.fabriquer.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: PRESOMPTIONS_DECALEES=1 python -m pytest -m rapide -rfE 2>&1 | tee "$RUNNER_TEMP/garde.txt"

      - name: Publier le verdict et les fichiers fabriqués
        id: publier
        env:
          FABRICATION: ${{ steps.fabriquer.outcome }}
          SUITE: ${{ steps.suite.outcome }}
          SORTIE_SUITE: ${{ runner.temp }}/suite.txt
          GARDE: ${{ steps.garde.outcome }}
          SORTIE_GARDE: ${{ runner.temp }}/garde.txt
          COURSE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/publier_fabrique.sh

      # Le site en ligne au vert (action 163). Tant que Pages publie depuis une
      # branche, il déploie lui-même chaque envoi, et rien ne part d'ici : la
      # source se règle à la main, et ce workflow peut la précéder sans rougir.
      - name: La source de Pages
        id: pages
        if: steps.publier.outputs.en_ligne == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = workflow ]; then
            echo "actions=oui" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pages publie depuis une branche : rien déployé d'ici. Réglage : Settings → Pages → Source « GitHub Actions »."
          fi

      # L'arbre du commit publié, et lui seul : le répertoire de la course porte
      # aussi ses caches.
      - name: Le site, tel que publié
        if: steps.pages.outputs.actions == 'oui'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.actions == 'oui'
        with:
          path: ${{ runner.temp }}/site

      - name: Le verdict
        if: steps.fabriquer.outcome != 'success' || steps.suite.outcome != 'success' || steps.garde.outcome != 'success'
        run: |
          echo "::error::Rouge : voir l'étape « La suite complète », « La garde des présomptions » ou « Fabriquer »."
          exit 1

  # Une garde des présomptions rouge rend la course rouge, mais ne retient ni les
  # fichiers fabriqués ni le site : la suite est verte. D'où `!cancelled()`.
  en_ligne:
    needs: suite
    if: ${{ !cancelled() && needs.suite.outputs.en_ligne == 'oui' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
