# La liste de la clôture de l'action 161 (question 4, note de décision 0008) :
# dans chaque paire Python–JavaScript qui reste après le retrait du moteur
# Python, chaque fonction écrite des deux côtés, sous le même nom au passage
# près de `nom_long` à `nomLong`, est
#
# - gardée (`gardees`) : le fichier Python qui la lit, ni test ni jumeau du
#   moteur — ou son propre fichier, quand une fonction gardée l'appelle —, et
#   le test qui confronte ses deux exemplaires, s'il existe déjà ;
# - ou une règle du moteur (`au_moteur`), que seuls le moteur Python et des
#   tests lisent en Python : elle part avec lui.
#
# Les paires qui n'y sont pas sont celles du moteur et de la zone grise, qui
# partent ou se tranchent. `tests/test_jumeaux.py` confronte la liste au
# dépôt (`jumeaux.ecarts_de_la_liste`) : une fonction écrite des deux côtés
# sans être déclarée, une entrée périmée, un lecteur qui part ou ne la nomme
# pas, un test qui n'existe pas, rougissent. Dressée le 15 novembre 2026 par
# les noms que l'arbre syntaxique du lecteur emploie et la fermeture de ses
# imports ; le test de confrontation de chaque fonction gardée reste à écrire
# (étape suivante, `docs/feuille_de_route/161/`).

src/retraite_notionnelle/calendrier.py:
  gardees:
