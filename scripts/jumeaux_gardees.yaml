# La liste de la clôture de l'action 161 (question 4, note de décision 0008) :
# dans chaque paire Python–JavaScript qui reste après le retrait du moteur
# Python, chaque fonction écrite des deux côtés, sous le même nom au passage
# près de `nom_long` à `nomLong`, est
#
# - gardée (`gardees`) : le fichier Python qui la lit, ni test ni jumeau du
#   moteur — ou son propre fichier, quand une fonction gardée l'appelle —, et
#   et le test qui confronte ses deux exemplaires, obligatoire ;
# - ou une règle du moteur (`au_moteur`), que seuls le moteur Python et des
#   tests lisent en Python : elle part avec lui.
#
# Les paires qui n'y sont pas sont celles du moteur et de la zone grise, qui
# partent ou se tranchent. `tests/test_jumeaux.py` confronte la liste au
# dépôt (`jumeaux.ecarts_de_la_liste`) : une fonction écrite des deux côtés
# sans être déclarée, une entrée périmée, un lecteur qui part ou ne la nomme
# pas, une fonction gardée sans test, un test qui n'existe pas, rougissent. Dressée le 15 novembre 2026 par
# les noms que l'arbre syntaxique du lecteur emploie et la fermeture de ses
# imports. Le test de confrontation, `tests/test_jumeaux_au_bit.py`, éprouve
# chaque fonction gardée qui y a sa grille, au bit près, et la nomme en colonne
# `test` ; les lecteurs de `mortalite.py`, `taux.py`, `patrimoine.py` et
# `distribution.py` y ont été relus par leurs appels (étape 7b), ceux
# d'`assiette.py`, `tva.py`, `effectifs.py`, `depenses.py`, `vie_en_couple.py`
# et `caracteristiques.py` à l'étape 7c, avec ceux de `chargement.py`,
# d'`indemnite_csg.py` et de `primes.py`, ces deux-là que seul le moteur
# appelle ; ceux de `calendrier.py`, `config.py`, `macro.py`,
# `prelevements_historiques.py`, `contributions_equilibre.py`, `frontiere.py`
# et `regimes.py` à l'étape 7d ; ceux de `contexte.py`, `bilan.py` et
# `equilibre.py` à l'étape 7e, où six fonctions que leur forme empêche de
# confronter seules le sont par leur appelant, et trois de `contexte.py` par
# `tests/test_agregats.py`, qui confronte le coût calculé à la table figée
# que le portage lit.

