    depuis_rang: {lecteur: scripts/construire_donnees.py}
    en_mois: {lecteur: src/retraite_notionnelle/calendrier.py, test: tests/test_moteur.py::test_un_demi_mois_compte_le_mois_qui_suit_dans_les_deux_moteurs}
    formater_age: {lecteur: scripts/cycle_de_vie.py}
    rang: {lecteur: scripts/conservation.py}
