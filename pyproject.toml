[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retraite-notionnelle"
version = "0.1.0"
description = "Modélisation d'un système de retraite français en comptes notionnels, rétroactif depuis l'origine de la répartition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# pytest-xdist n'est pas obligatoire : sans lui la suite tourne en série, le
# greffon `pytest_parallele` s'effaçant de lui-même. Avec, elle passe de sept
# minutes à moins d'une. xlrd ne sert qu'aux récupérateurs qui lisent un
# classeur `.xls`, que la bibliothèque standard ne lit pas (action 176).
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "xlrd>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Le greffon répartit la suite complète sur les cœurs disponibles ; il se retire
# tout seul si pytest-xdist n'est pas là, ou si l'on vise un test précis.
addopts = "-p retraite_notionnelle.pytest_parallele"
