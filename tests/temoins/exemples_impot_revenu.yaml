  # -- Le plafonnement du quotient familial, BOI-IR-LIQ-20-20-20 ------------------
  # Un couple marié, quatre enfants à charge dont, le plus souvent, un invalide
  # (5,5 parts) ; 130 000 € de revenu imposable ; l'impôt dû.

  - id: bofip_plafonnement_2011
    source: BOI-IR-LIQ-20-20-20-20120912, § 40
    adresse: https://bofip.impots.gouv.fr/bofip/2494-PGP.html/identifiant%3DBOI-IR-LIQ-20-20-20-20120912
    annee: 2011
    foyer: {declarants: [{}, {}], enfants: 4, enfants_invalides: 1}
    revenu_net_imposable: 130000
    citation: >-
      Un contribuable marié ayant quatre enfants à charge dont l'un est invalide
      (5,5 parts) a, pour 2011, un revenu imposable de 130 000 € : premier terme
      : impôt correspondant à 5,5 parts : 10 835 € ; deuxième terme : impôt
      correspondant à 2 parts : 27 867 € ; réduction maximale correspondant à 7
      demi-parts supplémentaires : 14 016 € (2 336 € × 6) + 2 997 € (pour la
      demi-part correspondant à l'invalidité) = 17 013 € ; impôt avec
      plafonnement : 27 867 € - 17 013 € = 10 854 €.
    attendu: {parts: 5.5, impot_sans_plafonnement: 10835, impot_brut: 10854}

