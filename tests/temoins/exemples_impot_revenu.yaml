# Exemples chiffrés de l'impôt sur le revenu publiés par l'administration,
# rejoués par `tests/test_impot_revenu.py` contre `retraite_notionnelle/impot_revenu.py`
# ------------------------------------------------------------------------------
# Action 138, étape 5. Chaque exemple est transcrit tel que sa source l'écrit,
# avec un extrait de son texte (`citation`) ; le test construit le foyer et
# compare chaque grandeur nommée sous `attendu`, à l'euro (au franc avant 2001),
# dans la monnaie de l'année.
#
# Le foyer : `declarants`, une liste d'un ou deux déclarants (`invalide`, `age`,
# `salaires`, `pensions`), `enfants`, `enfants_invalides`, `veuf`, `vit_seul`.
# Un exemple qui part du revenu imposable le donne en `revenu_net_imposable` :
# les revenus des déclarants n'y servent pas.
#
# Les grandeurs comparées sont des champs de `ImpotDuFoyer` : `parts`,
# `revenu_net_imposable`, `impot_sans_plafonnement` (l'impôt du barème avec
# toutes les parts), `impot_brut` (après plafonnement et réduction
# complémentaire), `decote`, `reduction_sous_condition_de_revenus`,
# `impot_avant_credits` (la cotisation), `prime_pour_l_emploi`, `impot`.
#
# Un exemple que le module ne reproduit pas entre quand même, en écart connu
# (`ecart_connu`) : la valeur publiée, celle que rend le module, et pourquoi ;
# le test tient la seconde, pour qu'elle ne change pas en silence.
#
# Les tableaux de la brochure pratique, qui donnent l'impôt de milliers de
# couples revenu-parts, sont dans `brochure_impot_revenu.json`, à part.

exemples:

