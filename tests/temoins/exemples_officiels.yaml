    enonce: >-
      Au 1er janvier 2024, valeur annuelle du trimestre 94,21 € et coefficient
      de majoration des pensions 1,446 : « la liquidation en 2024 d'une pension
      de 120 trimestres sans aucun avantage autre donne ainsi une pension
