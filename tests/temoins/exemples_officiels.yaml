    carriere: {naissance: "1965-05-15", sexe: H, affiliation: medecin_liberal, liquidation: "2030-07", trimestres_valides: 175}
    attendu: {liquidation_ouverte: true, coefficients_des_regimes: {carmf_complementaire: 1.15, asv_conventionnes: 1.15, cnavpl: 1.05}}

