    carriere: {naissance: "1980-01-01", sexe: H, affiliation: fonctionnaire_etat, liquidation: "2026-01", age_debut: 35, radiation_invalidite: "2026-01", taux_invalidite: 55, traitement_mensuel: 2000, taux_de_la_pension: 0.20}
    attendu: {pension_et_rente_d_invalidite_sur_traitement: {pension: 0.2, rente: 0.0}}

  - id: sre_rente_viagere_monsieur_h
    source: {editeur: "SRE", reference: "retraitesdeletat.gouv.fr, Invalidité, La pension de retraite, « Le calcul de la pension », la rente viagère d'invalidité, exemple de Monsieur H.", verifie_le: "2026-10-01"}
    enonce: >-
      « Monsieur H. s'est vu reconnaître un taux d'invalidité de 75 %. Le taux
      de sa pension est de 60 %. Le montant du traitement de base […] est égal
      à 6 000 € » ; sa pension, 3 600 €, et sa rente dépassent ensemble le
      traitement, et l'une et l'autre sont réduites à due proportion
      (L. 30 ter) : « Pension totale : […] = 6 000 € ». Le témoin prête le
      traitement et le taux, et compare ce total, le traitement entier. Le
      partage publié, 3 185,86 € et 2 814,14 €, ne se compare pas : la page
      compte le seuil de 4 109,91 € sur la rente, 4 500 €, puis le taux une
      seconde fois, quand L. 28 le compte sur le traitement ; par le texte,
      (4 109,91 + 1 890,09 / 3) × 75 % = 3 554,96 € de rente, puis 3 018,89 €
      et 2 981,11 € après la réduction. Le modèle suit le texte, à son seuil
      près (4 099,05 €, approximation de la fiche) : 3 021,18 € et 2 978,82 €.
    carriere: {naissance: "1980-01-01", sexe: H, affiliation: fonctionnaire_etat, liquidation: "2026-01", age_debut: 25, radiation_invalidite: "2026-01", invalidite_imputable: true, taux_invalidite: 75, traitement_mensuel: 6000, taux_de_la_pension: 0.60}
    attendu: {pension_et_rente_d_invalidite_sur_traitement: {total: 1.0}}

  # ---- CLEISS, et la Cnav : les carrières hors de France ----------------
  # Les exemples du CLEISS ne donnent ni les dates ni le salaire : le témoin
  # date les périodes au mois, la carrière française finissant la veille du
  # départ, à l'âge légal quand l'exemple le dit ou le suppose, et ne compare
  # que ce que la page écrit — les trimestres, le taux, le prorata.
  - id: cleiss_lena_reglements_europeens
    source: {editeur: "CLEISS", reference: "cleiss.fr, « Votre retraite après avoir travaillé en France et dans un ou plusieurs autres Etats de l'UE/EEE ou en Suisse », exemple de Léna", verifie_le: "2026-10-01"}
    enonce: >-
      « Léna est née en 1964. Elle doit justifier de 170 trimestres pour
      obtenir le taux plein. Elle a cotisé 15 ans (60 trimestres) en France, 7
      ans (28 trimestres) en Italie et 21 ans (84 trimestres) en Norvège » :
      « Retraite française = retraite globale théorique (retraite européenne)
      x nombre de trimestres d'assurance en France rapporté à la période
      d'assurance requise pour la génération concernée = Revenu annuel moyen
      × 50 % × 170/170 × 60/170 », plus élevée que la retraite nationale, au
      taux minoré.
