# Exemples chiffrés publiés par les organismes qui appliquent les règles,
# rejoués par `tests/test_oracle.py` contre le scénario 1.
# ------------------------------------------------------------------------
# Aucun simulateur NOMINATIF n'est automatisable : « Mon estimation retraite »
# d'info-retraite.fr, le simulateur de l'Assurance retraite et l'ENSAP des
# fonctionnaires exigent FranceConnect et le relevé de carrière réel de la
# personne connectée, sans mode anonyme ni API.
#
# CETTE PHRASE DISAIT « aucun simulateur officiel », ET C'ÉTAIT FAUX. Les
# mêmes caisses publient à côté des calculettes ANONYMES, sans
# FranceConnect : `data/sources_a_explorer.yaml` en recense vingt-huit, et
# l'action 89 de la feuille de route ouvre leur dépouillement. Une d'elles a
# déjà servi — le `calcru` d'Agirc-Arrco, qui a levé un coefficient de fusion
# faux (action 100). Un simulateur anonyme est un ORACLE : on l'interroge
# autant qu'on veut, et vingt appels bien choisis rendent un barème que
# personne n'a publié. Ce fichier-ci ne porte encore aucun résultat de ce
# genre parce qu'aucune calculette n'a encore rendu une PENSION complète ;
# le jour où l'une le fera, ses réponses viendront ici comme les autres.
#
# Ce qui est officiel ET reproductible aujourd'hui, ce sont les EXEMPLES que
# ces organismes publient : une carrière minuscule dont la réponse est
# écrite par la caisse. Chacun est
# transcrit ici tel que la source l'écrit, avec sa date de vérification ; le
# test construit la carrière — une seule affiliation, un salaire constant, le
# nombre de trimestres de l'exemple — et compare la grandeur nommée.
#
# Les grandeurs comparées (`attendu`) :
#   trimestres_requis, trimestres_valides, taux_liquidation, motif_ouverture,
#   liquidation_ouverte — lus dans le résultat du scénario 1 ;
#   age_ouverture — l'âge légal opposable, par `age_ouverture_droit` ;
#   date_age_legal — le mois où cet âge est atteint (année-mois) ;
#   non_ouverte_un_trimestre_plus_tot — la même carrière liquidée trois mois
#     plus tôt doit être refusée (`motif_ouverture: non_ouverte`) ;
#   pension_base_sur_sam — pension du régime général rapportée au salaire
#     annuel moyen (taux × prorata) ;
#   pension_regime_general_mensuelle — pension du régime général après
#     minimum, en euros par mois ;
#   trimestres_de_majoration_enfants — ÉCART de durée d'assurance entre cette
#     carrière et la MÊME carrière sans enfant. La caisse publie le nombre de
#     trimestres qu'elle ajoute par enfant, jamais le total d'une carrière :
#     c'est donc l'écart qui se compare, et il ne dépend ni de l'âge d'entrée
#     ni de la durée requise de la génération. Un témoin qui l'emploie fixe
#     son `age_debut`, sans quoi les deux parcours ne partiraient pas du même
#     point ;
#   majoration_enfants_sur_pensions — majoration pour enfants servie par les
#     régimes de BASE, rapportée à leur pension. La circulaire dit que
#     l'assiette est la retraite TELLE QUE CALCULÉE : appliquer les 10 % à la
#     pension d'avant la surcote, ou d'avant la majoration de durée
#     d'assurance, rendrait ici moins que le taux publié. Jusqu'au
#     23 septembre 2026, la grandeur rapportait la majoration de TOUS les
#     régimes à toutes les pensions, Agirc-Arrco compris, dont les points
#     n'ont pas tous le même taux (accord du 17 novembre 2017, article 94).
#   coefficients_des_regimes — pour chaque régime en points nommé, le
#     coefficient d'anticipation ou de majoration que le scénario 1 applique
#     à sa pension, 1 s'il n'en applique aucun. C'est ce que les sections
#     libérales publient : leur règle d'âge, et le coefficient qu'elle rend ;
#   pensions_annuelles_des_regimes — pour chaque régime nommé, la pension
#     annuelle brute que le scénario 1 lui fait servir, à cinquante centimes
#     près. C'est ce que publie un régime dont la pension ne tient ni à un
#     taux ni à un salaire — les mines : trimestres × coefficient × valeur ;
#   dates_d_effet_de_la_reversion — pour chaque régime nommé, la date d'effet
#     (AAAA-MM-JJ) de la réversion que le décès de l'assuré ouvre à son
#     conjoint, telle que l'échéancier la liquide ;
#   deductions_annuelles_du_cumul — pour chaque régime nommé, ce que le cumul
#     emploi-retraite déduit de sa pension dans l'année de `revenus_apres_depart`,
#     à un centime près ;
#   mois_sans_pension_du_cumul — les mois (année-mois) où aucune pension de base
#     n'est due, l'activité après le départ reprise chez le dernier employeur ;
#   plafond_mensuel_du_cumul — le plafond mensuel de L. 161-22 du premier mois de
#     l'activité, à un centime près ;
#   reversions_ecretees_mensuelles — pour chaque régime nommé, la réversion
#     servie après le plafond de ressources, en euros par mois, à un
#     centime près. L'exemple donne la réversion d'avant le plafond
#     (`carriere.reversions_avant_plafond_mensuelles`) et non la carrière du
#     défunt : le test prête à chaque régime la pension qui la rend, au taux
#     de la version que le modèle choisit, et le modèle l'écrête.
#
# `carriere.trimestres_valides` demande au test de choisir l'âge d'entrée qui
# donne exactement ce nombre de trimestres à la liquidation ; `age_debut`
# l'impose. Les dates s'écrivent année-mois, et la pension prend effet le
# premier du mois. La naissance dit son jour quand l'exemple le donne
# (« 1964-05-16 ») : la pension prend effet au premier du mois qui suit
# l'anniversaire, sauf pour qui est né un 1er (R. 351-37). Un exemple qui ne le
# donne pas le laisse à la présomption, le 15 — sauf s'il part au mois même
# où il atteint l'âge qui ouvre son droit, ce que seul un assuré né un 1er
# peut faire : sa naissance s'écrit alors au 1er (« 1967-03-01 »), jour que la
# source ne dit pas mais que sa date de départ suppose (action 132).
# `naissances_enfants` date les premiers enfants, à l'année ou au mois, comme
# le formulaire ; ceux qu'elle ne date pas sont présumés nés aux trente ans de
# leur mère. `conjoint`, `conjoint_sexe`, `mariage`, `ressources_conjoint` et
# `deces` déclarent le conjoint et le décès de l'assuré comme la saisie : la
# naissance du conjoint et le décès à l'année, au mois ou au jour ; le sexe du
# conjoint, l'autre que celui de l'assuré s'il n'est pas dit ; ses ressources
# annuelles.
#
# UN EXEMPLE QUE LE MODÈLE NE REPRODUIT PAS ENTRE QUAND MÊME, à l'état
# « écart connu » (docs/architecture.md, § 9.2) : ce qu'on apprend n'est
# jamais bloqué. Il porte alors un champ de plus :
#
#   ecart_connu:
#     modele: {taux_liquidation: 0.4375}   # ce que rend le modèle, par grandeur
#     explication: >-
#       pourquoi le modèle s'écarte de la caisse, et ce qu'il faudrait changer
#     fiche: decote_regime_general         # la fiche de la carte qui le déclare
#     depuis: "2026-09-25"
#
# La fiche nommée (data/reference/regles/) n'est ni `conforme` ni
# `transcrite`, et compte l'exemple parmi ses `exemples` : l'écart est déclaré
# là où il va. Le test
# vérifie que le modèle rend la valeur déclarée pour lui. S'il rend la valeur
# publiée, l'écart est corrigé, et le champ se retire ; s'il rend autre chose,
# le résultat a changé, et seul le diff de ce fichier peut l'accepter. Un
# exemple qui passait ne devient donc pas « écart connu » en silence. Le
# tableau de bord, docs/etat.md, compte et liste ces écarts.
#
# Ce que la confrontation a trouvé, et quand, est raconté dans
# docs/limites.md, § « Ce que disent les exemples publiés par les caisses ».

exemples:

