    enonce: >-
      Né en 1964, départ avant 67 ans avec 135 trimestres cotisés (170
      exigés) : la pension ne peut être inférieure à 756,29 € +
      [(903,93 € − 756,29 €) × 135 / 170] = 873,53 € brut par mois.
      La carrière construite a 170 trimestres validés dont 135 cotisés, à un
      salaire assez bas pour que le minimum s'applique.
    carriere:
