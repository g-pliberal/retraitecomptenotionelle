    source: {editeur: "service-public.gouv.fr", reference: "fiche F19666, Retraite du salarié : qu'est-ce que la décote ?", verifie_le: "2026-01-01"}
    enonce: >-
      Né le 1er juillet 1964, départ le 1er juillet 2027 à 63 ans avec 159
      trimestres tous régimes, 170 exigés. Il manque 16 trimestres jusqu'à
      67 ans et 11 jusqu'à 170 : 11 retenus, 0,625 point par trimestre,
      taux 43,125 %.
    carriere: {naissance: "1964-07-01", sexe: H, affiliation: salarie_prive_non_cadre, liquidation: "2027-07", trimestres_valides: 159}
    attendu: {trimestres_requis: 170, taux_liquidation: 0.43125, motif_ouverture: age_legal}

