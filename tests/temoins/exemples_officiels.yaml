    carriere: {naissance: "1955-02", sexe: F, affiliation: salarie_prive_non_cadre, liquidation: "2017-03", age_debut: 20, conjoint: "1971-04-02", conjoint_sexe: H, deces: "2024-11-25"}
    attendu: {dates_d_effet_de_la_reversion: {arrco: "2026-05-01"}}

  - id: aa_reversion_annie
    source: {editeur: "Agirc-Arrco", reference: "« La pension de réversion », exemple de Paul et Annie", verifie_le: "2026-09-28"}
    enonce: >-
      Paul est décédé le 24 mai 2024. Annie, sa conjointe, a déposé sa demande
