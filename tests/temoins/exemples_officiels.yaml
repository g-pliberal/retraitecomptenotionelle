    source: {editeur: "CARMF", reference: "carmf.fr, guide « Préparez votre retraite en temps choisi », juin 2026, « Âge de départ en retraite », p. 12 et 13, exemple de départ en retraite et exemple de calcul de retraite", verifie_le: "2026-09-27"}
    enonce: >-
      Le même médecin, qui « poursuit son activité jusqu'à 65 ans » : « Chaque
