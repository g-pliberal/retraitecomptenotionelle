  # ---- Cnav, circulaire 22/83 du 16 février 1983 (taux acquis) -----------
  # Trois cas d'un même assuré, né en mars 1917, dont la pension prend effet
  # le 1er septembre 1983 : elle ne peut être inférieure à celle que donnait
  # le droit d'avant le 1er avril 1983, au taux de l'âge atteint le 31 mars,
  # 55 %. La Cnav compare les deux pensions, la nouvelle sur la durée
  # « corrigée » après soixante-cinq ans, chacune ramenée au maximum. Le
  # salaire annuel moyen de l'exemple ne se reconstruit pas ; le taux retenu,
  # et la pension rapportée à ce salaire avant le maximum, si.
  - id: cnav_22_83_taux_acquis_60_trimestres
    source: {editeur: "Cnav", reference: "circulaire n° 22/83 du 16 février 1983, point 313, exemples de calculs, 1er cas", verifie_le: "2026-09-27"}
    enonce: >-
      « Assuré né en mars 1917 - fixe l'entrée en jouissance de sa pension au
      1er septembre 1983 » ; « L'assuré totalise 60 trimestres » ;
      « Coefficient acquis au 31-3-83 : 55 % », 97 859 × 55 × 60 / (100 ×
      150) = 21 528,98 ; durée corrigée « 60 + (60 x 12,50 %) = 67,5 arrondi
      à 68 », 97 859 × 50 × 68 / (100 × 150) = 22 181,37 : « On retiendra la
      pension qui résulte des dispositions applicables à partir du 1-4-83 ».
      Taux 50 %, pension de 50 % × 68/150 du salaire annuel moyen.
    carriere: {naissance: "1917-03", sexe: H, affiliation: salarie_prive_non_cadre, liquidation: "1983-09", trimestres_valides: 60}
    attendu: {taux_liquidation: 0.5, pension_base_sur_sam: 0.22666666666666666}

