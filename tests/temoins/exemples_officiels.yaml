    source: {editeur: "Union Retraite", reference: "simulateur « Droit à la réversion », info-retraite.fr, défunt salarié du secteur privé", verifie_le: "2026-10-04", simulateur: union_retraite_reversion, saisie: "défunt salarié du privé, 700 € nets d'Agirc-Arrco ; survivante née le 15 mars 1960, seule, ressources au-dessus de 6 058 € sur trois mois et de 24 232 € sur douze"}
