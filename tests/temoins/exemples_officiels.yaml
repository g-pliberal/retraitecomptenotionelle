  # ---- ENIM (régime des marins) ------------------------------------------
  # Les deux pages que l'Établissement national des invalides de la marine
  # consacre au calcul et aux conditions d'attribution, lues le 22 septembre
  # 2026 (action 89). Le site sert une page anti-robots à `curl` et s'ouvre
  # dans Chromium. Chacune a levé une règle que le modèle n'appliquait pas,
  # et que le code des pensions de retraite des marins écrit en toutes
  # lettres : la bonification dès DEUX enfants (R. 14), l'ouverture à
  # cinquante ans pour vingt-cinq ans de services (R. 2).
  - id: enim_bonification_deux_enfants
    source: {editeur: "ENIM", reference: "enim.eu, Retraite, « Le mode de calcul », exemple en vigueur au 1er avril 2024", verifie_le: "2026-09-22"}
    enonce: >-
      Arnaud a 2 enfants et réunit 14 ans 8 mois et 27 jours de services,
