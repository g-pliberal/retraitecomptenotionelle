    source: {editeur: "Agirc-Arrco", reference: "dépliant « Décrypter la retraite complémentaire Agirc tranche C » (01/2025), tableau des coefficients d'anticipation pour âge ; table « Les coefficients de minoration applicables à la retraite complémentaire Agirc-Arrco », septembre 2026, tableaux 1 à 3", verifie_le: "2026-09-27"}
    enonce: >-
      « En cas de départ en retraite avant 67 ans, un coefficient
      d'anticipation s'applique définitivement aux points de retraite
      complémentaire tranche C acquis avant 2016 » ; « si j'ai 63 ans et 11
      mois à la date de mon départ à la retraite, le coefficient retenu est
      celui correspondant à l'âge de 63 ans et 9 mois, soit 0,8675 ». Ici un
      cadre payé au-delà de quatre plafonds, né en janvier 1962 — 169
      trimestres pour le taux plein (tableau 1) — et parti à 63 ans et 11
      mois avec 153 : il lui en manque seize, et la caisse retient pour ses
      autres points « la plus
      faible minoration des deux », celle de l'âge (13,25 %) plutôt que celle
      des seize trimestres (17 %). Tous ses points valent donc 0,8675.
    carriere: {naissance: "1962-01", sexe: H, affiliation: salarie_prive_cadre, liquidation: "2025-12", trimestres_valides: 153, niveau_salaire: 6, profil_carriere: plat}
    attendu: {trimestres_requis: 169, liquidation_ouverte: true, coefficients_des_regimes: {agirc: 0.8675, arrco: 0.8675, agirc_arrco: 0.8675}}

