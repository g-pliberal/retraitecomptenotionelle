    carriere: {naissance: "1958-01", sexe: F, affiliation: salarie_prive_non_cadre, liquidation: "2020-02", age_debut: 22, conjoint: "1969-05-03", conjoint_sexe: H, deces: "2023-11-09"}
    attendu: {dates_d_effet_de_la_reversion: {arrco: "2024-06-01"}}

  - id: aa_reversion_francois
    source: {editeur: "Agirc-Arrco", reference: "« La pension de réversion », exemple de Kevin et François", verifie_le: "2026-09-28"}
    enonce: >-
      Kevin est décédé le 6 octobre 2024. Il percevait une retraite
      Agirc-Arrco trimestrielle. François, son conjoint, a eu 55 ans le 10
      novembre 2024. La pension de réversion de François prend effet à compter
      du 1er janvier 2025.
    carriere: {naissance: "1952-01", sexe: H, affiliation: salarie_prive_non_cadre, liquidation: "2014-02", age_debut: 20, conjoint: "1969-11-10", conjoint_sexe: H, deces: "2024-10-06"}
    attendu: {dates_d_effet_de_la_reversion: {arrco: "2025-01-01"}}
    ecart_connu:
      modele: {dates_d_effet_de_la_reversion: {arrco: "2024-12-01"}}
      explication: >-
        Le modèle sert toute retraite au mois. Versée par trimestre, celle de
        Kevin court jusqu'au terme du trimestre de son décès, et la réversion
        ne commence qu'au trimestre qui suit, ou au mois qui suit l'âge de
        François s'il vient après. Il faudrait la périodicité du paiement, que
        le modèle ne connaît pas.
      fiche: reversion_agirc_arrco
      depuis: "2026-09-28"

