# Exemples chiffrés publiés par les organismes qui appliquent les règles,
# rejoués par `tests/test_oracle.py` contre le scénario 1.
# ------------------------------------------------------------------------
# Aucun simulateur NOMINATIF n'est automatisable : « Mon estimation retraite »
# d'info-retraite.fr, le simulateur de l'Assurance retraite et l'ENSAP des
# fonctionnaires exigent FranceConnect et le relevé de carrière réel de la
# personne connectée, sans mode anonyme ni API.
#
# CETTE PHRASE DISAIT « aucun simulateur officiel », ET C'ÉTAIT FAUX. Les
# mêmes caisses publient à côté des calculettes ANONYMES, sans
# FranceConnect : `data/sources_a_explorer.yaml` en recense vingt-huit, et
# l'action 89 de la feuille de route ouvre leur dépouillement. Une d'elles a
# déjà servi — le `calcru` d'Agirc-Arrco, qui a levé un coefficient de fusion
# faux (action 100). Un simulateur anonyme est un ORACLE : on l'interroge
# autant qu'on veut, et vingt appels bien choisis rendent un barème que
# personne n'a publié. Ce fichier-ci ne porte encore aucun résultat de ce
# genre parce qu'aucune calculette n'a encore rendu une PENSION complète ;
# le jour où l'une le fera, ses réponses viendront ici comme les autres.
# Depuis le 1er octobre 2026, deux simulateurs anonymes d'info-retraite y
# ont leurs réponses (préfixe `ur_`) : des conditions de départ et des
# réversions, pas encore une pension, saisies à la main selon la règle du
# § 3.5 de docs/architecture.md. Depuis le 4 octobre 2026, Claude peut saisir
# à la place du propriétaire, sur un lot qu'il approuve : la source de ces
# exemples nomme alors le simulateur (`simulateur`, sa ligne au registre des
# sources) et ce qu'on y a tapé (`saisie`), que le budget du simulateur
# compte, et `scripts/simulateurs.py` les transcrit.
#
# Ce qui est officiel ET reproductible aujourd'hui, ce sont les EXEMPLES que
# ces organismes publient : une carrière minuscule dont la réponse est
# écrite par la caisse. Chacun est
# transcrit ici tel que la source l'écrit, avec sa date de vérification ; le
# test construit la carrière — une seule affiliation, un salaire constant, le
# nombre de trimestres de l'exemple — et compare la grandeur nommée.
#
# Les grandeurs comparées (`attendu`) :
#   trimestres_requis, trimestres_valides, taux_liquidation, motif_ouverture,
#   liquidation_ouverte — lus dans le résultat du scénario 1 ;
#   age_ouverture — l'âge légal opposable, par `age_ouverture_droit` ;
#   date_age_legal — le mois où cet âge est atteint (année-mois) ;
#   non_ouverte_un_trimestre_plus_tot — la même carrière liquidée trois mois
#     plus tôt doit être refusée (`motif_ouverture: non_ouverte`) ;
#   pension_base_sur_sam — pension du régime général rapportée au salaire
#     annuel moyen (taux × prorata) ;
#   annees_du_salaire_annuel_moyen — le nombre des meilleures années que le
#     salaire annuel moyen du régime général retient, celui de la pension
#     proratisée d'une carrière hors de France compris ;
#   pension_regime_general_mensuelle — pension du régime général après
#     minimum, en euros par mois ;
#   trimestres_de_majoration_enfants — ÉCART de durée d'assurance entre cette
#     carrière et la MÊME carrière sans enfant. La caisse publie le nombre de
#     trimestres qu'elle ajoute par enfant, jamais le total d'une carrière :
#     c'est donc l'écart qui se compare, et il ne dépend ni de l'âge d'entrée
#     ni de la durée requise de la génération. Un témoin qui l'emploie fixe
#     son `age_debut`, sans quoi les deux parcours ne partiraient pas du même
#     point ;
#   majoration_enfants_sur_pensions — majoration pour enfants servie par les
#     régimes de BASE, rapportée à leur pension. La circulaire dit que
#     l'assiette est la retraite TELLE QUE CALCULÉE : appliquer les 10 % à la
#     pension d'avant la surcote, ou d'avant la majoration de durée
#     d'assurance, rendrait ici moins que le taux publié. Jusqu'au
#     23 septembre 2026, la grandeur rapportait la majoration de TOUS les
#     régimes à toutes les pensions, Agirc-Arrco compris, dont les points
#     n'ont pas tous le même taux (accord du 17 novembre 2017, article 94).
#   majorations_enfants_des_regimes — pour chaque régime nommé, la majoration
#     pour enfants qu'il sert, rapportée à sa pension : le barème propre d'un
#     régime complémentaire, que la caisse publie en pourcentage des points ;
#   coefficients_des_regimes — pour chaque régime en points nommé, le
#     coefficient d'anticipation ou de majoration que le scénario 1 applique
#     à sa pension, 1 s'il n'en applique aucun. C'est ce que les sections
#     libérales publient : leur règle d'âge, et le coefficient qu'elle rend ;
#   pensions_annuelles_des_regimes — pour chaque régime nommé, la pension
#     annuelle brute que le scénario 1 lui fait servir, à cinquante centimes
#     près. C'est ce que publie un régime dont la pension ne tient ni à un
#     taux ni à un salaire — les mines : trimestres × coefficient × valeur ;
#   departs — les départs que l'échéancier inscrit quand les régimes ne
#     liquident pas tous au départ déclaré, chacun « AAAA-MM-JJ motif »
#     (`droit/departs.py`) ; une liste vide pour un départ unique ;
#   dates_d_effet_de_la_reversion — pour chaque régime nommé, la date d'effet
#     (AAAA-MM-JJ) de la réversion que le décès de l'assuré ouvre à son
#     conjoint, telle que l'échéancier la liquide ;
#   deductions_annuelles_du_cumul — pour chaque régime nommé, ce que le cumul
#     emploi-retraite déduit de sa pension dans l'année de `revenus_apres_depart`,
#     à un centime près ;
#   mois_sans_pension_du_cumul — les mois (année-mois) où aucune pension de base
#     n'est due, l'activité après le départ reprise chez le dernier employeur ;
#   plafond_mensuel_du_cumul — le plafond mensuel de L. 161-22 du premier mois de
#     l'activité, à un centime près ;
#   plafonds_des_nouvelles_pensions — pour chaque régime nommé, le plafond
#     annuel de la nouvelle pension que l'activité en cumul intégral ouvre, à
#     un centime près ;
#   cumul_integral_depuis — le mois (année-mois) où le cumul emploi-retraite
#     devient intégral pendant l'activité exercée après le départ ;
#   pension_et_rente_d_invalidite_sur_traitement — la pension du
#     fonctionnaire radié pour invalidité, sa rente viagère d'invalidité et
#     leur total, en parts du traitement. L'exemple donne le traitement et le
#     taux de la pension, non la carrière : le test les prête au calcul de la
#     fonction publique de l'État, sous la version que la radiation choisit,
#     et ne compare que les parts que l'exemple nomme ;
#   reversions_ecretees_mensuelles — pour chaque régime nommé, la réversion
#     servie après le plafond de ressources, en euros par mois, à un
#     centime près. L'exemple donne la réversion d'avant le plafond
#     (`carriere.reversions_avant_plafond_mensuelles`) et non la carrière du
#     défunt : le test prête à chaque régime la pension qui la rend, au taux
#     de la version que le modèle choisit, et le modèle l'écrête ;
#   reversions_mensuelles — pour chaque régime nommé, la réversion servie, en
#     euros par mois, à l'euro près comme les simulateurs l'arrondissent.
#     L'exemple donne les pensions du défunt, comme le simulateur les demande
#     (`carriere.pensions_du_defunt_mensuelles`) : le test les prête au
#     défunt, et le modèle y applique ses taux, ses conditions et son plafond.
#   cotisation_agirc_de_l_annee — la cotisation Agirc de l'année `annee`, en
#     euros : la part de l'assuré (`salariale`) et la cotisation entière
#     (`totale`), telles que le compte notionnel les reçoit. Le scénario 1 n'a
#     pas de cotisation en euros, il n'en tire que des points. À dix centimes
#     près : la caisse publie douze mensualités arrondies au centime, six
#     centimes d'écart au plus, et la fiche de régime arrondit le partage entre
#     salarié et employeur au dix-millième.
#   points_de_l_annee — les points que le salaire de l'année `annee` acquiert,
#     régime par régime, une valeur par période qui en crédite (la tranche 1,
#     puis la 2), au centième. L'exemple donne ce salaire, en euros de
#     l'année, dans `carriere.releve` (année : salaire), que le test porte sur
#     un relevé de carrière.
#   majoration_exceptionnelle_mensuelle — la majoration exceptionnelle des
#     petites pensions (loi n° 2023-270, article 18, V) servie le mois où elle
#     est due, septembre 2023, en euros par mois, tous régimes : ce que la
#     caisse calcule des durées cotisée et validée de la carrière ;
#   minimum_vieillesse_mensuel — l'ASPA que le foyer sert à l'assuré, en euros
#     par mois, à un demi-centime près : sa part quand son conjoint est aussi
#     allocataire. L'exemple donne les revenus du couple, non les carrières :
#     le test prête à l'assuré la pension de
#     `carriere.pensions_au_foyer_mensuelles`, au conjoint ses ressources
#     (`ressources_conjoint`), et lit l'allocation à `carriere.date_du_foyer`.
#   valeurs_de_service_au_jour — pour chaque régime en points nommé, la valeur
#     de service qu'une pension prenant effet au départ de l'exemple reçoit,
#     fusions comprises, au dix-millième d'euro : celle du jour, non celle du
#     31 décembre.
#
# `carriere.trimestres_valides` demande au test de choisir l'âge d'entrée qui
# donne exactement ce nombre de trimestres à la liquidation ; `age_debut`
# l'impose, et `debut` le date au mois, celui d'une carrière qui commence hors
# de France. `etranger` liste les périodes hors de France comme la saisie les
# déclare — `pays`, le code de l'État au tableau des accords, `debut` et `fin`
# au mois, `activite` salariée quand elle n'est pas dite —, `residence` l'État
# où l'assuré réside hors de France. Les dates s'écrivent année-mois, et la pension prend effet le
# premier du mois. La naissance dit son jour quand l'exemple le donne
# (« 1964-05-16 ») : la pension prend effet au premier du mois qui suit
# l'anniversaire, sauf pour qui est né un 1er (R. 351-37). Un exemple qui ne le
# donne pas le laisse à la présomption, le 15 — sauf s'il part au mois même
# où il atteint l'âge qui ouvre son droit, ce que seul un assuré né un 1er
# peut faire : sa naissance s'écrit alors au 1er (« 1967-03-01 »), jour que la
# source ne dit pas mais que sa date de départ suppose (action 132).
# `naissances_enfants` date les premiers enfants, à l'année ou au mois, comme
# le formulaire ; ceux qu'elle ne date pas sont présumés nés aux trente ans de
# leur mère. `conjoint`, `conjoint_sexe`, `mariage`, `ressources_conjoint`,
# `conjoint_invalidite` et `deces` déclarent le conjoint et le décès de
# l'assuré comme la saisie : la naissance du conjoint, son invalidité et le
# décès à l'année, au mois ou au jour ; le sexe du conjoint, l'autre que celui
# de l'assuré s'il n'est pas dit ; ses ressources annuelles. `pension_d_invalidite` et `radiation_invalidite` datent au mois
# la pension d'invalidité et la radiation des cadres pour invalidité,
# `inaptitude` déclare l'inaptitude reconnue au départ, `invalidite_imputable`
# et `taux_invalidite` qualifient la radiation, comme la saisie ;
# `traitement_mensuel` et `taux_de_la_pension` ne servent qu'à la grandeur
# qui les prête, comme `points_rafp` et `valeur_de_service_rafp`, les points
# et la valeur de service que l'ERAFP publie ou que son simulateur affiche, et
# `retraite_de_base`, le mois de la pension de base quand le RAFP la suit.
#
# UN EXEMPLE QUE LE MODÈLE NE REPRODUIT PAS ENTRE QUAND MÊME, à l'état
# « écart connu » (docs/architecture.md, § 9.2) : ce qu'on apprend n'est
# jamais bloqué. Il porte alors un champ de plus :
#
#   ecart_connu:
#     modele: {taux_liquidation: 0.4375}   # ce que rend le modèle, par grandeur
#     explication: >-
#       pourquoi le modèle s'écarte de la caisse, et ce qu'il faudrait changer
#     fiche: decote_regime_general         # la fiche de la carte qui le déclare
#     depuis: "2026-09-25"
#
# La fiche nommée (data/reference/regles/) n'est ni `conforme` ni
# `transcrite`, et compte l'exemple parmi ses `exemples` : l'écart est déclaré
# là où il va. Le test
# vérifie que le modèle rend la valeur déclarée pour lui. S'il rend la valeur
# publiée, l'écart est corrigé, et le champ se retire ; s'il rend autre chose,
# le résultat a changé, et seul le diff de ce fichier peut l'accepter. Un
# exemple qui passait ne devient donc pas « écart connu » en silence. Le
# tableau de bord, docs/etat.md, compte et liste ces écarts.
#
# Ce que la confrontation a trouvé, et quand, est raconté dans
# docs/limites.md, § « Ce que disent les exemples publiés par les caisses ».

exemples:

  # ---- service-public.gouv.fr ------------------------------------------
  - id: sp_f19666_decote
    source: {editeur: "service-public.gouv.fr", reference: "fiche F19666, Retraite du salarié : qu'est-ce que la décote ?", verifie_le: "2026-01-01"}
    enonce: >-
      Né le 1er juillet 1964, départ le 1er juillet 2027 à 63 ans avec 159
      trimestres tous régimes, 170 exigés. Il manque 16 trimestres jusqu'à
      67 ans et 11 jusqu'à 170 : 11 retenus, 0,625 point par trimestre,
      taux 43,125 %.
    carriere: {naissance: "1964-07-01", sexe: H, affiliation: salarie_prive_non_cadre, liquidation: "2027-07", trimestres_valides: 159}
    attendu: {trimestres_requis: 170, taux_liquidation: 0.43125, motif_ouverture: age_legal}

  - id: sp_f20349_decote_fonction_publique
    source: {editeur: "service-public.gouv.fr", reference: "fiche F20349, Retraite d'un agent public : qu'est-ce que la décote ?", verifie_le: "2026-01-01"}
    enonce: >-
      Fonctionnaire sédentaire né le 1er juillet 1964, départ le 1er juillet
      2027 à 63 ans avec 159 trimestres au lieu de 170 : la pension est
      réduite de 13,75 % (11 trimestres × 1,25 %).
    carriere: {naissance: "1964-07-01", sexe: H, affiliation: fonctionnaire_etat, liquidation: "2027-07", trimestres_valides: 159}
    attendu: {trimestres_requis: 170, taux_liquidation: 0.646875}

  - id: sp_f19643_surcote
    source: {editeur: "service-public.gouv.fr", reference: "fiche F19643, Retraite du salarié du secteur privé : qu'est-ce que la surcote ?", verifie_le: "2026-01-01"}
    enonce: >-
      Né le 15 avril 1965, il a à 63 ans les 171 trimestres requis. S'il
      travaille jusqu'au 30 juin 2029, il lui est compté 2 trimestres du
      1er juillet au 31 décembre 2028 et 2 en 2029 : pension majorée de 5 %.
    carriere: {naissance: "1965-04-15", sexe: H, affiliation: salarie_prive_non_cadre, liquidation: "2029-07", trimestres_valides: 176}
    attendu: {trimestres_requis: 171, age_ouverture: 63.0, taux_liquidation: 0.525}

  - id: sp_f16494_surcote_fonction_publique
    source: {editeur: "service-public.gouv.fr", reference: "fiche F16494, Retraite d'un agent public : qu'est-ce que la surcote ?", verifie_le: "2026-05-18"}
    enonce: >-
      Fonctionnaire sédentaire né le 9 octobre 1964, taux plein à 62 ans et
      9 mois (1er août 2027) avec 170 trimestres ; s'il part au 1er octobre
      2028, soit 4 trimestres entiers après celui de ses 62 ans et 9 mois, la
      pension est majorée de 5 % (4 × 1,25 %).
    carriere: {naissance: "1964-10-09", sexe: H, affiliation: fonctionnaire_etat, liquidation: "2028-10", trimestres_valides: 175}
    attendu: {trimestres_requis: 170, age_ouverture: 62.75, taux_liquidation: 0.7875}

  - id: sp_f21552_taux_plein_170
    source: {editeur: "service-public.gouv.fr", reference: "fiche F21552, Montant de la pension de retraite du salarié du secteur privé", verifie_le: "2026-09-01"}
    enonce: >-
      Né en 1964, 170 trimestres exigés ; départ avant 67 ans avec 170
      trimestres validés : pension = revenu annuel moyen × 50 % × 170/170.
    carriere: {naissance: "1964-01", sexe: H, affiliation: salarie_prive_non_cadre, liquidation: "2027-01", trimestres_valides: 170, niveau_salaire: 1.5}
    attendu: {trimestres_requis: 170, taux_liquidation: 0.5, pension_base_sur_sam: 0.5}

  - id: sp_f21552_67_ans_158
    source: {editeur: "service-public.gouv.fr", reference: "fiche F21552 et fiche F36464 (taux plein et taux maximum)", verifie_le: "2026-09-01"}
    enonce: >-
      Né en 1964, départ à 67 ans avec 158 trimestres : taux plein sans
      décote, pension = revenu annuel moyen × 50 % × 158/170.
    carriere: {naissance: "1964-01-01", sexe: H, affiliation: salarie_prive_non_cadre, liquidation: "2031-01", trimestres_valides: 158, niveau_salaire: 1.5}
    attendu: {taux_liquidation: 0.5, pension_base_sur_sam: 0.4647058823529412}

  - id: sp_f21552_65_ans_158
    source: {editeur: "service-public.gouv.fr", reference: "fiche F21552, Montant de la pension de retraite du salarié du secteur privé", verifie_le: "2026-09-01"}
    enonce: >-
      Né en 1964, départ à 65 ans avec 158 trimestres : 12 trimestres
      manquent jusqu'à 170, 8 jusqu'à 67 ans ; taux réduit à 45 %, pension =
      revenu annuel moyen × 45 % × 158/170.
    carriere: {naissance: "1964-01-01", sexe: H, affiliation: salarie_prive_non_cadre, liquidation: "2029-01", trimestres_valides: 158, niveau_salaire: 1.5}
    attendu: {taux_liquidation: 0.45, pension_base_sur_sam: 0.41823529411764704}

  - id: sp_a15703_minimum_contributif_2026
    source: {editeur: "service-public.gouv.fr", reference: "actualité A15703, Pensions de retraite : quel est le montant du minimum contributif en 2026 ?", verifie_le: "2026-02-12"}
    enonce: >-
      Né en 1964, départ avant 67 ans avec 135 trimestres cotisés (170
      exigés) : la pension ne peut être inférieure à 756,29 € +
      [(903,93 € − 756,29 €) × 135 / 170] = 873,53 € brut par mois.
      La carrière construite a 170 trimestres validés dont 135 cotisés, à un
      salaire assez bas pour que le minimum s'applique.
    carriere:
      naissance: "1964-01"
      sexe: H
      affiliation: salarie_prive_non_cadre
      liquidation: "2026-11"
      age_debut: 20.25
      niveau_salaire: 0.45
      profil_carriere: plat
      interruptions: {2000: chomage_indemnise, 2001: chomage_indemnise, 2002: chomage_indemnise, 2003: chomage_indemnise, 2004: chomage_indemnise, 2005: chomage_indemnise, 2006: chomage_indemnise, 2007: chomage_indemnise, 2026: chomage_indemnise}
    attendu: {trimestres_valides: 170, trimestres_requis: 170, taux_liquidation: 0.5, pension_regime_general_mensuelle: 873.53}

  # Le minimum contributif daté (fiche minimum_contributif) : de juillet 2005 à
  # mars 2009, la majoration au prorata de la durée cotisée, sans seuil, aux
  # montants du 1er janvier 2005. Le modèle reliait jusqu'au 4 octobre 2026 ses
  # ancres par les prix, et servait ici 7 % de trop.
  - id: cnav_2005_30_minimum_majore_monopensionne
    source: {editeur: "Cnav", reference: "circulaire n° 2005/30 du 4 juillet 2005, Minimum contributif majoré, point 5112, exemple 1", verifie_le: "2026-10-04"}
    enonce: >-
      Assuré né en 1945, retraite au 1er octobre 2005, monopensionné du régime
      général, 162 trimestres dont 156 cotisés : « Minimum : 6641,28 X 154/154
      = 6641,28 euros », « Majoration : (6840,51 - 6641,28) X 154/154 = 199,23
      euros », « Montant du minimum contributif majoré au régime général :
      6840,51 euros ». La carrière construite a 162 trimestres dont 158
      cotisés — au-delà des 154 de la durée de proratisation, comme ceux de
      l'exemple —, à un salaire assez bas pour que le minimum s'applique.
    carriere:
      naissance: "1945-09"
      sexe: H
      affiliation: salarie_prive_non_cadre
      liquidation: "2005-10"
      age_debut: 19.5
      niveau_salaire: 0.3
      profil_carriere: plat
      interruptions: {1990: chomage_indemnise}
    attendu: {trimestres_valides: 162, trimestres_requis: 160, taux_liquidation: 0.5, pension_regime_general_mensuelle: 570.04}

  # La majoration exceptionnelle de septembre 2023 (fiche
  # majoration_exceptionnelle_2023) : 100 € au prorata de la durée cotisée,
  # sous un plafond au prorata de la durée validée. Le modèle ne la servait pas
  # jusqu'au 8 octobre 2026. Les autres exemples de la circulaire donnent la
  # pension du mois, non la carrière : tests/test_majoration_exceptionnelle.py
  # les rejoue sur la fonction.
  - id: cnav_2023_21_majoration_liquidation_unique
    source: {editeur: "Cnav", reference: "circulaire n° 2023-21 du 2 novembre 2023, La majoration exceptionnelle des retraites personnelles ayant pris effet avant le 1er septembre 2023, point 3.2.5, exemple 3", verifie_le: "2026-10-08"}
    enonce: >-
      Assuré né le 15 mars 1958, retraité de la liquidation unique depuis le
      1er avril 2020, « durée d'assurance Lura de 170 trimestres dont 146
      cotisés ; durée d'assurance selon la génération : 167 trimestres » :
      « 100 x (146/167) = 87,42 euros », sous le plafond de 847,57 €, retenus
      entiers. La carrière construite a 170 trimestres dont 146 cotisés, six
      ans de chômage indemnisé, à un salaire assez bas pour que la pension
      reste sous le plafond.
    carriere:
      naissance: "1958-03-15"
      sexe: H
      affiliation: salarie_prive_non_cadre
      liquidation: "2020-04"
      age_debut: 19.5
      niveau_salaire: 0.3
      profil_carriere: plat
      interruptions: {2000: chomage_indemnise, 2001: chomage_indemnise, 2002: chomage_indemnise, 2003: chomage_indemnise, 2004: chomage_indemnise, 2005: chomage_indemnise}
    attendu: {trimestres_valides: 170, trimestres_requis: 167, majoration_exceptionnelle_mensuelle: 87.42}

  # L'ASPA d'un couple (fiche minimum_vieillesse) : le plafond du couple sur les
  # ressources des deux (L. 815-9, D. 815-2), servi par moitié à deux
  # allocataires (D. 815-1, b ; R. 815-28), et au plus le montant d'une
  # personne seule quand un seul l'est (D. 815-1, a). Le modèle servait à tous
