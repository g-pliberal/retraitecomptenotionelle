  # ---- Cnav : la réversion écrêtée au plafond de ressources --------------
  - id: cnav_2005_17_reversion_ecretee
    source: {editeur: "Cnav", reference: "circulaire n° 2005/17 du 11 avril 2005, § 31, Le montant à servir, exemple", verifie_le: "2026-09-28"}
    enonce: >-
      Le conjoint survivant déclare 1 150 euros de salaire mensuel. Le montant
      mensuel de sa pension de réversion s'élève à 530 euros. Total 1 680 ;
      dépassement 1 680 − 1 319,06 = 360,94 par mois ; pension de réversion
      réduite 530 − 360,94 = 169,06. Le plafond est celui de 2005, 2 080 fois
      le SMIC horaire du 1er janvier, par mois ; la circulaire le tronque au
      centime, le modèle l'arrondit. Le salaire est compté entier : le
      survivant n'a pas cinquante-cinq ans.
    carriere: {naissance: "1940-01", sexe: H, affiliation: salarie_prive_non_cadre, liquidation: "2000-01", age_debut: 20, conjoint: "1952-01", ressources_conjoint: 13800, deces: "2005-08", reversions_avant_plafond_mensuelles: {regime_general: 530}}
    attendu: {reversions_ecretees_mensuelles: {regime_general: 169.06}}
