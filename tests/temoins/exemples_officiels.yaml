  # ---- Cnav : la majoration de la retraite anticipée des assurés handicapés ----
  # Les exemples de la circulaire Cnav n° 2026-18 du 15 juin 2026 (3.1 à 3.3.1 et
  # annexe 7) : le coefficient, et l'écrêtement à la retraite entière quand elle
  # le dit. Leurs revenus annuels moyens ne se reproduisent pas, et ne se
  # comparent donc pas : la carrière a la durée et la durée cotisée en situation
  # de handicap de l'exemple, à une date d'effet que sa durée requise permet.

  - id: cnav_2026_18_majoration
    source: {editeur: "Cnav", reference: "circulaire Cnav n° 2026-18 du 15 juin 2026, 3.1 à 3.3, exemple de l'assuré né en 1962", verifie_le: "2026-10-05"}
    enonce: >-
      « Un assuré handicapé, né en 1962, justifie de 160 trimestres au régime de
      l'Assurance retraite, dont 135 cotisés en étant handicapé. Coefficient de
      majoration : 135/160 x 1/3 = 0,281 arrondi à 0,28 », sur la durée requise de
      169 trimestres. La carrière d'exemple : un salarié né le 1er octobre 1962,
      handicapé depuis 1991, qui part à soixante-deux ans en octobre 2024, avant
      l'âge légal de sa génération.
    carriere: {naissance: "1962-10-01", sexe: H, affiliation: salarie_prive_non_cadre, liquidation: "2024-10", trimestres_valides: 160, handicap: "1991-01"}
    attendu: {trimestres_requis: 169, coefficient_majoration_handicap: 0.28, motif_ouverture: handicap}

  - id: cnav_2026_18_majoration_ecretee
    source: {editeur: "Cnav", reference: "circulaire Cnav n° 2026-18 du 15 juin 2026, 3.3.1, exemple de l'assuré né en 1962", verifie_le: "2026-10-05"}
    enonce: >-
      « Assuré né en 1962. Il réunit 150 trimestres aux régimes Lura dont 130
      cotisés en étant handicapé » ; « 130/150 x 1/3 = 0,288 arrondi à 0,29 », et la
      retraite augmentée de la majoration, au-delà de la retraite entière, « est
      écrêtée à hauteur de ce dernier ». La carrière d'exemple : un salarié né le
      1er décembre 1962, handicapé depuis 1992, qui part en juillet 2024.
    carriere: {naissance: "1962-12-01", sexe: H, affiliation: salarie_prive_non_cadre, liquidation: "2024-07", trimestres_valides: 150, handicap: "1992-01"}
    attendu: {coefficient_majoration_handicap: 0.29, majoration_handicap_ecretee: true}

  - id: cnav_2026_18_annexe_7
    source: {editeur: "Cnav", reference: "circulaire Cnav n° 2026-18 du 15 juin 2026, annexe 7, exemple de l'assuré né en 1960", verifie_le: "2026-10-05"}
    enonce: >-
      « Assuré né en 1960, justifiant de 160 trimestres aux régimes Lura dont 135
