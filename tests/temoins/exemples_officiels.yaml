  # le 24 septembre 2026 (action 89, lot de la fonction publique de l'État).
  # La même fonctionnaire y sert deux fois. La date de la pension est celle
  # que le SRE retient : le PREMIER DU MOIS qui suit la cessation — « 62 ans
  # 6 mois 11 jours (âge auquel la pension est attribuée) » pour une
  # fonctionnaire née le 20 mars 1962 et admise à la retraite le 20 septembre
  # 2024, soit le 1er octobre 2024. Le modèle datant au mois, c'est ce mois-là
  # qui s'écrit ici ; lu au mois de la cessation, le décompte au trimestre
  # civil perdrait un trimestre de surcote que la caisse compte.
  - id: sre_decote_brigitte
    source: {editeur: "SRE", reference: "retraitesdeletat.gouv.fr, Actif, Le calcul de ma retraite, « La décote », exemple de Brigitte S.", verifie_le: "2026-09-24"}
    enonce: >-
      Brigitte S., sédentaire née le 20 mars 1962, admise à la retraite à
      l'âge légal, 62 ans et 6 mois, avec 163 trimestres de durée d'assurance
      pour 169 requis : 18 trimestres jusqu'à 67 ans, 6 jusqu'à la durée ; 6
      trimestres de décote à 1,25 %, soit 7,5 % de la pension.
    carriere: {naissance: "1962-03-20", sexe: F, affiliation: fonctionnaire_etat, liquidation: "2024-10", trimestres_valides: 163}
    attendu: {trimestres_requis: 169, taux_liquidation: 0.69375, motif_ouverture: age_legal}

  - id: sre_surcote_brigitte
    source: {editeur: "SRE", reference: "retraitesdeletat.gouv.fr, Actif, Le calcul de ma retraite, « La surcote », exemple de Brigitte S.", verifie_le: "2026-09-24"}
    enonce: >-
      La même, qui a ses 169 trimestres à 62 ans et 6 mois, poursuit son
      activité jusqu'à ses 64 ans, le 20 mars 2026, et totalise alors 175
      trimestres : 175 − 169 = 6 trimestres de surcote à 1,25 %, soit 7,5 %.
      La pension prend effet le 1er avril 2026.
    carriere: {naissance: "1962-03-20", sexe: F, affiliation: fonctionnaire_etat, liquidation: "2026-04", trimestres_valides: 175}
    attendu: {trimestres_requis: 169, taux_liquidation: 0.80625}

  # ---- CNRACL (documentation juridique de la Caisse des dépôts) ---------
  # juris-cnracl.retraites.fr, lue le 24 septembre 2026 (action 89, lot de la
  # CNRACL). Trois pages y donnent un exemple que le modèle rejoue ; le
  # troisième exemple de surcote de droit commun, dont l'agent est né un 1er
  # janvier, l'est depuis que le modèle lit le jour de naissance (action 132,
  # page relue le 28 septembre 2026) ; ceux des générations 1963 à 1966
  # datent d'avant la suspension de 2026.
  - id: cnracl_surcote_ne_un_1er
    source: {editeur: "CNRACL", reference: "juris-cnracl.retraites.fr, « Calcul de la surcote », surcote de droit commun, exemple 3", verifie_le: "2026-09-28"}
    enonce: >-
      « Un fonctionnaire né le 01/01/1962 atteint son âge légal (62 ans et 6
      mois) le 01/07/2024. [...] Il poursuit son activité jusqu'au 31/12/2025
      et totalise alors 176 trimestres. Pour la génération 1962, le nombre de
      trimestres nécessaires pour avoir une pension à taux plein est de 169.
      [...] Il a effectué 6 trimestres supplémentaires de services effectifs à
      partir du 01/07/2024. Coefficient de majoration : 6 X 1.25% = 7.5% ».
      Né un 1er, l'agent a l'âge légal le jour même, et sa surcote court de
      ce jour ; né le 2, il n'en aurait eu que cinq, du 1er août 2024.
    carriere: {naissance: "1962-01-01", sexe: H, affiliation: fonctionnaire_territorial_hospitalier, liquidation: "2026-01", trimestres_valides: 176}
    attendu: {trimestres_requis: 169, age_ouverture: 62.5, taux_liquidation: 0.80625}

