  # retraite complémentaire Agirc-Arrco » (septembre 2026), lus le 27
  # septembre 2026. Le coefficient du dépliant ne vise que les points de
  # tranche C acquis avant 2016, que le modèle ne distingue pas : il ne se
  # compare au coefficient d'un régime entier que si tous les points en
  # reçoivent un même, donc sans le taux plein au régime de base ; l'écart que
  # déclare la fiche, ces points servis sans coefficient au taux plein, reste
  # sans exemple. Celui de la table, « à 61 ans », suppose la complémentaire
  # prise sans la retraite de base, que le modèle ne liquide pas à part : il
  # n'est pas rejoué.
