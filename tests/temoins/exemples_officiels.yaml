      Le défunt, salarié du secteur privé retraité, touchait 1 400 € nets du
      régime général et 700 € de l'Agirc-Arrco ; sa veuve, née le 15 mars
      1960, vit seule de sa propre retraite, 24 600 € brut sur douze mois. Le
