    source: {editeur: "Cnav", reference: "circulaire n° 22/83 du 16 février 1983, point 313, exemples de calculs, 2ème cas", verifie_le: "2026-09-27"}
    enonce: >-
      « L'assuré totalise 145 trimestres » ; « Coefficient acquis au 31-3-83 :
      55 % », 97 859 × 55 × 145 / (100 × 150) = 52 028,36, ramenée au
      maximum, 48 906 ; durée corrigée 150, 97 859 × 50 × 150 / (100 × 150)
      = 48 929,50, ramenée au maximum, 44 460 : « On retiendra la prestation
      qui résulte des dispositions antérieures au 1-4-83 ». Taux 55 %,
      pension de 55 % × 145/150 du salaire annuel moyen avant le maximum.
    carriere: {naissance: "1917-03", sexe: H, affiliation: salarie_prive_non_cadre, liquidation: "1983-09", trimestres_valides: 145}
    attendu: {taux_liquidation: 0.55, pension_base_sur_sam: 0.5316666666666666}

