  # ---- Cnav, circulaire 2026-29 du 4 septembre 2026 (carrière longue) ----
  # Elle annule et remplace celle du 12 juin 2026, que ces témoins citaient.
  # Ses âges et ses durées ont été relus ligne à ligne le 21 septembre 2026 :
  # aucun n'a bougé, mais c'est la circulaire EN VIGUEUR qui fait foi, et une
  # circulaire annulée ne certifie plus rien.
  #
  # ELLE NE VAUT QUE POUR LES RETRAITES PRENANT EFFET À COMPTER DU
  # 1er SEPTEMBRE 2026 — son titre le dit. Jusqu'au 23 septembre 2026, les
  # témoins de 1964 et 1965 la rejouaient à son âge d'ouverture, c'est-à-dire
  # en septembre 2024, en novembre 2025 et en avril 2026 : sous une règle qui
  # ne leur était pas encore opposable, et que le modèle appliquait à tort
  # (voir `duree_requise_avant_suspension.csv`). Ils liquident désormais en
  # septembre 2026, au-delà de cet âge ; le refus un trimestre plus tôt, qui
  # tomberait avant septembre 2026, ne peut plus s'y rejouer.
  - id: cnav_2026_29_racl_1964
    source: {editeur: "Cnav", reference: "circulaire 2026-29 du 4 septembre 2026, Retraite anticipée pour carrière longue à compter du 1er septembre 2026, point 1.1.1 et annexe 3", verifie_le: "2026-09-04"}
    enonce: >-
