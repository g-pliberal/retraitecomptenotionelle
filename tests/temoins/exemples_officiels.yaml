  # ---- Les trimestres accordés au titre des enfants ----------------------
  # Ni la caisse ni service-public ne publient une carrière entière dont ils
  # donnent la durée d'assurance : ce qu'ils publient, c'est le NOMBRE DE
  # TRIMESTRES AJOUTÉS par enfant. C'est donc un écart qui se rejoue ici, et
  # non un total — la même carrière, avec et sans enfants.
  - id: sp_f16336_mda_deux_enfants
    source: {editeur: "service-public.gouv.fr", reference: "fiche F16336, Comment les enfants sont-ils pris en compte pour la retraite du salarié ?", verifie_le: "2026-08-14"}
    enonce: >-
      Par enfant né ou adopté, la salariée reçoit 4 trimestres au titre de la
      maternité et 4 au titre de l'éducation, soit 8 trimestres. Une mère de
      deux enfants a donc 16 trimestres de plus que la même carrière sans
      enfant.
    carriere: {naissance: "1962-05", sexe: F, affiliation: salarie_prive_non_cadre, liquidation: "2026-05", age_debut: 22, nombre_enfants: 2}
    attendu: {trimestres_de_majoration_enfants: 16}

  - id: cnav_2017_01_mda_trois_enfants
    source: {editeur: "Cnav", reference: "circulaire carrière 2017-01 du 13 janvier 2017, fiche n° 6.2b, point 2 « Modalités de décompte »", verifie_le: "2017-01-13"}
    enonce: >-
      « Quatre trimestres peuvent être attribués au titre de chaque
      majoration » — maternité et éducation —, le total au titre de
      l'éducation ne pouvant dépasser quatre par enfant. Une mère de trois
      enfants réunit donc 24 trimestres de majoration.
    carriere: {naissance: "1962-05", sexe: F, affiliation: salarie_prive_non_cadre, liquidation: "2026-05", age_debut: 22, nombre_enfants: 3}
    attendu: {trimestres_de_majoration_enfants: 24}

  - id: sp_f37311_bonification_avant_2004
    source: {editeur: "service-public.gouv.fr", reference: "fiche F37311, Comment les enfants sont-ils pris en compte pour la retraite de l'agent public ?", verifie_le: "2026-09-01"}
    enonce: >-
      Pour les enfants nés avant le 1er janvier 2004, la fonctionnaire reçoit
      4 trimestres par enfant — et non les 8 du régime général. Une mère de
      deux enfants nés avant 2004 réunit donc 8 trimestres.
    carriere: {naissance: "1962-05", sexe: F, affiliation: fonctionnaire_etat, liquidation: "2026-05", age_debut: 22, nombre_enfants: 2}
    attendu: {trimestres_de_majoration_enfants: 8}

  - id: sp_f37311_bonification_depuis_2004
    source: {editeur: "service-public.gouv.fr", reference: "fiche F37311, Comment les enfants sont-ils pris en compte pour la retraite de l'agent public ?", verifie_le: "2026-09-01"}
    enonce: >-
      Pour les enfants nés à compter du 1er janvier 2004, la bonification d'un
      an disparaît et laisse 2 trimestres par enfant. Une mère née en 1974 —
      dont le modèle présume les enfants nés à ses trente ans, donc en 2004 —
      réunit 4 trimestres pour deux enfants, et non 8.
    carriere: {naissance: "1974-05", sexe: F, affiliation: fonctionnaire_etat, liquidation: "2038-05", age_debut: 22, nombre_enfants: 2}
    attendu: {trimestres_de_majoration_enfants: 4}

  # Les mêmes règles, aux enfants datés : chacun compte à sa date, et la
  # fiche l'écrit enfant par enfant (« chaque enfant vous donne droit à 4
  # trimestres », « pour chacun de vos enfants nés depuis le 1er janvier
  # 2004, et après votre recrutement »).
  - id: sp_f37311_bonification_de_part_et_d_autre_de_2004
    source: {editeur: "service-public.gouv.fr", reference: "fiche F37311, Comment les enfants sont-ils pris en compte pour la retraite de l'agent public ?", verifie_le: "2026-09-01"}
    enonce: >-
      Quatre trimestres pour chaque enfant né avant le 1er janvier 2004, deux
      pour chaque enfant né depuis et après le recrutement. Une fonctionnaire
      recrutée à vingt-deux ans, mère d'un enfant né en 2001 et d'un autre né
      en 2006, réunit donc 6 trimestres.
    carriere: {naissance: "1970-05", sexe: F, affiliation: fonctionnaire_etat, liquidation: "2034-05", age_debut: 22, nombre_enfants: 2, naissances_enfants: ["2001", "2006"]}
    attendu: {trimestres_de_majoration_enfants: 6}

  - id: sp_f37311_accouchement_avant_le_recrutement
    source: {editeur: "service-public.gouv.fr", reference: "fiche F37311, Comment les enfants sont-ils pris en compte pour la retraite de l'agent public ?", verifie_le: "2026-09-01"}
    enonce: >-
      Les deux trimestres d'un enfant né depuis le 1er janvier 2004 vont à la
      fonctionnaire qui a accouché après son recrutement. Recrutée à trente
      ans, en 2010, la mère d'un enfant né en 2006 n'en reçoit aucun de la
      fonction publique.
    carriere: {naissance: "1980-05", sexe: F, affiliation: fonctionnaire_etat, liquidation: "2044-05", age_debut: 30, nombre_enfants: 1, naissances_enfants: ["2006"]}
    attendu: {trimestres_de_majoration_enfants: 0}

  # ---- Cnav, circulaire 2022-26 du 14 octobre 2022 (majoration 10 %) -----
  # L'assiette des 10 % est la retraite TELLE QUE CALCULÉE. La circulaire le
  # dit de la surcote — « la surcote majore la retraite et fait partie
  # intégrante de l'avantage de base. La majoration pour enfants est donc
  # calculée sur la base du montant annuel de la retraite, majorée par la
  # surcote » — et son exemple le chiffre : 10 % × (600 + 22,50) = 62,25. Le
  # rapport est donc de 10 % exactement, que la carrière soit surcotée,
  # décotée, ou pile au taux plein ; c'est ce que ces trois témoins fixent,
  # chacun sur un taux de liquidation différent.
  - id: cnav_2022_26_majoration_enfants_sur_surcote
    source: {editeur: "Cnav", reference: "circulaire 2022-26 du 14 octobre 2022, Majoration pour enfants, point 3.2 « Le calcul de la majoration pour enfants en présence de la surcote »", verifie_le: "2022-10-14"}
    enonce: >-
      Point de départ au 01/01/2017, retraite de 600 euros, 3 trimestres de
      surcote à 1,25 % : surcote de 22,50 euros, majoration pour enfants de
      10 % × (600 + 22,50) = 62,25 euros. La majoration vaut donc 10 % de la
      retraite SURCOTÉE, et non 10 % des 600 euros.
    carriere: {naissance: "1962-05", sexe: F, affiliation: salarie_prive_non_cadre, liquidation: "2028-05", age_debut: 22, nombre_enfants: 3}
    attendu: {taux_liquidation: 0.58125, majoration_enfants_sur_pensions: 0.10}

  - id: cnav_2022_26_majoration_enfants_au_taux_plein
    source: {editeur: "Cnav", reference: "circulaire 2022-26 du 14 octobre 2022, point 3 « Le calcul de la majoration pour enfants »", verifie_le: "2022-10-14"}
    enonce: >-
      La majoration pour enfants est de 10 % du montant annuel de la retraite.
      Sur une carrière ni décotée ni surcotée, elle vaut donc un dixième de la
      pension servie — majoration de durée d'assurance comprise, celle-ci
      étant entrée dans le calcul avant elle.
    carriere: {naissance: "1962-05", sexe: F, affiliation: salarie_prive_non_cadre, liquidation: "2026-05", age_debut: 22, nombre_enfants: 3}
    attendu: {majoration_enfants_sur_pensions: 0.10}

  - id: cnav_2022_26_majoration_enfants_sur_decote
    source: {editeur: "Cnav", reference: "circulaire 2022-26 du 14 octobre 2022, point 3 « Le calcul de la majoration pour enfants »", verifie_le: "2022-10-14"}
    enonce: >-
      Même règle sur une carrière incomplète : la majoration est de 10 % de la
      retraite telle qu'elle est servie, donc de la retraite MINORÉE. Ici 155
      trimestres pour 169 requis, taux 41,25 %.
    carriere: {naissance: "1962-05", sexe: F, affiliation: salarie_prive_non_cadre, liquidation: "2025-05", age_debut: 30, nombre_enfants: 3}
    attendu: {taux_liquidation: 0.4125, majoration_enfants_sur_pensions: 0.10}

  # ---- Service des retraites de l'État -----------------------------------
  # Les pages « La décote » et « La surcote » de retraitesdeletat.gouv.fr, lues
  # le 24 septembre 2026 (action 89, lot de la fonction publique de l'État).
  # La même fonctionnaire y sert deux fois. La date de la pension est celle
  # que le SRE retient : le PREMIER DU MOIS qui suit la cessation — « 62 ans
  # 6 mois 11 jours (âge auquel la pension est attribuée) » pour une
  # fonctionnaire née le 20 mars 1962 et admise à la retraite le 20 septembre
  # 2024, soit le 1er octobre 2024. Le modèle datant au mois, c'est ce mois-là
  # qui s'écrit ici ; lu au mois de la cessation, le décompte au trimestre
  # civil perdrait un trimestre de surcote que la caisse compte.
  - id: sre_decote_brigitte
    source: {editeur: "SRE", reference: "retraitesdeletat.gouv.fr, Actif, Le calcul de ma retraite, « La décote », exemple de Brigitte S.", verifie_le: "2026-09-24"}
    enonce: >-
      Brigitte S., sédentaire née le 20 mars 1962, admise à la retraite à
      l'âge légal, 62 ans et 6 mois, avec 163 trimestres de durée d'assurance
      pour 169 requis : 18 trimestres jusqu'à 67 ans, 6 jusqu'à la durée ; 6
      trimestres de décote à 1,25 %, soit 7,5 % de la pension.
    carriere: {naissance: "1962-03-20", sexe: F, affiliation: fonctionnaire_etat, liquidation: "2024-10", trimestres_valides: 163}
    attendu: {trimestres_requis: 169, taux_liquidation: 0.69375, motif_ouverture: age_legal}

  - id: sre_surcote_brigitte
    source: {editeur: "SRE", reference: "retraitesdeletat.gouv.fr, Actif, Le calcul de ma retraite, « La surcote », exemple de Brigitte S.", verifie_le: "2026-09-24"}
    enonce: >-
      La même, qui a ses 169 trimestres à 62 ans et 6 mois, poursuit son
      activité jusqu'à ses 64 ans, le 20 mars 2026, et totalise alors 175
      trimestres : 175 − 169 = 6 trimestres de surcote à 1,25 %, soit 7,5 %.
      La pension prend effet le 1er avril 2026.
    carriere: {naissance: "1962-03-20", sexe: F, affiliation: fonctionnaire_etat, liquidation: "2026-04", trimestres_valides: 175}
    attendu: {trimestres_requis: 169, taux_liquidation: 0.80625}

