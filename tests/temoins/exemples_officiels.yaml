    ecart_connu:
      modele: {reversions_mensuelles: {regime_general: 33.47, agirc_arrco: 420}}
      explication: >-
        C'est le simulateur qui se trompe : ses seuils sont ceux de 2024,
        2 080 fois le SMIC horaire de 11,65 €. D. 353-1-1, relu sur Légifrance
        le 4 octobre 2026, fixe le plafond à 2 080 fois le SMIC « en vigueur au
        1er janvier », et la circulaire Cnav 2025-33 du 23 décembre 2025 le
        chiffre pour 2026 à 25 001,60 € par an et 6 250,40 € par trimestre, au
        SMIC de 12,02 €. Sous ce plafond, la réversion du régime général est
        réduite à due concurrence du dépassement, non refusée : 33,47 € par
        mois, ce que le modèle sert. Le simulateur refuse donc à tort tout
        survivant seul dont les ressources annuelles tombent entre 24 232 € et
        25 001,60 €.
      fiche: reversion
      depuis: "2026-10-04"

