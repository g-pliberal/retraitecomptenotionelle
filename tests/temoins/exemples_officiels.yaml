    attendu: {dates_d_effet_de_la_reversion: {arrco: "2024-06-01"}}

  - id: aa_reversion_eric
    source: {editeur: "Agirc-Arrco", reference: "« La pension de réversion », exemple de Perla et Eric", verifie_le: "2026-09-28"}
    enonce: >-
      Perla est décédée le 9 novembre 2023. Elle percevait une retraite
