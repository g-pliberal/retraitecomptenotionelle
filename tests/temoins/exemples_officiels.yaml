  # (communication à la commission des finances de l'Assemblée nationale,
  # 22 septembre 2026, annexe n° 3, « Source : législation ») est la seule
  # table publiée de la durée requise des emplois classés, génération par
  # génération, et elle a démenti le modèle. Pour ceux que les marches de 2023
  # ne visent pas, la durée n'est pas celle de la génération de l'agent mais
  # celle de la génération qui a soixante ans l'année où son droit s'ouvre
  # (L. 13, III, du code des pensions, dans sa version de 2014 à 2023) : le
  # super-actif né en 1965 part à cinquante-deux ans en 2017, et se voit
  # opposer les 166 trimestres de la génération 1957, non les 169 de la
  # sienne. Chaque ligne ci-dessous liquide à l'âge d'ouverture, avec
  # vingt-cinq à trente ans de services classés.
