# Les réformes que déclare une fiche sans qu'une de ses versions commence à
# leur date (note de décision 0009, sixième cliquet, amendement du 19 novembre
# 2026 ; tests/test_carte.py, `test_chaque_reforme_declaree_a_sa_version_ou_dit_ou_elle_est_portee`).
#
# Chaque couple « fiche / réforme » dit sa classe :
#
#   portee        une version porte la réforme à une autre date : `version`
#                 nomme son identifiant, `texte` le texte qui dit cette date ;
#   sans_version  la réforme ne fait naître aucune version de la fiche, pour
#                 la `raison` dite ;
#   a_faire       à classer, après lecture de la fiche et du texte qu'elle cite.
#
# Un couple que la liste ne classe pas fait échouer la suite, comme une entrée
# dont le couple n'est plus à classer : déclarer une réforme dans une fiche
# oblige à dire où elle est portée. Le nombre des `a_faire` ne peut que
# baisser. Posée le 19 novembre 2026 sans lecture : tout y est `a_faire`, la
# session qui la pose n'ayant lu aucun des textes. `commentaire` dit, pour
# guider la lecture, ce que la fiche a : aucune version (la migration de la
# note 0009 la découpera), ou les débuts de ses versions la même année.

cliquet_a_faire: 87

