# Les fichiers que le relevé des chiffres sans date écarte en entier : ils ne
# portent aucune règle, et leurs nombres sont ceux d'un calcul (les fonctions
# mathématiques, la lecture d'un PDF, l'écriture des nombres, le journal). Le
# relevé des constantes datées les lit toujours, et le test échoue s'il y en
# trouve une.
fichiers_sans_regle:
  - moteur/js/format.js
  - moteur/js/journal.js
  - moteur/js/lecture-pdf.js
  - moteur/js/libm.js
