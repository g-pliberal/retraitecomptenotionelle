# Les constantes datées du moteur, classées une à une (note de décision 0009,
# cinquième cliquet ; rectificatif du 19 novembre 2026).
#
# `tests/outils_droit_date.py` les relève dans le moteur hors du site : une
# constante nommée dont la valeur porte une année ou une date (« fichier :
# NOM »), ou une année écrite en clair dans le reste du code (« fichier :
# année », avec le nombre de ses occurrences, `lignes`). Chaque entrée dit sa
# classe :
#
#   droit   du droit des retraites, à migrer dans les versions d'une fiche.
#           `fiches` nomme la ou les fiches dont le champ `code.javascript`
#           nomme déjà la constante, ce que le test vérifie ; vide, la fiche
#           reste à désigner, par l'étape qui migre la règle et lit son texte.
#   hors    n'en est pas, pour la raison dite : `impot`, `saisie`, `reglage`,
#           `projection`, `remuneration`, `technique` (le test les explique).
#
# Une constante que cette liste ne classe pas fait échouer la suite, comme
# une entrée dont la constante est partie. Le nombre des `droit` ne peut que
# baisser. Classé le 19 novembre 2026, sur le nom, la valeur et le
# commentaire de chaque constante, sans relire les textes.
constantes:
