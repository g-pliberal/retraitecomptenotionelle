# Les affirmations que le site ne rend plus : les archives du catalogue
# `data/reference/site/affirmations.yaml` (`scripts/conservation.py`,
# `ARCHIVES_DES_REGISTRES`).
#
# Une entrée du catalogue ne se retire pas : la conservation garde son
# identifiant (docs/architecture.md, § 12). Quand la phrase quitte le site, ou
# qu'aucun témoin ne peut plus la rendre, l'entrée vient ici, telle qu'elle
# était, avec la date et la raison de son départ. Le test des affirmations ne
# lit pas ce fichier : il n'exige ni que l'extrait soit dans une page, ni que
# le contrôle passe, et le contrôle qui ne servait qu'à elle s'en va. Si la
# phrase revient sur une page figée, `test_rien_n_echappe_au_catalogue` le dit,
# et l'entrée retourne au catalogue.
#
# Champs : ceux du catalogue, plus
#   retiree_le  la date du départ
#   motif       pourquoi la page ne la rend plus

affirmations:

  # LA BRANCHE « INFÉRIEUR À UN » N'A PAS ÉTÉ RENDUE du 23 septembre au
  # 7 octobre 2026 : le coefficient de la proposition passait au-dessus de un
  # en fin d'horizon, et la page écrivait la lecture mêlée, qui n'a pas de
  # phrase forte ; l'entrée était retirée. Elle revient le 7 octobre : la
  # moitié seulement des reportés en emploi (action 138, étape 3), le
  # coefficient est sous un chaque année de 2026 à 2070, 0,9997 en 2070, et
  # `test_rien_n_echappe_au_catalogue` l'a dit. Le même soir, les minima des
  # exploitants agricoles (action 138, étape 8) relèvent les pensions du
  # système actuel sur la grille, et le coefficient repasse au-dessus de un en
  # 2070 sous les réglages par défaut : 1,0007. Plutôt que de retirer l'entrée
  # une fois de plus, ce que la conservation refuse désormais, la branche a son
  # témoin, comme l'autre : `cas_types_etat_entier`, la contribution de l'État
  # portée entière au compte, sous laquelle le coefficient est sous un de 2026
  # à 2070, 0,96 en 2070. Le contrôle est celui de l'autre branche, qui éprouve
  # les trois lectures.
  - id: cas_types.facteur_inferieur_a_un
    page: /cas-types
    extrait: "Un coefficient inférieur à un est un manque"
    porte: la lecture du coefficient est calculée depuis le solde, et suit son signe
    etat: verifiee
    controle: note_du_coefficient_suit_son_signe
    retiree_le: 2026-10-11
    motif: >-
      les trois pages qui agrègent ne montrent plus que la référence depuis
      le 11 octobre 2026 (action 150), et le témoin sous d'autres règles
      qui rendait cette branche est parti avec leurs réglages ; sous la
      référence, le coefficient de la proposition passe au-dessus de un en
      2070, et la page écrit la lecture mêlée, sans phrase forte. Le code
      garde la branche : elle revient si la référence change de côté.

  # L'AUTRE BRANCHE DE LA MÊME PHRASE. Elle existait dans le code depuis que la
  # lecture suit le signe, et rien ne la rendait : sous les réglages par
  # défaut, le coefficient de la proposition est sous un partout. Il est passé
  # au-dessus sous d'autres réglages le 20 septembre 2026, quand le taux de
  # prélèvement projeté a cessé d'être gelé au bord (action 65), et la page a
  # écrit une phrase forte que le catalogue ne connaissait pas. Le contrôle est
  # le même : il éprouve les deux côtés de un, et c'est lui qui refuserait que
  # la page commente une marge par un manque.
  - id: cas_types.facteur_superieur_a_un
    page: /cas-types
    extrait: "Un coefficient supérieur à un est une marge"
    porte: la lecture du coefficient est calculée depuis le solde, et suit son signe
    etat: verifiee
    controle: note_du_coefficient_suit_son_signe
    retiree_le: 2026-10-11
    motif: >-
      les trois pages qui agrègent ne montrent plus que la référence depuis
      le 11 octobre 2026 (action 150), et le témoin sous d'autres règles
      qui rendait cette branche est parti avec leurs réglages ; sous la
      référence, le coefficient de la proposition passe au-dessus de un en
      2070, et la page écrit la lecture mêlée, sans phrase forte. Le code
      garde la branche : elle revient si la référence change de côté.

  - id: reglages.avertissement
    page: [/cas-types, /cout, /avantages]
    extrait: "Ces chiffres ne sont pas ceux des réglages par défaut."
    porte: l'avertissement paraît sous d'autres réglages, et seulement là
    etat: verifiee
    controle: avertissement_des_reglages
    retiree_le: 2026-10-11
    motif: >-
      la phrase a quitté le site le 11 octobre 2026 (action 150) : les trois
      pages qui agrègent ne se calculent plus sous les règles de l'adresse,
      et l'encadré qui la remplace dit l'inverse — « Ces chiffres sont ceux
      des réglages par défaut, pas des vôtres » —, sous une adresse réglée
      qu'aucun témoin ne fige.

  - id: simuler.fonctionnaire_assiette_fixe
    page: /simuler
    extrait: "est tenu fixe, et le site n'affiche pas de coût du travail pour votre statut."
    porte: pour un agent public, le traitement brut est tenu fixe et le coût du travail n'est pas affiché
    etat: verifiee
    controle: fonctionnaire_assiette_fixe
    retiree_le: 2026-10-13
    motif: >-
      la phrase était fausse depuis le 20 septembre 2026 : sous le partage
      retenu ce jour-là, la moitié de ce que l'État cesse de verser remonte
      dans la rémunération de l'agent, et le tableau de la fiche, juste
      au-dessus, la montrait monter. Elle ne dit plus que le refus d'afficher
      un coût du travail, sous `simuler.fonctionnaire_sans_cout_du_travail`
      (action 159, étape 8).

  - id: methode.lissage_cinq_ans
    page: /methode
    extrait: "lissage sur cinq ans"
    porte: le lissage à cinq ans absorbe le trou de 2020
    etat: verifiee
    controle: lissage_absorbe_la_loterie
    retiree_le: 2026-10-24
    motif: >-
      la phrase qui la portait, « La dernière ligne y ajoute un lissage sur
      cinq ans, comme le fait l'Italie », a quitté la page Méthode le
      24 octobre 2026 (action 173, étape 10) : elle redisait le paragraphe de
      la masse salariale, où l'Italie s'approche du PIB nominal lissé sur cinq
      ans, et le libellé de la dernière ligne du tableau. Ce que l'entrée
      portait reste sous `methode.lissage_reglage_a_part` et
      `methode.loterie_de_cohorte`, que le même contrôle tient.
