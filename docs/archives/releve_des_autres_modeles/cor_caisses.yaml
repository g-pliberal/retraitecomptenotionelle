    existants: []
    nouveaux: []
    ecarts_nouveaux: []
    conclusion: "Rien. Ariane était une méso-simulation par génération en quatre groupes (civils, militaires, La Poste, Orange), qui raisonnait sur des « individus moyens » comme les cas types du dépôt, et Pablo l'a remplacée. Son seul résultat publié, 1 535 Md€ d'engagements fin 2015 contre 1 845 pour Pablo, mesure le biais de l'individu moyen, déjà au point de Pablo."

  - id: canopee
    version: "doc. n° 11 du COR (5 mars 2020, Caisse des dépôts) ; doc. n° 7 (19 décembre 2024) ; classeur par régime du COR 2024, feuille CNRACL"
    lu_dans:
      - "https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%2011_CANOPEE_CNRACL.pdf"
      - "https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_07_SI_CNRACL.pdf"
      - "https://www.cor-retraites.fr/sites/default/files/2025-02/Données_régimes_publi_V2.xlsx (feuille CNRACL, lue par colonne)"
    existants:
      - debut: "Il projette les retraités de droit direct de la CN"
        verdict: confirme
        commentaire: "Classeur par régime, feuille CNRACL, lu colonne par colonne : 1,344 million en 2023, 1,387 en 2024, 2,133 en 2070. La pondération des retraités s'arrête toujours en 2024 et reconduit cette dernière année au-delà, alors que celle des cotisants va de 2010 à 2070 (`cout.py:2744-2750`, plus précis que `donnees/effectifs.py:39-41`)."
    nouveaux:
      - quoi: "Il sépare, à la CNRACL et grade par grade, les départs actifs, sédentaires, pour invalidité et en carrière longue. En 2018, 47 % des nouveaux retraités de la FPH partaient en catégorie active, 7 % à la FPT. À long terme, les sédentaires feraient « trois-quarts des départs » et l'invalidité 10 %. Dans le classeur du COR, l'âge moyen de départ à la CNRACL passe de 61,5 ans en 2023 à 64,3 ans en 2070. Le dépôt donne tout l'effectif de la CNRACL (1,39 million en 2024, 6 % des poids) au seul cas type de catégorie active, parti à 57 ans (`castypes.py:182-198`, pondération `castypes.py:299-337`). Il prête ainsi à toute la caisse le départ que le notionnel pénalise le plus."
        preuve: "doc. n° 11, p. 6 du PDF (« En 2018, 47 % des nouveaux liquidants de droit direct vieillesse à la FPH ont bénéficié d'un départ anticipé au titre de la catégorie active […] FPT (7 %) ») et p. 22 ; classeur par régime 2024, feuille CNRACL, bloc « Âge moyen de départ à la retraite »"
        verification: "Données de gestion de la CNRACL (recueil statistique 2018, cité au doc. n° 11) et projection de la caisse pour le COR. Un âge moyen de 61,5 ans contredit un départ unique à 57 ans."
        confronte: cout
        importance: forte
        etat: a_reprendre
        chantier: "138.3"
      - quoi: "Il fait mourir les fonctionnaires territoriaux et hospitaliers selon des tables adaptées par sexe, invalidité et catégorie hiérarchique (QRS n° 19, Soulat 2017), parce qu'ils « décèdent en moyenne plus tardivement que la moyenne nationale ». C'est le même point que misraa."
        preuve: "doc. n° 11, p. 19 du PDF"
        verification: "Méthode, sur les données de la CNRACL."
        confronte: cout
        importance: faible
        etat: a_reprendre
        chantier: "138.7"
    ecarts_nouveaux:
      - constat: "La description de 2020 suit les grilles de 2015, sans le protocole PPCR (« celles prévalant en 2015 »), et fait liquider tout le monde au taux plein, sans décote ni surcote (p. 16 et 26 du PDF)."
        tranche: "PPCR s'applique depuis 2016 (Pablo a dû l'introduire par calage : doc. n° 10, p. 11). La Caisse des dépôts annonçait les deux corrections ; la note de 2024 ne dit pas si elles sont faites. Sans effet sur ce que lit le dépôt : le classeur de 2024 est postérieur."
        preuve: "doc. n° 11, p. 16 et 26 ; doc. n° 10, p. 11"
    conclusion: "Canopée fait mieux par la composition de la CNRACL : actifs ou sédentaires, invalidité, grades, mortalité propre. Ses chiffres publiés montrent que le dépôt pèse toute la caisse sur un départ à 57 ans quand l'âge moyen y est de 61,5 ans, une erreur de pondération qui grossit les économies des scénarios notionnels."

  - id: mistral
    version: "doc. n° 7 du COR (19 décembre 2024) ; classeur par régime du COR 2024, feuille IRCANTEC"
    lu_dans:
      - "https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_07_SI_CNRACL.pdf (p. 7 du PDF)"
      - "https://www.cor-retraites.fr/sites/default/files/2025-02/Données_régimes_publi_V2.xlsx (feuille IRCANTEC)"
    existants:
      - debut: "Il projette les retraités de droit direct de l'Irc"
        verdict: a_corriger
        commentaire: "Les chiffres sont exacts (2,043 millions en 2023, 5,468 en 2070), mais ce sont des droits, pas des personnes ni des carrières. La pension relative de l'Ircantec est de 4,5 % en 2023 et 3,3 % en 2070, et son âge moyen de départ de 66,6 puis 65,5 ans (même feuille) : ce sont surtout des polypensionnés à petite pension. Les donner comme poids à `contractuel_public`, carrière complète au régime général et à l'Ircantec, multiplierait par 2,7 le double compte que `limites.md:2688-2694` déclare. La reprise doit peser par la masse (voir maquette_globale_cor)."
    nouveaux:
      - quoi: "Il évalue chaque année la solvabilité de l'Ircantec à long terme « au regard d'indicateurs définis dans le cadre de sa convention d'objectifs et de gestion (COG) et de ses textes réglementaires »."
        preuve: "doc. n° 7 du 19 décembre 2024, p. 7 du PDF"
        verification: "C'est un pilotage propre au régime ; la note ne publie pas les indicateurs."
        confronte: cout
        importance: faible
        etat: ecarte
        raison: "Le dépôt ne projette ni les régimes un à un ni leurs réserves. La solvabilité d'un régime complémentaire sort du champ de la page Coût."
    ecarts_nouveaux: []
    conclusion: "Mistral, l'outil de la Caisse des dépôts pour l'Ircantec (avec Prévir pour l'emploi des contractuels), n'est connu que par une ligne de la note de 2024 et par ses projections dans le classeur du COR. Il ne fait mieux que par ces projections, qui sont à lire comme des droits de polypensionnés."

  - id: misraa
    version: "doc. n° 12 du COR (DT 2020-08, 10 février 2020) ; doc. n° 5 (DT 2024-60, septembre 2024) ; RA 2026, p. 10, 64, 107 et données P3_2, fig. 3.3"
    lu_dans:
      - "https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%2012_Mod%C3%A8le%20Agirc-Arrco.pdf"
      - "https://www.cor-retraites.fr/sites/default/files/2024-12/Doc_05_SI_Agirc-Arrco.pdf"
      - "RA_2026_def.pdf ; Données_RA2026_P3_2.xlsx"
    existants:
      - debut: "Il projette l'Agirc-Arrco sous la convention du CO"
        verdict: a_corriger
        commentaire: "Trois corrections. (1) La convention est celle de l'Agirc-Arrco : « Ces hypothèses ont été définies par la Fédération Agirc-Arrco, après consultation des partenaires sociaux » (RA 2026, p. 10, note 2 ; p. 64). Sa révision ajoute 0,3 point de PIB à la dépense de 2070 (p. 107). (2) Les 24,6 % et 16,4 % sont la part Agirc-Arrco du taux de remplacement net du non-cadre, en part du dernier salaire (76,9 puis 68,7 % au total), calculée par TRAJECTOiRE (fig. 3.3, « Source : Drees, modèle Trajectoire »). Ce n'est pas la part complémentaire de la pension, qui vaut 32 puis 24 %. (3) Références du dépôt : le rendement figé est à `data/reference/regimes/rendements_points.csv:51` (2027-2100, 5,61 %), et la valeur de service prolongée par les prix à `droit/liquider.py:1535-1545`. `scenarios/actuel.py:2314` et `liquider.py:1448-1452` ne pointent plus là."
    nouveaux:
      - quoi: "Il pose qu'ignorer la mortalité différentielle « est susceptible de sous-estimer les dépenses » : les anciens cadres vivent plus longtemps et ont plus de droits. Il prévoyait en 2020 des tables par niveau de points au-delà du plafond, et établit depuis ses propres tables sur ses données individuelles. La page Coût fait vivre tous les cas types comme la population générale (`cout.py:2151-2152`) : la pension du cadre (2,2 salaires moyens) et celle du SMIC ont la même survie. Le dépôt a pourtant les tables de l'INSEE par vingtile de niveau de vie, qu'il n'utilise que pour le diviseur (`config.py:611-628`) et la garantie (`cout.py:2376`)."
        preuve: "doc. n° 12, p. 11 du PDF (« Le fait d'ignorer cette différence d'espérance de vie entre ces deux sous-populations, est susceptible de sous-estimer les dépenses d'allocations du régime ») ; doc. n° 5 de 2024, p. 8 du PDF (« Elles permettent entre autres, d'établir les tables de mortalité »)"
        verification: "Méthode : à nombre de décès égal, leur répartition entre fortes et faibles pensions change la masse (même doc.). Le biais est chiffré par Pablo (45 Md€ d'engagements, 2,2 Md€ de pensions en 2034) et traité par Prisme et Canopée. Les tables par vingtile (Insee Résultats 2025) sont déjà au dépôt (`limites.md:438`)."
        confronte: cout
        importance: moyenne
        etat: a_reprendre
        chantier: "138.7"
    ecarts_nouveaux: []
    conclusion: "MisrAA fait mieux par la mortalité différentielle, qui manque aux masses du Coût, et par la seule trajectoire publiée de la valeur du point (déjà en a_trancher). Le point existant est à corriger sur l'auteur de la convention, la nature des 24,6 et 16,4 %, et les lignes du dépôt citées."

  - id: osiris
    version: "caliper.pdf (DREES, 2013) ; étude d'impact du projet de loi instituant un système universel de retraite (24 janvier 2020, AN n° 2623)"
    lu_dans:
      - "http://gesd.free.fr/caliper.pdf"
      - "https://www.assemblee-nationale.fr/dyn/15/textes/l15b2623_etude-impact.pdf (p. 128, 202-207 du PDF)"
      - "recherches web « maquette Osiris » et PLFSS 2026 : aucun autre usage publié"
    existants: []
    nouveaux:
      - quoi: "Ses cas types comprennent une carrière heurtée : un non-cadre du tiers inférieur des salaires perd son emploi à 42 ans, touche l'ARE deux ans puis l'ASS deux ans, reste un an et demi au chômage non indemnisé, puis est inactif jusqu'au départ. Aucun des 13 cas types du dépôt ne connaît le chômage (`avantages.py:38`), alors que le chômage est le premier poste de solidarité (5,9 % des masses, Cnav 2019) et que le droit l'applique désormais (action 141)."
        preuve: "étude d'impact de 2020, p. 202 du PDF (définition) et p. 207 (tableau 51), « Source : DSS/SDEPF/6C – maquette Osiris »"
        verification: "Méthode : c'est une carrière type proche de celles du COR."
        confronte: cout
        importance: moyenne
        etat: a_reprendre
        chantier: "nouveau: une carrière heurtée (chômage ARE, ASS, non indemnisé) dans la grille des cas types"
      - quoi: "Il présente chaque cas type à six âges de départ (62 à 67 ans) pour les générations 1975, 1980, 1990 et 2003."
        preuve: "étude d'impact de 2020, p. 207 du PDF (tableau 51)"
        verification: "Méthode."
        confronte: site
        importance: faible
        etat: a_reprendre
        chantier: "138.10"
    ecarts_nouveaux:
      - constat: "Ses résultats « sans réforme » de 2020 font partir les générations 1975 à 2003 dès 62 ou 63 ans. Exemple : 80 % du SMIC, génération 1980, taux de remplacement net de 65 % à 63 ans (tableau 11, p. 128)."
        tranche: "L'âge d'ouverture est de 64 ans pour les assurés nés à compter du 1er janvier 1969 (L. 161-17-2, LEGIARTI000053280889, en vigueur depuis le 31 décembre 2025, pensions prenant effet depuis le 1er septembre 2026). Ces résultats sont périmés et ne sont plus des témoins du scénario 1."
        preuve: "étude d'impact de 2020, p. 128 et 207 ; index LEGI, L. 161-17-2"
    conclusion: "Osiris, maquette interne de la DSS, ne publie que ses cas types de 2020, calculés sous un droit périmé. Il n'en reste que la forme de deux de ses cas types : une carrière heurtée par le chômage, que la grille du dépôt n'a pas, et une plage d'âges."

  - id: aphrodite
    version: "doc. n° 6 du COR (5 mars 2020, extraits du DT DG Trésor 2016/04) ; DT DG Trésor 2016/04 (juillet 2016)"
    lu_dans:
      - "https://www.cor-retraites.fr/sites/default/files/2020-03/Doc%206_Aphrodite_DG-Tr%C3%A9sor.pdf"
      - "https://www.tresor.economie.gouv.fr/Articles/482ec69f-5251-4129-98b2-f4dfaccfb81e/files/5ad8638a-a272-4e14-8823-54a245de9606"
    existants: []
    nouveaux:
      - quoi: "Il simule les fins de carrière après 55 ans (emploi, chômage, inactivité, maladie) par des logits emboîtés estimés sur l'EIC 2009, et peut y ajouter un effet horizon. Avec un décalage de deux ans, le taux d'emploi gagne 2 points entre 57 et 66 ans en 2040, et passe de 44 à 48 % à 62 ans. Dans son échantillon, 22 % des femmes et 12 % des hommes du privé sont déjà inactifs à 55 ans. Le dépôt suppose en emploi tous ceux que l'âge légal fait attendre (`config.py:863`)."
        preuve: "doc. n° 6, p. 4-7, et annexe p. 12-15 du PDF (tableaux 1 et 2, graphique 6)"
        verification: "Méthode, sur données administratives. L'effet horizon y est « conventionnel » (note 9), pas estimé : les valeurs à retenir sont plutôt celles de l'enquête Emploi (maquette_globale_cor) et de la convention du COR (simulateur_cor)."
        confronte: cout
        importance: moyenne
        etat: a_reprendre
        chantier: "138.3"
      - quoi: "Il calcule la réversion sur quatre mariages successifs, avec les conditions de ressources, de non-remariage et de durée de mariage. Il traite le partage entre ex-conjoints et calcule une pension fictive pour l'assuré mort avant d'avoir liquidé. Le dépôt laisse dehors le partage, le remariage et la réversion d'un assuré mort avant son départ (`limites.md:79-82`)."
        preuve: "doc. n° 6, p. 9-10 du PDF"
        verification: "L. 353-3 (LEGIARTI000006742651, en vigueur depuis le 22 août 2003) : partage « au prorata de la durée respective de chaque mariage ». L'étape 4 de l'action 138 le prévoit déjà."
        confronte: scenario_1
        importance: moyenne
        etat: a_reprendre
        chantier: "138.4"
      - quoi: "Il se boucle avec Mésange : réforme simulée, effets sur l'emploi, les salaires et les prix, réinjectés jusqu'à convergence. Le dépôt est comptable (`limites.md:2968-2972`) ; voir le tableau 2.10 du COR, au point de maquette_globale_cor."
        preuve: "DT 2016/04, § 4.4, p. 44-45 du PDF"
        verification: "Méthode ; les multiplicateurs publiés par le COR en 2026 en viennent en partie (DG Trésor, Mésange)."
        confronte: cout
        importance: moyenne
        etat: a_trancher
        raison: "C'est le même choix que pour le tableau 2.10 : le bouclage est déclaré hors du dépôt, et le propriétaire tranche."
      - quoi: "Il projette au choix sous les projections de l'INSEE ou sous les scénarios démographiques de l'Ageing Working Group. Le dépôt n'a que le scénario central de l'INSEE (`limites.md:2815-2817`)."
        preuve: "doc. n° 6, p. 4 du PDF"
        verification: "Méthode ; variantes publiées par l'INSEE et la Commission européenne."
        confronte: cout
        importance: faible
        etat: a_reprendre
        chantier: "138.7"
      - quoi: "Il propose plusieurs comportements de départ (taux plein, taux de remplacement cible, Stock et Wise), mais écrit que les dépenses projetées sont « assez proches », le système étant « actuariellement neutre à la marge »."
        preuve: "DT 2016/04, p. 29 du PDF"
        verification: "Méthode."
        confronte: cout
        importance: faible
        etat: ecarte
        raison: "Pas meilleur pour la dépense, de son propre aveu. Le dépôt fait déjà partir ses cas types au taux plein de leur génération (`castypes.py:84`)."
    ecarts_nouveaux:
      - constat: "Ses résultats publiés reposent sur la législation de 2016 et le scénario B du COR de 2015 (productivité 1,5 %) : dépenses de droit direct de 12,4 % du PIB en 2015 à 11,3 % en 2060. Son cas d'usage crédite l'accord Agirc-Arrco de 2015 de 0,3 point de PIB, dont environ 100 000 actifs de plus en 2025 grâce aux coefficients de solidarité."
        tranche: "Le coefficient de solidarité est supprimé pour les retraites prenant effet depuis le 1er décembre 2023, et pour toutes depuis le 1er avril 2024 (RA 2026, p. 136). Le COR projette aujourd'hui une productivité de 0,7 %. Ces résultats sont périmés."
        preuve: "doc. n° 6, p. 10-11 ; DT 2016/04, p. 34 ; RA 2026, p. 136"
    conclusion: "Aphrodite fait mieux par ses fins de carrière et sa réversion complète (ex-conjoints, décès avant le départ), deux points déjà prévus par les étapes 3 et 4, et par son bouclage avec Mésange. Ses résultats chiffrés, de 2016, ne se confrontent plus ; son usage après 2020 n'est pas publié."
