# Le rapport de la recherche « openfisca » (OpenFisca-France, OpenFisca-France-Pension, LexImpact, TAXIPP), le 4 octobre 2026,
# tel qu'elle l'a rendu, AVANT son intégration au registre. Un récit, gelé :
# le registre (data/reference/referents.yaml) fait foi, et dit l'étape de chaque
# point. Voir docs/archives/releve_des_autres_modeles.md.

groupe: openfisca
depot_lu_au_commit: "714ad0c (4 octobre 2026), en lecture seule ; montants du dépôt recalculés par ses propres classes (MinimumContributif, MinimumVieillesse), sans écriture"
modeles:
  - id: openfisca_france_pension
    version: "1c45423 (0.1.3, 13 mai 2026)"
