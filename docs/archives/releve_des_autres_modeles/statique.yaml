    corrections_registre:
      - "code et documentation : les règles pays ne sont pas dans le dépôt du logiciel. Elles sont dans le paquet du modèle (J2.54+, téléchargeable sans inscription, CC BY 4.0 selon le fichier de licence), dans XMLParam/Countries/FR/FR.xml, systèmes FR_2006 à FR_2026."
      - "couvre : ajouter l'impôt des pensions (abattement de 10 %, abattement des 65 ans et plus). L'ASPA n'est servie qu'aux allocataires observés dans EU-SILC."
    conclusion: "EUROMOD fait mieux que le dépôt sur le net des pensions : CSG et CASA graduées par RFR et parts au barème exact de 2026, recopiable sous CC BY 4.0, et l'ASPA hors des prélèvements. Il fait mieux aussi sur l'impôt des pensions. Il ne simule aucune pension, faute d'historique de carrière ; il sert l'ASPA plus mal que la loi et prélève la CRDS sur toutes les pensions : on lui reprend ses seuils, pas ses assiettes. Son outil de ménages types (HHoT) peut confronter à part le net d'un couple de retraités une fois 138.2 fait."
