      - "inst/extdata/{aod,aad,ageMaximum,dureeRequise,dureeProratisation,revalo}.csv ; inst/extdata/drees/eacr/*.parquet (lus par pyarrow) et millesime.csv ; R/aod.R"
    existants:
      - debut: "Il embarque les tables de l'EACR, dont la répartit"
        verdict: a_corriger
        commentaire: "Toujours vrai, toujours absent du dépôt (pages.js:10836-10839). Corriger l'année : la table porte annee = 2024, source « Ancetre 2024 », non « fin 2023 » ; la donnée est d'ANCETRE, que legiretraite redistribue (voir ancetre)."
    nouveaux:
      - quoi: "Il embarque, prêtes à lire, les autres tables de l'EACR du 26 mai 2026 : E, les minima (bénéficiaires du minimum contributif, du minimum garanti, de la PMR) ; H, les conditions de liquidation (taux plein, décote, surcote, par motif, en flux et en stock) ; B, les liquidants par âge, durée et motif ; C, les droits directs par âge ; et les coefficients Agirc-Arrco de 2019 à 2023 (solidarité à 10 et 5 %, majorants, exemptés). Le dépôt ne lit de l'EACR que la feuille A-Cadrage et l'âge conjoncturel (scripts/fetch/drees_eacr.py:6-35)."
        preuve: "inst/extdata/drees/eacr/{e-minima,h-conditions-liquidation,b-liquidants,c-droits-directs,coefficients-agirc-arrco}.parquet et millesime.csv, au commit 98d2cbb"
        verification: "Méthode : comptages exhaustifs des caisses, cibles de contrôle pour la page Coût (part des liquidants au minimum, décotés, surcotés) et pour les coefficients temporaires ; ils se lisent aussi à la source, classeur « 62 EACR diffusée » du 26 mai 2026 sur data.drees."
        confronte: cout
        importance: moyenne
        etat: a_reprendre
        chantier: "138.3"
    ecarts_nouveaux: []
    conclusion: "Ses paramètres de législation ne valent pas mieux que les séries certifiées du dépôt, et les trois écarts du registre tiennent au même commit (dureeRequise.csv:136-137, aod.csv:31, 33, 85, 87). Ses âges sont à jour de la loi du 30 décembre 2025, ses durées en sont restées à la loi de 2023, ses revalorisations vont jusqu'en janvier 2026. Son apport est l'EACR de mai 2026 mise en tables, que le dépôt ne lit qu'en partie."
